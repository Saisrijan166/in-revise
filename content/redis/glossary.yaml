terms:
  - id: redis-term
    term: Redis
    aka:
      - REmote DIctionary Server
    definition: "An in-memory data structure server: keys map to typed values held in RAM."
    see: what-is-redis
    source:
      title: Redis FAQ (redis.io)
      url: https://redis.io/docs/latest/develop/get-started/faq/
      verifiedOn: 2026-10-20
  - id: in-memory-data-store
    term: In-memory data store
    aka:
      - in-memory database
      - in-memory store
    definition: A store that serves all its data from RAM and uses disk only for copies.
    see: what-is-redis
    source:
      title: Redis FAQ (redis.io)
      url: https://redis.io/docs/latest/develop/get-started/faq/
      verifiedOn: 2026-10-20
  - id: key-value-store
    term: Key-value store
    aka:
      - key-value database
    definition: A store where each value is saved and fetched by a unique key.
    see: what-is-redis
    source:
      title: Keys and values (redis.io)
      url: https://redis.io/docs/latest/develop/using-commands/keyspace/
      verifiedOn: 2026-10-20
  - id: data-structure-server
    term: Data structure server
    aka:
      - data structure store
    definition: "How Redis describes itself: values are data structures with their own atomic commands, not opaque blobs."
    see: what-is-redis
    source:
      title: Redis README (Redis 8.10.2, GitHub)
      url: https://github.com/redis/redis/blob/8.10.2/README.md
      verifiedOn: 2026-10-20
  - id: redis-event-loop
    term: Event loop (Redis)
    aka:
      - event loop
      - I/O multiplexing
    definition: One thread that watches many client sockets and serves each ready request in turn.
    see: what-is-redis
    source:
      title: Diagnosing latency issues (redis.io)
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/latency/
      verifiedOn: 2026-10-20
  - id: single-threaded-execution
    term: Single-threaded execution
    aka:
      - single-threaded
      - mostly single threaded
    definition: Redis runs all commands on one main thread, one at a time; helper threads do side work.
    see: what-is-redis
    source:
      title: Diagnosing latency issues (redis.io)
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/latency/
      verifiedOn: 2026-10-20
  - id: redis-io-threads-term
    term: I/O threads (Redis)
    aka:
      - io-threads
      - threaded I/O
    definition: Optional threads that read, parse and write client sockets; commands still run on the main thread.
    see: what-is-redis
    source:
      title: redis.conf, THREADED I/O (Redis 8.10.2)
      url: https://github.com/redis/redis/blob/8.10.2/redis.conf
      verifiedOn: 2026-10-20
  - id: source-of-truth
    term: Source of truth
    aka:
      - system of record
    definition: The one store whose copy of the data counts as correct; caches only copy from it.
    see: redis-and-databases
    source:
      title: Cache-Aside pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
      verifiedOn: 2026-10-20
  - id: memcached-term
    term: Memcached
    definition: A multi-threaded, in-memory key-value cache for small opaque values, LRU by default, with no replication.
    see: redis-and-memcached
    source:
      title: Memcached documentation
      url: https://docs.memcached.org/
      verifiedOn: 2026-10-20
  - id: keyspace
    term: Keyspace
    aka:
      - key space
    definition: All the keys in one Redis database; it is flat, with no namespaces.
    see: key-design
    source:
      title: Keys and values (redis.io)
      url: https://redis.io/docs/latest/develop/using-commands/keyspace/
      verifiedOn: 2026-10-20
  - id: key-naming-convention-term
    term: Key naming convention
    aka:
      - key schema
      - key naming
    definition: Naming keys object-type:id:field with colons, such as payment:PAY101:attempts.
    see: key-design
    source:
      title: Keys and values (redis.io)
      url: https://redis.io/docs/latest/develop/using-commands/keyspace/
      verifiedOn: 2026-10-20
  - id: scan-command
    term: SCAN (command)
    aka:
      - SCAN command
      - SSCAN
      - HSCAN
      - ZSCAN
    definition: Walks keys a few at a time with a cursor, so it does not block the server.
    see: key-design
    source:
      title: SCAN (redis.io)
      url: https://redis.io/docs/latest/commands/scan/
      verifiedOn: 2026-10-20
  - id: keys-command-term
    term: KEYS (command)
    aka:
      - KEYS command
      - KEYS *
    definition: Returns every key matching a pattern in one O(N) call; blocks the server, so debugging only.
    see: key-design
    source:
      title: KEYS (redis.io)
      url: https://redis.io/docs/latest/commands/keys/
      verifiedOn: 2026-10-20
  - id: scan-cursor
    term: Cursor (SCAN)
    aka:
      - SCAN cursor
    definition: The number SCAN returns for the next call; 0 means the walk is complete.
    see: key-design
    source:
      title: SCAN (redis.io)
      url: https://redis.io/docs/latest/commands/scan/
      verifiedOn: 2026-10-20
  - id: valkey
    term: Valkey
    definition: The Linux Foundation's BSD-licensed fork of Redis 7.2.4, started in March 2024.
    see: redis-licensing-and-forks
    source:
      title: Linux Foundation launches open source Valkey community
      url: https://www.linuxfoundation.org/press/linux-foundation-launches-open-source-valkey-community
      verifiedOn: 2026-10-20
  - id: redis-open-source
    term: Redis Open Source
    aka:
      - Redis Community Edition
    definition: The free Redis server; Redis 8.0 renamed Community Edition to this and merged Redis Stack into it.
    see: redis-licensing-and-forks
    source:
      title: What's new in Redis 8.0 (redis.io)
      url: https://redis.io/docs/latest/develop/whats-new/8-0/
      verifiedOn: 2026-10-20
  - id: rsalv2
    term: RSALv2
    aka:
      - Redis Source Available License
    definition: "Redis Source Available License v2: a permissive licence by Redis Ltd. that is not open source."
    see: redis-licensing-and-forks
    source:
      title: Redis licensing (redis.io)
      url: https://redis.io/legal/licenses/
      verifiedOn: 2026-10-20
  - id: ssplv1
    term: SSPLv1
    aka:
      - Server Side Public License
    definition: "Server Side Public License v1: a source-available licence by MongoDB, not open source."
    see: redis-licensing-and-forks
    source:
      title: Redis licensing (redis.io)
      url: https://redis.io/legal/licenses/
      verifiedOn: 2026-10-20
  - id: agplv3
    term: AGPLv3
    aka:
      - GNU Affero General Public License
    definition: An OSI-approved open source licence; one of three Redis Open Source choices since 8.0.
    see: redis-licensing-and-forks
    source:
      title: Redis licensing (redis.io)
      url: https://redis.io/legal/licenses/
      verifiedOn: 2026-10-20
  - id: redis-stack
    term: Redis Stack
    definition: The old bundle of Redis plus modules such as JSON and search; merged into Redis Open Source 8.0.
    see: redis-licensing-and-forks
    source:
      title: What's new in Redis 8.0 (redis.io)
      url: https://redis.io/docs/latest/develop/whats-new/8-0/
      verifiedOn: 2026-10-20
  - id: amazon-elasticache
    term: Amazon ElastiCache
    aka:
      - ElastiCache
    definition: AWS managed in-memory cache running Valkey, Redis OSS or Memcached, serverless or node-based.
    see: redis-licensing-and-forks
    source:
      title: What is Amazon ElastiCache? (AWS docs)
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
      verifiedOn: 2026-10-20
  - id: amazon-memorydb
    term: Amazon MemoryDB
    aka:
      - MemoryDB
    definition: AWS durable in-memory database, Valkey and Redis OSS compatible, with a Multi-AZ transaction log.
    see: redis-licensing-and-forks
    source:
      title: What is MemoryDB (AWS docs)
      url: https://docs.aws.amazon.com/memorydb/latest/devguide/what-is-memorydb.html
      verifiedOn: 2026-10-20
  - id: redis-cli
    term: redis-cli
    definition: The Redis command-line client; connects to 127.0.0.1:6379 by default.
    source:
      title: Redis CLI (redis.io)
      url: https://redis.io/docs/latest/develop/tools/cli/
      verifiedOn: 2026-10-20
  - id: resp
    term: RESP (Redis serialisation protocol)
    aka:
      - RESP
      - RESP2
      - RESP3
      - Redis serialization protocol
    definition: The simple, binary-safe request-reply protocol Redis clients speak over TCP; RESP3 since Redis 6.0.
    source:
      title: Redis serialization protocol specification (redis.io)
      url: https://redis.io/docs/latest/develop/reference/protocol-spec/
      verifiedOn: 2026-10-20
  - id: redis-string-term
    term: String (Redis)
    aka:
      - Redis string
      - Redis strings
    definition: "The basic Redis value: a binary-safe sequence of bytes, up to 512 MB by default."
    see: strings
    source:
      title: Redis strings (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/strings/
      verifiedOn: 2026-10-20
  - id: binary-safe
    term: Binary-safe
    aka: []
    definition: Stored as raw bytes with no encoding rules, so any data, even an image, can be a value.
    see: strings
    source:
      title: Redis strings (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/strings/
      verifiedOn: 2026-10-20
  - id: redis-hash-term
    term: Hash (Redis)
    aka:
      - Redis hash
      - Redis hashes
    definition: A Redis value made of field-value pairs under one key, like a small map or object.
    see: hashes
    source:
      title: Redis hashes (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/hashes/
      verifiedOn: 2026-10-20
  - id: hash-field
    term: Hash field
    aka:
      - hash fields
    definition: One name inside a Redis hash, mapped to its own string value; since Redis 7.4 it can have a TTL.
    see: hashes
    source:
      title: Redis hashes (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/hashes/
      verifiedOn: 2026-10-20
  - id: redis-list-term
    term: List (Redis)
    aka:
      - Redis list
      - Redis lists
    definition: A Redis sequence of strings in insertion order, with fast push and pop at both ends.
    see: lists
    source:
      title: Redis lists (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/lists/
      verifiedOn: 2026-10-20
  - id: blocking-pop
    term: Blocking pop
    aka:
      - BLPOP
      - BRPOP
      - blocking pops
    definition: A pop that waits until an element arrives or a timeout passes, instead of polling.
    see: lists
    source:
      title: BLPOP command (Redis docs)
      url: https://redis.io/docs/latest/commands/blpop/
      verifiedOn: 2026-10-20
  - id: redis-set-term
    term: Set (Redis)
    aka:
      - Redis set
      - Redis sets
    definition: An unordered collection of unique strings with constant-time add, remove and membership checks.
    see: sets
    source:
      title: Redis sets (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/sets/
      verifiedOn: 2026-10-20
  - id: cardinality
    term: Cardinality
    aka: []
    definition: The number of distinct members in a set; SCARD returns it exactly, PFCOUNT estimates it.
    see: sets
    source:
      title: HyperLogLog (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/probabilistic/hyperloglogs/
      verifiedOn: 2026-10-20
  - id: sorted-set-term
    term: Sorted set
    aka:
      - sorted sets
      - ZSET
    definition: Unique strings, each with a floating-point score, kept in score order.
    see: sorted-sets
    source:
      title: Redis sorted sets (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/sorted-sets/
      verifiedOn: 2026-10-20
  - id: leaderboard
    term: Leaderboard
    aka:
      - leaderboards
    definition: A ranking by score, usually a sorted set read with ZRANGE ... REV and ZREVRANK.
    see: sorted-sets
    source:
      title: Redis sorted sets (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/sorted-sets/
      verifiedOn: 2026-10-20
  - id: redis-stream-term
    term: Stream (Redis)
    aka:
      - Redis stream
      - Redis streams
      - Redis Streams
    definition: An append-only log of entries, each a set of field-value pairs with a unique ID.
    see: streams
    source:
      title: Redis Streams (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/streams/
      verifiedOn: 2026-10-20
  - id: stream-entry-id
    term: Entry ID
    aka:
      - stream ID
      - stream entry ID
    definition: A stream entry's ID, <milliseconds>-<sequence>; each new ID is greater than the last.
    see: streams
    source:
      title: Redis Streams (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/streams/
      verifiedOn: 2026-10-20
  - id: consumer-group-term
    term: Consumer group
    aka:
      - consumer groups
    definition: Named reader state on a stream that gives each entry to one of its consumers and tracks acks.
    see: streams
    source:
      title: Redis Streams (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/streams/
      verifiedOn: 2026-10-20
  - id: pending-entries-list
    term: Pending entries list
    aka:
      - PEL
    definition: A consumer group's list of entries delivered to a consumer but not yet acknowledged.
    see: streams
    source:
      title: Redis Streams (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/streams/
      verifiedOn: 2026-10-20
  - id: xack-term
    term: XACK
    aka: []
    definition: The command that marks stream entries as processed, removing them from the pending entries list.
    see: streams
    source:
      title: Redis Streams (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/streams/
      verifiedOn: 2026-10-20
  - id: bitmap-term
    term: Bitmap (Redis)
    aka:
      - Redis bitmap
      - Redis bitmaps
    definition: "Not a separate type: bit operations such as SETBIT and BITCOUNT on a string value."
    see: bitmaps-hyperloglog
    source:
      title: Redis bitmaps (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/strings/bitmaps/
      verifiedOn: 2026-10-20
  - id: bitfield-term
    term: Bitfield
    aka:
      - bitfields
      - BITFIELD
    definition: Integers of a chosen bit width packed into one string, read and changed atomically with BITFIELD.
    see: bitmaps-hyperloglog
    source:
      title: Redis bitfields (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/strings/bitfields/
      verifiedOn: 2026-10-20
  - id: hyperloglog-term
    term: HyperLogLog
    aka:
      - HLL
    definition: A probabilistic structure that estimates distinct counts in at most 12 KB, with 0.81% standard error.
    see: bitmaps-hyperloglog
    source:
      title: HyperLogLog (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/probabilistic/hyperloglogs/
      verifiedOn: 2026-10-20
  - id: geohash-term
    term: Geohash
    aka: []
    definition: Longitude and latitude bits interleaved into one 52-bit integer, used by Redis as a sorted-set score.
    see: geospatial
    source:
      title: GEOADD command (Redis docs)
      url: https://redis.io/docs/latest/commands/geoadd/
      verifiedOn: 2026-10-20
  - id: redis-json-term
    term: Redis JSON
    aka:
      - RedisJSON
      - JSON data type
    definition: "The JSON data type, built into Redis 8: nested documents you read and update by path."
    see: json-and-query-engine
    source:
      title: JSON (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/json/
      verifiedOn: 2026-10-20
  - id: jsonpath-term
    term: JSONPath
    aka: []
    definition: A path syntax such as $.customer.id that selects parts of a JSON document.
    see: json-and-query-engine
    source:
      title: JSON (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/json/
      verifiedOn: 2026-10-20
  - id: redis-search-term
    term: Redis Search
    aka:
      - Redis Query Engine
      - RediSearch
    definition: "Indexing and querying for hashes and JSON in Redis 8: field filters, full-text, geo and vector search."
    see: json-and-query-engine
    source:
      title: Redis Search (Redis docs)
      url: https://redis.io/docs/latest/develop/ai/search-and-query/
      verifiedOn: 2026-10-20
  - id: secondary-index-term
    term: Secondary index
    aka:
      - secondary indexes
      - secondary indexing
    definition: An index that finds records by a field value instead of the key; natively Redis has key access only.
    see: json-and-query-engine
    source:
      title: Secondary indexing (Redis docs)
      url: https://redis.io/docs/latest/develop/clients/patterns/indexes/
      verifiedOn: 2026-10-20
  - id: redis-time-series-term
    term: Time series (Redis)
    aka:
      - Redis time series
      - RedisTimeSeries
    definition: A Redis 8 type for timestamped numbers with range queries, aggregation and a retention period.
    see: json-and-query-engine
    source:
      title: Redis time series (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/timeseries/
      verifiedOn: 2026-10-20
  - id: bloom-filter-term
    term: Bloom filter
    aka:
      - Bloom filters
    definition: "A small probabilistic set: 'not present' is certain, 'present' may be a false positive."
    see: json-and-query-engine
    source:
      title: Bloom filter (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/probabilistic/bloom-filter/
      verifiedOn: 2026-10-20
  - id: count-min-sketch-term
    term: Count-min sketch
    aka: []
    definition: A probabilistic structure that estimates how often a value appears in a stream of values.
    see: json-and-query-engine
    source:
      title: Redis data types (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/
      verifiedOn: 2026-10-20
  - id: vector-set-term
    term: Vector set
    aka:
      - vector sets
    definition: A Redis 8 type like a sorted set, but each member has a vector for similarity search.
    see: json-and-query-engine
    source:
      title: Redis vector sets (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/vector-sets/
      verifiedOn: 2026-10-20
  - id: pub-sub-term
    term: Pub/Sub
    aka:
      - publish/subscribe
    definition: Redis messaging where PUBLISH sends to all current subscribers of a channel, with no stored history.
    see: pub-sub
    source:
      title: Redis Pub/Sub (Redis docs)
      url: https://redis.io/docs/latest/develop/pubsub/
      verifiedOn: 2026-10-20
  - id: sharded-pub-sub-term
    term: Sharded Pub/Sub
    aka:
      - SPUBLISH
      - SSUBSCRIBE
    definition: "Redis 7.0+ Pub/Sub for Cluster: channels map to hash slots, so messages stay inside one shard."
    see: pub-sub
    source:
      title: Redis Pub/Sub (Redis docs)
      url: https://redis.io/docs/latest/develop/pubsub/
      verifiedOn: 2026-10-20
  - id: keyspace-notifications-term
    term: Keyspace notifications
    aka:
      - keyspace events
    definition: Pub/Sub events Redis publishes when keys change or expire; off by default.
    see: pub-sub
    source:
      title: Redis keyspace notifications (Redis docs)
      url: https://redis.io/docs/latest/develop/pubsub/keyspace-notifications/
      verifiedOn: 2026-10-20
  - id: cache-redis-term
    term: Cache (Redis)
    aka:
      - Redis cache
    definition: A copy of slow-to-fetch data kept in Redis memory, so repeated reads skip the database.
    see: cache-aside
    source:
      title: Cache-Aside pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
      verifiedOn: 2026-10-20
  - id: cache-hit-term
    term: Cache hit
    aka: []
    definition: The requested key is in the cache and not expired, so the value returns without the database.
    see: cache-aside
    source:
      title: Caching strategies (Amazon ElastiCache docs)
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
      verifiedOn: 2026-10-20
  - id: cache-miss-term
    term: Cache miss
    aka: []
    definition: The key is missing or expired, so the app must fetch the data from the database.
    see: cache-aside
    source:
      title: Caching strategies (Amazon ElastiCache docs)
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
      verifiedOn: 2026-10-20
  - id: cache-hit-ratio-term
    term: Cache hit ratio
    aka:
      - hit ratio
    definition: Hits divided by hits plus misses; closer to 1 means the cache is more effective.
    see: cache-aside
    source:
      title: "Metrics for Valkey and Redis OSS: CacheHitRate (Amazon ElastiCache docs)"
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheMetrics.Redis.html
      verifiedOn: 2026-10-20
  - id: cache-aside-term
    term: Cache-aside
    aka:
      - lazy loading
    definition: The app checks the cache, loads the database on a miss and stores the result in the cache.
    see: cache-aside
    source:
      title: Cache-Aside pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
      verifiedOn: 2026-10-20
  - id: read-through-term
    term: Read-through
    aka: []
    definition: The cache layer itself loads a missing entry from the database, instead of the app.
    see: caching-strategies
    source:
      title: Caching Data Sources (Oracle Coherence 14.1.1)
      url: https://docs.oracle.com/en/middleware/standalone/coherence/14.1.1.2206/develop-applications/caching-data-sources.html
      verifiedOn: 2026-10-20
  - id: write-through-term
    term: Write-through
    aka: []
    definition: Each write updates both the cache and the database before it returns.
    see: caching-strategies
    source:
      title: Caching strategies (Amazon ElastiCache docs)
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
      verifiedOn: 2026-10-20
  - id: write-behind-term
    term: Write-behind
    aka:
      - write-back
    definition: Writes go to the cache first; the database is updated later, asynchronously.
    see: caching-strategies
    source:
      title: Caching Data Sources (Oracle Coherence 14.1.1)
      url: https://docs.oracle.com/en/middleware/standalone/coherence/14.1.1.2206/develop-applications/caching-data-sources.html
      verifiedOn: 2026-10-20
  - id: refresh-ahead-term
    term: Refresh-ahead
    aka: []
    definition: Reloading recently used cache entries in the background before they expire.
    see: caching-strategies
    source:
      title: Caching Data Sources (Oracle Coherence 14.1.1)
      url: https://docs.oracle.com/en/middleware/standalone/coherence/14.1.1.2206/develop-applications/caching-data-sources.html
      verifiedOn: 2026-10-20
  - id: cache-invalidation-term
    term: Cache invalidation
    aka: []
    definition: Removing or refreshing a cached copy after the source data changes.
    see: cache-invalidation
    source:
      title: Cache-Aside pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
      verifiedOn: 2026-10-20
  - id: stale-data-term
    term: Stale data
    aka: []
    definition: A cached value that no longer matches the database, the source of truth.
    see: cache-invalidation
    source:
      title: Cache-Aside pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
      verifiedOn: 2026-10-20
  - id: change-data-capture-term
    term: Change data capture
    aka:
      - CDC
    definition: Reading committed changes from the database's log and passing them on, for example to Redis.
    see: cache-invalidation
    source:
      title: Redis Data Integration (Redis docs)
      url: https://redis.io/docs/latest/integrate/redis-data-integration/
      verifiedOn: 2026-10-20
  - id: cache-warming-term
    term: Cache warming
    aka:
      - prewarming
      - cache priming
    definition: Filling a cache with likely-needed data before it starts serving traffic.
    see: cache-problems
    source:
      title: Caching best practices (AWS)
      url: https://aws.amazon.com/caching/best-practices/
      verifiedOn: 2026-10-20
  - id: cache-stampede-term
    term: Cache stampede
    aka:
      - thundering herd
      - dog piling
      - dogpile
    definition: Many requests miss one expired, popular key at once and all recompute it from the database.
    see: cache-problems
    source:
      title: Optimal Probabilistic Cache Stampede Prevention (VLDB 2015)
      url: https://www.vldb.org/pvldb/vol8/p886-vattani.pdf
      verifiedOn: 2026-10-20
  - id: request-coalescing-term
    term: Request coalescing
    aka: []
    definition: Concurrent misses for the same item wait while one request fetches it; the result serves them all.
    see: cache-problems
    source:
      title: Why Varnish? Request coalescing (Varnish Software docs)
      url: https://docs.varnish-software.com/book/cdn/why-varnish/
      verifiedOn: 2026-10-20
  - id: ttl-jitter-term
    term: TTL jitter
    aka: []
    definition: A random offset added to each TTL, so keys cached together do not expire together.
    see: cache-problems
    source:
      title: Caching best practices (AWS)
      url: https://aws.amazon.com/caching/best-practices/
      verifiedOn: 2026-10-20
  - id: cache-penetration-term
    term: Cache penetration
    aka: []
    definition: Repeated lookups for keys that never existed, so every one misses the cache and reaches the database.
    see: cache-problems
    source:
      title: ElastiCache Well-Architected Lens, Performance Efficiency (AWS)
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/PerformanceEfficiencyPillar.html
      verifiedOn: 2026-10-20
  - id: negative-caching-term
    term: Negative caching
    aka: []
    definition: Caching the fact that something does not exist, for a short time.
    see: cache-problems
    source:
      title: Negative Caching of DNS Queries (RFC 2308)
      url: https://www.rfc-editor.org/rfc/rfc2308
      verifiedOn: 2026-10-20
  - id: cache-avalanche-term
    term: Cache avalanche
    aka: []
    definition: Many keys expire in the same window, or a cache node starts empty, and misses flood the database.
    see: cache-problems
    source:
      title: Caching best practices (AWS)
      url: https://aws.amazon.com/caching/best-practices/
      verifiedOn: 2026-10-20
  - id: hot-key-term
    term: Hot key
    aka: []
    definition: A key that gets a large share of requests, overloading the one node that holds it.
    see: cache-problems
    source:
      title: ElastiCache Well-Architected Lens, Performance Efficiency (AWS)
      url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/PerformanceEfficiencyPillar.html
      verifiedOn: 2026-10-20
  - id: client-side-caching-term
    term: Client-side caching (Redis)
    aka:
      - client-side caching
      - CLIENT TRACKING
    definition: "Redis 6+: the app keeps local copies of keys, and Redis sends invalidation messages when they change."
    see: cache-problems
    source:
      title: Client-side caching reference (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/client-side-caching/
      verifiedOn: 2026-10-20
  - id: cache-abstraction-spring-term
    term: Cache abstraction (Spring)
    aka:
      - Spring cache abstraction
      - cache abstraction
    definition: Spring's caching annotations and CacheManager interface, which add caching to methods for any cache store.
    see: spring-cache-abstraction
    source:
      title: Declarative annotation-based caching (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-20
  - id: enable-caching-term
    term: "@EnableCaching"
    aka: []
    definition: Spring annotation on a configuration class that switches the cache annotations on.
    see: spring-cache-abstraction
    source:
      title: Declarative annotation-based caching (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-20
  - id: cacheable-term
    term: "@Cacheable"
    aka: []
    definition: "Spring annotation: return the cached result if present; otherwise run the method and cache its result."
    see: spring-cache-abstraction
    source:
      title: Declarative annotation-based caching (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-20
  - id: cacheput-term
    term: "@CachePut"
    aka: []
    definition: "Spring annotation: always run the method, then store its result in the cache."
    see: spring-cache-abstraction
    source:
      title: Declarative annotation-based caching (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-20
  - id: cacheevict-term
    term: "@CacheEvict"
    aka: []
    definition: "Spring annotation: remove one entry, or every entry, from a cache."
    see: spring-cache-abstraction
    source:
      title: Declarative annotation-based caching (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-20
  - id: redis-cache-manager-term
    term: RedisCacheManager
    aka: []
    definition: The Spring Data Redis CacheManager that keeps Spring cache entries in Redis; Spring Boot auto-configures it.
    see: spring-cache-abstraction
    source:
      title: "Caching: Redis (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/io/caching.html
      verifiedOn: 2026-10-20
  - id: ttl
    term: TTL
    aka:
      - time to live
    definition: The time a key has left before Redis treats it as expired and removes it.
    see: ttl-and-expiration
    source:
      title: EXPIRE (Redis command reference)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: key-expiry
    term: Expiry (Redis)
    aka:
      - key expiry
      - key expiration
    definition: Automatic removal of a key once its TTL runs out; keys have no TTL unless you set one.
    see: ttl-and-expiration
    source:
      title: EXPIRE (Redis command reference)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: expire-command
    term: EXPIRE (command)
    aka:
      - EXPIRE key
      - PEXPIRE
      - EXPIREAT
    definition: "Sets a TTL on an existing key: EXPIRE in seconds, PEXPIRE in milliseconds, EXPIREAT at a Unix time."
    see: ttl-and-expiration
    source:
      title: EXPIRE (Redis command reference)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: persist-command
    term: PERSIST (command)
    aka:
      - PERSIST key
    definition: Removes the TTL from a key, so it lives until it is deleted.
    see: ttl-and-expiration
    source:
      title: PERSIST (Redis command reference)
      url: https://redis.io/docs/latest/commands/persist/
      verifiedOn: 2026-10-20
  - id: keepttl
    term: KEEPTTL
    definition: A SET option (Redis 6.0+) that keeps the key's current TTL instead of discarding it.
    see: ttl-and-expiration
    source:
      title: SET (Redis command reference)
      url: https://redis.io/docs/latest/commands/set/
      verifiedOn: 2026-10-20
  - id: lazy-expiration
    term: Lazy expiration
    aka:
      - passive expiration
      - passive expiry
      - lazy expiry
    definition: Redis deletes an expired key when a command tries to access it.
    see: ttl-and-expiration
    source:
      title: EXPIRE (Redis command reference)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: active-expiration
    term: Active expiration
    aka:
      - active expiry
      - active expire cycle
    definition: A background cycle that samples keys with a TTL and deletes the expired ones, even if nobody reads them.
    see: ttl-and-expiration
    source:
      title: EXPIRE (Redis command reference)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: maxmemory
    term: maxmemory
    definition: The redis.conf limit on memory for data; 0, the default on 64-bit, means no limit.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: eviction-term
    term: Eviction (Redis)
    aka:
      - key eviction
      - evicted keys
    definition: Redis removing keys to get back under maxmemory, chosen by the eviction policy.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: eviction-policy
    term: Eviction policy
    aka:
      - maxmemory-policy
      - maxmemory policy
    definition: The maxmemory-policy setting that decides which keys Redis drops, or whether it refuses writes, at maxmemory.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: noeviction
    term: noeviction
    definition: "The default policy (Redis Open Source 8.10): nothing is evicted; writes that need memory get an error."
    see: eviction-policies
    source:
      title: redis.conf (Redis 8.10.2 tag)
      url: https://github.com/redis/redis/blob/8.10.2/redis.conf
      verifiedOn: 2026-10-20
  - id: allkeys-lru
    term: allkeys-lru
    definition: Eviction policy that drops the least recently used key among all keys.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: volatile-lru
    term: volatile-lru
    definition: Eviction policy that drops the least recently used key among keys that have a TTL.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: volatile-ttl
    term: volatile-ttl
    definition: Eviction policy that drops the key with the shortest remaining TTL.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: lru
    term: LRU
    aka:
      - least recently used
    definition: "Least recently used: the key not read or written for the longest time goes first."
    see: eviction-policies
    source:
      title: redis.conf (Redis 8.10.2 tag)
      url: https://github.com/redis/redis/blob/8.10.2/redis.conf
      verifiedOn: 2026-10-20
  - id: lfu
    term: LFU
    aka:
      - least frequently used
    definition: "Least frequently used: the key with the lowest access count goes first; Redis decays the count over time."
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: lrm
    term: LRM
    aka:
      - least recently modified
    definition: "Least recently modified: like LRU, but only writes count. Eviction policies allkeys-lrm and volatile-lrm since Redis 8.6."
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: approximated-lru
    term: Approximated LRU
    aka:
      - approximate LRU
      - approximated LRU algorithm
    definition: Redis picks eviction victims from a few random samples plus a candidate pool, not an exact LRU list.
    see: eviction-policies
    source:
      title: Key eviction (Redis docs)
      url: https://redis.io/docs/latest/develop/reference/eviction/
      verifiedOn: 2026-10-20
  - id: maxmemory-samples
    term: maxmemory-samples
    definition: How many keys Redis samples per eviction; default 5, 10 is close to true LRU (Redis Open Source 8.10).
    see: eviction-policies
    source:
      title: redis.conf (Redis 8.10.2 tag)
      url: https://github.com/redis/redis/blob/8.10.2/redis.conf
      verifiedOn: 2026-10-20
  - id: oom-error
    term: OOM error (Redis)
    aka:
      - OOM command not allowed
      - OOM error
    definition: The error a write gets when memory is over maxmemory and nothing can be evicted.
    see: eviction-policies
    source:
      title: redis.conf (Redis 8.10.2 tag)
      url: https://github.com/redis/redis/blob/8.10.2/redis.conf
      verifiedOn: 2026-10-20
  - id: big-key
    term: Big key
    aka:
      - big keys
      - large key
      - large keys
    definition: A key whose value holds very many elements or bytes; reading or deleting it can block Redis.
    see: memory-optimization
    source:
      title: redis.conf, LAZY FREEING (Redis 8.10.2 tag)
      url: https://github.com/redis/redis/blob/8.10.2/redis.conf
      verifiedOn: 2026-10-20
  - id: unlink-command
    term: UNLINK
    definition: Deletes keys like DEL, but frees their memory in another thread, so it does not block.
    see: memory-optimization
    source:
      title: UNLINK (Redis command reference)
      url: https://redis.io/docs/latest/commands/unlink/
      verifiedOn: 2026-10-20
  - id: listpack
    term: listpack
    definition: A compact encoding for small hashes, lists, sets and sorted sets (Redis 7.0+; sets 7.2+).
    see: memory-optimization
    source:
      title: OBJECT ENCODING (Redis command reference)
      url: https://redis.io/docs/latest/commands/object-encoding/
      verifiedOn: 2026-10-20
  - id: intset
    term: intset
    definition: A compact encoding for small sets that contain only integers.
    see: memory-optimization
    source:
      title: OBJECT ENCODING (Redis command reference)
      url: https://redis.io/docs/latest/commands/object-encoding/
      verifiedOn: 2026-10-20
  - id: object-encoding
    term: OBJECT ENCODING
    aka:
      - object encoding
    definition: Command that shows how Redis stores a key internally, such as listpack, intset or hashtable.
    see: memory-optimization
    source:
      title: OBJECT ENCODING (Redis command reference)
      url: https://redis.io/docs/latest/commands/object-encoding/
      verifiedOn: 2026-10-20
  - id: memory-usage-command
    term: MEMORY USAGE
    definition: Command that reports how many bytes a key and its value use, sampling nested values.
    see: memory-optimization
    source:
      title: MEMORY USAGE (Redis command reference)
      url: https://redis.io/docs/latest/commands/memory-usage/
      verifiedOn: 2026-10-20
  - id: atomic-operation-term
    term: Atomic operation
    aka:
      - atomic command
    definition: An operation other clients see either fully done or not started, never half done.
    see: single-command-atomicity
    source:
      title: Scripting with Lua (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/eval-intro/
      verifiedOn: 2026-10-20
  - id: race-condition-term
    term: Race condition
    aka: []
    definition: A bug where the result depends on the timing of concurrent clients, such as two GET then SET.
    see: single-command-atomicity
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: lost-update-term
    term: Lost update
    aka: []
    definition: Two clients read the same value and both write back; the first write is silently overwritten.
    see: single-command-atomicity
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: incr-term
    term: INCR
    aka:
      - INCRBY
    definition: "Adds 1 (INCRBY: any integer) to a key in one atomic step; a missing key starts at 0."
    see: single-command-atomicity
    source:
      title: INCR command (Redis docs)
      url: https://redis.io/docs/latest/commands/incr/
      verifiedOn: 2026-10-20
  - id: redis-counter-term
    term: Counter (Redis)
    aka:
      - counter pattern
      - Redis counter
    definition: A string key holding an integer, raised with INCR on each event, often one key per day.
    see: single-command-atomicity
    source:
      title: INCR command (Redis docs)
      url: https://redis.io/docs/latest/commands/incr/
      verifiedOn: 2026-10-20
  - id: check-and-set-term
    term: Check-and-set
    aka:
      - CAS
      - compare-and-set
    definition: Write a new value only if the current one is still what you read before.
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: multi-term
    term: MULTI
    aka: []
    definition: "Starts a Redis transaction: the following commands are queued, not run."
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: exec-term
    term: EXEC
    aka: []
    definition: Runs all queued commands of a transaction in order and returns their replies as one array.
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: discard-term
    term: DISCARD
    aka: []
    definition: Throws away the queued commands of a transaction; none of them runs.
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: watch-term
    term: WATCH
    aka: []
    definition: Marks keys so that EXEC aborts and returns nil if any of them changes first.
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: optimistic-locking-term
    term: Optimistic locking
    aka:
      - optimistic concurrency
    definition: Take no lock; detect a conflicting change at write time and retry the whole step.
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: redis-transaction-term
    term: Transaction (Redis)
    aka:
      - Redis transaction
      - MULTI/EXEC transaction
    definition: A queued group of commands that runs with no other client in between, without rollback.
    see: transactions-multi-exec
    source:
      title: Transactions (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/transactions/
      verifiedOn: 2026-10-20
  - id: lua-script-term
    term: Lua script (Redis)
    aka:
      - Lua script
      - Lua scripting
    definition: Lua code that Redis runs on the server as one atomic step, reading and writing keys.
    see: lua-and-functions
    source:
      title: Scripting with Lua (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/eval-intro/
      verifiedOn: 2026-10-20
  - id: eval-term
    term: EVAL
    aka: []
    definition: Runs a Lua script sent as text, with the number of keys, the keys and other arguments.
    see: lua-and-functions
    source:
      title: Scripting with Lua (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/eval-intro/
      verifiedOn: 2026-10-20
  - id: evalsha-term
    term: EVALSHA
    aka: []
    definition: Runs a script already in the script cache by its SHA1 digest; NOSCRIPT if missing.
    see: lua-and-functions
    source:
      title: Scripting with Lua (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/eval-intro/
      verifiedOn: 2026-10-20
  - id: script-cache-term
    term: Script cache
    aka: []
    definition: Server-side store of loaded scripts by SHA1; not persisted, so a restart or failover empties it.
    see: lua-and-functions
    source:
      title: Scripting with Lua (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/eval-intro/
      verifiedOn: 2026-10-20
  - id: redis-functions-term
    term: Redis Functions
    aka:
      - Redis function
    definition: "Redis 7.0+: named Lua functions in libraries, persisted and replicated with the data."
    see: lua-and-functions
    source:
      title: Redis functions (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/functions-intro/
      verifiedOn: 2026-10-20
  - id: fcall-term
    term: FCALL
    aka: []
    definition: Calls a loaded Redis function by name, with key names and arguments (Redis 7.0+).
    see: lua-and-functions
    source:
      title: Redis functions (Redis docs)
      url: https://redis.io/docs/latest/develop/programmability/functions-intro/
      verifiedOn: 2026-10-20
  - id: pipelining-term
    term: Pipelining
    aka:
      - pipeline
    definition: Sending many commands without waiting for each reply, then reading the replies together.
    see: pipelining
    source:
      title: Redis pipelining (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/pipelining/
      verifiedOn: 2026-10-20
  - id: round-trip-time-term
    term: Round-trip time
    aka:
      - RTT
    definition: Time for a request to reach the server and its reply to come back.
    see: pipelining
    source:
      title: Redis pipelining (Redis docs)
      url: https://redis.io/docs/latest/develop/using-commands/pipelining/
      verifiedOn: 2026-10-20
  - id: variadic-command-term
    term: Variadic command
    aka:
      - variadic commands
    definition: A command that takes many keys or values at once, such as MGET or MSET.
    see: pipelining
    source:
      title: Diagnosing latency issues (Redis docs)
      url: https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/latency/
      verifiedOn: 2026-10-20
  - id: distributed-lock
    term: Distributed lock
    definition: A lock shared by many processes or servers, so only one of them does a given job at a time.
    see: distributed-locks
    source:
      title: Distributed Locks with Redis (Redis docs)
      url: https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
      verifiedOn: 2026-10-20
  - id: lock-owner-token-term
    term: Lock owner token
    aka:
      - lock token
    definition: A random value, unique per lock request, stored in the lock key to show who holds it.
    see: distributed-locks
    source:
      title: Distributed Locks with Redis (Redis docs)
      url: https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
      verifiedOn: 2026-10-20
  - id: lock-lease-term
    term: Lease (lock)
    aka:
      - lock lease
      - lock expiry
      - lock timeout
    definition: A lock that frees itself after a set time, so a crashed holder cannot block others forever.
    see: distributed-locks
    source:
      title: How to do distributed locking (Martin Kleppmann, 2016)
