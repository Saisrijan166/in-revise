id: redistemplate-vs-stringredistemplate
tech: redis
title: "RedisTemplate vs StringRedisTemplate"
compares: [sdr-redis-template, sdr-string-redis-template]
gist:
  - "Any key and value types; you pick the serialisers"
  - "String keys and values, stored as readable UTF-8 text"
explain:
  - "RedisTemplate<K, V> is Spring Data Redis's general template. It works with any Java key and value types, and its serialisers decide how they become bytes; without your own, it uses JDK serialisation."
  - "StringRedisTemplate is a RedisTemplate<String, String> with string serialisers already set. Keys and values are stored as plain UTF-8 text, exactly as redis-cli and other languages see them."
example: "With StringRedisTemplate, set(\"merchant:42:config\", \"UPI,CARD\") can be read back with redis-cli GET merchant:42:config. With Boot's default RedisTemplate<Object, Object>, the same call stores the key and value as JDK bytes, so that redis-cli GET returns (nil)."
rows:
  - { aspect: "Type", a: "RedisTemplate<K, V>; Boot's bean is <Object, Object>", b: "Extends RedisTemplate<String, String>" }
  - { aspect: "Default serialiser", a: "JDK serialisation", b: "StringRedisSerializer (UTF-8)" }
  - { aspect: "Seen in redis-cli", a: "Binary bytes", b: "Readable text" }
  - { aspect: "Good for", a: "Objects, once you set a JSON value serialiser", b: "Counters, flags, ids, JSON you build yourself" }
  - { aspect: "Replace Boot's bean", a: "Define a bean named redisTemplate", b: "Define any StringRedisTemplate bean" }
verdict: "StringRedisTemplate for text and counters; for objects, a RedisTemplate<String, T> with a JSON value serialiser."
sayIt: "StringRedisTemplate stores keys and values as readable text, so I use it for ids, flags, counters and JSON I build myself. For objects I define a RedisTemplate<String, T> with a string key serialiser and a JSON value serialiser, because the default JDK serialisation is binary and Java-only."
sources:
