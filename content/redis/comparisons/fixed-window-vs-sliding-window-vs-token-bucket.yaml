id: fixed-window-vs-sliding-window-vs-token-bucket
tech: redis
title: Fixed Window vs Sliding Window vs Token Bucket
compares: [rate-fixed-window, rate-sliding-window, rate-token-bucket]
gist:
  - "One counter per clock window; resets at the edge"
  - "Counts requests in the last N seconds, rolling"
  - "Tokens refill steadily; each request spends one"
explain:
  - "A fixed window keeps one counter per client for each clock period, such as 10:00 to 10:01, and refuses requests once it passes the limit. The key's TTL ends the window, so the count starts again at the next one."
  - "A sliding window counts the requests in the last N seconds, measured back from now. The log version stores each request time in a sorted set; the counter version blends the previous window's count with the current one."
  - "A token bucket gives each client a bucket of tokens that refills at a steady rate up to a maximum. Each request spends one token, and a request that finds the bucket empty is refused."
example: "Limit: 5 logins per minute. A client sends 5 attempts at 10:00:59 and 5 at 10:01:00. The fixed window allows all 10, because the second 5 land in a new window. The sliding window refuses the second 5, because 10 requests fall in the last 60 seconds. A full token bucket of 5 allows the first 5 and refuses the rest until tokens refill."
rows:
  - { aspect: "Redis type", a: "One string counter, using INCR", b: "Log: a sorted set; counter: two strings", c: "One hash with tokens and last refill time" }
  - { aspect: "Memory per client", a: "One key", b: "Log: one entry per request; counter: two keys", c: "One key with two fields" }
  - { aspect: "Accuracy", a: "Approximate", b: "Log is exact; counter is near-exact", c: "Exact" }
  - { aspect: "Bursts", a: "Up to twice the limit across a window edge", b: "No burst at the edge", c: "Allowed, up to the bucket size" }
  - { aspect: "Good for", a: "Simple limits such as login throttling", b: "General API limits; the log for high-value APIs", c: "Bursty clients that need an average cap" }
verdict: "Fixed window for simple limits, sliding window counter as the general default, token bucket when short bursts are fine."
sayIt: "A fixed window is one counter per clock period, cheap but it lets twice the limit through at an edge. A sliding window counts the last N seconds, so there is no edge burst. A token bucket refills steadily and allows short bursts up to its size."
sources:
  - title: "Build 5 Rate Limiters with Redis (Redis tutorials)"
    url: "https://redis.io/tutorials/howtos/ratelimiting/"
    verifiedOn: "2026-10-21"
