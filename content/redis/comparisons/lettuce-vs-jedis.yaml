id: lettuce-vs-jedis
tech: redis
title: "Lettuce vs Jedis"
compares: [sdr-lettuce, sdr-jedis]
gist:
  - "Netty-based; one thread-safe connection shared by all"
  - "Blocking client; each thread borrows a pooled connection"
rows:
  - { aspect: "In Spring Boot 4.1", a: "The starter's default", b: "Exclude lettuce-core and add jedis" }
  - { aspect: "Reactive API", a: "Yes: ReactiveRedisTemplate", b: "No" }
  - { aspect: "Connections", a: "One shared native connection for most commands", b: "A pool (commons-pool2)" }
  - { aspect: "Connection lost", a: "Reconnects itself and buffers commands", b: "The command fails; your code retries on a new connection" }
  - { aspect: "Replica reads", a: "Yes, with Sentinel or Cluster", b: "No" }
verdict: "Keep Lettuce, the default; choose Jedis only if your team already standardises on it."
sources:
  - title: "Drivers: Lettuce and Jedis (Spring Data Redis 4.1 reference)"
    url: "https://docs.spring.io/spring-data/redis/reference/redis/drivers.html"
    verifiedOn: "2026-10-20"
  - title: "Use Jedis instead of Lettuce (Spring Boot 4.1 how-to)"
    url: "https://docs.spring.io/spring-boot/how-to/nosql.html"
    verifiedOn: "2026-10-20"
  - title: "Command execution reliability (Lettuce docs)"
    url: "https://redis.github.io/lettuce/advanced-usage/command-execution-reliability/"
    verifiedOn: "2026-10-20"
  - title: "Jedis: connect to the server (redis.io)"
    url: "https://redis.io/docs/latest/develop/clients/jedis/connect/"
    verifiedOn: "2026-10-20"
