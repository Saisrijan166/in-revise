id: lettuce-vs-jedis
tech: redis
title: "Lettuce vs Jedis"
compares: [sdr-lettuce, sdr-jedis]
gist:
  - "Netty-based; one thread-safe connection shared by all"
  - "Blocking client; each thread borrows a pooled connection"
explain:
  - "Lettuce is the Java client that spring-boot-starter-data-redis brings by default. It is built on Netty, so one connection can carry commands from many threads at once, and it also offers a reactive API."
  - "Jedis is an older, synchronous Java client: each call blocks its thread until Redis replies. In Spring Data Redis each thread borrows a connection from a commons-pool2 pool and returns it after use."
example: "The payment service runs 200 request threads. With Lettuce, they all share one connection for GET and SET on payment:9001. With Jedis, each thread borrows a pooled connection, so the pool size limits how many threads can talk to Redis at the same moment."
rows:
  - { aspect: "In Spring Boot 4.1", a: "The starter's default", b: "Exclude lettuce-core and add jedis" }
  - { aspect: "Reactive API", a: "Yes: ReactiveRedisTemplate", b: "No" }
  - { aspect: "Connections", a: "One shared native connection for most commands", b: "A pool (commons-pool2)" }
  - { aspect: "Connection lost", a: "Reconnects itself and buffers commands", b: "The command fails; your code retries on a new connection" }
  - { aspect: "Replica reads", a: "Yes, with Sentinel or Cluster", b: "No" }
verdict: "Keep Lettuce, the default; choose Jedis only if your team already standardises on it."
sayIt: "Spring Boot uses Lettuce by default: it is Netty-based, shares one thread-safe connection, reconnects by itself and supports reactive code. Jedis is a blocking client that needs a connection pool. I keep Lettuce unless the team already runs Jedis."
