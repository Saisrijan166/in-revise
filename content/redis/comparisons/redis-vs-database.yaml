id: redis-vs-database
tech: redis
title: Redis vs a Relational Database
compares: [what-is-redis, relational-database]
gist:
  - "In RAM: fast key access, tunable durability"
  - "On disk: SQL, constraints, durable commits"
explain:
  - "Redis is an in-memory key-value server. It solves speed and coordination: fast reads of hot data, plus counters, locks and short-lived state shared by many app servers."
  - "A relational database such as PostgreSQL stores rows in tables on disk. It solves durable, consistent records: commits survive a crash, constraints reject bad data, and SQL can query the data in any shape."
example: "The payment service writes payment 9001 to PostgreSQL, caches a copy as payment:9001 in Redis for 5 minutes, and counts the user's requests in rate:user:7:upi. If Redis restarts empty, the service reloads the copy from PostgreSQL and the counter starts again; nothing important is lost."
diagrams:
  - |
    flowchart LR
      A[Payment service] -- "GET payment:9001" --> R[(Redis in RAM)]
  - |
    flowchart LR
      A[Payment service] -- "SELECT ... JOIN" --> P[(PostgreSQL on disk)]
diagramAlt: "Redis: the payment service reads one key, payment:9001, from Redis in memory. Relational database: the payment service runs a SQL query with a join against PostgreSQL on disk."
rows:
  - { aspect: "Data lives", a: "In RAM; disk files are optional copies", b: "On disk" }
  - { aspect: "How you find data", a: "By key; optional search indexes, built in since Redis 8.0", b: "SQL queries with joins and indexes" }
  - { aspect: "Rules on data", a: "None between keys", b: "Unique, foreign key and check constraints" }
  - { aspect: "After a crash", a: "May lose recent writes, by config", b: "Committed transactions survive (WAL)" }
  - { aspect: "Size", a: "Must fit in RAM (Redis Open Source)", b: "Can be far larger than RAM" }
  - { aspect: "Best for", a: "Caches, counters, sessions, short-lived state", b: "Orders, payments, accounts" }
verdict: "Keep the records of truth in the database; add Redis where speed or coordination matters."
sayIt: "Redis keeps data in RAM and finds it by key, with durability that depends on its settings. A relational database keeps data on disk with SQL, constraints and durable commits. I keep the source of truth in the database and use Redis beside it for speed and coordination."
