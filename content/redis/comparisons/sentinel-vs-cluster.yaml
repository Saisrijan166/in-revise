id: sentinel-vs-cluster
tech: redis
title: Sentinel vs Cluster
compares: [sentinel, redis-cluster]
gist:
  - "One primary holds all data; Sentinels run failover"
  - "Data split over many primaries by hash slot"
explain:
  - "Sentinel is a group of processes that watch one primary holding all the data. When it fails, they promote a replica and tell clients the new address. It solves downtime, not size."
  - "Redis Cluster splits the keys over several primaries by hash slot, each with its own replicas, and the nodes run failover themselves. It solves data or write load too big for one server."
example: "The payment service's Redis holds 8 GB and one server copes with the writes: three Sentinels give it automatic failover. If merchant data grows past what one server's RAM can hold, more replicas do not help, because each holds the full copy; Cluster spreads the slots over several primaries."
rows:
  - { aspect: "Where the data lives", a: "All keys on one primary, copied to replicas", b: "Spread over primaries by 16384 hash slots" }
  - { aspect: "What it scales", a: "Reads only, through replicas", b: "Data size and writes as well" }
  - { aspect: "Failover run by", a: "Separate Sentinel processes", b: "The cluster nodes themselves" }
  - { aspect: "Multi-key commands", a: "Work on any keys", b: "Only keys in one slot, using hash tags" }
  - { aspect: "Numbered databases", a: "SELECT 0-15 (16 by default)", b: "Only database 0" }
  - { aspect: "How the client finds the node", a: "It asks a Sentinel for the primary", b: "A slot map, corrected by MOVED and ASK" }
verdict: "Use Sentinel while one server holds all the data; move to Cluster when data or writes outgrow it."
sayIt: "Sentinel adds automatic failover to one primary that holds all the data, so it scales only reads. Cluster shards keys over 16384 hash slots across several primaries and fails over by itself, at the cost of the one-slot rule for multi-key commands and database 0 only."
