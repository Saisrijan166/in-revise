id: sentinel-vs-cluster
tech: redis
title: Sentinel vs Cluster
compares: [sentinel, redis-cluster]
gist:
  - "One primary holds all data; Sentinels run failover"
  - "Data split over many primaries by hash slot"
rows:
  - { aspect: "Data", a: "All keys on one primary, copied to replicas", b: "Spread over primaries, 16384 slots" }
  - { aspect: "Scales", a: "Reads, through replicas", b: "Data size and writes too" }
  - { aspect: "Failover run by", a: "Separate Sentinel processes", b: "The cluster nodes themselves" }
  - { aspect: "Multi-key commands", a: "Any keys", b: "Only keys in one slot (hash tags)" }
  - { aspect: "Databases", a: "SELECT 0-15 (16 by default)", b: "Only database 0" }
  - { aspect: "Client finds the node by", a: "Asking a Sentinel for the primary", b: "Slot map plus MOVED / ASK redirects" }
verdict: "Use Sentinel while one server holds all the data; move to Cluster when data or writes outgrow it."
sources:
  - title: "High availability with Redis Sentinel (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/"
    verifiedOn: "2026-10-20"
  - title: "Scale with Redis Cluster (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/"
    verifiedOn: "2026-10-20"
  - title: "Redis Cluster specification (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/"
    verifiedOn: "2026-10-20"
  - title: "redis.conf, databases (Redis 8.10.2 tag)"
    url: "https://github.com/redis/redis/blob/8.10.2/redis.conf"
    verifiedOn: "2026-10-20"
