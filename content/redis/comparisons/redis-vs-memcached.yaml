id: redis-vs-memcached
tech: redis
title: Redis vs Memcached
compares: [what-is-redis, memcached]
gist:
  - "Typed values, persistence, replication"
  - "Opaque values, many threads, no replication"
explain:
  - "Redis is an in-memory key-value server with typed values such as hashes, lists and sorted sets. It solves caching plus counters, rankings, queues and locks, and can save data to disk and keep copies on replicas."
  - "Memcached is an in-memory cache of plain byte values spread over servers that never talk to each other. It solves one job: a fast, multi-threaded cache of objects you can always rebuild from the database."
example: "The payment service caches merchant settings as JSON: both tools work. It also ranks merchants by today's payment total: Redis does it with one sorted-set command per payment, while Memcached would need the whole ranking stored as one blob and rewritten each time."
rows:
  - { aspect: "Values", a: "Strings, hashes, lists, sets, sorted sets, streams", b: "Opaque bytes only" }
  - { aspect: "Threads", a: "One main thread runs commands", b: "Many worker threads (default 4)" }
  - { aspect: "Persistence", a: "RDB and AOF files", b: "None; warm restart only after a clean stop" }
  - { aspect: "Replication", a: "Replicas, Sentinel, Cluster", b: "None; servers are unaware of each other" }
  - { aspect: "Max value", a: "512 MB per string", b: "1 MB per item by default" }
verdict: "Use Redis by default; Memcached fits a simple, multi-core cache of throwaway values."
sayIt: "Both keep data in RAM. Memcached is a multi-threaded cache of opaque values with no persistence or replication. Redis adds data types, persistence, replication, scripting and Cluster, so I use Redis unless I only need a plain cache of throwaway values."
