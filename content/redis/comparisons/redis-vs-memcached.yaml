id: redis-vs-memcached
tech: redis
title: Redis vs Memcached
compares: [what-is-redis, memcached]
gist:
  - "Typed values, persistence, replication"
  - "Opaque values, many threads, no replication"
rows:
  - { aspect: "Values", a: "Strings, hashes, lists, sets, sorted sets, streams", b: "Opaque bytes only" }
  - { aspect: "Threads", a: "One main thread runs commands", b: "Many worker threads (default 4)" }
  - { aspect: "Persistence", a: "RDB and AOF files", b: "None; warm restart only after a clean stop" }
  - { aspect: "Replication", a: "Replicas, Sentinel, Cluster", b: "None; servers are unaware of each other" }
  - { aspect: "Max value", a: "512 MB per string", b: "1 MB per item by default" }
verdict: "Use Redis by default; Memcached fits a simple, multi-core cache of throwaway values."
sources:
  - title: "Memcached documentation: overview and design philosophy"
    url: "https://docs.memcached.org/"
    verifiedOn: "2026-10-20"
  - title: "memcached(1) man page (memcached on GitHub)"
    url: "https://github.com/memcached/memcached/blob/master/doc/memcached.1"
    verifiedOn: "2026-10-20"
  - title: "Warm restart (Memcached documentation)"
    url: "https://docs.memcached.org/features/restart/"
    verifiedOn: "2026-10-20"
  - title: "Comparing Valkey, Memcached and Redis OSS (Amazon ElastiCache docs)"
    url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html"
    verifiedOn: "2026-10-20"
  - title: "Redis serialization protocol: bulk strings limited to 512 MB by default (redis.io)"
    url: "https://redis.io/docs/latest/develop/reference/protocol-spec/"
    verifiedOn: "2026-10-20"
