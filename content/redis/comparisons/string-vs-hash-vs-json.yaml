id: string-vs-hash-vs-json
tech: redis
title: String vs Hash vs JSON for an object
compares: [strings, hashes, json-documents]
gist:
  - "One blob: read and write it whole"
  - "Flat fields: change one at a time"
  - "Nested document: change any path"
explain:
  - "A string holds one value of bytes, such as a payment serialised to JSON text by the app. Redis does not look inside it, so the app reads and writes the whole value."
  - "A hash holds flat field-value pairs under one key, like a table row. You can read or change one field, such as status, without touching the others; values are strings."
  - "A JSON document holds a nested JSON value that Redis understands. A path such as $.customer.id reads or changes one part, even deep inside nested objects and arrays."
example: "Payment 9001's status changes from PENDING to PAID. As a string, the app reads the whole JSON text, edits it and writes it all back. As a hash, HSET payment:9001 status PAID changes one field. As JSON, JSON.SET payment:9001 $.status '\"PAID\"' changes one path, and the nested customer object stays as it is."
rows:
  - { aspect: "Shape", a: "Opaque bytes, often serialised JSON", b: "Flat field-value pairs, values are strings", c: "Nested objects and arrays" }
  - { aspect: "Update one field", a: "Read, edit and rewrite the whole value", b: "HSET or HINCRBY on that field", c: "JSON.SET or JSON.NUMINCRBY on a path" }
  - { aspect: "Expiry", a: "Whole key only", b: "Whole key, or per field (Redis 7.4+)", c: "Whole key only" }
  - { aspect: "Query by field (Redis Search)", a: "No", b: "Yes", c: "Yes, including nested paths" }
  - { aspect: "Memory", a: "Least", b: "More", c: "Most" }
verdict: "Use a string when you always read and write the whole object, a hash when flat fields change on their own, and JSON when the object is nested."
sayIt: "For a cached object I pick by access pattern. A string when I always read and write it whole, since it uses the least memory. A hash when single flat fields change, using HSET or HINCRBY. JSON when the object is nested and I need to change or index parts by path."
sources:
