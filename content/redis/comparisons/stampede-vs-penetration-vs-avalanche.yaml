id: stampede-vs-penetration-vs-avalanche
tech: redis
title: Cache Stampede vs Penetration vs Avalanche
compares: [cache-stampede, cache-penetration, cache-avalanche]
gist:
  - "One popular key expires; many rebuild it at once"
  - "Keys that exist nowhere; every call hits the DB"
  - "Many keys expire together; the DB floods"
explain:
  - "Stampede: one popular key expires or is evicted, and the many requests that miss it all reload it from the database at the same moment."
  - "Penetration: requests ask for ids that exist neither in Redis nor in the database, so nothing is ever cached and every request reaches the database."
  - "Avalanche: many keys expire in the same short window, or a cache node starts empty, so a wave of misses reaches the database at once."
example: "During a sale, merchant:42:config expires and 5,000 requests reload it: a stampede. Bots ask for payment:9999 and other ids that do not exist: penetration. A job loaded one million keys with EX 3600 at 09:00, and at 10:00 they all expire: an avalanche."
rows:
  - { aspect: "Trigger", a: "A hot key expires or is evicted", b: "Ids missing from the DB: bugs or attacks", c: "Same TTL on keys loaded together, or an empty new node" }
  - { aspect: "Keys involved", a: "One", b: "Many, never cached", c: "Many" }
  - { aspect: "First fix", a: "One caller rebuilds; others wait", b: "Validate ids; cache 'not found' briefly", c: "Add random jitter to each TTL" }
  - { aspect: "Second fix", a: "Refresh early, before expiry", b: "Bloom filter of real ids", c: "Warm the cache before traffic" }
verdict: "Ask: one key, missing keys or many keys? Then lock the rebuild, cache the absence, or spread the expiry."
sayIt: "A stampede is one hot key expiring, so I let one caller rebuild under a lock. Penetration is ids that exist nowhere, so I validate ids and cache the absence briefly. An avalanche is many keys expiring together, so I add TTL jitter and warm new nodes."
sources:
