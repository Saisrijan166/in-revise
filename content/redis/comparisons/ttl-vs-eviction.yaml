id: ttl-vs-eviction
tech: redis
title: TTL vs Eviction
compares: [ttl-and-expiration, eviction-policies]
gist:
  - "Your timer on a key: it ends when time runs out"
  - "Redis frees memory when maxmemory is reached"
rows:
  - { aspect: "Who decides", a: "You, per key (EX, EXPIRE)", b: "Redis, by maxmemory-policy" }
  - { aspect: "Triggered by", a: "Time running out", b: "Memory over maxmemory" }
  - { aspect: "Which keys", a: "Only keys with a TTL", b: "allkeys-*: any key; volatile-*: keys with a TTL" }
  - { aspect: "Out of the box", a: "No TTL: keys live forever", b: "noeviction: writes get an OOM error (Redis Open Source 8.10)" }
  - { aspect: "Purpose", a: "Freshness and cleanup", b: "A safety net for memory" }
verdict: "Set TTLs for freshness; set maxmemory and a policy as the safety net when memory runs out."
sources:
  - title: "EXPIRE (Redis command reference)"
    url: "https://redis.io/docs/latest/commands/expire/"
    verifiedOn: "2026-10-20"
  - title: "Key eviction (Redis docs)"
    url: "https://redis.io/docs/latest/develop/reference/eviction/"
    verifiedOn: "2026-10-20"
  - title: "redis.conf, MEMORY MANAGEMENT section (Redis 8.10.2 tag)"
    url: "https://github.com/redis/redis/blob/8.10.2/redis.conf"
    verifiedOn: "2026-10-20"
