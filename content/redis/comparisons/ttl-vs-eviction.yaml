id: ttl-vs-eviction
tech: redis
title: TTL vs Eviction
compares: [ttl-and-expiration, eviction-policies]
gist:
  - "Your timer on a key: it ends when time runs out"
  - "Redis frees memory when maxmemory is reached"
explain:
  - "A TTL is a timer you put on one key with EX or EXPIRE. When it runs out, the key is gone. It solves freshness: old cached copies and short-lived state disappear without a cleanup job."
  - "Eviction is Redis deleting keys by itself when used memory reaches maxmemory. The policy, such as allkeys-lru, picks which keys go. It solves running out of RAM without crashing."
example: "payment:9001 is cached with EX 300, so it disappears after 5 minutes even if memory is nearly empty. merchant:42:config has no TTL, yet under allkeys-lru it can still be evicted when a burst of new keys fills memory."
rows:
  - { aspect: "Who decides", a: "You, per key (EX, EXPIRE)", b: "Redis, by maxmemory-policy" }
  - { aspect: "Triggered by", a: "Time running out", b: "Memory over maxmemory" }
  - { aspect: "Which keys", a: "Only keys with a TTL", b: "allkeys-*: any key; volatile-*: keys with a TTL" }
  - { aspect: "Out of the box", a: "No TTL: keys live forever", b: "noeviction: writes get an OOM error (Redis Open Source 8.10)" }
  - { aspect: "Purpose", a: "Freshness and cleanup", b: "A safety net for memory" }
verdict: "Set TTLs for freshness; set maxmemory and a policy as the safety net when memory runs out."
sayIt: "A TTL is my timer on a key: it removes the key when the time runs out, which keeps data fresh. Eviction is Redis removing keys when memory reaches maxmemory, chosen by the policy. A key without a TTL can still be evicted under an allkeys policy."
sources:
