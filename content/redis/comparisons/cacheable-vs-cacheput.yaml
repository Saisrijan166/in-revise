id: cacheable-vs-cacheput
tech: redis
title: "@Cacheable vs @CachePut"
compares: [cacheable-annotation, cacheput-annotation]
gist:
  - "Skip the method on a hit; cache the result on a miss"
  - "Always run the method, then cache its result"
explain:
  - "@Cacheable is for reads: on a hit the proxy returns the cached value and the method does not run; on a miss the method runs and its result is stored."
  - "@CachePut is for updates: the method always runs, and its result overwrites the cache entry, so the cache holds the new value straight away."
example: "find(\"9001\") with @Cacheable runs the query once, then serves payments::9001 from Redis. markPaid(\"9001\") with @CachePut always updates the database and then stores the returned PaymentView, so the next find sees status PAID without a miss."
rows:
  - { aspect: "Method runs", a: "Only on a miss", b: "On every call" }
  - { aspect: "Cache after the call", a: "Stores the result after a miss", b: "Overwrites the entry with the result" }
  - { aspect: "Typical use", a: "Reads: find(id)", b: "Updates that return the new object" }
  - { aspect: "Both on one method", a: "Strongly discouraged by Spring", b: "Strongly discouraged by Spring" }
verdict: "@Cacheable on reads; @CachePut on writes that return the fresh object; @CacheEvict on writes that do not."
sayIt: "@Cacheable skips the method on a hit, so I put it on reads. @CachePut always runs the method and stores its result, so I put it on updates that return the new object. Spring strongly discourages both on one method."
sources:
  - title: "Declarative annotation-based caching (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html"
    verifiedOn: "2026-10-20"
