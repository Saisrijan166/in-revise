id: pipelining-vs-multi-exec-vs-lua
tech: redis
title: Pipelining vs MULTI/EXEC vs Lua
compares: [pipelining, transactions-multi-exec, lua-and-functions]
gist:
  - "Send a batch to save round trips; not atomic"
  - "Queue commands, then run them with no one in between"
  - "Run read-decide-write logic on the server at once"
explain:
  - "Pipelining is a client technique: send many commands without waiting for each reply, then read all the replies. It solves slow round trips for bulk reads and writes."
  - "MULTI/EXEC queues commands and runs them together at EXEC, with no other client in between. It solves groups of writes being seen half done, and WATCH adds a check for changes."
  - "A Lua script is code that runs inside Redis as one atomic step. It solves read-decide-write logic, where the next write depends on a value just read."
example: "Reading the status of 500 payments: pipeline the GETs (or use one MGET). Marking payment 9001 PAID and adding 50000 paise to merchant 42's daily total together: MULTI/EXEC. Doing both only if the payment is still PENDING: a Lua script, or WATCH with a retry loop."
rows:
  - { aspect: "Atomic", a: "No: other clients' commands can run in between", b: "Yes: no other client runs during EXEC", c: "Yes: no other command runs during the script" }
  - { aspect: "Can a command use an earlier reply", a: "No: replies come back at the end", b: "No: replies come back at EXEC", c: "Yes: each redis.call returns its reply" }
  - { aspect: "Check before writing", a: "Not possible", b: "WATCH, then retry when EXEC returns nil", c: "An if inside the script" }
  - { aspect: "Blocks other clients", a: "No", b: "Only while EXEC runs the queue", c: "For the whole script" }
  - { aspect: "Main gain", a: "Fewer round trips", b: "Writes applied together", c: "Logic next to the data, one round trip" }
verdict: "Pipeline for speed, MULTI/EXEC to apply writes together, Lua when a write depends on a value you read."
sayIt: "A pipeline only saves round trips and is not atomic. MULTI/EXEC runs queued commands with no client in between, but cannot branch on a read and never rolls back. A Lua script runs read-decide-write logic atomically on the server, so I use it when a write depends on a read."
sources:
