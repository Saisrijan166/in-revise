id: pipelining-vs-multi-exec-vs-lua
tech: redis
title: Pipelining vs MULTI/EXEC vs Lua
compares: [pipelining, transactions-multi-exec, lua-and-functions]
gist:
  - "Send a batch to save round trips; not atomic"
  - "Queue commands, then run them with no one in between"
  - "Run read-decide-write logic on the server at once"
rows:
  - { aspect: "Atomic", a: "No: other clients interleave", b: "Yes", c: "Yes" }
  - { aspect: "Next command can use a reply", a: "No: replies come at the end", b: "No: replies come at EXEC", c: "Yes" }
  - { aspect: "Check before write", a: "Not possible", b: "WATCH, retry when EXEC is nil", c: "An if inside the script" }
  - { aspect: "Holds up other clients", a: "No", b: "While EXEC runs", c: "For the whole script" }
  - { aspect: "Main gain", a: "Fewer round trips", b: "Isolated group of writes", c: "Logic next to the data" }
verdict: "Pipeline for speed, MULTI/EXEC to apply writes together, Lua when a write depends on a value you read."
sources:
  - title: "Redis pipelining (Redis docs)"
    url: "https://redis.io/docs/latest/develop/using-commands/pipelining/"
    verifiedOn: "2026-10-20"
  - title: "Transactions (Redis docs)"
    url: "https://redis.io/docs/latest/develop/using-commands/transactions/"
    verifiedOn: "2026-10-20"
  - title: "Scripting with Lua (Redis docs)"
    url: "https://redis.io/docs/latest/develop/programmability/eval-intro/"
    verifiedOn: "2026-10-20"
