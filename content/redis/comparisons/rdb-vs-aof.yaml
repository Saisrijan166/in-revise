id: rdb-vs-aof
tech: redis
title: RDB vs AOF
compares: [rdb-snapshot, aof-log]
gist:
  - "A snapshot file of all data at one moment"
  - "A log of every write, replayed at startup"
rows:
  - { aspect: "Saves", a: "The whole dataset, at set intervals", b: "Each write command as it happens" }
  - { aspect: "Lost on a crash", a: "Writes since the last snapshot, often minutes", b: "About 1 s with everysec; less with always" }
  - { aspect: "File", a: "One compact file, easy to back up", b: "Usually bigger; a rewrite shrinks it" }
  - { aspect: "Restart", a: "Faster on big datasets", b: "Slower: replays logged commands" }
  - { aspect: "Default", a: "On (Redis Open Source 8.10)", b: "Off: appendonly no" }
verdict: "Use both for data you must keep; RDB alone if minutes of loss are fine; neither for a pure cache."
sources:
  - title: "Redis persistence (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"
    verifiedOn: "2026-10-20"
  - title: "redis.conf, SNAPSHOTTING and APPEND ONLY MODE (Redis 8.10.2 tag)"
    url: "https://github.com/redis/redis/blob/8.10.2/redis.conf"
    verifiedOn: "2026-10-20"
