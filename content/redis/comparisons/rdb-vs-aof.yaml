id: rdb-vs-aof
tech: redis
title: RDB vs AOF
compares: [rdb-snapshot, aof-log]
gist:
  - "A snapshot file of all data at one moment"
  - "A log of every write, replayed at startup"
explain:
  - "RDB is a snapshot: at set intervals Redis forks a child that writes all data at that moment to one compact file, dump.rdb. It gives backups and fast restarts."
  - "AOF is a log: Redis appends every write command to it and replays the log at startup. It keeps far more recent writes than snapshots, about one second's loss with everysec."
example: "The payment service's Redis holds login sessions. With RDB only and the default save points, a crash can lose minutes of new logins. With AOF everysec it loses about a second; adding RDB still gives a compact file to copy off the machine every hour."
rows:
  - { aspect: "What it saves", a: "The whole dataset, at set intervals", b: "Each write command as it happens" }
  - { aspect: "Lost on a crash", a: "Writes since the last snapshot, often minutes", b: "About 1 s with everysec, less with always" }
  - { aspect: "File size", a: "One compact file, easy to back up", b: "Usually bigger; a background rewrite shrinks it" }
  - { aspect: "Restart speed", a: "Faster on big datasets", b: "Slower, because it replays the log" }
  - { aspect: "Default (Redis 8.10)", a: "On, with three save points", b: "Off (appendonly no)" }
verdict: "Use both for data you must keep; RDB alone if minutes of loss are fine; neither for a pure cache."
sayIt: "RDB writes forked snapshots: compact, fast to restart, good for backups, but a crash loses the writes since the last one. AOF logs every write and with everysec loses about a second. For data I must keep I enable both; for a pure cache, neither."
sources:
  - title: "Redis persistence (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"
    verifiedOn: "2026-10-20"
  - title: "redis.conf, SNAPSHOTTING and APPEND ONLY MODE (Redis 8.10.2 tag)"
    url: "https://github.com/redis/redis/blob/8.10.2/redis.conf"
    verifiedOn: "2026-10-20"
