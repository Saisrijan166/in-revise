id: cache-aside-vs-read-through-vs-write-through-vs-write-behind
tech: redis
title: Cache-Aside vs Read-Through vs Write-Through vs Write-Behind
compares: [cache-aside, read-through-cache, write-through-cache, write-behind-cache]
gist:
  - "The app loads on a miss and deletes on a write"
  - "The cache layer loads the miss from the DB"
  - "Each write updates cache and DB before returning"
  - "Write the cache now, the DB later in batches"
rows:
  - { aspect: "Who reads the DB", a: "The app", b: "The cache layer", c: "Read side not set: pair it", d: "Read side not set: pair it" }
  - { aspect: "On a write", a: "DB, then delete the key", b: "Not a write policy", c: "Cache and DB, synchronously", d: "Cache; DB later, async" }
  - { aspect: "Read after a write", a: "A miss, or briefly stale", b: "Depends on the write policy", c: "Fresh at once", d: "Fresh from the cache" }
  - { aspect: "Main cost", a: "Slow first read; stale data", b: "Needs a library or integration", c: "Slower writes; unread data cached", d: "Writes lost if the cache dies first" }
  - { aspect: "With Redis", a: "Your app code", b: "A library or integration layer", c: "Your app writes both", d: "Redis Software/Cloud, or your own worker" }
verdict: "Start with cache-aside; add write-through when reads must be fresh at once; use write-behind only when losing recent writes is acceptable."
