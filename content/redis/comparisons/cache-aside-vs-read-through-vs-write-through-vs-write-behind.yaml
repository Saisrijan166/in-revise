id: cache-aside-vs-read-through-vs-write-through-vs-write-behind
tech: redis
title: Cache-Aside vs Read-Through vs Write-Through vs Write-Behind
compares: [cache-aside, read-through-cache, write-through-cache, write-behind-cache]
gist:
  - "The app loads on a miss and deletes on a write"
  - "The cache layer loads the miss from the DB"
  - "Each write updates cache and DB before returning"
  - "Write the cache now, the DB later in batches"
explain:
  - "Cache-aside: the app reads Redis first and, on a miss, loads the database and stores a copy. On a write it updates the database and deletes the copy. Redis never talks to the database."
  - "Read-through: the app asks only a cache layer, and on a miss the layer loads the row from the database itself. It moves the loading code out of every service."
  - "Write-through: every write updates the database and the cache before it returns, so a read right after the write finds the new value in the cache."
  - "Write-behind: a write updates the cache and returns at once; a background worker writes the database later in batches. Writes are fast, but unflushed writes can be lost."
example: "Merchant 42's fee changes from 2% to 3%. Cache-aside deletes merchant:42:config, so the next read misses and loads 3%. Write-through stores 3% in Redis during the write, so the next read hits. Write-behind stores 3% in the cache and tells the caller success before PostgreSQL has it."
rows:
  - { aspect: "Who reads the DB", a: "The app, on a miss", b: "The cache layer, on a miss", c: "Not covered: pair it with a read pattern", d: "Not covered: pair it with a read pattern" }
  - { aspect: "On a write", a: "Update the DB, then delete the key", b: "Not covered: it is a read pattern", c: "Update cache and DB before returning", d: "Update the cache now, the DB later" }
  - { aspect: "Read after a write", a: "A miss, or briefly stale", b: "Depends on the write policy", c: "Fresh at once", d: "Fresh from the cache" }
  - { aspect: "Main cost", a: "Slow first read; stale data", b: "Needs a library or integration", c: "Slower writes; unread data cached", d: "Writes lost if the cache dies first" }
  - { aspect: "With Redis", a: "Your app code", b: "A library or integration layer", c: "Your app writes both", d: "A Redis Software integration (preview), or your own worker" }
verdict: "Start with cache-aside; add write-through when reads must be fresh at once; use write-behind only when losing recent writes is acceptable."
sayIt: "Cache-aside is my default: the app loads misses and deletes the key after a write. Read-through moves loading into a cache layer, write-through keeps the cache fresh on every write, and write-behind writes the database later, so I never use it for payments."
