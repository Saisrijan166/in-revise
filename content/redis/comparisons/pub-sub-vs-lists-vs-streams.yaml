id: pub-sub-vs-lists-vs-streams
tech: redis
title: Pub/Sub vs Lists vs Streams
compares: [pub-sub, lists, streams]
gist:
  - "Broadcast to whoever listens now; nothing kept"
  - "A queue: each item is popped by one worker"
  - "A stored log with groups, acks and replay"
explain:
  - "Pub/Sub pushes a message on a channel to every client subscribed at that moment. It stores nothing, so it suits live updates where a missed message does no harm."
  - "A list is a queue of strings: a producer pushes at one end and a worker pops at the other, often with BRPOP to wait. Each item goes to one worker and is then removed."
  - "A stream is an append-only log that keeps entries after they are read. Consumer groups share entries among workers and track each one until the worker sends XACK."
example: "Payment 9001 succeeds. A live 'paid' banner on open browser tabs uses Pub/Sub: a missed banner is harmless. Sending the receipt email is a job one worker should do once, so a list works. Billing must never miss a payment and must retry after a crash, so it reads a stream with a consumer group."
rows:
  - { aspect: "Kept after sending", a: "No", b: "Yes, until a worker pops it", c: "Yes, until the stream is trimmed" }
  - { aspect: "Who gets a message", a: "Every subscriber connected now", b: "One worker", c: "Every group; one consumer inside each group" }
  - { aspect: "If the reader crashes", a: "The message is lost", b: "A popped item is lost, unless moved with BLMOVE", c: "The entry stays pending and is delivered again" }
  - { aspect: "Replay old messages", a: "No", b: "No", c: "Yes, read from any entry ID" }
  - { aspect: "Fits", a: "Live notifications", b: "Simple background jobs", c: "Event logs and jobs that must not be lost" }
verdict: "Pub/Sub for fire-and-forget broadcasts, a list for a simple job queue, a stream when messages must be acknowledged or replayed."
sayIt: "Pub/Sub broadcasts to clients connected right now and stores nothing, so it is at-most-once. A list is a simple queue where each item goes to one worker and is removed on pop. A stream stores entries, and consumer groups with XACK give at-least-once delivery and replay."
sources:
