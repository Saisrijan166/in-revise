id: pub-sub-vs-lists-vs-streams
tech: redis
title: Pub/Sub vs Lists vs Streams
compares: [pub-sub, lists, streams]
gist:
  - "Broadcast to whoever listens now; nothing kept"
  - "A queue: each item is popped by one worker"
  - "A stored log with groups, acks and replay"
rows:
  - { aspect: "Kept after sending", a: "No", b: "Yes, until popped", c: "Yes, until trimmed" }
  - { aspect: "Who gets a message", a: "Every subscriber connected now", b: "One worker", c: "Every group; one consumer per group" }
  - { aspect: "Delivery", a: "At-most-once", b: "Lost if a worker crashes, unless BLMOVE", c: "At-least-once with XACK" }
  - { aspect: "Replay old messages", a: "No", b: "No", c: "Yes, read from any entry ID" }
  - { aspect: "Fits", a: "Live notifications", b: "Simple background jobs", c: "Event logs, reliable jobs" }
verdict: "Pub/Sub for fire-and-forget broadcasts, a list for a simple job queue, a stream when messages must be acked or replayed."
sources:
  - title: "Redis Pub/Sub, delivery semantics (Redis docs)"
    url: "https://redis.io/docs/latest/develop/pubsub/"
    verifiedOn: "2026-10-20"
  - title: "LMOVE, pattern: reliable queue (Redis commands)"
    url: "https://redis.io/docs/latest/commands/lmove/"
    verifiedOn: "2026-10-20"
  - title: "Redis Streams: consumer groups (Redis docs)"
    url: "https://redis.io/docs/latest/develop/data-types/streams/"
    verifiedOn: "2026-10-20"
