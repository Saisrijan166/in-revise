    url: "https://redis.io/docs/latest/develop/pubsub/"
    verifiedOn: "2026-10-21"
  - title: "LMOVE, pattern: reliable queue (Redis commands)"
    url: "https://redis.io/docs/latest/commands/lmove/"
    verifiedOn: "2026-10-20"
