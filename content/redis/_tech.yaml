name: Redis
slug: redis
accent: rose
summary: "Redis for interviews: data types, caching patterns, TTL and eviction, atomic commands and Lua, locks and rate limits, persistence, replication, Cluster and Spring Data Redis."
codeLanguages:
  - java
storySpine:
  - step: The database is too slow for hot reads, counters and short-lived state → keep them in Redis, an in-memory store beside the database (or Memcached, Valkey or a managed service)
    cards:
      - what-is-redis
      - redis-and-databases
      - redis-and-memcached
      - redis-licensing-and-forks
  - step: One flat keyspace fills with clashing names, and KEYS freezes the server → name keys type:id:field and walk them with SCAN
    cards:
      - key-design
  - step: "Every payment is cached as one JSON string, so each small change rewrites the whole value → pick the type that fits the data: strings for whole values, hashes or JSON for fields, lists for order, sets for uniqueness, sorted sets for rankings"
    cards:
      - strings
      - hashes
      - json-and-query-engine
      - lists
      - sets
      - sorted-sets
  - step: Counting unique payers, finding nearby kiosks and sharing payment events strain plain keys → HyperLogLog and bitmaps for counts, geo indexes for distance, streams for durable events and Pub/Sub for live fan-out
    cards:
      - bitmaps-hyperloglog
      - geospatial
      - streams
      - pub-sub
  - step: Cached payment statuses stay forever and memory fills up → give each key a TTL, and set maxmemory with an eviction policy as the safety net
    cards:
      - ttl-and-expiration
      - eviction-policies
  - step: One huge key blocks every client while Redis reads or deletes it → find it with redis-cli --bigkeys, split it and delete it with UNLINK
    cards:
      - memory-optimization
  - step: Every payment request reads the same merchant config from PostgreSQL → cache it in Redis with cache-aside or Spring's @Cacheable, and delete the key after each committed update
    cards:
      - cache-aside
      - caching-strategies
      - cache-invalidation
      - spring-cache-abstraction
  - step: A hot key expires, fake ids miss everywhere, or many keys expire together, and the database floods → let one caller rebuild, cache the absence, and add TTL jitter
    cards:
      - cache-problems
  - step: Two app servers add to the same payment counter with GET then SET and lose updates → use INCR, which Redis runs as one atomic command
    cards:
      - single-command-atomicity
  - step: A write must depend on a value just read, and many small calls wait on the network → WATCH with MULTI/EXEC or a Lua script for atomic steps, pipelining for fewer round trips
    cards:
      - transactions-multi-exec
      - lua-and-functions
      - pipelining
  - step: Two app servers pick up the same payment job at once → take a Redis lock with SET NX PX, release it by token, and let the database reject duplicates
    cards:
      - distributed-locks
  - step: Many app servers must share request counts, logins and background jobs → keep rate counters, sessions and job queues in Redis
    cards:
      - rate-limiting-with-redis
      - session-storage
      - queues-with-redis
  - step: A restart empties Redis's memory → save RDB snapshots and an append-only log (AOF) to disk
    cards:
      - persistence-rdb-aof
  - step: One Redis server dies or runs out of room → add replicas, let Sentinel promote one on failure, and shard over Cluster hash slots when data outgrows one primary
    cards:
      - replication
      - sentinel
      - redis-cluster
  - step: Every feature stores a JSON string because nobody asks how the data is used → pick the Redis type from the access pattern, and reach it from Java through Spring Data Redis templates
    cards:
      - redis-playbook
      - spring-data-redis
  - step: "The interviewer says \"now write it\" and Redis code will not come from memory → keep four skeletons: connection properties, set with a TTL and get, an INCR-plus-EXPIRE script, and a SET NX lock released by token"
    cards:
      - redis-code-templates
  - step: Redis restarts and every request hangs, then floods the database → short timeouts, a circuit breaker and a fallback decided per use
    cards:
      - redis-failure-handling
topics:
  - id: basics
    title: Redis Basics
    order: 1
    blurb: What Redis is, why it is fast, how it differs from a database and Memcached, key naming and today's editions.
  - id: data-types
    title: Data Types
    order: 2
    blurb: Strings, hashes, lists, sets, sorted sets, streams, bitmaps, HyperLogLog, geo, JSON and Pub/Sub, each with the problem it fits.
  - id: caching
    title: Caching
    order: 4
    blurb: Cache-aside and the other strategies, keeping the cache fresh, stampede and its cousins, and Spring's cache annotations.
  - id: memory
    title: Expiry and Memory
    order: 3
    blurb: How keys expire, what Redis removes when memory is full, and how to keep keys small.
  - id: atomicity
    title: Atomicity and Scripting
    order: 5
    blurb: Why one command is atomic, MULTI/EXEC with WATCH, Lua scripts and functions, and pipelining.
  - id: coordination
    title: Locks, Limits and Queues
    order: 6
    blurb: Distributed locks done safely, rate limiting, shared sessions and simple queues with Redis.
  - id: operations
    title: Persistence and Scaling
    order: 7
    blurb: RDB and AOF, replication, Sentinel failover and Redis Cluster hash slots.
  - id: java
    title: Redis with Java and Playbook
    order: 8
    blurb: Spring Data Redis, what to do when Redis is down, and a quick way to answer any Redis question.
template: 3
