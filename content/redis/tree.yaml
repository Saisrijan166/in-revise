topics:
  basics:
    - id: what-is-redis
      children:
        - id: redis-in-memory
          label: In-memory data set
          note: The whole data set sits in RAM, so it cannot be larger than memory
        - id: redis-main-thread
          label: One main thread
          note: Serves all requests in sequence; a slow command delays every client
        - id: redis-background-threads
          label: Background threads
          note: Slow disk I/O (2.4+) and background deletes (4.0+) run off the main thread
        - id: redis-io-threads
          label: I/O threads (io-threads)
          note: Optional threads for socket reads, writes and parsing; off by default
        - id: redis-common-uses
          label: Common uses
          note: Cache, session store, leaderboards, job queues, message broker
    - id: redis-and-databases
      children:
        - id: redis-as-cache
          label: Redis as a cache
          note: Holds copies of hot database data; a miss falls back to the database
        - id: redis-as-primary-store
          label: Redis as the main store
          note: Possible with RDB or AOF; recent writes can still be lost in a crash
        - id: relational-database
          label: PostgreSQL / MySQL
          note: Disk-backed; in PostgreSQL the WAL makes committed changes survive a crash
    - id: redis-and-memcached
      children:
        - id: memcached
          label: Memcached
          note: In-memory key-value cache, LRU by default; values are opaque bytes
          children:
            - id: memcached-warm-restart
              label: Warm restart
              note: "Memcached 1.5.18+: keeps data over a clean restart, not a crash"
            - id: memcached-client-hashing
              label: Client picks the server
              note: Servers never talk to each other; the client hashes each key to one
    - id: key-design
      children:
        - id: key-naming-convention
          label: object-type:id:field
          note: Colon-separated sections, e.g. payment:PAY101:attempts
        - id: key-scan-cursor
          label: SCAN cursor
          note: Start at 0 and call again with each returned cursor until it is 0
          children:
            - id: scan-match-option
              label: MATCH
              note: Filters after fetching, so a call can return no keys at all
            - id: scan-count-option
              label: COUNT
              note: A hint for work per call; default 10
            - id: scan-type-option
              label: TYPE
              note: Returns only keys of one value type; Redis 6.0+
        - id: keys-command
          label: KEYS pattern
          note: O(N) over every key and blocks the server; debugging only
        - id: key-inspect-commands
          label: EXISTS / TYPE / DEL
          note: Check, read the type of, or delete a key of any type
        - id: key-multi-read
          label: MGET / MSET
          note: Read or write many string keys in one round trip
    - id: redis-licensing-and-forks
      children:
        - id: redis-bsd-releases
          label: Redis 7.2 and earlier
          note: BSD-3-Clause
        - id: redis-source-available-releases
          label: Redis 7.4 to 7.8
          note: RSALv2 or SSPLv1, after the March 2024 licence change
        - id: redis-open-source-8
          label: Redis Open Source 8.x
          note: Adds AGPLv3 as a choice; former Stack features ship built in
        - id: valkey-fork
          label: Valkey
          note: BSD fork of Redis 7.2.4 under the Linux Foundation, March 2024
        - id: managed-redis-services
          label: Managed services
          note: The provider handles provisioning, patching and node replacement
          children:
            - id: amazon-elasticache-service
              label: Amazon ElastiCache
              note: Runs Valkey, Redis OSS or Memcached; serverless or node-based
            - id: amazon-memorydb-service
              label: Amazon MemoryDB
              note: "Durable: a Multi-AZ transaction log lets it be a primary database"
            - id: azure-managed-redis-service
              label: Azure Managed Redis
              note: Microsoft-run service built on Redis Enterprise software
  data-types:
    - id: strings
      children:
        - id: set-ex-px
          label: SET EX / PX
          note: Write the value and a TTL in seconds or milliseconds in one command
        - id: set-nx-xx
          label: SET NX / XX
          note: Write only if the key is missing (NX) or already exists (XX)
        - id: set-keepttl
          label: SET KEEPTTL
          note: Overwrites the value but keeps the key's remaining TTL
        - id: set-ifeq
          label: SET IFEQ (Redis 8.4+)
          note: "Compare-and-swap: write only if the current value matches"
        - id: mget-mset
          label: MGET / MSET
          note: Many keys in one atomic command; MSETNX sets all or none
    - id: hashes
      children:
        - id: hset-hget
          label: HSET / HGET / HGETALL
          note: Write fields; read one field or the whole hash
        - id: hash-hincrby
          label: HINCRBY
          note: Adds to one integer field atomically; a missing field starts at 0
        - id: hash-field-expiry
          label: HEXPIRE (Redis 7.4+)
          note: TTL on single fields; HSETEX and HGETEX came in Redis 8.0
    - id: lists
      children:
        - id: list-push-pop
          label: LPUSH / RPUSH / LPOP / RPOP
          note: Add or remove at the head (L) or tail (R)
        - id: list-lrange-ltrim
          label: LRANGE / LTRIM
          note: Read a range of indexes; LTRIM keeps only that range
        - id: list-blocking-pop
          label: BLPOP / BRPOP
          note: Pop or wait until an item arrives; timeout 0 waits forever
    - id: sets
      children:
        - id: set-sadd-sismember
          label: SADD / SISMEMBER / SREM
          note: Add, test or remove members; SADD returns how many were new
        - id: set-algebra
          label: SINTER / SUNION / SDIFF
          note: Members in all, in any, or only in the first set
        - id: set-sscan
          label: SSCAN
          note: Walk a big set in pages instead of one big SMEMBERS reply
    - id: sorted-sets
      children:
        - id: zset-zadd-zincrby
          label: ZADD / ZINCRBY
          note: Set a member's score, or add to it and get the new score
        - id: zset-zrange
          label: ZRANGE (REV, BYSCORE, LIMIT)
          note: One range command since Redis 6.2; ZRANGEBYSCORE is deprecated
        - id: zset-zrank
          label: ZRANK / ZREVRANK
          note: 0-based position, counted from the lowest or the highest score
        - id: zset-zremrangebyscore
          label: ZREMRANGEBYSCORE
          note: Deletes all members in a score range, such as old timestamps
    - id: streams
      children:
        - id: stream-xadd
          label: XADD
          note: Appends an entry; MAXLEN ~ trims cheaply in whole nodes
        - id: stream-xread-xrange
          label: XREAD / XRANGE
          note: Wait for new entries (BLOCK), or read a range of IDs
        - id: stream-consumer-groups
          label: Consumer groups
          note: XGROUP CREATE, then XREADGROUP with > for never-delivered entries
          children:
            - id: stream-xack
              label: XACK
              note: Marks entries processed and removes them from the pending list
            - id: stream-xautoclaim
              label: XAUTOCLAIM (Redis 6.2+)
              note: Moves entries idle too long to another consumer
        - id: stream-idempotent-xadd
          label: XADD IDMP (Redis 8.6+)
          note: Producer and message IDs let Redis drop a retried XADD
    - id: bitmaps-hyperloglog
      children:
        - id: bitmap-commands
          label: SETBIT / GETBIT / BITCOUNT / BITOP
          note: Set, read, count and combine bits; bits past the end read as 0
        - id: bitfield-command
          label: BITFIELD
          note: Get, set or add to integers from 1-bit unsigned to 63-bit signed
        - id: hll-commands
          label: PFADD / PFCOUNT / PFMERGE
          note: Add items, estimate distinct count, merge several into one
    - id: geospatial
      children:
        - id: geo-geoadd
          label: GEOADD
          note: Adds longitude, latitude, member; poles past 85.05 degrees not allowed
        - id: geo-geosearch
          label: GEOSEARCH (Redis 6.2+)
          note: Radius or box search; replaces deprecated GEORADIUS
        - id: geo-geodist-geopos
          label: GEODIST / GEOPOS
          note: Distance between two members; a member's coordinates
    - id: json-and-query-engine
      children:
        - id: json-documents
          label: JSON (JSON.SET / JSON.GET)
          note: Stores nested documents; JSONPath reads or changes one part
        - id: redis-search-engine
          label: Redis Search (FT.CREATE / FT.SEARCH)
          note: Indexes hashes and JSON for field, full-text and vector queries
        - id: redis-time-series
          label: Time series
          note: Timestamped numbers with range queries, aggregation, retention
        - id: probabilistic-types
          label: Bloom, Cuckoo, Count-min, Top-K, t-digest
          note: Approximate membership, frequency, top items and percentiles
        - id: redis-vector-sets
          label: Vector sets (Redis 8.0+)
          note: Like a sorted set, but members carry vectors for similarity search
        - id: redis-arrays
          label: "Arrays (Redis 8.8+, preview)"
          note: Sparse arrays of strings addressed by integer index
    - id: pub-sub
      children:
        - id: pubsub-subscribe-publish
          label: SUBSCRIBE / PUBLISH
          note: PUBLISH pushes to every client subscribed to that channel now
        - id: pubsub-psubscribe
          label: PSUBSCRIBE
          note: Subscribe to every channel matching a glob pattern
        - id: pubsub-sharded
          label: SSUBSCRIBE / SPUBLISH (Redis 7.0+)
          note: Shard channels map to slots, so messages stay in one shard
        - id: pubsub-keyspace-notifications
          label: Keyspace notifications
          note: Events on key changes or expiry; off by default
  caching:
    - id: cache-aside
      children:
        - id: cache-read-path
          label: Read path
          note: GET; on a miss read the DB, SET with a TTL, return
        - id: cache-write-path
          label: Write path
          note: Update the DB first, then DEL the key
        - id: cache-hit-ratio-stat
          label: Hit ratio
          note: keyspace_hits / (keyspace_hits + keyspace_misses) in INFO
        - id: cache-prewarm-script
          label: Cache warming
          note: Replay common reads to fill a new node before it takes traffic
    - id: caching-strategies
      children:
        - id: read-through-cache
          label: Read-through
          note: A cache layer loads misses from the DB; Redis needs a library
        - id: write-through-cache
          label: Write-through
          note: A write returns after the cache and the DB are both updated
        - id: write-behind-cache
          label: Write-behind (write-back)
          note: Cache first; a queue writes the DB later, merged and batched
        - id: refresh-ahead-cache
          label: Refresh-ahead
          note: Reload recently read entries in the background before expiry
    - id: cache-invalidation
      children:
        - id: invalidate-by-delete
          label: Delete the key
          note: Idempotent; the next read reloads from the DB
        - id: invalidate-by-update
          label: Update the key
          note: Reordered concurrent writes can leave an older value cached
        - id: invalidate-after-commit
          label: Evict after commit
          note: "Spring: transactionAware() on the RedisCacheManager builder"
        - id: invalidate-ttl-backstop
          label: TTL backstop
          note: Bounds how long a missed invalidation serves stale data
        - id: invalidate-from-cdc
          label: CDC invalidation
          note: Read the DB commit log, then delete keys; Redis RDI does CDC
    - id: cache-problems
      children:
        - id: cache-stampede
          label: Cache stampede
          note: Many callers rebuild one expired hot key at the same time
          children:
            - id: stampede-rebuild-lock
              label: Rebuild lock (SET NX)
              note: Only the lock holder reloads; others wait or get the old value
            - id: stampede-early-refresh
              label: Probabilistic early refresh
              note: Callers refresh at random just before expiry (XFetch)
        - id: cache-penetration
          label: Cache penetration
          note: Lookups for ids that exist neither in Redis nor in the DB
          children:
            - id: negative-cache-entry
              label: Negative caching
              note: Store 'not found' with a short TTL
            - id: penetration-bloom-check
              label: Bloom filter check
              note: A 'no' is certain, so skip the DB for unknown ids
        - id: cache-avalanche
          label: Cache avalanche
          note: Many keys expire together, or a node starts empty
          children:
            - id: ttl-jitter-offset
              label: TTL jitter
              note: A random offset, so keys loaded together expire apart
        - id: hot-key-traffic
          label: Hot key
          note: One key gets a large share of traffic; its node saturates
          children:
            - id: hotkeys-cli-scan
              label: redis-cli --hotkeys
              note: Samples keys; works only with an LFU maxmemory-policy
            - id: hotkeys-command
              label: HOTKEYS (Redis 8.6+)
              note: Tracks the top keys by CPU time or network bytes
            - id: client-side-cache-tracking
              label: Client-side caching (Redis 6+)
              note: App keeps a local copy; Redis sends invalidation messages
            - id: hot-key-copies
              label: Key copies
              note: Same value under several keys on several nodes; read any one
    - id: spring-cache-abstraction
      children:
        - id: enable-caching-switch
          label: "@EnableCaching"
          note: Turns the cache annotations on; without it nothing is cached
        - id: cacheable-annotation
          label: "@Cacheable"
          note: On a hit, return the cached value and skip the method
        - id: cacheput-annotation
          label: "@CachePut"
          note: Always run the method, then store its result
        - id: cacheevict-annotation
          label: "@CacheEvict"
          note: Remove one entry, or all with allEntries = true
        - id: redis-cache-manager-bean
          label: RedisCacheManager
          note: Auto-configured by Spring Boot when Redis is available
          children:
            - id: redis-cache-locking-writer
              label: Locking cache writer
              note: Opt-in; locks the whole cache, not one entry
  memory:
    - id: ttl-and-expiration
      children:
        - id: ttl-lazy-expiry
          label: Lazy (passive) expiry
          note: Deleted when a command touches the key after its TTL
        - id: ttl-active-expiry
          label: Active expiry
          note: A background cycle samples keys with a TTL, deletes expired ones
        - id: ttl-replica-expiry
          label: Expiry on replicas
          note: Replicas wait for the DEL the primary sends
        - id: ttl-expire-options
          label: EXPIRE NX / XX / GT / LT
          note: Set only if no TTL, has one, longer or shorter (Redis 7.0+)
        - id: ttl-no-default
          label: No TTL by default
          note: A new key lives until deleted or evicted
    - id: eviction-policies
      children:
        - id: evict-noeviction
          label: noeviction
          note: Evicts nothing; writes needing memory fail, reads work
        - id: evict-allkeys
          label: allkeys-* policies
          note: Choose among all keys, with or without a TTL
          children:
            - id: evict-allkeys-lru
              label: allkeys-lru
              note: Least recently used; a good default for a cache
            - id: evict-allkeys-lfu
              label: allkeys-lfu
              note: Least frequently used, by a decaying counter
            - id: evict-allkeys-lrm
              label: allkeys-lrm
              note: "Least recently modified: reads do not count (Redis 8.6+)"
            - id: evict-allkeys-random
              label: allkeys-random
              note: A random key; fits evenly spread access
        - id: evict-volatile
          label: volatile-* policies
          note: Choose only among keys that have a TTL
          children:
            - id: evict-volatile-same
              label: volatile-lru / -lfu / -lrm / -random
              note: The allkeys rules, limited to keys with a TTL
            - id: evict-volatile-ttl
              label: volatile-ttl
              note: The key with the shortest TTL left goes first
        - id: evict-sampling
          label: Approximated LRU / LFU
          note: Samples random keys plus a pool of good candidates
    - id: memory-optimization
      children:
        - id: mem-bigkeys-scan
          label: redis-cli --bigkeys
          note: Finds the largest key per type, using SCAN
        - id: mem-memkeys-scan
          label: redis-cli --memkeys
          note: Finds the keys that use the most bytes
        - id: mem-usage-command
          label: MEMORY USAGE key
          note: Bytes one key uses; samples 5 nested values by default
        - id: mem-unlink-delete
          label: UNLINK
          note: Unlinks at once; another thread frees the memory
        - id: mem-compact-encodings
          label: Compact encodings
          note: Small collections are stored in a dense format
          children:
            - id: mem-encoding-listpack
              label: listpack
              note: Small hashes, lists, sorted sets (7.0+) and sets (7.2+)
            - id: mem-encoding-intset
              label: intset
              note: Small sets of integers only
  atomicity:
    - id: single-command-atomicity
      children:
        - id: lost-update-race
          label: Lost update (GET + SET)
          note: Two clients read the same value; the second write wipes the first
        - id: incr-family
          label: INCR, INCRBY, DECR
          note: Add to a 64-bit signed integer in one step; missing key starts at 0
          children:
            - id: hincrby-field
              label: HINCRBY
              note: "Same, for one field of a hash: per-method payment counts"
            - id: incrbyfloat-cmd
              label: INCRBYFLOAT
              note: Adds to a double-precision float, so results can round
        - id: counter-pattern
          label: Counter pattern
          note: One INCR per event; one key per user and day, plus EXPIRE
        - id: set-nx-cmd
          label: SET NX
          note: Writes only if the key does not exist yet
        - id: getdel-getex
          label: GETDEL / GETEX
          note: "Redis 6.2+: read and delete, or read and set a TTL, in one step"
        - id: set-ifeq-cmd
          label: SET IFEQ
          note: "Redis 8.4+: write only if the current value equals a given one"
    - id: transactions-multi-exec
      children:
        - id: multi-exec-queue
          label: MULTI … EXEC
          note: Commands reply QUEUED; EXEC runs them all in order
        - id: discard-cmd
          label: DISCARD
          note: Drops the queued commands; none of them runs
        - id: watch-cas
          label: WATCH
          note: EXEC returns nil if a watched key changed, even by expiry
          children:
            - id: unwatch-cmd
              label: UNWATCH
              note: Forgets all watched keys; EXEC also forgets them
        - id: tx-runtime-error
          label: Run-time error
          note: Only that command fails, such as WRONGTYPE; the others still run
        - id: tx-queue-error
          label: Queue-time error
          note: "Bad syntax or out of memory: EXEC refuses all with EXECABORT"
    - id: lua-and-functions
      children:
        - id: eval-cmd
          label: EVAL
          note: Sends the script text, the key count, then keys and values
        - id: evalsha-cmd
          label: EVALSHA + SCRIPT LOAD
          note: Runs a cached script by its SHA1; NOSCRIPT if the cache lost it
        - id: keys-argv
          label: KEYS and ARGV
          note: Key names go in KEYS, every other input in ARGV
        - id: redis-call-pcall
          label: redis.call vs redis.pcall
          note: call sends an error to the client; pcall returns it to the script
        - id: busy-script
          label: Busy script
          note: Past busy-reply-threshold, other clients get BUSY errors
          children:
            - id: script-kill-cmd
              label: SCRIPT KILL / FUNCTION KILL
              note: Stops a slow script only if it has not written anything
            - id: shutdown-nosave
              label: SHUTDOWN NOSAVE
              note: Stops the server if a slow script has written and you cannot wait
        - id: functions-fcall
          label: Redis Functions (FCALL)
          note: "Redis 7.0+: named functions in libraries, saved in AOF, replicated"
          children:
            - id: function-load-cmd
              label: FUNCTION LOAD
              note: Loads a Lua library; REPLACE swaps the whole library
    - id: pipelining
      children:
        - id: rtt-cost
          label: Round-trip cost
          note: At 250 ms per round trip, one-at-a-time calls reach 4 per second
        - id: variadic-commands
          label: MGET / MSET
          note: One command for many keys; preferred over a pipeline
          children:
            - id: msetex-cmd
              label: MSETEX
              note: "Redis 8.4+: set many keys with one shared expiry"
        - id: pipeline-batches
          label: Batch size
          note: Replies wait in server memory; send about 10k, read, repeat
        - id: pipeline-syscalls
          label: Fewer system calls
          note: Many commands per read() call; throughput up to about 10x
        - id: execute-pipelined
          label: executePipelined
          note: "Spring Data Redis: runs a callback in a pipeline, returns replies"
  coordination:
    - id: distributed-locks
      children:
        - id: lock-set-nx-px
          label: SET NX PX
          note: Sets the key only if absent, with an expiry; OK means you hold it
          children:
            - id: lock-owner-token
              label: Owner token
              note: A random value, unique per lock request, stored as the value
            - id: lock-lease
              label: Lease (PX)
              note: The TTL frees a crashed holder's lock, and a slow holder's too
        - id: lock-safe-release
          label: Safe release
          note: Delete the key only if it still holds my token, atomically
          children:
            - id: lock-release-script
              label: Compare-and-delete script
              note: "Lua: GET, compare with my token, then DEL"
            - id: lock-release-delex
              label: DELEX IFEQ
              note: "Redis 8.4+: deletes only if the value equals the given one"
        - id: lock-fencing-token
          label: Fencing token
          note: A rising number per grant; storage rejects older numbers
        - id: lock-redlock
          label: Redlock
          note: Lock on N (say 5) independent primaries; held if a majority grant it in time
        - id: lock-redisson
          label: Redisson RLock
          note: Java lock; a watchdog renews it while the holder lives (30 s default)
          children:
            - id: lock-redisson-fenced
              label: RFencedLock
              note: Redisson lock that returns a fencing token on each grant
    - id: rate-limiting-with-redis
      children:
        - id: rate-fixed-window
          label: Fixed window
          note: One counter per client per clock window
          children:
            - id: rate-incr-expire
              label: INCR + EXPIRE in Lua
              note: Set the TTL on the first hit, in the same script
            - id: rate-increx
              label: INCREX
              note: "Redis 8.8+: increment, upper bound and TTL in one command"
        - id: rate-sliding-window
          label: Sliding window
          note: Counts requests in a rolling period, not a clock window
          children:
            - id: rate-sliding-log
              label: Sliding window log
              note: "Sorted set of request times: exact, one entry per request"
            - id: rate-sliding-counter
              label: Sliding window counter
              note: Weights the previous window's count by time left
        - id: rate-token-bucket
          label: Token bucket
          note: Hash of tokens and last refill time; allows short bursts
        - id: rate-http-429
          label: 429 + Retry-After
          note: HTTP status for rate limiting; Retry-After says when to retry
    - id: session-storage
      children:
        - id: session-sticky
          label: Sticky sessions
          note: Pins a user to one server; hurts scaling and deploys
        - id: session-redis-hash
          label: One hash per session
          note: "Spring Session key: spring:session:sessions:<id>"
        - id: session-idle-ttl
          label: Idle timeout as TTL
          note: Expires at last access plus the max inactive interval
        - id: session-spring-session
          label: Spring Session Data Redis
          note: Replaces HttpSession with a Redis-backed one via a filter
          children:
            - id: session-repo-default
              label: RedisSessionRepository
              note: "Default: plain lookup by session id"
            - id: session-repo-indexed
              label: RedisIndexedSessionRepository
              note: "Adds indexes: find a user's sessions, session events"
    - id: queues-with-redis
      children:
        - id: queue-list-brpop
          label: LPUSH + BRPOP
          note: Simple queue; a job is lost if the worker crashes
        - id: queue-reliable-blmove
          label: BLMOVE + processing list
          note: Redis 6.2+, replaces BRPOPLPUSH; LREM the job when done
        - id: queue-delayed-zset
          label: Delayed jobs (sorted set)
          note: Score is the run time; ZREM claims a due job
        - id: queue-stream-groups
          label: Stream consumer groups
          note: Each entry to one consumer per group; at-least-once
        - id: queue-pubsub-broadcast
          label: Pub/Sub broadcast
          note: At-most-once, to subscribers connected now
        - id: queue-kafka
          label: Kafka instead
          note: Stores events on disk as long as you want, for replay
  operations:
    - id: persistence-rdb-aof
      children:
        - id: rdb-snapshot
          label: RDB snapshot
          note: A point-in-time copy of all data in one file, dump.rdb
          children:
            - id: bgsave
              label: BGSAVE
              note: Forks a child to write the file; the parent keeps serving clients
            - id: rdb-save-points
              label: save <seconds> <changes>
              note: Snapshot once that many seconds pass with at least that many writes
        - id: aof-log
          label: AOF (append-only file)
          note: Logs each write command; Redis replays it at startup
          children:
            - id: appendfsync
              label: appendfsync
              note: "always, everysec or no: how often the log is flushed to disk"
            - id: aof-rewrite
              label: AOF rewrite
              note: Background job that rebuilds the log as the shortest command set
        - id: rdb-plus-aof
          label: RDB + AOF
          note: "Both at once: the docs advise it for PostgreSQL-like data safety"
        - id: no-persistence
          label: No persistence
          note: 'save "" and appendonly no: a cache that restarts empty'
    - id: replication
      children:
        - id: replicaof-command
          label: REPLICAOF host port
          note: Makes a server a replica; REPLICAOF NO ONE makes it a primary again
        - id: full-resync
          label: Full sync
          note: Primary sends an RDB file, then the writes it buffered meanwhile
        - id: partial-resync
          label: Partial resync (PSYNC)
          note: Replica sends its replication ID and offset; gets only what it missed
          children:
            - id: replication-backlog
              label: Replication backlog
              note: Primary's buffer of recent writes that makes partial resync possible
        - id: read-only-replica
          label: Read-only replica
          note: With replica-read-only, a replica rejects all write commands
        - id: wait-command
          label: WAIT numreplicas timeout
          note: Blocks until that many replicas confirm earlier writes, or timeout
        - id: min-replicas-to-write
          label: min-replicas-to-write
          note: Primary refuses writes unless N replicas lag at most M seconds
    - id: sentinel
      children:
        - id: sentinel-monitoring
          label: Monitoring
          note: Checks that primaries and replicas answer as expected
        - id: sentinel-notification
          label: Notification
          note: Tells admins or programs, through an API, that an instance failed
        - id: sentinel-auto-failover
          label: Automatic failover
          note: Promotes a replica and repoints the others to it
        - id: sentinel-config-provider
          label: Configuration provider
          note: Clients ask Sentinels for the current primary's address
        - id: sentinel-quorum
          label: Quorum
          note: Sentinels that must agree the primary is unreachable
          children:
            - id: sentinel-sdown-odown
              label: SDOWN / ODOWN
              note: Down for one Sentinel / down once the quorum agrees
    - id: redis-cluster
      children:
        - id: hash-slot
          label: Hash slots
          note: 16384 slots; slot = CRC16(key) mod 16384
          children:
            - id: cluster-hash-tag
              label: Hash tag {...}
              note: Only the text inside {} is hashed, so related keys share a slot
        - id: cluster-shard-replicas
          label: Primary + replicas
          note: Each primary owns slots; a replica takes over if it fails
        - id: moved-redirect
          label: MOVED
          note: The slot lives on another node now; the client updates its map
        - id: ask-redirect
          label: ASK
          note: "Slot migrating: send only the next command there, after ASKING"
        - id: crossslot-error
          label: CROSSSLOT
          note: Error when one command's keys hash to different slots
        - id: cluster-bus
          label: Cluster bus
          note: Node-to-node port, by default the data port + 10000
  java:
    - id: spring-data-redis
      children:
        - id: sdr-string-redis-template
          label: StringRedisTemplate
          note: String keys and values stored as text; ready to inject
        - id: sdr-redis-template
          label: RedisTemplate<K, V>
          note: Any types; JDK serialisation unless you set serialisers
        - id: sdr-serializers
          label: Serialisers
          note: Turn keys and values into bytes; set per template
          children:
            - id: sdr-jdk-serializer
              label: JdkSerializationRedisSerializer
              note: Default for RedisTemplate and RedisCache; Java-only bytes
            - id: sdr-string-serializer
              label: StringRedisSerializer
              note: Plain text; RedisSerializer.string() uses UTF-8
            - id: sdr-json-serializer
              label: JacksonJsonRedisSerializer
              note: JSON through Jackson 3 (Spring Data Redis 4.0+)
        - id: sdr-lettuce
          label: Lettuce
          note: Default client; Netty-based, shares one thread-safe connection
        - id: sdr-jedis
          label: Jedis
          note: Blocking client; pooled connections through commons-pool2
        - id: sdr-reactive-template
          label: ReactiveRedisTemplate
          note: Non-blocking template; Lettuce only
        - id: sdr-redis-hash
          label: "@RedisHash repositories"
          note: A repository saves each object as a hash at keyspace:id
    - id: redis-failure-handling
      children:
        - id: fail-cache-miss
          label: "Cache: fall back to the DB"
          note: Treat a Redis error as a miss; cap the load on the database
        - id: fail-open-choice
          label: Fail open
          note: "Redis down: allow the request; served, but unprotected"
        - id: fail-closed-choice
          label: Fail closed
          note: "Redis down: deny the request; protected, but that path is down"
        - id: fail-client-timeouts
          label: Client timeouts
          note: spring.data.redis.timeout and connect-timeout; keep them short
        - id: fail-circuit-breaker
          label: Circuit breaker
          note: "Closed, open, half-open: fail fast while Redis keeps failing"
        - id: fail-cache-error-handler
          label: CacheErrorHandler
          note: Spring hook for cache errors; the default rethrows them
        - id: fail-monitoring
          label: Monitoring commands
          note: "Built into Redis: INFO, SLOWLOG and LATENCY"
          children:
            - id: fail-info
              label: INFO
              note: "Stats by section: memory, clients, stats, replication"
            - id: fail-slowlog
              label: SLOWLOG GET
              note: Commands over 10 ms by default (Redis Open Source 8.10); network time excluded
            - id: fail-latency-monitor
              label: LATENCY DOCTOR
              note: Explains latency spikes; off until latency-monitor-threshold is set
    - id: redis-playbook
      children:
        - id: playbook-documents
          label: Documents
          note: String, hash or JSON; JSON uses the most memory, strings the least
        - id: playbook-collections
          label: Collections
          note: Set, sorted set or bitmap; only sorted sets keep an order
        - id: playbook-sequences
          label: Sequences
          note: List, stream or sorted set; streams add consumer groups
        - id: playbook-specialised
          label: Specialised types
          note: Geo, probabilistic, time series and vector sets
