name: Linux
slug: linux
accent: yellow
template: 3
summary: "Linux for interviews: the shell and filesystem, files and permissions, grep and pipes, processes and signals, packages, services, logs and networking."
codeLanguages:
  - java
storySpine:
  - step: "You SSH into a bare server and see only a prompt → the shell reads your commands and the kernel runs them on the hardware"
    cards: [what-is-linux, linux-architecture, kernel-and-userspace, shell-and-terminal, running-commands]
  - step: "You need to find where the app and its logs live → learn the standard directory tree and move around it"
    cards: [filesystem-hierarchy, paths-absolute-relative, navigation]
  - step: "You must drop the new build in place and read the log → create, copy, move and view files"
    cards: [file-operations, viewing-files, editing-files]
  - step: "You want one config in two places and a quick wildcard delete → use links and globbing"
    cards: [links-hard-symbolic, wildcards-globbing]
  - step: "The app cannot write its data folder and a secret file is world-readable → fix permissions and ownership"
    cards: [file-permissions, chmod, ownership, special-permissions]
  - step: "Only the right people should run and deploy the service → manage users, groups and sudo"
    cards: [users-and-groups, sudo-and-root]
  - step: "A 2 GB log hides one error and you must find every TODO in the code → search text with grep and files with find"
    cards: [grep, find, text-processing]
  - step: "You want only the error lines saved to a file → connect commands with pipes and redirect their output"
    cards: [pipes-and-redirection]
  - step: "The service is stuck and eating CPU → list processes, then stop it the gentle way before the forceful one"
    cards: [processes, monitoring-processes, signals, zombie-and-orphan]
  - step: "You must run the app in the background and keep it alive after you log out → use jobs, &, and nohup"
    cards: [jobs-and-background]
  - step: "The server is missing a tool → install it with the package manager"
    cards: [package-management]
  - step: "The service must start on boot and you need its logs → manage it with systemd and read journald"
    cards: [systemd-services, journald-logs]
  - step: "The box is slow and the disk is full → check memory, disk and load"
    cards: [system-monitoring]
  - step: "The app needs config from the environment and a nightly backup → set env vars and schedule cron, then package the backup"
    cards: [env-variables, cron-scheduling, archives-compression]
  - step: "You automate the whole deploy in one file → write a small shell script"
    cards: [shell-scripting]
  - step: "The service cannot reach the database and nobody can curl it → check addresses, ports, DNS and copy files over SSH"
    cards: [networking-basics, network-commands, http-tools, ports-and-sockets, dns-tools, ssh-and-scp]
topics:
  - { id: basics, title: "Linux Basics", order: 1, blurb: "The kernel, the shell, and how commands run." }
  - { id: filesystem, title: "Filesystem and Navigation", order: 2, blurb: "The directory tree and moving around it." }
  - { id: files, title: "Working with Files", order: 3, blurb: "Create, view, edit, link and match files." }
  - { id: permissions, title: "Permissions and Users", order: 4, blurb: "Who can read, write, run, and act as root." }
  - { id: text, title: "Search and Text", order: 5, blurb: "grep, find, pipes and redirection." }
  - { id: processes, title: "Processes and Jobs", order: 6, blurb: "Run, watch, signal and background programs." }
  - { id: system, title: "Packages, Services and System", order: 7, blurb: "Install software, run services, monitor, schedule." }
  - { id: networking, title: "Networking", order: 8, blurb: "Addresses, ports, DNS and remote access." }
