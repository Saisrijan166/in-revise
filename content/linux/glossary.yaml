terms:
  - id: linux-kernel
    term: Kernel
    definition: "The core of the OS: it manages the CPU, memory, processes and devices, and runs in privileged mode."
    see: kernel-and-userspace
    source: { title: "The Linux Kernel documentation", url: "https://docs.kernel.org/admin-guide/README.html", verifiedOn: "2026-11-02" }
  - id: shell
    term: Shell
    aka: ["command interpreter"]
    definition: "A program that reads your typed commands and asks the kernel to run them; bash is the common one."
    see: shell-and-terminal
    source: { title: "Bash Reference Manual: Introduction", url: "https://www.gnu.org/software/bash/manual/html_node/Introduction.html", verifiedOn: "2026-11-02" }
  - id: terminal
    term: Terminal
    aka: ["terminal emulator"]
    definition: "The window or console where you type into a shell and see its output."
    see: shell-and-terminal
    source: { title: "GNOME Terminal overview", url: "https://help.gnome.org/users/gnome-terminal/stable/overview.html.en", verifiedOn: "2026-11-02" }
  - id: bash
    term: Bash
    definition: "The GNU Bourne-Again Shell, the default command shell on most Linux systems."
    see: shell-and-terminal
    source: { title: "Bash Reference Manual", url: "https://www.gnu.org/software/bash/manual/bash.html", verifiedOn: "2026-11-02" }
  - id: distribution
    term: Distribution (distro)
    aka: ["distro"]
    definition: "A complete OS built around the Linux kernel plus userland tools, e.g. Ubuntu, Debian, Fedora."
    see: what-is-linux
    source: { title: "Debian: What is Debian?", url: "https://www.debian.org/intro/about", verifiedOn: "2026-11-02" }
  - id: unix
    term: Unix
    definition: "An older family of operating systems; Linux is Unix-like but shares none of its original code."
    see: what-is-linux
    source: { title: "The Open Group: What is UNIX?", url: "https://unix.org/what_is_unix.html", verifiedOn: "2026-11-02" }
  - id: root-user
    term: root
    aka: ["superuser"]
    definition: "The administrator account, UID 0, which bypasses normal permission checks."
    see: sudo-and-root
    source: { title: "credentials(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/credentials.7.html", verifiedOn: "2026-11-02" }
  - id: sudo
    term: sudo
    definition: "Run one command with elevated privileges, using your own password, if the sudoers policy allows."
    see: sudo-and-root
    source: { title: "sudo(8) - Linux manual page", url: "https://man7.org/linux/man-pages/man8/sudo.8.html", verifiedOn: "2026-11-02" }
  - id: su
    term: su
    definition: "Switch to another user (by default root) and start a shell as them; needs that user's password."
    see: sudo-and-root
    source: { title: "su(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/su.1.html", verifiedOn: "2026-11-02" }
  - id: daemon
    term: Daemon
    definition: "A background service that runs without a terminal, usually named ending in d, like sshd or systemd."
    see: zombie-and-orphan
    source: { title: "daemon(7) - systemd", url: "https://www.freedesktop.org/software/systemd/man/latest/daemon.html", verifiedOn: "2026-11-02" }
  - id: process
    term: Process
    definition: "A running instance of a program, with its own id (PID), memory and state."
    see: processes
    source: { title: "proc(5) - Linux manual page", url: "https://man7.org/linux/man-pages/man5/proc.5.html", verifiedOn: "2026-11-02" }
  - id: pid
    term: PID
    aka: ["process id"]
    definition: "The unique number that identifies a running process; PID 1 is init/systemd."
    see: processes
    source: { title: "proc(5) - Linux manual page", url: "https://man7.org/linux/man-pages/man5/proc.5.html", verifiedOn: "2026-11-02" }
  - id: ppid
    term: PPID
    definition: "The process id of a process's parent."
    see: processes
    source: { title: "proc(5) - Linux manual page", url: "https://man7.org/linux/man-pages/man5/proc.5.html", verifiedOn: "2026-11-02" }
  - id: zombie-process
    term: Zombie process
    definition: "A finished process still in the table because its parent has not read its exit status."
    see: zombie-and-orphan
    source: { title: "wait(2) - Linux manual page", url: "https://man7.org/linux/man-pages/man2/wait.2.html", verifiedOn: "2026-11-02" }
  - id: orphan-process
    term: Orphan process
    definition: "A still-running process whose parent has died; it is re-parented to init (PID 1)."
    see: zombie-and-orphan
    source: { title: "proc(5) - Linux manual page", url: "https://man7.org/linux/man-pages/man5/proc.5.html", verifiedOn: "2026-11-02" }
  - id: signal
    term: Signal
    definition: "A short message the kernel delivers to a process to interrupt, stop or notify it."
    see: signals
    source: { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - id: sigterm
    term: SIGTERM
    definition: "Signal 15: the default of kill, a polite request to stop that the process can handle."
    see: signals
    source: { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - id: sigkill
    term: SIGKILL
    definition: "Signal 9: force-kill that cannot be caught or ignored, so no cleanup runs."
    see: signals
    source: { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - id: sigint
    term: SIGINT
    definition: "Signal 2: sent by Ctrl+C to interrupt the foreground process."
    see: signals
    source: { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - id: sighup
    term: SIGHUP
    definition: "Signal 1: terminal hangup; often repurposed to tell a daemon to reload its config."
    see: jobs-and-background
    source: { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - id: fhs
    term: Filesystem Hierarchy Standard
    aka: ["FHS"]
    definition: "The standard layout of Linux directories under /, such as /etc, /var, /home, /usr."
    see: filesystem-hierarchy
    source: { title: "Filesystem Hierarchy Standard 3.0", url: "https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html", verifiedOn: "2026-11-02" }
  - id: absolute-path
    term: Absolute path
    definition: "A path that starts from the root /, so it means the same from any directory."
    see: paths-absolute-relative
    source: { title: "path_resolution(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/path_resolution.7.html", verifiedOn: "2026-11-02" }
  - id: relative-path
    term: Relative path
    definition: "A path that starts from the current directory, using . for here and .. for the parent."
    see: paths-absolute-relative
    source: { title: "path_resolution(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/path_resolution.7.html", verifiedOn: "2026-11-02" }
  - id: home-directory
    term: Home directory
    definition: "A user's personal directory, usually /home/<name>, shown as ~ in the shell."
    see: filesystem-hierarchy
    source: { title: "Filesystem Hierarchy Standard: /home", url: "https://refspecs.linuxfoundation.org/FHS_3.0/fhs/ch03s08.html", verifiedOn: "2026-11-02" }
  - id: working-directory
    term: Working directory
    aka: ["current directory"]
    definition: "The directory you are currently in; pwd prints it and relative paths start from it."
    see: navigation
    source: { title: "pwd(1) - GNU Coreutils", url: "https://www.gnu.org/software/coreutils/manual/html_node/pwd-invocation.html", verifiedOn: "2026-11-02" }
  - id: inode
    term: inode
    definition: "The on-disk record holding a file's metadata and data location; names in directories point to it."
    see: links-hard-symbolic
    source: { title: "inode(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/inode.7.html", verifiedOn: "2026-11-02" }
  - id: hard-link
    term: Hard link
    definition: "Another directory name for the same inode; the data lives until the last link is removed."
    see: links-hard-symbolic
    source: { title: "link(2) - Linux manual page", url: "https://man7.org/linux/man-pages/man2/link.2.html", verifiedOn: "2026-11-02" }
  - id: symbolic-link
    term: Symbolic link
    aka: ["symlink", "soft link"]
    definition: "A small file holding a path to another file; it can cross filesystems but breaks if the target moves."
    see: links-hard-symbolic
    source: { title: "symlink(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/symlink.7.html", verifiedOn: "2026-11-02" }
  - id: permissions
    term: Permissions
    definition: "The read, write and execute rights a file grants to its user, group and others."
    see: file-permissions
    source: { title: "chmod(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/chmod.1.html", verifiedOn: "2026-11-02" }
  - id: chmod
    term: chmod
    definition: "Change a file's permission bits, numerically (755) or symbolically (u+x)."
    see: chmod
    source: { title: "chmod(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/chmod.1.html", verifiedOn: "2026-11-02" }
  - id: chown
    term: chown
    definition: "Change the owning user, and optionally group, of a file."
    see: ownership
    source: { title: "chown(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/chown.1.html", verifiedOn: "2026-11-02" }
  - id: setuid
    term: setuid / setgid
    definition: "A bit that runs a program with its owner's (or group's) rights, not the caller's."
    see: special-permissions
    source: { title: "credentials(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/credentials.7.html", verifiedOn: "2026-11-02" }
  - id: sticky-bit
    term: Sticky bit
    definition: "On a directory like /tmp, it lets only a file's owner delete or rename it."
    see: special-permissions
    source: { title: "chmod(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/chmod.1.html", verifiedOn: "2026-11-02" }
  - id: umask
    term: umask
    definition: "The mask that removes permission bits from newly created files and directories."
    see: file-permissions
    source: { title: "umask(1p) - POSIX manual page", url: "https://man7.org/linux/man-pages/man1/umask.1p.html", verifiedOn: "2026-11-02" }
  - id: environment-variable
    term: Environment variable
    definition: "A named value available to processes, such as PATH or HOME."
    see: env-variables
    source: { title: "environ(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/environ.7.html", verifiedOn: "2026-11-02" }
  - id: path-variable
    term: PATH
    definition: "The list of directories the shell searches to find a command you type."
    see: env-variables
    source: { title: "environ(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/environ.7.html", verifiedOn: "2026-11-02" }
  - id: export
    term: export
    definition: "Mark a shell variable so child processes inherit it as an environment variable."
    see: env-variables
    source: { title: "Bash Reference Manual: Bourne Shell Builtins", url: "https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html", verifiedOn: "2026-11-02" }
  - id: pipe
    term: Pipe
    definition: "The | operator that sends one command's output into the next command's input."
    see: pipes-and-redirection
    source: { title: "Bash Reference Manual: Pipelines", url: "https://www.gnu.org/software/bash/manual/html_node/Pipelines.html", verifiedOn: "2026-11-02" }
  - id: redirection
    term: Redirection
    definition: "Sending a command's input or output to a file with operators like >, >> and <."
    see: pipes-and-redirection
    source: { title: "Bash Reference Manual: Redirections", url: "https://www.gnu.org/software/bash/manual/html_node/Redirections.html", verifiedOn: "2026-11-02" }
  - id: stdout
    term: Standard streams
    aka: ["stdin", "stdout", "stderr"]
    definition: "The three default channels: stdin (0) input, stdout (1) output, stderr (2) errors."
    see: pipes-and-redirection
    source: { title: "stdin(3) - Linux manual page", url: "https://man7.org/linux/man-pages/man3/stdin.3.html", verifiedOn: "2026-11-02" }
  - id: grep
    term: grep
    definition: "Search files or input for lines matching a pattern or regular expression."
    see: grep
    source: { title: "grep(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/grep.1.html", verifiedOn: "2026-11-02" }
  - id: find
    term: find
    definition: "Search the directory tree for files by name, type, size or time, and act on them."
    see: find
    source: { title: "find(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/find.1.html", verifiedOn: "2026-11-02" }
  - id: regex
    term: Regular expression
    aka: ["regex"]
    definition: "A pattern language for matching text, used by grep, sed and many tools."
    see: grep
    source: { title: "regex(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/regex.7.html", verifiedOn: "2026-11-02" }
  - id: cron
    term: cron
    definition: "The service that runs scheduled commands at set times."
    see: cron-scheduling
    source: { title: "crontab(5) - Linux manual page", url: "https://man7.org/linux/man-pages/man5/crontab.5.html", verifiedOn: "2026-11-02" }
  - id: crontab
    term: crontab
    definition: "The file, and the command, that lists a user's scheduled cron jobs."
    see: cron-scheduling
    source: { title: "crontab(5) - Linux manual page", url: "https://man7.org/linux/man-pages/man5/crontab.5.html", verifiedOn: "2026-11-02" }
  - id: systemd
    term: systemd
    definition: "The common init system and service manager on modern Linux; it is PID 1."
    see: systemd-services
    source: { title: "systemd(1)", url: "https://www.freedesktop.org/software/systemd/man/latest/systemd.html", verifiedOn: "2026-11-02" }
  - id: systemctl
    term: systemctl
    definition: "The command to start, stop, enable and inspect systemd services."
    see: systemd-services
    source: { title: "systemctl(1)", url: "https://www.freedesktop.org/software/systemd/man/latest/systemctl.html", verifiedOn: "2026-11-02" }
  - id: journald
    term: journald / journalctl
    definition: "systemd's logging service and the journalctl command that reads its logs."
    see: journald-logs
    source: { title: "journalctl(1)", url: "https://www.freedesktop.org/software/systemd/man/latest/journalctl.html", verifiedOn: "2026-11-02" }
  - id: service
    term: Service (unit)
    definition: "A background program managed by systemd, defined by a .service unit file."
    see: systemd-services
    source: { title: "systemd.service(5)", url: "https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html", verifiedOn: "2026-11-02" }
  - id: package-manager
    term: Package manager
    definition: "A tool that installs, updates and removes software and its dependencies, like apt or dnf."
    see: package-management
    source: { title: "apt(8) - Debian manual page", url: "https://manpages.debian.org/stable/apt/apt.8.en.html", verifiedOn: "2026-11-02" }
  - id: apt
    term: apt
    definition: "The package manager on Debian and Ubuntu: apt update, upgrade, install, remove."
    see: package-management
    source: { title: "apt(8) - Debian manual page", url: "https://manpages.debian.org/stable/apt/apt.8.en.html", verifiedOn: "2026-11-02" }
  - id: repository
    term: Repository
    aka: ["repo"]
    definition: "A server holding packages a package manager can install from."
    see: package-management
    source: { title: "sources.list(5) - Debian", url: "https://manpages.debian.org/stable/apt/sources.list.5.en.html", verifiedOn: "2026-11-02" }
  - id: ssh
    term: SSH
    definition: "The Secure Shell protocol and command for logging in to a remote machine securely."
    see: ssh-and-scp
    source: { title: "ssh(1) - OpenSSH manual page", url: "https://man.openbsd.org/ssh.1", verifiedOn: "2026-11-02" }
  - id: scp
    term: scp
    definition: "Copy files between machines over SSH."
    see: ssh-and-scp
    source: { title: "scp(1) - OpenSSH manual page", url: "https://man.openbsd.org/scp.1", verifiedOn: "2026-11-02" }
  - id: port
    term: Port
    definition: "A number identifying a service on a host; ports below 1024 are privileged."
    see: ports-and-sockets
    source: { title: "Service Name and Transport Protocol Port Number Registry (IANA)", url: "https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml", verifiedOn: "2026-11-02" }
  - id: socket
    term: Socket
    definition: "A communication endpoint identified by an IP address and a port."
    see: networking-basics
    source: { title: "socket(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/socket.7.html", verifiedOn: "2026-11-02" }
  - id: localhost
    term: localhost
    definition: "A name for your own machine, usually the IP 127.0.0.1."
    see: networking-basics
    source: { title: "RFC 6761: Special-Use Domain Names", url: "https://www.rfc-editor.org/rfc/rfc6761", verifiedOn: "2026-11-02" }
  - id: dns
    term: DNS
    definition: "The Domain Name System that resolves names like example.com to IP addresses."
    see: dns-tools
    source: { title: "RFC 1034: Domain Names - Concepts and Facilities", url: "https://www.rfc-editor.org/rfc/rfc1034", verifiedOn: "2026-11-02" }
  - id: ip-address
    term: IP address
    definition: "The number that identifies a network interface, such as 192.168.1.10."
    see: networking-basics
    source: { title: "ip(8) - Linux manual page", url: "https://man7.org/linux/man-pages/man8/ip.8.html", verifiedOn: "2026-11-02" }
  - id: load-average
    term: Load average
    definition: "A 1/5/15-minute average count of processes running, waiting to run, or in uninterruptible I/O; compare it to the CPU cores."
    see: system-monitoring
    source: { title: "uptime(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/uptime.1.html", verifiedOn: "2026-11-02" }
  - id: glob
    term: Glob (wildcard)
    aka: ["wildcard", "globbing"]
    definition: "Shell pattern matching on filenames with * (many), ? (one) and [...] (a set)."
    see: wildcards-globbing
    source: { title: "glob(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/glob.7.html", verifiedOn: "2026-11-02" }
  - id: shebang
    term: Shebang
    definition: "The #! line at the top of a script naming the interpreter that runs it."
    see: shell-scripting
    source: { title: "execve(2) - Interpreter scripts (Linux manual page)", url: "https://man7.org/linux/man-pages/man2/execve.2.html", verifiedOn: "2026-11-02" }
  - id: system-call
    term: System call
    definition: "A request from a program to the kernel to do privileged work, like reading a file."
    see: kernel-and-userspace
    source: { title: "syscalls(2) - Linux manual page", url: "https://man7.org/linux/man-pages/man2/syscalls.2.html", verifiedOn: "2026-11-02" }
  - id: tar
    term: tar
    definition: "Bundle many files into one archive; -c create, -x extract, -z gzip, -f file."
    see: archives-compression
    source: { title: "tar(1) - GNU tar manual", url: "https://www.gnu.org/software/tar/manual/tar.html", verifiedOn: "2026-11-02" }
