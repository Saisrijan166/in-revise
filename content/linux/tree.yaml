sources:
  - { title: "Filesystem Hierarchy Standard 3.0", url: "https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html", verifiedOn: "2026-11-02" }
  - { title: "GNU Coreutils Manual", url: "https://www.gnu.org/software/coreutils/manual/coreutils.html", verifiedOn: "2026-11-02" }
  - { title: "Bash Reference Manual", url: "https://www.gnu.org/software/bash/manual/bash.html", verifiedOn: "2026-11-02" }
  - { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - { title: "systemctl(1) - systemd", url: "https://www.freedesktop.org/software/systemd/man/latest/systemctl.html", verifiedOn: "2026-11-02" }

topics:
  basics:
    - id: what-is-linux
      children:
        - { id: linux-kernel-vs-os, label: "Kernel vs OS", note: "Linux is the kernel; a distro adds the userland around it" }
        - { id: unix, label: "Unix", note: "The older OS family Linux is modelled on but not derived from" }
        - { id: open-source, label: "Open source", note: "The source is free to read, change and share (GPL)" }
    - id: linux-architecture
      children:
        - { id: hardware-layer, label: "Hardware", note: "CPU, memory, disk, devices" }
        - { id: kernel-layer, label: "Kernel", note: "Manages hardware, memory and processes" }
        - { id: shell-layer, label: "Shell and libraries", note: "Turns your commands into system calls" }
        - { id: user-apps, label: "User applications", note: "Your programs, e.g. the JVM" }
    - id: kernel-and-userspace
      children:
        - { id: kernel-space, label: "Kernel space", note: "Privileged code that talks to hardware" }
        - { id: user-space, label: "User space", note: "Normal programs, isolated from hardware" }
        - { id: system-call, label: "System call", note: "How a program asks the kernel to do something" }
    - id: shell-and-terminal
      children:
        - { id: shell, label: "Shell", note: "The program that reads and runs your commands, e.g. bash" }
        - { id: terminal, label: "Terminal", note: "The window/app you type the shell into" }
        - { id: bash, label: "bash", note: "The common default shell on Linux" }
    - id: running-commands
      children:
        - { id: command-options-args, label: "Options and arguments", note: "command -flags arguments, e.g. ls -l /etc" }
        - { id: man-pages, label: "man / --help", note: "Built-in manual and help for a command" }
        - { id: exit-code, label: "Exit code", note: "0 means success; $? holds the last command's code" }

  filesystem:
    - id: filesystem-hierarchy
      children:
        - { id: root-dir, label: "/ (root)", note: "The single top of the tree; everything hangs off it" }
        - { id: etc-dir, label: "/etc", note: "System configuration files" }
        - { id: var-log, label: "/var and /var/log", note: "Changing data and logs" }
        - { id: home-dir, label: "/home", note: "Users' home directories" }
        - { id: proc-dir, label: "/proc and /sys", note: "Virtual files exposing the kernel and processes" }
        - { id: bin-dir, label: "/bin, /usr/bin, /sbin", note: "Executable programs" }
    - id: paths-absolute-relative
      children:
        - { id: absolute-path, label: "Absolute path", note: "Starts from /, works from anywhere" }
        - { id: relative-path, label: "Relative path", note: "Starts from the current directory" }
        - { id: path-symbols, label: ". .. ~ -", note: "Here, parent, home, previous directory" }
    - id: navigation
      children:
        - { id: pwd-cmd, label: "pwd", note: "Print the current directory" }
        - { id: ls-cmd, label: "ls -l / -a", note: "List files; -l details, -a hidden" }
        - { id: cd-cmd, label: "cd", note: "Change directory" }

  files:
    - id: file-operations
      children:
        - { id: touch-mkdir, label: "touch, mkdir -p", note: "Create files and nested directories" }
        - { id: cp-mv, label: "cp -r, mv", note: "Copy and move or rename" }
        - { id: rm-rf, label: "rm -rf", note: "Delete recursively, no prompt; dangerous" }
    - id: viewing-files
      children:
        - { id: cat-less, label: "cat, less", note: "Show a whole file or page through it" }
        - { id: head-tail, label: "head, tail", note: "First or last lines of a file" }
        - { id: tail-f, label: "tail -f", note: "Follow a growing log in real time" }
    - id: editing-files
      children:
        - { id: nano, label: "nano", note: "A simple terminal editor" }
        - { id: vim, label: "vim", note: "A powerful modal editor; :q! to quit" }
    - id: links-hard-symbolic
      children:
        - { id: hard-link, label: "Hard link", note: "Another name for the same file data (inode)" }
        - { id: symbolic-link, label: "Symbolic link", note: "A pointer to another path; ln -s" }
    - id: wildcards-globbing
      children:
        - { id: glob-star, label: "* and ?", note: "Match many characters or one" }
        - { id: glob-brackets, label: "[...] and {...}", note: "Match a set or a list" }

  permissions:
    - id: file-permissions
      children:
        - { id: rwx, label: "r w x", note: "Read, write, execute" }
        - { id: ugo, label: "user / group / others", note: "The three permission classes" }
        - { id: dir-execute, label: "Execute on a directory", note: "Needed to enter and traverse it" }
    - id: chmod
      children:
        - { id: chmod-numeric, label: "Numeric (755)", note: "r=4, w=2, x=1 added per class" }
        - { id: chmod-symbolic, label: "Symbolic (u+x)", note: "u/g/o/a with + - =" }
    - id: ownership
      children:
        - { id: chown-cmd, label: "chown", note: "Change the owning user (and group)" }
        - { id: chgrp-cmd, label: "chgrp", note: "Change the owning group" }
    - id: users-and-groups
      children:
        - { id: etc-passwd, label: "/etc/passwd", note: "User accounts; /etc/shadow holds password hashes" }
        - { id: etc-group, label: "/etc/group", note: "Groups and their members" }
        - { id: id-whoami, label: "id, whoami", note: "Your user, groups, UID and GID" }
    - id: sudo-and-root
      children:
        - { id: root-user, label: "root (UID 0)", note: "The all-powerful administrator account" }
        - { id: sudo-cmd, label: "sudo", note: "Run one command with elevated rights" }
        - { id: su-cmd, label: "su", note: "Switch to another user's shell" }
    - id: special-permissions
      children:
        - { id: setuid, label: "setuid / setgid", note: "Run a program as its owner or group" }
        - { id: sticky-bit, label: "Sticky bit", note: "In /tmp, only the owner can delete their files" }

  text:
    - id: grep
      children:
        - { id: grep-flags, label: "-i -r -n -v", note: "Ignore case, recurse, line numbers, invert" }
        - { id: regex, label: "Regex", note: "Patterns grep matches against each line" }
    - id: find
      children:
        - { id: find-name-type, label: "-name -type -size", note: "Match by name, kind or size" }
        - { id: find-exec, label: "-exec / -delete", note: "Run a command on each match" }
    - id: pipes-and-redirection
      children:
        - { id: pipe, label: "| (pipe)", note: "Send one command's output into the next" }
        - { id: redirect, label: "> and >>", note: "Write output to a file: overwrite or append" }
        - { id: stdin-stdout-stderr, label: "stdin/stdout/stderr", note: "FD 0, 1, 2; 2>&1 merges errors into output" }
    - id: text-processing
      children:
        - { id: sort-uniq, label: "sort, uniq, wc", note: "Order, de-duplicate and count lines" }
        - { id: cut-awk-sed, label: "cut, awk, sed", note: "Pick columns, process and edit text streams" }

  processes:
    - id: processes
      children:
        - { id: ps-aux, label: "ps aux", note: "Snapshot of all running processes" }
        - { id: pid-ppid, label: "PID / PPID", note: "A process's id and its parent's id" }
    - id: monitoring-processes
      children:
        - { id: top-htop, label: "top / htop", note: "Live view of processes and load" }
        - { id: pgrep-pkill, label: "pgrep / pkill", note: "Find or signal processes by name" }
    - id: signals
      children:
        - { id: sigterm, label: "SIGTERM (15)", note: "Polite request to stop; the default of kill" }
        - { id: sigkill, label: "SIGKILL (9)", note: "Force-kill; cannot be caught or ignored" }
        - { id: sigint, label: "SIGINT (2)", note: "Ctrl+C on the foreground process" }
        - { id: sighup, label: "SIGHUP (1)", note: "Terminal closed; often means reload" }
    - id: jobs-and-background
      children:
        - { id: ampersand, label: "&", note: "Start a command in the background" }
        - { id: jobs-bg-fg, label: "jobs, bg, fg", note: "List and move jobs; Ctrl+Z suspends" }
        - { id: nohup, label: "nohup", note: "Keep running after the terminal closes" }
    - id: zombie-and-orphan
      children:
        - { id: zombie, label: "Zombie", note: "Finished but its exit status was not collected yet" }
        - { id: orphan, label: "Orphan", note: "Parent died; adopted by init (PID 1)" }
        - { id: daemon, label: "Daemon", note: "A background service, usually ending in d (e.g. sshd)" }

  system:
    - id: package-management
      children:
        - { id: apt, label: "apt (Debian/Ubuntu)", note: "update, upgrade, install, remove, purge" }
        - { id: apt-update, label: "apt update", note: "Refresh the list of available packages" }
        - { id: apt-upgrade, label: "apt upgrade", note: "Install the available updates" }
        - { id: dnf-yum, label: "dnf / yum (Fedora/RHEL)", note: "The RPM-based equivalents" }
    - id: systemd-services
      children:
        - { id: systemctl-start, label: "start / stop / restart", note: "Control a service now" }
        - { id: systemctl-enable, label: "enable / disable", note: "Start or not at boot" }
        - { id: systemctl-status, label: "status", note: "Is it running, and recent logs" }
    - id: journald-logs
      children:
        - { id: journalctl-u, label: "journalctl -u", note: "Logs for one service" }
        - { id: journalctl-f, label: "-f / -n", note: "Follow, or last N lines" }
    - id: system-monitoring
      children:
        - { id: free-cmd, label: "free -h", note: "Memory used and available" }
        - { id: df-cmd, label: "df -h", note: "Disk space per filesystem" }
        - { id: du-cmd, label: "du -sh", note: "Space used by a folder" }
        - { id: uptime-load, label: "uptime", note: "Uptime and 1/5/15-minute load average" }
    - id: env-variables
      children:
        - { id: path-var, label: "PATH", note: "Where the shell looks for commands" }
        - { id: export-cmd, label: "export", note: "Pass a variable to child processes" }
        - { id: bashrc, label: "~/.bashrc / ~/.profile", note: "Make a variable persist across sessions" }
    - id: archives-compression
      children:
        - { id: tar-cmd, label: "tar", note: "Bundle files; -c create, -x extract, -z gzip, -f file" }
        - { id: zip-gzip, label: "gzip / zip", note: "Compress a file or make a .zip" }
    - id: cron-scheduling
      children:
        - { id: crontab, label: "crontab -e / -l", note: "Edit and list scheduled jobs" }
        - { id: cron-format, label: "Cron format", note: "min hour day-of-month month day-of-week" }
    - id: shell-scripting
      children:
        - { id: shebang, label: "Shebang (#!)", note: "First line names the interpreter, e.g. #!/bin/bash" }
        - { id: script-vars, label: "Variables and $1", note: "name=value, $name, and $1..$9 arguments" }
        - { id: script-control, label: "if / for / test", note: "Conditions and loops in a script" }

  networking:
    - id: networking-basics
      children:
        - { id: ip-address, label: "IP address", note: "Identifies a network interface" }
        - { id: port, label: "Port", note: "Identifies a service on a host; <1024 is privileged" }
        - { id: localhost, label: "localhost (127.0.0.1)", note: "Your own machine" }
        - { id: socket, label: "Socket", note: "An endpoint = IP address plus port" }
    - id: network-commands
      children:
        - { id: ip-cmd, label: "ip addr / ip route", note: "Show interfaces and the routing table" }
        - { id: ping-cmd, label: "ping", note: "Test reachability with ICMP" }
        - { id: traceroute, label: "traceroute", note: "Show the hops to a destination" }
    - id: http-tools
      children:
        - { id: curl, label: "curl", note: "Make HTTP and other requests from the shell" }
        - { id: wget, label: "wget", note: "Download files over HTTP" }
    - id: ports-and-sockets
      children:
        - { id: ss-cmd, label: "ss -tulnp", note: "Which ports are listening and which process owns them" }
        - { id: common-ports, label: "Common ports", note: "22 SSH, 80 HTTP, 443 HTTPS, 5432 Postgres" }
    - id: dns-tools
      children:
        - { id: dig-cmd, label: "dig / nslookup", note: "Resolve a name to an IP" }
        - { id: etc-hosts, label: "/etc/hosts", note: "Local name-to-IP overrides" }
    - id: ssh-and-scp
      children:
        - { id: ssh-cmd, label: "ssh", note: "Log in to a remote machine securely" }
        - { id: scp-cmd, label: "scp", note: "Copy files over SSH" }
        - { id: ssh-keys, label: "SSH keys", note: "Key pair login instead of a password" }
