id: sigterm-vs-sigkill
tech: linux
title: "SIGTERM vs SIGKILL (kill vs kill -9)"
compares: [sigterm, sigkill]
gist:
  - "Politely ask the process to stop and clean up"
  - "Force the process to stop immediately"
explain:
  - "SIGTERM (15) is the default signal kill sends. It asks the process to terminate; the process can catch it, finish current work, flush files and exit cleanly, or ignore it."
  - "SIGKILL (9) cannot be caught, blocked or ignored. The kernel stops the process at once, so it gets no chance to clean up, which can leave temporary files or inconsistent state."
example: "kill 1234 sends SIGTERM, so the JVM runs its shutdown hooks and closes connections. If it hangs, kill -9 1234 sends SIGKILL and the kernel ends it instantly, dropping anything in progress."
rows:
  - { aspect: "Signal number", a: "15", b: "9" }
  - { aspect: "Can be caught/ignored", a: "Yes", b: "No, never" }
  - { aspect: "Cleanup chance", a: "Yes (shutdown hooks)", b: "None" }
  - { aspect: "kill form", a: "kill PID (default)", b: "kill -9 PID" }
verdict: "Always try SIGTERM first so the program shuts down cleanly; use SIGKILL only when it is stuck and ignores SIGTERM."
sayIt: "SIGTERM, signal 15, is the default of kill: it asks the process to stop and lets it clean up, and can be caught. SIGKILL, signal 9, cannot be caught or ignored and ends the process at once with no cleanup. I send SIGTERM first and keep SIGKILL for a hung process."
sources:
  - { title: "signal(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/signal.7.html", verifiedOn: "2026-11-02" }
  - { title: "kill(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/kill.1.html", verifiedOn: "2026-11-02" }
