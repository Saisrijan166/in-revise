id: hard-vs-symbolic-link
tech: linux
title: Hard link vs Symbolic link
compares: [hard-link, symbolic-link]
gist:
  - "Another name for the same file data (same inode)"
  - "A small file that points to another path"
explain:
  - "A hard link is a second directory entry pointing at the very same inode (the file's actual data). Both names are equal; the data exists while at least one link remains, and deleting one name leaves the other working."
  - "A symbolic link (symlink) is a tiny separate file that just stores a path to the target. It can cross filesystems and link directories, but it breaks if the target is moved or deleted."
example: "ln file hardname gives a second name for the same data. ln -s /opt/app/current symlink points at a path; if /opt/app/current is removed, the symlink dangles while a hard link would still hold the data."
rows:
  - { aspect: "Points to", a: "The same inode (data)", b: "A path (name)" }
  - { aspect: "Survives target deletion", a: "Yes, data stays until last link", b: "No, becomes a broken link" }
  - { aspect: "Across filesystems", a: "No", b: "Yes" }
  - { aspect: "Link a directory", a: "No (not allowed)", b: "Yes" }
  - { aspect: "Create with", a: "ln target name", b: "ln -s target name" }
verdict: "Use a symlink for a flexible pointer (across disks, to directories, like a 'current' release); use a hard link for a true second name for the same data on one filesystem."
sayIt: "A hard link is another name for the same inode, so the data survives until the last link is gone, but it cannot cross filesystems or link directories. A symbolic link is a small file holding a path to the target: it can cross filesystems and point to directories, but it breaks if the target moves."
sources:
  - { title: "ln(1) - GNU Coreutils", url: "https://www.gnu.org/software/coreutils/manual/html_node/ln-invocation.html", verifiedOn: "2026-11-02" }
  - { title: "symlink(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/symlink.7.html", verifiedOn: "2026-11-02" }
