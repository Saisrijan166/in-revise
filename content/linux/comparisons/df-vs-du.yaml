id: df-vs-du
tech: linux
title: df vs du
compares: [df-cmd, du-cmd]
gist:
  - "How full each filesystem is"
  - "How much space a folder uses"
explain:
  - "df (disk free) reports, per mounted filesystem, the total size, used and available space. It answers 'is the disk full?' at the whole-filesystem level."
  - "du (disk usage) adds up the size of the files under a path. It answers 'what is using the space?' for a specific folder or set of files."
example: "df -h shows / is 95% full. To find the culprit, du -sh /var/* lists each folder's size, revealing /var/log is 40 GB. df tells you there is a problem; du tells you where."
rows:
  - { aspect: "Scope", a: "Whole filesystems", b: "A folder or files" }
  - { aspect: "Answers", a: "How full is the disk?", b: "What is using the space?" }
  - { aspect: "Reads from", a: "The filesystem's own counters", b: "Walking the files and adding sizes" }
  - { aspect: "Common form", a: "df -h", b: "du -sh <dir>" }
verdict: "Start with df -h to see which filesystem is full, then du -sh on that area to find what is eating the space."
sayIt: "df shows free and used space per filesystem, so it tells me if a disk is full. du adds up the size of files under a path, so it tells me what is using the space. I run df first to spot the full disk, then du to find the big folder."
sources:
  - { title: "df(1) - GNU Coreutils", url: "https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html", verifiedOn: "2026-11-02" }
  - { title: "du(1) - GNU Coreutils", url: "https://www.gnu.org/software/coreutils/manual/html_node/du-invocation.html", verifiedOn: "2026-11-02" }
