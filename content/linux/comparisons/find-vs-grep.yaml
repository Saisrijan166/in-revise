id: find-vs-grep
tech: linux
title: find vs grep
compares: [find, grep]
gist:
  - "Find files by name, type, size or time"
  - "Find text inside files by pattern"
explain:
  - "find walks the directory tree and selects files themselves by their attributes: name, type, size, modified time, and can then run a command on each one."
  - "grep reads the contents of files (or piped input) and prints the lines that match a text pattern or regular expression."
example: "To locate every .log file: find /var/log -name '*.log'. To find which log lines mention an error: grep -i error app.log. Combine them: find . -name '*.java' -exec grep -l TODO {} +."
rows:
  - { aspect: "Searches", a: "Files and directories", b: "Text inside files" }
  - { aspect: "Matches by", a: "Name, type, size, time", b: "A pattern / regex in the content" }
  - { aspect: "Output", a: "Paths of matching files", b: "Matching lines (or files with -l)" }
  - { aspect: "Typical use", a: "Where is the file?", b: "Which lines say this?" }
verdict: "Use find to locate files by their properties, grep to search inside files for text. They pair well: find the files, grep their contents."
sayIt: "find searches for files by attributes like name, type and size and can act on each match. grep searches the contents of files for lines matching a pattern. find is about the files; grep is about what is written in them, and they combine with -exec or a pipe."
sources:
  - { title: "find(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/find.1.html", verifiedOn: "2026-11-02" }
  - { title: "grep(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/grep.1.html", verifiedOn: "2026-11-02" }
