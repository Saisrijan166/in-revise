id: background-vs-nohup
tech: linux
title: "& (background) vs nohup"
compares: [ampersand, nohup]
gist:
  - "Run in the background, but tied to the terminal"
  - "Keep running after the terminal closes"
explain:
  - "Adding & runs a command in the background of the current shell, so you get the prompt back. But the job is still a child of that shell, so closing the terminal can send it SIGHUP and stop it."
  - "nohup runs a command immune to SIGHUP, so it keeps running after you log out, and redirects its output to nohup.out by default. Combined with &, it both backgrounds and survives logout."
example: "java -jar app.jar & frees the prompt but may die when you close the SSH session. nohup java -jar app.jar > app.log 2>&1 & keeps it running after logout, with output in app.log. For a real service, use systemd instead."
rows:
  - { aspect: "Frees the prompt", a: "Yes", b: "Yes (with &)" }
  - { aspect: "Survives terminal close", a: "Not reliably (gets SIGHUP)", b: "Yes (ignores SIGHUP)" }
  - { aspect: "Output", a: "Still to the terminal", b: "To nohup.out, or a file you set" }
  - { aspect: "Real services", a: "No", b: "Okay quick fix; prefer systemd" }
verdict: "Use & to background a task you will keep the terminal open for; add nohup to keep it alive after logout. For anything long-lived, a systemd service is better than either."
sayIt: "& runs a command in the background but it stays tied to the shell, so closing the terminal can kill it with SIGHUP. nohup makes the command ignore SIGHUP so it survives logout, and sends output to nohup.out. I combine nohup with &, but for a real service I use systemd."
sources:
  - { title: "nohup(1) - GNU Coreutils", url: "https://www.gnu.org/software/coreutils/manual/html_node/nohup-invocation.html", verifiedOn: "2026-11-02" }
  - { title: "Bash Reference Manual: Job Control", url: "https://www.gnu.org/software/bash/manual/html_node/Job-Control-Basics.html", verifiedOn: "2026-11-02" }
