id: apt-update-vs-upgrade
tech: linux
title: "apt update vs apt upgrade"
compares: [apt-update, apt-upgrade]
gist:
  - "Refresh the list of available packages"
  - "Install the newer versions"
explain:
  - "apt update contacts the configured repositories and refreshes the local list of what packages and versions are available. It downloads no software and changes nothing installed."
  - "apt upgrade uses that list to download and install newer versions of the packages you already have. It needs an up-to-date list to know what is new, so you run update first."
example: "sudo apt update refreshes the index and reports '20 packages can be upgraded'. sudo apt upgrade then actually installs those 20. Running upgrade without update first may miss the newest versions."
rows:
  - { aspect: "Changes installed software", a: "No", b: "Yes" }
  - { aspect: "What it touches", a: "The package index", b: "The installed packages" }
  - { aspect: "Downloads packages", a: "No (only metadata)", b: "Yes" }
  - { aspect: "Order", a: "Run first", b: "Run after update" }
verdict: "Always run apt update before apt upgrade: update learns what is new, upgrade installs it."
sayIt: "apt update refreshes the local list of available packages and versions but installs nothing. apt upgrade then installs the newer versions of packages I already have. I run update first so upgrade knows what is actually new."
sources:
  - { title: "apt(8) - Debian manual page", url: "https://manpages.debian.org/stable/apt/apt.8.en.html", verifiedOn: "2026-11-02" }
