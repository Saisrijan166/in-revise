id: chmod-vs-chown
tech: linux
title: chmod vs chown
compares: [chmod, ownership]
gist:
  - "Change what the owner, group and others may do"
  - "Change who the owner and group are"
explain:
  - "chmod sets the permission bits on a file: read, write and execute for the user, group and others. It changes what each class is allowed to do, not who they are."
  - "chown changes which user (and optionally which group) owns the file. The permission bits stay the same; only the identity they apply to changes."
example: "A deploy script is owned by root and not executable. chmod +x deploy.sh makes it runnable; chown appuser:app deploy.sh hands it to the app user. You often need both: give it to the right owner, then set the right bits."
rows:
  - { aspect: "Changes", a: "Permission bits (rwx)", b: "Owning user and/or group" }
  - { aspect: "Answers", a: "What may be done", b: "Who owns it" }
  - { aspect: "Example", a: "chmod 640 app.conf", b: "chown appuser:app app.conf" }
  - { aspect: "Needs root", a: "If you are not the owner", b: "Yes, to change the owner" }
verdict: "Use chmod to set what owner/group/others can do; use chown to change who the owner or group is. They solve different halves of access control."
sayIt: "chmod changes the permission bits, what the user, group and others may read, write or execute. chown changes who owns the file, the user and optionally the group. chmod is about what is allowed; chown is about who it applies to."
sources:
  - { title: "chmod(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/chmod.1.html", verifiedOn: "2026-11-02" }
  - { title: "chown(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/chown.1.html", verifiedOn: "2026-11-02" }
