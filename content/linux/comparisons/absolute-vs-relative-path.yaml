id: absolute-vs-relative-path
tech: linux
title: Absolute vs Relative Path
compares: [absolute-path, relative-path]
gist:
  - "Starts from /, the same from anywhere"
  - "Starts from where you are now"
explain:
  - "An absolute path begins at the root /, so it names a file by its full location. It means the same thing no matter which directory you run it from."
  - "A relative path begins from your current directory, using names, . for here and .. for the parent. Its meaning depends on where you currently are."
example: "cd /home/app/logs works from anywhere. From /home/app, cd logs (relative) reaches the same place; but run cd logs from /tmp and it fails. Scripts often use absolute paths so they work from any directory."
rows:
  - { aspect: "Starts from", a: "/ (root)", b: "The current directory" }
  - { aspect: "Depends on where you are", a: "No", b: "Yes" }
  - { aspect: "Example", a: "/var/log/app.log", b: "../log/app.log" }
  - { aspect: "Best for", a: "Scripts, cron, config", b: "Quick interactive typing" }
verdict: "Use absolute paths where the working directory is unknown or fixed (scripts, cron, services); relative paths are quicker when you are already near the target."
sayIt: "An absolute path starts from / and means the same from any directory. A relative path starts from the current directory and uses . and .. , so its meaning changes with where I am. I use absolute paths in scripts and cron, relative paths for quick interactive work."
sources:
  - { title: "path_resolution(7) - Linux manual page", url: "https://man7.org/linux/man-pages/man7/path_resolution.7.html", verifiedOn: "2026-11-02" }
