id: zombie-vs-orphan
tech: linux
title: Zombie vs Orphan Process
compares: [zombie, orphan]
gist:
  - "Finished, but its exit status was not collected"
  - "Still running, but its parent has died"
explain:
  - "A zombie has already finished running; it holds only its exit status in the process table, waiting for its parent to read it with wait(). It uses no CPU or memory, just a table slot, until the parent reaps it."
  - "An orphan is still running, but its parent process has ended. Linux re-parents it to init (PID 1), which will later reap it, so orphans are normal and not harmful."
example: "A server forks a worker and never calls wait(): when the worker exits it becomes a zombie until the server reaps it. If instead the server exits while the worker runs, the worker is an orphan and init adopts it."
rows:
  - { aspect: "State", a: "Already terminated", b: "Still running" }
  - { aspect: "Problem", a: "Parent did not reap it", b: "Parent died" }
  - { aspect: "Adopted by init", a: "No (needs the parent to reap)", b: "Yes (PID 1 takes over)" }
  - { aspect: "Harmful?", a: "Many of them exhaust the process table", b: "Normal and harmless" }
verdict: "A zombie is a dead process not yet reaped (fix the parent's wait handling); an orphan is a live process whose parent died and that init adopts. Orphans are normal; many zombies signal a bug."
sayIt: "A zombie has finished but its parent has not read its exit status, so it lingers in the process table using no resources. An orphan is still running but its parent died, so init adopts it. Orphans are normal; a pile of zombies means a parent is not reaping its children."
sources:
  - { title: "wait(2) - Linux manual page", url: "https://man7.org/linux/man-pages/man2/wait.2.html", verifiedOn: "2026-11-02" }
  - { title: "proc(5) - process state (Linux manual page)", url: "https://man7.org/linux/man-pages/man5/proc.5.html", verifiedOn: "2026-11-02" }
