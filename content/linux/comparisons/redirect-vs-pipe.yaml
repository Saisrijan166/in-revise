id: redirect-vs-pipe
tech: linux
title: "Redirection (>) vs Pipe (|)"
compares: [redirect, pipe]
gist:
  - "Send a command's output to a file"
  - "Send a command's output to another command"
explain:
  - "Redirection with > or >> connects a command's output to a file: > overwrites the file, >> appends to it. The destination is a file on disk."
  - "A pipe with | connects one command's standard output to the next command's standard input, so data flows between programs without a temporary file."
example: "ps aux > procs.txt saves the process list to a file. ps aux | grep java feeds the same list into grep to keep only the Java lines. Combine them: ps aux | grep java > java.txt."
rows:
  - { aspect: "Destination", a: "A file", b: "Another command" }
  - { aspect: "Operator", a: "> (overwrite), >> (append)", b: "|" }
  - { aspect: "Creates a file", a: "Yes", b: "No" }
  - { aspect: "Typical use", a: "Save output for later", b: "Filter or transform output now" }
verdict: "Use > / >> to write output to a file; use | to pass output straight into another command. They combine in one line."
sayIt: "Redirection sends a command's output to a file: > overwrites, >> appends. A pipe sends one command's output into another command's input with no file in between. I redirect to save output, and pipe to filter or transform it, often together."
sources:
  - { title: "Bash Reference Manual: Redirections", url: "https://www.gnu.org/software/bash/manual/html_node/Redirections.html", verifiedOn: "2026-11-02" }
  - { title: "Bash Reference Manual: Pipelines", url: "https://www.gnu.org/software/bash/manual/html_node/Pipelines.html", verifiedOn: "2026-11-02" }
