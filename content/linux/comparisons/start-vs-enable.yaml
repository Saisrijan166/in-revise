id: start-vs-enable
tech: linux
title: "systemctl start vs enable"
compares: [systemctl-start, systemctl-enable]
gist:
  - "Run the service now, this boot only"
  - "Set it to start automatically at every boot"
explain:
  - "systemctl start launches the service immediately in the current running system. It has no effect on what happens after a reboot."
  - "systemctl enable registers the service to start automatically on future boots (by creating the right links). On its own it does not start the service now."
example: "After installing nginx: sudo systemctl start nginx runs it now; sudo systemctl enable nginx makes it come up on every boot. For a server you want both, so `enable --now` does start and enable together."
rows:
  - { aspect: "Effect now", a: "Starts the service", b: "None by itself" }
  - { aspect: "Effect on reboot", a: "None", b: "Starts automatically" }
  - { aspect: "Opposite", a: "stop", b: "disable" }
  - { aspect: "Both at once", a: "—", b: "enable --now" }
verdict: "Use start to run a service now and enable to make it survive reboots; for a real service you usually want both (enable --now)."
sayIt: "systemctl start runs the service now but does nothing for the next boot. systemctl enable makes it start automatically on every boot but does not start it now. A server service usually needs both, which enable --now does in one step."
sources:
  - { title: "systemctl(1) - systemd", url: "https://www.freedesktop.org/software/systemd/man/latest/systemctl.html", verifiedOn: "2026-11-02" }
