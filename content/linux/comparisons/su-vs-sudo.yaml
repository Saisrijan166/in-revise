id: su-vs-sudo
tech: linux
title: su vs sudo
compares: [su-cmd, sudo-cmd]
gist:
  - "Switch to another user's shell (needs their password)"
  - "Run one command as root (needs your own password)"
explain:
  - "su switches your session to another user, by default root, and starts a shell as them. You must know that user's password, and you stay as them until you exit."
  - "sudo runs a single command with elevated rights, then returns you to your own user. You authenticate with your OWN password, and only if the sudoers policy allows it, so each action is logged."
example: "sudo systemctl restart nginx runs just that one command as root and logs it. su - then a root shell lets you run many commands as root, but needs the root password and leaves no per-command record."
rows:
  - { aspect: "What it does", a: "Become another user's shell", b: "Run one command elevated" }
  - { aspect: "Password needed", a: "The target user's", b: "Your own" }
  - { aspect: "Scope", a: "Whole session until exit", b: "A single command" }
  - { aspect: "Audited / fine-grained", a: "Less so", b: "Yes, via /etc/sudoers; logged" }
verdict: "Prefer sudo for admin tasks: it is per-command, uses your password, is logged, and avoids sharing the root password. Use su only when you truly need an interactive shell as another user."
sayIt: "su switches to another user's shell and needs that user's password, lasting until I exit. sudo runs a single command with elevated rights using my own password, only if sudoers allows, and logs it. sudo is preferred because it is fine-grained, audited, and avoids sharing the root password."
sources:
  - { title: "sudo(8) - Linux manual page", url: "https://man7.org/linux/man-pages/man8/sudo.8.html", verifiedOn: "2026-11-02" }
  - { title: "su(1) - Linux manual page", url: "https://man7.org/linux/man-pages/man1/su.1.html", verifiedOn: "2026-11-02" }
