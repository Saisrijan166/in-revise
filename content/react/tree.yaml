topics:
  web-basics:
    - id: how-browsers-render
      children:
        - id: dom-tree
          label: DOM
          term: dom
          note: Tree of nodes parsed from HTML; scripts can read and change it
        - id: cssom
          label: CSSOM
          note: Tree of styles from CSS; must be complete before rendering
        - id: render-tree
          label: Render tree
          note: "Visible nodes with computed styles; display: none left out"
        - id: layout-reflow
          label: Layout (reflow)
          term: reflow
          note: Computes size and position; later reruns are called reflows
        - id: paint-repaint
          label: Paint (repaint)
          term: repaint
          note: "Fills pixels: text, colours, borders, shadows, images"
        - id: compositing
          label: Compositing
          note: Draws painted layers in order; transform and opacity can stop here
        - id: script-loading
          label: Script loading
          note: How a <script> tag affects HTML parsing
          children:
            - id: classic-script
              label: Plain script
              note: Downloads and runs at once; HTML parsing waits
            - id: async-script
              label: async
              note: Downloads in parallel; runs as soon as ready, in any order
            - id: defer-script
              label: defer
              note: Downloads in parallel; runs after parsing, in document order
            - id: module-script
              label: type="module"
              note: Deferred by default; defer has no effect on it
    - id: semantic-html-accessibility
      children:
        - id: landmarks
          label: Landmarks
          note: header, nav, main, aside, footer map to ARIA landmark roles
        - id: accessible-name
          label: Accessible name
          note: The label assistive tech announces; best from visible text
        - id: aria-roles-states
          label: ARIA roles and states
          term: aria
          note: Add meaning only; the browser adds no keyboard behaviour
        - id: keyboard-focus
          label: Keyboard focus
          note: tabindex="0" makes an element tabbable; "-1" for script focus only
        - id: wcag-levels
          label: WCAG levels A, AA, AAA
          term: wcag
          note: AA means every Level A and Level AA success criterion is met
    - id: browser-storage-cookies
      children:
        - id: local-storage
          label: localStorage
          note: Per origin, no expiry; UTF-16 string keys and values
        - id: session-storage
          label: sessionStorage
          note: Per origin and tab; survives reloads, cleared when the tab closes
        - id: http-cookie
          label: Cookie
          note: Small name=value pair the browser sends back with requests
          children:
            - id: httponly
              label: HttpOnly
              note: Not readable through document.cookie
            - id: secure-cookie
              label: Secure
              note: Sent only over HTTPS, except on localhost
            - id: samesite
              label: "SameSite: Strict, Lax, None"
              note: Controls sending on cross-site requests; None needs Secure
            - id: cookie-expiry
              label: Expires and Max-Age
              note: Without either it is a session cookie; Max-Age wins if both
            - id: cookie-domain-path
              label: Domain and Path
              note: Limit which hosts and URL paths receive the cookie
        - id: indexeddb
          label: IndexedDB
          note: Async, transactional object store for large structured data
    - id: frontend-security
      children:
        - id: xss
          label: XSS (cross-site scripting)
          note: Untrusted input runs as script in the victim's page
          children:
            - id: stored-xss
              label: Stored XSS
              note: Payload saved on the server, e.g. a comment, served to every viewer
            - id: reflected-xss
              label: Reflected XSS
              note: Request input echoed straight back, e.g. in search results
            - id: dom-xss
              label: DOM-based XSS
              note: Client script writes untrusted data into the DOM, e.g. innerHTML
            - id: content-security-policy
              label: Content Security Policy
              note: Header listing allowed script sources; nonces are recommended
        - id: csrf
          label: CSRF (cross-site request forgery)
          note: Another site makes the victim's browser send an unwanted request
          children:
            - id: csrf-token
              label: CSRF token
              note: Secret value checked by the server on every state-changing request
        - id: same-origin-policy
          label: Same-origin policy
          note: Scripts may read responses only from the same scheme, host, port
        - id: cors
          label: CORS
          note: Headers by which a server lets other origins read its responses
          children:
            - id: preflight-request
              label: Preflight request
              note: OPTIONS sent first for non-simple requests, e.g. PUT or JSON
            - id: cors-credentials
              label: Credentialed requests
              note: "Need Allow-Credentials: true and an exact origin, not *"
  css:
    - id: box-model-positioning
      children:
        - id: box-sizing
          label: box-sizing
          note: Chooses which box width and height measure
          children:
            - id: content-box
              label: content-box
              note: "Initial value: width is the content only; padding and border add on"
            - id: border-box
              label: border-box
              note: Width includes padding and border; content shrinks to fit
        - id: display-css
          label: display values
          note: Outer type sets flow; inner type (flex, grid) lays out children
          children:
            - id: display-block
              label: block
              note: New line; fills the container's width; respects width and height
            - id: display-inline
              label: inline
              note: Stays in the line; width, height and top margins have no effect
            - id: display-none
              label: "display: none"
              note: No box, no space; children are hidden too
        - id: positioned-element
          label: Positioned element
          note: position is anything but static; top, left and z-index then apply
        - id: stacking-context
          label: Stacking context
          note: A group stacked as one unit; child z-index only counts inside it
          children:
            - id: z-index
              label: z-index
              note: Initial value auto; for positioned elements and flex or grid items
        - id: margin-collapsing
          label: Margin collapsing
          note: Touching vertical block margins merge into the largest one
    - id: specificity-cascade
      children:
        - id: specificity
          label: Specificity
          note: ID, CLASS, TYPE counts; the first bigger column wins
          children:
            - id: id-selector-weight
              label: ID selectors
              note: "Each #id adds 1-0-0"
            - id: class-selector-weight
              label: Classes, attributes, pseudo-classes
              note: Each .class, [type] or :hover adds 0-1-0
            - id: type-selector-weight
              label: Types and pseudo-elements
              note: Each p or ::before adds 0-0-1
            - id: where-pseudo-class
              label: :where()
              note: Always 0-0-0, whatever is inside
        - id: cascade-layer
          label: Cascade layers (@layer)
          note: Later layer wins; unlayered normal styles beat all layers
        - id: important-flag
          label: "!important"
          note: Beats normal declarations; reverses origin and layer order
        - id: inheritance-css
          label: Inheritance
          note: Inherited properties take the parent's computed value
          children:
            - id: inherit-keyword
              label: inherit
              note: Takes the parent's computed value
            - id: initial-keyword
              label: initial
              note: Sets the property's initial value
            - id: unset-keyword
              label: unset
              note: inherit if the property inherits, otherwise initial
    - id: flexbox-and-grid
      children:
        - id: flexbox
          label: Flexbox
          note: One-dimensional layout along a main axis
          children:
            - id: main-axis
              label: Main axis
              note: Set by flex-direction (initial row); justify-content aligns on it
            - id: cross-axis
              label: Cross axis
              note: Perpendicular to the main axis; align-items aligns on it
            - id: flex-shorthand
              label: flex shorthand
              note: "flex-grow, flex-shrink, flex-basis; flex: 1 is 1 1 0%"
            - id: flex-wrap
              label: flex-wrap
              note: Initial nowrap keeps one line; wrap lets items flow onto more
        - id: css-grid
          label: CSS Grid
          note: Two-dimensional layout of rows and columns
          children:
            - id: fr-unit
              label: fr unit
              note: A fraction of the free space in the grid container
            - id: repeat-auto-fill
              label: repeat(auto-fill, minmax())
              note: As many tracks as fit, each between a min and max size
            - id: repeat-auto-fit
              label: auto-fit
              note: Like auto-fill, but empty tracks collapse
        - id: gap-css
          label: gap
          note: Space between rows and columns in flex, grid and multi-column
    - id: responsive-design
      children:
        - id: viewport-meta-tag
          label: Viewport meta tag
          note: width=device-width sets the layout width to the device's width
        - id: media-query
          label: Media query
          note: "@media applies rules while a condition like min-width is true"
          children:
            - id: mobile-first
              label: Mobile-first
              note: Narrow single-column base; min-width queries add columns
            - id: breakpoint-css
              label: Breakpoint
              note: The width where the layout changes; prefer relative units
        - id: relative-units
          label: Relative units
          note: Sizes that follow a font size, the parent or the viewport
          children:
            - id: rem
              label: rem
              note: Relative to the root element's font size
            - id: em-css
              label: em
              note: Own font size; the parent's when used for font-size
            - id: viewport-units
              label: vw, vh, dvh
              note: 1% of the viewport; dvh follows mobile browser bars
        - id: clamp-function
          label: clamp()
          note: clamp(min, preferred, max) keeps a value within bounds
        - id: container-query
          label: Container query
          note: "@container styles by an ancestor's size; Baseline 2023"
  javascript:
    - id: scope-hoisting
      children:
        - id: let-declaration
          label: let
          note: Block-scoped and reassignable; throws if read before its line
        - id: const-declaration
          label: const
          note: Block-scoped; must be initialised; cannot be reassigned
          children:
            - id: object-freeze
              label: Object.freeze()
              note: Stops adding, removing or changing properties; shallow
        - id: var-declaration
          label: var
          note: Function-scoped; hoisted as undefined; may be redeclared
        - id: temporal-dead-zone
          label: Temporal dead zone
          note: Block start to the declaration; any access throws ReferenceError
        - id: scope-chain
          label: Scope chain
          note: Inner scopes see outer ones; outer scopes never see inner
    - id: closures
      children:
        - id: private-state
          label: Private state
          note: Variables reachable only through the returned functions
        - id: function-factory
          label: Function factory
          note: Returns new functions, each with its own captured values
        - id: loop-closure-bug
          label: var in a loop
          note: Callbacks share one var; let makes a new variable per iteration
    - id: this-keyword
      children:
        - id: call-method
          label: call()
          note: Calls now with a chosen this and arguments one by one
        - id: apply-method
          label: apply()
          note: Calls now with a chosen this and an array of arguments
        - id: bind-method
          label: bind()
          note: Returns a new function with this fixed; rebinding has no effect
        - id: arrow-this
          label: Arrow functions
          note: No own this, arguments or prototype; new throws TypeError
        - id: new-keyword
          label: new
          note: Creates an object linked to Constructor.prototype as this
        - id: prototype-chain
          label: Prototype chain
          note: Missing properties are looked up through prototypes until null
          children:
            - id: class-syntax
              label: class
              note: Syntax sugar over constructor functions; always strict
    - id: event-loop
      children:
        - id: call-stack
          label: Call stack
          note: Runs one frame at a time; a job ends when it is empty
        - id: microtask-queue
          label: Microtask queue
          term: microtask
          note: Promise callbacks, queueMicrotask; fully drained after each task
        - id: task-queue
          label: Task queue
          term: task-event-loop
          note: Timers, I/O and events; one task per loop turn
    - id: promises-async-await
      children:
        - id: callback-hell
          label: Callback hell
          note: Nested callbacks, one level deeper per async step
        - id: promise-all
          label: Promise.all()
          note: Fulfils when all fulfil; rejects on the first rejection
        - id: promise-allsettled
          label: Promise.allSettled()
          note: Fulfils when all settle, with each status (ES2020)
        - id: promise-race
          label: Promise.race()
          note: Settles the same way as the first promise to settle
        - id: promise-any
          label: Promise.any()
          note: First fulfilment wins; AggregateError if all reject (ES2021)
    - id: types-equality
      children:
        - id: primitive-types
          label: Primitives
          term: primitive-js
          note: string, number, bigint, boolean, undefined, symbol, null
        - id: falsy-values
          label: Falsy values
          term: falsy
          note: false, 0, -0, 0n, empty string, null, undefined, NaN
        - id: loose-equality
          label: == (loose equality)
          note: Converts types, then compares
        - id: strict-equality
          label: === (strict equality)
          note: No conversion; different types are never equal
        - id: object-is
          label: Object.is()
          note: Like === but NaN equals NaN and +0 differs from -0
    - id: arrays-objects
      children:
        - id: copying-methods
          label: toSorted, toReversed, toSpliced, with
          note: ES2023 copies of sort, reverse and splice, which mutate
        - id: spread-and-rest
          label: Spread and rest (...)
          term: spread-syntax
          note: Spread expands items; rest collects them into one
        - id: optional-chaining
          label: Optional chaining (?.)
          note: Gives undefined instead of throwing on null or undefined
        - id: nullish-coalescing
          label: Nullish coalescing (??)
          note: Right side only when the left is null or undefined
        - id: object-copies
          label: Copying objects
          note: Built-in copies are shallow; structuredClone is deep
          children:
            - id: shallow-copy
              label: Shallow copy
              note: "Spread, Object.assign, slice: nested objects stay shared"
            - id: deep-copy
              label: Deep copy
              term: structuredclone
              note: "structuredClone: functions and DOM nodes throw DataCloneError"
    - id: dom-events
      children:
        - id: event-capturing
          label: Capturing phase
          note: "Outermost element down to the target; opt in with capture: true"
        - id: event-bubbling
          label: Bubbling phase
          note: Target up to the outermost element; the default for listeners
        - id: event-delegation
          label: Event delegation
          note: One parent listener; find the child with event.target
        - id: react-root-listeners
          label: React event delegation
          note: Since React 17 on the root container; all bubble but onScroll
  react-core:
    - id: what-is-react
      children:
        - id: render-phase
          label: Render phase
          note: React calls your components to work out the new UI; no DOM changes yet
        - id: commit-phase
          label: Commit phase
          note: React applies only the needed DOM changes; then the browser paints
        - id: diffing-rules
          label: Diffing rules
          note: O(n) heuristics instead of a full O(n³) tree diff
          children:
            - id: different-element-type
              label: Different element type
              note: Old subtree is unmounted and rebuilt; its state is lost
            - id: same-element-type
              label: Same element type
              note: Same DOM node kept; only changed attributes are updated
        - id: jsx-transform
          label: JSX transform
          note: Babel and similar compilers turn JSX into jsx() calls
        - id: react-dom-and-native
          label: React DOM and React Native
          note: react-dom renders to the browser DOM; React Native to Android and iOS
    - id: components-jsx-props
      children:
        - id: props-react
          label: Props
          note: Read-only inputs from the parent; every render gets new ones
        - id: children-prop
          label: children
          note: JSX nested inside a component's tags arrives as the children prop
        - id: callback-props
          label: Callback props
          note: The parent passes onAdd; the child calls it to ask for a change
        - id: fragment
          label: Fragment
          note: <>...</> groups nodes with no extra DOM node; a key needs <Fragment>
        - id: portal-react
          label: Portal (createPortal)
          note: Renders into another DOM node, e.g. a modal; events follow React tree
        - id: pure-render
          label: Pure render
          note: Same props, state and context give the same JSX; no side effects
        - id: class-components
          label: Class components
          note: Legacy; still supported, not recommended for new code; no hooks inside
    - id: use-state
      children:
        - id: state-react
          label: State
          note: A component's private memory; setting it queues a re-render
        - id: updater-function
          label: Updater function
          note: setQty(q => q + 1) gets the latest queued value
        - id: automatic-batching
          label: Automatic batching
          note: Since React 18, also inside timeouts, promises and native events
        - id: derived-state
          label: Derived state
          note: Compute it from props or state during render; do not store a copy
        - id: lazy-initial-state
          label: Lazy initial state
          note: useState(loadCart) calls loadCart only on the first render
    - id: lists-and-keys
      children:
        - id: index-as-key
          label: Index as key
          note: Safe only if items are never inserted, deleted or reordered
        - id: random-key
          label: Math.random() keys
          note: Never match between renders, so every row is recreated and loses input
        - id: keyed-fragment
          label: Keyed Fragment
          note: <Fragment key={p.id}> when one item renders several nodes
        - id: reset-state-with-key
          label: Reset state with a key
          note: A new key makes React recreate the component with fresh state
    - id: controlled-uncontrolled-forms
      children:
        - id: controlled-input
          label: Controlled input
          note: value plus onChange; React state holds the current text
        - id: uncontrolled-input
          label: Uncontrolled input
          note: defaultValue; the DOM holds the text, read it on submit
        - id: form-actions
          label: Form Actions (React 19)
          note: Pass a function to the form's action prop; it runs in a Transition
          children:
            - id: form-action-prop
              label: <form action={fn}>
              note: fn gets FormData; uncontrolled fields reset after success
            - id: use-action-state
              label: useActionState
              note: "From react: [state, dispatchAction, isPending] for an action"
            - id: use-form-status
              label: useFormStatus
              note: "From react-dom: pending status of the parent <form>"
            - id: use-optimistic
              label: useOptimistic
              note: Shows a temporary value while an action runs; reverts if it fails
        - id: react-hook-form
          label: React Hook Form
          note: Form library that cuts re-renders and handles validation
  hooks:
    - id: rules-of-hooks
      children:
        - id: built-in-hooks
          label: Built-in hooks
          note: "React groups them by job: state, context, ref, effect, performance"
          children:
            - id: state-hooks
              label: State hooks
              note: "useState and useReducer: data a component remembers"
            - id: context-hooks
              label: Context hooks
              note: "useContext: read a value from a distant parent"
            - id: ref-hooks
              label: Ref hooks
              note: "useRef and useImperativeHandle: values not used for rendering"
            - id: effect-hooks
              label: Effect hooks
              note: useEffect; rarer useLayoutEffect and useInsertionEffect
            - id: performance-hooks
              label: Performance hooks
              note: useMemo, useCallback, useTransition, useDeferredValue
        - id: custom-hook
          label: Custom hook
          note: A use-named function that calls hooks; each call has its own state
        - id: eslint-plugin-react-hooks
          label: eslint-plugin-react-hooks
          note: Lints rules-of-hooks and exhaustive-deps; also React Compiler rules
        - id: higher-order-component
          label: Higher-order component (HOC)
          note: Takes a component, returns a new one; rare in modern code
        - id: render-props
          label: Render props
          note: A prop that is a function returning UI, like renderItem
    - id: use-effect
      children:
        - id: dependency-array
          label: Dependency array
          note: Every reactive value the effect reads; compared with Object.is
        - id: cleanup-function
          label: Cleanup function
          note: Returned by setup; runs before the next run and on unmount
        - id: strict-mode-effects
          label: Strict Mode double run
          note: "Development only: one extra setup + cleanup after mount"
        - id: stale-closure
          label: Stale closure
          note: An effect keeps an old render's values when a dependency is missing
        - id: use-layout-effect
          label: useLayoutEffect
          note: Runs before the browser repaints; for measuring layout; can hurt speed
        - id: use-effect-event
          label: useEffectEvent
          note: "React 19.2: reads latest values without re-running the effect"
    - id: use-ref
      children:
        - id: dom-ref
          label: DOM ref
          note: "<input ref={inputRef}>: React sets .current to the node at commit"
        - id: value-ref
          label: Value ref
          note: Holds a timer id or other non-visual value; no re-render on change
        - id: ref-callback
          label: Ref callback
          note: A function passed to ref; may return a cleanup since React 19
        - id: ref-as-prop
          label: ref as a prop
          note: "React 19: function components read ref like any other prop"
        - id: forward-ref
          label: forwardRef
          note: The pre-19 way to pass a ref to a child; no longer needed in React 19
        - id: use-imperative-handle
          label: useImperativeHandle
          note: Exposes a custom handle (like only focus) instead of the DOM node
    - id: context-api
      children:
        - id: create-context
          label: createContext
          note: "createContext(default): default used only with no provider above"
        - id: context-provider
          label: Context provider
          note: "React 19: <CartContext value>; .Provider is the legacy form"
        - id: use-context
          label: useContext
          note: Returns the closest provider's value; re-renders when it changes
        - id: context-use-cases
          label: Common uses
          note: Theme, current user, routing, shared state with a reducer
        - id: memoized-context-value
          label: Memoized context value
          note: useMemo and useCallback keep the value the same across re-renders
    - id: use-reducer
      children:
        - id: reducer-function
          label: Reducer function
          note: Pure (state, action) => next state; runs during render
        - id: action-object
          label: Action
          note: "An object saying what happened: { type: 'added', id }"
        - id: dispatch-function
          label: dispatch
          note: Stable identity; the new state appears on the next render
        - id: reducer-initializer
          label: Initializer function
          note: "useReducer(reducer, arg, init): first state is init(arg)"
        - id: reducer-with-context
          label: Reducer + context
          note: Provide state and dispatch in two contexts for a deep tree
  app-state:
    - id: lifting-state-up
      children:
        - id: single-source-of-truth
          label: Single source of truth
          note: Each piece of state has one owner; others get it as props
        - id: prop-drilling
          label: Prop drilling
          note: Middle components receive props only to pass them further down
        - id: composition-with-children
          label: Composition with children
          note: Pass JSX as children so middle layers never touch the prop
        - id: state-colocation
          label: State colocation
          note: Keep state in the lowest component that uses it
    - id: global-state
      children:
        - id: client-state
          label: Client state
          note: "Owned by the app, read synchronously: theme, sidebar, cart"
        - id: server-state
          label: Server state
          note: Lives on the server, fetched async; best kept in a query cache
        - id: url-state
          label: URL state
          note: Search text and filters in ?q=, read with useSearchParams
        - id: redux-toolkit
          label: Redux Toolkit
          note: The official recommended way to write Redux (Redux Toolkit 2)
          children:
            - id: configure-store
              label: configureStore
              note: Creates the store with thunk, DevTools and a mutation check
            - id: create-slice
              label: createSlice
              note: Immer reducers; generates action creators and action types
            - id: use-selector
              label: useSelector
              note: Reads store state; re-renders when the result changes (===)
            - id: use-dispatch
              label: useDispatch
              note: Returns the store's dispatch function to send actions
            - id: rtk-query
              label: RTK Query
              note: Data fetching and caching built into Redux Toolkit
        - id: zustand-store
          label: Zustand
          note: create() returns a store hook; select a slice; no Provider
    - id: data-fetching
      children:
        - id: fetch-in-effect
          label: Fetching in useEffect
          note: Works, but no cache, no dedupe, and race handling by hand
          children:
            - id: ignore-flag
              label: Ignore flag
              note: Cleanup sets ignore = true, so a late response is dropped
            - id: abort-fetch-controller
              label: AbortController
              note: abort() cancels the fetch; it rejects with an AbortError
        - id: tanstack-query
          label: TanStack Query
          note: "A server-state cache: caching, dedupe, retries, refetching"
          children:
            - id: use-query-hook
              label: useQuery
              note: queryKey names the cache entry; queryFn fetches the data
            - id: use-mutation-hook
              label: useMutation
              note: Runs a write; invalidateQueries then refetches stale lists
        - id: use-promise-suspense
          label: use() with Suspense
          note: "React 19: use(promise) suspends until it resolves; cache the promise"
        - id: error-boundary
          label: Error boundary
          note: Shows fallback UI when a child throws while rendering
    - id: react-router
      children:
        - id: history-api
          label: History API
          note: pushState changes the URL; the browser does not load it
        - id: react-router-modes
          label: Three modes
          note: Each mode adds features on top of the one before
          children:
            - id: declarative-mode
              label: Declarative mode
              note: "BrowserRouter, Routes, Route: match URLs to components"
            - id: data-mode
              label: Data mode
              note: createBrowserRouter + RouterProvider; adds loader and action
            - id: framework-mode
              label: Framework mode
              note: Data mode inside a Vite plugin; adds SSR and code splitting
        - id: link-and-navlink
          label: Link and NavLink
          note: Client navigation; NavLink adds an active class
        - id: router-hooks
          label: Router hooks
          note: Read the URL and navigate from components
          children:
            - id: use-params
              label: useParams
              note: Reads :id from /products/:id
            - id: use-search-params
              label: useSearchParams
              note: Reads and sets ?q=; setting it causes a navigation
            - id: use-navigate
              label: useNavigate
              note: Navigate in code, e.g. after a form submit; prefer Link
        - id: nested-routes
          label: Nested routes and Outlet
          note: Children add to the parent path; the parent renders <Outlet />
        - id: protected-route
          label: Protected route
          note: Redirect to /login when signed out; the server still checks
        - id: catch-all-route
          label: 404 route
          note: A path="*" route catches URLs no other route matches
  performance:
    - id: re-renders
      children:
        - id: state-change-trigger
          label: Own state change
          note: Setting state queues a new render of that component
        - id: parent-render-trigger
          label: Parent re-render
          note: Children render again too, unless memo skips them
        - id: context-change-trigger
          label: Context value change
          note: Every reader re-renders; memo does not stop it
        - id: concurrent-rendering
          label: Concurrent rendering
          note: Since React 18, React can pause or drop a render for urgent input
          children:
            - id: use-transition
              label: useTransition
              note: Marks an update non-urgent; isPending shows it is running
            - id: use-deferred-value
              label: useDeferredValue
              note: Shows the old value first, renders the new one in the background
    - id: memoization
      children:
        - id: referential-equality
          label: Referential equality
          note: Objects and functions are equal only if they are the same reference
        - id: react-memo
          label: React.memo
          note: Skips a child render when every prop is Object.is equal
        - id: use-memo
          label: useMemo
          note: Caches a calculated value until a dependency changes
        - id: use-callback
          label: useCallback
          note: Caches a function; same as useMemo(() => fn, deps)
        - id: react-compiler
          label: React Compiler
          note: Build-time automatic memoization; 1.0 stable on 07-10-2025
    - id: bundling-code-splitting
      children:
        - id: bundler
          label: Bundler
          note: Follows imports and writes a few optimised files (chunks)
          children:
            - id: transpiler
              label: Transpiling
              note: "Turns JSX and TypeScript into plain JS: SWC, Oxc, Babel"
        - id: es-module
          label: ES modules
          note: import and export; static imports show tools what is used
          children:
            - id: named-export
              label: Named export
              note: Many per module; imported by name in braces
            - id: default-export
              label: Default export
              note: Only one per module; imported without braces
        - id: tree-shaking
          label: Tree shaking
          note: Drops unused exports; relies on import and export
        - id: code-splitting
          label: Code splitting
          note: Split the bundle so the first page loads only its own code
          children:
            - id: dynamic-import
              label: Dynamic import
              note: import() loads a module on demand and returns a Promise
            - id: react-lazy
              label: React.lazy
              note: Loads a component's code on first render; needs a default export
        - id: vite
          label: Vite
          note: "Vite 8: dev server over native ESM; Rolldown is the bundler"
        - id: create-react-app
          label: Create React App
          note: Deprecated for new apps by the React team on 14-02-2025
    - id: large-lists-and-frequent-events
      children:
        - id: virtualization
          label: Virtualization (windowing)
          note: Render only the rows in view; the window moves as you scroll
          children:
            - id: overscan
              label: Overscan
              note: Extra rows outside the view to avoid blank flashes
            - id: tanstack-virtual
              label: TanStack Virtual
              note: "Headless: useVirtualizer gives positions, you write the markup"
            - id: react-window
              label: react-window
              note: Small library of ready-made virtualized list components
        - id: pagination-infinite-scroll
          label: Pagination or infinite scroll
          note: Load fewer rows; infinite scroll loads more as you scroll
        - id: debounce
          label: Debounce
          note: Waits until events stop, then runs once
        - id: throttle
          label: Throttle
          note: Runs at most once per interval while events keep coming
    - id: measuring-performance
      children:
        - id: react-devtools-profiler
          label: React DevTools Profiler
          note: "Records commits: which components rendered and for how long"
        - id: performance-panel
          label: Performance panel
          note: Chrome timeline; marks tasks over 50 ms with a red triangle
        - id: lighthouse
          label: Lighthouse
          note: Automated lab audit; cannot measure INP, so it reports TBT
        - id: field-data
          label: Field data (RUM)
          note: Numbers from real users, e.g. CrUX; lab data is a controlled test
        - id: core-web-vitals
          label: Core Web Vitals
          note: LCP, INP and CLS, judged at the 75th percentile
          children:
            - id: lcp
              label: LCP
              note: When the largest image or text block in view is rendered
            - id: inp
              label: INP
              note: Slowest click, tap or key response over the visit, minus outliers
            - id: cls
              label: CLS
              note: Largest burst of unexpected layout shifts
            - id: ttfb
              label: TTFB
              note: Time until the first byte of the response arrives
            - id: fcp
              label: FCP
              note: Time until any content first appears on screen
        - id: next-image
          label: next/image
          note: "Next.js image component: sized, lazy by default, modern formats"
  modern:
    - id: rendering-strategies
      children:
        - id: client-side-rendering
          label: CSR
          note: The browser builds the DOM with JavaScript after the bundle loads
        - id: server-side-rendering
          label: SSR
          note: The server renders HTML per request; this can raise TTFB
        - id: static-site-generation
          label: SSG
          note: HTML generated at build time, usually one file per URL
        - id: incremental-static-regeneration
          label: ISR
          note: After the revalidate time, serves stale and rebuilds in the background
        - id: hydration
          label: Hydration
          note: hydrateRoot attaches React and event handlers to server HTML
          children:
            - id: hydration-mismatch
              label: Hydration mismatch
              note: First client render differs from server HTML; fix it like a bug
        - id: streaming-ssr
          label: Streaming SSR
          note: Sends the shell and Suspense fallbacks first, then the rest
          children:
            - id: partial-prerendering
              label: Partial Prerendering (PPR)
              note: Static shell plus streamed dynamic parts; default with Cache Components
    - id: server-components
      children:
        - id: react-server-components
          label: Server Components
          note: Default in the App Router; add nothing to the client bundle
        - id: client-components
          label: Client Components
          note: State, Effects, browser APIs; also prerendered to HTML on first load
        - id: use-client-directive
          label: "'use client'"
          note: First line of a file; the file and its imports become client code
        - id: server-functions
          label: Server Functions ('use server')
          note: Async server code the client can call; as a form action, a Server Action
        - id: app-router-files
          label: App Router files
          note: Folders are URL segments; special files add UI to a segment
          children:
            - id: layout-file
              label: layout.js
              note: Shared UI; keeps state and does not re-render on navigation
            - id: page-file
              label: page.js
              note: Makes the segment a public route
            - id: loading-file
              label: loading.js
              note: Wraps the page in a Suspense boundary with this fallback
            - id: error-file
              label: error.js
              note: Wraps the segment in a React error boundary
            - id: route-groups
              label: Route groups
              note: A (shop) folder groups routes and layouts; not part of the URL
    - id: testing-react
      children:
        - id: testing-trophy
          label: Testing trophy
          note: Static, unit, integration, E2E; write mostly integration tests
          children:
            - id: unit-test
              label: Unit tests
              note: One unit, with its dependencies absent or mocked
            - id: integration-test
              label: Integration tests
              note: Several units working together
            - id: end-to-end-test
              label: E2E tests (Playwright, Cypress)
              note: The whole app in a real browser, with few or no mocks
        - id: query-priority
          label: Query priority
          note: ByRole first, ByLabelText for form fields, ByTestId last
        - id: user-event
          label: user-event
          note: Simulates whole interactions; call userEvent.setup() before render
        - id: msw
          label: Mock Service Worker (MSW)
          note: Mocks APIs at the network level in the browser and in Node
        - id: test-runners
          label: Vitest and Jest
          note: Vitest 5 is Vite-based and needs Node 22.12+; Jest is at 30
        - id: snapshot-test
          label: Snapshot tests
          note: Compare saved output; keep them small and review every update
    - id: frontend-playbook
      children:
        - id: thinking-in-react
          label: Thinking in React
          note: Split UI, build it static, find minimal state, place it, wire events
        - id: measure-first
          label: Measure first
          note: Time a production build on a slow device before you optimise
        - id: machine-coding-round
          label: Machine coding round
          note: Build a widget or small app, such as tabs or autocomplete, live
