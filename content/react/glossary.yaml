terms:
  - id: dom
    term: DOM
    aka:
      - Document Object Model
    definition: The browser's tree of nodes built from the HTML; JavaScript can read and change it.
    see: how-browsers-render
    source:
      title: "Populating the page: how browsers work (MDN)"
      url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
      verifiedOn: 2026-10-20
  - id: cssom
    term: CSSOM
    aka:
      - CSS Object Model
    definition: The browser's tree of style rules built from CSS, joined with the DOM to render.
    see: how-browsers-render
    source:
      title: "Populating the page: how browsers work (MDN)"
      url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
      verifiedOn: 2026-10-20
  - id: render-tree
    term: Render tree
    aka: []
    definition: "The DOM and CSSOM combined: only visible nodes, each with its computed styles."
    see: how-browsers-render
    source:
      title: Critical rendering path (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Critical_rendering_path
      verifiedOn: 2026-10-20
  - id: critical-rendering-path
    term: Critical rendering path
    aka: []
    definition: "The browser's steps from HTML, CSS and JavaScript to pixels: DOM, CSSOM, render tree, layout, paint."
    see: how-browsers-render
    source:
      title: Critical rendering path (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Critical_rendering_path
      verifiedOn: 2026-10-20
  - id: reflow
    term: Reflow
    aka: []
    definition: Recalculating the size and position of part or all of the page after a change.
    see: how-browsers-render
    source:
      title: Reflow (MDN Glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Reflow
      verifiedOn: 2026-10-20
  - id: repaint
    term: Repaint
    aka: []
    definition: Redrawing pixels after a visual change; usually follows a reflow, but a colour change needs only this.
    see: how-browsers-render
    source:
      title: Rendering performance (web.dev)
      url: https://web.dev/articles/rendering-performance
      verifiedOn: 2026-10-20
  - id: compositing
    term: Compositing
    aka: []
    definition: Drawing separately painted layers to the screen in the right order.
    see: how-browsers-render
    source:
      title: Rendering performance (web.dev)
      url: https://web.dev/articles/rendering-performance
      verifiedOn: 2026-10-20
  - id: render-blocking
    term: Render-blocking
    aka:
      - render blocking
    definition: A resource the browser must load before it can show the page; usually CSS or JavaScript.
    see: how-browsers-render
    source:
      title: Render-blocking (MDN Glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Render_blocking
      verifiedOn: 2026-10-20
  - id: async-script
    term: async (script)
    aka:
      - async attribute
      - script async
    definition: "Script attribute: download in parallel and run as soon as ready, in any order."
    see: how-browsers-render
    source:
      title: The script element (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script
      verifiedOn: 2026-10-20
  - id: defer-script
    term: defer (script)
    aka:
      - defer attribute
      - script defer
    definition: "Script attribute: download in parallel and run after HTML parsing, in document order."
    see: how-browsers-render
    source:
      title: The script element (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script
      verifiedOn: 2026-10-20
  - id: semantic-html
    term: Semantic HTML
    aka:
      - semantic elements
    definition: Using elements for their meaning, such as button, nav and h1, not generic divs.
    see: semantic-html-accessibility
    source:
      title: "HTML: a good basis for accessibility (MDN Learn)"
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
      verifiedOn: 2026-10-20
  - id: accessibility-term
    term: Accessibility (a11y)
    aka:
      - a11y
      - web accessibility
    definition: Making a site usable by everyone, including people using screen readers, keyboards or zoom.
    see: semantic-html-accessibility
    source:
      title: "HTML: a good basis for accessibility (MDN Learn)"
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
      verifiedOn: 2026-10-20
  - id: screen-reader
    term: Screen reader
    aka:
      - screen readers
    definition: Assistive software that reads a page aloud and lets users jump by headings, links and landmarks.
    see: semantic-html-accessibility
    source:
      title: "HTML: a good basis for accessibility (MDN Learn)"
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
      verifiedOn: 2026-10-20
  - id: landmarks
    term: Landmark (ARIA)
    aka:
      - landmark region
      - landmark roles
    definition: A named page region, like navigation or main, that screen reader users can jump to.
    see: semantic-html-accessibility
    source:
      title: Landmark Regions (W3C ARIA Authoring Practices Guide)
      url: https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/
      verifiedOn: 2026-10-20
  - id: aria
    term: ARIA
    aka:
      - WAI-ARIA
    definition: Attributes (roles, states, properties) that add meaning for assistive tech; they add no behaviour.
    see: semantic-html-accessibility
    source:
      title: ARIA (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA
      verifiedOn: 2026-10-20
  - id: accessible-name
    term: Accessible name
    aka: []
    definition: The text assistive tech announces for an element, from its content, a label or aria-label.
    see: semantic-html-accessibility
    source:
      title: Accessible name (MDN Glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Accessible_name
      verifiedOn: 2026-10-20
  - id: wcag
    term: WCAG
    aka:
      - Web Content Accessibility Guidelines
    definition: W3C accessibility guidelines; version 2.2 has testable success criteria at levels A, AA and AAA.
    see: semantic-html-accessibility
    source:
      title: Web Content Accessibility Guidelines (WCAG) 2.2 (W3C)
      url: https://www.w3.org/TR/WCAG22/
      verifiedOn: 2026-10-20
  - id: local-storage
    term: localStorage
    aka: []
    definition: Web Storage area per origin that keeps string key/value pairs with no expiry.
    see: browser-storage-cookies
    source:
      title: "Window: localStorage property (MDN)"
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage
      verifiedOn: 2026-10-20
  - id: session-storage
    term: sessionStorage
    aka: []
    definition: Web Storage area per origin and tab, cleared when the tab closes.
    see: browser-storage-cookies
    source:
      title: "Window: sessionStorage property (MDN)"
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage
      verifiedOn: 2026-10-20
  - id: http-cookie
    term: Cookie (HTTP)
    aka:
      - HTTP cookie
      - Set-Cookie
    definition: A small name=value pair the server sets and the browser sends back with matching requests.
    see: browser-storage-cookies
    source:
      title: Using HTTP cookies (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
      verifiedOn: 2026-10-20
  - id: httponly
    term: HttpOnly
    aka: []
    definition: Cookie attribute that hides the cookie from JavaScript such as document.cookie.
    see: browser-storage-cookies
    source:
      title: Using HTTP cookies (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
      verifiedOn: 2026-10-20
  - id: secure-cookie
    term: Secure (cookie)
    aka:
      - Secure attribute
    definition: "Cookie attribute: send the cookie only over HTTPS."
    see: browser-storage-cookies
    source:
      title: Set-Cookie header (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
      verifiedOn: 2026-10-20
  - id: samesite
    term: SameSite
    aka: []
    definition: Cookie attribute (Strict, Lax or None) that controls sending the cookie on cross-site requests.
    see: browser-storage-cookies
    source:
      title: Set-Cookie header (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
      verifiedOn: 2026-10-20
  - id: indexeddb
    term: IndexedDB
    aka: []
    definition: An asynchronous, transactional browser database for large amounts of structured data and files.
    see: browser-storage-cookies
    source:
      title: IndexedDB API (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API
      verifiedOn: 2026-10-20
  - id: origin-term
    term: Origin (web)
    aka:
      - scheme, host and port
    definition: The scheme, host and port of a URL; two URLs share an origin only if all three match.
    see: frontend-security
    source:
      title: Same-origin policy (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy
      verifiedOn: 2026-10-20
  - id: same-origin-policy
    term: Same-origin policy
    aka: []
    definition: Browser rule stopping a script from reading resources of another origin unless allowed.
    see: frontend-security
    source:
      title: Same-origin policy (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy
      verifiedOn: 2026-10-20
  - id: xss
    term: XSS
    aka:
      - cross-site scripting
    definition: An attack where untrusted input runs as script inside a victim's page.
    see: frontend-security
    source:
      title: Types of Cross-Site Scripting (OWASP)
      url: https://owasp.org/www-community/Types_of_Cross-Site_Scripting
      verifiedOn: 2026-10-20
  - id: csrf
    term: CSRF
    aka:
      - cross-site request forgery
    definition: An attack where another site makes a logged-in user's browser send an unwanted request.
    see: frontend-security
    source:
      title: Cross-Site Request Forgery Prevention Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: cors
    term: CORS
    aka:
      - Cross-Origin Resource Sharing
    definition: HTTP headers by which a server lets other origins read its responses in the browser.
    see: frontend-security
    source:
      title: Cross-Origin Resource Sharing (CORS) (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
      verifiedOn: 2026-10-20
  - id: preflight-request
    term: Preflight request
    aka:
      - preflight
      - CORS preflight
    definition: An OPTIONS request the browser sends first to ask if a non-simple cross-origin request is allowed.
    see: frontend-security
    source:
      title: Cross-Origin Resource Sharing (CORS) (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
      verifiedOn: 2026-10-20
  - id: content-security-policy
    term: Content Security Policy
    aka:
      - CSP
    definition: A response header telling the browser which script and resource sources the page may load.
    see: frontend-security
    source:
      title: Content Security Policy (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
      verifiedOn: 2026-10-20
  - id: sanitisation
    term: Sanitisation (HTML)
    aka:
      - HTML sanitisation
      - HTML sanitization
    definition: Removing dangerous tags and attributes from HTML before rendering it; OWASP recommends DOMPurify.
    see: frontend-security
    source:
      title: Cross Site Scripting Prevention Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: box-model-term
    term: Box model
    aka:
      - CSS box model
    definition: Every element is a box of content, padding, border and margin, from the inside out.
    see: box-model-positioning
    source:
      title: The box model (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model
      verifiedOn: 2026-10-20
  - id: box-sizing
    term: box-sizing
    definition: Property that sets whether width and height measure the content box (content-box) or include padding and border (border-box).
    see: box-model-positioning
    source:
      title: box-sizing (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/box-sizing
      verifiedOn: 2026-10-20
  - id: block-box-term
    term: Block box
    aka:
      - block element
      - block-level element
    definition: A box that starts on a new line, fills the container's width and respects width and height.
    see: box-model-positioning
    source:
      title: The box model (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model
      verifiedOn: 2026-10-20
  - id: inline-box-term
    term: Inline box
    aka:
      - inline element
    definition: A box that stays in the line of text; width, height and top or bottom margins do not apply.
    see: box-model-positioning
    source:
      title: The box model (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model
      verifiedOn: 2026-10-20
  - id: inline-block-term
    term: inline-block
    definition: display value that stays in the line like inline but respects width, height and margins.
    see: box-model-positioning
    source:
      title: The box model (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model
      verifiedOn: 2026-10-20
  - id: positioned-element
    term: Positioned element
    definition: "An element whose position is relative, absolute, fixed or sticky: anything but static."
    see: box-model-positioning
    source:
      title: position (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/position
      verifiedOn: 2026-10-20
  - id: stacking-context
    term: Stacking context
    definition: A group of elements stacked as one unit; z-index values inside it only compete with each other.
    see: box-model-positioning
    source:
      title: Stacking context (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Positioned_layout/Stacking_context
      verifiedOn: 2026-10-20
  - id: z-index
    term: z-index
    definition: Sets the stacking order of positioned elements and flex or grid items; larger values cover smaller ones.
    see: box-model-positioning
    source:
      title: z-index (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/z-index
      verifiedOn: 2026-10-20
  - id: margin-collapsing
    term: Margin collapsing
    aka:
      - collapsing margins
    definition: Touching vertical margins of blocks merge into one margin the size of the largest.
    see: box-model-positioning
    source:
      title: Margin collapsing (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Box_model/Margin_collapsing
      verifiedOn: 2026-10-20
  - id: cascade-term
    term: Cascade (CSS)
    aka:
      - the cascade
      - CSS cascade
    definition: The algorithm that picks which declaration applies when several rules set the same property.
    see: specificity-cascade
    source:
      title: Introduction to the CSS cascade (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Introduction
      verifiedOn: 2026-10-20
  - id: specificity
    term: Specificity
    aka:
      - selector specificity
    definition: A selector's weight as ID, CLASS and TYPE counts; used when origin, inline style and layer tie.
    see: specificity-cascade
    source:
      title: Specificity (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity
      verifiedOn: 2026-10-20
  - id: pseudo-class
    term: Pseudo-class
    aka:
      - pseudo-classes
    definition: A selector keyword for a state or position, like :hover or :nth-child(); counts in the CLASS column.
    see: specificity-cascade
    source:
      title: Specificity (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity
      verifiedOn: 2026-10-20
  - id: important-flag
    term: "!important"
    aka:
      - important flag
    definition: Flag that makes a declaration important, beating all normal declarations for that property.
    see: specificity-cascade
    source:
      title: "!important (MDN)"
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/important
      verifiedOn: 2026-10-20
  - id: cascade-layer
    term: Cascade layer
    aka:
      - "@layer"
      - cascade layers
    definition: An ordered group of rules made with @layer; layer order is checked before specificity.
    see: specificity-cascade
    source:
      title: "@layer (MDN)"
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@layer
      verifiedOn: 2026-10-20
  - id: inheritance-css
    term: Inheritance (CSS)
    aka:
      - CSS inheritance
      - inherited property
      - inherited properties
    definition: Inherited properties such as color take the parent's computed value when no rule sets them.
    see: specificity-cascade
    source:
      title: Inheritance (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Inheritance
      verifiedOn: 2026-10-20
  - id: flexbox
    term: Flexbox
    aka:
      - flexible box layout
      - flex container
      - flex item
    definition: "One-dimensional CSS layout: display: flex lines up the direct children along a row or a column."
    see: flexbox-and-grid
    source:
      title: Basic concepts of flexbox (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Flexible_box_layout/Basic_concepts
      verifiedOn: 2026-10-20
  - id: css-grid
    term: CSS Grid
    aka:
      - grid layout
      - grid container
    definition: "Two-dimensional CSS layout: display: grid places items into defined rows and columns."
    see: flexbox-and-grid
    source:
      title: Basic concepts of grid layout (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Grid_layout/Basic_concepts
      verifiedOn: 2026-10-20
  - id: main-axis
    term: Main axis
    definition: The flexbox direction set by flex-direction; justify-content aligns items along it.
    see: flexbox-and-grid
    source:
      title: Basic concepts of flexbox (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Flexible_box_layout/Basic_concepts
      verifiedOn: 2026-10-20
  - id: cross-axis
    term: Cross axis
    definition: The flexbox axis at right angles to the main axis; align-items aligns items along it.
    see: flexbox-and-grid
    source:
      title: Basic concepts of flexbox (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Flexible_box_layout/Basic_concepts
      verifiedOn: 2026-10-20
  - id: fr-unit
    term: fr unit
    definition: A grid track size that takes one fraction of the free space in the grid container.
    see: flexbox-and-grid
    source:
      title: Basic concepts of grid layout (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Grid_layout/Basic_concepts
      verifiedOn: 2026-10-20
  - id: gap-css
    term: gap (CSS)
    aka:
      - gap property
    definition: Shorthand for the space between rows and columns in flex, grid and multi-column containers.
    see: flexbox-and-grid
    source:
      title: gap (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/gap
      verifiedOn: 2026-10-20
  - id: media-query
    term: Media query
    aka:
      - media queries
      - "@media"
    definition: A CSS condition, such as min-width, that applies rules only when the viewport or device matches.
    see: responsive-design
    source:
      title: Using media queries (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Media_queries/Using
      verifiedOn: 2026-10-20
  - id: mobile-first
    term: Mobile-first
    aka:
      - mobile first
    definition: Writing base styles for narrow screens first, then adding layouts for wider screens with min-width queries.
    see: responsive-design
    source:
      title: Responsive web design (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Responsive_Design
      verifiedOn: 2026-10-20
  - id: breakpoint-css
    term: Breakpoint (CSS)
    aka:
      - responsive breakpoint
      - media query breakpoint
    definition: A width at which a media query changes the layout; best set in relative units.
    see: responsive-design
    source:
      title: Responsive web design (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Responsive_Design
      verifiedOn: 2026-10-20
  - id: viewport-term
    term: Viewport
    definition: The visible area of the page in the browser window; vw and vh units are measured from it.
    see: responsive-design
    source:
      title: Viewport meta tag (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport
      verifiedOn: 2026-10-20
  - id: rem
    term: rem
    definition: CSS unit relative to the font size of the root (html) element.
    see: responsive-design
    source:
      title: CSS values and units (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units
      verifiedOn: 2026-10-20
  - id: em-css
    term: em (CSS unit)
    aka:
      - em unit
      - em units
    definition: CSS unit relative to the element's font size, or the parent's when used for font-size.
    see: responsive-design
    source:
      title: CSS values and units (MDN Learn)
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Values_and_units
      verifiedOn: 2026-10-20
  - id: viewport-units
    term: Viewport units
    aka:
      - vw
      - vh
      - dvh
    definition: Units that are 1% of the viewport, such as vw and vh; dvh follows mobile browser bars.
    see: responsive-design
    source:
      title: The large, small, and dynamic viewport units (web.dev)
      url: https://web.dev/blog/viewport-units
      verifiedOn: 2026-10-20
  - id: clamp-function
    term: clamp()
    definition: CSS function clamp(min, preferred, max) that keeps a value between a lower and an upper bound.
    see: responsive-design
    source:
      title: clamp() (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/clamp
      verifiedOn: 2026-10-20
  - id: container-query
    term: Container query
    aka:
      - container queries
      - "@container"
    definition: An @container rule that styles elements by the size of an ancestor container, not the viewport.
    see: responsive-design
    source:
      title: CSS container queries (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Containment/Container_queries
      verifiedOn: 2026-10-20
  - id: hoisting
    term: Hoisting
    definition: Declarations are set up before code runs, so some names can be used before their line.
    see: scope-hoisting
    source:
      title: Hoisting (MDN Glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
      verifiedOn: 2026-10-20
  - id: temporal-dead-zone
    term: Temporal dead zone
    aka:
      - TDZ
    definition: The time from block start until a let, const or class line runs; access throws ReferenceError.
    see: scope-hoisting
    source:
      title: let (MDN JavaScript reference)
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let
      verifiedOn: 2026-10-20
  - id: lexical-scope
    term: Lexical scope
    aka:
      - lexical scoping
    definition: Scope decided by where code is written, not by where a function is called.
    see: closures
    source:
      title: Closures (MDN JavaScript Guide)
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures
      verifiedOn: 2026-10-20
  - id: scope-chain
    term: Scope chain
    definition: The chain of outer scopes a name lookup walks through, inner to outer.
    see: scope-hoisting
    source:
      title: Scope (MDN Glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Scope
      verifiedOn: 2026-10-20
