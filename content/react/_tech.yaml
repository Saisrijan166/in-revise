name: React & Frontend
slug: react
accent: pink
summary: "React 19 for interviews, with the frontend basics around it: how browsers render, CSS layout, core JavaScript, hooks, state, routing, performance, Next.js and testing."
codeLanguages:
  - jsx
storySpine:
  - step: The shop page loads slowly and some shoppers use only a keyboard or screen reader → know the render pipeline, defer scripts and use semantic HTML
    cards:
      - how-browsers-render
      - semantic-html-accessibility
  - step: The cart and login must survive reloads without being stolen → pick the right browser store and block XSS, CSRF and CORS mistakes
    cards:
      - browser-storage-cookies
      - frontend-security
  - step: Boxes come out the wrong size and land in the wrong place → learn the box model, border-box, display and position
    cards:
      - box-model-positioning
  - step: "Two rules fight over one element and the wrong one wins → follow the cascade: layers, specificity, then source order"
    cards:
      - specificity-cascade
  - step: Fixed widths break on phones → lay out with Flexbox and Grid, mobile-first media queries and relative units
    cards:
      - flexbox-and-grid
      - responsive-design
  - step: Variables, this and comparisons behave in surprising ways → learn scope and hoisting, closures, this, equality and copying rules
    cards:
      - scope-hoisting
      - closures
      - this-keyword
      - types-equality
      - arrays-objects
  - step: The page must wait for data and clicks without freezing → the event loop runs events, promise callbacks and timers in a fixed order
    cards:
      - event-loop
      - promises-async-await
      - dom-events
  - step: Updating the DOM by hand for every click gets messy → describe the UI as components with props, and let React diff and patch the DOM
    cards:
      - what-is-react
      - components-jsx-props
  - step: The cart must remember quantities, show product lists and read the search box → keep state with useState, key each row, and choose controlled or uncontrolled inputs
    cards:
      - use-state
      - lists-and-keys
      - controlled-uncontrolled-forms
  - step: Several components need the same stateful logic, and later the same data deep in the tree → write a custom hook for the logic, and use context instead of passing props down every level
    cards:
      - rules-of-hooks
      - context-api
  - step: A component must talk to the outside world, hold a DOM node, and update a cart in many ways → an effect with cleanup, a ref, and a reducer
    cards:
      - use-effect
      - use-ref
      - use-reducer
  - step: Siblings need the same search text, and far-apart parts need the cart → lift state to a common parent, then Context or a store
    cards:
      - lifting-state-up
      - global-state
  - step: Products come from an API that is slow, can fail and can answer out of order, and each page needs its own URL → a query cache for data and React Router for URLs
    cards:
      - data-fetching
      - react-router
  - step: The shop feels slow and components re-render on every click → measure with the Profiler first, then move state down and memoize only the hot spots
    cards:
      - measuring-performance
      - re-renders
      - memoization
  - step: The first visit downloads one huge bundle, a 10,000-row list and an API call per keystroke → split code by route, virtualize the list, debounce the search
    cards:
      - bundling-code-splitting
      - large-lists-and-frequent-events
  - step: A blank page waits for the JavaScript bundle and crawlers see little → prerender with SSG or ISR, use SSR for per-request data, and stream slow parts
    cards:
      - rendering-strategies
      - server-components
  - step: Changes break the shop silently and interviews test judgement → test like a user, and answer by symptom, cause and fix
    cards:
      - testing-react
      - frontend-playbook
topics:
  - id: web-basics
    title: Web and Browser Basics
    order: 1
    blurb: How a page loads and renders, semantic HTML and accessibility, browser storage and cookies, and frontend security.
  - id: css
    title: CSS Essentials
    order: 2
    blurb: The box model and positioning, specificity and the cascade, Flexbox and Grid, and responsive design.
  - id: javascript
    title: JavaScript Essentials
    order: 3
    blurb: Scope, closures, this, the event loop, promises, equality, arrays and objects, and DOM events.
  - id: react-core
    title: React Fundamentals
    order: 4
    blurb: What React is, components, JSX and props, state, lists and keys, and forms.
  - id: hooks
    title: Hooks
    order: 5
    blurb: The rules of hooks, custom hooks, useEffect, useRef, Context and useReducer.
  - id: app-state
    title: State, Data and Routing
    order: 6
    blurb: Where state should live, global state tools, fetching data and client-side routing.
  - id: performance
    title: Performance
    order: 7
    blurb: What causes re-renders, memoization, bundles and code splitting, large lists, debounce and throttle, and measuring.
  - id: modern
    title: Next.js, Testing and Playbook
    order: 8
    blurb: Rendering strategies, Server Components, testing React apps, and how to answer frontend interview questions.
