id: csr-vs-ssr-vs-ssg-vs-isr
tech: react
title: "CSR vs SSR vs SSG vs ISR"
compares: [client-side-rendering, server-side-rendering, static-site-generation, incremental-static-regeneration]
gist:
  - "The browser builds the page with JavaScript"
  - "The server builds HTML for every request"
  - "HTML is built once, at build time"
  - "Static HTML, regenerated in the background"
rows:
  - { aspect: "HTML built", a: "In the browser, after the JS loads", b: "On the server, per request", c: "At build time", d: "At build, then again after the revalidate time" }
  - { aspect: "First paint and SEO", a: "Slower; crawlers may need extra work", b: "Fast first paint; full HTML for crawlers", c: "Fastest; served from a CDN", d: "Fast, like SSG" }
  - { aspect: "Server cost", a: "Static files, plus the API calls", b: "A render per request; can raise TTFB", c: "None per request", d: "An occasional background render" }
  - { aspect: "Freshness", a: "Live data from the browser", b: "Fresh on every request", c: "Fixed until the next build", d: "Can lag by up to the revalidate time" }
  - { aspect: "Next.js 16", a: "'use client' + fetch in the browser", b: "Reads cookies(), headers() or searchParams", c: "No request data: prerendered", d: "revalidate = 3600, or 'use cache' + cacheLife" }
  - { aspect: "Shop page", a: "Cart", b: "Search results", c: "Help pages", d: "Product pages" }
verdict: "Prerender what everyone sees (SSG, or ISR when it changes); use SSR only for per-request data and CSR for private, interactive parts like the cart."
sources:
