id: csr-vs-ssr-vs-ssg-vs-isr
tech: react
title: "CSR vs SSR vs SSG vs ISR"
compares: [client-side-rendering, server-side-rendering, static-site-generation, incremental-static-regeneration]
gist:
  - "The browser builds the page with JavaScript"
  - "The server builds HTML for every request"
  - "HTML is built once, at build time"
  - "Static HTML, regenerated in the background"
explain:
  - "Client-side rendering: the server sends near-empty HTML plus JavaScript, and the browser builds the whole page. It suits private, highly interactive views where fast first paint and SEO do not matter, such as a logged-in dashboard."
  - "Server-side rendering: the server builds full HTML for every request. It suits pages whose content depends on the request, such as search results, giving a fast first paint and crawlable HTML at the cost of per-request server work."
  - "Static site generation: HTML is built once at build time and served from a CDN. It suits pages that are the same for everyone and change rarely, such as docs, giving the fastest, cheapest response."
  - "Incremental static regeneration: SSG that rebuilds a page in the background after a set time. It suits shared pages that change occasionally, such as a product page, without a full redeploy."
example: "A shop: the cart is private and interactive, so render it client-side. Search results depend on the query, so render them per request (SSR). Help pages never change between builds, so prebuild them (SSG). Product pages change a few times a day, so prebuild and refresh them hourly (ISR)."
rows:
  - { aspect: "HTML built", a: "In the browser, after the JS loads", b: "On the server, per request", c: "At build time", d: "At build, then again after the revalidate time" }
  - { aspect: "First paint and SEO", a: "Slower; crawlers may need extra work", b: "Fast first paint; full HTML for crawlers", c: "Fast, with a steady TTFB from a CDN", d: "Fast, like SSG" }
  - { aspect: "Server cost", a: "Static files, plus the API calls", b: "A render per request; can raise TTFB", c: "None per request", d: "An occasional background render" }
  - { aspect: "Freshness", a: "Live data from the browser", b: "Fresh on every request", c: "Fixed until the next build", d: "Stale until a request after the revalidate time refreshes it" }
  - { aspect: "Next.js 16", a: "'use client' + fetch in the browser", b: "Reads cookies(), headers(), searchParams or uncached data", c: "No request data: prerendered", d: "'use cache' + cacheLife('hours'); older model: revalidate = 3600" }
  - { aspect: "Shop page", a: "Cart", b: "Search results", c: "Help pages", d: "Product pages" }
verdict: "Prerender what everyone sees (SSG, or ISR when it changes); use SSR only for per-request data and CSR for private, interactive parts like the cart."
sayIt: "CSR builds the page in the browser, SSR builds fresh HTML per request, SSG builds it once at build time, and ISR is SSG that refreshes in the background. I prerender shared pages (SSG, or ISR when they change), use SSR for per-request data, and CSR for private interactive parts."
