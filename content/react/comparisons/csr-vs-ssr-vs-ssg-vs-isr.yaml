    url: "https://nextjs.org/docs/app/glossary"
    verifiedOn: "2026-10-20"
  - title: "How to implement Incremental Static Regeneration (Next.js 16 docs)"
    url: "https://nextjs.org/docs/app/guides/incremental-static-regeneration"
    verifiedOn: "2026-10-20"
  - title: "ISR with Cache Components: revalidate maps to 'use cache' + cacheLife (Next.js 16 docs)"
    url: "https://nextjs.org/docs/app/guides/incremental-static-regeneration-cache-components"
    verifiedOn: "2026-10-20"
