id: async-vs-defer
tech: react
title: "Script async vs defer"
compares: [async-script, defer-script]
gist:
  - "Runs as soon as it downloads, in any order"
  - "Runs after HTML parsing, in document order"
explain:
  - "async on a <script src> downloads the file alongside HTML parsing and runs it the instant it arrives, pausing the parser at that moment. Order between async scripts is not guaranteed. It suits independent scripts that do not depend on the page or each other."
  - "defer on a <script src> also downloads alongside parsing, but waits to run until the whole HTML is parsed, and runs deferred scripts in document order. It suits app code that needs the DOM to exist or depends on another script."
example: "You have analytics.js, which only phones home, and app.js, which reads the page and must run after lib.js. Mark analytics.js async so it fires whenever it lands. Mark lib.js and app.js defer so both run after parsing, in that order, with the DOM ready."
rows:
  - { aspect: "Download", a: "In parallel with parsing", b: "In parallel with parsing" }
  - { aspect: "Runs", a: "The moment it arrives, pausing the parser", b: "After parsing, before DOMContentLoaded" }
  - { aspect: "Order", a: "Not guaranteed", b: "The order in the document" }
  - { aspect: "Good for", a: "Independent scripts: analytics, ads", b: "App code that needs the DOM or other scripts" }
  - { aspect: "Inline classic script", a: "No effect", b: "No effect" }
  - { aspect: "type=\"module\"", a: "Allowed: runs when ready", b: "Not needed: modules defer by default" }
verdict: "Use defer for app code and async for independent third-party scripts; a plain script in the head blocks parsing."
sayIt: "Both download in parallel with parsing. async runs the moment it arrives, in no set order, so I use it for independent third-party scripts like analytics. defer waits until parsing finishes and runs scripts in document order, so I use it for app code that needs the DOM."
sources:
