id: usememo-vs-usecallback-vs-memo
tech: react
title: "useMemo vs useCallback vs React.memo"
compares: [use-memo, use-callback, react-memo]
gist:
  - "Caches a calculated value"
  - "Caches a function reference"
  - "Skips a child's re-render"
explain:
  - "useMemo runs a calculation and keeps the result, returning the same result on later renders while its dependencies are unchanged. It saves repeating a slow calculation and keeps an object or array prop stable for a memo child."
  - "useCallback keeps the same function reference across renders while its dependencies are unchanged. The function is still created each render; useCallback just returns the cached one. It matters when the function is a prop to a memo child or a hook dependency."
  - "React.memo wraps a component. The wrapped child skips its re-render when the parent re-renders, as long as every prop is the same by Object.is as last time. A new object or function prop each render counts as a change and defeats it."
example: "In the payments dashboard, useMemo filters the payment list only when the list or the filter changes. useCallback keeps the refund handler the same reference so a memo PaymentRow does not see a new prop. React.memo wraps PaymentRow so it re-renders only when its own payment prop changes, not every time the list above it renders."
rows:
  - { aspect: "What it is", a: "A hook, inside a component", b: "A hook, inside a component", c: "A wrapper around a component" }
  - { aspect: "Returns", a: "The cached result", b: "The same function reference", c: "A memoized component" }
  - { aspect: "Reuses while", a: "Its dependencies are unchanged", b: "Its dependencies are unchanged", c: "Every prop is the same by Object.is" }
  - { aspect: "Shop example", a: "Filtered payment list", b: "refund handler passed to a row", c: "PaymentRow" }
  - { aspect: "Worth it when", a: "Slow work, or an object prop for a memo child", b: "Function prop for a memo child, or an effect dependency", c: "Re-renders often with the same props" }
verdict: "Memo a slow child, then keep its object props stable with useMemo and its function props with useCallback; skip all three where nothing is slow."
sayIt: "useMemo caches a calculated value, useCallback caches a function reference, and React.memo skips a child whose props are unchanged by Object.is. They work together: I memo a slow child, then use useMemo and useCallback to keep its props stable, and add none where profiling shows nothing slow."
