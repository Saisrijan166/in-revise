id: shallow-vs-deep-copy
tech: react
title: "Shallow Copy vs Deep Copy"
compares: [shallow-copy, deep-copy]
gist:
  - "New outer object; nested objects still shared"
  - "Everything copied; nothing shared"
explain:
  - "A shallow copy, from { ...obj } or Object.assign, makes a new top-level object but keeps the same nested objects. Changing a nested value shows up in the original too. It is cheap and enough when you only change top-level fields."
  - "A deep copy, from structuredClone(obj), duplicates every level, so the copy shares nothing with the original and can be changed freely. It is needed when you must edit nested data without touching the source."
example: "order = { id: 1, items: [{ qty: 1 }] }. With shallow = { ...order }, setting shallow.items[0].qty = 5 also changes order, because items is the same array. With deep = structuredClone(order), order.items[0].qty stays 1."
rows:
  - { aspect: "How", a: "{ ...obj }, [...arr], Object.assign, slice, Array.from", b: "structuredClone(obj)" }
  - { aspect: "Change a nested item", a: "The original changes too", b: "The original stays the same" }
  - { aspect: "Functions, DOM nodes", a: "Copied as references", b: "Throws DataCloneError" }
  - { aspect: "Reassign a top-level property", a: "Only the copy changes", b: "Only the copy changes" }
verdict: "Use spread for React state updates, copying each level you change; use structuredClone when you truly need an independent copy."
sources:
  - title: "Shallow copy (MDN Glossary)"
    url: "https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy"
    verifiedOn: "2026-10-20"
  - title: "structuredClone() (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/structuredClone"
    verifiedOn: "2026-10-20"
  - title: "The structured clone algorithm (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm"
    verifiedOn: "2026-10-20"
sayIt: "A shallow copy like { ...obj } makes a new outer object but shares the nested ones, so a nested change leaks back. structuredClone makes a deep copy that shares nothing. In React I spread and copy each level I change; I use structuredClone only when I truly need an independent copy."
