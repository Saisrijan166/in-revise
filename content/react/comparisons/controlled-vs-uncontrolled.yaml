id: controlled-vs-uncontrolled
tech: react
title: "Controlled vs Uncontrolled Inputs"
compares: [controlled-input, uncontrolled-input]
gist:
  - "React state holds the value: value + onChange"
  - "The DOM holds the value: defaultValue, read later"
rows:
  - { aspect: "Source of truth", a: "React state", b: "The DOM input itself" }
  - { aspect: "Props", a: "value (or checked) with onChange", b: "defaultValue (or defaultChecked)" }
  - { aspect: "Read the value", a: "Any time, from state", b: "On submit, with FormData or a ref" }
  - { aspect: "On each keystroke", a: "Sets state, so the component re-renders", b: "No React work" }
  - { aspect: "Good for", a: "Live search, instant validation", b: "Simple forms read once on submit" }
verdict: "Use controlled when the UI reacts as the user types; uncontrolled when you only need the value on submit."
sources:
  - title: "<input> (react.dev)"
    url: "https://react.dev/reference/react-dom/components/input"
    verifiedOn: "2026-10-20"
  - title: "<form> (react.dev)"
    url: "https://react.dev/reference/react-dom/components/form"
    verifiedOn: "2026-10-20"
