id: controlled-vs-uncontrolled
tech: react
title: "Controlled vs Uncontrolled Inputs"
compares: [controlled-input, uncontrolled-input]
gist:
  - "React state holds the value: value + onChange"
  - "The DOM holds the value: defaultValue, read later"
explain:
  - "A controlled input keeps its current text in React state. You set value from state and update it on every onChange, so state is the single source of truth. This is what you want when the UI must react as the user types, like live search or instant validation."
  - "An uncontrolled input lets the browser's DOM hold the text, like a plain HTML field. You set only a defaultValue and read the value when the form is submitted. This fits fields you only need once, at submit, with no state update per keystroke."
example: "A search box is controlled: value={query} with onChange={e => setQuery(e.target.value)} filters the list as you type. A coupon code is uncontrolled: <input name='code' defaultValue='' /> inside a form, read on submit with formData.get('code'); no state changes while typing."
rows:
  - { aspect: "Source of truth", a: "React state", b: "The DOM input itself" }
  - { aspect: "Props", a: "value (or checked) with onChange", b: "defaultValue (or defaultChecked)" }
  - { aspect: "Read the value", a: "Any time, from state", b: "On submit, with FormData or a ref" }
  - { aspect: "On each keystroke", a: "Sets state, so the component re-renders", b: "No state update, no re-render" }
  - { aspect: "Good for", a: "Live search, instant validation", b: "Simple forms read once on submit" }
verdict: "Use controlled when the UI reacts as the user types; uncontrolled when you only need the value on submit."
sayIt: "A controlled input binds the field to React state with value and onChange, so I use it for live search and validation. An uncontrolled input lets the DOM hold the value and I read it on submit with FormData or a ref, which suits simple forms read once."
sources:
