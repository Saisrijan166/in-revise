id: usestate-vs-usereducer
tech: react
title: useState vs useReducer
compares: [use-state, use-reducer]
gist:
  - "Set the next value directly; best for simple state"
  - "Dispatch actions to one reducer; best for complex updates"
explain:
  - "useState gives a value and a setter. Each event handler computes and sets the next value itself. It is the simplest way to hold state, and fits a single value or a small object."
  - "useReducer holds the state and a dispatch function. Handlers send named actions, and one reducer function decides the next state from the current state and the action, keeping all update logic in one place."
example: "A cart with add, remove and change-quantity. With useState each handler builds a new array itself. With useReducer the handlers just dispatch({ type: 'added', id }) and one cartReducer computes every change, which is easier to test and to log."
rows:
  - { aspect: "You update with", a: "setCart(next) or setCart(c => ...)", b: "dispatch({ type: 'added', id })" }
  - { aspect: "Update logic lives", a: "In each event handler", b: "In one reducer function" }
  - { aspect: "Code up front", a: "Less", b: "More, but less when many handlers update alike" }
  - { aspect: "Debugging", a: "Harder to see where state was set", b: "Log each action in the reducer" }
  - { aspect: "Testing", a: "Through the component", b: "The reducer alone, as a pure function" }
verdict: "Start with useState; move to useReducer when several handlers change related state or update bugs pile up."
sayIt: "useState is simplest: each handler sets the next value. useReducer puts all update logic in one reducer that maps the current state and an action to the next state. I reach for it when several handlers change related state or I want to test and log updates in one place."
sources:
  - title: "Extracting State Logic into a Reducer: comparing useState and useReducer (react.dev)"
    url: "https://react.dev/learn/extracting-state-logic-into-a-reducer"
    verifiedOn: "2026-10-20"
  - title: "useReducer (react.dev reference)"
    url: "https://react.dev/reference/react/useReducer"
    verifiedOn: "2026-10-20"
