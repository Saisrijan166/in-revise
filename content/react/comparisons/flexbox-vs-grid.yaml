id: flexbox-vs-grid
tech: react
title: Flexbox vs Grid
compares: [flexbox, css-grid]
gist:
  - "One direction at a time: a row or a column"
  - "Two directions at once: rows and columns"
explain:
  - "Flexbox arranges items along a single axis, a row or a column, and lets the content set the sizes. It solves lining up a group of items with alignment and spacing, like a navbar or a row of buttons."
  - "Grid arranges items into rows and columns at the same time, from a layout you define with grid-template-columns. It solves two-dimensional page structure, like a dashboard or a card grid that must line up both ways."
example: "A navbar is one row: display: flex with justify-content: space-between puts the logo left and buttons right. A payment-card grid is two-dimensional: grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) fits as many equal cards per row as the width allows, then wraps. The buttons inside each card are a flex row nested in a grid cell."
rows:
  - { aspect: "Dimensions", a: "One: a row or a column", b: "Two: rows and columns together" }
  - { aspect: "Sizes start from", a: "The content (content out)", b: "The tracks you define (layout in)" }
  - { aspect: "Wrapped lines", a: "Each line spaces its items on its own", b: "Items stay in strict columns" }
  - { aspect: "Key properties", a: "flex-direction, justify-content, align-items, flex", b: "grid-template-columns, fr, repeat(), minmax()" }
  - { aspect: "Dashboard example", a: "Navbar, the buttons in a payment card", b: "Page layout, the payment-card grid" }
verdict: "Use Flexbox to line up items in one row or column; use Grid when rows and columns must line up together. Nest them freely."
sayIt: "Flexbox is one-dimensional and content-driven, so I use it for a row or column like a navbar. Grid is two-dimensional and layout-driven, so I use it for page structure or a card grid. They nest well: a flex row inside a grid cell."
