id: call-vs-apply-vs-bind
tech: react
title: "call vs apply vs bind"
compares: [call-method, apply-method, bind-method]
gist:
  - "Call now; arguments one by one"
  - "Call now; arguments as one array"
  - "Do not call; return a new function with this fixed"
explain:
  - "call runs the function right now with a this you choose, passing the arguments one after another: f.call(obj, a, b). Use it to borrow a method for one call on another object."
  - "apply does the same as call but takes the arguments as a single array: f.apply(obj, [a, b]). Use it when the arguments already sit in an array."
  - "bind does not run the function; it returns a new copy whose this is fixed to the object you give. Use it when a callback will be called later and must keep its this."
example: "A class method handleClick uses this.state. Passing it straight to a button loses this. button.onclick = handler.handleClick.bind(handler) returns a bound copy that always has the right this, and it runs later when the button is clicked, not now. call or apply would run it immediately, which is not what a click handler wants."
rows:
  - { aspect: "Runs the function", a: "Now", b: "Now", c: "Later, when the bound function is called" }
  - { aspect: "Arguments", a: "A list: f.call(obj, a, b)", b: "An array: f.apply(obj, [a, b])", c: "Some now, the rest later: f.bind(obj, a)" }
  - { aspect: "Returns", a: "The function's result", b: "The function's result", c: "A new bound function" }
  - { aspect: "On an arrow function", a: "this argument ignored", b: "this argument ignored", c: "this argument ignored" }
verdict: "Use call or apply to run once with a chosen this; use bind for a callback that must keep its this. fn(...args) now covers most apply uses."
sayIt: "All three set this. call and apply run the function immediately, call with a list of arguments and apply with an array. bind does not run it; it returns a new function with this fixed, which I use for callbacks that run later and must keep their this."
