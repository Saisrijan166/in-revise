id: call-vs-apply-vs-bind
tech: react
title: "call vs apply vs bind"
compares: [call-method, apply-method, bind-method]
gist:
  - "Call now; arguments one by one"
  - "Call now; arguments as one array"
  - "Do not call; return a new function with this fixed"
rows:
  - { aspect: "Runs the function", a: "Now", b: "Now", c: "Later, when the bound function is called" }
  - { aspect: "Arguments", a: "A list: f.call(obj, a, b)", b: "An array: f.apply(obj, [a, b])", c: "Some now, the rest later: f.bind(obj, a)" }
  - { aspect: "Returns", a: "The function's result", b: "The function's result", c: "A new bound function" }
  - { aspect: "On an arrow function", a: "this argument ignored", b: "this argument ignored", c: "this argument ignored" }
verdict: "Use call or apply to run once with a chosen this; use bind for a callback that must keep its this. fn(...args) now covers most apply uses."
sources:
  - title: "Function.prototype.call() (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/call"
    verifiedOn: "2026-10-20"
  - title: "Function.prototype.apply() (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply"
    verifiedOn: "2026-10-20"
  - title: "Function.prototype.bind() (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/bind"
    verifiedOn: "2026-10-20"
  - title: "this: arrow functions ignore thisArg (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/this"
    verifiedOn: "2026-10-20"
