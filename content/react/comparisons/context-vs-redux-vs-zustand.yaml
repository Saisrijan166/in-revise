id: context-vs-redux-vs-zustand
tech: react
title: Context vs Redux Toolkit vs Zustand
compares: [context-api, redux-toolkit, zustand-store]
gist:
  - "Passes a value down the tree; it is not a store"
  - "One store; dispatch actions, reducers make new state"
  - "A small store you call as a hook; no Provider"
explain:
  - "Context is React's built-in way to pass a value from a provider to any component below, so you avoid passing props through every level. It holds no state of its own; the state still lives in useState or useReducer."
  - "Redux Toolkit is the official Redux: one central store, changed only by dispatching actions that reducers turn into new state. It adds DevTools, middleware and structure for large apps, at the cost of more setup."
  - "Zustand is a small store you create as a hook and call directly, with no provider to wrap the app. Components select the slice they need and update through actions that call set."
example: "A cart shared across pages. With context, App keeps the cart in useReducer and wraps the tree in a provider; readers useContext and all re-render when it changes. With Redux Toolkit, a cartSlice holds it and components read with useSelector. With Zustand, a useCartStore hook holds it and a component selects just cart.length, so only that component re-renders when the count changes."
diagrams:
  - |
    flowchart TD
      P["CartContext value"] --> A[Header]
      P --> B[CartPage]
  - |
    flowchart LR
      UI -- "dispatch(action)" --> R[Reducer]
      R --> S[(Store)]
      S -- useSelector --> UI
  - |
    flowchart LR
      S[(useCartStore)] -- selector --> C[Header]
      C -- "addToCart() calls set" --> S
diagramAlt: "Context: a CartContext value flows straight down to the Header and CartPage that read it. Redux Toolkit: the UI dispatches an action, the reducer computes new state in the store, and the UI reads it back with useSelector. Zustand: a component selects a slice from the useCartStore hook and calls an action that uses set to update the store."
rows:
  - { aspect: "Holds state itself", a: "No: state stays in useState or useReducer", b: "Yes, in one store", c: "Yes, in the store" }
  - { aspect: "Provider", a: "Yes, around the subtree", b: "Yes, <Provider store>", c: "None needed" }
  - { aspect: "Who re-renders", a: "Every consumer when the value changes", b: "Components whose selected value changed (===)", c: "Components whose selected slice changed" }
  - { aspect: "How to update", a: "Call a setter passed in the value", b: "dispatch(action) to a reducer", c: "Call a store action that uses set()" }
  - { aspect: "Extras", a: "Built into React", b: "DevTools, middleware (thunk), RTK Query", c: "Very little code" }
verdict: "Context for rarely changing values like theme or the signed-in user; Zustand for simple shared client state; Redux Toolkit for large apps that want strict structure and tooling."
sayIt: "Context passes a value down the tree and re-renders every reader, so I use it for stable data like theme or the user. For real shared state I use a store: Zustand when I want something light with selective re-renders, Redux Toolkit for large apps needing structure and DevTools."
