id: microtask-vs-macrotask
tech: react
title: "Microtask vs Macrotask (Task)"
compares: [microtask-queue, task-queue]
gist:
  - "Runs right after the current code, all of them"
  - "Runs one per loop turn, after microtasks"
rows:
  - { aspect: "Queued by", a: "Promise then / catch / finally, code after await, queueMicrotask", b: "setTimeout, setInterval, I/O, UI events" }
  - { aspect: "When it runs", a: "As soon as the call stack is empty", b: "On the next turn of the event loop" }
  - { aspect: "How many per turn", a: "All, including newly added ones", b: "One" }
  - { aspect: "Rendering", a: "Never between two microtasks", b: "The browser may render between tasks" }
verdict: "Use a microtask to run just after the current work; use a task (setTimeout) to yield so the page can paint and respond."
sources:
  - title: "In depth: Microtasks and the JavaScript runtime environment (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide/In_depth"
    verifiedOn: "2026-10-20"
  - title: "HTML Living Standard, 8.1.7 Event loops (WHATWG)"
    url: "https://html.spec.whatwg.org/multipage/webappapis.html#event-loops"
    verifiedOn: "2026-10-20"
  - title: "async function: code after await runs like a then callback (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function"
    verifiedOn: "2026-10-20"
