id: microtask-vs-macrotask
tech: react
title: "Microtask vs Macrotask (Task)"
compares: [microtask-queue, task-queue]
gist:
  - "Runs right after the current code, all of them"
  - "Runs one per loop turn, after microtasks"
explain:
  - "A microtask is a small job queued by a promise callback, code after await, or queueMicrotask. As soon as the current code finishes, the event loop runs every microtask, including ones queued while running them, before anything else."
  - "A task (also called a macrotask) is a job queued by setTimeout, setInterval, I/O or a UI event. The event loop runs only one task per turn, after all microtasks have run, and the browser may paint between tasks."
example: "console.log('A'); setTimeout(() => console.log('B')); Promise.resolve().then(() => console.log('C')); prints A, C, B. A is the current code. C is a microtask, so it runs the moment the code ends. B is a task, so it waits for the next loop turn, even though its delay is 0."
rows:
  - { aspect: "Queued by", a: "Promise then / catch / finally, code after await, queueMicrotask", b: "setTimeout, setInterval, I/O, UI events" }
  - { aspect: "When it runs", a: "As soon as the call stack is empty", b: "On the next turn of the event loop" }
  - { aspect: "How many per turn", a: "All, including newly added ones", b: "One" }
  - { aspect: "Rendering", a: "Never between two microtasks", b: "The browser may render between tasks" }
verdict: "Use a microtask to run just after the current work; use a task (setTimeout) to yield so the page can paint and respond."
sayIt: "Microtasks come from promises and code after await; the event loop drains all of them as soon as the current code ends. Tasks come from setTimeout and events; the loop runs one per turn, after the microtasks, and the page can paint between tasks. So promise callbacks always beat setTimeout."
