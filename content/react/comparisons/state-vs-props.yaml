id: state-vs-props
tech: react
title: "State vs Props"
compares: [state-react, props-react]
gist:
  - "The component's own memory; it changes it"
  - "Inputs from the parent; read-only in the child"
rows:
  - { aspect: "Owned by", a: "The component that declares it", b: "The parent that passes them" }
  - { aspect: "Can the component change it?", a: "Yes, with its setter", b: "No; it asks via a callback prop" }
  - { aspect: "Changes come from", a: "Events in this component", b: "The parent re-rendering with new values" }
  - { aspect: "Visible to", a: "Only this component, unless passed down", b: "The child that receives them" }
verdict: "Keep data in state where it changes; pass it down as props to the children that show it."
sources:
  - title: "Thinking in React: props vs state (react.dev)"
    url: "https://react.dev/learn/thinking-in-react"
    verifiedOn: "2026-10-20"
  - title: "State: A Component's Memory (react.dev)"
    url: "https://react.dev/learn/state-a-components-memory"
    verifiedOn: "2026-10-20"
  - title: "Passing Props to a Component (react.dev)"
    url: "https://react.dev/learn/passing-props-to-a-component"
    verifiedOn: "2026-10-20"
