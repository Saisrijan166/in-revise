id: state-vs-props
tech: react
title: "State vs Props"
compares: [state-react, props-react]
gist:
  - "The component's own memory; it changes it"
  - "Inputs from the parent; read-only in the child"
explain:
  - "State is a component's own memory, created with useState. The component that declares it can change it by calling its setter, and each change queues a re-render. State is where the source of truth lives, like the current query or the list of payments."
  - "Props are the inputs a parent passes down to a child. The child reads them but must never change them; to request a change it calls a callback prop, and the parent updates its own state. Props are how data flows one way, from parent to child."
example: "PaymentList holds the payments in state and the typed filter in state. It passes each payment down to a PaymentRow as a prop, and an onRefund callback prop. The row reads its payment prop and calls onRefund(id); the list, which owns the state, updates it, and the new data flows back down as props."
rows:
  - { aspect: "Owned by", a: "The component that declares it", b: "The parent that passes them" }
  - { aspect: "Can the component change it?", a: "Yes, with its setter", b: "No; it asks via a callback prop" }
  - { aspect: "Changes come from", a: "Calls to its own setter", b: "The parent re-rendering with new values" }
  - { aspect: "Visible to", a: "Only this component, unless passed down", b: "The child that receives them" }
verdict: "Keep data in state where it changes; pass it down as props to the children that show it."
sayIt: "State is a component's own memory that it changes with a setter, triggering a re-render. Props are read-only inputs from the parent. A child cannot change its props; it calls a callback prop and the parent, which owns the state, updates it."
