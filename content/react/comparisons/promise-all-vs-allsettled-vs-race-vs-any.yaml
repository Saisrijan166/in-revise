id: promise-all-vs-allsettled-vs-race-vs-any
tech: react
title: "Promise.all vs allSettled vs race vs any"
compares: [promise-all, promise-allsettled, promise-race, promise-any]
gist:
  - "All must succeed; first failure fails it"
  - "Wait for every result, success or failure"
  - "First to finish wins, success or failure"
  - "First success wins; fails only if all fail"
rows:
  - { aspect: "Fulfils when", a: "All fulfil", b: "All settle", c: "The first one fulfils", d: "Any one fulfils" }
  - { aspect: "Rejects when", a: "Any one rejects", b: "Never", c: "The first one rejects", d: "All reject (AggregateError)" }
  - { aspect: "Result", a: "Array of values", b: "Array of { status, value or reason }", c: "One value", d: "One value" }
  - { aspect: "Added in", a: "ES2015", b: "ES2020", c: "ES2015", d: "ES2021" }
  - { aspect: "Shop use", a: "Product and price must both load", b: "Load widgets; show what worked", c: "A request versus a timeout", d: "Fastest of several mirrors" }
verdict: "Use all when every result is needed, allSettled when partial results are fine, race for timeouts, any for the first success."
