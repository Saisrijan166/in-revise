id: promise-all-vs-allsettled-vs-race-vs-any
tech: react
title: "Promise.all vs allSettled vs race vs any"
compares: [promise-all, promise-allsettled, promise-race, promise-any]
gist:
  - "All must succeed; first failure fails it"
  - "Wait for every result, success or failure"
  - "First to finish wins, success or failure"
  - "First success wins; fails only if all fail"
explain:
  - "Promise.all waits for every promise to fulfil and gives an array of their values; if any one rejects, it rejects at once with that error. Use it when you need all results."
  - "Promise.allSettled waits for every promise to finish, success or failure, and never rejects; each result says whether it fulfilled or rejected. Use it when partial results are fine."
  - "Promise.race settles as soon as the first promise settles, whether it fulfils or rejects, and takes that outcome. Use it to pit a request against a timeout."
  - "Promise.any fulfils with the first promise that fulfils, ignoring rejections; it rejects only if every promise rejects. Use it for the first success among alternatives."
example: "Loading a payment and its customer: Promise.all fails the page if either call fails. Loading several optional dashboard widgets: Promise.allSettled shows the ones that loaded and marks the rest as failed instead of blanking the page."
rows:
  - { aspect: "Fulfils when", a: "All fulfil", b: "All settle", c: "The first to settle fulfils", d: "Any one fulfils" }
  - { aspect: "Rejects when", a: "Any one rejects", b: "Never", c: "The first to settle rejects", d: "All reject (AggregateError)" }
  - { aspect: "Result", a: "Array of values", b: "Array of { status, value or reason }", c: "One value", d: "One value" }
  - { aspect: "Added in", a: "ES2015", b: "ES2020", c: "ES2015", d: "ES2021" }
  - { aspect: "Shop use", a: "Product and price must both load", b: "Load widgets; show what worked", c: "A request versus a timeout", d: "Fastest of several mirrors" }
verdict: "Use all when every result is needed, allSettled when partial results are fine, race for timeouts, any for the first success."
sources:
  - title: "Promise: concurrency methods (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise"
    verifiedOn: "2026-10-20"
  - title: "Promise.any() (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/any"
    verifiedOn: "2026-10-20"
  - title: "Finished proposals: Promise.allSettled (2020), Promise.any (2021) (TC39)"
    url: "https://github.com/tc39/proposals/blob/main/finished-proposals.md"
    verifiedOn: "2026-10-20"
sayIt: "All four take an array of promises. all needs every one to succeed and fails fast on the first error; allSettled waits for all and never rejects, so I get partial results; race takes the first to settle, good for timeouts; any takes the first success and fails only if all fail."
