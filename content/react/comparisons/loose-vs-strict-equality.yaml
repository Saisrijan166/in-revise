id: loose-vs-strict-equality
tech: react
title: "== vs ==="
compares: [loose-equality, strict-equality]
gist:
  - "Converts types first, then compares"
  - "Different types are never equal"
rows:
  - { aspect: "Type conversion", a: "Yes", b: "None" }
  - { aspect: "0 vs \"\"", a: "true", b: "false" }
  - { aspect: "null vs undefined", a: "true (and equal to nothing else)", b: "false" }
  - { aspect: "NaN vs NaN", a: "false", b: "false (use Number.isNaN)" }
  - { aspect: "Two objects", a: "Same reference only", b: "Same reference only" }
verdict: "Use === by default; x == null is the one handy exception, as it matches only null and undefined."
