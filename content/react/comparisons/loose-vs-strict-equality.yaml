id: loose-vs-strict-equality
tech: react
title: "== vs ==="
compares: [loose-equality, strict-equality]
gist:
  - "Converts types first, then compares"
  - "Different types are never equal"
explain:
  - "== is loose equality. If the two sides are different types, it converts them toward a common type first and then compares, which is why 0 == \"\" and 1 == true are true."
  - "=== is strict equality. It never converts: if the two sides are different types the answer is false straight away, so there are no coercion surprises."
example: "if (count == 0) is true for count 0, \"0\" and false, because == converts them all to the number 0. With count === 0 only the real number 0 matches, so a string \"0\" from an input field is correctly rejected."
rows:
  - { aspect: "Type conversion", a: "Yes", b: "None" }
  - { aspect: "0 vs \"\"", a: "true", b: "false" }
  - { aspect: "null vs undefined", a: "true (and equal to nothing else)", b: "false" }
  - { aspect: "NaN vs NaN", a: "false", b: "false (use Number.isNaN)" }
  - { aspect: "Two objects", a: "Same reference only", b: "Same reference only" }
verdict: "Use === by default; x == null is the one handy exception, as it matches only null and undefined."
sources:
  - title: "Equality comparisons and sameness (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness"
    verifiedOn: "2026-10-20"
  - title: "Equality (==) (MDN JavaScript reference)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Equality"
    verifiedOn: "2026-10-20"
sayIt: "I use === by default: it never converts types, so there are no coercion surprises. == converts first, which is why 0 == \"\" is true. The one == I keep is x == null, a short check for both null and undefined."
