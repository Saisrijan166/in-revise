id: localstorage-vs-sessionstorage-vs-cookies
tech: react
title: "localStorage vs sessionStorage vs Cookies"
compares: [local-storage, session-storage, http-cookie]
gist:
  - "Per origin, kept until cleared"
  - "Per origin and tab, gone when the tab closes"
  - "Small, set by server or script, sent with requests"
rows:
  - { aspect: "Lifetime", a: "Until code or the user clears it", b: "Until the tab closes", c: "The session, or until Max-Age or Expires" }
  - { aspect: "Shared by", a: "All tabs of the origin", b: "One tab only", c: "Requests to its domain and path" }
  - { aspect: "Size", a: "About 5 MiB per origin", b: "About 5 MiB per origin", c: "About 4 KB per cookie" }
  - { aspect: "Sent to server", a: "Never", b: "Never", c: "Yes, automatically" }
  - { aspect: "Read by JavaScript", a: "Yes", b: "Yes", c: "Yes, unless HttpOnly" }
verdict: "localStorage for preferences and the cart, sessionStorage for one-tab drafts, HttpOnly cookies for the login session."
sources:
