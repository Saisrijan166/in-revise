id: localstorage-vs-sessionstorage-vs-cookies
tech: react
title: "localStorage vs sessionStorage vs Cookies"
compares: [local-storage, session-storage, http-cookie]
gist:
  - "Per origin, kept until cleared"
  - "Per origin and tab, gone when the tab closes"
  - "Small, set by server or script, sent with requests"
explain:
  - "localStorage stores string key-value pairs per origin and keeps them until code or the user clears them. It is shared by every tab of the origin and never sent to the server. It suits preferences and a cart that should persist and be shared across tabs."
  - "sessionStorage is the same string store, but scoped to one tab and cleared when that tab closes. It is not shared with other tabs. It suits a draft or wizard state that belongs to a single tab's session."
  - "A cookie is a small value (about 4 KB) the server or a script sets, which the browser attaches to every matching request. It suits the login session, especially as an HttpOnly cookie that scripts cannot read."
example: "For a shopping site: keep the cart in localStorage so it survives reloads and both tabs show it; keep a half-filled checkout form in sessionStorage so a second tab starts fresh; keep the login session in an HttpOnly cookie so the server sees it on every request and no script can read it."
rows:
  - { aspect: "Lifetime", a: "Until code or the user clears it", b: "Until the tab closes", c: "The session, or until Max-Age or Expires" }
  - { aspect: "Shared by", a: "All tabs of the origin", b: "One tab only", c: "Requests to its domain and path" }
  - { aspect: "Size", a: "About 5 MiB per origin", b: "About 5 MiB per origin", c: "About 4 KB per cookie" }
  - { aspect: "Sent to server", a: "Never", b: "Never", c: "Yes, automatically" }
  - { aspect: "Read by JavaScript", a: "Yes", b: "Yes", c: "Yes, unless HttpOnly" }
verdict: "localStorage for preferences and the cart, sessionStorage for one-tab drafts, HttpOnly cookies for the login session."
sayIt: "localStorage and sessionStorage hold strings in the browser and are never sent to the server; localStorage persists per origin across tabs, sessionStorage lasts one tab. Cookies are small and sent with every request, so I use an HttpOnly cookie for the session."
