id: debounce-vs-throttle
tech: react
title: "Debounce vs Throttle"
compares: [debounce, throttle]
gist:
  - "Waits for a pause, then runs once"
  - "Runs at most once per interval"
explain:
  - "Debounce delays the work until the events stop for a set time. Each new event cancels the pending call and starts the wait again, so the function runs only once, after the user pauses. It suits a search box, where only the final typed value matters."
  - "Throttle lets the work run at most once per interval while events keep coming. It does not wait for a pause: during a long burst it fires at a steady rate. It suits scroll or resize, where you want regular updates during the activity."
example: "A search box fires an event on every keystroke. Debounced at 300 ms, the API is called once, after typing stops, so m-o-u-s-e sends one request. A scroll handler throttled at 200 ms runs at most five times a second while the user keeps scrolling, so you check the scroll position regularly instead of on every pixel."
rows:
  - { aspect: "Runs", a: "After events stop for the delay", b: "Regularly while events continue" }
  - { aspect: "During a long burst", a: "Not at all until it ends", b: "At a steady maximum rate" }
  - { aspect: "What the delay means", a: "How long a pause must last before it runs", b: "The minimum gap between two runs" }
  - { aspect: "Typical use", a: "Search box, other typing input", b: "Scroll, resize" }
  - { aspect: "Shop example", a: "GET /api/products?q= once typing stops", b: "Check scroll position for the next page" }
verdict: "Debounce when only the final value matters; throttle when you need regular updates during the activity."
sayIt: "Debounce waits for a pause and then runs once, so I use it for a search box where only the last value matters. Throttle runs at most once per interval while events keep coming, so I use it for scroll or resize where I want steady updates during the activity."
