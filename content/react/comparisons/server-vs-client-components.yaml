id: server-vs-client-components
tech: react
title: "Server Components vs Client Components"
compares: [react-server-components, client-components]
gist:
  - "Run on the server; send output, not code"
  - "Ship JS, hydrate, and can be interactive"
explain:
  - "A Server Component runs only on the server and sends its rendered output, not its code. It can read a database or a secret directly and adds nothing to the browser bundle, so it fits non-interactive UI and its data fetching."
  - "A Client Component runs in the browser after its code is shipped and hydrated. It can use state, Effects, event handlers and browser APIs, so it fits the interactive leaves such as a button or a form."
example: "A product page is a Server Component: it reads the product from the database on the server and ships no JavaScript for itself. The Add to cart button inside it is a Client Component, marked 'use client', because it needs an onClick; only its small bundle reaches the browser."
rows:
  - { aspect: "In the App Router", a: "The default", b: "Opt in with 'use client' at the top of a file" }
  - { aspect: "State, Effects, event handlers", a: "No", b: "Yes" }
  - { aspect: "Browser APIs (window, localStorage)", a: "No", b: "Yes" }
  - { aspect: "Database and secrets", a: "Yes, read directly on the server", b: "No; only NEXT_PUBLIC_ env vars reach them" }
  - { aspect: "JS sent to the browser", a: "None for the component", b: "Its code and everything it imports" }
verdict: "Keep pages and layouts as Server Components; make only interactive leaves, like Add to cart or the search box, Client Components."
sayIt: "Server Components run only on the server and ship no JavaScript, so I keep pages, layouts and data fetching there. I add 'use client' to the smallest interactive leaves, like a button or a form, because those need state and event handlers in the browser."
sources:
