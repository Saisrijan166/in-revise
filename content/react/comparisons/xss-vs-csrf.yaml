id: xss-vs-csrf
tech: react
title: "XSS vs CSRF"
compares: [xss, csrf]
gist:
  - "The attacker's script runs inside your page"
  - "The victim's browser sends a forged request"
explain:
  - "XSS (cross-site scripting) is when an attacker's JavaScript runs inside your page, usually through content rendered as HTML. That script has the page's full access: it reads data, script-readable cookies and the DOM. Fix by escaping output and sanitising HTML."
  - "CSRF (cross-site request forgery) is when another site makes the victim's browser send a request to your server. The browser attaches the victim's cookies, so it runs as them, but the attacker never sees the reply. Fixed with a CSRF token and SameSite cookies."
example: "On a bank site: an XSS hole lets an injected script read the page and send the balance anywhere. A CSRF hole lets an attacker's page submit a hidden transfer form; the browser adds the bank cookie, so the transfer runs, though the attacker cannot read the result."
rows:
  - { aspect: "Attacker gets", a: "Code running as your page", b: "One action done with the victim's cookies" }
  - { aspect: "Reads data", a: "Yes, anything the page can see", b: "No, it only sends the request" }
  - { aspect: "Way in", a: "Untrusted input rendered as HTML or script", b: "A form, link or script on another site" }
  - { aspect: "Main fix", a: "Escape output, sanitise HTML, add a CSP", b: "CSRF tokens, plus SameSite cookies" }
verdict: "Fix XSS first: an injected script can read the page and defeat every CSRF defence."
sayIt: "XSS runs the attacker's script in my page, so it can read anything the page sees; I stop it by escaping output, sanitising HTML and adding a CSP. CSRF makes the victim's browser send a forged request with their cookies; I stop it with CSRF tokens and SameSite cookies."
sources:
  - title: "Cross Site Scripting Prevention Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "Cross-Site Request Forgery Prevention Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "Same-origin policy (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy"
    verifiedOn: "2026-10-20"
