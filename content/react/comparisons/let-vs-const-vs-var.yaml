id: let-vs-const-vs-var
tech: react
title: "let vs const vs var"
compares: [let-declaration, const-declaration, var-declaration]
gist:
  - "Block-scoped; can be reassigned"
  - "Block-scoped; cannot be reassigned"
  - "Function-scoped; old style, avoid"
rows:
  - { aspect: "Scope", a: "Nearest { } block", b: "Nearest { } block", c: "Nearest function (or module, global)" }
  - { aspect: "Read before its line", a: "ReferenceError (temporal dead zone)", b: "ReferenceError (temporal dead zone)", c: "undefined" }
  - { aspect: "Reassign", a: "Yes", b: "No: TypeError", c: "Yes" }
  - { aspect: "Redeclare in same scope", a: "SyntaxError", b: "SyntaxError", c: "Allowed, silently" }
  - { aspect: "Must initialise", a: "No", b: "Yes, in the declaration", c: "No" }
  - { aspect: "Top level of a classic script", a: "Not on globalThis", b: "Not on globalThis", c: "Becomes a globalThis property" }
verdict: "Use const by default, let when the value must change, and var only in old code."
sources:
  - title: "let (MDN JavaScript reference)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let"
    verifiedOn: "2026-10-20"
  - title: "const (MDN JavaScript reference)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const"
    verifiedOn: "2026-10-20"
  - title: "var (MDN JavaScript reference)"
    url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var"
    verifiedOn: "2026-10-20"
