id: let-vs-const-vs-var
tech: react
title: "let vs const vs var"
compares: [let-declaration, const-declaration, var-declaration]
gist:
  - "Block-scoped; can be reassigned"
  - "Block-scoped; cannot be reassigned"
  - "Function-scoped; old style, avoid"
explain:
  - "let declares a variable that lives only inside its nearest { } block and can be reassigned later. Use it when the value needs to change, such as a loop counter or an accumulator."
  - "const declares a block-scoped variable whose name cannot be reassigned, and must be given a value on the same line. The object or array it points to can still change inside. Use it as the default."
  - "var is the old keyword. It is scoped to the whole function, is readable before its line as undefined, and can be silently redeclared. Avoid it in new code; it survives only in legacy code."
example: "In a for loop, for (let i ...) gives each iteration its own i, so three setTimeout callbacks print 0, 1, 2. The same loop with var shares one i and prints 3, 3, 3. For a value that never changes, const total = sum(items) is clearer and reassigning it throws TypeError, which catches mistakes."
rows:
  - { aspect: "Scope", a: "Nearest { } block", b: "Nearest { } block", c: "Nearest function (or module, global)" }
  - { aspect: "Read before its line", a: "ReferenceError (temporal dead zone)", b: "ReferenceError (temporal dead zone)", c: "undefined" }
  - { aspect: "Reassign", a: "Yes", b: "No: TypeError", c: "Yes" }
  - { aspect: "Redeclare in same scope", a: "SyntaxError", b: "SyntaxError", c: "Allowed, silently" }
  - { aspect: "Must initialise", a: "No", b: "Yes, in the declaration", c: "No" }
  - { aspect: "Top level of a classic script", a: "Not on globalThis", b: "Not on globalThis", c: "Becomes a globalThis property" }
verdict: "Use const by default, let when the value must change, and var only in old code."
sayIt: "const and let are block-scoped and sit in a temporal dead zone before their line, so early reads throw. const cannot be reassigned, let can. var is function-scoped, reads undefined before its line and allows silent redeclaration. I use const by default, let when the value changes, and never var."
sources:
