name: SQL & Databases
slug: sql
accent: teal
summary: "SQL, PostgreSQL and MySQL for interviews: queries, design, indexes, transactions, backend use and scaling, plus query patterns."
codeLanguages:
  - java
storySpine:
  - step: Data in files cannot be checked or shared safely → keep it in tables with keys, rules and types
    cards:
      - relational-databases
      - keys
      - relationships
      - data-types
      - constraints
  - step: One store does not fit every access pattern → choose SQL or NoSQL, then PostgreSQL or MySQL, knowing their defaults
    cards:
      - sql-and-nosql
      - postgresql-and-mysql
  - step: Data sits in many tables and the app needs one answer → SELECT, filter and sort, shape text and dates, join the tables, and mind NULLs
    cards:
      - sql-commands
      - select-and-filtering
      - string-date-functions
      - query-order
      - null-handling
      - joins
  - step: Reports need totals, ranks and nested steps → GROUP BY, subqueries, set operations, window functions and CTEs
    cards:
      - aggregates-group-by
      - subqueries
      - set-operations
      - window-functions
      - ctes
  - step: A user's email is copied into every order and the copies start to disagree → normalise so each fact lives once; copy data back only where a slow read needs it
    cards:
      - normalization
      - denormalization
  - step: Rows need ids, queries repeat, rules must hold for every writer, and reports slow the app → let the database generate keys, use views, procedures and triggers, and move analytics to OLAP
    cards:
      - id-generation
      - views
      - stored-procedures-triggers
      - oltp-and-olap
  - step: Finding one user by email reads every row of a big table → add the right index, and check with EXPLAIN that the planner uses it
    cards:
      - indexes
      - index-types
      - clustered-indexes
      - composite-indexes
      - index-not-used
      - explain-query-plans
  - step: Pages get slower the deeper users scroll, and one query drags the whole app → find the slowest queries, fix the biggest cost, and page with keyset instead of OFFSET
    cards:
      - query-optimization
      - pagination
  - step: A transfer debits one account, then the server crashes before the credit → wrap both updates in one transaction with ACID promises, made durable by the write-ahead log
    cards:
      - transactions
      - acid
      - wal
  - step: Two users change the same rows at once and one change is lost or a report reads half-done data → pick an isolation level, rely on MVCC snapshots, and lock rows or check a version column; retry when a deadlock aborts one
    cards:
      - isolation-levels
      - mvcc
      - locking
      - optimistic-pessimistic-locking
      - deadlocks
  - step: Every request opens its own connection and the database chokes → reuse a small pool of connections and bind every value as a parameter
    cards:
      - connection-pooling
      - sql-injection
  - step: Hand-written mapping code is long, and the ORM quietly fires one query per row → map with JPA, fetch up front, cache hot reads and write with one upsert
    cards:
      - orm-jpa
      - n-plus-one
      - caching-redis
      - upsert
  - step: One database server is slow and is a single point of failure → tune it first, then add replicas, scale up, partition and finally shard
    cards:
      - scaling-ladder
      - replication
      - partitioning
      - sharding
  - step: Servers lose contact, and an order spans several databases → choose consistency or availability, use a saga, and keep tested backups
    cards:
      - cap-theorem
      - distributed-transactions
      - backup-recovery
  - step: A new SQL question looks unfamiliar → turn its words into clauses, fix the output grain, then follow the same six steps and pick a known pattern
    cards:
      - english-to-sql
      - sql-problem-approach
  - step: Questions ask for the top, the copies, the missing, the running and the per-category → rank and filter, GROUP BY with HAVING, NOT EXISTS, windows over ordered rows, CASE inside aggregates
    cards:
      - top-n-per-group
      - duplicates
      - anti-join-pattern
      - running-totals-and-streaks
      - group-aggregation-patterns
topics:
  - id: basics
    title: Database Basics
    order: 1
    blurb: Tables, keys, relationships, types and rules, and how PostgreSQL and MySQL differ.
  - id: querying
    title: Writing SQL
    order: 2
    blurb: SELECT, filters, NULL, grouping, joins, subqueries, window functions and CTEs.
  - id: design
    title: Schema Design
    order: 3
    blurb: Normalise, pick ids, and use views, procedures and the right kind of database.
  - id: indexes
    title: Indexes and Performance
    order: 4
    blurb: How indexes work, why they get skipped, query plans and fast pagination.
  - id: transactions
    title: Transactions and Concurrency
    order: 5
    blurb: ACID, isolation levels, MVCC, locks, deadlocks and the write-ahead log.
  - id: backend
    title: Databases in Backend Apps
    order: 6
    blurb: Connection pools, safe queries, ORMs, N+1, caching and upserts.
  - id: scaling
    title: Scaling and Reliability
    order: 7
    blurb: Replication, partitioning, sharding, CAP, distributed transactions and backups.
  - id: patterns
    title: SQL Patterns and Tricks
    order: 8
    blurb: A few reusable patterns that solve most SQL interview questions.
template: 3
