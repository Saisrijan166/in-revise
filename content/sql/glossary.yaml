terms:
  - id: database-term
    term: Database (SQL)
    aka: []
    definition: A named collection of tables and other SQL objects, managed by one database server.
    see: relational-databases
    source: &a1
      title: "PostgreSQL 18 docs: Appendix M Glossary"
      url: https://www.postgresql.org/docs/18/glossary.html
      verifiedOn: 2026-10-20
  - id: dbms
    term: DBMS
    aka:
      - database management system
    definition: Software that stores, queries and protects databases, such as PostgreSQL, MySQL or MongoDB.
    see: relational-databases
    source:
      title: Commonly asked DBMS interview questions (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/dbms/commonly-asked-dbms-interview-questions/
      verifiedOn: 2026-10-20
  - id: rdbms
    term: RDBMS
    aka:
      - relational database management system
      - relational database
    definition: A DBMS that stores data in relations (tables) linked by keys and queried with SQL.
    see: relational-databases
    source:
      title: "PostgreSQL 18 docs: 2.2 Concepts"
      url: https://www.postgresql.org/docs/18/tutorial-concepts.html
      verifiedOn: 2026-10-20
  - id: sql-language
    term: SQL (language)
    aka:
      - Structured Query Language
    definition: The standard language (ISO/IEC 9075) for defining, querying and changing relational data.
    see: relational-databases
    source:
      title: "PostgreSQL 18 docs: Appendix D SQL Conformance"
      url: https://www.postgresql.org/docs/18/features.html
      verifiedOn: 2026-10-20
  - id: db-schema
    term: Schema (SQL namespace)
    aka:
      - database schema
    definition: "PostgreSQL: a named namespace of objects inside one database. MySQL: another word for a database."
    see: relational-databases
    source:
      title: "PostgreSQL 18 docs: 5.10 Schemas"
      url: https://www.postgresql.org/docs/18/ddl-schemas.html
      verifiedOn: 2026-10-20
  - id: tuple
    term: Tuple
    aka: []
    definition: "The formal name for a row: a fixed list of attribute values in one relation."
    see: relational-databases
    source: *a1
  - id: attribute-term
    term: Attribute (relational)
    aka: []
    definition: "The formal name for a column: a named, typed element of every tuple."
    see: relational-databases
    source: *a1
  - id: primary-key
    term: Primary key
    aka:
      - PK
    definition: The one unique, non-NULL column set that identifies each row of a table.
    see: keys
    source: *a1
  - id: foreign-key
    term: Foreign key
    aka:
      - FK
    definition: Columns whose values must match a key in another (or the same) table, or be NULL.
    see: keys
    source: *a1
  - id: candidate-key
    term: Candidate key
    aka: []
    definition: A minimal set of columns that uniquely identifies a row; the primary key is chosen from these.
    see: keys
    source: &a2
      title: Types of Keys in the Relational Model (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/dbms/types-of-keys-in-relational-model-candidate-super-primary-alternate-and-foreign/
      verifiedOn: 2026-10-20
  - id: super-key
    term: Super key
    aka:
      - superkey
    definition: Any set of columns that uniquely identifies a row, even with extra columns.
    see: keys
    source: *a2
  - id: alternate-key
    term: Alternate key
    aka: []
    definition: A candidate key that was not chosen as the primary key; usually given a UNIQUE constraint.
    see: keys
    source: *a2
  - id: composite-key
    term: Composite key
    aka:
      - composite primary key
      - compound key
    definition: A key made of two or more columns that are unique only together.
    see: keys
    source: *a2
  - id: surrogate-key
    term: Surrogate key
    aka: []
    definition: A generated identifier, such as an identity number, with no business meaning.
    see: keys
    source: *a2
  - id: natural-key
    term: Natural key
    aka:
      - business key
    definition: A real-world value that is already unique, such as an email, used as the key.
    see: keys
    source: *a2
  - id: referential-integrity
    term: Referential integrity
    aka: []
    definition: The rule that every foreign key value points to a row that exists.
    see: keys
    source: &a3
      title: "PostgreSQL 18 docs: 5.5 Constraints"
      url: https://www.postgresql.org/docs/18/ddl-constraints.html
      verifiedOn: 2026-10-20
  - id: junction-table
    term: Junction table
    aka:
      - bridge table
      - associative table
      - mapping table
    definition: A table that links two tables in a many-to-many relationship with one foreign key to each.
    see: relationships
    source: *a3
  - id: nosql
    term: NoSQL
    aka:
      - non-relational database
    definition: "Non-relational databases: document, key-value, wide-column and graph stores, usually built to scale out."
    see: sql-and-nosql
    source:
      title: Cassandra Basics (Apache Cassandra)
      url: https://cassandra.apache.org/_/cassandra-basics.html
      verifiedOn: 2026-10-20
  - id: document-database
    term: Document database
    aka:
      - document store
    definition: Stores JSON-like documents whose fields can differ, with related data embedded; MongoDB is one.
    see: sql-and-nosql
    source:
      title: "MongoDB Manual: Data Modeling"
      url: https://www.mongodb.com/docs/manual/data-modeling/
      verifiedOn: 2026-10-20
  - id: key-value-store
    term: Key-value store
    aka:
      - key-value database
    definition: Stores each value under a unique key and looks it up by that key; Redis is one.
    see: sql-and-nosql
    source:
      title: "Redis docs: Keys and values (keyspace)"
      url: https://redis.io/docs/latest/develop/using-commands/keyspace/
      verifiedOn: 2026-10-20
  - id: wide-column-store
    term: Wide-column store
    aka:
      - wide-column database
    definition: Stores rows split into partitions across many nodes, each row with its own columns; Cassandra is one.
    see: sql-and-nosql
    source:
      title: "Apache Cassandra docs: Architecture overview"
      url: https://cassandra.apache.org/doc/latest/cassandra/architecture/overview.html
      verifiedOn: 2026-10-20
  - id: graph-database
    term: Graph database
    aka: []
    definition: Stores nodes and the relationships between them, each with properties; Neo4j is one.
    see: sql-and-nosql
    source:
      title: "Neo4j docs: What is a graph database"
      url: https://neo4j.com/docs/getting-started/graph-database/
      verifiedOn: 2026-10-20
  - id: jsonb
    term: JSONB
    aka: []
    definition: "PostgreSQL's binary JSON type: no reparsing on read, supports indexes, drops key order and duplicates."
    see: data-types
    source:
      title: "PostgreSQL 18 docs: 8.14 JSON Types"
      url: https://www.postgresql.org/docs/18/datatype-json.html
      verifiedOn: 2026-10-20
  - id: timestamptz
    term: timestamptz
    aka:
      - timestamp with time zone
    definition: "PostgreSQL type for an instant: converted to UTC on input, shown in the session time zone."
    see: data-types
    source:
      title: "PostgreSQL 18 docs: 8.5 Date/Time Types"
      url: https://www.postgresql.org/docs/18/datatype-datetime.html
      verifiedOn: 2026-10-20
  - id: not-null-constraint
    term: NOT NULL
    aka:
      - not-null constraint
    definition: A column constraint that rejects NULL, so every row must give a value.
    see: constraints
    source: *a3
  - id: check-constraint
    term: CHECK constraint
    aka: []
    definition: A rule on one row's values; the row is accepted when the rule is true or NULL.
    see: constraints
    source: *a3
  - id: on-delete-cascade
    term: ON DELETE CASCADE
    aka: []
    definition: "A foreign key action: deleting a parent row also deletes the rows that reference it."
    see: constraints
    source: *a3
  - id: storage-engine
    term: Storage engine
    aka: []
    definition: MySQL's pluggable component that stores and reads a table's data; InnoDB is the default.
    see: postgresql-and-mysql
    source: &a4
      title: "MySQL 9.7 Reference Manual: Alternative Storage Engines"
      url: https://dev.mysql.com/doc/refman/9.7/en/storage-engines.html
      verifiedOn: 2026-10-20
  - id: innodb
    term: InnoDB
    aka: []
    definition: MySQL's default storage engine, with transactions, crash recovery, row-level locks and foreign keys.
    see: postgresql-and-mysql
    source: *a4
  - id: postgresql-extension
    term: Extension (PostgreSQL)
    aka:
      - PostgreSQL extension
      - CREATE EXTENSION
    definition: An add-on package installed into a database with CREATE EXTENSION, such as pg_trgm.
    see: postgresql-and-mysql
    source:
      title: "PostgreSQL 18 docs: CREATE EXTENSION"
      url: https://www.postgresql.org/docs/18/sql-createextension.html
      verifiedOn: 2026-10-20
  - id: ddl
    term: DDL
    aka:
      - Data Definition Language
    definition: "Data Definition Language: statements that create, change or remove objects such as tables."
    see: sql-commands
    source: &a5
      title: "SQL Interview Questions: command categories (GeeksforGeeks)"
      url: https://www.geeksforgeeks.org/sql/sql-interview-questions/
      verifiedOn: 2026-10-20
  - id: dml
    term: DML
    aka:
      - Data Manipulation Language
    definition: "Data Manipulation Language: INSERT, UPDATE and DELETE, the statements that change rows."
    see: sql-commands
    source: *a5
  - id: crud
    term: CRUD
    definition: "Create, Read, Update, Delete: the four basic data operations, done with INSERT, SELECT, UPDATE and DELETE."
    see: sql-commands
    source: *a5
  - id: truncate-statement
    term: TRUNCATE
    aka:
      - TRUNCATE TABLE
    definition: Removes every row of a table at once, like an unqualified DELETE but without scanning the rows.
    see: sql-commands
    source:
      title: TRUNCATE (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/sql-truncate.html
      verifiedOn: 2026-10-20
  - id: ilike
    term: ILIKE
    definition: PostgreSQL's case-insensitive LIKE; not part of the SQL standard.
    see: select-and-filtering
    source:
      title: "Pattern Matching: LIKE, ILIKE (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/functions-matching.html
      verifiedOn: 2026-10-20
  - id: case-expression
    term: CASE expression
    aka:
      - CASE WHEN
    definition: "SQL's if/else: returns the result of the first WHEN condition that is true, or the ELSE value."
    see: select-and-filtering
    source: &a6
      title: Conditional Expressions (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/functions-conditional.html
      verifiedOn: 2026-10-20
  - id: column-alias
    term: Alias (SQL)
    aka:
      - column alias
      - table alias
    definition: A temporary name given with AS to an output column or a table inside one query.
    see: query-order
    source:
      title: "SELECT: output column names and FROM aliases (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/sql-select.html
      verifiedOn: 2026-10-20
  - id: three-valued-logic
    term: Three-valued logic
    aka:
      - 3-valued logic
    definition: SQL conditions can be TRUE, FALSE or UNKNOWN; a comparison with NULL gives UNKNOWN.
    see: null-handling
    source:
      title: Logical Operators (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/functions-logical.html
      verifiedOn: 2026-10-20
  - id: coalesce
    term: COALESCE
    definition: Returns its first argument that is not NULL, or NULL if all of them are.
    see: null-handling
    source: *a6
  - id: nullif
    term: NULLIF
    definition: NULLIF(a, b) returns NULL when a equals b, otherwise a.
    see: null-handling
    source: *a6
  - id: char-length
    term: CHAR_LENGTH
    aka:
      - CHARACTER_LENGTH
    definition: Number of characters in a string; MySQL LENGTH counts bytes instead.
    see: string-date-functions
    source:
      title: "String Functions and Operators (MySQL 9.7 Reference Manual)"
      url: https://dev.mysql.com/doc/refman/9.7/en/string-functions.html
      verifiedOn: 2026-10-20
  - id: concat-function
    term: CONCAT
    aka:
      - CONCAT_WS
    definition: Joins strings into one; MySQL returns NULL if any part is NULL, PostgreSQL skips NULL parts.
    see: string-date-functions
    source:
      title: "String Functions and Operators (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/functions-string.html
      verifiedOn: 2026-10-20
  - id: extract-function
    term: EXTRACT
    definition: EXTRACT(field FROM value) returns one field of a date or time, such as YEAR or MONTH.
    see: string-date-functions
    source:
      title: "Date/Time Functions and Operators (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/functions-datetime.html
      verifiedOn: 2026-10-20
  - id: interval-type
    term: INTERVAL
    definition: A span of time, such as 7 days, that can be added to or subtracted from a date or timestamp.
    see: string-date-functions
    source:
      title: "Date/Time Functions and Operators (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/functions-datetime.html
      verifiedOn: 2026-10-20
  - id: date-trunc
    term: DATE_TRUNC
    definition: "PostgreSQL function that cuts a timestamp down to a unit, such as the first moment of its month."
    see: string-date-functions
    source:
      title: "Date/Time Functions and Operators (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/functions-datetime.html
      verifiedOn: 2026-10-20
  - id: select-distinct
    term: SELECT DISTINCT
    definition: Removes duplicate rows from the result, comparing all selected columns together.
    see: select-and-filtering
    source:
      title: "SELECT Statement (MySQL 9.7 Reference Manual)"
      url: https://dev.mysql.com/doc/refman/9.7/en/select.html
      verifiedOn: 2026-10-20
  - id: aggregate-function
    term: Aggregate function
    aka:
      - aggregate functions
    definition: A function such as COUNT, SUM, AVG, MIN or MAX that turns many input rows into one value.
    see: aggregates-group-by
    source:
      title: Aggregate Functions (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/functions-aggregate.html
      verifiedOn: 2026-10-20
  - id: group-by-term
    term: GROUP BY
    definition: Collects rows with equal values in the listed columns into one group, so aggregates run per group.
    see: aggregates-group-by
    source: &a7
      title: "Table Expressions: GROUP BY, HAVING, joins (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/queries-table-expressions.html
      verifiedOn: 2026-10-20
  - id: having-clause
    term: HAVING (SQL clause)
    aka:
      - HAVING clause
    definition: Filters groups after GROUP BY; unlike WHERE it can test aggregates such as COUNT(*).
    see: aggregates-group-by
    source: *a7
  - id: inner-join
    term: Inner join
    definition: A join that returns only the pairs of rows that meet the join condition.
    see: joins
    source: *a7
  - id: outer-join
    term: Outer join
    aka:
      - outer joins
    definition: "A LEFT, RIGHT or FULL join: matched pairs plus unmatched rows, padded with NULLs."
    see: joins
    source: *a7
  - id: cross-join
    term: Cross join
    aka:
      - Cartesian product
    definition: "Pairs every row of one table with every row of another: N times M rows, no condition."
    see: joins
    source: *a7
  - id: self-join
    term: Self join
    aka:
      - self-join
    definition: A table joined to itself under two aliases, such as employees with their managers.
    see: joins
    source:
      title: Joins Between Tables (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/tutorial-join.html
      verifiedOn: 2026-10-20
  - id: equi-join
    term: Equi join
    aka:
      - equi-join
      - non-equi join
    definition: A join whose condition uses equality; a non-equi join uses ranges or other comparisons instead.
    see: joins
    source: *a5
  - id: subquery-term
    term: Subquery
    aka:
      - subqueries
      - nested query
    definition: A SELECT inside another statement; a scalar subquery returns exactly one row and one column.
    see: subqueries
    source:
      title: Scalar Subqueries (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/sql-expressions.html
      verifiedOn: 2026-10-20
  - id: correlated-subquery
    term: Correlated subquery
    definition: A subquery that refers to a column of a table in the outer query.
    see: subqueries
    source:
      title: Correlated Subqueries (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/correlated-subqueries.html
      verifiedOn: 2026-10-20
  - id: derived-table
    term: Derived table
    definition: A subquery in the FROM clause, used like a table; standard SQL requires it to have an alias.
    see: subqueries
    source: *a7
  - id: union-all
    term: UNION ALL
    definition: Stacks the rows of two queries and keeps duplicates; plain UNION removes them.
    see: set-operations
    source:
      title: "SELECT: UNION clause (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/sql-select.html
      verifiedOn: 2026-10-20
  - id: window-function
    term: Window function
    aka:
      - window functions
      - OVER clause
    definition: A function with an OVER clause that computes across related rows while keeping every row.
    see: window-functions
    source: &a8
      title: Window Functions tutorial (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/tutorial-window.html
      verifiedOn: 2026-10-20
  - id: partition-by
    term: PARTITION BY
    definition: Inside OVER, splits rows into groups that a window function treats separately.
    see: window-functions
    source: *a8
  - id: window-frame
    term: Window frame
    definition: "The rows around the current row that a window aggregate uses, set with ROWS or RANGE (PostgreSQL also GROUPS)."
    see: window-functions
    source:
      title: Window Function Calls (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/sql-expressions.html
      verifiedOn: 2026-10-20
  - id: row-number
    term: ROW_NUMBER
    definition: Numbers the rows of each partition 1, 2, 3 in window order, even when values tie.
    see: window-functions
    source: &a9
      title: Window Functions (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/functions-window.html
      verifiedOn: 2026-10-20
  - id: rank-function
    term: RANK (window function)
    aka:
      - RANK()
    definition: "Rank with gaps: tied rows share a rank and the next rank skips, as in 1, 1, 3."
    see: window-functions
    source: *a9
  - id: dense-rank
    term: DENSE_RANK
    definition: "Rank without gaps: tied rows share a rank and the next is one higher, as in 1, 1, 2."
    see: window-functions
    source: *a9
  - id: lag-lead
    term: LAG and LEAD (window functions)
    aka:
      - LAG()
      - LEAD()
    definition: Return a value from an earlier (LAG) or later (LEAD) row in the partition; NULL if there is none.
    see: window-functions
    source: *a9
  - id: cte
    term: CTE
    aka:
      - common table expression
      - WITH clause
    definition: A named subquery written with WITH before the main query, which reads it like a table.
    see: ctes
    source: &a10
      title: WITH Queries (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/queries-with.html
      verifiedOn: 2026-10-20
  - id: recursive-cte
    term: Recursive CTE
    aka:
      - WITH RECURSIVE
    definition: A CTE that refers to itself, repeating a step until no new rows appear; used for trees.
    see: ctes
    source: *a10
  - id: normalization-term
    term: Normalisation
    aka:
      - normalization
    definition: Splitting tables so each fact is stored once, to prevent update, insert and delete anomalies.
    see: normalization
    source: &a11
      title: A Simple Guide to Five Normal Forms in Relational Database Theory (William Kent, CACM 1983)
      url: http://www.bkent.net/Doc/simple5.htm
      verifiedOn: 2026-10-20
  - id: denormalization-term
    term: Denormalisation
    aka:
      - denormalization
    definition: Adding copied or precomputed data on purpose so frequent reads need fewer joins.
    see: denormalization
    source: &a12
      title: Database System Concepts, 7th ed., chapter 7 slides (Silberschatz, Korth, Sudarshan)
      url: https://www.db-book.com/slides-dir/PDF-dir/ch7.pdf
      verifiedOn: 2026-10-20
  - id: normal-form
    term: Normal form
    definition: A design rule a table meets, such as 1NF, 2NF or 3NF; each higher form removes more redundancy.
    see: normalization
    source: *a11
  - id: first-normal-form
    term: 1NF
    aka:
      - first normal form
    definition: "First normal form: every cell holds one single value, with no lists or repeating groups."
    see: normalization
    source: *a12
  - id: second-normal-form
    term: 2NF
    aka:
      - second normal form
    definition: "Second normal form: 1NF, and no non-key column depends on only part of a composite key."
    see: normalization
    source: *a11
  - id: third-normal-form
    term: 3NF
    aka:
      - third normal form
    definition: "Third normal form: 2NF, and no non-key column depends on another non-key column."
    see: normalization
    source: *a11
  - id: bcnf
    term: BCNF
    aka:
      - Boyce-Codd normal form
    definition: "Boyce-Codd normal form: the left side of every non-trivial functional dependency is a superkey."
    see: normalization
    source: *a12
  - id: functional-dependency
    term: Functional dependency
    definition: Y depends on X when two rows with the same X value can never have different Y values.
    see: normalization
    source: *a11
  - id: partial-dependency
    term: Partial dependency
    definition: A non-key column that depends on only part of a composite key; 2NF removes it.
    see: normalization
    source: *a11
  - id: transitive-dependency
    term: Transitive dependency
    definition: A non-key column that depends on another non-key column, not directly on the key; 3NF removes it.
    see: normalization
    source: *a11
  - id: update-anomaly
    term: Update anomaly
    definition: A fact stored in many rows must be changed in all of them, or the copies disagree.
    see: normalization
    source: *a11
  - id: insertion-anomaly
    term: Insertion anomaly
    definition: A fact cannot be stored because a row needs another, unrelated fact that does not exist yet.
    see: normalization
    source: *a11
  - id: deletion-anomaly
    term: Deletion anomaly
    definition: Deleting one fact also deletes another fact that lived only in the same row.
    see: normalization
    source: *a11
  - id: identity-column
    term: Identity column
    aka:
      - GENERATED AS IDENTITY
      - GENERATED ALWAYS AS IDENTITY
      - GENERATED BY DEFAULT AS IDENTITY
    definition: A column filled automatically from its own sequence; the SQL-standard way to generate ids in PostgreSQL.
    see: id-generation
    source:
      title: "PostgreSQL 18: Identity Columns"
      url: https://www.postgresql.org/docs/18/ddl-identity-columns.html
      verifiedOn: 2026-10-20
  - id: sequence-object
    term: Sequence (SQL)
    aka:
      - CREATE SEQUENCE
      - sequence object
      - nextval
    definition: A database object that hands out increasing numbers; a number once handed out is never given back.
    see: id-generation
    source:
      title: "PostgreSQL 18: Sequence Manipulation Functions"
      url: https://www.postgresql.org/docs/18/functions-sequence.html
      verifiedOn: 2026-10-20
  - id: serial-type
    term: SERIAL
    aka:
      - BIGSERIAL
    definition: PostgreSQL shorthand for an integer column whose default comes from a new sequence.
    see: id-generation
    source:
      title: "PostgreSQL 18: Numeric Types (serial types)"
      url: https://www.postgresql.org/docs/18/datatype-numeric.html
      verifiedOn: 2026-10-20
  - id: auto-increment
    term: AUTO_INCREMENT
    definition: MySQL column attribute that gives each new row the next number from the table's counter.
    see: id-generation
    source:
      title: "MySQL 9.7: AUTO_INCREMENT Handling in InnoDB"
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-auto-increment-handling.html
      verifiedOn: 2026-10-20
  - id: uuid
    term: UUID
    aka:
      - universally unique identifier
      - GUID
    definition: A 128-bit identifier that can be generated anywhere, without a central counter, with almost no chance of a clash.
    see: id-generation
    source: &a13
      title: "RFC 9562: Universally Unique IDentifiers (UUIDs)"
      url: https://www.rfc-editor.org/rfc/rfc9562
      verifiedOn: 2026-10-20
  - id: uuid-v7
    term: UUIDv7
    aka:
      - UUID version 7
    definition: A UUID that starts with a millisecond Unix timestamp, so new values sort by creation time.
    see: id-generation
    source: *a13
  - id: view-term
    term: View (SQL)
    aka:
      - database view
      - SQL view
      - CREATE VIEW
    definition: A named, stored SELECT that you query like a table; it holds no data of its own.
    see: views
    source:
      title: "PostgreSQL 18: CREATE VIEW"
      url: https://www.postgresql.org/docs/18/sql-createview.html
      verifiedOn: 2026-10-20
  - id: materialized-view
    term: Materialized view
    aka:
      - materialised view
    definition: A view whose result is stored like a table and is brought up to date only by a refresh.
    see: views
    source:
      title: "PostgreSQL 18: Materialized Views"
      url: https://www.postgresql.org/docs/18/rules-materializedviews.html
      verifiedOn: 2026-10-20
  - id: stored-procedure
    term: Stored procedure
    aka:
      - CREATE PROCEDURE
    definition: A named routine stored in the database and run with CALL; it returns no value of its own.
    see: stored-procedures-triggers
    source: &a14
      title: "PostgreSQL 18: User-Defined Procedures"
      url: https://www.postgresql.org/docs/18/xproc.html
      verifiedOn: 2026-10-20
  - id: user-defined-function
    term: User-defined function
    aka:
      - stored function
      - CREATE FUNCTION
    definition: A routine stored in the database that returns a value and is called inside a query.
    see: stored-procedures-triggers
    source: *a14
  - id: db-trigger
    term: Trigger (database)
    aka:
      - database trigger
      - row-level trigger
      - statement-level trigger
      - CREATE TRIGGER
    definition: Code the database runs automatically before or after an INSERT, UPDATE or DELETE on a table.
    see: stored-procedures-triggers
    source:
      title: "PostgreSQL 18: Overview of Trigger Behavior"
      url: https://www.postgresql.org/docs/18/trigger-definition.html
      verifiedOn: 2026-10-20
  - id: oltp
    term: OLTP
    aka:
      - online transaction processing
    definition: "Online transaction processing: recording day-to-day business events as many small, fast transactions."
    see: oltp-and-olap
    source:
      title: Online transaction processing (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/online-transaction-processing
      verifiedOn: 2026-10-20
  - id: olap
    term: OLAP
    aka:
      - online analytical processing
    definition: "Online analytical processing: complex, read-heavy queries for trends and reports over large data."
    see: oltp-and-olap
    source:
      title: Online analytical processing (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/online-analytical-processing
      verifiedOn: 2026-10-20
  - id: data-warehouse
    term: Data warehouse
    definition: A central store that collects data from many systems and is built for analysis and reporting.
    see: oltp-and-olap
    source:
      title: What is a data warehouse? (AWS)
      url: https://aws.amazon.com/what-is/data-warehouse/
      verifiedOn: 2026-10-20
  - id: star-schema
    term: Star schema
    definition: A warehouse design where one fact table links to several dimension tables around it.
    see: oltp-and-olap
    source: &a15
      title: Understand star schema (Microsoft Learn, Power BI guidance)
      url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
      verifiedOn: 2026-10-20
  - id: fact-table
    term: Fact table
    definition: A table of events or measurements, such as sales, holding numbers and keys to dimension tables.
    see: oltp-and-olap
    source: *a15
  - id: dimension-table
    term: Dimension table
    definition: A table describing things such as dates, products or stores, used to filter and group facts.
    see: oltp-and-olap
    source: *a15
  - id: etl
    term: ETL
    aka:
      - extract, transform, load
    definition: "Extract, transform, load: copying data from source systems into an analytics store, reshaping it on the way."
    see: oltp-and-olap
    source:
      title: Extract, transform, and load (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/etl
      verifiedOn: 2026-10-20
  - id: column-store
    term: Column store
    aka:
      - columnstore
      - columnar storage
    definition: Storage that keeps each column's values together instead of whole rows; compresses well and suits big scans.
    see: oltp-and-olap
    source:
      title: "Columnstore indexes: overview (Microsoft Learn, SQL Server)"
      url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview
      verifiedOn: 2026-10-20
  - id: database-index-term
    term: Index (database)
    aka:
      - database index
      - table index
    definition: A separate structure over some columns that finds rows without reading the whole table.
    see: indexes
    source:
      title: "Indexes: Introduction (PostgreSQL 18 docs, 11.1)"
      url: https://www.postgresql.org/docs/18/indexes-intro.html
      verifiedOn: 2026-10-20
  - id: btree-index
    term: B-tree index
    aka:
      - B-tree
      - btree
    definition: "The default index: a balanced sorted tree serving =, ranges, sorting and prefix LIKE."
    see: index-types
    source:
      title: Index Types (PostgreSQL 18 docs, 11.2)
      url: https://www.postgresql.org/docs/18/indexes-types.html
      verifiedOn: 2026-10-20
  - id: hash-index
    term: Hash index
    definition: An index of hash codes; it serves only = lookups. InnoDB tables do not offer it.
    see: index-types
    source:
      title: Index Types (PostgreSQL 18 docs, 11.2)
      url: https://www.postgresql.org/docs/18/indexes-types.html
      verifiedOn: 2026-10-20
  - id: gin-index
    term: GIN index
    aka:
      - GIN
      - Generalized Inverted Index
    definition: PostgreSQL inverted index with one entry per element; used for arrays, JSONB and full-text.
    see: index-types
    source:
      title: Index Types (PostgreSQL 18 docs, 11.2)
      url: https://www.postgresql.org/docs/18/indexes-types.html
      verifiedOn: 2026-10-20
  - id: gist-index
    term: GiST index
    aka:
      - GiST
      - SP-GiST
    definition: PostgreSQL index frameworks for geometric data, ranges and nearest-neighbour searches.
    see: index-types
    source:
      title: Index Types (PostgreSQL 18 docs, 11.2)
      url: https://www.postgresql.org/docs/18/indexes-types.html
      verifiedOn: 2026-10-20
  - id: brin-index
    term: BRIN index
    aka:
      - BRIN
      - Block Range Index
    definition: PostgreSQL index storing min and max per block range; tiny, for columns in physical order.
    see: index-types
    source:
      title: Index Types (PostgreSQL 18 docs, 11.2)
      url: https://www.postgresql.org/docs/18/indexes-types.html
      verifiedOn: 2026-10-20
  - id: partial-index
    term: Partial index
    aka:
      - filtered index
    definition: A PostgreSQL index over only the rows matching its WHERE condition.
    see: index-types
    source:
      title: Partial Indexes (PostgreSQL 18 docs, 11.8)
      url: https://www.postgresql.org/docs/18/indexes-partial.html
      verifiedOn: 2026-10-20
  - id: expression-index
    term: Expression index
    aka:
      - functional index
      - functional key part
      - index on expression
    definition: An index on a computed value such as lower(email), so filters on that value can use it.
    see: index-not-used
    source:
      title: Indexes on Expressions (PostgreSQL 18 docs, 11.7)
      url: https://www.postgresql.org/docs/18/indexes-expressional.html
      verifiedOn: 2026-10-20
  - id: unique-index
    term: Unique index
    definition: An index that rejects two rows with the same key; PRIMARY KEY and UNIQUE create one.
    see: index-types
    source:
      title: Unique Indexes (PostgreSQL 18 docs, 11.6)
      url: https://www.postgresql.org/docs/18/indexes-unique.html
      verifiedOn: 2026-10-20
  - id: fulltext-index-term
    term: Full-text index
    aka:
      - FULLTEXT index
      - full-text search index
    definition: An index of words for text search; MySQL FULLTEXT, or a GIN index on tsvector in PostgreSQL.
    see: index-types
    source:
      title: How MySQL Uses Indexes (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/mysql-indexes.html
      verifiedOn: 2026-10-20
  - id: clustered-index
    term: Clustered index
    definition: An index that is the table itself, rows stored in key order; in InnoDB, the primary key.
    see: clustered-indexes
    source:
      title: Clustered and Secondary Indexes (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-index-types.html
      verifiedOn: 2026-10-20
  - id: secondary-index
    term: Secondary index
    aka:
      - non-clustered index
      - nonclustered index
    definition: An index stored apart from the rows; in InnoDB its entries carry the primary key.
    see: clustered-indexes
    source:
      title: Clustered and Secondary Indexes (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-index-types.html
      verifiedOn: 2026-10-20
  - id: postgresql-heap
    term: Heap (PostgreSQL)
    aka:
      - heap table
      - table heap
    definition: "PostgreSQL's main table storage: rows in no key order, with every index stored separately."
    see: clustered-indexes
    source:
      title: "Index-Only Scans and Covering Indexes (PostgreSQL 18 docs, 11.9)"
      url: https://www.postgresql.org/docs/18/indexes-index-only-scans.html
      verifiedOn: 2026-10-20
  - id: composite-index
    term: Composite index
    aka:
      - multicolumn index
      - multi-column index
      - compound index
    definition: One index on several columns, sorted by the first, then the next.
    see: composite-indexes
    source:
      title: Multicolumn Indexes (PostgreSQL 18 docs, 11.3)
      url: https://www.postgresql.org/docs/18/indexes-multicolumn.html
      verifiedOn: 2026-10-20
  - id: leftmost-prefix
    term: Leftmost prefix
    aka:
      - leftmost-prefix rule
      - leftmost prefix rule
    definition: A composite index on (a, b, c) serves lookups on a; a, b; or a, b, c.
    see: composite-indexes
    source:
      title: Multiple-Column Indexes (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/multiple-column-indexes.html
      verifiedOn: 2026-10-20
  - id: covering-index
    term: Covering index
    definition: An index holding every column a query needs, so the table is not read.
    see: composite-indexes
    source:
      title: Index-Only Scans and Covering Indexes (PostgreSQL 18 docs, 11.9)
      url: https://www.postgresql.org/docs/18/indexes-index-only-scans.html
      verifiedOn: 2026-10-20
  - id: index-only-scan
    term: Index-only scan
    aka:
      - Index Only Scan
    definition: A read answered from the index alone, without visiting table rows.
    see: composite-indexes
    source:
      title: Index-Only Scans and Covering Indexes (PostgreSQL 18 docs, 11.9)
      url: https://www.postgresql.org/docs/18/indexes-index-only-scans.html
      verifiedOn: 2026-10-20
  - id: include-columns
    term: INCLUDE (index)
    aka:
      - INCLUDE clause
      - INCLUDE columns
    definition: PostgreSQL 11+ clause adding stored payload columns to an index that are not search keys.
    see: composite-indexes
    source:
      title: Index-Only Scans and Covering Indexes (PostgreSQL 18 docs, 11.9)
      url: https://www.postgresql.org/docs/18/indexes-index-only-scans.html
      verifiedOn: 2026-10-20
  - id: selectivity
    term: Selectivity
    definition: The fraction of rows a condition keeps; the smaller it is, the more an index helps.
    see: index-not-used
    source:
      title: Row Estimation Examples (PostgreSQL 18 docs, 69.1)
      url: https://www.postgresql.org/docs/18/row-estimation-examples.html
      verifiedOn: 2026-10-20
  - id: cardinality
    term: Cardinality (column)
    aka:
      - column cardinality
      - high cardinality
      - low cardinality
    definition: The number of distinct values in a column or index; email is high, status is low.
    see: index-not-used
    source:
      title: SHOW INDEX Statement (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/show-index.html
      verifiedOn: 2026-10-20
  - id: planner-statistics
    term: Statistics (planner)
    aka:
      - planner statistics
      - optimizer statistics
      - table statistics
    definition: Sampled facts about column values that the planner uses to estimate row counts.
    see: index-not-used
    source:
      title: Statistics Used by the Planner (PostgreSQL 18 docs, 14.2)
      url: https://www.postgresql.org/docs/18/planner-stats.html
      verifiedOn: 2026-10-20
  - id: query-planner
    term: Query planner
    aka:
      - query optimizer
      - cost-based optimizer
      - query planner/optimizer
    definition: The part of the database that picks the cheapest way to run a query.
    see: explain-query-plans
    source:
      title: Planner/Optimizer (PostgreSQL 18 docs, 51.5)
      url: https://www.postgresql.org/docs/18/planner-optimizer.html
      verifiedOn: 2026-10-20
  - id: execution-plan
    term: Execution plan
    aka:
      - query plan
    definition: "The steps the database chose for a query: which scans, which joins, in what order."
    see: explain-query-plans
    source:
      title: Using EXPLAIN (PostgreSQL 18 docs, 14.1)
      url: https://www.postgresql.org/docs/18/using-explain.html
      verifiedOn: 2026-10-20
  - id: explain-statement
    term: EXPLAIN
    definition: A command that shows the plan the database would use for a query, without running it.
    see: explain-query-plans
    source:
      title: EXPLAIN (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/sql-explain.html
      verifiedOn: 2026-10-20
  - id: explain-analyze
    term: EXPLAIN ANALYZE
    definition: Runs the query and shows the plan with actual row counts and times.
    see: explain-query-plans
    source:
      title: EXPLAIN (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/sql-explain.html
      verifiedOn: 2026-10-20
  - id: seq-scan
    term: Sequential scan
    aka:
      - Seq Scan
      - full table scan
      - table scan
    definition: Reading every row of a table in storage order; MySQL EXPLAIN shows it as type ALL.
    see: explain-query-plans
    source:
      title: Using EXPLAIN (PostgreSQL 18 docs, 14.1)
      url: https://www.postgresql.org/docs/18/using-explain.html
      verifiedOn: 2026-10-20
  - id: index-scan
    term: Index scan
    aka:
      - Index Scan
    definition: Walking an index for matching keys, then fetching each matching row from the table.
    see: explain-query-plans
    source:
      title: Using EXPLAIN (PostgreSQL 18 docs, 14.1)
      url: https://www.postgresql.org/docs/18/using-explain.html
      verifiedOn: 2026-10-20
  - id: bitmap-scan
    term: Bitmap scan
    aka:
      - Bitmap Heap Scan
      - Bitmap Index Scan
    definition: PostgreSQL plan that collects matching row locations from indexes, then reads pages in order.
    see: explain-query-plans
    source:
      title: Combining Multiple Indexes (PostgreSQL 18 docs, 11.5)
      url: https://www.postgresql.org/docs/18/indexes-bitmap-scans.html
      verifiedOn: 2026-10-20
  - id: nested-loop-join
    term: Nested loop join
    aka:
      - nested loop
      - nested-loop join
    definition: A join that scans the inner side once per outer row; fast when the inner side is indexed.
    see: explain-query-plans
    source:
      title: Planner/Optimizer (PostgreSQL 18 docs, 51.5)
      url: https://www.postgresql.org/docs/18/planner-optimizer.html
      verifiedOn: 2026-10-20
  - id: hash-join
    term: Hash join
    definition: A join that loads one side into a hash table, then probes it with each row of the other.
    see: explain-query-plans
    source:
      title: Planner/Optimizer (PostgreSQL 18 docs, 51.5)
      url: https://www.postgresql.org/docs/18/planner-optimizer.html
      verifiedOn: 2026-10-20
  - id: merge-join
    term: Merge join
    aka:
      - sort-merge join
    definition: A join of two inputs sorted on the join key, merged in one pass.
    see: explain-query-plans
    source:
      title: Planner/Optimizer (PostgreSQL 18 docs, 51.5)
      url: https://www.postgresql.org/docs/18/planner-optimizer.html
      verifiedOn: 2026-10-20
  - id: pg-stat-statements
    term: pg_stat_statements
    definition: PostgreSQL module that records calls and planning and execution time for every statement.
    see: query-optimization
    source:
      title: pg_stat_statements (PostgreSQL 18 docs, F.32)
      url: https://www.postgresql.org/docs/18/pgstatstatements.html
      verifiedOn: 2026-10-20
  - id: slow-query-log
    term: Slow query log
    definition: MySQL log of statements that ran longer than long_query_time seconds.
    see: query-optimization
    source:
      title: The Slow Query Log (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/slow-query-log.html
      verifiedOn: 2026-10-20
  - id: keyset-pagination
    term: Keyset pagination
    aka:
      - seek method
      - cursor pagination
      - cursor-based pagination
      - pagination cursor
    definition: Paging by asking for rows after the last row seen, instead of skipping rows with OFFSET.
    see: pagination
    source:
      title: "Paging Through Results: the seek method (Markus Winand, use-the-index-luke.com)"
      url: https://use-the-index-luke.com/sql/partial-results/fetch-next-page
      verifiedOn: 2026-10-20
  - id: savepoint
    term: Savepoint
    definition: A named mark inside a transaction; ROLLBACK TO it undoes only the work done after it.
    see: transactions
    source:
      title: SAVEPOINT (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/sql-savepoint.html
      verifiedOn: 2026-10-20
  - id: autocommit
    term: Autocommit
    aka:
      - autocommit mode
      - auto-commit
    definition: The default mode where each statement outside BEGIN runs as its own transaction.
    see: transactions
    source:
      title: BEGIN (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/sql-begin.html
      verifiedOn: 2026-10-20
  - id: implicit-commit
    term: Implicit commit
    definition: MySQL ends the open transaction with a commit before most DDL, such as ALTER TABLE.
    see: transactions
    source:
      title: Statements That Cause an Implicit Commit (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/implicit-commit.html
      verifiedOn: 2026-10-20
  - id: acid-term
    term: ACID
    definition: "Atomicity, consistency, isolation, durability: the four guarantees of a database transaction."
    see: acid
    source:
      title: Glossary (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/glossary.html
      verifiedOn: 2026-10-20
  - id: read-committed
    term: READ COMMITTED
    definition: Isolation level where each statement sees only data committed before that statement began.
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: repeatable-read
    term: REPEATABLE READ
    definition: Isolation level where the whole transaction reads from one snapshot, so re-reads match.
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: serializable
    term: SERIALIZABLE
    definition: "The strictest isolation level: the result equals running the transactions one at a time."
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: dirty-read
    term: Dirty read
    definition: Reading a change another transaction has not committed and may still roll back.
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: non-repeatable-read
    term: Non-repeatable read
    aka:
      - nonrepeatable read
      - fuzzy read
    definition: Reading the same row twice in one transaction and getting different committed values.
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: phantom-read
    term: Phantom read
    aka:
      - phantom rows
    definition: Re-running a query with the same condition and getting a different set of rows.
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: lost-update
    term: Lost update
    definition: Two transactions read, then write the same row; the later write erases the earlier one.
    see: optimistic-pessimistic-locking
    source:
      title: A Critique of ANSI SQL Isolation Levels (Berenson et al., 1995)
      url: https://arxiv.org/abs/cs/0701157
      verifiedOn: 2026-10-20
  - id: write-skew
    term: Write skew
    definition: Two transactions read overlapping data, write different rows, and together break a rule.
    see: isolation-levels
    source:
      title: Serializable Snapshot Isolation (PostgreSQL wiki)
      url: https://wiki.postgresql.org/wiki/SSI
      verifiedOn: 2026-10-20
  - id: snapshot-isolation
    term: Snapshot isolation
    definition: Each transaction reads a snapshot from its start; PostgreSQL REPEATABLE READ works this way.
    see: isolation-levels
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/transaction-iso.html
      verifiedOn: 2026-10-20
  - id: serialization-failure
    term: Serialization failure
    aka:
      - serialization error
    definition: An abort with SQLSTATE 40001 that stops an anomaly; retry the whole transaction.
    see: isolation-levels
    source:
      title: Serialization Failure Handling (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/mvcc-serialization-failure-handling.html
      verifiedOn: 2026-10-20
  - id: mvcc-term
    term: MVCC
    aka:
      - multiversion concurrency control
      - multi-version concurrency control
    definition: Keeping several versions of each row so readers use a snapshot and do not block writers.
    see: mvcc
    source:
      title: "Concurrency Control: Introduction (PostgreSQL 18 documentation)"
      url: https://www.postgresql.org/docs/18/mvcc-intro.html
      verifiedOn: 2026-10-20
  - id: dead-tuple
    term: Dead tuple
    aka:
      - dead row version
    definition: In PostgreSQL, an old row version no transaction can see any more, waiting for VACUUM.
    see: mvcc
    source:
      title: Routine Vacuuming (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/routine-vacuuming.html
      verifiedOn: 2026-10-20
  - id: vacuum
    term: VACUUM
    aka:
      - autovacuum
    definition: PostgreSQL's cleanup of dead row versions; the autovacuum daemon runs it automatically.
    see: mvcc
    source:
      title: Glossary (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/glossary.html
      verifiedOn: 2026-10-20
  - id: bloat
    term: Bloat (PostgreSQL)
    aka:
      - table bloat
    definition: Space in data pages not holding current row versions, such as free space or dead tuples.
    see: mvcc
    source:
      title: Glossary (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/glossary.html
      verifiedOn: 2026-10-20
  - id: undo-log
    term: Undo log
    aka:
      - undo logs
      - rollback segment
    definition: InnoDB's record of old row values, used for rollback and for consistent reads.
    see: mvcc
    source:
      title: InnoDB Multi-Versioning (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-multi-versioning.html
      verifiedOn: 2026-10-20
  - id: shared-lock
    term: Shared lock
    aka:
      - S lock
      - read lock
    definition: A lock many transactions can hold at once; it lets them read a row and stops changes.
    see: locking
    source:
      title: InnoDB Locking (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-locking.html
      verifiedOn: 2026-10-20
  - id: exclusive-lock
    term: Exclusive lock
    aka:
      - X lock
      - write lock
    definition: A lock only one transaction can hold; it lets that transaction update or delete the row.
    see: locking
    source:
      title: InnoDB Locking (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-locking.html
      verifiedOn: 2026-10-20
  - id: gap-lock
    term: Gap lock
    definition: An InnoDB lock on the space between index records that stops other inserts there.
    see: locking
    source:
      title: InnoDB Locking (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-locking.html
      verifiedOn: 2026-10-20
  - id: next-key-lock
    term: Next-key lock
    definition: InnoDB's record lock plus a gap lock on the gap before that record.
    see: locking
    source:
      title: InnoDB Locking (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-locking.html
      verifiedOn: 2026-10-20
  - id: select-for-update
    term: SELECT FOR UPDATE
    aka:
      - FOR UPDATE
      - SELECT … FOR UPDATE
    definition: "A locking read: locks the returned rows as if updating them, until the transaction ends."
    see: locking
    source:
      title: Explicit Locking (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/explicit-locking.html
      verifiedOn: 2026-10-20
  - id: skip-locked
    term: SKIP LOCKED
    aka:
      - NOWAIT
    definition: "Locking-read options that never wait: SKIP LOCKED skips locked rows, NOWAIT raises an error."
    see: locking
    source:
      title: "SELECT: The Locking Clause (PostgreSQL 18 documentation)"
      url: https://www.postgresql.org/docs/18/sql-select.html
      verifiedOn: 2026-10-20
  - id: lock-wait-timeout
    term: Lock wait timeout
    aka:
      - innodb_lock_wait_timeout
      - lock_timeout
    definition: The longest a statement waits for a lock before it fails.
    see: locking
    source:
      title: InnoDB Startup Options and System Variables (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-parameters.html
      verifiedOn: 2026-10-20
  - id: optimistic-locking
    term: Optimistic locking
    definition: Taking no lock, then failing the write if a version column shows someone changed the row.
    see: optimistic-pessimistic-locking
    source:
      title: Controlling Concurrent Access to Entity Data with Locking (Jakarta EE Tutorial)
      url: https://jakarta.ee/learn/jakartaee-tutorial/9.1/persist/persistence-locking/persistence-locking.html
      verifiedOn: 2026-10-20
  - id: pessimistic-locking
    term: Pessimistic locking
    definition: Locking rows in the database before changing them, so others must wait.
    see: optimistic-pessimistic-locking
    source:
      title: Controlling Concurrent Access to Entity Data with Locking (Jakarta EE Tutorial)
      url: https://jakarta.ee/learn/jakartaee-tutorial/9.1/persist/persistence-locking/persistence-locking.html
      verifiedOn: 2026-10-20
  - id: deadlock-term
    term: Deadlock
    definition: Two or more transactions each hold a lock the other wants, so none can proceed.
    see: deadlocks
    source:
      title: "Explicit Locking: Deadlocks (PostgreSQL 18 documentation)"
      url: https://www.postgresql.org/docs/18/explicit-locking.html
      verifiedOn: 2026-10-20
  - id: wal-term
    term: WAL
    aka:
      - write-ahead log
      - write-ahead logging
    definition: A log where every change is recorded and flushed before the data files are changed.
    see: wal
    source:
      title: Write-Ahead Logging (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/18/wal-intro.html
      verifiedOn: 2026-10-20
  - id: redo-log
    term: Redo log
    definition: InnoDB's on-disk log of changes, replayed during crash recovery.
    see: wal
    source:
      title: Redo Log (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/innodb-redo-log.html
      verifiedOn: 2026-10-20
  - id: binary-log
    term: Binary log
    aka:
      - binlog
    definition: MySQL's log of data-changing events, used for replication and point-in-time recovery.
    see: wal
    source:
      title: The Binary Log (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/binary-log.html
      verifiedOn: 2026-10-20
  - id: connection-pool
    term: Connection pool
    definition: A set of open database connections that the app borrows and returns instead of opening new ones.
    see: connection-pooling
    source: &a16
      title: HikariCP README
      url: https://github.com/brettwooldridge/HikariCP
      verifiedOn: 2026-10-20
  - id: hikaricp
    term: HikariCP
    definition: A fast JDBC connection pool; Spring Boot picks it first when it is on the classpath.
    see: connection-pooling
    source:
      title: "SQL Databases: supported connection pools (Spring Boot reference)"
      url: https://docs.spring.io/spring-boot/reference/data/sql.html
      verifiedOn: 2026-10-20
  - id: pgbouncer
    term: PgBouncer
    definition: A lightweight connection pooler that sits between apps and PostgreSQL.
    see: connection-pooling
    source:
      title: PgBouncer features
      url: https://www.pgbouncer.org/features.html
      verifiedOn: 2026-10-20
  - id: connection-leak
    term: Connection leak
    definition: A borrowed connection that is never closed, so it never returns to the pool.
    see: connection-pooling
    source: *a16
  - id: sql-injection-term
    term: SQL injection
    definition: An attack where input placed into SQL text changes what the query does.
    see: sql-injection
    source: &a17
      title: SQL Injection Prevention Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: prepared-statement
    term: Prepared statement
    aka:
      - parameterized query
      - parameterised query
    definition: SQL written once with placeholders such as ?; values are bound separately, so they stay data.
    see: sql-injection
    source:
      title: PreparedStatement (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/PreparedStatement.html
      verifiedOn: 2026-10-20
  - id: least-privilege
    term: Least privilege
    definition: Give each database account only the rights it needs, never admin rights for the app.
    see: sql-injection
    source: *a17
  - id: allowlist
    term: Allowlist
    aka:
      - allow-list
    definition: A fixed list of accepted values, such as column names; anything else is rejected.
    see: sql-injection
    source: *a17
  - id: orm
    term: ORM
    aka:
      - object-relational mapping
    definition: "Object-relational mapping: a library that maps classes to tables and generates routine SQL."
    see: orm-jpa
    source: &a18
      title: Hibernate ORM 7.4 Introduction
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-20
  - id: jpa
    term: JPA
    aka:
      - Jakarta Persistence
      - Java Persistence API
    definition: "Jakarta Persistence: the Java standard API for ORM; providers such as Hibernate implement it."
    see: orm-jpa
    source: &a19
      title: Jakarta Persistence 3.2 specification
      url: https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html
      verifiedOn: 2026-10-20
  - id: hibernate
    term: Hibernate
    aka:
      - Hibernate ORM
    definition: A popular Java ORM that fully implements JPA and adds its own features.
    see: orm-jpa
    source: *a18
  - id: jdbc
    term: JDBC
    definition: Java's low-level API, in java.sql, for sending SQL to a database and reading results.
    see: orm-jpa
    source:
      title: java.sql package summary (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/package-summary.html
      verifiedOn: 2026-10-20
  - id: jpa-entity
    term: Entity (JPA)
    aka:
      - JPA entity
    definition: A persistent class marked @Entity; each object stands for one row of a table.
    see: orm-jpa
    source: *a19
  - id: persistence-context
    term: Persistence context
    definition: The managed entities of one EntityManager, one object per row, written to the database at commit.
    see: orm-jpa
    source: *a19
  - id: lazy-loading
    term: Lazy loading
    aka:
      - lazy fetching
      - FetchType.LAZY
    definition: Loading an association only when it is first accessed; a hint in JPA.
    see: n-plus-one
    source: *a19
  - id: eager-loading
    term: Eager loading
    aka:
      - eager fetching
      - FetchType.EAGER
    definition: Loading an association together with its owner every time; a requirement in JPA.
    see: orm-jpa
    source: *a19
  - id: jpql
    term: JPQL
    aka:
      - Jakarta Persistence query language
    definition: "The JPA query language: SQL-like queries over entities and fields, not tables."
    see: orm-jpa
    source: *a19
  - id: n-plus-one-term
    term: N+1 query problem
    aka:
      - N+1 problem
      - N+1 selects
    definition: One query for N rows, then one extra query per row for related data.
    see: n-plus-one
    source: *a18
  - id: join-fetch
    term: JOIN FETCH
    aka:
      - fetch join
    definition: A JPQL join that loads an association in the same query as its owner.
    see: n-plus-one
    source: *a19
  - id: entity-graph
    term: Entity graph
    definition: A JPA fetch plan naming which associations a find or query should load.
    see: n-plus-one
    source: *a19
  - id: batch-fetching
    term: Batch fetching
    definition: Hibernate loads lazy associations for many owners at once, using a batch of keys.
    see: n-plus-one
    source: *a18
  - id: dto-projection
    term: DTO projection
    definition: A query that returns only selected fields into a plain class instead of full entities.
    see: n-plus-one
    source:
      title: Projections (Spring Data JPA reference)
      url: https://docs.spring.io/spring-data/jpa/reference/repositories/projections.html
      verifiedOn: 2026-10-20
  - id: cache-aside
    term: Cache-aside
    definition: The app reads the cache, loads from the database on a miss, and invalidates the key on write.
    see: caching-redis
    source:
      title: Cache-Aside pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
      verifiedOn: 2026-10-20
  - id: ttl
    term: TTL
    aka:
      - time to live
    definition: A timeout on a cached key; when it ends, Redis deletes the key.
    see: caching-redis
    source:
      title: EXPIRE (Redis command reference)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: redis
    term: Redis
    definition: An in-memory data store used as a database, cache or message broker.
    see: caching-redis
    source:
      title: Redis quick starts (Redis docs)
      url: https://redis.io/docs/latest/develop/get-started/
      verifiedOn: 2026-10-20
  - id: upsert-term
    term: Upsert
    definition: Insert a row, or update it if its key already exists, in one atomic statement.
    see: upsert
    source: &a20
      title: "INSERT: ON CONFLICT (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/18/sql-insert.html
      verifiedOn: 2026-10-20
  - id: on-conflict
    term: ON CONFLICT
    definition: "PostgreSQL INSERT clause: on a unique-key clash, DO NOTHING or DO UPDATE instead of an error."
    see: upsert
    source: *a20
  - id: on-duplicate-key-update
    term: ON DUPLICATE KEY UPDATE
    definition: MySQL INSERT clause that updates the existing row when a unique or primary key would clash.
    see: upsert
    source:
      title: INSERT ... ON DUPLICATE KEY UPDATE (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/insert-on-duplicate.html
      verifiedOn: 2026-10-20
  - id: returning-clause
    term: RETURNING (SQL)
    aka:
      - RETURNING clause
    definition: PostgreSQL clause on INSERT, UPDATE, DELETE and MERGE that returns values from the changed rows.
    see: upsert
    source:
      title: Returning Data from Modified Rows (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/dml-returning.html
      verifiedOn: 2026-10-20
  - id: merge-sql
    term: MERGE (SQL)
    aka:
      - MERGE statement
    definition: One statement that inserts, updates or deletes target rows based on a source; PostgreSQL 15+.
    see: upsert
    source:
      title: MERGE (PostgreSQL 18 docs)
      url: https://www.postgresql.org/docs/18/sql-merge.html
      verifiedOn: 2026-10-20
  - id: idempotent-write
    term: Idempotent write
    definition: A write whose effect is the same whether it runs once or many times, so retries are safe.
    see: upsert
    source:
      title: RFC 9110 HTTP Semantics, 9.2.2 Idempotent Methods
      url: https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods
      verifiedOn: 2026-10-20
  - id: database-replication
    term: Replication (database)
    aka:
      - database replication
    definition: Keeping copies of the same data on several database servers by applying one server's changes to the others.
    see: replication
    source: &a21
      title: Replication (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/replication.html
      verifiedOn: 2026-10-20
  - id: read-replica
    term: Read replica
    aka:
      - read replicas
    definition: A copy of the primary that serves read queries to take load off it.
    see: replication
    source: *a21
  - id: standby-server
    term: Standby server
    aka:
      - hot standby
      - warm standby
    definition: A replica ready to become the primary; a hot standby also serves read-only queries.
    see: replication
    source: &a22
      title: Log-Shipping Standby Servers (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/warm-standby.html
      verifiedOn: 2026-10-20
  - id: replication-lag
    term: Replication lag
    definition: How far a replica is behind the primary; reads from it can return older data.
    see: replication
    source: *a22
  - id: synchronous-replication
    term: Synchronous replication
    definition: Commit waits until a standby confirms it has stored the change.
    see: replication
    source: *a22
  - id: asynchronous-replication
    term: Asynchronous replication
    definition: Commit returns without waiting for replicas; a primary crash can lose the latest commits.
    see: replication
    source: *a22
  - id: gtid
    term: GTID
    aka:
      - global transaction identifier
      - GTIDs
    definition: "MySQL: an id given to each committed transaction, unique across the whole replication setup."
    see: replication
    source:
      title: GTID Format and Storage (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/replication-gtids-concepts.html
      verifiedOn: 2026-10-20
  - id: read-your-writes
    term: Read-your-writes consistency
    aka:
      - read-your-writes
      - read your own writes
    definition: After you write a value, your own later reads never return an older one.
    see: replication
    source: &a26
      title: Eventually Consistent (Werner Vogels)
      url: https://www.allthingsdistributed.com/2008/12/eventually_consistent.html
      verifiedOn: 2026-10-20
  - id: failover
    term: Failover
    definition: Making a standby the new primary when the primary fails.
    see: backup-recovery
    source:
      title: Failover (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/warm-standby-failover.html
      verifiedOn: 2026-10-20
  - id: high-availability
    term: High availability
    definition: Keeping the database serving with little downtime, usually by failing over to a standby.
    see: backup-recovery
    source: *a22
  - id: partitioning-term
    term: Partitioning (table)
    aka:
      - table partitioning
      - declarative partitioning
    definition: Splitting one logical table into smaller physical pieces inside one database.
    see: partitioning
    source: &a23
      title: Table Partitioning (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/ddl-partitioning.html
      verifiedOn: 2026-10-20
  - id: partition-pruning
    term: Partition pruning
    definition: The planner leaves out partitions that cannot hold rows matching the WHERE clause.
    see: partitioning
    source: *a23
  - id: sharding-term
    term: Sharding (database)
    aka:
      - database sharding
    definition: Splitting rows across separate database servers, each holding a different slice with the same schema.
    see: sharding
    source: &a24
      title: Sharding pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding
      verifiedOn: 2026-10-20
  - id: shard-key
    term: Shard key
    definition: The column or columns that decide which shard stores a row.
    see: sharding
    source: *a24
  - id: resharding
    term: Resharding
    aka:
      - rebalancing shards
      - shard rebalancing
    definition: Moving data between shards to add shards or even out load; slow and often disruptive.
    see: sharding
    source: *a24
  - id: consistent-hashing
    term: Consistent hashing
    definition: A hashing scheme where adding or removing a node moves only a small share of keys.
    see: sharding
    source: *a24
  - id: cap-theorem-term
    term: CAP theorem
    definition: A distributed system cannot guarantee both consistency and availability while a network partition lasts.
    see: cap-theorem
    source: &a25
      title: Brewer's Conjecture and the Feasibility of Consistent, Available, Partition-Tolerant Web Services (Gilbert and Lynch, 2002)
      url: https://groups.csail.mit.edu/tds/papers/Gilbert/Brewer6.pdf
      verifiedOn: 2026-10-20
  - id: linearizability
    term: Linearizability
    aka:
      - linearizable
    definition: Every operation looks as if it ran at one instant on a single copy; the C in CAP.
    see: cap-theorem
    source: *a25
  - id: eventual-consistency
    term: Eventual consistency
    definition: If no new updates arrive, all copies in time return the last written value.
    see: cap-theorem
    source: *a26
  - id: pacelc
    term: PACELC
    definition: If Partition, choose Availability or Consistency; Else, choose Latency or Consistency.
    see: cap-theorem
    source:
      title: Consistency Tradeoffs in Modern Distributed Database System Design (Daniel Abadi, IEEE Computer 2012)
      url: https://www.cs.umd.edu/~abadi/papers/abadi-pacelc.pdf
      verifiedOn: 2026-10-20
  - id: two-phase-commit
    term: Two-phase commit
    aka:
      - 2PC
    definition: A protocol where all participants first prepare, then all commit or all roll back on the coordinator's word.
    see: distributed-transactions
    source:
      title: XA Transactions (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/xa.html
      verifiedOn: 2026-10-20
  - id: saga
    term: Saga
    aka:
      - saga pattern
    definition: A sequence of local transactions; if one fails, compensating transactions undo the earlier ones.
    see: distributed-transactions
    source: &a27
      title: "Pattern: Saga (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/data/saga.html
      verifiedOn: 2026-10-20
  - id: compensating-transaction
    term: Compensating transaction
    aka:
      - compensating action
    definition: A step that undoes the effect of an earlier committed step in a saga.
    see: distributed-transactions
    source: *a27
  - id: transactional-outbox
    term: Transactional outbox
    aka:
      - outbox pattern
      - outbox table
    definition: Saving outgoing events in a table in the same transaction as the data, then publishing them from there.
    see: distributed-transactions
    source:
      title: "Pattern: Transactional outbox (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/data/transactional-outbox.html
      verifiedOn: 2026-10-20
  - id: logical-backup
    term: Logical backup
    definition: A backup as SQL statements or text that recreate the schema and rows.
    see: backup-recovery
    source: &a28
      title: Backup and Recovery Types (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/backup-types.html
      verifiedOn: 2026-10-20
  - id: physical-backup
    term: Physical backup
    definition: A raw copy of the database's data directories and files.
    see: backup-recovery
    source: *a28
  - id: point-in-time-recovery
    term: Point-in-time recovery
    aka:
      - PITR
    definition: Restoring a base backup, then replaying the log up to a chosen moment.
    see: backup-recovery
    source:
      title: Continuous Archiving and Point-in-Time Recovery (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/continuous-archiving.html
      verifiedOn: 2026-10-20
  - id: rpo
    term: RPO
    aka:
      - recovery point objective
    definition: The most data loss allowed, measured as time since the last recovery point.
    see: backup-recovery
    source: &a29
      title: Disaster recovery (DR) objectives (AWS Well-Architected, Reliability Pillar)
      url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html
      verifiedOn: 2026-10-20
  - id: rto
    term: RTO
    aka:
      - recovery time objective
    definition: The longest allowed time from an outage until service is restored.
    see: backup-recovery
    source: *a29
  - id: vertical-scaling
    term: Vertical scaling
    aka:
      - scale up
      - scaling up
    definition: Giving one server more CPU, memory or disk.
    see: scaling-ladder
    source: &a30
      title: Horizontal, vertical, and functional data partitioning (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/data-partitioning
      verifiedOn: 2026-10-20
  - id: horizontal-scaling
    term: Horizontal scaling
    aka:
      - scale out
      - scaling out
    definition: Adding more servers and spreading the data or load across them.
    see: scaling-ladder
    source: *a30
  - id: anti-join
    term: Anti-join
    aka:
      - antijoin
      - anti join
    definition: A query that keeps only the rows with no match in another table, such as NOT EXISTS.
    see: anti-join-pattern
    source:
      title: 10.2.2.1 Semijoin and Antijoin Transformations (MySQL 9.7)
      url: https://dev.mysql.com/doc/refman/9.7/en/semijoins-antijoins.html
      verifiedOn: 2026-10-20
  - id: semi-join
    term: Semi-join
    aka:
      - semijoin
      - semi join
    definition: A query that keeps rows having at least one match, each returned once, such as EXISTS or IN.
    see: anti-join-pattern
    source:
      title: 10.2.2.1 Semijoin and Antijoin Transformations (MySQL 9.7)
      url: https://dev.mysql.com/doc/refman/9.7/en/semijoins-antijoins.html
      verifiedOn: 2026-10-20
  - id: gaps-and-islands
    term: Gaps and islands
    aka:
      - gaps-and-islands
      - islands problem
    definition: Finding unbroken runs of consecutive values (islands) and the missing values between them (gaps).
    see: running-totals-and-streaks
    source:
      title: Gaps and Islands in SQL Server Data (Dwain Camps, Simple Talk)
      url: https://www.red-gate.com/simple-talk/databases/sql-server/t-sql-programming-sql-server/gaps-islands-sql-server-data/
      verifiedOn: 2026-10-20
  - id: running-total
    term: Running total
    aka:
      - cumulative sum
      - running sum
    definition: "A sum that grows row by row: each row shows the total of all rows up to it."
    see: running-totals-and-streaks
    source:
      title: 3.5 Window Functions tutorial (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/tutorial-window.html
      verifiedOn: 2026-10-20
  - id: moving-average
    term: Moving average
    aka:
      - rolling average
    definition: The average over a sliding window frame, such as the current row and the two before it.
    see: running-totals-and-streaks
    source:
      title: "4.2.8 Window Function Calls: frame options (PostgreSQL 18)"
      url: https://www.postgresql.org/docs/18/sql-expressions.html
      verifiedOn: 2026-10-20
  - id: conditional-aggregation
    term: Conditional aggregation
    definition: An aggregate that counts or sums only the rows meeting a condition, using CASE or FILTER.
    see: group-aggregation-patterns
    source:
      title: 4.2.7 Aggregate Expressions (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/sql-expressions.html
      verifiedOn: 2026-10-20
  - id: pivot-term
    term: Pivot
    aka:
      - pivot query
      - rows to columns
    definition: Turning row values into columns, such as one count column per order status.
    see: group-aggregation-patterns
    source:
      title: "PostgreSQL 18 docs: F.43 tablefunc (crosstab pivot displays)"
      url: https://www.postgresql.org/docs/18/tablefunc.html
      verifiedOn: 2026-10-20
  - id: filter-clause
    term: FILTER clause
    definition: "PostgreSQL: COUNT(*) FILTER (WHERE …) feeds the aggregate only the rows where the condition is true."
    see: group-aggregation-patterns
    source:
      title: 4.2.7 Aggregate Expressions (PostgreSQL 18)
      url: https://www.postgresql.org/docs/18/sql-expressions.html
      verifiedOn: 2026-10-20
  - id: distinct-on
    term: DISTINCT ON
    definition: "PostgreSQL: keeps the first row of each set of equal values, in ORDER BY order."
    see: top-n-per-group
    source:
      title: "SELECT: DISTINCT clause (PostgreSQL 18)"
      url: https://www.postgresql.org/docs/18/sql-select.html
      verifiedOn: 2026-10-20
  - id: top-n-query
    term: Top-N query
    aka:
      - top N per group
      - top-N per group
    definition: A query that returns the first N rows by some order, overall or within each group.
    see: top-n-per-group
    source:
      title: "SELECT: LIMIT clause (PostgreSQL 18)"
      url: https://www.postgresql.org/docs/18/sql-select.html
      verifiedOn: 2026-10-20
  - id: output-grain
    term: Output grain
    aka:
      - grain of the result
    definition: What one result row stands for, such as one row per user per day.
    see: sql-problem-approach
    source:
      title: Grain (Kimball Group)
      url: https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/grain/
      verifiedOn: 2026-10-20
  - id: tie-breaker
    term: Tie-breaker
    aka:
      - tiebreaker
    definition: An extra unique column in ORDER BY, such as id, so equal values always sort the same way.
    see: top-n-per-group
    source:
      title: "SELECT: LIMIT and a unique ORDER BY (PostgreSQL 18)"
      url: https://www.postgresql.org/docs/18/sql-select.html
      verifiedOn: 2026-10-20
  - id: with-ties
    term: WITH TIES
    aka:
      - FETCH FIRST … WITH TIES
    definition: "PostgreSQL: FETCH FIRST n ROWS WITH TIES also returns rows tied with the last one."
    see: top-n-per-group
    source:
      title: "SELECT: LIMIT clause, WITH TIES (PostgreSQL 18)"
      url: https://www.postgresql.org/docs/18/sql-select.html
