id: where-vs-having
tech: sql
title: "WHERE vs HAVING"
compares: [where-clause, having-clause]
gist:
  - "Filters rows, before grouping"
  - "Filters groups, after grouping"
explain:
  - "WHERE is a row filter. It tests each row before any grouping, so it can use plain columns such as status, but not aggregates such as SUM."
  - "HAVING is a group filter. It runs after GROUP BY has formed the groups and computed their aggregates, so it can test values such as SUM(amount) or COUNT(*)."
example: "Customers who paid more than 1000 in total: WHERE status = 'PAID' removes failed and pending payments first, then GROUP BY customer_id forms the groups, then HAVING SUM(amount) > 1000 keeps only customer 1, whose paid total is 1300."
rows:
  - { aspect: "Runs", a: "Before GROUP BY", b: "After GROUP BY" }
  - { aspect: "Aggregates like COUNT(*)", a: "Not allowed", b: "Allowed: the usual use" }
  - { aspect: "Without GROUP BY", a: "Normal row filter", b: "Treats the whole result as one group" }
  - { aspect: "Speed", a: "Cuts rows early, so less to group", b: "Put only aggregate conditions here" }
verdict: "Filter plain columns in WHERE; keep HAVING for conditions on aggregates."
sayIt: "WHERE filters rows before grouping, so it cannot use aggregates. HAVING filters groups after GROUP BY, so it can test COUNT or SUM. I put plain column conditions in WHERE, because removing rows early leaves less to group."
sources:
