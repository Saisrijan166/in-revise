id: two-phase-commit-vs-saga
tech: sql
title: Two-Phase Commit vs Saga
compares: [two-phase-commit, saga]
gist:
  - "All databases commit together, or none do"
  - "Each step commits; failures are undone later"
rows:
  - { aspect: "All or nothing", a: "Yes, one atomic commit", b: "No; compensating steps undo finished ones" }
  - { aspect: "Isolation", a: "Locks held until the final decision", b: "None: others can see half-done work" }
  - { aspect: "Coordinator fails", a: "Prepared participants wait, holding locks", b: "Committed steps stay; the saga goes on or compensates" }
  - { aspect: "Needs", a: "Every resource supports 2PC (XA)", b: "Only local transactions and messages" }
  - { aspect: "Fits", a: "A few databases in one system", b: "Microservices, each with its own database" }
verdict: "Use a saga across services; use 2PC only when every participant supports it and brief blocking is acceptable."
sources:
  - title: "PREPARE TRANSACTION (PostgreSQL 18)"
    url: "https://www.postgresql.org/docs/18/sql-prepare-transaction.html"
    verifiedOn: "2026-10-20"
  - title: "XA Transactions (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/xa.html"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Saga (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/data/saga.html"
    verifiedOn: "2026-10-20"
