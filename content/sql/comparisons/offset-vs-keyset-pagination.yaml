id: offset-vs-keyset-pagination
tech: sql
title: OFFSET vs Keyset Pagination
compares: [offset-pagination, keyset-pagination]
gist:
  - "Skip N rows: reads them, then drops them"
  - "Seek past the last row seen"
explain:
  - "OFFSET pagination skips a number of rows and returns the next page: LIMIT 20 OFFSET 40 is page 3. It is simple and can jump to any page number."
  - "Keyset pagination remembers the sort values of the last row shown and asks for the rows after it. It needs a unique sort order and a matching index, and makes every page equally fast."
example: "A payments feed, 20 per page. Page 5,000 with OFFSET 99980 makes the database produce 100,000 rows and drop all but 20. With keyset, WHERE (created_at, id) < (last values) seeks straight to the right spot and reads 20 rows."
rows:
  - { aspect: "Query", a: "ORDER BY id LIMIT 20 OFFSET 40", b: "WHERE id > last_id ORDER BY id LIMIT 20" }
  - { aspect: "Deep page cost", a: "Grows with the page number", b: "Same for every page" }
  - { aspect: "Rows added between pages", a: "Rows repeat or are missed", b: "Stable" }
  - { aspect: "Jump to page N", a: "Yes", b: "No: next (or previous) only" }
  - { aspect: "Needs", a: "ORDER BY on a unique order", b: "A unique tie-breaker and a matching index" }
verdict: "Use keyset for feeds, APIs and big tables; OFFSET only when users need page numbers and offsets stay small."
sayIt: "OFFSET reads and discards every skipped row, so deep pages get slow and new rows shift the pages. Keyset asks for rows after the last one seen, using a unique tie-breaker and an index, so every page costs the same; the trade-off is no jumping to page N."
sources:
  - title: "LIMIT and OFFSET (PostgreSQL 18 docs, 7.6)"
    url: "https://www.postgresql.org/docs/18/queries-limit.html"
    verifiedOn: "2026-10-20"
