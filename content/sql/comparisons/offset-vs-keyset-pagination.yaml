id: offset-vs-keyset-pagination
tech: sql
title: OFFSET vs Keyset Pagination
compares: [offset-pagination, keyset-pagination]
gist:
  - "Skip N rows: reads them, then drops them"
  - "Seek past the last row seen"
rows:
  - { aspect: "Query", a: "ORDER BY id LIMIT 20 OFFSET 40", b: "WHERE id > last_id ORDER BY id LIMIT 20" }
  - { aspect: "Deep page cost", a: "Grows with the page number", b: "Same for every page" }
  - { aspect: "Rows added between pages", a: "Rows repeat or are missed", b: "Stable" }
  - { aspect: "Jump to page N", a: "Yes", b: "No: next (or previous) only" }
  - { aspect: "Needs", a: "ORDER BY on a unique order", b: "A unique tie-breaker and a matching index" }
verdict: "Use keyset for feeds, APIs and big tables; OFFSET only when users need page numbers and offsets stay small."
sources:
  - title: "LIMIT and OFFSET (PostgreSQL 18 docs, 7.6)"
    url: "https://www.postgresql.org/docs/18/queries-limit.html"
    verifiedOn: "2026-10-20"
  - title: "We need tool support for keyset pagination (Markus Winand, use-the-index-luke.com)"
    url: "https://use-the-index-luke.com/no-offset"
    verifiedOn: "2026-10-20"
  - title: "Paging Through Results: the seek method (Markus Winand, use-the-index-luke.com)"
    url: "https://use-the-index-luke.com/sql/partial-results/fetch-next-page"
    verifiedOn: "2026-10-20"
