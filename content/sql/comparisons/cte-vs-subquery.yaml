id: cte-vs-subquery
tech: sql
title: "CTE vs Subquery"
compares: [ctes, subqueries]
gist:
  - "A named query, written first, read like a table"
  - "A query nested inside the expression that uses it"
explain:
  - "A CTE is a subquery given a name with WITH before the main query. It turns a long query into named steps read top to bottom, and WITH RECURSIVE lets it walk trees."
  - "A subquery is a SELECT in brackets inside another query, in WHERE, FROM or SELECT. It supplies a value, a list or a table right where it is used."
example: "Customers whose paid total is above 600: FROM (SELECT customer_id, SUM(amount) AS total ... GROUP BY customer_id) AS t WHERE t.total > 600 works, but the same step as WITH paid AS (...) SELECT ... FROM paid reads in order. To walk every report under a manager you need WITH RECURSIVE; a subquery cannot do that."
rows:
  - { aspect: "Reads", a: "Top to bottom, one named step at a time", b: "Inside-out when nested deeply" }
  - { aspect: "Used twice in one query", a: "Name it once; PostgreSQL computes it once", b: "Write the same text twice" }
  - { aspect: "Recursion", a: "Yes, with WITH RECURSIVE", b: "Not possible" }
  - { aspect: "Speed", a: "Not faster by rule; PostgreSQL 12+ inlines a single-use CTE", b: "Not slower by rule; often the same plan" }
verdict: "Choose by readability; reach for a CTE when a step is reused or recursion is needed."
sayIt: "A CTE is a named subquery written with WITH, so a long query reads as steps and a step can be reused; it can also be recursive. A subquery sits inside the expression that uses it. Neither is faster by rule, since PostgreSQL 12+ inlines a single-use CTE."
sources:
  - title: "WITH Queries (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/queries-with.html"
    verifiedOn: "2026-10-21"
  - title: "PostgreSQL 12 Release Notes: CTE inlining"
    url: "https://www.postgresql.org/docs/release/12.0/"
    verifiedOn: "2026-10-20"
