id: partitioning-vs-sharding
tech: sql
title: Partitioning vs Sharding
compares: [partitioning, sharding]
gist:
  - "Split one table inside one server"
  - "Split the rows across many servers"
explain:
  - "Partitioning splits one large table into smaller tables inside one database server, by a key such as the month. It solves slow scans and slow cleanup of a huge table."
  - "Sharding splits a table's rows across separate database servers by a shard key, such as customer_id. It solves a load or data size that one server cannot carry."
example: "Payments grow by 10 million rows a month but the server has spare capacity: partition by month, so October queries read one partition and old months are dropped. Inserts alone saturate the biggest server you can buy: shard by customer_id, so each server takes a quarter of the writes."
rows:
  - { aspect: "Pieces live on", a: "One database server", b: "Separate database servers" }
  - { aspect: "Routing done by", a: "The database itself", b: "The app, a proxy, or a tool like Vitess or Citus" }
  - { aspect: "Helps with", a: "Huge tables: pruned scans, fast removal of old data", b: "Writes and data beyond one server" }
  - { aspect: "Joins and transactions", a: "Work as on one table", b: "Across shards: slow and complex" }
  - { aspect: "Running cost", a: "Low", b: "High: rebalancing, a backup per shard" }
verdict: "Partition a huge table first; shard only when one server cannot carry the writes or data."
sayIt: "Partitioning splits a big table inside one server, so queries prune partitions and old data is dropped fast; joins and transactions work as usual. Sharding spreads rows over many servers to scale writes and storage, at the cost of routing and hard cross-shard queries."
sources:
  - title: "Table Partitioning (PostgreSQL 18)"
    url: "https://www.postgresql.org/docs/18/ddl-partitioning.html"
    verifiedOn: "2026-10-20"
  - title: "Sharding pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding"
    verifiedOn: "2026-10-20"
