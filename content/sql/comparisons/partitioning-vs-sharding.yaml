id: partitioning-vs-sharding
tech: sql
title: Partitioning vs Sharding
compares: [partitioning, sharding]
gist:
  - "Split one table inside one server"
  - "Split the rows across many servers"
rows:
  - { aspect: "Pieces live on", a: "One database server", b: "Separate database servers" }
  - { aspect: "Routing done by", a: "The database itself", b: "The app, a proxy, or a tool like Vitess or Citus" }
  - { aspect: "Helps with", a: "Huge tables: pruned scans, fast removal of old data", b: "Writes and data beyond one server" }
  - { aspect: "Joins and transactions", a: "Work as on one table", b: "Across shards: slow and complex" }
  - { aspect: "Running cost", a: "Low", b: "High: rebalancing, a backup per shard" }
verdict: "Partition a huge table first; shard only when one server cannot carry the writes or data."
sources:
  - title: "Table Partitioning (PostgreSQL 18)"
    url: "https://www.postgresql.org/docs/18/ddl-partitioning.html"
    verifiedOn: "2026-10-20"
  - title: "Sharding pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding"
    verifiedOn: "2026-10-20"
