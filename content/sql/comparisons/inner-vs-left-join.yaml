id: inner-vs-left-join
tech: sql
title: "INNER JOIN vs LEFT JOIN"
compares: [inner-join, left-join]
gist:
  - "Only rows that match on both sides"
  - "Every left row; NULLs where nothing matched"
diagrams:
  - |
    flowchart LR
      U1[Asha] --> O1[payment 101]
      U2[Arjun] -. no match .-> N[row dropped]
  - |
    flowchart LR
      U1[Asha] --> O1[payment 101]
      U2[Arjun] --> N[NULL payment columns]
diagramAlt: "INNER JOIN: Asha with payment 101 is returned; Arjun has no payment, so his row is dropped. LEFT JOIN: Asha with payment 101 is returned, and Arjun is also returned with NULL in the payment columns."
explain:
  - "INNER JOIN returns one row for each pair of rows that meets the ON condition. A row with no partner in the other table is left out of the result."
  - "LEFT JOIN returns everything INNER JOIN returns, plus each left-table row that found no partner, once, with NULL in the right table's columns."
example: "customers JOIN payments returns Asha, Ravi and Meena with their payments; Arjun, who has never paid, is missing. customers LEFT JOIN payments returns the same rows plus Arjun once, with NULL payment columns, which is what a 'customers and their payments' screen needs."
rows:
  - { aspect: "Customer with no payments", a: "Not in the result", b: "Once, payment columns NULL" }
  - { aspect: "Customer with 3 payments", a: "3 rows", b: "3 rows" }
  - { aspect: "Right-table filter in WHERE", a: "Same result as in ON", b: "Drops the NULL rows: acts as an inner join" }
  - { aspect: "Typical use", a: "Payments with their customer", b: "All customers, with payments if any; find missing matches" }
verdict: "Use INNER when a match is required; LEFT when every left row must appear."
sayIt: "INNER JOIN keeps only rows that match on both sides. LEFT JOIN also keeps unmatched left rows, with NULLs for the right side. With a LEFT JOIN I keep right-table filters in ON, because in WHERE they drop the NULL rows and make it an inner join."
sources:
  - title: "Joined Tables (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/queries-table-expressions.html"
    verifiedOn: "2026-10-20"
