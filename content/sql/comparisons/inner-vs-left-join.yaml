id: inner-vs-left-join
tech: sql
title: "INNER JOIN vs LEFT JOIN"
compares: [inner-join, left-join]
gist:
  - "Only rows that match on both sides"
  - "Every left row; NULLs where nothing matched"
diagrams:
  - |
    flowchart LR
      U1[Asha] --> O1[order 7]
      U2[Ravi] -. no match .-> N[row dropped]
  - |
    flowchart LR
      U1[Asha] --> O1[order 7]
      U2[Ravi] --> N[NULL order columns]
diagramAlt: "INNER JOIN: Asha with order 7 is returned; Ravi has no order, so his row is dropped. LEFT JOIN: Asha with order 7 is returned, and Ravi is also returned with NULL in the order columns."
rows:
  - { aspect: "User with no orders", a: "Not in the result", b: "Once, order columns NULL" }
  - { aspect: "User with 3 orders", a: "3 rows", b: "3 rows" }
  - { aspect: "Filter on right table in WHERE", a: "Same as in ON", b: "Turns it into an inner join" }
  - { aspect: "Typical use", a: "Orders with their user", b: "All users, with orders if any; find missing matches" }
verdict: "Use INNER when a match is required; LEFT when every left row must appear."
sources:
  - title: "Joined Tables (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/queries-table-expressions.html"
    verifiedOn: "2026-10-20"
