id: jdbc-vs-jpa-vs-hibernate
tech: sql
title: "JDBC vs JPA vs Hibernate"
compares: [jdbc-api, jakarta-persistence, hibernate-orm]
gist:
  - "Low-level API: you write SQL and map rows"
  - "Specification: annotations, EntityManager, JPQL"
  - "Library that implements JPA, plus extras"
explain:
  - "JDBC is Java's built-in API in java.sql for talking to a database: you write each SQL statement, bind its values and copy each result row into objects by hand."
  - "JPA (Jakarta Persistence) is a specification: annotations such as @Entity, the EntityManager interface and JPQL. It describes how object-to-table mapping must work, but has no engine of its own."
  - "Hibernate ORM is a library that implements JPA: it turns entity operations into SQL and runs them through JDBC, and adds extras such as batch fetching."
example: "Loading payment 101: with JDBC you write SELECT … FROM payments WHERE id = ? and copy the columns into a Payment yourself. With JPA you call entityManager.find(Payment.class, 101L), and Hibernate, as the provider, writes that SELECT and runs it through JDBC."
rows:
  - { aspect: "What it is", a: "Java API in java.sql", b: "Standard (Jakarta Persistence 3.2)", c: "ORM library (7.4 is the latest stable)" }
  - { aspect: "You write", a: "SQL, and map each ResultSet by hand", b: "Entities, annotations and JPQL", c: "The same, plus HQL, @BatchSize and more" }
  - { aspect: "Runs SQL through", a: "The JDBC driver", b: "A provider such as Hibernate", c: "JDBC underneath" }
  - { aspect: "Package", a: "java.sql", b: "jakarta.persistence", c: "org.hibernate" }
  - { aspect: "Best for", a: "Full control, bulk jobs, small tools", b: "Portable code across providers", c: "Features the spec lacks" }
verdict: "Code to JPA, often through Spring Data JPA, with Hibernate as the provider; drop to JDBC or native SQL for bulk and reporting work."
sayIt: "JDBC is the low-level API where I write SQL and map rows myself. JPA is the standard for object-relational mapping, and Hibernate is the implementation that generates the SQL and runs it through JDBC. I code to JPA, often via Spring Data, and drop to SQL for bulk or reporting work."
