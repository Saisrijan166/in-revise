id: jdbc-vs-jpa-vs-hibernate
tech: sql
title: "JDBC vs JPA vs Hibernate"
compares: [jdbc-api, jakarta-persistence, hibernate-orm]
gist:
  - "Low-level API: you write SQL and map rows"
  - "Specification: annotations, EntityManager, JPQL"
  - "Library that implements JPA, plus extras"
rows:
  - { aspect: "What it is", a: "Java API in java.sql", b: "Standard (Jakarta Persistence 3.2)", c: "ORM library (7.4 is the latest stable)" }
  - { aspect: "You write", a: "SQL, and map each ResultSet by hand", b: "Entities, annotations and JPQL", c: "The same, plus HQL, @BatchSize and more" }
  - { aspect: "Runs SQL through", a: "The JDBC driver", b: "A provider such as Hibernate", c: "JDBC underneath" }
  - { aspect: "Package", a: "java.sql", b: "jakarta.persistence", c: "org.hibernate" }
  - { aspect: "Best for", a: "Full control, bulk jobs, small tools", b: "Portable code across providers", c: "Features the spec lacks" }
verdict: "Code to JPA, often through Spring Data JPA, with Hibernate as the provider; drop to JDBC or native SQL for bulk and reporting work."
