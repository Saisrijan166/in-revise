id: database-vs-cache
tech: sql
title: "Database vs Cache"
compares: [relational-databases, redis]
gist:
  - "The source of truth, kept safe on disk"
  - "A fast copy in memory; may be stale or lost"
rows:
  - { aspect: "Role", a: "Source of truth", b: "Copy of hot data" }
  - { aspect: "Kept in", a: "Disk, with a write-ahead log", b: "Memory (RAM), optional disk persistence" }
  - { aspect: "After a crash", a: "Committed data is recovered from the log", b: "Recent writes may be lost; refill from the DB" }
  - { aspect: "Queries", a: "SQL: joins, constraints, transactions", b: "Lookups by key, plus data structures" }
  - { aspect: "Freshness", a: "Always current", b: "Stale until the key is deleted or its TTL ends" }
verdict: "Keep the truth in the database; put a cache in front only for hot, read-heavy data that may be briefly stale."
sources:
  - title: "Write-Ahead Logging (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/wal-intro.html"
    verifiedOn: "2026-10-20"
  - title: "Redis persistence (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"
    verifiedOn: "2026-10-20"
  - title: "Cache-Aside pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside"
    verifiedOn: "2026-10-20"
