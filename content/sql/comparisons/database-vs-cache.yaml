id: database-vs-cache
tech: sql
title: "Database vs Cache"
compares: [relational-databases, redis]
gist:
  - "The source of truth, kept safe on disk"
  - "A fast copy in memory; may be stale or lost"
explain:
  - "A relational database is the source of truth: it stores data durably on disk, protected by a write-ahead log, and checks it with constraints and transactions."
  - "Redis, used as a cache, keeps copies of often-read data in memory so repeated reads skip the database. A copy can be stale, and recent writes can be lost in a crash."
example: "The payment service shows a customer's name on every page. The name lives in the customers table; Redis keeps customer:1:name for 300 seconds. When the customer is renamed, the app updates the table and deletes the key, and the next read refills it."
rows:
  - { aspect: "Role", a: "Source of truth", b: "Copy of hot data" }
  - { aspect: "Kept in", a: "Disk, with a write-ahead log", b: "Memory (RAM), optional disk persistence" }
  - { aspect: "After a crash", a: "Committed data is recovered from the log", b: "Recent writes may be lost; refill from the DB" }
  - { aspect: "Queries", a: "SQL: joins, constraints, transactions", b: "Lookups by key, plus data structures" }
  - { aspect: "Freshness", a: "Always current", b: "Stale until the key is deleted or its TTL ends" }
verdict: "Keep the truth in the database; put a cache in front only for hot, read-heavy data that may be briefly stale."
sayIt: "The database is the durable source of truth, with constraints and transactions. A cache like Redis keeps in-memory copies of hot data for fast reads; they may be stale or lost, so I read the cache first and update the database, then delete the key."
sources:
