id: group-by-vs-partition-by
tech: sql
title: "GROUP BY vs PARTITION BY"
compares: [aggregates-group-by, partition-by]
gist:
  - "One output row per group"
  - "Every row stays, with its group's value beside it"
diagrams:
  - |
    flowchart LR
      R1[Asha 100] --> G[dept 1: SUM 300]
      R2[Ravi 200] --> G
  - |
    flowchart LR
      R1[Asha 100] --> W1[Asha 100, dept SUM 300]
      R2[Ravi 200] --> W2[Ravi 200, dept SUM 300]
diagramAlt: "GROUP BY: Asha with 100 and Ravi with 200 in department 1 fold into one row, department 1 with a sum of 300. PARTITION BY: both rows stay, and each shows the department sum of 300 next to its own salary."
rows:
  - { aspect: "Rows out", a: "One per group", b: "Same as rows in" }
  - { aspect: "Other columns", a: "Only grouped or aggregated ones", b: "Any column of the row" }
  - { aspect: "Written as", a: "GROUP BY dept_id", b: "SUM(salary) OVER (PARTITION BY dept_id)" }
  - { aspect: "Filter result", a: "HAVING", b: "An outer query" }
verdict: "GROUP BY for totals per group; PARTITION BY when each row needs its group's numbers."
sources:
  - title: "Window Functions tutorial (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/tutorial-window.html"
    verifiedOn: "2026-10-20"
  - title: "GROUP BY and HAVING (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/queries-table-expressions.html"
    verifiedOn: "2026-10-20"
