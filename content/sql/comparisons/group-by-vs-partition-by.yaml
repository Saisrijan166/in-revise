id: group-by-vs-partition-by
tech: sql
title: "GROUP BY vs PARTITION BY"
compares: [aggregates-group-by, partition-by]
gist:
  - "One output row per group"
  - "Every row stays, with its group's value beside it"
explain:
  - "GROUP BY folds the rows of each group into one output row. You get one row per customer, with aggregates such as SUM(amount) for that customer."
  - "PARTITION BY is part of a window function. It splits rows into groups too, but keeps every row and adds the group's value, such as the customer's total, beside each one."
example: "Customer 1 has payments 101 (500) and 102 (800). GROUP BY customer_id returns one row: customer 1, total 1300. SUM(amount) OVER (PARTITION BY customer_id) returns two rows: 101 with 500 and 1300, and 102 with 800 and 1300, so each payment can show its share."
diagrams:
  - |
    flowchart LR
      R1[101: 500] --> G[customer 1: SUM 1300]
      R2[102: 800] --> G
  - |
    flowchart LR
      R1[101: 500] --> W1[101: 500, customer SUM 1300]
      R2[102: 800] --> W2[102: 800, customer SUM 1300]
diagramAlt: "GROUP BY: payments 101 with 500 and 102 with 800 of customer 1 fold into one row, customer 1 with a sum of 1300. PARTITION BY: both payment rows stay, and each shows the customer sum of 1300 next to its own amount."
rows:
  - { aspect: "Rows out", a: "One per group", b: "Same as rows in" }
  - { aspect: "Other columns", a: "Only grouped or aggregated ones", b: "Any column of the row" }
  - { aspect: "Written as", a: "GROUP BY customer_id", b: "SUM(amount) OVER (PARTITION BY customer_id)" }
  - { aspect: "Filter the result with", a: "HAVING", b: "An outer query around it" }
verdict: "GROUP BY for totals per group; PARTITION BY when each row needs its group's numbers."
sayIt: "GROUP BY collapses each group into one row, so I can only select grouped columns and aggregates. PARTITION BY in a window function keeps every row and adds the group's value beside it, for example each payment next to its customer's total."
sources:
