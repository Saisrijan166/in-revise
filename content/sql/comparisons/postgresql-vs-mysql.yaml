id: postgresql-vs-mysql
tech: sql
title: "PostgreSQL vs MySQL"
compares: [postgresql-18, mysql-9-7]
gist:
  - "Rich SQL and extensions; READ COMMITTED by default"
  - "InnoDB: rows in PK order; REPEATABLE READ by default"
rows:
  - { aspect: "Default isolation", a: "READ COMMITTED", b: "REPEATABLE READ (InnoDB)" }
  - { aspect: "Table storage", a: "Heap; every index is separate from it", b: "Clustered by PK; secondary indexes hold the PK" }
  - { aspect: "Generated ids", a: "GENERATED ... AS IDENTITY", b: "AUTO_INCREMENT" }
  - { aspect: "Upsert", a: "INSERT ... ON CONFLICT ... DO UPDATE", b: "INSERT ... ON DUPLICATE KEY UPDATE" }
  - { aspect: "DDL in a transaction", a: "CREATE or ALTER TABLE can be rolled back", b: "Causes an implicit commit" }
  - { aspect: "Only in PostgreSQL", a: "FULL OUTER JOIN, partial indexes, materialized views, JSONB, RETURNING", b: "None of these (materialized views only on HeatWave); JSON is binary" }
verdict: "Both suit typical OLTP apps: choose PostgreSQL for its extra SQL features and extensions, MySQL when the team already runs it, and state the defaults that differ."
sources:
