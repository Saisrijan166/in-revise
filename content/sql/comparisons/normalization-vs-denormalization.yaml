id: normalization-vs-denormalization
tech: sql
title: Normalisation vs Denormalisation
compares: [normalization, denormalization]
gist:
  - "Each fact stored once; join tables to read"
  - "Facts copied or precomputed so reads skip joins"
rows:
  - { aspect: "Goal", a: "Correct, consistent data", b: "Faster chosen reads" }
  - { aspect: "Reads", a: "May need several joins", b: "Fewer joins for the targeted query" }
  - { aspect: "Writes", a: "One place to update", b: "Every copy must be updated too" }
  - { aspect: "Main risk", a: "Slow join-heavy screens", b: "Copies drift out of sync" }
  - { aspect: "Typical home", a: "OLTP app tables", b: "Read-heavy pages, reports, star schemas" }
verdict: "Normalise first (to 3NF); denormalise one read at a time when measurements show it is needed."
sources:
  - title: "A Simple Guide to Five Normal Forms in Relational Database Theory (William Kent, CACM 1983)"
    url: "http://www.bkent.net/Doc/simple5.htm"
    verifiedOn: "2026-10-20"
  - title: "Database System Concepts, 7th ed., chapter 7 slides (Silberschatz, Korth, Sudarshan)"
    url: "https://www.db-book.com/slides-dir/PDF-dir/ch7.pdf"
    verifiedOn: "2026-10-20"
  - title: "Understand star schema (Microsoft Learn, Power BI guidance)"
    url: "https://learn.microsoft.com/en-us/power-bi/guidance/star-schema"
    verifiedOn: "2026-10-20"
