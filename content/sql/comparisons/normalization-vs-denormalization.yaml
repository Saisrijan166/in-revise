id: normalization-vs-denormalization
tech: sql
title: Normalisation vs Denormalisation
compares: [normalization, denormalization]
gist:
  - "Each fact stored once; join tables to read"
  - "Facts copied or precomputed so reads skip joins"
explain:
  - "Normalisation splits tables so each fact is stored once, in the table it describes. It keeps writes correct: one UPDATE changes the fact and no copy can disagree."
  - "Denormalisation copies or precomputes some data on purpose, such as a customer's name inside payments. It makes one chosen read faster by skipping a join or a sum."
example: "Payments list: normalised, it joins payments to customers to show each name, and a rename is one UPDATE. Denormalised, payments carries customer_name, the list reads one table, but a rename must also update every one of that customer's payment rows."
rows:
  - { aspect: "Goal", a: "Correct, consistent data", b: "Faster chosen reads" }
  - { aspect: "Reads", a: "May need several joins", b: "Fewer joins for the targeted query" }
  - { aspect: "Writes", a: "One place to update", b: "Every copy must be updated too" }
  - { aspect: "Main risk", a: "Slow join-heavy screens", b: "Copies drift out of sync" }
  - { aspect: "Typical home", a: "OLTP app tables", b: "Read-heavy pages, reports, star schemas" }
verdict: "Normalise first (to 3NF); denormalise one read at a time when measurements show it is needed."
sayIt: "Normalisation stores each fact once, so writes stay correct at the cost of joins on read. Denormalisation copies or precomputes data so a hot read is faster, at the cost of extra writes and copies that can drift. I normalise to 3NF first and denormalise only measured slow reads."
