id: sql-vs-nosql
tech: sql
title: "SQL vs NoSQL"
compares: [rdbms, nosql]
gist:
  - "Tables, schema in the database, joins, transactions"
  - "Data model per access pattern, schema in the app"
rows:
  - { aspect: "Data shape", a: "Tables with fixed, typed columns", b: "Documents, key-value pairs, wide rows or graphs" }
  - { aspect: "Schema", a: "Declared up front with CREATE TABLE", b: "Flexible; optional validation (MongoDB)" }
  - { aspect: "Related data", a: "Foreign keys and joins", b: "Embedded or duplicated in one record" }
  - { aspect: "Transactions", a: "Multi-row ACID is the norm", b: "Varies; MongoDB multi-document since 4.0" }
  - { aspect: "Scale-out", a: "Usually one primary writes; replicas serve reads", b: "Often built in: Cassandra partitions across nodes" }
verdict: "Related data that needs joins and transactions: SQL. One known access pattern at large scale or varied shapes: a NoSQL store."
sources:
