    url: "https://www.mongodb.com/docs/manual/data-modeling/"
    verifiedOn: "2026-10-20"
  - title: "MongoDB Manual: Transactions"
    url: "https://www.mongodb.com/docs/manual/core/transactions/"
    verifiedOn: "2026-10-20"
  - title: "PostgreSQL 18 docs: 26.4 Hot Standby"
    url: "https://www.postgresql.org/docs/18/hot-standby.html"
    verifiedOn: "2026-10-20"
