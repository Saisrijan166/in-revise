id: sql-vs-nosql
tech: sql
title: "SQL vs NoSQL"
compares: [rdbms, nosql]
gist:
  - "Tables, schema in the database, joins, transactions"
  - "Data model per access pattern, schema in the app"
explain:
  - "A SQL (relational) database stores data in tables with fixed, typed columns, keeps each fact in one place and joins tables per query. Transactions over many rows are normal."
  - "A NoSQL store keeps data in the shape the app reads: a document, a key-value pair, a wide row or a graph. One known read is fast and spreads across servers; related data is embedded or copied."
example: "Payments and refunds that must add up and feed ad-hoc reports go in PostgreSQL tables. A user's session, read by session id thousands of times a second, goes in Redis as a key-value pair."
rows:
  - { aspect: "Data shape", a: "Tables with fixed, typed columns", b: "Documents, key-value pairs, wide rows or graphs" }
  - { aspect: "Schema", a: "Declared up front with CREATE TABLE", b: "Flexible; optional validation (MongoDB)" }
  - { aspect: "Related data", a: "Foreign keys and joins", b: "Embedded or duplicated in one record" }
  - { aspect: "Transactions", a: "Multi-row ACID is the norm", b: "Varies; MongoDB multi-document since 4.0" }
  - { aspect: "Scale-out", a: "Usually one primary writes; replicas serve reads", b: "Often built in: Cassandra partitions across nodes" }
verdict: "Related data that needs joins and transactions: SQL. One known access pattern at large scale or varied shapes: a NoSQL store."
sayIt: "SQL databases keep related data in tables, enforce a schema and join per query, with multi-row transactions. NoSQL stores shape data for one access pattern so it scales out easily. I choose SQL for related, transactional data, and NoSQL for a known access pattern at scale."
