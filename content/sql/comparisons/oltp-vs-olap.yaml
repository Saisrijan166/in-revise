id: oltp-vs-olap
tech: sql
title: OLTP vs OLAP
compares: [oltp, olap]
gist:
  - "Runs the business: many small transactions"
  - "Studies the business: few big queries"
explain:
  - "OLTP is the app's live workload: many short transactions that read or change a few rows by key, such as inserting a payment or marking it PAID."
  - "OLAP is the analytics workload: a few large queries that scan and sum history, such as revenue per city per month, usually in a separate warehouse."
example: "Checkout inserts one payment row in milliseconds: OLTP. Finance asks for three years of revenue by month: OLAP. Run that report on the checkout database and it competes with checkout for CPU and disk, so it goes to a replica or a warehouse."
rows:
  - { aspect: "Typical query", a: "Read or change a few rows by key", b: "Scan and sum millions of rows" }
  - { aspect: "Workload", a: "Many reads and writes at once", b: "Heavy reads, few bulk loads" }
  - { aspect: "Schema", a: "Normalised", b: "Denormalised star schema" }
  - { aspect: "Storage", a: "Row store", b: "Often a column store" }
  - { aspect: "Data", a: "Current state", b: "History, loaded by ETL" }
verdict: "Serve the app from OLTP; copy its data to an OLAP store for reports and trends."
sayIt: "OLTP runs the business: many small ACID transactions on normalised, row-stored tables. OLAP studies the business: few big aggregate queries, usually on a warehouse with a star schema and column storage, loaded from OLTP by ETL."
