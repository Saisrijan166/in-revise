id: union-vs-union-all
tech: sql
title: "UNION vs UNION ALL"
compares: [union-op, union-all]
gist:
  - "Stack results, then remove duplicate rows"
  - "Stack results, keep every row"
rows:
  - { aspect: "{1, 2} with {2, 3}", a: "1, 2, 3", b: "1, 2, 2, 3" }
  - { aspect: "Extra work", a: "A duplicate check over all rows", b: "None" }
  - { aspect: "Speed", a: "Slower", b: "Usually much faster" }
  - { aspect: "Use when", a: "Overlap is possible and must go", b: "Parts cannot overlap, or repeats are wanted" }
verdict: "Default to UNION ALL; switch to UNION only when duplicates must be removed."
sources:
  - title: "SELECT: UNION clause (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/sql-select.html"
    verifiedOn: "2026-10-20"
