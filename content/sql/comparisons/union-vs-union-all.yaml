id: union-vs-union-all
tech: sql
title: "UNION vs UNION ALL"
compares: [union-op, union-all]
gist:
  - "Stack results, then remove duplicate rows"
  - "Stack results, keep every row"
explain:
  - "UNION stacks the rows of two queries with the same columns, then removes rows that appear more than once, so each distinct row comes back once."
  - "UNION ALL stacks the rows of two queries and returns all of them, repeats included, with no duplicate check."
example: "Customer ids with a PAID payment are 1, 2, 1 and with a FAILED payment 1. UNION returns 1, 2. UNION ALL returns 1, 1, 1, 2. For a statement of payments plus refunds, a kind column already makes every row different, so UNION ALL gives the right list without the extra check."
rows:
  - { aspect: "{1, 2} with {2, 3}", a: "1, 2, 3", b: "1, 2, 2, 3" }
  - { aspect: "Extra work", a: "Compares rows across the whole result to drop repeats", b: "None" }
  - { aspect: "Cost", a: "Higher", b: "Lower; PostgreSQL calls it usually much quicker" }
  - { aspect: "Use when", a: "Overlap is possible and must be removed", b: "Parts cannot overlap, or repeats are wanted" }
verdict: "Default to UNION ALL; switch to UNION only when duplicates must be removed."
sayIt: "UNION stacks two results and removes duplicate rows, which costs a comparison over the whole result. UNION ALL keeps every row and skips that work, so I use it whenever the parts cannot overlap or repeats are wanted."
sources:
  - title: "SELECT: UNION clause (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/sql-select.html"
    verifiedOn: "2026-10-21"
  - title: "Set Operations with UNION, INTERSECT, and EXCEPT (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/set-operations.html"
    verifiedOn: "2026-10-21"
