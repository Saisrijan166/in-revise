id: btree-vs-hash-index
tech: sql
title: B-tree vs Hash Index
compares: [btree-index, hash-index]
gist:
  - "Sorted tree: equality, ranges and sorting"
  - "Hash of the value: equality only"
explain:
  - "A B-tree index keeps the column's values sorted in a balanced tree, so it can find one value, a range of values, or return rows already in order."
  - "A hash index stores a hash code computed from each value. It finds rows whose value equals the one you ask for, but hash codes have no order, so it cannot serve ranges or sorting."
example: "WHERE id = 42 can use either. WHERE created_at >= '2026-10-01' or ORDER BY created_at can use only a B-tree, because hash codes of nearby dates are not near each other."
rows:
  - { aspect: "Operators", a: "=, <, <=, >, >=, BETWEEN, IN, LIKE 'abc%' (PostgreSQL: C collation or text_pattern_ops)", b: "= only" }
  - { aspect: "ORDER BY", a: "Can return rows already sorted", b: "No order to follow" }
  - { aspect: "UNIQUE, several columns", a: "Yes, yes", b: "No, no (PostgreSQL)" }
  - { aspect: "Where", a: "Default in PostgreSQL and MySQL InnoDB", b: "PostgreSQL and the MySQL MEMORY engine; InnoDB builds a B-tree instead" }
verdict: "Default to B-tree: it handles equality too. Try a PostgreSQL hash index only for pure equality lookups, and measure."
sayIt: "A B-tree keeps values sorted, so it serves equality, ranges and ORDER BY, and it is the default in PostgreSQL and InnoDB. A hash index serves only equality, and InnoDB does not have one, so I use B-tree unless a measurement shows hash helps."
