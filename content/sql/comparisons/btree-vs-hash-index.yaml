id: btree-vs-hash-index
tech: sql
title: B-tree vs Hash Index
compares: [btree-index, hash-index]
gist:
  - "Sorted tree: equality, ranges and sorting"
  - "Hash of the value: equality only"
rows:
  - { aspect: "Operators", a: "=, <, <=, >, >=, BETWEEN, IN, LIKE 'abc%' (PostgreSQL: C collation or text_pattern_ops)", b: "= only" }
  - { aspect: "ORDER BY", a: "Can return rows already sorted", b: "No order to follow" }
  - { aspect: "UNIQUE, several columns", a: "Yes, yes", b: "No, no (PostgreSQL)" }
  - { aspect: "Where", a: "Default in PostgreSQL and MySQL InnoDB", b: "PostgreSQL; MySQL MEMORY engine; not InnoDB" }
verdict: "Default to B-tree: it handles equality too. Try a PostgreSQL hash index only for pure equality lookups, and measure."
sources:
