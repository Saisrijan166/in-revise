id: row-number-vs-rank-vs-dense-rank
tech: sql
title: "ROW_NUMBER vs RANK vs DENSE_RANK"
compares: [row-number, rank-function, dense-rank]
gist:
  - "Always unique: 1, 2, 3"
  - "Ties share, then a gap: 1, 1, 3"
  - "Ties share, no gap: 1, 1, 2"
rows:
  - { aspect: "Salaries 100, 100, 90", a: "1, 2, 3", b: "1, 1, 3", c: "1, 1, 2" }
  - { aspect: "Tied rows", a: "Different numbers, in no fixed order", b: "Same rank", c: "Same rank" }
  - { aspect: "Typical use", a: "Exactly one row per group, or dedupe", b: "Competition ranking", c: "Nth highest distinct value" }
verdict: "ROW_NUMBER for exactly N rows, DENSE_RANK for the Nth distinct value, RANK for competition-style ranks."
