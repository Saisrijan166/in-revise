id: row-number-vs-rank-vs-dense-rank
tech: sql
title: "ROW_NUMBER vs RANK vs DENSE_RANK"
compares: [row-number, rank-function, dense-rank]
gist:
  - "Always unique: 1, 2, 3"
  - "Ties share, then a gap: 1, 1, 3"
  - "Ties share, no gap: 1, 1, 2"
explain:
  - "ROW_NUMBER() numbers the rows of each partition 1, 2, 3 in the window's order. Every row gets a different number, so it picks exactly N rows."
  - "RANK() gives rows with equal sort values the same rank, then skips as many numbers as there were ties, like positions in a race."
  - "DENSE_RANK() also gives tied rows the same rank, but the next rank is always one higher, so the ranks count distinct values."
example: "Payment amounts 700, 700, 500, 300 sorted DESC: ROW_NUMBER gives 1, 2, 3, 4; RANK gives 1, 1, 3, 4; DENSE_RANK gives 1, 1, 2, 3. For the second-highest distinct amount (500), filter DENSE_RANK = 2; RANK = 2 finds nothing, and ROW_NUMBER = 2 returns the second 700."
rows:
  - { aspect: "Amounts 700, 700, 500", a: "1, 2, 3", b: "1, 1, 3", c: "1, 1, 2" }
  - { aspect: "Tied rows", a: "Different numbers, in no fixed order", b: "Same rank", c: "Same rank" }
  - { aspect: "After a tie", a: "Next number", b: "Skips the tied count", c: "Next number, no gap" }
  - { aspect: "Typical use", a: "Exactly one row per group, or removing duplicates", b: "Competition-style ranking", c: "Nth highest distinct value" }
verdict: "ROW_NUMBER for exactly N rows, DENSE_RANK for the Nth distinct value, RANK for competition-style ranks."
sayIt: "All three number rows in the window's order and differ only on ties. ROW_NUMBER is always unique, 1, 2, 3; RANK shares the rank and leaves a gap, 1, 1, 3; DENSE_RANK shares it with no gap, 1, 1, 2. I use DENSE_RANK for Nth highest and ROW_NUMBER for one row per group."
sources:
