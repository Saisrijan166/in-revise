id: optimistic-vs-pessimistic-locking
tech: sql
title: "Optimistic vs Pessimistic Locking"
compares: [optimistic-locking, pessimistic-locking]
gist:
  - "No lock; check a version when you write"
  - "Lock the row first; others wait"
rows:
  - { aspect: "How", a: "UPDATE … WHERE id = ? AND version = ?", b: "SELECT … FOR UPDATE inside a transaction" }
  - { aspect: "On conflict", a: "0 rows updated: re-read and retry", b: "The second transaction waits its turn" }
  - { aspect: "Locks held", a: "None between read and write", b: "Until COMMIT or ROLLBACK" }
  - { aspect: "Can span a user's think time", a: "Yes: carry the version in the form", b: "No: never hold a lock during user input" }
  - { aspect: "In JPA", a: "@Version field", b: "LockModeType.PESSIMISTIC_WRITE" }
verdict: "Optimistic when conflicts are rare; pessimistic when the same rows are fought over often or a retry is expensive."
sources:
  - title: "Explicit Locking: row-level locks (PostgreSQL 18 documentation)"
    url: "https://www.postgresql.org/docs/18/explicit-locking.html"
    verifiedOn: "2026-10-20"
  - title: "Controlling Concurrent Access to Entity Data with Locking (Jakarta EE Tutorial)"
    url: "https://jakarta.ee/learn/jakartaee-tutorial/9.1/persist/persistence-locking/persistence-locking.html"
    verifiedOn: "2026-10-20"
