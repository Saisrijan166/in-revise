id: optimistic-vs-pessimistic-locking
tech: sql
title: "Optimistic vs Pessimistic Locking"
compares: [optimistic-locking, pessimistic-locking]
gist:
  - "No lock; check a version when you write"
  - "Lock the row first; others wait"
explain:
  - "Optimistic locking takes no lock. It reads a version number with the row and adds AND version = ? to the UPDATE, so a write based on stale data changes 0 rows and can be retried."
  - "Pessimistic locking locks the row with SELECT … FOR UPDATE inside a transaction before changing it, so any other transaction that wants the row waits until commit."
example: "Payment 2 is at version 0. Optimistic: agents A and B both read version 0; A's UPDATE … WHERE version = 0 changes 1 row, B's changes 0 rows, so B re-reads and retries. Pessimistic: A runs FOR UPDATE; B's FOR UPDATE waits until A commits, then B reads A's new status."
rows:
  - { aspect: "How", a: "UPDATE … WHERE id = ? AND version = ?", b: "SELECT … FOR UPDATE inside a transaction" }
  - { aspect: "On conflict", a: "0 rows updated: re-read and retry", b: "The second transaction waits its turn" }
  - { aspect: "Locks held", a: "None between the read and the write", b: "Until COMMIT or ROLLBACK" }
  - { aspect: "Can span a user's think time", a: "Yes: carry the version in the form", b: "No: never hold a lock during user input" }
  - { aspect: "In JPA", a: "A @Version field", b: "LockModeType.PESSIMISTIC_WRITE" }
verdict: "Optimistic when conflicts are rare; pessimistic when the same rows are fought over often or a retry is expensive."
sayIt: "Both prevent lost updates. Pessimistic locks the row with SELECT … FOR UPDATE, so others wait: good for hot rows and costly retries. Optimistic holds no lock and checks a version column in the UPDATE, retrying on 0 rows: good for rare conflicts and long edits."
sources:
  - title: "Explicit Locking: row-level locks (PostgreSQL 18 documentation)"
    url: "https://www.postgresql.org/docs/18/explicit-locking.html"
    verifiedOn: "2026-10-20"
  - title: "Controlling Concurrent Access to Entity Data with Locking (Jakarta EE Tutorial)"
    url: "https://jakarta.ee/learn/jakartaee-tutorial/9.1/persist/persistence-locking/persistence-locking.html"
    verifiedOn: "2026-10-20"
