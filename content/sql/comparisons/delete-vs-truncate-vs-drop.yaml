id: delete-vs-truncate-vs-drop
tech: sql
title: "DELETE vs TRUNCATE vs DROP"
compares: [delete-statement, truncate-statement, drop-table]
gist:
  - "Removes the rows you choose; the table stays"
  - "Empties the whole table fast; the table stays"
  - "Removes the table itself, with its indexes"
explain:
  - "DELETE removes the rows that match its WHERE condition, one row at a time, and the table stays. With no WHERE it removes every row."
  - "TRUNCATE empties a whole table in one step, without reading each row. The table, its columns and its indexes stay, ready for new rows."
  - "DROP TABLE removes the table itself: its rows, columns, indexes, constraints and triggers. Queries that use it fail afterwards."
example: "Failed payments older than a year: DELETE FROM payments WHERE status = 'FAILED' AND created_at < DATE '2025-10-01'. A test table full of junk rows: TRUNCATE payments_test. An old payments_backup table nobody uses: DROP TABLE payments_backup."
rows:
  - { aspect: "WHERE", a: "Yes", b: "No: all rows", c: "No: the whole table" }
  - { aspect: "ROLLBACK", a: "Yes, inside a transaction", b: "PostgreSQL: yes. MySQL: no, implicit commit", c: "PostgreSQL: yes. MySQL: no, implicit commit" }
  - { aspect: "Identity counter", a: "Keeps counting", b: "PostgreSQL: kept unless RESTART IDENTITY. MySQL: reset", c: "Gone with the table" }
  - { aspect: "Triggers", a: "Fires ON DELETE triggers", b: "No ON DELETE triggers (PostgreSQL fires ON TRUNCATE)", c: "Drops the table's triggers" }
  - { aspect: "Other tables reference it", a: "Allowed; FK rules apply per row", b: "Refused; PostgreSQL CASCADE empties those tables too", c: "Refused; PostgreSQL CASCADE drops only their FK" }
verdict: "DELETE for some rows, TRUNCATE to empty a table fast, DROP when the table itself must go."
sayIt: "DELETE removes chosen rows and can always be rolled back inside a transaction. TRUNCATE empties the whole table fast but keeps it. DROP removes the table itself. In MySQL, TRUNCATE and DROP commit at once; in PostgreSQL they roll back with the transaction."
sources:
