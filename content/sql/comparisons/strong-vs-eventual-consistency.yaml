id: strong-vs-eventual-consistency
tech: sql
title: Strong vs Eventual Consistency
compares: [strong-consistency, eventual-consistency]
gist:
  - "Every read sees the latest write"
  - "Copies agree once updates stop"
explain:
  - "Strong consistency means every read returns the latest committed write, wherever it is served. It solves correctness for data where an old value causes harm."
  - "Eventual consistency means copies may differ for a while after a write, but all return the same value once updates stop. It solves speed and availability, because a read does not wait for other copies."
example: "A customer's wallet balance is read from the primary before a refund, so it is always current: strong. The like count on a merchant's page is read from an asynchronous replica and may be a few seconds old: eventual."
rows:
  - { aspect: "Right after a write", a: "Every reader sees it", b: "Some readers see old data for a while" }
  - { aspect: "Cost", a: "More latency; may refuse requests in a partition", b: "Low latency; stays available" }
  - { aspect: "Typical setup", a: "Read from the primary", b: "Read from asynchronous replicas" }
  - { aspect: "Good for", a: "Balances, stock counts, unique usernames", b: "Feeds, likes, view counts" }
verdict: "Strong where a stale read breaks money or rules; eventual elsewhere, with read-your-writes for a user's own changes."
sayIt: "Strong consistency means every read sees the latest write, which costs latency and, during a partition, availability. Eventual consistency lets copies lag but agree in the end. I use strong reads for balances and stock, eventual for feeds and counts, with read-your-writes for a user's own changes."
sources:
  - title: "Eventually Consistent (Werner Vogels)"
    url: "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html"
    verifiedOn: "2026-10-20"
  - title: "Consistency Tradeoffs in Modern Distributed Database System Design (Daniel Abadi, IEEE Computer 2012)"
    url: "https://www.cs.umd.edu/~abadi/papers/abadi-pacelc.pdf"
    verifiedOn: "2026-10-20"
