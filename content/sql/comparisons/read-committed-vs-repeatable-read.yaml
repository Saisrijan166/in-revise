id: read-committed-vs-repeatable-read
tech: sql
title: "READ COMMITTED vs REPEATABLE READ"
compares: [read-committed, repeatable-read]
gist:
  - "New snapshot for every statement"
  - "One snapshot for the whole transaction"
rows:
  - { aspect: "Snapshot taken", a: "At the start of each statement", b: "At the first statement of the transaction" }
  - { aspect: "Read the row twice", a: "Can see a newer committed value", b: "Sees the same value" }
  - { aspect: "Row changed by another, then you update it", a: "Waits, then updates the newer version", b: "PostgreSQL: error 40001, retry. InnoDB: updates the newer version" }
  - { aspect: "Default in", a: "PostgreSQL 18", b: "MySQL 9.7 (InnoDB)" }
  - { aspect: "InnoDB gap locks", a: "Off for searches and index scans", b: "On: blocks inserts into scanned ranges" }
verdict: "READ COMMITTED for most web requests; REPEATABLE READ when one transaction must see a stable picture, like a report or export."
sources:
  - title: "Transaction Isolation (PostgreSQL 18 documentation)"
    url: "https://www.postgresql.org/docs/18/transaction-iso.html"
    verifiedOn: "2026-10-20"
  - title: "Transaction Isolation Levels (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-transaction-isolation-levels.html"
    verifiedOn: "2026-10-20"
  - title: "Consistent Nonlocking Reads (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-consistent-read.html"
    verifiedOn: "2026-10-20"
