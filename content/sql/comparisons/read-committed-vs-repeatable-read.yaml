id: read-committed-vs-repeatable-read
tech: sql
title: "READ COMMITTED vs REPEATABLE READ"
compares: [read-committed, repeatable-read]
gist:
  - "New snapshot for every statement"
  - "One snapshot for the whole transaction"
explain:
  - "READ COMMITTED gives each statement a fresh snapshot of committed data. Every query sees the latest commits, but two reads in one transaction can disagree."
  - "REPEATABLE READ gives the whole transaction one snapshot, taken at its first statement. Every read in it sees the same data, even while others commit."
example: "A report sums the PAID payments, then lists them, while other requests mark payments PAID. At READ COMMITTED the list can include a payment the total missed. At REPEATABLE READ both statements read one snapshot, so the total and the list match."
rows:
  - { aspect: "Snapshot taken", a: "At the start of each statement", b: "At the first statement of the transaction" }
  - { aspect: "Read the row twice", a: "Can see a newer committed value", b: "Sees the same value" }
  - { aspect: "Row changed by another, then you update it", a: "Waits if needed, then updates the newer version", b: "PostgreSQL: error 40001, retry. InnoDB: updates the newer version" }
  - { aspect: "Default in", a: "PostgreSQL 18", b: "MySQL 9.7 (InnoDB)" }
  - { aspect: "InnoDB gap locks", a: "Off for searches and index scans", b: "On: block inserts into scanned ranges" }
verdict: "READ COMMITTED for most web requests; REPEATABLE READ when one transaction must see a stable picture, like a report or an export."
sayIt: "READ COMMITTED takes a new snapshot for each statement, so a re-read can change; it is PostgreSQL's default. REPEATABLE READ keeps one snapshot for the whole transaction and is MySQL's default; in PostgreSQL a conflicting update then fails with 40001 and must be retried."
sources:
