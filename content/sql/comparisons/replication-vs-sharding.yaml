id: replication-vs-sharding
tech: sql
title: Replication vs Sharding
compares: [replication, sharding]
gist:
  - "Copy the same data to many servers"
  - "Split different rows across servers"
explain:
  - "Replication keeps full copies of the same data on several servers: one primary takes the writes, and replicas replay them. It solves read load and surviving a server failure."
  - "Sharding splits different rows across several servers by a shard key, so each server owns one slice. It solves writes and data that outgrow one server."
example: "The payment history page overloads the primary with reads: add two replicas and send history reads there. INSERTs into payments saturate the primary: replicas cannot help, since each replays every insert; sharding by customer_id gives each server only its customers' writes."
rows:
  - { aspect: "Each server holds", a: "All the data", b: "A slice of the rows" }
  - { aspect: "Scales", a: "Reads and availability", b: "Writes and storage" }
  - { aspect: "Writes go to", a: "The one primary", b: "The shard that owns the key" }
  - { aspect: "Main risk", a: "Stale reads from replication lag", b: "Hot shards and cross-shard queries" }
verdict: "Replicate first for reads and failover; shard when writes or data outgrow one primary."
sayIt: "Replication copies the same data to many servers, which scales reads and gives failover, but every write still goes to one primary. Sharding splits rows across servers, which scales writes and storage, but adds routing and cross-shard queries. Replicate first; shard when writes outgrow one primary."
sources:
  - title: "Chapter 19 Replication (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/replication.html"
    verifiedOn: "2026-10-20"
  - title: "Sharding pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding"
    verifiedOn: "2026-10-20"
