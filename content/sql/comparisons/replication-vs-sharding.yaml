id: replication-vs-sharding
tech: sql
title: Replication vs Sharding
compares: [replication, sharding]
gist:
  - "Copy the same data to many servers"
  - "Split different rows across servers"
rows:
  - { aspect: "Each server holds", a: "All the data", b: "A slice of the rows" }
  - { aspect: "Scales", a: "Reads and availability", b: "Writes and storage" }
  - { aspect: "Writes go to", a: "The one primary", b: "The shard that owns the key" }
  - { aspect: "Main risk", a: "Stale reads from replication lag", b: "Hot shards and cross-shard queries" }
verdict: "Replicate first for reads and failover; shard when writes or data outgrow one primary."
sources:
