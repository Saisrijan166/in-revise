id: dirty-vs-nonrepeatable-vs-phantom-read
tech: sql
title: "Dirty vs Non-repeatable vs Phantom Read"
compares: [dirty-read, non-repeatable-read, phantom-read]
gist:
  - "You read a change that was never committed"
  - "Same row, read twice, different values"
  - "Same WHERE, run twice, different set of rows"
rows:
  - { aspect: "Other transaction has", a: "Not committed yet", b: "Committed an UPDATE or DELETE", c: "Committed rows that now match or stop matching" }
  - { aspect: "You re-read", a: "Nothing: the first read is already wrong", b: "One row", c: "A range: WHERE city = 'Pune'" }
  - { aspect: "First level that stops it", a: "READ COMMITTED", b: "REPEATABLE READ", c: "SERIALIZABLE (PostgreSQL: REPEATABLE READ)" }
  - { aspect: "PostgreSQL 18", a: "Never happens, at any level", b: "Possible at READ COMMITTED", c: "Possible at READ COMMITTED" }
verdict: "Dirty = uncommitted data, non-repeatable = one row changed, phantom = the set of rows changed; each needs one level higher."
sources:
  - title: "Transaction Isolation (PostgreSQL 18 documentation)"
    url: "https://www.postgresql.org/docs/18/transaction-iso.html"
    verifiedOn: "2026-10-20"
