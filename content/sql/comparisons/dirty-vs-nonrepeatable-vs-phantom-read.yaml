id: dirty-vs-nonrepeatable-vs-phantom-read
tech: sql
title: "Dirty vs Non-repeatable vs Phantom Read"
compares: [dirty-read, non-repeatable-read, phantom-read]
gist:
  - "You read a change that was never committed"
  - "Same row, read twice, different values"
  - "Same WHERE, run twice, different set of rows"
explain:
  - "A dirty read is seeing another transaction's change before it commits. If that transaction rolls back, you acted on data that never officially existed."
  - "A non-repeatable read is reading the same row twice in one transaction and getting different values, because another transaction committed an update in between."
  - "A phantom read is running the same WHERE twice in one transaction and getting a different set of rows, because another transaction committed a matching insert or delete."
example: "A month-end report runs as one transaction. Its PAID total includes a payment that was later rolled back: dirty read. Page 1 shows payment 2 as PENDING and page 3 shows it as PAID: non-repeatable read. The summary counts 4 PENDING payments but the list below shows 5: phantom read."
rows:
  - { aspect: "The other transaction has", a: "Not committed yet", b: "Committed an UPDATE or DELETE of that row", c: "Committed rows that now match, or stop matching" }
  - { aspect: "What you re-read", a: "Nothing: the first read is already wrong", b: "One row", c: "A range, such as WHERE status = 'PENDING'" }
  - { aspect: "First level that stops it", a: "READ COMMITTED", b: "REPEATABLE READ", c: "SERIALIZABLE (PostgreSQL: REPEATABLE READ)" }
  - { aspect: "In PostgreSQL 18", a: "Never happens, at any level", b: "Possible at READ COMMITTED", c: "Possible at READ COMMITTED" }
verdict: "Dirty = uncommitted data; non-repeatable = one row changed; phantom = the set of rows changed. Each needs one level higher to stop it."
sayIt: "A dirty read sees uncommitted data, a non-repeatable read sees one row change between two reads, and a phantom read sees the set of matching rows change. READ COMMITTED stops the first, REPEATABLE READ the second, SERIALIZABLE all three; PostgreSQL's REPEATABLE READ already stops phantoms."
sources:
  - title: "Transaction Isolation (PostgreSQL 18 documentation)"
    url: "https://www.postgresql.org/docs/18/transaction-iso.html"
    verifiedOn: "2026-10-20"
