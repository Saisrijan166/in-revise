id: shared-vs-exclusive-lock
tech: sql
title: "Shared vs Exclusive Lock"
compares: [shared-lock, exclusive-lock]
gist:
  - "Many holders: rely on the row, nobody may change it"
  - "One holder: only it may change the row"
explain:
  - "A shared lock says 'I rely on this row; do not change it'. Many transactions can hold one on the same row at once, for example to make sure a customer still exists while inserting their payment."
  - "An exclusive lock says 'I am changing this row'. Only one transaction can hold it, and it makes every other lock request on the row wait until that transaction ends."
example: "Session A runs SELECT … FROM customers WHERE id = 1 FOR SHARE. Session B can take FOR SHARE on customer 1 at once, but B's UPDATE of customer 1 waits until A commits. A plain SELECT of customer 1 never waits."
rows:
  - { aspect: "Taken by", a: "SELECT … FOR SHARE", b: "UPDATE, DELETE, SELECT … FOR UPDATE" }
  - { aspect: "How many holders", a: "Many transactions at once", b: "One transaction" }
  - { aspect: "While held, another FOR SHARE", a: "Is granted at once", b: "Waits" }
  - { aspect: "While held, an UPDATE or FOR UPDATE", a: "Waits", b: "Waits" }
  - { aspect: "While held, a plain SELECT", a: "Runs without waiting", b: "Runs without waiting (InnoDB: below SERIALIZABLE)" }
  - { aspect: "Released at", a: "COMMIT or ROLLBACK", b: "COMMIT or ROLLBACK" }
verdict: "Use FOR SHARE to keep a row from changing while you rely on it; FOR UPDATE when you are about to change it."
sayIt: "A shared lock lets many transactions lock a row for reading and stops changes; an exclusive lock lets one transaction change the row and makes all other locks wait. In PostgreSQL and InnoDB, plain SELECTs take neither, so they never wait for these locks."
sources:
  - title: "InnoDB Locking (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-locking.html"
    verifiedOn: "2026-10-20"
  - title: "Explicit Locking: row-level locks (PostgreSQL 18 documentation)"
    url: "https://www.postgresql.org/docs/18/explicit-locking.html"
    verifiedOn: "2026-10-20"
