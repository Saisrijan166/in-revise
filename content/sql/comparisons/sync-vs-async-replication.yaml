id: sync-vs-async-replication
tech: sql
title: Synchronous vs Asynchronous Replication
compares: [synchronous-replication, asynchronous-replication]
gist:
  - "Commit waits for a standby: safer, slower"
  - "Commit returns at once: faster, can lose data"
explain:
  - "With synchronous replication, COMMIT returns only after a standby confirms it has stored the change. It solves losing committed data when the primary crashes."
  - "With asynchronous replication, COMMIT returns as soon as the primary has stored the change, and replicas catch up afterwards. It solves commit latency, because no write waits for the network."
example: "A payment commits at 10:00:00.100 and the primary's disk fails at 10:00:00.200. With async replication the standby may not have received that payment, so it is lost after failover. With sync replication the commit waited for the standby, so the payment survives."
rows:
  - { aspect: "Commit returns", a: "After a standby confirms the change is on disk", b: "After the primary alone writes it" }
  - { aspect: "Primary crashes", a: "Committed data is safe unless both servers crash", b: "Commits not yet sent are lost" }
  - { aspect: "Write latency", a: "At least one round trip to the standby", b: "No extra wait" }
  - { aspect: "Default", a: "Off: you must configure it", b: "On: the default in PostgreSQL 18 and MySQL 9.7" }
  - { aspect: "MySQL option", a: "Semisynchronous: at least one replica has logged it", b: "Built-in replication" }
verdict: "Async for read replicas; sync (or MySQL semisync) for the failover standby when a lost commit is not acceptable."
sayIt: "Synchronous replication makes COMMIT wait until a standby has stored the change, so failover loses no committed data, at the cost of a network round trip per commit. Asynchronous, the default in PostgreSQL and MySQL, is faster but can lose the last commits on a crash."
sources:
