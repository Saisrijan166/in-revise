id: decimal-vs-float
tech: sql
title: "DECIMAL vs FLOAT"
compares: [numeric-type, float-types]
gist:
  - "Exact decimal digits: right for money"
  - "Fast binary approximation: fine for measurements"
explain:
  - "DECIMAL, also called NUMERIC, stores a number as exact decimal digits with a fixed scale, such as 2 places for money. Sums are exact, so totals always match to the paisa."
  - "FLOAT, REAL and DOUBLE store a binary approximation in 4 or 8 bytes. They are fast and cover huge ranges, but values like 0.1 are not stored exactly, so tiny errors appear."
example: "payments.amount is NUMERIC(12,2), so 0.10 + 0.20 is exactly 0.30 and a day's total matches the bank statement. A delivery app's GPS speed reading is DOUBLE PRECISION: a tiny rounding error does not matter there."
rows:
  - { aspect: "Stores", a: "Exact decimal digits", b: "IEEE 754 binary approximation" }
  - { aspect: "0.1 + 0.2", a: "0.3", b: "0.30000000000000004 (double)" }
  - { aspect: "Speed and size", a: "Slower; size grows with digits", b: "Fast; fixed 4 or 8 bytes" }
  - { aspect: "Names", a: "NUMERIC(p,s), DECIMAL(p,s)", b: "REAL, DOUBLE PRECISION, FLOAT" }
  - { aspect: "Use for", a: "Money, quantities that must add up", b: "Sensor readings, scientific values, scores" }
verdict: "Anything that must add up to the paisa: NUMERIC or DECIMAL. Measured values where tiny errors are fine: FLOAT."
sayIt: "Money goes in NUMERIC or DECIMAL, because they store exact decimal digits and sums always match. FLOAT and DOUBLE are binary approximations, so 0.1 + 0.2 is not exactly 0.3; I use them only for measurements where tiny errors do not matter."
sources:
  - title: "PostgreSQL 18 docs: 8.1 Numeric Types"
    url: "https://www.postgresql.org/docs/18/datatype-numeric.html"
    verifiedOn: "2026-10-20"
