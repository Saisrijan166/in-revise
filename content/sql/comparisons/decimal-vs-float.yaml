id: decimal-vs-float
tech: sql
title: "DECIMAL vs FLOAT"
compares: [numeric-type, float-types]
gist:
  - "Exact decimal digits: right for money"
  - "Fast binary approximation: fine for measurements"
rows:
  - { aspect: "Stores", a: "Exact decimal digits", b: "IEEE 754 binary approximation" }
  - { aspect: "0.1 + 0.2", a: "0.3", b: "0.30000000000000004 (double)" }
  - { aspect: "Speed and size", a: "Slower; size grows with digits", b: "Fast; fixed 4 or 8 bytes" }
  - { aspect: "Names", a: "NUMERIC(p,s), DECIMAL(p,s)", b: "REAL, DOUBLE PRECISION, FLOAT" }
  - { aspect: "Use for", a: "Money, quantities that must add up", b: "Sensor readings, scientific values, scores" }
verdict: "Anything that must add up to the paisa: NUMERIC or DECIMAL. Measured values where tiny errors are fine: FLOAT."
sources:
  - title: "PostgreSQL 18 docs: 8.1 Numeric Types"
    url: "https://www.postgresql.org/docs/18/datatype-numeric.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7 Reference Manual: Fixed-Point Types (DECIMAL, NUMERIC)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/fixed-point-types.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7 Reference Manual: Floating-Point Types (FLOAT, DOUBLE)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/floating-point-types.html"
    verifiedOn: "2026-10-20"
