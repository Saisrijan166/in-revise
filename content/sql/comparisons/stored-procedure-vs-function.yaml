id: stored-procedure-vs-function
tech: sql
title: Stored Procedure vs Function
compares: [stored-procedure, user-defined-function]
gist:
  - "Runs a job on its own with CALL"
  - "Computes a value you use inside a query"
explain:
  - "A stored procedure is a named job kept in the database. You run it on its own with CALL, it returns no value, and it may commit its work part-way."
  - "A function is a named calculation kept in the database. It returns a value, or in PostgreSQL also rows, so you use it inside SELECT or WHERE like a built-in function."
example: "Every night, mark payments that have been PENDING for over a day as FAILED: CALL fail_old_pending(...), a procedure. Show each payment's amount minus its refunds in a report: SELECT id, net_amount(id) FROM payments, a function."
rows:
  - { aspect: "How you run it", a: "CALL proc(...)", b: "Inside SELECT, WHERE or any expression" }
  - { aspect: "Returns", a: "No return value; OUT parameters", b: "A value (PostgreSQL: also a table)" }
  - { aspect: "COMMIT inside", a: "Yes: MySQL; PostgreSQL 11+ if CALL is outside a transaction block", b: "No, in both products" }
  - { aspect: "Typical use", a: "Multi-step jobs, batch updates", b: "Calculations, reusable expressions" }
verdict: "Need a value inside a query: a function. Need a multi-step job that may commit as it goes: a procedure."
sayIt: "A function returns a value and is used inside a query, and it cannot commit. A procedure runs on its own with CALL, returns data only through OUT parameters or result sets, and may commit part-way, which suits multi-step batch jobs."
sources:
  - title: "PostgreSQL 18: User-Defined Procedures"
    url: "https://www.postgresql.org/docs/18/xproc.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7: CREATE PROCEDURE and CREATE FUNCTION Statements"
    url: "https://dev.mysql.com/doc/refman/9.7/en/create-procedure.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7: Restrictions on Stored Programs"
    url: "https://dev.mysql.com/doc/refman/9.7/en/stored-program-restrictions.html"
    verifiedOn: "2026-10-20"
