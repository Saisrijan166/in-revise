id: logical-vs-physical-backup
tech: sql
title: Logical vs Physical Backup
compares: [logical-backup, physical-backup]
gist:
  - "SQL that rebuilds the schema and rows"
  - "A copy of the database's data files"
explain:
  - "A logical backup, made by pg_dump or mysqldump, writes SQL or a dump file that recreates the tables and inserts the rows. It solves moving or restoring single tables and upgrading to a new version."
  - "A physical backup, made by pg_basebackup or MySQL Enterprise Backup, copies the database's data files as they are. It solves fast backup and restore of big servers, and is the starting point for point-in-time recovery."
example: "The refunds table was damaged: a pg_dump of just that table, taken last night, restores it alone. The whole 2 TB server is lost: restore the pg_basebackup copy and replay archived WAL, which is far faster than reloading 2 TB of INSERTs."
rows:
  - { aspect: "Tools", a: "pg_dump, mysqldump", b: "pg_basebackup, MySQL Enterprise Backup" }
  - { aspect: "Speed and size", a: "Slower, larger: rows become text", b: "Faster, more compact: files are copied" }
  - { aspect: "Restore scope", a: "One table, one database, or all", b: "Usually the whole server; in PostgreSQL always" }
  - { aspect: "Moves to", a: "Newer versions and other machines", b: "The same major version on similar machines" }
  - { aspect: "Base for PITR", a: "MySQL: yes, with binlogs. PostgreSQL: no", b: "Yes, with archived WAL or binlogs" }
verdict: "Logical dumps for small databases, single tables and upgrades; physical backups with log archiving for big production servers."
sayIt: "A logical backup is SQL that rebuilds tables and rows: portable, good for one table or an upgrade, slow for big data. A physical backup copies the data files: fast for big servers and, with archived WAL or binlogs, the base for point-in-time recovery."
