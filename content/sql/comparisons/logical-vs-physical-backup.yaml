id: logical-vs-physical-backup
tech: sql
title: Logical vs Physical Backup
compares: [logical-backup, physical-backup]
gist:
  - "SQL that rebuilds the schema and rows"
  - "A copy of the database's data files"
rows:
  - { aspect: "Tools", a: "pg_dump, mysqldump", b: "pg_basebackup, MySQL Enterprise Backup" }
  - { aspect: "Speed and size", a: "Slower, larger: rows become text", b: "Faster, more compact: files are copied" }
  - { aspect: "Restore scope", a: "One table, one database, or all", b: "Usually the whole server; in PostgreSQL always" }
  - { aspect: "Moves to", a: "Newer versions and other machines", b: "The same major version on similar machines" }
  - { aspect: "Base for PITR", a: "MySQL: yes, with binlogs. PostgreSQL: no", b: "Yes, with archived WAL or binlogs" }
verdict: "Logical dumps for small databases, single tables and upgrades; physical backups with log archiving for big production servers."
sources:
  - title: "SQL Dump (PostgreSQL 18)"
    url: "https://www.postgresql.org/docs/18/backup-dump.html"
    verifiedOn: "2026-10-20"
  - title: "Backup and Recovery Types (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/backup-types.html"
    verifiedOn: "2026-10-20"
  - title: "Continuous Archiving and Point-in-Time Recovery (PostgreSQL 18)"
    url: "https://www.postgresql.org/docs/18/continuous-archiving.html"
    verifiedOn: "2026-10-20"
