id: in-vs-exists
tech: sql
title: "IN vs EXISTS"
compares: [in-subquery, exists-subquery]
gist:
  - "Is this value in the subquery's list?"
  - "Does the subquery return any row at all?"
rows:
  - { aspect: "Subquery returns", a: "One column of values", b: "Rows; their columns are ignored" }
  - { aspect: "Usually", a: "Not correlated", b: "Correlated to the outer row" }
  - { aspect: "NOT form with a NULL", a: "NOT IN returns no rows", b: "NOT EXISTS still works" }
  - { aspect: "Speed", a: "Often the same plan: a semi-join", b: "Often the same plan: a semi-join" }
verdict: "Either works for positive checks; for 'no match', prefer NOT EXISTS."
sources:
  - title: "Subquery Expressions: EXISTS, IN, NOT IN (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/functions-subquery.html"
    verifiedOn: "2026-10-20"
  - title: "Optimizing IN and EXISTS with Semijoin and Antijoin Transformations (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/semijoins-antijoins.html"
    verifiedOn: "2026-10-20"
