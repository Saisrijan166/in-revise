id: in-vs-exists
tech: sql
title: "IN vs EXISTS"
compares: [in-subquery, exists-subquery]
gist:
  - "Is this value in the subquery's list?"
  - "Does the subquery return any row at all?"
explain:
  - "IN asks whether a value appears in a list. The list can be written out, IN ('PAID', 'PENDING'), or come from a subquery that returns one column of values."
  - "EXISTS asks whether a subquery returns at least one row. It ignores what the row contains, so people write SELECT 1 inside, and the subquery usually refers to the outer row."
example: "Customers who have a payment: id IN (SELECT customer_id FROM payments) and EXISTS (SELECT 1 FROM payments p WHERE p.customer_id = c.id) both return Asha, Ravi and Meena. Add one payment with a NULL customer_id, and id NOT IN (...) returns nobody, while NOT EXISTS still returns Arjun."
rows:
  - { aspect: "Subquery returns", a: "One column of values", b: "Rows; their columns are ignored" }
  - { aspect: "Usually", a: "Not correlated", b: "Correlated to the outer row" }
  - { aspect: "NOT form with a NULL", a: "NOT IN returns no rows", b: "NOT EXISTS still works" }
  - { aspect: "Speed", a: "Often the same plan: a semi-join", b: "Often the same plan: a semi-join" }
verdict: "Either works for positive checks; for 'no match', prefer NOT EXISTS."
sayIt: "IN checks a value against a list; EXISTS checks whether a matching row exists. For positive checks the optimiser often runs both as the same semi-join. For 'no match' I use NOT EXISTS, because one NULL in the list makes NOT IN return no rows."
sources:
  - title: "Subquery Expressions: EXISTS, IN, NOT IN (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/functions-subquery.html"
    verifiedOn: "2026-10-20"
  - title: "Optimizing IN and EXISTS with Semijoin and Antijoin Transformations (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/semijoins-antijoins.html"
    verifiedOn: "2026-10-20"
