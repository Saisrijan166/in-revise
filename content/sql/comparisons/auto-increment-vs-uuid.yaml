id: auto-increment-vs-uuid
tech: sql
title: Auto-increment vs UUID Keys
compares: [auto-increment, uuid-key]
gist:
  - "The database counts up: 1, 2, 3"
  - "128-bit id that anyone can make, anywhere"
explain:
  - "An auto-increment key is a number the database hands out in order: 1, 2, 3. It is small and new rows go to the end of the index, but only that one database can make the next value."
  - "A UUID is a 128-bit id that any app or service can create on its own with almost no chance of a clash. It lets ids be made before the row reaches the database, at the cost of 16 bytes per key."
example: "A payments service creates payment ids inside one PostgreSQL database, so BIGINT identity is enough. A mobile app that saves payments offline and syncs later needs ids made on the phone, so it uses UUIDv7, which still sorts roughly by creation time."
rows:
  - { aspect: "Size", a: "4 or 8 bytes (INT, BIGINT)", b: "16 bytes" }
  - { aspect: "Who makes it", a: "One database's counter", b: "Any app or service, no coordination" }
  - { aspect: "Index inserts", a: "Always at the end of the index; InnoDB pages fill to about 15/16", b: "v4 lands anywhere, so pages are 1/2 to 15/16 full; v7 lands near the end" }
  - { aspect: "Guessable", a: "Yes: ids count up in order", b: "v4 is random; v7 shows creation time" }
  - { aspect: "Merging databases", a: "Ids clash", b: "No clashes" }
verdict: "Use BIGINT identity by default; use UUIDv7 when ids are created outside one database."
sayIt: "I default to a BIGINT identity: 8 bytes, ordered, and new keys go to the end of the index. When ids must be created outside one database, by clients or many services, I use UUIDv7, which is unique everywhere and still roughly time-ordered."
sources:
  - title: "RFC 9562: Universally Unique IDentifiers (UUIDs)"
    url: "https://www.rfc-editor.org/rfc/rfc9562"
    verifiedOn: "2026-10-20"
  - title: "PostgreSQL 18: UUID Type"
    url: "https://www.postgresql.org/docs/18/datatype-uuid.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7: The Physical Structure of an InnoDB Index"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-physical-structure.html"
    verifiedOn: "2026-10-20"
