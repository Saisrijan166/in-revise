id: auto-increment-vs-uuid
tech: sql
title: Auto-increment vs UUID Keys
compares: [auto-increment, uuid-key]
gist:
  - "The database counts up: 1, 2, 3"
  - "128-bit id that anyone can make, anywhere"
rows:
  - { aspect: "Size", a: "4 or 8 bytes (INT, BIGINT)", b: "16 bytes" }
  - { aspect: "Who makes it", a: "One database's counter", b: "Any app or service, no coordination" }
  - { aspect: "Index inserts", a: "At the end; InnoDB pages about 15/16 full", b: "v4 random: pages 1/2 to 15/16 full; v7 near the end" }
  - { aspect: "Guessable", a: "Yes: next is id + 1", b: "v4 is random; v7 shows creation time" }
  - { aspect: "Merging databases", a: "Ids clash", b: "No clashes" }
verdict: "Use BIGINT identity by default; use UUIDv7 when ids are created outside one database."
sources:
  - title: "RFC 9562: Universally Unique IDentifiers (UUIDs)"
    url: "https://www.rfc-editor.org/rfc/rfc9562"
    verifiedOn: "2026-10-20"
  - title: "PostgreSQL 18: UUID Type"
    url: "https://www.postgresql.org/docs/18/datatype-uuid.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7: The Physical Structure of an InnoDB Index"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-physical-structure.html"
    verifiedOn: "2026-10-20"
