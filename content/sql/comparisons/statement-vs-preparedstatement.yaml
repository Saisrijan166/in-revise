id: statement-vs-preparedstatement
tech: sql
title: "Statement vs PreparedStatement"
compares: [jdbc-statement, prepared-statement]
gist:
  - "SQL text built with +; input can become code"
  - "Fixed SQL with ? slots; input is only data"
rows:
  - { aspect: "Query text", a: "Built by joining strings and values", b: "Written once with ? placeholders" }
  - { aspect: "User input", a: "Becomes part of the SQL: injectable", b: "Bound as a value: cannot change the query" }
  - { aspect: "Values", a: "Hand-formatted into the text", b: "Typed setters: setLong, setString" }
  - { aspect: "Repeated runs", a: "SQL text parsed again each time", b: "Server-side prepare: PgJDBC from the 5th run; Connector/J off by default" }
  - { aspect: "Use for", a: "Fixed SQL with no input, such as DDL", b: "Every query that takes a value" }
verdict: "Use PreparedStatement whenever a value is involved; keep plain Statement for fixed SQL with no input."
sources:
  - title: "PreparedStatement (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/PreparedStatement.html"
    verifiedOn: "2026-10-20"
  - title: "SQL Injection Prevention Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "PgJDBC: connection parameters, prepareThreshold"
    url: "https://jdbc.postgresql.org/documentation/use/"
    verifiedOn: "2026-10-20"
  - title: "Connector/J prepared statement properties: useServerPrepStmts (MySQL docs)"
    url: "https://dev.mysql.com/doc/connector-j/en/connector-j-connp-props-prepared-statements.html"
    verifiedOn: "2026-10-20"
