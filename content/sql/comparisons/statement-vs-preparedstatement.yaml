id: statement-vs-preparedstatement
tech: sql
title: "Statement vs PreparedStatement"
compares: [jdbc-statement, prepared-statement]
gist:
  - "SQL text built with +; input can become code"
  - "Fixed SQL with ? slots; input is only data"
explain:
  - "A Statement runs a complete SQL string that your code has built, values included. It suits fixed SQL with no outside input, such as a CREATE TABLE in a setup script."
  - "A PreparedStatement runs SQL written once with ? placeholders, and each value is bound separately with a typed setter such as setString. Input fills a slot and can never change the query."
example: "Searching payments by a status the user typed: with a Statement, the input ' OR '1'='1 joined into the SQL returns all 5 payments. With a PreparedStatement and setString(1, status), the same input is compared as plain text and returns no rows."
rows:
  - { aspect: "Query text", a: "Built by joining strings and values", b: "Written once with ? placeholders" }
  - { aspect: "User input", a: "Becomes part of the SQL: injectable", b: "Bound as a value: cannot change the query" }
  - { aspect: "Values", a: "Hand-formatted into the text", b: "Typed setters: setLong, setString" }
  - { aspect: "Repeated runs", a: "SQL text parsed again each time", b: "PgJDBC prepares it on the server from the 5th run; Connector/J only with useServerPrepStmts=true" }
  - { aspect: "Use for", a: "Fixed SQL with no input, such as DDL", b: "Every query that takes a value" }
verdict: "Use PreparedStatement whenever a value is involved; keep plain Statement for fixed SQL with no input."
sayIt: "A Statement runs SQL text I build, so concatenated input can become code. A PreparedStatement fixes the SQL with ? placeholders and binds values separately, so input stays data. I use PreparedStatement for every query that takes a value."
sources:
