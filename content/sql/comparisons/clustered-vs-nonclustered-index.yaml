id: clustered-vs-nonclustered-index
tech: sql
title: Clustered vs Non-Clustered Index
compares: [clustered-index, secondary-index]
gist:
  - "The table itself, stored in key order"
  - "A separate list of keys pointing to rows"
explain:
  - "A clustered index stores the full rows in its leaf pages, so the table itself is kept in key order. It makes a lookup by that key end at the row."
  - "A non-clustered (secondary) index is a separate structure holding the key and a way to reach the row. It lets you search by other columns, at the price of a second step to fetch the row."
example: "In InnoDB, WHERE id = 42 walks the clustered primary key and lands on the row. WHERE customer_id = 7 walks the secondary index, gets the ids, then walks the clustered index once per id to read the rows."
rows:
  - { aspect: "Holds", a: "The full rows, sorted by the key", b: "The key plus a way to reach the row" }
  - { aspect: "Per table", a: "One", b: "Many" }
  - { aspect: "Reaching the row", a: "One tree walk", b: "Index walk, then fetch the row" }
  - { aspect: "MySQL InnoDB", a: "The PRIMARY KEY (else first UNIQUE NOT NULL)", b: "Every other index; stores the PK" }
  - { aspect: "PostgreSQL", a: "None kept; CLUSTER sorts once", b: "Every index, over a heap" }
verdict: "In InnoDB the primary key is the clustered index, so keep it short. In PostgreSQL every index is secondary."
sayIt: "A clustered index is the table itself in key order, so there is one per table; a secondary index is a separate key list pointing to rows. In InnoDB the primary key is clustered and secondary entries hold it. PostgreSQL has heaps, so every index is secondary."
sources:
  - title: "Clustered and Secondary Indexes (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-index-types.html"
    verifiedOn: "2026-10-20"
