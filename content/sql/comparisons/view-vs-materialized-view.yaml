id: view-vs-materialized-view
tech: sql
title: View vs Materialized View
compares: [plain-view, materialized-view]
gist:
  - "A saved query; runs on every read"
  - "A saved result; read like a table"
explain:
  - "A view is a SELECT saved under a name. It stores no rows; each read runs the SELECT on the base tables, so it is always current and is used to simplify queries and limit access."
  - "A materialized view runs its SELECT once and stores the result rows. Reads are fast and can use indexes, but they show the data as of the last REFRESH."
example: "paid_payments as a view always includes a payment made a second ago. customer_totals as a materialized view still shows yesterday's totals until REFRESH MATERIALIZED VIEW runs, but answers in a few milliseconds instead of summing every payment."
rows:
  - { aspect: "Stores", a: "Only the query", b: "The result rows" }
  - { aspect: "Freshness", a: "Always current", b: "As of the last REFRESH (PostgreSQL)" }
  - { aspect: "Read speed", a: "Same as running the query", b: "Fast; can have its own indexes" }
  - { aspect: "Write through it", a: "Yes, if simple (one table, no GROUP BY)", b: "No: read-only" }
  - { aspect: "MySQL 9.7", a: "Yes", b: "Only on HeatWave (9.5+); else a summary table" }
verdict: "Use a view to name and protect a query; a materialized view when the query is too slow and slightly old data is fine."
sayIt: "A view saves the query, so it is always current but as slow as the query. A materialized view saves the result, so reads are fast and indexable but stale until refreshed. MySQL has materialized views only on HeatWave, so there I use a summary table."
sources:
  - title: "PostgreSQL 18: CREATE VIEW"
    url: "https://www.postgresql.org/docs/18/sql-createview.html"
    verifiedOn: "2026-10-20"
  - title: "PostgreSQL 18: Materialized Views"
    url: "https://www.postgresql.org/docs/18/rules-materializedviews.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7: CREATE VIEW (materialized views on HeatWave only)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/create-view.html"
    verifiedOn: "2026-10-20"
