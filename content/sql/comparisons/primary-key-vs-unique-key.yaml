id: primary-key-vs-unique-key
tech: sql
title: "Primary Key vs Unique Key"
compares: [primary-key, unique-constraint]
gist:
  - "The row's id: unique, never NULL, one per table"
  - "A no-duplicates rule: many per table, NULLs allowed"
explain:
  - "A primary key is the column chosen to identify each row. It must be unique and can never be NULL, and a table has at most one. Foreign keys usually point to it."
  - "A UNIQUE constraint only forbids repeated values in a column or set of columns. A table can have many of them, and by default many rows may hold NULL in a UNIQUE column."
example: "customers.id is the primary key: every customer has one and it never changes. customers.email is UNIQUE: no two customers share an email, but a customer who signed up by phone may have no email (NULL) yet."
rows:
  - { aspect: "Per table", a: "At most one", b: "Any number" }
  - { aspect: "NULL", a: "Never; columns become NOT NULL", b: "Allowed, and many NULLs do not clash" }
  - { aspect: "Index", a: "Unique index; InnoDB keeps the rows in it", b: "Unique index; a secondary index in InnoDB" }
  - { aspect: "Foreign keys", a: "The usual target", b: "Can be a target too" }
  - { aspect: "Change NULL rule", a: "Not applicable", b: "PostgreSQL 15+: UNIQUE NULLS NOT DISTINCT" }
verdict: "Use the primary key for the row's identity; add UNIQUE for every other value that must not repeat, such as email."
sayIt: "A primary key identifies the row: unique, never NULL, one per table, and the usual target of foreign keys. A UNIQUE constraint just forbids duplicates; a table can have many, and NULLs are allowed. I use the id as the primary key and UNIQUE for values like email."
