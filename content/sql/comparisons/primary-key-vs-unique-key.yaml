id: primary-key-vs-unique-key
tech: sql
title: "Primary Key vs Unique Key"
compares: [primary-key, unique-constraint]
gist:
  - "The row's id: unique, never NULL, one per table"
  - "A no-duplicates rule: many per table, NULLs allowed"
rows:
  - { aspect: "Per table", a: "Exactly one", b: "Any number" }
  - { aspect: "NULL", a: "Never; columns become NOT NULL", b: "Allowed, and many NULLs do not clash" }
  - { aspect: "Index", a: "Unique index; InnoDB keeps the rows in it", b: "Unique index; a secondary index in InnoDB" }
  - { aspect: "Foreign keys", a: "The usual target", b: "Can be a target too" }
  - { aspect: "Change NULL rule", a: "Not applicable", b: "PostgreSQL 15+: UNIQUE NULLS NOT DISTINCT" }
verdict: "Use the primary key for the row's identity; add UNIQUE for every other value that must not repeat, such as email."
sources:
  - title: "PostgreSQL 18 docs: 5.5 Constraints"
    url: "https://www.postgresql.org/docs/18/ddl-constraints.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7 Reference Manual: CREATE TABLE (PRIMARY KEY, UNIQUE)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/create-table.html"
    verifiedOn: "2026-10-20"
  - title: "MySQL 9.7 Reference Manual: Clustered and Secondary Indexes"
    url: "https://dev.mysql.com/doc/refman/9.7/en/innodb-index-types.html"
    verifiedOn: "2026-10-20"
  - title: "PostgreSQL 15 release notes"
    url: "https://www.postgresql.org/docs/release/15.0/"
    verifiedOn: "2026-10-20"
