topics:
  basics:
    - id: relational-databases
      children:
        - id: dbms
          label: DBMS
          note: Software that stores, queries and protects databases
        - id: rdbms
          label: RDBMS
          note: "A DBMS that keeps data in tables (relations): PostgreSQL, MySQL"
        - id: sql-language
          label: SQL
          note: The ISO/IEC 9075 standard language; each product has a dialect
        - id: tuple
          label: Table, row, column
          note: "Formal names: relation, tuple, attribute"
        - id: db-schema
          label: Schema
          note: "PostgreSQL: a namespace in a database; MySQL: same as a database"
    - id: sql-and-nosql
      children:
        - id: nosql
          label: NoSQL
          note: Non-relational stores; data shaped for the access pattern
          children:
            - id: document-database
              label: Document store
              note: "JSON-like documents; fields can differ per document: MongoDB"
            - id: key-value-store
              label: Key-value store
              note: "A value found by its key, held in memory: Redis"
            - id: wide-column-store
              label: Wide-column store
              note: "Partitioned wide-column rows, eventually consistent: Cassandra"
            - id: graph-database
              label: Graph database
              note: "Nodes, relationships and properties: Neo4j"
        - id: mongodb-transactions
          label: MongoDB transactions
          note: "Multi-document ACID: replica sets 4.0+, sharded clusters 4.2+"
    - id: keys
      children:
        - id: primary-key
          label: Primary key
          note: Unique and NOT NULL; only one per table
        - id: foreign-key
          label: Foreign key
          note: Must match a key in the referenced table, or be NULL
        - id: candidate-key
          label: Candidate key
          note: A minimal unique column set; the primary key is one of them
          children:
            - id: super-key
              label: Super key
              note: Any unique column set, even with extra columns
            - id: alternate-key
              label: Alternate key
              note: A candidate key not chosen as the primary key
        - id: composite-key
          label: Composite key
          note: A key made of two or more columns together
        - id: surrogate-key
          label: Surrogate key
          note: A generated id with no business meaning
        - id: natural-key
          label: Natural key
          note: A real-world unique value, such as an email
    - id: relationships
      children:
        - id: one-to-many-relationship
          label: One-to-many
          note: "FK on the many side: orders.user_id references users.id"
        - id: one-to-one-relationship
          label: One-to-one
          note: FK with a UNIQUE constraint, so one child per parent
        - id: many-to-many-relationship
          label: Many-to-many
          note: "Two FKs in a separate table (PostgreSQL docs: order_items)"
          children:
            - id: junction-table
              label: Junction table
              note: Holds both FKs, often as a composite primary key
        - id: self-referencing-key
          label: Self-referencing FK
          note: "References its own table, for trees: employees.manager_id"
    - id: data-types
      children:
        - id: numeric-type
          label: NUMERIC / DECIMAL
          note: Exact decimal digits; the same type in PostgreSQL
        - id: float-types
          label: REAL / DOUBLE PRECISION
          note: Inexact IEEE 754 floats, 4 and 8 bytes
        - id: character-types
          label: CHAR / VARCHAR / TEXT
          note: CHAR(n) pads with spaces; PostgreSQL docs prefer text or varchar
        - id: timestamptz
          label: timestamptz
          note: "PostgreSQL: stored as UTC, shown in the session time zone"
        - id: jsonb
          label: JSON / JSONB
          note: "PostgreSQL: json keeps the text; jsonb is binary and indexable"
    - id: constraints
      children:
        - id: not-null-constraint
          label: NOT NULL
          note: The column must have a value
        - id: unique-constraint
          label: UNIQUE
          note: No two rows equal on the columns; NULLs do not clash by default
        - id: check-constraint
          label: CHECK
          note: Row rule; passes when true or NULL; MySQL enforces since 8.0.16
        - id: fk-actions
          label: ON DELETE / ON UPDATE actions
          note: "Child rows on parent change: CASCADE, SET NULL, RESTRICT, NO ACTION"
          children:
            - id: on-delete-cascade
              label: ON DELETE CASCADE
              note: Deleting the parent deletes its child rows
            - id: restrict-action
              label: RESTRICT / NO ACTION
              note: Refuse while children exist; NO ACTION is the default
    - id: postgresql-and-mysql
      children:
        - id: postgresql-18
          label: PostgreSQL 18
          note: Current major (18.6), supported until November 2030
        - id: mysql-9-7
          label: MySQL 9.7 LTS
          note: LTS like 8.4; 26.7 (July 2026) is an Innovation release
        - id: storage-engine
          label: Storage engine
          note: "MySQL: pluggable layer that stores a table's data"
          children:
            - id: innodb
              label: InnoDB
              note: "MySQL's default engine: ACID, row-level locks, foreign keys"
        - id: postgresql-extension
          label: Extensions
          note: "PostgreSQL add-ons via CREATE EXTENSION: pg_trgm, pgcrypto"
        - id: mysql-double-pipe
          label: "|| operator"
          note: "MySQL: logical OR by default (deprecated); PostgreSQL: joins strings"
  querying:
    - id: sql-commands
      children:
        - id: ddl
          label: DDL
          note: "CREATE, ALTER, DROP, TRUNCATE: define and change objects"
        - id: dml
          label: DML
          note: "INSERT, UPDATE, DELETE: change rows"
        - id: delete-statement
          label: DELETE
          note: Removes rows matching WHERE; no WHERE removes all rows
        - id: truncate-statement
          label: TRUNCATE
          note: Empties a table without scanning it; MySQL commits implicitly
        - id: drop-table
          label: DROP TABLE
          note: Removes the table with its indexes, triggers and constraints
    - id: select-and-filtering
      children:
        - id: where-clause
          label: WHERE
          note: Keeps only rows for which the condition is true
        - id: like-operator
          label: LIKE
          note: "% matches any run of characters, _ exactly one"
        - id: order-by-clause
          label: ORDER BY
          note: ASC by default; without it the row order is unspecified
        - id: limit-offset
          label: LIMIT / OFFSET
          note: "Skip OFFSET rows, return LIMIT rows; standard: FETCH FIRST"
        - id: case-expression
          label: CASE
          note: Returns the result of the first WHEN that is true, else ELSE
    - id: query-order
      children:
        - id: column-alias
          label: Column alias (AS)
          note: A SELECT name; not visible in WHERE, which runs first
        - id: mysql-alias-extension
          label: MySQL alias extension
          note: MySQL also allows SELECT aliases in GROUP BY and HAVING
    - id: null-handling
      children:
        - id: three-valued-logic
          label: TRUE / FALSE / UNKNOWN
          note: NULL in a comparison gives UNKNOWN; FALSE AND UNKNOWN is FALSE
        - id: coalesce
          label: COALESCE
          note: Returns the first non-NULL argument; NULL only if all are NULL
        - id: null-safe-equal
          label: IS NOT DISTINCT FROM / <=>
          note: "NULL-safe equality: NULL vs NULL is true; <=> is MySQL's form"
        - id: nulls-sort-order
          label: NULLS FIRST / LAST
          note: "ASC: PostgreSQL puts NULLs last, MySQL puts them first"
    - id: aggregates-group-by
      children:
        - id: count-star
          label: COUNT(*)
          note: Counts input rows, NULLs included
        - id: count-column
          label: COUNT(column)
          note: Counts rows where the column is not NULL
        - id: having-clause
          label: HAVING
          note: Filters groups after GROUP BY; may use aggregates
        - id: only-full-group-by
          label: ONLY_FULL_GROUP_BY (MySQL)
          note: "On by default: rejects ungrouped, unaggregated columns"
    - id: joins
      children:
        - id: inner-join
          label: INNER JOIN
          note: One row for each pair of rows that meets the ON condition
        - id: left-join
          label: LEFT JOIN
          note: Inner join plus unmatched left rows, right columns NULL
        - id: right-join
          label: RIGHT JOIN
          note: Mirror of LEFT; MySQL advises LEFT JOIN for portability
        - id: full-outer-join
          label: FULL OUTER JOIN
          note: Keeps unmatched rows of both sides; MySQL lacks it
        - id: cross-join
          label: CROSS JOIN
          note: "Every pairing: N rows times M rows"
        - id: self-join
          label: Self join
          note: A table joined to itself under two aliases
    - id: subqueries
      children:
        - id: in-subquery
          label: IN (subquery)
          note: True if the value equals any row the subquery returns
        - id: exists-subquery
          label: EXISTS
          note: True if the subquery returns at least one row
        - id: correlated-subquery
          label: Correlated subquery
          note: Refers to a column of a table in the outer query
        - id: derived-table
          label: Derived table
          note: A subquery in FROM; standard SQL requires an alias
    - id: set-operations
      children:
        - id: union-op
          label: UNION
          note: Rows in either result, duplicates removed
        - id: union-all
          label: UNION ALL
          note: Rows in either result, duplicates kept
        - id: intersect-op
          label: INTERSECT
          note: Rows in both results; MySQL since 8.0.31
        - id: except-op
          label: EXCEPT
          note: Rows in the first result only; MySQL since 8.0.31
    - id: window-functions
      children:
        - id: partition-by
          label: PARTITION BY
          note: Splits rows into groups for the window; rows are not merged
        - id: row-number
          label: ROW_NUMBER()
          note: 1, 2, 3 in order; tied rows still get different numbers
        - id: rank-function
          label: RANK()
          note: "Ties share a rank, then a gap: 1, 1, 3"
        - id: dense-rank
          label: DENSE_RANK()
          note: "Ties share a rank, no gap: 1, 1, 2"
        - id: lag-lead
          label: LAG / LEAD
          note: Value from the row before or after; offset 1, NULL if none
        - id: window-frame
          label: Window frame (ROWS / RANGE)
          note: ROWS counts positions; RANGE also takes rows tied with the current
    - id: ctes
      children:
        - id: recursive-cte
          label: WITH RECURSIVE
          note: Anchor term, UNION or UNION ALL, then a self-referencing term
        - id: cte-materialized
          label: MATERIALIZED / NOT MATERIALIZED
          note: "PostgreSQL: choose whether a CTE is computed apart or inlined"
        - id: cycle-clause
          label: CYCLE (PostgreSQL 14+)
          note: Marks rows that revisit a node so recursion stops
        - id: cte-max-recursion-depth
          label: cte_max_recursion_depth (MySQL)
          note: Default 1000; deeper recursion ends with an error
  design:
    - id: normalization
      children:
        - id: first-normal-form
          label: 1NF
          note: "Example: 'pen, book' in one cell breaks it"
        - id: second-normal-form
          label: 2NF
          note: Only matters when the key has two or more columns
        - id: third-normal-form
          label: 3NF
          note: "Example: user_email in orders depends on user_id"
        - id: bcnf
          label: BCNF
          note: "Boyce-Codd normal form: a stricter version of 3NF"
        - id: normalization-anomalies
          label: Anomalies
          note: The three problems that normalisation prevents
          children:
            - id: update-anomaly
              label: Update anomaly
              note: A new email must be written into every order row
            - id: insertion-anomaly
              label: Insertion anomaly
              note: A user cannot be saved until they place an order
            - id: deletion-anomaly
              label: Deletion anomaly
              note: Deleting a user's last order also loses the user
    - id: denormalization
      children:
        - id: copied-column
          label: Copied column
          note: orders.user_name kept next to user_id to skip a join
        - id: summary-table
          label: Summary table
          note: Precomputed totals, such as daily sales, rebuilt by a job
    - id: id-generation
      children:
        - id: identity-column
          label: IDENTITY column
          note: SQL standard; PostgreSQL 10+; ALWAYS or BY DEFAULT
        - id: serial-type
          label: SERIAL / BIGSERIAL
          note: "PostgreSQL shortcut: a sequence plus a column default"
        - id: sequence-object
          label: Sequence
          note: nextval() values are never rolled back, so gaps appear
        - id: auto-increment
          label: AUTO_INCREMENT
          note: "MySQL: a counter per InnoDB table; lost values are not reused"
        - id: uuid-key
          label: UUID key
          note: 128 bits; unique without a central counter
          children:
            - id: uuid-v4
              label: UUIDv4
              note: Random; PostgreSQL gen_random_uuid() or uuidv4()
            - id: uuid-v7
              label: UUIDv7
              note: Unix time in ms first; PostgreSQL 18 uuidv7()
    - id: views
      children:
        - id: plain-view
          label: View
          note: Stores the SELECT only; it runs each time the view is used
          children:
            - id: updatable-view
              label: Updatable view
              note: One table; no GROUP BY, DISTINCT or LIMIT at the top
        - id: materialized-view
          label: Materialized view
          note: Stored result; read-only; can be indexed (PostgreSQL)
          children:
            - id: refresh-concurrently
              label: REFRESH ... CONCURRENTLY
              note: Reads not blocked; needs a unique index on plain columns
    - id: stored-procedures-triggers
      children:
        - id: stored-procedure
          label: Stored procedure
          note: CREATE PROCEDURE, run with CALL; PostgreSQL 11+
        - id: user-defined-function
          label: Function
          note: CREATE FUNCTION; called from inside a query
        - id: db-trigger
          label: Trigger
          note: BEFORE or AFTER INSERT, UPDATE or DELETE
          children:
            - id: row-level-trigger
              label: FOR EACH ROW
              note: Once per changed row; the only kind in MySQL
            - id: statement-level-trigger
              label: FOR EACH STATEMENT
              note: "PostgreSQL: once per statement, even if no row changes"
            - id: instead-of-trigger
              label: INSTEAD OF trigger
              note: "PostgreSQL: on a view; writes to the base tables instead"
    - id: oltp-and-olap
      children:
        - id: oltp
          label: OLTP
          note: "The app's live database: orders, payments, profiles"
        - id: olap
          label: OLAP
          note: Reports and trends over large amounts of history
          children:
            - id: data-warehouse
              label: Data warehouse
              note: Data from many sources, kept for analysis
            - id: column-store
              label: Column store
              note: Each column stored together; built for big scans
            - id: star-schema
              label: Star schema
              note: Fact table in the middle, dimension tables around it
              children:
                - id: fact-table
                  label: Fact table
                  note: Events with numbers, such as sales; grows over time
                - id: dimension-table
                  label: Dimension table
                  note: "Date, product, store: used to filter and group"
        - id: etl
          label: ETL / ELT
          note: ELT transforms inside the target store, not before it
  indexes:
    - id: indexes
      children:
        - id: auto-created-indexes
          label: Indexes made for you
          note: PRIMARY KEY and UNIQUE always; FK columns only in MySQL InnoDB
        - id: index-write-cost
          label: Write cost
          note: Every INSERT, UPDATE and DELETE also updates each index
        - id: create-index-concurrently
          label: CREATE INDEX CONCURRENTLY
          note: "PostgreSQL: builds without blocking writes; a plain build blocks them"
    - id: index-types
      children:
        - id: btree-index
          label: B-tree
          note: "The default: =, <, >, BETWEEN, IN, IS NULL; PG LIKE 'abc%' needs C collation"
        - id: hash-index
          label: Hash
          note: "PostgreSQL: stores a 32-bit hash code, so = only"
        - id: gin-index
          label: GIN
          note: "Inverted index: one entry per element; arrays, JSONB, full-text"
        - id: gist-index
          label: GiST and SP-GiST
          note: Frameworks for geometry and nearest-neighbour search
        - id: brin-index
          label: BRIN
          note: Min and max per block range; for columns in physical order
        - id: index-variants
          label: Unique, partial, expression
          note: Options added to an index, not separate structures
          children:
            - id: unique-index
              label: Unique index
              note: Rejects duplicate keys; NULLs count as distinct by default
            - id: partial-index
              label: Partial index
              note: "PostgreSQL: CREATE INDEX ... WHERE; only matching rows"
            - id: expression-index
              label: Expression index
              note: Indexes lower(email); MySQL functional key part since 8.0.13
    - id: clustered-indexes
      children:
        - id: clustered-index
          label: Clustered index (InnoDB)
          note: The table itself, stored in PRIMARY KEY order
          children:
            - id: gen-clust-index
              label: GEN_CLUST_INDEX
              note: Hidden clustered index on a 6-byte row id when no key fits
        - id: secondary-index
          label: Secondary index
          note: "InnoDB: entries hold the PK, then the clustered index is searched"
        - id: postgresql-heap
          label: Heap (PostgreSQL)
          note: Rows in no key order; every index is stored separately
          children:
            - id: cluster-command
              label: CLUSTER
              note: Sorts the table once by an index; later writes are not sorted
    - id: composite-indexes
      children:
        - id: leftmost-prefix
          label: Leftmost prefix
          note: (a, b, c) serves a; a, b; and a, b, c
        - id: skip-scan
          label: Skip scan
          note: Seeks each value of a missing first column; MySQL 8.0.13+, PG 18
        - id: covering-index
          label: Covering index
          note: Holds every column the query reads, so no table visit
          children:
            - id: include-columns
              label: INCLUDE columns
              note: "PostgreSQL 11+: payload columns stored but not searched"
    - id: index-not-used
      children:
        - id: selectivity
          label: Selectivity
          note: Fraction of rows a condition keeps; times rows = estimate
        - id: cardinality
          label: Cardinality
          note: Number of distinct values; MySQL SHOW INDEX estimates it
        - id: planner-statistics
          label: Statistics (ANALYZE)
          note: Refreshed by ANALYZE; autovacuum and InnoDB also do it
        - id: leading-wildcard
          label: LIKE '%x'
          note: A B-tree cannot seek it; a PostgreSQL pg_trgm index can
    - id: explain-query-plans
      children:
        - id: explain-analyze
          label: EXPLAIN ANALYZE
          note: Runs the statement; adds actual rows and time per step
        - id: seq-scan
          label: Seq Scan (MySQL type ALL)
          note: Reads every row of the table
        - id: index-scan
          label: Index Scan
          note: Walks the index, then fetches each matching row
        - id: index-only-scan
          label: Index Only Scan
          note: Answers from the index; PostgreSQL checks the visibility map
        - id: bitmap-scan
          label: Bitmap Heap Scan
          note: Collects row locations first, then reads pages in order
        - id: join-methods
          label: Join methods
          note: How the planner joins two inputs
          children:
            - id: nested-loop-join
              label: Nested loop
              note: Scans the inner side once per outer row; good with an index
            - id: hash-join
              label: Hash join
              note: Builds a hash table on one side, probes it with the other
            - id: merge-join
              label: Merge join
              note: Sorts both sides on the key, then merges them in one pass
    - id: query-optimization
      children:
        - id: pg-stat-statements
          label: pg_stat_statements
          note: "PostgreSQL module: calls and time per statement"
        - id: slow-query-log
          label: Slow query log
          note: "MySQL: statements over long_query_time (default 10 s)"
    - id: pagination
      children:
        - id: offset-pagination
          label: OFFSET pagination
          note: "LIMIT 20 OFFSET 40: skipped rows are still computed"
        - id: keyset-pagination
          label: Keyset pagination
          note: Rows after the last seen key; also called the seek method
  transactions:
    - id: transactions
      children:
        - id: start-transaction
          label: BEGIN / START TRANSACTION
          note: BEGIN is an alias; START TRANSACTION is the SQL-standard form
        - id: savepoint
          label: SAVEPOINT / ROLLBACK TO
          note: ROLLBACK TO frees later row locks in PostgreSQL, not in InnoDB
        - id: autocommit
          label: Autocommit
          note: Each statement is atomic, as if wrapped in BEGIN and COMMIT
        - id: implicit-commit
          label: Implicit commit (MySQL DDL)
          note: CREATE TEMPORARY TABLE and DROP TEMPORARY TABLE do not commit
    - id: acid
      children:
        - id: atomicity
          label: Atomicity
          note: After a crash, no partial results of a transaction are visible
        - id: consistency-acid
          label: Consistency (ACID)
          note: A deferred constraint still broken at COMMIT rolls it all back
        - id: isolation-acid
          label: Isolation
          note: Chosen per transaction with SET TRANSACTION ISOLATION LEVEL
        - id: durability
          label: Durability
          note: "MySQL: also depends on innodb_flush_log_at_trx_commit and sync_binlog"
    - id: isolation-levels
      children:
        - id: read-anomalies
          label: Read anomalies
          note: Isolation levels are defined by which of these they rule out
          children:
            - id: dirty-read
              label: Dirty read
              note: Seeing data from a transaction that has not committed
            - id: non-repeatable-read
              label: Non-repeatable read
              note: A re-read row shows another transaction's committed change
            - id: phantom-read
              label: Phantom read
              note: InnoDB next-key locks stop phantoms for locking reads
            - id: lost-update
              label: Lost update
              note: PostgreSQL REPEATABLE READ prevents it by aborting the later writer
            - id: write-skew
              label: Write skew
              note: Allowed by snapshot isolation; PostgreSQL SERIALIZABLE aborts one side
        - id: isolation-level-list
          label: The four levels
          note: Weakest to strongest, as the SQL standard defines them
          children:
            - id: read-uncommitted
              label: READ UNCOMMITTED
              note: PostgreSQL runs it as READ COMMITTED
            - id: read-committed
              label: READ COMMITTED
              note: Each statement sees only data committed before it began
            - id: repeatable-read
              label: REPEATABLE READ
              note: Every plain read in the transaction uses one snapshot
            - id: serializable
              label: SERIALIZABLE
              note: "InnoDB: plain SELECT becomes FOR SHARE when autocommit is off"
    - id: mvcc
      children:
        - id: mvcc-snapshot
          label: Snapshot
          note: Shows commits made before it was taken, plus your own changes
        - id: dead-tuple
          label: Dead tuple (PostgreSQL)
          note: UPDATE and DELETE leave the old row version in the table
        - id: vacuum
          label: VACUUM (PostgreSQL)
          note: Marks dead space reusable; rarely gives it back to the OS
          children:
            - id: autovacuum
              label: Autovacuum
              note: On by default; runs even when off to prevent ID wraparound
            - id: xid-wraparound
              label: Transaction ID wraparound
              note: "IDs are 32-bit: vacuum each table within 2 billion transactions"
        - id: undo-log
          label: Undo log (InnoDB)
          note: Used both to roll back and to rebuild old versions for reads
    - id: locking
      children:
        - id: shared-lock
          label: Shared (S) lock
          note: Taken by SELECT … FOR SHARE; MySQL also accepts LOCK IN SHARE MODE
        - id: exclusive-lock
          label: Exclusive (X) lock
          note: A PostgreSQL UPDATE of non-key columns takes FOR NO KEY UPDATE
        - id: table-lock
          label: Table-level lock
          note: PostgreSQL ACCESS EXCLUSIVE (DROP, TRUNCATE) blocks even SELECT
        - id: innodb-index-locks
          label: Record, gap and next-key locks (InnoDB)
          note: A record lock locks an index record, not the row itself
          children:
            - id: gap-lock
              label: Gap lock
              note: Locks the space between index records; only blocks inserts
            - id: next-key-lock
              label: Next-key lock
              note: Record lock plus the gap before it; used for scans in REPEATABLE READ
        - id: skip-locked
          label: NOWAIT / SKIP LOCKED
          note: NOWAIT errors at once; SKIP LOCKED gives an inconsistent view
        - id: lock-wait-timeout
          label: Lock wait timeout
          note: InnoDB gives up after 50 s; PostgreSQL lock_timeout 0 = no limit
    - id: optimistic-pessimistic-locking
      children:
        - id: pessimistic-locking
          label: Pessimistic locking
          note: "JPA: LockModeType.PESSIMISTIC_WRITE locks the row in the database"
        - id: optimistic-locking
          label: Optimistic locking
          note: JPA throws OptimisticLockException and rolls the transaction back
          children:
            - id: version-column
              label: Version column
              note: "JPA 3.2 @Version: int, short, long, wrappers, Instant, LocalDateTime, Timestamp"
        - id: atomic-update
          label: Atomic conditional UPDATE
          note: READ COMMITTED re-checks the WHERE on the newest row version
    - id: deadlocks
      children:
        - id: pg-deadlock-detection
          label: Detection (PostgreSQL)
          note: Checks only after waiting deadlock_timeout, 1 s by default
        - id: innodb-deadlock-detect
          label: Detection (InnoDB)
          note: On by default; busy servers may turn it off and rely on timeouts
        - id: lock-ordering
          label: Same lock order
          note: With one order, transactions queue instead of forming a cycle
    - id: wal
      children:
        - id: redo-log
          label: Redo log (InnoDB)
          note: Replayed at startup, before connections are accepted
        - id: binary-log
          label: Binary log (MySQL)
          note: Skips SELECT and SHOW; synced to disk before each commit by default
        - id: synchronous-commit
          label: synchronous_commit (PostgreSQL)
          note: "off: reply before the WAL flush; at risk up to 3 × wal_writer_delay"
  backend:
    - id: connection-pooling
      children:
        - id: hikaricp
          label: HikariCP
          note: Spring Boot's first choice of JDBC pool when it is present
        - id: maximum-pool-size
          label: maximumPoolSize
          note: Most connections the pool opens, idle or in use; default 10
        - id: connection-timeout
          label: connectionTimeout
          note: How long a caller waits for a connection; default 30 s
        - id: connection-leak
          label: Connection leak
          note: Borrowed and never closed; leakDetectionThreshold logs it
        - id: pgbouncer
          label: PgBouncer
          note: "External PostgreSQL pooler: session, transaction or statement mode"
    - id: sql-injection
      children:
        - id: jdbc-statement
          label: Statement + concatenation
          note: Runs SQL text built from strings; input can become code
        - id: prepared-statement
          label: PreparedStatement
          note: SQL with ? placeholders; values are bound separately
        - id: allowlist
          label: Allowlist for names
          note: Table, column or sort names picked from a fixed list
        - id: least-privilege
          label: Least privilege
          note: The app's DB user gets only the rights it needs, never admin
        - id: input-validation
          label: Input validation
          note: A second layer; it does not replace parameters
    - id: orm-jpa
      children:
        - id: jdbc-api
          label: JDBC
          term: jdbc
          note: Java's low-level API to send SQL and read results
        - id: jakarta-persistence
          label: JPA (Jakarta Persistence)
          term: jpa
          note: The ORM specification; version 3.2 is current
        - id: hibernate-orm
          label: Hibernate ORM
          term: hibernate
          note: A full JPA implementation; 7.4 is the latest stable series
        - id: spring-data-jpa
          label: Spring Data JPA
          note: Generates repositories; method names become queries
        - id: persistence-context
          label: Persistence context
          note: One managed object per row; changes written at commit
        - id: fetch-type
          label: FetchType
          note: LAZY is a hint to the provider; EAGER is a requirement
          children:
            - id: lazy-loading
              label: LAZY
              note: Loaded on first access; default for @OneToMany, @ManyToMany
            - id: eager-loading
              label: EAGER
              note: Loaded with the owner; default for @ManyToOne, @OneToOne
    - id: n-plus-one
      children:
        - id: join-fetch
          label: JOIN FETCH
          note: JPQL join that loads the association in the same query
        - id: entity-graph
          label: "@EntityGraph"
          note: Names the associations to fetch for one repository method
        - id: batch-fetching
          label: Batch fetching
          note: Loads lazy rows by a batch of keys; off by default in Hibernate
        - id: dto-projection
          label: DTO projection
          note: Selects only the fields a view needs into a plain class
        - id: sql-logging
          label: SQL logging
          note: spring.jpa.show-sql=true prints each statement; default false
    - id: caching-redis
      children:
        - id: cache-aside
          label: Cache-aside
          note: App reads cache, fills it on a miss, deletes the key on write
        - id: ttl
          label: TTL
          note: EXPIRE sets it; the key is deleted automatically when it ends
        - id: redis
          label: Redis
          note: In-memory key-value store with rich data types
          children:
            - id: redis-sessions
              label: Session store
              note: Spring Session can keep HTTP sessions in Redis
            - id: redis-rate-limiter
              label: Counters and rate limits
              note: INCR is atomic; with EXPIRE it counts per time window
            - id: redis-distributed-lock
              label: Distributed lock
              note: SET key val NX PX; a failover can break it (async replication)
            - id: redis-pub-sub
              label: Pub/Sub
              note: Pushes messages to subscribers; at-most-once delivery
            - id: redis-persistence
              label: RDB and AOF
              note: "RDB: periodic snapshots; AOF: log of every write"
    - id: upsert
      children:
        - id: on-conflict
          label: ON CONFLICT DO UPDATE / DO NOTHING
          note: PostgreSQL upsert; atomic even under high concurrency
        - id: on-duplicate-key-update
          label: ON DUPLICATE KEY UPDATE
          note: MySQL upsert, fired by a duplicate unique or primary key
        - id: merge-statement
          label: MERGE
          note: "PostgreSQL 15+: insert, update or delete rows from a source"
        - id: returning-clause
          label: RETURNING
          note: "PostgreSQL: returns changed rows; old and new values in 18+"
        - id: insert-ignore
          label: INSERT IGNORE
          note: "MySQL: skips duplicate rows but also other ignorable errors"
  scaling:
    - id: replication
      children:
        - id: primary-replica
          label: Primary and replicas
          note: One primary takes writes; replicas apply its log and serve reads
        - id: synchronous-replication
          label: Synchronous replication
          note: "PostgreSQL: list the standby in synchronous_standby_names"
          children:
            - id: semi-synchronous-replication
              label: Semisynchronous (MySQL)
              note: Commit waits until at least one replica has logged it
        - id: asynchronous-replication
          label: Asynchronous replication
          note: The default; PostgreSQL lag is typically under one second
        - id: streaming-replication
          label: Streaming replication (PostgreSQL)
          note: "Physical: the standby replays the WAL; whole server only"
        - id: logical-replication
          label: Logical replication (PostgreSQL)
          note: Publish and subscribe per table; works across major versions
        - id: binlog-replication
          label: Binary log replication (MySQL)
          note: Replicas pull the source's binlog; GTIDs track each transaction
    - id: partitioning
      children:
        - id: range-partitioning
          label: Range partitioning
          note: One range per partition, such as a month of orders
        - id: list-partitioning
          label: List partitioning
          note: Listed values per partition, such as region IN ('north', 'east')
        - id: hash-partitioning
          label: Hash partitioning
          note: A hash of the key spreads rows evenly; MySQL also has KEY
        - id: partition-pruning
          label: Partition pruning
          note: On by default in PostgreSQL (enable_partition_pruning)
    - id: sharding
      children:
        - id: shard-key
          label: Shard key
          note: Avoid rising ids, few distinct values, or often-changed columns
        - id: range-sharding
          label: Range-based sharding
          note: Key ranges per shard; easy range queries, uneven load
        - id: hash-sharding
          label: Hash-based sharding
          note: Even load, no map to keep; adding shards moves data
          children:
            - id: consistent-hashing
              label: Consistent hashing
              note: Used so that a new shard takes keys without a full reshuffle
        - id: directory-sharding
          label: Directory (lookup) sharding
          note: A map from key to shard; flexible, costs a lookup
        - id: hot-shard
          label: Hot shard
          note: One shard gets far more load than the rest
        - id: sharding-tools
          label: Vitess and Citus
          note: Vitess shards MySQL; Citus is a PostgreSQL extension
    - id: cap-theorem
      children:
        - id: network-partition
          label: Network partition
          note: Nodes keep running but messages between them are lost
        - id: cp-system
          label: CP system
          note: "Refuses some requests in a partition to stay consistent: HBase"
        - id: ap-system
          label: AP system
          note: "Keeps answering in a partition, maybe stale: Cassandra default"
        - id: strong-consistency
          label: Strong consistency
          note: After an update, every later read returns the new value
        - id: eventual-consistency
          label: Eventual consistency
          note: "Example: DNS; old values may show for a short window"
        - id: pacelc
          label: PACELC
          note: "Abadi, 2012: Dynamo and Cassandra are PA/EL; HBase is PC/EC"
    - id: distributed-transactions
      children:
        - id: two-phase-commit
          label: Two-phase commit (2PC)
          note: "Phase 1: all prepare; phase 2: all commit or all roll back"
          children:
            - id: prepare-transaction
              label: PREPARE TRANSACTION (PostgreSQL)
              note: For transaction managers; finish with COMMIT PREPARED
            - id: xa-transactions
              label: XA transactions (MySQL)
              note: XA START, XA END, XA PREPARE, XA COMMIT; InnoDB supports it
        - id: saga
          label: Saga
          note: Each step commits locally; later steps can trigger undo steps
          children:
            - id: choreography-saga
              label: Choreography
              note: Each service reacts to the event of the step before
            - id: orchestration-saga
              label: Orchestration
              note: One orchestrator tells each service what to do next
            - id: compensating-transaction
              label: Compensating transaction
              note: "Example: refund the payment when shipping fails"
        - id: transactional-outbox
          label: Transactional outbox
          note: Relay by polling the table or by tailing the transaction log
    - id: backup-recovery
      children:
        - id: logical-backup
          label: Logical backup
          note: pg_dump output loads into newer PostgreSQL versions
        - id: physical-backup
          label: Physical backup
          note: pg_basebackup, MySQL Enterprise Backup; version-specific
        - id: point-in-time-recovery
          label: Point-in-time recovery (PITR)
          note: "PostgreSQL: recovery_target_time; MySQL: mysqlbinlog --stop-datetime"
        - id: failover
          label: Failover
          note: "PostgreSQL: pg_ctl promote or pg_promote(); fence the old primary"
        - id: rpo
          label: RPO
          note: Sets how often to back up or ship the log
        - id: rto
          label: RTO
          note: Sets how fast restore or failover must be
    - id: scaling-ladder
      children:
        - id: vertical-scaling
          label: Scale up (vertical)
          note: More CPU, memory, disk on one server; has a hardware ceiling
        - id: horizontal-scaling
          label: Scale out (horizontal)
          note: "More servers: replicas for reads, shards for writes"
  patterns:
    - id: sql-problem-approach
      children:
        - id: grain-step
          label: Output grain first
          note: Decide what one result row stands for before writing SQL
        - id: where-then-having-step
          label: WHERE, then HAVING
          note: WHERE drops rows before grouping; HAVING drops groups after
        - id: rank-then-filter-step
          label: Rank inside, filter outside
          note: Window calls are allowed only in the SELECT list and ORDER BY
        - id: edge-case-step
          label: Edge-case check
          note: COUNT(col) skips NULLs; SUM over no rows is NULL
    - id: top-n-per-group
      children:
        - id: max-below-max
          label: MAX below MAX
          note: Second highest distinct value; NULL when there is none
        - id: limit-offset-nth
          label: DISTINCT … LIMIT 1 OFFSET N-1
          note: Nth distinct value; as a scalar subquery it gives NULL, not 0 rows
        - id: dense-rank-top-n
          label: DENSE_RANK() <= N
          note: Top N value levels per group; every tied row is kept
        - id: row-number-top-n
          label: ROW_NUMBER() = 1
          note: Exactly one row per group; add a unique tie-breaker to ORDER BY
        - id: distinct-on-pg
          label: DISTINCT ON (PostgreSQL)
          note: Keeps the first row of each group in ORDER BY order
        - id: fetch-with-ties
          label: FETCH FIRST n ROWS WITH TIES
          note: "PostgreSQL: the top n rows plus any tied with the last one"
    - id: duplicates
      children:
        - id: group-having-dups
          label: GROUP BY … HAVING COUNT(*) > 1
          note: One output row per repeated value; NULLs form one group
        - id: count-over-dups
          label: COUNT(*) OVER (PARTITION BY …)
          note: Keeps every row and shows how many share its value
        - id: row-number-delete
          label: Delete ROW_NUMBER() > 1
          note: "MySQL allows it: a window makes the derived table materialised"
        - id: self-join-delete
          label: Self-join delete
          note: PostgreSQL DELETE … USING; MySQL DELETE u FROM u JOIN …
        - id: unique-prevent
          label: UNIQUE constraint
          note: Blocks new copies; by default still allows many NULLs
    - id: anti-join-pattern
      children:
        - id: not-exists-anti
          label: NOT EXISTS
          note: True when the subquery returns no rows
        - id: left-join-is-null
          label: LEFT JOIN … IS NULL
          note: Unmatched rows get NULLs in every right-side column
        - id: not-in-null
          label: NOT IN
          note: Never true when the subquery returns a NULL
        - id: exists-semi
          label: EXISTS (semi-join)
          note: Has at least one match; each outer row returned once
        - id: except-diff
          label: EXCEPT
          note: Rows in the first result not in the second; duplicates removed
    - id: running-totals-and-streaks
      children:
        - id: running-sum
          label: Running total
          note: SUM() OVER (ORDER BY …) with a ROWS frame up to the current row
        - id: moving-average-frame
          label: Moving average
          note: ROWS BETWEEN 2 PRECEDING AND CURRENT ROW averages 3 rows
        - id: range-interval-frame
          label: RANGE with an interval
          note: Frame by value, such as the last 7 days, not the last 7 rows
        - id: lag-difference
          label: LAG() difference
          note: LAG defaults to 1 row back and NULL when there is no row
        - id: date-minus-row-number
          label: Date minus ROW_NUMBER()
          note: "PostgreSQL: date - integer gives a date; MySQL uses DATE_SUB"
    - id: group-aggregation-patterns
      children:
        - id: case-pivot
          label: SUM(CASE WHEN … END)
          note: "Portable pivot: one aggregate per output column"
        - id: filter-clause-pivot
          label: COUNT(*) FILTER (WHERE …)
          note: "PostgreSQL: only rows where the filter is true reach the aggregate"
        - id: left-join-count
          label: LEFT JOIN + COUNT(child.id)
          note: COUNT(expr) counts non-NULL values, so empty parents show 0
        - id: coalesce-sum
          label: COALESCE(SUM(…), 0)
          note: SUM returns NULL when there are no rows to add
        - id: scalar-avg-compare
          label: Above the overall average
          note: "Compare with a scalar subquery: (SELECT AVG(x) FROM t)"
        - id: partition-avg-compare
          label: Above the group average
          note: AVG() OVER (PARTITION BY g) keeps rows, unlike GROUP BY
