      title: JVMS SE 25, 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-19
  - id: jvm-stack
    term: Stack (JVM)
    aka:
      - JVM stack
      - thread stack
    definition: A per-thread memory area that holds one frame for each method call in progress.
    see: jvm-memory
    source:
      title: JVMS SE 25, 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-19
  - id: stack-frame
    term: Stack frame
    aka:
      - method frame
    definition: "The space for one method call: its local variables and operand stack; removed when the call ends."
    see: jvm-memory
    source:
      title: JVMS SE 25, 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-19
  - id: metaspace
    term: Metaspace
    definition: HotSpot's native-memory area for class metadata, used since Java 8 instead of PermGen.
    see: jvm-memory
    source:
      title: "Troubleshooting Guide (Java SE 25): Troubleshoot Memory Leaks"
      url: https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshooting-memory-leaks.html
      verifiedOn: 2026-10-19
  - id: permgen
    term: PermGen
    aka:
      - permanent generation
    definition: The part of the HotSpot heap that held class metadata until Java 8 removed it.
    see: jvm-memory
    source:
      title: "JEP 122: Remove the Permanent Generation"
      url: https://openjdk.org/jeps/122
      verifiedOn: 2026-10-19
  - id: method-area
    term: Method area
    definition: "The JVM spec's shared area for per-class data: constant pool, fields and method code."
    see: jvm-memory
    source:
      title: JVMS SE 25, 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-19
  - id: pc-register
    term: PC register
    aka:
      - program counter register
    definition: A per-thread register holding the address of the bytecode instruction being run.
    see: jvm-memory
    source:
      title: JVMS SE 25, 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-19
  - id: garbage-collection-term
    term: Garbage collection
    aka:
      - garbage collector
    definition: Automatic reclaiming of heap memory used by objects the program can no longer reach.
    see: garbage-collection
    source:
      title: "HotSpot GC Tuning Guide (Java SE 25): Garbage Collector Implementation"
      url: https://docs.oracle.com/en/java/javase/25/gctuning/garbage-collector-implementation.html
      verifiedOn: 2026-10-19
  - id: gc-roots
    term: GC roots
    aka:
      - GC root
    definition: References the collector treats as live, such as running threads, their locals and loaded classes.
    see: garbage-collection
    source:
      title: Garbage Collection Roots (Eclipse Memory Analyzer help)
      url: https://help.eclipse.org/latest/topic/org.eclipse.mat.ui.help/concepts/gcroots.html
      verifiedOn: 2026-10-19
  - id: young-generation
    term: Young generation
    aka:
      - young gen
      - minor GC
    definition: The heap part where new objects start; a minor GC collects only this part.
    see: garbage-collection
    source:
      title: "HotSpot GC Tuning Guide (Java SE 25): Garbage Collector Implementation"
      url: https://docs.oracle.com/en/java/javase/25/gctuning/garbage-collector-implementation.html
      verifiedOn: 2026-10-19
  - id: old-generation
    term: Old generation
    aka:
      - tenured generation
      - major GC
    definition: The heap part for long-lived objects; a major GC collects the whole heap.
    see: garbage-collection
    source:
      title: "HotSpot GC Tuning Guide (Java SE 25): Garbage Collector Implementation"
      url: https://docs.oracle.com/en/java/javase/25/gctuning/garbage-collector-implementation.html
      verifiedOn: 2026-10-19
  - id: stop-the-world
    term: Stop-the-world pause
    aka:
      - stop-the-world
      - GC pause
    definition: A time when the collector stops the application threads to do its work.
    see: garbage-collection
    source:
      title: "HotSpot GC Tuning Guide (Java SE 25): Ergonomics"
      url: https://docs.oracle.com/en/java/javase/25/gctuning/ergonomics.html
      verifiedOn: 2026-10-19
  - id: g1-collector
    term: G1
    aka:
      - G1 GC
      - Garbage-First
    definition: HotSpot's region-based, mostly concurrent collector that aims to meet a pause-time goal.
    see: garbage-collection
    source:
      title: "HotSpot GC Tuning Guide (Java SE 25): Garbage-First (G1) Garbage Collector"
      url: https://docs.oracle.com/en/java/javase/25/gctuning/garbage-first-g1-garbage-collector1.html
      verifiedOn: 2026-10-19
  - id: zgc-collector
    term: ZGC
    aka:
      - Z Garbage Collector
    definition: A HotSpot low-latency collector with pauses under a millisecond.
    see: garbage-collection
    source:
      title: "HotSpot GC Tuning Guide (Java SE 25): Available Collectors"
      url: https://docs.oracle.com/en/java/javase/25/gctuning/available-collectors.html
      verifiedOn: 2026-10-19
  - id: memory-leak-java
    term: Memory leak (Java)
    aka:
      - memory leak
      - memory leaks
    definition: Objects the program no longer needs but still references, so the GC cannot free them.
    see: garbage-collection
    source:
      title: "Troubleshooting Guide (Java SE 25): Troubleshoot Memory Leaks"
      url: https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshooting-memory-leaks.html
      verifiedOn: 2026-10-19
  - id: thread-local
    term: ThreadLocal
    definition: A variable with a separate value per thread, kept while that thread is alive.
    see: garbage-collection
    source:
      title: ThreadLocal (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ThreadLocal.html
      verifiedOn: 2026-10-19
  - id: class-loader
    term: Class loader
    aka:
      - ClassLoader
      - class loaders
    definition: An object that finds a class's bytes and defines the class in the JVM.
    see: class-loading-jit
    source:
      title: ClassLoader (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ClassLoader.html
      verifiedOn: 2026-10-19
  - id: bootstrap-class-loader
    term: Bootstrap class loader
    definition: The class loader built into the JVM; it has no parent and loads the core classes.
    see: class-loading-jit
    source:
      title: ClassLoader (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ClassLoader.html
      verifiedOn: 2026-10-19
  - id: parent-delegation
    term: Parent delegation
    aka:
      - delegation model
    definition: A class loader asks its parent to load a class before trying itself.
    see: class-loading-jit
    source:
      title: ClassLoader (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ClassLoader.html
      verifiedOn: 2026-10-19
  - id: bytecode-verification
    term: Bytecode verification
    aka:
      - bytecode verifier
    definition: The linking step that checks a class file is structurally correct before it runs.
    see: class-loading-jit
    source:
      title: "JVMS SE 25, Chapter 5: Loading, Linking, and Initializing"
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html
      verifiedOn: 2026-10-19
  - id: jit-compiler
    term: JIT compiler
    aka:
      - JIT
      - just-in-time compiler
    definition: The part of the JVM that compiles frequently run bytecode into native machine code at run time.
    see: class-loading-jit
    source:
      title: "Java Virtual Machine Guide (Java SE 25): Technology Overview"
      url: https://docs.oracle.com/en/java/javase/25/vm/java-virtual-machine-technology-overview.html
      verifiedOn: 2026-10-19
  - id: interpreter-jvm
    term: Interpreter (JVM)
    aka:
      - bytecode interpreter
    definition: Runs bytecode one instruction at a time; HotSpot starts every program this way.
    see: class-loading-jit
    source:
      title: "Java Virtual Machine Guide (Java SE 25): Technology Overview"
      url: https://docs.oracle.com/en/java/javase/25/vm/java-virtual-machine-technology-overview.html
      verifiedOn: 2026-10-19
  - id: hotspot
    term: HotSpot
    aka:
      - HotSpot VM
      - HotSpot JVM
    definition: The JVM in OpenJDK and Oracle JDK, named after how it finds and compiles hot code.
    see: class-loading-jit
    source:
      title: "Java Virtual Machine Guide (Java SE 25): Technology Overview"
      url: https://docs.oracle.com/en/java/javase/25/vm/java-virtual-machine-technology-overview.html
      verifiedOn: 2026-10-19
  - id: tiered-compilation
    term: Tiered compilation
    definition: HotSpot's default mix of the C1 and C2 JIT compilers for fast start-up and fast peak code.
    see: class-loading-jit
    source:
      title: "Java Virtual Machine Guide (Java SE 25): Tiered Compilation"
      url: https://docs.oracle.com/en/java/javase/25/vm/java-hotspot-virtual-machine-performance-enhancements.html
      verifiedOn: 2026-10-19
  - id: lts-release
    term: LTS release
    aka:
      - LTS
      - long-term support
    definition: A Java release that gets updates for years; Oracle's are 8, 11, 17, 21 and 25.
    see: modern-java
    source:
      title: Oracle Java SE Support Roadmap
      url: https://www.oracle.com/java/technologies/java-se-support-roadmap.html
      verifiedOn: 2026-10-19
  - id: preview-feature
    term: Preview feature
    aka:
      - preview features
    definition: A fully built but not yet permanent Java feature, enabled with --enable-preview.
    see: modern-java
    source:
      title: "JEP 12: Preview Features"
      url: https://openjdk.org/jeps/12
      verifiedOn: 2026-10-19
  - id: solid
    term: SOLID
    aka:
      - SOLID principles
    definition: "Five design rules: single responsibility, open-closed, Liskov substitution, interface segregation, dependency inversion."
    see: solid-principles
    source:
      title: Solid Relevance (Robert C. Martin, Clean Coder blog)
      url: https://blog.cleancoder.com/uncle-bob/2020/10/18/Solid-Relevance.html
      verifiedOn: 2026-10-19
  - id: design-pattern
    term: Design pattern
    aka:
      - design patterns
    definition: A named, reusable way to solve a design problem that keeps coming up.
    see: design-patterns
    source:
      title: Design patterns catalog (Refactoring.Guru)
      url: https://refactoring.guru/design-patterns/catalog
      verifiedOn: 2026-10-19
  - id: singleton
    term: Singleton
    aka:
      - singleton pattern
    definition: A class that allows only one instance and gives one global way to reach it.
    see: design-patterns
    source:
      title: Singleton (Refactoring.Guru)
      url: https://refactoring.guru/design-patterns/singleton
      verifiedOn: 2026-10-19
  - id: double-checked-locking
    term: Double-checked locking
    aka:
      - DCL
    definition: Check a field, lock, check again, then create; correct in Java 5+ only if the field is volatile.
    see: design-patterns
    source:
      title: The "Double-Checked Locking is Broken" Declaration (Pugh et al.)
      url: https://www.cs.umd.edu/~pugh/java/memoryModel/DoubleCheckedLocking.html
      verifiedOn: 2026-10-19
  - id: dependency-injection-term
    term: Dependency injection
    definition: A class receives the objects it needs from outside, usually through its constructor, instead of creating them.
    see: design-patterns
    source:
      title: Inversion of Control Containers and the Dependency Injection pattern (Martin Fowler)
      url: https://martinfowler.com/articles/injection.html
      verifiedOn: 2026-10-19
  - id: input-stream
    term: InputStream
    aka:
      - OutputStream
    definition: Base classes for reading (InputStream) and writing (OutputStream) raw bytes.
    see: java-io
    source:
      title: Byte Streams (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/essential/io/bytestreams.html
      verifiedOn: 2026-10-19
  - id: buffered-reader
    term: BufferedReader
    definition: Wraps a Reader with a buffer for fewer costly reads, and adds readLine().
    see: java-io
    source:
      title: BufferedReader (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/BufferedReader.html
      verifiedOn: 2026-10-19
  - id: nio
    term: NIO
    aka:
      - java.nio
      - NIO.2
    definition: "Java's newer I/O APIs: buffers, channels, selectors, and Path with Files for file work."
    see: java-io
    source:
      title: java.nio package summary (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/package-summary.html
      verifiedOn: 2026-10-19
  - id: serialisation
    term: Serialisation
    aka:
      - serialization
      - deserialisation
      - deserialization
    definition: Turning an object into bytes to store or send; deserialisation turns the bytes back into an object.
    see: serialization
    source:
      title: ObjectOutputStream (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/ObjectOutputStream.html
      verifiedOn: 2026-10-19
  - id: serializable
    term: Serializable
    definition: A marker interface with no methods; only classes that implement it can be serialised.
    see: serialization
    source:
      title: Serializable (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/Serializable.html
      verifiedOn: 2026-10-19
  - id: serial-version-uid
    term: serialVersionUID
    definition: A private static final long version of a serialisable class; a mismatch fails with InvalidClassException.
    see: serialization
    source:
      title: Serializable (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/Serializable.html
      verifiedOn: 2026-10-19
  - id: transient-keyword
    term: transient (keyword)
    aka:
      - transient field
      - transient fields
    definition: Marks a field as not part of the object's saved state, so serialisation skips it.
    see: serialization
    source:
      title: JLS SE 25, 8.3.1.3 transient Fields
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.3.1.3
      verifiedOn: 2026-10-19
  - id: reflection
    term: Reflection
    aka:
      - Reflection API
    definition: Code that inspects and uses classes, fields, methods and constructors at run time.
    see: reflection-annotations
    source:
      title: The Reflection API (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/reflect/index.html
      verifiedOn: 2026-10-19
  - id: annotation
    term: Annotation
    aka:
      - annotations
    definition: Metadata on code, like @Override; it does nothing until a compiler, tool or framework reads it.
    see: reflection-annotations
    source:
      title: Annotations (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/annotations/index.html
      verifiedOn: 2026-10-19
  - id: retention-policy
    term: Retention policy
    aka:
      - RetentionPolicy
    definition: "How long an annotation is kept: SOURCE, CLASS (the default) or RUNTIME."
    see: reflection-annotations
    source:
      title: RetentionPolicy (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/annotation/RetentionPolicy.html
      verifiedOn: 2026-10-19
  - id: jdbc-api
    term: JDBC
    aka:
      - Java Database Connectivity
    definition: Java's standard API for connecting to relational databases and running SQL.
    see: jdbc
    source:
      title: java.sql package (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/package-summary.html
      verifiedOn: 2026-10-19
  - id: data-source
    term: DataSource
    definition: A factory for database connections, preferred over DriverManager; can provide pooled connections.
    see: jdbc
    source:
      title: DataSource (Java SE 25 API, javax.sql)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/javax/sql/DataSource.html
      verifiedOn: 2026-10-19
  - id: prepared-statement
    term: PreparedStatement
    definition: A precompiled SQL statement with ? placeholders whose values are set separately.
    see: jdbc
    source:
      title: PreparedStatement (Java SE 25 API, java.sql)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/PreparedStatement.html
      verifiedOn: 2026-10-19
  - id: result-set
    term: ResultSet
    definition: The rows a query returns, read with a cursor that next() moves forward.
