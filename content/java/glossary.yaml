terms:
  - id: jdk
    term: JDK
    aka:
      - Java Development Kit
    definition: "The Java Development Kit: the runtime plus the tools to compile, package and document code."
    see: jdk-jre-jvm
    source: &a1
      title: Description of Java Conceptual Diagram (Java SE 8 documentation, Oracle)
      url: https://docs.oracle.com/javase/8/docs/technotes/guides/desc_jdk_structure.html
      verifiedOn: 2026-10-19
  - id: jre
    term: JRE
    aka:
      - Java Runtime Environment
    definition: "The Java Runtime Environment: what an app needs to run, with no compiler."
    see: jdk-jre-jvm
    source: *a1
  - id: java-virtual-machine
    term: JVM
    aka:
      - Java Virtual Machine
    definition: "The Java Virtual Machine: the program that loads class files and runs their bytecode."
    see: jdk-jre-jvm
    source:
      title: "JVMS SE 25, chapter 1: Introduction"
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html
      verifiedOn: 2026-10-19
  - id: bytecode
    term: Bytecode
    aka:
      - bytecodes
      - Java bytecode
    definition: The JVM's instruction set, stored in .class files instead of native machine code.
    see: jdk-jre-jvm
    source: &a2
      title: About the Java Technology (The Java Tutorials, Oracle)
      url: https://docs.oracle.com/javase/tutorial/getStarted/intro/definition.html
      verifiedOn: 2026-10-19
  - id: javac
    term: javac
    definition: "The Java compiler: turns .java source files into .class files."
    see: jdk-jre-jvm
    source: *a2
  - id: wora
    term: WORA
    aka:
      - Write once, run anywhere
      - platform independence
      - platform independent
    definition: "Write once, run anywhere: one compiled .class file runs on any OS that has a JVM."
    see: jdk-jre-jvm
    source: *a2
  - id: main-method
    term: main method
    aka:
      - main()
      - public static void main
    definition: The method the java launcher calls first to start a program.
    see: jdk-jre-jvm
    source:
      title: JLS SE 25, 12.1.4 Invoke a main Method
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-12.html#jls-12.1.4
      verifiedOn: 2026-10-19
  - id: primitive-type
    term: Primitive type
    aka:
      - primitive types
      - primitives
    definition: One of Java's 8 built-in value types, such as int or boolean; it is never null.
    see: data-types
    source: &a3
      title: "JLS SE 25, chapter 4: Types, Values, and Variables"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html
      verifiedOn: 2026-10-19
  - id: reference-type
    term: Reference type
    aka:
      - reference types
    definition: A class, interface, array or type variable; its variables hold a reference or null.
    see: data-types
    source: *a3
  - id: widening-conversion
    term: Widening conversion
    aka:
      - widening
      - widening primitive conversion
    definition: Converting to a larger type, such as int to long; done automatically.
    see: data-types
    source: &a4
      title: "JLS SE 25, chapter 5: Conversions and Contexts"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html
      verifiedOn: 2026-10-19
  - id: narrowing-conversion
    term: Narrowing conversion
    aka:
      - narrowing
      - narrowing primitive conversion
    definition: Converting to a smaller type, such as double to int; needs a cast and may lose data.
    see: data-types
    source: *a4
  - id: type-casting
    term: Type casting
    aka:
      - casting
      - type cast
    definition: Writing (Type) before a value to convert it to that type.
    see: data-types
    source: *a4
  - id: integer-overflow
    term: Integer overflow
    aka:
      - int overflow
    definition: A result too big for its type; Java wraps it around silently instead of throwing.
    see: data-types
    source: *a3
  - id: var-type-inference
    term: var (Java)
    aka:
      - local variable type inference
      - local-variable type inference
    definition: Java 10 syntax that lets the compiler infer a local variable's type from its initializer.
    see: data-types
    source:
      title: "JEP 286: Local-Variable Type Inference (OpenJDK)"
      url: https://openjdk.org/jeps/286
      verifiedOn: 2026-10-19
  - id: switch-expression
    term: Switch expression
    aka:
      - switch expressions
    definition: A switch that produces a value, final in Java 14; it must cover every case.
    see: operators-control-flow
    source:
      title: "JEP 361: Switch Expressions (OpenJDK)"
      url: https://openjdk.org/jeps/361
      verifiedOn: 2026-10-19
  - id: yield-statement
    term: yield (switch)
    aka:
      - yield statement
    definition: Gives the value of a switch expression from inside a block of statements.
    see: operators-control-flow
    source:
      title: "JEP 361: Switch Expressions (OpenJDK)"
      url: https://openjdk.org/jeps/361
      verifiedOn: 2026-10-19
  - id: string-pool
    term: String pool
    aka:
      - string constant pool
      - String intern pool
    definition: The JVM's shared set of unique String objects that literals point to.
    see: strings
    source:
      title: String.intern (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html#intern()
      verifiedOn: 2026-10-19
  - id: string-intern
    term: intern()
    aka:
      - String.intern()
      - string interning
    definition: Returns the pooled String with the same text, adding this one to the pool if missing.
    see: strings
    source:
      title: String.intern (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html#intern()
      verifiedOn: 2026-10-19
  - id: string-builder
    term: StringBuilder
    definition: A mutable, unsynchronised character sequence for building text.
    see: strings
    source:
      title: StringBuilder (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StringBuilder.html
      verifiedOn: 2026-10-19
  - id: string-buffer
    term: StringBuffer
    definition: The older, synchronised version of StringBuilder; safe for use by several threads.
    see: strings
    source:
      title: StringBuffer (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StringBuffer.html
      verifiedOn: 2026-10-19
  - id: wrapper-class
    term: Wrapper class
    aka:
      - wrapper classes
      - wrapper types
    definition: A class that holds one primitive value as an object, such as Integer for int.
    see: wrapper-classes
    source: *a4
  - id: autoboxing
    term: Autoboxing
    aka:
      - boxing
      - boxing conversion
    definition: The compiler's automatic conversion of a primitive to its wrapper, such as int to Integer.
    see: wrapper-classes
    source: *a4
  - id: unboxing
    term: Unboxing
    aka:
      - unboxing conversion
      - auto-unboxing
    definition: The automatic conversion of a wrapper back to its primitive; a null throws NullPointerException.
    see: wrapper-classes
    source: *a4
  - id: integer-cache
    term: Integer cache
    aka:
      - IntegerCache
    definition: Shared Integer objects for small values, so boxing the same small number gives the same object.
    see: wrapper-classes
    source:
      title: Integer.valueOf (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Integer.html#valueOf(int)
      verifiedOn: 2026-10-19
  - id: pass-by-value-term
    term: Pass-by-value
    aka:
      - pass by value
      - call by value
    definition: Passing a copy of each argument's value; Java's only way of passing arguments.
    see: pass-by-value
    source:
      title: JLS SE 25, 8.4.1 Formal Parameters
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.1
      verifiedOn: 2026-10-19
  - id: class-java
    term: Class (Java)
    definition: A blueprint that declares the fields and methods its objects will have.
    see: classes-objects
    source:
      title: What Is an Object? (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/concepts/object.html
      verifiedOn: 2026-10-19
  - id: object-instance
    term: Object (instance)
    aka:
      - instance of a class
    definition: One thing created from a class with new, holding its own field values.
    see: classes-objects
    source:
      title: What Is an Object? (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/concepts/object.html
      verifiedOn: 2026-10-19
  - id: encapsulation
    term: Encapsulation
    definition: Hiding an object's state and allowing access only through its methods.
    see: oop-principles
    source:
      title: What Is an Object? (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/concepts/object.html
      verifiedOn: 2026-10-19
  - id: abstraction
    term: Abstraction
    definition: Showing what an object does while hiding how it does it.
    see: oop-principles
    source:
      title: Java OOP Concepts (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/java/object-oriented-programming-oops-concept-in-java/
      verifiedOn: 2026-10-19
  - id: getter
    term: Getter
    aka:
      - getter method
      - getters
    definition: A method that returns the value of a private field, such as getAge().
    see: oop-principles
    source:
      title: Java OOP Concepts (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/java/object-oriented-programming-oops-concept-in-java/
      verifiedOn: 2026-10-19
  - id: setter
    term: Setter
    aka:
      - setter method
      - setters
    definition: A method that changes a private field, usually after checking the new value.
    see: oop-principles
    source:
      title: Java OOP Concepts (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/java/object-oriented-programming-oops-concept-in-java/
      verifiedOn: 2026-10-19
  - id: method-signature
    term: Method signature
    aka:
      - signature of a method
    definition: A method's name plus its parameter types; the return type is not part of it.
    see: classes-objects
    source:
      title: JLS 25, 8.4.2 Method Signature
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.2
      verifiedOn: 2026-10-19
  - id: varargs
    term: Varargs
    aka:
      - variable arity parameter
      - variable-arity
    definition: A last parameter written Type... that accepts zero or more values as an array.
    see: classes-objects
    source:
      title: JLS 25, 8.4.1 Formal Parameters
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.1
      verifiedOn: 2026-10-19
  - id: constructor-term
    term: Constructor
    aka:
      - constructors
    definition: A block named after the class, with no return type, that sets up each new object.
    see: constructors
    source:
      title: JLS 25, 8.8 Constructor Declarations
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.8
      verifiedOn: 2026-10-19
  - id: default-constructor
    term: Default constructor
    aka:
      - implicit constructor
    definition: The no-argument constructor the compiler adds when a class declares none.
    see: constructors
    source:
      title: JLS 25, 8.8.9 Default Constructor
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.8.9
      verifiedOn: 2026-10-19
  - id: constructor-chaining
    term: Constructor chaining
    definition: One constructor calling another with this(...) or super(...), up to Object.
    see: constructors
    source:
      title: Using the Keyword super (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/IandI/super.html
      verifiedOn: 2026-10-19
  - id: static-block
    term: Static block
    aka:
      - static initializer
      - static initialiser
      - static initialization block
    definition: A static { } block that runs once when the class is initialised.
    see: static-keyword
    source:
      title: Initializing Fields (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/initial.html
      verifiedOn: 2026-10-19
  - id: instance-initializer
    term: Instance initialiser block
    aka:
      - instance initializer
      - initializer block
    definition: A { } block in a class body that runs for every new object.
    see: constructors
    source:
      title: Initializing Fields (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/initial.html
      verifiedOn: 2026-10-19
  - id: this-keyword
    term: this (Java)
    aka:
      - this keyword
      - this reference
    definition: A reference to the current object inside instance methods and constructors.
    see: this-super
    source:
      title: JLS 25, 15.8.3 this
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.8.3
      verifiedOn: 2026-10-19
  - id: super-keyword
    term: super (Java)
    aka:
      - super keyword
    definition: "Refers to the current object as its parent class: parent methods and constructor."
    see: this-super
    source:
      title: JLS 25, 15.11.2 Accessing Superclass Members using super
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.11.2
      verifiedOn: 2026-10-19
  - id: access-modifier
    term: Access modifier
    aka:
      - access modifiers
      - access level
    definition: One of public, protected or private, or none, deciding who may use a member.
    see: access-modifiers
    source:
      title: Controlling Access to Members of a Class (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/accesscontrol.html
      verifiedOn: 2026-10-19
  - id: package-private
    term: Package-private
    aka:
      - default access
      - package access
    definition: "The access level with no modifier: visible only inside the same package."
    see: access-modifiers
    source:
      title: Controlling Access to Members of a Class (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/accesscontrol.html
      verifiedOn: 2026-10-19
  - id: protected-access
    term: protected (Java)
    aka:
      - protected access
      - protected member
    definition: Visible in the same package and to subclass code in other packages.
    see: access-modifiers
    source:
      title: JLS 25, 6.6.2 Details on protected Access
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-6.html#jls-6.6.2
      verifiedOn: 2026-10-19
  - id: java-package
    term: Package (Java)
    aka:
      - Java package
    definition: A named group of related types that also acts as a namespace.
    see: access-modifiers
    source:
      title: "JLS 25, chapter 7: Packages and Modules"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-7.html
      verifiedOn: 2026-10-19
  - id: import-declaration
    term: import (Java)
    aka:
      - import statement
      - import declaration
    definition: Lets a source file refer to types from other packages by their short names.
    see: access-modifiers
    source:
      title: "JLS 25, chapter 7: Packages and Modules"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-7.html
      verifiedOn: 2026-10-19
  - id: static-method
    term: Static method
    aka:
      - class method
      - static methods
    definition: A method that belongs to the class and runs without any object.
    see: static-keyword
    source:
      title: Understanding Class Members (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html
      verifiedOn: 2026-10-19
  - id: static-field
    term: Static field
    aka:
      - class variable
      - static variable
    definition: A field with one copy shared by the whole class.
    see: static-keyword
    source:
      title: Understanding Class Members (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html
      verifiedOn: 2026-10-19
  - id: method-hiding
    term: Method hiding
    aka:
      - hidden method
    definition: A subclass static method with the same signature hides, not overrides, the parent's.
    see: static-keyword
    source:
      title: Overriding and Hiding Methods (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/IandI/override.html
      verifiedOn: 2026-10-19
  - id: final-variable
    term: Final variable
    aka:
      - final reference
      - final field
    definition: A variable that can be assigned only once.
    see: final-keyword
    source:
      title: JLS 25, 4.12.4 final Variables
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html#jls-4.12.4
      verifiedOn: 2026-10-19
  - id: final-class
    term: Final class
    definition: A class that cannot be extended, such as String.
    see: final-keyword
    source:
      title: Writing Final Classes and Methods (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/IandI/final.html
      verifiedOn: 2026-10-19
  - id: effectively-final
    term: Effectively final
    definition: A local variable not declared final but never reassigned after it gets a value.
    see: final-keyword
    source:
      title: JLS 25, 4.12.4 final Variables
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html#jls-4.12.4
      verifiedOn: 2026-10-19
  - id: finalize-term
    term: finalize()
    aka:
      - finalization
      - finalizer
    definition: An old Object method called before garbage collection; deprecated for removal since Java 18.
    see: final-keyword
    source:
      title: Object.finalize() (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#finalize()
      verifiedOn: 2026-10-19
  - id: inner-class
    term: Inner class
    aka:
      - inner classes
      - member inner class
    definition: A non-static nested class; each object is tied to an outer object.
    see: inner-classes
    source:
      title: Nested Classes (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/nested.html
      verifiedOn: 2026-10-19
  - id: static-nested-class
    term: Static nested class
    aka:
      - static nested classes
    definition: A static class declared inside another class; needs no outer object.
    see: inner-classes
    source:
      title: Nested Classes (Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/javaOO/nested.html
      verifiedOn: 2026-10-19
  - id: anonymous-class
    term: Anonymous class
    aka:
      - anonymous classes
      - anonymous inner class
    definition: A class with no name, declared and created in one new expression.
    see: inner-classes
    source:
      title: JLS 25, 15.9.5 Anonymous Class Declarations
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.9.5
      verifiedOn: 2026-10-19
  - id: is-a-relationship
    term: Inheritance
    aka:
      - is-a
      - is-a relationship
    definition: "A class extends another and gets its members: Dog is an Animal."
    see: inheritance
    source:
      title: JLS SE 25, chapter 8 Classes
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html
      verifiedOn: 2026-10-19
  - id: has-a-relationship
    term: Composition
    aka:
      - has-a
      - has-a relationship
    definition: "Building a class from objects it holds as fields and delegates to: Car has an Engine."
    see: inheritance
    source:
      title: Secure Coding Guidelines for Java SE, Guideline 4-6
      url: https://www.oracle.com/java/technologies/javase/seccodeguide.html
      verifiedOn: 2026-10-19
  - id: association-relationship
    term: Association
    definition: A link between objects that use each other, with no ownership.
    see: inheritance
    source:
      title: OMG Unified Modeling Language 2.5.1, 9.5.3 AggregationKind
      url: https://www.omg.org/spec/UML/2.5.1/PDF
      verifiedOn: 2026-10-19
  - id: aggregation-relationship
    term: Aggregation
    definition: "A looser whole-part link: the parts are not deleted with the whole."
    see: inheritance
    source:
      title: OMG Unified Modeling Language 2.5.1, 9.5.3 AggregationKind
      url: https://www.omg.org/spec/UML/2.5.1/PDF
      verifiedOn: 2026-10-19
  - id: diamond-problem
    term: Diamond problem
    definition: One method reachable through two parents; Java makes the class override clashing defaults.
    see: inheritance
    source:
      title: JLS SE 25, 8.4.8.4 Inheriting Methods with Override-Equivalent Signatures
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.8.4
      verifiedOn: 2026-10-19
  - id: polymorphism-term
    term: Polymorphism
    definition: "One call, many forms: overloading picks by argument types, overriding by the object's class."
    see: polymorphism
    source:
      title: Polymorphism (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/IandI/polymorphism.html
      verifiedOn: 2026-10-19
  - id: method-overloading
    term: Method overloading
    aka:
      - overloading
      - overloaded
    definition: Same method name with different parameter lists, chosen at compile time.
    see: polymorphism
    source:
      title: JLS SE 25, 8.4.9 Overloading
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.9
      verifiedOn: 2026-10-19
  - id: method-overriding
    term: Method overriding
    aka:
      - overriding
      - overridden
    definition: A subclass redefines an inherited instance method with the same signature.
    see: polymorphism
    source:
      title: JLS SE 25, 8.4.8 Inheritance, Overriding, and Hiding
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.8
      verifiedOn: 2026-10-19
  - id: dynamic-dispatch
    term: Dynamic method dispatch
    aka:
      - dynamic dispatch
      - runtime polymorphism
      - virtual method invocation
    definition: The JVM calls the override of the object's class, not of the variable's type.
    see: polymorphism
    source:
      title: Polymorphism (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/java/IandI/polymorphism.html
      verifiedOn: 2026-10-19
  - id: upcasting
    term: Upcasting
    aka:
      - upcast
    definition: Using a child object through a parent type; implicit and always safe.
    see: polymorphism
    source:
      title: JLS SE 25, 5.1.5 and 5.1.6 Widening and Narrowing Reference Conversion
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html#jls-5.1.5
      verifiedOn: 2026-10-19
  - id: downcasting
    term: Downcasting
    aka:
      - downcast
    definition: Casting a parent reference to a child type; fails with ClassCastException if wrong.
    see: polymorphism
    source:
      title: JLS SE 25, 5.1.5 and 5.1.6 Widening and Narrowing Reference Conversion
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html#jls-5.1.5
      verifiedOn: 2026-10-19
  - id: covariant-return-type
    term: Covariant return type
    aka:
      - covariant return
    definition: An overriding method may return a subtype of the original return type.
    see: polymorphism
    source:
      title: JLS SE 25, 8.4.8.3 Requirements in Overriding and Hiding
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.8.3
      verifiedOn: 2026-10-19
  - id: override-annotation
    term: "@Override"
    definition: Asks the compiler to fail if the method does not override or implement anything.
    see: polymorphism
    source:
      title: Override (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Override.html
      verifiedOn: 2026-10-19
  - id: abstract-class
    term: Abstract class
    aka:
      - abstract classes
    definition: "A class marked abstract: may have abstract methods and cannot be instantiated."
    see: abstract-classes-interfaces
    source:
      title: JLS SE 25, 8.1.1.1 abstract Classes
