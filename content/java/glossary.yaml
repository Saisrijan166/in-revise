    source:
      title: ResultSet (Java SE 25 API, java.sql)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/ResultSet.html
      verifiedOn: 2026-10-19
  - id: sql-injection
    term: SQL injection
    definition: An attack where crafted input changes the meaning of SQL built by joining strings.
    see: jdbc
    source:
      title: SQL Injection Prevention Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
      verifiedOn: 2026-10-19
  - id: connection-pool
    term: Connection pool
    aka:
      - connection pooling
    definition: A set of open database connections that are lent out and returned, so each request skips opening one.
    see: jdbc
    source:
      title: Connecting with DataSource Objects (The Java Tutorials, JDBC)
      url: https://docs.oracle.com/javase/tutorial/jdbc/basics/sqldatasources.html
      verifiedOn: 2026-10-19
