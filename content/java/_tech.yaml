name: Java
slug: java
accent: orange
summary: "Core Java for interviews: the language, OOP, collections, streams, concurrency and the JVM, as of Java 25."
codeLanguages:
  - java
storySpine:
  - step: Native code runs on one OS only → compile once to bytecode and let a JVM on each machine run it
    cards:
      - jdk-jre-jvm
  - step: Values, text and arguments behave in surprising ways → learn the type, operator, String, boxing and pass-by-value rules
    cards:
      - data-types
      - operators-control-flow
      - strings
      - wrapper-classes
      - pass-by-value
  - step: Any code can change any field and break the object → keep fields private, set them in constructors and change them only through methods
    cards:
      - oop-principles
      - classes-objects
      - constructors
      - this-super
      - access-modifiers
  - step: Some data is shared, some must never change, some helpers belong to one class → use static, final and nested classes
    cards:
      - static-keyword
      - final-keyword
      - inner-classes
  - step: Related classes repeat the same code, and callers need one way to treat them all → inherit or compose, then let overriding and interfaces pick the right behaviour
    cards:
      - inheritance
      - polymorphism
      - abstract-classes-interfaces
  - step: Two equal-looking objects get lost in a HashMap, and shared objects change under other threads → override equals and hashCode, make values immutable, and model fixed sets with enums, records and sealed types
    cards:
      - object-class-equals-hashcode
      - immutability
      - enums
      - records-sealed
  - step: Some failures are normal, like a missing file, and callers forget them → checked exceptions make the compiler insist
    cards:
      - exception-hierarchy
      - throw-throws-custom
  - step: An error skips the cleanup and leaks a file or connection → finally, or better, try-with-resources
    cards:
      - try-catch-finally
  - step: An array cannot grow and has no ready algorithms → pick a List, Set, Queue or Map by order, uniqueness and lookup cost
    cards:
      - collections-framework
      - list-arraylist
      - set-hashset-treeset
      - queue-deque
  - step: Finding a value by key means scanning a list → hash the key into a bucket with HashMap, or keep keys sorted by compareTo in a TreeMap
    cards:
      - map-hashmap
      - comparable-comparator
  - step: "Old APIs fail at run time: a List of Object needs casts, and a shared Date can change under you → generics check types at compile time, and java.time types are immutable"
    cards:
      - generics
      - date-time
  - step: Passing behaviour needs a bulky anonymous class, and loops hide what is computed → lambdas feed a stream pipeline, and Optional marks a result that may be missing
    cards:
      - lambdas
      - streams
      - optional
  - step: One thread waits on I/O while the CPU sits idle → run work on several threads, and guard shared data with synchronized, volatile, locks and concurrent collections
    cards:
      - threads
      - synchronization
      - locks-deadlock
      - concurrent-collections
  - step: Creating a thread per task is costly and code blocks on results → hand tasks to an executor, chain results with CompletableFuture, and use virtual threads for many blocking tasks
    cards:
      - executors
      - completable-future
      - virtual-threads
  - step: A program dies with StackOverflowError or OutOfMemoryError → know what lives on the stack, the heap and Metaspace, and how the GC frees unreachable objects
    cards:
      - jvm-memory
      - garbage-collection
  - step: Code starts slow and interview answers are stuck in Java 8 → learn how classes load and the JIT warms up, and what each LTS release added
    cards:
      - class-loading-jit
      - modern-java
  - step: Classes get tangled and frameworks must wire code they have never seen → follow SOLID, reuse named patterns, and mark code with annotations that reflection reads
    cards:
      - solid-principles
      - design-patterns
      - reflection-annotations
  - step: Data must outlive the program → read and write files with I/O and NIO, serialise objects, and talk to SQL databases through JDBC
    cards:
      - java-io
      - serialization
      - jdbc
topics:
  - id: basics
    title: Java Basics
    order: 1
    blurb: How Java runs, its types, strings, dates and the rules that trip people up.
  - id: oop
    title: Object-Oriented Java
    order: 2
    blurb: Classes, constructors, keywords, inheritance, interfaces and the Object contract.
  - id: exceptions
    title: Exceptions
    order: 3
    blurb: Checked and unchecked errors, cleanup and custom exceptions.
  - id: collections
    title: Collections and Generics
    order: 4
    blurb: Lists, sets, maps and queues, how HashMap works inside, and type-safe generics.
  - id: functional
    title: Lambdas and Streams
    order: 5
    blurb: Lambdas, the Stream API, Collectors, Optional, and stream coding patterns for interviews.
  - id: concurrency
    title: Concurrency
    order: 6
    blurb: Threads, locks, executors and virtual threads.
  - id: jvm
    title: JVM Internals
    order: 7
    blurb: Memory areas, garbage collection, class loading and modern Java releases.
  - id: design-io
    title: Design, I/O and JDBC
    order: 8
    blurb: SOLID, common patterns, files, serialisation, reflection and databases.
