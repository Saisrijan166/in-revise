topics:
  basics:
    - id: jdk-jre-jvm
      children:
        - id: jdk
          label: JDK
          note: JRE plus javac, jar, javadoc and other developer tools
        - id: jre
          label: JRE
          note: JVM plus class libraries; Oracle stopped offering it in JDK 11
        - id: java-virtual-machine
          label: JVM
          note: Runs .class files; each OS has its own JVM build
        - id: javac
          label: javac
          note: Compiles .java source files into .class bytecode
        - id: main-method
          label: main method
          note: "public static void main(String[] args): the classic entry point"
          children:
            - id: instance-main-method
              label: void main() (Java 25)
              note: May be non-static, non-public and take no args (JEP 512)
        - id: source-file-mode
          label: java Hello.java
          note: "Java 11+: compiles one source file in memory and runs it"
    - id: data-types
      children:
        - id: primitive-types
          label: Primitive types
          note: byte, short, int, long, float, double, char, boolean
        - id: reference-types
          label: Reference types
          note: Classes, interfaces, arrays; the value is a reference or null
        - id: widening-conversion
          label: Widening
          note: "int to long or double: automatic; int to float may lose digits"
        - id: narrowing-conversion
          label: Narrowing
          note: double to int needs a cast; the fraction is dropped
        - id: numeric-promotion
          label: Numeric promotion
          note: byte, short and char become int in arithmetic
        - id: var-type-inference
          label: var (Java 10)
          note: Locals with an initializer and loop variables only
    - id: operators-control-flow
      children:
        - id: increment-operators
          label: ++i and i++
          note: Prefix yields the new value, postfix the old one
        - id: short-circuit-operators
          label: "&& and ||"
          note: The right side runs only if the left does not decide
        - id: compound-assignment
          label: += and other op=
          note: x op= y means x = (type of x) (x op y)
        - id: switch-statement
          label: switch statement
          note: "case X: labels fall through until a break"
        - id: switch-expression
          label: switch expression (Java 14)
          note: Gives a value; must cover every case
        - id: labelled-break
          label: break, continue, labels
          note: break outer; leaves the loop labelled outer
    - id: strings
      children:
        - id: string-class
          label: String
          note: Immutable; equals compares the text
        - id: string-pool
          label: String pool
          note: In the main heap since JDK 7 (HotSpot), no longer PermGen
          children:
            - id: string-intern
              label: intern()
              note: s.intern() == t.intern() exactly when s.equals(t)
        - id: string-builder
          label: StringBuilder
          note: Java 5; starts with room for 16 chars and grows itself
          children:
            - id: sb-append
              label: append(x)
              note: Adds at the end; a null String adds the text null
            - id: sb-insert
              label: insert(i, x)
              note: Inserts at index i, shifting later characters right
            - id: sb-delete
              label: delete(start, end)
              note: Removes start to end - 1; deleteCharAt(i) removes one
            - id: sb-reverse
              label: reverse()
              note: Reverses in place; surrogate pairs stay intact
            - id: sb-tostring
              label: toString()
              note: A String copy; later builder changes do not touch it
        - id: string-buffer
          label: StringBuffer
          note: Java 1.0; synchronised methods, safe for many threads
    - id: wrapper-classes
      children:
        - id: wrapper-class
          label: Wrapper (Integer)
          note: Integer, Long, Double, Float, Short, Byte, Character, Boolean
        - id: autoboxing
          label: Autoboxing
          note: int to Integer automatically, as in list.add(5)
        - id: unboxing
          label: Unboxing
          note: Integer to int; a null wrapper throws NullPointerException
        - id: integer-cache
          label: Integer cache
          note: -128 to 127 guaranteed; HotSpot -XX:AutoBoxCacheMax raises it
    - id: pass-by-value
      children:
        - id: pass-primitive
          label: Primitive argument
          note: The parameter is a new variable holding a copy
        - id: pass-reference-copy
          label: Object argument
          note: "A copy of the reference: same object, separate variable"
        - id: pass-by-reference
          label: Pass-by-reference
          note: Would let a method rebind the caller's variable; Java has none
  oop:
    - id: oop-principles
      children:
        - id: encapsulation
          label: Encapsulation
          note: Private fields; methods control every read and change
        - id: abstraction
          label: Abstraction
          note: Expose what an object does, hide how it does it
        - id: inheritance-pillar
          label: Inheritance (pillar)
          note: A subclass gets its superclass's state and behaviour via extends
        - id: polymorphism-pillar
          label: Polymorphism (pillar)
          note: One call, different behaviour for different object types
    - id: classes-objects
      children:
        - id: instance-member
          label: Instance members
          note: Fields and methods that belong to each object
          children:
            - id: instance-variable
              label: Instance variable (field)
              note: Each object gets its own copy, set to a default value
            - id: instance-method
              label: Instance method
              note: Runs on one object and can use this
        - id: new-operator
          label: new
          note: Creates the object, runs a constructor, returns a reference
        - id: method-signature
          label: Method signature
          note: Name plus parameter types; the return type is not part
        - id: varargs
          label: Varargs (Type... name)
          note: At most one, must be the last parameter; an array inside
    - id: constructors
      children:
        - id: default-constructor
          label: Default constructor
          note: Added only if the class declares no constructor
        - id: constructor-chaining
          label: Constructor chaining
          note: this(...) calls the same class, super(...) the parent
        - id: instance-initializer
          label: Instance initialiser { }
          note: Runs for each new object, after super(...), before the body
        - id: private-constructor
          label: private constructor
          note: Stops outside code from calling new on the class
        - id: flexible-constructor-body
          label: Code before super() (Java 25)
          note: Prologue statements may not use this, but may set fields
    - id: this-super
      children:
        - id: this-keyword
          label: this
          note: The current object; only in instance code and constructors
        - id: super-keyword
          label: super
          note: The current object viewed as its direct superclass
    - id: access-modifiers
      children:
        - id: private-access
          label: private
          note: Only inside the top-level class that holds it
        - id: package-private
          label: default (no modifier)
          note: "Package-private: anywhere in the same package"
        - id: protected-access
          label: protected
          note: Same package, plus subclass code in other packages
        - id: public-access
          label: public
          note: Anywhere the class itself is accessible
        - id: java-package
          label: package
          note: A named group of types; java.lang is imported automatically
          children:
            - id: import-declaration
              label: import
              note: Lets one file use short type names; wildcard skips subpackages
            - id: module-import
              label: import module (Java 25)
              note: Imports every package a module exports
    - id: static-keyword
      children:
        - id: static-field
          label: static field
          note: Exactly one copy, however many objects exist
        - id: static-method
          label: static method
          note: Called on the class; this and super are not allowed
          children:
            - id: method-hiding
              label: Method hiding
              note: A subclass static method with the same signature hides the parent's
        - id: static-block
          label: static { } block
          note: Runs once when the class is initialised, in source order
        - id: static-import
          label: import static
          note: Use a class's static members without its name
    - id: final-keyword
      children:
        - id: final-variable
          label: final variable
          note: Assigned once; a final reference may still point to a mutable object
          children:
            - id: blank-final
              label: Blank final
              note: No initialiser; every constructor must assign it
            - id: effectively-final
              label: Effectively final
              note: Not declared final but never reassigned
        - id: final-method
          label: final method
          note: Cannot be overridden or hidden
        - id: final-class
          label: final class
          note: Cannot be extended, e.g. String
        - id: finalize-method
          label: finalize() (look-alike)
          note: Object method, deprecated for removal since Java 18
    - id: inner-classes
      children:
        - id: static-nested-class
          label: Static nested class
          note: No outer object; behaves like a top-level class
        - id: inner-class
          label: Inner (member) class
          note: Each object has an enclosing outer object
        - id: local-class
          label: Local class
          note: Declared inside a block such as a method body
        - id: anonymous-class
          label: Anonymous class
          note: Declared and created at once with new; no name, no constructor
    - id: inheritance
      children:
        - id: is-a-relationship
          label: Inheritance (is-a)
          note: "class Dog extends Animal: one superclass, reuses and overrides"
        - id: multiple-interface-inheritance
          label: Many interfaces
          note: "implements A, B: many types, no inherited instance state"
        - id: diamond-problem
          label: Diamond problem
          note: "Two inherited defaults clash: the class must override"
        - id: has-a-relationship
          label: Composition (has-a)
          note: Hold another object in a field and delegate to it
          children:
            - id: association-relationship
              label: Association
              note: Any link where objects use each other
            - id: aggregation-relationship
              label: Aggregation
              note: Shared whole-part; parts are not deleted with the whole
            - id: composition-uml
              label: Composition (UML)
              note: "Strong ownership: parts are deleted with the whole"
    - id: polymorphism
      children:
        - id: method-overloading
          label: Overloading (compile time)
          note: Same name, different parameter lists in one class
        - id: method-overriding
          label: Overriding (run time)
          note: Subclass redefines an inherited method, same signature
          children:
            - id: override-annotation
              label: "@Override"
              note: Compile error if the method overrides nothing
            - id: covariant-return-type
              label: Covariant return
              note: An override may return a subtype of the original
        - id: upcasting
          label: Upcasting
          note: "Child to parent type: implicit, never fails"
        - id: downcasting
          label: Downcasting
          note: "Parent to child: explicit cast; may throw ClassCastException"
    - id: abstract-classes-interfaces
      children:
        - id: abstract-class
          label: Abstract class
          note: May hold state and constructors; cannot be instantiated
          children:
            - id: abstract-method
              label: Abstract method
              note: No body; cannot be private, static or final
        - id: interface-type
          label: Interface
          note: A contract; every field is public static final
          children:
            - id: default-method
              label: default method (Java 8)
              note: Has a body; implementers inherit or override it
            - id: static-interface-method
              label: static method (Java 8)
              note: Called as Name.m(); not inherited by implementers
            - id: private-interface-method
              label: private method (Java 9)
              note: Helper for the interface's own methods
    - id: object-class-equals-hashcode
      children:
        - id: reference-equality
          label: ==
          note: Same object for references; same value for primitives
        - id: equals-method
          label: equals()
          note: Logical equality; Object's version is the same as ==
        - id: hashcode-method
          label: hashCode()
          note: An int for hash tables; stable while equals fields stay unchanged
          children:
            - id: equals-hashcode-contract
              label: equals-hashCode contract
              note: Equal objects need equal hash codes; not the reverse
        - id: tostring-method
          label: toString()
          note: "Default: class name, @, hash code in hex"
        - id: final-object-methods
          label: getClass(), wait(), notify()
          note: "final in Object: cannot be overridden"
        - id: clone-method
          label: clone()
          note: protected; needs Cloneable; makes a shallow copy
    - id: immutability
      children:
        - id: defensive-copy
          label: Defensive copy
          note: Copy mutable inputs and outputs, e.g. List.copyOf (Java 10)
        - id: shallow-immutability
          label: Shallow vs deep
          note: Final fields can still point to objects that change
        - id: immutable-jdk-classes
          label: JDK examples
          note: "String, BigDecimal, LocalDate: changes return new objects"
    - id: enums
      children:
        - id: enum-values-valueof
          label: values() and valueOf()
          note: All constants in order; look one up by exact name
        - id: ordinal-method
          label: ordinal()
          note: Position from 0; changes if constants are reordered
        - id: enum-constant-body
          label: Constant-specific body
          note: A constant may override methods; the enum is then sealed
        - id: enummap
          label: EnumMap
          note: Map with enum keys, kept as an array; no null keys
        - id: enumset
          label: EnumSet
          note: Set of enum constants, kept as bit vectors
    - id: records-sealed
      children:
        - id: record-class
          label: record (Java 16)
          note: "Final data carrier: fields, accessors, equals, hashCode, toString"
          children:
            - id: compact-constructor
              label: Compact constructor
              note: "Record(...) { checks }: fields are assigned after the body"
        - id: sealed-class
          label: sealed (Java 17)
          note: permits lists the only allowed direct subclasses
          children:
            - id: sealed-subclass-modifiers
              label: final / sealed / non-sealed
              note: Each permitted subclass must declare one of these
        - id: instanceof-pattern
          label: instanceof pattern (Java 16)
          note: obj instanceof String s tests and binds; false for null
        - id: switch-pattern
          label: switch patterns (Java 21)
          note: case Circle c ->; exhaustive over sealed types
        - id: record-pattern
          label: Record patterns (Java 21)
          note: case Point(int x, int y) takes a record apart
  exceptions:
    - id: exception-hierarchy
      children:
        - id: throwable
          label: Throwable
          note: "Root class: only its instances can be thrown; has message and cause"
        - id: checked-exception
          label: Checked exceptions
          note: Not under RuntimeException or Error; you must catch or declare it
          children:
            - id: io-exception
              label: IOException
              note: Failed or interrupted I/O; FileNotFoundException extends it
            - id: sql-exception
              label: SQLException
              note: A database access error, from java.sql
            - id: interrupted-exception
              label: InterruptedException
              note: A waiting or sleeping thread was interrupted
        - id: unchecked-exception
          label: Unchecked exceptions
          note: RuntimeException, Error and their subclasses; no compile check
          children:
            - id: runtime-exception
              label: RuntimeException
              note: Thrown in normal JVM operation; usually a bug in the code
              children:
                - id: null-pointer-exception
                  label: NullPointerException
                  note: null used where an object is needed, e.g. calling a method
                - id: illegal-argument-exception
                  label: IllegalArgumentException
                  note: A method got a bad argument; NumberFormatException extends it
            - id: error-class
              label: Error
              note: Serious problem, e.g. OutOfMemoryError; apps should not catch it
    - id: try-catch-finally
      children:
        - id: try-block
          label: try
          note: Needs a catch, a finally, or resources; bare try fails to compile
        - id: catch-block
          label: catch
          note: First matching clause runs; a subclass after its parent is an error
          children:
            - id: multi-catch
              label: Multi-catch (Java 7)
              note: catch (A | B e); e is final; A and B cannot be subtypes
        - id: finally-block
          label: finally
          note: Runs on every exit; a return in it discards the exception
        - id: try-with-resources
          label: try-with-resources (Java 7)
          note: Closes resources in reverse order, before catch and finally
          children:
            - id: autocloseable
              label: AutoCloseable
              note: One method, close(); java.io.Closeable extends it
            - id: suppressed-exception
              label: Suppressed exceptions
              note: close() failures added to the main one; read with getSuppressed()
            - id: effectively-final-resource
              label: try (in) (Java 9)
              note: An existing final or effectively final variable as the resource
    - id: throw-throws-custom
      children:
        - id: throw-keyword
          label: throw
          note: Statement that throws one Throwable object
        - id: throws-clause
          label: throws
          note: Signature list; may name unchecked ones, but need not
        - id: custom-exception
          label: Custom exceptions
          note: Your own class under Exception or RuntimeException
          children:
            - id: custom-checked-exception
              label: extends Exception
              note: "Checked: callers must catch or declare it"
            - id: custom-unchecked-exception
              label: extends RuntimeException
              note: "Unchecked: callers are not forced to handle it"
        - id: exception-chaining
          label: Exception chaining
          note: "Wrap the cause: new X(msg, cause); read it with getCause()"
        - id: exception-propagation
          label: Propagation
          note: Uncaught, it moves up the call stack to the nearest matching catch
  collections:
    - id: collections-framework
      children:
        - id: collection-interface
          label: Collection
          note: Root of List, Set and Queue; extends Iterable
        - id: map-interface
          label: Map
          note: Keys to values, no duplicate keys; not a Collection
        - id: sequenced-collection
          label: SequencedCollection (Java 21)
          note: getFirst, getLast, reversed on List, Deque, LinkedHashSet
        - id: collections-class
          label: Collections
          note: "Static helpers: stable sort, binarySearch, unmodifiableList"
        - id: arrays-class
          label: Arrays
          note: Static helpers for arrays; asList gives a fixed-size backed list
        - id: fail-fast-iterator
          label: Fail-fast iterator
          note: Throws ConcurrentModificationException after outside changes
        - id: unmodifiable-collections
          label: Unmodifiable collections
          note: Every mutator throws UnsupportedOperationException
          children:
            - id: list-of-factory
              label: List.of, Set.of, Map.of (Java 9)
              note: New unmodifiable collections; null throws NPE
            - id: unmodifiable-view
              label: Collections.unmodifiableList
              note: Read-only view; changes to the source show through
    - id: list-arraylist
      children:
        - id: arraylist
          label: ArrayList
          note: "Resizable array: O(1) get(i), amortised O(1) add"
        - id: linkedlist
          label: LinkedList
          note: Doubly linked List and Deque; get(i) walks the nodes
        - id: vector
          label: Vector
          note: Legacy synchronised resizable array; prefer ArrayList
        - id: java-array
          label: Array (int[])
          note: Length fixed at creation; can hold primitives
        - id: list-remove-overloads
          label: remove(int) vs remove(Object)
          note: remove(1) drops index 1; remove(Integer.valueOf(1)) the value
    - id: set-hashset-treeset
      children:
        - id: hashset
          label: HashSet
          note: Backed by a HashMap; no order promised; one null allowed
        - id: linkedhashset
          label: LinkedHashSet
          note: "Hash table plus a linked list: insertion order"
        - id: treeset
          label: TreeSet
          note: Sorted NavigableSet on a TreeMap; log(n) add and contains
    - id: map-hashmap
      children:
        - id: hashmap
          label: HashMap
          note: "Hash table: O(1) average get and put; one null key"
          children:
            - id: hashmap-bucket
              label: Bucket
              note: Slot at index (capacity - 1) & hash (OpenJDK)
            - id: load-factor
              label: Load factor 0.75
              note: Resize when size passes capacity × load factor
            - id: treeification
              label: Treeify (Java 8+)
              note: A bucket of 8+ turns into a red-black tree if capacity ≥ 64 (OpenJDK)
        - id: linkedhashmap
          label: LinkedHashMap
          note: "HashMap plus a linked list: insertion or access order"
          children:
            - id: lru-access-order
              label: Access order + removeEldestEntry
              note: Makes LinkedHashMap an LRU cache
        - id: treemap
          label: TreeMap
          note: Red-black tree, sorted keys, guaranteed log(n)
        - id: hashtable
          label: Hashtable
          note: Legacy (Java 1.0), synchronised; no null keys or values
    - id: comparable-comparator
      children:
        - id: comparable-interface
          label: Comparable
          note: "compareTo inside the class: its natural ordering"
        - id: comparator-interface
          label: Comparator
          note: compare(a, b) from outside; a functional interface
          children:
            - id: comparator-builders
              label: comparing, thenComparing, reversed
              note: Methods that build and chain comparators (Java 8)
        - id: consistent-with-equals
          label: Consistent with equals
          note: compareTo is 0 exactly when equals is true
        - id: integer-compare
          label: Integer.compare
          note: Safe numeric compare that avoids a - b overflow (Java 7)
    - id: queue-deque
      children:
        - id: queue-interface
          label: Queue
          note: Holds items before processing; usually FIFO
        - id: deque-interface
          label: Deque
          note: Insert and remove at both ends; also works as a stack
        - id: arraydeque
          label: ArrayDeque
          note: Resizable-array Deque; no nulls; likely faster than Stack
        - id: priorityqueue
          label: PriorityQueue
          note: Heap by natural order or a Comparator; head is the least
        - id: stack-class
          label: Stack
          note: Legacy LIFO class that extends Vector; prefer Deque
  functional:
    - id: generics
      children:
        - id: generic-class
          label: Generic class
          note: "class Box<T>: the user picks T, as in Box<String>"
        - id: generic-method
          label: Generic method
          note: "<T> goes before the return type: static <T> T first(List<T> l)"
        - id: bounded-type
          label: Bounded type <T extends X>
          note: T must be X or a subtype; add interfaces with &, class first
        - id: wildcard
          label: Wildcards
          note: "? stands for an unknown type argument"
          children:
            - id: upper-bounded-wildcard
              label: <? extends T>
              note: For a source you read from (an in variable)
            - id: lower-bounded-wildcard
              label: <? super T>
              note: For a target you write into (an out variable)
            - id: unbounded-wildcard
              label: <?>
              note: Any type, when only Object methods are needed
        - id: type-erasure
          label: Type erasure
          note: T becomes its bound or Object; the compiler inserts casts
        - id: raw-type
          label: Raw type
          note: A generic type with no type argument, like List; gives unchecked warnings
    - id: lambdas
      children:
        - id: functional-interface
          label: Functional interface
          note: Exactly one abstract method; a lambda's target type
          children:
            - id: predicate-interface
              label: Predicate<T>
              note: test(T) returns boolean
            - id: function-interface
              label: Function<T, R>
              note: apply(T) returns R
            - id: consumer-interface
              label: Consumer<T>
              note: accept(T) returns nothing
            - id: supplier-interface
              label: Supplier<T>
              note: get() takes nothing and returns T
        - id: method-reference
          label: Method reference
          note: Class::method, a short form of a lambda that calls one method
          children:
            - id: static-method-reference
              label: Class::staticMethod
              note: Integer::parseInt
            - id: bound-method-reference
              label: object::method
              note: "System.out::println: method of one particular object"
            - id: unbound-method-reference
              label: Type::method
              note: "String::length: the first argument is the receiver"
            - id: constructor-reference
              label: Class::new
              note: "ArrayList::new; arrays too: int[]::new"
        - id: captured-variables
          label: Captured local variables
          note: Must be final or effectively final
    - id: streams
      children:
        - id: intermediate-operation
          label: Intermediate operations
          note: Lazy; each returns a new stream
          children:
            - id: map-operation
              label: map
              note: Turns each element into one new element
            - id: flatmap-operation
              label: flatMap
              note: Turns each element into a stream, then joins them
        - id: terminal-operation
          label: Terminal operations
          note: Run the pipeline and consume the stream
          children:
            - id: reduce-operation
              label: reduce
              note: Folds all elements into one value; the function must be associative
            - id: collectors-class
              label: collect with Collectors
              note: toList, toSet, groupingBy, joining, mapping
            - id: short-circuit-operations
              label: findFirst, anyMatch, limit
              note: "Short-circuit: can finish on an infinite stream"
        - id: primitive-streams
          label: IntStream, LongStream, DoubleStream
          note: "Streams of primitives: sum() without boxing"
        - id: parallel-stream
          label: Parallel stream
          note: parallelStream() or parallel(); not automatically faster
    - id: optional
      children:
        - id: optional-ofnullable
          label: Optional.ofNullable(v)
          note: Empty when v is null
        - id: orelse-method
          label: orElse(value)
          note: Returns the fallback value when empty
        - id: orelseget-method
          label: orElseGet(supplier)
          note: Calls the supplier only when empty
        - id: orelsethrow-method
          label: orElseThrow()
          note: Value, or NoSuchElementException; Java 10+
    - id: date-time
      children:
        - id: local-date
          label: LocalDate
          note: A date with no time or zone, such as a birthday
        - id: local-date-time
          label: LocalTime, LocalDateTime
          note: A time, or a date and time, with no zone
        - id: zoned-date-time
          label: ZonedDateTime
          note: Date and time with a time zone such as Asia/Kolkata
        - id: instant-class
          label: Instant
          note: A numeric timestamp on the UTC time-line
        - id: time-amounts
          label: Duration and Period
          note: Amounts of time, not points in time
          children:
            - id: duration-class
              label: Duration
              note: "Time-based: seconds and nanoseconds, like PT1H30M"
            - id: period-class
              label: Period
              note: "Date-based: years, months and days, like P1M"
        - id: date-time-formatter
          label: DateTimeFormatter
          note: Formats and parses; immutable and thread-safe
  concurrency:
    - id: threads
      children:
        - id: runnable-task
          label: Runnable
          note: A task with void run(); a functional interface, so a lambda fits
        - id: thread-states
          label: Thread.State
          note: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED
        - id: thread-sleep
          label: Thread.sleep()
          note: Pauses the current thread; keeps every monitor it holds
        - id: object-wait
          label: Object.wait()
          note: Releases that object's monitor until notify(), notifyAll() or timeout
        - id: thread-join
          label: join()
          note: The caller waits until that thread terminates
        - id: daemon-thread
          label: Daemon thread
          note: JVM shutdown does not wait for it; set before start()
    - id: synchronization
      children:
        - id: race-condition
          label: Race condition
          note: count++ is read, add, write; two threads can interleave
        - id: synchronized-keyword
          label: synchronized
          note: One thread per monitor at a time; it also makes writes visible
          children:
            - id: synchronized-method
              label: synchronized method
              note: Locks this; a static one locks the Class object
            - id: synchronized-block
              label: synchronized (obj) block
              note: Locks a chosen object, only around the lines that need it
        - id: intrinsic-lock
          label: Intrinsic lock (monitor)
          note: Every object has one; the same thread may lock it again
        - id: volatile-keyword
          label: volatile
          note: Each read sees the latest write; count++ stays non-atomic
        - id: happens-before
          label: Happens-before
          note: If A happens-before B, B sees what A wrote
    - id: locks-deadlock
      children:
        - id: reentrantlock
          label: ReentrantLock
          note: An explicit lock with the same rules as synchronized, plus extras
          children:
            - id: try-lock
              label: tryLock()
              note: Take the lock only if free, or wait up to a timeout
            - id: fair-lock
              label: Fair lock
              note: "new ReentrantLock(true): longest waiter first, lower throughput"
        - id: readwritelock
          label: ReadWriteLock
          note: Many readers at once, or one writer alone
        - id: synchronizers
          label: Synchronizers
          note: Helpers in java.util.concurrent that make threads wait for each other
          children:
            - id: countdownlatch
              label: CountDownLatch
              note: Wait until a count reaches zero; one-shot, cannot reset
            - id: cyclicbarrier
              label: CyclicBarrier
              note: A group waits for each other at one point; reusable
            - id: semaphore
              label: Semaphore
              note: A set of permits that limits how many threads go in
        - id: deadlock
          label: Deadlock
          note: Threads blocked forever, each waiting for a lock another holds
        - id: livelock
          label: Livelock
          note: Threads not blocked but busy reacting to each other, no progress
        - id: starvation
          label: Starvation
          note: A thread rarely gets the resource because others hold it long
    - id: executors
      children:
        - id: executors-factories
          label: Executors factory methods
          note: Ready-made pools from the Executors class
          children:
            - id: fixed-thread-pool
              label: newFixedThreadPool(n)
              note: n threads sharing an unbounded queue
            - id: cached-thread-pool
              label: newCachedThreadPool()
              note: New threads as needed; idle ones end after 60 seconds
            - id: single-thread-executor
              label: newSingleThreadExecutor()
              note: One thread, so tasks run one after another
            - id: scheduled-thread-pool
              label: newScheduledThreadPool(n)
              note: Runs tasks after a delay or periodically
        - id: thread-pool-executor
          label: ThreadPoolExecutor
          note: "The configurable pool: core, max, keep-alive, queue, rejection"
        - id: callable-task
          label: Callable
          note: A task whose call() returns a value and may throw a checked exception
        - id: future-interface
          label: Future
          note: "The pending result: get() waits for it, cancel() tries to stop it"
    - id: completable-future
      children:
        - id: supply-async
          label: supplyAsync() / runAsync()
          note: Start a task with or without a result
        - id: then-apply
          label: thenApply()
          note: Transform the result into a plain value
        - id: then-compose
          label: thenCompose()
          note: Chain a step that itself returns a CompletableFuture
        - id: then-combine
          label: thenCombine()
          note: Merge the results of two independent futures
        - id: all-of
          label: allOf() / anyOf()
          note: Complete when all, or any one, of the futures completes
        - id: exceptionally-handle
          label: exceptionally() / handle()
          note: Recover from a failure, or see the result and the error
    - id: concurrent-collections
      children:
        - id: concurrent-hashmap
          label: ConcurrentHashMap
          note: Thread-safe map; reads do not lock; no null keys or values
        - id: copy-on-write-arraylist
          label: CopyOnWriteArrayList
          note: Every write copies the array; iterators see a snapshot
        - id: blocking-queue
          label: BlockingQueue
          note: "put() waits for space, take() for an element: ArrayBlockingQueue"
        - id: concurrent-linked-queue
          label: ConcurrentLinkedQueue
          note: Unbounded, non-blocking thread-safe queue
        - id: atomic-integer
          label: AtomicInteger / LongAdder
          note: Atomic count without locks; LongAdder wins under high contention
        - id: synchronized-map
          label: Collections.synchronizedMap()
          note: Wraps a map for serial access; lock it yourself to iterate
    - id: virtual-threads
      children:
        - id: platform-thread
          label: Platform thread
          note: Typically mapped 1:1 to an OS thread; costly, so often pooled
        - id: carrier-thread
          label: Carrier thread
          note: The platform thread a virtual thread is mounted on
        - id: pinning
          label: Pinning
          note: Virtual thread cannot unmount, so its carrier is blocked too
        - id: virtual-thread-executor
          label: newVirtualThreadPerTaskExecutor()
          note: "Java 21+: a new virtual thread for each submitted task"
        - id: thread-of-virtual
          label: Thread.ofVirtual()
          note: "Java 21+: builder that creates or starts virtual threads"
  jvm:
    - id: jvm-memory
      children:
        - id: heap-area
          label: Heap
          note: Shared by all threads; holds every object and array
          children:
            - id: jvm-out-of-memory
              label: OutOfMemoryError
              note: Heap, Metaspace or native memory cannot meet a request
        - id: jvm-stack
          label: JVM stack
          note: One per thread, created with it; holds the frames
          children:
            - id: stack-frame
              label: Stack frame
              note: "One per method call: locals and operand stack; gone on return"
            - id: jvm-stack-overflow
              label: StackOverflowError
              note: A thread needs a deeper stack than allowed
        - id: metaspace
          label: Metaspace
          note: HotSpot keeps class metadata here, in native memory (Java 8+)
          children:
            - id: permgen
              label: PermGen
              note: Heap area for class data in HotSpot; removed in Java 8
        - id: pc-register
          label: PC register
          note: "Per thread: address of the bytecode instruction being run"
    - id: garbage-collection
      children:
        - id: gc-roots
          label: GC roots
          note: "Start points: live threads, their locals, loaded classes, JNI"
        - id: young-generation
          label: Young generation
          note: Eden plus two survivor spaces; most objects die here
        - id: old-generation
          label: Old generation
          note: Objects that survived several minor GCs; major GC cleans it
        - id: gc-collectors
          label: Collectors (HotSpot)
          note: Pick one with a -XX:+Use...GC flag, or let the JVM choose
          children:
            - id: serial-gc
              label: Serial
              note: One GC thread; Java 25 picks it below 2 CPUs or 1792 MB
            - id: parallel-gc
              label: Parallel
              note: Many GC threads, app stopped; aims at throughput
            - id: g1-collector
              label: G1
              note: Default on servers since Java 9, on every machine from Java 27
            - id: zgc-collector
              label: ZGC
              note: Product since Java 15; only generational since Java 24
            - id: shenandoah-gc
              label: Shenandoah
              note: Low-pause OpenJDK GC; product since 15, generational mode in 25
        - id: memory-leak-java
          label: Memory leak
          note: References kept by mistake keep unneeded objects alive
          children:
            - id: static-collection-leak
              label: Static collection or cache
              note: Lives as long as its class; grows unless entries are removed
            - id: threadlocal-leak
              label: ThreadLocal on pooled threads
              note: Value lives while the thread lives; call remove() after use
        - id: system-gc
          label: System.gc()
          note: "Only a suggestion: a best effort, no guarantee"
    - id: class-loading-jit
      children:
        - id: class-loaders
          label: Built-in class loaders
          note: Three loaders in a parent chain
          children:
            - id: bootstrap-class-loader
              label: Bootstrap
              note: Built into the JVM; has no parent; shown as null
            - id: platform-class-loader
              label: Platform
              note: Java SE APIs and JDK run-time classes
            - id: application-class-loader
              label: Application (system)
              note: Classes on the class path and module path
        - id: parent-delegation
          label: Parent delegation
          note: Already loaded? Else ask the parent, then findClass() itself
        - id: linking-phase
          label: Linking
          note: Verify, prepare and resolve, after loading
          children:
            - id: bytecode-verification
              label: Verification
              note: Checks the class file is structurally correct
            - id: preparation-phase
              label: Preparation
              note: Creates static fields with default values
            - id: resolution-phase
              label: Resolution
              note: Turns symbolic references into concrete ones
        - id: class-initialisation
          label: Initialisation
          note: Runs static initialisers just before the first active use
        - id: interpreter-jvm
          label: Interpreter
          note: Runs bytecode from start-up and finds the hot spots
        - id: jit-compiler
          label: JIT compiler
          note: Compiles hot methods to native code while the program runs
          children:
            - id: c1-compiler
              label: C1
              note: "Client compiler: quick to compile, adds profiling"
            - id: c2-compiler
              label: C2
              note: "Server compiler: produces the final, most optimised code"
    - id: modern-java
      children:
        - id: java-8-lts
          label: Java 8
          note: GA 18-03-2014; built around Project Lambda
        - id: java-11-lts
          label: Java 11
          note: GA 25-09-2018; HTTP Client API became standard
        - id: java-17-lts
          label: Java 17
          note: GA 14-09-2021; sealed classes became final
        - id: java-21-lts
          label: Java 21
          note: GA 19-09-2023; virtual threads became final
        - id: java-25-lts
          label: Java 25
          note: GA 16-09-2025; latest LTS; next planned LTS is 29
  design-io:
    - id: solid-principles
      children:
        - id: single-responsibility
          label: Single responsibility (S)
          note: "One reason to change: one group of people asking for changes"
        - id: open-closed
          label: Open-closed (O)
          note: Add behaviour with new code, not by editing tested code
        - id: liskov-substitution
          label: Liskov substitution (L)
          note: A subtype must work wherever its parent type is expected
        - id: interface-segregation
          label: Interface segregation (I)
          note: Small interfaces, so clients never depend on unused methods
        - id: dependency-inversion
          label: Dependency inversion (D)
          note: Depend on abstractions, not on low-level details
    - id: design-patterns
      children:
        - id: creational-patterns
          label: Creational patterns
          note: How objects get created
          children:
            - id: singleton-pattern
              label: Singleton
              note: One instance with a global access point
              children:
                - id: dcl-singleton
                  label: Double-checked locking
                  note: Check, lock, check again; the field must be volatile (Java 5+)
                - id: holder-idiom
                  label: Holder idiom
                  note: "Static field in a nested class: lazy, thread-safe, no lock"
                - id: enum-singleton
                  label: Enum singleton
                  note: "One-constant enum: no reflective or deserialised copies"
            - id: factory-pattern
              label: Factory
              note: A method decides what to create, e.g. Calendar.getInstance()
            - id: builder-pattern
              label: Builder
              note: Build step by step, e.g. HttpRequest.newBuilder() (Java 11)
        - id: structural-patterns
          label: Structural patterns
          note: How objects are combined into bigger structures
          children:
            - id: decorator-pattern
              label: Decorator
              note: "Wrap to add behaviour: BufferedReader around a Reader"
            - id: adapter-pattern
              label: Adapter
              note: "Fit one interface to another: InputStreamReader, Arrays.asList"
        - id: behavioural-patterns
          label: Behavioural patterns
          note: How objects share work and responsibility
          children:
            - id: strategy-pattern
              label: Strategy
              note: "Swappable algorithm: a Comparator passed to sort"
            - id: observer-pattern
              label: Observer
              note: Subscribers get notified; java.util.Observable deprecated since 9
        - id: dependency-injection
          label: Dependency injection
          note: Dependencies are passed in, best through the constructor
    - id: java-io
      children:
        - id: byte-streams
          label: Byte streams
          note: "InputStream / OutputStream: 8-bit bytes for binary data"
        - id: character-streams
          label: Character streams
          note: Reader / Writer; InputStreamReader bridges from bytes
        - id: buffered-streams
          label: Buffered streams
          note: "BufferedReader, BufferedWriter: fewer OS calls, flush to write"
        - id: nio-files
          label: Path and Files (NIO.2)
          note: java.nio.file (Java 7); NIO selectors add non-blocking I/O
    - id: serialization
      children:
        - id: externalizable
          label: Externalizable
          note: The class writes its own state; its no-arg constructor runs on read
        - id: read-resolve
          label: readResolve()
          note: Swaps the read object, e.g. for the one singleton instance
        - id: record-serialization
          label: Serializable records
          note: Rebuilt through the canonical constructor; readObject ignored
        - id: serialization-filter
          label: ObjectInputFilter
          note: "Java 9 (JEP 290): allow or reject classes before deserialising"
    - id: reflection-annotations
      children:
        - id: class-object
          label: Class object
          note: "Entry point: X.class, obj.getClass(), Class.forName(name)"
        - id: set-accessible
          label: setAccessible(true)
          note: Skips access checks; fails on JDK internals since Java 17
        - id: annotation-retention
          label: "@Retention"
          note: How long an annotation is kept
          children:
            - id: retention-source
              label: SOURCE
              note: "Dropped by the compiler: @Override, @SuppressWarnings"
            - id: retention-class
              label: CLASS
              note: "The default: in the .class file, not visible at run time"
            - id: retention-runtime
              label: RUNTIME
              note: "Kept by the JVM, readable by reflection: @Deprecated"
        - id: annotation-target
          label: "@Target"
          note: Where it may be used (ElementType); absent means any declaration
        - id: deprecated-for-removal
          label: "@Deprecated(forRemoval = true)"
          note: "Since Java 9: the API is planned to be removed"
    - id: jdbc
      children:
        - id: jdbc-driver
          label: JDBC driver
          note: Vendor code for java.sql, loaded as a service provider
        - id: jdbc-statement
          label: Statement
          note: Runs SQL text exactly as given
        - id: jdbc-prepared-statement
          label: PreparedStatement
          note: Precompiled SQL with ? parameters
        - id: jdbc-result-set
          label: ResultSet
          note: A cursor over rows; by default forward-only and read-only
        - id: jdbc-connection-pool
          label: Connection pool
          note: Reuses open connections from a DataSource, e.g. HikariCP
