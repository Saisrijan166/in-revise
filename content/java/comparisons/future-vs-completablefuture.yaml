id: future-vs-completablefuture
tech: java
title: "Future vs CompletableFuture"
compares: [future-interface, completable-future]
gist:
  - "A result you can check, wait for or cancel; no callbacks"
  - "A result you can chain, combine and complete"
explain:
  - "A Future (Java 5) is the handle that an executor's submit() returns. It holds a task's result once ready; you can check isDone(), wait with get() or cancel the task."
  - "A CompletableFuture (Java 8) is a Future you can attach steps to. Each step runs when the previous result arrives, so a chain of calls needs no thread waiting in between."
example: "Approving payment 42 needs a database load, then a fraud score. With Future you call get() after the load and the thread sits idle. With CompletableFuture you write supplyAsync(load).thenCompose(fraudScore).thenApply(decide) and call join() only once, at the end."
rows:
  - { aspect: "Since", a: "Java 5", b: "Java 8; it also implements Future" }
  - { aspect: "Using the result", a: "get() blocks until it is ready", b: "thenApply() or thenAccept() run when it is ready" }
  - { aspect: "Chain or combine", a: "No", b: "thenCompose(), thenCombine(), allOf()" }
  - { aspect: "Failure", a: "get() throws ExecutionException", b: "exceptionally() or handle() recover in the chain" }
  - { aspect: "Complete by hand", a: "No", b: "complete(value), completeExceptionally(ex)" }
verdict: "Future is enough to wait for one task; use CompletableFuture when steps depend on each other or should run together without blocking."
sayIt: "A Future only lets me block on get(), check or cancel. CompletableFuture also implements Future, but lets me chain steps with thenApply and thenCompose, combine results with thenCombine or allOf, add timeouts and recover with exceptionally, without blocking in between."
sources:
