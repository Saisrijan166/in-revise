id: synchronized-vs-volatile
tech: java
title: "synchronized vs volatile"
compares: [synchronized-keyword, volatile-keyword]
gist:
  - "A lock: one thread at a time, plus visibility"
  - "No lock: visibility and ordering for one field"
rows:
  - { aspect: "Goes on", a: "Methods and blocks", b: "Fields only" }
  - { aspect: "One thread at a time", a: "Yes", b: "No" }
  - { aspect: "Visibility", a: "Unlock happens-before the next lock of that monitor", b: "A write happens-before every later read of that field" }
  - { aspect: "count++ safe", a: "Yes", b: "No: read, add and write can interleave" }
  - { aspect: "Can block a thread", a: "Yes (BLOCKED state)", b: "Never" }
verdict: "volatile for a flag or a reference one thread writes; synchronized or an atomic class for any read-modify-write."
sources:
  - title: "JLS SE 25, 17.4.5 Happens-before Order"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.4.5"
    verifiedOn: "2026-10-19"
  - title: "JLS SE 25, 8.3.1.4 volatile Fields"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.3.1.4"
    verifiedOn: "2026-10-19"
  - title: "Atomic Access (The Java Tutorials)"
    url: "https://docs.oracle.com/javase/tutorial/essential/concurrency/atomic.html"
    verifiedOn: "2026-10-19"
