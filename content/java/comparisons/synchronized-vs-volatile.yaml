id: synchronized-vs-volatile
tech: java
title: "synchronized vs volatile"
compares: [synchronized-keyword, volatile-keyword]
gist:
  - "A lock: one thread at a time, plus visibility"
  - "No lock: visibility and ordering for one field"
explain:
  - "synchronized locks an object's monitor, so only one thread at a time runs the protected code, and its writes are seen by the next thread that takes the lock."
  - "volatile marks a field so that every read sees the latest write by any thread. It takes no lock and never blocks, but it cannot make a read-modify-write such as count++ atomic."
example: "A stop flag that one thread sets and a worker reads fits volatile boolean running. A running total of payments, totalPaise += paise, reads and then writes, so it needs synchronized, a lock or an AtomicLong; volatile alone would still lose updates."
rows:
  - { aspect: "Goes on", a: "Methods and blocks", b: "Fields only" }
  - { aspect: "One thread at a time", a: "Yes", b: "No" }
  - { aspect: "Visibility", a: "Unlock happens-before the next lock of that monitor", b: "A write happens-before every later read of that field" }
  - { aspect: "count++ safe", a: "Yes", b: "No: read, add and write can interleave" }
  - { aspect: "Can block a thread", a: "Yes (BLOCKED state)", b: "Never" }
verdict: "volatile for a flag or a reference one thread writes; synchronized or an atomic class for any read-modify-write."
sayIt: "synchronized gives mutual exclusion plus visibility. volatile gives only visibility and ordering for one field, with no locking. I use volatile for a flag or a reference written by one thread, and synchronized or an atomic class for any read-modify-write."
sources:
  - title: "JLS SE 25, 17.4.5 Happens-before Order"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.4.5"
    verifiedOn: "2026-10-19"
