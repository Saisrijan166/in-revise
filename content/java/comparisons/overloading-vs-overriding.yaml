id: overloading-vs-overriding
tech: java
title: Overloading vs Overriding
compares: [method-overloading, method-overriding]
gist:
  - "Same name, new parameter list, picked at compile time"
  - "Same signature in a subclass, picked at run time"
rows:
  - { aspect: "Parameters", a: "Must differ", b: "Must be the same" }
  - { aspect: "Where", a: "Same class, or inherited", b: "A subclass or implementing class" }
  - { aspect: "Chosen by", a: "Compile-time argument types", b: "The object's class at run time" }
  - { aspect: "Return type", a: "Free, but cannot differ alone", b: "Same or a subtype (covariant)" }
  - { aspect: "static, private, final", a: "Can be overloaded", b: "Cannot be overridden" }
  - { aspect: "Checked exceptions", a: "Free", b: "No new or broader ones" }
verdict: "Overload for convenience versions of one method; override to change inherited behaviour, always with @Override."
sources:
  - title: "JLS SE 25, 8.4.8 Inheritance, Overriding, and Hiding"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.8"
    verifiedOn: "2026-10-19"
  - title: "JLS SE 25, 8.4.9 Overloading"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.9"
    verifiedOn: "2026-10-19"
