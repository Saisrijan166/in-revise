id: overloading-vs-overriding
tech: java
title: Overloading vs Overriding
compares: [method-overloading, method-overriding]
gist:
  - "Same name, new parameter list, picked at compile time"
  - "Same signature in a subclass, picked at run time"
explain:
  - "Overloading gives one class several methods with the same name and different parameter lists, such as pay(long) and pay(long, String). The compiler picks one from the argument types."
  - "Overriding lets a subclass replace an inherited method with its own version, keeping the same name and parameters. The JVM runs the version of the object's real class."
example: "PaymentService has pay(long paise) and pay(long paise, String currency): overloading, chosen by the arguments you pass. CardPayment redefines fee(long) from PaymentMethod: overriding, so a PaymentMethod variable holding a CardPayment charges the card fee."
rows:
  - { aspect: "Parameter lists", a: "Must differ", b: "Must be the same" }
  - { aspect: "Where the methods are", a: "In one class, or inherited into it", b: "In a subclass or implementing class" }
  - { aspect: "Chosen by", a: "The compiler, from declared argument types", b: "The JVM, from the object's class at run time" }
  - { aspect: "Return type", a: "Any, but a different return type alone is not enough", b: "The same type or a subtype (covariant)" }
  - { aspect: "static, private, final methods", a: "Can be overloaded", b: "Cannot be overridden" }
  - { aspect: "Checked exceptions", a: "No restriction", b: "No new or broader ones than the parent's" }
verdict: "Overload to offer convenient versions of one method; override to change inherited behaviour, always with @Override."
sayIt: "Overloading is several methods with one name and different parameters in a class, picked by the compiler. Overriding is a subclass redefining an inherited method with the same signature, picked at run time from the real object."
sources:
  - title: "JLS SE 25, 8.4.8 Inheritance, Overriding, and Hiding"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.8"
    verifiedOn: "2026-10-19"
