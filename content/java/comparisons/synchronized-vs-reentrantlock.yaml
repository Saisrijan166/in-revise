id: synchronized-vs-reentrantlock
tech: java
title: "synchronized vs ReentrantLock"
compares: [synchronized-keyword, reentrantlock]
gist:
  - "Built in: the lock is released automatically"
  - "A class: lock() and unlock() by hand, more options"
explain:
  - "synchronized is a keyword that locks an object's monitor for a method or block. The JVM releases the lock when the code ends, even through an exception, so you cannot forget to unlock."
  - "ReentrantLock is a class from java.util.concurrent.locks. You call lock() and unlock() yourself, and in return get tryLock with a timeout, interruptible waits, a fair mode and several Condition objects."
example: "Updating a wallet balance needs only one thread at a time, so a synchronized method is enough. A transfer that must not hang if a wallet stays locked uses lock.tryLock(1, TimeUnit.SECONDS), and gives up with an error after one second."
rows:
  - { aspect: "Release", a: "Automatic, even when an exception is thrown", b: "You call unlock() in finally" }
  - { aspect: "Try or time out", a: "No: waits until free", b: "tryLock(), tryLock(timeout)" }
  - { aspect: "Interruptible wait", a: "No", b: "lockInterruptibly()" }
  - { aspect: "Fairness", a: "No option", b: "new ReentrantLock(true)" }
  - { aspect: "Waiting for a condition", a: "wait() and notify() on one object", b: "Several Condition objects via newCondition()" }
  - { aspect: "Reentrant", a: "Yes", b: "Yes" }
verdict: "Start with synchronized; switch to ReentrantLock when you need tryLock, timeouts, interruptible waits, fairness or several conditions."
sayIt: "Both are reentrant locks with the same visibility rules. synchronized is simpler and always released automatically. I use ReentrantLock only when I need tryLock or a timeout, an interruptible wait, fairness or several conditions, and then I unlock in finally."
sources:
