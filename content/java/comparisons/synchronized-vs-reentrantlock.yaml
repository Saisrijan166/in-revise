id: synchronized-vs-reentrantlock
tech: java
title: "synchronized vs ReentrantLock"
compares: [synchronized-keyword, reentrantlock]
gist:
  - "Built in: the lock is released automatically"
  - "A class: lock() and unlock() by hand, more options"
rows:
  - { aspect: "Release", a: "Automatic, even when an exception is thrown", b: "You call unlock() in finally" }
  - { aspect: "Try or time out", a: "No: waits until free", b: "tryLock(), tryLock(timeout)" }
  - { aspect: "Interruptible wait", a: "No", b: "lockInterruptibly()" }
  - { aspect: "Fairness", a: "No option", b: "new ReentrantLock(true)" }
  - { aspect: "Waiting for a condition", a: "wait() and notify() on one object", b: "Several Condition objects via newCondition()" }
  - { aspect: "Reentrant", a: "Yes", b: "Yes" }
verdict: "Start with synchronized; switch to ReentrantLock when you need tryLock, timeouts, interruptible waits, fairness or several conditions."
sources:
  - title: "Lock (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/Lock.html"
    verifiedOn: "2026-10-19"
  - title: "ReentrantLock (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html"
    verifiedOn: "2026-10-19"
