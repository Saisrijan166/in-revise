id: throw-vs-throws
tech: java
title: throw vs throws
compares: [throw-keyword, throws-clause]
gist:
  - "An action: raise this exception now"
  - "A declaration: this method may throw these"
explain:
  - "throw is a statement inside a method body. It takes one exception object and throws it at that line, so your code can report a problem it found, such as a negative amount."
  - "throws is a list in a method or constructor signature. It names the exception classes that may leave the method, so callers know what to handle; the compiler requires it for checked exceptions."
example: "void pay(long paise) throws PaymentFailedException { if (paise <= 0) throw new IllegalArgumentException(\"amount\"); ... } Here throw raises an unchecked exception now, and needs no throws entry. throws PaymentFailedException warns callers about the checked exception pay may pass on."
rows:
  - { aspect: "What it is", a: "A statement", b: "Part of a method or constructor signature" }
  - { aspect: "Where", a: "Inside the body", b: "After the parameter list" }
  - { aspect: "Followed by", a: "One Throwable object: throw new X()", b: "One or more class names, comma-separated" }
  - { aspect: "Required when", a: "You want to raise an exception", b: "A checked exception can escape; optional for unchecked" }
verdict: "throw raises an exception; throws tells callers which ones may escape."
sayIt: "throw is the statement that raises one exception object at a line in the body. throws is part of the signature and lists the exceptions that may leave the method; it is required for checked exceptions and optional for unchecked ones."
sources:
  - title: "JLS SE 25, 14.18 The throw statement"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.18"
