id: throw-vs-throws
tech: java
title: throw vs throws
compares: [throw-keyword, throws-clause]
gist:
  - "An action: raise this exception now"
  - "A declaration: this method may throw these"
rows:
  - { aspect: "What it is", a: "A statement", b: "Part of a method or constructor signature" }
  - { aspect: "Where", a: "Inside the body", b: "After the parameter list" }
  - { aspect: "Followed by", a: "One Throwable object: throw new X()", b: "One or more class names, comma-separated" }
  - { aspect: "Required when", a: "You want to raise an exception", b: "A checked exception can escape; optional for unchecked" }
verdict: "throw raises an exception; throws tells callers which ones may escape."
sources:
  - title: "JLS SE 25, 14.18 The throw statement"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.18"
    verifiedOn: "2026-10-19"
  - title: "JLS SE 25, 8.4.6 Method Throws"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.6"
    verifiedOn: "2026-10-19"
  - title: "Specifying the Exceptions Thrown by a Method (The Java Tutorials)"
    url: "https://docs.oracle.com/javase/tutorial/essential/exceptions/declaring.html"
    verifiedOn: "2026-10-19"
