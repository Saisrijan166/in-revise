id: equals-vs-double-equals
tech: java
title: "== vs equals()"
compares: [reference-equality, equals-method]
gist:
  - "Same object? (or same value for primitives)"
  - "Same meaning, as the class defines it"
explain:
  - "== is an operator. On primitives it compares the values; on objects it asks whether both references point to the very same object."
  - "equals() is a method every object has. A class such as String overrides it to compare content, so two separate objects with the same text are equal."
example: "String a = \"PAID\"; String b = new String(\"PAID\"); Here a == b is false, because b is a separate object, but a.equals(b) is true, because both hold the text PAID. For int x = 5, y = 5, x == y is true: primitives compare values."
rows:
  - { aspect: "What it is", a: "An operator", b: "A method that every object inherits from Object" }
  - { aspect: "On primitives", a: "Compares the values", b: "Cannot be called on a primitive" }
  - { aspect: "On objects", a: "True only for the same object", b: "True for equal content, if the class overrides it" }
  - { aspect: "Class does not override equals", a: "Same behaviour as always", b: "Falls back to ==, the same-object check" }
  - { aspect: "With null", a: "null == null is true", b: "x.equals(null) is false; calling equals on null throws" }
verdict: "Use == for primitives, enums and identity checks; use equals() or Objects.equals(a, b) for content."
sayIt: "== compares primitive values, or for objects checks that two references point to the same object. equals() compares content when the class overrides it, as String does. So I compare strings and wrappers with equals, or Objects.equals when either side may be null."
sources:
  - title: "JLS SE 25, 15.21 Equality Operators"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.21"
    verifiedOn: "2026-10-19"
  - title: "Object.equals (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)"
    verifiedOn: "2026-10-19"
