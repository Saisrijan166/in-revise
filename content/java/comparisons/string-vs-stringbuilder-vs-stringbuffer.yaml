id: string-vs-stringbuilder-vs-stringbuffer
tech: java
title: String vs StringBuilder vs StringBuffer
compares: [string-class, string-builder, string-buffer]
gist:
  - "Immutable: every change makes a new object"
  - "Mutable, not synchronised: the default builder"
  - "Mutable and synchronised: for a shared buffer"
explain:
  - "String holds fixed text. Every method that seems to change it returns a new String, which makes strings safe to share and to use as map keys."
  - "StringBuilder (Java 5) is a changeable text buffer. append, insert and reverse change it in place, so building text step by step is cheap."
  - "StringBuffer (Java 1.0) is the same kind of changeable buffer, but its methods are synchronised, so several threads can safely use one buffer."
example: "A payment report is built from 10,000 lines in one method. With String and += every line copies all the text so far. One StringBuilder appends each line into one buffer and calls toString() once. StringBuffer would also work, but its locking only costs time when no other thread shares it."
rows:
  - { aspect: "Changes in place", a: "No", b: "Yes", c: "Yes" }
  - { aspect: "Thread-safe", a: "Yes, because it never changes", b: "No", c: "Yes, synchronised methods" }
  - { aspect: "Cost of many edits", a: "Slow: a new String each time", b: "Fastest", c: "Slower than StringBuilder" }
  - { aspect: "Does equals compare text?", a: "Yes", b: "No, same-object check from Object", c: "No, same-object check from Object" }
  - { aspect: "Since", a: "Java 1.0", b: "Java 5", c: "Java 1.0" }
verdict: "Use String for values, StringBuilder to build text, and StringBuffer only when threads share one buffer."
sayIt: "String is immutable, so every change makes a new object. StringBuilder and StringBuffer are both mutable buffers; StringBuffer is synchronised and StringBuilder is not. I use StringBuilder to build text in a loop, and StringBuffer only when threads really share one buffer."
