id: string-vs-stringbuilder-vs-stringbuffer
tech: java
title: String vs StringBuilder vs StringBuffer
compares: [string-class, string-builder, string-buffer]
gist:
  - "Immutable: every change makes a new object"
  - "Mutable, not synchronised: the default builder"
  - "Mutable and synchronised: for a shared buffer"
rows:
  - { aspect: "Changes in place", a: "No", b: "Yes", c: "Yes" }
  - { aspect: "Thread-safe", a: "Yes, because it never changes", b: "No", c: "Yes, synchronised methods" }
  - { aspect: "Many edits", a: "Slow: a new String each time", b: "Fastest", c: "Slower than StringBuilder" }
  - { aspect: "equals compares text", a: "Yes", b: "No, inherits Object.equals", c: "No, inherits Object.equals" }
  - { aspect: "Since", a: "Java 1.0", b: "Java 5", c: "Java 1.0" }
verdict: "Use String for values, StringBuilder to build text, and StringBuffer only when threads share one buffer."
sources:
  - title: "String (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html"
    verifiedOn: "2026-10-19"
  - title: "StringBuilder (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StringBuilder.html"
    verifiedOn: "2026-10-19"
  - title: "StringBuffer (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StringBuffer.html"
    verifiedOn: "2026-10-19"
