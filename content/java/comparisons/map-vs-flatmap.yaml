id: map-vs-flatmap
tech: java
title: "map vs flatMap"
compares: [map-operation, flatmap-operation]
gist:
  - "One element in, one element out"
  - "One element in, a stream out, flattened into one"
rows:
  - { aspect: "The function returns", a: "A value R", b: "A Stream<R>" }
  - { aspect: "Outputs per element", a: "Exactly one", b: "Zero or more" }
  - { aspect: "Lists of lists", a: "Stay nested: Stream<List<T>>", b: "Become one Stream<T>" }
  - { aspect: "Example", a: "users.map(User::name)", b: "orders.flatMap(o -> o.items().stream())" }
  - { aspect: "On Optional", a: "Wraps the result in an Optional", b: "For a function that already returns Optional" }
verdict: "Use map to transform each element; use flatMap when each element gives a stream or Optional to merge."
sources:
  - title: "Stream (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html"
    verifiedOn: "2026-10-19"
  - title: "Optional (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Optional.html"
    verifiedOn: "2026-10-19"
