id: comparable-vs-comparator
tech: java
title: Comparable vs Comparator
compares: [comparable-interface, comparator-interface]
gist:
  - "The class's own natural order"
  - "Any order you supply from outside"
explain:
  - "Comparable is an interface a class implements to give itself one natural order, in compareTo(other). Sorts and sorted collections use it when you pass no order."
  - "Comparator is a separate object with compare(a, b). It solves every other order, and ordering a class you cannot edit, without touching the class."
example: "Payment implements Comparable by id, so Collections.sort(payments) sorts by id. The refunds screen needs the largest amount first, so it calls payments.sort(Comparator.comparingLong(Payment::amount).reversed()) and Payment stays unchanged."
rows:
  - { aspect: "Package and method", a: "java.lang, compareTo(o)", b: "java.util, compare(a, b)" }
  - { aspect: "Written in", a: "The class itself", b: "A separate class or a lambda" }
  - { aspect: "How many", a: "One per class", b: "Any number" }
  - { aspect: "Used by", a: "Collections.sort(list), new TreeSet<>()", b: "list.sort(c), new TreeSet<>(c)" }
  - { aspect: "Examples", a: "String, Integer, LocalDate", b: "Comparator.comparing(Student::name)" }
verdict: "Implement Comparable when a class has one obvious order; use Comparators for every other order and for classes you cannot change."
sayIt: "Comparable is the natural order inside the class, through compareTo, used by default by Collections.sort and TreeSet. Comparator is an order from outside, through compare, so a class can have many. I build comparators with comparing, thenComparing and reversed."
sources:
  - title: "Comparable (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Comparable.html"
    verifiedOn: "2026-10-19"
  - title: "Comparator (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Comparator.html"
    verifiedOn: "2026-10-19"
