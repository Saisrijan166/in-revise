id: list-of-vs-unmodifiable-list
tech: java
title: "List.of vs Collections.unmodifiableList"
compares: [list-of-factory, unmodifiable-view]
gist:
  - "A new list that can never change"
  - "A read-only window on a list that can still change"
explain:
  - "List.of(...) (Java 9) creates a new unmodifiable list from the values you give; List.copyOf(list) (Java 10) does the same from an existing collection. Nothing can ever add to or change it."
  - "Collections.unmodifiableList(list) wraps an existing list in a read-only view. Callers cannot change it through the view, but whoever holds the original list still can, and those changes show through."
example: "PaymentService keeps a private ArrayList of today's payments and keeps adding to it. A getter that returns Collections.unmodifiableList(payments) shows callers each new payment as it arrives. A getter that returns List.copyOf(payments) gives a snapshot that stays the same forever."
rows:
  - { aspect: "What you get", a: "A new unmodifiable list", b: "A view over an existing list" }
  - { aspect: "Later changes to the original list", a: "Not visible; List.copyOf took a snapshot", b: "Visible through the view" }
  - { aspect: "null elements", a: "Throw NullPointerException", b: "Allowed if the original list has them" }
  - { aspect: "add, set, remove", a: "Throw UnsupportedOperationException", b: "Throw UnsupportedOperationException" }
  - { aspect: "Truly immutable?", a: "Only if the elements are immutable too", b: "No: the original list can change" }
verdict: "Return List.of or List.copyOf for a fixed result; use unmodifiableList to share a read-only view of a list you still update."
sayIt: "List.of and List.copyOf create a new unmodifiable list, a snapshot nobody can change, and they reject nulls. Collections.unmodifiableList is only a read-only view: callers cannot change it, but changes to the underlying list still show through."
sources:
  - title: "List: Unmodifiable Lists, List.of, List.copyOf (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html"
    verifiedOn: "2026-10-21"
