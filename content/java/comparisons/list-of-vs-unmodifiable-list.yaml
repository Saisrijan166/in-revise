id: list-of-vs-unmodifiable-list
tech: java
title: "List.of vs Collections.unmodifiableList"
compares: [list-of-factory, unmodifiable-view]
gist:
  - "A new list that can never change"
  - "A read-only window on a list that can still change"
rows:
  - { aspect: "What you get", a: "A new unmodifiable list (Java 9+)", b: "A view over an existing list" }
  - { aspect: "Later changes to the source", a: "No source; List.copyOf(list) takes a snapshot", b: "Show through the view" }
  - { aspect: "null elements", a: "Throw NullPointerException", b: "Allowed if the source has them" }
  - { aspect: "add, set, remove", a: "UnsupportedOperationException", b: "UnsupportedOperationException" }
  - { aspect: "Truly immutable?", a: "Only if the elements are immutable too", b: "No: the source can change" }
verdict: "Return List.of or List.copyOf for a fixed result; use unmodifiableList to share a read-only view of a list you still update."
sources:
  - title: "List: Unmodifiable Lists (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html"
    verifiedOn: "2026-10-19"
  - title: "Collections.unmodifiableList (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Collections.html"
    verifiedOn: "2026-10-19"
