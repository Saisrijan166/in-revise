id: findfirst-vs-findany
tech: java
title: "findFirst vs findAny"
compares: [find-first, find-any]
gist:
  - "The first element in encounter order"
  - "Any element: whichever is cheapest to get"
rows:
  - { aspect: "On an ordered stream", a: "Always the first element", b: "Any element; can differ between runs" }
  - { aspect: "In parallel", a: "Must respect order, so can cost more", b: "Free to take whichever thread finds one" }
  - { aspect: "Unordered source, like a HashSet", a: "Any element may come back", b: "Any element" }
  - { aspect: "Returns", a: "Optional<T>, empty for an empty stream", b: "Optional<T>, empty for an empty stream" }
  - { aspect: "Selected element is null", a: "NullPointerException", b: "NullPointerException" }
verdict: "Use findFirst when the answer depends on order; findAny when any match will do, mainly in parallel streams."
sources:
  - title: "Stream.findFirst, findAny (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html"
    verifiedOn: "2026-10-20"
