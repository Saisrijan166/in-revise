id: findfirst-vs-findany
tech: java
title: "findFirst vs findAny"
compares: [find-first, find-any]
gist:
  - "The first element in encounter order"
  - "Any element: whichever is cheapest to get"
explain:
  - "findFirst() returns the first element in the stream's encounter order, inside an Optional. Use it when the answer depends on order, such as the earliest payment in a list sorted by time."
  - "findAny() returns some element, inside an Optional, and is free to pick whichever is cheapest to get. Use it when any match will do, mainly so a parallel stream can stop at the first thread that finds one."
example: "payments.stream().filter(p -> p.status() == Status.FAILED).findFirst() always gives the first failed payment in the list. With parallelStream() and findAny(), it may give a different failed payment on each run, but it can finish sooner."
rows:
  - { aspect: "On an ordered stream", a: "Always the first element", b: "Any element; can differ between runs" }
  - { aspect: "In parallel", a: "Must respect order, so can cost more", b: "Free to take whichever thread finds one" }
  - { aspect: "Unordered source, like a HashSet", a: "Any element may come back", b: "Any element" }
  - { aspect: "Returns", a: "Optional<T>, empty for an empty stream", b: "Optional<T>, empty for an empty stream" }
  - { aspect: "Selected element is null", a: "NullPointerException", b: "NullPointerException" }
verdict: "Use findFirst when the answer depends on order; findAny when any match will do, mainly in parallel streams."
sayIt: "findFirst returns the first element in encounter order; findAny may return any element, which lets a parallel stream finish sooner. Both return an Optional that is empty for an empty stream. I use findFirst when order matters and findAny when any match is enough."
sources:
  - title: "Stream.findFirst, findAny (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html"
    verifiedOn: "2026-10-20"
