id: primitive-vs-wrapper
tech: java
title: Primitive vs Wrapper
compares: [primitive-types, wrapper-class]
gist:
  - "A plain value: small, fast, never null"
  - "An object around a value: can be null, fits collections"
rows:
  - { aspect: "Example", a: "int, double, boolean", b: "Integer, Double, Boolean" }
  - { aspect: "Can be null", a: "No", b: "Yes" }
  - { aspect: "Default as a field", a: "0, 0.0 or false", b: "null" }
  - { aspect: "In collections and generics", a: "Not allowed: List<int> fails", b: "Yes: List<Integer>" }
  - { aspect: "Compare values with", a: "==", b: "equals (== compares references)" }
verdict: "Use primitives for numbers and maths; use wrappers where an object or null is needed, as in collections."
sources:
  - title: "JLS SE 25, chapter 4: Types, Values, and Variables"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html"
    verifiedOn: "2026-10-19"
  - title: "JLS SE 25, 5.1.7 Boxing Conversion"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html#jls-5.1.7"
    verifiedOn: "2026-10-19"
