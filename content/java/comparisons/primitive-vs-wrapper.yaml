id: primitive-vs-wrapper
tech: java
title: Primitive vs Wrapper
compares: [primitive-types, wrapper-class]
gist:
  - "A plain value: small, fast, never null"
  - "An object around a value: can be null, fits collections"
explain:
  - "A primitive such as int holds a plain value directly in the variable. It is small and fast, and it can never be null."
  - "A wrapper such as Integer is an object that holds one primitive value. It can be null and can be stored in collections like List<Integer>."
example: "A payment amount used in maths is a long: fast, never null. A list of amounts must be List<Long>, because collections hold only objects, so each amount is boxed into a Long. A database column that may be empty maps to Long, where null means no value."
rows:
  - { aspect: "Example", a: "int, double, boolean", b: "Integer, Double, Boolean" }
  - { aspect: "Can be null", a: "No", b: "Yes" }
  - { aspect: "Default as a field", a: "0, 0.0 or false", b: "null" }
  - { aspect: "In collections and generics", a: "Not allowed: List<int> fails", b: "Yes: List<Integer>" }
  - { aspect: "Compare values with", a: "==", b: "equals (== compares references)" }
verdict: "Use primitives for numbers and maths; use wrappers where an object or null is needed, as in collections."
sayIt: "A primitive holds the value itself, is fast and cannot be null. A wrapper is an object around that value, so it can be null and go into collections and generics. Java boxes and unboxes automatically, but I compare wrappers with equals and watch for unboxing null."
sources:
  - title: "JLS SE 25, chapter 4: Types, Values, and Variables"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html"
    verifiedOn: "2026-10-19"
