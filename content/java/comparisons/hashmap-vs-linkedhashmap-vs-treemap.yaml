id: hashmap-vs-linkedhashmap-vs-treemap
tech: java
title: HashMap vs LinkedHashMap vs TreeMap
compares: [hashmap, linkedhashmap, treemap]
gist:
  - "Keys in no promised order"
  - "Keys in insertion or access order"
  - "Keys kept sorted"
rows:
  - { aspect: "Inside", a: "Hash table of buckets", b: "Hash table plus a linked list", c: "Red-black tree" }
  - { aspect: "get, put", a: "O(1) average", b: "O(1) average", c: "O(log n), guaranteed" }
  - { aspect: "null key", a: "One allowed", b: "One allowed", c: "Throws with natural order" }
  - { aspect: "Key needs", a: "hashCode and equals", b: "hashCode and equals", c: "Comparable or a Comparator" }
  - { aspect: "Extra", a: "None", b: "LRU cache via access order", c: "floorKey, ceilingKey, subMap" }
verdict: "Use HashMap by default, LinkedHashMap for a predictable order or an LRU cache, TreeMap for sorted keys or range lookups."
