id: hashmap-vs-linkedhashmap-vs-treemap
tech: java
title: HashMap vs LinkedHashMap vs TreeMap
compares: [hashmap, linkedhashmap, treemap]
gist:
  - "Keys in no promised order"
  - "Keys in insertion or access order"
  - "Keys kept sorted"
explain:
  - "HashMap stores entries in buckets chosen by the key's hashCode. It solves fast lookup by key, but it promises no order when you loop over it."
  - "LinkedHashMap is a HashMap that also links its entries in a list. It solves predictable order: the order keys were added, or the order they were last used."
  - "TreeMap keeps its keys in a red-black tree, sorted by their natural order or a Comparator. It solves sorted output and range questions such as the nearest key below x."
example: "Payments per day: HashMap<LocalDate, Long> prints the days in any order; LinkedHashMap prints them in the order the first payment of each day arrived; TreeMap prints them by date, and floorKey(today) finds the latest day up to today."
rows:
  - { aspect: "Inside", a: "Hash table of buckets", b: "Hash table plus a linked list", c: "Red-black tree" }
  - { aspect: "get, put", a: "O(1) average", b: "O(1) average", c: "O(log n), guaranteed" }
  - { aspect: "null key", a: "One allowed", b: "One allowed", c: "Throws with natural order" }
  - { aspect: "Key needs", a: "hashCode and equals", b: "hashCode and equals", c: "Comparable or a Comparator" }
  - { aspect: "Extra", a: "None", b: "LRU cache via access order", c: "floorKey, ceilingKey, subMap" }
verdict: "Use HashMap by default, LinkedHashMap for a predictable order or an LRU cache, TreeMap for sorted keys or range lookups."
sayIt: "HashMap gives O(1) average lookups but no order. LinkedHashMap keeps insertion order, or access order for an LRU cache, at almost the same speed. TreeMap keeps keys sorted, with range methods such as floorKey, at O(log n). I use HashMap unless I need an order."
