id: arraylist-vs-linkedlist
tech: java
title: ArrayList vs LinkedList
compares: [arraylist, linkedlist]
gist:
  - "A resizable array"
  - "A chain of doubly linked nodes"
explain:
  - "ArrayList keeps its items in an internal array and copies them into a bigger one when it fills up. It solves fast reading by position: get(i) jumps straight to slot i."
  - "LinkedList keeps each item in a node that points to the next and previous nodes. It solves cheap adds and removes at the two ends, because nothing has to shift."
example: "A payment screen shows page 50 of a list with get(i): ArrayList answers each call at once, while LinkedList walks node by node to reach it. A job list that only adds at the back and takes from the front suits a Deque; ArrayDeque usually beats LinkedList there too."
rows:
  - { aspect: "get(i)", a: "O(1)", b: "O(n): walks from the nearer end" }
  - { aspect: "Add at the end", a: "Amortised O(1)", b: "O(1)" }
  - { aspect: "Add or remove at the front", a: "O(n): shifts every item", b: "O(1)" }
  - { aspect: "Insert in the middle", a: "O(n): shifts items", b: "O(n) to walk there, O(1) to link" }
  - { aspect: "Also implements", a: "RandomAccess", b: "Deque" }
verdict: "Use ArrayList by default; LinkedList fits only heavy adds and removes at the ends or through an iterator, where ArrayDeque is often faster anyway."
sayIt: "ArrayList is a resizable array: O(1) get(i) and amortised O(1) add at the end, but inserts at the front shift every item. LinkedList is doubly linked: O(1) at the ends but O(n) to reach an index. I default to ArrayList, and use ArrayDeque for queues."
