id: checked-vs-unchecked
tech: java
title: Checked vs Unchecked Exceptions
compares: [checked-exception, unchecked-exception]
gist:
  - "Compiler makes you catch or declare it"
  - "Compiler does not check; often a bug"
explain:
  - "A checked exception is an expected failure, such as a missing file or a lost database connection. The compiler makes every method that can throw it either catch it or list it in throws, so callers cannot forget it."
  - "An unchecked exception is a RuntimeException or an Error. It usually means a bug, such as a null reference, or a serious JVM problem. The compiler does not force you to handle it."
example: "loadReceipt(file) reads a receipt that may be missing, so it declares throws IOException and the caller must handle it. splitPaise(amount, 0) divides by zero and throws ArithmeticException; it compiles with no handling, and the fix is to check the input in code."
diagrams:
  - |
    flowchart TD
      T[Throwable] --> E[Exception]
      E --> IO[IOException]
      E --> SQL[SQLException]
  - |
    flowchart TD
      T[Throwable] --> ER[Error]
      T --> E[Exception]
      E --> RT[RuntimeException]
      RT --> NPE[NullPointerException]
diagramAlt: "Checked: Throwable, then Exception, then IOException and SQLException. Unchecked: Error under Throwable, and RuntimeException under Exception, with NullPointerException under RuntimeException."
rows:
  - { aspect: "Classes", a: "Exception and its subclasses, except RuntimeException's", b: "RuntimeException, Error and their subclasses" }
  - { aspect: "Compiler", a: "Catch it or list it in throws", b: "No check; catch only if useful" }
  - { aspect: "Usually means", a: "An expected failure the caller can recover from", b: "A programming bug, or a serious JVM problem" }
  - { aspect: "Examples", a: "IOException, SQLException, InterruptedException", b: "NullPointerException, IllegalArgumentException, OutOfMemoryError" }
  - { aspect: "Thrown at", a: "Run time", b: "Run time" }
verdict: "Use checked when the caller can reasonably recover; unchecked for bugs the caller cannot fix."
sayIt: "Checked exceptions are Exception subclasses outside RuntimeException; the compiler makes me catch or declare them, so I use them for failures a caller can recover from. Unchecked ones, RuntimeException and Error, are not checked and usually mean a bug. Both are thrown at run time."
sources:
