id: stream-vs-collection
tech: java
title: "Stream vs Collection"
compares: [streams, collections-framework]
gist:
  - "A pipeline that computes a result, stores nothing"
  - "A data structure that holds elements"
explain:
  - "A stream is a pipeline that carries elements from a source through steps such as filter and map to one result. It stores nothing, never changes its source and can be used once."
  - "A collection, such as a List or a Set, is a data structure that holds elements in memory. You can add, remove and read them as often as you like."
example: "Keep today's payments in a List<Payment> and add to it as they arrive. To report the paid total, open a stream: payments.stream().filter(...).mapToLong(...).sum(). The list is unchanged, and the next report opens a new stream on it."
rows:
  - { aspect: "Holds elements", a: "No: it carries them from a source", b: "Yes" }
  - { aspect: "Changes the data", a: "Never changes its source", b: "add and remove change it" }
  - { aspect: "When work happens", a: "Lazily, at the terminal operation", b: "Elements are already there" }
  - { aspect: "Size", a: "Can be infinite, like Stream.iterate", b: "Always finite" }
  - { aspect: "Reuse", a: "Once; then get a new stream", b: "Iterate as often as you like" }
verdict: "Keep and change data in a collection; open a stream on it to compute a result."
sayIt: "A collection stores data and can be read and changed many times. A stream stores nothing: it computes a result from a source, lazily, and can be used only once. I keep data in a collection and open a stream on it when I need a result."
sources:
  - title: "Package java.util.stream (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/package-summary.html"
    verifiedOn: "2026-10-19"
