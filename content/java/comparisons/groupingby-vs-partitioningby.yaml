id: groupingby-vs-partitioningby
tech: java
title: "groupingBy vs partitioningBy"
compares: [grouping-by, partitioning-by]
gist:
  - "Any number of groups, one per key value"
  - "Exactly two groups: true and false"
explain:
  - "groupingBy(key) puts each element into a group by the value of a key function, such as Payment::status, and returns a map with one entry for each key that occurs."
  - "partitioningBy(test) splits the elements into two groups by a true or false test and returns a map with exactly two keys, true and false."
example: "groupingBy(Payment::status, counting()) on two PAID payments and one FAILED payment gives PAID=2 and FAILED=1, with no PENDING key at all. partitioningBy(p -> p.amountPaise() >= 50_000, counting()) gives {false=1, true=2}, and both keys stay even when a count is 0."
rows:
  - { aspect: "Takes", a: "A key function: Payment::status", b: "A test: p -> p.amountPaise() >= 50_000" }
  - { aspect: "Result", a: "Map<K, List<T>>", b: "Map<Boolean, List<T>>" }
  - { aspect: "Empty groups", a: "Absent: only keys that occur", b: "Both keys always there, maybe with an empty list" }
  - { aspect: "Downstream collector", a: "Yes: groupingBy(key, counting())", b: "Yes: partitioningBy(test, counting())" }
  - { aspect: "Choose the map type", a: "Yes: groupingBy(key, TreeMap::new, downstream)", b: "No map factory parameter" }
verdict: "Use partitioningBy for a yes/no split; groupingBy when the key can take more than two values."
sayIt: "groupingBy makes one group per key value, and only for keys that occur; partitioningBy makes exactly two groups, true and false, and both are always present. Both accept a downstream collector such as counting. For a yes or no split I use partitioningBy."
sources:
  - title: "Collectors (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Collectors.html"
    verifiedOn: "2026-10-20"
