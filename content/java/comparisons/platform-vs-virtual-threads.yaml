id: platform-vs-virtual-threads
tech: java
title: "Platform threads vs Virtual threads"
compares: [platform-thread, virtual-threads]
gist:
  - "Wraps an OS thread: costly, so pool a few"
  - "Scheduled by the JVM: cheap, one per task"
explain:
  - "A platform thread wraps an operating-system thread for its whole life. It is costly to create and to keep, so a program has a limited number and usually shares them through a pool."
  - "A virtual thread (Java 21) is managed by the JVM and runs on a platform thread only while it computes. When it blocks, it frees that thread, so a program can have millions of them."
example: "10,000 payment tasks each wait 1 second for the bank. A pool of 200 platform threads needs about 50 seconds, because only 200 tasks wait at a time. newVirtualThreadPerTaskExecutor() finishes in about 1 to 2 seconds, because all 10,000 wait at once."
rows:
  - { aspect: "Scheduled by", a: "The operating system", b: "The JVM, onto carrier platform threads" }
  - { aspect: "Cost", a: "Large stack and OS resources; limited", b: "Few resources; one JVM can hold millions" }
  - { aspect: "Pool them", a: "Usually", b: "Never: a new virtual thread per task" }
  - { aspect: "Best for", a: "Any task, including CPU-heavy work", b: "Tasks that spend most time blocked on I/O" }
  - { aspect: "Create with", a: "new Thread(r), Thread.ofPlatform()", b: "Thread.ofVirtual(), newVirtualThreadPerTaskExecutor()" }
verdict: "A sized pool of platform threads for CPU-bound work; virtual threads (Java 21+) for many blocking tasks written in plain blocking style."
sayIt: "Platform threads map to OS threads, are costly, and are pooled; they suit CPU-bound work. Virtual threads, final in Java 21, are cheap and scheduled by the JVM onto carrier threads, so I create one per blocking task and never pool them."
sources:
