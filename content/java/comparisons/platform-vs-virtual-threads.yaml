id: platform-vs-virtual-threads
tech: java
title: "Platform threads vs Virtual threads"
compares: [platform-thread, virtual-threads]
gist:
  - "Wraps an OS thread: costly, so pool a few"
  - "Scheduled by the JVM: cheap, one per task"
rows:
  - { aspect: "Scheduled by", a: "The operating system", b: "The JVM, onto carrier platform threads" }
  - { aspect: "Cost", a: "Large stack and OS resources; limited", b: "Few resources; one JVM can hold millions" }
  - { aspect: "Pool them", a: "Usually", b: "Never: a new virtual thread per task" }
  - { aspect: "Best for", a: "Any task, including CPU-heavy work", b: "Tasks that spend most time blocked on I/O" }
  - { aspect: "Create with", a: "new Thread(r), Thread.ofPlatform()", b: "Thread.ofVirtual(), newVirtualThreadPerTaskExecutor()" }
verdict: "A sized pool of platform threads for CPU-bound work; virtual threads (Java 21+) for many blocking tasks written in plain blocking style."
sources:
  - title: "Thread: platform and virtual threads (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html"
    verifiedOn: "2026-10-19"
  - title: "JEP 444: Virtual Threads"
    url: "https://openjdk.org/jeps/444"
    verifiedOn: "2026-10-19"
