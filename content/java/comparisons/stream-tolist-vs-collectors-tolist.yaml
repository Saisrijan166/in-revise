id: stream-tolist-vs-collectors-tolist
tech: java
title: "Stream.toList vs Collectors.toList vs toUnmodifiableList"
compares: [stream-tolist, collectors-tolist, to-unmodifiable-list]
gist:
  - "Java 16+: shortest, unmodifiable, nulls allowed"
  - "Java 8+: no promise about type or mutability"
  - "Java 10+: unmodifiable, a null throws"
rows:
  - { aspect: "Written as", a: "stream.toList()", b: "collect(Collectors.toList())", c: "collect(Collectors.toUnmodifiableList())" }
  - { aspect: "add or set", a: "UnsupportedOperationException", b: "Works in OpenJDK (an ArrayList), not promised", c: "UnsupportedOperationException" }
  - { aspect: "null elements", a: "Allowed", b: "Allowed", c: "NullPointerException" }
  - { aspect: "Since", a: "Java 16", b: "Java 8", c: "Java 10" }
verdict: "Use stream.toList() for a read-only result; collect(Collectors.toCollection(ArrayList::new)) when the caller must change the list."
sources:
  - title: "Stream.toList (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html"
    verifiedOn: "2026-10-20"
  - title: "Collectors.toList, toUnmodifiableList (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Collectors.html"
    verifiedOn: "2026-10-20"
