id: stream-tolist-vs-collectors-tolist
tech: java
title: "Stream.toList vs Collectors.toList vs toUnmodifiableList"
compares: [stream-tolist, collectors-tolist, to-unmodifiable-list]
gist:
  - "Java 16+: shortest, unmodifiable, nulls allowed"
  - "Java 8+: no promise about type or mutability"
  - "Java 10+: unmodifiable, a null throws"
explain:
  - "stream.toList(), added in Java 16, collects the elements into an unmodifiable List. Null elements are allowed."
  - "collect(Collectors.toList()), from Java 8, collects the elements into a List, but the API promises nothing about its type or whether you can change it."
  - "collect(Collectors.toUnmodifiableList()), added in Java 10, collects into an unmodifiable List and throws NullPointerException if an element is null."
example: "List<Payment> paid = payments.stream().filter(...).toList(); then paid.add(extra) throws UnsupportedOperationException. If the caller must add to the list, collect(Collectors.toCollection(ArrayList::new)) gives a list that is certainly a changeable ArrayList."
rows:
  - { aspect: "Written as", a: "stream.toList()", b: "collect(Collectors.toList())", c: "collect(Collectors.toUnmodifiableList())" }
  - { aspect: "add or set", a: "UnsupportedOperationException", b: "Works in OpenJDK (an ArrayList), not promised", c: "UnsupportedOperationException" }
  - { aspect: "null elements", a: "Allowed", b: "Allowed", c: "NullPointerException" }
  - { aspect: "Since", a: "Java 16", b: "Java 8", c: "Java 10" }
verdict: "Use stream.toList() for a read-only result; collect(Collectors.toCollection(ArrayList::new)) when the caller must change the list."
sayIt: "stream.toList(), from Java 16, gives an unmodifiable list, and it is my default. Collectors.toList() promises nothing about mutability, even though OpenJDK returns an ArrayList. When I need a list I can change, I ask for one with toCollection(ArrayList::new)."
sources:
