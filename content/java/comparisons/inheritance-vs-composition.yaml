id: inheritance-vs-composition
tech: java
title: Inheritance vs Composition
compares: [is-a-relationship, has-a-relationship]
gist:
  - "CardPayment extends Payment: a card payment is a payment"
  - "PaymentService holds a Gateway field and calls it"
explain:
  - "Inheritance means a class extends a parent class and gets its fields and methods. It fits an is-a link, such as CardPayment is a Payment, and lets one method accept every kind of payment."
  - "Composition means a class keeps another object in a field and calls its methods. It fits a has-a link, such as PaymentService has a Gateway, and reuses code without depending on the helper's inner workings."
example: "CardPayment extends Payment because a card payment really is a payment. PaymentService does not extend Gateway: it holds a Gateway field and calls charge(). In a test, you can pass a fake gateway instead, which extends would not allow."
rows:
  - { aspect: "Relation", a: "is-a", b: "has-a" }
  - { aspect: "How many", a: "One superclass", b: "Any number of fields" }
  - { aspect: "Coupling", a: "Child depends on the parent's code", b: "Only on the helper's public methods" }
  - { aspect: "Parent changes", a: "Can silently change the child", b: "Hidden behind your own methods" }
  - { aspect: "Swap at run time", a: "No: fixed by extends", b: "Yes: assign another object" }
verdict: "Extend only for a true is-a that you control; otherwise hold the object and delegate to it."
sayIt: "Inheritance is is-a: the child extends one parent and depends on its code, so parent changes can break it. Composition is has-a: I hold the helper in a field and call its public methods, so I can swap it. I prefer composition unless the is-a is real and I control the parent."
sources:
  - title: "Secure Coding Guidelines for Java SE, Guideline 4-6 (superclass affects subclass)"
    url: "https://www.oracle.com/java/technologies/javase/seccodeguide.html"
    verifiedOn: "2026-10-19"
  - title: "JLS SE 25, 8.1.4 Superclasses and Subclasses"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.1.4"
    verifiedOn: "2026-10-19"
