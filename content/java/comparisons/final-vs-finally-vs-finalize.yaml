id: final-vs-finally-vs-finalize
tech: java
title: final vs finally vs finalize()
compares: [final-keyword, try-catch-finally, finalize-method]
gist:
  - "A modifier: no reassign, override or subclass"
  - "A block after try that runs however try ends"
  - "An old Object method for cleanup by the GC"
rows:
  - { aspect: "What it is", a: "Keyword (modifier)", b: "Keyword (block)", c: "Method of Object" }
  - { aspect: "Used for", a: "Variables, methods, classes", b: "Cleanup after try or catch", c: "Cleanup before the GC reclaims an object" }
  - { aspect: "Runs when", a: "Checked at compile time", b: "As try or catch finishes", c: "Maybe never: no timing guarantee" }
  - { aspect: "Status in Java 25", a: "Normal use", b: "Normal use; try-with-resources for resources", c: "Deprecated since 9, for removal since 18" }
verdict: "Use final for things that must not change and finally or try-with-resources for cleanup; never write a new finalize()."
sources:
  - title: "Object.finalize() (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#finalize()"
    verifiedOn: "2026-10-19"
  - title: "JEP 421: Deprecate Finalization for Removal (JDK 18)"
    url: "https://openjdk.org/jeps/421"
    verifiedOn: "2026-10-19"
  - title: "JLS 25, 14.20.2 try-finally and try-catch-finally"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.20.2"
    verifiedOn: "2026-10-19"
