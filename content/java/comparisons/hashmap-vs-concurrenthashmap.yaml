id: hashmap-vs-concurrenthashmap
tech: java
title: "HashMap vs synchronizedMap vs ConcurrentHashMap"
compares: [map-hashmap, synchronized-map, concurrent-hashmap]
gist:
  - "Fast, but not thread-safe; allows nulls"
  - "A thread-safe wrapper: one call at a time"
  - "Thread-safe; reads do not lock; no nulls"
rows:
  - { aspect: "Thread-safe", a: "No: synchronise it yourself if any thread writes", b: "Yes: all calls lock the wrapper", c: "Yes" }
  - { aspect: "Reads", a: "No locking", b: "Wait for the lock", c: "Do not block; may overlap with updates" }
  - { aspect: "null key or value", a: "Allowed", b: "As the wrapped map", c: "Not allowed" }
  - { aspect: "Iterating during writes", a: "Fail-fast: ConcurrentModificationException", b: "You must hold synchronized (map) yourself", c: "Weakly consistent; never throws that exception" }
verdict: "HashMap inside one thread; ConcurrentHashMap whenever threads share a map; synchronizedMap only when one lock must guard all access."
