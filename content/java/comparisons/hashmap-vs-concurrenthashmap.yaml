id: hashmap-vs-concurrenthashmap
tech: java
title: "HashMap vs synchronizedMap vs ConcurrentHashMap"
compares: [map-hashmap, synchronized-map, concurrent-hashmap]
gist:
  - "Fast, but not thread-safe; allows nulls"
  - "A thread-safe wrapper: one call at a time"
  - "Thread-safe; reads do not lock; no nulls"
explain:
  - "HashMap is the ordinary hash table for one thread. It is the fastest, but if threads share it and one of them writes, you must lock it yourself, or the results are undefined."
  - "Collections.synchronizedMap wraps any map so that every method call takes one lock on the wrapper. It makes single calls thread-safe, but only one thread can use the map at a time."
  - "ConcurrentHashMap is a hash table built for many threads. Reads generally do not block, many updates can run at once, and compute and merge change one key atomically."
example: "A web service counts payments per merchant while many request threads run. With a HashMap, two threads updating the same count can lose an update. With ConcurrentHashMap, counts.merge(merchantId, 1, Integer::sum) adds 1 safely, and other threads keep reading while it does."
rows:
  - { aspect: "Thread-safe", a: "No: synchronise it yourself if any thread writes", b: "Yes: all calls lock the wrapper", c: "Yes" }
  - { aspect: "Reads", a: "No locking", b: "Wait for the lock", c: "Generally do not block; may overlap with updates" }
  - { aspect: "null key or value", a: "Allowed", b: "As the wrapped map", c: "Not allowed" }
  - { aspect: "Iterating during writes", a: "Fail-fast: ConcurrentModificationException", b: "You must hold synchronized (map) yourself", c: "Weakly consistent; never throws that exception" }
verdict: "HashMap inside one thread; ConcurrentHashMap whenever threads share a map; synchronizedMap only when one lock must guard all access."
sayIt: "HashMap is not thread-safe and allows nulls. synchronizedMap makes each call thread-safe with one lock, so threads queue up. ConcurrentHashMap lets reads run, generally without blocking, and many updates run at once, and it rejects nulls. Threads sharing a map get ConcurrentHashMap."
