id: abstract-class-vs-interface
tech: java
title: Abstract Class vs Interface
compares: [abstract-class, interface-type]
gist:
  - "A partly built parent that shares state and code"
  - "A contract: what a class can do"
explain:
  - "An abstract class is a class marked abstract, so it cannot be created with new. It can hold fields, constructors and finished methods, and leaves some methods abstract for each subclass to write."
  - "An interface is a type that lists methods a class promises to provide. It has no instance fields, and a class can implement many interfaces, so unrelated classes can share one ability."
example: "PaymentGateway is an interface with charge(): a card gateway and a UPI gateway share no code, they only promise the method. AbstractPayment is an abstract class holding id, amount and describe(); CardPayment and UpiPayment extend it and add only their own fee rule."
rows:
  - { aspect: "A class uses it with", a: "extends: only one", b: "implements: many" }
  - { aspect: "Fields", a: "Any instance fields", b: "Only public static final constants" }
  - { aspect: "Constructors", a: "Yes, run via super(...)", b: "None" }
  - { aspect: "Methods with a body", a: "Any number of normal methods", b: "Only default and static (Java 8) and private (Java 9) methods" }
  - { aspect: "Method access", a: "Any access modifier", b: "public, or private for helper methods" }
  - { aspect: "Fits", a: "Closely related classes", b: "Unrelated classes with one ability" }
verdict: "Start with an interface; add an abstract class when the implementations share state or code."
sayIt: "An abstract class is a partly built parent with state, constructors and shared code; a class extends only one. An interface is a contract with no instance state; a class can implement many. I start with an interface and add an abstract class when implementations share code."
sources:
