id: hashset-vs-linkedhashset-vs-treeset
tech: java
title: HashSet vs LinkedHashSet vs TreeSet
compares: [hashset, linkedhashset, treeset]
gist:
  - "Unique items, no order promised"
  - "Unique items in insertion order"
  - "Unique items kept sorted"
explain:
  - "HashSet stores unique items in a hash table, using hashCode and equals. It solves fast \"have I seen this?\" checks, but it promises no order."
  - "LinkedHashSet is a HashSet that also remembers insertion order. It solves removing duplicates while keeping the order in which items first appeared."
  - "TreeSet keeps unique items sorted in a red-black tree, using compareTo or a Comparator. It solves sorted output and questions such as the smallest item above x."
example: "Payment ids arrive as p2, p1, p2, p3. A HashSet holds the three ids in no promised order; a LinkedHashSet holds [p2, p1, p3]; a TreeSet holds [p1, p2, p3], and ceiling(\"p2\") returns p2."
rows:
  - { aspect: "Inside", a: "Hash table (a HashMap)", b: "Hash table plus a linked list", c: "Red-black tree (a TreeMap)" }
  - { aspect: "add, contains, remove", a: "O(1) average", b: "O(1) average", c: "O(log n)" }
  - { aspect: "Duplicate test", a: "hashCode, then equals", b: "hashCode, then equals", c: "compareTo or the Comparator" }
  - { aspect: "null", a: "One allowed", b: "One allowed", c: "Throws with natural order" }
  - { aspect: "Extra methods", a: "None", b: "getFirst, reversed (Java 21)", c: "first, floor, ceiling, headSet" }
verdict: "Use HashSet by default, LinkedHashSet when insertion order matters, TreeSet for sorted order or range queries."
sayIt: "All three keep each item once. HashSet is O(1) on average with no order. LinkedHashSet keeps insertion order at almost the same speed. TreeSet keeps items sorted at O(log n) and decides duplicates with compareTo instead of equals."
