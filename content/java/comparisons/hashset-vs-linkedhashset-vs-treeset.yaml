id: hashset-vs-linkedhashset-vs-treeset
tech: java
title: HashSet vs LinkedHashSet vs TreeSet
compares: [hashset, linkedhashset, treeset]
gist:
  - "Unique items, no order promised"
  - "Unique items in insertion order"
  - "Unique items kept sorted"
rows:
  - { aspect: "Inside", a: "Hash table (a HashMap)", b: "Hash table plus a linked list", c: "Red-black tree (a TreeMap)" }
  - { aspect: "add, contains, remove", a: "O(1) average", b: "O(1) average", c: "O(log n)" }
  - { aspect: "Duplicate test", a: "hashCode, then equals", b: "hashCode, then equals", c: "compareTo or the Comparator" }
  - { aspect: "null", a: "One allowed", b: "One allowed", c: "Throws with natural order" }
  - { aspect: "Extra methods", a: "None", b: "getFirst, reversed (Java 21)", c: "first, floor, ceiling, headSet" }
verdict: "Use HashSet by default, LinkedHashSet when insertion order matters, TreeSet for sorted order or range queries."
