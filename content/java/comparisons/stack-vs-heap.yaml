id: stack-vs-heap
tech: java
title: Stack vs Heap
compares: [jvm-stack, heap-area]
gist:
  - "One per thread: a frame for each method call"
  - "One for all threads: every object and array"
explain:
  - "The JVM stack belongs to one thread. Each method call pushes a frame that holds the call's local variables and partial results, and the frame is removed as soon as the method returns."
  - "The heap is one memory area shared by all threads. Every object and array made with new lives there, and the garbage collector frees an object once nothing can reach it."
example: "In main, Payment p = new Payment(50000): the variable p sits in main's frame on the stack, and the Payment object with its amount field sits on the heap. Very deep recursion fills the stack (StackOverflowError); too many live objects fill the heap (OutOfMemoryError)."
diagrams:
  - |
    flowchart TB
      F3["describe() frame"] --> F2["pay() frame: amount, p"] --> F1["main() frame"]
  - |
    flowchart LR
      T1[Thread 1] --> O(("Payment object"))
      T2[Thread 2] --> O
diagramAlt: "Stack: frames for describe, pay and main piled up in one thread, the newest on top. Heap: two threads holding references to the same Payment object."
rows:
  - { aspect: "Belongs to", a: "One thread", b: "All threads share it" }
  - { aspect: "Holds", a: "Frames: local variables, references, partial results", b: "Objects and arrays, with their fields" }
  - { aspect: "Freed", a: "When the method returns (frame popped)", b: "By the GC, once nothing reaches the object" }
  - { aspect: "Size option", a: "-Xss", b: "-Xmx (max), -Xms (initial)" }
  - { aspect: "When it runs out", a: "StackOverflowError", b: "OutOfMemoryError: Java heap space" }
verdict: "Locals and the current call chain go on the thread's stack; anything created with new goes on the shared heap."
sayIt: "Each thread has its own stack of frames, one per method call, holding local variables and references; a frame disappears when its method returns. Objects and arrays live on the heap, shared by all threads, and the garbage collector frees them once they are unreachable."
