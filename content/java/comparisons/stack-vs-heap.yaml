id: stack-vs-heap
tech: java
title: Stack vs Heap
compares: [jvm-stack, heap-area]
gist:
  - "One per thread: a frame for each method call"
  - "One for all threads: every object and array"
diagrams:
  - |
    flowchart TB
      F3["print(u) frame"] --> F2["order() frame: qty, u"] --> F1["main() frame"]
  - |
    flowchart LR
      T1[Thread 1] --> O(("User object"))
      T2[Thread 2] --> O
diagramAlt: "Stack: frames for print, order and main piled up in one thread, the newest on top. Heap: two threads holding references to the same User object."
rows:
  - { aspect: "Belongs to", a: "One thread", b: "All threads share it" }
  - { aspect: "Holds", a: "Frames: local variables, references, partial results", b: "Objects and arrays, with their fields" }
  - { aspect: "Freed", a: "When the method returns (frame popped)", b: "By the GC, once nothing reaches the object" }
  - { aspect: "Size option", a: "-Xss", b: "-Xmx (max), -Xms (initial)" }
  - { aspect: "When it runs out", a: "StackOverflowError", b: "OutOfMemoryError: Java heap space" }
verdict: "Locals and the current call chain go on the thread's stack; anything created with new goes on the shared heap."
sources:
  - title: "JVMS SE 25, 2.5 Run-Time Data Areas"
    url: "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html"
    verifiedOn: "2026-10-19"
  - title: "The java Command (JDK 25): -Xss, -Xms, -Xmx"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html"
    verifiedOn: "2026-10-19"
  - title: "Troubleshooting Guide (Java SE 25): The java.lang.OutOfMemoryError Error"
    url: "https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshooting-memory-leaks.html"
    verifiedOn: "2026-10-19"
