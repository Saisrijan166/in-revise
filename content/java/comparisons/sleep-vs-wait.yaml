id: sleep-vs-wait
tech: java
title: "sleep() vs wait()"
compares: [thread-sleep, object-wait]
gist:
  - "Pause this thread for a while; keep every lock"
  - "Wait for a signal; release this object's monitor"
explain:
  - "Thread.sleep(ms) pauses the current thread for a time. It keeps every lock it holds, so it suits a simple delay, such as waiting before retrying a payment."
  - "obj.wait() pauses a thread until another thread signals through the same object with notify() or notifyAll(). It must be called while holding obj's monitor, and it releases that monitor while waiting."
example: "A worker waits for new payments in a shared queue. Calling sleep(100) in a loop keeps the lock and wastes checks. Calling queue.wait() inside synchronized (queue), in a while loop that checks isEmpty(), releases the lock, so a producer can add a payment and call queue.notifyAll()."
rows:
  - { aspect: "Declared in", a: "Thread (static method)", b: "Object (every object has it)" }
  - { aspect: "Locks held", a: "All kept", b: "This object's monitor released; other locks kept" }
  - { aspect: "Needs the monitor first", a: "No", b: "Yes, or IllegalMonitorStateException" }
  - { aspect: "Wakes up on", a: "Time up, or an interrupt", b: "notify(), notifyAll(), timeout, interrupt, or a spurious wakeup" }
  - { aspect: "Typical use", a: "A delay or retry back-off", b: "Wait until a condition is true, checked in a while loop" }
verdict: "sleep() just pauses. wait() lets another thread change a condition and signal; call it in a loop inside synchronized."
sayIt: "sleep() is a static Thread method that pauses for a time and keeps all locks. wait() is an Object method, called while holding that object's monitor; it releases the monitor until notify(), notifyAll(), a timeout or an interrupt, and I always call it in a while loop."
