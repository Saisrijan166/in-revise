id: sleep-vs-wait
tech: java
title: "sleep() vs wait()"
compares: [thread-sleep, object-wait]
gist:
  - "Pause this thread for a while; keep every lock"
  - "Wait for a signal; release this object's monitor"
rows:
  - { aspect: "Declared in", a: "Thread (static method)", b: "Object (every object has it)" }
  - { aspect: "Locks held", a: "All kept", b: "This object's monitor released; other locks kept" }
  - { aspect: "Needs the monitor first", a: "No", b: "Yes, or IllegalMonitorStateException" }
  - { aspect: "Wakes up on", a: "Time up, or an interrupt", b: "notify(), notifyAll(), timeout, interrupt, or a spurious wakeup" }
  - { aspect: "Typical use", a: "A delay or retry back-off", b: "Wait until a condition is true, checked in a while loop" }
verdict: "sleep() just pauses. wait() lets another thread change a condition and signal; call it in a loop inside synchronized."
sources:
  - title: "Thread.sleep (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#sleep(long)"
    verifiedOn: "2026-10-19"
  - title: "Object.wait (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#wait(long,int)"
    verifiedOn: "2026-10-19"
