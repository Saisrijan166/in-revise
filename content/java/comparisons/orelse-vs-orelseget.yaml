id: orelse-vs-orelseget
tech: java
title: "orElse vs orElseGet"
compares: [orelse-method, orelseget-method]
gist:
  - "A ready fallback value, built even when unused"
  - "A fallback supplier, called only when empty"
explain:
  - "orElse(value) returns the value inside the Optional, or the given fallback when it is empty. The fallback is an ordinary argument, so Java computes it before the call, every time."
  - "orElseGet(supplier) returns the value inside the Optional, or calls the supplier lambda to make a fallback, only when the Optional is empty."
example: "cache.find(id).orElse(db.load(id)) runs the database query on every call, even when the cache already has the payment. cache.find(id).orElseGet(() -> db.load(id)) queries the database only on a cache miss."
rows:
  - { aspect: "Argument", a: "A value T", b: "A Supplier<T>" }
  - { aspect: "Fallback is computed", a: "Always, before the call", b: "Only when the Optional is empty" }
  - { aspect: "Cost when a value is present", a: "Still pays, for example a database call", b: "Nothing" }
  - { aspect: "Good for", a: "Constants such as \"\" or 0", b: "Costly defaults or ones with side effects" }
verdict: "Use orElse for a ready constant; use orElseGet when building the default costs something."
sayIt: "orElse takes a ready value, which Java always computes before the call, even when the Optional has a value. orElseGet takes a supplier that runs only when the Optional is empty. I use orElse for constants and orElseGet for costly defaults."
sources:
  - title: "Optional (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Optional.html"
    verifiedOn: "2026-10-19"
