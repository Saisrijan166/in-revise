id: statement-vs-preparedstatement
tech: java
title: Statement vs PreparedStatement
compares: [jdbc-statement, jdbc-prepared-statement]
gist:
  - "SQL text built as one string, compiled each run"
  - "SQL with ? placeholders, values bound separately"
rows:
  - { aspect: "Values go in", a: "Joined into the SQL string", b: "setInt, setString... (index from 1)" }
  - { aspect: "SQL injection", a: "Open to it with user input", b: "Blocked for bound values" }
  - { aspect: "Reuse", a: "The database parses each run", b: "Precompiled once, run many times" }
  - { aspect: "Table or column names", a: "Written into the SQL text (validate them)", b: "Cannot be placeholders: values only" }
verdict: "Use PreparedStatement for anything with input; keep Statement for fixed DDL or admin SQL."
sources:
  - title: "Using Prepared Statements (The Java Tutorials, JDBC)"
    url: "https://docs.oracle.com/javase/tutorial/jdbc/basics/prepared.html"
    verifiedOn: "2026-10-19"
  - title: "PreparedStatement (Java SE 25 API, java.sql)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/PreparedStatement.html"
    verifiedOn: "2026-10-19"
  - title: "SQL Injection Prevention Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
    verifiedOn: "2026-10-19"
