id: statement-vs-preparedstatement
tech: java
title: Statement vs PreparedStatement
compares: [jdbc-statement, jdbc-prepared-statement]
gist:
  - "SQL and its values joined into one string"
  - "SQL with ? placeholders; values are sent separately"
explain:
  - "A Statement runs a SQL string exactly as you give it. Any values must already be written into that string, so they become part of the SQL text."
  - "A PreparedStatement is created with SQL that has ? placeholders, and you set each value with setString, setLong and so on. The values never become SQL text, and the statement can be run again with new values."
example: "A user types the payment id x' OR '1'='1. Joined into \"... WHERE id = '\" + id + \"'\" and run with a Statement, the query matched every row in the payment table. With a PreparedStatement and setString(1, id), it looked for a payment with that odd id and found none."
rows:
  - { aspect: "Values go in", a: "Joined into the SQL string by your code", b: "Set with setString, setLong and others, numbered from 1" }
  - { aspect: "SQL injection", a: "Open to it whenever user input is joined in", b: "Blocked for the values you bind" }
  - { aspect: "Running it again", a: "The full SQL text is sent and parsed each time", b: "Prepared once, then run many times with new values" }
  - { aspect: "Table or column names", a: "Written into the SQL text, so you must check them yourself", b: "Cannot be placeholders: ? stands only for values" }
verdict: "Use PreparedStatement for any SQL that takes values; keep Statement for fixed SQL such as DDL or admin scripts."
sayIt: "A Statement runs SQL text as given, so joining user input into it opens SQL injection. A PreparedStatement uses ? placeholders and binds values separately, so input can never change the query, and it can be reused. I use PreparedStatement whenever a query takes values."
sources:
  - title: "Using Prepared Statements (The Java Tutorials, JDBC)"
    url: "https://docs.oracle.com/javase/tutorial/jdbc/basics/prepared.html"
    verifiedOn: "2026-10-19"
  - title: "PreparedStatement (Java SE 25 API, java.sql)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/PreparedStatement.html"
    verifiedOn: "2026-10-19"
