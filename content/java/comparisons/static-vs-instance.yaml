id: static-vs-instance
tech: java
title: Static vs Instance Members
compares: [static-keyword, instance-member]
gist:
  - "Belongs to the class: one shared copy"
  - "Belongs to each object: its own copy"
rows:
  - { aspect: "Copies", a: "One per class", b: "One per object" }
  - { aspect: "Called as", a: "Order.count, Math.max(1, 2)", b: "order.getId(), needs an object" }
  - { aspect: "this and super", a: "Not available", b: "Available" }
  - { aspect: "Can use the other side", a: "Instance members only through an object", b: "Static members directly" }
  - { aspect: "Same method in a subclass", a: "Hidden: reference type decides", b: "Overridden: runtime object decides" }
verdict: "Make it static only when it does not depend on any one object's state; everything else is an instance member."
sources:
  - title: "Understanding Class Members (Java Tutorials)"
    url: "https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html"
    verifiedOn: "2026-10-19"
  - title: "JLS 25, 8.3.1.1 static Fields, 8.4.3.2 static Methods"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.4.3.2"
    verifiedOn: "2026-10-19"
  - title: "Overriding and Hiding Methods (Java Tutorials)"
    url: "https://docs.oracle.com/javase/tutorial/java/IandI/override.html"
    verifiedOn: "2026-10-19"
