id: static-vs-instance
tech: java
title: Static vs Instance Members
compares: [static-keyword, instance-member]
gist:
  - "Belongs to the class: one shared copy"
  - "Belongs to each object: its own copy"
explain:
  - "A static member belongs to the class itself. There is one copy, used through the class name, and it is there for data or helpers that do not depend on any one object."
  - "An instance member belongs to each object. Every object has its own copy of an instance field, and an instance method runs on one object through a reference."
example: "Payment.nextId is static: one counter that hands out ids to every new payment. id and markPaid() are instance members: payment 1 and payment 2 each have their own id, and p1.markPaid() changes only p1."
rows:
  - { aspect: "Copies", a: "One per class", b: "One per object" }
  - { aspect: "Called as", a: "Payment.nextId, Math.max(1, 2)", b: "p1.markPaid(), needs an object" }
  - { aspect: "this and super", a: "Not available", b: "Available" }
  - { aspect: "Can use the other side", a: "Instance members only through an object", b: "Static members directly" }
  - { aspect: "Same method in a subclass", a: "Hidden: reference type decides", b: "Overridden: runtime object decides" }
verdict: "Make it static only when it does not depend on any one object's state; everything else is an instance member."
sayIt: "Static members belong to the class: one shared copy, called by class name, with no this. Instance members belong to each object: each has its own copy and needs a reference. Static methods are hidden in subclasses; instance methods are overridden."
sources:
