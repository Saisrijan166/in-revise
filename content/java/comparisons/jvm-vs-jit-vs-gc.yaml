id: jvm-vs-jit-vs-gc
tech: java
title: JVM vs JIT vs GC
compares: [jdk-jre-jvm, jit-compiler, garbage-collection]
gist:
  - "The machine that loads and runs bytecode"
  - "A part of the JVM that turns hot code into native code"
  - "A part of the JVM that frees unreachable objects"
rows:
  - { aspect: "Is", a: "The runtime itself", b: "A compiler inside the JVM", c: "A memory manager inside the JVM" }
  - { aspect: "Works on", a: "Classes and bytecode", b: "Methods that run often", c: "Objects on the heap" }
  - { aspect: "Gives you", a: "The same bytecode on any OS and CPU", b: "Speed after warm-up", c: "No manual freeing of memory" }
  - { aspect: "Tuned with", a: "java command options", b: "Rarely: tiered compilation is on by default", c: "-XX:+UseG1GC, -XX:+UseZGC, heap size" }
verdict: "Say it as one picture: the JVM runs the program, its JIT makes hot code fast, and its GC cleans the heap."
sources:
