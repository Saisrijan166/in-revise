id: runnable-vs-callable
tech: java
title: "Runnable vs Callable"
compares: [runnable-task, callable-task]
gist:
  - "void run(): no result, no checked exception"
  - "V call(): returns a value, may throw Exception"
explain:
  - "Runnable (Java 1.0) is a task with void run(). It returns nothing and cannot throw a checked exception, so it suits fire-and-forget work such as sending a receipt."
  - "Callable (Java 5) is a task with V call(). It returns a value and may throw any exception, which an executor keeps in the Future for get() to hand back."
example: "Sending a payment receipt needs no answer, so it is a Runnable: pool.execute(() -> sendReceipt(p)). Charging the card must report the outcome, so it is a Callable: Future<String> f = pool.submit(() -> gateway.charge(p)), and f.get() returns \"PAID\" or throws ExecutionException."
rows:
  - { aspect: "Package, since", a: "java.lang, Java 1.0", b: "java.util.concurrent, Java 5" }
  - { aspect: "Result", a: "None", b: "A value of type V" }
  - { aspect: "Checked exceptions", a: "Cannot throw them", b: "call() throws Exception" }
  - { aspect: "Runs on", a: "new Thread(r), execute(r) or submit(r)", b: "submit(c) or invokeAll(); not new Thread()" }
verdict: "Use Callable when you need a result or a checked exception back; Runnable for fire-and-forget work."
sayIt: "Runnable's run() returns nothing and cannot throw checked exceptions; Callable's call() returns a value and may throw. A Thread takes only a Runnable, while ExecutorService.submit() takes both and gives a Future with the result or the exception."
