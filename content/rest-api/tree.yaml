          label: Manipulation through representations
          note: Clients read and change a resource by sending representations
        - id: self-descriptive-messages
          label: Self-descriptive messages
          note: Each message carries metadata, such as media type, to process it
        - id: hypermedia-engine-of-state
          label: Hypermedia as the engine of app state
          note: Links in responses drive what the client can do next
        - id: code-on-demand-constraint
          label: Code on demand (optional)
          note: The server may send scripts to run; the only optional constraint
    - id: http-request-response
      children:
        - id: request-line-part
          label: Request line
          note: "Method, request target and version: GET /api/payments HTTP/1.1"
        - id: status-line-part
          label: Status line
          note: Version, 3-digit status code and an optional reason phrase
        - id: message-body-part
          label: Message body
          note: Optional content after the empty line that ends the headers
        - id: http-versions
          label: HTTP versions
          note: Same semantics (RFC 9110); different wire format and transport
          children:
            - id: http-1-1-version
              label: HTTP/1.1
              note: Text messages over TCP; persistent connections by default
            - id: http-2-version
              label: HTTP/2
              note: Binary frames; many streams on one TCP connection
            - id: http-3-version
              label: HTTP/3
              note: Over QUIC on UDP; a lost packet stalls only its own stream
    - id: resources-and-uris
      children:
        - id: collection-resource-node
          label: Collection resource
          note: "A resource whose members are items: /payments"
        - id: item-resource-node
          label: Item resource
          note: "One member of a collection: /payments/PAY101"
        - id: resource-representation-node
          label: Representation
          note: Bytes plus metadata showing a resource's state, e.g. JSON
        - id: uri-url-urn
          label: URI, URL, URN
          note: "URI identifies; URL also locates; URN: urn: names meant to last"
        - id: path-parameter
          label: Path parameter
          note: "A path segment that picks the resource: PAY101"
        - id: query-parameter
          label: Query parameter
          note: "Data after ? that filters or tunes: ?includeRefunds=true"
    - id: statelessness
      children:
        - id: session-state-on-client
          label: Session state on the client
          note: The client sends all context, such as the token, with each call
        - id: resource-state-on-server
          label: Resource state on the server
          note: Data such as payments stays stored in the resources themselves
        - id: no-server-affinity
          label: No sticky sessions
          note: No client is tied to one server, so instances scale out freely
        - id: repeated-request-data
          label: "Cost: repeated data"
          note: Context resent in every request can lower network performance
    - id: richardson-maturity-hateoas
      children:
        - id: rmm-level-0
          label: "Level 0: one endpoint"
          note: HTTP only tunnels remote calls to a single URI
        - id: rmm-level-1
          label: "Level 1: resources"
          note: Calls go to separate URIs, one per resource
        - id: rmm-level-2
          label: "Level 2: HTTP verbs"
          note: GET, POST, PUT, DELETE used as HTTP defines them, with status codes
        - id: rmm-level-3
          label: "Level 3: hypermedia controls"
          note: Responses include links to what the client can do next
        - id: hal-format
          label: HAL (application/hal+json)
          note: Links under _links, embedded resources under _embedded
        - id: spring-hateoas-project
          label: Spring HATEOAS
          note: Spring project to build link-rich models; supports HAL
  http:
    - id: http-methods
      children:
        - id: safe-method
          label: "Safe: GET, HEAD, OPTIONS"
          note: Read-only intent; server-side logging is still allowed
        - id: method-post
          label: POST
          note: "Server processes the body: create, or run an action"
        - id: method-put
          label: PUT
          note: Create or replace the state at this URL with the body
        - id: method-patch
          label: PATCH (RFC 5789)
          note: Apply a set of changes; the body's media type says how
          children:
            - id: json-patch
              label: JSON Patch (RFC 6902)
              note: "Ops list: add, remove, replace, move, copy, test"
            - id: json-merge-patch
              label: JSON Merge Patch (RFC 7396)
              note: Mirrors the document; best for objects without meaningful nulls
        - id: query-method
          label: QUERY (RFC 10008, June 2026)
          note: Like GET with a body; cross-origin use needs a CORS preflight
    - id: status-codes
      children:
        - id: status-2xx
          label: 2xx Successful
          note: "Received, understood and accepted: 200, 201, 204"
        - id: status-3xx
          label: 3xx Redirection
          note: Further action needed, usually following Location
          children:
            - id: redirect-301-302
              label: 301 Moved / 302 Found
              note: Clients may turn a redirected POST into a GET
            - id: redirect-307-308
              label: 307 Temporary / 308 Permanent
              note: The client must not change the method
        - id: status-4xx
          label: 4xx Client Error
          note: The client seems to have erred; explain why in the body
          children:
            - id: 401-unauthorized
              label: 401 Unauthorized
              note: With credentials sent, it means they were refused
            - id: 403-forbidden
              label: 403 Forbidden
              note: May be unrelated to credentials, e.g. a blocked action
        - id: status-5xx
          label: 5xx Server Error
          note: The server erred or cannot perform the request
          children:
            - id: 502-bad-gateway
              label: 502 Bad Gateway
              note: Invalid reply from the upstream service
            - id: 503-service-unavailable
              label: 503 Service Unavailable
              note: Overload or maintenance; add Retry-After if known
            - id: 504-gateway-timeout
              label: 504 Gateway Timeout
              note: No timely reply from the upstream service
    - id: headers-content-negotiation
      children:
        - id: accept-header
          label: Accept
          note: "Request: e.g. application/json, application/xml;q=0.5"
        - id: content-type-header
          label: Content-Type
          note: Request or response; missing, a reader may assume octet-stream
        - id: authorization-header
          label: Authorization
          note: "Request: credentials, often sent after a 401 challenge"
        - id: cookie-header
          label: Cookie / Set-Cookie
          note: Server sets a cookie; the browser sends it back later
        - id: location-header
          label: Location
          note: "Response: a relative URL is resolved against the request URL"
        - id: vary-header
          label: Vary
          note: "Response: request headers that shaped this reply, e.g. Accept"
    - id: http-caching
      children:
        - id: private-cache
          label: Private cache (browser)
          note: Dedicated to one user, usually inside the browser
        - id: shared-cache
          label: Shared cache (CDN, proxy)
          note: Reuses responses for many users; usually an intermediary
        - id: cache-control
          label: Cache-Control directives
          note: Request and response directives; most restrictive wins on conflict
          children:
            - id: max-age
              label: max-age=600
              note: Stale once older than 600 seconds
            - id: s-maxage
              label: s-maxage
              note: Overrides max-age for shared caches only
            - id: no-cache
              label: no-cache
              note: "Not 'do not cache': it means 'check before reuse'"
            - id: no-store
              label: no-store
              note: "Not a privacy guarantee: a rogue cache can ignore it"
            - id: private-directive
              label: private
              note: Use for per-user replies, e.g. after login
            - id: must-revalidate
              label: must-revalidate
              note: Stale copy never reused; offline caches reply 504
        - id: etag
          label: ETag
          note: 'Quoted string: "v7"; W/"v7" marks a weak one'
        - id: last-modified
          label: Last-Modified
          note: Date validator; the client sends it back in If-Modified-Since
        - id: 304-not-modified
          label: 304 Not Modified
          note: Only for conditional GET or HEAD
    - id: conditional-requests
      children:
        - id: if-match
          label: If-Match
          note: "If-Match: * means 'only if the resource exists'"
        - id: 412-precondition-failed
          label: 412 Precondition Failed
          note: Reply when If-Match (or another precondition) is false
        - id: 428-precondition-required
          label: 428 Precondition Required (RFC 6585)
          note: Server demands a conditional request to stop lost updates
        - id: weak-etag
          label: 'Weak ETag: W/"v3"'
          note: Matches in If-None-Match (weak comparison), never in If-Match
        - id: jpa-version
          label: JPA @Version
          note: Number or timestamp checked on update; mismatch = lock failure
  design:
    - id: url-design-rules
      children:
        - id: plural-collection-nouns
          label: "Plural nouns: /payments/PAY101"
          note: Collection URI, then the item id; the method is the verb
        - id: nested-resource-path
          label: "Nested: /users/10/payments"
          note: "Azure: no deeper than collection/item/collection"
        - id: action-custom-method
          label: "Action: POST /payments/PAY101:cancel"
          note: Only when no standard method fits; POST when it changes state
        - id: kebab-case-paths
          label: kebab-case path segments
          note: Microsoft prefers kebab-case; Google AIP-122 uses camelCase
        - id: opaque-resource-ids
          label: Opaque ids
          note: "Microsoft: treat ids as opaque, case-sensitive strings"
    - id: pagination-filtering-sorting
      children:
        - id: offset-pagination
          label: "Offset: ?page=2&size=20"
          note: Skips rows; the client can jump to any page
        - id: cursor-pagination
          label: "Cursor: ?cursor=8f3a2c"
          note: Opaque token for where the last page ended (AIP-158)
          children:
            - id: keyset-pagination
              label: "Keyset: WHERE id < last id"
              note: Cursor holds the last sort key, so the index skips seen rows
        - id: link-header-next
          label: 'Link: <url>; rel="next"'
          note: RFC 8288 header; next is a registered link relation
        - id: next-link-field
          label: nextLink in the body
          note: "Microsoft: an absolute URL; left out on the last page"
        - id: field-selection
          label: "Field selection: ?fields=id,status"
          note: Sparse fieldsets in JSON:API; still check field access
        - id: spring-data-pageable
          label: Spring Data Pageable
          note: page is 0-based, size defaults to 20; sort names are not checked
    - id: api-versioning
      children:
        - id: versioning-strategies
          label: Where the version goes
          note: Path, query string, header or media type (Azure)
          children:
            - id: uri-versioning
              label: "Path: /api/v2/payments"
              note: Each version has its own URI; cache-friendly
            - id: query-versioning
              label: "Query: ?api-version=2021-06-04"
              note: "Azure: clients send a dated api-version on every call"
            - id: header-versioning
              label: "Header: API-Version: 2"
              note: One URI; the client must send the header
            - id: media-type-versioning
              label: "Accept: application/vnd.shop.v2+json"
              note: A vendor media type carries the version
        - id: tolerant-reader
          label: Tolerant reader
          note: "Fowler: read only the fields you need, ignore the rest"
        - id: deprecation-header
          label: "Deprecation: @1688169599"
          note: "RFC 9745 (March 2025): deprecation date, past or future"
        - id: sunset-header
          label: "Sunset: <HTTP-date>"
          note: "RFC 8594: when it stops responding; not before Deprecation"
        - id: spring-api-versioning
          label: '@GetMapping(version = "2+")'
          note: 'Spring Framework 7.0: "2+" also matches later supported versions'
    - id: error-responses
      children:
        - id: problem-json-media-type
          label: application/problem+json
          note: Content-Type of a JSON problem details body
        - id: about-blank-type
          label: "type: about:blank"
          note: "Default type: nothing beyond the HTTP status itself"
        - id: problem-extension-members
          label: Extension members
          note: Type-specific fields; clients must ignore unknown ones
        - id: field-errors-list
          label: errors[] with pointer
          note: "RFC 9457 example: one entry per bad field, by JSON Pointer"
        - id: stable-error-code
          label: Stable error code
          note: Part of the contract; changing it is a breaking change
    - id: long-running-operations
      children:
        - id: operation-status-resource
          label: GET /api/operations/{id}
          note: "200 while it runs: Pending or Running, then Succeeded or Failed"
        - id: retry-after-polling
          label: "Retry-After: 5"
          note: "RFC 9110: seconds or an HTTP-date to wait"
        - id: see-other-result
          label: 303 See Other
          note: Sends the client to the result with a GET (RFC 9110)
        - id: cancel-operation
          label: DELETE /api/operations/{id}
          note: Optional cancel in the Azure async pattern
        - id: push-instead-of-poll
          label: Push instead of poll
          note: Webhooks, SSE or WebSockets when the client can receive them
  security:
    - id: authentication-methods
      children:
        - id: authn-check
          label: Authentication (who are you?)
          note: "Missing or bad credentials: 401 with WWW-Authenticate (RFC 9110)"
        - id: authz-check
          label: Authorisation (what may you do?)
          note: "Known caller without the right: 403 Forbidden (RFC 9110)"
        - id: basic-auth
          label: Basic auth
          note: "user:password in Base64: encoding, not encryption (RFC 7617)"
        - id: api-key-auth
          label: API key
          note: Ties a call to an app or project, not to a person
          term: api-key
        - id: bearer-token-auth
          label: "Authorization: Bearer"
          note: Whoever holds the token can use it; TLS only (RFC 6750)
          term: bearer-token
        - id: session-cookie-auth
          label: Session cookie
          note: Server keeps the session; the browser sends its ID
          term: session-cookie
    - id: jwt
      children:
        - id: jws-token
          label: JWS (signed JWT)
          note: Tamper-evident, but anyone can read the claims
        - id: jwe-token
          label: JWE (encrypted JWT)
          note: Claims readable only with the decryption key
        - id: jwt-registered-claims
          label: Registered claims
          note: iss, sub, aud, exp, nbf, iat, jti (RFC 7519 section 4.1)
          term: jwt-claim
        - id: hs256-alg
          label: HS256
          note: "HMAC SHA-256: one shared secret signs and verifies"
        - id: rs256-alg
          label: RS256
          note: "RSA SHA-256: private key signs, public key verifies"
    - id: oauth2-and-oidc
      children:
        - id: oauth2-framework
          label: OAuth 2.0 (RFC 6749)
          note: "Delegated access: the client gets an access token with scopes"
          term: oauth2
          children:
            - id: auth-code-pkce
              label: Authorization code + PKCE
              note: Apps with a user; public clients must use PKCE (RFC 9700)
            - id: client-credentials-flow
              label: Client credentials
              note: "Service to service: no user, no refresh token (RFC 6749)"
              term: client-credentials-grant
            - id: refresh-token-flow
              label: Refresh token grant
              note: New access token without a new login
              term: refresh-token
            - id: legacy-oauth-grants
              label: Implicit and password grants
              note: "RFC 9700: implicit SHOULD NOT, password MUST NOT be used"
        - id: oauth21-draft
          label: OAuth 2.1
          note: IETF draft-16 (September 2026), not an RFC yet
        - id: oidc-layer
          label: OpenID Connect
          note: Adds an ID token (a JWT) about the login; scope openid
          term: openid-connect
        - id: boot-resource-server-starter
          label: spring-boot-starter-security-oauth2-resource-server
          note: Boot 4.x name; spring-boot-starter-oauth2-resource-server is deprecated
    - id: cors
      children:
        - id: same-origin-policy
          label: Same-origin policy
          note: Same scheme, host and port; cross-origin reads blocked by default
        - id: cors-preflight
          label: Preflight (OPTIONS)
          note: Asks with Access-Control-Request-Method and -Headers
          term: preflight-request
        - id: acao-header
          label: Access-Control-Allow-Origin
          note: One origin, or * only for requests without credentials
        - id: acac-header
          label: Access-Control-Allow-Credentials
          note: true lets the page read a response sent with cookies
        - id: acma-header
          label: Access-Control-Max-Age
          note: Preflight cache in seconds; 5 seconds if absent
        - id: csrf-attack
          label: CSRF
          note: Another site makes the browser send a request with your cookies
          term: csrf
    - id: https-tls
      children:
        - id: tls-1-3
          label: TLS 1.3
          note: RFC 9846 (2026) replaced RFC 8446; TLS 1.0 and 1.1 deprecated (RFC 8996)
          term: tls
        - id: hsts-header
          label: Strict-Transport-Security (HSTS)
          note: Browser uses only HTTPS for the host for max-age seconds
          term: hsts
        - id: tls-termination-lb
          label: TLS termination at the load balancer
          note: The load balancer decrypts, then forwards to the targets
        - id: mtls-auth
          label: mTLS
          note: The client also proves itself with a certificate
          term: mtls
    - id: rate-limiting
      children:
        - id: fixed-window-limit
          label: Fixed window
          note: Count per clock window; allows spikes around the window edge
        - id: sliding-window-limit
          label: Sliding window
          note: Weights the last window's count to smooth the edge
        - id: token-bucket-limit
          label: Token bucket
          note: Tokens refill steadily; a full bucket allows a burst
          term: token-bucket
        - id: leaky-bucket-limit
          label: Leaky bucket
          note: Requests drain at a fixed rate; nginx limit_req uses it
        - id: ratelimit-draft-headers
          label: RateLimit and RateLimit-Policy
          note: IETF draft-11 (May 2026), not an RFC
          term: ratelimit-header-fields
    - id: owasp-api-security
      children:
        - id: api1-bola
          label: API1 BOLA
          note: Check the caller owns this object ID on every request
          term: bola
        - id: api3-bopla
          label: API3 BOPLA
          note: Per-field checks; merges excessive data exposure and mass assignment
          term: bopla
        - id: api4-resource-consumption
          label: API4 Unrestricted resource consumption
          note: "No limits on calls, sizes or cost: denial of service or big bills"
        - id: api5-bfla
          label: API5 BFLA
          note: A normal user reaches an admin function
          term: bfla
        - id: api7-ssrf
          label: API7 SSRF
          note: The API fetches a URL the caller chose
          term: ssrf
        - id: sql-injection-defence
          label: SQL injection
          note: "Main defence: parameterised queries (prepared statements)"
          term: sql-injection
  reliability:
    - id: idempotency-keys
      children:
        - id: idempotency-key-header-field
          label: Idempotency-Key header
          note: IETF draft-07 (expired April 2026); not an RFC yet
        - id: request-fingerprint-check
          label: Request fingerprint
          note: Checksum of the body, stored with the key to catch a changed body
        - id: idempotency-key-store
          label: Key store + unique constraint
          note: One row per key with its result; a second insert fails
        - id: idempotency-key-expiry
          label: Key expiry
          note: The API publishes a window; after it, a reused key is a new request
    - id: retries-and-timeouts
      children:
        - id: connect-timeout-setting
          label: Connect timeout
          note: Limit for opening a new connection; no effect on a reused one
        - id: read-timeout-setting
          label: Read timeout
          note: Limit for waiting on data once connected; 0 means forever (Java URLConnection)
        - id: retry-policy
          label: Retry with backoff
          note: Which errors, how many attempts, how long to wait
          children:
            - id: exponential-backoff-wait
              label: Exponential backoff
              note: Each wait multiplies (base x 2^n), up to a cap
            - id: full-jitter
              label: Full jitter
              note: Wait a random time from 0 to the backoff; least work in AWS tests
        - id: retry-after-header-field
          label: Retry-After
          note: Seconds or an HTTP date; used with 503, 429 and 3xx
        - id: retry-budget
          label: Retry budget (token bucket)
          note: Retries stop when tokens run out; first tries still go (AWS standard mode)
        - id: circuit-breaker-pattern
          label: Circuit breaker
          note: Fails calls at once after repeated failures
          children:
            - id: breaker-closed
              label: Closed
              note: Calls pass; recent failures are counted
            - id: breaker-open
              label: Open
              note: Calls fail at once until a timer ends
            - id: breaker-half-open
              label: Half-open
              note: A few trial calls; success closes, a failure reopens
    - id: unknown-outcomes
      children:
        - id: gateway-status-query
          label: Query the gateway
          note: "Fetch the payment by our reference; Stripe: match via metadata"
        - id: same-key-retry
          label: Retry with the same key
          note: Same key and body; Stripe allows this within 24 hours
        - id: reconciliation-job
          label: Reconciliation job
          note: Match our rows to the provider's settlement report
        - id: transactional-outbox
          label: Transactional outbox
          note: Event row saved in the same transaction; a relay publishes it
        - id: unique-business-key
          label: Unique business key
          note: "UNIQUE(order_id): a second payment row for the order fails"
        - id: fencing-token
          label: Fencing token
          note: Rising number checked by storage; stops a stale lock holder
    - id: webhooks
      children:
        - id: webhook-hmac-signature
          label: HMAC-SHA256 signature
          note: Over timestamp + raw body (Standard Webhooks adds the ID), per-endpoint secret
        - id: webhook-timestamp-tolerance
          label: Timestamp tolerance
          note: Reject old deliveries; Stripe libraries default to 5 minutes
        - id: webhook-fast-ack
          label: Return 2xx fast
          note: Acknowledge first; process from an asynchronous queue
        - id: webhook-event-id-dedupe
          label: Dedupe by event ID
          note: Same event can arrive twice; skip IDs already processed
        - id: webhook-out-of-order
          label: Out-of-order events
          note: Order is not guaranteed; check current state before acting
        - id: standard-webhooks
          label: Standard Webhooks spec
          note: Headers webhook-id, webhook-timestamp, webhook-signature
  spring:
    - id: spring-rest-controllers
      children:
        - id: controller-annotation
          label: "@Controller"
          note: Return value is a view name, unless @ResponseBody is added
        - id: restcontroller-annotation
          label: "@RestController"
          note: "@Controller + @ResponseBody: return values go to the body"
        - id: request-mapping-shortcuts
          label: "@GetMapping, @PostMapping, @PutMapping…"
          note: Shortcuts for @RequestMapping limited to one HTTP method
        - id: http-message-converter
          label: HttpMessageConverter
          note: Reads the body into objects and writes return values out
        - id: controller-service-repository
          label: Controller → service → repository
          note: Presentation, service and persistence layers
    - id: request-binding-validation
      children:
        - id: path-variable-binding
          label: "@PathVariable"
          note: Reads a {placeholder} from the URL path; required by default
        - id: request-param-binding
          label: "@RequestParam"
          note: Query or form parameter; a defaultValue makes it optional
        - id: request-header-binding
          label: "@RequestHeader"
          note: Reads one header, e.g. Idempotency-Key; required by default
        - id: request-body-binding
          label: "@RequestBody"
          note: Body to object through an HttpMessageConverter
        - id: bean-validation-constraints
          label: Jakarta Bean Validation constraints
          note: Declared on DTO fields; checked when the parameter has @Valid
          children:
            - id: not-null-constraint
              label: "@NotNull"
              note: Rejects null only
            - id: not-blank-constraint
              label: "@NotBlank"
              note: "Text: not null, at least one non-whitespace character"
            - id: positive-constraint
              label: "@Positive"
              note: Strictly greater than 0; 0 is invalid
    - id: response-entity
      children:
        - id: plain-return-body
          label: Return the object
          note: A converter writes it to the body
        - id: response-status-annotation
          label: "@ResponseStatus"
          note: One fixed status for a method or an exception class
        - id: response-entity-builder
          label: ResponseEntity builder
          note: ok(), created(uri), accepted(), noContent(), status(…)
        - id: servlet-uri-components-builder
          label: ServletUriComponentsBuilder
          note: fromCurrentRequest() builds the Location URI
    - id: exception-handling
      children:
        - id: exception-handler-method
          label: "@ExceptionHandler"
          note: Maps an exception type to a response; local to its controller
        - id: rest-controller-advice
          label: "@RestControllerAdvice"
          note: "Global handlers: @ControllerAdvice + @ResponseBody"
        - id: problem-detail-class
          label: ProblemDetail
          note: Spring's container for an RFC 9457 problem detail
        - id: response-entity-exception-handler
          label: ResponseEntityExceptionHandler
          note: Base advice that handles all built-in Spring MVC exceptions
        - id: response-status-exception
          label: ResponseStatusException
          note: Carries a status; its reason becomes the ProblemDetail detail
        - id: boot-error-endpoint
          label: Spring Boot /error
          note: Fallback mapping for unhandled errors; JSON for API clients
    - id: dto-mapping
      children:
        - id: dto-class
          label: DTO
          note: "API contract: only the fields a client sends or sees"
        - id: jpa-entity
          label: JPA entity
          note: Persistence model mapped to a table; a record cannot be one
        - id: record-dto
          label: Java record DTO
          note: Immutable data carrier; final in Java 16 (JEP 395)
        - id: manual-mapping
          label: Mapping by hand
          note: A static from() method or a mapper class; no library
        - id: mapstruct-mapper
          label: MapStruct
          note: Annotation processor that generates mappers at compile time
        - id: jackson-annotations
          label: "@JsonProperty, @JsonIgnore, @JsonInclude"
          note: Rename a field, hide a field, skip null or empty values
    - id: rest-clients
      children:
        - id: resttemplate
          label: RestTemplate
          note: Blocking, template methods; deprecated in Framework 7.0 docs
        - id: restclient
          label: RestClient
          note: Blocking, fluent API; Spring Framework 6.1+
        - id: webclient
          label: WebClient
          note: Non-blocking, reactive; in spring-webflux
        - id: http-interface-client
          label: HTTP interface client (@HttpExchange)
          note: A proxy for an interface, over RestClient or WebClient
        - id: client-timeouts
          label: Connect and read timeouts
          note: spring.http.clients.connect-timeout, read-timeout (Boot 4.1)
    - id: spring-api-testing
      children:
        - id: webmvctest-slice
          label: "@WebMvcTest"
          note: Web slice; MockMvc and MockMvcTester auto-configured
        - id: springboottest-mock
          label: "@SpringBootTest (MOCK)"
          note: Whole context in a mock web environment; the default
        - id: springboottest-random-port
          label: "@SpringBootTest (RANDOM_PORT)"
          note: Whole context and a real server on a random port
        - id: mockmvc-tester
          label: MockMvcTester
          note: AssertJ API over MockMvc; Spring Framework 6.2+
        - id: mockitobean-annotation
          label: "@MockitoBean"
          note: Replaces a context bean with a Mockito mock; Framework 6.2+
        - id: rest-test-client
          label: RestTestClient
          note: Wraps RestClient for tests; mock or live server (7.0)
  docs:
    - id: openapi-swagger
      children:
        - id: openapi-specification
          label: OpenAPI Specification (OAS)
          note: A separate project under the OpenAPI Initiative since 2016
          children:
            - id: oas-3-0
              label: OAS 3.0
              note: 3.0.0 released July 2017, after the Swagger 2.0 donation
            - id: oas-3-1
              label: OAS 3.1
              note: February 2021; Schema Object is a superset of JSON Schema 2020-12
            - id: oas-3-2
              label: OAS 3.2
              note: "September 2025: QUERY method, streaming media types, device flow"
        - id: swagger-tools
          label: Swagger tools (SmartBear)
          note: Open-source tools that edit, render and generate code from OpenAPI
          children:
            - id: swagger-ui
              label: Swagger UI
              note: Ships inside springdoc's webmvc-ui starter
            - id: swagger-editor
              label: Swagger Editor
              note: Edits the file with live rendering and error feedback
            - id: swagger-codegen
              label: Swagger Codegen
              note: Generates server stubs and client SDKs from the file
        - id: design-first-openapi
          label: Design-first
          note: The OpenAPI Initiative strongly recommends it
        - id: code-first-openapi
          label: Code-first
          note: Usually the easiest start; some designs prove hard to describe
        - id: springdoc-openapi
          label: springdoc-openapi
          note: 3.x for Spring Boot 4; generates OAS 3.1 by default
    - id: api-testing-strategy
      children:
        - id: unit-test
          label: Unit test
          note: "The bulk of the suite: fast, so thousands run in minutes"
        - id: integration-test
          label: Integration test
          note: Catches query, serialisation and connection bugs
        - id: contract-test
          label: Contract test
          note: Checks provider and consumers without deploying them together
          children:
            - id: pact
              label: Pact
              note: Consumer tests write a pact file; the provider replays it
            - id: spring-cloud-contract
              label: Spring Cloud Contract
              note: Groovy or YAML contracts; makes provider tests and WireMock stubs
        - id: test-double
          label: Test double
          note: "Kinds: dummy, fake, stub, spy, mock"
        - id: end-to-end-test
          label: End-to-end test
          note: Whole deployed system; keep very few, they cost most to maintain
        - id: postman-cli
          label: Postman CLI
          note: Runs Postman collections in CI; preferred over Newman
    - id: observability-for-apis
      children:
        - id: correlation-id
          label: Correlation ID
          note: "OWASP: record it with each event so logs can be joined"
          children:
            - id: x-request-id
              label: X-Request-ID
              note: Non-standard; RFC 6648 deprecates the X- prefix for new names
        - id: distributed-tracing
          label: Distributed tracing
          note: Every span in a trace carries the same trace ID
          children:
            - id: traceparent
              label: traceparent header
              note: version-traceid-parentid-flags, all lowercase hex
        - id: red-metrics
          label: RED metrics
          note: Tom Wilkie's method for services; USE is for machines
          children:
            - id: latency-percentiles
              label: p95 / p99 latency
              note: Read from histogram buckets, not from a mean
        - id: structured-logging
          label: Structured JSON logs
          note: "Spring Boot 4.1: ECS, GELF or Logstash JSON out of the box"
        - id: micrometer-observation
          label: Actuator + Micrometer Observation
          note: "Spring Boot 4.1: one Observation gives metrics and traces"
          children:
            - id: opentelemetry-starter
              label: spring-boot-starter-opentelemetry
              note: Spring Boot 4.1 starter for OpenTelemetry with OTLP
  playbook:
    - id: api-styles
      children:
        - id: soap
          label: SOAP
          note: "SOAP 1.2 (W3C, 2007): Envelope, optional Header, required Body"
          children:
            - id: wsdl
              label: WSDL
              note: "WSDL 2.0 (W3C, 2007): interface, binding and endpoint in XML"
        - id: graphql
          label: GraphQL
          note: One URL, usually /graphql; POST required, GET optional for queries
          children:
            - id: graphql-mutation
              label: Mutation
              note: A write operation; over HTTP it must use POST
            - id: persisted-queries
              label: Persisted queries
              note: Send a short id, not the query text, so GET URLs stay short
        - id: grpc
          label: gRPC
          note: HTTP semantics over HTTP/2; Protocol Buffers by default
          children:
            - id: grpc-streaming
              label: Streaming RPCs
              note: Server, client or bidirectional streams, besides unary calls
            - id: grpc-web
              label: gRPC-Web
              note: Browser client via a proxy (Envoy default); unary and server streams
    - id: websockets-and-sse
      children:
        - id: short-polling
          label: Short polling
          note: Empty replies when nothing changed; delay up to the interval
        - id: long-polling
          label: Long polling
          note: "RFC 6202: about 30 s is safe; longer waits risk 408 or 504"
        - id: server-sent-events
          label: Server-Sent Events (SSE)
          note: "HTML Standard: EventSource API, UTF-8 text/event-stream"
          children:
            - id: last-event-id
              label: Last-Event-ID
              note: "Sent on reconnect; a retry: line sets the wait in milliseconds"
            - id: sse-stop-204
              label: 204 stops reconnects
              note: Answer 204 No Content and the client stops reconnecting
        - id: websocket
          label: WebSocket
          note: "RFC 6455: Upgrade: websocket, then 101 Switching Protocols"
          children:
            - id: ws-and-wss
              label: ws:// and wss://
              note: Port 80 by default; wss runs over TLS on port 443
        - id: sseemitter
          label: SseEmitter
          note: "Spring MVC: return it from a controller; send() events, complete()"
        - id: spring-websocket-handler
          label: "@EnableWebSocket + WebSocketHandler"
          note: Map handlers in WebSocketConfigurer.registerWebSocketHandlers
    - id: payment-api-walkthrough
      children:
        - id: load-balancer
          label: Load balancer
          note: Spreads requests and sends them only to healthy instances
        - id: payment-gateway
          label: Payment gateway
          note: External charge call; a retry reuses its idempotency key
        - id: receipt-queue-worker
          label: Queue + worker
          note: Slow work such as receipts runs off the request path
