id: retry-vs-circuit-breaker
tech: rest-api
title: "Retry vs Circuit Breaker"
compares: [retry-policy, circuit-breaker-pattern]
gist:
  - "Try again soon: the fault should pass"
  - "Stop calling for a while: fail fast"
diagrams:
  - |
    flowchart LR
      A[Call gateway] -- 503 --> W[Wait with jitter]
      W --> A
      A -- 201 --> OK([Done])
  - |
    flowchart LR
      C[Closed] -- too many failures --> O[Open]
      O -- timer ends --> H[Half-open]
      H -- trial ok --> C
      H -- trial fails --> O
diagramAlt: "Retry: the call to the gateway gets a 503, waits a random backoff and calls again until it gets 201. Circuit breaker: Closed passes calls; too many failures switch it to Open, which fails calls at once; when a timer ends it goes Half-open and lets trial calls through; success closes it, a failure opens it again."
rows:
  - { aspect: "Best for", a: "Brief, transient faults", b: "A dependency that keeps failing" }
  - { aspect: "What it does", a: "Sends the call again after a wait", b: "Rejects calls without sending them" }
  - { aspect: "Risk", a: "Extra load on a struggling service", b: "Fails fast too long if the timer is long" }
  - { aspect: "You set", a: "Attempts, backoff, which errors", b: "Failure threshold, open time, trial calls" }
  - { aspect: "Together", a: "Each retry goes through the breaker", b: "When open, stop retrying" }
verdict: "Use both: retry for blips, the breaker for outages, and stop retrying while the breaker is open."
sources:
  - title: "Circuit Breaker pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker"
    verifiedOn: "2026-10-20"
  - title: "Retry pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/retry"
    verifiedOn: "2026-10-20"
