id: offset-vs-cursor-pagination
tech: rest-api
title: Offset vs Cursor Pagination
compares: [offset-pagination, cursor-pagination]
gist:
  - "Skip N rows, then return the next page"
  - "Return the rows after an opaque marker"
rows:
  - { aspect: "Request", a: "?page=2&size=20 or ?offset=40&limit=20", b: "?size=20&cursor=8f3a2c" }
  - { aspect: "Jump to page N", a: "Yes, and total pages are easy", b: "No: next page only" }
  - { aspect: "Deep pages", a: "Slower: skipped rows are still read", b: "Steady: WHERE id < last id uses the index" }
  - { aspect: "Rows added while paging", a: "Pages shift: skips or duplicates", b: "No shift: it continues after the last row seen" }
  - { aspect: "Needs", a: "A stable ORDER BY", b: "A unique, sequential sort key" }
verdict: "Offset for small lists where users jump to a page; cursor for large or live lists like payment history."
sources:
  - title: "Evolving API Pagination at Slack (Slack Engineering)"
    url: "https://slack.engineering/evolving-api-pagination-at-slack/"
    verifiedOn: "2026-10-20"
  - title: "PostgreSQL 18 docs: 7.6 LIMIT and OFFSET"
    url: "https://www.postgresql.org/docs/18/queries-limit.html"
    verifiedOn: "2026-10-20"
  - title: "AIP-158: Pagination (Google API Improvement Proposals)"
    url: "https://google.aip.dev/158"
    verifiedOn: "2026-10-20"
