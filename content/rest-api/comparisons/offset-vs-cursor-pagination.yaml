id: offset-vs-cursor-pagination
tech: rest-api
title: Offset vs Cursor Pagination
compares: [offset-pagination, cursor-pagination]
gist:
  - "Skip N rows, then return the next page"
  - "Return the rows after an opaque marker"
explain:
  - "Offset pagination numbers the pages. The client asks for page 2 of size 20, and the database skips the first 40 rows and returns the next 20. It lets a user jump straight to any page."
  - "Cursor pagination hands the client an opaque token that marks where the last page ended. The client sends it back, and the server returns the rows after that point. It gives every page the same cost and keeps pages steady while new rows arrive."
example: "A merchant pages through payments, newest first. Between page 1 and page 2, five new payments arrive. With ?page=2 the last five rows of page 1 slide into page 2 and show twice. With ?cursor=8f3a2c the server continues after the last payment on page 1, so nothing repeats."
rows:
  - { aspect: "Request", a: "?page=2&size=20 or ?offset=40&limit=20", b: "?size=20&cursor=8f3a2c" }
  - { aspect: "Jump to page N", a: "Yes, and total pages are easy", b: "No: next page only" }
  - { aspect: "Deep pages", a: "Slower: the database still reads every skipped row", b: "Steady: WHERE id < last id lets the index skip them" }
  - { aspect: "Rows added while paging", a: "Pages shift: skips or duplicates", b: "No shift: it continues after the last row seen" }
  - { aspect: "Needs", a: "A stable ORDER BY", b: "A unique, sequential sort key" }
verdict: "Offset for small lists where users jump to a page; cursor for large or live lists like payment history."
sayIt: "Offset skips N rows, so users can jump to any page, but deep pages get slower and new rows shift pages. A cursor continues after the last row seen, so every page costs the same and nothing repeats. I use offset for small admin tables and a cursor for large or live feeds."
