id: unit-vs-integration-vs-contract-test
tech: rest-api
title: Unit vs Integration vs Contract Test
compares: [unit-test, integration-test, contract-test]
gist:
  - "One method or class; slow dependencies are test doubles"
  - "Your code wired to a real database or service"
  - "Consumer and provider agree on requests and responses"
explain:
  - "A unit test checks one class or method on its own. Slow or outside dependencies, such as the repository, are replaced by test doubles, so it runs in milliseconds."
  - "An integration test checks that real parts work together, for example your repository against a real database, or the whole app over HTTP."
  - "A contract test checks that a consumer and a provider agree on the requests and responses between them, so one team cannot break the other without noticing."
example: "PaymentService's rule \"amount must not exceed the daily limit\" gets a unit test with a fake repository. The SQL that finds pending payments gets an integration test against PostgreSQL. The merchant app's expectation of GET /api/payments/{id} becomes a Pact contract that the payment API checks in its build."
rows:
  - { aspect: "Catches", a: "Logic and rule bugs", b: "Query, JSON and wiring bugs", c: "Breaking API changes between teams" }
  - { aspect: "Speed", a: "Fastest: thousands in minutes", b: "Slower: real dependencies", c: "Fast: runs against stubs and contract files" }
  - { aspect: "Needs", a: "Nothing outside the class", b: "A real or local database or service", c: "A contract shared by both sides" }
  - { aspect: "How many", a: "Most of the suite", b: "Fewer", c: "One set per consumer and provider pair" }
  - { aspect: "Java tools", a: "JUnit, Mockito", b: "Spring Boot test support", c: "Pact, Spring Cloud Contract" }
verdict: "Push each check as low as it can go: unit tests for rules, integration tests for wiring, contract tests where another team calls your API."
sayIt: "Unit tests check one class with test doubles and are most of the suite. Integration tests check real wiring, such as SQL against a real database. Contract tests check that a consumer and a provider agree on the API, so one team cannot break another."
