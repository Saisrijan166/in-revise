id: unit-vs-integration-vs-contract-test
tech: rest-api
title: Unit vs Integration vs Contract Test
compares: [unit-test, integration-test, contract-test]
gist:
  - "One method or class; slow dependencies are test doubles"
  - "Your code wired to a real database or service"
  - "Consumer and provider agree on requests and responses"
rows:
  - { aspect: "Catches", a: "Logic and rule bugs", b: "Query, JSON and wiring bugs", c: "Breaking API changes between teams" }
  - { aspect: "Speed", a: "Fastest: thousands in minutes", b: "Slower: real dependencies", c: "Fast: runs against stubs and contract files" }
  - { aspect: "Needs", a: "Nothing outside the class", b: "A real or local database or service", c: "A contract shared by both sides" }
  - { aspect: "How many", a: "Most of the suite", b: "Fewer", c: "One set per consumer and provider pair" }
  - { aspect: "Java tools", a: "JUnit, Mockito", b: "Spring Boot test support", c: "Pact, Spring Cloud Contract" }
verdict: "Push each check as low as it can go: unit tests for rules, integration tests for wiring, contract tests where another team calls your API."
sources:
  - title: "The Practical Test Pyramid (martinfowler.com)"
    url: "https://martinfowler.com/articles/practical-test-pyramid.html"
    verifiedOn: "2026-10-20"
  - title: "How Pact works (Pact docs)"
    url: "https://docs.pact.io/getting_started/how_pact_works"
    verifiedOn: "2026-10-20"
  - title: "Test Scope Dependencies (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/testing/test-scope-dependencies.html"
    verifiedOn: "2026-10-20"
