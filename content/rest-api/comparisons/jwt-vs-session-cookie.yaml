id: jwt-vs-session-cookie
tech: rest-api
title: JWT vs Session cookie
compares: [jwt, session-cookie-auth]
gist:
  - "The token carries the claims; the server keeps none"
  - "The cookie holds an ID; the server keeps the session"
rows:
  - { aspect: "State lives", a: "In the signed token", b: "In the server's session store" }
  - { aspect: "Each request", a: "Verify the signature locally", b: "Look up the session by ID" }
  - { aspect: "Logout", a: "Hard: valid until exp unless you keep a denylist", b: "Easy: delete the session" }
  - { aspect: "Sent", a: "Usually Authorization: Bearer header", b: "Automatically by the browser" }
  - { aspect: "CSRF risk", a: "Low: browsers do not add the header themselves", b: "Yes: needs CSRF tokens or SameSite" }
verdict: "Use a session cookie for one browser web app; use short-lived JWTs for APIs called by many services or mobile apps."
sources:
  - title: "JSON Web Token Cheat Sheet: revocation (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "Session Management Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "Cross Site Request Forgery (Spring Security 7.1 reference)"
    url: "https://docs.spring.io/spring-security/reference/features/exploits/csrf.html"
    verifiedOn: "2026-10-20"
