id: jwt-vs-session-cookie
tech: rest-api
title: JWT vs Session cookie
compares: [jwt, session-cookie-auth]
gist:
  - "The token carries the claims; the server keeps none"
  - "The cookie holds an ID; the server keeps the session"
explain:
  - "A JWT is a signed token that carries facts about the caller, such as user id and expiry time. The server checks the signature, with no lookup, so any instance can accept it."
  - "A session cookie holds only a random session id. The server keeps the session data in memory or a store, and looks it up by that id on every request."
example: "A mobile app calls the payment API with Authorization: Bearer <JWT>; instance B verifies the signature and reads the user id from the token. A browser app sends Cookie: SESSION=8f3a; the server must find session 8f3a in its session store before it knows who the user is."
rows:
  - { aspect: "State lives", a: "In the signed token", b: "In the server's session store" }
  - { aspect: "Each request", a: "Verify the signature locally", b: "Look up the session by ID" }
  - { aspect: "Logout", a: "Hard: valid until exp unless you keep a denylist", b: "Easy: delete the session" }
  - { aspect: "Sent", a: "Usually Authorization: Bearer header", b: "Automatically by the browser" }
  - { aspect: "CSRF risk", a: "Low: browsers do not add the header themselves", b: "Yes: needs CSRF tokens or SameSite" }
verdict: "Use a session cookie for one browser web app; use short-lived JWTs for APIs called by many services or mobile apps."
sayIt: "A JWT carries the signed claims, so any server verifies it without a lookup, but it stays valid until it expires. A session cookie carries only an id, so the server keeps the session and can end it at once. Sessions suit one browser app; short-lived JWTs suit APIs."
sources:
