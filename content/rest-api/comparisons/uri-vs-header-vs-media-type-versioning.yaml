id: uri-vs-header-vs-media-type-versioning
tech: rest-api
title: URI vs Header vs Media Type Versioning
compares: [uri-versioning, header-versioning, media-type-versioning]
gist:
  - "Version in the path: /api/v2/payments"
  - "Version in a custom header: API-Version: 2"
  - "Version in Accept: application/vnd.shop.v2+json"
explain:
  - "URI versioning puts the version in the path, such as /api/v2/payments. Anyone can see which version a call uses, and each version is a separate URL that browsers, logs and caches handle like any other."
  - "Header versioning keeps one URL and sends the version in a custom header, such as API-Version: 2. The resource keeps a single URI, but every client must remember to send the header."
  - "Media type versioning puts the version in the Accept header, such as Accept: application/vnd.shop.v2+json. It uses HTTP content negotiation, so the version is part of the format the client asks for."
example: "The payment API ships v2 with amountInPaise. With URI versioning, old apps keep calling /api/v1/payments/PAY101 and new ones call /api/v2/payments/PAY101. With header versioning, both call /api/payments/PAY101 and send API-Version: 1 or 2. A shared cache in front must then key on that header, or it may hand a v2 body to a v1 app."
rows:
  - { aspect: "Seen in the URL", a: "Yes", b: "No", c: "No" }
  - { aspect: "One URI per resource", a: "No: each version has its own", b: "Yes", c: "Yes" }
  - { aspect: "Caching", a: "Simple: the URI is the cache key", b: "Harder: caches must read the header", c: "Harder: caches must read Accept" }
  - { aspect: "Spring Framework 7.0", a: "Path segment resolver", b: "Request header resolver", c: "Media type parameter resolver" }
verdict: "Use the path when visibility and simple caching matter most; a header or media type when one URI per resource matters more."
sayIt: "The path, like /api/v2, is the most visible and the simplest to cache, but each version gets its own URL. A header or the Accept media type keeps one URL per resource, but caches must vary on that header. I usually choose the path for public APIs; Spring Framework 7.0 supports all of them."
sources:
  - title: "Web API design best practices: versioning (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design"
    verifiedOn: "2026-10-20"
  - title: "Spring Framework 7.0 reference: MVC Config, API Version"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-config/api-version.html"
    verifiedOn: "2026-10-20"
  - title: "RFC 9111 HTTP Caching: 4.1 Calculating cache keys with Vary"
    url: "https://www.rfc-editor.org/rfc/rfc9111.html#section-4.1"
    verifiedOn: "2026-10-21"
