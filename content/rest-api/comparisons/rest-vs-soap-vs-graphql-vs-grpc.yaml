id: rest-vs-soap-vs-graphql-vs-grpc
tech: rest-api
title: REST vs SOAP vs GraphQL vs gRPC
compares: [what-is-rest, soap, graphql, grpc]
gist:
  - "Resources at URLs, HTTP methods, usually JSON"
  - "Operations in an XML envelope, contract in WSDL"
  - "One endpoint; the client picks the fields"
  - "Typed calls from a .proto file, binary, HTTP/2"
rows:
  - { aspect: "You call", a: "A resource URL with a method", b: "An operation", c: "/graphql with a query", d: "A method on a service" }
  - { aspect: "Payload", a: "Usually JSON", b: "XML", c: "JSON", d: "Protocol Buffers (binary)" }
  - { aspect: "Contract", a: "Optional, often OpenAPI", b: "WSDL", c: "Schema, required", d: ".proto file, required" }
  - { aspect: "Transport", a: "HTTP", b: "HTTP or others, via bindings", c: "HTTP, mostly POST", d: "HTTP/2" }
  - { aspect: "Fits", a: "Public and partner APIs", b: "Legacy enterprise partners", c: "Varied UI reads", d: "Internal low-latency calls" }
verdict: "Default to REST; GraphQL for flexible client reads, gRPC for internal speed and streams, SOAP only when a partner requires it."
sources:
  - title: "Serving over HTTP (graphql.org)"
    url: "https://graphql.org/learn/serving-over-http/"
    verifiedOn: "2026-10-20"
  - title: "gRPC FAQ (grpc.io)"
    url: "https://grpc.io/docs/what-is-grpc/faq/"
    verifiedOn: "2026-10-20"
  - title: "Protocol Buffers overview (protobuf.dev)"
    url: "https://protobuf.dev/overview/"
    verifiedOn: "2026-10-20"
  - title: "SOAP Version 1.2 Part 1: Messaging Framework (W3C Recommendation, 2007)"
    url: "https://www.w3.org/TR/soap12-part1/"
    verifiedOn: "2026-10-20"
  - title: "Web Services Description Language (WSDL) 2.0 Part 1 (W3C Recommendation, 2007)"
    url: "https://www.w3.org/TR/wsdl20/"
    verifiedOn: "2026-10-20"
