id: cors-vs-csrf
tech: rest-api
title: CORS vs CSRF
compares: [cors, csrf-attack]
gist:
  - "A rule set: which other sites may read your API"
  - "An attack: another site sends requests as the user"
explain:
  - "CORS is a browser mechanism: the API sends Access-Control-Allow-* headers to say which other origins may read its responses. It loosens the same-origin policy for sites the API trusts."
  - "CSRF (cross-site request forgery) is an attack: a malicious site makes the user's browser send a request to your API, and the browser attaches the user's cookies automatically."
example: "A customer logged in to shop.example opens evil.example, which has a hidden form that POSTs to api.shop.example/payments. A form post is a simple request, so no preflight runs and the browser sends the session cookie. CORS only hides the response from evil.example; the payment is made unless a CSRF token or a SameSite cookie stops it."
rows:
  - { aspect: "Kind", a: "A browser mechanism (response headers)", b: "An attack that abuses automatic cookies" }
  - { aspect: "Concerns", a: "Reading cross-origin responses", b: "Cross-site writes, which browsers allow" }
  - { aspect: "You fix it with", a: "A precise Access-Control-Allow-Origin list", b: "CSRF tokens, SameSite cookies" }
  - { aspect: "Matters when", a: "A browser app on another origin calls you", b: "Auth rides on cookies or Basic auth" }
verdict: "CORS does not stop CSRF: lock CORS to known origins, and add CSRF protection whenever browsers send credentials automatically."
sayIt: "CORS decides which origins may read my API's responses in a browser; CSRF is an attack that abuses the cookies a browser sends automatically. CORS does not stop CSRF, so an API that authenticates with cookies also needs CSRF tokens or SameSite cookies."
