id: path-vs-query-parameter
tech: rest-api
title: Path Parameter vs Query Parameter
compares: [path-parameter, query-parameter]
gist:
  - "Names which resource: /payments/PAY101"
  - "Shapes the result: ?status=SUCCESS&page=0"
explain:
  - "A path parameter is a segment of the URL path, such as PAY101 in /api/payments/PAY101. It names which resource you mean, so a different value means a different resource."
  - "A query parameter is a key=value pair after the ?, such as ?status=SUCCESS. It filters, sorts, pages or tunes the result of the resource the path already named."
example: "GET /api/payments/PAY101 reads one payment; PAY101 is a path parameter. GET /api/payments?status=SUCCESS&page=0 reads the payments collection, keeps only successful ones and returns the first page; status and page are query parameters. Drop them and you get the whole collection."
rows:
  - { aspect: "Job", a: "Identify one resource", b: "Filter, sort, page or add options" }
  - { aspect: "Example", a: "/api/payments/PAY101", b: "/api/payments/PAY101?includeRefunds=true" }
  - { aspect: "Shape (RFC 3986)", a: "Hierarchical segments split by /", b: "Non-hierarchical data after ?, usually key=value" }
  - { aspect: "Leave it out", a: "A different resource, often the collection", b: "The API should apply a sensible default" }
  - { aspect: "Spring annotation", a: "@PathVariable", b: "@RequestParam (required unless required = false or Optional)" }
verdict: "Use the path to say which resource; use query parameters to filter, sort, page or tune the response."
sayIt: "A path parameter identifies the resource, like PAY101 in /payments/PAY101. A query parameter shapes the result, like ?status=SUCCESS&page=0. If leaving the value out should give a different resource, it belongs in the path; if it should give a default, the query."
sources:
  - title: "RFC 3986: URI Generic Syntax, sections 3.3 (path) and 3.4 (query)"
    url: "https://www.rfc-editor.org/rfc/rfc3986.html"
    verifiedOn: "2026-10-20"
  - title: "Web API design best practices: URIs, filtering and pagination (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design"
    verifiedOn: "2026-10-20"
  - title: "Mapping Requests: URI patterns and @PathVariable (Spring Framework 7.0)"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html"
    verifiedOn: "2026-10-20"
  - title: "@RequestParam (Spring Framework 7.0)"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestparam.html"
    verifiedOn: "2026-10-20"
