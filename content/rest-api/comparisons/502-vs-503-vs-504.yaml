id: 502-vs-503-vs-504
tech: rest-api
title: 502 vs 503 vs 504
compares: [502-bad-gateway, 503-service-unavailable, 504-gateway-timeout]
gist:
  - "Gateway got a broken reply from upstream"
  - "Server is overloaded or down for maintenance"
  - "Gateway gave up waiting for upstream"
explain:
  - "502 Bad Gateway comes from a gateway or proxy, a server that forwards requests to the service behind it, called the upstream. The upstream did answer, but with a broken or invalid reply."
  - "503 Service Unavailable means the server cannot handle the request right now, because it is overloaded or down for maintenance. It is expected to be temporary, and Retry-After can say when to come back."
  - "504 Gateway Timeout also comes from a gateway or proxy. It waited for the upstream service, got no reply in time, and gave up."
example: "The API gateway forwards POST /api/payments to the payment service. If the payment service crashes mid-reply and sends garbage, the gateway returns 502. If the payment service is in a maintenance window, it returns 503 with Retry-After: 120. If the bank call makes the payment service take longer than the gateway's timeout, the gateway returns 504."
rows:
  - { aspect: "Sent by", a: "A gateway or proxy", b: "The server that cannot handle it now", c: "A gateway or proxy" }
  - { aspect: "Upstream", a: "Answered, but invalidly", b: "Not part of its meaning", c: "Did not answer in time" }
  - { aspect: "Expected to last", a: "Unknown", b: "Temporary; may send Retry-After", c: "Unknown" }
  - { aspect: "Example", a: "Gateway gets a garbled reply from the payment service", b: "Payment service in a maintenance window", c: "Bank API takes longer than the gateway's timeout" }
verdict: "Bad reply from upstream: 502. Too busy or in maintenance: 503 with Retry-After. No reply in time: 504."
sayIt: "502 and 504 come from a gateway: 502 means the upstream sent an invalid reply, 504 means it sent none in time. 503 means the server itself is overloaded or in maintenance, usually for a short time, and it can send Retry-After."
sources:
  - title: "RFC 9110 HTTP Semantics, 15.6.3 to 15.6.5 (502, 503, 504)"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.3"
    verifiedOn: "2026-10-20"
