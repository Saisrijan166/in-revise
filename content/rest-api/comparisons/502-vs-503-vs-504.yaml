id: 502-vs-503-vs-504
tech: rest-api
title: 502 vs 503 vs 504
compares: [502-bad-gateway, 503-service-unavailable, 504-gateway-timeout]
gist:
  - "Gateway got a broken reply from upstream"
  - "Server is overloaded or down for maintenance"
  - "Gateway gave up waiting for upstream"
rows:
  - { aspect: "Sent by", a: "A gateway or proxy", b: "The server that cannot cope", c: "A gateway or proxy" }
  - { aspect: "Upstream", a: "Answered, but invalidly", b: "Not involved", c: "Did not answer in time" }
  - { aspect: "Expected to last", a: "Unknown", b: "Temporary; may send Retry-After", c: "Unknown" }
  - { aspect: "Example", a: "Gateway gets a garbled reply from the payment service", b: "Payment service in a maintenance window", c: "Bank API takes longer than the gateway's timeout" }
verdict: "Bad reply from upstream: 502. Too busy or in maintenance: 503 with Retry-After. No reply in time: 504."
sources:
  - title: "RFC 9110 HTTP Semantics, 15.6.3 to 15.6.5 (502, 503, 504)"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.3"
    verifiedOn: "2026-10-20"
