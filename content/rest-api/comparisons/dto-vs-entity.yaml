id: dto-vs-entity
tech: rest-api
title: DTO vs Entity
compares: [dto-class, jpa-entity]
gist:
  - "API contract: the fields a client sends or sees"
  - "Database model: maps a table, every column"
explain:
  - "A DTO (data transfer object) is a small class or record that defines exactly what the API receives or returns for one call. It is shaped by what clients need."
  - "An entity is the class mapped to a database table, usually marked with JPA's @Entity. It holds every column and relation the application stores."
example: "The Payment entity has id, customerId, amount, status and cardNumber. GET /api/payments/PAY101 returns a PaymentResponse DTO with only id, amount and status, so the card number never leaves the API. POST takes a CreatePaymentRequest with amount, currency and method, so a client cannot set status to SUCCESS."
rows:
  - { aspect: "Shaped by", a: "What clients need", b: "The database schema" }
  - { aspect: "Holds", a: "Only the fields for this call", b: "Every column, relations, internal fields" }
  - { aspect: "Typical Java form", a: "A record (Java 16+)", b: "A class with @Entity; a record cannot be an entity" }
  - { aspect: "Return from a controller", a: "Yes", b: "No: it leaks internal fields and ties clients to the tables" }
verdict: "Persist entities, expose DTOs, and map between them in the service."
sayIt: "Entities model the database; DTOs model the API contract. I persist entities, accept and return DTOs, and map between them in the service, so clients never see internal fields or set fields like status, and the schema can change without breaking clients."
sources:
  - title: "OWASP API3:2023 Broken Object Property Level Authorization"
    url: "https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/"
    verifiedOn: "2026-10-20"
  - title: "Jakarta Persistence 3.2 specification: entity class rules (records may not be entities)"
    url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html"
    verifiedOn: "2026-10-20"
  - title: "JEP 395: Records (OpenJDK)"
    url: "https://openjdk.org/jeps/395"
    verifiedOn: "2026-10-20"
