id: resttemplate-vs-restclient-vs-webclient
tech: rest-api
title: "RestTemplate vs RestClient vs WebClient vs Interface Client"
compares: [resttemplate, restclient, webclient, http-interface-client]
gist:
  - "Old blocking client with template methods"
  - "Blocking client with a fluent API"
  - "Non-blocking reactive client: Mono and Flux"
  - "An annotated interface; Spring builds the client"
rows:
  - { aspect: "Call style", a: "getForObject, exchange", b: "get().uri().retrieve().body()", c: "Same fluent style, returns Mono or Flux", d: "Interface methods with @GetExchange" }
  - { aspect: "Blocks the thread", a: "Yes", b: "Yes", c: "No", d: "Depends on the client underneath" }
  - { aspect: "Since", a: "Spring Framework 3.0", b: "Spring Framework 6.1", c: "Spring Framework 5.0", d: "Spring Framework 6.0" }
  - { aspect: "Module", a: "spring-web", b: "spring-web", c: "spring-webflux", d: "spring-web" }
  - { aspect: "Status in Framework 7.0", a: "Deprecated in docs; removal planned for 8.0", b: "Current", c: "Current", d: "Current; groups via @ImportHttpServices" }
verdict: "New blocking code: RestClient, or an interface client on top; reactive code: WebClient; move RestTemplate code over time."
sources:
  - title: "REST Clients (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/integration/rest-clients.html"
    verifiedOn: "2026-10-20"
