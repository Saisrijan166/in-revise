    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/client/RestClient.html"
    verifiedOn: "2026-10-20"
  - title: "WebClient: since 5.0 (Spring Framework 7.0 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/reactive/function/client/WebClient.html"
    verifiedOn: "2026-10-20"
  - title: "@HttpExchange: since 6.0 (Spring Framework 7.0 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/service/annotation/HttpExchange.html"
    verifiedOn: "2026-10-20"
