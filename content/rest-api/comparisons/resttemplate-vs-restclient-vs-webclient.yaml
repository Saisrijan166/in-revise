id: resttemplate-vs-restclient-vs-webclient
tech: rest-api
title: "RestTemplate vs RestClient vs WebClient vs Interface Client"
compares: [resttemplate, restclient, webclient, http-interface-client]
gist:
  - "Old blocking client with template methods"
  - "Blocking client with a fluent API"
  - "Non-blocking reactive client: Mono and Flux"
  - "An annotated interface; Spring builds the client"
explain:
  - "RestTemplate is Spring's original HTTP client, with template methods such as getForObject. It blocks the thread until the reply arrives, and Spring now plans to retire it."
  - "RestClient is the modern blocking client, added in Spring Framework 6.1. It has a fluent API, get().uri().retrieve().body(), and is the default for new code."
  - "WebClient is the reactive client from spring-webflux. It does not block: the reply arrives later as a Mono or Flux, which suits reactive apps and streaming."
  - "An HTTP interface client is a Java interface whose methods carry @GetExchange or @PostExchange. Spring generates the code that makes the calls through RestClient or WebClient."
example: "A Spring MVC payment service calls the gateway with RestClient: the request thread waits about 200 ms for the charge result. A reactive notification service streams events with WebClient. A team that calls the gateway from five places declares GatewayApi once as an @HttpExchange interface."
rows:
  - { aspect: "Call style", a: "getForObject, exchange", b: "get().uri().retrieve().body()", c: "Same fluent style, returns Mono or Flux", d: "Interface methods with @GetExchange" }
  - { aspect: "Blocks the thread", a: "Yes", b: "Yes", c: "No", d: "Depends on the client underneath" }
  - { aspect: "Since", a: "Spring Framework 3.0", b: "Spring Framework 6.1", c: "Spring Framework 5.0", d: "Spring Framework 6.0" }
  - { aspect: "Module", a: "spring-web", b: "spring-web", c: "spring-webflux", d: "spring-web" }
  - { aspect: "Status in Framework 7.0", a: "Deprecated in docs; removal planned for 8.0", b: "Current", c: "Current", d: "Current; groups via @ImportHttpServices" }
verdict: "New blocking code: RestClient, or an interface client on top; reactive code: WebClient; move RestTemplate code over time."
sayIt: "For new blocking code I use RestClient, often behind an @HttpExchange interface. WebClient is for reactive, non-blocking code. RestTemplate still works, but Spring plans @Deprecated in 7.1 and removal in 8.0, so I move old code over time."
