id: oauth2-vs-oidc
tech: rest-api
title: OAuth 2.0 vs OpenID Connect
compares: [oauth2-framework, oidc-layer]
gist:
  - "Authorisation: may this app call the API?"
  - "Authentication: who logged in?"
explain:
  - "OAuth 2.0 is a framework for delegated access: an app gets an access token, limited by scopes, to call an API for a user or for itself."
  - "OpenID Connect is an identity layer on top of OAuth 2.0: with the scope openid, the app also gets an ID token, a JWT that tells it who logged in and when."
example: "A shopping app offers 'Log in with your bank' and asks for the scopes openid and payments:read. It reads the customer's name from the ID token to greet them, and sends the access token to the bank's payments API to list payments. The payments API never sees the ID token."
rows:
  - { aspect: "Main token", a: "Access token", b: "ID token (always a JWT)" }
  - { aspect: "Token is for", a: "The API (resource server)", b: "The client app (aud = client_id)" }
  - { aspect: "Turned on by", a: "Scopes such as payments:write", b: "The scope openid" }
  - { aspect: "Spec", a: "RFC 6749 (2012) + RFC 9700 BCP (2025)", b: "OpenID Connect Core 1.0" }
verdict: "Use OAuth 2.0 when an app needs access to an API; add OIDC when the app also needs to know who the user is."
sayIt: "OAuth 2.0 is authorisation: it gives an app an access token to call an API. OpenID Connect adds authentication: an ID token for the app itself, saying who logged in. I send access tokens to APIs and use ID tokens only inside the client."
sources:
  - title: "RFC 6749 The OAuth 2.0 Authorization Framework"
    url: "https://www.rfc-editor.org/rfc/rfc6749"
    verifiedOn: "2026-10-20"
  - title: "OpenID Connect Core 1.0"
    url: "https://openid.net/specs/openid-connect-core-1_0.html"
    verifiedOn: "2026-10-20"
