id: authentication-vs-authorization
tech: rest-api
title: Authentication vs Authorisation
compares: [authn-check, authz-check]
gist:
  - "Who are you? Prove your identity"
  - "What may you do? Check your rights"
explain:
  - "Authentication checks who is calling. The API verifies a credential, such as a password, an API key or a token, and learns the caller's identity."
  - "Authorisation checks what that known caller may do. The API compares the action and the object with the caller's roles, scopes and ownership."
example: "customer-42 sends a valid token and asks for GET /api/payments/PAY101. Authentication passes, because the token is valid. PAY101 belongs to customer-7, so authorisation fails and the API returns 403, or 404 to hide it. With no token at all, the API stops earlier with 401."
rows:
  - { aspect: "Happens", a: "First, on every request", b: "After authentication, per action and object" }
  - { aspect: "Uses", a: "Password, API key, token or certificate", b: "Roles, scopes and ownership rules" }
  - { aspect: "Fails with", a: "401 Unauthorized + WWW-Authenticate", b: "403 Forbidden (or 404 to hide the object)" }
  - { aspect: "Payment example", a: "Is this token valid and not expired?", b: "Does this customer own PAY101?" }
verdict: "Authenticate first, then authorise every action; a valid login never proves access to a given object."
sayIt: "Authentication answers who you are, by checking a credential; authorisation answers what you may do, by checking roles, scopes and ownership. Authentication comes first, and authorisation runs for every action and object. Failing the first is 401, failing the second is 403."
sources:
  - title: "RFC 9110 HTTP Semantics: 401 Unauthorized and 403 Forbidden"
    url: "https://www.rfc-editor.org/rfc/rfc9110#section-15.5.2"
    verifiedOn: "2026-10-20"
  - title: "Authorization Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
