id: put-vs-patch-vs-post
tech: rest-api
title: PUT vs PATCH vs POST
compares: [method-put, method-patch, method-post]
gist:
  - "Replace the whole resource at a known URL"
  - "Change only some fields of a resource"
  - "Create in a collection, or run an action"
explain:
  - "PUT sends the complete new state of a resource to that resource's own URL. The server replaces what was there, so sending it twice leaves the same result."
  - "PATCH sends only the changes to a resource, in a format such as JSON Merge Patch. Fields it does not mention stay as they are."
  - "POST sends input to a collection or an action URL, and the server decides what to do with it, usually creating a new resource with a new id."
example: "PAY101 has a note and a tag. PUT /api/payments/PAY101/note with the full note replaces it. PATCH /api/payments/PAY101 with {\"tag\": \"rent\"} changes only the tag. POST /api/payments with {\"amount\": 500} creates a new payment, PAY102; sending that POST again creates PAY103."
rows:
  - { aspect: "Body", a: "The full new representation", b: "Only the changes (JSON Patch or Merge Patch)", c: "Input for the server to process" }
  - { aspect: "URL", a: "The resource itself: /api/payments/PAY101", b: "The resource itself", c: "A collection or action: /api/payments" }
  - { aspect: "Idempotent", a: "Yes", b: "Not by definition; can be designed to be", c: "No" }
  - { aspect: "Fields you leave out", a: "Gone or reset: the whole state is replaced", b: "Unchanged", c: "Server decides (defaults)" }
  - { aspect: "Creates?", a: "Yes, if nothing is at that URL: 201", b: "Can (RFC 5789), rarely used that way", c: "Yes, usually 201 + Location" }
  - { aspect: "Safe to retry", a: "Yes", b: "With If-Match, or if designed idempotent", c: "Only with an Idempotency-Key" }
verdict: "POST to create the ₹500 payment (with an Idempotency-Key), PATCH to change a few fields, PUT only when the client sends the whole resource."
sayIt: "PUT replaces the whole resource at its URL and is idempotent. PATCH changes only the fields it sends and is not idempotent by definition. POST asks the server to create or process something, so a repeat creates a duplicate unless I add an idempotency key."
sources:
  - title: "RFC 9110 HTTP Semantics, 9.3.3 POST and 9.3.4 PUT"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.4"
    verifiedOn: "2026-10-20"
  - title: "RFC 5789 PATCH Method for HTTP"
    url: "https://www.rfc-editor.org/rfc/rfc5789.html"
    verifiedOn: "2026-10-20"
