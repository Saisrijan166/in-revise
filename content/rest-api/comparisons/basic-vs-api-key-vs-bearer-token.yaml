id: basic-vs-api-key-vs-bearer-token
tech: rest-api
title: Basic auth vs API key vs Bearer token
compares: [basic-auth, api-key-auth, bearer-token-auth]
gist:
  - "Username and password on every call"
  - "One long-lived secret per app"
  - "A short-lived token from an authorization server"
explain:
  - "Basic auth sends a username and password with every request, Base64-encoded in the Authorization header. It is the simplest scheme and needs no login server."
  - "An API key is one long secret string that a provider gives to an app. The app sends it on each call, so the provider knows which app or project is calling, for quotas and billing."
  - "A bearer token is a short-lived token that an authorization server issues after login. Whoever holds it may use it until it expires, and its scopes limit what it allows."
example: "The payment API serves three callers. An internal admin script uses Basic auth over HTTPS. A partner shop sends its API key, so its traffic is counted and billed. The mobile app logs the customer in through OAuth 2.0 and sends Authorization: Bearer <token> to create the ₹500 payment."
rows:
  - { aspect: "Sent as", a: "Authorization: Basic base64(user:pass)", b: "A header such as X-API-Key (vendor choice)", c: "Authorization: Bearer <token>" }
  - { aspect: "Identifies", a: "A user account", b: "An app or project, not a person", c: "A user or service, with scopes" }
  - { aspect: "Lifetime", a: "Until the password changes", b: "Until revoked or rotated", c: "Short; set by the issuer (exp in a JWT)" }
  - { aspect: "If leaked", a: "The password itself is exposed", b: "Works until someone revokes it", c: "Works until it expires" }
  - { aspect: "Fits", a: "Internal tools, quick tests", b: "Quotas and billing for partner apps", c: "User and service APIs (OAuth 2.0)" }
verdict: "Use bearer tokens from OAuth 2.0 for user and service APIs, API keys only to identify apps, and Basic auth only over TLS for simple internal use."
sayIt: "Basic auth sends a password on every call, so I use it only over TLS for simple internal tools. An API key identifies an app, not a user. Bearer tokens from OAuth 2.0 are short-lived and scoped, so they are my default for user and service APIs."
sources:
