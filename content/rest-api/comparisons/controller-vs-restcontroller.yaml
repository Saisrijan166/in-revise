id: controller-vs-restcontroller
tech: rest-api
title: "@Controller vs @RestController"
compares: [controller-annotation, restcontroller-annotation]
gist:
  - "Returns a view name; a template renders HTML"
  - "Returns data; written to the body, usually JSON"
rows:
  - { aspect: "A returned String means", a: "A view name to render", b: "The response body itself" }
  - { aspect: "Made of", a: "A stereotype found by component scanning", b: "@Controller + @ResponseBody (composed)" }
  - { aspect: "JSON from one method", a: "Add @ResponseBody or return ResponseEntity", b: "The default for every method" }
  - { aspect: "Typical use", a: "Server-rendered HTML pages", b: "REST APIs for apps and other services" }
verdict: "Use @RestController for APIs; use @Controller only when the app renders HTML pages."
sources:
  - title: "Declaration: @Controller and @RestController (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann.html"
    verifiedOn: "2026-10-20"
  - title: "@ResponseBody and ResponseEntity (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/responsebody.html"
    verifiedOn: "2026-10-20"
