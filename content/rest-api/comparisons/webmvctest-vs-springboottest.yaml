id: webmvctest-vs-springboottest
tech: rest-api
title: "@WebMvcTest vs @SpringBootTest"
compares: [webmvctest-slice, springboottest-mock, springboottest-random-port]
gist:
  - "Web layer only; services mocked"
  - "Whole app; mock web environment, no server"
  - "Whole app on a real server, random port"
explain:
  - "@WebMvcTest starts only the web layer: controllers, advice and JSON converters. Services are mocked, and MockMvc sends fake requests, so it is fast and focused on HTTP behaviour."
  - "@SpringBootTest with the default MOCK environment starts every bean of the app but no server. Requests go through MockMvc once you add @AutoConfigureMockMvc."
  - "@SpringBootTest with RANDOM_PORT starts every bean and a real embedded server on a free port, so tests send real HTTP, for example with RestTestClient."
example: "Checking that -500 gets 400 and a good payment gets 201 is a @WebMvcTest with PaymentService mocked. Checking that the controller, service and repository save a payment together is a MOCK @SpringBootTest. Checking the full path through filters and the real server is one RANDOM_PORT test."
rows:
  - { aspect: "Loads", a: "Controllers, advice, converters, filters", b: "Every bean", c: "Every bean" }
  - { aspect: "Server", a: "None: MockMvc", b: "None (MOCK is the default)", c: "Real embedded server" }
  - { aspect: "Call it with", a: "MockMvcTester, auto-configured", b: "MockMvcTester, with @AutoConfigureMockMvc", c: "RestTestClient, with @AutoConfigureRestTestClient" }
  - { aspect: "Checks", a: "Mapping, validation, JSON, status", b: "Real beans wired together", c: "The full HTTP path end to end" }
  - { aspect: "Test @Transactional rollback", a: "No data layer loaded", b: "Yes, by default", c: "No: the server runs on another thread" }
verdict: "Use @WebMvcTest for each controller and a few RANDOM_PORT tests for end-to-end flows."
sayIt: "@WebMvcTest loads only the web layer with mocked services, so I use it for each controller's mapping, validation and status codes. @SpringBootTest loads the whole app; with RANDOM_PORT it adds a real server, which I keep for a few end-to-end flows."
sources:
  - title: "Testing Spring Boot Applications (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html"
    verifiedOn: "2026-10-20"
  - title: "Spring Boot 4.0 Migration Guide: MockMvc, TestRestTemplate and @SpringBootTest"
    url: "https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide"
    verifiedOn: "2026-10-20"
