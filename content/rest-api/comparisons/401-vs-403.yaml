id: 401-vs-403
tech: rest-api
title: 401 Unauthorized vs 403 Forbidden
compares: [401-unauthorized, 403-forbidden]
gist:
  - "Who are you? Credentials missing or invalid"
  - "I know who you are, but you may not do this"
rows:
  - { aspect: "Problem", a: "Authentication (despite the name)", b: "Authorisation: permission" }
  - { aspect: "Must send", a: "A WWW-Authenticate challenge", b: "Nothing extra; a reason is optional" }
  - { aspect: "Client should", a: "Log in or get a new token, then retry", b: "Not retry with the same credentials" }
  - { aspect: "₹500 example", a: "Expired bearer token", b: "Support agent without refund rights" }
  - { aspect: "Hide the resource", a: "Not applicable", b: "May answer 404 instead" }
verdict: "No valid identity: 401. Valid identity without permission: 403, or 404 to hide that the resource exists."
sources:
  - title: "RFC 9110 HTTP Semantics, 15.5.2 401 Unauthorized and 15.5.4 403 Forbidden"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.2"
    verifiedOn: "2026-10-20"
