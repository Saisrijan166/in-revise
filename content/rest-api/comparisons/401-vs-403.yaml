id: 401-vs-403
tech: rest-api
title: 401 Unauthorized vs 403 Forbidden
compares: [401-unauthorized, 403-forbidden]
gist:
  - "Who are you? Credentials missing or invalid"
  - "I know who you are, but you may not do this"
explain:
  - "401 Unauthorized means the server could not identify the caller: the credentials, such as a token, are missing, expired or wrong. It must say how to authenticate in a WWW-Authenticate header."
  - "403 Forbidden means the server knows who the caller is, or does not need to, but refuses this action. Logging in again with the same account will not help."
example: "A mobile app sends an expired bearer token to GET /api/payments/PAY101 and gets 401, so it refreshes the token and retries. A support agent with a valid token calls POST /api/payments/PAY101/refunds without refund rights and gets 403, so the app shows \"not allowed\" instead of a login screen."
rows:
  - { aspect: "Problem", a: "Authentication (despite the name)", b: "Authorisation: permission" }
  - { aspect: "Must send", a: "A WWW-Authenticate challenge", b: "Nothing extra; a reason is optional" }
  - { aspect: "Client should", a: "Log in or get a new token, then retry", b: "Not retry with the same credentials" }
  - { aspect: "₹500 example", a: "Expired bearer token", b: "Support agent without refund rights" }
  - { aspect: "Hide the resource", a: "Not applicable", b: "May answer 404 instead" }
verdict: "No valid identity: 401. Valid identity without permission: 403, or 404 to hide that the resource exists."
sayIt: "401 is about authentication despite its name: no valid credentials, so log in or refresh the token. 403 is about authorisation: the server knows who you are, but you may not do this. A server may send 404 instead of 403 to hide that the resource exists."
sources:
  - title: "RFC 9110 HTTP Semantics, 15.5.2 401 Unauthorized and 15.5.4 403 Forbidden"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.2"
    verifiedOn: "2026-10-20"
