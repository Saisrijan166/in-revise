id: polling-vs-long-polling-vs-sse-vs-websocket
tech: rest-api
title: Polling vs Long Polling vs SSE vs WebSocket
compares: [short-polling, long-polling, server-sent-events, websocket]
gist:
  - "Ask every few seconds; most replies are empty"
  - "Ask once; the server replies when news arrives"
  - "One HTTP response that streams server events"
  - "One upgraded connection; both sides send anytime"
rows:
  - { aspect: "Who sends", a: "Client asks", b: "Client asks, server answers late", c: "Server only", d: "Both sides" }
  - { aspect: "Connection", a: "A new request each time", b: "One held request, then the next", c: "One long HTTP response", d: "HTTP Upgrade to a TCP channel" }
  - { aspect: "Delay", a: "Up to the poll interval", b: "About one network trip", c: "Near instant", d: "Near instant" }
  - { aspect: "Cost", a: "Many empty replies", b: "Full headers per message", c: "6-connection limit on HTTP/1.1", d: "Proxies may block it" }
  - { aspect: "Fits", a: "Rare checks", b: "Push where SSE is not possible", c: "Status feeds, notifications", d: "Chat, games, trading" }
verdict: "Poll for rare checks, SSE for one-way live status, WebSocket for frequent two-way messages."
sources:
  - title: "RFC 6202: Known Issues and Best Practices for the Use of Long Polling and Streaming"
    url: "https://www.rfc-editor.org/rfc/rfc6202"
