id: polling-vs-long-polling-vs-sse-vs-websocket
tech: rest-api
title: Polling vs Long Polling vs SSE vs WebSocket
compares: [short-polling, long-polling, server-sent-events, websocket]
gist:
  - "Ask every few seconds; most replies are empty"
  - "Ask once; the server replies when news arrives"
  - "One HTTP response that streams server events"
  - "One upgraded connection; both sides send anytime"
explain:
  - "Short polling: the client sends a normal request every few seconds to ask whether anything changed. It works with any server and client, but most answers are 'nothing new'."
  - "Long polling: the client sends a request, and the server holds it open until there is news or a timeout, then answers. The client at once sends the next request. It gives push-like speed over plain HTTP."
  - "Server-Sent Events (SSE): the client opens one HTTP response that never ends, and the server writes events into it as they happen. Messages flow one way only, from server to client."
  - "WebSocket: one HTTP request is upgraded to a long-lived connection, and after that either side can send messages at any time. It suits frequent two-way traffic."
example: "The checkout page waits for PAY101 to settle. Short polling sends GET /api/payments/PAY101 every 3 seconds. Long polling sends one GET that the server answers only when the status changes. SSE keeps one stream open and receives a payment.succeeded event. A WebSocket would also work, but the page never needs to send anything back, so SSE is enough."
rows:
  - { aspect: "Who sends", a: "Client asks", b: "Client asks, server answers late", c: "Server only", d: "Both sides" }
  - { aspect: "Connection", a: "A new request each time", b: "One held request, then the next", c: "One long HTTP response", d: "HTTP Upgrade to a TCP channel" }
  - { aspect: "Delay", a: "Up to the poll interval", b: "About one network trip", c: "Near instant", d: "Near instant" }
  - { aspect: "Cost", a: "Many empty replies", b: "Full headers per message", c: "6-connection limit on HTTP/1.1", d: "Proxies may block it" }
  - { aspect: "Fits", a: "Rare checks", b: "Push where SSE is not possible", c: "Status feeds, notifications", d: "Chat, games, trading" }
verdict: "Poll for rare checks, SSE for one-way live status, WebSocket for frequent two-way messages."
sayIt: "Short polling asks every few seconds and wastes most calls; long polling holds a request until news arrives. SSE streams events one way from server to client over HTTP; a WebSocket upgrades to a two-way channel. For a payment status page I use SSE; WebSocket only when the client also sends often."
