id: logs-vs-metrics-vs-traces
tech: rest-api
title: Logs vs Metrics vs Traces
compares: [structured-logging, red-metrics, distributed-tracing]
gist:
  - "Timestamped records of single events"
  - "Numbers measured and aggregated over time"
  - "The path of one request across services"
explain:
  - "A log is a timestamped record of one event, such as \"provider timeout for PAY101\". It answers what exactly happened in one place, best written as JSON with named fields."
  - "A metric is a number measured and summed over time, such as requests per second or the p99 latency of an endpoint. It is cheap to keep and tells you that something is wrong, and how much."
  - "A trace follows one request through every service it touches. Each service adds a span with its timing, and all spans share one trace ID, so you see where the time went."
example: "The error-rate metric for POST /api/payments jumps to 4% and an alert fires. A trace of one failed payment shows 5 seconds spent in the provider span. The logs with that trace ID say \"provider timeout\" for PAY101, which explains the failure."
rows:
  - { aspect: "Answers", a: "What exactly happened here?", b: "Is something wrong, and how much?", c: "Where did this request slow down or fail?" }
  - { aspect: "Made of", a: "Log records, best as structured JSON", b: "Counters, gauges and histograms", c: "Spans that share one trace ID" }
  - { aspect: "Payment example", a: "ERROR provider timeout, PAY101, traceId", b: "Error rate of POST /api/payments rising", c: "Most time spent in the provider span" }
  - { aspect: "Spring Boot 4.1", a: "Logging with traceId and spanId", b: "Micrometer: http.server.requests", c: "Micrometer Tracing to OTLP or Zipkin" }
verdict: "Metrics alert you that something is wrong, traces show where, logs show why; the trace ID joins all three."
sayIt: "Metrics are cheap numbers over time that tell me something is wrong, traces show which service in one request's path was slow or failed, and logs give the exact event. I put the same trace ID in all three so I can jump from an alert to the trace to the log line."
sources:
