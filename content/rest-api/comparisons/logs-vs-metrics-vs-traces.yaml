id: logs-vs-metrics-vs-traces
tech: rest-api
title: Logs vs Metrics vs Traces
compares: [structured-logging, red-metrics, distributed-tracing]
gist:
  - "Timestamped records of single events"
  - "Numbers measured and aggregated over time"
  - "The path of one request across services"
rows:
  - { aspect: "Answers", a: "What exactly happened here?", b: "Is something wrong, and how much?", c: "Where did this request slow down or fail?" }
  - { aspect: "Made of", a: "Log records, best as structured JSON", b: "Counters, gauges and histograms", c: "Spans that share one trace ID" }
  - { aspect: "Payment example", a: "ERROR provider timeout, PAY101, traceId", b: "Error rate of POST /api/payments rising", c: "Most time spent in the provider span" }
  - { aspect: "Spring Boot 4.1", a: "Logging with traceId and spanId", b: "Micrometer: http.server.requests", c: "Micrometer Tracing to OTLP or Zipkin" }
verdict: "Metrics alert you that something is wrong, traces show where, logs show why; the trace ID joins all three."
sources:
  - title: "Signals (OpenTelemetry docs)"
    url: "https://opentelemetry.io/docs/concepts/signals/"
    verifiedOn: "2026-10-20"
  - title: "Metrics (OpenTelemetry docs)"
    url: "https://opentelemetry.io/docs/concepts/signals/metrics/"
    verifiedOn: "2026-10-20"
  - title: "Tracing (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/actuator/tracing.html"
    verifiedOn: "2026-10-20"
