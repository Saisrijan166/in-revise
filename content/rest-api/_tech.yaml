name: REST API
slug: rest-api
accent: fuchsia
summary: "REST APIs for backend interviews: HTTP methods and status codes, API design, security, idempotency and retries, Spring Boot controllers, testing and docs, and a payment API walkthrough."
codeLanguages:
  - java
storySpine:
  - step: "Two programs must talk over a network without knowing each other's code → follow REST: name resources with URIs and send HTTP requests and responses"
    cards:
      - what-is-rest
      - http-request-response
      - resources-and-uris
  - step: Many servers share the load, and links change as the API grows → keep requests stateless and let responses carry links to the next actions
    cards:
      - statelessness
      - richardson-maturity-hateoas
  - step: A client retries a payment POST after a dropped connection and creates a second payment → know which methods are safe and idempotent, and answer each outcome with the right status code
    cards:
      - http-methods
      - status-codes
  - step: Clients fetch the same unchanged data again and overwrite each other's edits → agree formats with headers, cache with Cache-Control and ETag, and guard writes with If-Match
    cards:
      - headers-content-negotiation
      - http-caching
      - conditional-requests
  - step: Clients guess URLs and lists grow without limit → plural noun URLs, query filters, and capped pages with a next link
    cards:
      - url-design-rules
      - pagination-filtering-sorting
  - step: Clients cannot parse errors, slow jobs time out, and changes break old apps → one problem details shape, 202 with a status URL, and versions only for breaking changes
    cards:
      - error-responses
      - long-running-operations
      - api-versioning
  - step: Anyone can call POST /api/payments, and tokens can be copied on the network → send a bearer token (often a JWT from OAuth 2.0) over HTTPS and validate it on every request
    cards:
      - authentication-methods
      - jwt
      - oauth2-and-oidc
      - https-tls
  - step: A logged-in customer reads PAY101 of someone else, and one script floods the API → check ownership on every request, lock CORS to known origins and return 429 above the rate limit
    cards:
      - owasp-api-security
      - cors
      - rate-limiting
  - step: The client times out after paying ₹500 and retries → send the same Idempotency-Key with capped, jittered retries, so the server returns the first result instead of charging again
    cards:
      - idempotency-keys
      - retries-and-timeouts
  - step: The gateway charged ₹500 but its reply was lost → mark it UNKNOWN, confirm through the signed webhook or a status query, and reconcile what is left
    cards:
      - unknown-outcomes
      - webhooks
  - step: A client posts ₹500 as JSON and needs a clean answer → a thin @RestController binds and validates the body, returns 201 with ResponseEntity, and one advice turns every error into a ProblemDetail
    cards:
      - spring-rest-controllers
      - request-binding-validation
      - response-entity
      - exception-handling
      - dto-mapping
  - step: The service must call the payment gateway and stay testable → call it with RestClient and timeouts, and test the controller with @WebMvcTest and MockMvcTester
    cards:
      - rest-clients
      - spring-api-testing
  - step: Support wants an AI summary of each failed ₹500 payment, and the API key must not leak → POST to the OpenAI Responses API with RestClient, a key from the environment, timeouts and capped retries on 429
    cards:
      - openai-api-integration
  - step: Clients guess request shapes and the docs drift from the code → publish one OpenAPI file, and test each layer, with contract tests between services
    cards:
      - openapi-swagger
      - api-testing-strategy
  - step: A ₹500 payment fails somewhere across three services and nobody can find it → send a traceparent ID on every hop and read logs, RED metrics and traces together
    cards:
      - observability-for-apis
  - step: The payment screen waits for PENDING to turn SUCCESS, and some callers fit REST badly → push status with SSE (WebSocket for two-way chat), and choose GraphQL or gRPC only where they pay off
    cards:
      - websockets-and-sse
      - api-styles
  - step: "An interviewer says: design the ₹500 payment API → walk one order from the contract to tests, linking each step to the concept that owns it"
    cards:
      - payment-api-walkthrough
topics:
  - id: basics
    title: REST Basics
    order: 1
    blurb: What REST is, how an HTTP exchange looks, resources and URIs, statelessness and the maturity levels.
  - id: http
    title: Methods, Status Codes and Headers
    order: 2
    blurb: Safe and idempotent methods, the status codes interviewers ask, headers, caching and conditional requests.
  - id: design
    title: API Design
    order: 3
    blurb: URL rules, pagination and filtering, versioning without breaking clients, error bodies and long-running work.
  - id: security
    title: Security
    order: 4
    blurb: Authentication methods, JWT, OAuth 2.0 and OIDC, CORS, HTTPS, rate limits and the OWASP API Top 10.
  - id: reliability
    title: Idempotency and Reliability
    order: 5
    blurb: Idempotency keys, safe retries and timeouts, unknown outcomes and reconciliation, and webhooks.
  - id: spring
    title: REST with Spring Boot
    order: 6
    blurb: Controllers, binding and validation, ResponseEntity, error handling, DTOs, HTTP clients and controller tests.
  - id: docs
    title: Documentation and Testing
    order: 7
    blurb: OpenAPI and Swagger, what to test in an API, and correlation IDs, logs, metrics and traces.
  - id: playbook
    title: Beyond REST and Playbook
    order: 8
    blurb: REST vs SOAP, GraphQL and gRPC, real-time options, and the payment API answer from end to end.
