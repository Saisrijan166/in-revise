    source:
      title: OWASP API Security Top 10 2023
      url: https://api-security.owasp.org/editions/2023/en/0x11-t10
      verifiedOn: 2026-10-20
  - id: sql-injection
    term: SQL injection
    aka:
      - parameterised query
      - parameterized query
      - prepared statement
