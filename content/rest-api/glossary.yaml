    source:
      title: Input Validation Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: idempotency-key-term
    term: Idempotency key
