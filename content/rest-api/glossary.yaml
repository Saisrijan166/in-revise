      url: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
      verifiedOn: 2026-10-20
  - id: jitter
    term: Jitter
    aka:
      - full jitter
    definition: Randomness added to retry waits so that clients do not all retry at the same moment.
