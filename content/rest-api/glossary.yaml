      title: Idempotent Consumer pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/idempotent-consumer
      verifiedOn: 2026-10-20
  - id: idempotent-receiver
    term: Idempotent receiver
    aka:
      - idempotent consumer
    definition: A receiver that handles a repeated message only once, usually by recording processed IDs.
    see: webhooks
    source:
      title: Idempotent Consumer pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/idempotent-consumer
      verifiedOn: 2026-10-20
  - id: retry-policy-term
    term: Retry policy
    aka:
      - retry policies
