terms:
  - id: api-term
    term: API
    aka:
      - Application Programming Interface
    definition: A contract that lets one program use another program's features through code, not a user interface.
    see: what-is-rest
    source:
      title: API (MDN Web Docs glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/API
      verifiedOn: 2026-10-20
  - id: rest-term
    term: REST
    aka:
      - Representational State Transfer
    definition: An architectural style for distributed hypermedia systems, defined by Roy Fielding in 2000 as a set of constraints.
    see: what-is-rest
    source:
      title: "Chapter 5: Representational State Transfer (Roy Fielding's dissertation, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: rest-api-term
    term: REST API
    aka:
      - RESTful API
      - RESTful service
      - RESTful web service
    definition: An API that follows the REST constraints; the name is often used loosely for any HTTP API.
    see: what-is-rest
    source:
      title: REST (MDN Web Docs glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/REST
      verifiedOn: 2026-10-20
  - id: architectural-style
    term: Architectural style
    definition: A coordinated set of constraints on the parts of a system and how they interact; REST is one.
    see: what-is-rest
    source:
      title: "Chapter 1: Software Architecture, 1.5 Styles (Fielding, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/software_arch.htm
      verifiedOn: 2026-10-20
  - id: uniform-interface
    term: Uniform interface
    definition: "REST rule that every resource is used through the same generic interface: identifiers, representations, self-descriptive messages, hypermedia."
    see: what-is-rest
    source:
      title: "Chapter 5: Representational State Transfer (Roy Fielding's dissertation, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: layered-system
    term: Layered system
    definition: REST rule that each part sees only the next layer, so proxies, caches and gateways can sit between.
    see: what-is-rest
    source:
      title: "Chapter 5: Representational State Transfer (Roy Fielding's dissertation, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: code-on-demand
    term: Code on demand
    definition: "The optional REST constraint: the server may send code, such as scripts, for the client to run."
    see: what-is-rest
    source:
      title: "Chapter 5: Representational State Transfer (Roy Fielding's dissertation, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: resource-rest
    term: Resource (REST)
    aka:
      - REST resource
    definition: Any named thing an API exposes, such as a payment; the target of an HTTP request.
    see: resources-and-uris
    source:
      title: "RFC 9110: HTTP Semantics"
      url: https://www.rfc-editor.org/rfc/rfc9110.html
      verifiedOn: 2026-10-20
  - id: representation-rest
    term: Representation (REST)
    aka:
      - resource representation
    definition: Data plus metadata that shows a resource's past, current or desired state, such as a JSON document.
    see: resources-and-uris
    source:
      title: "RFC 9110: HTTP Semantics"
      url: https://www.rfc-editor.org/rfc/rfc9110.html
      verifiedOn: 2026-10-20
  - id: uri-term
    term: URI
    aka:
      - Uniform Resource Identifier
    definition: A string that identifies a resource, made of scheme, authority, path, query and fragment (RFC 3986).
    see: resources-and-uris
    source:
      title: "RFC 3986: URI Generic Syntax"
      url: https://www.rfc-editor.org/rfc/rfc3986.html
      verifiedOn: 2026-10-20
  - id: url-term
    term: URL
    aka:
      - Uniform Resource Locator
    definition: A URI that also gives a way to locate the resource, such as an https:// address.
    see: resources-and-uris
    source:
      title: "RFC 3986: URI Generic Syntax"
      url: https://www.rfc-editor.org/rfc/rfc3986.html
      verifiedOn: 2026-10-20
  - id: urn-term
    term: URN
    aka:
      - Uniform Resource Name
    definition: "A URI in the urn: scheme, meant to stay globally unique and persistent."
    see: resources-and-uris
    source:
      title: "RFC 3986: URI Generic Syntax"
      url: https://www.rfc-editor.org/rfc/rfc3986.html
      verifiedOn: 2026-10-20
  - id: api-endpoint
    term: API endpoint
    aka:
      - REST endpoint
    definition: One operation of an API, named by an HTTP method plus a path, such as POST /api/payments.
    see: resources-and-uris
    source:
      title: "Payment Intents API reference: endpoints (Stripe)"
      url: https://docs.stripe.com/api/payment_intents
      verifiedOn: 2026-10-20
  - id: path-parameter-term
    term: Path parameter
    aka:
      - path variable
      - URI template variable
    definition: A value inside the URL path that identifies the resource, like PAY101 in /payments/PAY101.
    see: resources-and-uris
    source:
      title: "Mapping Requests: URI patterns (Spring Framework 7.0)"
      url: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html
      verifiedOn: 2026-10-20
  - id: query-parameter-term
    term: Query parameter
    aka:
      - query string parameter
    definition: A key=value pair after ? in the URL, used to filter, sort, page or tune the result.
    see: resources-and-uris
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: request-line
    term: Request line
    definition: "First line of an HTTP/1.1 request: method, request target and HTTP version."
    see: http-request-response
    source:
      title: "RFC 9112: HTTP/1.1"
      url: https://www.rfc-editor.org/rfc/rfc9112.html
      verifiedOn: 2026-10-20
  - id: status-line
    term: Status line
    definition: "First line of an HTTP/1.1 response: HTTP version, three-digit status code and optional reason phrase."
    see: http-request-response
    source:
      title: "RFC 9112: HTTP/1.1"
      url: https://www.rfc-editor.org/rfc/rfc9112.html
      verifiedOn: 2026-10-20
  - id: http-1-1
    term: HTTP/1.1
    definition: Text-based HTTP over TCP, with persistent connections by default; now defined in RFC 9112 (2022).
    see: http-request-response
    source:
      title: "RFC 9112: HTTP/1.1"
      url: https://www.rfc-editor.org/rfc/rfc9112.html
      verifiedOn: 2026-10-20
  - id: http-2
    term: HTTP/2
    definition: Binary HTTP that multiplexes many requests on one TCP connection and compresses headers with HPACK (RFC 9113).
    see: http-request-response
    source:
      title: "RFC 9113: HTTP/2"
      url: https://www.rfc-editor.org/rfc/rfc9113.html
      verifiedOn: 2026-10-20
  - id: http-3
    term: HTTP/3
    definition: HTTP mapped onto QUIC instead of TCP, so packet loss on one stream does not stall others (RFC 9114).
    see: http-request-response
    source:
      title: "RFC 9114: HTTP/3"
      url: https://www.rfc-editor.org/rfc/rfc9114.html
      verifiedOn: 2026-10-20
  - id: quic
    term: QUIC
    definition: A secure, multiplexed transport protocol that runs over UDP; the base of HTTP/3 (RFC 9000, 2021).
    see: http-request-response
    source:
      title: "RFC 9000: QUIC"
      url: https://www.rfc-editor.org/rfc/rfc9000.html
      verifiedOn: 2026-10-20
  - id: multiplexing-http
    term: Multiplexing (HTTP/2)
    aka:
      - stream multiplexing
      - request multiplexing
    definition: Running many request-response exchanges at once on one connection, each on its own stream.
    see: http-request-response
    source:
      title: "RFC 9113: HTTP/2"
      url: https://www.rfc-editor.org/rfc/rfc9113.html
      verifiedOn: 2026-10-20
  - id: json-term
    term: JSON
    aka:
      - JavaScript Object Notation
    definition: A light, text-based, language-independent data format; media type application/json, UTF-8 between systems (RFC 8259).
    see: http-request-response
    source:
      title: "RFC 8259: The JSON Data Interchange Format"
      url: https://www.rfc-editor.org/rfc/rfc8259.html
      verifiedOn: 2026-10-20
  - id: session-state
    term: Session state
    aka:
      - application state
      - conversational state
    definition: What the server would remember about a client between requests; in REST the client keeps it.
    see: statelessness
    source:
      title: "Chapter 5: Representational State Transfer (Roy Fielding's dissertation, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: stateless-api
    term: Stateless API
    aka:
      - stateless REST API
      - stateless request
    definition: An API where each request carries all it needs and the server keeps no session between requests.
    see: statelessness
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: richardson-maturity-model
    term: Richardson Maturity Model
    aka:
      - RMM
      - REST maturity model
    definition: "Leonard Richardson's four levels of REST use: one endpoint, resources, HTTP verbs, hypermedia."
    see: richardson-maturity-hateoas
    source:
      title: Richardson Maturity Model (Martin Fowler, 2010)
      url: https://martinfowler.com/articles/richardsonMaturityModel.html
      verifiedOn: 2026-10-20
  - id: hateoas
    term: HATEOAS
    aka:
      - Hypermedia as the Engine of Application State
      - hypertext as the engine of application state
    definition: REST rule that responses carry links telling the client what it can do next.
    see: richardson-maturity-hateoas
    source:
      title: "Chapter 5: Representational State Transfer (Roy Fielding's dissertation, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: hypermedia
    term: Hypermedia
    aka:
      - hypermedia controls
      - hypertext
    definition: Data that contains links and controls a client can follow, such as links in a JSON response.
    see: richardson-maturity-hateoas
    source:
      title: REST APIs must be hypertext-driven (Roy Fielding, 2008)
      url: https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven
      verifiedOn: 2026-10-20
  - id: hal-term
    term: HAL
    aka:
      - Hypertext Application Language
      - application/hal+json
    definition: A JSON link format with _links and _embedded; media type application/hal+json; an expired IETF draft.
    see: richardson-maturity-hateoas
    source:
      title: JSON Hypertext Application Language (draft-kelly-json-hal-11)
      url: https://datatracker.ietf.org/doc/draft-kelly-json-hal/
      verifiedOn: 2026-10-20
  - id: link-relation
    term: Link relation
    aka:
      - link relation type
    definition: A name, such as next or self, that says how a link's target relates to the current resource (RFC 8288).
    see: richardson-maturity-hateoas
    source:
      title: "RFC 8288: Web Linking"
      url: https://www.rfc-editor.org/rfc/rfc8288.html
      verifiedOn: 2026-10-20
  - id: idempotent-method
    term: Idempotent method
    aka:
      - idempotent methods
    definition: "A method where many identical requests have the same intended effect as one: PUT, DELETE and the safe methods."
    see: http-methods
    source:
      title: RFC 9110 HTTP Semantics, 9.2.2 Idempotent Methods
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.2
      verifiedOn: 2026-10-20
  - id: safe-method
    term: Safe method
    aka:
      - safe methods
    definition: "A method with read-only intent: the client asks for no state change. GET, HEAD, OPTIONS and TRACE."
    see: http-methods
    source:
      title: RFC 9110 HTTP Semantics, 9.2.1 Safe Methods
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.1
      verifiedOn: 2026-10-20
  - id: query-method
    term: QUERY method
    aka:
      - QUERY request
    definition: An HTTP method (RFC 10008, June 2026) for a safe, idempotent query whose input travels in the request body.
    see: http-methods
    source:
      title: RFC 10008 The HTTP QUERY Method
      url: https://www.rfc-editor.org/rfc/rfc10008.html
      verifiedOn: 2026-10-20
  - id: json-patch
    term: JSON Patch
    aka:
      - application/json-patch+json
    definition: "A PATCH body format (RFC 6902): an ordered list of operations such as add, remove and replace."
    see: http-methods
    source:
      title: RFC 6902 JavaScript Object Notation (JSON) Patch
      url: https://www.rfc-editor.org/rfc/rfc6902.html
      verifiedOn: 2026-10-20
  - id: json-merge-patch
    term: JSON Merge Patch
    aka:
      - merge patch
      - application/merge-patch+json
    definition: "A PATCH body format (RFC 7396) that looks like the target: changed fields only, null removes a field."
    see: http-methods
    source:
      title: RFC 7396 JSON Merge Patch
      url: https://www.rfc-editor.org/rfc/rfc7396.html
      verifiedOn: 2026-10-20
  - id: 201-created
    term: 201 Created
    aka: []
    definition: "Success: a new resource was created; the Location header usually gives its URL."
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.3.2 201 Created
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.3.2
      verifiedOn: 2026-10-20
  - id: 401-unauthorized
    term: 401 Unauthorized
    aka: []
    definition: The request lacks valid credentials; the reply must include a WWW-Authenticate challenge.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.5.2 401 Unauthorized
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.2
      verifiedOn: 2026-10-20
  - id: 403-forbidden
    term: 403 Forbidden
    aka: []
    definition: The server understood the request but refuses it; repeating it with the same credentials will not help.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.5.4 403 Forbidden
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.4
      verifiedOn: 2026-10-20
  - id: 405-method-not-allowed
    term: 405 Method Not Allowed
    aka: []
    definition: The resource does not support this method; the reply must list allowed methods in an Allow header.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.5.6 405 Method Not Allowed
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.6
      verifiedOn: 2026-10-20
  - id: 406-not-acceptable
    term: 406 Not Acceptable
    aka: []
    definition: The server has no representation matching the client's Accept headers and will not send a default.
    see: headers-content-negotiation
    source:
      title: RFC 9110 HTTP Semantics, 15.5.7 406 Not Acceptable
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.7
      verifiedOn: 2026-10-20
  - id: 409-conflict
    term: 409 Conflict
    aka: []
    definition: The request conflicts with the resource's current state; the client may fix it and resend.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.5.10 409 Conflict
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.10
      verifiedOn: 2026-10-20
  - id: 415-unsupported-media-type
    term: 415 Unsupported Media Type
    aka: []
    definition: The server refuses the request body's format, for example XML sent to a JSON-only endpoint.
    see: headers-content-negotiation
    source:
      title: RFC 9110 HTTP Semantics, 15.5.16 415 Unsupported Media Type
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.16
      verifiedOn: 2026-10-20
  - id: 422-unprocessable-content
    term: 422 Unprocessable Content
    aka:
      - 422 Unprocessable Entity
    definition: The body's type and syntax are fine, but its content cannot be processed, such as a negative amount.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.5.21 422 Unprocessable Content
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.21
      verifiedOn: 2026-10-20
  - id: 500-internal-server-error
    term: 500 Internal Server Error
    aka: []
    definition: An unexpected condition on the server stopped it from completing the request.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.6.1 500 Internal Server Error
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.1
      verifiedOn: 2026-10-20
  - id: 502-bad-gateway
    term: 502 Bad Gateway
    aka: []
    definition: A gateway or proxy got an invalid response from the upstream server it called.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.6.3 502 Bad Gateway
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.3
      verifiedOn: 2026-10-20
  - id: 503-service-unavailable
    term: 503 Service Unavailable
    aka: []
    definition: The server is temporarily overloaded or in maintenance; it may send Retry-After.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.6.4 503 Service Unavailable
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.4
      verifiedOn: 2026-10-20
  - id: 504-gateway-timeout
    term: 504 Gateway Timeout
    aka: []
    definition: A gateway or proxy did not get a timely response from the upstream server.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 15.6.5 504 Gateway Timeout
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.5
      verifiedOn: 2026-10-20
  - id: www-authenticate
    term: WWW-Authenticate
    aka: []
    definition: Response header in a 401 that names the authentication scheme and parameters the client should use.
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 11.6.1 WWW-Authenticate
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-11.6.1
      verifiedOn: 2026-10-20
  - id: content-type-header
    term: Content-Type
    aka: []
    definition: Header giving the media type of the body, such as application/json; charset=utf-8.
    see: headers-content-negotiation
    source:
      title: RFC 9110 HTTP Semantics, 8.3 Content-Type
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-8.3
      verifiedOn: 2026-10-20
  - id: accept-header
    term: Accept (header)
    aka:
      - Accept header
    definition: Request header listing the response media types the client can use, ranked with q weights.
    see: headers-content-negotiation
    source:
      title: RFC 9110 HTTP Semantics, 12.5.1 Accept
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-12.5.1
      verifiedOn: 2026-10-20
  - id: location-header
    term: Location (header)
    aka:
      - Location header
    definition: Response header with the URL of a newly created resource (201) or a redirect target (3xx).
    see: status-codes
    source:
      title: RFC 9110 HTTP Semantics, 10.2.2 Location
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.2
      verifiedOn: 2026-10-20
  - id: content-negotiation
    term: Content negotiation
    aka: []
    definition: Choosing the best representation, such as JSON or XML, from the client's Accept preferences.
    see: headers-content-negotiation
    source:
      title: RFC 9110 HTTP Semantics, 12 Content Negotiation
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-12
      verifiedOn: 2026-10-20
  - id: cache-control
    term: Cache-Control
    aka: []
    definition: Header whose directives say whether and how long caches may store and reuse a response.
    see: http-caching
    source:
      title: RFC 9111 HTTP Caching, 5.2 Cache-Control
      url: https://www.rfc-editor.org/rfc/rfc9111.html#section-5.2
      verifiedOn: 2026-10-20
  - id: no-cache
    term: no-cache
    aka: []
    definition: "Cache-Control directive: a cache may store the response but must revalidate it before each reuse."
    see: http-caching
    source:
      title: RFC 9111 HTTP Caching, 5.2.2.4 no-cache
      url: https://www.rfc-editor.org/rfc/rfc9111.html#section-5.2.2.4
      verifiedOn: 2026-10-20
  - id: no-store
    term: no-store
    aka: []
    definition: "Cache-Control directive: no cache may store any part of the request or response."
    see: http-caching
    source:
      title: RFC 9111 HTTP Caching, 5.2.2.5 no-store
      url: https://www.rfc-editor.org/rfc/rfc9111.html#section-5.2.2.5
      verifiedOn: 2026-10-20
  - id: etag
    term: ETag
    aka:
      - entity tag
    definition: Response header with an opaque tag for one version of a representation, used to check for changes.
    see: http-caching
    source:
      title: RFC 9110 HTTP Semantics, 8.8.3 ETag
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-8.8.3
      verifiedOn: 2026-10-20
  - id: 304-not-modified
    term: 304 Not Modified
    aka: []
    definition: "Reply to a conditional GET or HEAD: nothing changed, so reuse the stored copy; no body is sent."
    see: http-caching
    source:
      title: RFC 9110 HTTP Semantics, 15.4.5 304 Not Modified
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.4.5
      verifiedOn: 2026-10-20
  - id: if-none-match
    term: If-None-Match
    aka: []
    definition: Request header with the ETags the client holds; the server answers 304 if one still matches.
    see: http-caching
    source:
      title: RFC 9110 HTTP Semantics, 13.1.2 If-None-Match
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.2
      verifiedOn: 2026-10-20
  - id: if-match
    term: If-Match
    aka: []
    definition: Request header that applies the method only if the current ETag matches one listed.
    see: conditional-requests
    source:
      title: RFC 9110 HTTP Semantics, 13.1.1 If-Match
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-13.1.1
      verifiedOn: 2026-10-20
  - id: 412-precondition-failed
    term: 412 Precondition Failed
    aka: []
    definition: A condition in the request headers, such as If-Match, was false, so the method was not applied.
    see: conditional-requests
    source:
      title: RFC 9110 HTTP Semantics, 15.5.13 412 Precondition Failed
      url: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.5.13
      verifiedOn: 2026-10-20
  - id: lost-update
    term: Lost update
    aka:
      - lost update problem
    definition: Two clients read the same state and both write; the later write silently erases the earlier one.
    see: conditional-requests
    source:
      title: RFC 6585 Additional HTTP Status Codes, 3. 428 Precondition Required
      url: https://www.rfc-editor.org/rfc/rfc6585.html#section-3
      verifiedOn: 2026-10-20
  - id: optimistic-concurrency
    term: Optimistic concurrency
    aka:
      - optimistic locking
    definition: Hold no lock; each update checks a version read earlier and fails if it changed meanwhile.
    see: conditional-requests
    source:
      title: Annotation Interface Version (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/Version.html
      verifiedOn: 2026-10-20
  - id: nested-resource
    term: Nested resource
    aka:
      - sub-resource
      - sub-collection
    definition: A collection reached through its parent, like /users/10/payments; keep it to one level.
    see: url-design-rules
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: custom-method
    term: Custom method (action)
    aka:
      - controller resource
      - action endpoint
      - custom methods
    definition: A POST on a resource for an action no standard method covers, like POST /payments/PAY101:cancel.
    see: url-design-rules
    source:
      title: "AIP-136: Custom methods (Google AIP)"
      url: https://google.aip.dev/136
      verifiedOn: 2026-10-20
  - id: kebab-case
    term: kebab-case
    aka:
      - kebab-casing
    definition: Lower-case words joined by hyphens, like /payment-methods; Microsoft's preferred style for URL paths.
    see: url-design-rules
    source:
      title: Microsoft Azure REST API Guidelines
      url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
      verifiedOn: 2026-10-20
  - id: offset-pagination-term
    term: Offset pagination
    aka:
      - offset paging
      - page-based pagination
      - limit-offset pagination
    definition: "Paging by skipping rows: ?page=2&size=20 or ?offset=40&limit=20."
    see: pagination-filtering-sorting
    source:
      title: Evolving API Pagination at Slack (Slack Engineering)
      url: https://slack.engineering/evolving-api-pagination-at-slack/
      verifiedOn: 2026-10-20
  - id: cursor-pagination-term
    term: Cursor pagination
    aka:
      - cursor-based pagination
      - cursor paging
      - token pagination
    definition: Paging with an opaque marker of where the last page ended; the server returns the next one.
    see: pagination-filtering-sorting
    source:
      title: Evolving API Pagination at Slack (Slack Engineering)
      url: https://slack.engineering/evolving-api-pagination-at-slack/
      verifiedOn: 2026-10-20
  - id: keyset-pagination-term
    term: Keyset pagination
    aka:
      - seek pagination
    definition: Cursor paging that filters on the last row's sort key, like WHERE id < 101, using the index.
    see: pagination-filtering-sorting
    source:
      title: Evolving API Pagination at Slack (Slack Engineering)
      url: https://slack.engineering/evolving-api-pagination-at-slack/
      verifiedOn: 2026-10-20
  - id: page-size
    term: Page size
    aka:
      - page_size
      - max page size
    definition: How many items one page holds; the API documents a default and a maximum.
    see: pagination-filtering-sorting
    source:
      title: "AIP-158: Pagination (Google AIP)"
      url: https://google.aip.dev/158
      verifiedOn: 2026-10-20
  - id: link-header
    term: Link header
    aka:
      - Link response header
    definition: A header carrying typed links, like <url>; rel="next" (RFC 8288).
    see: pagination-filtering-sorting
    source:
      title: "RFC 8288: Web Linking"
      url: https://www.rfc-editor.org/rfc/rfc8288.html
      verifiedOn: 2026-10-20
  - id: rel-next
    term: rel=next
    aka:
      - rel="next"
    definition: Registered link relation that points to the next item in a series, such as the next page.
    see: pagination-filtering-sorting
    source:
      title: IANA Link Relations registry
      url: https://www.iana.org/assignments/link-relations/link-relations.xhtml
      verifiedOn: 2026-10-20
  - id: filter-parameter
    term: Filtering (query)
    aka:
      - filter parameter
      - filter parameters
    definition: Query parameters that narrow a list, like ?status=SUCCESS.
    see: pagination-filtering-sorting
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: sort-parameter
    term: Sorting (query)
    aka:
      - sort parameter
    definition: A query parameter that orders a list, like ?sort=createdAt,desc in Spring Data style.
    see: pagination-filtering-sorting
    source:
      title: "Spring Data Commons: Web support, Pageable and Sort parameters"
      url: https://docs.spring.io/spring-data/commons/reference/repositories/core-extensions.html
      verifiedOn: 2026-10-20
  - id: sparse-fieldset
    term: Sparse fieldset
    aka:
      - sparse fieldsets
      - field selection
    definition: Asking for only some fields, like ?fields=id,status; the JSON:API name for it.
    see: pagination-filtering-sorting
    source:
      title: JSON:API v1.1 specification
      url: https://jsonapi.org/format/
      verifiedOn: 2026-10-20
  - id: uri-versioning-term
    term: URI versioning
    aka:
      - path versioning
    definition: Putting the API version in the path, like /api/v2/payments.
    see: api-versioning
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: header-versioning-term
    term: Header versioning
    aka: []
    definition: "Sending the API version in a request header, like API-Version: 2, keeping one URI per resource."
    see: api-versioning
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: media-type-versioning-term
    term: Media type versioning
    aka:
      - Accept header versioning
    definition: Asking for a version through Accept, like application/vnd.shop.v2+json.
    see: api-versioning
    source:
      title: Web API design best practices (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: query-versioning-term
    term: Query string versioning
    aka:
      - query parameter versioning
    definition: Sending the version as a query parameter, like ?api-version=2021-06-04.
    see: api-versioning
    source:
      title: Microsoft Azure REST API Guidelines
      url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
      verifiedOn: 2026-10-20
  - id: breaking-change
    term: Breaking change
    aka:
      - breaking changes
    definition: A change that forces existing clients to change their code to keep working.
    see: api-versioning
    source:
      title: "Microsoft Graph REST API guidelines: breaking changes"
      url: https://github.com/microsoft/api-guidelines/blob/vNext/graph/GuidelinesGraph.md
      verifiedOn: 2026-10-20
  - id: backward-compatibility
    term: Backward compatibility
    aka:
      - backwards compatibility
      - backward compatible
      - backwards compatible
    definition: Old clients keep working, unchanged, against the newer server.
    see: api-versioning
    source:
      title: "AIP-180: Backwards compatibility (Google AIP)"
      url: https://google.aip.dev/180
      verifiedOn: 2026-10-20
  - id: tolerant-reader-term
    term: Tolerant reader
    aka: []
    definition: A client that reads only the fields it needs and ignores the rest, so additions do not break it.
    see: api-versioning
    source:
      title: TolerantReader (Martin Fowler)
      url: https://martinfowler.com/bliki/TolerantReader.html
      verifiedOn: 2026-10-20
  - id: deprecation-header-term
    term: Deprecation header
    aka:
      - Deprecation response header
    definition: RFC 9745 header giving the date a resource was or will be deprecated.
    see: api-versioning
    source:
      title: "RFC 9745: The Deprecation HTTP Response Header Field"
      url: https://www.rfc-editor.org/rfc/rfc9745.html
      verifiedOn: 2026-10-20
  - id: sunset-header-term
    term: Sunset header
    aka:
      - Sunset response header
    definition: RFC 8594 header giving the date a resource is expected to stop responding.
    see: api-versioning
    source:
      title: "RFC 8594: The Sunset HTTP Header Field"
      url: https://www.rfc-editor.org/rfc/rfc8594.html
      verifiedOn: 2026-10-20
  - id: problem-details
    term: Problem details
    aka:
      - RFC 9457
      - RFC 7807
      - application/problem+json
    definition: "RFC 9457 error format: type, title, status, detail, instance, plus extensions."
    see: error-responses
    source:
      title: "RFC 9457: Problem Details for HTTP APIs"
      url: https://www.rfc-editor.org/rfc/rfc9457.html
      verifiedOn: 2026-10-20
  - id: error-code-term
    term: Error code (API)
    aka:
      - errorCode
      - machine-readable error code
    definition: A stable string, like PAYMENT_INVALID_AMOUNT, that client code compares; part of the API contract.
    see: error-responses
    source:
      title: Microsoft Azure REST API Guidelines
      url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
      verifiedOn: 2026-10-20
  - id: long-running-operation
    term: Long-running operation
    aka:
      - LRO
      - long-running operations
    definition: Work that outlasts one HTTP call; the API accepts it and reports progress separately.
    see: long-running-operations
    source:
      title: Microsoft Azure REST API Guidelines
      url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
      verifiedOn: 2026-10-20
  - id: status-resource
    term: Status resource
    aka:
      - status monitor
      - status endpoint
    definition: A URL the client polls for a job's state and, at the end, its result.
    see: long-running-operations
    source:
      title: Asynchronous Request-Reply pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/async-request-reply
      verifiedOn: 2026-10-20
  - id: status-polling
    term: Status polling
    aka:
      - HTTP polling
    definition: The client repeats GET on a status URL until the job reaches a final state.
    see: long-running-operations
    source:
      title: Asynchronous Request-Reply pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/async-request-reply
      verifiedOn: 2026-10-20
  - id: http-202-accepted
    term: 202 Accepted
    aka:
      - HTTP 202
    definition: Request accepted for processing but not finished; it may still fail (RFC 9110).
    see: long-running-operations
    source:
      title: "RFC 9110: HTTP Semantics"
      url: https://www.rfc-editor.org/rfc/rfc9110.html
      verifiedOn: 2026-10-20
  - id: http-303-see-other
    term: 303 See Other
    aka:
      - HTTP 303
    definition: Redirect telling the client to GET another URL, such as a finished job's result.
    see: long-running-operations
    source:
      title: "RFC 9110: HTTP Semantics"
      url: https://www.rfc-editor.org/rfc/rfc9110.html
      verifiedOn: 2026-10-20
  - id: asynchronous-request-reply
    term: Asynchronous request-reply
    aka:
      - async request-reply
    definition: "Pattern: answer 202 with a status URL, the client polls, then it is sent to the result."
    see: long-running-operations
    source:
      title: Asynchronous Request-Reply pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/async-request-reply
      verifiedOn: 2026-10-20
  - id: synchronous-api
    term: Synchronous API
    aka:
      - synchronous request-reply
    definition: The client waits on the same call until the work is done and the result returns.
    see: long-running-operations
    source:
      title: Asynchronous Request-Reply pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/async-request-reply
      verifiedOn: 2026-10-20
  - id: authentication-term
    term: Authentication
    definition: Proving who the caller is, for example with a password, an API key or a token.
    see: authentication-methods
    source:
      title: "RFC 9110 HTTP Semantics: 11. HTTP Authentication"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-11
      verifiedOn: 2026-10-20
  - id: authorisation-term
    term: Authorisation
    definition: Deciding what an authenticated caller may do; a refusal is 403 Forbidden.
    see: authentication-methods
    source:
      title: "RFC 9110 HTTP Semantics: 11. HTTP Authentication"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-11
      verifiedOn: 2026-10-20
  - id: basic-authentication
    term: Basic authentication
    aka:
      - Basic auth
    definition: Sends user:password in Base64 in the Authorization header; safe only over TLS.
    see: authentication-methods
    source:
      title: RFC 7617 The 'Basic' HTTP Authentication Scheme
      url: https://www.rfc-editor.org/rfc/rfc7617
      verifiedOn: 2026-10-20
  - id: api-key
    term: API key
    aka:
      - API keys
    definition: A secret string that ties a call to an app or project for quotas and billing; it does not identify a person.
    see: authentication-methods
    source:
      title: API keys overview (Google Cloud authentication docs)
      url: https://cloud.google.com/docs/authentication/api-keys
      verifiedOn: 2026-10-20
  - id: bearer-token
    term: Bearer token
    aka:
      - bearer tokens
    definition: "A token that works for whoever holds it, sent as Authorization: Bearer <token>."
    see: authentication-methods
    source:
      title: RFC 6750 OAuth 2.0 Bearer Token Usage
      url: https://www.rfc-editor.org/rfc/rfc6750
      verifiedOn: 2026-10-20
  - id: secret-management
    term: Secret management
    aka:
      - secret manager
      - secrets manager
    definition: Keeping keys and passwords in a central store with access control, audit and rotation, not in code.
    see: authentication-methods
    source:
      title: Secrets Management Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: session-cookie
    term: Session cookie
    aka:
      - session ID cookie
    definition: A cookie holding a random session ID; the server keeps the session data and can end it at once.
    see: authentication-methods
    source:
      title: Session Management Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: jwt-term
    term: JWT
    aka:
      - JSON Web Token
      - JWTs
    definition: "A compact token of JSON claims, in three Base64url parts: header.payload.signature."
    see: jwt
    source:
      title: RFC 7519 JSON Web Token (JWT)
      url: https://www.rfc-editor.org/rfc/rfc7519
      verifiedOn: 2026-10-20
  - id: jwt-claim
    term: JWT claim
    aka:
      - registered claims
      - JWT claims
    definition: A name-value fact in a JWT; registered ones are iss, sub, aud, exp, nbf, iat and jti.
    see: jwt
    source:
      title: RFC 7519 JSON Web Token (JWT)
      url: https://www.rfc-editor.org/rfc/rfc7519
      verifiedOn: 2026-10-20
  - id: exp-claim
    term: exp
    aka:
      - exp claim
    definition: The JWT expiry time; after it the token must be rejected.
    see: jwt
    source:
      title: RFC 7519 JSON Web Token (JWT)
      url: https://www.rfc-editor.org/rfc/rfc7519
      verifiedOn: 2026-10-20
  - id: aud-claim
    term: aud
    aka:
      - aud claim
    definition: "The JWT audience: which APIs the token is meant for; others must reject it."
    see: jwt
    source:
      title: "RFC 8725 JSON Web Token Best Current Practices: 3.9"
      url: https://www.rfc-editor.org/rfc/rfc8725#section-3.9
      verifiedOn: 2026-10-20
  - id: alg-none-attack
    term: alg none attack
    aka:
      - none algorithm
    definition: An attacker sets the JWT alg header to none so a careless library skips the signature check.
    see: jwt
    source:
      title: "RFC 8725 JSON Web Token Best Current Practices: 2.1"
      url: https://www.rfc-editor.org/rfc/rfc8725#section-2.1
      verifiedOn: 2026-10-20
  - id: oauth2
    term: OAuth 2.0
    aka:
      - OAuth2
      - OAuth
    definition: A framework that lets an app get a limited access token to an API instead of the user's password.
    see: oauth2-and-oidc
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: access-token
    term: Access token
    aka:
      - access tokens
    definition: A short-lived credential the client sends to the API (resource server) to call it.
    see: oauth2-and-oidc
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: refresh-token
    term: Refresh token
    aka:
      - refresh tokens
    definition: A longer-lived credential sent only to the authorization server to get a new access token.
    see: oauth2-and-oidc
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: id-token
    term: ID token
    aka:
      - ID tokens
    definition: An OpenID Connect JWT telling the client app who logged in; its audience is that app.
    see: oauth2-and-oidc
    source:
      title: OpenID Connect Core 1.0
      url: https://openid.net/specs/openid-connect-core-1_0.html
      verifiedOn: 2026-10-20
  - id: oauth-scope
    term: Scope (OAuth)
    aka:
      - OAuth scope
      - OAuth scopes
    definition: A named permission on an access token, such as payments:read, limiting what it may do.
    see: oauth2-and-oidc
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: pkce
    term: PKCE
    aka:
      - Proof Key for Code Exchange
    definition: A one-time secret the app proves when trading the authorization code, so a stolen code is useless.
    see: oauth2-and-oidc
    source:
      title: RFC 7636 Proof Key for Code Exchange (PKCE)
      url: https://www.rfc-editor.org/rfc/rfc7636
      verifiedOn: 2026-10-20
  - id: client-credentials-grant
    term: Client credentials grant
    aka:
      - client credentials flow
    definition: An OAuth grant where a service gets a token for itself, with no user involved.
    see: oauth2-and-oidc
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: openid-connect
    term: OpenID Connect
    aka:
      - OIDC
    definition: An identity layer on OAuth 2.0 that adds an ID token about the user's login.
    see: oauth2-and-oidc
    source:
      title: OpenID Connect Core 1.0
      url: https://openid.net/specs/openid-connect-core-1_0.html
      verifiedOn: 2026-10-20
  - id: same-origin-policy
    term: Same-origin policy
    aka:
      - same origin policy
    definition: "Browser rule: a page may read responses only from its own origin (same scheme, host and port)."
    see: cors
    source:
      title: Same-origin policy (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
      verifiedOn: 2026-10-20
  - id: cors-term
    term: CORS
    aka:
      - Cross-Origin Resource Sharing
    definition: Response headers that tell the browser which other origins may read the API's responses.
    see: cors
    source:
      title: Cross-Origin Resource Sharing (CORS) (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
      verifiedOn: 2026-10-20
  - id: preflight-request
    term: Preflight request
    aka:
      - preflight requests
      - CORS preflight
    definition: An OPTIONS request the browser sends first to ask whether the real cross-origin request is allowed.
    see: cors
    source:
      title: Cross-Origin Resource Sharing (CORS) (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
      verifiedOn: 2026-10-20
  - id: csrf
    term: CSRF
    aka:
      - cross-site request forgery
    definition: An attack where another site makes the victim's browser send a request carrying the victim's cookies.
    see: cors
    source:
      title: Cross Site Request Forgery (Spring Security 7.1 reference)
      url: https://docs.spring.io/spring-security/reference/features/exploits/csrf.html
      verifiedOn: 2026-10-20
  - id: tls
    term: TLS
    aka:
      - Transport Layer Security
    definition: The protocol under HTTPS that encrypts traffic, detects tampering and proves the server's identity.
    see: https-tls
    source:
      title: RFC 8446 TLS 1.3
      url: https://www.rfc-editor.org/rfc/rfc8446
      verifiedOn: 2026-10-20
  - id: hsts
    term: HSTS
    aka:
      - Strict-Transport-Security
    definition: A response header telling browsers to use only HTTPS for the site for a set time.
    see: https-tls
    source:
      title: RFC 6797 HTTP Strict Transport Security (HSTS)
      url: https://www.rfc-editor.org/rfc/rfc6797
      verifiedOn: 2026-10-20
  - id: mtls
    term: mTLS
    aka:
      - mutual TLS
    definition: TLS where the client also presents a certificate, so both sides prove who they are.
    see: https-tls
    source:
      title: RFC 8705 OAuth 2.0 Mutual-TLS Client Authentication
      url: https://www.rfc-editor.org/rfc/rfc8705
      verifiedOn: 2026-10-20
  - id: rate-limiting-term
    term: Rate limiting
    aka:
      - rate limit
      - rate limits
      - throttling
    definition: Capping how many requests a caller may make in a time window; extra calls get 429.
    see: rate-limiting
    source:
      title: "RFC 6585 Additional HTTP Status Codes: 429"
      url: https://www.rfc-editor.org/rfc/rfc6585#section-4
      verifiedOn: 2026-10-20
  - id: token-bucket
    term: Token bucket
    aka:
      - token bucket algorithm
    definition: "Rate-limit algorithm: each request takes a token, tokens refill steadily, an empty bucket rejects."
    see: rate-limiting
    source:
      title: Throttle requests to your REST APIs (Amazon API Gateway docs)
      url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
      verifiedOn: 2026-10-20
  - id: ratelimit-header-fields
    term: RateLimit header fields
    aka:
      - RateLimit-Policy
    definition: Proposed RateLimit and RateLimit-Policy headers announcing quotas; an IETF draft, not an RFC (October 2026).
    see: rate-limiting
    source:
      title: RateLimit header fields for HTTP (IETF draft-ietf-httpapi-ratelimit-headers-11)
      url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/
      verifiedOn: 2026-10-20
  - id: owasp-api-top-10
    term: OWASP API Security Top 10
    aka:
      - OWASP API Top 10
    definition: OWASP's list of the ten biggest API risks; the 2023 edition is the latest.
    see: owasp-api-security
    source:
      title: OWASP API Security Top 10 2023
      url: https://api-security.owasp.org/editions/2023/en/0x11-t10
      verifiedOn: 2026-10-20
  - id: bola
    term: BOLA
    aka:
      - Broken Object Level Authorization
      - IDOR
    definition: "API1:2023: the API returns or changes an object by ID without checking the caller may access it."
    see: owasp-api-security
    source:
      title: OWASP API Security Top 10 2023
      url: https://api-security.owasp.org/editions/2023/en/0x11-t10
      verifiedOn: 2026-10-20
  - id: bopla
    term: BOPLA
    aka:
      - Broken Object Property Level Authorization
    definition: "API3:2023: the caller can read or change fields of an object it should not."
    see: owasp-api-security
    source:
      title: API3:2023 Broken Object Property Level Authorization (OWASP)
      url: https://api-security.owasp.org/editions/2023/en/0xa3-broken-object-property-level-authorization
      verifiedOn: 2026-10-20
  - id: mass-assignment
    term: Mass assignment
    definition: Binding request JSON straight onto an internal object, so a caller can set fields like status.
    see: owasp-api-security
    source:
      title: API3:2023 Broken Object Property Level Authorization (OWASP)
      url: https://api-security.owasp.org/editions/2023/en/0xa3-broken-object-property-level-authorization
      verifiedOn: 2026-10-20
  - id: bfla
    term: BFLA
    aka:
      - Broken Function Level Authorization
    definition: "API5:2023: a normal caller can use a function meant for admins or other roles."
    see: owasp-api-security
