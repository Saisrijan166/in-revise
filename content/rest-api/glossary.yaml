    source:
      title: Idempotent Consumer pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/idempotent-consumer
      verifiedOn: 2026-10-20
  - id: at-least-once-delivery
    term: At-least-once delivery
    aka:
      - at-least-once
    definition: Every message arrives, but some may arrive more than once.
