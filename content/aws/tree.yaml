topics:
  basics:
    - id: cloud-computing-models
      children:
        - id: iaas-model
          label: IaaS
          note: Rent virtual servers, storage and network; you run the OS up
        - id: paas-model
          label: PaaS
          note: Upload code; the platform provisions, balances and scales it
        - id: saas-model
          label: SaaS
          note: A finished app run by the vendor; you bring data and users
        - id: cloud-deployment-models
          label: Deployment models
          note: "Where the app runs: cloud, hybrid or on-premises"
          children:
            - id: all-in-cloud-deployment
              label: Cloud
              note: Every part of the application runs in the cloud
            - id: hybrid-deployment
              label: Hybrid
              note: Cloud resources connected to systems outside it, often on-premises
            - id: on-premises-deployment
              label: On-premises (private cloud)
              note: Own data centre with virtualisation; few cloud benefits
    - id: regions-and-azs
      children:
        - id: aws-region-node
          label: AWS Region
          note: Isolated area, such as ap-south-1 (Mumbai) or ap-south-2 (Hyderabad)
          children:
            - id: opt-in-region
              label: Opt-in Region
              note: Regions launched after 20-03-2019 must be enabled first
        - id: availability-zone-node
          label: Availability Zone
          note: Code like ap-south-1a; an AZ ID names the same place in every account
        - id: local-zone-node
          label: Local Zone
          note: Extension of a Region near a big city, for low latency
        - id: wavelength-zone-node
          label: Wavelength Zone
          note: AWS compute and storage at the edge of carriers' 5G networks
        - id: edge-location-node
          label: Edge location
          note: CloudFront serves cached content from the lowest-latency one
        - id: outposts-node
          label: AWS Outposts
          note: AWS-managed infrastructure in your own data centre
    - id: shared-responsibility-model
      children:
        - id: security-of-the-cloud
          label: Security of the cloud (AWS)
          note: Hardware, software, network and facilities that run AWS
        - id: security-in-the-cloud
          label: Security in the cloud (you)
          note: Data, IAM, guest OS, apps, firewall settings; varies by service
        - id: inherited-controls
          label: Inherited controls
          note: Fully AWS's, such as physical and environmental controls
        - id: shared-controls
          label: Shared controls
          note: "Patching, configuration, training: each side for its own layer"
        - id: customer-specific-controls
          label: Customer-specific controls
          note: Yours alone, such as routing data within your security zones
    - id: well-architected-framework
      children:
        - id: wa-tool
          label: AWS Well-Architected Tool
          note: Console service to review a workload; no extra charge
        - id: wa-lens-catalog
          label: Lens Catalog
          note: Official AWS lenses with extra questions for a domain
        - id: wa-custom-lens
          label: Custom lens
          note: Your own pillars, questions and best practices, shareable
    - id: aws-pricing-models
      children:
        - id: on-demand-instances
          label: On-Demand Instances
          note: Pay by the second for what you launch; nothing up front
        - id: savings-plans-option
          label: Savings Plans
          note: Commit to USD per hour of usage for 1 or 3 years
          children:
            - id: compute-savings-plans
              label: Compute Savings Plans
              note: Any family, size, Region or OS; also Fargate and Lambda
            - id: ec2-instance-savings-plans
              label: EC2 Instance Savings Plans
              note: One instance family in one Region; up to 72% off
            - id: database-savings-plans
              label: Database Savings Plans
              note: RDS, Aurora, DynamoDB, ElastiCache and more; up to 35% off
        - id: reserved-instances-option
          label: Reserved Instances
          note: Commit to an instance configuration and Region for 1 or 3 years
        - id: spot-instances
          label: Spot Instances
          note: EC2 sets the Spot price per type and AZ; it moves slowly
        - id: aws-cost-tools
          label: Cost tools
          note: Track, analyse and estimate what you spend
          children:
            - id: aws-budgets-tool
              label: AWS Budgets
              note: Alerts on actual or forecast cost and usage
            - id: cost-explorer-tool
              label: AWS Cost Explorer
              note: Graphs and reports of your cost and usage
            - id: pricing-calculator-tool
              label: AWS Pricing Calculator
              note: Free tool to estimate cost before you build
        - id: free-tier-new-accounts
          label: AWS Free Tier (new accounts)
          note: USD 100 credit plus up to 100 more; free plan lasts up to 6 months
  compute:
    - id: ec2
      children:
        - id: instance-type
          label: Instance type
          note: "Series, generation, options, then size: m7g.large"
          children:
            - id: general-purpose-instances
              label: General purpose (M, T)
              note: Balanced compute, memory, network; T types are burstable
            - id: compute-optimised-instances
              label: Compute optimised (C)
              note: High-performance CPUs for compute-bound work like batch
            - id: memory-optimised-instances
              label: Memory optimised (R, X)
              note: Fast work on large data sets held in memory
            - id: storage-optimised-instances
              label: Storage optimised (I, D)
              note: High local disk I/O for very large data sets
            - id: accelerated-computing-instances
              label: Accelerated computing (P, G)
              note: Hardware accelerators such as GPUs
        - id: ami
          label: AMI
          note: "Boot image: OS, software, disk mapping; tied to a Region"
        - id: user-data
          label: User data
          note: Script run as root at first launch; up to 16 KB
        - id: imdsv2
          label: IMDSv2
          note: Metadata at 169.254.169.254 with a token from a PUT
        - id: instance-store
          label: Instance store
          note: Host-attached disk; data lost on stop, hibernate, terminate
    - id: auto-scaling-groups
      children:
        - id: launch-template
          label: Launch template
          note: AMI, instance type, key pair, security groups for launches
        - id: asg-scaling-policies
          label: Scaling policies
          note: Rules that change the group's desired capacity
          children:
            - id: target-tracking-scaling
              label: Target tracking scaling
              note: Keeps a metric near a target value, like a thermostat
            - id: step-scaling
              label: Step scaling
              note: Adds or removes by step adjustments sized to the breach
            - id: simple-scaling
              label: Simple scaling
              note: One adjustment, then waits a cooldown; AWS advises against
            - id: scheduled-scaling
              label: Scheduled scaling
              note: Changes capacity at times you set
            - id: predictive-scaling
              label: Predictive scaling
              note: Forecasts daily or weekly patterns and scales ahead
        - id: asg-lifecycle-hooks
          label: Lifecycle hooks
          note: Pause a launch or termination; waits 1 hour by default
    - id: elastic-load-balancing
      children:
        - id: application-load-balancer
          label: Application Load Balancer (ALB)
          note: Layer 7; evaluates listener rules in priority order
        - id: network-load-balancer
          label: Network Load Balancer (NLB)
          note: Layer 4; one Elastic IP per subnet if internet-facing
        - id: gateway-load-balancer
          label: Gateway Load Balancer (GWLB)
          note: Layer 3; sends traffic to appliances over GENEVE 6081
        - id: classic-load-balancer
          label: Classic Load Balancer
          note: Previous generation; AWS recommends migrating
        - id: elb-listener
          label: Listener
          note: Protocol and port; ALB listeners take HTTP or HTTPS
        - id: alb-target-group
          label: Target group
          term: target-group
          note: Targets (instance, IP or Lambda) plus a health check
    - id: lambda
      children:
        - id: lambda-invocation-types
          label: Invocation types
          note: How a caller or service hands an event to Lambda
          children:
            - id: lambda-synchronous-invocation
              label: Synchronous
              note: The caller waits for the response
            - id: lambda-asynchronous-invocation
              label: Asynchronous
              note: Lambda queues the event and replies at once
            - id: event-source-mapping
              label: Event source mapping
              note: Lambda reads a queue or stream and invokes with batches
        - id: lambda-execution-environment
          label: Execution environment
          term: execution-environment-lambda
          note: Runs init once, then reused for later invocations
        - id: lambda-snapstart
          label: SnapStart
          note: Java 11+; only on published versions, not $LATEST
        - id: provisioned-concurrency
          label: Provisioned concurrency
          note: Pre-initialised environments; extra charge
        - id: reserved-concurrency
          label: Reserved concurrency
          note: Reserves and caps a function's share; no charge
        - id: lambda-java-runtimes
          label: Java runtimes
          note: "Newest java25 and java21 (AL2023); 8, 11, 17 also offered"
    - id: containers-ecs-eks-fargate
      children:
        - id: amazon-ecr
          label: Amazon ECR
          note: Managed registry for Docker and OCI images
        - id: amazon-ecs
          label: Amazon ECS
          note: AWS's container orchestrator; no charge for orchestration
          children:
            - id: task-definition
              label: Task definition
              note: "JSON blueprint: images, CPU, memory, roles, logging"
            - id: ecs-service
              label: Service
              note: Keeps the desired number of tasks running
        - id: amazon-eks
          label: Amazon EKS
          note: AWS runs the Kubernetes control plane; Auto Mode runs nodes too
        - id: aws-fargate
          label: AWS Fargate
          note: Serverless compute for ECS tasks and EKS pods
        - id: ecs-managed-instances
          label: ECS Managed Instances
          note: "EC2 types you pick; AWS runs them for a per-instance fee"
    - id: compute-choice
      children:
        - id: elastic-beanstalk
          label: Elastic Beanstalk
          note: Deploys an app on EC2 or EKS with load balancing and scaling
        - id: ecs-express-mode
          label: ECS Express Mode
          note: Image in; Fargate service, load balancer, scaling out
        - id: aws-app-runner
          label: AWS App Runner
          note: Closed to new customers; AWS points to ECS Express Mode
  storage:
    - id: s3
      children:
        - id: s3-storage-classes
          label: Storage classes
          term: s3-storage-class
          note: Picked per object; S3 Standard if you set none
          children:
            - id: s3-standard
              label: S3 Standard
              note: Frequent access, ms reads, 3+ AZs, no minimum days
            - id: s3-intelligent-tiering
              label: S3 Intelligent-Tiering
              note: Moves objects between tiers by use; small monitoring fee
            - id: s3-standard-ia
              label: S3 Standard-IA
              note: Read about monthly; retrieval fee, 30-day minimum
            - id: s3-one-zone-ia
              label: S3 One Zone-IA
              note: "One AZ only: for data you can re-create"
            - id: s3-glacier-classes
              label: S3 Glacier classes
              term: s3-glacier
              note: Instant (ms), Flexible (min to hours), Deep Archive (hours)
            - id: s3-express-one-zone
              label: S3 Express One Zone
              note: Single-digit ms in one AZ; directory buckets only
        - id: s3-versioning
          label: Versioning
          note: Off by default; once on, it can only be suspended
        - id: s3-lifecycle-rule
          label: Lifecycle rule
          note: Transition to a cheaper class, or expire, after N days
        - id: s3-presigned-url
          label: Pre-signed URL
          term: presigned-url
          note: Ends at its expiry or when the signer's credentials do
        - id: s3-block-public-access
          label: Block Public Access
          note: On by default for new buckets; AWS advises keeping it on
        - id: s3-event-notifications
          label: Event notifications
          note: To SNS, SQS, Lambda or EventBridge; at least once
    - id: ebs-and-efs
      children:
        - id: ebs-volume
          label: EBS volume
          term: amazon-ebs
          note: Lives on after the instance stops; same AZ as the instance
          children:
            - id: ebs-gp3
              label: gp3 (General Purpose SSD)
              term: gp3
              note: Most workloads; 20% cheaper per GiB than gp2
            - id: ebs-io2
              label: io2 Block Express
              note: "Provisioned IOPS SSD: up to 256,000 IOPS, 99.999% durable"
            - id: ebs-st1-sc1
              label: st1 and sc1 (HDD)
              note: Throughput or cold data; cannot be a boot volume
        - id: ebs-snapshot
          label: EBS snapshot
          note: Only changed blocks are saved; deleting one may not cut cost
        - id: ebs-multi-attach
          label: Multi-Attach
          note: io1 or io2 only; up to 16 Nitro instances in one AZ
        - id: efs-file-system
          label: EFS file system
          term: amazon-efs
          note: NFSv4.0 and 4.1; mounted by EC2, ECS, EKS, Fargate, Lambda
          children:
            - id: efs-regional
              label: Regional file system
              note: "Recommended: data in 3+ AZs"
            - id: efs-one-zone
              label: One Zone file system
              note: One AZ; data may be lost if that AZ is lost
            - id: efs-storage-classes
              label: EFS storage classes
              note: Standard, Infrequent Access, Archive, moved by lifecycle
        - id: fsx-family
          label: Amazon FSx
          term: amazon-fsx
          note: Managed Windows File Server, Lustre, NetApp ONTAP, OpenZFS
    - id: cloudfront
      children:
        - id: cloudfront-origin
          label: Origin
          term: origin-cloudfront
          note: S3 bucket, load balancer, MediaPackage or any HTTP server
        - id: cloudfront-cache-behaviour
          label: Cache behaviour
          term: cache-behaviour
          note: Default behaviour is * and is checked last
        - id: cloudfront-cache-key
          label: Cache key
          note: Values that identify one cached file in a distribution
        - id: cloudfront-oac
          label: Origin Access Control (OAC)
          term: origin-access-control
          note: Signs S3 requests; legacy OAI lacks SSE-KMS and PUT support
        - id: cloudfront-signed-urls-cookies
          label: Signed URLs and signed cookies
          term: cloudfront-signed-url
          note: Signed with a trusted key group; a signed URL wins over a cookie
        - id: cloudfront-invalidation
          label: Invalidation
          term: cache-invalidation
          note: A wildcard path counts as one path for billing
  databases:
    - id: rds
      children:
        - id: rds-engines
          label: RDS engines
          note: Db2, MariaDB, SQL Server, MySQL, Oracle Database, PostgreSQL
        - id: multi-az-db-instance
          label: Multi-AZ DB instance
          note: One synchronous standby in another AZ; it serves no reads
          term: multi-az-deployment
        - id: multi-az-db-cluster
          label: Multi-AZ DB cluster
          note: Writer + 2 readable standbys in 3 AZs; failover usually < 35 s
        - id: rds-read-replica
          label: Read replica
          note: Async read-only copy, same or other Region; can be promoted
          term: read-replica
        - id: rds-automated-backups
          label: Automated backups
          note: Volume snapshot in the backup window plus logs, for point-in-time restore
          children:
            - id: rds-db-snapshot
              label: Manual DB snapshot
              note: Kept until you delete it, even after the DB instance is gone
        - id: rds-proxy-node
          label: RDS Proxy
          note: Pools connections; logs in with Secrets Manager or IAM auth
          term: rds-proxy-term
    - id: aurora
      children:
        - id: aurora-cluster-volume
          label: Cluster volume
          note: One shared SSD volume across three AZs; grows by itself
        - id: aurora-replica-node
          label: Aurora Replica
          note: Up to 15 per cluster; promoted on failover
          term: aurora-replica
        - id: aurora-cluster-endpoint
          label: Cluster (writer) endpoint
          note: Points to the current primary, also after a failover
        - id: aurora-reader-endpoint
          label: Reader endpoint
          note: Balances read-only connections across the Aurora Replicas
        - id: aurora-serverless-node
          label: Aurora Serverless
          note: Named Serverless v2 until 04-2026; can pause at 0 ACUs
          term: aurora-serverless
        - id: aurora-global-database-node
          label: Aurora Global Database
          note: One writer Region, up to 10 read-only Regions; lag < 1 s typical
    - id: dynamodb
      children:
        - id: dynamodb-primary-key
          label: Primary key
          note: Simple (partition key) or composite (partition + sort key)
          children:
            - id: dynamodb-partition-key
              label: Partition key
              note: "Its hash picks the partition; older name: hash attribute"
              term: partition-key-dynamodb
            - id: dynamodb-sort-key
              label: Sort key
              note: "Orders items within one partition key; older name: range attribute"
              term: sort-key-dynamodb
            - id: dynamodb-single-table
              label: Single-table design
              note: Several entity types in one table, shaped by access patterns
              term: single-table-design
        - id: dynamodb-secondary-indexes
          label: Secondary indexes
          note: Extra keys to query by; DynamoDB keeps them in sync
          children:
            - id: dynamodb-gsi
              label: Global secondary index (GSI)
              note: Own key and capacity; default quota 20 per table
              term: global-secondary-index
            - id: dynamodb-lsi
              label: Local secondary index (LSI)
              note: Up to 5 per table; 10 GB limit per partition key value
              term: local-secondary-index
        - id: dynamodb-capacity-modes
          label: Capacity modes
          note: Decide how throughput is managed and billed
          children:
            - id: dynamodb-on-demand
              label: On-demand
              note: Pay per request; the default and recommended mode
              term: on-demand-capacity-mode
            - id: dynamodb-provisioned
              label: Provisioned
              note: You set RCUs and WCUs; auto scaling can adjust them
              term: provisioned-capacity-mode
        - id: dynamodb-streams-node
          label: DynamoDB Streams
          note: Ordered item changes kept 24 hours; can trigger Lambda
          term: dynamodb-streams
        - id: dynamodb-global-tables
          label: Global tables
          note: "Multi-Region, multi-active: any replica serves reads and writes"
        - id: dynamodb-dax-node
          label: DAX
          note: In-memory cache for microsecond, eventually consistent reads
          term: dynamodb-accelerator
    - id: elasticache
      children:
        - id: elasticache-serverless-node
          label: ElastiCache Serverless
          note: Valkey 7.2+, Memcached 1.6.22+ or Redis OSS 7.1
          term: elasticache-serverless
        - id: elasticache-node-based
          label: Node-based cluster
          note: Valkey/Redis OSS backups restore into either deployment type
        - id: elasticache-valkey-redis-oss
          label: Valkey / Redis OSS
          note: One shard holds up to 5 read replicas when cluster mode is off
          children:
            - id: elasticache-cluster-mode
              label: Cluster mode enabled
              note: "Shards data: up to 500 shards, up to 5 replicas each"
              term: cluster-mode-elasticache
        - id: elasticache-memcached
          label: Memcached
          note: Multithreaded; scale out or in by adding or removing nodes
          term: memcached
        - id: amazon-memorydb-node
          label: Amazon MemoryDB
          note: Durable Valkey/Redis OSS-compatible database with a Multi-AZ log
    - id: choosing-a-database
      children:
        - id: amazon-documentdb-node
          label: Amazon DocumentDB
          note: Document database with MongoDB compatibility
        - id: amazon-neptune-node
          label: Amazon Neptune
          note: Graph database for complex networks of objects
        - id: amazon-keyspaces-node
          label: Amazon Keyspaces
          note: Wide-column, for Apache Cassandra workloads
        - id: amazon-timestream-node
          label: Amazon Timestream
          note: LiveAnalytics closed to new customers on 20-06-2025; use InfluxDB
        - id: amazon-opensearch-node
          label: Amazon OpenSearch Service
          note: Managed OpenSearch for search and log analytics
        - id: amazon-redshift-node
          label: Amazon Redshift
          note: Petabyte-scale cloud data warehouse for analytics (OLAP)
  networking:
    - id: vpc-and-subnets
      children:
        - id: cidr-block
          label: CIDR block
          note: VPC IPv4 range, /16 to /28, usually from RFC 1918 private space
        - id: public-subnet
          label: Public subnet
          note: Its route table has a direct route to an internet gateway
        - id: private-subnet
          label: Private subnet
          note: No direct route to an internet gateway; needs NAT to go out
        - id: vpc-route-table
          label: Route table
          note: A subnet uses one at a time; many subnets can share one
          children:
            - id: main-route-table
              label: Main route table
              note: Comes with the VPC; used by subnets with no other table
            - id: custom-route-table
              label: Custom route table
              note: One you create and associate with chosen subnets
        - id: vpc-peering
          label: VPC peering
          note: Works across accounts and Regions; inter-Region traffic is encrypted
        - id: transit-gateway
          label: Transit Gateway
          note: "Attachments: VPCs, VPN connections, Direct Connect gateways, peering"
    - id: internet-and-nat-gateways
      children:
        - id: internet-gateway
          label: Internet gateway
          note: Horizontally scaled and redundant; carries IPv4 and IPv6
        - id: nat-gateway
          label: NAT gateway
          note: Maps many private IPv4 addresses to its own address
          children:
            - id: regional-nat-gateway
              label: Regional NAT gateway
              note: "Up to 32 IPs per AZ (zonal: 8); may take 60 min to reach a new AZ"
            - id: private-nat-gateway
              label: Private NAT gateway
              note: No Elastic IP; reaches other VPCs or on-premises, not the internet
        - id: egress-only-internet-gateway
          label: Egress-only internet gateway
          note: "Stateful, no charge; route ::/0 to it; no security group on it"
        - id: nat-instance
          label: NAT instance
          note: Self-managed EC2 NAT; AWS recommends NAT gateways instead
        - id: elastic-ip-address
          label: Elastic IP address
          note: Remap it to a replacement instance to hide a failure
    - id: security-groups-and-nacls
      children:
        - id: security-group
          label: Security group
          note: Several can attach to one resource; no extra charge
          children:
            - id: security-group-referencing
              label: Security group referencing
              note: "A rule's source is another group: its members are allowed"
        - id: network-acl
          label: Network ACL
          note: One per subnet at a time; one NACL can serve many subnets
        - id: ephemeral-ports
          label: Ephemeral ports
          note: Linux 32768-61000, Windows 49152-65535, NAT gateway 1024-65535
    - id: vpc-endpoints-privatelink
      children:
        - id: gateway-endpoint
          label: Gateway endpoint
          note: Does not use PrivateLink, unlike other endpoint types
        - id: interface-endpoint
          label: Interface endpoint
          note: One endpoint network interface in each subnet you pick
        - id: endpoint-policy
          label: Endpoint policy
          note: Resource policy in IAM policy language; must have a Principal
        - id: endpoint-service
          label: Endpoint service
          note: Your service behind a load balancer; closed until you allow consumers
    - id: route-53
      children:
        - id: hosted-zone
          label: Hosted zone
          note: Has the same name as its domain, such as example.com
        - id: alias-record
          label: Alias record
          note: Shows as type A or AAAA in dig; the alias part is Route 53 only
        - id: route53-routing-policy
          label: Routing policy
          note: Eight types, chosen per record
          children:
            - id: simple-routing
              label: Simple
              note: One resource, such as one web server
            - id: weighted-routing
              label: Weighted
              note: Split traffic in set proportions, such as 90/10
            - id: latency-routing
              label: Latency-based
              note: Send users to the Region with the best latency
            - id: failover-routing
              label: Failover
              note: "Active-passive: the secondary answers when the primary fails"
            - id: geolocation-routing
              label: Geolocation
              note: By where the user is
            - id: geoproximity-routing
              label: Geoproximity
              note: By where resources are; can shift traffic between them
            - id: ip-based-routing
              label: IP-based
              note: By the client IP ranges you list
            - id: multivalue-routing
              label: Multivalue answer
              note: Up to 8 healthy records, chosen at random
        - id: route53-health-check
          label: Health check
          note: Watches an endpoint, other health checks or a CloudWatch alarm
    - id: api-gateway
      children:
        - id: apigw-rest-api
          label: REST API
          note: Edge-optimised, Regional or private endpoint
        - id: apigw-http-api
          label: HTTP API
          note: Regional endpoint only; JWT authorizers built in
        - id: apigw-websocket-api
          label: WebSocket API
          note: Routes each incoming message by its content
        - id: apigw-stage
          label: Stage
          note: Identified by the API ID and the stage name
        - id: vpc-link
          label: VPC link
          note: API Gateway creates and manages its network interfaces for you
        - id: apigw-authorizers
          label: Authorizers
          note: Check the caller before the backend runs
          children:
            - id: lambda-authorizer
              label: Lambda authorizer
              note: Your function checks the caller and returns an IAM policy
            - id: jwt-authorizer
              label: JWT authorizer
              note: If a route lists scopes, the token must carry one of them
  security:
    - id: iam-basics
      children:
        - id: iam-root-user
          label: Root user
          note: Full access to the account; use only for root-only tasks, with MFA
        - id: iam-user
          label: IAM user
          note: A named identity with a long-term password or access keys
        - id: iam-group
          label: IAM user group
          note: Holds users only; cannot nest and cannot be a Principal
        - id: iam-role
          label: IAM role
          note: No long-term keys; gives temporary credentials when assumed
        - id: iam-policy-kinds
          label: Managed and inline policies
          note: Three ways to give an identity a permissions policy
          children:
            - id: aws-managed-policy
              label: AWS managed policy
              note: Written and updated by AWS; you cannot edit it
            - id: customer-managed-policy
              label: Customer managed policy
              note: You write it once and attach it to many identities
            - id: inline-policy
              label: Inline policy
              note: Embedded in one identity; deleted along with it
    - id: iam-policy-evaluation
      children:
        - id: identity-based-policy
          label: Identity-based policy
          note: On a user, group or role; the Principal is implied
        - id: resource-based-policy
          label: Resource-based policy
          note: On a resource such as a bucket; names a Principal; inline only
        - id: permissions-boundary
          label: Permissions boundary
          note: Caps what identity policies can grant a user or role; grants nothing
        - id: service-control-policy
          label: Service control policy (SCP)
          note: Organizations cap on principals in member accounts; grants nothing
        - id: resource-control-policy
          label: Resource control policy (RCP)
          note: Organizations cap on resources in member accounts; grants nothing
        - id: session-policy
          label: Session policy
          note: Passed with AssumeRole; narrows that one session only
    - id: sts-and-temporary-credentials
      children:
        - id: ec2-instance-profile
          label: EC2 instance profile
          note: Holds one role; the app reads its keys from instance metadata
        - id: ecs-task-role
          label: ECS task role
          note: Permissions for your app's own AWS calls inside the task
        - id: ecs-task-execution-role
          label: ECS task execution role
          note: Lets ECS pull the image, write logs and fetch task secrets
        - id: lambda-execution-role
          label: Lambda execution role
          note: Lambda assumes it when invoked; trusts lambda.amazonaws.com
        - id: eks-pod-identity
          label: EKS Pod Identity
          note: Role per service account, no OIDC provider; not for Fargate pods
        - id: eks-irsa
          label: IRSA
          note: IAM roles for service accounts; needs an OIDC provider per cluster
    - id: kms-and-encryption
      children:
        - id: aws-owned-key
          label: AWS owned key
          note: Free default for many services; you cannot manage or delete it
        - id: aws-managed-key
          label: AWS managed key
          note: aws/<service> key in your account; legacy, none for new services
        - id: customer-managed-key
          label: Customer managed key
          note: You control its policy, rotation and deletion; monthly fee
        - id: sse-s3
          label: SSE-S3
          note: S3 owns and manages the keys; nothing to manage in KMS
        - id: sse-kms
          label: SSE-KMS
          note: A KMS key you pick; its key policy controls who can decrypt
        - id: sse-c
          label: SSE-C
          note: You send the key on every request; off on new buckets since 04-2026
    - id: secrets-and-parameters
      children:
        - id: aws-secrets-manager
          label: AWS Secrets Manager
          note: Secret values up to 64 KB; the current version is AWSCURRENT
          children:
            - id: sm-managed-rotation
              label: Managed rotation
              note: RDS, Aurora and some other services rotate it for you; no Lambda
            - id: sm-lambda-rotation
              label: Rotation by Lambda function
              note: Your function changes the secret and the database; down to every 4 h
        - id: ssm-parameter-store
          label: SSM Parameter Store
          note: Config values; SecureString values are encrypted with KMS
          children:
            - id: ps-standard-tier
              label: Standard tier
              note: "Default: 10,000 parameters, 4 KB each, no extra charge"
            - id: ps-advanced-tier
              label: Advanced tier
              note: 100,000 parameters, 8 KB, policies, sharing; paid, no downgrade
        - id: ecs-task-secrets
          label: ECS task definition secrets
          note: Injected at container start; a rotated value needs a new task
    - id: edge-security
      children:
        - id: aws-waf
          label: AWS WAF
          note: HTTP(S) filter on CloudFront, ALB, API Gateway REST and more
          children:
            - id: waf-managed-rule-groups
              label: Managed rule groups
              note: Ready-made rules, such as Core rule set and SQL database
            - id: waf-rate-based-rule
              label: Rate-based rule
              note: Limits each IP per 1, 2, 5 or 10 min window (default 5)
        - id: shield-standard
          label: Shield Standard
          note: Automatic, no extra charge; common network and transport DDoS
        - id: shield-advanced
          label: Shield Advanced
          note: Paid, 1-year term; DDoS cost protection; includes WAF fees for its resources
        - id: aws-certificate-manager
          label: ACM
          note: Free public TLS certificates for integrated services; auto-renewed
        - id: cognito-user-pool
          label: Cognito user pool
          note: User directory for sign-in; API Gateway can check its tokens
  integration:
    - id: sqs
      children:
        - id: sqs-standard-queue
          label: Standard queue
          note: At-least-once, best-effort order, nearly unlimited throughput
        - id: sqs-fifo-queue
          label: FIFO queue
          note: Name ends in .fifo; up to 120,000 in-flight messages
        - id: sqs-visibility-timeout
          label: Visibility timeout
          note: Extend it with ChangeMessageVisibility; 0 makes it visible at once
        - id: sqs-dead-letter-queue
          label: Dead-letter queue
          note: Same account and Region as the source; redrive moves messages back
        - id: sqs-long-polling
          label: Long polling
          note: "Default is short polling: WaitTimeSeconds 0 answers at once"
        - id: sqs-delay-queue
          label: Delay queue
          note: Hides new messages for 0 s to 15 minutes before delivery
    - id: sns
      children:
        - id: sns-standard-topic
          label: Standard topic
          note: Up to 12,500,000 subscriptions per topic
        - id: sns-fifo-topic
          label: FIFO topic
          note: Up to 100 subscriptions; SQS standard queues allowed since 09-2023
        - id: sns-subscription-protocols
          label: Subscription protocols
          note: SQS, Lambda, HTTP/S, Firehose, email, SMS, mobile push
        - id: sns-filter-policy
          label: Subscription filter policy
          note: "No policy: the subscriber gets every message"
        - id: sns-subscription-dlq
          label: Subscription DLQ
          note: An SQS queue on the subscription, same account and Region
    - id: eventbridge
      children:
        - id: eventbridge-default-bus
          label: Default event bus
          note: Every account has one; AWS services send events to it
        - id: eventbridge-custom-bus
          label: Custom event bus
          note: Relaunched 24-09-2026; the rules-based bus is now Custom - Classic
        - id: eventbridge-partner-source
          label: Partner event source
          note: "SaaS events: on a Classic partner bus, or an event source on the new bus"
        - id: eventbridge-archive-replay
          label: Archive and replay
          note: Archives keep events forever by default; replay to the source bus
        - id: eventbridge-scheduler
          label: EventBridge Scheduler
          note: Cron, rate or one-time schedules; at-least-once delivery to targets
        - id: eventbridge-pipes
          label: EventBridge Pipes
          note: "Point to point: one source to one target, with filter and enrich"
    - id: kinesis
      children:
        - id: kinesis-data-streams
          label: Kinesis Data Streams
          note: A set of shards; each record has a sequence number
          children:
            - id: kinesis-shard
              label: Shard
              note: A fixed unit of capacity; add shards for more throughput
            - id: kinesis-partition-key
              label: Partition key
              note: Unicode string up to 256 chars, MD5-hashed to a shard
            - id: kinesis-enhanced-fan-out
              label: Enhanced fan-out
              note: Each registered consumer gets its own 2 MB/s per shard
        - id: amazon-data-firehose
          label: Amazon Data Firehose
          note: Renamed from Kinesis Data Firehose on 09-02-2024; APIs unchanged
        - id: managed-flink
          label: Managed Service for Apache Flink
          note: Renamed from Kinesis Data Analytics on 30-08-2023
        - id: amazon-msk
          label: Amazon MSK
          note: "Amazon Managed Streaming for Apache Kafka: Kafka run by AWS"
    - id: step-functions
      children:
        - id: sfn-standard-workflow
          label: Standard workflow
          note: Billed per state transition; the default type
        - id: sfn-express-workflow
          label: Express workflow
          note: Billed per run, duration and memory; no .sync or callback
        - id: sfn-state-types
          label: State types
          note: Task does work; seven flow states steer the run
          children:
            - id: sfn-task-state
              label: Task
              note: "One unit of work: a Lambda, an AWS API call or an HTTPS call"
            - id: sfn-choice-state
              label: Choice
              note: Picks the next state by rules on the input
            - id: sfn-parallel-state
              label: Parallel
              note: Runs branches at the same time
            - id: sfn-map-state
              label: Map
              note: Runs the same steps for each item of an array
            - id: sfn-wait-state
              label: Wait
              note: Pauses for a time or until a date
        - id: sfn-integration-patterns
          label: Integration patterns
          note: Request-response (default), run a job (.sync), wait for callback
  operations:
    - id: cloudwatch
      children:
        - id: cw-metrics
          label: Metrics
          note: Time series in a namespace, told apart by name and dimensions
        - id: cw-logs
          label: "Logs: log groups and log streams"
          note: A log group holds streams that share retention and access
          children:
            - id: cw-logs-insights
              label: Logs Insights
              note: Interactive queries over one or more log groups
            - id: cw-metric-filter
              label: Metric filter
              note: Turns matching log events into metric data points
        - id: cw-alarms
          label: Alarms
          note: Act on SNS, EC2 Auto Scaling or EC2 when the state changes
        - id: cw-agent
          label: CloudWatch agent
          note: Collects in-guest metrics such as memory, plus logs and traces
    - id: cloudtrail
      children:
        - id: ct-management-events
          label: Management events
          note: Control-plane calls such as AttachRolePolicy; logged by default
        - id: ct-data-events
          label: Data events
          note: Operations on resources, such as S3 objects; off by default, paid
        - id: ct-trail
          label: Trail
          note: Delivers events to an S3 bucket; best practice is multi-Region
        - id: aws-config-recorder
          label: AWS Config
          note: Records resource configuration over time; rules flag noncompliance
    - id: x-ray-and-tracing
      children:
        - id: xray-segment
          label: Segment and subsegment
          note: A service's record of its work; subsegments time downstream calls
        - id: xray-sampling-rule
          label: Sampling rule
          note: "Default: first request each second, then 5% of the rest"
        - id: adot
          label: AWS Distro for OpenTelemetry
          note: AWS-recommended OpenTelemetry route to send traces to X-Ray
        - id: cw-application-signals
          label: CloudWatch Application Signals
          note: Collects latency, faults and errors; tracks SLOs; supports Java
    - id: infrastructure-as-code
      children:
        - id: cfn-template-stack
          label: CloudFormation template and stack
          note: A YAML or JSON template; the stack is the resources it creates
          children:
            - id: cfn-change-set
              label: Change set
              note: Previews how an update will affect running resources
            - id: cfn-drift-detection
              label: Drift detection
              note: Finds stack resources changed outside CloudFormation
            - id: cfn-stacksets
              label: StackSets
              note: One template deployed to many accounts and Regions
        - id: cdk-constructs
          label: "CDK constructs: L1, L2, L3"
          note: L1 is one raw resource; L2 is curated; L3 is a whole pattern
        - id: aws-sam-template
          label: AWS SAM
          note: Shorthand CloudFormation for serverless apps, with a CLI
        - id: terraform-state
          label: Terraform state
          note: "Default: local terraform.tfstate; teams use a remote backend"
    - id: deployments-on-aws
      children:
        - id: rolling-deployment
          label: Rolling update
          note: "ECS default: replace tasks in batches as new ones get healthy"
          children:
            - id: ecs-circuit-breaker
              label: Deployment circuit breaker
              note: Rolls back if new tasks never reach a steady state
            - id: ecs-health-check-grace
              label: Health check grace period
              note: ECS ignores failed health checks after start; default 0 s
        - id: blue-green-deployment
          label: Blue-green deployment
          note: Two identical environments; traffic moves from blue to green
        - id: canary-deployment
          label: Canary deployment
          note: A small traffic share first, then all the rest at once
        - id: aws-code-tools
          label: CodePipeline, CodeBuild, CodeDeploy
          note: Release pipeline, managed builds, deploys to EC2, ECS, Lambda
        - id: ecr-registry
          label: Amazon ECR
          note: Managed container image registry the pipeline pushes to
    - id: disaster-recovery
      children:
        - id: dr-backup-restore
          label: Backup and restore
          note: RPO and RTO in hours; create resources after the event
        - id: dr-pilot-light
          label: Pilot light
          note: Data live, servers switched off; RPO and RTO tens of minutes
        - id: dr-warm-standby
          label: Warm standby
          note: Smaller working copy always on; RPO and RTO in minutes
        - id: dr-multi-site
          label: Multi-site active/active
          note: Every Region serves traffic; RPO and RTO near real time
        - id: dr-data-replication
          label: Cross-Region data copies
          note: Continuous replication puts data in the DR Region almost at once
          children:
            - id: dr-aws-backup-copy
              label: AWS Backup cross-Region copy
              note: Copies backups to another Region or account
            - id: dr-s3-crr
              label: S3 Cross-Region Replication
              note: Copies objects asynchronously to a bucket in the DR Region
            - id: dr-rds-cross-region-replica
              label: RDS cross-Region read replica
              note: Promote it to primary when you fail over
            - id: dr-aurora-global-database
              label: Aurora Global Database
              note: Typical cross-Region lag under a second
            - id: dr-dynamodb-global-tables
              label: DynamoDB global tables
              note: "Reads and writes in every Region; default mode: last writer wins"
    - id: aws-sdk-for-java
      children:
        - id: sdk-default-credentials-chain
          label: Default credentials provider chain
          note: System props, env vars, web identity, profile, container, EC2 role
        - id: sdk-sync-async-clients
          label: Sync and async clients
          note: Async methods return a CompletableFuture
        - id: spring-cloud-aws-starters
          label: Spring Cloud AWS starters
          note: One starter per service; auto-configures region and credentials
        - id: localstack-testcontainers
          label: LocalStack with Testcontainers
          note: Fake AWS APIs in tests; latest image needs a token since 23-03-2026
    - id: aws-code-templates
      children:
        - id: tpl-sdk-call-shape
          label: SDK 2.x call shape
          note: Client builder, then request builder, then one method call
        - id: tpl-s3-put-get
          label: S3 putObject and getObjectAsBytes
          note: Bucket and key address the object; the body is a RequestBody
        - id: tpl-sqs-send-receive-delete
          label: SQS send, receive, delete
          note: Delete with the receipt handle only after the work succeeds
        - id: tpl-rds-over-jdbc
          label: RDS over plain JDBC
          note: Normal JDBC URL to the RDS endpoint; no SDK call for data
        - id: tpl-spring-cloud-aws
          label: S3Template, SqsTemplate, @SqsListener
          note: Spring Cloud AWS 4.x wrappers; the listener deletes on success
    - id: aws-architecture-playbook
      children:
        - id: playbook-app-layer
          label: "App: ECS Fargate tasks"
          note: Containers run with no EC2 servers or clusters to manage
        - id: playbook-data-layer
          label: "Data: RDS, ElastiCache, S3"
          note: Payment rows in RDS, merchant config cached, receipt PDFs in S3
