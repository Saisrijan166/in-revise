id: alb-vs-nlb-vs-gwlb
tech: aws
title: "ALB vs NLB vs GWLB"
compares: [application-load-balancer, network-load-balancer, gateway-load-balancer]
gist:
  - "Layer 7: reads HTTP and routes by path, host or header"
  - "Layer 4: forwards TCP and UDP flows fast, with fixed IPs"
  - "Layer 3: passes all IP packets through security appliances"
explain:
  - "An Application Load Balancer works at layer 7, the HTTP level. It reads the request line and headers, so it can route /payments and /refunds to different target groups, end HTTPS with an ACM certificate, and target instances, IPs or Lambda."
  - "A Network Load Balancer works at layer 4. It forwards raw TCP and UDP connections without reading their contents, handling very high throughput at low latency and offering a static IP per AZ. Use it for non-HTTP traffic or a fixed IP."
  - "A Gateway Load Balancer works at layer 3. It transparently sends all IP packets to a fleet of third-party network appliances (firewalls, intrusion detection) over GENEVE, then on to their destination. Use it only to insert such appliances."
example: "A Spring Boot API that serves /payments and /refunds over HTTPS needs an ALB, which can read the path and split the two to different target groups. A game server pushing millions of raw UDP packets with a fixed IP needs an NLB. A security team inserting a firewall in front of everything uses a GWLB to route packets through the appliances first."
rows:
  - { aspect: "Listens for", a: "HTTP and HTTPS", b: "TCP, UDP, TLS and QUIC", c: "All IP packets, sent to appliances over GENEVE port 6081" }
  - { aspect: "Picks a target by", a: "Listener rules on path, host, headers", b: "A flow hash per connection", c: "Flow stickiness to one appliance" }
  - { aspect: "Targets", a: "Instances, IPs, Lambda functions", b: "Instances, IPs, an ALB", c: "Appliance instances or IPs" }
  - { aspect: "Static IP", a: "No (DNS name only)", b: "Yes, one Elastic IP per AZ", c: "N/A (transparent)" }
  - { aspect: "Cross-zone default", a: "On (a target group can opt out)", b: "Off", c: "Off" }
  - { aspect: "Pick it for", a: "Web apps, REST APIs, microservice routing", b: "Non-HTTP traffic, extreme throughput, static IPs", c: "Firewalls, intrusion detection, packet inspection" }
verdict: "ALB for web apps and REST APIs; NLB for TCP or UDP, extreme performance or static IPs; GWLB only to insert network appliances."
sayIt: "ALB is layer 7: it reads HTTP and routes by path or host, so it suits REST APIs. NLB is layer 4: it forwards TCP and UDP fast with a static IP per AZ, for non-HTTP or extreme throughput. GWLB is layer 3, used only to route traffic through security appliances."
