id: ecs-vs-eks
tech: aws
title: "ECS vs EKS"
compares: [amazon-ecs, amazon-eks]
gist:
  - "AWS's own orchestrator: task definitions and services"
  - "Managed Kubernetes: AWS runs the control plane"
rows:
  - { aspect: "You describe apps with", a: "ECS task definitions (JSON) and the ECS API", b: "Kubernetes manifests and the Kubernetes API" }
  - { aspect: "Control plane fee", a: "None; pay only for compute", b: "$0.10 per cluster per hour (standard support, 20-10-2026)" }
  - { aspect: "Compute options", a: "Fargate, EC2, ECS Managed Instances", b: "Managed node groups, Auto Mode, Fargate, self-managed nodes" }
  - { aspect: "Tooling", a: "AWS console, CLI, CloudFormation", b: "Certified Kubernetes: community tools and plugins" }
  - { aspect: "Best for", a: "AWS-only teams who want fewer moving parts", b: "Teams already on Kubernetes, or needing its ecosystem" }
verdict: "Default to ECS on Fargate for services that live only on AWS; choose EKS when Kubernetes skills, tools or portability matter."
sources:
