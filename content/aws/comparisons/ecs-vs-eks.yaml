  - { title: "Amazon ECS pricing", url: "https://aws.amazon.com/ecs/pricing/", verifiedOn: "2026-10-20" }
  - { title: "What is Amazon EKS? (Amazon EKS User Guide)", url: "https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html", verifiedOn: "2026-10-20" }
  - { title: "Manage compute resources by using nodes (Amazon EKS User Guide)", url: "https://docs.aws.amazon.com/eks/latest/userguide/eks-compute.html", verifiedOn: "2026-10-20" }
  - { title: "Amazon EKS pricing", url: "https://aws.amazon.com/eks/pricing/", verifiedOn: "2026-10-20" }
