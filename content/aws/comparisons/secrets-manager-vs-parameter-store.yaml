id: secrets-manager-vs-parameter-store
tech: aws
title: "Secrets Manager vs Parameter Store"
compares: [aws-secrets-manager, ssm-parameter-store]
gist:
  - "Built for credentials: rotation, versions, sharing"
  - "Built for config; SecureString encrypts a value"
explain:
  - "Secrets Manager is built to hold credentials such as database passwords and API keys. It encrypts them with KMS, keeps versions, can share them across accounts, and rotates them on a schedule, managed for RDS and Aurora or by a Lambda function."
  - "Parameter Store is built to hold configuration values such as endpoints and feature flags. A plain value is free in the standard tier; a SecureString value is encrypted with KMS, but nothing rotates it."
example: "The payment service keeps its RDS password in Secrets Manager so RDS rotates it every seven days, and keeps refunds.enabled and the queue name as free Parameter Store parameters that the app reads at startup."
rows:
  - { aspect: "Built for", a: "Database passwords, API keys, tokens", b: "Configuration: endpoints, flags, IDs" }
  - { aspect: "Rotation", a: "On a schedule: managed or by a Lambda function", b: "None built in; AWS points credentials to Secrets Manager" }
  - { aspect: "Max value size", a: "64 KB", b: "4 KB standard, 8 KB advanced" }
  - { aspect: "Price", a: "Per secret per month plus API calls", b: "Standard tier: no extra charge; advanced: paid" }
  - { aspect: "Cross-account", a: "Resource policy plus a customer managed KMS key", b: "Advanced tier parameters only" }
verdict: "Credentials that should rotate go in Secrets Manager; plain or lightly sensitive config goes in Parameter Store."
sayIt: "Secrets Manager holds credentials and rotates them, with versions and cross-account sharing; Parameter Store holds configuration, with a free standard tier and SecureString for encrypted values. I put the database password in Secrets Manager and plain settings in Parameter Store."
