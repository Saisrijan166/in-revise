id: secrets-manager-vs-parameter-store
tech: aws
title: "Secrets Manager vs Parameter Store"
compares: [aws-secrets-manager, ssm-parameter-store]
gist:
  - "Built for credentials: rotation, versions, sharing"
  - "Built for config; SecureString encrypts a value"
rows:
  - { aspect: "Built for", a: "Database passwords, API keys, tokens", b: "Configuration: endpoints, flags, IDs" }
  - { aspect: "Rotation", a: "On a schedule: managed or by a Lambda function", b: "None built in; AWS points credentials to Secrets Manager" }
  - { aspect: "Max value size", a: "64 KB", b: "4 KB standard, 8 KB advanced" }
  - { aspect: "Price", a: "Per secret per month plus API calls", b: "Standard tier: no extra charge; advanced: paid" }
  - { aspect: "Cross-account", a: "Resource policy plus a customer managed KMS key", b: "Advanced tier parameters only" }
verdict: "Credentials that should rotate go in Secrets Manager; plain or lightly sensitive config goes in Parameter Store."
sources:
  - title: "Rotate AWS Secrets Manager secrets (Secrets Manager User Guide)"
    url: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html"
    verifiedOn: "2026-10-20"
  - title: "AWS Secrets Manager quotas: secret value size"
    url: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/reference_limits.html"
    verifiedOn: "2026-10-20"
  - title: "AWS Secrets Manager pricing"
    url: "https://aws.amazon.com/secrets-manager/pricing/"
    verifiedOn: "2026-10-20"
  - title: "Access Secrets Manager secrets from a different account (Secrets Manager User Guide)"
    url: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html"
    verifiedOn: "2026-10-20"
  - title: "Choosing parameter tiers in Parameter Store (AWS Systems Manager User Guide)"
    url: "https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html"
    verifiedOn: "2026-10-20"
  - title: "AWS Systems Manager Parameter Store: use Secrets Manager for credentials"
    url: "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html"
    verifiedOn: "2026-10-20"
