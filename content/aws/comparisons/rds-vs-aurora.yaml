id: rds-vs-aurora
tech: aws
title: "RDS vs Aurora"
compares: [rds, aurora]
gist:
  - "A standard engine on its own instance storage"
  - "MySQL/PostgreSQL-compatible on shared cluster storage"
rows:
  - { aspect: "Engines", a: "Db2, MariaDB, SQL Server, MySQL, Oracle, PostgreSQL", b: "MySQL- or PostgreSQL-compatible only" }
  - { aspect: "Storage", a: "EBS volumes per DB instance", b: "One cluster volume: 6 copies in 3 AZs, grows up to 256 TiB" }
  - { aspect: "Read copies", a: "Up to 15 read replicas, each with its own copy", b: "Up to 15 Aurora Replicas sharing the volume" }
  - { aspect: "Replica lag", a: "Async; watch the ReplicaLag metric", b: "Usually under 100 ms" }
  - { aspect: "Failover", a: "Multi-AZ standby: typically 60-120 s", b: "Promote a replica: usually under 60 s" }
verdict: "Choose RDS for an engine Aurora lacks or plain engine behaviour; choose Aurora for fast failover, many low-lag readers or self-growing storage."
sources:
