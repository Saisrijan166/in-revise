id: task-role-vs-task-execution-role
tech: aws
title: "ECS Task Role vs Task Execution Role"
compares: [ecs-task-role, ecs-task-execution-role]
gist:
  - "Your app's permissions inside the container"
  - "The ECS agent's permissions to start the task"
explain:
  - "The task role holds the permissions your application code uses at runtime. When your code calls AWS through the SDK, such as writing a receipt to S3 or sending to SQS, it uses the task role's credentials. Write it to least privilege for what the app does."
  - "The task execution role holds the permissions the ECS and Fargate agents need to start the task, before your code runs: pulling the image from ECR, writing logs to CloudWatch, and injecting secrets. Your app never sees these permissions."
example: "The payment service writes receipts to S3, so s3:PutObject goes on the task role. The image is in private ECR and the task reads the DB password from Secrets Manager, so ecr pull, logs:PutLogEvents and secretsmanager:GetSecretValue go on the execution role. Put a permission on the wrong role and either the app gets AccessDenied at runtime, or the task never starts."
rows:
  - { aspect: "Used by", a: "Your code, through the AWS SDK or CLI", b: "The ECS container and Fargate agents" }
  - { aspect: "When it is used", a: "At runtime, while the app runs", b: "At startup, before the app runs" }
  - { aspect: "Typical permissions", a: "s3:PutObject for receipts, sqs:SendMessage", b: "Pull from ECR, write CloudWatch Logs, read task secrets" }
  - { aspect: "Seen by your code", a: "Yes", b: "No" }
  - { aspect: "Task definition field", a: "taskRoleArn", b: "executionRoleArn" }
  - { aspect: "Managed policy", a: "None; write least privilege yourself", b: "AmazonECSTaskExecutionRolePolicy covers the common cases" }
verdict: "App calls AWS: add it to the task role. ECS cannot pull the image, ship logs or inject a secret: fix the execution role."
sayIt: "The task role is my app's permissions at runtime, for its own AWS calls like writing to S3. The execution role is the ECS agent's permissions at startup, to pull the image, ship logs and inject secrets. App AccessDenied means the task role; a task that never starts means the execution role."
sources:
