id: task-role-vs-task-execution-role
tech: aws
title: "ECS Task Role vs Task Execution Role"
compares: [ecs-task-role, ecs-task-execution-role]
gist:
  - "Your app's permissions inside the container"
  - "The ECS agent's permissions to start the task"
rows:
  - { aspect: "Used by", a: "Your code, through the AWS SDK or CLI", b: "The ECS container and Fargate agents" }
  - { aspect: "Typical permissions", a: "s3:PutObject for receipts, sqs:SendMessage", b: "Pull from ECR, write CloudWatch Logs, read task secrets" }
  - { aspect: "Seen by containers", a: "Yes", b: "No" }
  - { aspect: "Task definition field", a: "taskRoleArn", b: "executionRoleArn" }
  - { aspect: "Managed policy", a: "None; write least privilege yourself", b: "AmazonECSTaskExecutionRolePolicy covers the common cases" }
verdict: "App calls AWS: add it to the task role. ECS cannot pull the image, ship logs or inject a secret: fix the execution role."
sources:
  - title: "Amazon ECS task IAM role (Amazon ECS Developer Guide)"
    url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html"
    verifiedOn: "2026-10-20"
  - title: "Amazon ECS task execution IAM role (Amazon ECS Developer Guide)"
    url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html"
    verifiedOn: "2026-10-20"
  - title: "Amazon ECS task definition parameters: taskRoleArn and executionRoleArn"
    url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html"
    verifiedOn: "2026-10-20"
