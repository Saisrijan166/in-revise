id: rds-vs-dynamodb
tech: aws
title: "RDS vs DynamoDB"
compares: [rds, dynamodb]
gist:
  - "Relational: tables, SQL, joins"
  - "Key-value: items found by partition key"
explain:
  - "RDS (and Aurora) is a relational database: fixed-schema tables you query with any SQL, including joins and multi-row transactions, scaled mainly by a bigger instance plus read replicas."
  - "DynamoDB is a NoSQL key-value and document store: items found by a partition key, spread over many partitions by the key's hash, so it serves key lookups at almost any scale with steady low latency."
example: "A payment ledger with refunds and monthly reports fits RDS: it needs joins, constraints and transactions. Idempotency keys checked millions of times a second by id fit DynamoDB: a pure key lookup at scale, where a relational instance would strain."
rows:
  - { aspect: "Data model", a: "Tables with a fixed schema, linked by keys", b: "Items with any attributes, grouped by key" }
  - { aspect: "Queries", a: "Any SQL, including ad-hoc joins", b: "Query by table or index key; otherwise Scan" }
  - { aspect: "Transactions", a: "SQL transactions across any rows", b: "TransactWriteItems: up to 100 actions" }
  - { aspect: "Scaling", a: "Bigger instance; read replicas for reads", b: "Items spread over partitions by key hash" }
  - { aspect: "Consistency", a: "Primary is current; replicas lag", b: "Eventually consistent by default; strong on request" }
  - { aspect: "Payment fit", a: "Ledger, refunds, reports", b: "Idempotency keys, status lookup by id" }
verdict: "Choose RDS or Aurora for relational queries and joins; choose DynamoDB when every query is a known key lookup at large scale."
sayIt: "RDS is relational: SQL, joins and transactions, scaled by instance size and read replicas. DynamoDB is key-value, scaling by spreading items over partitions. I use RDS or Aurora for relational queries and the ledger, and DynamoDB when every query is a known key lookup at large scale."
