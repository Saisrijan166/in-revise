id: redis-vs-memcached
tech: aws
title: "Valkey / Redis OSS vs Memcached (ElastiCache)"
compares: [elasticache-valkey-redis-oss, elasticache-memcached]
gist:
  - "Rich types, replicas, failover and backups"
  - "A plain, multithreaded key-value cache"
explain:
  - "Valkey and Redis OSS (on ElastiCache) are feature-rich in-memory stores: strings, hashes, lists, sets, sorted sets, replicas with automatic failover, backups and pub/sub."
  - "Memcached (on ElastiCache) is a plain multithreaded key-value cache: simple values, no replication or failover on node-based clusters, and nothing to persist, meant purely for speed."
example: "A session store that must survive a node failure and hold sorted sets needs Valkey or Redis OSS, with replicas and backups. A pure read cache of small values that can be rebuilt from the database, where you only want the simplest multithreaded cache, suits Memcached."
rows:
  - { aspect: "Data types", a: "Strings, hashes, lists, sets, sorted sets, geo", b: "Simple: strings and objects" }
  - { aspect: "Replication and failover", a: "Yes; failover optional, required in cluster mode", b: "No" }
  - { aspect: "Sharding", a: "Cluster mode enabled: up to 500 shards", b: "Yes, data spread across nodes" }
  - { aspect: "Pub/Sub", a: "Yes", b: "No" }
  - { aspect: "Backup and restore", a: "Yes", b: "Serverless caches only" }
  - { aspect: "Multithreaded (AWS table)", a: "No", b: "Yes" }
verdict: "Pick Valkey or Redis OSS when you need replicas, failover, backups or rich types; Memcached for the simplest cache you can afford to lose."
sayIt: "Valkey or Redis OSS when I need rich data types, replicas with failover, backups or pub/sub. Memcached for the simplest multithreaded key-value cache that I can afford to lose. Most new caches use Valkey, the open-source Redis fork."
