id: iam-user-vs-role
tech: aws
title: "IAM User vs IAM Role"
compares: [iam-user, iam-role]
gist:
  - "A named identity with a long-term password or keys"
  - "An identity trusted callers assume for a short session"
explain:
  - "An IAM user is a fixed identity for one person or application. It has long-term credentials, a password for the console or access keys for the API, that keep working until someone changes or removes them."
  - "An IAM role is an identity with no long-term credentials. A trusted user, service or app assumes it through STS and gets temporary keys that expire, so nothing permanent is stored."
example: "The payment service on ECS gets a task role: the SDK receives temporary keys and renews them, with no key in the image. A build tool on a laptop that cannot assume a role may instead use an IAM user's access keys, protected with MFA."
rows:
  - { aspect: "Credentials", a: "Password and access keys that last until changed", b: "Temporary keys from STS that expire" }
  - { aspect: "Belongs to", a: "One person or one application", b: "Whoever its trust policy allows: users, services, federated people" }
  - { aspect: "Typical use", a: "Tools that cannot use roles, emergency access", b: "Apps on EC2, ECS, Lambda; cross-account; federated sign-in" }
  - { aspect: "AWS best practice", a: "Avoid; rotate keys when needed and require MFA", b: "The default for workloads and for people" }
verdict: "Use roles for apps and federated people; create an IAM user only when a role cannot work, and protect it with MFA."
sayIt: "An IAM user is a fixed identity with long-term credentials; a role is assumed for temporary ones. AWS recommends roles for both apps and people, so I use them everywhere and keep IAM users only for cases a role cannot cover, with MFA on."
sources:
  - title: "IAM roles: when to create an IAM user instead of a role (IAM User Guide)"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html"
    verifiedOn: "2026-10-20"
  - title: "Security best practices in IAM (IAM User Guide)"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"
    verifiedOn: "2026-10-20"
