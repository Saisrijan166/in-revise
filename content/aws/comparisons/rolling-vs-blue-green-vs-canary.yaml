id: rolling-vs-blue-green-vs-canary
tech: aws
title: Rolling vs Blue-Green vs Canary
compares: [rolling-deployment, blue-green-deployment, canary-deployment]
gist:
  - "Replace old tasks with new ones, a batch at a time"
  - "Run a full new copy, then switch all traffic"
  - "Send a small slice first, then the rest"
rows:
  - { aspect: "Traffic moves", a: "Batch by batch as new tasks get healthy", b: "All at once from blue to green", c: "A small percentage first, then everything" }
  - { aspect: "Extra capacity", a: "A little: up to maximumPercent (ECS: 200%)", b: "A second full environment during the switch", c: "The new revision runs beside the old one" }
  - { aspect: "Rollback", a: "Deploy the old revision again (circuit breaker can do it)", b: "Switch traffic back to blue: fast", c: "Move the slice back: fast, few users hit" }
  - { aspect: "Watch out", a: "Old and new versions serve at the same time", b: "Everyone moves at once", c: "Needs good alarms to judge the slice" }
  - { aspect: "On AWS", a: "ECS default; CodeDeploy in-place on EC2", b: "ECS built-in blue/green; CodeDeploy", c: "ECS canary and linear; CodeDeploy; Lambda weighted alias" }
verdict: "Rolling for routine changes; canary for risky changes on payment paths; blue-green when you need one clean switch and an instant switch-back."
