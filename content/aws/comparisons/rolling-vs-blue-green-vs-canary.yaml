id: rolling-vs-blue-green-vs-canary
tech: aws
title: Rolling vs Blue-Green vs Canary
compares: [rolling-deployment, blue-green-deployment, canary-deployment]
gist:
  - "Replace old tasks with new ones, a batch at a time"
  - "Run a full new copy, then switch all traffic"
  - "Send a small slice first, then the rest"
explain:
  - "A rolling update replaces the running tasks with new ones a batch at a time, as each new task passes its health check. It needs almost no extra capacity and is the simplest default, so it suits routine, low-risk changes."
  - "A blue-green deployment runs a full new copy (green) beside the current one (blue), tests it, then switches all traffic at once. Blue stays running during the bake time, so you can switch back instantly: good for one clean cutover with a fast rollback."
  - "A canary deployment sends a small percentage of traffic to the new version first, watches it under real load, then shifts the rest. It limits how many users a bad release can reach, so it suits risky changes on critical paths like payments."
example: "Deploying a new payment-service version on ECS: rolling swaps tasks a few at a time (old and new serve at once briefly); blue-green stands up a whole new task set and flips the load balancer to it, keeping the old set for an instant switch-back; canary sends 10% of payments to the new version, watches 5xx and latency alarms during the canary bake time, then shifts the remaining 90%."
sayIt: "Rolling is my default for routine changes: cheap, a batch at a time. Blue-green when I want one clean switch and an instant switch-back, at the cost of running two full environments. Canary for risky changes on the payment path, so a bad release hits only a small slice and rolls back fast on alarms."
rows:
  - { aspect: "Traffic moves", a: "Batch by batch as new tasks get healthy", b: "All at once from blue to green", c: "A small percentage first, then everything" }
  - { aspect: "Extra capacity", a: "A little: up to maximumPercent (ECS: 200%)", b: "A second full environment during the switch", c: "The new revision runs beside the old one" }
  - { aspect: "Rollback", a: "Deploy the old revision again (circuit breaker can do it)", b: "Switch traffic back to blue: fast", c: "Move the slice back: fast, few users hit" }
  - { aspect: "Watch out", a: "Old and new versions serve at the same time", b: "Everyone moves at once", c: "Needs good alarms to judge the slice" }
  - { aspect: "On AWS", a: "ECS default; CodeDeploy in-place on EC2", b: "ECS built-in blue/green; CodeDeploy", c: "ECS canary and linear; CodeDeploy; Lambda weighted alias" }
verdict: "Rolling for routine changes; canary for risky changes on payment paths; blue-green when you need one clean switch and an instant switch-back."
