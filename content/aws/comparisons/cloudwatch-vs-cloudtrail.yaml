id: cloudwatch-vs-cloudtrail
tech: aws
title: CloudWatch vs CloudTrail
compares: [cloudwatch, cloudtrail]
gist:
  - "How is the system behaving? Metrics, logs, alarms"
  - "Who did what in the account? API call records"
rows:
  - { aspect: "Question it answers", a: "Is the payment API healthy, slow, failing?", b: "Who called which AWS API, when, from where?" }
  - { aspect: "Data", a: "Metrics, log events, alarm states", b: "API events: identity, action, time, source IP" }
  - { aspect: "Kept by default", a: "Logs: never expire; metrics: up to 15 months", b: "Event history: 90 days of management events" }
  - { aspect: "Acts on it", a: "Alarms notify SNS or scale", b: "Records only; send a trail to CloudWatch Logs to alarm" }
  - { aspect: "Typical use", a: "Alerting, scaling, debugging", b: "Security audit, incident review, compliance" }
verdict: "CloudWatch for health and alerts, CloudTrail for audit. Send trail events to CloudWatch Logs to alarm on risky API calls."
sources:
  - title: "Amazon CloudWatch concepts: metrics retention (CloudWatch User Guide)"
    url: "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html"
    verifiedOn: "2026-10-20"
  - title: "What is Amazon CloudWatch Logs? Log retention (CloudWatch Logs User Guide)"
    url: "https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html"
    verifiedOn: "2026-10-20"
  - title: "Working with CloudTrail event history (CloudTrail User Guide)"
    url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html"
    verifiedOn: "2026-10-20"
  - title: "Sending CloudTrail events to CloudWatch Logs (CloudTrail User Guide)"
    url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
    verifiedOn: "2026-10-20"
