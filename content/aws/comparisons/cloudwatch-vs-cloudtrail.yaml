id: cloudwatch-vs-cloudtrail
tech: aws
title: CloudWatch vs CloudTrail
compares: [cloudwatch, cloudtrail]
gist:
  - "How is the system behaving? Metrics, logs, alarms"
  - "Who did what in the account? API call records"
explain:
  - "CloudWatch is the monitoring service. AWS and your app push metrics (numbers over time) and log lines into it, and you build alarms that watch a metric and act when it crosses a threshold. It answers: is the payment API healthy, slow, or failing?"
  - "CloudTrail is the audit log. It records every AWS API call in the account, with the caller, the action, the time and the source IP. It answers: who called which AWS API, when, and from where?"
example: "A payment spike makes the load balancer return 5xx errors: a CloudWatch alarm on the 5xx count fires and pages the on-call engineer. Separately, someone deletes the bucket policy on the receipts bucket: you search CloudTrail for the DeleteBucketPolicy event to see which user did it, when, and from which IP."
sayIt: "CloudWatch tells me how the system is behaving, with metrics, logs and alarms for health and alerting. CloudTrail tells me who did what, with a record of every API call for audit. They complement each other, and I can send trail events to CloudWatch Logs to alarm on risky calls."
rows:
  - { aspect: "Question it answers", a: "Is the payment API healthy, slow, failing?", b: "Who called which AWS API, when, from where?" }
  - { aspect: "Data", a: "Metrics, log events, alarm states", b: "API events: identity, action, time, source IP" }
  - { aspect: "Kept by default", a: "Logs: never expire; metrics: up to 15 months", b: "Event history: 90 days of management events" }
  - { aspect: "Acts on it", a: "Alarms notify SNS or scale", b: "Records only; send a trail to CloudWatch Logs to alarm" }
  - { aspect: "Typical use", a: "Alerting, scaling, debugging", b: "Security audit, incident review, compliance" }
verdict: "CloudWatch for health and alerts, CloudTrail for audit. Send trail events to CloudWatch Logs to alarm on risky API calls."
