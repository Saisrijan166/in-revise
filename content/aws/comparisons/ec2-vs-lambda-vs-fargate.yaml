id: ec2-vs-lambda-vs-fargate
tech: aws
title: "EC2 vs Lambda vs Fargate"
compares: [ec2, lambda, aws-fargate]
gist:
  - "A virtual server: you run the OS and the app"
  - "A function per event: AWS runs everything else"
  - "Containers without servers to manage"
rows:
  - { aspect: "You manage", a: "OS, patches, Java runtime, app", b: "Code and settings only", c: "The image, plus CPU and memory per task" }
  - { aspect: "One run lasts", a: "As long as you like", b: "Up to 15 minutes per invocation", c: "As long as you like; services keep running" }
  - { aspect: "Scales by", a: "An Auto Scaling group adding instances", b: "Lambda adding execution environments", c: "ECS service auto scaling changing task count" }
  - { aspect: "You pay for", a: "Instance time, per second (1-minute minimum)", b: "Requests plus duration per ms, by memory", c: "vCPU, memory and storage, per second" }
  - { aspect: "Spring Boot fit", a: "Run the jar directly", b: "Works, but JVM cold starts need SnapStart", c: "Natural: run the Docker image" }
verdict: "Steady Spring Boot API: ECS on Fargate; short event-driven jobs: Lambda; full OS control or special hardware: EC2."
sources:
  - { title: "Amazon EC2 instance state changes (Amazon EC2 User Guide)", url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html", verifiedOn: "2026-10-20" }
  - { title: "Lambda quotas (AWS Lambda Developer Guide)", url: "https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html", verifiedOn: "2026-10-20" }
  - { title: "AWS Lambda pricing", url: "https://aws.amazon.com/lambda/pricing/", verifiedOn: "2026-10-20" }
  - { title: "AWS Fargate pricing", url: "https://aws.amazon.com/fargate/pricing/", verifiedOn: "2026-10-20" }
  - { title: "Automatically scale your Amazon ECS service (Amazon ECS Developer Guide)", url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html", verifiedOn: "2026-10-20" }
