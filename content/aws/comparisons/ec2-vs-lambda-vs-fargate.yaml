id: ec2-vs-lambda-vs-fargate
tech: aws
title: "EC2 vs Lambda vs Fargate"
compares: [ec2, lambda, aws-fargate]
gist:
  - "A virtual server: you run the OS and the app"
  - "A function per event: AWS runs everything else"
  - "Containers without servers to manage"
explain:
  - "EC2 gives you a whole virtual server. You pick the AMI and instance type and manage the OS, patches, Java runtime and app. It suits long-running workloads and cases needing full OS control or special hardware, at the cost of the maintenance."
  - "Lambda runs a single function when an event arrives and scales by adding execution environments. AWS provides the server, runtime and scaling; you provide only the code. It suits short, spiky work, and each run must finish within 15 minutes."
  - "Fargate runs your container tasks without any servers for you to manage. You give an image and set CPU and memory per task, and AWS provisions, patches and scales the hosts. It suits a steady, always-on service that you ship as a Docker image."
example: "A payment webhook that fires a few times an hour fits Lambda: it runs on the event and costs nothing idle. The always-on payment service fits Fargate: a Docker image that stays warm behind an ALB. A vendor binary that must be tuned on the host and uses a GPU needs EC2, because only EC2 gives you the machine itself."
rows:
  - { aspect: "You manage", a: "OS, patches, Java runtime, app", b: "Code and settings only", c: "The image, plus CPU and memory per task" }
  - { aspect: "One run lasts", a: "As long as you like", b: "Up to 15 minutes per invocation", c: "As long as you like; services keep running" }
  - { aspect: "Scales by", a: "An Auto Scaling group adding instances", b: "Lambda adding execution environments", c: "ECS service auto scaling changing task count" }
  - { aspect: "You pay for", a: "Instance time, per second (1-minute minimum)", b: "Requests plus duration per ms, by memory", c: "vCPU and memory per second (1-minute minimum)" }
  - { aspect: "Cold starts", a: "None once running", b: "On a new environment; cut with SnapStart", c: "None once the task is running" }
  - { aspect: "Spring Boot fit", a: "Run the jar directly", b: "Works; SnapStart cuts JVM cold starts", c: "Natural: run the Docker image" }
verdict: "Steady Spring Boot API: ECS on Fargate; short event-driven jobs: Lambda; full OS control or special hardware: EC2."
sayIt: "EC2 is a server you fully manage, for long-running or special workloads. Lambda is a function per event with no servers, for short spiky work under 15 minutes. Fargate runs my container image without managing servers, which is my default for a steady Spring Boot service."
