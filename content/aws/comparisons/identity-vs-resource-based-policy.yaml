id: identity-vs-resource-based-policy
tech: aws
title: "Identity-based vs Resource-based Policy"
compares: [identity-based-policy, resource-based-policy]
gist:
  - "On the caller: what this user or role may do"
  - "On the resource: who may use this bucket, queue or key"
explain:
  - "An identity-based policy is attached to an IAM user, group or role. It lists what that identity may do, such as letting the payment task role put objects in the receipts bucket."
  - "A resource-based policy is attached to the resource itself, such as an S3 bucket, SQS queue or KMS key. It names who may use that resource, which is how another account or an AWS service gets in."
example: "The payment task role has an identity policy allowing s3:PutObject on payments-receipts/*. An auditor account must read receipts too: the bucket policy names the auditor account as Principal, and the auditor's own role also needs an identity policy allowing s3:GetObject, because cross-account access needs both sides."
rows:
  - { aspect: "Attached to", a: "An IAM user, group or role", b: "A resource: S3 bucket, SQS queue, KMS key, role trust" }
  - { aspect: "Principal element", a: "None; the identity it is attached to", b: "Required: names who gets access" }
  - { aspect: "Managed or inline", a: "Either", b: "Inline only" }
  - { aspect: "Cross-account", a: "Needed in the caller's account", b: "Needed in the resource's account too" }
verdict: "Use identity policies for what your own roles may do; add a resource policy when another account or a service must reach the resource."
sayIt: "An identity policy sits on the user or role and says what it may do; a resource policy sits on the bucket, queue or key and names who may use it in a Principal element. Across accounts, both the caller's identity policy and the resource policy must allow the request."
sources:
  - title: "Identity-based policies and resource-based policies (IAM User Guide)"
    url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html"
    verifiedOn: "2026-10-20"
