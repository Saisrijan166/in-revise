id: api-gateway-vs-alb
tech: aws
title: API Gateway vs Application Load Balancer
compares: [api-gateway, elastic-load-balancing]
gist:
  - "Managed API front door: auth, throttling, stages"
  - "Layer 7 load balancer spreading HTTP across targets"
rows:
  - { aspect: "Main job", a: "Publish and protect APIs", b: "Route requests by path or host to target groups" }
  - { aspect: "Auth built in", a: "IAM, Cognito, Lambda and JWT authorizers; API keys", b: "OIDC or Cognito sign-in; JWT validation action" }
  - { aspect: "Long requests", a: "REST integration timeout 29 s by default", b: "Long-lived connections, WebSockets included" }
  - { aspect: "Pricing", a: "Per request plus data out", b: "Per hour plus capacity units (LCUs)" }
  - { aspect: "Best fit", a: "Lambda APIs, partner APIs with keys, spiky traffic", b: "Steady, high traffic to ECS tasks or EC2" }
verdict: "Lambda or keyed partner APIs: API Gateway. Busy container services: ALB. Both together: API Gateway in front, a VPC link to a private ALB."
sources:
