id: api-gateway-vs-alb
tech: aws
title: API Gateway vs Application Load Balancer
compares: [api-gateway, elastic-load-balancing]
gist:
  - "Managed API front door: auth, throttling, stages"
  - "Layer 7 load balancer spreading HTTP across targets"
explain:
  - "API Gateway is a managed front door for APIs. It authorises, throttles, versions and routes each call, and bills per request, so it suits Lambda APIs, keyed partner APIs and spiky traffic."
  - "An Application Load Balancer is a Layer 7 load balancer that spreads HTTP requests across targets by path or host. It bills per hour and handles steady, high-volume traffic to ECS tasks or EC2 well."
example: "A serverless payment API on Lambda, with per-client API keys, sits behind API Gateway. A busy container service on ECS Fargate sits behind an ALB. To combine them, put API Gateway in front and use a VPC link to a private ALB."
sayIt: "API Gateway is a per-request front door with auth, throttling and keys, best for Lambda or keyed partner APIs. An ALB is a per-hour Layer 7 load balancer, best for steady traffic to containers. For both, API Gateway fronts a private ALB through a VPC link."
rows:
  - { aspect: "Main job", a: "Publish and protect APIs", b: "Route requests by path or host to target groups" }
  - { aspect: "Auth built in", a: "IAM, Cognito, Lambda and JWT authorizers; API keys", b: "OIDC or Cognito sign-in; JWT validation action" }
  - { aspect: "Long requests", a: "REST integration timeout 29 s by default", b: "Long-lived connections, WebSockets included" }
  - { aspect: "Pricing", a: "Per request plus data out", b: "Per hour plus capacity units (LCUs)" }
  - { aspect: "Best fit", a: "Lambda APIs, partner APIs with keys, spiky traffic", b: "Steady, high traffic to ECS tasks or EC2" }
verdict: "Lambda or keyed partner APIs: API Gateway. Busy container services: ALB. Both together: API Gateway in front, a VPC link to a private ALB."
