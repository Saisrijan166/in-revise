    url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table.html"
    verifiedOn: "2026-10-20"
  - title: "Listeners for Application Load Balancers: WebSockets"
    url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html"
    verifiedOn: "2026-10-20"
  - title: "Elastic Load Balancing pricing"
