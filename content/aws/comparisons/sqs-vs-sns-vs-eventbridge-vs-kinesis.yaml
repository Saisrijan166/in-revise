id: sqs-vs-sns-vs-eventbridge-vs-kinesis
tech: aws
title: "SQS vs SNS vs EventBridge vs Kinesis"
compares: [sqs, sns, eventbridge, kinesis]
gist:
  - "A queue: one worker pulls a job and deletes it when done"
  - "Pub/sub: pushes a copy of each message to every subscription"
  - "An event router: filters send events to matching targets"
  - "A stream: an ordered log many apps read and replay"
explain:
  - "SQS is a queue. The sender drops a job in, and one worker pulls it, does it and deletes it. It decouples a producer from workers that run at their own pace, with retries and a dead-letter queue."
  - "SNS is publish/subscribe. You publish a message once and SNS pushes a copy to every subscription, such as SQS queues, Lambda functions or email. It is for fanning one event out to many systems."
  - "EventBridge is a content-based router. Producers put events on a bus, and each consumer's filter picks the events it wants by their JSON. It also ingests AWS and SaaS events and can replay them."
  - "Kinesis is an ordered stream. Records stay for a retention period, and many apps read the same records in shard order, each at its own position, and can replay them. It is for event streams and analytics."
example: "One payment succeeds. SQS holds a receipt-PDF job until one worker builds it. SNS fans the PaymentSucceeded message out to the receipts, ledger and alerts queues at once. EventBridge sends only UPI payments to the fraud check while all payments go to the ledger. Kinesis carries the payment and click stream so fraud scoring and a dashboard each read every event live and can replay it."
rows:
  - { aspect: "Model", a: "Pull: workers poll", b: "Push to subscribers", c: "Push to the targets of matching filters", d: "Pull: apps read shards (enhanced fan-out pushes)" }
  - { aspect: "Who gets a message", a: "One worker, then it is deleted", b: "Every subscription (filter policy allowed)", c: "Targets of every matching filter", d: "Every consumer app, each at its own position" }
  - { aspect: "Order", a: "Best effort; FIFO per message group", b: "Strict order only with FIFO topics", c: "None on a Classic bus; FIFO groups on the new Custom Event Bus", d: "Per shard" }
  - { aspect: "Keeps messages", a: "Up to 14 days", b: "No (FIFO topics can archive)", c: "Classic: only with an archive; new bus: 1-365 days", d: "24 hours to 365 days" }
  - { aspect: "Replay", a: "No", b: "No", c: "Yes (archive, or the new bus)", d: "Yes, within retention" }
  - { aspect: "Payment example", a: "Receipt PDF jobs", b: "PaymentSucceeded to receipts, ledger and alerts", c: "UPI payments only to the fraud check", d: "Payment and click stream for live analytics" }
verdict: "Queue work with SQS, fan out with SNS, route by content with EventBridge, and stream ordered data that many apps must read or replay with Kinesis."
sayIt: "SQS is a queue for one-worker jobs; SNS fans one message out to many subscribers; EventBridge routes events by their content and can replay; Kinesis is an ordered stream many apps read and replay. I pick by whether I need one worker, fan-out, content routing, or a replayable stream."
