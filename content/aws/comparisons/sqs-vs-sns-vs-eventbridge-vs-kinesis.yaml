id: sqs-vs-sns-vs-eventbridge-vs-kinesis
tech: aws
title: "SQS vs SNS vs EventBridge vs Kinesis"
compares: [sqs, sns, eventbridge, kinesis]
gist:
  - "A queue: workers pull jobs and delete them when done"
  - "Pub/sub: pushes a copy to every subscription"
  - "An event router: rules send events to matching targets"
  - "A stream: an ordered log many apps read and replay"
rows:
  - { aspect: "Model", a: "Pull: workers poll", b: "Push to subscribers", c: "Push to the targets of matching rules", d: "Pull: apps read shards" }
  - { aspect: "Who gets a message", a: "One worker, then it is deleted", b: "Every subscription (filters allowed)", c: "Targets of every matching rule", d: "Every consumer app, each at its own position" }
  - { aspect: "Order", a: "Best effort; FIFO per message group", b: "Strict order only with FIFO topics", c: "None on a Classic bus; FIFO groups on the new Custom Event Bus", d: "Per shard" }
  - { aspect: "Keeps messages", a: "Up to 14 days", b: "No (FIFO topics can archive)", c: "Classic: only with an archive; new bus: 1-365 days", d: "24 hours to 365 days" }
  - { aspect: "Payment example", a: "Receipt PDF jobs", b: "PaymentSucceeded to receipts, ledger and alerts", c: "UPI payments only to the fraud check", d: "Payment and click stream for live analytics" }
verdict: "Queue work with SQS, fan out with SNS, route by content with EventBridge, and stream ordered data many apps must replay with Kinesis."
