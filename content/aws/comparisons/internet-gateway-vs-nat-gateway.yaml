id: internet-gateway-vs-nat-gateway
tech: aws
title: Internet Gateway vs NAT Gateway
compares: [internet-gateway, nat-gateway]
gist:
  - "Two-way door between the VPC and the internet"
  - "Outbound-only exit for private subnets"
diagrams:
  - |
    flowchart LR
      I[Internet] <--> G[Internet gateway] <--> A[ALB with public IP]
  - |
    flowchart LR
      T[Task in private subnet] --> N[NAT gateway] --> G[Internet gateway] --> I[Internet]
diagramAlt: "Internet gateway: traffic flows both ways between the internet and an ALB with a public IP. NAT gateway: a task in a private subnet sends traffic out through the NAT gateway and the internet gateway; the internet cannot start a connection back."
rows:
  - { aspect: "Who starts connections", a: "Either side", b: "Only resources inside the VPC" }
  - { aspect: "Serves", a: "Resources with a public IPv4 or IPv6 address", b: "Private-subnet resources with private IPs only" }
  - { aspect: "Addressing", a: "One-to-one NAT to each resource's public IP", b: "Many private IPs share the NAT's Elastic IP" }
  - { aspect: "Placement", a: "Attached to the VPC; redundant, no AZ to pick", b: "Zonal: in one AZ's public subnet. Regional mode spans AZs" }
  - { aspect: "Cost", a: "No charge; data transfer is billed", b: "Per hour plus per GB processed" }
verdict: "Public subnets route to the internet gateway; private subnets route to a NAT gateway (one per AZ) when they must call out."
sources:
  - title: "Internet gateways (VPC User Guide)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html"
    verifiedOn: "2026-10-20"
  - title: "NAT gateways (VPC User Guide)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html"
    verifiedOn: "2026-10-20"
  - title: "Pricing for NAT gateways (VPC User Guide)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html"
    verifiedOn: "2026-10-20"
