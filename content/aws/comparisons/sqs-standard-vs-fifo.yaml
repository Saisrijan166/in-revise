id: sqs-standard-vs-fifo
tech: aws
title: "SQS Standard vs FIFO queue"
compares: [sqs-standard-queue, sqs-fifo-queue]
gist:
  - "Nearly unlimited speed; no promise of order or one delivery"
  - "Order per message group, no duplicates, limited speed"
rows:
  - { aspect: "Order", a: "Best effort: may arrive out of order", b: "Strict order within each message group ID" }
  - { aspect: "Delivery", a: "At least once: duplicates possible", b: "Exactly-once processing: duplicates dropped for 5 minutes" }
  - { aspect: "Throughput", a: "Nearly unlimited API calls per second", b: "300 calls/s per API, 3,000 msg/s with batches of 10; more in high-throughput mode" }
  - { aspect: "Must send", a: "Just the body", b: "A MessageGroupId; a deduplication ID unless content-based dedup is on" }
  - { aspect: "Payment example", a: "Receipt PDF jobs (idempotent worker)", b: "Status updates per payment ID that must apply in order" }
verdict: "Use standard with an idempotent consumer by default; use FIFO only when order per key matters, and group by that key."
sources:
  - title: "Amazon SQS queue types (SQS Developer Guide)"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-queue-types.html"
    verifiedOn: "2026-10-20"
  - title: "Amazon SQS message quotas (SQS Developer Guide)"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html"
    verifiedOn: "2026-10-20"
  - title: "SendMessage: MessageGroupId and MessageDeduplicationId (SQS API Reference)"
    url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SendMessage.html"
    verifiedOn: "2026-10-20"
