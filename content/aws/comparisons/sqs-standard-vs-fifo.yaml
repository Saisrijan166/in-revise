id: sqs-standard-vs-fifo
tech: aws
title: "SQS Standard vs FIFO queue"
compares: [sqs-standard-queue, sqs-fifo-queue]
gist:
  - "Nearly unlimited speed; order and single delivery are not promised"
  - "Order within a message group and no duplicates, at limited speed"
explain:
  - "A standard queue is the default SQS queue. It scales to nearly unlimited messages per second and copies each message across Availability Zones, but it only tries to keep order and can deliver a message more than once."
  - "A FIFO queue keeps messages in order within each message group and removes duplicates sent within 5 minutes, so each message is processed once. The price is lower throughput, and its name must end in .fifo."
example: "Receipt-PDF jobs go on a standard queue: order does not matter and the worker is idempotent, so a rare duplicate is harmless and throughput is high. But status updates for one payment (PENDING, then PAID) must apply in order, so they go on a FIFO queue with the payment ID as the message group ID, which keeps that payment's updates in sequence while other payments process in parallel."
rows:
  - { aspect: "Order", a: "Best effort; may arrive out of order", b: "Strict order within each message group ID" }
  - { aspect: "Delivery", a: "At least once, so duplicates are possible", b: "Exactly-once processing; duplicates dropped for 5 minutes" }
  - { aspect: "Throughput", a: "Nearly unlimited API calls per second", b: "300 calls/s per action, 3,000 msg/s with batches of 10; more in high-throughput mode" }
  - { aspect: "Must send", a: "Just the body", b: "A MessageGroupId; a deduplication ID unless content-based dedup is on" }
  - { aspect: "Name", a: "Any valid name", b: "Must end in .fifo" }
  - { aspect: "Payment example", a: "Receipt PDF jobs (idempotent worker)", b: "Status updates per payment ID that must apply in order" }
verdict: "Use a standard queue with an idempotent consumer by default; use FIFO only when order per key matters, and group by that key."
sayIt: "Standard queues are nearly unlimited but at-least-once with best-effort order, so I pair them with an idempotent worker. FIFO queues keep order within a message group and drop duplicates, at lower throughput, so I use them only when order per key matters, grouping by that key such as the payment ID."
