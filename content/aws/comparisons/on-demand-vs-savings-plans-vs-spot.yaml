id: on-demand-vs-savings-plans-vs-spot
tech: aws
title: "On-Demand vs Savings Plans vs Spot"
compares: [on-demand-instances, savings-plans-option, spot-instances]
gist:
  - "Pay as you go; no commitment"
  - "Commit USD per hour for 1 or 3 years; pay less"
  - "Spare capacity, deepest discount, can be reclaimed"
rows:
  - { aspect: "Discount vs On-Demand", a: "None: the base price", b: "Up to 72% (EC2 Instance), 66% (Compute)", c: "Up to 90%" }
  - { aspect: "Commitment", a: "None", b: "1 or 3 years, USD per hour", c: "None" }
  - { aspect: "Can AWS stop it?", a: "No", b: "No: it is only a billing discount", c: "Yes, after a two-minute warning" }
  - { aspect: "Best for", a: "Spiky, short or unknown load", b: "Steady, always-on base load", c: "Batch and retryable background work" }
  - { aspect: "Reserved Instances", a: "An RI discounts matching On-Demand usage", b: "Same discounts, more flexible; AWS recommends these", c: "Not related" }
verdict: "Savings Plans for the steady base, On-Demand for peaks, Spot only for work that can stop."
