id: on-demand-vs-savings-plans-vs-spot
tech: aws
title: "On-Demand vs Savings Plans vs Spot"
compares: [on-demand-instances, savings-plans-option, spot-instances]
gist:
  - "Pay as you go; no commitment"
  - "Commit to USD per hour for 1 or 3 years; pay less"
  - "Spare capacity, deepest discount, can be reclaimed"
explain:
  - "On-Demand charges by the second while an instance runs, with no commitment. You can start and stop freely, so it fits spiky, short or unpredictable load. It is the base price the other two discount from."
  - "A Savings Plan gives up to 72% off in exchange for committing to a fixed USD-per-hour spend for 1 or 3 years. It is only a billing discount, so AWS never stops your instances. It fits the steady base load you always run."
  - "Spot uses EC2's spare capacity for up to 90% off, but EC2 can reclaim the instance with a two-minute warning. It fits batch jobs and background work that can be interrupted and retried."
example: "The payment service runs 4 instances all year on a Compute Savings Plan, adds 6 On-Demand instances during a sale, and runs a nightly receipt-rebuild job on Spot. If a Spot instance is reclaimed, the job just reruns; the same interruption on the live API would drop payments, which is why the API never runs on Spot alone."
rows:
  - { aspect: "Discount vs On-Demand", a: "None: the base price", b: "Up to 72% (EC2 Instance), 66% (Compute)", c: "Up to 90%" }
  - { aspect: "Commitment", a: "None", b: "1 or 3 years, USD per hour", c: "None" }
  - { aspect: "Can AWS stop it?", a: "No", b: "No: it is only a billing discount", c: "Yes, after a two-minute warning" }
  - { aspect: "Best for", a: "Spiky, short or unknown load", b: "Steady, always-on base load", c: "Batch and retryable background work" }
  - { aspect: "Reserved Instances", a: "An RI discounts matching On-Demand usage", b: "Same discounts, more flexible; AWS recommends these", c: "Not related" }
verdict: "Savings Plans for the steady base, On-Demand for peaks, Spot only for work that can be interrupted."
sayIt: "On-Demand bills per second, no commitment, for spiky load. A Savings Plan commits a fixed hourly spend for 1-3 years for up to 72% off, for the steady base. Spot is spare capacity up to 90% cheaper but reclaimable in two minutes, for retryable work. Base on a plan, peaks On-Demand, batch on Spot."
