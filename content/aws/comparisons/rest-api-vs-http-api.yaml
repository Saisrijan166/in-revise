id: rest-api-vs-http-api
tech: aws
title: "API Gateway: REST API vs HTTP API"
compares: [apigw-rest-api, apigw-http-api]
gist:
  - "More features: keys, usage plans, WAF, caching"
  - "Fewer features, lower price, built-in JWT auth"
explain:
  - "A REST API is the full-featured API Gateway product: API keys, per-client usage plans, AWS WAF, response caching, request validation and private endpoints. Choose it when you need any of those."
  - "An HTTP API is a cut-down, cheaper product with the features most apps need, plus built-in JWT authorizers. Choose it when you do not need the REST-only extras."
example: "A public partner API that needs metered API keys and a WAF rule set goes on a REST API. An internal payment API that only needs JWT auth and routing to Lambda goes on an HTTP API, at lower cost and with automatic deployments."
sayIt: "REST APIs have the full feature set: API keys, usage plans, WAF, caching, request validation and private endpoints. HTTP APIs are cheaper and simpler with built-in JWT auth. I start with an HTTP API and move to REST only when I need a REST-only feature."
rows:
  - { aspect: "Endpoint types", a: "Edge-optimised, Regional, private", b: "Regional only" }
  - { aspect: "Authorisation", a: "IAM, resource policies, Cognito, Lambda", b: "IAM, Lambda, JWT (Cognito through JWT)" }
  - { aspect: "Client management", a: "API keys, usage plans, per-client throttling", b: "None of these" }
  - { aspect: "Extras", a: "AWS WAF, caching, request validation, X-Ray", b: "Automatic deployments, private Cloud Map integrations" }
  - { aspect: "Integration timeout", a: "29 s default; Regional and private can be raised", b: "30 s maximum" }
verdict: "Start with an HTTP API; choose a REST API when you need API keys, usage plans, WAF, caching, request validation or a private endpoint."
