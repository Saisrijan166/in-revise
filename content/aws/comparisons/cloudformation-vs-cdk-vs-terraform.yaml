id: cloudformation-vs-cdk-vs-terraform
tech: aws
title: CloudFormation vs CDK vs Terraform
compares: [cfn-template-stack, cdk-constructs, terraform-state]
gist:
  - "AWS service: a YAML or JSON template becomes a stack"
  - "Real code that synthesises CloudFormation"
  - "HashiCorp tool for any cloud, with a state file"
explain:
  - "CloudFormation is the native AWS IaC service. You write a YAML or JSON template of resources, and it creates them as a stack, previews updates with change sets and rolls back failures: repeatable, reviewable AWS provisioning with no extra tooling."
  - "The CDK lets you define AWS infrastructure in a real language like Java or TypeScript, with loops, conditions and reusable constructs. It synthesises a CloudFormation template, so you get code-level power over the same engine."
  - "Terraform is HashiCorp's IaC tool that works across AWS, Azure, Google Cloud and more through providers. It keeps its own state file and previews with terraform plan, for managing infrastructure that spans more than just AWS with one tool."
example: "To create the receipts S3 bucket plus its policy: in CloudFormation you write about 20 lines of YAML; in CDK you write Bucket.Builder.create(...).versioned(true)...build() in Java and run cdk synth to get that YAML; in Terraform you write an aws_s3_bucket resource in .tf files and run terraform apply, which could sit next to a Cloudflare DNS resource in the same configuration."
sayIt: "On AWS only, I use CloudFormation, or CDK when the team prefers writing infrastructure in Java or TypeScript, since CDK just synthesises CloudFormation. I reach for Terraform when the infrastructure spans multiple clouds or the team already has a Terraform setup and its own state management."
rows:
  - { aspect: "You write", a: "YAML or JSON", b: "Java, TypeScript, Python, C#, Go or JavaScript", c: "Terraform configuration language (.tf files)" }
  - { aspect: "Who keeps state", a: "CloudFormation, in the stack", b: "CloudFormation, in the stack", c: "You: terraform.tfstate, locally or in a remote backend" }
  - { aspect: "Clouds", a: "AWS", b: "AWS", c: "Any platform with a provider" }
  - { aspect: "Preview", a: "Change set", b: "cdk diff", c: "terraform plan" }
  - { aspect: "Failed change", a: "Rolls back to the last stable state", b: "Same: it deploys through CloudFormation", c: "No automatic rollback; fix and apply again" }
verdict: "On AWS only, use CloudFormation, or CDK when the team prefers code; pick Terraform for many clouds or an existing Terraform setup."
