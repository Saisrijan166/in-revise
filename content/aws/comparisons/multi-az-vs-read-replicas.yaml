id: multi-az-vs-read-replicas
tech: aws
title: "RDS Multi-AZ vs Read Replicas"
compares: [multi-az-db-instance, rds-read-replica]
gist:
  - "A hidden standby that takes over when the primary fails"
  - "A readable copy that takes read traffic off the primary"
explain:
  - "Multi-AZ keeps a synchronous standby copy in a second AZ. It serves no traffic; if the primary or its AZ fails, RDS fails over to it automatically, typically in 60-120 seconds, on the same endpoint. It is for availability."
  - "A read replica is a separate, readable copy kept up to date asynchronously. The app sends read-only queries to it to take load off the primary, and it can live in another Region. It solves read scaling, not availability, and lags slightly behind."
example: "The payment primary is in ap-south-1a with a Multi-AZ standby in ap-south-1b: if AZ a fails, the app reconnects to the same endpoint and keeps writing. Separately, a reporting dashboard runs heavy read queries against a read replica, so those queries never slow down the primary that is taking payments."
diagrams:
  - |
    flowchart LR
      App --> P[(Primary AZ-a)]
      P -- "sync" --> S[(Standby AZ-b, no reads)]
  - |
    flowchart LR
      App -- "writes" --> P[(Primary)]
      P -- "async" --> R[(Read replica)]
      App -. "reads" .-> R
diagramAlt: "Multi-AZ: the app talks only to the primary in AZ a, which copies every write synchronously to a standby in AZ b that serves no reads. Read replica: the app writes to the primary, which copies changes asynchronously to a replica the app reads from."
rows:
  - { aspect: "Purpose", a: "Availability: survive an instance or AZ failure", b: "Scale reads, reporting, cross-Region copy" }
  - { aspect: "Serves reads", a: "No", b: "Yes, read-only" }
  - { aspect: "Replication", a: "Synchronous", b: "Asynchronous, so the replica can lag" }
  - { aspect: "On failure", a: "Automatic failover, same endpoint", b: "Manual: you promote it to a standalone database" }
  - { aspect: "Where", a: "Another AZ, same Region", b: "Same Region or another Region" }
verdict: "Turn on Multi-AZ for production availability; add read replicas when reads outgrow the primary. Many apps use both at once."
sayIt: "Multi-AZ keeps a synchronous standby in another AZ for failover only; it serves no reads. A read replica is an asynchronous copy that serves read-only traffic and can lag. I use Multi-AZ for availability and read replicas when reads outgrow the primary; many apps use both."
sources:
