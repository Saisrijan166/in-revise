id: multi-az-vs-read-replicas
tech: aws
title: "RDS Multi-AZ vs Read Replicas"
compares: [multi-az-db-instance, rds-read-replica]
gist:
  - "A hidden standby that takes over on failure"
  - "A readable copy that takes read traffic"
diagrams:
  - |
    flowchart LR
      App --> P[(Primary AZ-a)]
      P -- sync --> S[(Standby AZ-b)]
  - |
    flowchart LR
      App -- writes --> P[(Primary)]
      P -- async --> R[(Read replica)]
      App -. reads .-> R
diagramAlt: "Multi-AZ: the app talks only to the primary in AZ a, which copies every write synchronously to a standby in AZ b. Read replica: the app writes to the primary, which copies changes asynchronously to a replica that the app reads from."
rows:
  - { aspect: "Purpose", a: "Availability: survive an instance or AZ failure", b: "Scale reads, reporting, cross-Region copy" }
  - { aspect: "Serves reads", a: "No", b: "Yes, read-only" }
  - { aspect: "Replication", a: "Synchronous", b: "Asynchronous, so replica lag" }
  - { aspect: "Failover", a: "Automatic, same endpoint", b: "Manual: promote it to a standalone DB" }
  - { aspect: "Where", a: "Another AZ, same Region", b: "Same or another Region" }
verdict: "Turn on Multi-AZ for production availability; add read replicas when reads outgrow the primary. Many apps use both."
sources:
  - title: "Multi-AZ DB instance deployments (Amazon RDS User Guide)"
    url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html"
    verifiedOn: "2026-10-20"
  - title: "Working with DB instance read replicas (Amazon RDS User Guide)"
    url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html"
    verifiedOn: "2026-10-20"
