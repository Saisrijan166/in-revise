id: security-group-vs-nacl
tech: aws
title: Security Group vs Network ACL
compares: [security-group, network-acl]
gist:
  - "Stateful allow-list on each resource"
  - "Stateless allow-and-deny list on each subnet"
rows:
  - { aspect: "Applies to", a: "Resources it is attached to (their network interfaces)", b: "Every resource in the associated subnets" }
  - { aspect: "Rules", a: "Allow only", b: "Allow and deny" }
  - { aspect: "Evaluation", a: "All rules together", b: "Numbered, lowest first; first match wins" }
  - { aspect: "Return traffic", a: "Allowed automatically (stateful)", b: "Needs its own rule (stateless)" }
  - { aspect: "Source can be", a: "CIDR, prefix list or another security group", b: "CIDR only" }
verdict: "Use security groups as the main control; add NACL rules only to deny a range or as a subnet guard rail."
sources:
  - title: "Infrastructure security: compare security groups and network ACLs (VPC User Guide)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html"
    verifiedOn: "2026-10-20"
  - title: "Security group rules (VPC User Guide)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"
    verifiedOn: "2026-10-20"
  - title: "Network ACL rules (VPC User Guide)"
    url: "https://docs.aws.amazon.com/vpc/latest/userguide/nacl-rules.html"
    verifiedOn: "2026-10-20"
