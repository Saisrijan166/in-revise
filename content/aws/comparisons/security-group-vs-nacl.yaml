id: security-group-vs-nacl
tech: aws
title: Security Group vs Network ACL
compares: [security-group, network-acl]
gist:
  - "Stateful allow-list on each resource"
  - "Stateless allow-and-deny list on each subnet"
explain:
  - "A security group is a stateful firewall attached to a resource. It has allow rules only, and because it tracks each connection, the reply to allowed traffic returns automatically. It is the main, precise control."
  - "A network ACL is a stateless filter attached to a subnet. It has both allow and deny rules, and it checks each packet alone, so return traffic needs its own rule. It is a coarse, subnet-wide layer."
example: "To lock down RDS, you put the app in app-sg and the database in db-sg, then allow 5432 on db-sg from app-sg; replies flow back with no extra rule. To block one bad IP range for a whole subnet, which a security group cannot do, you add a NACL deny rule with a low number."
sayIt: "Security groups are stateful allow-lists on resources, so replies are automatic and I can chain them by reference. NACLs are stateless allow-and-deny lists on subnets, so I use them for coarse blocks like denying an IP range."
rows:
  - { aspect: "Applies to", a: "Resources it is attached to (their network interfaces)", b: "Every resource in the associated subnets" }
  - { aspect: "Rules", a: "Allow only", b: "Allow and deny" }
  - { aspect: "Evaluation", a: "All rules together", b: "Numbered, lowest first; first match wins" }
  - { aspect: "Return traffic", a: "Allowed automatically (stateful)", b: "Needs its own rule (stateless)" }
  - { aspect: "Source can be", a: "CIDR, prefix list or another security group", b: "CIDR only" }
verdict: "Use security groups as the main control; add NACL rules only to deny a range or as a subnet guard rail."
sources:
