id: s3-vs-ebs-vs-efs
tech: aws
title: "S3 vs EBS vs EFS"
compares: [s3, ebs-volume, efs-file-system]
gist:
  - "Objects by key over HTTPS, stored in a Region"
  - "A disk for an instance in one AZ"
  - "A shared NFS folder for many servers"
explain:
  - "S3 is object storage: an app stores and reads whole files by bucket and key through an HTTPS API. It keeps any number of files safe, apart from every server."
  - "EBS is block storage: a network disk attached to an EC2 instance in one AZ. It gives a server a lasting disk for its operating system and data."
  - "EFS is file storage: a shared NFS folder that many Linux servers mount at once, across AZs. It lets servers share one set of files through normal file paths."
example: "In the payment system, receipt PDFs go to S3 and the payment row stores their key. A reporting job on EC2 keeps its working data on a gp3 EBS volume. A document tool running on three servers needs one shared folder, so it mounts EFS."
rows:
  - { aspect: "Storage type", a: "Object", b: "Block", c: "File" }
  - { aspect: "How you use it", a: "HTTPS API: SDK, CLI or URL", b: "Attached disk; the OS formats it", c: "NFSv4 mount" }
  - { aspect: "Scope", a: "Region: 3+ AZs (One Zone classes: 1)", b: "One AZ", c: "Regional: 3+ AZs, or One Zone" }
  - { aspect: "Shared by", a: "Any client with permission", b: "One instance (Multi-Attach: io1/io2)", c: "Many instances across AZs at once" }
  - { aspect: "You pay for", a: "GB stored, requests and data out", b: "GB provisioned, plus extra IOPS or throughput", c: "GB per class, plus reads, writes and tiering" }
  - { aspect: "Typical use", a: "Receipt PDFs, backups, static files", b: "Boot disk, a database on EC2", c: "Shared file serving, content sites, home folders" }
verdict: "Files the app reads by key go to S3; a server's own disk is EBS; a folder many Linux servers share is EFS."
sayIt: "S3 is object storage behind an API, spread across AZs: receipts, backups, static files. EBS is a block disk for one instance in one AZ. EFS is a managed NFS share that many Linux instances across AZs mount at once."
