id: iaas-vs-paas-vs-saas
tech: aws
title: "IaaS vs PaaS vs SaaS"
compares: [iaas-model, paas-model, saas-model]
gist:
  - "Rent servers; you run the OS and everything above it"
  - "Bring your code; the provider runs the platform"
  - "Use a finished app; you bring only data and users"
explain:
  - "IaaS rents you the raw building blocks: virtual servers, storage and network. You install the OS, the runtime and your app, and you patch them. It gives the most control, for teams that need it. On AWS, Amazon EC2."
  - "PaaS runs a managed platform for your code. You upload the application and the provider creates the servers, load balancing, scaling and health checks, so you do not procure or patch infrastructure. On AWS, AWS Elastic Beanstalk."
  - "SaaS is a finished application run by the vendor. You do not deploy code at all; you sign in, use it and manage only your data and users. For example a hosted email or CRM product."
example: "To run the Spring Boot payment JAR: with IaaS you launch an EC2 instance, install Java, patch Linux and start the JAR. With PaaS you upload the JAR to Elastic Beanstalk and it provisions the EC2 instances, load balancer and scaling for you. SaaS does not apply, because it is for using someone else's software, not running your own."
diagrams:
  - |
    flowchart TB
      subgraph IaaS
        Y1[You: OS, runtime, app, data] --- P1[AWS: hardware, network]
      end
  - |
    flowchart TB
      subgraph PaaS
        Y2[You: app, data] --- P2[AWS: OS, runtime, servers, scaling]
      end
  - |
    flowchart TB
      subgraph SaaS
        Y3[You: data, users] --- P3[Vendor: everything, the app too]
      end
diagramAlt: "IaaS: you manage the OS, runtime, app and data; AWS manages hardware and network. PaaS: you manage the app and data; AWS manages the OS, runtime, servers and scaling. SaaS: you manage only data and users; the vendor manages everything including the app."
rows:
  - { aspect: "You manage", a: "OS, runtime, middleware, app, data", b: "App and data", c: "Your data and who can use it" }
  - { aspect: "Provider manages", a: "Hardware, virtualisation, storage, network", b: "All that, plus OS and runtime", c: "Everything, the app too" }
  - { aspect: "Control", a: "Most", b: "Medium", c: "Least" }
  - { aspect: "AWS example", a: "Amazon EC2", b: "AWS Elastic Beanstalk", c: "A hosted email or CRM app" }
  - { aspect: "Payment service", a: "Install Java, run the JAR on a VM", b: "Upload the JAR; it provisions and scales", c: "Not for your own code" }
verdict: "Pick the most managed model that still gives the control you need; most AWS backends mix IaaS and managed services."
sayIt: "IaaS rents servers and I run the OS and app, like EC2. PaaS runs my code on a managed platform, like Elastic Beanstalk, so I skip patching and scaling. SaaS is a finished app I only use. I pick the most managed option that still gives the control I need, and most real backends mix them."
