id: iaas-vs-paas-vs-saas
tech: aws
title: "IaaS vs PaaS vs SaaS"
compares: [iaas-model, paas-model, saas-model]
gist:
  - "Rent servers; you run the OS and all above it"
  - "Bring your code; the provider runs the platform"
  - "Use a finished app; you bring data and users"
rows:
  - { aspect: "You manage", a: "OS, runtime, middleware, app, data", b: "App and data", c: "Your data and who can use it" }
  - { aspect: "Provider manages", a: "Hardware, virtualisation, storage, network", b: "All that, plus OS and runtime", c: "Everything, the app too" }
  - { aspect: "Control", a: "Most", b: "Medium", c: "Least" }
  - { aspect: "AWS example", a: "Amazon EC2", b: "AWS Elastic Beanstalk", c: "A hosted email or CRM app" }
  - { aspect: "Payment service", a: "Install Java, run the JAR on a VM", b: "Upload the JAR; it provisions and scales", c: "Not for your own code" }
verdict: "Pick the most managed model that still gives the control you need; most AWS backends mix IaaS and managed services."
