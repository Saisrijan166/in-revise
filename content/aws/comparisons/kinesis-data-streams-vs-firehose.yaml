id: kinesis-data-streams-vs-firehose
tech: aws
title: "Kinesis Data Streams vs Amazon Data Firehose"
compares: [kinesis-data-streams, amazon-data-firehose]
gist:
  - "A stream your own apps read, in order, and can replay"
  - "A no-code pipe that buffers data and loads it into S3 and more"
explain:
  - "Kinesis Data Streams is an ordered log split into shards. You write consumer apps that read records in shard order, each at its own position, and records stay for the retention period so apps can re-read and replay them."
  - "Amazon Data Firehose is a managed delivery pipe. You pick a destination such as S3, Redshift or OpenSearch, and Firehose buffers records and loads them for you, with no consumer code and no replay. It was renamed from Kinesis Data Firehose on 09-02-2024."
example: "To score payments for fraud in real time and keep events for replay, use Data Streams: the app reads the shard as records arrive and can start again from the past. To just land every payment event in S3 for analytics, use Firehose: no code, it buffers and writes to the bucket. Firehose can read from a data stream, so you can do both."
rows:
  - { aspect: "You write", a: "Consumer code (Kinesis Client Library)", b: "No consumer code: pick a destination" }
  - { aspect: "Keeps data", a: "24 hours to 365 days; apps can re-read", b: "No; it buffers, then delivers and forgets" }
  - { aspect: "Delay", a: "Real time: consumers read as records arrive", b: "Buffered: by default up to 5 MiB or 300 s before delivery" }
  - { aspect: "Capacity", a: "Shards: on-demand or provisioned", b: "Fully managed: no shards or servers to run" }
  - { aspect: "Replay", a: "Yes, within the retention period", b: "No" }
  - { aspect: "Payment example", a: "Fraud scoring reads payment events live", b: "Every payment event lands in S3 for analytics" }
verdict: "Use Data Streams when your own apps must process or replay records; use Firehose to load data into S3, Redshift or OpenSearch with no code. Firehose can read from a data stream."
sayIt: "Kinesis Data Streams is a log my apps read in shard order and can replay within the retention period. Amazon Data Firehose is a no-code pipe that buffers records and loads them into S3 or similar, with no replay. I use Streams for real-time processing and Firehose for landing data in a store."
