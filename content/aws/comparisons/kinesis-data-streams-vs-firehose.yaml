id: kinesis-data-streams-vs-firehose
tech: aws
title: "Kinesis Data Streams vs Amazon Data Firehose"
compares: [kinesis-data-streams, amazon-data-firehose]
gist:
  - "A stream your own apps read, in order, and can replay"
  - "A delivery pipe: buffers data and loads it into S3 and more"
rows:
  - { aspect: "You write", a: "Consumer code (Kinesis Client Library)", b: "No consumer code: pick a destination" }
  - { aspect: "Keeps data", a: "24 hours to 365 days; apps can re-read", b: "No; it buffers, then delivers" }
  - { aspect: "Delay", a: "Real time: consumers read as records arrive", b: "Buffered: by default up to 5 MiB or 300 s before delivery" }
  - { aspect: "Capacity", a: "Shards: on-demand or provisioned", b: "Fully managed: no shards or servers to run" }
  - { aspect: "Payment example", a: "Fraud scoring reads payment events live", b: "Every payment event lands in S3 for analytics" }
verdict: "Use Data Streams when your apps must process or replay records; use Firehose to land data in S3, Redshift or OpenSearch with no code. Firehose can read from a data stream."
sources:
  - title: "Kinesis Data Streams terminology and concepts (KDS Developer Guide)"
    url: "https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html"
    verifiedOn: "2026-10-20"
  - title: "What is Amazon Data Firehose? (Firehose Developer Guide)"
    url: "https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html"
    verifiedOn: "2026-10-20"
  - title: "BufferingHints (Amazon Data Firehose API Reference)"
    url: "https://docs.aws.amazon.com/firehose/latest/APIReference/API_BufferingHints.html"
    verifiedOn: "2026-10-20"
  - title: "Introducing Amazon Data Firehose, formerly Kinesis Data Firehose (What's New, 09-02-2024)"
    url: "https://aws.amazon.com/about-aws/whats-new/2024/02/amazon-data-firehose-formerly-kinesis-data-firehose/"
    verifiedOn: "2026-10-20"
