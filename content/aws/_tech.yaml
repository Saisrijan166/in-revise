name: AWS
slug: aws
accent: red
summary: "AWS for Java backend interviews: Regions and AZs, compute, S3, databases, VPC networking, IAM, queues and events, monitoring, IaC, deployments and disaster recovery."
codeLanguages:
  - java
storySpine:
  - step: Buying servers for the peak wastes money on idle machines → rent capacity on demand, scale out and back in, and pay On-Demand, with Savings Plans or on Spot
    cards:
      - cloud-computing-models
      - aws-pricing-models
  - step: One data centre fails and nobody knows who should have patched what → spread every layer over Availability Zones, follow the shared responsibility model and review the design against the Well-Architected pillars
    cards:
      - regions-and-azs
      - shared-responsibility-model
      - well-architected-framework
  - step: One EC2 instance fails and the payment API goes down with it → run instances in two Availability Zones behind a load balancer, managed by an Auto Scaling group
    cards:
      - ec2
      - auto-scaling-groups
      - elastic-load-balancing
  - step: Patching servers for a Spring Boot API and for small webhook jobs wastes the team's time → run the API image on ECS with Fargate and the short event jobs on Lambda
    cards:
      - containers-ecs-eks-fargate
      - lambda
      - compute-choice
  - step: Receipt PDFs sit on one EC2 server's disk, so other servers cannot read them → keep each server's own data on EBS, a shared folder on EFS, and receipts in S3 behind pre-signed URLs
    cards:
      - ebs-and-efs
      - s3
  - step: Customers far from the Region wait for every checkout script and image → cache them at edge locations with CloudFront in front of S3 and the load balancer
    cards:
      - cloudfront
  - step: The payment database on one server dies with its AZ, and reports slow down checkout → run it on RDS or Aurora with a Multi-AZ standby and read replicas
    cards:
      - rds
      - aurora
  - step: Every request rereads merchant config, and some data is just key lookups at huge scale → cache hot reads in ElastiCache and pick DynamoDB only where access is by key
    cards:
      - elasticache
      - dynamodb
      - choosing-a-database
  - step: "The payment API and its database sit open on the internet → put them in a VPC: the ALB in public subnets, tasks and RDS in private subnets, NAT gateways and VPC endpoints for outbound calls, security groups chained ALB → app → DB"
    cards:
      - vpc-and-subnets
      - internet-and-nat-gateways
      - security-groups-and-nacls
      - vpc-endpoints-privatelink
  - step: Clients need one stable name and a managed front door → Route 53 points the domain at the entry point, and API Gateway authorises and throttles each call
    cards:
      - route-53
      - api-gateway
  - step: Access keys in the payment service's config leak, and anyone holding them can call AWS as the app → people sign in through federation, the app runs with an IAM role and short-lived STS keys, and each policy allows only what it needs
    cards:
      - iam-basics
      - iam-policy-evaluation
      - sts-and-temporary-credentials
  - step: The database password sits in the image, receipts sit unencrypted, and bots flood the public API → keep secrets in Secrets Manager, encrypt with KMS keys, and put WAF, Shield and ACM TLS at the edge
    cards:
      - secrets-and-parameters
      - kms-and-encryption
      - edge-security
  - step: The payment API waits while receipt PDFs are made, and a worker crash loses the job → put receipt jobs on an SQS queue that workers poll, finish and delete
    cards:
      - sqs
  - step: Receipts, the ledger, fraud checks and analytics all need each payment event → fan out with SNS, route by content with EventBridge, stream with Kinesis, and run multi-step refunds with Step Functions
    cards:
      - sns
      - eventbridge
      - kinesis
      - step-functions
  - step: Payments fail at night, nobody notices, and nobody can say which hop broke or who changed what → CloudWatch alarms, traces through X-Ray, and CloudTrail for every API call
    cards:
      - cloudwatch
      - x-ray-and-tracing
      - cloudtrail
  - step: Hand-built infrastructure, all-at-once releases and no plan for losing a Region → infrastructure as code, canary or blue-green releases, DR sized by RTO and RPO, SDK 2.x clients with roles, and a need-to-service playbook for the interview
    cards:
      - infrastructure-as-code
      - deployments-on-aws
      - disaster-recovery
      - aws-sdk-for-java
      - aws-architecture-playbook
  - step: "The interviewer says \"write the code to upload a receipt to S3 and queue a job\" → one SDK shape: client builder, request builder, call; RDS stays plain JDBC with the password from Secrets Manager"
    cards:
      - aws-code-templates
topics:
  - id: basics
    title: Cloud and AWS Basics
    order: 1
    blurb: Cloud models, Regions and AZs, who secures what, the Well-Architected pillars and how AWS charges.
  - id: compute
    title: Compute
    order: 2
    blurb: EC2, Auto Scaling, load balancers, Lambda, containers on ECS, EKS and Fargate, and how to pick one.
  - id: storage
    title: Storage and CDN
    order: 3
    blurb: S3 object storage, EBS and EFS disks and shares, and CloudFront at the edge.
  - id: databases
    title: Databases and Caching
    order: 4
    blurb: RDS, Aurora, DynamoDB, ElastiCache and how to choose between them.
  - id: networking
    title: Networking
    order: 5
    blurb: VPCs and subnets, gateways, security groups and NACLs, private endpoints, Route 53 and API Gateway.
  - id: security
    title: IAM and Security
    order: 6
    blurb: IAM identities and policies, temporary credentials, KMS, secrets and edge protection.
  - id: integration
    title: Messaging and Integration
    order: 7
    blurb: SQS, SNS, EventBridge, Kinesis and Step Functions for decoupled, event-driven services.
  - id: operations
    title: Operations, Java and Playbook
    order: 8
    blurb: CloudWatch, CloudTrail, tracing, IaC, deployments, disaster recovery, the Java SDK and an answer playbook.
