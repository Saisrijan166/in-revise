terms:
  - id: cloud-computing-term
    term: Cloud computing
    aka: []
    definition: On-demand delivery of IT resources, such as servers, storage and databases, over the internet with pay-as-you-go pricing.
    see: cloud-computing-models
    source:
      title: What is cloud computing? (AWS)
      url: https://aws.amazon.com/what-is-cloud-computing/
      verifiedOn: 2026-10-20
  - id: iaas
    term: IaaS
    aka:
      - Infrastructure as a Service
    definition: A cloud model where you rent servers, storage and network and manage the OS and everything above it.
    see: cloud-computing-models
    source:
      title: Shared Responsibility Model (AWS Compliance)
      url: https://aws.amazon.com/compliance/shared-responsibility-model/
      verifiedOn: 2026-10-20
  - id: paas
    term: PaaS
    aka:
      - Platform as a Service
    definition: A cloud model where the provider runs hardware, OS and runtime; you deploy and manage only your application.
    see: cloud-computing-models
    source:
      title: What is IaaS? IaaS vs PaaS vs SaaS (AWS)
      url: https://aws.amazon.com/what-is/iaas/
      verifiedOn: 2026-10-20
  - id: saas
    term: SaaS
    aka:
      - Software as a Service
    definition: A finished application run and managed by the vendor; users only sign in and use it.
    see: cloud-computing-models
    source:
      title: Types of cloud computing (AWS)
      url: https://aws.amazon.com/types-of-cloud-computing/
      verifiedOn: 2026-10-20
  - id: elasticity
    term: Elasticity
    aka: []
    definition: Getting resources when load rises and releasing them when it falls, ideally automatically.
    see: cloud-computing-models
    source:
      title: Elasticity (AWS Well-Architected concepts)
      url: https://wa.aws.amazon.com/wellarchitected/2020-07-02T19-33-23/wat.concept.elasticity.en.html
      verifiedOn: 2026-10-20
  - id: scalability
    term: Scalability
    aka: []
    definition: The ability of a system to adapt to a higher level of demand as it grows.
    see: cloud-computing-models
    source:
      title: Scalability (AWS Well-Architected concepts)
      url: https://wa.aws.amazon.com/wellarchitected/2020-07-02T19-33-23/wat.concept.scalability.en.html
      verifiedOn: 2026-10-20
  - id: vertical-scaling
    term: Vertical scaling
    aka:
      - scale up
      - scaling up
    definition: Adding CPU, memory or storage to one machine; capacity stays limited to that one machine.
    see: cloud-computing-models
    source:
      title: Horizontal scaling (AWS Well-Architected concepts)
      url: https://wa.aws.amazon.com/wellarchitected/2020-07-02T19-33-23/wat.concept.horizontal-scaling.en.html
      verifiedOn: 2026-10-20
  - id: horizontal-scaling
    term: Horizontal scaling
    aka:
      - scale out
      - scaling out
    definition: Adding more machines to share the load, instead of making one machine bigger.
    see: cloud-computing-models
    source:
      title: Horizontal scaling (AWS Well-Architected concepts)
      url: https://wa.aws.amazon.com/wellarchitected/2020-07-02T19-33-23/wat.concept.horizontal-scaling.en.html
      verifiedOn: 2026-10-20
  - id: high-availability
    term: High availability
    aka:
      - highly available
    definition: Keeping a workload usable for a high share of time, such as 99.9% uptime, despite failures.
    see: regions-and-azs
    source:
      title: Availability (AWS Well-Architected Reliability Pillar)
      url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html
      verifiedOn: 2026-10-20
  - id: fault-tolerance
    term: Fault tolerance
    aka:
      - fault tolerant
      - fault-tolerant
    definition: Withstanding a part failing and staying available, usually because a spare takes over its work.
    see: regions-and-azs
    source:
      title: "Fault tolerance and fault isolation (AWS whitepaper: Availability and Beyond)"
      url: https://docs.aws.amazon.com/whitepapers/latest/availability-and-beyond-improving-resilience/fault-tolerance-and-fault-isolation.html
      verifiedOn: 2026-10-20
  - id: aws-region
    term: AWS Region
    aka:
      - AWS Regions
    definition: A separate geographic area with its own Availability Zones, isolated from other Regions.
    see: regions-and-azs
    source:
      title: AWS Regions and Availability Zones (User Guide)
      url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
      verifiedOn: 2026-10-20
  - id: availability-zone
    term: Availability Zone
    aka:
      - Availability Zones
      - AZ
      - AZs
    definition: One or more data centres in a Region with their own power and networking, linked by fast fibre.
    see: regions-and-azs
    source:
      title: AWS Regions and Availability Zones (User Guide)
      url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions-availability-zones.html
      verifiedOn: 2026-10-20
  - id: local-zone
    term: Local Zone
    aka:
      - Local Zones
      - AWS Local Zones
    definition: An extension of a Region that puts compute and storage near a large city for low latency.
    see: regions-and-azs
    source:
      title: What is AWS Local Zones?
      url: https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html
      verifiedOn: 2026-10-20
  - id: edge-location
    term: Edge location
    aka:
      - edge locations
    definition: A CloudFront site close to users that serves cached content, fetching from the origin on a miss.
    see: regions-and-azs
    source:
      title: What is Amazon CloudFront?
      url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
      verifiedOn: 2026-10-20
  - id: aws-outposts
    term: AWS Outposts
    aka:
      - Outposts
    definition: A fully managed service that runs AWS infrastructure and APIs in your own data centre.
    see: regions-and-azs
    source:
      title: What is AWS Outposts?
      url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
      verifiedOn: 2026-10-20
  - id: shared-responsibility-term
    term: Shared responsibility model
    aka: []
    definition: AWS secures the cloud's infrastructure; the customer secures data, access and configuration in it.
    see: shared-responsibility-model
    source:
      title: Shared Responsibility Model (AWS)
      url: https://aws.amazon.com/compliance/shared-responsibility-model/
      verifiedOn: 2026-10-20
  - id: well-architected-term
    term: AWS Well-Architected Framework
    aka:
      - Well-Architected Framework
      - Well-Architected
    definition: AWS's best practices and review questions for building workloads, grouped into six pillars.
    see: well-architected-framework
    source:
      title: "AWS Well-Architected Framework: introduction"
      url: https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html
      verifiedOn: 2026-10-20
  - id: pay-as-you-go
    term: Pay-as-you-go
    aka:
      - pay as you go
    definition: Paying only for the services you use, for as long as you use them, with no long-term contract.
    see: aws-pricing-models
    source:
      title: How AWS pricing works (AWS)
      url: https://aws.amazon.com/pricing/
      verifiedOn: 2026-10-20
  - id: on-demand-instance
    term: On-Demand Instance
    aka:
      - On-Demand Instances
      - On-Demand pricing
    definition: An EC2 instance paid by the second while it runs, with no commitment.
    see: aws-pricing-models
    source:
      title: Amazon EC2 billing and purchasing options
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
      verifiedOn: 2026-10-20
  - id: savings-plans
    term: Savings Plans
    aka:
      - Savings Plan
      - Compute Savings Plans
    definition: A 1- or 3-year commitment to a fixed USD-per-hour spend on eligible usage, in return for lower prices.
    see: aws-pricing-models
    source:
      title: What are Savings Plans?
      url: https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html
      verifiedOn: 2026-10-20
  - id: reserved-instance
    term: Reserved Instance
    aka:
      - Reserved Instances
      - RI
      - RIs
    definition: A billing discount on On-Demand usage that matches a committed instance type and Region for 1 or 3 years.
    see: aws-pricing-models
    source:
      title: Reserved Instances overview (Amazon EC2)
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html
      verifiedOn: 2026-10-20
  - id: spot-instance
    term: Spot Instance
    aka:
      - Spot Instances
      - EC2 Spot
    definition: An instance on spare EC2 capacity, priced below On-Demand, that EC2 can take back.
    see: aws-pricing-models
    source:
      title: Spot Instances (Amazon EC2)
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html
      verifiedOn: 2026-10-20
  - id: spot-interruption-notice
    term: Spot interruption notice
    aka:
      - Spot Instance interruption notice
      - two-minute warning
    definition: A warning two minutes before EC2 stops or terminates a Spot Instance, via EventBridge and instance metadata.
    see: aws-pricing-models
    source:
      title: Spot Instance interruption notices (Amazon EC2)
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html
      verifiedOn: 2026-10-20
  - id: aws-free-tier
    term: AWS Free Tier
    aka:
      - Free Tier
    definition: Free credits for new accounts plus monthly free usage of over 30 always-free services.
    see: aws-pricing-models
    source:
      title: Explore AWS services with AWS Free Tier
      url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/free-tier.html
      verifiedOn: 2026-10-20
  - id: aws-budgets
    term: AWS Budgets
    aka: []
    definition: Sets cost or usage budgets and alerts on actual or forecast spend.
    see: aws-pricing-models
    source:
      title: Managing your costs with AWS Budgets
      url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
      verifiedOn: 2026-10-20
  - id: aws-cost-explorer
    term: AWS Cost Explorer
    aka:
      - Cost Explorer
    definition: A billing console tool to view and analyse your AWS cost and usage over time.
    see: aws-pricing-models
    source:
      title: Analyzing your costs with AWS Cost Explorer
      url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html
      verifiedOn: 2026-10-20
  - id: data-transfer-out
    term: Data transfer out (AWS)
    aka:
      - data transfer out
    definition: Charge per GB for data leaving AWS to the internet; the first 100 GB a month are free.
    see: aws-pricing-models
    source:
      title: "Amazon EC2 On-Demand pricing: data transfer"
      url: https://aws.amazon.com/ec2/pricing/on-demand/
      verifiedOn: 2026-10-20
  - id: instance-type
    term: Instance type
    aka:
      - EC2 instance type
    definition: An EC2 size and family name, such as m7g.large, that sets vCPUs, memory and hardware.
    see: ec2
    source:
      title: Amazon EC2 instance type naming conventions
      url: https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-type-names.html
      verifiedOn: 2026-10-20
  - id: ami
    term: AMI
    aka:
      - Amazon Machine Image
    definition: "The image an EC2 instance boots from: OS, software and a disk mapping."
    see: ec2
    source:
      title: Amazon Machine Images in Amazon EC2
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html
      verifiedOn: 2026-10-20
  - id: user-data
    term: User data (EC2)
    aka:
      - EC2 user data
      - user data script
    definition: A script or cloud-init config that runs as root when an instance first launches.
    see: ec2
    source:
      title: Run commands when you launch an EC2 instance with user data input
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html
      verifiedOn: 2026-10-20
  - id: imdsv2
    term: IMDSv2
    aka:
      - Instance Metadata Service
      - instance metadata
    definition: Token-based access to instance metadata at 169.254.169.254; a PUT request returns the session token.
    see: ec2
    source:
      title: Use the Instance Metadata Service to access instance metadata
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
      verifiedOn: 2026-10-20
  - id: instance-store
    term: Instance store
    aka:
      - instance store volume
    definition: Temporary block storage on disks attached to the host; its data does not survive a stop.
    see: ec2
    source:
      title: Instance store temporary block storage for EC2 instances
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html
      verifiedOn: 2026-10-20
  - id: aws-graviton
    term: AWS Graviton
    aka:
      - Graviton
    definition: Arm-based processors designed by AWS; shown by a g in the instance type, as in m7g.
    see: ec2
    source:
      title: Amazon EC2 instance type naming conventions
      url: https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-type-names.html
      verifiedOn: 2026-10-20
  - id: launch-template
    term: Launch template
    definition: Saved launch settings, such as AMI, instance type and security groups, used by an Auto Scaling group.
    see: auto-scaling-groups
    source:
      title: Auto Scaling launch templates
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/launch-templates.html
      verifiedOn: 2026-10-20
  - id: auto-scaling-group-term
    term: Auto Scaling group
    aka:
      - ASG
    definition: A set of EC2 instances kept between a minimum and maximum size, with unhealthy ones replaced.
    see: auto-scaling-groups
    source:
      title: What is Amazon EC2 Auto Scaling?
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
      verifiedOn: 2026-10-20
  - id: desired-capacity
    term: Desired capacity
    definition: The number of instances an Auto Scaling group tries to keep running right now.
    see: auto-scaling-groups
    source:
      title: What is Amazon EC2 Auto Scaling?
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
      verifiedOn: 2026-10-20
  - id: target-tracking-scaling
    term: Target tracking scaling
    aka:
      - target tracking policy
    definition: A scaling policy that adds or removes capacity to keep a metric near a chosen value.
    see: auto-scaling-groups
    source:
      title: Target tracking scaling policies for Amazon EC2 Auto Scaling
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
      verifiedOn: 2026-10-20
  - id: application-load-balancer
    term: Application Load Balancer
    aka:
      - ALB
    definition: A layer 7 load balancer that routes HTTP and HTTPS requests by listener rules.
    see: elastic-load-balancing
    source:
      title: What is an Application Load Balancer?
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      verifiedOn: 2026-10-20
  - id: network-load-balancer
    term: Network Load Balancer
    aka:
      - NLB
    definition: A layer 4 load balancer for TCP, UDP and TLS that can handle millions of requests per second.
    see: elastic-load-balancing
    source:
      title: What is a Network Load Balancer?
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
      verifiedOn: 2026-10-20
  - id: elb-listener
    term: Listener (ELB)
    aka:
      - load balancer listener
      - HTTPS listener
    definition: The protocol and port a load balancer accepts connections on, with rules that pick a target group.
    see: elastic-load-balancing
    source:
      title: What is an Application Load Balancer?
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      verifiedOn: 2026-10-20
  - id: target-group
    term: Target group
    definition: A set of targets, such as instances, IPs or Lambda, with one health check, that a load balancer routes to.
    see: elastic-load-balancing
    source:
      title: Target groups for your Application Load Balancers
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html
      verifiedOn: 2026-10-20
  - id: cross-zone-load-balancing
    term: Cross-zone load balancing
    definition: Each load balancer node spreads traffic over targets in all enabled Availability Zones, not just its own.
    see: elastic-load-balancing
    source:
      title: How Elastic Load Balancing works
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
      verifiedOn: 2026-10-20
  - id: sticky-sessions
    term: Sticky sessions
    aka:
      - session affinity
    definition: A cookie makes the load balancer send one client to the same target each time.
    see: elastic-load-balancing
    source:
      title: Edit target group attributes for your Application Load Balancer
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
      verifiedOn: 2026-10-20
  - id: deregistration-delay
    term: Deregistration delay
    aka:
      - connection draining
    definition: Time a load balancer waits for in-flight requests before removing a target; 300 seconds by default.
    see: elastic-load-balancing
    source:
      title: Edit target group attributes for your Application Load Balancer
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
      verifiedOn: 2026-10-20
  - id: cold-start
    term: Cold start
    definition: Extra delay when Lambda must create a new execution environment and run init code first.
    see: lambda
    source:
      title: Understanding the Lambda execution environment lifecycle
      url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html
      verifiedOn: 2026-10-20
  - id: lambda-snapstart
    term: Lambda SnapStart
    aka:
      - SnapStart
    definition: Lambda resumes new environments from a snapshot taken when a version is published, cutting startup time.
    see: lambda
    source:
      title: Improving startup performance with Lambda SnapStart
      url: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html
      verifiedOn: 2026-10-20
  - id: provisioned-concurrency
    term: Provisioned concurrency
    definition: A number of Lambda environments kept initialised and ready; it costs extra.
    see: lambda
    source:
      title: Configuring provisioned concurrency for a function
      url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
      verifiedOn: 2026-10-20
  - id: reserved-concurrency
    term: Reserved concurrency
    definition: Concurrency set aside for one Lambda function, which also caps it; no charge.
    see: lambda
    source:
      title: Configuring provisioned concurrency for a function
      url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
      verifiedOn: 2026-10-20
  - id: execution-environment-lambda
    term: Execution environment (Lambda)
    aka:
      - Lambda execution environment
    definition: The isolated runtime where Lambda runs a function; reused across invocations while warm.
    see: lambda
    source:
      title: Understanding the Lambda execution environment lifecycle
      url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html
      verifiedOn: 2026-10-20
  - id: event-source-mapping
    term: Event source mapping
    definition: A Lambda resource that reads a queue or stream and invokes the function with batches of records.
    see: lambda
    source:
      title: Understanding Lambda Event Function invocation methods
      url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-invocation.html
      verifiedOn: 2026-10-20
  - id: amazon-ecs
    term: Amazon ECS
    aka:
      - Elastic Container Service
      - ECS
    definition: AWS's fully managed container orchestration service.
    see: containers-ecs-eks-fargate
    source:
      title: What is Amazon Elastic Container Service?
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html
      verifiedOn: 2026-10-20
  - id: task-definition
    term: Task definition (ECS)
    aka:
      - ECS task definition
      - task definition
    definition: "A JSON blueprint for an ECS task: container images, CPU, memory, ports, roles and logging."
    see: containers-ecs-eks-fargate
    source:
      title: Amazon ECS task definitions
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definitions.html
      verifiedOn: 2026-10-20
  - id: ecs-service
    term: Service (ECS)
    aka:
      - ECS service
    definition: Keeps a desired number of ECS tasks running and replaces any that stop.
    see: containers-ecs-eks-fargate
    source:
      title: Amazon ECS task definitions
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definitions.html
      verifiedOn: 2026-10-20
  - id: aws-fargate
    term: AWS Fargate
    aka:
      - Fargate
    definition: "Serverless compute for ECS tasks and EKS pods: you set CPU and memory, AWS runs the servers."
    see: containers-ecs-eks-fargate
    source:
      title: Architect for AWS Fargate for Amazon ECS
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
      verifiedOn: 2026-10-20
  - id: amazon-eks
    term: Amazon EKS
    aka:
      - Elastic Kubernetes Service
      - EKS
    definition: Managed Kubernetes on AWS; AWS runs the control plane, and Auto Mode also manages nodes.
    see: containers-ecs-eks-fargate
    source:
      title: What is Amazon EKS?
      url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
      verifiedOn: 2026-10-20
  - id: amazon-ecr
    term: Amazon ECR
    aka:
      - Elastic Container Registry
      - ECR
    definition: AWS's managed registry for Docker and OCI container images, with IAM access control.
    see: containers-ecs-eks-fargate
    source:
      title: What is Amazon Elastic Container Registry?
      url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
      verifiedOn: 2026-10-20
  - id: container-orchestration
    term: Container orchestration
    aka:
      - orchestrator
    definition: Software that places containers, checks their health, scales them and replaces failed ones.
    see: containers-ecs-eks-fargate
    source:
      title: What is Amazon Elastic Container Service?
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html
      verifiedOn: 2026-10-20
  - id: amazon-s3
    term: Amazon S3
    aka:
      - Simple Storage Service
    definition: "AWS object storage: files are stored as objects in buckets and read over an HTTPS API."
    see: s3
    source:
      title: What is Amazon S3? (S3 User Guide)
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      verifiedOn: 2026-10-20
  - id: s3-bucket
    term: S3 bucket
    aka:
      - general purpose bucket
    definition: A named container for objects, created in one Region; its name cannot be changed later.
    see: s3
    source:
      title: What is Amazon S3? (S3 User Guide)
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      verifiedOn: 2026-10-20
  - id: object-key
    term: Object key (S3)
    aka:
      - object key
      - key name
    definition: The unique name of an object in a bucket, such as receipts/2026/pay_123.pdf.
    see: s3
    source:
      title: What is Amazon S3? (S3 User Guide)
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
      verifiedOn: 2026-10-20
  - id: s3-storage-class
    term: S3 storage class
    aka:
      - S3 storage classes
    definition: Set per object; trades storage price against access speed, retrieval fees and minimum days.
    see: s3
    source:
      title: Understanding and managing Amazon S3 storage classes (S3 User Guide)
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
      verifiedOn: 2026-10-20
  - id: s3-intelligent-tiering
    term: S3 Intelligent-Tiering
    aka: []
    definition: A storage class that moves objects to cheaper tiers after 30 or 90 days without access.
    see: s3
    source:
      title: Understanding and managing Amazon S3 storage classes (S3 User Guide)
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
      verifiedOn: 2026-10-20
  - id: s3-glacier
    term: S3 Glacier
    aka:
      - S3 Glacier Deep Archive
      - S3 Glacier Flexible Retrieval
      - S3 Glacier Instant Retrieval
    definition: "The archive storage classes: cheapest storage, with minimum days and retrieval fees; some need a restore first."
    see: s3
    source:
      title: Understanding and managing Amazon S3 storage classes (S3 User Guide)
