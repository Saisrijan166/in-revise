id: switch-vs-router
tech: os-networking
title: Switch vs Router
compares: [switch, router]
gist:
  - "Inside one LAN: forwards frames by MAC address"
  - "Between networks: forwards packets by IP address"
explain:
  - "A switch works at layer 2. It connects devices inside one local network and forwards frames by destination MAC address, learning which MAC sits behind each port. It makes a single LAN work."
  - "A router works at layer 3. It connects different networks and forwards packets by destination IP address, choosing the next hop by longest prefix match. It is how a packet leaves its own network and reaches the Internet."
example: "Two laptops on the same office Wi-Fi reach each other through the switch, by MAC, never leaving the LAN. When one opens a website, that traffic is on another network, so it goes to the default gateway (a router), which forwards it out hop by hop by IP."
sayIt: "A switch joins devices inside one network and forwards frames by MAC address at layer 2. A router joins different networks and forwards packets by IP at layer 3, picking the next hop by longest prefix match. You need a router to leave your own subnet."
rows:
  - { aspect: "OSI layer", a: "2, data link", b: "3, network" }
  - { aspect: "Address it reads", a: "Destination MAC", b: "Destination IP" }
  - { aspect: "Table", a: "MAC table, learned from source MACs", b: "Routing table, longest prefix match" }
  - { aspect: "Unknown destination", a: "Floods the frame to all other ports", b: "Default route, or drop and ICMP unreachable" }
  - { aspect: "Link broadcasts", a: "Floods them across the LAN", b: "Does not forward them" }
verdict: "A switch joins devices in one network; you need a router to leave your subnet. A hub (layer 1) just repeats bits to every port."
sources:
