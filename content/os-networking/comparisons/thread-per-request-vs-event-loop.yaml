id: thread-per-request-vs-event-loop
tech: os-networking
title: Thread-per-request vs Event Loop
compares: [thread-per-request, event-loop]
gist:
  - "One thread per request; it blocks on I/O"
  - "A few threads; callbacks run when I/O is ready"
rows:
  - { aspect: "Threads", a: "A large pool (Tomcat under Spring MVC)", b: "One loop thread (Node.js) or about one per CPU core (WebFlux)" }
  - { aspect: "Cost per waiting connection", a: "A thread stack (Java on Linux x64: 1 MB default)", b: "No thread of its own while it waits" }
  - { aspect: "Code style", a: "Plain blocking code", b: "Callbacks or reactive chains" }
  - { aspect: "Main risk", a: "Slow I/O uses up every pool thread", b: "One blocking or CPU-heavy callback stalls the loop" }
  - { aspect: "Examples", a: "Tomcat with Spring MVC", b: "Nginx, Node.js, Reactor Netty with Spring WebFlux" }
verdict: "Default to thread-per-request, now cheap with Java 21 virtual threads; pick an event loop for very many mostly idle connections."
