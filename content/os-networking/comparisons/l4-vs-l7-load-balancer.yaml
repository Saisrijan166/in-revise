id: l4-vs-l7-load-balancer
tech: os-networking
title: L4 vs L7 Load Balancer
compares: [l4-load-balancer, l7-load-balancer]
gist:
  - "Forwards whole connections by IP and port"
  - "Reads HTTP and routes each request"
explain:
  - "An L4 load balancer works at the transport layer. It sees only IP addresses and ports, so it forwards whole TCP or UDP connections to a backend without looking inside. It is fast and works for any protocol."
  - "An L7 load balancer works at the application layer. It reads the HTTP request, so it can route each request by host, URL path, header or cookie, and rewrite headers. It understands the traffic, at some cost in speed."
example: "Requests to /api/orders should go to the orders service and /api/payments to the payments service. An L7 balancer reads the path and routes each request accordingly. An L4 balancer cannot see the path, so it would send a whole connection to one backend regardless of which URL each request asks for."
sayIt: "An L4 load balancer forwards connections by IP and port, so it is fast and protocol-agnostic. An L7 load balancer reads HTTP, so it can route by path or host, rewrite headers and do cookie stickiness. I pick L7 for HTTP routing and L4 for raw speed or non-HTTP traffic."
rows:
  - { aspect: "Looks at", a: "IP address, port, TCP or UDP", b: "Host, path, headers, cookies" }
  - { aspect: "Decides once per", a: "Connection", b: "Request" }
  - { aspect: "TLS", a: "Passes it through, or terminates it (AWS NLB TLS listener)", b: "Terminates it to read HTTP, may re-encrypt" }
  - { aspect: "Good at", a: "Speed, any TCP or UDP protocol", b: "Path routing, header rewrite, cookie stickiness" }
  - { aspect: "Examples", a: "AWS NLB, HAProxy TCP mode", b: "AWS ALB, HAProxy HTTP mode, Nginx" }
verdict: "Use L7 for HTTP routing and features; use L4 for raw speed, non-HTTP traffic or end-to-end TLS."
