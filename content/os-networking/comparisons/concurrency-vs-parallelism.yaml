id: concurrency-vs-parallelism
tech: os-networking
title: Concurrency vs Parallelism
compares: [concurrency, parallelism]
gist:
  - "Many tasks in progress, taking turns"
  - "Many tasks running at the same instant"
explain:
  - "Concurrency is a program structured so many tasks are in progress at once and share the CPU by taking turns. It solves the problem of keeping many waiting tasks moving; one core is enough."
  - "Parallelism is many tasks running in the very same instant, each on its own core. It solves the problem of finishing CPU-heavy work faster by doing pieces of it literally at the same time."
example: "A payment server on one core serves 100 connections by running a little of each in turn (concurrency); while one waits on PostgreSQL, another runs. A CPU-heavy report split into 4 threads on 4 cores computes all 4 parts in the same instant (parallelism)."
diagrams:
  - |
    flowchart LR
      C1["Core 1"] --> A1[A] --> B1[B] --> A2[A] --> C[C]
  - |
    flowchart LR
      C1["Core 1"] --> A[A runs]
      C2["Core 2"] --> B[B runs]
diagramAlt: "Concurrency: one core runs task A, then B, then A again, then C, switching between them. Parallelism: core 1 runs A while core 2 runs B at the same time."
rows:
  - { aspect: "Is about", a: "Structure: dealing with many things at once", b: "Execution: doing many things at once" }
  - { aspect: "Needs several cores", a: "No: one core can switch between tasks", b: "Yes: one task per core" }
  - { aspect: "Main gain", a: "Progress while other tasks wait on I/O", b: "CPU-heavy work finishes sooner" }
  - { aspect: "Server example", a: "One core serves request B while A waits on PostgreSQL", b: "Two cores each run a request's code at the same moment" }
verdict: "A server needs concurrency first, because requests mostly wait; parallelism speeds up only the CPU part."
sayIt: "Concurrency is dealing with many tasks at once by interleaving them, so one core is enough. Parallelism is running them in the same instant, which needs several cores. A server needs concurrency because requests mostly wait on I/O."
sources:
