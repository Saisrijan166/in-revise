id: preemptive-vs-non-preemptive
tech: os-networking
title: Preemptive vs Non-Preemptive Scheduling
compares: [preemptive-scheduling, non-preemptive-scheduling]
gist:
  - "The kernel can stop a running job, e.g. on a timer"
  - "A job keeps the CPU until it ends, blocks or yields"
explain:
  - "Preemptive scheduling lets the kernel take the CPU back from a running job, usually on a timer interrupt, and hand it to another. No single job can hold a core for long, so response stays good even when one job runs forever. It keeps a shared machine fair."
  - "Non-preemptive scheduling lets a job keep the CPU until it finishes, blocks or voluntarily yields. There are fewer context switches and simpler logic, but one long or looping job delays everyone behind it. It fits only batch work or code trusted to yield."
example: "Two jobs are ready: a 10-second compute job and a quick 50 ms task. Non-preemptively, if the long job runs first the quick task waits 10 seconds. Preemptively, a timer interrupt stops the long job after each slice, so the quick task runs almost at once and the long job finishes a little later."
sayIt: "Preemptive scheduling lets the kernel stop a running job on a timer and switch, so no job hogs a core; general-purpose kernels like Linux do this. Non-preemptive lets a job run until it ends or yields, which is simpler but lets one long job block the rest, so it suits only batch work."
rows:
  - { aspect: "Who gives up the CPU", a: "The kernel takes it, via a timer interrupt", b: "The job, by finishing, blocking or yielding" }
  - { aspect: "Examples", a: "SRTF, round robin, Linux EEVDF", b: "FCFS, SJF" }
  - { aspect: "Response time", a: "Good: no job hogs a core", b: "Poor: one long job delays all" }
  - { aspect: "Overhead", a: "More context switches", b: "Fewer switches, simpler" }
  - { aspect: "Endless loop in a job", a: "Still gets stopped", b: "Holds the CPU; only a reboot helps" }
verdict: "General-purpose kernels are preemptive; non-preemptive fits only batch jobs or code trusted to yield."
sources:
