id: preemptive-vs-non-preemptive
tech: os-networking
title: Preemptive vs Non-Preemptive Scheduling
compares: [preemptive-scheduling, non-preemptive-scheduling]
gist:
  - "The kernel can stop a running job, e.g. on a timer"
  - "A job keeps the CPU until it ends, blocks or yields"
rows:
  - { aspect: "Who gives up the CPU", a: "The kernel takes it, via a timer interrupt", b: "The job, by finishing, blocking or yielding" }
  - { aspect: "Examples", a: "SRTF, round robin, Linux EEVDF", b: "FCFS, SJF" }
  - { aspect: "Response time", a: "Good: no job hogs a core", b: "Poor: one long job delays all" }
  - { aspect: "Overhead", a: "More context switches", b: "Fewer switches, simpler" }
  - { aspect: "Endless loop in a job", a: "Still gets stopped", b: "Holds the CPU; only a reboot helps" }
verdict: "General-purpose kernels are preemptive; non-preemptive fits only batch jobs or code trusted to yield."
sources:
  - title: "Scheduling: Introduction, aside on preemptive schedulers (OSTEP)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched.pdf"
    verifiedOn: "2026-10-20"
  - title: "Mechanism: Limited Direct Execution, cooperative vs non-cooperative approach (OSTEP)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-mechanisms.pdf"
    verifiedOn: "2026-10-20"
  - title: "EEVDF Scheduler (Linux kernel documentation)"
    url: "https://docs.kernel.org/scheduler/sched-eevdf.html"
    verifiedOn: "2026-10-20"
