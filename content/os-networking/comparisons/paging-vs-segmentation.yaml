id: paging-vs-segmentation
tech: os-networking
title: Paging vs Segmentation
compares: [paging, segmentation]
gist:
  - "Fixed-size pages, each placed in any free frame"
  - "Variable-size segments: code, heap, stack"
explain:
  - "Paging splits memory into fixed-size pages (4 KiB on x86-64) and maps each page to any free RAM frame through a page table. It solves external fragmentation, because any page fits in any frame."
  - "Segmentation splits memory into variable-size segments that match the program's logical parts, such as code, heap and stack, each with its own base and size. It matches how a program is organised, but leaves awkward gaps."
example: "To place a 10 KiB region, paging uses three 4 KiB frames anywhere in RAM, wasting only the unused tail of the last page (internal fragmentation). Segmentation needs one free 10 KiB hole in a row; if free memory is scattered in smaller holes, it cannot fit even though the total is enough (external fragmentation)."
rows:
  - { aspect: "Unit", a: "Fixed size (4 KiB on x86-64)", b: "Variable size, one per logical part" }
  - { aspect: "Translation", a: "A page table per process", b: "A base and a bounds (size) per segment" }
  - { aspect: "Wasted space", a: "Internal fragmentation: unused tail of a page", b: "External fragmentation: free holes between segments" }
  - { aspect: "Free space", a: "Any free frame fits any page", b: "Needs one free gap big enough for the segment" }
  - { aspect: "On x86-64 today", a: "The main mechanism", b: "Mostly disabled in 64-bit mode" }
verdict: "Modern systems use paging; know segmentation as the older idea that explains external fragmentation."
sayIt: "Paging uses fixed-size pages placed in any free frame, mapped by a page table, so it avoids external fragmentation. Segmentation uses variable-size segments matching logical parts, each with a base and bound. x86-64 uses paging; segmentation is mostly disabled in 64-bit mode."
