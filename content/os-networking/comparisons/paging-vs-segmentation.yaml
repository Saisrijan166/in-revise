    verifiedOn: "2026-10-20"
  - title: "Paging: Introduction (OSTEP ch. 18)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/vm-paging.pdf"
    verifiedOn: "2026-10-20"
