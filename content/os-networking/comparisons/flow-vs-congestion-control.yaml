id: flow-vs-congestion-control
tech: os-networking
title: Flow Control vs Congestion Control
compares: [flow-control, congestion-control]
gist:
  - "Do not overrun the receiver"
  - "Do not overload the network"
explain:
  - "Flow control stops a fast sender from overflowing the receiver's buffer. The receiver advertises its free buffer as rwnd in every ACK, and the sender keeps its unacknowledged data within that. It solves the mismatch between a fast sender and a slow receiver."
  - "Congestion control stops senders from overloading the routers and links on the shared path. The sender keeps its own window, cwnd, estimated from loss or delay, and grows or cuts it as the path allows. It stops too many bytes from filling router queues."
example: "A phone on a weak link advertises a tiny rwnd, so the server slows down to match the phone's buffer: that is flow control. Separately, when a router on the path starts dropping packets, the server cuts its cwnd and sends less: that is congestion control. The server obeys whichever window is smaller at the time."
rows:
  - { aspect: "Protects", a: "The receiver's buffer", b: "The routers and links on the path" }
  - { aspect: "Variable", a: "rwnd (receive window)", b: "cwnd (congestion window)" }
  - { aspect: "Who decides", a: "The receiver, in every ACK", b: "The sender's algorithm (Reno, CUBIC, BBR)" }
  - { aspect: "Signal", a: "Window field in the TCP header", b: "Loss or delay, inferred by the sender" }
  - { aspect: "Typical cause", a: "A slow consumer app", b: "A congested router queue" }
verdict: "Flow = receiver, congestion = network; the sender may have min(rwnd, cwnd) bytes unacknowledged."
sayIt: "Flow control protects the receiver: it advertises rwnd, its free buffer, and the sender stays within it. Congestion control protects the network: the sender sizes cwnd from loss or delay. TCP keeps at most min(rwnd, cwnd) bytes unacknowledged, so the stricter limit wins."
