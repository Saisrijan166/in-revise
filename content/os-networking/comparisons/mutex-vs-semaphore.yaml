id: mutex-vs-semaphore
tech: os-networking
title: Mutex vs Semaphore
compares: [mutex, counting-semaphore]
gist:
  - "One owner thread at a time"
  - "Up to N threads, counted by permits"
rows:
  - { aspect: "Holds", a: "Locked or unlocked, plus its owner", b: "A count of free permits" }
  - { aspect: "Threads inside", a: "One", b: "Up to N" }
  - { aspect: "Who releases", a: "Only the owner (ReentrantLock throws otherwise)", b: "Any thread: there is no owner" }
  - { aspect: "Main use", a: "Protect a critical section", b: "Limit concurrency, or signal between threads" }
  - { aspect: "Java", a: "synchronized, ReentrantLock", b: "java.util.concurrent.Semaphore" }
verdict: "Use a mutex to protect shared data; use a semaphore to cap how many threads use a limited resource at once."
sources:
  - title: "Class Semaphore (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Semaphore.html"
    verifiedOn: "2026-10-20"
  - title: "Class ReentrantLock (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html"
    verifiedOn: "2026-10-20"
  - title: "Semaphores (OSTEP, Arpaci-Dusseau)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/threads-sema.pdf"
    verifiedOn: "2026-10-20"
