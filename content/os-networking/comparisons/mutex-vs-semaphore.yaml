id: mutex-vs-semaphore
tech: os-networking
title: Mutex vs Semaphore
compares: [mutex, counting-semaphore]
gist:
  - "One owner thread at a time"
  - "Up to N threads, counted by permits"
explain:
  - "A mutex is a lock with an owner that lets exactly one thread into a critical section at a time. It solves the problem of protecting shared data so updates do not interleave and race."
  - "A semaphore is a counter of permits with no owner that lets up to N threads through at once. It solves the problem of capping how many threads use a limited resource, or signalling between threads."
example: "To guard a shared counter, use a mutex: one thread holds it, does count++, releases it. To limit calls to a partner API to 3 at a time, use Semaphore(3): three threads hold permits and call, the fourth waits in acquire until one releases."
rows:
  - { aspect: "Holds", a: "Locked or unlocked, plus its owner", b: "A count of free permits" }
  - { aspect: "Threads inside", a: "One", b: "Up to N" }
  - { aspect: "Who releases", a: "Only the owner (ReentrantLock throws otherwise)", b: "Any thread: there is no owner" }
  - { aspect: "Main use", a: "Protect a critical section", b: "Limit concurrency, or signal between threads" }
  - { aspect: "Java", a: "synchronized, ReentrantLock", b: "java.util.concurrent.Semaphore" }
verdict: "Use a mutex to protect shared data; use a semaphore to cap how many threads use a limited resource at once."
sayIt: "A mutex has an owner and lets one thread into a critical section, so I use it to protect shared data. A semaphore counts permits and lets up to N threads in with no owner, so I use it to limit concurrent use of a resource."
sources:
