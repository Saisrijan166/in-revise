id: blocking-vs-non-blocking-io
tech: os-networking
title: Blocking vs Non-blocking I/O
compares: [blocking-io, non-blocking-io]
gist:
  - "The call waits until the data is ready"
  - "The call returns at once; come back when ready"
rows:
  - { aspect: "While no data is ready", a: "The thread sleeps inside read()", b: "read() fails with EAGAIN; the thread does other work" }
  - { aspect: "Turned on by", a: "Nothing: sockets block by default", b: "O_NONBLOCK on the fd (Java: configureBlocking(false))" }
  - { aspect: "Threads for 10,000 waiting sockets", a: "About 10,000: one per waiting call", b: "A few, with epoll telling them which fds are ready" }
  - { aspect: "Code style", a: "Straight-line, easy to read and debug", b: "Loops on readiness, callbacks or futures" }
verdict: "Blocking is simpler and fine with enough (or virtual) threads; go non-blocking when connections far outnumber threads."
sources:
  - title: "read(2), ERRORS: EAGAIN and EWOULDBLOCK (Linux man-pages)"
    url: "https://man7.org/linux/man-pages/man2/read.2.html"
    verifiedOn: "2026-10-20"
  - title: "open(2), O_NONBLOCK (Linux man-pages)"
    url: "https://man7.org/linux/man-pages/man2/open.2.html"
    verifiedOn: "2026-10-20"
  - title: "SelectableChannel: blocking mode (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/channels/SelectableChannel.html"
    verifiedOn: "2026-10-20"
  - title: "The C10K problem (Dan Kegel, author page)"
    url: "https://www.kegel.com/c10k.html"
    verifiedOn: "2026-10-20"
