id: blocking-vs-non-blocking-io
tech: os-networking
title: Blocking vs Non-blocking I/O
compares: [blocking-io, non-blocking-io]
gist:
  - "The call waits inside read() until the data is ready"
  - "The call returns at once; come back when the fd is ready"
explain:
  - "Blocking I/O: when you call read() and no data is there, the kernel puts your thread to sleep inside the call and wakes it only when bytes arrive. The code is straight-line and easy to follow, but that thread can do nothing else while it waits."
  - "Non-blocking I/O: the fd is set to O_NONBLOCK, so a read() with no data ready returns immediately with the error EAGAIN instead of sleeping. The thread stays free to check other sockets, at the cost of a readiness loop (usually built on epoll)."
example: "A server holds 10,000 clients that are mostly idle. Blocking: each client's read() sleeps its own thread, so you need about 10,000 threads, each costing a ~1 MB stack. Non-blocking: all 10,000 fds return EAGAIN until ready, and one epoll loop on a few threads watches them all and reads only the ready ones."
rows:
  - { aspect: "While no data is ready", a: "The thread sleeps inside read()", b: "read() returns EAGAIN at once; the thread does other work" }
  - { aspect: "How it is turned on", a: "Nothing: sockets block by default", b: "O_NONBLOCK on the fd (Java: configureBlocking(false))" }
  - { aspect: "Threads for 10,000 waiting sockets", a: "About 10,000: one per waiting call", b: "A few, with epoll telling them which fds are ready" }
  - { aspect: "Code style", a: "Straight-line, easy to read and debug", b: "A readiness loop with callbacks or futures" }
  - { aspect: "Who copies the data", a: "Your thread, after it wakes", b: "Your thread, once epoll says the fd is ready (still synchronous)" }
verdict: "Blocking is simpler and fine when you have enough threads, and Java 21 virtual threads make that cheap; go non-blocking when connections far outnumber the threads you can afford."
sayIt: "Blocking I/O sleeps the thread inside read() until data arrives, so one waiting call needs one thread. Non-blocking returns EAGAIN at once, so one epoll loop can watch thousands of sockets on a few threads. Both are synchronous; the win is fewer threads, not faster requests."
