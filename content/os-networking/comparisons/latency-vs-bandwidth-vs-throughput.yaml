id: latency-vs-bandwidth-vs-throughput
tech: os-networking
title: Latency vs Bandwidth vs Throughput
compares: [latency, bandwidth, throughput]
gist:
  - "How long one trip takes"
  - "The most data the link can carry per second"
  - "The data or work actually done per second"
explain:
  - "Latency is how long one round trip takes, measured in milliseconds. It is set by distance, the number of hops, queueing and handshakes, not by how fat the link is. It is what makes chatty, many-small-call workloads feel slow."
  - "Bandwidth is the maximum data a link could carry per second, measured in Mbps or Gbps. It is a property of the link itself, a ceiling. A wide link does not make a single round trip any quicker."
  - "Throughput is the data or work actually delivered per second, measured in requests/s or MB/s. It is capped by bandwidth but also cut by packet loss, latency and the slowest stage on the path. It is the number you actually observe."
example: "A satellite link can have 100 Mbps of bandwidth yet 600 ms latency: a big file download reaches near 100 Mbps (bandwidth-bound), but a page making 30 small sequential API calls feels slow because each waits a full round trip (latency-bound). Measuring throughput shows what you really get after loss and the slowest stage."
sayIt: "Latency is how long one trip takes; bandwidth is the link's maximum per second; throughput is what you actually move per second, capped by bandwidth and hurt by latency, loss and the slowest stage. Chatty calls need low latency, big transfers need bandwidth."
rows:
  - { aspect: "Question", a: "How long?", b: "How much fits per second?", c: "How much got through?" }
  - { aspect: "Unit", a: "ms", b: "Mbps, Gbps", c: "requests/s, MB/s" }
  - { aspect: "Limited by", a: "Distance, hops, queues, handshakes", b: "The link itself", c: "Bandwidth, packet loss, the slowest stage" }
  - { aspect: "Improve with", a: "Shorter path, fewer round trips", b: "A faster link", c: "Remove the bottleneck, work in parallel" }
verdict: "Chatty small calls need lower latency; big transfers need bandwidth; measure throughput to see what you really get."
