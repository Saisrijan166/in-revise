id: symmetric-vs-asymmetric-encryption
tech: os-networking
title: "Symmetric vs Asymmetric Encryption"
compares: [symmetric-encryption, asymmetric-encryption]
gist:
  - "One shared secret key locks and unlocks"
  - "Key pair: public key shared, private key kept"
rows:
  - { aspect: "Keys", a: "One secret key, the same on both sides", b: "A public key and its private key" }
  - { aspect: "Speed", a: "Fast: fine for large amounts of data", b: "Much slower: used for small operations" }
  - { aspect: "Job in TLS 1.3", a: "Encrypts every record after the handshake", b: "Key exchange (ECDHE) and signatures that prove identity" }
  - { aspect: "Examples", a: "AES-GCM, ChaCha20-Poly1305", b: "ECDHE (X25519), RSA and ECDSA signatures" }
  - { aspect: "Hard part", a: "Both sides must first share the key safely", b: "Trusting the public key: certificates" }
verdict: "TLS uses asymmetric crypto to prove identity and agree a key, then symmetric keys to encrypt the data."
