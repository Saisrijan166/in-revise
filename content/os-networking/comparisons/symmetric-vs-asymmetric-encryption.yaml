id: symmetric-vs-asymmetric-encryption
tech: os-networking
title: "Symmetric vs Asymmetric Encryption"
compares: [symmetric-encryption, asymmetric-encryption]
gist:
  - "One shared secret key locks and unlocks"
  - "Key pair: public key shared, private key kept"
explain:
  - "Symmetric encryption uses one secret key that both sides hold: the same key encrypts and decrypts. It is fast, so it is used to encrypt the bulk of the data. Its hard part is getting that shared key to both sides safely in the first place."
  - "Asymmetric encryption uses a key pair: a public key anyone may hold and a private key the owner keeps. What one locks, only the other unlocks, enabling key exchange and signatures. It is slow, for small operations only; the hard part is trusting its owner."
example: "In a TLS 1.3 handshake, the client and server use asymmetric crypto (ECDHE key exchange plus a certificate signature) to agree a shared secret and prove the server's identity. From then on every record is encrypted with fast symmetric keys (AES-GCM). Asymmetric runs once to set up; symmetric does the heavy lifting."
sayIt: "Symmetric encryption uses one shared key and is fast, so it encrypts the data, but both sides must first share that key safely. Asymmetric uses a key pair and is slow, so it handles key exchange and signatures. TLS uses it to agree a key and prove identity, then symmetric keys for the traffic."
rows:
  - { aspect: "Keys", a: "One secret key, the same on both sides", b: "A public key and its private key" }
  - { aspect: "Speed", a: "Fast: fine for large amounts of data", b: "Much slower: used for small operations" }
  - { aspect: "Job in TLS 1.3", a: "Encrypts every record after the handshake", b: "Key exchange (ECDHE) and signatures that prove identity" }
  - { aspect: "Examples", a: "AES-GCM, ChaCha20-Poly1305", b: "ECDHE (X25519), RSA and ECDSA signatures" }
  - { aspect: "Hard part", a: "Both sides must first share the key safely", b: "Trusting the public key: certificates" }
verdict: "TLS uses asymmetric crypto to prove identity and agree a key, then symmetric keys to encrypt the data."
