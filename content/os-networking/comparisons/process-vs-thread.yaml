id: process-vs-thread
tech: os-networking
title: Process vs Thread
compares: [processes, threads]
gist:
  - "A running program with its own memory"
  - "A path of execution sharing its process's memory"
explain:
  - "A process is a running program with its own private address space, PID and open files, isolated from every other process. A crash stays inside it, but creating one is costly and processes must use IPC to share data. It gives strong isolation."
  - "A thread is one path of execution inside a process; threads share the heap and open files but each has its own stack. Creating one is cheap and data is shared directly, but one thread can corrupt the whole process. It gives cheap shared-memory concurrency."
example: "A payment server can run one process per tenant for isolation, so a crash in one tenant's process never touches another's. Inside each process it uses a pool of threads to handle requests concurrently: they share the same cache and connection pool in memory, with locks guarding shared counters, which no separate process could do without IPC."
sayIt: "A process has its own isolated memory, so a crash stays contained but sharing needs IPC and creation is costly. A thread shares its process's heap, so concurrency is cheap, but one bad thread can take down the whole process. Use processes for isolation, threads for cheap concurrency."
rows:
  - { aspect: "Memory", a: "Own virtual address space", b: "Shares the heap; own stack" }
  - { aspect: "Cost to create", a: "Higher: new address space and page tables", b: "Lower: a stack and registers" }
  - { aspect: "Isolation", a: "Strong: a crash stays inside it", b: "None: one thread can corrupt or end all" }
  - { aspect: "Communication", a: "IPC: pipes, sockets, shared memory", b: "Shared variables, guarded by locks" }
  - { aspect: "Context switch", a: "Changes the page table; the TLB may be flushed", b: "Same page table; registers and stack change" }
verdict: "Use separate processes or instances for isolation; use threads inside one process for cheap concurrency over shared data."
