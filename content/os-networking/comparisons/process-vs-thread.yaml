id: process-vs-thread
tech: os-networking
title: Process vs Thread
compares: [processes, threads]
gist:
  - "A running program with its own memory"
  - "A path of execution sharing its process's memory"
rows:
  - { aspect: "Memory", a: "Own virtual address space", b: "Shares the heap; own stack" }
  - { aspect: "Cost to create", a: "Higher: new address space and page tables", b: "Lower: a stack and registers" }
  - { aspect: "Isolation", a: "Strong: a crash stays inside it", b: "None: one thread can corrupt or end all" }
  - { aspect: "Communication", a: "IPC: pipes, sockets, shared memory", b: "Shared variables, guarded by locks" }
  - { aspect: "Context switch", a: "Changes the page table; the TLB may be flushed", b: "Same page table; registers and stack change" }
verdict: "Use separate processes or instances for isolation; use threads inside one process for cheap concurrency over shared data."
sources:
  - title: "Concurrency: An Introduction (OSTEP, Arpaci-Dusseau)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf"
    verifiedOn: "2026-10-20"
  - title: "Paging: Faster Translations (TLBs), context switches (OSTEP, Arpaci-Dusseau)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf"
    verifiedOn: "2026-10-20"
  - title: "fork(2) (Linux man-pages)"
    url: "https://man7.org/linux/man-pages/man2/fork.2.html"
    verifiedOn: "2026-10-20"
  - title: "pthreads(7) (Linux man-pages)"
    url: "https://man7.org/linux/man-pages/man7/pthreads.7.html"
    verifiedOn: "2026-10-20"
