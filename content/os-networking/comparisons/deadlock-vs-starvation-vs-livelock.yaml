id: deadlock-vs-starvation-vs-livelock
tech: os-networking
title: Deadlock vs Starvation vs Livelock
compares: [deadlocks, thread-starvation, livelock]
gist:
  - "Threads wait on each other in a cycle"
  - "One thread keeps losing; others go on"
  - "Threads keep reacting; none gets done"
explain:
  - "A deadlock is a cycle of blocked threads, each holding a lock the next needs, so nobody in the cycle ever progresses. It comes from locks taken in opposite orders."
  - "Starvation is one thread being passed over again and again while other threads keep getting the resource. It comes from greedy threads or an unfair lock."
  - "A livelock is threads that are not blocked but keep reacting to each other and still finish nothing, like two people stepping aside in the same direction. It comes from backing off and retrying in lockstep."
example: "Deadlock: T1 holds account A wanting B, T2 holds B wanting A, both freeze. Starvation: a fair-less lock keeps handing the counter to new threads, so one waiter never gets it. Livelock: two threads each release and retry at the same instant on sensing a conflict, forever."
rows:
  - { aspect: "Threads are", a: "Blocked", b: "Waiting, passed over again and again", c: "Running, not blocked" }
  - { aspect: "Who progresses", a: "Nobody in the cycle", b: "Everyone except the starved thread", c: "Nobody" }
  - { aspect: "Typical cause", a: "Locks taken in opposite orders", b: "Greedy threads holding a lock long; an unfair lock", c: "Back off and retry in lockstep" }
  - { aspect: "Fix", a: "Lock ordering, timeouts, detection", b: "A fair lock (longest waiter first)", c: "A random delay before retrying" }
verdict: "Deadlock is stuck and idle, livelock is busy but stuck, and starvation is one thread stuck while the rest move."
sayIt: "Deadlock is a cycle of blocked threads where nobody moves; starvation is one thread repeatedly passed over while others run; livelock is threads busy reacting to each other but finishing nothing. Fixes: lock ordering, a fair lock, and a random retry delay."
