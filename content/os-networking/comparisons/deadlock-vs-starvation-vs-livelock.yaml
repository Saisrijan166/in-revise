id: deadlock-vs-starvation-vs-livelock
tech: os-networking
title: Deadlock vs Starvation vs Livelock
compares: [deadlocks, thread-starvation, livelock]
gist:
  - "Threads wait on each other in a cycle"
  - "One thread keeps losing; others go on"
  - "Threads keep reacting; none gets done"
rows:
  - { aspect: "Threads are", a: "Blocked", b: "Waiting, passed over again and again", c: "Running, not blocked" }
  - { aspect: "Who progresses", a: "Nobody in the cycle", b: "Everyone except the starved thread", c: "Nobody" }
  - { aspect: "Typical cause", a: "Locks taken in opposite orders", b: "Greedy threads holding a lock long; an unfair lock", c: "Back off and retry in lockstep" }
  - { aspect: "Fix", a: "Lock ordering, timeouts, detection", b: "A fair lock (longest waiter first)", c: "A random delay before retrying" }
verdict: "Deadlock is stuck and idle, livelock is busy but stuck, and starvation is one thread stuck while the rest move."
sources:
  - title: "Starvation and Livelock (The Java Tutorials)"
    url: "https://docs.oracle.com/javase/tutorial/essential/concurrency/starvelive.html"
    verifiedOn: "2026-10-20"
  - title: "Common Concurrency Problems (OSTEP, Arpaci-Dusseau)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/threads-bugs.pdf"
    verifiedOn: "2026-10-20"
  - title: "Class ReentrantLock: fairness (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html"
    verifiedOn: "2026-10-20"
