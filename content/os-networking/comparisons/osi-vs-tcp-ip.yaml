id: osi-vs-tcp-ip
tech: os-networking
title: OSI vs TCP/IP
compares: [osi-model, tcp-ip-model]
gist:
  - "7 layers: a reference map for naming jobs"
  - "4 layers: the protocol suite the Internet runs"
explain:
  - "The OSI model is a seven-layer reference map from ISO and ITU-T. It defines no protocols you run; it exists to teach network communication and to give shared names for each job, like L4 and L7."
  - "The TCP/IP model is the four-layer stack the Internet actually runs, defined by IETF RFCs. Its layers are real protocol groups: Application, Transport, Internet and Link, carrying HTTP, TCP, IP and Ethernet."
example: "When a team says 'add an L7 rule', they use OSI's layer-7 name even though the traffic runs on TCP/IP. The OSI number names where to act; the TCP/IP layers (HTTP over TCP over IP) describe what is actually flowing."
sayIt: "OSI is a seven-layer reference model for teaching and naming; TCP/IP is the four-layer suite the Internet runs. TCP/IP folds OSI layers 5 to 7 into Application and 1 to 2 into Link. I speak OSI numbers to locate a problem and describe real traffic with TCP/IP layers."
rows:
  - { aspect: "Layers", a: "7: physical up to application", b: "4: link, internet, transport, application" }
  - { aspect: "What it is", a: "A conceptual reference model, not an implementation", b: "The real protocols: IP, TCP, UDP, HTTP, DNS" }
  - { aspect: "Defined by", a: "ISO/IEC 7498-1 and ITU-T X.200", b: "IETF RFCs (RFC 1122 names the layers)" }
  - { aspect: "Mapping", a: "5, 6, 7 / 4 / 3 / 1 and 2", b: "Application / Transport / Internet / Link" }
  - { aspect: "Used for", a: "Teaching, troubleshooting, naming (L4, L7)", b: "Building and running networks" }
verdict: "Speak OSI numbers to say where a problem or device sits; describe real traffic with the TCP/IP layers."
sources:
  - title: "ITU-T X.200 (07/94): OSI Basic Reference Model, identical to ISO/IEC 7498-1"
    url: "https://www.itu.int/rec/T-REC-X.200-199407-I/en"
    verifiedOn: "2026-10-20"
  - title: "RFC 1122: Requirements for Internet Hosts, section 1.1.3"
    url: "https://www.rfc-editor.org/rfc/rfc1122"
    verifiedOn: "2026-10-20"
