id: forward-vs-reverse-proxy
tech: os-networking
title: Forward Proxy vs Reverse Proxy
compares: [forward-proxy, reverse-proxy]
gist:
  - "Works for clients; the client chooses it"
  - "Works for servers; it sits in front of them"
rows:
  - { aspect: "Acts for", a: "A group of clients", b: "The servers behind it" }
  - { aspect: "Set up by", a: "The client or its organisation", b: "The site owner" }
  - { aspect: "Hides", a: "The clients' IP addresses", b: "The backend servers" }
  - { aspect: "Used for", a: "Security filtering, shared caching, anonymity", b: "Load balancing, TLS termination, caching, compression" }
  - { aspect: "Example", a: "A company web proxy", b: "Nginx in front of the orders API" }
verdict: "Same middleman, opposite side: a forward proxy speaks for clients, a reverse proxy speaks for servers."
sources:
  - title: "RFC 9110 HTTP Semantics, section 3.7 Intermediaries"
    url: "https://www.rfc-editor.org/rfc/rfc9110#section-3.7"
    verifiedOn: "2026-10-20"
  - title: "Proxy servers and tunneling (MDN Web Docs)"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Proxy_servers_and_tunneling"
    verifiedOn: "2026-10-20"
