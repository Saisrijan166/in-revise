id: forward-vs-reverse-proxy
tech: os-networking
title: Forward Proxy vs Reverse Proxy
compares: [forward-proxy, reverse-proxy]
gist:
  - "Works for clients; the client chooses it"
  - "Works for servers; it sits in front of them"
explain:
  - "A forward proxy sits in front of a group of clients and makes their outbound requests for them. The clients configure it, so it can filter where they go, cache shared downloads and hide their IP addresses. It gives control and anonymity for outgoing traffic."
  - "A reverse proxy sits in front of your own servers and receives requests meant for them. The site owner runs it, so it can load-balance across backends, terminate TLS, cache responses and hide the servers. It scales and protects incoming traffic."
example: "A company routes all staff web traffic through a forward proxy that blocks some sites and caches updates: it acts for the clients. The same company runs Nginx in front of its orders API to spread load and handle TLS: that reverse proxy acts for the servers. The client picks the first; the owner deploys the second."
sayIt: "A forward proxy acts for clients, making their outbound requests so the organisation can filter, cache and hide client IPs. A reverse proxy acts for servers, taking incoming requests to load-balance, terminate TLS and shield the backends. Same middleman, opposite side."
rows:
  - { aspect: "Acts for", a: "A group of clients", b: "The servers behind it" }
  - { aspect: "Set up by", a: "The client or its organisation", b: "The site owner" }
  - { aspect: "Hides", a: "The clients' IP addresses", b: "The backend servers" }
  - { aspect: "Used for", a: "Security filtering, shared caching, anonymity", b: "Load balancing, TLS termination, caching, compression" }
  - { aspect: "Example", a: "A company web proxy", b: "Nginx in front of the orders API" }
verdict: "Same middleman, opposite side: a forward proxy speaks for clients, a reverse proxy speaks for servers."
sources:
  - title: "RFC 9110 HTTP Semantics, section 3.7 Intermediaries"
    url: "https://www.rfc-editor.org/rfc/rfc9110#section-3.7"
    verifiedOn: "2026-10-20"
  - title: "Proxy servers and tunneling (MDN Web Docs)"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Proxy_servers_and_tunneling"
    verifiedOn: "2026-10-20"
