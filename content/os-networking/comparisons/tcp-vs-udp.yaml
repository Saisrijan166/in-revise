id: tcp-vs-udp
tech: os-networking
title: TCP vs UDP
compares: [tcp, udp]
gist:
  - "A reliable, ordered byte stream over a connection"
  - "Separate datagrams, no delivery or order promise"
rows:
  - { aspect: "Connection", a: "Set up by a handshake before data", b: "None: just send" }
  - { aspect: "Delivery", a: "Reliable and in order; lost data resent", b: "Best effort: may be lost, duplicated, reordered" }
  - { aspect: "Data unit", a: "Byte stream, no message boundaries", b: "Datagrams; each receive returns one" }
  - { aspect: "Flow and congestion control", a: "Built in", b: "None; the app should add congestion control" }
  - { aspect: "Header", a: "20 bytes without options", b: "8 bytes: ports, length, checksum" }
  - { aspect: "Typical uses", a: "HTTP/1.1 and HTTP/2", b: "Most DNS queries, live media, QUIC (HTTP/3)" }
verdict: "Default to TCP; pick UDP when late data is useless or the protocol (like QUIC) handles loss itself."
sources:
  - title: "RFC 9293: Transmission Control Protocol (3.1 Header format, 3.7 Segmentation)"
    url: "https://www.rfc-editor.org/rfc/rfc9293"
    verifiedOn: "2026-10-20"
  - title: "RFC 768: User Datagram Protocol"
    url: "https://www.rfc-editor.org/rfc/rfc768"
    verifiedOn: "2026-10-20"
  - title: "RFC 8085: UDP Usage Guidelines (1 Introduction, 3.1 Congestion control)"
    url: "https://www.rfc-editor.org/rfc/rfc8085"
    verifiedOn: "2026-10-20"
  - title: "RFC 9114: HTTP/3 (1 Introduction)"
    url: "https://www.rfc-editor.org/rfc/rfc9114"
    verifiedOn: "2026-10-20"
  - title: "RFC 7766: DNS Transport over TCP, Implementation Requirements"
    url: "https://www.rfc-editor.org/rfc/rfc7766"
    verifiedOn: "2026-10-20"
