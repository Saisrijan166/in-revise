id: tcp-vs-udp
tech: os-networking
title: TCP vs UDP
compares: [tcp, udp]
gist:
  - "A reliable, ordered byte stream over a connection"
  - "Separate datagrams, no delivery or order promise"
explain:
  - "TCP sets up a connection with a handshake, then gives one ordered stream of bytes. It numbers every byte, resends anything lost, and paces itself with flow and congestion control. It gives correct, complete delivery over an unreliable network."
  - "UDP sends each message as a standalone datagram with no setup and no guarantees: it may be lost, duplicated or reordered, and the sender is not told. It adds only ports and a checksum on top of IP, giving a thin, fast path the app controls itself."
example: "A payment API uses TCP: every byte of the request and reply must arrive exactly once and in order, so TCP's resends are worth the handshake. A live video call uses UDP: a frame that arrives late is useless, so there is no point waiting for a resend; dropping it and moving on keeps the picture smooth."
rows:
  - { aspect: "Connection", a: "Set up by a handshake before data", b: "None: just send" }
  - { aspect: "Delivery", a: "Reliable and in order; lost data resent", b: "Best effort: may be lost, duplicated, reordered" }
  - { aspect: "Data unit", a: "Byte stream, no message boundaries", b: "Datagrams; each receive returns one" }
  - { aspect: "Flow and congestion control", a: "Built in", b: "None; the app should add congestion control" }
  - { aspect: "Header", a: "20 bytes without options", b: "8 bytes: ports, length, checksum" }
  - { aspect: "Typical uses", a: "HTTP/1.1 and HTTP/2", b: "Most DNS queries, live media, QUIC (HTTP/3)" }
verdict: "Default to TCP; pick UDP when late data is useless or the protocol (like QUIC) handles loss itself."
sayIt: "TCP sets up a connection and delivers a reliable, ordered byte stream, with flow and congestion control built in, so I default to it for APIs and file transfers. UDP sends independent datagrams with no delivery or order guarantee, which suits live media or QUIC, which adds reliability itself."
