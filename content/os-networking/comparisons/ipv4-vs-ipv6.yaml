id: ipv4-vs-ipv6
tech: os-networking
title: IPv4 vs IPv6
compares: [ipv4, ipv6]
gist:
  - "32-bit addresses, scarce, so NAT is everywhere"
  - "128-bit addresses, plenty, built to need no NAT"
explain:
  - "IPv4 uses 32-bit addresses written as four decimals like 192.168.1.10, giving about 4.3 billion in total. It is the original Internet address format and still carries most traffic."
  - "IPv6 uses 128-bit addresses written in hex like 2001:db8::1, giving an effectively unlimited supply. It was created to solve the IPv4 address shortage so every device can have a global address."
example: "A home with 20 devices on IPv4 shares one public address through NAT, so from outside they all look like one host. On IPv6 each of the 20 devices can hold its own global address and be reached directly, with no NAT in the middle."
sayIt: "IPv4 is 32-bit and almost exhausted, so networks lean on NAT to share public addresses. IPv6 is 128-bit with room for every device to be globally addressable, removing the need for NAT. Most networks now run both as dual stack."
rows:
  - { aspect: "Address size", a: "32 bits: about 4.3 billion", b: "128 bits: 2^128" }
  - { aspect: "Written as", a: "Dotted decimal: 192.168.1.10", b: "Hex groups, :: for zeros: 2001:db8::1" }
  - { aspect: "NAT", a: "Common, to share scarce public addresses", b: "Not needed to save addresses (RFC 4864)" }
  - { aspect: "Broadcast", a: "Yes", b: "None: multicast does that job" }
  - { aspect: "Header", a: "Has a header checksum; TTL field", b: "No header checksum; Hop Limit field" }
  - { aspect: "Self-configuring", a: "Manual, or DHCP (RFC 2131)", b: "SLAAC: hosts build their own address (RFC 4862)" }
verdict: "IPv4 still leans on NAT; IPv6 has room for every device to have a global address. Many networks run both (dual stack)."
sources:
