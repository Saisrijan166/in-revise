id: user-mode-vs-kernel-mode
tech: os-networking
title: User Mode vs Kernel Mode
compares: [user-mode, kernel-mode]
gist:
  - "Restricted: app code that must ask the kernel"
  - "Privileged: kernel code with full hardware access"
explain:
  - "User mode is the restricted CPU mode application code runs in. It can touch only its own memory, and privileged instructions such as direct I/O are blocked, so it must ask the kernel through a system call. A bug here kills only that process."
  - "Kernel mode is the privileged CPU mode the kernel and its drivers run in. Code here may run any instruction, reach all memory and talk to devices directly. That power is why a bug here can crash the whole machine; only trusted OS code runs here."
example: "A Java program calling file.read() runs in user mode; it cannot touch the disk itself, so it issues a read system call. The CPU switches to kernel mode, the kernel copies the bytes from disk, then a return-from-trap drops back to user mode. If the Java process segfaults, only it dies; if the disk driver in the kernel crashes, the machine can go down."
sayIt: "User mode is restricted: app code reaches only its own memory and uses system calls for anything privileged, so a bug kills just that process. Kernel mode is privileged: the kernel and drivers run any instruction and reach all hardware, so a bug there can stop the machine."
rows:
  - { aspect: "Who runs here", a: "Apps, libraries, the JVM", b: "The kernel and its drivers" }
  - { aspect: "Privileged instructions (I/O, timer)", a: "Blocked: the CPU raises an exception", b: "Allowed" }
  - { aspect: "Memory it can reach", a: "Only its own virtual address space", b: "All memory and devices" }
  - { aspect: "How you enter", a: "Return-from-trap, after boot or a syscall", b: "A syscall, an exception or an interrupt" }
  - { aspect: "A bug here", a: "Kills one process; others run on", b: "Can stop the whole machine" }
verdict: "Run everything you can in user mode; cross into kernel mode only through system calls, for work that needs privilege."
sources:
