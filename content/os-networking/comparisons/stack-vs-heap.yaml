id: stack-vs-heap
tech: os-networking
title: Stack vs Heap
compares: [stack-memory, heap-memory]
gist:
  - "Per thread: one frame per running method call"
  - "Shared by all threads: objects that outlive a call"
explain:
  - "The stack is a per-thread area that grows and shrinks with method calls: each call pushes a frame of local variables and partial results, and returning pops it. It is freed automatically, with no cleanup code."
  - "The heap is one area shared by all of a process's threads, where objects and arrays live. It holds data that must outlive the call that created it, and is freed by free() in C or the garbage collector in Java."
example: "A method does `Order o = new Order();`. The reference `o` is a local on the calling thread's stack and disappears when the method returns. The Order object is on the shared heap and lives on as long as any reference points to it, even after the method returns."
rows:
  - { aspect: "Belongs to", a: "One thread", b: "The whole process (the JVM), shared by its threads" }
  - { aspect: "Holds", a: "Frames: local variables and partial results", b: "Objects and arrays" }
  - { aspect: "Freed", a: "Automatically when the method returns", b: "free() in C; the garbage collector in Java" }
  - { aspect: "Size in Java", a: "Small and fixed per thread (-Xss)", b: "Large; capped by -Xmx" }
  - { aspect: "Typical failure", a: "StackOverflowError: recursion too deep", b: "OutOfMemoryError: too much live data or a leak" }
verdict: "Call-local data goes on the stack, anything that outlives the call on the heap; in Java the JVM decides, you only size them."
sayIt: "The stack is per thread: one frame per active call, holding locals, freed automatically on return. The heap is shared by all threads and holds objects that outlive their call, freed by the garbage collector in Java. A local holds only a reference; the object it points to is on the heap."
sources:
  - title: "JVM Specification (Java SE 25), 2.5 Run-Time Data Areas"
    url: "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html"
    verifiedOn: "2026-10-20"
  - title: "The java Command (JDK 25): -Xss and -Xmx"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html"
    verifiedOn: "2026-10-20"
