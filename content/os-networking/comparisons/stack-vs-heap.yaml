id: stack-vs-heap
tech: os-networking
title: Stack vs Heap
compares: [stack-memory, heap-memory]
gist:
  - "Per thread: one frame per running method call"
  - "Shared by all threads: objects that outlive a call"
rows:
  - { aspect: "Belongs to", a: "One thread", b: "The whole process (the JVM), shared by its threads" }
  - { aspect: "Holds", a: "Frames: local variables and partial results", b: "Objects and arrays" }
  - { aspect: "Freed", a: "Automatically when the method returns", b: "free() in C; the garbage collector in Java" }
  - { aspect: "Size in Java", a: "Small and fixed per thread (-Xss)", b: "Large; capped by -Xmx" }
  - { aspect: "Typical failure", a: "StackOverflowError: recursion too deep", b: "OutOfMemoryError: too much live data or a leak" }
verdict: "Call-local data goes on the stack, anything that outlives the call on the heap; in Java the JVM decides, you only size them."
sources:
  - title: "JVM Specification (Java SE 25), 2.5 Run-Time Data Areas"
    url: "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html"
    verifiedOn: "2026-10-20"
  - title: "The java Command (JDK 25): -Xss and -Xmx"
    url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html"
    verifiedOn: "2026-10-20"
  - title: "Interlude: Memory API (OSTEP ch. 14)"
    url: "https://pages.cs.wisc.edu/~remzi/OSTEP/vm-api.pdf"
    verifiedOn: "2026-10-20"
