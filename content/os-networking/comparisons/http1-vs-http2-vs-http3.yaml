id: http1-vs-http2-vs-http3
tech: os-networking
title: "HTTP/1.1 vs HTTP/2 vs HTTP/3"
compares: [http-1-1, http-2, http-3]
gist:
  - "Text, one request at a time per TCP connection"
  - "Binary streams multiplexed on one TCP connection"
  - "Streams over QUIC on UDP, TLS 1.3 built in"
rows:
  - { aspect: "Transport", a: "TCP", b: "TCP", c: "QUIC over UDP" }
  - { aspect: "Message format", a: "Text", b: "Binary frames", c: "Binary frames on QUIC streams" }
  - { aspect: "Many requests", a: "One at a time per connection; browsers open about 6", b: "Many streams on one connection", c: "Many streams on one connection" }
  - { aspect: "Head-of-line blocking", a: "HTTP level: responses wait in line", b: "TCP level: one lost packet stalls all streams", c: "Only the stream whose packet was lost" }
  - { aspect: "Header compression", a: "None", b: "HPACK", c: "QPACK" }
  - { aspect: "New HTTPS connection", a: "TCP, then TLS 1.3: 2 round trips", b: "TCP, then TLS 1.3: 2 round trips", c: "1 round trip; 0-RTT on resumption" }
verdict: "Serve HTTP/2 by default, add HTTP/3 for mobile and lossy networks, and keep HTTP/1.1 as the fallback."
sources:
  - title: "RFC 9113: HTTP/2 (introduction: head-of-line blocking)"
    url: "https://www.rfc-editor.org/rfc/rfc9113"
    verifiedOn: "2026-10-20"
  - title: "RFC 9114: HTTP/3"
    url: "https://www.rfc-editor.org/rfc/rfc9114"
    verifiedOn: "2026-10-20"
  - title: "RFC 9001: Using TLS to Secure QUIC (1-RTT and 0-RTT)"
    url: "https://www.rfc-editor.org/rfc/rfc9001"
    verifiedOn: "2026-10-20"
  - title: "RFC 7413: TCP Fast Open (the 3-way handshake adds one RTT)"
    url: "https://www.rfc-editor.org/rfc/rfc7413"
    verifiedOn: "2026-10-20"
  - title: "Evolution of HTTP (MDN)"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP"
    verifiedOn: "2026-10-20"
