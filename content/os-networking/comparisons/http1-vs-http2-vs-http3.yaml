id: http1-vs-http2-vs-http3
tech: os-networking
title: "HTTP/1.1 vs HTTP/2 vs HTTP/3"
compares: [http-1-1, http-2, http-3]
gist:
  - "Text, one request at a time per TCP connection"
  - "Binary streams multiplexed on one TCP connection"
  - "Streams over QUIC on UDP, TLS 1.3 built in"
explain:
  - "HTTP/1.1 is the text protocol most of the web ran on. A connection handles one request at a time, so browsers open about six connections per site to get some parallelism."
  - "HTTP/2 packs requests into binary streams that share one TCP connection, so many requests run at once without waiting in line, and repeated headers are compressed with HPACK."
  - "HTTP/3 keeps HTTP/2's streams but moves them onto QUIC over UDP, which recovers lost packets per stream and folds in TLS 1.3, so one loss no longer stalls everything."
example: "On a lossy mobile network, HTTP/2 downloads several images over one TCP connection. One lost packet makes TCP hold back all the image streams until it is resent, so they stall together. HTTP/3 over QUIC recovers that loss on its own stream, so the other images keep arriving."
sayIt: "HTTP/1.1 is text, one request at a time per connection. HTTP/2 multiplexes binary streams on one TCP connection with HPACK. HTTP/3 runs those streams over QUIC on UDP, so a lost packet stalls only its stream and setup is one round trip. I serve HTTP/2 by default and add HTTP/3 for mobile."
rows:
  - { aspect: "Transport", a: "TCP", b: "TCP", c: "QUIC over UDP" }
  - { aspect: "Message format", a: "Text", b: "Binary frames", c: "Binary frames on QUIC streams" }
  - { aspect: "Many requests", a: "One at a time per connection; browsers open about 6", b: "Many streams on one connection", c: "Many streams on one connection" }
  - { aspect: "Head-of-line blocking", a: "HTTP level: responses wait in line", b: "TCP level: one lost packet stalls all streams", c: "Only the stream whose packet was lost" }
  - { aspect: "Header compression", a: "None", b: "HPACK", c: "QPACK" }
  - { aspect: "New HTTPS connection", a: "TCP, then TLS 1.3: 2 round trips", b: "TCP, then TLS 1.3: 2 round trips", c: "1 round trip; 0-RTT on resumption" }
verdict: "Serve HTTP/2 by default, add HTTP/3 for mobile and lossy networks, and keep HTTP/1.1 as the fallback."
