id: polling-vs-sse-vs-websocket
tech: os-networking
title: "Short Polling vs Long Polling vs SSE vs WebSocket"
compares: [short-polling, long-polling, sse, websocket]
gist:
  - "Client asks every few seconds"
  - "Server holds each request until news arrives"
  - "Server streams events on one HTTP response"
  - "Both sides send frames any time"
rows:
  - { aspect: "Who sends", a: "Client asks; server answers", b: "Client asks; server answers when it has news", c: "Server only", d: "Both ways (full duplex)" }
  - { aspect: "Connection", a: "A new request each time", b: "One held request, re-sent after each answer", c: "One long-lived HTTP response", d: "One TCP connection upgraded from HTTP" }
  - { aspect: "Delay for news", a: "Up to one poll interval", b: "Low", c: "Low", d: "Low" }
  - { aspect: "Overhead", a: "High: many empty answers", b: "One request per event", c: "Low", d: "Low; small frame headers" }
  - { aspect: "Best for", a: "Rare updates, simplest code", b: "Fallback when nothing else works", c: "Live feeds, notifications, order status", d: "Chat, games, collaborative editing" }
verdict: "Use SSE when only the server pushes, WebSocket when both sides talk often, and polling only for rare updates or as a fallback."
sources:
