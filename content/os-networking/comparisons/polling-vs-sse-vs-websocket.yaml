id: polling-vs-sse-vs-websocket
tech: os-networking
title: "Short Polling vs Long Polling vs SSE vs WebSocket"
compares: [short-polling, long-polling, sse, websocket]
gist:
  - "Client asks every few seconds"
  - "Server holds each request until news arrives"
  - "Server streams events on one HTTP response"
  - "Both sides send frames any time"
explain:
  - "Short polling has the client send a normal request on a timer, say every few seconds, and the server answers whatever it has, often nothing new. It is the simplest, at the cost of many wasted requests."
  - "Long polling has the client send a request that the server does not answer until it has data or a timeout; the client then re-asks at once. This removes most empty replies while staying plain HTTP."
  - "SSE opens one HTTP response the server keeps open, streaming named events as text/event-stream. It is server-to-client only, and the browser's EventSource reconnects by itself."
  - "A WebSocket upgrades an HTTP connection (101 Switching Protocols) into a two-way channel, so client and server both send frames at any time on one TCP connection."
example: "For a live order-status page where only the server pushes updates, SSE is enough: the browser opens one stream and reconnects on its own. For a chat where both people type, a WebSocket fits, because each side must send messages whenever it wants, not just reply."
sayIt: "Short polling re-asks on a timer; long polling holds the request until there is news; SSE streams events server-to-client over HTTP with auto-reconnect; a WebSocket upgrades to a full-duplex channel. I use SSE when only the server pushes and a WebSocket when both sides talk often."
rows:
  - { aspect: "Who sends", a: "Client asks; server answers", b: "Client asks; server answers when it has news", c: "Server only", d: "Both ways (full duplex)" }
  - { aspect: "Connection", a: "A new request each time", b: "One held request, re-sent after each answer", c: "One long-lived HTTP response", d: "One TCP connection upgraded from HTTP" }
  - { aspect: "Delay for news", a: "Up to one poll interval", b: "Low", c: "Low", d: "Low" }
  - { aspect: "Overhead", a: "High: many empty answers", b: "One request per event", c: "Low", d: "Low; small frame headers" }
  - { aspect: "Best for", a: "Rare updates, simplest code", b: "Fallback when nothing else works", c: "Live feeds, notifications, order status", d: "Chat, games, collaborative editing" }
verdict: "Use SSE when only the server pushes, WebSocket when both sides talk often, and polling only for rare updates or as a fallback."
