    source:
      title: inode(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/inode.7.html
      verifiedOn: 2026-10-20
  - id: hard-link
    term: Hard link
    aka: []
    definition: An extra directory entry for the same inode; the file stays until its last link is removed.
