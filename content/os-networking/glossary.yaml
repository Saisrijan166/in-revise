    see: osi-model
    source: &a13
      title: "RFC 1122: Requirements for Internet Hosts"
      url: https://www.rfc-editor.org/rfc/rfc1122
      verifiedOn: 2026-10-20
  - id: presentation-layer
    term: Presentation layer
    aka:
      - layer 6
    definition: "OSI layer 6: gives the data a common representation (syntax) both sides understand."
    see: osi-model
    source: *a12
  - id: session-layer
    term: Session layer
    aka:
      - layer 5
    definition: "OSI layer 5: opens, synchronises and closes a dialogue between two ends."
    see: osi-model
    source: *a12
  - id: transport-layer
    term: Transport layer
    aka:
      - layer 4
    definition: End-to-end delivery between programs on two hosts; TCP and UDP live here.
    see: osi-model
    source: *a13
  - id: network-layer
    term: Network layer
    aka:
      - layer 3
    definition: "OSI layer 3: addressing and routing packets between networks; IP lives here."
    see: osi-model
    source: *a12
  - id: data-link-layer
    term: Data link layer
    aka:
      - layer 2
    definition: "OSI layer 2: moves frames between devices on one link and detects bit errors."
    see: osi-model
    source: *a12
  - id: physical-layer
    term: Physical layer
    aka:
      - layer 1
    definition: "OSI layer 1: sends raw bits as electrical, optical or radio signals."
    see: osi-model
    source: *a12
  - id: tcp-ip-model-term
    term: TCP/IP model
    aka:
      - Internet protocol suite
      - TCP/IP stack
    definition: "The Internet's 4-layer stack: application, transport, internet and link (RFC 1122)."
    see: tcp-ip-model
    source: *a13
  - id: internet-layer
    term: Internet layer
    definition: The TCP/IP layer where IP carries datagrams from host to host, with no delivery guarantee.
    see: tcp-ip-model
    source: *a13
  - id: link-layer
    term: Link layer
    definition: "The bottom TCP/IP layer: talks on the directly connected network, such as Ethernet or Wi-Fi."
    see: tcp-ip-model
    source: *a13
  - id: encapsulation
    term: Encapsulation
    aka:
      - decapsulation
    definition: Each layer wraps the data from above with its own header; the receiver unwraps it (decapsulation).
    see: tcp-ip-model
    source: &a14
      title: "RFC 1180: A TCP/IP Tutorial"
      url: https://www.rfc-editor.org/rfc/rfc1180
      verifiedOn: 2026-10-20
  - id: pdu
    term: PDU
    aka:
      - protocol data unit
    definition: "The unit of data one layer handles: segment, datagram, packet or frame."
    see: tcp-ip-model
    source: *a14
  - id: segment
    term: Segment (TCP)
    aka:
      - TCP segment
      - segments
    definition: "TCP's unit of transmission: a TCP header followed by app data."
    see: tcp-ip-model
    source: *a13
  - id: datagram
    term: Datagram
    aka:
      - UDP datagram
      - IP datagram
      - datagrams
    definition: A self-contained unit sent without a connection; used for UDP and for IP.
    see: tcp-ip-model
    source: *a13
  - id: frame-network
    term: Frame (network)
    aka:
      - Ethernet frame
      - frames
    definition: "The link layer's unit: a link header, the packet, and on Ethernet a checksum trailer."
    see: tcp-ip-model
    source:
      title: "RFC 1042: IP over IEEE 802 networks"
      url: https://www.rfc-editor.org/rfc/rfc1042
      verifiedOn: 2026-10-20
  - id: hub
    term: Hub
    aka:
      - network hub
    definition: A layer 1 device that copies every bit out of every port, so all share one link.
    see: osi-model
    source: &a21
      title: Switches and Bridges (Princeton COS 461 lecture, spring 2010)
      url: https://www.cs.princeton.edu/courses/archive/spr10/cos461/docs/lec08-switches.pdf
      verifiedOn: 2026-10-20
  - id: ip-address
    term: IP address
    aka:
      - IP addresses
    definition: A number that identifies a network interface so IP can deliver packets to it.
    see: ip-addressing
    source: &a15
      title: "RFC 4291: IP Version 6 Addressing Architecture"
      url: https://www.rfc-editor.org/rfc/rfc4291
      verifiedOn: 2026-10-20
  - id: ipv4
    term: IPv4
    definition: "IP version 4: 32-bit addresses written as four decimal numbers, such as 192.168.1.10."
    see: ip-addressing
    source: &a16
      title: "RFC 4632: Classless Inter-domain Routing (CIDR)"
      url: https://www.rfc-editor.org/rfc/rfc4632
      verifiedOn: 2026-10-20
  - id: ipv6
    term: IPv6
    definition: "IP version 6: 128-bit addresses in hex groups, such as 2001:db8::1."
    see: ip-addressing
    source: *a15
  - id: cidr
    term: CIDR
    aka:
      - CIDR notation
      - classless inter-domain routing
      - network prefix
      - prefix length
    definition: Writing a network as address/n, where n is how many leading bits name the network.
    see: ip-addressing
    source: *a16
  - id: subnet
    term: Subnet
    aka:
      - subnets
      - subnetwork
    definition: A block of addresses sharing one prefix, such as 10.0.1.0/24; one routable piece of a network.
    see: ip-addressing
    source:
      title: Subnets for your VPC (Amazon VPC User Guide)
      url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
      verifiedOn: 2026-10-20
  - id: subnet-mask
    term: Subnet mask
    aka:
      - netmask
    definition: "The prefix written as an address: /24 is 255.255.255.0."
    see: ip-addressing
    source: *a16
  - id: private-ip-address
    term: Private IP address
    aka:
      - private IP
      - private IPs
      - private address
    definition: An address from RFC 1918 (10/8, 172.16/12, 192.168/16), reused inside many networks, not reachable from outside.
    see: ip-addressing
    source: &a17
      title: "RFC 1918: Address Allocation for Private Internets"
      url: https://www.rfc-editor.org/rfc/rfc1918
      verifiedOn: 2026-10-20
  - id: public-ip-address
    term: Public IP address
    aka:
      - public IP
      - public IPs
    definition: A globally unique address assigned by an Internet registry and reachable on the Internet.
    see: ip-addressing
    source: *a17
  - id: loopback-address
    term: Loopback address
    aka:
      - loopback
    definition: "127.0.0.1 (all of 127.0.0.0/8) or ::1: traffic to it stays on the same host."
    see: ip-addressing
    source:
      title: ip(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/ip.7.html
      verifiedOn: 2026-10-20
  - id: nat
    term: NAT
    aka:
      - Network Address Translation
    definition: A router rewrites addresses as packets pass, so private hosts can share public addresses.
    see: ip-addressing
    source: &a18
      title: "RFC 3022: Traditional IP Network Address Translator"
      url: https://www.rfc-editor.org/rfc/rfc3022
      verifiedOn: 2026-10-20
  - id: napt
    term: NAPT
    aka:
      - port address translation
      - Network Address Port Translation
    definition: NAT that also rewrites ports, so many hosts share one public IP.
    see: ip-addressing
    source: *a18
  - id: vpc
    term: VPC
    aka:
      - Virtual Private Cloud
    definition: A logically isolated virtual network in a cloud account; you add subnets, route tables and gateways.
    see: ip-addressing
    source:
      title: What is Amazon VPC? (Amazon VPC User Guide)
      url: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
      verifiedOn: 2026-10-20
  - id: port-network
    term: Port (network)
    aka:
      - port number
      - port numbers
    definition: A 16-bit number in the TCP or UDP header that picks the program on a host.
    see: ports-and-sockets
    source: &a19
      title: "RFC 6335: IANA procedures for port numbers"
      url: https://www.rfc-editor.org/rfc/rfc6335
      verifiedOn: 2026-10-20
  - id: well-known-port
    term: Well-known port
    aka:
      - well-known ports
      - system ports
    definition: A port from 0 to 1023, assigned by IANA, such as 443 for HTTPS.
    see: ports-and-sockets
    source: *a19
  - id: ephemeral-port
    term: Ephemeral port
    aka:
      - ephemeral ports
    definition: A short-lived client port the kernel picks for an outgoing connection.
    see: ports-and-sockets
    source:
      title: IP Sysctl (Linux kernel docs)
      url: https://docs.kernel.org/networking/ip-sysctl.html
      verifiedOn: 2026-10-20
  - id: socket
    term: Socket
    aka:
      - sockets
    definition: The OS endpoint for communication, returned as a file descriptor by socket().
    see: ports-and-sockets
    source:
      title: socket(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/socket.2.html
      verifiedOn: 2026-10-20
  - id: listening-socket
    term: Listening socket
    aka:
      - passive socket
    definition: A socket marked by listen() to accept incoming connections; accept() returns new sockets from it.
    see: ports-and-sockets
    source: &a20
      title: listen(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/listen.2.html
      verifiedOn: 2026-10-20
  - id: four-tuple
    term: 4-tuple
    aka:
      - four-tuple
    definition: "Source IP, source port, destination IP, destination port: together they name one TCP connection."
    see: ports-and-sockets
    source:
      title: "RFC 9293: Transmission Control Protocol"
      url: https://www.rfc-editor.org/rfc/rfc9293
      verifiedOn: 2026-10-20
  - id: listen-backlog
    term: Listen backlog
    definition: The queue of established connections waiting for accept(); capped by somaxconn on Linux.
    see: ports-and-sockets
    source: *a20
  - id: all-interfaces
    term: 0.0.0.0 (all interfaces)
    aka:
      - 0.0.0.0
      - INADDR_ANY
    definition: "As a bind address: accept connections on every interface of the host."
    see: ports-and-sockets
    source:
      title: ip(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/ip.7.html
      verifiedOn: 2026-10-20
  - id: mac-address
    term: MAC address
    aka:
      - MAC addresses
      - hardware address
      - Ethernet address
    definition: A 48-bit (6-byte) hardware address that identifies a device on the local link.
    see: switches-and-routers
    source: *a14
  - id: arp
    term: ARP
    aka:
      - Address Resolution Protocol
    definition: Finds the MAC address for an IPv4 address on the local network by broadcasting a request.
    see: switches-and-routers
    source:
      title: "RFC 826: An Ethernet Address Resolution Protocol"
      url: https://www.rfc-editor.org/rfc/rfc826
      verifiedOn: 2026-10-20
  - id: switch-network
    term: Switch (network)
    aka:
      - network switch
      - Ethernet switch
    definition: A layer 2 device that forwards frames to the right port using a learned MAC table.
    see: switches-and-routers
    source: *a21
  - id: router
    term: Router
    aka:
      - routers
    definition: A layer 3 device that forwards packets between networks using its routing table.
    see: switches-and-routers
    source: &a22
      title: "RFC 1812: Requirements for IP Version 4 Routers"
      url: https://www.rfc-editor.org/rfc/rfc1812
      verifiedOn: 2026-10-20
  - id: routing-table
    term: Routing table
    aka:
      - route table
    definition: The list of routes (prefix, next hop, interface) that IP uses to forward each packet.
    see: switches-and-routers
    source: *a14
  - id: longest-prefix-match
    term: Longest prefix match
    aka:
      - longest match
    definition: When several routes match, the router uses the most specific one (the longest prefix).
    see: switches-and-routers
    source: *a22
  - id: default-gateway
    term: Default gateway
    definition: The router a host sends packets to when no more specific route matches.
    see: switches-and-routers
    source: *a13
  - id: firewall
    term: Firewall
    aka:
      - firewalls
      - stateful firewall
      - packet filter
    definition: Allows or blocks traffic by rules; a stateful one also lets replies to allowed traffic through.
    see: switches-and-routers
    source: &a23
      title: Control traffic using security groups (Amazon VPC User Guide)
      url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
      verifiedOn: 2026-10-20
  - id: waf
    term: WAF
    aka:
      - web application firewall
    definition: A layer 7 firewall that inspects HTTP(S) requests and blocks attacks such as SQL injection.
    see: switches-and-routers
    source:
      title: AWS WAF (AWS WAF Developer Guide)
      url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html
      verifiedOn: 2026-10-20
  - id: security-group
    term: Security group
    aka:
      - security groups
    definition: An AWS virtual firewall with stateful allow rules for the resources it is attached to.
    see: switches-and-routers
    source: *a23
  - id: icmp
    term: ICMP
    aka:
      - Internet Control Message Protocol
    definition: IP's error and control messages, such as echo, destination unreachable and time exceeded.
    see: switches-and-routers
    source:
      title: "RFC 792: Internet Control Message Protocol"
      url: https://www.rfc-editor.org/rfc/rfc792
      verifiedOn: 2026-10-20
  - id: ping
    term: ping
    definition: A tool that sends ICMP echo requests to a host and reports the echo replies and round-trip time.
    see: switches-and-routers
    source:
      title: ping(8) (Debian manpages, iputils)
      url: https://manpages.debian.org/trixie/iputils-ping/ping.8.en.html
      verifiedOn: 2026-10-20
  - id: traceroute
    term: traceroute
    definition: A tool that shows the path to a host by sending probes with rising TTL values.
    see: switches-and-routers
    source:
      title: traceroute(1) (Debian manpages)
      url: https://manpages.debian.org/trixie/traceroute/traceroute.1.en.html
      verifiedOn: 2026-10-20
  - id: ttl-ip
    term: TTL (IP)
    aka:
      - hop limit
      - Hop Limit
    definition: An IP header counter each router lowers; at zero the packet is dropped (IPv6 calls it hop limit).
    see: ip-addressing
    source:
      title: "RFC 8200: IPv6 Specification"
      url: https://www.rfc-editor.org/rfc/rfc8200
      verifiedOn: 2026-10-20
  - id: tcp
    term: TCP
    aka:
      - Transmission Control Protocol
    definition: Transport protocol giving a reliable, in-order byte stream over a connection between two endpoints.
    see: tcp-and-udp
    source: &a24
      title: "RFC 9293: Transmission Control Protocol"
      url: https://www.rfc-editor.org/rfc/rfc9293
      verifiedOn: 2026-10-20
  - id: udp
    term: UDP
    aka:
      - User Datagram Protocol
    definition: Connectionless transport that sends separate datagrams with no delivery, order or duplicate protection.
    see: tcp-and-udp
    source:
      title: "RFC 768: User Datagram Protocol"
      url: https://www.rfc-editor.org/rfc/rfc768
      verifiedOn: 2026-10-20
  - id: byte-stream
    term: Byte stream
    definition: "A flow of bytes with no message boundaries: one write may be split or merged across reads."
    see: tcp-and-udp
    source:
      title: "RFC 9293: Transmission Control Protocol"
      url: https://www.rfc-editor.org/rfc/rfc9293
      verifiedOn: 2026-10-20
  - id: syn
    term: SYN
    definition: TCP control flag that opens a connection and carries the sender's initial sequence number.
    see: tcp-handshake
    source: *a24
  - id: syn-ack
    term: SYN-ACK
    definition: "The server's handshake reply: its own SYN plus an ACK of the client's SYN."
    see: tcp-handshake
    source: *a24
  - id: ack
    term: ACK
    aka:
      - ACK number
      - acknowledgement number
      - cumulative acknowledgement
    definition: TCP flag and number confirming receipt; the number is the next byte expected, covering all before it.
    see: tcp-reliability
    source: *a24
  - id: fin
    term: FIN
    definition: TCP control flag meaning the sender has no more data to send in this direction.
    see: tcp-handshake
    source: *a24
  - id: rst
    term: RST
    definition: TCP reset flag that aborts a connection at once, for example a SYN to a port with no listener.
    see: tcp-handshake
    source: *a24
  - id: three-way-handshake
    term: Three-way handshake
    aka:
      - 3-way handshake
      - TCP handshake
    definition: "SYN, SYN-ACK, ACK: how TCP opens a connection and both sides confirm each other's sequence numbers."
    see: tcp-handshake
    source: *a24
  - id: isn
    term: Initial sequence number (ISN)
    aka:
      - ISN
      - initial sequence number
    definition: The first sequence number each side picks for a new connection, hard to guess on purpose.
    see: tcp-handshake
    source: *a24
  - id: time-wait
    term: TIME_WAIT
    aka:
      - TIME-WAIT
    definition: "State of the side that closed first: it waits 2xMSL so late segments die out (60 s on Linux)."
    see: tcp-handshake
    source: *a24
  - id: syn-flood
    term: SYN flood
    aka:
      - SYN flooding
    definition: Attack that sends many SYNs and never finishes the handshake, filling the server's half-open queue.
    see: tcp-handshake
    source: &a25
      title: "RFC 4987: TCP SYN Flooding Attacks and Common Mitigations"
      url: https://www.rfc-editor.org/rfc/rfc4987
      verifiedOn: 2026-10-20
  - id: syn-cookies
    term: SYN cookies
    aka:
      - SYN cookie
    definition: Defence that encodes connection state in the SYN-ACK sequence number instead of storing it.
    see: tcp-handshake
    source: *a25
  - id: sequence-number
    term: Sequence number
    definition: Number of a segment's first data byte; TCP numbers every byte it sends.
    see: tcp-reliability
    source: *a24
  - id: retransmission-timeout
    term: Retransmission timeout (RTO)
    aka:
      - RTO
      - retransmission timeout
    definition: Timer after which unacknowledged data is resent; computed from measured RTT and doubled after each timeout.
    see: tcp-reliability
    source:
      title: "RFC 6298: Computing TCP's Retransmission Timer"
      url: https://www.rfc-editor.org/rfc/rfc6298
      verifiedOn: 2026-10-20
  - id: duplicate-ack
    term: Duplicate ACK
    aka:
      - dup ACK
      - duplicate ACKs
    definition: A repeated ACK for the same byte, sent when data arrives after a gap.
    see: tcp-reliability
    source: &a26
      title: "RFC 5681: TCP Congestion Control"
      url: https://www.rfc-editor.org/rfc/rfc5681
      verifiedOn: 2026-10-20
  - id: fast-retransmit
    term: Fast retransmit
    definition: Resending a segment after three duplicate ACKs, without waiting for the retransmission timer.
    see: tcp-reliability
    source: *a26
  - id: sack
    term: SACK
    aka:
      - selective acknowledgement
    definition: TCP option where the receiver reports which out-of-order blocks it holds, so only gaps are resent.
    see: tcp-reliability
    source:
      title: "RFC 2018: TCP Selective Acknowledgment Options"
      url: https://www.rfc-editor.org/rfc/rfc2018
      verifiedOn: 2026-10-20
  - id: sliding-window
    term: Sliding window
    definition: Sending many bytes before an ACK; the allowed range moves forward as ACKs arrive.
    see: tcp-reliability
    source: *a24
  - id: mss
    term: MSS
    aka:
      - maximum segment size
    definition: Largest data payload one TCP segment may carry, announced in the SYN.
    see: tcp-reliability
    source: *a24
  - id: flow-control
    term: Flow control
    definition: Keeping a sender from overrunning the receiver's buffer, using the receive window.
    see: flow-and-congestion-control
    source: *a24
  - id: receive-window
    term: Receive window (rwnd)
    aka:
      - rwnd
      - receive window
      - zero window
    definition: Free buffer space the receiver advertises in each segment; zero means stop sending.
    see: flow-and-congestion-control
    source: *a24
  - id: congestion-control
    term: Congestion control
    definition: Sender-side limits that keep TCP from overloading the network, using the congestion window.
    see: flow-and-congestion-control
    source: *a26
  - id: congestion-window
    term: Congestion window (cwnd)
    aka:
      - cwnd
      - congestion window
    definition: Sender's limit on unacknowledged data, based on its estimate of what the path can carry.
    see: flow-and-congestion-control
    source: *a26
  - id: slow-start
    term: Slow start
    definition: "Start of a TCP flow: cwnd begins small and grows by about one segment per ACK."
    see: flow-and-congestion-control
    source: *a26
  - id: aimd
    term: AIMD
    aka:
      - additive increase, multiplicative decrease
    definition: Grow the window by a little each round trip; cut it sharply on loss. Reno halves it.
    see: flow-and-congestion-control
    source: &a27
      title: "RFC 9438: CUBIC for Fast and Long-Distance Networks"
      url: https://www.rfc-editor.org/rfc/rfc9438
      verifiedOn: 2026-10-20
  - id: cubic
    term: CUBIC
    definition: Loss-based congestion control algorithm; the default in Linux, Windows and Apple TCP stacks.
    see: flow-and-congestion-control
    source: *a27
  - id: bbr
    term: BBR
    definition: "Google's model-based congestion control: paces sending from measured bottleneck bandwidth and round-trip time."
    see: flow-and-congestion-control
    source:
      title: BBR Congestion Control (IETF CCWG Internet-Draft)
      url: https://datatracker.ietf.org/doc/draft-ietf-ccwg-bbr/
      verifiedOn: 2026-10-20
  - id: dns-term
    term: DNS
    aka:
      - Domain Name System
    definition: The distributed naming system that turns names like api.shop.example into IP addresses and other records.
    see: dns
    source:
      title: DNS (MDN glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/DNS
      verifiedOn: 2026-10-20
  - id: recursive-resolver
    term: Recursive resolver
    aka:
      - recursive DNS resolver
      - DNS resolver
    definition: A DNS server that does the whole lookup for clients and usually caches the answers.
    see: dns
    source:
      title: "RFC 9499: DNS Terminology"
      url: https://www.rfc-editor.org/rfc/rfc9499
      verifiedOn: 2026-10-20
  - id: authoritative-name-server
    term: Authoritative name server
    aka:
      - authoritative server
      - authoritative DNS server
    definition: A DNS server that answers for its own zones from its own data, without asking other servers.
    see: dns
    source:
      title: "RFC 9499: DNS Terminology"
      url: https://www.rfc-editor.org/rfc/rfc9499
      verifiedOn: 2026-10-20
  - id: cname-record
    term: CNAME record
    aka:
      - CNAME
    definition: Makes one name an alias of another name; the alias may hold no other records.
    see: dns
    source:
      title: "RFC 1034: Domain Names, Concepts and Facilities"
      url: https://www.rfc-editor.org/rfc/rfc1034
      verifiedOn: 2026-10-20
  - id: ttl
    term: TTL
    aka:
      - time to live
    definition: How many seconds a cached answer, such as a DNS record, may be reused before asking again.
    see: dns
    source:
      title: "RFC 1035: Domain Names, Implementation and Specification"
      url: https://www.rfc-editor.org/rfc/rfc1035
      verifiedOn: 2026-10-20
  - id: http-term
    term: HTTP
    aka:
      - Hypertext Transfer Protocol
    definition: The stateless request and response protocol of the web and of most APIs.
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics"
      url: https://www.rfc-editor.org/rfc/rfc9110
      verifiedOn: 2026-10-20
  - id: safe-method
    term: Safe method
    aka:
      - safe methods
      - safe HTTP method
    definition: "An HTTP method meant to be read-only: GET, HEAD, OPTIONS and TRACE."
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 9.2.1 Safe Methods"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.1
      verifiedOn: 2026-10-20
  - id: idempotent-method
    term: Idempotent method
    aka:
      - idempotent methods
      - idempotent HTTP method
    definition: "Sending the same request many times has the same intended effect as once: PUT, DELETE, safe methods."
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 9.2.2 Idempotent Methods"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
      verifiedOn: 2026-10-20
  - id: unauthorized-401
    term: 401 Unauthorized
    aka:
      - "401"
    definition: The request lacks valid credentials; the server must say how to authenticate in WWW-Authenticate.
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 15.5.2 401 Unauthorized"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-15.5.2
      verifiedOn: 2026-10-20
  - id: forbidden-403
    term: 403 Forbidden
    aka:
      - "403"
    definition: The server understood the request but refuses it; resending the same credentials will not help.
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 15.5.4 403 Forbidden"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-15.5.4
      verifiedOn: 2026-10-20
  - id: bad-gateway-502
    term: 502 Bad Gateway
    aka:
      - "502"
    definition: A gateway or proxy got an invalid response from the server behind it.
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 15.6.3 502 Bad Gateway"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-15.6.3
      verifiedOn: 2026-10-20
  - id: service-unavailable-503
    term: 503 Service Unavailable
    aka:
      - "503"
    definition: The server is temporarily overloaded or in maintenance; it may send Retry-After.
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 15.6.4 503 Service Unavailable"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-15.6.4
      verifiedOn: 2026-10-20
  - id: gateway-timeout-504
    term: 504 Gateway Timeout
    aka:
      - "504"
    definition: A gateway or proxy did not get a reply in time from the server behind it.
    see: http-basics
    source:
      title: "RFC 9110: HTTP Semantics, 15.6.5 504 Gateway Timeout"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-15.6.5
      verifiedOn: 2026-10-20
  - id: http-cookie
    term: Cookie (HTTP)
    aka:
      - HTTP cookie
      - Set-Cookie
    definition: A name=value pair the server sets with Set-Cookie; the browser sends it back on later requests.
    see: http-basics
    source:
      title: "RFC 6265: HTTP State Management Mechanism"
      url: https://www.rfc-editor.org/rfc/rfc6265
      verifiedOn: 2026-10-20
  - id: persistent-connection
    term: Persistent connection
    aka:
      - HTTP keep-alive
      - persistent connections
    definition: One TCP connection reused for many HTTP requests; the default in HTTP/1.1.
    see: http-versions
    source:
      title: "RFC 9112: HTTP/1.1, 9.3 Persistence"
      url: https://www.rfc-editor.org/rfc/rfc9112#section-9.3
      verifiedOn: 2026-10-20
  - id: head-of-line-blocking
    term: Head-of-line blocking
    aka:
      - HOL blocking
      - head of line blocking
    definition: A slow or lost item at the front holds up everything queued behind it.
    see: http-versions
    source:
      title: "RFC 9113: HTTP/2, 1 Introduction"
      url: https://www.rfc-editor.org/rfc/rfc9113
      verifiedOn: 2026-10-20
  - id: http2-stream
    term: Stream (HTTP/2)
    aka:
      - HTTP/2 stream
      - HTTP/2 streams
    definition: An independent two-way sequence of frames inside one HTTP/2 connection, carrying one exchange.
    see: http-versions
    source:
      title: "RFC 9113: HTTP/2, 5 Streams and Multiplexing"
      url: https://www.rfc-editor.org/rfc/rfc9113#section-5
      verifiedOn: 2026-10-20
  - id: quic
    term: QUIC
    aka: []
    definition: A secure, multiplexed transport over UDP with TLS 1.3 built in; HTTP/3 runs on it.
    see: http-versions
    source:
      title: "RFC 9000: QUIC, a UDP-Based Multiplexed and Secure Transport"
      url: https://www.rfc-editor.org/rfc/rfc9000
      verifiedOn: 2026-10-20
  - id: alpn
    term: ALPN
    aka:
      - Application-Layer Protocol Negotiation
    definition: A TLS extension where client and server agree the protocol, such as h2, without an extra round trip.
    see: http-versions
    source:
      title: "RFC 7301: TLS Application-Layer Protocol Negotiation Extension"
      url: https://www.rfc-editor.org/rfc/rfc7301
      verifiedOn: 2026-10-20
  - id: server-push
    term: Server push
    aka:
      - HTTP/2 server push
    definition: HTTP/2 feature that sends responses before they are requested; no major browser supports it now.
    see: http-versions
    source:
      title: Firefox 132 release notes for developers (MDN)
      url: https://developer.mozilla.org/en-US/docs/Mozilla/Firefox/Releases/132
      verifiedOn: 2026-10-20
  - id: zero-rtt
    term: 0-RTT
    aka:
      - zero round trip
      - early data
    definition: On a resumed TLS 1.3 or QUIC connection, data sent in the first flight; it can be replayed.
    see: tls-https
    source:
      title: "RFC 9846: The TLS Protocol Version 1.3"
      url: https://www.rfc-editor.org/rfc/rfc9846
      verifiedOn: 2026-10-20
  - id: tls-term
    term: TLS
    aka:
      - Transport Layer Security
      - SSL
    definition: Protocol that encrypts and authenticates a connection; current version 1.3. SSL was its predecessor.
    see: tls-https
    source:
      title: Transport Layer Security (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security
      verifiedOn: 2026-10-20
  - id: https-term
    term: HTTPS
    aka: []
    definition: HTTP over a TLS connection; the default port is 443.
    see: tls-https
    source:
      title: "RFC 9110: HTTP Semantics, 4.2.2 https URI Scheme"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-4.2.2
      verifiedOn: 2026-10-20
  - id: certificate-term
    term: Certificate (X.509)
    aka:
      - TLS certificate
      - X.509 certificate
      - digital certificate
    definition: A signed document that binds a name to a public key, issued by a certificate authority.
    see: tls-https
    source:
      title: "RFC 5280: X.509 Certificate and CRL Profile"
      url: https://www.rfc-editor.org/rfc/rfc5280
      verifiedOn: 2026-10-20
  - id: certificate-authority
    term: Certificate authority (CA)
    aka:
      - certificate authority
      - certification authority
    definition: An issuer that signs certificates; clients trust a set of root CAs as trust anchors.
    see: tls-https
    source:
      title: "RFC 5280: X.509 Certificate and CRL Profile"
      url: https://www.rfc-editor.org/rfc/rfc5280
      verifiedOn: 2026-10-20
  - id: symmetric-encryption
    term: Symmetric encryption
    aka:
      - symmetric-key cryptography
      - symmetric key
    definition: Encryption where one shared secret key both encrypts and decrypts, such as AES.
    see: tls-https
    source:
      title: Symmetric-key cryptography (MDN glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Symmetric-key_cryptography
      verifiedOn: 2026-10-20
  - id: asymmetric-encryption
    term: Asymmetric encryption
    aka:
      - public-key cryptography
      - asymmetric cryptography
      - asymmetric crypto
    definition: "Crypto with a key pair: a public key anyone may have and a private key kept secret."
    see: tls-https
    source:
      title: Public-key cryptography (MDN glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Public-key_cryptography
      verifiedOn: 2026-10-20
  - id: ecdhe
    term: ECDHE
    aka:
      - Elliptic Curve Diffie-Hellman Ephemeral
    definition: Key agreement with fresh elliptic-curve keys for each connection, so TLS gets forward secrecy.
    see: tls-https
    source:
      title: "RFC 9846: The TLS Protocol Version 1.3"
      url: https://www.rfc-editor.org/rfc/rfc9846
      verifiedOn: 2026-10-20
  - id: forward-secrecy
    term: Forward secrecy
    aka:
      - perfect forward secrecy
      - PFS
    definition: If a long-term key leaks later, the session keys of past connections stay safe.
    see: tls-https
    source:
      title: "RFC 9846: The TLS Protocol Version 1.3, Appendix F"
      url: https://www.rfc-editor.org/rfc/rfc9846
      verifiedOn: 2026-10-20
  - id: sni
    term: SNI
    aka:
      - Server Name Indication
    definition: TLS extension where the client names the host it wants, so one IP can serve many certificates.
    see: tls-https
    source:
      title: "RFC 6066: TLS Extensions, 3 Server Name Indication"
      url: https://www.rfc-editor.org/rfc/rfc6066#section-3
      verifiedOn: 2026-10-20
  - id: long-polling
    term: Long polling
    aka:
      - long poll
    definition: The server holds a request open until it has an event or times out; the client then asks again.
    see: real-time-connections
    source:
      title: "RFC 6202: Long Polling and Streaming in Bidirectional HTTP"
      url: https://www.rfc-editor.org/rfc/rfc6202
      verifiedOn: 2026-10-20
  - id: sse
    term: Server-Sent Events (SSE)
    aka:
      - SSE
      - server-sent events
      - EventSource
    definition: A one-way stream of text events from server to browser over one HTTP response (text/event-stream).
    see: real-time-connections
    source:
      title: "HTML Living Standard: Server-sent events"
      url: https://html.spec.whatwg.org/multipage/server-sent-events.html
      verifiedOn: 2026-10-20
  - id: websocket
    term: WebSocket
    aka:
      - WebSockets
    definition: A two-way connection that starts as an HTTP Upgrade, then both sides send frames at any time.
    see: real-time-connections
    source:
      title: "RFC 6455: The WebSocket Protocol"
      url: https://www.rfc-editor.org/rfc/rfc6455
      verifiedOn: 2026-10-20
  - id: load-balancer
    term: Load balancer
    aka:
      - load balancers
      - load balancing
    definition: A component that spreads incoming traffic over several servers and sends it only to healthy ones.
    see: load-balancers-and-proxies
    source:
      title: How Elastic Load Balancing works (AWS documentation)
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
      verifiedOn: 2026-10-20
  - id: l4-load-balancer
    term: L4 load balancer
    aka:
      - layer 4 load balancer
      - L4 load balancers
    definition: A load balancer that forwards whole TCP or UDP connections using IP addresses and ports, without reading HTTP.
    see: load-balancers-and-proxies
    source:
      title: HAProxy 3.2 Starter Guide
      url: https://docs.haproxy.org/3.2/intro.html
      verifiedOn: 2026-10-20
  - id: l7-load-balancer
    term: L7 load balancer
    aka:
      - layer 7 load balancer
      - L7 load balancers
    definition: A proxy that reads each HTTP request and routes it by host, path, headers or cookies.
    see: load-balancers-and-proxies
    source:
      title: HAProxy 3.2 Starter Guide
      url: https://docs.haproxy.org/3.2/intro.html
      verifiedOn: 2026-10-20
  - id: health-check
    term: Health check
    aka:
      - health checks
    definition: A regular probe a load balancer sends to each server; servers that fail it get no traffic.
    see: load-balancers-and-proxies
    source:
      title: HAProxy 3.2 Starter Guide
      url: https://docs.haproxy.org/3.2/intro.html
      verifiedOn: 2026-10-20
  - id: consistent-hashing
    term: Consistent hashing
    definition: Mapping keys to servers so that adding or removing a server moves only a few keys.
    see: load-balancers-and-proxies
    source:
      title: "Module ngx_http_upstream_module: hash consistent (nginx documentation)"
      url: https://nginx.org/en/docs/http/ngx_http_upstream_module.html
      verifiedOn: 2026-10-20
  - id: sticky-session
    term: Sticky session
    aka:
      - sticky sessions
      - session persistence
      - session affinity
    definition: Sending every request from one client to the same server, using a cookie or the client IP.
    see: load-balancers-and-proxies
    source:
      title: HAProxy 3.2 Starter Guide
      url: https://docs.haproxy.org/3.2/intro.html
      verifiedOn: 2026-10-20
  - id: reverse-proxy
    term: Reverse proxy
    aka:
      - reverse proxies
    definition: A server in front of backends that acts as the origin for clients and forwards requests inward.
    see: load-balancers-and-proxies
    source:
      title: RFC 9110 HTTP Semantics, section 3.7
      url: https://www.rfc-editor.org/rfc/rfc9110#section-3.7
      verifiedOn: 2026-10-20
  - id: forward-proxy
    term: Forward proxy
    aka:
      - forward proxies
    definition: A proxy chosen by clients that sends their requests out on their behalf and can hide their IPs.
    see: load-balancers-and-proxies
    source:
      title: Proxy servers and tunneling (MDN Web Docs)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Proxy_servers_and_tunneling
      verifiedOn: 2026-10-20
  - id: tls-termination
    term: TLS termination
    aka:
      - SSL termination
      - TLS offloading
      - SSL offloading
    definition: Decrypting TLS at a proxy or load balancer so backends receive plain or re-encrypted traffic.
    see: load-balancers-and-proxies
    source:
      title: HAProxy 3.2 Starter Guide
      url: https://docs.haproxy.org/3.2/intro.html
      verifiedOn: 2026-10-20
  - id: cdn
    term: CDN
    aka:
      - content delivery network
      - CDNs
    definition: Servers spread over many locations that keep copies of content and serve users from a nearby one.
    see: caching-and-cdn
    source:
      title: CDN (MDN Web Docs glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/CDN
      verifiedOn: 2026-10-20
  - id: edge-server
    term: Edge server
    aka:
      - edge location
      - edge locations
      - point of presence
      - edge servers
    definition: A CDN server near users that answers from its cache and asks the origin on a miss.
    see: caching-and-cdn
    source:
      title: How CloudFront delivers content (AWS documentation)
      url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html
      verifiedOn: 2026-10-20
  - id: anycast
    term: Anycast
    definition: Announcing one IP address from many places, so routing sends each user to one nearby site.
    see: caching-and-cdn
    source:
      title: RFC 4786 Operation of Anycast Services
      url: https://www.rfc-editor.org/rfc/rfc4786
      verifiedOn: 2026-10-20
  - id: cache-control
    term: Cache-Control
    definition: The HTTP header whose directives say who may store a response and for how long.
    see: caching-and-cdn
    source:
      title: RFC 9111 HTTP Caching, section 5.2
      url: https://www.rfc-editor.org/rfc/rfc9111#section-5.2
      verifiedOn: 2026-10-20
  - id: no-cache
    term: no-cache
    definition: "Cache-Control directive: a cache may store the response but must revalidate it before reuse."
    see: caching-and-cdn
    source:
      title: RFC 9111 HTTP Caching, section 5.2.2.4
      url: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.4
      verifiedOn: 2026-10-20
  - id: no-store
    term: no-store
    definition: "Cache-Control directive: no cache may store any part of the request or response."
    see: caching-and-cdn
    source:
      title: RFC 9111 HTTP Caching, section 5.2.2.5
      url: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.5
      verifiedOn: 2026-10-20
  - id: etag
    term: ETag
    aka:
      - ETags
      - If-None-Match
      - 304 Not Modified
    definition: A version tag for a response; a cache sends it back in If-None-Match and gets 304 if unchanged.
    see: caching-and-cdn
    source:
      title: HTTP caching (MDN Web Docs)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching
      verifiedOn: 2026-10-20
  - id: cache-busting
    term: Cache busting
    aka:
      - versioned file names
      - versioned file name
    definition: Putting a version or hash in a file's URL so each change gets a new URL and old copies are never reused.
    see: caching-and-cdn
    source:
      title: HTTP caching (MDN Web Docs)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching
      verifiedOn: 2026-10-20
  - id: connection-pool
    term: Connection pool
    aka:
      - connection pools
      - DB pool
    definition: A set of open connections that requests borrow and return instead of opening new ones.
    see: connection-pooling
    source:
      title: HikariCP README (brettwooldridge/HikariCP)
      url: https://github.com/brettwooldridge/HikariCP
      verifiedOn: 2026-10-20
  - id: hikaricp
    term: HikariCP
    aka:
      - Hikari
    definition: A fast JDBC connection pool; Spring Boot picks it first when it is on the classpath.
    see: connection-pooling
    source:
      title: SQL Databases (Spring Boot 4.1 reference)
      url: https://docs.spring.io/spring-boot/reference/data/sql.html
      verifiedOn: 2026-10-20
  - id: pool-exhaustion
    term: Pool exhaustion
    definition: Every pooled connection is in use, so new callers wait and then time out.
    see: connection-pooling
    source:
      title: "HikariCP README: maximumPoolSize and connectionTimeout"
      url: https://github.com/brettwooldridge/HikariCP
      verifiedOn: 2026-10-20
  - id: latency
    term: Latency
    definition: The time data takes to reach its destination; for a request, usually measured as a round trip.
    see: latency-and-bandwidth
    source:
      title: Latency (MDN Web Docs glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Latency
      verifiedOn: 2026-10-20
  - id: bandwidth
    term: Bandwidth
    definition: How much data a connection can carry per unit of time, in bits per second (Mbps, Gbps).
    see: latency-and-bandwidth
    source:
      title: Bandwidth (MDN Web Docs glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Bandwidth
      verifiedOn: 2026-10-20
  - id: throughput
    term: Throughput
    definition: The amount of data or work that actually gets through per unit of time; at most the bandwidth.
    see: latency-and-bandwidth
    source:
      title: What's the difference between throughput and latency? (AWS)
      url: https://aws.amazon.com/compare/the-difference-between-throughput-and-latency/
      verifiedOn: 2026-10-20
  - id: round-trip-time
    term: Round-trip time (RTT)
    aka:
      - RTT
      - round-trip time
      - round trip time
      - round trips
      - round trip
    definition: Time to send a packet and get its acknowledgement back; ping measures it.
    see: latency-and-bandwidth
    source:
      title: Round Trip Time (MDN Web Docs glossary)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Round_Trip_Time
      verifiedOn: 2026-10-20
  - id: tail-latency
    term: Tail latency
    aka:
      - p99
      - p99 latency
      - 99th percentile
      - p95
    definition: "The latency of the slowest requests, such as p99: 99% of requests take this long or less."
    see: latency-and-bandwidth
    source:
      title: The Tail at Scale (Dean and Barroso, CACM 2013)
      url: https://research.google/pubs/the-tail-at-scale/
      verifiedOn: 2026-10-20
  - id: bandwidth-delay-product
    term: Bandwidth-delay product
    aka:
      - BDP
      - bandwidth * delay product
    definition: "Bandwidth times delay: the unacknowledged data a sender needs in flight to keep a path full."
    see: latency-and-bandwidth
    source:
      title: RFC 7323 TCP Extensions for High Performance, section 1.1
      url: https://www.rfc-editor.org/rfc/rfc7323#section-1.1
      verifiedOn: 2026-10-20
  - id: connect-timeout
    term: Connect timeout
    aka:
      - connect timeouts
    definition: The longest a client waits for a new connection to be set up before giving up.
    see: network-failures
    source:
      title: HttpClient.Builder connectTimeout (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpClient.Builder.html
      verifiedOn: 2026-10-20
  - id: read-timeout
    term: Read timeout
    aka:
      - request timeout
      - response timeout
      - read timeouts
    definition: The longest a client waits for the reply once the request is sent; unset in Java HttpClient means forever.
    see: network-failures
    source:
      title: HttpRequest.Builder timeout (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.net.http/java/net/http/HttpRequest.Builder.html
      verifiedOn: 2026-10-20
  - id: exponential-backoff
    term: Exponential backoff
    aka:
      - backoff
      - capped exponential backoff
    definition: Waiting longer after each failed try, usually doubling, up to a cap.
    see: network-failures
    source:
      title: Timeouts, retries, and backoff with jitter (AWS Builders' Library)
      url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
      verifiedOn: 2026-10-20
  - id: jitter
    term: Jitter
    definition: A random amount added to retry waits or timers so many clients do not act at the same moment.
    see: network-failures
    source:
      title: Timeouts, retries, and backoff with jitter (AWS Builders' Library)
      url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
      verifiedOn: 2026-10-20
  - id: idempotency
    term: Idempotency
    aka:
      - idempotent operation
      - idempotent operations
    definition: Doing the same request twice has the same intended effect on the server as doing it once.
    see: network-failures
    source:
      title: RFC 9110 HTTP Semantics, section 9.2.2
      url: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
      verifiedOn: 2026-10-20
  - id: idempotency-key
    term: Idempotency key
    aka:
      - Idempotency-Key
      - idempotency keys
    definition: A unique value a client sends with a request so the server can spot a retry and return the first result.
    see: network-failures
    source:
      title: The Idempotency-Key HTTP Header Field (IETF draft -07, expired)
      url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
      verifiedOn: 2026-10-20
  - id: circuit-breaker
    term: Circuit breaker
    aka:
      - circuit breakers
    definition: A wrapper that stops calling a dependency after repeated failures and fails fast until a trial call succeeds.
    see: network-failures
    source:
      title: CircuitBreaker (Martin Fowler)
      url: https://martinfowler.com/bliki/CircuitBreaker.html
      verifiedOn: 2026-10-20
  - id: network-partition
    term: Network partition
    aka:
      - network partitions
    definition: A failure where nodes keep running but some groups of them cannot reach each other.
    see: network-failures
    source:
      title: CAP Twelve Years Later (Eric Brewer, InfoQ)
      url: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
      verifiedOn: 2026-10-20
  - id: cap-theorem
    term: CAP theorem
    definition: A shared-data system cannot be fully consistent and fully available while the network is partitioned.
    see: network-failures
    source:
      title: CAP Twelve Years Later (Eric Brewer, InfoQ)
      url: https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/
      verifiedOn: 2026-10-20
