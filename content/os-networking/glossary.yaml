terms:
  - id: kernel
    term: Kernel
    aka:
      - OS kernel
    definition: The core of the operating system; it runs in kernel mode and manages CPU, memory, devices and files.
    see: what-is-an-os
    source: &a1
      title: "Mechanism: Limited Direct Execution (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-mechanisms.pdf
      verifiedOn: 2026-10-20
  - id: user-mode
    term: User mode
    aka:
      - user space
    definition: The restricted CPU mode for app code; privileged instructions such as direct I/O raise an exception.
    see: what-is-an-os
    source: *a1
  - id: kernel-mode
    term: Kernel mode
    aka:
      - supervisor mode
      - kernel space
    definition: The privileged CPU mode the kernel runs in; any instruction and any device is allowed.
    see: what-is-an-os
    source: *a1
  - id: system-call
    term: System call
    aka:
      - syscall
    definition: A controlled entry point into the kernel, such as read() or fork(), usually reached through a C library wrapper.
    see: what-is-an-os
    source: &a2
      title: "intro(2): introduction to system calls (Linux man-pages)"
      url: https://man7.org/linux/man-pages/man2/intro.2.html
      verifiedOn: 2026-10-20
  - id: library-call
    term: Library call
    aka:
      - library function
    definition: A normal function call in user space, like printf; it may then make a system call, or not.
    see: what-is-an-os
    source: *a2
  - id: interrupt
    term: Interrupt
    aka:
      - hardware interrupt
      - device interrupt
      - timer interrupt
    definition: A signal from a device, such as a disk or timer, that makes the CPU run a kernel handler.
    see: what-is-an-os
    source: &a3
      title: xv6 book, ch. 4 Traps and system calls (Cox, Kaashoek, Morris, MIT)
      url: https://pdos.csail.mit.edu/6.1810/2024/xv6/book-riscv-rev4.pdf
      verifiedOn: 2026-10-20
  - id: trap-cpu
    term: Trap (CPU)
    aka:
      - CPU exception
      - trap instruction
    definition: "A jump into the kernel caused by the running instruction: a system call, divide by zero or a bad address."
    see: what-is-an-os
    source: *a3
  - id: monolithic-kernel
    term: Monolithic kernel
    definition: A kernel design where all OS services run in kernel mode as one program; Linux is one.
    see: what-is-an-os
    source: *a3
  - id: microkernel
    term: Microkernel
    definition: A minimal kernel that runs most OS services, like the file system, as user-mode server processes.
    see: what-is-an-os
    source: *a3
  - id: process
    term: Process
    definition: A running instance of a program, with its own virtual address space, PID, open files and threads.
    see: processes
    source: &a4
      title: "The Abstraction: The Process (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-intro.pdf
      verifiedOn: 2026-10-20
  - id: pid
    term: PID
    aka:
      - process ID
    definition: The number the kernel gives each process; exec keeps it, fork gives the child a new one.
    see: processes
    source:
      title: execve(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/execve.2.html
      verifiedOn: 2026-10-20
  - id: pcb
    term: Process control block (PCB)
    aka:
      - process control block
      - PCB
      - process descriptor
    definition: "The kernel's record of one process: PID, state, saved registers, memory map and open files."
    see: processes
    source: *a4
  - id: fork
    term: fork()
    aka:
      - fork
    definition: A system call that creates a child process as a copy of the caller; it returns 0 in the child.
    see: processes
    source: &a5
      title: fork(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/fork.2.html
      verifiedOn: 2026-10-20
  - id: exec
    term: exec()
    aka:
      - exec
      - execve
    definition: A system call that replaces the program running in the current process; the PID stays the same.
    see: processes
    source:
      title: execve(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/execve.2.html
      verifiedOn: 2026-10-20
  - id: copy-on-write
    term: Copy-on-write
    aka:
      - COW
    definition: After fork, parent and child share memory pages; a page is copied only when one of them writes it.
    see: processes
    source: *a5
  - id: zombie-process
    term: Zombie process
    aka:
      - zombie
      - defunct process
    definition: A child that has exited but not yet been waited for; it keeps its PID and exit status.
    see: processes
    source:
      title: wait(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/wait.2.html
      verifiedOn: 2026-10-20
  - id: orphan-process
    term: Orphan process
    aka:
      - orphan
    definition: A process whose parent died; the kernel re-parents it to init or the nearest subreaper.
    see: processes
    source:
      title: PR_SET_CHILD_SUBREAPER(2const) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/PR_SET_CHILD_SUBREAPER.2const.html
      verifiedOn: 2026-10-20
  - id: linux-container
    term: Container (Linux)
    aka:
      - Linux container
      - Docker container
    definition: A group of ordinary processes with their own namespaces and cgroup limits, sharing the host kernel.
    see: processes
    source: &a6
      title: namespaces(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/namespaces.7.html
      verifiedOn: 2026-10-20
  - id: namespace-linux
    term: Namespace (Linux)
    aka:
      - Linux namespace
      - PID namespace
      - network namespace
    definition: A kernel feature that gives processes their own isolated view of a global resource, such as PIDs.
    see: processes
    source: *a6
  - id: cgroup
    term: cgroup
    aka:
      - control group
    definition: A kernel feature that groups processes to limit and monitor their CPU, memory and I/O use.
    see: processes
    source:
      title: cgroups(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/cgroups.7.html
      verifiedOn: 2026-10-20
  - id: thread
    term: Thread
    aka:
      - multithreading
    definition: One path of execution inside a process; it has its own stack and registers and shares the heap.
    see: threads
    source: &a8
      title: "Concurrency: An Introduction (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
      verifiedOn: 2026-10-20
  - id: kernel-thread
    term: Kernel thread
    aka:
      - OS thread
      - native thread
    definition: A thread the kernel schedules directly; on Linux each pthread is one.
    see: threads
    source:
      title: pthreads(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/pthreads.7.html
      verifiedOn: 2026-10-20
  - id: user-thread
    term: User thread
    aka:
      - user-mode thread
      - green thread
    definition: A thread scheduled by a runtime inside the process rather than by the kernel.
    see: threads
    source: &a7
      title: "JEP 444: Virtual Threads (OpenJDK, delivered in Java 21)"
      url: https://openjdk.org/jeps/444
      verifiedOn: 2026-10-20
  - id: virtual-thread
    term: Virtual thread
    aka:
      - Java virtual thread
    definition: A cheap Java thread (final in Java 21) that the JDK runs on a few carrier platform threads.
    see: threads
    source: *a7
  - id: thread-local-storage
    term: Thread-local storage
    aka:
      - ThreadLocal
      - thread-local variable
    definition: Variables with a separate copy per thread, such as Java ThreadLocal values.
    see: threads
    source: *a8
  - id: context-switch
    term: Context switch
    definition: Saving the running thread's registers and loading another's so the core runs that one instead.
    see: context-switching
    source: *a1
  - id: scheduler
    term: Scheduler
    aka:
      - CPU scheduler
    definition: The part of the kernel that decides which ready thread runs next on each core.
    see: cpu-scheduling
    source: *a1
  - id: time-slice
    term: Time slice
    aka:
      - time quantum
      - scheduling quantum
    definition: How long a thread may run before the scheduler may switch to another, for example 10 ms.
    see: cpu-scheduling
    source: &a9
      title: "Scheduling: Introduction (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched.pdf
      verifiedOn: 2026-10-20
  - id: preemption
    term: Preemption
    aka:
      - preempted
      - preemptive scheduling
    definition: The kernel stopping a running thread, usually at a timer interrupt, to run another.
    see: cpu-scheduling
    source: *a9
  - id: fcfs
    term: FCFS
    aka:
      - first come, first served
      - first-come first-served
    definition: Scheduling that runs jobs in arrival order, each to completion; also called FIFO.
    see: cpu-scheduling
    source: *a9
  - id: sjf
    term: SJF
    aka:
      - shortest job first
    definition: Non-preemptive scheduling that runs the shortest job next; it needs to know job lengths.
    see: cpu-scheduling
    source: *a9
  - id: srtf
    term: SRTF
    aka:
      - shortest remaining time first
      - STCF
    definition: "Preemptive SJF: a new shorter job interrupts the running one."
    see: cpu-scheduling
    source: *a9
  - id: round-robin
    term: Round robin
    aka:
      - round-robin
    definition: Taking turns in a fixed circular order; a scheduler gives each ready job one time slice per turn.
    see: cpu-scheduling
    source: *a9
  - id: convoy-effect
    term: Convoy effect
    definition: Short jobs stuck waiting behind one long job, as under FCFS.
    see: cpu-scheduling
    source: *a9
  - id: starvation
    term: Starvation
    definition: A ready thread that never gets the resource it needs because others are always chosen first.
    see: cpu-scheduling
    source: &a10
      title: "Scheduling: The Multi-Level Feedback Queue (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched-mlfq.pdf
      verifiedOn: 2026-10-20
  - id: aging
    term: Aging
    definition: Raising a waiting job's priority over time so it cannot starve.
    see: cpu-scheduling
    source:
      title: "sched(7): SCHED_OTHER dynamic priority (Linux man-pages)"
      url: https://man7.org/linux/man-pages/man7/sched.7.html
      verifiedOn: 2026-10-20
  - id: mlfq
    term: Multilevel feedback queue
    aka:
      - MLFQ
      - multi-level feedback queue
    definition: Scheduling with several priority queues; jobs move down as they use CPU and are boosted back up.
    see: cpu-scheduling
    source: *a10
  - id: eevdf
    term: EEVDF
    aka:
      - Earliest Eligible Virtual Deadline First
    definition: The Linux fair scheduler that began replacing CFS in Linux 6.6; of tasks owed CPU time, the earliest virtual deadline runs first.
    see: cpu-scheduling
    source:
      title: EEVDF Scheduler (Linux kernel documentation)
      url: https://docs.kernel.org/scheduler/sched-eevdf.html
      verifiedOn: 2026-10-20
  - id: cpu-bound
    term: CPU-bound
    definition: Work limited by computation; threads beyond the core count do not make it faster.
    see: thread-pools
    source: *a7
  - id: io-bound
    term: I/O-bound
    definition: Work that mostly waits for disk or network, so many threads can share few cores.
    see: thread-pools
    source: *a7
  - id: thread-pool
    term: Thread pool
    aka:
      - worker pool
      - ExecutorService
    definition: A fixed set of reusable worker threads that take tasks from a queue.
    see: thread-pools
    source: &a11
      title: ThreadPoolExecutor (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
      verifiedOn: 2026-10-20
  - id: back-pressure
    term: Back-pressure
    aka:
      - backpressure
    definition: Pushing back on senders when a system is full, by rejecting or slowing new work.
    see: thread-pools
    source: *a11
  - id: concurrency
    term: Concurrency
    definition: Several tasks in progress over overlapping time; one core can interleave them.
    see: concurrency-and-parallelism
    source:
      title: Concurrency is not parallelism (Rob Pike, The Go Blog)
      url: https://go.dev/blog/waza-talk
      verifiedOn: 2026-10-20
  - id: parallelism
    term: Parallelism
    aka:
      - parallel execution
    definition: Several computations running at the same instant, on separate cores or processors.
    see: concurrency-and-parallelism
    source:
      title: Concurrency is not parallelism (Rob Pike, The Go Blog)
      url: https://go.dev/blog/waza-talk
      verifiedOn: 2026-10-20
  - id: race-condition
    term: Race condition
    aka:
      - race conditions
    definition: A bug where the result depends on the timing of threads that update shared data.
    see: race-conditions
    source:
      title: "Concurrency: An Introduction (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
      verifiedOn: 2026-10-20
  - id: data-race
    term: Data race
    definition: "Java: two accesses to one variable, at least one a write, not ordered by happens-before."
    see: race-conditions
    source:
      title: Chapter 17. Threads and Locks (Java Language Specification, Java SE 25)
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html
      verifiedOn: 2026-10-20
  - id: critical-section
    term: Critical section
    definition: A piece of code that touches a shared resource and must not run in two threads at once.
    see: race-conditions
    source:
      title: "Concurrency: An Introduction (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
      verifiedOn: 2026-10-20
  - id: mutual-exclusion
    term: Mutual exclusion
    definition: The guarantee that only one thread at a time is inside a critical section.
    see: locks
    source:
      title: "Concurrency: An Introduction (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
      verifiedOn: 2026-10-20
  - id: atomic-operation
    term: Atomic operation
    aka:
      - atomicity
    definition: "An operation that happens as one unit: other threads see all of it or none of it."
    see: race-conditions
    source:
      title: "Concurrency: An Introduction (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
      verifiedOn: 2026-10-20
  - id: compare-and-swap
    term: Compare-and-swap
    aka:
      - CAS
      - compare-and-set
      - compareAndSet
    definition: A CPU instruction that writes a new value only if memory still holds the expected one.
    see: race-conditions
    source:
      title: Locks (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-locks.pdf
      verifiedOn: 2026-10-20
  - id: check-then-act
    term: Check-then-act
    definition: Check a condition, then act on it, while another thread may change it in between.
    see: race-conditions
    source:
      title: "Common Concurrency Problems: atomicity violation (OSTEP, Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-bugs.pdf
      verifiedOn: 2026-10-20
  - id: thread-safety
    term: Thread safety
    aka:
      - thread-safe
      - thread safe
    definition: Code or a data structure that stays correct when many threads use it at once.
    see: race-conditions
    source:
      title: Lock-based Concurrent Data Structures (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-locks-usage.pdf
      verifiedOn: 2026-10-20
  - id: mutex
    term: Mutex
    aka:
      - mutual exclusion lock
      - mutexes
    definition: A lock that one thread owns at a time; the owner releases it.
    see: locks
    source:
      title: Class ReentrantLock (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html
      verifiedOn: 2026-10-20
  - id: spinlock
    term: Spinlock
    aka:
      - spin lock
      - busy waiting
      - spin-waiting
    definition: A lock that waits by looping and checking, using the CPU instead of sleeping.
    see: locks
    source:
      title: Locks (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-locks.pdf
      verifiedOn: 2026-10-20
  - id: read-write-lock
    term: Read-write lock
    aka:
      - reader-writer lock
      - ReadWriteLock
    definition: "A pair of locks: many threads may hold the read lock, but the write lock is exclusive."
    see: locks
    source:
      title: Interface ReadWriteLock (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReadWriteLock.html
      verifiedOn: 2026-10-20
  - id: reentrant-lock
    term: Reentrant lock
    aka:
      - ReentrantLock
      - recursive lock
    definition: A lock its owner can take again without blocking; each lock needs a matching unlock.
    see: locks
    source:
      title: Class ReentrantLock (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html
      verifiedOn: 2026-10-20
  - id: monitor-lock
    term: Monitor (synchronization)
    aka:
      - monitor lock
      - intrinsic lock
    definition: "Java: the lock and wait set every object has; used by synchronized, wait and notify."
    see: locks
    source:
      title: Chapter 17. Threads and Locks (Java Language Specification, Java SE 25)
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html
      verifiedOn: 2026-10-20
  - id: condition-variable
    term: Condition variable
    aka:
      - condition variables
    definition: A queue a thread sleeps on until another thread changes the state and signals it.
    see: locks
    source:
      title: Condition Variables (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-cv.pdf
      verifiedOn: 2026-10-20
  - id: priority-inversion
    term: Priority inversion
    definition: A high-priority thread waits on a lock held by a low-priority thread that cannot run.
    see: locks
    source:
      title: Locks (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-locks.pdf
      verifiedOn: 2026-10-20
  - id: semaphore
    term: Semaphore
    aka:
      - semaphores
    definition: "A counter of permits: acquire takes one or waits, release gives one back."
    see: semaphores
    source:
      title: Class Semaphore (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Semaphore.html
      verifiedOn: 2026-10-20
  - id: binary-semaphore
    term: Binary semaphore
    definition: A semaphore with one permit; it works as a lock but has no owner.
    see: semaphores
    source:
      title: Class Semaphore (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Semaphore.html
      verifiedOn: 2026-10-20
  - id: counting-semaphore
    term: Counting semaphore
    definition: A semaphore with N permits, letting up to N threads use a resource at once.
    see: semaphores
    source:
      title: Class Semaphore (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Semaphore.html
      verifiedOn: 2026-10-20
  - id: producer-consumer
    term: Producer-consumer problem
    aka:
      - bounded buffer
      - bounded buffer problem
      - producer-consumer
    definition: Producers add to a fixed-size buffer and consumers take from it; each waits when it is full or empty.
    see: semaphores
    source:
      title: Semaphores (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-sema.pdf
      verifiedOn: 2026-10-20
  - id: deadlock
    term: Deadlock
    definition: Two or more threads blocked forever, each waiting for a resource another one holds.
    see: deadlocks
    source:
      title: Deadlock (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/essential/concurrency/deadlock.html
      verifiedOn: 2026-10-20
  - id: coffman-conditions
    term: Coffman conditions
    aka:
      - hold and wait
      - hold-and-wait
      - circular wait
      - no preemption
    definition: "Mutual exclusion, hold and wait, no preemption, circular wait: all four must hold for deadlock."
    see: deadlocks
    source:
      title: Common Concurrency Problems (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-bugs.pdf
      verifiedOn: 2026-10-20
  - id: lock-ordering
    term: Lock ordering
    definition: Every thread takes locks in the same global order, so no waiting cycle can form.
    see: deadlocks
    source:
      title: Common Concurrency Problems (OSTEP, Arpaci-Dusseau)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-bugs.pdf
      verifiedOn: 2026-10-20
  - id: bankers-algorithm
    term: Banker's algorithm
    aka:
      - safe state
    definition: "Dijkstra's avoidance method: grant a request only if every process can still finish (a safe state)."
    see: deadlocks
    source:
      title: The mathematics behind the Banker's Algorithm (EWD 623, E. W. Dijkstra Archive)
      url: https://www.cs.utexas.edu/~EWD/transcriptions/EWD06xx/EWD623.html
      verifiedOn: 2026-10-20
  - id: wait-for-graph
    term: Wait-for graph
    aka:
      - waits-for graph
    definition: A graph with an edge from A to B when A waits for a lock B holds; a cycle is a deadlock.
    see: deadlocks
    source:
      title: "Lock manager README: deadlock detection, waits-for graph (PostgreSQL source)"
      url: https://github.com/postgres/postgres/blob/master/src/backend/storage/lmgr/README
      verifiedOn: 2026-10-20
  - id: livelock
    term: Livelock
    definition: Threads keep reacting to each other and retrying, so they stay busy but make no progress.
    see: deadlocks
    source:
      title: Starvation and Livelock (The Java Tutorials)
      url: https://docs.oracle.com/javase/tutorial/essential/concurrency/starvelive.html
      verifiedOn: 2026-10-20
  - id: cpu-cache
    term: CPU cache
    aka:
      - L1 cache
      - L2 cache
      - L3 cache
      - CPU caches
    definition: Small, fast memory in the CPU that keeps copies of recently used data from RAM.
    see: memory-hierarchy
    source:
      title: Intel SDM Vol. 3A (Sept 2026), 14.1 Internal Caches
      url: https://cdrdv2.intel.com/v1/dl/getContent/671190
      verifiedOn: 2026-10-20
  - id: cache-line
    term: Cache line
    aka:
      - cache lines
    definition: "The fixed-size block in which data moves between cache and RAM: 64 bytes on modern Intel CPUs."
    see: memory-hierarchy
    source:
      title: Intel SDM Vol. 3A (Sept 2026), 14.1 Internal Caches
      url: https://cdrdv2.intel.com/v1/dl/getContent/671190
      verifiedOn: 2026-10-20
  - id: cache-hit
    term: Cache hit
    aka:
      - cache hits
    definition: The wanted data is already in the cache, so the slower level behind it is skipped.
    see: memory-hierarchy
    source:
      title: "Paging: Faster Translations (TLBs) (OSTEP ch. 19)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf
      verifiedOn: 2026-10-20
  - id: cache-miss
    term: Cache miss
    aka:
      - cache misses
    definition: The wanted data is not in the cache and must be fetched from the slower level behind it.
    see: memory-hierarchy
    source:
      title: "Paging: Faster Translations (TLBs) (OSTEP ch. 19)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf
      verifiedOn: 2026-10-20
  - id: locality-of-reference
    term: Locality of reference
    aka:
      - principle of locality
    definition: Programs tend to reuse recent data and use data stored near it; every cache relies on this.
    see: memory-hierarchy
    source:
      title: "Paging: Faster Translations (TLBs) (OSTEP ch. 19)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf
      verifiedOn: 2026-10-20
  - id: temporal-locality
    term: Temporal locality
    aka: []
    definition: Data or code used just now is likely to be used again soon.
    see: memory-hierarchy
    source:
      title: "Paging: Faster Translations (TLBs) (OSTEP ch. 19)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf
      verifiedOn: 2026-10-20
  - id: spatial-locality
    term: Spatial locality
    aka: []
    definition: Data stored near what was just used is likely to be used next.
    see: memory-hierarchy
    source:
      title: "Paging: Faster Translations (TLBs) (OSTEP ch. 19)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf
      verifiedOn: 2026-10-20
  - id: false-sharing
    term: False sharing
    aka: []
    definition: Cores slow each other down by writing different variables that sit on the same cache line.
    see: memory-hierarchy
    source:
      title: "JEP 142: Reduce Cache Contention on Specified Fields (OpenJDK)"
      url: https://openjdk.org/jeps/142
      verifiedOn: 2026-10-20
  - id: stack-memory
    term: Stack (memory)
    aka:
      - thread stack
      - call stack
      - stack memory
    definition: Per-thread memory of call frames holding local variables; each frame is freed when its call returns.
    see: stack-and-heap
    source:
      title: JVM Specification (Java SE 25), 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-20
  - id: heap-memory
    term: Heap (memory)
    aka:
      - JVM heap
      - Java heap
      - heap memory
    definition: Memory shared by a process's threads where objects live until freed or garbage collected.
    see: stack-and-heap
    source:
      title: JVM Specification (Java SE 25), 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-20
  - id: stack-frame
    term: Stack frame
    aka:
      - call frame
    definition: The block one method call adds to the stack for its local variables and partial results.
    see: stack-and-heap
    source:
      title: JVM Specification (Java SE 25), 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-20
  - id: out-of-memory
    term: Out of memory (OOM)
    aka:
      - OutOfMemoryError
      - out of memory
    definition: An allocation cannot be satisfied; Java throws OutOfMemoryError when the heap or metaspace is full.
    see: stack-and-heap
    source:
      title: Troubleshoot Memory Leaks (Java SE 25 Troubleshooting Guide)
      url: https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshooting-memory-leaks.html
      verifiedOn: 2026-10-20
  - id: memory-leak
    term: Memory leak
    aka:
      - memory leaks
    definition: Memory no longer needed but never freed; in Java, objects still referenced by mistake.
    see: stack-and-heap
    source:
      title: Troubleshoot Memory Leaks (Java SE 25 Troubleshooting Guide)
      url: https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshooting-memory-leaks.html
      verifiedOn: 2026-10-20
  - id: garbage-collection
    term: Garbage collection
    aka:
      - garbage collector
    definition: Automatic freeing of objects nothing references any more; Java objects are never freed by hand.
    see: stack-and-heap
    source:
      title: JVM Specification (Java SE 25), 2.5 Run-Time Data Areas
      url: https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html
      verifiedOn: 2026-10-20
  - id: address-space
    term: Address space
    aka:
      - address spaces
    definition: The range of virtual addresses a process can use, holding its code, heap and stack.
    see: virtual-memory
    source:
      title: "The Abstraction: Address Spaces (OSTEP ch. 13)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-intro.pdf
      verifiedOn: 2026-10-20
  - id: virtual-address
    term: Virtual address
    aka:
      - virtual addresses
    definition: An address a program uses; the MMU translates it to a physical address in RAM.
    see: virtual-memory
    source:
      title: "Mechanism: Address Translation (OSTEP ch. 15)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-mechanism.pdf
      verifiedOn: 2026-10-20
  - id: mmu
    term: MMU
    aka:
      - memory management unit
    definition: CPU hardware that translates virtual addresses to physical addresses on every memory access.
    see: virtual-memory
    source:
      title: "Mechanism: Address Translation (OSTEP ch. 15)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-mechanism.pdf
      verifiedOn: 2026-10-20
  - id: segmentation-fault
    term: Segmentation fault
    aka:
      - segfault
      - SIGSEGV
    definition: The signal a process gets for an invalid memory reference, such as a bad pointer.
    see: virtual-memory
    source:
      title: signal(7) (Linux manual page)
      url: https://man7.org/linux/man-pages/man7/signal.7.html
      verifiedOn: 2026-10-20
  - id: overcommit
    term: Overcommit
    aka:
      - memory overcommit
    definition: Linux letting processes reserve more memory than it can back right now, betting not all of it is touched.
    see: virtual-memory
    source:
      title: Overcommit Accounting (Linux kernel docs)
      url: https://docs.kernel.org/mm/overcommit-accounting.html
      verifiedOn: 2026-10-20
  - id: swap-space
    term: Swap space
    aka:
      - swap area
    definition: Disk space where the OS keeps pages moved out of RAM.
    see: virtual-memory
    source:
      title: "Beyond Physical Memory: Mechanisms (OSTEP ch. 21)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys.pdf
      verifiedOn: 2026-10-20
  - id: rss
    term: RSS (resident set size)
    aka:
      - resident set size
      - RSS
    definition: The part of a process's memory that is in physical RAM right now.
    see: virtual-memory
    source:
      title: ps(1) (Linux manual page)
      url: https://man7.org/linux/man-pages/man1/ps.1.html
      verifiedOn: 2026-10-20
  - id: oom-killer
    term: OOM killer
    aka:
      - out-of-memory killer
    definition: The Linux kernel part that kills a chosen process to free memory when reclaim fails.
    see: virtual-memory
    source:
      title: Memory management concepts (Linux kernel docs)
      url: https://docs.kernel.org/admin-guide/mm/concepts.html
      verifiedOn: 2026-10-20
  - id: page-memory
    term: Page (memory)
    aka:
      - memory page
      - virtual page
      - page size
    definition: "A fixed-size block of virtual memory, the unit of mapping: 4 KiB on x86-64 Linux."
    see: paging-and-page-faults
    source:
      title: HugeTLB Pages (Linux kernel docs)
      url: https://docs.kernel.org/admin-guide/mm/hugetlbpage.html
      verifiedOn: 2026-10-20
  - id: frame-memory
    term: Frame (memory)
    aka:
      - page frame
      - page frames
      - physical frame
    definition: A page-sized block of physical RAM that holds one page.
    see: paging-and-page-faults
    source:
      title: Memory management concepts (Linux kernel docs)
      url: https://docs.kernel.org/admin-guide/mm/concepts.html
      verifiedOn: 2026-10-20
  - id: page-table
    term: Page table
    aka:
      - page tables
    definition: The per-process map from virtual pages to physical frames, with valid and permission bits.
    see: paging-and-page-faults
    source:
      title: "Paging: Introduction (OSTEP ch. 18)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-paging.pdf
      verifiedOn: 2026-10-20
  - id: tlb
    term: TLB
    aka:
      - translation lookaside buffer
    definition: A small CPU cache of recent virtual-to-physical address translations.
    see: paging-and-page-faults
    source:
      title: Memory management concepts (Linux kernel docs)
      url: https://docs.kernel.org/admin-guide/mm/concepts.html
      verifiedOn: 2026-10-20
  - id: huge-page
    term: Huge page
    aka:
      - huge pages
      - hugepages
    definition: A larger page, 2 MiB or 1 GiB on x86, that cuts TLB misses for memory-hungry programs.
    see: paging-and-page-faults
    source:
      title: Memory management concepts (Linux kernel docs)
      url: https://docs.kernel.org/admin-guide/mm/concepts.html
      verifiedOn: 2026-10-20
  - id: page-fault
    term: Page fault
    aka:
      - page faults
    definition: A trap when a process touches a page not mapped in RAM; the kernel maps it or sends SIGSEGV.
    see: paging-and-page-faults
    source:
      title: "Beyond Physical Memory: Mechanisms (OSTEP ch. 21)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys.pdf
      verifiedOn: 2026-10-20
  - id: demand-paging
    term: Demand paging
    aka: []
    definition: Giving a page RAM only when it is first accessed, not in advance.
    see: paging-and-page-faults
    source:
      title: Memory management concepts (Linux kernel docs)
      url: https://docs.kernel.org/admin-guide/mm/concepts.html
      verifiedOn: 2026-10-20
  - id: segmentation
    term: Segmentation (memory)
    aka:
      - memory segmentation
    definition: Splitting memory into variable-size segments, such as code, heap and stack, each with a base and bounds.
    see: paging-and-page-faults
    source:
      title: Segmentation (OSTEP ch. 16)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-segmentation.pdf
      verifiedOn: 2026-10-20
  - id: internal-fragmentation
    term: Internal fragmentation
    aka: []
    definition: Wasted space inside an allocated block, such as the unused tail of a page.
    see: paging-and-page-faults
    source:
      title: "Paging: Smaller Tables (OSTEP ch. 20)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-smalltables.pdf
      verifiedOn: 2026-10-20
  - id: external-fragmentation
    term: External fragmentation
    aka: []
    definition: Free memory broken into small holes, so a large request fails though the total is enough.
    see: paging-and-page-faults
    source:
      title: Segmentation (OSTEP ch. 16)
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-segmentation.pdf
      verifiedOn: 2026-10-20
  - id: lru
    term: LRU
    aka:
      - least recently used
    definition: An eviction policy that removes the item unused for the longest time.
    see: page-replacement
    source:
      title: "Beyond Physical Memory: Policies (OSTEP ch. 22)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys-policy.pdf
      verifiedOn: 2026-10-20
  - id: beladys-anomaly
    term: Belady's anomaly
    aka:
      - Belady anomaly
    definition: With FIFO page replacement, adding frames can cause more page faults.
    see: page-replacement
    source:
      title: "Beyond Physical Memory: Policies (OSTEP ch. 22)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys-policy.pdf
      verifiedOn: 2026-10-20
  - id: working-set
    term: Working set
    aka:
      - working sets
    definition: The pages a process is actively using right now.
    see: page-replacement
    source:
      title: "Beyond Physical Memory: Policies (OSTEP ch. 22)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys-policy.pdf
      verifiedOn: 2026-10-20
  - id: thrashing
    term: Thrashing
    aka: []
    definition: Constant paging because working sets do not fit in RAM, so little real work gets done.
    see: page-replacement
    source:
      title: "Beyond Physical Memory: Policies (OSTEP ch. 22)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys-policy.pdf
      verifiedOn: 2026-10-20
  - id: blocking-io
    term: Blocking I/O
    aka: []
    definition: I/O where the calling thread waits inside the call until the operation can complete.
    see: blocking-and-non-blocking-io
    source:
      title: open(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/open.2.html
      verifiedOn: 2026-10-20
  - id: non-blocking-io
    term: Non-blocking I/O
    aka:
      - O_NONBLOCK
    definition: "I/O on an fd in O_NONBLOCK mode: a call that would wait fails at once with EAGAIN."
    see: blocking-and-non-blocking-io
    source:
      title: "read(2), ERRORS: EAGAIN (Linux man-pages)"
      url: https://man7.org/linux/man-pages/man2/read.2.html
      verifiedOn: 2026-10-20
  - id: asynchronous-io
    term: Asynchronous I/O
    aka:
      - async I/O
      - AIO
    definition: I/O the kernel carries out in the background, then reports as complete, as with io_uring or POSIX AIO.
    see: blocking-and-non-blocking-io
    source:
      title: "aio(7): POSIX asynchronous I/O (Linux man-pages)"
      url: https://man7.org/linux/man-pages/man7/aio.7.html
      verifiedOn: 2026-10-20
  - id: eagain
    term: EAGAIN
    aka:
      - EWOULDBLOCK
    definition: "Error from a non-blocking call that would have to wait: try again when the fd is ready."
    see: blocking-and-non-blocking-io
    source:
      title: "read(2), ERRORS: EAGAIN (Linux man-pages)"
      url: https://man7.org/linux/man-pages/man2/read.2.html
      verifiedOn: 2026-10-20
  - id: io-uring
    term: io_uring
    aka: []
    definition: Linux async I/O API, since Linux 5.1, built on submission and completion rings shared with the kernel.
    see: blocking-and-non-blocking-io
    source:
      title: io_uring(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/io_uring.7.html
      verifiedOn: 2026-10-20
  - id: epoll
    term: epoll
    aka: []
    definition: Linux API that watches many fds and returns only the ready ones; scales to many idle connections.
    see: io-multiplexing
    source:
      title: epoll(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/epoll.7.html
      verifiedOn: 2026-10-20
  - id: level-triggered
    term: Level-triggered
    aka:
      - level triggering
    definition: Readiness reported on every wait while the fd still has data; the epoll default.
    see: io-multiplexing
    source:
      title: epoll(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/epoll.7.html
      verifiedOn: 2026-10-20
  - id: edge-triggered
    term: Edge-triggered
    aka:
      - EPOLLET
      - edge triggering
    definition: Readiness reported only when new data arrives; read until EAGAIN or the rest may sit unnoticed.
    see: io-multiplexing
    source:
      title: epoll(7) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man7/epoll.7.html
      verifiedOn: 2026-10-20
  - id: event-loop
    term: Event loop
    aka: []
    definition: A loop that waits for I/O events and runs the handler for each ready one; handlers must not block.
    see: io-multiplexing
    source:
      title: "OSTEP ch. 33: Event-based Concurrency (Advanced) (Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/threads-events.pdf
      verifiedOn: 2026-10-20
  - id: c10k-problem
    term: C10k problem
    aka:
      - C10k
    definition: The challenge, named by Dan Kegel, of one server handling 10,000 clients at the same time.
    see: io-multiplexing
    source:
      title: The C10K problem (Dan Kegel, author page)
      url: https://www.kegel.com/c10k.html
      verifiedOn: 2026-10-20
  - id: thread-per-request
    term: Thread-per-request
    aka:
      - thread per request
    definition: Server style where one thread handles a request from start to finish, blocking on its I/O.
    see: io-multiplexing
    source:
      title: "JEP 444: Virtual Threads (OpenJDK)"
      url: https://openjdk.org/jeps/444
      verifiedOn: 2026-10-20
  - id: file-descriptor
    term: File descriptor
    aka:
      - fd
    definition: "A small non-negative integer a process uses to refer to something open: a file, socket or pipe."
