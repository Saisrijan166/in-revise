      title: fsync(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/fsync.2.html
      verifiedOn: 2026-10-20
  - id: hdd
    term: HDD
    aka:
      - hard disk drive
      - hard drive
