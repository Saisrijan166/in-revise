      title: "OSTEP ch. 44: Flash-based SSDs (Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/file-ssd.pdf
      verifiedOn: 2026-10-20
  - id: iops
    term: IOPS
