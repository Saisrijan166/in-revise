    source:
      title: open(2) (Linux man-pages)
      url: https://man7.org/linux/man-pages/man2/open.2.html
      verifiedOn: 2026-10-20
  - id: open-file-limit
    term: Open-file limit
    aka:
      - RLIMIT_NOFILE
      - EMFILE
      - Too many open files
    definition: Per-process cap on open fds (RLIMIT_NOFILE); going past it fails with EMFILE, "Too many open files".
    see: files-and-file-descriptors
    source:
      title: "errno(3): EMFILE (Linux man-pages)"
      url: https://man7.org/linux/man-pages/man3/errno.3.html
      verifiedOn: 2026-10-20
  - id: inode
    term: Inode
    aka:
      - i-number
      - inode number
    definition: The record of a file's metadata, such as owner, mode, size and link count; names live in directories.
