      title: "OSTEP ch. 37: Hard Disk Drives (Arpaci-Dusseau)"
      url: https://pages.cs.wisc.edu/~remzi/OSTEP/file-disks.pdf
      verifiedOn: 2026-10-20
  - id: ssd
    term: SSD
    aka:
      - solid-state drive
    definition: Flash storage with no moving parts; far faster than an HDD at random I/O.
