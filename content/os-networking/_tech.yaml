name: OS & Networking
slug: os-networking
accent: slate
summary: "How a server runs your code and talks to the world: processes, threads, locks, memory, I/O, TCP/IP, HTTP, TLS and DNS, tied to system design."
codeLanguages:
  - java
storySpine:
  - step: Programs share one CPU, memory and disk and must not break each other → the kernel runs them as isolated processes in user mode and checks every request through system calls
    cards:
      - what-is-an-os
      - processes
  - step: Thousands of requests each get a new thread and the server drowns in context switches → run threads inside one process, schedule them fairly and reuse a bounded thread pool
    cards:
      - threads
      - context-switching
      - cpu-scheduling
      - thread-pools
  - step: Requests wait on I/O most of the time, so one-by-one serving wastes the CPU → interleave many tasks (concurrency) and run CPU work on several cores (parallelism)
    cards:
      - concurrency-and-parallelism
  - step: Threads that share a counter or the last item in stock lose updates → make each step atomic with locks, atomic operations and semaphores, and take locks in one order so they never deadlock
    cards:
      - race-conditions
      - locks
      - semaphores
      - deadlocks
  - step: The CPU would wait on slow RAM, and every call needs scratch space → keep hot data in CPU caches, call data on each thread's stack and shared objects on the heap
    cards:
      - memory-hierarchy
      - stack-and-heap
  - step: Programs could overwrite each other and RAM is never enough → give each process its own virtual address space, mapped page by page, and evict pages wisely when RAM fills
    cards:
      - virtual-memory
      - paging-and-page-faults
      - page-replacement
  - step: Each request's thread sleeps while it waits on the database or a slow client → use non-blocking I/O and let one event-loop thread watch many sockets with epoll
    cards:
      - blocking-and-non-blocking-io
      - io-multiplexing
  - step: Connections run out of file descriptors, writes vanish in a crash, and processes cannot share memory → raise the open-file limit, fsync, use IPC and stop on SIGTERM
    cards:
      - files-and-file-descriptors
      - ipc
  - step: "Network software is too big to reason about as one piece → split it into layers: OSI to name the jobs, TCP/IP to run them, each layer wrapping the one above"
    cards:
      - osi-model
      - tcp-ip-model
  - step: A packet must find one host among billions and then one program on it → IP addresses, prefixes and NAT find the host, switches and routers carry it hop by hop, ports and sockets find the program
    cards:
      - ip-addressing
      - switches-and-routers
      - ports-and-sockets
  - step: Packets get lost or reordered, yet some apps cannot wait for resends → TCP opens a connection and delivers an ordered stream; UDP sends bare datagrams
    cards:
      - tcp-and-udp
      - tcp-handshake
  - step: Lost segments and fast senders overflow receivers and routers → TCP resends by byte number and paces itself with two windows
    cards:
      - tcp-reliability
      - flow-and-congestion-control
  - step: Clients know the name api.shop.example, but packets need an IP → DNS looks it up through resolvers and caches it for its TTL
    cards:
      - dns
  - step: Requests travel in plain text, one at a time, and the server can only answer → HTTP methods and status codes, HTTPS with TLS 1.3, HTTP/2 and HTTP/3 streams, and SSE or WebSockets for live updates
    cards:
      - http-basics
      - tls-https
      - http-versions
      - real-time-connections
  - step: One server hits its limit and its crash takes the site down → put identical instances behind a load balancer, cache static files at CDN edges, and reuse database connections from a small pool
    cards:
      - load-balancers-and-proxies
      - caching-and-cdn
      - connection-pooling
  - step: Far users wait on round trips and a lost reply makes a retry charge twice → cut round trips, set timeouts, retry with backoff and idempotency keys, and trace the whole request path
    cards:
      - latency-and-bandwidth
      - network-failures
      - request-journey
topics:
  - id: os-basics
    title: OS Basics and Processes
    order: 1
    blurb: The kernel and system calls, processes and threads, context switches, CPU scheduling and thread pools.
  - id: concurrency
    title: Concurrency and Synchronization
    order: 2
    blurb: Concurrency vs parallelism, race conditions, locks, semaphores and deadlocks.
  - id: memory
    title: Memory
    order: 3
    blurb: The memory hierarchy, stack and heap, virtual memory, paging, page faults and page replacement.
  - id: io
    title: I/O, Files and IPC
    order: 4
    blurb: Blocking and non-blocking I/O, epoll and event loops, file descriptors and storage, and how processes talk.
  - id: network-layers
    title: Network Layers and Addressing
    order: 5
    blurb: The OSI and TCP/IP models, IP addresses and subnets, ports and sockets, switches and routers.
  - id: transport
    title: TCP and UDP
    order: 6
    blurb: TCP vs UDP, the handshake and close, how TCP stays reliable, and flow vs congestion control.
  - id: application
    title: HTTP, TLS and DNS
    order: 7
    blurb: DNS resolution, HTTP basics and versions, HTTPS with TLS 1.3, and real-time connections.
  - id: system-design-bridge
    title: Networks in System Design
    order: 8
    blurb: Load balancers and proxies, caching and CDNs, connection pools, latency, network failures and the request journey.
template: 3
