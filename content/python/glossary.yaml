terms:
  - id: python
    term: Python
    definition: "A high-level, general-purpose programming language known for simple, readable syntax and dynamic typing."
    see: what-is-python
    source: { title: "The Python Tutorial", url: "https://docs.python.org/3/tutorial/index.html", verifiedOn: "2026-11-02" }
  - id: interpreted-language
    term: Interpreted language
    definition: "A language whose code is run by a runtime rather than compiled to machine code first; CPython compiles to bytecode, then runs it."
    see: python-execution-model
    source: { title: "Python Glossary: interpreted", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: pep
    term: PEP
    aka: ["Python Enhancement Proposal"]
    definition: "A Python Enhancement Proposal: a design document that proposes a new feature or process for Python."
    source: { title: "PEP 1 - PEP Purpose and Guidelines", url: "https://peps.python.org/pep-0001/", verifiedOn: "2026-11-02" }
  - id: pep-8
    term: PEP 8
    definition: "The official style guide for writing readable Python code, covering naming, spacing and layout."
    source: { title: "PEP 8 - Style Guide for Python Code", url: "https://peps.python.org/pep-0008/", verifiedOn: "2026-11-02" }
  - id: cpython
    term: CPython
    definition: "The standard, reference Python implementation, written in C; the one most people mean by Python."
    see: python-execution-model
    source: { title: "Python Glossary: CPython", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: pypy
    term: PyPy
    definition: "An alternative Python implementation with a just-in-time (JIT) compiler, often faster for long-running code."
    source: { title: "PyPy", url: "https://www.pypy.org/", verifiedOn: "2026-11-02" }
  - id: jython
    term: Jython
    definition: "A Python implementation that runs on the Java Virtual Machine (JVM) and can use Java libraries."
    source: { title: "Jython", url: "https://www.jython.org/", verifiedOn: "2026-11-02" }
  - id: pvm
    term: PVM
    aka: ["Python Virtual Machine"]
    definition: "The Python Virtual Machine: the part of the runtime that executes compiled Python bytecode."
    see: python-execution-model
    source: { title: "Python Glossary: bytecode", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: bytecode
    term: Bytecode
    definition: "Low-level instructions that CPython compiles source code into, then runs on the virtual machine. Cached in .pyc files."
    see: python-execution-model
    source: { title: "Python Glossary: bytecode", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: repl
    term: REPL
    aka: ["interactive mode", "read-eval-print loop"]
    definition: "The interactive prompt where you type one statement at a time and see the result straight away."
    source: { title: "Appendix: Interactive Mode", url: "https://docs.python.org/3/tutorial/appendix.html", verifiedOn: "2026-11-02" }
  - id: source-code
    term: Source code
    definition: "The Python you write, stored in .py files, before it is compiled to bytecode and run."
    source: { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: script
    term: Script
    definition: "A .py file meant to be run directly to do a task, as opposed to a module that is imported."
    source: { title: "Python Glossary: script", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: indentation
    term: Indentation
    definition: "Leading whitespace that groups statements into a block; Python uses it instead of curly braces."
    source: { title: "Python Tutorial: First Steps", url: "https://docs.python.org/3/tutorial/introduction.html", verifiedOn: "2026-11-02" }
  - id: dynamic-typing
    term: Dynamic typing
    aka: ["dynamically typed"]
    definition: "Variable types are decided at runtime, not declared; the same name can point to different types over time."
    see: dynamic-and-strong-typing
    source: { title: "Python Glossary: duck-typing", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: strong-typing
    term: Strong typing
    aka: ["strongly typed"]
    definition: "Python does not silently mix incompatible types, such as adding a string to an integer; you must convert first."
    see: dynamic-and-strong-typing
    source: { title: "The Python Language Reference", url: "https://docs.python.org/3/reference/datamodel.html", verifiedOn: "2026-11-02" }
  - id: duck-typing
    term: Duck typing
    definition: "If an object supports the needed methods, it can be used, whatever its class. Behaviour matters, not type."
    see: polymorphism
    source: { title: "Python Glossary: duck-typing", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: object
    term: Object
    definition: "Any value in Python; everything, including numbers, functions and classes, is an object with a type and identity."
    see: variables-and-objects
    source: { title: "Python Glossary: object", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: variable
    term: Variable
    definition: "A name that refers to an object in memory; assigning does not copy, it binds a name to an object."
    see: variables-and-objects
    source: { title: "The Python Language Reference: Execution model", url: "https://docs.python.org/3/reference/executionmodel.html", verifiedOn: "2026-11-02" }
  - id: reference
    term: Reference
    definition: "A link from a name to an object. Several names can refer to the same object."
    see: variables-and-objects
    source: { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: mutable
    term: Mutable
    definition: "An object whose contents can change after it is created, such as a list, set or dictionary."
    see: mutable-vs-immutable
    source: { title: "Python Glossary: mutable", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: immutable
    term: Immutable
    definition: "An object that cannot be changed after it is created, such as an int, str, tuple or frozenset."
    see: mutable-vs-immutable
    source: { title: "Python Glossary: immutable", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: hashable
    term: Hashable
    definition: "An object with a fixed hash value for its lifetime, so it can be a dictionary key or set element."
    see: dictionaries
    source: { title: "Python Glossary: hashable", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: none
    term: None
    aka: ["NoneType"]
    definition: "The sole value of type NoneType, meaning no value. It is not 0, False or an empty string."
    see: builtin-data-types
    source: { title: "Built-in Constants: None", url: "https://docs.python.org/3/library/constants.html#None", verifiedOn: "2026-11-02" }
  - id: type-conversion
    term: Type conversion
    aka: ["type casting"]
    definition: "Changing a value from one type to another, such as int(\"10\") or str(25). Also called casting."
    see: builtin-data-types
    source: { title: "Built-in Functions", url: "https://docs.python.org/3/library/functions.html", verifiedOn: "2026-11-02" }
  - id: type-inference
    term: Type inference
    definition: "Python working out a variable's type automatically from the value assigned, with no type declaration."
    see: dynamic-and-strong-typing
    source: { title: "The Python Language Reference", url: "https://docs.python.org/3/reference/datamodel.html", verifiedOn: "2026-11-02" }
  - id: interning
    term: Interning
    definition: "Reusing one shared object for certain small values (like small ints and some strings) to save memory."
    see: equality-vs-identity
    source: { title: "sys.intern", url: "https://docs.python.org/3/library/sys.html#sys.intern", verifiedOn: "2026-11-02" }
  - id: reference-counting
    term: Reference counting
    definition: "CPython's main memory scheme: each object counts its references and is freed when the count hits zero."
    see: memory-and-gc
    source: { title: "Extending Python: Reference Counts", url: "https://docs.python.org/3/extending/extending.html#reference-counts", verifiedOn: "2026-11-02" }
  - id: garbage-collection
    term: Garbage collection
    aka: ["garbage collector", "GC"]
    definition: "Reclaiming memory from unreachable objects. CPython adds a cyclic collector to find reference cycles."
    see: memory-and-gc
    source: { title: "gc - Garbage Collector interface", url: "https://docs.python.org/3/library/gc.html", verifiedOn: "2026-11-02" }
  - id: del
    term: del
    definition: "Removes a name or an item; it drops a reference and does not always destroy the object straight away."
    see: memory-and-gc
    source: { title: "The del statement", url: "https://docs.python.org/3/reference/simple_stmts.html#the-del-statement", verifiedOn: "2026-11-02" }
  - id: id
    term: "id()"
    definition: "Returns an integer that is unique and constant for an object during its lifetime; its identity."
    see: equality-vs-identity
    source: { title: "Built-in Functions: id", url: "https://docs.python.org/3/library/functions.html#id", verifiedOn: "2026-11-02" }
  - id: int
    term: int
    definition: "The integer type for whole numbers of any size; immutable."
    see: builtin-data-types
    source: { title: "Numeric Types", url: "https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex", verifiedOn: "2026-11-02" }
  - id: float
    term: float
    definition: "The type for decimal numbers, stored as a double-precision floating point value; immutable."
    see: builtin-data-types
    source: { title: "Numeric Types", url: "https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex", verifiedOn: "2026-11-02" }
  - id: complex
    term: complex
    definition: "The type for complex numbers with a real and imaginary part, written like 2+3j."
    see: builtin-data-types
    source: { title: "Numeric Types", url: "https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex", verifiedOn: "2026-11-02" }
  - id: bool
    term: bool
    definition: "The type with values True and False; a subclass of int where True is 1 and False is 0."
    see: builtin-data-types
    source: { title: "Boolean Type", url: "https://docs.python.org/3/library/stdtypes.html#boolean-type-bool", verifiedOn: "2026-11-02" }
  - id: str
    term: str
    aka: ["string"]
    definition: "The immutable text type: a sequence of Unicode characters."
    see: strings
    source: { title: "Text Sequence Type - str", url: "https://docs.python.org/3/library/stdtypes.html#text-sequence-type-str", verifiedOn: "2026-11-02" }
  - id: list
    term: list
    definition: "An ordered, mutable sequence that allows duplicates and mixed types; written with square brackets."
    see: lists
    source: { title: "Lists", url: "https://docs.python.org/3/tutorial/datastructures.html#more-on-lists", verifiedOn: "2026-11-02" }
  - id: tuple
    term: tuple
    definition: "An ordered, immutable sequence; written with round brackets. A one-item tuple needs a trailing comma."
    see: tuples
    source: { title: "Tuples and Sequences", url: "https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences", verifiedOn: "2026-11-02" }
  - id: set
    term: set
    definition: "An unordered, mutable collection of unique hashable elements; good for removing duplicates and set maths."
    see: sets
    source: { title: "Sets", url: "https://docs.python.org/3/tutorial/datastructures.html#sets", verifiedOn: "2026-11-02" }
  - id: frozenset
    term: frozenset
    definition: "An immutable, hashable version of a set; it can itself be a set element or a dictionary key."
    see: sets
    source: { title: "frozenset", url: "https://docs.python.org/3/library/stdtypes.html#frozenset", verifiedOn: "2026-11-02" }
  - id: dict
    term: dict
    aka: ["dictionary"]
    definition: "A mutable collection of key-value pairs; keys must be hashable and unique. Keeps insertion order since Python 3.7."
    see: dictionaries
    source: { title: "Dictionaries", url: "https://docs.python.org/3/tutorial/datastructures.html#dictionaries", verifiedOn: "2026-11-02" }
  - id: range
    term: range
    definition: "An immutable sequence of integers generated on demand; range(start, stop, step), stop excluded."
    see: loops
    source: { title: "Ranges", url: "https://docs.python.org/3/library/stdtypes.html#ranges", verifiedOn: "2026-11-02" }
  - id: bytes
    term: bytes
    definition: "An immutable sequence of bytes (0-255), used for binary data; written like b\"hello\"."
    see: builtin-data-types
    source: { title: "Bytes Objects", url: "https://docs.python.org/3/library/stdtypes.html#bytes-objects", verifiedOn: "2026-11-02" }
  - id: type-function
    term: "type()"
    definition: "Returns the exact type of an object; type(x) gives its class."
    see: type-checking
    source: { title: "Built-in Functions: type", url: "https://docs.python.org/3/library/functions.html#type", verifiedOn: "2026-11-02" }
  - id: isinstance
    term: "isinstance()"
    definition: "Checks whether an object is of a type or any of its subclasses; preferred over type() for type checks."
    see: type-checking
    source: { title: "Built-in Functions: isinstance", url: "https://docs.python.org/3/library/functions.html#isinstance", verifiedOn: "2026-11-02" }
  - id: issubclass
    term: "issubclass()"
    definition: "Checks whether one class inherits from another class (directly or indirectly)."
    see: inheritance
    source: { title: "Built-in Functions: issubclass", url: "https://docs.python.org/3/library/functions.html#issubclass", verifiedOn: "2026-11-02" }
  - id: equality
    term: "== (equality)"
    aka: ["equality operator"]
    definition: "Compares whether two objects have the same value. Uses the __eq__ method."
    see: equality-vs-identity
    source: { title: "Comparisons", url: "https://docs.python.org/3/reference/expressions.html#comparisons", verifiedOn: "2026-11-02" }
  - id: identity
    term: "is (identity)"
    aka: ["identity operator"]
    definition: "Checks whether two names refer to the exact same object in memory, not just equal values."
    see: equality-vs-identity
    source: { title: "Identity comparisons", url: "https://docs.python.org/3/reference/expressions.html#is", verifiedOn: "2026-11-02" }
  - id: floor-division
    term: Floor division
    aka: ["//"]
    definition: "The // operator: divides and rounds down towards negative infinity, giving a whole-number result."
    see: operators-overview
    source: { title: "Binary arithmetic operations", url: "https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations", verifiedOn: "2026-11-02" }
  - id: modulus
    term: Modulus
    aka: ["%", "modulo"]
    definition: "The % operator: returns the remainder after division."
    see: operators-overview
    source: { title: "Binary arithmetic operations", url: "https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations", verifiedOn: "2026-11-02" }
  - id: membership-operator
    term: Membership operator
    aka: ["in", "not in"]
    definition: "in and not in test whether a value is present in a collection; for a dict they test keys."
    see: operators-overview
    source: { title: "Membership test operations", url: "https://docs.python.org/3/reference/expressions.html#membership-test-operations", verifiedOn: "2026-11-02" }
  - id: logical-operators
    term: Logical operators
    aka: ["and", "or", "not"]
    definition: "and, or and not combine Boolean values; and/or short-circuit and return one of their operands."
    see: operators-overview
    source: { title: "Boolean operations", url: "https://docs.python.org/3/reference/expressions.html#boolean-operations", verifiedOn: "2026-11-02" }
  - id: ternary-expression
    term: Ternary expression
    aka: ["conditional expression"]
    definition: "A one-line choice: value_if_true if condition else value_if_false."
    see: conditionals
    source: { title: "Conditional expressions", url: "https://docs.python.org/3/reference/expressions.html#conditional-expressions", verifiedOn: "2026-11-02" }
  - id: break
    term: break
    definition: "Immediately exits the nearest enclosing for or while loop."
    see: loop-control
    source: { title: "break and continue", url: "https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements", verifiedOn: "2026-11-02" }
  - id: continue
    term: continue
    definition: "Skips the rest of the current loop iteration and moves to the next one."
    see: loop-control
    source: { title: "break and continue", url: "https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements", verifiedOn: "2026-11-02" }
  - id: pass
    term: pass
    definition: "Does nothing; a placeholder where a statement is required syntactically but no action is wanted."
    see: loop-control
    source: { title: "The pass statement", url: "https://docs.python.org/3/reference/simple_stmts.html#the-pass-statement", verifiedOn: "2026-11-02" }
  - id: loop-else
    term: Loop else
    definition: "An else block on a for or while loop runs only if the loop finished without hitting break."
    see: loop-control
    source: { title: "else Clauses on Loops", url: "https://docs.python.org/3/tutorial/controlflow.html#else-clauses-on-loops", verifiedOn: "2026-11-02" }
  - id: slicing
    term: Slicing
    definition: "Taking part of a sequence with [start:stop:step]; stop is excluded, and the step can be negative."
    see: strings
    source: { title: "Common Sequence Operations", url: "https://docs.python.org/3/library/stdtypes.html#common-sequence-operations", verifiedOn: "2026-11-02" }
  - id: indexing
    term: Indexing
    definition: "Accessing one element by position; indexing starts at 0, and -1 is the last element."
    see: strings
    source: { title: "Strings", url: "https://docs.python.org/3/tutorial/introduction.html#strings", verifiedOn: "2026-11-02" }
  - id: f-string
    term: f-string
    aka: ["formatted string literal"]
    definition: "A string prefixed with f where {expr} is replaced by the expression's value; the easiest way to format."
    see: strings
    source: { title: "Formatted string literals", url: "https://docs.python.org/3/reference/lexical_analysis.html#f-strings", verifiedOn: "2026-11-02" }
  - id: escape-character
    term: Escape character
    definition: "A backslash sequence that stands for a special character, such as \\n for newline and \\t for tab."
    see: strings
    source: { title: "String and Bytes literals", url: "https://docs.python.org/3/reference/lexical_analysis.html#string-and-bytes-literals", verifiedOn: "2026-11-02" }
  - id: comprehension
    term: Comprehension
    aka: ["list comprehension", "dict comprehension", "set comprehension"]
    definition: "A short expression that builds a list, set or dict from an iterable, with an optional condition."
    see: comprehensions
    source: { title: "List Comprehensions", url: "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions", verifiedOn: "2026-11-02" }
  - id: generator-expression
    term: Generator expression
    definition: "A comprehension in round brackets that produces values lazily, one at a time, instead of a full list."
    see: comprehensions
    source: { title: "Python Glossary: generator expression", url: "https://docs.python.org/3/glossary.html#term-generator-expression", verifiedOn: "2026-11-02" }
  - id: unpacking
    term: Unpacking
    definition: "Assigning the items of an iterable to several names at once, such as a, b = pair."
    see: unpacking-and-swapping
    source: { title: "Unpacking Argument Lists", url: "https://docs.python.org/3/tutorial/controlflow.html#unpacking-argument-lists", verifiedOn: "2026-11-02" }
  - id: extended-unpacking
    term: Extended unpacking
    definition: "Using * to gather the remaining items into a list, as in first, *rest = items."
    see: unpacking-and-swapping
    source: { title: "PEP 3132 - Extended Iterable Unpacking", url: "https://peps.python.org/pep-3132/", verifiedOn: "2026-11-02" }
  - id: function
    term: Function
    definition: "A reusable, named block of code defined with def that performs a task and can return a value."
    see: functions-basics
    source: { title: "Defining Functions", url: "https://docs.python.org/3/tutorial/controlflow.html#defining-functions", verifiedOn: "2026-11-02" }
  - id: parameter
    term: Parameter
    definition: "A variable named in a function definition; the argument is the actual value passed when calling."
    see: function-arguments
    source: { title: "Python Glossary: parameter", url: "https://docs.python.org/3/glossary.html#term-parameter", verifiedOn: "2026-11-02" }
  - id: argument
    term: Argument
    definition: "The actual value passed to a function when it is called, filling a parameter."
    see: function-arguments
    source: { title: "Python Glossary: argument", url: "https://docs.python.org/3/glossary.html#term-argument", verifiedOn: "2026-11-02" }
  - id: positional-argument
    term: Positional argument
    definition: "An argument passed by its order in the call, matched to parameters left to right."
    see: function-arguments
    source: { title: "Python Glossary: argument", url: "https://docs.python.org/3/glossary.html#term-argument", verifiedOn: "2026-11-02" }
  - id: keyword-argument
    term: Keyword argument
    definition: "An argument passed by name, as in greet(name=\"Sri\"); order then does not matter."
    see: function-arguments
    source: { title: "Keyword Arguments", url: "https://docs.python.org/3/tutorial/controlflow.html#keyword-arguments", verifiedOn: "2026-11-02" }
  - id: default-argument
    term: Default argument
    definition: "A parameter with a preset value used when the caller omits it; avoid mutable defaults."
    see: function-arguments
    source: { title: "Default Argument Values", url: "https://docs.python.org/3/tutorial/controlflow.html#default-argument-values", verifiedOn: "2026-11-02" }
  - id: args
    term: "*args"
    definition: "Collects any extra positional arguments into a tuple. The name args is just a convention; the * matters."
    see: function-arguments
    source: { title: "Arbitrary Argument Lists", url: "https://docs.python.org/3/tutorial/controlflow.html#arbitrary-argument-lists", verifiedOn: "2026-11-02" }
  - id: kwargs
    term: "**kwargs"
    definition: "Collects any extra keyword arguments into a dictionary. The name is a convention; the ** matters."
    see: function-arguments
    source: { title: "Keyword Arguments", url: "https://docs.python.org/3/tutorial/controlflow.html#keyword-arguments", verifiedOn: "2026-11-02" }
  - id: return
    term: return
    definition: "Sends a value back to the caller and ends the function. With no return, a function returns None."
    see: functions-basics
    source: { title: "The return statement", url: "https://docs.python.org/3/reference/simple_stmts.html#the-return-statement", verifiedOn: "2026-11-02" }
  - id: docstring
    term: Docstring
    definition: "A string literal at the top of a module, function or class that documents it; stored on __doc__."
    see: functions-basics
    source: { title: "Documentation Strings", url: "https://docs.python.org/3/tutorial/controlflow.html#documentation-strings", verifiedOn: "2026-11-02" }
  - id: lambda
    term: Lambda
    aka: ["anonymous function"]
    definition: "A small, nameless function of one expression, written lambda args: expression."
    see: lambda
    source: { title: "Lambda Expressions", url: "https://docs.python.org/3/tutorial/controlflow.html#lambda-expressions", verifiedOn: "2026-11-02" }
  - id: recursion
    term: Recursion
    definition: "A function that calls itself, with a base case to stop. Too deep raises RecursionError."
    see: recursion
    source: { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: scope
    term: Scope
    definition: "The region of code where a name is visible and can be used."
    see: scope-legb
    source: { title: "Scopes and Namespaces", url: "https://docs.python.org/3/tutorial/classes.html#python-scopes-and-namespaces", verifiedOn: "2026-11-02" }
  - id: legb
    term: LEGB
    definition: "The name-lookup order: Local, Enclosing, Global, then Built-in scope."
    see: scope-legb
    source: { title: "Scopes and Namespaces", url: "https://docs.python.org/3/tutorial/classes.html#python-scopes-and-namespaces", verifiedOn: "2026-11-02" }
  - id: global
    term: global
    definition: "A statement that lets a function rebind a module-level (global) variable instead of making a local one."
    see: scope-legb
    source: { title: "The global statement", url: "https://docs.python.org/3/reference/simple_stmts.html#the-global-statement", verifiedOn: "2026-11-02" }
  - id: nonlocal
    term: nonlocal
    definition: "A statement that lets an inner function rebind a variable in the nearest enclosing function."
    see: scope-legb
    source: { title: "The nonlocal statement", url: "https://docs.python.org/3/reference/simple_stmts.html#the-nonlocal-statement", verifiedOn: "2026-11-02" }
  - id: closure
    term: Closure
    definition: "An inner function that remembers variables from the enclosing function even after it has returned."
    see: closures
    source: { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: first-class-function
    term: First-class function
    definition: "A function that can be stored in a variable, passed as an argument and returned, like any other object."
    see: closures
    source: { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: higher-order-function
    term: Higher-order function
    definition: "A function that takes another function as an argument or returns a function."
    see: map-filter-reduce
    source: { title: "functools", url: "https://docs.python.org/3/library/functools.html", verifiedOn: "2026-11-02" }
  - id: pure-function
    term: Pure function
    definition: "A function that gives the same output for the same input and has no side effects."
    source: { title: "functools", url: "https://docs.python.org/3/library/functools.html", verifiedOn: "2026-11-02" }
  - id: side-effect
    term: Side effect
    definition: "A change a function makes outside its own local scope, such as editing a global, file or argument."
    source: { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - id: decorator
    term: Decorator
    definition: "A function that wraps another function or class to add behaviour, applied with @name above the def."
    see: decorators
    source: { title: "Python Glossary: decorator", url: "https://docs.python.org/3/glossary.html#term-decorator", verifiedOn: "2026-11-02" }
  - id: functools-wraps
    term: "functools.wraps"
    definition: "A decorator used inside your wrapper to copy the original function's name and docstring across."
    see: decorators
    source: { title: "functools.wraps", url: "https://docs.python.org/3/library/functools.html#functools.wraps", verifiedOn: "2026-11-02" }
  - id: class
    term: Class
    definition: "A blueprint for creating objects, bundling data (attributes) and behaviour (methods)."
    see: class-and-object
    source: { title: "Classes", url: "https://docs.python.org/3/tutorial/classes.html", verifiedOn: "2026-11-02" }
  - id: instance
    term: Instance
    aka: ["object"]
    definition: "A specific object created from a class."
    see: class-and-object
    source: { title: "Class Objects", url: "https://docs.python.org/3/tutorial/classes.html#class-objects", verifiedOn: "2026-11-02" }
  - id: attribute
    term: Attribute
    definition: "A value or method attached to an object or class, reached with a dot, like obj.name."
    see: class-and-object
    source: { title: "Python Glossary: attribute", url: "https://docs.python.org/3/glossary.html#term-attribute", verifiedOn: "2026-11-02" }
  - id: method
    term: Method
    definition: "A function defined inside a class that works on its instances; it receives self as the first argument."
    see: method-types
    source: { title: "Method Objects", url: "https://docs.python.org/3/tutorial/classes.html#method-objects", verifiedOn: "2026-11-02" }
  - id: self
    term: self
    definition: "The conventional name for the first parameter of an instance method; it refers to the current object. Not a keyword."
    see: class-and-object
    source: { title: "A First Look at Classes", url: "https://docs.python.org/3/tutorial/classes.html#a-first-look-at-classes", verifiedOn: "2026-11-02" }
  - id: cls
    term: cls
    definition: "The conventional name for the first parameter of a class method; it refers to the class itself."
    see: method-types
    source: { title: "classmethod", url: "https://docs.python.org/3/library/functions.html#classmethod", verifiedOn: "2026-11-02" }
  - id: init
    term: "__init__"
    aka: ["initializer"]
    definition: "The method run just after an instance is created, to set up its attributes. Often called the constructor."
    see: init-new-del
    source: { title: "Data model: object.__init__", url: "https://docs.python.org/3/reference/datamodel.html#object.__init__", verifiedOn: "2026-11-02" }
  - id: new
    term: "__new__"
    definition: "The method that actually creates and returns a new instance, before __init__ sets it up."
    see: init-new-del
    source: { title: "Data model: object.__new__", url: "https://docs.python.org/3/reference/datamodel.html#object.__new__", verifiedOn: "2026-11-02" }
  - id: del-method
    term: "__del__"
    aka: ["finalizer"]
    definition: "The finalizer called when an object is about to be destroyed; its timing is not guaranteed."
    see: init-new-del
    source: { title: "Data model: object.__del__", url: "https://docs.python.org/3/reference/datamodel.html#object.__del__", verifiedOn: "2026-11-02" }
  - id: dunder-method
    term: Dunder method
    aka: ["magic method", "special method"]
    definition: "A special method with double underscores, like __init__ or __len__, that Python calls for built-in behaviour."
    see: dunder-methods
    source: { title: "Special method names", url: "https://docs.python.org/3/reference/datamodel.html#special-method-names", verifiedOn: "2026-11-02" }
  - id: str-method
    term: "__str__"
    definition: "Returns a readable string for an object, used by str() and print()."
    see: dunder-methods
    source: { title: "object.__str__", url: "https://docs.python.org/3/reference/datamodel.html#object.__str__", verifiedOn: "2026-11-02" }
  - id: repr-method
    term: "__repr__"
    definition: "Returns an unambiguous string for an object, aimed at developers; used by repr() and the REPL."
    see: dunder-methods
    source: { title: "object.__repr__", url: "https://docs.python.org/3/reference/datamodel.html#object.__repr__", verifiedOn: "2026-11-02" }
  - id: len-method
    term: "__len__"
    definition: "Returns the length of an object so that len(obj) works."
    see: dunder-methods
    source: { title: "object.__len__", url: "https://docs.python.org/3/reference/datamodel.html#object.__len__", verifiedOn: "2026-11-02" }
  - id: eq-method
    term: "__eq__"
    definition: "Defines how == compares two objects for equality."
    see: dunder-methods
    source: { title: "object.__eq__", url: "https://docs.python.org/3/reference/datamodel.html#object.__eq__", verifiedOn: "2026-11-02" }
  - id: hash-method
    term: "__hash__"
    definition: "Returns an object's hash value, used for dict keys and set members; must agree with __eq__."
    see: dunder-methods
    source: { title: "object.__hash__", url: "https://docs.python.org/3/reference/datamodel.html#object.__hash__", verifiedOn: "2026-11-02" }
  - id: mro
    term: MRO
    aka: ["Method Resolution Order"]
    definition: "The order Python searches classes to find a method or attribute in an inheritance hierarchy."
    see: mro
    source: { title: "The Python 2.3 Method Resolution Order", url: "https://docs.python.org/3/howto/mro.html", verifiedOn: "2026-11-02" }
  - id: super
    term: "super()"
    definition: "Calls a method from a parent class through the MRO, often used in __init__ to reuse parent setup."
    see: inheritance
    source: { title: "Built-in Functions: super", url: "https://docs.python.org/3/library/functions.html#super", verifiedOn: "2026-11-02" }
  - id: method-overriding
    term: Method overriding
    definition: "A child class giving its own version of a method defined in its parent."
    see: polymorphism
    source: { title: "Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#inheritance", verifiedOn: "2026-11-02" }
  - id: method-overloading
    term: Method overloading
    definition: "Several methods with one name but different parameters. Python does not support it; the last definition wins. Use default args or *args."
    source: { title: "functools.singledispatch", url: "https://docs.python.org/3/library/functools.html#functools.singledispatch", verifiedOn: "2026-11-02" }
  - id: encapsulation
    term: Encapsulation
    definition: "Bundling data and methods in a class and guiding access to the data. Python uses conventions, not strict privacy."
    see: encapsulation
    source: { title: "Private Variables", url: "https://docs.python.org/3/tutorial/classes.html#private-variables", verifiedOn: "2026-11-02" }
  - id: abstraction
    term: Abstraction
    definition: "Hiding inner details and exposing only what is needed to use an object."
    see: abstraction
    source: { title: "abc - Abstract Base Classes", url: "https://docs.python.org/3/library/abc.html", verifiedOn: "2026-11-02" }
  - id: inheritance
    term: Inheritance
    definition: "A child class reusing and extending the attributes and methods of a parent class."
    see: inheritance
    source: { title: "Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#inheritance", verifiedOn: "2026-11-02" }
  - id: single-inheritance
    term: Single inheritance
    definition: "A class that inherits from exactly one parent class."
    see: inheritance
    source: { title: "Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#inheritance", verifiedOn: "2026-11-02" }
  - id: multiple-inheritance
    term: Multiple inheritance
    definition: "A class that inherits from more than one parent; Python resolves methods using the MRO."
    see: inheritance
    source: { title: "Multiple Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#multiple-inheritance", verifiedOn: "2026-11-02" }
  - id: multilevel-inheritance
    term: Multilevel inheritance
    definition: "A chain of inheritance: a class inherits from a child, which inherits from another parent."
    see: inheritance
    source: { title: "Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#inheritance", verifiedOn: "2026-11-02" }
  - id: hierarchical-inheritance
    term: Hierarchical inheritance
    definition: "Several child classes that each inherit from the same single parent."
    see: inheritance
    source: { title: "Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#inheritance", verifiedOn: "2026-11-02" }
  - id: hybrid-inheritance
    term: Hybrid inheritance
    definition: "A mix of more than one inheritance type in the same design."
    see: inheritance
    source: { title: "Multiple Inheritance", url: "https://docs.python.org/3/tutorial/classes.html#multiple-inheritance", verifiedOn: "2026-11-02" }
  - id: polymorphism
    term: Polymorphism
    definition: "One method name behaving differently depending on the object it is called on."
    see: polymorphism
    source: { title: "Python Glossary: duck-typing", url: "https://docs.python.org/3/glossary.html#term-duck-typing", verifiedOn: "2026-11-02" }
  - id: abc
    term: ABC
    aka: ["Abstract Base Class"]
    definition: "An Abstract Base Class: a class that cannot be instantiated and declares methods subclasses must implement."
    see: abstraction
    source: { title: "abc - Abstract Base Classes", url: "https://docs.python.org/3/library/abc.html", verifiedOn: "2026-11-02" }
  - id: abstractmethod
    term: abstractmethod
    definition: "A decorator marking a method that subclasses must override; a class with one unimplemented cannot be instantiated."
    see: abstraction
    source: { title: "abc.abstractmethod", url: "https://docs.python.org/3/library/abc.html#abc.abstractmethod", verifiedOn: "2026-11-02" }
  - id: property
    term: property
    definition: "A way to run code when reading or setting an attribute, so a method can be used like a plain attribute."
    see: encapsulation
    source: { title: "Built-in Functions: property", url: "https://docs.python.org/3/library/functions.html#property", verifiedOn: "2026-11-02" }
  - id: name-mangling
    term: Name mangling
    definition: "Python rewrites a name starting with two underscores to include the class name, reducing accidental access."
    see: encapsulation
    source: { title: "Private Variables", url: "https://docs.python.org/3/tutorial/classes.html#private-variables", verifiedOn: "2026-11-02" }
  - id: composition
    term: Composition
    definition: "One class holding an object of another class; a HAS-A relationship, often preferred over inheritance."
    source: { title: "Classes", url: "https://docs.python.org/3/tutorial/classes.html", verifiedOn: "2026-11-02" }
  - id: aggregation
    term: Aggregation
    definition: "A weaker HAS-A relationship where the contained object can exist on its own, apart from the container."
    source: { title: "Classes", url: "https://docs.python.org/3/tutorial/classes.html", verifiedOn: "2026-11-02" }
  - id: association
    term: Association
    definition: "A general relationship where objects use or know of each other, without ownership."
    source: { title: "Classes", url: "https://docs.python.org/3/tutorial/classes.html", verifiedOn: "2026-11-02" }
  - id: instance-method
    term: Instance method
    definition: "A method that works on object data and takes self as its first argument."
    see: method-types
    source: { title: "Method Objects", url: "https://docs.python.org/3/tutorial/classes.html#method-objects", verifiedOn: "2026-11-02" }
  - id: class-method
    term: Class method
    definition: "A method that works on class-level data; it takes cls and is marked with @classmethod."
    see: method-types
    source: { title: "classmethod", url: "https://docs.python.org/3/library/functions.html#classmethod", verifiedOn: "2026-11-02" }
  - id: static-method
    term: Static method
    definition: "A utility method inside a class that takes neither self nor cls; marked with @staticmethod."
    see: method-types
    source: { title: "staticmethod", url: "https://docs.python.org/3/library/functions.html#staticmethod", verifiedOn: "2026-11-02" }
  - id: context-manager
    term: Context manager
    definition: "An object used with with that sets up a resource and cleans it up automatically on exit."
    see: context-managers
    source: { title: "Python Glossary: context manager", url: "https://docs.python.org/3/glossary.html#term-context-manager", verifiedOn: "2026-11-02" }
  - id: with-statement
    term: with
    definition: "A statement that runs a block inside a context manager, ensuring cleanup even if an error occurs."
    see: context-managers
    source: { title: "The with statement", url: "https://docs.python.org/3/reference/compound_stmts.html#the-with-statement", verifiedOn: "2026-11-02" }
  - id: enter-method
    term: "__enter__"
    definition: "The context manager method that runs at the start of a with block and returns the resource."
    see: context-managers
    source: { title: "With Statement Context Managers", url: "https://docs.python.org/3/reference/datamodel.html#context-managers", verifiedOn: "2026-11-02" }
  - id: exit-method
    term: "__exit__"
    definition: "The context manager method that runs when a with block ends, to clean up and handle any error."
    see: context-managers
    source: { title: "With Statement Context Managers", url: "https://docs.python.org/3/reference/datamodel.html#context-managers", verifiedOn: "2026-11-02" }
  - id: contextlib
    term: contextlib
    definition: "A standard library module with helpers for writing context managers, such as the @contextmanager decorator."
    see: context-managers
    source: { title: "contextlib", url: "https://docs.python.org/3/library/contextlib.html", verifiedOn: "2026-11-02" }
  - id: exception
    term: Exception
    definition: "An error raised during execution that interrupts normal flow and can be caught and handled."
    see: exceptions
    source: { title: "Errors and Exceptions", url: "https://docs.python.org/3/tutorial/errors.html", verifiedOn: "2026-11-02" }
  - id: try-except
    term: try / except
    definition: "try holds code that might fail; except catches and handles a matching exception."
    see: exceptions
    source: { title: "Handling Exceptions", url: "https://docs.python.org/3/tutorial/errors.html#handling-exceptions", verifiedOn: "2026-11-02" }
  - id: else-clause
    term: else (try)
    definition: "An else block on a try runs only when no exception was raised in the try block."
    see: exceptions
    source: { title: "Handling Exceptions", url: "https://docs.python.org/3/tutorial/errors.html#handling-exceptions", verifiedOn: "2026-11-02" }
  - id: finally
    term: finally
    definition: "A block that runs whether or not an exception occurred, used for cleanup."
    see: exceptions
    source: { title: "Defining Clean-up Actions", url: "https://docs.python.org/3/tutorial/errors.html#defining-clean-up-actions", verifiedOn: "2026-11-02" }
  - id: raise
    term: raise
    definition: "A statement that manually throws an exception."
    see: exceptions
    source: { title: "Raising Exceptions", url: "https://docs.python.org/3/tutorial/errors.html#raising-exceptions", verifiedOn: "2026-11-02" }
  - id: assert
    term: assert
    definition: "Checks a condition and raises AssertionError if it is false. Disabled under -O, so not for real validation."
    source: { title: "The assert statement", url: "https://docs.python.org/3/reference/simple_stmts.html#the-assert-statement", verifiedOn: "2026-11-02" }
  - id: custom-exception
    term: Custom exception
    definition: "A user-defined exception class, made by inheriting from Exception, for application-specific errors."
    see: custom-exceptions
    source: { title: "User-defined Exceptions", url: "https://docs.python.org/3/tutorial/errors.html#user-defined-exceptions", verifiedOn: "2026-11-02" }
  - id: valueerror
    term: ValueError
    definition: "Raised when a value has the right type but an invalid value, like int(\"abc\")."
    see: exceptions
    source: { title: "ValueError", url: "https://docs.python.org/3/library/exceptions.html#ValueError", verifiedOn: "2026-11-02" }
  - id: typeerror
    term: TypeError
    definition: "Raised when an operation is applied to an object of the wrong type, like adding a string and an int."
    see: exceptions
    source: { title: "TypeError", url: "https://docs.python.org/3/library/exceptions.html#TypeError", verifiedOn: "2026-11-02" }
  - id: keyerror
    term: KeyError
    definition: "Raised when a dictionary key is not found. Use dict.get() to avoid it."
    see: dictionaries
    source: { title: "KeyError", url: "https://docs.python.org/3/library/exceptions.html#KeyError", verifiedOn: "2026-11-02" }
  - id: indexerror
    term: IndexError
    definition: "Raised when a sequence index is out of range."
    see: lists
    source: { title: "IndexError", url: "https://docs.python.org/3/library/exceptions.html#IndexError", verifiedOn: "2026-11-02" }
  - id: zerodivisionerror
    term: ZeroDivisionError
    definition: "Raised when a number is divided by zero."
    see: exceptions
    source: { title: "ZeroDivisionError", url: "https://docs.python.org/3/library/exceptions.html#ZeroDivisionError", verifiedOn: "2026-11-02" }
  - id: attributeerror
    term: AttributeError
    definition: "Raised when an attribute reference or assignment fails, like calling a method that does not exist."
    see: exceptions
    source: { title: "AttributeError", url: "https://docs.python.org/3/library/exceptions.html#AttributeError", verifiedOn: "2026-11-02" }
  - id: filenotfounderror
    term: FileNotFoundError
    definition: "Raised when a file or directory is requested but does not exist."
    see: file-handling
    source: { title: "FileNotFoundError", url: "https://docs.python.org/3/library/exceptions.html#FileNotFoundError", verifiedOn: "2026-11-02" }
  - id: modulenotfounderror
    term: ModuleNotFoundError
    definition: "A subclass of ImportError raised when a module cannot be found."
    see: modules-and-packages
    source: { title: "ModuleNotFoundError", url: "https://docs.python.org/3/library/exceptions.html#ModuleNotFoundError", verifiedOn: "2026-11-02" }
  - id: importerror
    term: ImportError
    definition: "Raised when an import fails, for example when a name cannot be imported from a module."
    see: modules-and-packages
    source: { title: "ImportError", url: "https://docs.python.org/3/library/exceptions.html#ImportError", verifiedOn: "2026-11-02" }
  - id: nameerror
    term: NameError
    definition: "Raised when a name is used but not defined in any accessible scope."
    see: scope-legb
    source: { title: "NameError", url: "https://docs.python.org/3/library/exceptions.html#NameError", verifiedOn: "2026-11-02" }
  - id: recursionerror
    term: RecursionError
    definition: "Raised when the maximum recursion depth is exceeded, usually from a missing base case."
    see: recursion
    source: { title: "RecursionError", url: "https://docs.python.org/3/library/exceptions.html#RecursionError", verifiedOn: "2026-11-02" }
  - id: stopiteration
    term: StopIteration
    definition: "Raised by an iterator's next() when there are no more items; a for loop catches it to stop."
    see: iterable-vs-iterator
    source: { title: "StopIteration", url: "https://docs.python.org/3/library/exceptions.html#StopIteration", verifiedOn: "2026-11-02" }
  - id: indentationerror
    term: IndentationError
    definition: "A syntax error raised when indentation is wrong or inconsistent."
    see: python-execution-model
    source: { title: "IndentationError", url: "https://docs.python.org/3/library/exceptions.html#IndentationError", verifiedOn: "2026-11-02" }
  - id: syntaxerror
    term: SyntaxError
    definition: "Raised when code structure is invalid; found when the code is parsed, before it runs."
    source: { title: "SyntaxError", url: "https://docs.python.org/3/library/exceptions.html#SyntaxError", verifiedOn: "2026-11-02" }
  - id: assertionerror
    term: AssertionError
    definition: "Raised when an assert statement's condition is false."
    source: { title: "AssertionError", url: "https://docs.python.org/3/library/exceptions.html#AssertionError", verifiedOn: "2026-11-02" }
  - id: runtimeerror
    term: RuntimeError
    definition: "A general error raised when something goes wrong that does not fit a more specific exception type."
    source: { title: "RuntimeError", url: "https://docs.python.org/3/library/exceptions.html#RuntimeError", verifiedOn: "2026-11-02" }
  - id: file-handling
    term: File handling
    definition: "Reading, writing and managing files, usually through open() and a with block."
    see: file-handling
    source: { title: "Reading and Writing Files", url: "https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files", verifiedOn: "2026-11-02" }
  - id: open
    term: "open()"
    definition: "Opens a file and returns a file object; a mode string sets read, write or append and text or binary."
    see: file-handling
    source: { title: "Built-in Functions: open", url: "https://docs.python.org/3/library/functions.html#open", verifiedOn: "2026-11-02" }
  - id: file-mode
    term: File mode
    definition: "The flag passed to open() that sets access: r read, w write, a append, x create, b binary, t text."
    see: file-handling
    source: { title: "Built-in Functions: open", url: "https://docs.python.org/3/library/functions.html#open", verifiedOn: "2026-11-02" }
  - id: seek
    term: "seek()"
    definition: "Moves the file's current position to a given byte offset."
    see: file-handling
    source: { title: "io.IOBase.seek", url: "https://docs.python.org/3/library/io.html#io.IOBase.seek", verifiedOn: "2026-11-02" }
  - id: tell
    term: "tell()"
    definition: "Returns the file object's current position."
    see: file-handling
    source: { title: "io.IOBase.tell", url: "https://docs.python.org/3/library/io.html#io.IOBase.tell", verifiedOn: "2026-11-02" }
  - id: iterable
    term: Iterable
    definition: "An object you can loop over; it can give an iterator through iter(). Lists, strings and dicts are iterables."
    see: iterable-vs-iterator
    source: { title: "Python Glossary: iterable", url: "https://docs.python.org/3/glossary.html#term-iterable", verifiedOn: "2026-11-02" }
  - id: iterator
    term: Iterator
    definition: "An object that produces items one at a time via next(), raising StopIteration when done."
    see: iterable-vs-iterator
    source: { title: "Python Glossary: iterator", url: "https://docs.python.org/3/glossary.html#term-iterator", verifiedOn: "2026-11-02" }
  - id: iter
    term: "iter()"
    definition: "Returns an iterator from an iterable."
    see: iterable-vs-iterator
    source: { title: "Built-in Functions: iter", url: "https://docs.python.org/3/library/functions.html#iter", verifiedOn: "2026-11-02" }
  - id: next
    term: "next()"
    definition: "Gets the next item from an iterator; raises StopIteration when the iterator is exhausted."
    see: iterable-vs-iterator
    source: { title: "Built-in Functions: next", url: "https://docs.python.org/3/library/functions.html#next", verifiedOn: "2026-11-02" }
  - id: generator
    term: Generator
    definition: "A function with yield that produces values lazily; it is a kind of iterator, consumed once."
    see: generators
