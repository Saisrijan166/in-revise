id: process-vs-thread
tech: python
title: "Process vs Thread"
compares: [process-node, thread-node]
gist:
  - "Own memory space; heavy; isolated"
  - "Shares the process's memory; light; not isolated"
explain:
  - "A process is a running program with its own private memory. Processes are heavier to start and must talk through IPC (queues, pipes), but one crashing does not take the others down, and each has its own Python interpreter and GIL."
  - "A thread runs inside a process and shares that process's memory. Threads are cheap and share data directly, but that sharing needs locks, a crash can hit the whole process, and in standard CPython the GIL lets only one thread run Python bytecode at a time."
example: "Two threads can both read one list in shared memory (but need a lock to update it safely). Two processes each get a separate copy and must send data over a Queue. For CPU-bound work, processes sidestep the GIL and use many cores; threads do not."
rows:
  - { aspect: "Memory", a: "Separate, private", b: "Shared within the process" }
  - { aspect: "Weight / startup", a: "Heavier", b: "Lighter" }
  - { aspect: "Communication", a: "IPC: queues, pipes", b: "Direct shared variables" }
  - { aspect: "Crash isolation", a: "Isolated", b: "Can take down the process" }
  - { aspect: "GIL effect (CPython)", a: "Each has its own; true parallelism", b: "One runs Python bytecode at a time" }
verdict: "Use threads for lightweight shared-memory tasks (mostly I/O); use processes for isolation and CPU parallelism past the GIL."
sayIt: "A process has its own private memory, is isolated but heavier, and talks via IPC. A thread lives in a process and shares its memory, so it is cheap but needs locks and is not isolated. In standard CPython the GIL lets one thread run bytecode at a time, so CPU work scales with processes, not threads."
sources:
