id: instance-class-static-method
tech: python
title: "Instance vs Class vs Static method"
compares: [instance-method, class-method, static-method]
gist:
  - "Takes self; works on one object's data"
  - "Takes cls; works on the class itself"
  - "Takes neither; a plain function grouped in the class"
explain:
  - "An instance method is the default: its first parameter is self, the object it was called on, so it can read and change that object's attributes."
  - "A class method uses @classmethod and takes cls, the class, as its first parameter. It can read class-level data and is the usual way to write alternative constructors (factory methods)."
  - "A static method uses @staticmethod and takes neither self nor cls. It is just a normal function placed inside the class for grouping; it cannot touch instance or class state directly."
example: "class Circle: pi = 3.14159; def area(self): return Circle.pi * self.r**2 (instance). @classmethod def unit(cls): return cls(1) (factory). @staticmethod def valid(r): return r > 0 (helper that needs no self or cls)."
rows:
  - { aspect: "First parameter", a: "self (the object)", b: "cls (the class)", c: "none" }
  - { aspect: "Decorator", a: "none", b: "@classmethod", c: "@staticmethod" }
  - { aspect: "Can access", a: "Instance + class data", b: "Class data only", c: "Neither directly" }
  - { aspect: "Typical use", a: "Act on one object", b: "Factory / class-wide logic", c: "Related utility function" }
  - { aspect: "Called on", a: "Instance", b: "Class or instance", c: "Class or instance" }
verdict: "Instance method to use the object, class method for factories and class state, static method for a related helper."
sayIt: "An instance method takes self and works on one object. A class method is @classmethod, takes cls, and is ideal for factories or class-wide logic. A static method is @staticmethod, takes neither, and is just a utility grouped in the class. I pick by what state the method needs."
sources:
  - { title: "Built-in Functions: classmethod, staticmethod", url: "https://docs.python.org/3/library/functions.html#classmethod", verifiedOn: "2026-11-02" }
