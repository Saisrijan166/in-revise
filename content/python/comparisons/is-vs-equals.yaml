id: is-vs-equals
tech: python
title: "is vs =="
compares: [is-op, equals-op]
gist:
  - "Same object? Compares identity (id)"
  - "Same value? Compares contents via __eq__"
explain:
  - "is tests identity: it is True only when both names point to the exact same object in memory, which is what id() reports. Use it for None, True and False."
  - "== tests equality of value by calling the object's __eq__ method. Two separate objects with the same contents are ==, even though they are not the same object."
example: "a = [1, 2]; b = [1, 2] gives a == b True but a is b False (two different lists). For None always write x is None, not x == None. Watch the cache: 256 is 256 is True, but 1000 is 1000 can be False because only small ints are interned."
rows:
  - { aspect: "Checks", a: "Same object (identity)", b: "Same value (contents)" }
  - { aspect: "Based on", a: "id() of each", b: "__eq__ method" }
  - { aspect: "Use for", a: "None, True, False, singletons", b: "Comparing values" }
  - { aspect: "Two equal lists", a: "False", b: "True" }
  - { aspect: "Gotcha", a: "Small ints/short strs interned, so is can look true", b: "Can be customised by __eq__" }
verdict: "Use == to compare values; use is only for identity, mainly 'is None'. Never compare values with is."
sayIt: "is checks whether two names are the same object by identity; == checks whether their values are equal through __eq__. I use == for values and is only for singletons like None. The trap: small integers and some strings are interned, so is can look true for equal values, which is not guaranteed."
sources:
  - { title: "Expressions: Comparisons and Identity", url: "https://docs.python.org/3/reference/expressions.html#is", verifiedOn: "2026-11-02" }
  - { title: "Built-in Functions: id()", url: "https://docs.python.org/3/library/functions.html#id", verifiedOn: "2026-11-02" }
