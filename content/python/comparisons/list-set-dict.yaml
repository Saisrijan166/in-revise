id: list-set-dict
tech: python
title: "List vs Set vs Dict"
compares: [lists, sets, dictionaries]
gist:
  - "Ordered sequence; allows duplicates; search is O(n)"
  - "Unordered unique items; fast membership; O(1)"
  - "Key to value pairs; fast lookup by key; O(1)"
explain:
  - "A list is an ordered sequence that keeps insertion order and allows duplicates. Finding whether a value is present scans the items, so it is O(n)."
  - "A set stores only unique items with no index, using hashing. It drops duplicates automatically and tests membership in about O(1), but items must be hashable."
  - "A dict stores key to value pairs with hashable, unique keys. It keeps insertion order (since 3.7) and looks up a value by its key in about O(1)."
example: "From [1, 2, 2, 3]: set([1, 2, 2, 3]) gives {1, 2, 3} (duplicates gone). 'x' in big_list scans every item, but 'x' in big_set or key in big_dict jumps straight to it using the hash."
rows:
  - { aspect: "Order", a: "Insertion order", b: "No index/order guarantee", c: "Insertion order (3.7+)" }
  - { aspect: "Duplicates", a: "Allowed", b: "Removed", c: "Keys unique; values repeat" }
  - { aspect: "Membership cost", a: "O(n)", b: "O(1) average", c: "O(1) average on keys" }
  - { aspect: "Item rule", a: "Any object", b: "Items must be hashable", c: "Keys must be hashable" }
  - { aspect: "Syntax", a: "[1, 2]", b: "{1, 2}", c: "{'a': 1}" }
verdict: "List for ordered items with duplicates; set for uniqueness and fast membership; dict to map keys to values."
sayIt: "A list is an ordered sequence that allows duplicates with O(n) search. A set holds unique hashable items with O(1) membership. A dict maps unique hashable keys to values with O(1) lookup. I pick a set to dedupe or test membership and a dict to look things up by key."
sources:
  - { title: "Built-in Types: set, dict", url: "https://docs.python.org/3/library/stdtypes.html#set-types-set-frozenset", verifiedOn: "2026-11-02" }
  - { title: "TimeComplexity (CPython wiki)", url: "https://wiki.python.org/moin/TimeComplexity", verifiedOn: "2026-11-02" }
