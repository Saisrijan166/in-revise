id: shallow-deep-copy
tech: python
title: "Assignment vs Shallow vs Deep copy"
compares: [assignment-alias, shallow-copy, deep-copy]
gist:
  - "No copy: another name for the same object"
  - "New outer object; nested objects still shared"
  - "New outer and all nested objects, recursively"
explain:
  - "Assignment (b = a) copies nothing. Both names point to one object, so any change through either name is seen by both."
  - "A shallow copy (copy.copy, list(a), a[:]) makes a new outer object but reuses the same inner objects. Editing a nested list inside it still affects the original."
  - "A deep copy (copy.deepcopy) makes a new outer object and recursively copies every nested object, so the copy is fully independent of the original."
example: "a = [[1], [2]]. b = a: b is a, edits shared. c = copy.copy(a): c is not a, but c[0] is a[0], so c[0].append(9) changes a too. d = copy.deepcopy(a): d[0] is a separate list, so d[0].append(9) leaves a unchanged."
rows:
  - { aspect: "New outer object", a: "No", b: "Yes", c: "Yes" }
  - { aspect: "Nested objects", a: "Shared", b: "Shared", c: "Copied recursively" }
  - { aspect: "How", a: "b = a", b: "copy.copy(a), a[:], list(a)", c: "copy.deepcopy(a)" }
  - { aspect: "Independent of original", a: "No", b: "Only at top level", c: "Fully" }
  - { aspect: "Cost", a: "None", b: "Low", c: "Higher; handles cycles" }
verdict: "Assignment to share; shallow copy for flat data; deep copy when nested data must be fully independent."
sayIt: "Assignment just makes another name for the same object. A shallow copy makes a new outer object but shares the nested objects, so nested edits leak. A deep copy with copy.deepcopy recursively copies everything, giving a fully independent object. I use deepcopy only when the structure is nested."
sources:
  - { title: "copy module: Shallow and deep copy operations", url: "https://docs.python.org/3/library/copy.html", verifiedOn: "2026-11-02" }
