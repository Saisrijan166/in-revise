id: mutable-immutable
tech: python
title: "Mutable vs Immutable"
compares: [mutable-types, immutable-types]
gist:
  - "Can change in place; same object, new contents"
  - "Cannot change; a new object is made instead"
explain:
  - "A mutable object can be changed in place without creating a new object: its id stays the same. list, dict, set and bytearray are mutable, so two names bound to one can surprise you when one changes it."
  - "An immutable object cannot be changed after creation; any operation that looks like a change builds a new object. int, float, bool, str, tuple, frozenset and bytes are immutable, and only immutable, hashable objects work as dict keys or set items."
example: "x = [1, 2]; y = x; y.append(3) makes x == [1, 2, 3] too, because both names share one mutable list. With s = 'ab'; s += 'c', s now points to a brand new string; the old 'ab' is untouched."
rows:
  - { aspect: "Change in place", a: "Yes", b: "No (new object made)" }
  - { aspect: "Built-ins", a: "list, dict, set, bytearray", b: "int, float, bool, str, tuple, frozenset, bytes" }
  - { aspect: "Hashable", a: "Usually not", b: "Yes (if contents hashable)" }
  - { aspect: "As dict key / set item", a: "No", b: "Yes" }
  - { aspect: "Aliasing risk", a: "High: shared edits leak", b: "Low: safe to share" }
verdict: "Use mutable types for changing data; use immutable types for keys, constants and safe sharing."
sayIt: "Mutable objects like lists and dicts can be changed in place, so aliases see each other's edits. Immutable objects like ints, strings and tuples cannot change; an operation makes a new object. Only immutable, hashable values can be dictionary keys or set items."
sources:
  - { title: "Python Glossary: mutable, immutable, hashable", url: "https://docs.python.org/3/glossary.html#term-immutable", verifiedOn: "2026-11-02" }
  - { title: "Built-in Types", url: "https://docs.python.org/3/library/stdtypes.html", verifiedOn: "2026-11-02" }
