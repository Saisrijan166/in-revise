id: iterator-vs-generator
tech: python
title: "Iterator vs Generator"
compares: [iterator-node, generators]
gist:
  - "Any object with __iter__ and __next__"
  - "An iterator made easily with a yield function"
explain:
  - "An iterator is any object that produces items one at a time: it has __iter__ (returns itself) and __next__ (returns the next item or raises StopIteration). You can write one as a class, but it is verbose."
  - "A generator is the easy way to make an iterator. A function with yield, or a generator expression, returns a generator object that is already a full iterator, keeping its state between items. Every generator is an iterator; not every iterator is a generator."
example: "The class way defines __iter__ and __next__ by hand. The generator way is one small function: def counter(n): i = 0; while i < n: yield i; i += 1. Both are looped the same with for x in ..., and both are exhausted after one pass and cannot restart."
rows:
  - { aspect: "Relationship", a: "The general protocol", b: "A kind of iterator" }
  - { aspect: "How to build", a: "Class with __iter__/__next__", b: "yield function or (expr for ...)" }
  - { aspect: "Code needed", a: "More (boilerplate)", b: "Less" }
  - { aspect: "Keeps state", a: "You manage it", b: "Automatic, at each yield" }
  - { aspect: "Lazy / consumed once", a: "Yes", b: "Yes" }
verdict: "Use a generator (yield) for almost all lazy sequences; write a full iterator class only when you need custom object behaviour."
sayIt: "An iterator is any object with __iter__ and __next__ that yields items one at a time. A generator is a convenient iterator built with a yield function or generator expression, so it handles state for you. Every generator is an iterator; both are lazy and consumed once. I usually use a generator."
sources:
  - { title: "Python Tutorial: Iterators and Generators", url: "https://docs.python.org/3/tutorial/classes.html#generators", verifiedOn: "2026-11-02" }
  - { title: "Glossary: generator, iterator", url: "https://docs.python.org/3/glossary.html#term-generator", verifiedOn: "2026-11-02" }
