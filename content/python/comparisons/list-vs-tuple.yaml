id: list-vs-tuple
tech: python
title: "List vs Tuple"
compares: [lists, tuples]
gist:
  - "Ordered and mutable: change, add or remove items"
  - "Ordered and immutable: fixed once created"
explain:
  - "A list is an ordered, mutable sequence written with square brackets. You can append, remove, sort and reassign items in place, so it suits data that grows or changes."
  - "A tuple is an ordered, immutable sequence written with parentheses. Once created you cannot change its items, which makes it a safe fixed record and lets it be hashable (usable as a dict key or set item) when its items are hashable."
example: "point = (10, 20) cannot be changed, so it works as a dict key: locations[(10, 20)] = 'home'. A list [10, 20] is unhashable and raises TypeError as a key, but you can do nums.append(30) on it."
rows:
  - { aspect: "Mutable", a: "Yes", b: "No" }
  - { aspect: "Syntax", a: "[1, 2, 3]", b: "(1, 2, 3); single item needs (1,)" }
  - { aspect: "Dict key / set item", a: "No (unhashable)", b: "Yes, if items are hashable" }
  - { aspect: "Use for", a: "Changing collection of similar items", b: "Fixed record; return many values" }
  - { aspect: "Methods", a: "append, pop, sort, remove", b: "Only count and index" }
verdict: "Use a list when the data changes; use a tuple for a fixed record or when you need a hashable key."
sayIt: "Both are ordered, but a list is mutable and a tuple is immutable. I use a list when items change over time and a tuple for a fixed record or when I need a hashable value, like a dictionary key or a set item."
sources:
  - { title: "Built-in Types: Lists and Tuples", url: "https://docs.python.org/3/library/stdtypes.html#sequence-types-list-tuple-range", verifiedOn: "2026-11-02" }
  - { title: "Python Tutorial: Data Structures", url: "https://docs.python.org/3/tutorial/datastructures.html", verifiedOn: "2026-11-02" }
