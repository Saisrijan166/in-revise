id: type-vs-isinstance
tech: python
title: "type() vs isinstance()"
compares: [type-func, isinstance-func]
gist:
  - "Exact type only; ignores inheritance"
  - "True for the type or any subclass; preferred"
explain:
  - "type(obj) == SomeClass is True only when obj is exactly that class, not a subclass. It is strict and breaks polymorphism."
  - "isinstance(obj, SomeClass) is True when obj is that class or any subclass, which respects inheritance. It also accepts a tuple of types, so isinstance(x, (int, float)) checks several at once. This is the recommended way to check types."
example: "bool is a subclass of int. type(True) == int is False, but isinstance(True, int) is True. For a Dog subclass of Animal, isinstance(d, Animal) stays True, so code written against Animal keeps working."
rows:
  - { aspect: "Matches subclasses", a: "No (exact only)", b: "Yes" }
  - { aspect: "Multiple types at once", a: "No", b: "Yes: isinstance(x, (int, str))" }
  - { aspect: "Respects polymorphism", a: "No", b: "Yes" }
  - { aspect: "Typical use", a: "Need the exact class", b: "Normal type checks" }
  - { aspect: "Recommended", a: "Rarely", b: "Yes" }
verdict: "Prefer isinstance for type checks; use exact type() comparison only when a subclass must be rejected."
sayIt: "type() gives the exact class, and comparing with it ignores inheritance, so a subclass fails. isinstance() is True for the class or any subclass and can take a tuple of types, so it respects polymorphism. I use isinstance for checks and keep exact type comparison for when a subclass must not count."
sources:
  - { title: "Built-in Functions: isinstance, type", url: "https://docs.python.org/3/library/functions.html#isinstance", verifiedOn: "2026-11-02" }
