id: init-vs-new
tech: python
title: "__new__ vs __init__"
compares: [new-method, init-method]
gist:
  - "Creates and returns the new instance"
  - "Initialises the instance that already exists"
explain:
  - "__new__ is the constructor that actually creates the object. It is a static method that receives the class, and it must create and return the new instance (usually via super().__new__(cls))."
  - "__init__ is the initialiser. It runs after __new__, receives the already-created instance as self, and sets up its attributes. It must return None, not the object."
example: "When you call Point(3), Python first runs __new__(cls, 3) to build the object, then runs __init__(self, 3) to fill it. You only override __new__ for special cases: subclassing an immutable type like int, tuple or str, or controlling creation (singletons, caching)."
rows:
  - { aspect: "Role", a: "Create the instance", b: "Initialise the instance" }
  - { aspect: "First parameter", a: "cls (the class)", b: "self (the instance)" }
  - { aspect: "Runs", a: "First", b: "After __new__" }
  - { aspect: "Returns", a: "The new instance", b: "None" }
  - { aspect: "Override when", a: "Immutable subclass, singleton, caching", b: "Almost always (set attributes)" }
verdict: "Override __init__ to set up attributes; override __new__ only to control creation, e.g. immutable subclasses or singletons."
sayIt: "__new__ actually creates and returns the instance, taking the class as cls, and runs first. __init__ then initialises that instance through self and returns None. Day to day I only write __init__; I touch __new__ for special cases like subclassing an immutable type or building a singleton."
sources:
  - { title: "Data model: object.__new__, object.__init__", url: "https://docs.python.org/3/reference/datamodel.html#object.__new__", verifiedOn: "2026-11-02" }
