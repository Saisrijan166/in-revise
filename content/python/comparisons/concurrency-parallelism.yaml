id: concurrency-parallelism
tech: python
title: "Concurrency vs Parallelism"
compares: [concurrency-node, parallelism-node]
gist:
  - "Tasks make progress in overlapping periods"
  - "Tasks run at the very same instant on many cores"
explain:
  - "Concurrency is about dealing with many tasks at once by interleaving them: a task runs, pauses (for example while waiting on I/O), and another runs. One CPU core is enough, because only the structure overlaps, not the actual execution."
  - "Parallelism is about doing many tasks at the very same instant, which needs multiple cores or CPUs truly running code side by side. Parallelism is one way to achieve concurrency, but concurrency does not require parallelism."
example: "One chef switching between three dishes as each waits is concurrency: one core, overlapping progress. Three chefs cooking three dishes at once is parallelism: real cores running together. In Python, asyncio gives concurrency on one thread; multiprocessing gives parallelism across cores."
rows:
  - { aspect: "Meaning", a: "Overlapping progress", b: "Running at the same instant" }
  - { aspect: "Cores needed", a: "One is enough", b: "Multiple" }
  - { aspect: "Python tool", a: "asyncio, threading", b: "multiprocessing" }
  - { aspect: "Relationship", a: "Structure of tasks", b: "A way to execute concurrently" }
  - { aspect: "Helps most with", a: "I/O-bound waiting", b: "CPU-bound compute" }
verdict: "Concurrency structures overlapping work; parallelism runs work truly at once. Use concurrency for I/O waits, parallelism for CPU work."
sayIt: "Concurrency means interleaving many tasks' progress, which one core can do. Parallelism means running tasks at the same instant across cores. Parallelism is one way to be concurrent, not a requirement. In Python, asyncio gives concurrency for I/O; multiprocessing gives parallelism for CPU work."
sources:
