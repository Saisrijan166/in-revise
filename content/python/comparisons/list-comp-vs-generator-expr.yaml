id: list-comp-vs-generator-expr
tech: python
title: "List comprehension vs Generator expression"
compares: [list-comp, gen-expr]
gist:
  - "[..] builds the whole list in memory now"
  - "(..) is lazy; yields one item at a time"
explain:
  - "A list comprehension with square brackets builds the entire list immediately and holds every item in memory. You can index it, loop it many times and take its length."
  - "A generator expression with parentheses builds nothing up front. It yields items one at a time as you loop, so it uses almost no memory, but it has no length, cannot be indexed and is consumed after one pass."
example: "squares = [x*x for x in range(1_000_000)] allocates a million numbers at once. gen = (x*x for x in range(1_000_000)) allocates almost nothing and computes each square only when asked. sum(x*x for x in range(1_000_000)) streams without building the list."
rows:
  - { aspect: "Builds", a: "Whole list now", b: "Nothing until iterated" }
  - { aspect: "Memory", a: "All items at once", b: "One item at a time" }
  - { aspect: "Reusable", a: "Yes, loop many times", b: "No, consumed once" }
  - { aspect: "Indexing / len()", a: "Yes", b: "No" }
  - { aspect: "Best for", a: "Small data; need the list", b: "Large/streamed data; one pass" }
verdict: "Use a list comprehension when you need the full list; use a generator expression for large or streamed data read once."
sayIt: "A list comprehension in square brackets builds the whole list in memory at once, so you can index and reuse it. A generator expression in parentheses is lazy: it yields items one at a time and uses little memory, but is consumed once and has no length. For large data read once, I use the generator."
sources:
  - { title: "Python Tutorial: List Comprehensions", url: "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions", verifiedOn: "2026-11-02" }
  - { title: "Generator expressions (Language Reference)", url: "https://docs.python.org/3/reference/expressions.html#generator-expressions", verifiedOn: "2026-11-02" }
