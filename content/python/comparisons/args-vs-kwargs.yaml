id: args-vs-kwargs
tech: python
title: "*args vs **kwargs"
compares: [args-node, kwargs-node]
gist:
  - "*args: extra positional args collected into a tuple"
  - "**kwargs: extra keyword args collected into a dict"
explain:
  - "*args collects any extra positional arguments into a tuple, so a function can take any number of unnamed arguments. The name args is only a convention; the single star is what matters."
  - "**kwargs collects any extra keyword arguments into a dict of name to value, so a function can take any number of named arguments. Again the name is a convention; the double star does the work."
example: "def f(*args, **kwargs): print(args, kwargs). Calling f(1, 2, x=3) prints (1, 2) {'x': 3}. In a signature the order is positional, *args, keyword-only, **kwargs. The same stars also unpack: f(*mylist, **mydict)."
rows:
  - { aspect: "Collects", a: "Extra positional args", b: "Extra keyword args" }
  - { aspect: "Becomes", a: "A tuple", b: "A dict (name to value)" }
  - { aspect: "Marker", a: "Single * (name is convention)", b: "Double ** (name is convention)" }
  - { aspect: "Call example", a: "f(1, 2, 3)", b: "f(x=1, y=2)" }
  - { aspect: "Order in signature", a: "After normal positional params", b: "Last of all" }
verdict: "Use *args for a variable number of positional values, **kwargs for a variable number of named options."
sayIt: "*args gathers extra positional arguments into a tuple and **kwargs gathers extra keyword arguments into a dict, so a function can accept any number of each. The names are just convention; the one and two stars are what matter. The same syntax also unpacks a list or dict back into a call."
sources:
  - { title: "Python Tutorial: Arbitrary Argument Lists", url: "https://docs.python.org/3/tutorial/controlflow.html#arbitrary-argument-lists", verifiedOn: "2026-11-02" }
  - { title: "Python Tutorial: Keyword Arguments", url: "https://docs.python.org/3/tutorial/controlflow.html#keyword-arguments", verifiedOn: "2026-11-02" }
