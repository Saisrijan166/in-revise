id: threading-vs-multiprocessing
tech: python
title: "threading vs multiprocessing"
compares: [threading, multiprocessing]
gist:
  - "Threads in one process; great for I/O-bound work"
  - "Separate processes; true parallelism for CPU work"
explain:
  - "The threading module runs threads inside one process sharing memory. In standard CPython the GIL lets only one thread run bytecode at a time, so threads do not speed up CPU-bound work, but shine for I/O-bound work: the GIL is released while waiting on I/O."
  - "The multiprocessing module runs separate processes, each with its own interpreter and GIL, so CPU-bound work runs truly in parallel across cores. The cost is heavier startup and that data must be sent between processes (pickled over queues or pipes)."
example: "Downloading 100 URLs (I/O-bound): threads overlap the waits well. Hashing 100 large files or crunching numbers (CPU-bound): multiprocessing uses all cores while threads stay stuck behind the GIL. Note: a free-threaded (no-GIL) CPython build, officially supported in 3.14 (PEP 779), lets threads use CPU cores too."
rows:
  - { aspect: "Runs as", a: "Threads in one process", b: "Separate processes" }
  - { aspect: "Memory", a: "Shared (needs locks)", b: "Separate; data pickled" }
  - { aspect: "Best for", a: "I/O-bound tasks", b: "CPU-bound tasks" }
  - { aspect: "GIL limit (standard CPython)", a: "Yes: one thread runs bytecode", b: "No: one GIL per process" }
  - { aspect: "Startup / overhead", a: "Light", b: "Heavier" }
verdict: "Threads for I/O-bound work; processes for CPU-bound work. (A free-threaded 3.14 build lets threads use cores too.)"
sayIt: "threading shares memory in one process and suits I/O-bound work, as the GIL is released during waits; it does not speed up CPU work in standard CPython. multiprocessing uses separate processes, each with its own GIL, for real CPU parallelism but heavier startup. Python 3.14 adds a no-GIL build."
sources:
