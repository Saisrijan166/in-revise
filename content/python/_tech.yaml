name: Python
slug: python
accent: cobalt
template: 3
summary: "Python for interviews: types and mutability, collections, functions and OOP, iterators and generators, errors, concurrency and the GIL, plus the common coding patterns."
codeLanguages:
  - python
storySpine:
  - step: "You know Java and must now read and run a Python script → learn what Python is and how CPython turns your .py file into bytecode and runs it"
    cards: [what-is-python, python-execution-model]
  - step: "In Java you declared every type; Python lets you just assign → a name points to an object, and the type is decided at runtime (dynamic) but never mixed silently (strong)"
    cards: [variables-and-objects, dynamic-and-strong-typing]
  - step: "You must pick the right container for your data → learn the built-in types, which ones can change (mutable), and how to check a type"
    cards: [builtin-data-types, mutable-vs-immutable, type-checking]
  - step: "A copied list mysteriously changes the original → understand references, garbage collection, and shallow vs deep copy"
    cards: [memory-and-gc, shallow-vs-deep-copy]
  - step: "A function's list keeps growing between calls → the classic mutable default argument trap"
    cards: [mutable-default-argument]
  - step: "You need to branch and loop over data → operators, == vs is, if/elif/else, and the loop tools"
    cards: [operators-overview, equality-vs-identity, conditionals, loops, loop-control, iteration-helpers]
  - step: "You process text and lists of orders → strings and slicing, string methods, and the list, tuple, set and dict containers"
    cards: [strings, string-methods, lists, tuples, sets, dictionaries]
  - step: "Your loops to build lists are verbose → replace them with comprehensions, and unpack values in one line"
    cards: [comprehensions, unpacking-and-swapping]
  - step: "You wrap logic in reusable functions → def, arguments, *args and **kwargs, lambda and recursion"
    cards: [functions-basics, function-arguments, lambda, recursion]
  - step: "A variable inside a function behaves oddly → scope (LEGB), closures, and decorators that wrap behaviour"
    cards: [scope-legb, closures, decorators]
  - step: "You model an Order as its own type → classes, __init__, and the four pillars of OOP"
    cards: [class-and-object, init-new-del, encapsulation, inheritance, polymorphism, abstraction]
  - step: "You need class-level and utility methods, and to know how Python finds them → method types, MRO and dunder methods"
    cards: [method-types, mro, dunder-methods]
  - step: "You stream a huge file of orders without loading it all → iterators, generators and context managers"
    cards: [iterable-vs-iterator, generators, context-managers]
  - step: "Things go wrong at runtime → handle exceptions, write your own, and read and write files safely"
    cards: [exceptions, custom-exceptions, file-handling]
  - step: "You transform data and add type safety → map, filter and reduce, type hints, and dataclasses"
    cards: [map-filter-reduce, type-hints, dataclasses]
  - step: "The service must do many things at once → concurrency vs parallelism, threading, multiprocessing, the GIL and asyncio"
    cards: [concurrency-vs-parallelism, threading, multiprocessing, gil, asyncio]
  - step: "You ship it as a real project → modules and packages, venv and pip, the collections module, and the time complexity of each container"
    cards: [modules-and-packages, venv-and-pip, collections-module, time-complexity]
  - step: "You build the web API and prove it works → Django, Flask or FastAPI, testing and logging, and regex for text"
    cards: [python-web-frameworks, testing-and-logging, regex]
  - step: "The interviewer gives a coding round → the common string, number and collection programs, and the Python-vs-Java gotchas that trip people up"
    cards: [string-coding-problems, number-coding-problems, collection-coding-problems, python-for-java-developers]
topics:
  - { id: basics, title: "Python Basics", order: 1, blurb: "What Python is and how it runs your code." }
  - { id: types, title: "Data Types and Memory", order: 2, blurb: "Built-in types, mutability, references and copying." }
  - { id: control, title: "Operators and Control Flow", order: 3, blurb: "Operators, conditions and loops." }
  - { id: collections, title: "Strings and Collections", order: 4, blurb: "Strings, lists, tuples, sets, dicts and comprehensions." }
  - { id: functions, title: "Functions", order: 5, blurb: "Functions, scope, closures and decorators." }
  - { id: oop, title: "Object-Oriented Python", order: 6, blurb: "Classes, the four pillars, methods and dunders." }
  - { id: iterators, title: "Iterators, Generators and Errors", order: 7, blurb: "Lazy iteration, context managers, exceptions and files." }
  - { id: concurrency, title: "Concurrency and Tooling", order: 8, blurb: "Threads, processes, the GIL, async, and project tooling." }
  - { id: practice, title: "Python in Practice", order: 9, blurb: "Frameworks, testing, regex and coding patterns." }
