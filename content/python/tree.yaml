sources:
  - { title: "The Python Language Reference", url: "https://docs.python.org/3/reference/index.html", verifiedOn: "2026-11-02" }
  - { title: "The Python Standard Library", url: "https://docs.python.org/3/library/index.html", verifiedOn: "2026-11-02" }
  - { title: "The Python Tutorial", url: "https://docs.python.org/3/tutorial/index.html", verifiedOn: "2026-11-02" }
  - { title: "Python Glossary", url: "https://docs.python.org/3/glossary.html", verifiedOn: "2026-11-02" }
  - { title: "Built-in Types", url: "https://docs.python.org/3/library/stdtypes.html", verifiedOn: "2026-11-02" }

topics:
  basics:
    - id: what-is-python
      children:
        - { id: high-level-language, label: "High-level", note: "Readable syntax close to plain English; memory managed for you" }
        - { id: interpreted-ish, label: "Interpreted (with bytecode)", note: "CPython compiles to bytecode first, then runs it" }
        - { id: object-oriented-lang, label: "Object-oriented", note: "Supports classes, inheritance, polymorphism, encapsulation" }
        - { id: pep8, label: "PEP 8", note: "The official style guide for readable Python code" }
        - { id: python3, label: "Python 3", note: "The modern version; Python 2 is end of life" }
    - id: python-execution-model
      children:
        - { id: source-code, label: "Source (.py)", note: "The Python code you write" }
        - { id: bytecode, label: "Bytecode (.pyc)", note: "Lower-level instructions compiled from source" }
        - { id: pvm, label: "PVM", note: "The Python Virtual Machine that runs the bytecode" }
        - { id: cpython-impl, label: "CPython", note: "The standard implementation, written in C" }
        - { id: pypy-jython, label: "PyPy / Jython", note: "Alternatives: PyPy uses a JIT; Jython runs on the JVM" }
        - { id: repl, label: "REPL", note: "Interactive prompt that runs statements one at a time" }
    - id: variables-and-objects
      children:
        - { id: name-binding, label: "Name binding", note: "A variable is a name bound to an object in memory" }
        - { id: everything-object, label: "Everything is an object", note: "Numbers, functions, classes are all objects" }
        - { id: multiple-assignment, label: "Multiple assignment", note: "a, b, c = 1, 2, 3 in one statement" }
    - id: dynamic-and-strong-typing
      children:
        - { id: dynamic-typing, label: "Dynamically typed", note: "A variable's type is decided at runtime, not declared" }
        - { id: strong-typing, label: "Strongly typed", note: "Python will not silently mix types, e.g. '1' + 1 is an error" }
        - { id: duck-typing-node, label: "Duck typing", note: "If it behaves right, it works; the class does not matter" }

  types:
    - id: builtin-data-types
      children:
        - { id: numeric-types, label: "int, float, complex", note: "Numbers; int has unlimited precision" }
        - { id: str-type, label: "str", note: "Immutable text (Unicode)" }
        - { id: bool-type, label: "bool", note: "True or False; a subclass of int" }
        - { id: sequence-types, label: "list, tuple, range", note: "Ordered sequences" }
        - { id: set-types, label: "set, frozenset", note: "Unique elements; frozenset is immutable" }
        - { id: dict-type, label: "dict", note: "Key-value pairs" }
        - { id: nonetype, label: "NoneType", note: "The type of None, meaning no value" }
        - { id: type-conversion, label: "Type conversion", note: "int(), str(), float() change one type to another" }
    - id: mutable-vs-immutable
      children:
        - { id: immutable-types, label: "Immutable", note: "int, float, bool, str, tuple, frozenset, bytes" }
        - { id: mutable-types, label: "Mutable", note: "list, set, dict, bytearray" }
        - { id: tuple-with-mutable, label: "Tuple of mutables", note: "A tuple is fixed but a list inside it can still change" }
        - { id: hashable-node, label: "Hashable", note: "Immutable, stable-hash objects usable as dict keys or set items" }
    - id: type-checking
      children:
        - { id: type-func, label: "type()", note: "Returns the exact type of an object" }
        - { id: isinstance-func, label: "isinstance()", note: "True for the type or any subclass; preferred for checks" }
        - { id: id-func, label: "id()", note: "An object's identity (its address in CPython)" }
    - id: memory-and-gc
      children:
        - { id: reference-counting, label: "Reference counting", note: "CPython frees an object when its reference count hits zero" }
        - { id: cycle-collector, label: "Cycle collector", note: "The gc module reclaims reference cycles counting cannot" }
        - { id: del-statement, label: "del", note: "Removes a name; the object dies only when nothing else references it" }
    - id: shallow-vs-deep-copy
      children:
        - { id: assignment-alias, label: "Assignment", note: "Just another name for the same object; no copy" }
        - { id: shallow-copy, label: "Shallow copy", note: "New outer object, but nested objects are shared" }
        - { id: deep-copy, label: "Deep copy", note: "copy.deepcopy recursively copies nested objects too" }
    - id: mutable-default-argument

  control:
    - id: operators-overview
      children:
        - { id: arithmetic-ops, label: "Arithmetic", note: "+ - * / // % **; / is float, // floors" }
        - { id: comparison-ops, label: "Comparison", note: "== != > < >= <=" }
        - { id: logical-ops, label: "Logical", note: "and, or, not" }
        - { id: membership-ops, label: "Membership", note: "in / not in; for dicts it checks keys" }
        - { id: assignment-ops, label: "Assignment", note: "= += -= *= /= //= %=" }
    - id: equality-vs-identity
      children:
        - { id: equals-op, label: "==", note: "Same value?" }
        - { id: is-op, label: "is", note: "Same object in memory?" }
        - { id: is-none, label: "is None", note: "The correct way to test for None" }
        - { id: small-int-cache, label: "Int/str interning", note: "Small ints and some strings are cached, so is can look true" }
    - id: conditionals
      children:
        - { id: if-elif-else, label: "if / elif / else", note: "Run a block based on conditions" }
        - { id: ternary-expr, label: "Ternary", note: "x if cond else y in one line" }
        - { id: truthiness, label: "Truthiness", note: "Empty, 0 and None are falsy; most else is truthy" }
    - id: loops
      children:
        - { id: for-loop, label: "for", note: "Iterate over any iterable" }
        - { id: while-loop, label: "while", note: "Repeat while a condition holds" }
        - { id: nested-loop, label: "Nested loop", note: "A loop inside another loop" }
    - id: loop-control
      children:
        - { id: break-kw, label: "break", note: "Exit the nearest loop immediately" }
        - { id: continue-kw, label: "continue", note: "Skip to the next iteration" }
        - { id: pass-kw, label: "pass", note: "Do nothing; a placeholder" }
        - { id: loop-else, label: "loop else", note: "Runs only if the loop finished without break" }
    - id: iteration-helpers
      children:
        - { id: range-func, label: "range(start, stop, step)", note: "Integer sequence; stop is excluded" }
        - { id: enumerate-func, label: "enumerate()", note: "Yields index and value while looping" }
        - { id: zip-func, label: "zip()", note: "Loops over several iterables together" }

  collections:
    - id: strings
      children:
        - { id: str-immutable, label: "Immutable", note: "You cannot change a character in place" }
        - { id: str-indexing, label: "Indexing", note: "s[0] first, s[-1] last" }
        - { id: str-slicing, label: "Slicing", note: "s[a:b:step]; end excluded; s[::-1] reverses" }
        - { id: f-strings, label: "f-strings", note: "f\"{name}\" inserts values; the preferred format style" }
    - id: string-methods
      children:
        - { id: case-methods, label: "upper / lower / strip", note: "Change case or trim whitespace" }
        - { id: split-join, label: "split / join", note: "Text to list and list back to text" }
        - { id: find-vs-index, label: "find vs index", note: "find returns -1 if missing; index raises ValueError" }
        - { id: is-checks, label: "isdigit / isalpha", note: "Check the characters in a string" }
    - id: lists
      children:
        - { id: list-ordered-mutable, label: "Ordered and mutable", note: "Keeps order; you can change, add, remove" }
        - { id: append-method, label: "append / extend", note: "append adds one item; extend adds each item of an iterable" }
        - { id: remove-pop, label: "remove / pop", note: "remove by value; pop by index and returns it" }
        - { id: sort-method, label: "sort / sorted", note: "sort changes in place; sorted returns a new list" }
    - id: tuples
      children:
        - { id: tuple-immutable, label: "Immutable", note: "Fixed after creation; usable as a dict key if hashable" }
        - { id: single-tuple, label: "Single element", note: "(10,) needs the trailing comma" }
        - { id: tuple-unpacking, label: "Unpacking", note: "name, age = person" }
    - id: sets
      children:
        - { id: set-unique, label: "Unique items", note: "Duplicates are dropped automatically" }
        - { id: set-unordered, label: "No index", note: "No insertion-order guarantee; cannot index" }
        - { id: set-ops, label: "Set operations", note: "union |, intersection &, difference -, symmetric ^" }
        - { id: frozenset-node, label: "frozenset", note: "An immutable, hashable set" }
    - id: dictionaries
      children:
        - { id: dict-keys, label: "Hashable keys", note: "Keys must be hashable and unique; values can repeat" }
        - { id: dict-get, label: "get vs [key]", note: "[key] raises KeyError; get returns None or a default" }
        - { id: dict-methods, label: "keys / values / items", note: "Views for looping over a dict" }
        - { id: dict-ordered, label: "Insertion order", note: "Dicts keep insertion order since Python 3.7" }
    - id: comprehensions
      children:
        - { id: list-comp, label: "List comprehension", note: "[x*x for x in nums if x > 0]" }
        - { id: set-comp, label: "Set comprehension", note: "{x for x in nums}" }
        - { id: dict-comp, label: "Dict comprehension", note: "{k: v for k, v in pairs}" }
        - { id: gen-expr, label: "Generator expression", note: "(x for x in nums); lazy, uses little memory" }
    - id: unpacking-and-swapping
      children:
        - { id: extended-unpacking, label: "Extended unpacking", note: "first, *rest, last = values" }
        - { id: swap-vars, label: "Swap", note: "a, b = b, a with no temp variable" }
        - { id: star-unpack, label: "* and ** unpack", note: "Spread a list or dict into a call" }

  functions:
    - id: functions-basics
      children:
        - { id: def-keyword, label: "def", note: "Defines a function" }
        - { id: return-vs-print, label: "return vs print", note: "return gives a value back; print only displays; no return means None" }
        - { id: docstring, label: "Docstring", note: "A string under the def that documents it" }
    - id: function-arguments
      children:
        - { id: positional-args, label: "Positional", note: "Matched by order" }
        - { id: keyword-args, label: "Keyword", note: "Matched by name: greet(name=\"A\")" }
        - { id: default-args, label: "Default", note: "A value used when the caller omits it" }
        - { id: args-node, label: "*args", note: "Collects extra positional args into a tuple" }
        - { id: kwargs-node, label: "**kwargs", note: "Collects extra keyword args into a dict" }
    - id: lambda
      children:
        - { id: lambda-anon, label: "Anonymous", note: "A one-expression function with no name" }
        - { id: lambda-use, label: "Used with", note: "map, filter, and sort keys" }
    - id: recursion
      children:
        - { id: base-case, label: "Base case", note: "The stop condition" }
        - { id: recursive-case, label: "Recursive case", note: "Calls itself on a smaller problem" }
        - { id: recursion-limit, label: "Recursion limit", note: "Deep recursion raises RecursionError (default ~1000)" }
    - id: scope-legb
      children:
        - { id: legb-rule, label: "LEGB", note: "Local, Enclosing, Global, Built-in search order" }
        - { id: global-kw, label: "global", note: "Lets a function rebind a module-level name" }
        - { id: nonlocal-kw, label: "nonlocal", note: "Lets a nested function rebind an enclosing name" }
    - id: closures
      children:
        - { id: closure-node, label: "Closure", note: "An inner function that remembers enclosing variables" }
        - { id: first-class-func, label: "First-class functions", note: "Functions can be passed, returned, stored" }
        - { id: higher-order-func, label: "Higher-order function", note: "Takes or returns a function" }
    - id: decorators
      children:
        - { id: decorator-at, label: "@ syntax", note: "@deco wraps the function below it" }
        - { id: wrapper-func, label: "Wrapper", note: "The inner function that adds behaviour" }
        - { id: functools-wraps, label: "functools.wraps", note: "Keeps the wrapped function's name and docstring" }

  oop:
    - id: class-and-object
      children:
        - { id: class-node, label: "Class", note: "A blueprint for objects" }
        - { id: object-node, label: "Object", note: "An instance of a class" }
        - { id: self-node, label: "self", note: "The current instance; a convention, not a keyword" }
        - { id: attribute-method, label: "Attribute / method", note: "Data and functions that belong to an object" }
    - id: init-new-del
      children:
        - { id: init-method, label: "__init__", note: "Initialises a new instance's attributes" }
        - { id: new-method, label: "__new__", note: "Creates the instance before __init__ runs" }
        - { id: del-method, label: "__del__", note: "Finaliser; timing not guaranteed, avoid for cleanup" }
    - id: encapsulation
      children:
        - { id: public-attr, label: "Public", note: "name: open access" }
        - { id: protected-attr, label: "_protected", note: "Convention only: please do not touch" }
        - { id: private-mangled, label: "__private", note: "Name-mangled to _Class__name to avoid clashes" }
        - { id: property-node, label: "property", note: "A managed attribute with getter/setter logic" }
    - id: inheritance
      children:
        - { id: super-node, label: "super()", note: "Calls the parent implementation via the MRO" }
        - { id: override-node, label: "Overriding", note: "A child redefines a parent method" }
        - { id: single-inherit, label: "Single", note: "One parent" }
        - { id: multiple-inherit, label: "Multiple", note: "More than one parent" }
        - { id: multilevel-inherit, label: "Multilevel", note: "Grandparent to parent to child" }
    - id: polymorphism
      children:
        - { id: poly-override, label: "Via overriding", note: "Same method name, different behaviour per class" }
        - { id: poly-duck, label: "Via duck typing", note: "Any object with the right method works" }
        - { id: no-overloading, label: "No true overloading", note: "A later def replaces the earlier; use default args or *args" }
    - id: abstraction
      children:
        - { id: abc-node, label: "ABC", note: "Abstract Base Class from the abc module" }
        - { id: abstractmethod-node, label: "@abstractmethod", note: "A method subclasses must implement" }
        - { id: cannot-instantiate, label: "Cannot instantiate", note: "An abstract class with unimplemented methods cannot be created" }
    - id: method-types
      children:
        - { id: instance-method, label: "Instance method", note: "Takes self; works on the object" }
        - { id: class-method, label: "Class method", note: "@classmethod takes cls; works on the class" }
        - { id: static-method, label: "Static method", note: "@staticmethod takes neither; a plain utility" }
    - id: mro
      children:
        - { id: mro-order, label: "MRO", note: "The order Python searches classes for a method (C3 linearisation)" }
        - { id: issubclass-node, label: "issubclass()", note: "Checks if one class inherits another" }
    - id: dunder-methods
      children:
        - { id: str-repr, label: "__str__ / __repr__", note: "Readable and debug text for an object" }
        - { id: len-dunder, label: "__len__", note: "Lets len() work on your object" }
        - { id: eq-dunder, label: "__eq__ / __hash__", note: "Define equality and hashing" }

  iterators:
    - id: iterable-vs-iterator
      children:
        - { id: iterable-node, label: "Iterable", note: "Can give an iterator via iter(); list, str, dict" }
        - { id: iterator-node, label: "Iterator", note: "Produces items one at a time via next()" }
        - { id: stopiteration-node, label: "StopIteration", note: "Raised when an iterator is exhausted" }
    - id: generators
      children:
        - { id: yield-node, label: "yield", note: "Returns a value and pauses, keeping state" }
        - { id: lazy-eval, label: "Lazy evaluation", note: "Values are produced only when asked for" }
        - { id: generator-once, label: "Consumed once", note: "A generator does not restart after it is exhausted" }
    - id: context-managers
      children:
        - { id: with-statement, label: "with", note: "Sets up and tears down a resource safely" }
        - { id: enter-exit, label: "__enter__ / __exit__", note: "The setup and cleanup methods" }
        - { id: contextlib-node, label: "contextlib", note: "Helpers like @contextmanager" }
    - id: exceptions
      children:
        - { id: try-except, label: "try / except", note: "Run risky code and handle errors" }
        - { id: else-finally, label: "else / finally", note: "else on success; finally always runs" }
        - { id: raise-node, label: "raise", note: "Throw an exception yourself" }
        - { id: common-exceptions, label: "Common types", note: "ValueError, TypeError, KeyError, IndexError" }
    - id: custom-exceptions
      children:
        - { id: inherit-exception, label: "Inherit Exception", note: "class MyError(Exception): pass" }
        - { id: raise-vs-assert-node, label: "raise vs assert", note: "assert can be stripped with -O; do not use it for validation" }
    - id: file-handling
      children:
        - { id: open-func, label: "open(path, mode)", note: "Returns a file object" }
        - { id: file-modes, label: "Modes", note: "r read, w overwrite, a append, x create, b binary" }
        - { id: with-open, label: "with open()", note: "Closes the file automatically, even on error" }
    - id: map-filter-reduce
      children:
        - { id: map-node, label: "map()", note: "Apply a function to every item" }
        - { id: filter-node, label: "filter()", note: "Keep items passing a test" }
        - { id: reduce-node, label: "reduce()", note: "Fold items into one value; from functools" }
    - id: type-hints
      children:
        - { id: hint-syntax, label: "Syntax", note: "def add(a: int, b: int) -> int" }
        - { id: optional-hint, label: "X | None", note: "A value that can also be None (Python 3.10+)" }
        - { id: not-enforced, label: "Not enforced", note: "Hints are ignored at runtime; mypy checks them statically" }
    - id: dataclasses
      children:
        - { id: dataclass-decorator, label: "@dataclass", note: "Auto-generates __init__, __repr__, __eq__" }
        - { id: dataclass-fields, label: "Fields", note: "Declared with type hints" }

  concurrency:
    - id: concurrency-vs-parallelism
      children:
        - { id: concurrency-node, label: "Concurrency", note: "Tasks make progress in overlapping periods" }
        - { id: parallelism-node, label: "Parallelism", note: "Tasks run at the same instant on many cores" }
        - { id: process-node, label: "Process", note: "A program with its own memory" }
        - { id: thread-node, label: "Thread", note: "A unit of execution sharing process memory" }
    - id: threading
      children:
        - { id: thread-io-bound, label: "Good for I/O-bound", note: "Network and file waits overlap well" }
        - { id: shared-memory, label: "Shared memory", note: "Threads share data; needs locks to stay safe" }
    - id: multiprocessing
      children:
        - { id: process-cpu-bound, label: "Good for CPU-bound", note: "True parallelism across cores" }
        - { id: separate-memory, label: "Separate memory", note: "Processes talk via IPC, queues or pipes" }
    - id: gil
      children:
        - { id: gil-one-thread, label: "One thread at a time", note: "Only one thread runs Python bytecode in standard CPython" }
        - { id: gil-io-ok, label: "Released on I/O", note: "The GIL is released during I/O, so threads still help there" }
        - { id: free-threaded, label: "Free-threaded build", note: "PEP 779: no-GIL CPython is officially supported in 3.14" }
    - id: asyncio
      children:
        - { id: async-await, label: "async / await", note: "Define and pause a coroutine" }
        - { id: coroutine-node, label: "Coroutine", note: "A function that can pause and resume" }
        - { id: event-loop, label: "Event loop", note: "Schedules coroutines on one thread" }
    - id: modules-and-packages
      children:
        - { id: module-node, label: "Module", note: "A .py file of reusable code" }
        - { id: package-node, label: "Package", note: "A folder of modules, often with __init__.py" }
        - { id: import-styles, label: "import styles", note: "import x, from x import y, import x as z" }
        - { id: name-main, label: "__name__ == \"__main__\"", note: "True only when the file is run directly" }
    - id: venv-and-pip
      children:
        - { id: venv-node, label: "venv", note: "An isolated per-project environment" }
        - { id: pip-node, label: "pip", note: "Installs packages from PyPI" }
        - { id: requirements-txt, label: "requirements.txt", note: "Pinned dependency list; pip freeze and pip install -r" }
    - id: collections-module
      children:
        - { id: counter-node, label: "Counter", note: "Counts occurrences of items" }
        - { id: defaultdict-node, label: "defaultdict", note: "Supplies a default for missing keys" }
        - { id: deque-node, label: "deque", note: "Fast appends and pops at both ends" }
        - { id: namedtuple-node, label: "namedtuple", note: "A tuple with named fields" }
    - id: time-complexity
      children:
        - { id: list-complexity, label: "list", note: "index O(1), append O(1) amortised, insert front O(n)" }
        - { id: dict-set-complexity, label: "dict / set", note: "lookup and insert O(1) average" }
        - { id: stack-queue, label: "Stack / queue", note: "list for a stack; deque for a queue (popleft O(1))" }

  practice:
    - id: python-web-frameworks
      children:
        - { id: django-node, label: "Django", note: "Full framework: ORM, auth, admin built in" }
        - { id: flask-node, label: "Flask", note: "Minimal microframework; add what you need" }
        - { id: fastapi-node, label: "FastAPI", note: "Async API framework with type-based validation and auto docs" }
    - id: testing-and-logging
      children:
        - { id: pytest-node, label: "pytest", note: "Popular test framework; plain assert" }
        - { id: unittest-node, label: "unittest", note: "Built-in xUnit-style framework" }
        - { id: mock-node, label: "mock", note: "Replace real dependencies in tests" }
        - { id: logging-node, label: "logging", note: "Levelled application logs; prefer over print" }
    - id: regex
      children:
        - { id: re-match-search, label: "match / search", note: "match at the start; search anywhere" }
        - { id: re-findall-sub, label: "findall / sub", note: "find all matches; replace matches" }
    - id: string-coding-problems
      children:
        - { id: reverse-palindrome, label: "Reverse / palindrome", note: "s[::-1] and s == s[::-1]" }
        - { id: anagram-check, label: "Anagram", note: "sorted(a) == sorted(b)" }
        - { id: char-frequency, label: "Char frequency", note: "dict.get or Counter" }
    - id: number-coding-problems
      children:
        - { id: factorial-fib, label: "Factorial / Fibonacci", note: "loop or recursion" }
        - { id: prime-check, label: "Prime", note: "trial division up to sqrt(n)" }
        - { id: missing-number, label: "Missing number", note: "n(n+1)/2 minus the sum" }
    - id: collection-coding-problems
      children:
        - { id: dedup-node, label: "Remove duplicates", note: "set, or dict.fromkeys to keep order" }
        - { id: two-sum-node, label: "Two Sum", note: "a hash map of value to index" }
        - { id: common-elements, label: "Common elements", note: "set(a) & set(b)" }
    - id: python-for-java-developers
      children:
        - { id: no-braces, label: "Indentation, not braces", note: "Blocks are defined by whitespace" }
        - { id: no-types-declared, label: "No type declarations", note: "Dynamic typing; hints are optional" }
        - { id: self-explicit, label: "Explicit self", note: "Every instance method takes self" }
