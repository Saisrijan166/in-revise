id: ingress-vs-gateway-api
tech: kubernetes
title: Ingress vs Gateway API
compares: [ingress-resource, gateway-api]
gist:
  - "One object of HTTP(S) rules; GA and frozen"
  - "Role-based add-on APIs; where new features go"
rows:
  - { aspect: "Status", a: "GA since 1.19; no new features", b: "Add-on CRDs; Gateway, HTTPRoute GA" }
  - { aspect: "Objects", a: "Ingress, IngressClass", b: "GatewayClass, Gateway, HTTPRoute, GRPCRoute" }
  - { aspect: "Protocols", a: "HTTP and HTTPS only", b: "HTTP, gRPC; TCP and UDP routes GA in v1.6" }
  - { aspect: "Header match, weights", a: "Only through controller annotations", b: "Built into the API" }
  - { aspect: "Who edits it", a: "Everyone edits one object", b: "Split: infra, platform team, app team" }
verdict: "Choose Gateway API for new work; keep a working Ingress until you migrate, on a maintained controller."
sources:
  - title: "Ingress (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
    verifiedOn: "2026-10-20"
  - title: "Gateway API (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/gateway/"
    verifiedOn: "2026-10-20"
  - title: "Gateway API v1.6.0 release notes: TCPRoute and UDPRoute GA"
    url: "https://github.com/kubernetes-sigs/gateway-api/releases"
    verifiedOn: "2026-10-20"
