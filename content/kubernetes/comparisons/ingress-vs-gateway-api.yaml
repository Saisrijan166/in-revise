id: ingress-vs-gateway-api
tech: kubernetes
title: Ingress vs Gateway API
compares: [ingress-resource, gateway-api]
gist:
  - "One object of HTTP(S) rules; stable and frozen"
  - "Role-based add-on objects; where new features go"
explain:
  - "Ingress is one object that maps hosts and paths to Services for HTTP and HTTPS traffic. An Ingress controller carries out the rules. It is stable and supported, but frozen: it gets no new features."
  - "Gateway API is a set of add-on objects for the same job, split by role: a GatewayClass names the controller, a Gateway defines the listener, and an HTTPRoute holds one app's rules. Header matching and weights are built in."
example: "To send 10% of /payments traffic to a new version, an Ingress needs annotations that only its own controller understands. An HTTPRoute lists two backendRefs with weights 90 and 10, using a field of the standard API."
rows:
  - { aspect: "Status", a: "Stable since 1.19; frozen, no new features", b: "Add-on custom resources; Gateway and HTTPRoute stable" }
  - { aspect: "Objects", a: "Ingress, IngressClass", b: "GatewayClass, Gateway, HTTPRoute, GRPCRoute and more" }
  - { aspect: "Protocols", a: "HTTP and HTTPS only", b: "HTTP, gRPC, and TCP and UDP (stable since v1.6)" }
  - { aspect: "Header matching, weights", a: "Only through controller-specific annotations", b: "Part of the API" }
  - { aspect: "Who edits it", a: "One object holds everything", b: "Split: infrastructure, platform team, app teams" }
verdict: "Choose Gateway API for new work; keep a working Ingress until you migrate, on a maintained controller."
sayIt: "Ingress is one frozen object for HTTP host and path rules. Gateway API is its successor: GatewayClass, Gateway and routes split the work between platform and app teams, and add header matching, weights and more protocols. I choose Gateway API for new work."
sources:
  - title: "Ingress (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
    verifiedOn: "2026-10-21"
  - title: "Gateway API: roles, stable kinds, expressive routing (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/gateway/"
    verifiedOn: "2026-10-21"
  - title: "Gateway API v1.6.0 release notes: TCPRoute and UDPRoute GA"
    url: "https://github.com/kubernetes-sigs/gateway-api/releases"
    verifiedOn: "2026-10-21"
