id: rolling-vs-blue-green-vs-canary
tech: kubernetes
title: "Rolling vs Blue-Green vs Canary"
compares: [rolling-update-strategy, blue-green-deployment, canary-release]
gist:
  - "Swap old Pods for new ones a few at a time"
  - "Run a full new copy, then switch all traffic"
  - "Send a small share to the new version, then grow it"
rows:
  - { aspect: "Built into a Deployment", a: "Yes, the default strategy", b: "No: two Deployments and a selector or route switch", c: "No: two Deployments, or a tool" }
  - { aspect: "Extra capacity", a: "Only maxSurge Pods", b: "A second full set", c: "A few canary Pods" }
  - { aspect: "Users on the new version", a: "A growing mix", b: "None, then all at once", c: "A small chosen share" }
  - { aspect: "Rollback", a: "rollout undo: Pods are replaced again", b: "Switch back: fast; old Pods still run", c: "Set the canary share to 0" }
  - { aspect: "Main risk", a: "Two versions serve at once", b: "Double cost; a bad switch hits everyone", c: "Needs good metrics to judge" }
verdict: "Use rolling for most releases, blue-green when you need a fast switch back, and canary for risky changes."
