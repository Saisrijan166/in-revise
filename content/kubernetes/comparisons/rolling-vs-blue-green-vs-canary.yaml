id: rolling-vs-blue-green-vs-canary
tech: kubernetes
title: "Rolling vs Blue-Green vs Canary"
compares: [rolling-update-strategy, blue-green-deployment, canary-release]
gist:
  - "Swap old Pods for new ones a few at a time"
  - "Run a full new copy, then switch all traffic"
  - "Send a small share to the new version, then grow it"
explain:
  - "A rolling update is the Deployment's default. It replaces old Pods with new ones a few at a time inside one Deployment, so the service keeps running during the upgrade."
  - "Blue-green runs the new version as a second full set of Pods next to the old one. When it is tested, one switch moves all traffic to it, and switching back is just as fast."
  - "Canary runs a few Pods of the new version and sends them a small share of real traffic. If errors and latency stay healthy, the share grows until the new version takes everything."
example: "payment-service 1.5.0 changes how UPI retries work. With a rolling update, all users reach 1.5.0 within minutes. With blue-green, 1.5.0 is tested on its own Pods, then gets 100% at once. With a canary, 10% of payments go to 1.5.0 for an hour while you compare its error rate with 1.4.0."
rows:
  - { aspect: "Built into a Deployment", a: "Yes, the default strategy", b: "No: two Deployments and a selector or route switch", c: "No: two Deployments, or a tool" }
  - { aspect: "Extra capacity", a: "Only the maxSurge Pods", b: "A second full set of Pods", c: "A few canary Pods" }
  - { aspect: "Users on the new version", a: "A growing mix during the update", b: "None, then all at once", c: "A small chosen share" }
  - { aspect: "Rollback", a: "rollout undo replaces the Pods again", b: "Switch back: fast, the old Pods still run", c: "Set the canary share to 0" }
  - { aspect: "Main risk", a: "Two versions serve at the same time", b: "Double cost, and a bad switch hits everyone", c: "Needs good metrics to judge it" }
verdict: "Use a rolling update for most releases, blue-green when you need a fast switch back, and canary for risky changes you want to test on a few users."
sayIt: "A rolling update replaces Pods in place and is the Deployment default. Blue-green runs a full second copy and switches all traffic at once, so rollback is instant. Canary sends a small share to the new version and grows it while metrics stay healthy."
