id: container-vs-pod
tech: kubernetes
title: Container vs Pod
compares: [app-container, pods]
gist:
  - "One process from one image"
  - "One or more containers sharing an IP and volumes"
explain:
  - "A container is one running process started from an image, such as the payment-service Java app. It has its own files, which are lost when it restarts."
  - "A Pod is the Kubernetes object that wraps one or more containers. It gives them one IP address, shared volumes and one place on one node, and it is what Kubernetes schedules."
example: "The payment-service Pod holds one container. If the Java process crashes, the kubelet restarts the container inside the same Pod. If the node fails, the Pod is gone, and the Deployment creates a new Pod elsewhere."
rows:
  - { aspect: "What it is", a: "A running process from an image", b: "The wrapper Kubernetes schedules" }
  - { aspect: "Network", a: "Uses the Pod's IP and ports", b: "One IP per Pod; localhost inside" }
  - { aspect: "Files", a: "Own files are lost when it restarts", b: "Volumes survive container restarts" }
  - { aspect: "On failure", a: "Restarted in place by the kubelet", b: "Never restarted elsewhere; a controller replaces it" }
  - { aspect: "Placement", a: "Never scheduled on its own", b: "Scheduled as one unit onto one node" }
verdict: "Say 'Pod' for what Kubernetes schedules and replaces; 'container' for the process inside it."
sayIt: "A container is a process from an image; a Pod is the wrapper Kubernetes schedules, holding one or more containers that share an IP, ports and volumes on one node. The kubelet restarts containers; controllers replace Pods."
sources:
  - title: "Pods (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/"
    verifiedOn: "2026-10-20"
  - title: "Pod Lifecycle (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"
    verifiedOn: "2026-10-20"
  - title: "Volumes: background (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/storage/volumes/"
    verifiedOn: "2026-10-20"
