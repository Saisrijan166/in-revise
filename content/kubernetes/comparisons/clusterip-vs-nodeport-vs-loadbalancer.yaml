id: clusterip-vs-nodeport-vs-loadbalancer
tech: kubernetes
title: ClusterIP vs NodePort vs LoadBalancer
compares: [clusterip-service, nodeport-service, loadbalancer-service]
gist:
  - "A virtual IP reachable only inside the cluster"
  - "One port (default range 30000-32767) on every node"
  - "A cloud load balancer in front of the node ports"
explain:
  - "The default Service type. Kubernetes gives the Service a virtual IP that only Pods and nodes inside the cluster can reach. It is how one service calls another, such as order-service calling payment-service."
  - "Builds on ClusterIP and also opens one port, from 30000-32767 by default, on every node. Anyone who can reach a node's IP can reach the Service on that port, so you can put your own load balancer in front."
  - "Builds on NodePort and also asks the cloud provider, or a load balancer add-on, for an external load balancer with its own address. That load balancer forwards traffic to the Service."
example: "payment-service is called only by order-service, so it stays ClusterIP. On a test cluster you open it as a NodePort for a quick check from your laptop. An MQTT broker that IoT devices reach on TCP port 1883 gets type LoadBalancer, because it is not HTTP and needs its own external address."
diagrams:
  - |
    flowchart LR
      O[order-service Pod] --> C[ClusterIP 10.96.x.x:80] --> P[Pods :8080]
  - |
    flowchart LR
      U[Client] -- "node IP:30080" --> N[Any node] --> C[ClusterIP] --> P[Pods]
  - |
    flowchart LR
      U[Client] --> L[Cloud load balancer] --> N[Node ports] --> P[Pods]
diagramAlt: "ClusterIP: a Pod calls the virtual IP on port 80 and reaches the Pods on 8080. NodePort: a client calls any node's IP on port 30080, which forwards through the ClusterIP to the Pods. LoadBalancer: a client calls the cloud load balancer, which forwards to the node ports and on to the Pods."
rows:
  - { aspect: "Reached from", a: "Pods inside the cluster", b: "Outside: a node IP plus the nodePort", c: "Outside: the load balancer's address" }
  - { aspect: "Builds on", a: "Nothing: the base type", b: "A ClusterIP", c: "A NodePort and a ClusterIP" }
  - { aspect: "Needs", a: "Nothing extra", b: "Nodes that the caller can reach", c: "A cloud provider or a load balancer add-on" }
  - { aspect: "Typical use", a: "Service-to-service calls", b: "Tests, or your own load balancer in front", c: "Exposing one app, often a non-HTTP one" }
verdict: "Default to ClusterIP; expose HTTP through a Gateway or Ingress, use LoadBalancer for other protocols, and keep NodePort for tests."
sayIt: "ClusterIP is the default: a virtual IP reachable only inside the cluster. NodePort adds a port on every node, and LoadBalancer adds a cloud load balancer in front of those node ports. For outside HTTP traffic I use one Gateway or Ingress instead of a LoadBalancer per service."
sources:
