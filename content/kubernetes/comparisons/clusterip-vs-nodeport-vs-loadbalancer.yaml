id: clusterip-vs-nodeport-vs-loadbalancer
tech: kubernetes
title: ClusterIP vs NodePort vs LoadBalancer
compares: [clusterip-service, nodeport-service, loadbalancer-service]
gist:
  - "A virtual IP reachable only inside the cluster"
  - "One port (default range 30000-32767) on every node"
  - "A cloud load balancer in front of the node ports"
rows:
  - { aspect: "Reached from", a: "Pods inside the cluster", b: "Outside: a node IP plus the nodePort", c: "Outside: the load balancer's IP" }
  - { aspect: "Builds on", a: "Nothing: the base type", b: "A ClusterIP", c: "A NodePort and a ClusterIP" }
  - { aspect: "Needs", a: "Nothing extra", b: "Nodes reachable by the caller", c: "A cloud provider or load balancer add-on" }
  - { aspect: "Typical use", a: "Service-to-service calls", b: "Tests, or your own load balancer", c: "Exposing one non-HTTP app" }
verdict: "Default to ClusterIP; expose HTTP through a Gateway or Ingress, use LoadBalancer for other protocols, and keep NodePort for tests."
sources:
  - title: "Service: Service types (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/service/"
    verifiedOn: "2026-10-20"
  - title: "Ingress: exposing other protocols uses NodePort or LoadBalancer (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
    verifiedOn: "2026-10-20"
