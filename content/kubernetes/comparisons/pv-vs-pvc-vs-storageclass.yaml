id: pv-vs-pvc-vs-storageclass
tech: kubernetes
title: PV vs PVC vs StorageClass
compares: [persistent-volume, persistent-volume-claim, storage-class]
gist:
  - "The storage itself: a real disk or share"
  - "The request: size, access mode, class"
  - "The recipe: how to create PVs on demand"
diagrams:
  - |
    flowchart LR
      PV[(PV 20Gi)] --> D[(Cloud disk)]
  - |
    flowchart LR
      P[Pod] --> C[PVC 20Gi RWO] -- binds --> PV[(PV)]
  - |
    flowchart LR
      C[PVC] --> SC[StorageClass] -- provisioner --> PV[(New PV)]
diagramAlt: "PV: a PersistentVolume of 20Gi points at a real cloud disk. PVC: a Pod uses a claim for 20Gi ReadWriteOnce, which binds to a PV. StorageClass: a new claim names a StorageClass, whose provisioner creates a new PV for it."
rows:
  - { aspect: "Scope", a: "Cluster-wide", b: "Namespaced", c: "Cluster-wide" }
  - { aspect: "Made by", a: "An admin (static) or a provisioner (dynamic)", b: "The app team, in its manifests", c: "An admin, once per storage tier" }
  - { aspect: "Lifetime", a: "Outlives Pods; reclaim policy on release", b: "Until deleted; Pods come and go", c: "Long-lived setting" }
  - { aspect: "Key fields", a: "capacity, accessModes, reclaim policy", b: "resources.requests.storage, accessModes", c: "provisioner, reclaimPolicy, volumeBindingMode" }
verdict: "Developers write PVCs; admins define StorageClasses; PVs are usually created for you by dynamic provisioning."
sources:
  - title: "Persistent Volumes (Kubernetes documentation)"
    url: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"
    verifiedOn: "2026-10-20"
  - title: "Storage Classes (Kubernetes documentation)"
    url: "https://kubernetes.io/docs/concepts/storage/storage-classes/"
    verifiedOn: "2026-10-20"
