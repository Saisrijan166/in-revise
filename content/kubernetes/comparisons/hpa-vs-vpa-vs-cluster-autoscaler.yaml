id: hpa-vs-vpa-vs-cluster-autoscaler
tech: kubernetes
title: "HPA vs VPA vs Cluster Autoscaler"
compares: [horizontal-pod-autoscaler, vertical-pod-autoscaler, cluster-autoscaler]
gist:
  - "More or fewer Pods of the same size"
  - "Same Pods, bigger or smaller requests"
  - "More or fewer nodes for the Pods to land on"
rows:
  - { aspect: "Changes", a: "Replica count", b: "CPU and memory requests", c: "Node count" }
  - { aspect: "Reacts to", a: "A metric against a target, such as 70% CPU", b: "Past CPU and memory use", c: "Pending Pods, or nodes left underused" }
  - { aspect: "Comes with Kubernetes", a: "Yes: an API and a built-in controller", b: "No: an add-on", c: "No: an add-on tied to the cloud's node groups" }
  - { aspect: "Needs", a: "metrics-server, and requests for CPU %", b: "metrics-server", c: "Pod requests, to decide what fits" }
  - { aspect: "Best for", a: "Stateless services with changing load", b: "Right-sizing requests", c: "Giving new Pods somewhere to run" }
verdict: "Use HPA for stateless services, VPA to right-size requests (not on HPA's metric), and a node autoscaler so new Pods fit."
sources:
  - title: "Horizontal Pod Autoscaling (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/"
    verifiedOn: "2026-10-20"
  - title: "Autoscaling Workloads (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/autoscaling/"
    verifiedOn: "2026-10-20"
  - title: "Node Autoscaling (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/cluster-administration/node-autoscaling/"
    verifiedOn: "2026-10-20"
