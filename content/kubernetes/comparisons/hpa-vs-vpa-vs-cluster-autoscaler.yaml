id: hpa-vs-vpa-vs-cluster-autoscaler
tech: kubernetes
title: "HPA vs VPA vs Cluster Autoscaler"
compares: [horizontal-pod-autoscaler, vertical-pod-autoscaler, cluster-autoscaler]
gist:
  - "More or fewer Pods of the same size"
  - "Same Pods, bigger or smaller requests"
  - "More or fewer nodes for the Pods to land on"
explain:
  - "The HorizontalPodAutoscaler is built into Kubernetes. It changes how many Pods a Deployment runs, so more copies share the load when a metric such as CPU rises."
  - "The VerticalPodAutoscaler is an add-on. It looks at past CPU and memory use and changes each Pod's requests, so Pods ask for what they really need."
  - "Cluster Autoscaler is an add-on that adds nodes when Pods are Pending because no node has room, and removes nodes that stay mostly unused."
example: "A sale doubles traffic to payment-service. The HPA raises it from 3 to 8 Pods. Three new Pods stay Pending because the nodes are full, so Cluster Autoscaler adds a node. Separately, a VPA in Off mode shows each Pod uses about 120m of its 250m CPU request, so you lower the request."
rows:
  - { aspect: "Changes", a: "The replica count", b: "CPU and memory requests", c: "The node count" }
  - { aspect: "Reacts to", a: "A metric against a target, such as 70% CPU", b: "Past CPU and memory use", c: "Pending Pods, or nodes left underused" }
  - { aspect: "Comes with Kubernetes", a: "Yes: an API and a built-in controller", b: "No: an add-on you install", c: "No: an add-on that works with your cloud's nodes" }
  - { aspect: "Needs", a: "metrics-server, and CPU requests for CPU %", b: "metrics-server", c: "Pod requests, to decide what fits" }
  - { aspect: "Best for", a: "Stateless services with changing load", b: "Finding the right requests", c: "Giving new Pods somewhere to run" }
verdict: "Use the HPA for stateless services, the VPA to right-size requests (not on the HPA's metric), and a node autoscaler so new Pods fit."
sayIt: "The HPA is built in and changes the number of Pods from a metric. The VPA is an add-on that changes each Pod's requests. A node autoscaler adds nodes when Pods are Pending. I use the HPA with a node autoscaler, and the VPA only to right-size, never on the HPA's metric."
