id: control-plane-vs-worker-node
tech: kubernetes
title: "Control Plane vs Worker Node"
compares: [control-plane, worker-node]
gist:
  - "Decides: stores state, places Pods, fixes drift"
  - "Runs: starts the Pods it is given, keeps them up"
explain:
  - "The control plane is the set of components that store what you asked for and decide what should happen: the API server, etcd, the scheduler and the controller managers."
  - "A worker node is a machine that runs your Pods. Its kubelet takes the Pods bound to that node and starts them through the container runtime; kube-proxy usually sets up Service rules."
example: "You ask for 3 payment-service Pods. The control plane saves the request, creates 3 Pod objects and binds each to a node. On each chosen worker node, the kubelet pulls the image and starts the container. If a worker node dies, the control plane notices and puts replacement Pods on the others."
diagrams:
  - |
    flowchart LR
      K[kubectl] --> API[kube-apiserver]
      API --> E[(etcd)]
      S[kube-scheduler] --> API
      C[kube-controller-manager] --> API
  - |
    flowchart LR
      KL[kubelet] -- watches --> API[kube-apiserver]
      KL -- CRI --> R[containerd]
      R --> P[Pods]
      KP[kube-proxy] -. Service rules .-> P
diagramAlt: "Control plane: kubectl, kube-scheduler and kube-controller-manager all talk to kube-apiserver, which alone stores state in etcd. Worker node: the kubelet watches kube-apiserver for its Pods and asks the container runtime (containerd) through CRI to start them; kube-proxy sets up Service rules for the Pods."
rows:
  - { aspect: "Job", a: "Decides what runs where and keeps the cluster state", b: "Runs the Pods bound to it" }
  - { aspect: "Components", a: "kube-apiserver, etcd, kube-scheduler, kube-controller-manager, cloud-controller-manager (on clouds)", b: "kubelet, container runtime, kube-proxy (optional)" }
  - { aspect: "Runs your app Pods?", a: "Usually not: setup tools keep user containers off it", b: "Yes" }
  - { aspect: "In production", a: "Spread over several machines", b: "Many nodes; at least one is needed to run Pods" }
verdict: "The control plane stores and decides; worker nodes run the Pods. They meet only at the API server."
sayIt: "The control plane is the brain: the API server, etcd, the scheduler and the controllers store state and decide where Pods run. Worker nodes do the work: the kubelet starts the Pods bound to its node through the container runtime. They talk only through the API server."
