id: control-plane-vs-worker-node
tech: kubernetes
title: "Control Plane vs Worker Node"
compares: [control-plane, worker-node]
gist:
  - "Decides: stores state, places Pods, fixes drift"
  - "Runs: starts the Pods it is given, keeps them up"
diagrams:
  - |
    flowchart LR
      K[kubectl] --> API[kube-apiserver]
      API --> E[(etcd)]
      S[kube-scheduler] --> API
      C[kube-controller-manager] --> API
  - |
    flowchart LR
      KL[kubelet] -- watches --> API[kube-apiserver]
      KL -- CRI --> R[containerd]
      R --> P[Pods]
      KP[kube-proxy] -. Service rules .-> P
diagramAlt: "Control plane: kubectl, kube-scheduler and kube-controller-manager all talk to kube-apiserver, which alone stores state in etcd. Worker node: the kubelet watches kube-apiserver for its Pods and asks the container runtime (containerd) through CRI to start them; kube-proxy sets up Service rules for the Pods."
rows:
  - { aspect: "Job", a: "Decide what runs where; keep cluster state", b: "Run the Pods bound to it" }
  - { aspect: "Components", a: "kube-apiserver, etcd, kube-scheduler, kube-controller-manager, cloud-controller-manager", b: "kubelet, container runtime, kube-proxy (optional)" }
  - { aspect: "Runs app Pods?", a: "Usually not: setup tools keep them off", b: "Yes" }
  - { aspect: "In production", a: "Spread over several machines", b: "Many nodes; at least one to run Pods" }
verdict: "The control plane stores and decides; worker nodes run the Pods. Both meet only at the API server."
sources:
  - { title: "Cluster Architecture (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/architecture/", verifiedOn: "2026-10-20" }
  - { title: "Communication between Nodes and the Control Plane (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/", verifiedOn: "2026-10-20" }
