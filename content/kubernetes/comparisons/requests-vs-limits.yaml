id: requests-vs-limits
tech: kubernetes
title: Requests vs Limits
compares: [resource-request, resource-limit]
gist:
  - "What the scheduler reserves for the container"
  - "The most the container may use"
rows:
  - { aspect: "Used by", a: "kube-scheduler, to pick a node", b: "kubelet and the kernel (cgroups), at run time" }
  - { aspect: "CPU", a: "A weight when the node is busy; more is allowed if free", b: "Hard cap: the container is throttled" }
  - { aspect: "Memory", a: "Used for placement; more is allowed if free", b: "Over it: may be OOM-killed (exit code 137)" }
  - { aspect: "If not set", a: "Copies the limit, or a LimitRange default", b: "None: unbounded, unless a LimitRange sets one" }
  - { aspect: "Sum on one node", a: "Must fit the node's allocatable capacity", b: "May exceed the node (overcommitted)" }
verdict: "Set requests from real usage so placement is right; set a memory limit so a leak kills one container, not the node."
sources:
  - title: "Resource Management for Pods and Containers (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
    verifiedOn: "2026-10-20"
  - title: "Limit Ranges (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/policy/limit-range/"
    verifiedOn: "2026-10-20"
