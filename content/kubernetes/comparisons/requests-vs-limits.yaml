id: requests-vs-limits
tech: kubernetes
title: Requests vs Limits
compares: [resource-request, resource-limit]
gist:
  - "What the scheduler reserves for the container"
  - "The most the container may use"
explain:
  - "A request is the CPU and memory reserved for a container. The scheduler uses it to pick a node where the container fits, so nodes are not overfilled."
  - "A limit is the most CPU and memory a container may use while it runs. The kernel enforces it, so one runaway container cannot take the whole node."
example: "The payment service requests 250m CPU and has a 500m limit. The scheduler places it on a node with 250m unreserved. When the node is idle the app may use up to 500m; above that it is throttled. With a 512Mi memory limit, a leak past 512Mi gets the container OOM-killed."
rows:
  - { aspect: "Used by", a: "kube-scheduler, to pick a node", b: "kubelet and the kernel (cgroups), at run time" }
  - { aspect: "CPU", a: "A weight when the node is busy; more is allowed if free", b: "Hard cap: above it the container is throttled" }
  - { aspect: "Memory", a: "Used for placement; more is allowed if free", b: "Over it: may be OOM-killed (exit code 137)" }
  - { aspect: "If not set", a: "Copied from the limit, or a LimitRange default", b: "No cap, unless a LimitRange sets a default" }
  - { aspect: "Sum on one node", a: "Must fit the node's allocatable capacity", b: "May exceed the node (overcommitted)" }
verdict: "Set requests from real usage so placement is right; set a memory limit so a leak kills one container, not the node."
sayIt: "A request is a reservation the scheduler uses to place the Pod; the container may use more if the node has spare. A limit is the hard cap at run time: over the CPU limit it is throttled, over the memory limit it is OOM-killed."
sources:
  - title: "Resource Management for Pods and Containers (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
    verifiedOn: "2026-10-20"
  - title: "Limit Ranges (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/policy/limit-range/"
    verifiedOn: "2026-10-20"
