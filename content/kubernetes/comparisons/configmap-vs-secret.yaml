id: configmap-vs-secret
tech: kubernetes
title: ConfigMap vs Secret
compares: [configmap, secret-kubernetes]
gist:
  - "Plain settings: profile, URLs, feature flags"
  - "Sensitive data: passwords, tokens, keys"
explain:
  - "A ConfigMap stores plain settings as key-value pairs, such as the active profile or a service URL, so one image can run in every environment."
  - "A Secret stores small confidential values, such as a database password or a TLS key, so they stay out of the image and get extra handling on the node."
example: "The payment service reads SPRING_PROFILES_ACTIVE=prod from the payment-config ConfigMap and its database password from the payment-db-secret Secret. Both reach the same container as environment variables, but only the password needs encryption at rest and tight RBAC."
rows:
  - { aspect: "Holds", a: "Non-confidential key-value data", b: "A small amount of confidential data" }
  - { aspect: "Values in YAML", a: "Plain text under data", b: "base64 under data, or plain text under stringData" }
  - { aspect: "In etcd by default", a: "Plain text", b: "Plain text, unless encryption at rest is set" }
  - { aspect: "Mounted on the node", a: "Files in a normal volume", b: "Files in tmpfs (RAM), never on node disk" }
  - { aspect: "Built-in types", a: "None", b: "Opaque, kubernetes.io/tls, dockerconfigjson and more" }
verdict: "Anything you would not paste in a chat goes in a Secret, with encryption at rest and tight RBAC; the rest goes in a ConfigMap."
sayIt: "Both keep configuration out of the image and reach a Pod as env vars or files. A ConfigMap is for plain settings; a Secret is for credentials. A Secret is only base64 by default, so it still needs encryption at rest and narrow RBAC."
sources:
  - title: "ConfigMaps (Kubernetes documentation)"
    url: "https://kubernetes.io/docs/concepts/configuration/configmap/"
    verifiedOn: "2026-10-20"
  - title: "Secrets (Kubernetes documentation)"
    url: "https://kubernetes.io/docs/concepts/configuration/secret/"
    verifiedOn: "2026-10-21"
