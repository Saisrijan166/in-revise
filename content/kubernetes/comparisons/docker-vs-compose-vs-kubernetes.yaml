id: docker-vs-compose-vs-kubernetes
tech: kubernetes
title: "Docker vs Docker Compose vs Kubernetes"
compares: [docker-engine, docker-compose-node, what-is-kubernetes]
gist:
  - "Build an image, run containers on one host"
  - "Run a multi-container app from one file, one host"
  - "Run and heal workloads across many machines"
rows:
  - { aspect: "Main job", a: "Build images; run containers", b: "Define and start an app's services together", c: "Orchestrate workloads across a cluster" }
  - { aspect: "Runs on", a: "One host", b: "One host", c: "Many nodes" }
  - { aspect: "Unit you manage", a: "Container and image", b: "Service in compose.yaml", c: "Pods, managed by workload objects" }
  - { aspect: "When a container dies", a: "Restart policy restarts it on that host", b: "Same restart policies", c: "Controllers replace Pods, on another node if needed" }
  - { aspect: "Scaling", a: "Start more containers by hand", b: "docker compose up --scale", c: "replicas field, plus autoscaling" }
  - { aspect: "Typical use", a: "Build and try one image", b: "Local dev, tests, single-host deploys", c: "Production across machines" }
verdict: "Build with Docker, run the local stack with Compose, and use Kubernetes when the app must spread over many machines and heal itself."
sources:
  - { title: "Why use Compose? (Docker docs)", url: "https://docs.docker.com/compose/intro/features-uses/", verifiedOn: "2026-10-20" }
  - { title: "docker compose up: --scale (Docker docs)", url: "https://docs.docker.com/reference/cli/docker/compose/up/", verifiedOn: "2026-10-20" }
  - { title: "Start containers automatically: restart policies (Docker docs)", url: "https://docs.docker.com/engine/containers/start-containers-automatically/", verifiedOn: "2026-10-20" }
  - { title: "Kubernetes Self-Healing (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/architecture/self-healing/", verifiedOn: "2026-10-20" }
