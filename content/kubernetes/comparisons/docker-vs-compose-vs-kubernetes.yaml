id: docker-vs-compose-vs-kubernetes
tech: kubernetes
title: "Docker vs Docker Compose vs Kubernetes"
compares: [docker-engine, docker-compose-node, what-is-kubernetes]
gist:
  - "Build an image, run containers on one host"
  - "Run a multi-container app from one file, one host"
  - "Run and heal workloads across many machines"
explain:
  - "Docker builds an image from a Dockerfile and runs containers from it on one machine. It solves packaging: the app and everything it needs travel as one image."
  - "Docker Compose starts several containers that belong together, such as an app and its database, from one compose.yaml file on one machine."
  - "Kubernetes runs containers across a cluster of machines. You declare the desired state, and its controllers place, restart, replace and scale the containers to keep that state true."
example: "On your laptop, docker build makes the payment-service image, and docker compose up starts it with a PostgreSQL container for local testing. In production, a Kubernetes Deployment runs 3 copies of the same image across several nodes and replaces any copy that is lost when a node fails."
rows:
  - { aspect: "Main job", a: "Build images; run containers", b: "Define and start an app's services together", c: "Orchestrate workloads across a cluster" }
  - { aspect: "Runs on", a: "One host", b: "One host", c: "Many nodes" }
  - { aspect: "Unit you manage", a: "Container and image", b: "Service in compose.yaml", c: "Pods, managed by workload objects" }
  - { aspect: "When a container dies", a: "A restart policy restarts it on the same host", b: "The same restart policies", c: "The kubelet restarts it; controllers replace lost Pods on other nodes" }
  - { aspect: "Scaling", a: "Start more containers by hand", b: "docker compose up --scale", c: "The replicas field, plus autoscaling" }
  - { aspect: "Typical use", a: "Build and try one image", b: "Local development, tests, single-host deployments", c: "Production across machines" }
verdict: "Build with Docker, run the local stack with Compose, and use Kubernetes when the app must spread over many machines and heal itself."
sayIt: "Docker builds images and runs containers on one host. Compose starts a multi-container app from one file, still on one host, which is great for local development. Kubernetes runs the same images across many nodes and keeps the desired state with scheduling, self-healing and scaling."
sources:
