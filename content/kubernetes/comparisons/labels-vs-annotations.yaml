id: labels-vs-annotations
tech: kubernetes
title: "Labels vs Annotations"
compares: [k8s-labels, k8s-annotations]
gist:
  - "Identify and group objects; selectors use them"
  - "Extra notes for tools and people; never selected"
explain:
  - "A label is a short key-value tag, such as app: payment-service, that identifies an object. Selectors in Services, Deployments and kubectl -l find objects by their labels."
  - "An annotation is a key-value note on an object for tools and people, such as a git commit or an owner contact. It can be long, and nothing selects objects by it."
example: "The payment-service Pods carry the label app: payment-service, so the Deployment and the Service find them. The Deployment also carries the annotation example.com/owner: payments team, which a dashboard reads but no selector can use."
rows:
  - { aspect: "Purpose", a: "Identify objects: app, env, tier", b: "Describe objects: build ID, git commit, on-call contact" }
  - { aspect: "Can you select objects by it?", a: "Yes: Services, Deployments, kubectl -l", b: "No" }
  - { aspect: "Value rules", a: "At most 63 characters; letters, digits, - _ .", b: "Any string, short or long" }
  - { aspect: "Size", a: "Short tags", b: "All annotations on one object together at most 256 KiB" }
verdict: "If something must find the object by it, make it a label; everything else goes in an annotation."
sayIt: "Labels are short identifying tags that selectors use, so Services and Deployments find their Pods by labels. Annotations hold extra, non-identifying data for tools, like a commit or owner, can be much larger, and can never be used to select objects."
sources:
  - { title: "Labels and Selectors (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/", verifiedOn: "2026-10-21" }
  - { title: "Annotations (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/", verifiedOn: "2026-10-21" }
