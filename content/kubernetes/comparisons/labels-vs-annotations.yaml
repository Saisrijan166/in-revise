id: labels-vs-annotations
tech: kubernetes
title: "Labels vs Annotations"
compares: [k8s-labels, k8s-annotations]
gist:
  - "Identify and group objects; selectors use them"
  - "Extra notes for tools and people; never selected"
rows:
  - { aspect: "Purpose", a: "Identify objects: app, env, tier", b: "Describe objects: build ID, git commit, on-call contact" }
  - { aspect: "Select objects by it?", a: "Yes: Services, Deployments, kubectl -l", b: "No" }
  - { aspect: "Value rules", a: "At most 63 characters; letters, digits, - _ .", b: "Any string, small or large" }
  - { aspect: "Size", a: "Short tags", b: "All annotations together at most 256 KiB" }
verdict: "If something must find the object by it, make it a label; everything else goes in an annotation."
sources:
  - { title: "Labels and Selectors (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/", verifiedOn: "2026-10-20" }
  - { title: "Annotations (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/", verifiedOn: "2026-10-20" }
