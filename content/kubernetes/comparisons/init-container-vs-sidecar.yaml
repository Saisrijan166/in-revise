id: init-container-vs-sidecar
tech: kubernetes
title: Init Container vs Sidecar
compares: [init-container, native-sidecar]
gist:
  - "Runs once, in order, before the app starts"
  - "Starts before the app and runs beside it"
explain:
  - "An init container runs once before the app starts, to completion, one after another; for example, waiting until the database name resolves."
  - "A native sidecar is an init container with restartPolicy: Always. It starts before the app, keeps running beside it, and stops after it; for example, a log shipper."
example: "The payment-service Pod has wait-for-db, which loops until payments-db resolves and exits, and log-shipper, which starts next and keeps shipping logs until after the app has stopped."
rows:
  - { aspect: "Runs", a: "To completion, then exits", b: "For the whole life of the Pod" }
  - { aspect: "Defined as", a: "An initContainers entry", b: "An initContainers entry with restartPolicy Always" }
  - { aspect: "Probes", a: "Not supported", b: "Liveness, readiness and startup" }
  - { aspect: "On shutdown", a: "Already finished", b: "Stopped after the app, in reverse order" }
  - { aspect: "Typical use", a: "Wait for the database, run setup", b: "Log shipping, proxies, config reload" }
verdict: "Use an init container for one-time setup; use a sidecar for help the app needs while it runs."
sayIt: "An init container does one-time setup and must exit successfully before the app starts. A native sidecar, stable since 1.33, is an init container with restartPolicy Always: it starts first, runs beside the app, supports probes and stops last."
sources:
  - title: "Init Containers (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"
    verifiedOn: "2026-10-20"
  - title: "Sidecar Containers (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"
    verifiedOn: "2026-10-20"
