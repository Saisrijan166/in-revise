id: taints-vs-node-affinity
tech: kubernetes
title: Taints vs Node Affinity
compares: [node-taint, node-affinity]
gist:
  - "On the node: repels Pods that do not tolerate it"
  - "On the Pod: attracts it to nodes with given labels"
rows:
  - { aspect: "Set on", a: "The node (the Pod adds a toleration)", b: "The Pod spec, matched to node labels" }
  - { aspect: "Keeps other Pods off", a: "Yes", b: "No" }
  - { aspect: "Forces this Pod onto the node", a: "No: a toleration only allows it", b: "Yes, with a required rule" }
  - { aspect: "Soft version", a: "PreferNoSchedule", b: "preferredDuringScheduling with a weight" }
  - { aspect: "Affects running Pods", a: "Yes, NoExecute evicts them", b: "No: IgnoredDuringExecution" }
verdict: "For a dedicated node pool use both: the taint keeps others out, node affinity keeps these Pods in."
sources:
  - title: "Taints and Tolerations (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"
    verifiedOn: "2026-10-20"
  - title: "Assigning Pods to Nodes (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"
    verifiedOn: "2026-10-20"
