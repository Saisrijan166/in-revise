id: helm-vs-kustomize
tech: kubernetes
title: "Helm vs Kustomize"
compares: [helm-tool, kustomize-tool]
gist:
  - "Templates filled from values, packaged as a chart"
  - "Plain YAML plus patches, no templates"
explain:
  - "Helm is a package manager. A chart holds templates and default values; Helm fills the templates with your values, installs the result as a named release, and records each change as a revision you can roll back."
  - "Kustomize keeps plain YAML with no templates. A base folder holds the shared manifests, and an overlay per environment patches them; kubectl apply -k builds and applies the result."
example: "Prod runs the payment service with 3 replicas and image 1.4.1. With Helm you run helm upgrade with values-prod.yaml, and helm rollback returns to the last revision. With Kustomize the prod overlay sets replicas and the image tag, and you undo a change by reverting the Git commit."
rows:
  - { aspect: "How it changes YAML", a: "Go templates rendered with values", b: "Patches and overlays on plain YAML" }
  - { aspect: "Per environment", a: "A values file each", b: "An overlay folder each" }
  - { aspect: "Sharing", a: "Versioned chart in a repository or OCI registry", b: "Folders in Git; no package format" }
  - { aspect: "Rollback", a: "Release revisions: helm rollback", b: "None built in: re-apply an older commit" }
  - { aspect: "Runs with", a: "The helm CLI (Helm 4)", b: "kubectl apply -k, or the kustomize binary" }
verdict: "Use Helm to install third-party software and to ship your app as a package; use Kustomize for small per-environment changes to your own YAML."
sayIt: "Helm renders templates from values and tracks installs as releases with revisions, so it suits third-party software and apps shipped as packages. Kustomize patches plain YAML with per-environment overlays and is built into kubectl, so it suits small differences in our own manifests."
