id: emptydir-vs-persistent-volume
tech: kubernetes
title: emptyDir vs PersistentVolume
compares: [emptydir, persistent-volume]
gist:
  - "Scratch space that lives and dies with the Pod"
  - "Durable storage that outlives every Pod"
rows:
  - { aspect: "Created", a: "When the Pod is assigned to a node, empty", b: "By an admin or a StorageClass, before or on claim" }
  - { aspect: "Deleted", a: "When the Pod leaves the node", b: "Per reclaim policy, after its PVC is deleted" }
  - { aspect: "Survives container crash", a: "Yes", b: "Yes" }
  - { aspect: "In the Pod spec", a: "emptyDir: {} in .spec.volumes", b: "persistentVolumeClaim: claimName" }
  - { aspect: "Typical use", a: "Cache, temp files, sharing with a sidecar", b: "Database files, uploads" }
verdict: "Use emptyDir for data you can lose with the Pod; use a PVC-backed PersistentVolume for anything that must survive it."
sources:
  - title: "Volumes (Kubernetes documentation)"
    url: "https://kubernetes.io/docs/concepts/storage/volumes/"
    verifiedOn: "2026-10-20"
  - title: "Persistent Volumes (Kubernetes documentation)"
    url: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"
    verifiedOn: "2026-10-20"
