id: liveness-vs-readiness-vs-startup
tech: kubernetes
title: Liveness vs Readiness vs Startup Probe
compares: [liveness-probe, readiness-probe, startup-probe]
gist:
  - "Is it stuck? Then restart it"
  - "Can it take traffic right now?"
  - "Has the slow boot finished yet?"
rows:
  - { aspect: "On failure", a: "Container restarted", b: "Pod removed from Service endpoints", c: "Container restarted" }
  - { aspect: "Runs", a: "Whole life, after startup passes", b: "Whole life, after startup passes", c: "Only at start, until it passes once" }
  - { aspect: "Good check", a: "The app's own health, no dependencies", b: "Warm-up done; maybe a must-have dependency", c: "Same endpoint as liveness, high failureThreshold" }
  - { aspect: "Spring Boot 4.1 path", a: "/actuator/health/liveness", b: "/actuator/health/readiness", c: "/actuator/health/liveness" }
  - { aspect: "If not set", a: "Only a crash triggers a restart", b: "Ready as soon as the container starts", c: "Liveness starts after initialDelaySeconds" }
verdict: "Readiness for every Pod that serves traffic, liveness only for hangs a restart can fix, startup when boot is slow."
sources:
  - title: "Liveness, Readiness, and Startup Probes (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"
    verifiedOn: "2026-10-20"
  - title: "Actuator Endpoints: Kubernetes Probes (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html"
    verifiedOn: "2026-10-20"
