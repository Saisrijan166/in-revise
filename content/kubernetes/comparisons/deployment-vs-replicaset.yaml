id: deployment-vs-replicaset
tech: kubernetes
title: Deployment vs ReplicaSet
compares: [deployment-object, replicaset]
gist:
  - "What you edit: versions, rollouts, rollbacks"
  - "What keeps N matching Pods alive"
explain:
  - "A Deployment is the object you write for a stateless app. It holds the Pod template and replica count, and manages versions: a new ReplicaSet per template change, a gradual swap, and rollback."
  - "A ReplicaSet keeps a fixed number of Pods that match its selector alive. It creates a Pod when one is missing and deletes one when there are too many, but it does not update existing Pods."
example: "You change payment-service from image 1.4.0 to 1.5.0. The Deployment creates a new ReplicaSet for 1.5.0 and moves Pods across. The old ReplicaSet stays at 0 Pods, so kubectl rollout undo can bring 1.4.0 back."
rows:
  - { aspect: "You create it", a: "Yes, for every stateless app", b: "Rarely; the Deployment does" }
  - { aspect: "Pod template change", a: "New ReplicaSet, Pods replaced gradually", b: "Existing Pods are not updated" }
  - { aspect: "History", a: "Revisions; rollback to an older one", b: "None of its own" }
  - { aspect: "Owns", a: "ReplicaSets", b: "Pods" }
verdict: "Always create a Deployment; treat its ReplicaSets as read-only parts you inspect, not edit."
sayIt: "A ReplicaSet keeps N matching Pods running. A Deployment manages ReplicaSets: each template change makes a new one, Pods move over gradually, and old ones stay for rollback. I create Deployments and never edit their ReplicaSets."
sources:
  - title: "Deployments (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
    verifiedOn: "2026-10-20"
  - title: "ReplicaSet (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/"
    verifiedOn: "2026-10-20"
