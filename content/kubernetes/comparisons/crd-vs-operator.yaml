id: crd-vs-operator
tech: kubernetes
title: "CRD vs Operator"
compares: [crd-node, k8s-operator-node]
gist:
  - "A new API type: schema and storage only"
  - "A running controller that acts on that type"
explain:
  - "A CRD is an API object that defines a new kind, such as Cluster. Once applied, the API server stores and serves objects of that kind, so you can describe what you want with kubectl."
  - "An operator is a program, usually a Deployment, that watches objects of that kind and does the work: it creates Pods and volumes, takes backups and repairs failures."
example: "With only the CloudNativePG CRDs installed, kubectl apply accepts a payments-db Cluster object and kubectl get lists it, but no database starts. Install the operator, and within minutes it creates three PostgreSQL Pods with their volumes, and promotes a replica if the primary fails."
rows:
  - { aspect: "What it is", a: "An API object that defines a new kind", b: "CRDs plus a custom controller program" }
  - { aspect: "Runs code", a: "No: the API server just stores objects", b: "Yes: usually a Deployment in the cluster" }
  - { aspect: "On its own", a: "kubectl get and apply work; nothing else happens", b: "Creates Pods, volumes, backups; handles upgrades" }
  - { aspect: "Example", a: "Cluster kind from postgresql.cnpg.io", b: "CloudNativePG acting on Cluster objects" }
verdict: "A CRD lets you declare what you want; an operator makes it happen and keeps it that way."
sayIt: "A CRD only extends the API with a new kind, so objects of that kind can be stored and listed. An operator is the controller that watches those objects and makes them real, and keeps them that way: a CRD is the request, the operator does the work."
sources:
  - title: "Custom Resources (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/"
    verifiedOn: "2026-10-20"
  - title: "Operator pattern (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"
    verifiedOn: "2026-10-20"
  - title: "CloudNativePG Quickstart"
    url: "https://cloudnative-pg.io/docs/devel/quickstart"
    verifiedOn: "2026-10-20"
