id: role-vs-clusterrole
tech: kubernetes
title: "Role vs ClusterRole"
compares: [rbac-role-kind, rbac-clusterrole-kind]
gist:
  - "Rules that live in one namespace"
  - "Rules with no namespace: cluster-wide or reusable"
explain:
  - "A Role is a list of allowed actions that lives in one namespace, such as get and list on ConfigMaps in payments. It is the normal choice for one app or one team."
  - "A ClusterRole is the same kind of list with no namespace. It can cover cluster-wide resources such as nodes, or define a rule set once, such as view, for use in many namespaces."
example: "The payments team should read everything in payments only. Bind the built-in view ClusterRole with a RoleBinding in payments: rights stop at that namespace. A monitoring agent that lists nodes needs a ClusterRole with a ClusterRoleBinding, because nodes belong to no namespace."
rows:
  - { aspect: "Object scope", a: "Namespaced", b: "Cluster-wide (no namespace)" }
  - { aspect: "Can cover", a: "Namespaced resources in its namespace", b: "Namespaced resources, plus nodes and URLs like /healthz" }
  - { aspect: "Granted with", a: "A RoleBinding in the same namespace", b: "A RoleBinding (one namespace) or a ClusterRoleBinding" }
  - { aspect: "Rights reach", a: "Only its namespace", b: "RoleBinding: one namespace; ClusterRoleBinding: all namespaces" }
  - { aspect: "Built-in examples", a: "Usually your own, per app", b: "cluster-admin, admin, edit, view" }
verdict: "Default to a Role and RoleBinding; use a ClusterRole for cluster-scoped resources or rules reused across namespaces, and a ClusterRoleBinding only for real cluster-wide access."
sayIt: "A Role is namespaced; a ClusterRole has no namespace, so it can cover nodes or be reused. What decides the reach is the binding: a RoleBinding grants rights in one namespace, even for a ClusterRole, and a ClusterRoleBinding grants them everywhere."
sources:
  - title: "Using RBAC Authorization (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"
    verifiedOn: "2026-10-20"
  - title: "Role Based Access Control Good Practices (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/security/rbac-good-practices/"
    verifiedOn: "2026-10-20"
