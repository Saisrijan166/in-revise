id: loadbalancer-vs-ingress
tech: kubernetes
title: LoadBalancer Service vs Ingress
compares: [loadbalancer-service, ingress-resource]
gist:
  - "A Service type: one external load balancer each"
  - "HTTP rules: many Services behind one entry point"
explain:
  - "LoadBalancer is a Service type. Kubernetes asks the cloud provider for an external load balancer that forwards a TCP or UDP port to this one Service."
  - "Ingress is not a Service type but an object of its own: HTTP and HTTPS rules that send hosts and paths to many Services. An Ingress controller carries them out."
example: "A shop has payments, orders and catalogue APIs. Three LoadBalancer Services mean three cloud load balancers and three addresses. One Ingress puts api.example.com/payments, /orders and /catalogue behind one address; the controller's own proxy usually sits behind a single load balancer."
rows:
  - { aspect: "What it is", a: "A Service type", b: "Its own object, not a Service type" }
  - { aspect: "Traffic", a: "Any TCP or UDP port", b: "HTTP and HTTPS only" }
  - { aspect: "Routes by host or path", a: "No", b: "Yes" }
  - { aspect: "Needs", a: "A cloud provider or a load balancer add-on", b: "An Ingress controller installed in the cluster" }
verdict: "Use LoadBalancer for non-HTTP traffic; put HTTP apps behind one Ingress or Gateway, whose controller is often itself behind a LoadBalancer."
sayIt: "A LoadBalancer Service gives one Service its own external load balancer for any TCP or UDP port. Ingress is an HTTP routing object that puts many Services behind one entry point by host and path. LoadBalancer for non-HTTP traffic, Ingress or Gateway API for web traffic."
sources:
  - title: "Service: type LoadBalancer (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/service/"
    verifiedOn: "2026-10-21"
  - title: "Ingress: not a Service type, controller usually fulfils it with a load balancer (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
    verifiedOn: "2026-10-21"
