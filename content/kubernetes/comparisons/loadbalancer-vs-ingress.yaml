id: loadbalancer-vs-ingress
tech: kubernetes
title: LoadBalancer Service vs Ingress
compares: [loadbalancer-service, ingress-resource]
gist:
  - "A Service type: one external load balancer each"
  - "HTTP rules: many Services behind one entry point"
rows:
  - { aspect: "What it is", a: "A Service type", b: "Its own object, not a Service type" }
  - { aspect: "Traffic", a: "Any TCP or UDP port", b: "HTTP and HTTPS only" }
  - { aspect: "Routes by host or path", a: "No", b: "Yes" }
  - { aspect: "Needs", a: "A cloud provider or load balancer add-on", b: "An Ingress controller installed" }
verdict: "Use LoadBalancer for non-HTTP traffic; put HTTP apps behind one Ingress or Gateway, whose controller is often itself behind a LoadBalancer."
sources:
  - title: "Service: type LoadBalancer (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/service/"
    verifiedOn: "2026-10-20"
  - title: "Ingress (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/ingress/"
    verifiedOn: "2026-10-20"
