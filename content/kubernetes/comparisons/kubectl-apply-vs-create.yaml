id: kubectl-apply-vs-create
tech: kubernetes
title: "kubectl apply vs kubectl create"
compares: [declarative-apply, imperative-create]
gist:
  - "Declarative: send the end state; create or patch"
  - "Imperative: do one action now; fails if it exists"
explain:
  - "kubectl apply sends the state you want, usually from files kept in Git. It creates an object that does not exist yet and patches an existing one so that it matches the file."
  - "kubectl create performs one action: make this object now. It works from a file or from flags, such as kubectl create deployment --image, and fails if the object already exists."
example: "You run kubectl apply -f payment-service.yaml, change replicas from 3 to 5, and apply again: the Deployment is patched to 5. Do the same with kubectl create -f and the second run fails with AlreadyExists, leaving the Deployment at 3."
rows:
  - { aspect: "Object already exists", a: "Patches only the fields that differ", b: "Fails with an AlreadyExists error" }
  - { aspect: "Run the same file twice", a: "Safe: the second run changes nothing", b: "The second run fails" }
  - { aspect: "Works on", a: "Files and folders; -R also reads subfolders", b: "One file, or flags such as create deployment --image" }
  - { aspect: "Remembers what you sent", a: "Yes: a last-applied annotation, or field owners with server-side apply", b: "No, unless you add --save-config" }
  - { aspect: "Best for", a: "Manifests kept in Git", b: "Quick one-off tasks and learning" }
verdict: "Use apply with manifests in Git for anything real; use create for quick experiments, and never mix both on one object."
sayIt: "apply is declarative: it sends the desired state, creates the object if it is missing and patches it if it exists, so the same file can be applied again and again. create is imperative: it makes the object once and fails if it already exists. I use apply for everything kept in Git."
sources:
