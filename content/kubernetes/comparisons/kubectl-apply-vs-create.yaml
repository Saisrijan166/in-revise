id: kubectl-apply-vs-create
tech: kubernetes
title: "kubectl apply vs kubectl create"
compares: [declarative-apply, imperative-create]
gist:
  - "Declarative: send the end state; create or patch"
  - "Imperative: do one action now; fails if it exists"
rows:
  - { aspect: "Object already exists", a: "Patches only the fields that differ", b: "Error: AlreadyExists (HTTP 409)" }
  - { aspect: "Run the same file twice", a: "Safe: nothing changes the second time", b: "Fails the second time" }
  - { aspect: "Works on", a: "Files and folders; -R also reads subfolders", b: "Files, or flags: create deployment --image" }
  - { aspect: "Remembers what you sent", a: "Yes: last-applied annotation or field owners", b: "No, unless --save-config" }
  - { aspect: "Best for", a: "Manifests kept in Git", b: "Quick one-off tasks and learning" }
verdict: "Use apply with manifests in Git for anything real; use create for quick experiments, and never mix both on one object."
sources:
  - { title: "Kubernetes Object Management (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/", verifiedOn: "2026-10-20" }
  - { title: "Declarative Management of Kubernetes Objects Using Configuration Files (Kubernetes docs)", url: "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/", verifiedOn: "2026-10-20" }
  - { title: "kubectl apply (Kubernetes 1.37 reference)", url: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_apply/", verifiedOn: "2026-10-20" }
  - { title: "API Conventions: AlreadyExists (Kubernetes community)", url: "https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md", verifiedOn: "2026-10-20" }
