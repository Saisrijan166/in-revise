id: deployment-vs-service
tech: kubernetes
title: Deployment vs Service
compares: [deployments-and-replicasets, services]
gist:
  - "Runs the Pods: how many, which image, how to update"
  - "Reaches the Pods: one stable IP and DNS name"
rows:
  - { aspect: "Answers", a: "What should run, and how many copies", b: "How callers find the running copies" }
  - { aspect: "Creates", a: "ReplicaSets, which create Pods", b: "EndpointSlices listing its Pod IPs and readiness" }
  - { aspect: "Linked by", a: "Labels on its Pod template", b: "A selector matching those labels" }
  - { aspect: "Without the other", a: "Pods run, but callers chase changing IPs", b: "A stable name with no Pods behind it" }
verdict: "Use both: the Deployment keeps payment-service running, the Service lets others reach it."
sources:
  - title: "Deployments (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
    verifiedOn: "2026-10-20"
  - title: "Service (Kubernetes 1.37 documentation)"
    url: "https://kubernetes.io/docs/concepts/services-networking/service/"
    verifiedOn: "2026-10-20"
