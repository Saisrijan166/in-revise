id: deployment-vs-statefulset-vs-daemonset
tech: kubernetes
title: Deployment vs StatefulSet vs DaemonSet
compares: [deployment-object, statefulsets, daemonsets]
gist:
  - "Interchangeable replicas for stateless apps"
  - "Replicas with fixed names and their own disks"
  - "One Pod on every matching node"
rows:
  - { aspect: "Pod names", a: "Generated suffix", b: "Ordinal: payments-db-0, -1", c: "Generated suffix" }
  - { aspect: "How many Pods", a: "replicas", b: "replicas", c: "One per eligible node" }
  - { aspect: "Storage", a: "None, or one shared claim", b: "One PVC per Pod", c: "Often node paths (hostPath)" }
  - { aspect: "Order", a: "Any order", b: "0 up on create, N-1 down on delete", c: "None; updates one node at a time" }
  - { aspect: "Typical use", a: "REST APIs like payment-service", b: "Databases, brokers", c: "Log and monitoring agents" }
verdict: "Default to a Deployment; use a StatefulSet only when each replica needs its own identity and disk, and a DaemonSet for per-node agents."
sources:
  - title: "Workloads: built-in workload resources (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/"
    verifiedOn: "2026-10-20"
  - title: "StatefulSets (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"
    verifiedOn: "2026-10-20"
  - title: "DaemonSet (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/"
    verifiedOn: "2026-10-20"
