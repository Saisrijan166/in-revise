terms:
  - id: k8s
    term: K8s
    aka: []
    definition: "Short name for Kubernetes: K, then the eight letters between, then s."
    see: what-is-kubernetes
    source:
      title: Overview (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/
      verifiedOn: 2026-10-20
  - id: control-plane
    term: Control plane
    aka: []
    definition: "The components that store cluster state, schedule Pods and react to events: API server, etcd, scheduler, controllers."
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: worker-node
    term: Worker node
    aka: []
    definition: A node that runs application Pods; every cluster needs at least one.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: desired-state
    term: Desired state
    aka: []
    definition: What you ask Kubernetes to keep true, written in an object's spec.
    see: what-is-kubernetes
    source:
      title: Objects In Kubernetes (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
      verifiedOn: 2026-10-20
  - id: reconciliation-loop
    term: Reconciliation loop
    aka:
      - control loop
      - reconciliation
    definition: A loop that watches the cluster and acts to move the actual state toward the desired state.
    see: what-is-kubernetes
    source:
      title: Controllers (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/controller/
      verifiedOn: 2026-10-20
  - id: self-healing
    term: Self-healing
    aka: []
    definition: Restarting failed containers and replacing lost Pods automatically, to keep the desired state.
    see: what-is-kubernetes
    source:
      title: Kubernetes Self-Healing (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/self-healing/
      verifiedOn: 2026-10-20
  - id: container-runtime
    term: Container runtime
    aka: []
    definition: The software on each node that runs containers, such as containerd or CRI-O.
    see: kubernetes-and-docker
    source:
      title: Kubernetes Components (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/components/
      verifiedOn: 2026-10-20
  - id: cri
    term: CRI
    aka:
      - Container Runtime Interface
    definition: The gRPC API the kubelet uses to talk to the container runtime, so any compliant runtime works.
    see: kubernetes-and-docker
    source:
      title: Container Runtime Interface (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/cri/
      verifiedOn: 2026-10-20
  - id: containerd
    term: containerd
    aka: []
    definition: A CNCF graduated container runtime that implements CRI; also used inside Docker Engine.
    see: kubernetes-and-docker
    source:
      title: containerd (official site)
      url: https://containerd.io/
      verifiedOn: 2026-10-20
  - id: cri-o
    term: CRI-O
    aka: []
    definition: A lightweight container runtime built only to implement the Kubernetes CRI.
    see: kubernetes-and-docker
    source:
      title: CRI-O (official site)
      url: https://cri-o.io/
      verifiedOn: 2026-10-20
  - id: dockershim
    term: dockershim
    aka: []
    definition: The old built-in adapter that let the kubelet use Docker Engine; removed in Kubernetes 1.24.
    see: kubernetes-and-docker
    source:
      title: "Updated: Dockershim Removal FAQ (Kubernetes blog)"
      url: https://kubernetes.io/blog/2022/02/17/dockershim-faq/
      verifiedOn: 2026-10-20
  - id: docker-compose
    term: Docker Compose
    aka: []
    definition: A Docker tool that defines and runs a multi-container app from one YAML file.
    see: kubernetes-and-docker
    source:
      title: Docker Compose (Docker docs)
      url: https://docs.docker.com/compose/
      verifiedOn: 2026-10-20
  - id: kube-apiserver
    term: kube-apiserver
    aka:
      - API server
    definition: The control plane front end that serves the Kubernetes HTTP API; every component talks to it.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: etcd
    term: etcd
    aka: []
    definition: A consistent, highly available key-value store that holds all Kubernetes cluster data.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: kube-scheduler
    term: kube-scheduler
    aka:
      - Kubernetes scheduler
    definition: Control plane component that picks a node for each Pod that has none yet.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: kube-controller-manager
    term: kube-controller-manager
    aka:
      - controller manager
    definition: Control plane binary that runs the built-in controllers, such as the Node and Job controllers.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: cloud-controller-manager
    term: cloud-controller-manager
    aka: []
    definition: "Optional control plane part that links the cluster to a cloud API: nodes, routes, load balancers."
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: kubelet
    term: kubelet
    aka: []
    definition: The agent on every node that makes sure the containers of its Pods are running and healthy.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: kube-proxy
    term: kube-proxy
    aka: []
    definition: Optional node agent that keeps network rules so Service traffic reaches the right Pods.
    see: kubernetes-architecture
    source:
      title: Cluster Architecture (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/architecture/
      verifiedOn: 2026-10-20
  - id: kubectl
    term: kubectl
    aka: []
    definition: The command-line tool that talks to a cluster's API server.
    see: kubectl-and-manifests
    source:
      title: Command line tool (kubectl) (Kubernetes docs)
      url: https://kubernetes.io/docs/reference/kubectl/
      verifiedOn: 2026-10-20
  - id: kubeconfig
    term: kubeconfig
    aka: []
    definition: A file listing clusters, users and contexts; kubectl reads $HOME/.kube/config by default.
    see: kubectl-and-manifests
    source:
      title: Organizing Cluster Access Using kubeconfig Files (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
      verifiedOn: 2026-10-20
  - id: manifest
    term: Manifest (Kubernetes)
    aka:
      - Kubernetes manifest
      - manifest file
    definition: A YAML or JSON file describing objects with apiVersion, kind, metadata and spec.
    see: kubectl-and-manifests
    source:
      title: Objects In Kubernetes (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
      verifiedOn: 2026-10-20
  - id: spec-term
    term: spec (object field)
    aka:
      - spec field
    definition: The part of an object where you set its desired state.
    see: kubectl-and-manifests
    source:
      title: Objects In Kubernetes (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
      verifiedOn: 2026-10-20
  - id: status-term
    term: status (object field)
    aka:
      - status field
    definition: The part of an object where Kubernetes reports its current state.
    see: kubectl-and-manifests
    source:
      title: Objects In Kubernetes (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
      verifiedOn: 2026-10-20
  - id: server-side-apply
    term: Server-side apply
    aka: []
    definition: Apply done by the API server, which records which manager owns each field; stable since 1.22.
    see: kubectl-and-manifests
    source:
      title: Server-Side Apply (Kubernetes docs)
      url: https://kubernetes.io/docs/reference/using-api/server-side-apply/
      verifiedOn: 2026-10-20
  - id: namespace-term
    term: Namespace (Kubernetes)
    aka:
      - Kubernetes namespace
    definition: A scope inside a cluster where object names must be unique; quotas and many policies are set per namespace.
    see: namespaces-labels-selectors
    source:
      title: Namespaces (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
      verifiedOn: 2026-10-20
  - id: cluster-scoped-resource
    term: Cluster-scoped resource
    aka:
      - cluster-scoped
    definition: An object that belongs to no namespace, such as a Node, PersistentVolume or Namespace.
    see: namespaces-labels-selectors
    source:
      title: Namespaces (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
      verifiedOn: 2026-10-20
  - id: label-term
    term: Label (Kubernetes)
    aka:
      - Kubernetes label
    definition: A key-value pair on an object, used to organise and select objects.
    see: namespaces-labels-selectors
    source:
      title: Labels and Selectors (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
      verifiedOn: 2026-10-20
  - id: label-selector
    term: Label selector
    aka: []
    definition: A query on labels that picks a set of objects; Services and Deployments use one.
    see: namespaces-labels-selectors
    source:
      title: Labels and Selectors (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
      verifiedOn: 2026-10-20
  - id: annotation-term
    term: Annotation (Kubernetes)
    aka:
      - Kubernetes annotation
    definition: A key-value pair for non-identifying data read by tools; it cannot be used to select objects.
    see: namespaces-labels-selectors
    source:
      title: Annotations (Kubernetes docs)
      url: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
      verifiedOn: 2026-10-20
  - id: pod-term
    term: Pod
    aka: []
    definition: "The smallest unit Kubernetes runs: one or more containers sharing network and storage, always on one node."
    see: pods
    source:
      title: Pods (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/pods/
      verifiedOn: 2026-10-20
  - id: pause-container
    term: Pause container
    aka:
      - infrastructure container
    definition: A tiny container some runtimes start first in each Pod to keep the Pod's namespaces alive.
    see: pods
    source:
      title: "Windows nodes in Kubernetes: pause container (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/windows/intro/
      verifiedOn: 2026-10-20
  - id: container-port
    term: containerPort
    aka: []
    definition: A port listed in the container spec for information; leaving it out does not block the port.
    see: pods
    source:
      title: "Pod v1 API: Container ports (Kubernetes 1.37 reference)"
      url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
      verifiedOn: 2026-10-20
  - id: image-pull-policy
    term: imagePullPolicy
    aka: []
    definition: "When the kubelet pulls a container's image: IfNotPresent, Always or Never."
    see: pods
    source:
      title: "Images: image pull policy (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/containers/images/
      verifiedOn: 2026-10-20
  - id: init-container
    term: Init container
    aka:
      - initContainers
    definition: A container that runs to completion, one after another, before the Pod's app containers start.
    see: multi-container-pods
    source:
      title: Init Containers (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
      verifiedOn: 2026-10-20
  - id: native-sidecar
    term: Sidecar container
    aka:
      - native sidecar
      - sidecar
    definition: A helper container that starts before the app and runs beside it; natively, an init container with restartPolicy Always.
    see: multi-container-pods
    source:
      title: Sidecar Containers (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
      verifiedOn: 2026-10-20
  - id: ambassador-pattern
    term: Ambassador pattern
    aka:
      - ambassador container
    definition: A helper container that proxies the app's connections to an outside service.
    see: multi-container-pods
    source:
      title: "The Distributed System ToolKit: Patterns for Composite Containers (Kubernetes blog, 2015)"
      url: https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/
      verifiedOn: 2026-10-20
  - id: adapter-pattern
    term: Adapter pattern
    aka:
      - adapter container
    definition: A helper container that converts the app's output, such as metrics, into a standard format.
    see: multi-container-pods
    source:
      title: "The Distributed System ToolKit: Patterns for Composite Containers (Kubernetes blog, 2015)"
      url: https://kubernetes.io/blog/2015/06/the-distributed-system-toolkit-patterns/
      verifiedOn: 2026-10-20
  - id: service-mesh
    term: Service mesh
    aka: []
    definition: A layer of proxies, often sidecars, that handles traffic, security and observability between services, as in Istio or Linkerd.
    see: multi-container-pods
    source:
      title: "Kubernetes Multicontainer Pods: An Overview (Kubernetes blog, 22-04-2025)"
      url: https://kubernetes.io/blog/2025/04/22/multi-container-pods-overview/
      verifiedOn: 2026-10-20
  - id: pod-phase
    term: Pod phase
    aka: []
    definition: "A Pod's high-level status: Pending, Running, Succeeded, Failed or Unknown."
    see: pod-lifecycle
    source:
      title: "Pod Lifecycle: Pod phase (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
      verifiedOn: 2026-10-20
  - id: container-state
    term: Container state
    aka: []
    definition: "The state of one container in a Pod: Waiting, Running or Terminated."
    see: pod-lifecycle
    source:
      title: "Pod Lifecycle: container states (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
      verifiedOn: 2026-10-20
  - id: restart-policy
    term: restartPolicy
    aka: []
    definition: "Pod setting for restarting exited containers: Always (default), OnFailure or Never."
    see: pod-lifecycle
    source:
      title: "Pod Lifecycle: container restart policy (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
      verifiedOn: 2026-10-20
  - id: restart-backoff
    term: Back-off (container restart)
    aka:
      - back-off delay
      - exponential back-off
    definition: "The growing wait between restarts of a crashing container: 10 s, 20 s, 40 s, up to 5 minutes."
    see: pod-lifecycle
    source:
      title: "Pod Lifecycle: container restarts (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
      verifiedOn: 2026-10-20
  - id: prestop-hook
    term: preStop hook
    aka:
      - preStop
    definition: A handler the kubelet runs in a container just before it sends SIGTERM to stop it.
    see: pod-lifecycle
    source:
      title: Container Lifecycle Hooks (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
      verifiedOn: 2026-10-20
  - id: sigterm
    term: SIGTERM
    aka: []
    definition: The polite stop signal sent to a container's main process; the app should finish work and exit.
    see: pod-lifecycle
    source:
      title: "Pod Lifecycle: termination of Pods (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
      verifiedOn: 2026-10-20
  - id: sigkill
    term: SIGKILL
    aka: []
    definition: The forced stop signal sent to processes still running when the grace period ends; it cannot be handled.
    see: pod-lifecycle
    source:
      title: signal(7) (Linux manual pages)
      url: https://man7.org/linux/man-pages/man7/signal.7.html
      verifiedOn: 2026-10-20
  - id: termination-grace-period
    term: terminationGracePeriodSeconds
    aka:
      - grace period
    definition: Seconds a Pod gets to stop after deletion before SIGKILL; 30 by default.
    see: pod-lifecycle
    source:
      title: "Pod v1 API: terminationGracePeriodSeconds (Kubernetes 1.37 reference)"
      url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
      verifiedOn: 2026-10-20
  - id: graceful-shutdown-term
    term: Graceful shutdown
    aka: []
    definition: Stopping new work, finishing in-flight requests, then exiting; Spring Boot's web server does it by default.
    see: pod-lifecycle
    source:
      title: Graceful Shutdown (Spring Boot 4.1 reference)
      url: https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html
      verifiedOn: 2026-10-20
  - id: workload-resource
    term: Workload resource
    aka: []
    definition: An object, like a Deployment or Job, whose controller creates and manages Pods for you.
    see: deployments-and-replicasets
    source:
      title: Workloads (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/
      verifiedOn: 2026-10-20
  - id: deployment-term
    term: Deployment (Kubernetes)
    aka:
      - Kubernetes Deployment
    definition: A workload resource that manages ReplicaSets to run stateless Pods with rolling updates and rollbacks.
    see: deployments-and-replicasets
    source:
      title: Deployments (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
      verifiedOn: 2026-10-20
  - id: replicaset
    term: ReplicaSet
    aka: []
    definition: A controller object that keeps a set number of identical Pods running.
    see: deployments-and-replicasets
    source:
      title: ReplicaSet (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
      verifiedOn: 2026-10-20
  - id: pod-template
    term: Pod template
    aka:
      - PodTemplate
    definition: The Pod spec inside a workload resource that its controller copies to create Pods.
    see: deployments-and-replicasets
    source:
      title: "Pods: Pod templates (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/pods/
      verifiedOn: 2026-10-20
  - id: statefulset
    term: StatefulSet
    aka: []
    definition: A workload resource for Pods that need stable names, their own storage and ordered start and stop.
    see: statefulsets
    source:
      title: StatefulSets (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
      verifiedOn: 2026-10-20
  - id: stable-network-identity
    term: Stable network identity
    aka: []
    definition: A StatefulSet Pod's fixed hostname and DNS name, kept when the Pod is replaced.
    see: statefulsets
    source:
      title: "StatefulSets: stable network ID (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
      verifiedOn: 2026-10-20
  - id: pod-ordinal
    term: Ordinal (StatefulSet)
    aka:
      - ordinal index
    definition: A StatefulSet Pod's unique number, 0 to N-1 by default, used in its name.
    see: statefulsets
    source:
      title: "StatefulSets: ordinal index (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
      verifiedOn: 2026-10-20
  - id: volume-claim-templates
    term: volumeClaimTemplates
    aka: []
    definition: StatefulSet field that creates one PersistentVolumeClaim for each Pod.
    see: statefulsets
    source:
      title: "StatefulSets: stable storage (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
      verifiedOn: 2026-10-20
  - id: pod-management-policy
    term: podManagementPolicy
    aka: []
    definition: "StatefulSet setting: OrderedReady (default) starts Pods one by one; Parallel starts them all together."
    see: statefulsets
    source:
      title: "StatefulSets: Pod management policies (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
      verifiedOn: 2026-10-20
  - id: daemonset
    term: DaemonSet
    aka: []
    definition: A workload resource that runs one copy of a Pod on every node, or every matching node.
    see: daemonsets
    source:
      title: DaemonSet (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
      verifiedOn: 2026-10-20
  - id: job-term
    term: Job (Kubernetes)
    aka:
      - Kubernetes Job
    definition: A workload resource that runs Pods until a set number finish successfully, retrying failures.
    see: jobs-and-cronjobs
    source:
      title: Jobs (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
      verifiedOn: 2026-10-20
  - id: cronjob
    term: CronJob
    aka: []
    definition: A workload resource that creates a Job on a repeating cron schedule.
    see: jobs-and-cronjobs
    source:
      title: CronJob (Kubernetes 1.37 docs)
      url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
      verifiedOn: 2026-10-20
  - id: backoff-limit
    term: backoffLimit
    aka: []
    definition: Retries a Job allows before it is marked Failed; 6 by default.
    see: jobs-and-cronjobs
    source:
      title: "Jobs: Pod backoff failure policy (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
      verifiedOn: 2026-10-20
  - id: concurrency-policy
    term: concurrencyPolicy
    aka: []
    definition: "CronJob setting for overlapping runs: Allow (default), Forbid or Replace."
    see: jobs-and-cronjobs
    source:
      title: "CronJob: concurrency policy (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
      verifiedOn: 2026-10-20
  - id: ttl-after-finished
    term: ttlSecondsAfterFinished
    aka: []
    definition: Job field that deletes the finished Job, with its Pods, after that many seconds.
    see: jobs-and-cronjobs
    source:
      title: "Jobs: TTL mechanism for finished Jobs (Kubernetes 1.37 docs)"
      url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
      verifiedOn: 2026-10-20
  - id: service-k8s-term
    term: Service (Kubernetes)
    aka:
      - Kubernetes Service
    definition: An object that gives a set of Pods, chosen by labels, one stable virtual IP and DNS name.
    see: services
    source:
      title: Service (Kubernetes 1.37 documentation)
      url: https://kubernetes.io/docs/concepts/services-networking/service/
      verifiedOn: 2026-10-20
  - id: clusterip-term
    term: ClusterIP
    definition: "The default Service type: a virtual IP reachable only from inside the cluster."
    see: services
    source:
      title: Service (Kubernetes 1.37 documentation)
      url: https://kubernetes.io/docs/concepts/services-networking/service/
      verifiedOn: 2026-10-20
  - id: nodeport-term
    term: NodePort
    definition: A Service type that opens one port (the nodePort, default range 30000-32767) on every node.
    see: services
    source:
      title: Service (Kubernetes 1.37 documentation)
      url: https://kubernetes.io/docs/concepts/services-networking/service/
      verifiedOn: 2026-10-20
  - id: loadbalancer-service-term
    term: LoadBalancer Service
    aka:
      - "type: LoadBalancer"
      - LoadBalancer Services
    definition: A Service type that asks the cloud provider for an external load balancer in front of the node ports.
    see: services
    source:
      title: Service (Kubernetes 1.37 documentation)
      url: https://kubernetes.io/docs/concepts/services-networking/service/
      verifiedOn: 2026-10-20
  - id: externalname-term
    term: ExternalName
    definition: A Service type that returns a DNS CNAME to an outside host name, with no proxying.
    see: services
    source:
      title: Service (Kubernetes 1.37 documentation)
      url: https://kubernetes.io/docs/concepts/services-networking/service/
      verifiedOn: 2026-10-20
  - id: headless-service-term
    term: Headless Service
    aka:
      - headless Services
    definition: "A Service with clusterIP: None; no virtual IP, and DNS returns the Pod IPs."
