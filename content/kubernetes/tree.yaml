    url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
    verifiedOn: 2026-10-20
topics:
  basics:
    - id: what-is-kubernetes
      children:
        - id: desired-state-spec
          label: Desired state (spec)
          term: desired-state
          note: What you ask for; you set it when you create the object
        - id: actual-state-status
          label: Actual state (status)
          note: What really runs; Kubernetes components write it
        - id: control-loop
          label: Control loop
          term: reconciliation-loop
          note: Watch, compare, act; the docs compare it to a thermostat
        - id: self-healing-node
          label: Self-healing
          term: self-healing
          note: Restarts failed containers; replaces lost Pods of a workload
    - id: kubernetes-and-docker
      children:
        - id: docker-engine
          label: Docker
          note: Builds images and runs containers on one host
        - id: docker-compose-node
          label: Docker Compose
          term: docker-compose
          note: One YAML file runs a multi-container app on one host
        - id: cri-api
          label: CRI
          term: cri
          note: gRPC API between the kubelet and the runtime; stable since 1.23
          children:
            - id: containerd-runtime
              label: containerd
              term: containerd
              note: CNCF graduated runtime; also the runtime inside Docker
            - id: cri-o-runtime
              label: CRI-O
              term: cri-o
              note: A lightweight runtime built only for Kubernetes
        - id: dockershim-removed
          label: dockershim
          term: dockershim
          note: Removed in 1.24; Docker Engine now needs the cri-dockerd adapter
    - id: kubernetes-architecture
      children:
        - id: control-plane
          label: Control plane
          note: Makes global decisions and reacts to cluster events
          children:
            - id: kube-apiserver
              label: kube-apiserver
              note: Front end of the control plane; scales by adding instances
            - id: etcd
              label: etcd
              note: Consistent key-value store for all cluster data; back it up
            - id: kube-scheduler
              label: kube-scheduler
              note: Finds a node for each unscheduled Pod, then binds it
            - id: kube-controller-manager
              label: kube-controller-manager
              note: "One binary running many controllers: Node, Job, EndpointSlice"
            - id: cloud-controller-manager
              label: cloud-controller-manager
              note: "Optional: nodes, routes, load balancers via the cloud API"
        - id: worker-node
          label: Worker node
          note: Runs the Pods; a cluster needs at least one
          children:
            - id: kubelet
              label: kubelet
              note: Agent on each node; keeps its Pods' containers running
            - id: kube-proxy
              label: kube-proxy
              note: "Optional: node rules for Services; some network plugins replace it"
            - id: node-container-runtime
              label: Container runtime
              term: container-runtime
              note: Runs containers; containerd, CRI-O or any CRI runtime
        - id: cluster-add-ons
          label: Add-ons
          note: Cluster DNS, dashboard, monitoring, logging; run in kube-system
    - id: kubectl-and-manifests
      children:
        - id: manifest-anatomy
          label: Manifest
          term: manifest
          note: "Required: apiVersion, kind, metadata and spec"
        - id: object-management
          label: Three ways to manage objects
          note: Use one per object; mixing them gives undefined behaviour
          children:
            - id: declarative-apply
              label: kubectl apply (declarative)
              note: Files or folders; kubectl works out create or patch per object
            - id: imperative-create
              label: kubectl create (imperative)
              note: "One action now: create -f file, or create deployment --image"
            - id: kubectl-replace
              label: kubectl replace
              note: Overwrites the live object; fields missing from the file are lost
        - id: server-side-apply-node
          label: Server-side apply
          term: server-side-apply
          note: Apply runs in the API server and tracks field owners
        - id: dry-run-node
          label: --dry-run
          note: "client: only prints; server: full checks, nothing saved"
        - id: kubeconfig-file
          label: kubeconfig
          term: kubeconfig
          note: Clusters, users and contexts; default file $HOME/.kube/config
    - id: namespaces-labels-selectors
      children:
        - id: initial-namespaces
          label: Initial namespaces
          note: Four exist at start; the kube- prefix is reserved
          children:
            - id: default-namespace
              label: default
              note: Lets you start without creating a namespace
            - id: kube-system-namespace
              label: kube-system
              note: Objects created by the Kubernetes system, such as add-ons
            - id: kube-public-namespace
              label: kube-public
              note: Readable by all clients, even unauthenticated ones
            - id: kube-node-lease-namespace
              label: kube-node-lease
              note: "Node Lease objects: kubelet heartbeats"
        - id: cluster-scoped-objects
          label: Cluster-scoped objects
          term: cluster-scoped-resource
          note: Nodes, PersistentVolumes, StorageClasses, Namespaces
        - id: k8s-labels
          label: Labels
          term: label-term
          note: Identifying key-value tags; a value is at most 63 characters
        - id: label-selectors
          label: Label selectors
          term: label-selector
          note: Comma means AND; there is no OR operator
          children:
            - id: equality-selector
              label: Equality-based
              note: =, == and !=, as in env=prod,tier!=web
            - id: set-based-selector
              label: Set-based
              note: in, notin and exists; matchExpressions in Deployments and Jobs
        - id: k8s-annotations
          label: Annotations
          term: annotation-term
          note: Non-identifying data for tools; at most 256 KiB per object
  workloads:
    - id: pods
      children:
        - id: app-container
          label: App container
          note: Runs the app process; its own files vanish when it restarts
        - id: pod-shared-network
          label: Shared network (localhost)
          note: One IP per Pod; containers must not clash on ports
        - id: pod-shared-volumes
          label: Shared volumes
          note: Any container in the Pod can mount them; they outlive restarts
        - id: pause-container
          label: Pause container
          note: Hidden helper some runtimes add; cleaned up last on shutdown
        - id: image-pull-policy
          label: imagePullPolicy
          note: IfNotPresent, Always or Never; avoid :latest in production
        - id: static-pod
          label: Static Pod
          note: Run directly by one kubelet; mainly used for control-plane parts
    - id: multi-container-pods
      children:
        - id: init-container
          label: Init container
          note: Has no probes; can hold tools or Secrets the app should not see
        - id: native-sidecar
          label: Native sidecar
          note: Stable since 1.33; first available in 1.28
        - id: ambassador-pattern
          label: Ambassador
          note: "Example: a local proxy that splits reads and writes to Redis"
        - id: adapter-pattern
          label: Adapter
          note: "Example: turns JMX or StatsD metrics into one monitoring format"
    - id: pod-lifecycle
      children:
        - id: pod-phase
          label: Pod phase
          note: A summary, not a state machine; CrashLoopBackOff is not a phase
        - id: container-state
          label: Container state
          note: kubectl describe pod shows it for each container
        - id: restart-policy
          label: restartPolicy
          note: Restarts happen in place, on the same node
        - id: restart-backoff
          label: Restart back-off
          note: Shown as CrashLoopBackOff while the delay is in effect
        - id: prestop-hook
          label: preStop hook
          note: Exec, HTTP or sleep; must finish before SIGTERM is sent
        - id: termination-grace-period
          label: terminationGracePeriodSeconds
          note: 0 means kill at once; kubectl delete --grace-period overrides
    - id: deployments-and-replicasets
      children:
        - id: deployment-object
          label: Deployment
          note: Desired state for stateless Pods; changes it at a controlled rate
          children:
            - id: pod-template
              label: Pod template
              note: Only a change here starts a rollout and a new revision
            - id: deployment-selector
              label: Label selector
              note: Immutable in apps/v1; to change it, recreate the Deployment
        - id: replicaset
          label: ReplicaSet
          note: Named deployment-name plus a hash, such as payment-service-75675f5897
          children:
            - id: pod-template-hash
              label: pod-template-hash label
              note: Added by the Deployment so its ReplicaSets never overlap
        - id: replication-controller
          label: ReplicationController
          note: Legacy object, replaced by Deployment and ReplicaSet
    - id: statefulsets
      children:
        - id: pod-ordinal
          label: Ordinal
          note: Also set as the apps.kubernetes.io/pod-index label
        - id: stable-network-identity
          label: Stable network identity
          note: "Hostname is set name plus ordinal: payments-db-0"
        - id: volume-claim-templates
          label: volumeClaimTemplates
          note: "PVC name is template-set-ordinal: data-payments-db-0"
        - id: pod-management-policy
          label: podManagementPolicy
          note: OrderedReady waits for each Pod; Parallel does not
        - id: sts-update-strategy
          label: Update strategy
          note: RollingUpdate goes highest ordinal first; OnDelete waits for you
    - id: daemonsets
      children:
        - id: ds-log-collector
          label: Log collector
          note: Reads each node's /var/log through a hostPath volume
        - id: ds-node-monitoring
          label: Node monitoring agent
          note: One per node to report that node's health and metrics
        - id: ds-network-storage-agent
          label: Network and storage agents
          note: kubeadm deploys kube-proxy as a DaemonSet
        - id: ds-auto-tolerations
          label: Automatic tolerations
          note: Added so Pods run on not-ready or unschedulable nodes
    - id: jobs-and-cronjobs
      children:
        - id: non-parallel-job
          label: Non-parallel Job
          note: One Pod; done when it succeeds
        - id: fixed-completion-job
          label: Fixed completion count
          note: Done after N successes; Indexed mode gives each Pod an index
        - id: work-queue-job
          label: Work queue Job
          note: Set parallelism only; Pods pull tasks from a queue
        - id: cronjob
          label: CronJob
          note: "Schedule in cron syntax: minute, hour, day, month, weekday"
          children:
            - id: concurrency-policy
              label: concurrencyPolicy
              note: Applies only to Jobs made by the same CronJob
            - id: starting-deadline
              label: startingDeadlineSeconds
              note: A run that cannot start within this time is skipped
        - id: ttl-after-finished
          label: ttlSecondsAfterFinished
          note: 0 deletes right after finishing; unset means no TTL clean-up
  networking:
    - id: services
      children:
        - id: clusterip-service
          label: ClusterIP
          note: "Default type: a virtual IP reachable only inside the cluster"
        - id: nodeport-service
          label: NodePort
          note: Opens one port (default range 30000-32767) on every node
        - id: loadbalancer-service
          label: LoadBalancer
          note: A cloud load balancer that forwards to the node ports
        - id: externalname-service
          label: ExternalName
          note: DNS CNAME to an outside host name; no proxying at all
        - id: headless-service
          label: Headless Service
          note: "clusterIP: None; no virtual IP, no load balancing by kube-proxy"
        - id: endpointslice-object
          label: EndpointSlice
          note: Lists a Service's Pod IPs, ports and ready state
          children:
            - id: endpointslice-size
              label: Up to 100 endpoints per slice
              note: Default; a new slice is added when all are full
            - id: endpoints-legacy
              label: Endpoints (legacy)
              note: Deprecated since 1.33; one object, capped at 1000 endpoints
    - id: ingress-and-gateway-api
      children:
        - id: ingress-resource
          label: Ingress
          note: HTTP(S) host and path rules to Services; GA, frozen
          children:
            - id: ingress-controller-node
              label: Ingress controller
              note: Reads Ingress rules and runs the proxy; not built in
            - id: ingressclass-node
              label: IngressClass
              note: Says which controller handles an Ingress; one can be default
            - id: ingress-path-types
              label: "pathType: Prefix, Exact"
              note: Required on each path; Exact wins over Prefix on a tie
            - id: ingress-nginx-retired
              label: Ingress NGINX (retired)
              note: Community controller; no releases or fixes after March 2026
        - id: gateway-api
          label: Gateway API
          note: Add-on CRDs for ingress and mesh routing; v1.6 current
          children:
            - id: gatewayclass-node
              label: GatewayClass
              note: Names the controller; set up by the infrastructure provider
            - id: gateway-node
              label: Gateway
              note: Listeners (port, protocol, host), such as a cloud load balancer
            - id: httproute-node
              label: HTTPRoute
              note: Matches host, path, headers; sends to Services by weight
            - id: other-routes
              label: GRPCRoute, TCPRoute, UDPRoute
              note: GRPCRoute stable; TCPRoute and UDPRoute GA in v1.6
        - id: tls-termination-node
          label: TLS termination
          note: HTTPS is decrypted at the entry point; cert and key in a Secret
    - id: cluster-networking-dns
      children:
        - id: pod-ip-node
          label: Pod IP
          note: One cluster-wide IP per Pod; Pods reach each other without NAT
        - id: cni-plugin
          label: CNI plugin
          note: "Builds the Pod network: for example Calico, Cilium, Flannel"
        - id: kube-proxy-modes
          label: kube-proxy modes
          note: How Service IPs are turned into Pod IPs on each node
          children:
            - id: iptables-mode-node
              label: iptables
              note: Default on Linux in Kubernetes 1.37
            - id: nftables-mode-node
              label: nftables
              note: Stable since 1.33; faster updates; the planned future default
            - id: ipvs-mode-node
              label: IPVS
              note: Deprecated since 1.35
        - id: coredns-node
          label: CoreDNS
          note: The default cluster DNS; its Service is still named kube-dns
          children:
            - id: service-a-record
              label: Service A record
              note: svc.ns.svc.cluster.local resolves to the ClusterIP
            - id: dns-search-list
              label: Search list
              note: Short names resolve in the Pod's own namespace
        - id: service-mesh
          label: Service mesh
          note: L7 routing and TLS between Services; Gateway API covers mesh too
    - id: network-policies
      children:
        - id: default-deny-policy
          label: Default deny
          note: "podSelector: {} and no rules: isolates all Pods for its policyTypes"
        - id: policy-types-node
          label: policyTypes
          note: "Ingress, Egress or both: the directions the policy isolates"
        - id: podselector-peer
          label: podSelector (peer)
          note: Allows Pods with these labels in the policy's namespace
        - id: namespaceselector-peer
          label: namespaceSelector (peer)
          note: Allows all Pods in namespaces with these labels
        - id: ipblock-peer
          label: ipBlock (peer)
          note: Allows CIDR ranges, usually for traffic outside the cluster
  config-storage:
    - id: configmaps-and-secrets
      children:
        - id: configmap
          label: ConfigMap
          note: Non-confidential key-value config, at most 1 MiB
        - id: secret-kubernetes
          label: Secret
          note: Small confidential data; Pods read it as env vars or files
          children:
            - id: opaque-secret
              label: Opaque
              note: "Default type: any user-defined keys"
            - id: tls-secret
              label: kubernetes.io/tls
              note: Holds tls.crt and tls.key for a certificate
            - id: image-pull-secret
              label: kubernetes.io/dockerconfigjson
              note: Registry login the kubelet uses to pull private images
        - id: encryption-at-rest
          label: Encryption at rest
          note: Off by default; enable in API server config, ideally with KMS v2
        - id: external-secret-tools
          label: External secret tools
          note: Keep the real values outside the cluster or encrypted in Git
          children:
            - id: external-secrets-operator
              label: External Secrets Operator
              note: Syncs values from stores like AWS Secrets Manager into Secrets
            - id: sealed-secrets
              label: Sealed Secrets
              note: Encrypted SealedSecret is safe in Git; only the controller decrypts
            - id: secrets-store-csi-driver
              label: Secrets Store CSI Driver
              note: Mounts secrets from an external store into Pods as a volume
    - id: volumes
      children:
        - id: emptydir
          label: emptyDir
          note: Starts empty; deleted when the Pod leaves the node
          children:
            - id: emptydir-memory
              label: "medium: Memory"
              note: RAM-backed tmpfs; files count against the memory limit
        - id: hostpath
          label: hostPath
          note: Mounts a path from the node; many security risks
        - id: configmap-secret-volume
          label: configMap and secret volumes
          note: Each key becomes a file; secret volumes use tmpfs
        - id: projected-volume
          label: projected
          note: Puts secret, configMap, downwardAPI and token in one folder
        - id: downward-api
          label: downwardAPI
          note: Gives the app its Pod name, namespace and labels
        - id: csi-ephemeral-volume
          label: CSI ephemeral volume
          note: Pod-lifetime volume from a CSI driver; stable since 1.25
    - id: persistent-storage
      children:
        - id: persistent-volume
          label: PersistentVolume (PV)
          note: A cluster-wide piece of storage, made statically or dynamically
        - id: persistent-volume-claim
          label: PersistentVolumeClaim (PVC)
          note: A namespaced request for size and access mode
        - id: storage-class
          label: StorageClass
          note: Names a provisioner and parameters for dynamic PVs
          children:
            - id: default-storage-class
              label: Default StorageClass
              note: Used by a PVC that sets no storageClassName
            - id: wait-for-first-consumer
              label: WaitForFirstConsumer
              note: Binds or provisions only once a Pod uses the claim
        - id: access-modes
          label: Access modes
          note: Match claims to volumes; one mode at a time per mount
          children:
            - id: read-write-once
              label: ReadWriteOnce (RWO)
              note: Read-write from a single node; its Pods may share it
            - id: read-only-many
              label: ReadOnlyMany (ROX)
              note: Read-only from many nodes
            - id: read-write-many
              label: ReadWriteMany (RWX)
              note: Read-write from many nodes, for example NFS
            - id: read-write-once-pod
              label: ReadWriteOncePod (RWOP)
              note: Read-write from one Pod only; CSI; stable since 1.29
        - id: reclaim-policy
          label: Reclaim policy
          note: What happens to the PV after its claim is deleted
          children:
            - id: reclaim-delete
              label: Delete
              note: Removes the PV and its backing storage
            - id: reclaim-retain
              label: Retain
              note: Keeps PV and data as Released; manual cleanup
            - id: reclaim-recycle
              label: Recycle
              note: Deprecated basic scrub; use dynamic provisioning
        - id: csi-driver
          label: CSI driver
          note: Standard plugin that exposes a storage system to Kubernetes
    - id: service-accounts
      children:
        - id: default-service-account
          label: default ServiceAccount
          note: Made in every namespace; replaced if deleted
        - id: projected-sa-token
          label: Projected token
          note: Short-lived token the kubelet mounts and rotates
        - id: legacy-sa-token-secret
          label: Token Secret (legacy)
          note: Never expires; not auto-created since 1.24
        - id: workload-identity
          label: Workload identity
          note: Maps a ServiceAccount to a cloud identity; no cloud keys in Pods
          children:
            - id: eks-pod-identity
              label: EKS Pod Identity
              note: "AWS: associate an IAM role with a ServiceAccount"
            - id: irsa
              label: IRSA (EKS)
              note: "AWS: IAM role for a ServiceAccount through an OIDC provider"
            - id: gke-workload-identity
              label: Workload Identity Federation for GKE
              note: "Google Cloud: IAM access for Kubernetes ServiceAccounts"
            - id: azure-workload-identity
              label: Microsoft Entra Workload ID
              note: "AKS: projected token federated with Entra ID over OIDC"
  health-resources:
    - id: probes
      children:
        - id: liveness-probe
          label: Liveness probe
          note: "Fails failureThreshold times in a row: the container is restarted"
        - id: readiness-probe
          label: Readiness probe
          note: "Failing: Pod IP leaves every matching Service's EndpointSlices"
        - id: startup-probe
          label: Startup probe
          note: Runs first; liveness and readiness wait until it succeeds
        - id: probe-check-mechanisms
          label: Check mechanisms
          note: Each probe defines exactly one of four checks
          children:
            - id: httpget-probe
              label: httpGet
              note: Passes on an HTTP status from 200 to 399
            - id: tcpsocket-probe
              label: tcpSocket
              note: Passes if the port accepts a TCP connection
            - id: exec-probe
              label: exec
              note: Passes if the command exits 0; forks processes every run
            - id: grpc-probe
              label: grpc
              note: Passes on SERVING from gRPC health checks; stable since 1.27
        - id: actuator-health-groups
          label: Actuator liveness and readiness groups
          note: /actuator/health/liveness and /readiness (Spring Boot 4.1)
    - id: resource-requests-limits
      children:
        - id: resource-request
          label: Request
          note: Reserved amount; the scheduler fits Pods by the sum of requests
        - id: resource-limit
          label: Limit
          note: "Kernel-enforced cap: CPU is throttled, memory is OOM-killed"
        - id: limitrange
          label: LimitRange
          note: Per-namespace defaults and min/max per container, Pod or PVC
        - id: resourcequota
          label: ResourceQuota
          note: Caps total requests, limits and object counts in a namespace
        - id: in-place-resize
          label: In-place Pod resize
          note: Change a running Pod's CPU and memory; stable since 1.35
    - id: qos-and-eviction
      children:
        - id: qos-class
          label: QoS classes
          note: Set from requests and limits; used to predict eviction order
          children:
            - id: qos-guaranteed
              label: Guaranteed
              note: Every container sets CPU and memory requests equal to limits
            - id: qos-burstable
              label: Burstable
              note: Not Guaranteed, but some CPU or memory request or limit set
            - id: qos-besteffort
              label: BestEffort
              note: No CPU or memory requests or limits in any container
        - id: node-pressure-eviction
          label: Node-pressure eviction
          note: kubelet fails Pods to reclaim memory or disk; ignores PDBs
        - id: api-initiated-eviction
          label: API-initiated eviction
          note: Eviction API, as kubectl drain uses; respects PDBs and grace period
        - id: priorityclass
          label: PriorityClass
          note: Name mapped to an integer; no class and no global default means 0
          children:
            - id: pod-preemption
              label: Preemption
              note: Scheduler evicts lower-priority Pods so a pending Pod fits
    - id: scheduling
      children:
        - id: node-selector
          label: nodeSelector
          note: Only nodes carrying every listed label
        - id: node-affinity
          label: Node affinity
          note: Required (hard) or preferred (soft, weighted) node-label rules
        - id: pod-affinity
          label: Pod affinity
          note: Place near Pods with matching labels in the same topology domain
        - id: pod-anti-affinity
          label: Pod anti-affinity
          note: Keep away from matching Pods, e.g. one replica per node
        - id: topology-spread
          label: Topology spread constraints
          note: maxSkew limits the Pod-count gap across zones or nodes
        - id: node-name-field
          label: nodeName
          note: Bypasses the scheduler; the named node's kubelet runs the Pod
    - id: taints-and-tolerations
      children:
        - id: node-taint
          label: Taint
          note: key=value:effect on a node; repels Pods without a toleration
          children:
            - id: noschedule-effect
              label: NoSchedule
              note: No new untolerating Pods; running Pods stay
            - id: prefernoschedule-effect
              label: PreferNoSchedule
              note: "Soft: the scheduler tries to avoid the node"
            - id: noexecute-effect
              label: NoExecute
              note: Also evicts running Pods that do not tolerate it
        - id: pod-toleration
          label: Toleration
          note: On the Pod; allows a matching tainted node, does not force it
          children:
            - id: toleration-seconds
              label: tolerationSeconds
              note: How long a Pod stays bound after a NoExecute taint appears
        - id: built-in-taints
          label: Built-in node taints
          note: not-ready, unreachable, memory-pressure, disk-pressure and more
        - id: control-plane-taint
          label: Control-plane taint
          note: node-role.kubernetes.io/control-plane:NoSchedule (kubeadm)
  scaling-releases:
    - id: autoscaling
      children:
        - id: horizontal-pod-autoscaler
          label: HorizontalPodAutoscaler (HPA)
          note: Built in; sets replicas from metrics, checked every 15 s by default
        - id: vertical-pod-autoscaler
          label: VerticalPodAutoscaler (VPA)
          note: Add-on; modes Off, Initial, Recreate (default), InPlaceOrRecreate
        - id: cluster-autoscaler
          label: Cluster Autoscaler
          note: Adds or removes nodes in pre-set node groups for pending Pods
        - id: karpenter
          label: Karpenter
          note: Launches fitting nodes from the requests of unscheduled Pods
        - id: keda
          label: KEDA
          note: Event-driven, such as queue length; can scale to zero; CNCF graduated
    - id: rolling-updates-rollbacks
      children:
        - id: rolling-update-strategy
          label: RollingUpdate (default)
          note: Replaces Pods in steps, within maxSurge and maxUnavailable
          children:
            - id: max-surge-field
              label: maxSurge
              note: Extra Pods allowed above replicas; 25% default, rounded up
            - id: max-unavailable-field
              label: maxUnavailable
              note: Pods allowed to be unavailable; 25% default, rounded down
        - id: recreate-strategy
          label: Recreate
          note: Kills all old Pods, waits, then creates the new ones
        - id: min-ready-seconds-field
          label: minReadySeconds
          note: How long a new Pod stays Ready before it counts; default 0
        - id: progress-deadline-field
          label: progressDeadlineSeconds
          note: "No progress for 600 s: ProgressDeadlineExceeded condition"
        - id: revision-history-limit-field
          label: revisionHistoryLimit
          note: Old ReplicaSets kept for rollback; default 10; 0 means no undo
        - id: change-cause-annotation
          label: change-cause annotation
          note: kubernetes.io/change-cause; replaces the deprecated --record flag
    - id: release-strategies
      children:
        - id: blue-green-deployment
          label: Blue-green
          note: Two full versions; one switch moves all traffic to the new one
        - id: canary-release
          label: Canary
          note: The new version gets a small share of live traffic first
          children:
            - id: canary-by-replicas
              label: Canary by replica ratio
              note: One Service over stable and canary Pods; 3:1 Pods is about 3:1 traffic
            - id: canary-by-weights
              label: Canary by route weights
              note: HTTPRoute backendRefs weights, such as 90 and 10
        - id: argo-rollouts
          label: Argo Rollouts
          note: "Rollout CRD: blue-green, canary steps, metric-driven rollback"
        - id: flagger
          label: Flagger
          note: Shifts traffic in steps, checks metrics, rolls back on failures
        - id: feature-flags
          label: Feature flags
          note: Turn a feature on or off without changing code
    - id: high-availability
      children:
        - id: pod-disruption-budget
          label: PodDisruptionBudget
          note: Set minAvailable or maxUnavailable, never both; % rounds up
        - id: kubectl-drain-node
          label: kubectl drain
          note: Evicts a node's Pods, honouring PDBs, before maintenance
        - id: kubectl-cordon-node
          label: kubectl cordon
          note: Marks a node unschedulable; Pods already there keep running
        - id: stacked-etcd
          label: Stacked etcd
          note: etcd on each control-plane node; kubeadm default; 3 nodes minimum
        - id: external-etcd
          label: External etcd
          note: "etcd on separate hosts: at least 3 control-plane + 3 etcd hosts"
        - id: managed-control-plane
          label: Managed control plane
          note: The cloud provider runs its scale and availability for you
    - id: gitops
      children:
        - id: push-based-cd
          label: Push-based CD
          note: The pipeline itself runs kubectl or helm against the cluster
        - id: pull-based-gitops
          label: Pull-based GitOps
          note: An agent, usually in-cluster, pulls desired state and keeps reconciling
        - id: argo-cd
          label: Argo CD
          note: GitOps controller; flags drift as OutOfSync; Argo is CNCF graduated
        - id: flux-cd
          label: Flux
          note: GitOps controllers for Git, Helm and Kustomize; CNCF graduated
  security-ops:
    - id: rbac
      children:
        - id: rbac-role-kind
          label: Role
          term: role-term
          note: Allows verbs on resources inside one namespace
        - id: rbac-clusterrole-kind
          label: ClusterRole
          term: clusterrole
          note: No namespace; can also cover nodes and URLs like /healthz
        - id: rbac-rolebinding-kind
          label: RoleBinding
          term: rolebinding
          note: Grants a Role or ClusterRole inside one namespace
        - id: rbac-clusterrolebinding-kind
          label: ClusterRoleBinding
          term: clusterrolebinding
          note: Grants a ClusterRole in every namespace
        - id: rbac-subjects
          label: Subjects
          note: User, Group or ServiceAccount; Kubernetes stores no User objects
        - id: rbac-default-roles
          label: Default user-facing roles
          note: Built-in ClusterRoles you bind per namespace or cluster-wide
          children:
            - id: cluster-admin-role
              label: cluster-admin
              note: Any action on any resource
            - id: admin-role
              label: admin
              note: Read/write in a namespace, including Roles and RoleBindings
            - id: edit-role
              label: edit
              note: Read/write most objects, no Roles; can read Secrets
            - id: view-role
              label: view
              note: Read-only; cannot see Secrets, Roles or RoleBindings
    - id: pod-security
      children:
        - id: security-context-node
          label: securityContext
          term: security-context
          note: Set on the Pod or a container; container values win
        - id: pss-levels
          label: Pod Security Standards
          term: pod-security-standards
          note: Three cumulative levels, from open to hardened
          children:
            - id: pss-privileged
              label: Privileged
              note: No limits; for trusted system and infrastructure Pods
            - id: pss-baseline
              label: Baseline
              note: Blocks privileged mode, hostNetwork, hostPID and hostPath
            - id: pss-restricted
              label: Restricted
              note: Adds non-root, no escalation, drop ALL, seccomp set
        - id: psa-node
          label: Pod Security Admission
          term: pod-security-admission
          note: The PodSecurity admission plugin, enabled by default
        - id: policy-engines
          label: Policy engines
          note: For custom rules beyond the three levels
          children:
            - id: vap-node
              label: ValidatingAdmissionPolicy
              term: validating-admission-policy
              note: Built in; rules in CEL; stable since 1.30
            - id: kyverno-node
              label: Kyverno
              term: kyverno
              note: Policies in YAML or CEL; validate, mutate, generate, verify images
            - id: gatekeeper-node
              label: OPA Gatekeeper
              term: opa-gatekeeper
              note: Webhook enforcing OPA policies from ConstraintTemplates
    - id: helm-and-kustomize
      children:
        - id: helm-tool
          label: Helm
          term: helm
          note: "Package manager: install, upgrade and roll back charts"
          children:
            - id: helm-chart-node
              label: Chart
              term: helm-chart
              note: Chart.yaml, templates/ and values.yaml in one package
            - id: helm-release-node
              label: Release and revision
              term: helm-release
              note: One installed copy of a chart; each change adds a revision
        - id: kustomize-tool
          label: Kustomize
          term: kustomize
          note: Customises YAML through a kustomization file; in kubectl since 1.14
          children:
            - id: kustomize-base-node
              label: Base
              note: Shared resources; a base knows nothing of its overlays
            - id: kustomize-overlay-node
              label: Overlay
              term: kustomize-overlay
              note: Refers to bases and patches them for one environment
    - id: crds-and-operators
      children:
        - id: crd-node
          label: CustomResourceDefinition (CRD)
          term: custom-resource-definition
          note: Defines a new kind; the API server stores and serves it
          children:
            - id: custom-resource-node
              label: Custom resource
              term: custom-resource
              note: One object of the new kind, e.g. a CloudNativePG Cluster
        - id: k8s-operator-node
          label: Operator
          term: operator-term
          note: CRDs plus a controller that encodes how to run one app
          children:
            - id: custom-controller-node
              label: Custom controller
              note: Watches the custom resources and makes reality match
            - id: prometheus-operator-node
              label: Prometheus Operator
              note: CRDs such as Prometheus, ServiceMonitor and PrometheusRule
            - id: cloudnativepg-node
              label: CloudNativePG
              note: Runs PostgreSQL clusters from a Cluster resource
        - id: admission-webhooks-node
          label: Admission webhooks
          term: admission-webhook
          note: Mutating ones run first; validating ones can reject
    - id: observability-in-k8s
      children:
        - id: container-logs-node
          label: Container logs
          note: Kubernetes has no built-in storage for log data
          children:
            - id: node-log-agent-node
              label: Node logging agent
              term: log-agent
              note: One per node, run as a DaemonSet; sends logs to a backend
        - id: k8s-events-node
          label: Events
          term: kubernetes-event
          note: API objects of type Normal or Warning
        - id: metrics-server-node
          label: metrics-server
          term: metrics-server
          note: Serves metrics.k8s.io, stable since Kubernetes 1.37
        - id: kube-state-metrics-node
          label: kube-state-metrics
          term: kube-state-metrics
          note: Watches the API server; turns object state into metrics
        - id: prometheus-node
          label: Prometheus
          term: prometheus
          note: Pulls metrics over HTTP, stores time series; PromQL and alerts
          children:
            - id: grafana-node
              label: Grafana
              term: grafana
              note: Queries and visualises metrics, logs and traces
        - id: opentelemetry-node
          label: OpenTelemetry
          note: Generates and exports traces, metrics and logs; not a backend
  troubleshooting:
    - id: pod-errors
      children:
        - id: error-stage-scheduling
          label: "Scheduling: Pending"
          term: pending-pod
          note: No feasible node yet; FailedScheduling events give the reason
        - id: error-stage-image
          label: "Image pull: ErrImagePull, ImagePullBackOff"
          term: imagepullbackoff
          note: Wrong name or tag, or a private registry without a pull secret
        - id: error-stage-config
          label: "Config: CreateContainerConfigError"
          term: createcontainerconfigerror
          note: Env var refers to a missing ConfigMap or Secret key
        - id: error-stage-run
          label: "Run: CrashLoopBackOff"
          term: crashloopbackoff
          note: The container keeps exiting; restarts wait longer each time
        - id: error-stage-removal
          label: "Removal: Evicted, stuck Terminating"
          note: Kubelet frees a starved node, or a finalizer blocks deletion
        - id: container-exit-codes
          label: Exit codes
          term: exit-code
          note: A process killed by signal N reports exit code 128 + N
          children:
            - id: exit-code-1
              label: Exit code 1
              note: The app itself failed; read logs --previous
            - id: exit-code-137
              label: Exit code 137
              note: 128 + 9, SIGKILL; reason OOMKilled when over the memory limit
            - id: exit-code-143
              label: Exit code 143
              note: 128 + 15, SIGTERM; the container was asked to stop
    - id: kubectl-debugging
      children:
        - id: debug-describe
          label: kubectl describe
          term: kubectl-describe
          note: Container state, restart count, conditions and recent events
        - id: debug-events-sorted
          label: Events by time
          note: Sort with --sort-by=.metadata.creationTimestamp
        - id: debug-previous-logs
          label: logs --previous
          term: kubectl-logs-previous
          note: Logs from the last crashed run of the container
        - id: debug-exec
          label: kubectl exec
          term: kubectl-exec
          note: Runs a command in a running container; needs the tool in the image
        - id: debug-ephemeral
          label: kubectl debug
          term: kubectl-debug
          note: Adds an ephemeral container, or debugs a copy or a node
        - id: debug-port-forward
          label: kubectl port-forward
          term: kubectl-port-forward
          note: Local port to one selected Pod; TCP only
        - id: debug-service-path
          label: Service check order
          note: Pods ready, EndpointSlices, selector, targetPort, DNS, NetworkPolicy
        - id: debug-node-conditions
          label: Node conditions
          term: node-condition
          note: Ready, MemoryPressure, DiskPressure, PIDPressure, NetworkUnavailable
    - id: kubectl-commands
      children:
        - id: kubectl-command-shape
          label: Command shape
          note: kubectl [command] [TYPE] [NAME] [flags]
        - id: kubectl-inspect-commands
          label: Inspect
          note: get, describe, explain, top
        - id: kubectl-change-commands
          label: Change
          note: apply -f, diff -f, delete -f
        - id: kubectl-release-commands
          label: Scale and release
          note: scale, set image, rollout status, history, undo, restart
        - id: kubectl-debug-commands
          label: Debug
          note: logs, exec, debug, port-forward, events
        - id: kubectl-context-commands
          label: Context and namespace
          note: config get-contexts, use-context, set-context --current
        - id: kubectl-common-flags
          label: Common flags
          children:
            - id: flag-namespace
              label: -n / -A
              term: all-namespaces-flag
              note: One namespace, or all; -A ignores the context's namespace
            - id: flag-selector
              label: -l
              term: label-selector-flag
              note: Label query with =, ==, !=, in, notin
            - id: flag-output
              label: -o wide / -o yaml
              term: output-format
              note: Extra columns, or the whole object
            - id: flag-watch
              label: -w
              note: Keep printing changes after the first list
    - id: kubernetes-playbook
      children:
        - id: need-run-code
          label: Run code
          note: Deployment, StatefulSet, DaemonSet, Job or CronJob, by workload shape
        - id: need-reach-it
          label: Reach it
          note: Service for a stable address; Gateway API for HTTP routes
        - id: need-configure-it
          label: Configure it
          note: ConfigMap for settings; Secret for confidential data
        - id: need-keep-healthy
          label: Keep it healthy
          note: Probes decide restarts and which Pods get traffic
        - id: need-scale-it
          label: Scale it
          note: HPA changes the replica count to match demand
        - id: need-secure-it
          label: Secure it
          note: RBAC for API access; NetworkPolicy for Pod traffic
