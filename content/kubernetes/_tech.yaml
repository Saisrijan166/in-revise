name: Kubernetes
slug: kubernetes
accent: indigo
summary: "Kubernetes for interviews: architecture, Pods and workloads, Services and Gateway API, config and storage, probes and resources, scaling and releases, security and troubleshooting."
codeLanguages:
  - java
storySpine:
  - step: Containers on many machines crash and nobody restarts them → declare the desired state and let Kubernetes, not Docker alone, keep it true
    cards:
      - what-is-kubernetes
      - kubernetes-and-docker
  - step: Many teams and apps share one cluster and must change it safely → a control plane behind one API, manifests applied with kubectl, namespaces and labels to keep things apart
    cards:
      - kubernetes-architecture
      - kubectl-and-manifests
      - namespaces-labels-selectors
  - step: A bare Pod dies and nothing brings it back, and a restart cuts payments off mid-request → run Pods with helpers from a Deployment, whose ReplicaSet keeps N copies, and shut them down gracefully
    cards:
      - pods
      - multi-container-pods
      - pod-lifecycle
      - deployments-and-replicasets
  - step: The database needs fixed names and disks, every node needs a log agent, and the nightly report must run and stop → StatefulSet, DaemonSet and CronJob
    cards:
      - statefulsets
      - daemonsets
      - jobs-and-cronjobs
  - step: Pods are replaced and get new IPs, so callers lose them → put a Service in front for a stable name and IP, and let DNS and the Pod network carry the call
    cards:
      - services
      - cluster-networking-dns
  - step: Users outside need HTTPS paths to many Services, and any Pod can call any Pod → route through a Gateway or Ingress, and allow only the needed calls with NetworkPolicies
    cards:
      - ingress-and-gateway-api
      - network-policies
  - step: Settings and passwords baked into the image force a rebuild per environment and leak credentials → keep them in ConfigMaps and Secrets, and give each Pod its own ServiceAccount
    cards:
      - configmaps-and-secrets
      - service-accounts
  - step: Container files vanish on restart, and a database needs data that outlives its Pods → mount volumes, and claim durable storage with a PVC
    cards:
      - volumes
      - persistent-storage
  - step: A Pod is running but stuck or still warming up, and users get errors → add liveness, readiness and startup probes
    cards:
      - probes
  - step: Pods starve each other, land on the wrong nodes or all on one node → set requests and limits, know QoS and eviction, and steer placement with affinity, spread and taints
    cards:
      - resource-requests-limits
      - qos-and-eviction
      - scheduling
      - taints-and-tolerations
  - step: Load rises and falls, and a new release must not stop payments → autoscale Pods and nodes, roll out in steps, and try risky versions on a small share first
    cards:
      - autoscaling
      - rolling-updates-rollbacks
      - release-strategies
  - step: Nodes crash or get drained, and hand-run kubectl changes drift → spread replicas with a PDB and redundant control plane, and let GitOps sync the cluster from Git
    cards:
      - high-availability
      - gitops
  - step: Every person and Pod can call the API and run anything → grant least-privilege RBAC roles and enforce a Pod Security level per namespace
    cards:
      - rbac
      - pod-security
  - step: YAML is copied per environment and databases are run by hand → package with Helm or Kustomize, add CRDs and let operators run the app, then watch it through logs, events and metrics
    cards:
      - helm-and-kustomize
      - crds-and-operators
      - observability-in-k8s
  - step: A Pod fails and the status shows only one word, like CrashLoopBackOff → read the stage, then events, previous logs and the exit code in a fixed order
    cards:
      - pod-errors
      - kubectl-debugging
      - kubectl-commands
  - step: In an interview the pieces feel scattered → trace one kubectl apply to traffic and pick each object by the need it meets
    cards:
      - kubernetes-playbook
topics:
  - id: basics
    title: Kubernetes Basics
    order: 1
    blurb: What Kubernetes is, how a cluster is built, kubectl and YAML manifests, namespaces and labels.
  - id: workloads
    title: Workloads
    order: 2
    blurb: Pods, sidecars and init containers, the Pod lifecycle, Deployments, StatefulSets, DaemonSets, Jobs and CronJobs.
  - id: networking
    title: Services and Networking
    order: 3
    blurb: Services, Ingress and Gateway API, Pod networking and DNS, NetworkPolicies.
  - id: config-storage
    title: Config and Storage
    order: 4
    blurb: ConfigMaps and Secrets, volumes, persistent storage and ServiceAccounts.
  - id: health-resources
    title: Health, Resources and Scheduling
    order: 5
    blurb: "Probes, requests and limits, QoS and eviction, where Pods land: affinity, taints and tolerations."
  - id: scaling-releases
    title: Scaling and Releases
    order: 6
    blurb: Autoscaling, rolling updates and rollbacks, blue-green and canary, high availability and GitOps.
  - id: security-ops
    title: Security and Operations
    order: 7
    blurb: RBAC, Pod security, Helm and Kustomize, CRDs and operators, logs, events and metrics.
  - id: troubleshooting
    title: Troubleshooting and Playbook
    order: 8
    blurb: Pod errors, kubectl debugging, the must-know commands and a playbook for answering questions.
