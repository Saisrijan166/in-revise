name: DSA with Java
slug: dsa
accent: violet
summary: "Interview data structures, algorithms and the small set of patterns that solve most coding problems, in Java."
codeLanguages: [java]
storySpine:
  - step: "A correct-looking solution can still time out or use too much memory → estimate time and space before choosing a data structure"
    cards: [complexity, java-dsa-toolkit]
  - step: "Nested loops and repeated scans make simple array problems slow → recognise the array pattern, then maintain only the state that changes"
    cards: [pattern-recognition, arrays-and-strings, hash-map-and-set, two-pointers, sliding-window, prefix-sum, sorting-and-binary-search]
  - step: "A solution is only useful when it survives edge cases and can be explained → state an invariant, test boundaries, then trace a small example"
    cards: [interview-solution-workflow]
  - step: "Arrays are not always the right shape for changing data or ordered work → use linked lists, stacks, queues and deques"
    cards: [linked-lists, linked-list-patterns, stacks, queues-and-deques]
  - step: "A problem can contain a smaller version of itself → use recursion, then choose a sorting method whose trade-offs fit"
    cards: [recursion, sorting, merge-sort, quicksort]
  - step: "Hierarchical data needs directed choices rather than a full scan → use trees, traversals, BSTs, heaps and tries"
    cards: [tree-basics, tree-traversal, binary-search-tree, heap, trie]
  - step: "Connected data needs a route and a visited rule → model a graph, traverse with BFS or DFS, then add ordering or path algorithms"
    cards: [graph-basics, breadth-first-search, depth-first-search, topological-sort, shortest-path, union-find]
  - step: "Hard interview problems still repeat a small number of shapes → practise backtracking, dynamic programming, greedy choices, intervals, monotonic stacks and top-K"
    cards: [backtracking, dynamic-programming, dp-one-dimensional, dp-two-dimensional, greedy, intervals, monotonic-stack, heap-patterns, bit-manipulation, modular-arithmetic, string-patterns]
topics:
  - { id: foundations-patterns, title: "Foundations and High-Use Patterns", order: 1, blurb: "Complexity, Java tools, and the small patterns to spot first." }
  - { id: linear-structures, title: "Linked Lists, Stacks and Queues", order: 2, blurb: "Pointer structures and ordered work." }
  - { id: recursion-sorting, title: "Recursion and Sorting", order: 3, blurb: "Break problems down and put data in useful order." }
  - { id: trees-heaps, title: "Trees, Heaps and Tries", order: 4, blurb: "Hierarchies, ordered search and prefix lookup." }
  - { id: graphs, title: "Graphs", order: 5, blurb: "Connections, traversal, ordering and shortest paths." }
  - { id: advanced-patterns, title: "Patterns That Solve Most Problems", order: 6, blurb: "Memorable signals, templates and common interview shapes." }
