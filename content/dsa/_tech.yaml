name: DSA with Java
slug: dsa
accent: violet
summary: "Core data structures and algorithms, explained from representation to Java implementation."
codeLanguages: [java]
storySpine:
  - step: "Code must scale as input grows → measure time and space, then choose the fitting Java representation"
    cards: [complexity, java-dsa-toolkit, arrays-and-strings, hash-map-and-set]
  - step: "Data needs different access orders → implement linked lists, stacks and queues"
    cards: [linked-lists, stacks, queues-and-deques]
  - step: "Values need to be found or ordered → use recursion, searching and sorting"
    cards: [recursion, sorting-and-binary-search, sorting, merge-sort, quicksort]
  - step: "Hierarchical data needs node rules → build trees, traversals, BSTs, heaps and tries"
    cards: [tree-basics, tree-traversal, binary-search-tree, heap, trie]
  - step: "Connected data needs a representation and traversal → build graphs, then use BFS, DFS and Dijkstra"
    cards: [graph-basics, breadth-first-search, depth-first-search, shortest-path]
topics:
  - { id: foundations-patterns, title: "Arrays, Strings and Hashing", order: 1, blurb: "Indexed storage, Java collections and key lookup." }
  - { id: linear-structures, title: "Linked Lists, Stacks and Queues", order: 2, blurb: "Node links and ordered access." }
  - { id: recursion-sorting, title: "Recursion, Search and Sorting", order: 3, blurb: "Core algorithm building blocks and implementations." }
  - { id: trees-heaps, title: "Trees, Heaps and Tries", order: 4, blurb: "Hierarchical structures and their operations." }
  - { id: graphs, title: "Graphs and Traversal", order: 5, blurb: "Connections, representations and graph algorithms." }
