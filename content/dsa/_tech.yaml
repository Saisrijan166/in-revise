name: DSA with Java
slug: dsa
accent: violet
summary: Data structures, algorithms and the problem patterns behind most interview questions, with Java code.
codeLanguages:
  - java
storySpine:
  - step: The same data can be stored in many ways, each fast at different things → name the operations you need, then pick the structure that makes them cheap
    cards:
      - data-structures
      - big-o
  - step: Writing your own list, set or map for every problem is slow and error-prone → use the Java Collections Framework and declare by interface
    cards:
      - java-collections
  - step: Items in a list need fast access by position → store them side by side in an array or ArrayList
    cards:
      - arrays
      - dynamic-array
      - strings
  - step: Finding a value by scanning is O(n) → hash it to a slot in a HashMap or HashSet, or keep keys sorted in a TreeMap
    cards:
      - hashing
      - hashmap-hashset
      - ordered-maps-sets
  - step: An array must shift elements to insert or delete near the front → chain nodes with links, and splice in O(1) at a node you hold
    cards:
      - linked-list
  - step: Some work must finish the newest item first, other work the oldest → a stack (LIFO) or a queue (FIFO), both O(1) with ArrayDeque
    cards:
      - stack
      - queue-and-deque
  - step: Data has a hierarchy, and a sorted array is slow to insert into → use a tree, and a BST to keep keys in order
    cards:
      - tree-basics
      - tree-traversals
      - binary-search-tree
  - step: Sorted inserts turn a BST into a chain, and some tasks need only the min or a prefix → balance it, or use a heap or a trie
    cards:
      - balanced-trees
      - heap-priority-queue
      - trie
  - step: Roads, friends and dependencies link things in every direction → model them as a graph in adjacency lists and walk it with BFS or DFS
    cards:
      - graph-basics
      - bfs
      - dfs
  - step: Tasks wait on others, routes have costs, groups merge → topological sort for order, Dijkstra for cheapest routes, union-find and an MST for groups and cheapest wiring
    cards:
      - topological-sort
      - shortest-paths
      - union-find
      - minimum-spanning-tree
  - step: A problem is made of smaller copies of itself → write a recursive method with a base case
    cards:
      - recursion
  - step: Scanning for a value is slow → sort once with the library sort, then binary search in O(log n)
    cards:
      - sorting-basics
      - merge-sort
      - quick-sort
      - binary-search
  - step: "Nested loops over pairs and ranges are O(n²) → read the clue and pick a one-pass pattern: two pointers, a sliding window or prefix sums"
    cards:
      - spotting-the-pattern
      - two-pointers
      - sliding-window
      - prefix-sum
  - step: Rescanning for 'seen before' or 'next bigger' is slow → remember the past in a HashMap or a monotonic stack; fast and slow pointers find cycles with no memory
    cards:
      - frequency-counting
      - monotonic-stack
      - fast-slow-pointers
  - step: Searching every possible answer is slow, and listing every option explodes → binary search the answer range with a yes/no check, use a size-k heap for top k, sort intervals by start, and backtrack only with pruning
    cards:
      - binary-search-on-answer
      - top-k-heap
      - merge-intervals
      - backtracking
  - step: Grids, repeated subproblems and local choices hide simpler problems → run BFS or DFS on grid cells, store each subproblem once with DP, and go greedy only when the choice is provably safe
    cards:
      - grid-traversal
      - dynamic-programming
      - greedy
  - step: Facing a new problem freezes you → clarify, try examples, say the brute force, fix the bottleneck with the right structure, then test edge cases
    cards:
      - problem-solving-steps
      - constraints-to-complexity
      - choosing-a-data-structure
      - edge-cases
  - step: Hand-writing sorts, counts and conversions burns interview minutes → call the Arrays, Collections, Character, Math and Integer helpers
    cards:
      - java-coding-toolkit
  - step: Correct ideas still fail on hidden tests → know Java's quiet traps and a few bit tricks
    cards:
      - java-pitfalls
      - bit-manipulation
topics:
  - id: foundations
    title: Foundations
    order: 1
    blurb: What a data structure is, Big-O, and the Java collections you use every day.
  - id: arrays-hashing
    title: Arrays, Strings and Hashing
    order: 2
    blurb: Indexed storage, text, and fast lookup by key.
  - id: linear
    title: Linked Lists, Stacks and Queues
    order: 3
    blurb: Nodes and links, last-in-first-out and first-in-first-out.
  - id: trees
    title: Trees, Heaps and Tries
    order: 4
    blurb: Hierarchies, ordered search, priority and prefixes.
  - id: graphs
    title: Graphs
    order: 5
    blurb: Nodes and edges, traversal, paths and groups.
  - id: search-sort
    title: Recursion, Searching and Sorting
    order: 6
    blurb: The building-block algorithms behind most solutions.
  - id: patterns
    title: Problem Patterns
    order: 7
    blurb: The few patterns that solve most interview problems, and the clue that points to each.
  - id: tricks
    title: Problem-Solving Tricks
    order: 8
    blurb: Steps, checks and Java habits that turn an idea into a correct answer.
