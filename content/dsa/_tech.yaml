name: DSA with Java
slug: dsa
accent: violet
summary: "Core data structures and algorithms, explained from representation to Java implementation."
codeLanguages: [java]
storySpine:
  - step: "Algorithms are written in Java → first learn values, control flow, methods, objects and input"
    cards: [java-basics, input-output, control-flow, methods, java-oop]
  - step: "Values must be stored and transformed → use arrays, matrices, strings, bit operations and Java collections"
    cards: [complexity, java-dsa-toolkit, arrays-and-strings, two-dimensional-arrays, strings-and-stringbuilder, bit-manipulation, hash-map-and-set]
  - step: "Data needs different access orders → implement linked lists, stacks and queues"
    cards: [linked-lists, stacks, queues-and-deques]
  - step: "Values need to be found or ordered → use recursion, backtracking, searching and sorting"
    cards: [recursion, backtracking, sorting-and-binary-search, sorting, merge-sort, quicksort]
  - step: "Hierarchical data needs node rules → build trees, traversals, BSTs, heaps and tries"
    cards: [tree-basics, tree-traversal, binary-search-tree, heap, trie]
  - step: "Connected data needs a representation and traversal → build graphs, then use BFS, DFS and Dijkstra"
    cards: [graph-basics, breadth-first-search, depth-first-search, shortest-path]
topics:
  - { id: java-prerequisites, title: "Java Foundations for DSA", order: 1, blurb: "The Java skills used in every implementation." }
  - { id: foundations-patterns, title: "Arrays, Strings and Hashing", order: 2, blurb: "Indexed storage, matrices, text and key lookup." }
  - { id: linear-structures, title: "Linked Lists, Stacks and Queues", order: 3, blurb: "Node links and ordered access." }
  - { id: recursion-sorting, title: "Recursion, Search and Sorting", order: 4, blurb: "Core algorithm building blocks and implementations." }
  - { id: trees-heaps, title: "Trees, Heaps and Tries", order: 5, blurb: "Hierarchical structures and their operations." }
  - { id: graphs, title: "Graphs and Traversal", order: 6, blurb: "Connections, representations and graph algorithms." }
