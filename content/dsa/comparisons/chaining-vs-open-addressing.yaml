id: chaining-vs-open-addressing
tech: dsa
title: Separate Chaining vs Open Addressing
compares: [separate-chaining, open-addressing]
gist:
  - "Each bucket holds a list of the keys that hash there"
  - "One key per slot; on a collision, probe for another"
rows:
  - { aspect: "On a collision", a: "Add to the bucket's list", b: "Try other slots: linear, quadratic, double hashing" }
  - { aspect: "Load factor", a: "Can go above 1", b: "Must stay below 1" }
  - { aspect: "Delete", a: "Remove from the list", b: "Mark the slot deleted, or search breaks" }
  - { aspect: "Weak spot", a: "Long lists if keys bunch up", b: "Clusters as the table fills" }
verdict: "Chaining is simpler and tolerates a full table; open addressing saves list overhead but needs a low load factor."
sources:
  - title: "3.4 Hash Tables (Sedgewick and Wayne, Algorithms 4th ed.)"
    url: "https://algs4.cs.princeton.edu/34hash/"
    verifiedOn: "2026-10-19"
