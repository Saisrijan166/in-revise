id: chaining-vs-open-addressing
tech: dsa
title: Separate Chaining vs Open Addressing
compares: [separate-chaining, open-addressing]
gist:
  - "Each bucket holds a list of the keys that hash there"
  - "One key per slot; on a collision, probe for another"
explain:
  - "Separate chaining gives every bucket a small list. Keys that collide simply join the list of their bucket, and a lookup scans that one list."
  - "Open addressing stores every key in the array itself, one per slot. When a key's slot is taken, it probes other slots in a fixed order until it finds a free one, and a lookup follows the same order."
example: "With 8 slots and hash key % 8, keys 7 and 15 both want slot 7. Chaining stores both in bucket 7's list: [7, 15]. Linear probing puts 7 in slot 7, then tries slot 7 for 15, finds it taken, wraps around and puts 15 in slot 0."
rows:
  - { aspect: "On a collision", a: "Add the key to the bucket's list", b: "Probe other slots: linear, quadratic or double hashing" }
  - { aspect: "Load factor", a: "Can go above 1", b: "Must stay below 1" }
  - { aspect: "Delete", a: "Remove the key from the list", b: "Mark the slot as deleted, or later searches stop too early" }
  - { aspect: "Weak spot", a: "Long lists if many keys share a bucket", b: "Clusters of full slots as the table fills" }
  - { aspect: "Used by", a: "Java's HashMap", b: "Many other hash tables; Java's IdentityHashMap" }
verdict: "Chaining is simpler and tolerates a full table; open addressing saves list overhead but needs a low load factor."
sayIt: "Separate chaining keeps a list per bucket, so colliding keys share it and the load factor can exceed 1. Open addressing keeps one key per slot and probes for another slot on a collision, so it needs a load factor below 1 and careful deletes. Java's HashMap uses chaining."
