id: adjacency-list-vs-matrix
tech: dsa
title: Adjacency List vs Adjacency Matrix
compares: [adjacency-list, adjacency-matrix]
gist:
  - "Each vertex keeps a list of its real neighbours"
  - "A V × V grid with a cell for every pair"
rows:
  - { aspect: "Space", a: "O(V + E)", b: "O(V²)" }
  - { aspect: "Is u linked to v?", a: "O(degree of u)", b: "O(1)" }
  - { aspect: "Loop over neighbours of u", a: "O(degree of u)", b: "O(V), scans the whole row" }
  - { aspect: "BFS or DFS", a: "O(V + E)", b: "O(V²)" }
  - { aspect: "Fits", a: "Sparse graphs, most interview problems", b: "Dense graphs, close to V² edges" }
verdict: "Use adjacency lists by default; pick a matrix only for a dense graph or when O(1) edge checks matter most."
sources:
