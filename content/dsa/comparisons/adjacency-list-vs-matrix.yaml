id: adjacency-list-vs-matrix
tech: dsa
title: Adjacency List vs Adjacency Matrix
compares: [adjacency-list, adjacency-matrix]
gist:
  - "Each vertex keeps a list of its real neighbours"
  - "A V × V grid with a cell for every pair"
explain:
  - "An adjacency list gives each vertex a list of the vertices it links to. It stores only edges that exist, so it stays small when edges are few, and a neighbour loop touches only real edges."
  - "An adjacency matrix is a V × V table where cell [u][v] says whether edge u-v exists, or holds its weight. It answers 'is u linked to v?' in one step, at the cost of a cell for every pair."
example: "The city graph has 6 vertices and 7 roads. Its lists hold 14 entries, one per road end; a matrix holds 36 cells, 22 of them empty. A network of 1,000,000 users with about 100 friends each needs about 100 million list entries, but a matrix of a million million cells."
rows:
  - { aspect: "Space", a: "O(V + E)", b: "O(V²)" }
  - { aspect: "Is u linked to v?", a: "O(degree of u)", b: "O(1)" }
  - { aspect: "Loop over neighbours of u", a: "O(degree of u)", b: "O(V), scans the whole row" }
  - { aspect: "BFS or DFS", a: "O(V + E)", b: "O(V²)" }
  - { aspect: "Fits", a: "Sparse graphs, most interview problems", b: "Dense graphs, close to V² edges" }
verdict: "Use adjacency lists by default; pick a matrix only for a dense graph or when O(1) edge checks matter most."
sayIt: "I default to adjacency lists: O(V + E) space, and neighbour loops touch only real edges, so BFS and DFS run in O(V + E). I pick a matrix only for a dense graph or many O(1) edge checks, accepting O(V²) space and O(V) per neighbour loop."
