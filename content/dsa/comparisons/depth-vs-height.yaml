id: depth-vs-height
tech: dsa
title: "Depth vs Height"
compares: [tree-depth, tree-height]
gist:
  - "How far a node is below the root"
  - "How far a node is above its deepest leaf"
explain:
  - "Depth tells how far a node is below the root: count the edges from the root down to it. The root has depth 0, its children depth 1, and so on."
  - "Height tells how far a node is above the bottom: count the edges on the longest path from it down to a leaf. Every leaf has height 0, and the root's height is the height of the whole tree."
example: "In the tree 8 (3 (1, 6), 10 (-, 14)), node 3 has depth 1, because it is one edge below the root, and height 1, because its leaves are one edge below it. Node 14 has depth 2 and height 0. The tree's height is 2, the same as the depth of its deepest leaves."
rows:
  - { aspect: "Counted from", a: "The root, going down", b: "The node, going down to a leaf" }
  - { aspect: "Zero for", a: "The root", b: "Every leaf" }
  - { aspect: "Of the whole tree", a: "Max depth of any node", b: "Height of the root (same number)" }
  - { aspect: "Computed by", a: "Passing depth + 1 down (preorder)", b: "1 + max of children (postorder)" }
verdict: "Depth looks up to the root, height looks down to the leaves; for the whole tree they are equal."
sayIt: "Depth counts edges from the root down to a node, so the root is 0. Height counts edges from a node down to its deepest leaf, so a leaf is 0. For the whole tree they are the same number. Some problems, such as LeetCode 104, count nodes instead of edges."
sources:
  - title: "Binary Trees: depth, height, subtree (Open Data Structures, Java edition)"
    url: "https://opendatastructures.org/ods-java/6_Binary_Trees.html"
    verifiedOn: "2026-10-19"
