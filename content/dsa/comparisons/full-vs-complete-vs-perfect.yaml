id: full-vs-complete-vs-perfect
tech: dsa
title: "Full vs Complete vs Perfect Binary Tree"
compares: [full-binary-tree, complete-binary-tree, perfect-binary-tree]
gist:
  - "Every node has 0 or 2 children"
  - "All levels full but the last, filled from the left"
  - "Every level completely full"
rows:
  - { aspect: "Rule about", a: "Children per node", b: "How levels fill", c: "Both" }
  - { aspect: "Node with one child", a: "Never", b: "At most one, just above the last level", c: "Never" }
  - { aspect: "Leaves", a: "Any depths", b: "On the last two levels", c: "All at one depth" }
  - { aspect: "Node count, height h", a: "No fixed formula", b: "2^h to 2^(h+1) - 1", c: "Exactly 2^(h+1) - 1" }
  - { aspect: "Used by", a: "Huffman codes", b: "Binary heaps (array layout)", c: "Best-case shape" }
verdict: "Perfect is both full and complete. Heaps need complete. Some books swap the names, so define the term you use."
sources:
  - title: "Full binary tree (NIST Dictionary of Algorithms and Data Structures)"
    url: "https://xlinux.nist.gov/dads/HTML/fullBinaryTree.html"
    verifiedOn: "2026-10-19"
  - title: "Complete binary tree (NIST Dictionary of Algorithms and Data Structures)"
    url: "https://xlinux.nist.gov/dads/HTML/completeBinaryTree.html"
    verifiedOn: "2026-10-19"
  - title: "Perfect binary tree (NIST Dictionary of Algorithms and Data Structures)"
    url: "https://xlinux.nist.gov/dads/HTML/perfectBinaryTree.html"
    verifiedOn: "2026-10-19"
