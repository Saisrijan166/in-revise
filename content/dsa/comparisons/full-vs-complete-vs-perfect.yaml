id: full-vs-complete-vs-perfect
tech: dsa
title: "Full vs Complete vs Perfect Binary Tree"
compares: [full-binary-tree, complete-binary-tree, perfect-binary-tree]
gist:
  - "Every node has 0 or 2 children"
  - "All levels full but the last, filled from the left"
  - "Every level completely full"
explain:
  - "A full binary tree is about children: every node has either zero or two children, never exactly one. The leaves may sit at different depths."
  - "A complete binary tree is about how levels fill: every level is full except possibly the last, and the last level's nodes are as far left as possible. This shape has no gaps, so it fits in an array."
  - "A perfect binary tree is full and complete at once: every internal node has two children and all leaves are at the same depth, so a tree of height h has exactly 2^(h+1) - 1 nodes."
example: "A heap with 5 items is complete: levels 0 and 1 are full and the last level holds two nodes on the left. Add 2 more items and the last level fills up, so the tree becomes perfect, with 7 = 2^3 - 1 nodes. A tree where the root's left child has two leaves and its right child is a leaf is full, but not perfect."
rows:
  - { aspect: "Rule about", a: "Children per node", b: "How levels fill", c: "Both" }
  - { aspect: "Node with one child", a: "Never", b: "At most one, just above the last level", c: "Never" }
  - { aspect: "Leaves", a: "Any depths", b: "On the last two levels", c: "All at one depth" }
  - { aspect: "Node count, height h", a: "No fixed formula", b: "2^h to 2^(h+1) - 1", c: "Exactly 2^(h+1) - 1" }
  - { aspect: "Used by", a: "Huffman codes", b: "Binary heaps (array layout)", c: "Best-case shape" }
verdict: "Perfect is both full and complete. Heaps need complete. Some books swap the names, so define the term you use."
sayIt: "Full means every node has 0 or 2 children. Complete means all levels are full except the last, which fills from the left; binary heaps use this shape. Perfect means every level is full, so it is both full and complete. Some books swap the names, so define them first."
sources:
