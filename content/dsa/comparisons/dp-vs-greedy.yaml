id: dp-vs-greedy
tech: dsa
title: Dynamic Programming vs Greedy
compares: [dynamic-programming, greedy]
gist:
  - "Try every choice, reuse stored answers"
  - "Commit to one safe choice per step"
rows:
  - { aspect: "At each step", a: "Looks at every option and keeps the best", b: "Takes the best-looking option only" }
  - { aspect: "Correct when", a: "The recurrence is right", b: "The choice is proven safe" }
  - { aspect: "Time", a: "States × work per state", b: "Usually a sort plus one pass" }
  - { aspect: "Undo a choice", a: "Effectively yes: all options are compared", b: "Never" }
  - { aspect: "Coins {1, 3, 4}, sum 6", a: "2 coins: 3 + 3", b: "3 coins: 4 + 1 + 1" }
verdict: "Use greedy only when you can prove the choice is safe; after a counterexample, use DP."
sources:
  - title: "Competitive Programmer's Handbook, ch. 6 and 7 (Laaksonen)"
    url: "https://cses.fi/book/book.pdf"
    verifiedOn: "2026-10-19"
  - title: "Introduction to Greedy Algorithms (GeeksforGeeks)"
    url: "https://www.geeksforgeeks.org/dsa/introduction-to-greedy-algorithm-data-structures-and-algorithm-tutorials/"
    verifiedOn: "2026-10-19"
