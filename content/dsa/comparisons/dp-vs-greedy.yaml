id: dp-vs-greedy
tech: dsa
title: Dynamic Programming vs Greedy
compares: [dynamic-programming, greedy]
gist:
  - "Compare every choice, reusing stored answers"
  - "Commit to one safe choice per step"
explain:
  - "Dynamic programming solves each subproblem once, stores its answer, and builds bigger answers by comparing every option at every state. It is correct whenever the recurrence is right."
  - "Greedy takes the choice that looks best right now and never takes it back. It skips comparing options, so it is faster, but it is correct only when that choice is proven safe."
example: "Coins {1, 3, 4}, amount 6. Greedy takes the largest coin that fits: 4, then 1, then 1, three coins. DP computes the fewest coins for every amount from 0 to 6 and finds dp[6] = 2, for 3 + 3. With euro coins both give the same answer, but greedy does it in one pass."
rows:
  - { aspect: "At each step", a: "Compares every option and keeps the best", b: "Takes the best-looking option only" }
  - { aspect: "Takes a choice back?", a: "In effect yes: other options stay in the stored answers", b: "Never" }
  - { aspect: "Correct when", a: "The state and transition are right", b: "The greedy choice is proven safe" }
  - { aspect: "Typical time", a: "Number of states × work per state", b: "A sort plus one pass, O(n log n)" }
  - { aspect: "Coins {1, 3, 4}, amount 6", a: "2 coins: 3 + 3", b: "3 coins: 4 + 1 + 1" }
verdict: "Use greedy only when you can prove the choice is safe; after one counterexample, use DP."
sayIt: "DP compares every option at every state and reuses stored answers, so it is correct whenever the recurrence is. Greedy commits to one choice per step, so it is faster, but I use it only when I can prove that choice is safe. A counterexample, like coins {1, 3, 4}, sends me to DP."
sources:
  - title: "Competitive Programmer's Handbook, ch. 6 and 7 (Laaksonen)"
    url: "https://cses.fi/book/book.pdf"
    verifiedOn: "2026-10-19"
