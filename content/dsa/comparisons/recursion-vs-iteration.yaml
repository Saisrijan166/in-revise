id: recursion-vs-iteration
tech: dsa
title: Recursion vs Iteration
compares: [recursion, iterative-version]
gist:
  - "The method calls itself on a smaller input"
  - "A loop updates variables, maybe with a stack"
explain:
  - "Recursion repeats work by having a method call itself on a smaller input. The call stack remembers each unfinished call, so the code can follow problems that branch, like trees."
  - "Iteration repeats work with a loop that updates variables until a condition fails. If it must remember pending work, it keeps its own stack or queue."
example: "Summing the digits of 472: recursion calls sumDigits(47), then sumDigits(4), holding three frames at once. A loop runs sum += n % 10; n /= 10 while n > 0, with two variables. Walking a 1,000,000-node list recursively throws StackOverflowError; the loop does not."
rows:
  - { aspect: "Stops when", a: "A base case is reached", b: "The loop condition fails" }
  - { aspect: "Extra space", a: "O(depth) stack frames", b: "O(1), or the size of your own stack" }
  - { aspect: "Too deep", a: "StackOverflowError", b: "Your own stack lives on the heap, so no call-stack limit" }
  - { aspect: "Reads best for", a: "Trees, divide and conquer, backtracking", b: "Simple counting and scans" }
verdict: "Use whichever reads more simply; prefer a loop when the depth grows with n, as on a long list."
sayIt: "Any recursion can be written as a loop, if needed with an explicit stack. I use recursion when the problem branches, like trees or divide and conquer, and a loop when it is a straight line or the depth can reach n, because Java gives every call a frame."
sources:
  - { title: "Recursion: Q and A (Princeton IntroCS, Sedgewick and Wayne)", url: "https://introcs.cs.princeton.edu/java/23recursion/", verifiedOn: "2026-10-19" }
