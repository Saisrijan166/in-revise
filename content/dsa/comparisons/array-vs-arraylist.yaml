id: array-vs-arraylist
tech: dsa
title: Array vs ArrayList
compares: [arrays, dynamic-array]
gist:
  - "Fixed length; holds primitives or objects"
  - "Grows by itself; holds objects only"
explain:
  - "An array is a fixed number of slots created in one step, such as new int[4]. It can hold primitives like int directly, and a[i] reads any slot in O(1)."
  - "An ArrayList is a List that keeps its items in an inner array and copies them into a bigger one when it fills up, so you can keep adding without knowing the final count."
example: "Reading exactly 4 numbers into nums = [2, 7, 11, 15] fits an int[4]. Collecting every number from a file of unknown length fits a List<Integer>: list.add(x) keeps working, while an array would need a new, bigger copy each time it fills."
rows:
  - { aspect: "Length", a: "Fixed when created", b: "Grows by copying into a bigger array" }
  - { aspect: "Holds", a: "Primitives (int, char) or objects", b: "Objects only: Integer, not int" }
  - { aspect: "Read and size", a: "a[i] and a.length", b: "list.get(i) and list.size()" }
  - { aspect: "Add at the end", a: "Not possible without a new array", b: "Amortised O(1)" }
  - { aspect: "Insert in the middle", a: "Shift by hand, O(n)", b: "add(i, x), still O(n)" }
verdict: "Use an array when the size is known or you want primitives without boxing; use an ArrayList when the count changes."
sayIt: "An array has a fixed length and can hold primitives, with O(1) index access. An ArrayList wraps an array that grows by copying, so append is amortised O(1), but it holds only objects such as Integer. Fixed size or primitives: array; changing count: ArrayList."
sources:
