id: array-vs-arraylist
tech: dsa
title: Array vs ArrayList
compares: [arrays, dynamic-array]
gist:
  - "Fixed length; primitives or objects"
  - "Grows by itself; objects only"
rows:
  - { aspect: "Length", a: "Fixed when created", b: "Grows: copies into a bigger array" }
  - { aspect: "Holds", a: "int, char, objects", b: "Objects: Integer, not int" }
  - { aspect: "Access", a: "a[i], a.length", b: "list.get(i), list.size()" }
  - { aspect: "Add at end", a: "Not possible", b: "Amortised O(1)" }
verdict: "Use an array when the size is known or for primitive speed; ArrayList when the count changes."
sources:
  - title: "Chapter 10. Arrays (Java Language Specification, Java SE 25)"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-10.html"
    verifiedOn: "2026-10-19"
  - title: "ArrayList (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/ArrayList.html"
    verifiedOn: "2026-10-19"
  - title: "4.5.1 Type Arguments of Parameterized Types (Java Language Specification, Java SE 25)"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html#jls-4.5.1"
    verifiedOn: "2026-10-19"
