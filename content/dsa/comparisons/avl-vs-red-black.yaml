id: avl-vs-red-black
tech: dsa
title: "AVL Tree vs Red-Black Tree"
compares: [avl-tree, red-black-tree]
gist:
  - "Strict: subtree heights differ by at most 1"
  - "Looser: colour rules keep height ≤ 2 lg n"
rows:
  - { aspect: "Balance rule", a: "Heights of the two subtrees differ by ≤ 1", b: "Same number of black links on every path" }
  - { aspect: "Height", a: "O(log n), flatter", b: "At most 2 lg n" }
  - { aspect: "Lookups", a: "Slightly faster", b: "Slightly slower" }
  - { aspect: "Rotations per update", a: "More: up to O(log n) in the worst case", b: "Fewer: at most 2 per insert, 3 per delete" }
  - { aspect: "Used in", a: "Data where lookups dominate", b: "Java TreeMap, and TreeSet through it" }
verdict: "Both give O(log n) worst case. Red-black is the usual library choice for mixed updates; AVL suits read-heavy data."
sources:
