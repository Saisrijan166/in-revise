id: avl-vs-red-black
tech: dsa
title: "AVL Tree vs Red-Black Tree"
compares: [avl-tree, red-black-tree]
gist:
  - "Strict: subtree heights differ by at most 1"
  - "Looser: colour rules keep height ≤ 2 lg n"
explain:
  - "An AVL tree is a binary search tree that keeps itself balanced: at every node, the heights of the left and right subtrees differ by at most 1. After an insert or delete it rotates nodes to restore that rule, so lookups stay O(log n)."
  - "A red-black tree is a binary search tree that marks each node or link red or black and follows colour rules. The rules keep the height at most 2 lg n, so every operation is O(log n), with fewer rotations per update than AVL."
example: "Java's TreeMap is a red-black tree: with 1,000,000 keys its height stays at most about 40, so get, put and remove each visit at most about 40 nodes, and an insert rotates at most twice. A word list built once and then searched millions of times could use an AVL tree, whose flatter shape makes each search a little shorter."
rows:
  - { aspect: "Balance rule", a: "Heights of the two subtrees differ by ≤ 1", b: "No red node has a red child; every path down has the same number of black nodes" }
  - { aspect: "Height", a: "O(log n), flatter", b: "At most 2 lg n" }
  - { aspect: "Lookups", a: "Slightly faster", b: "Slightly slower" }
  - { aspect: "Rotations per update", a: "More: a delete may need O(log n)", b: "Fewer: at most 2 per insert" }
  - { aspect: "Used in", a: "Data where lookups dominate", b: "Java TreeMap, and TreeSet through it" }
verdict: "Both give O(log n) worst case. Red-black is the usual library choice for mixed updates; AVL suits read-heavy data."
sayIt: "Both are self-balancing BSTs with O(log n) operations. AVL is stricter, subtree heights differ by at most 1, so lookups are slightly faster but updates rotate more. Red-black is looser, height at most 2 lg n, with fewer rotations; it is what Java's TreeMap uses."
