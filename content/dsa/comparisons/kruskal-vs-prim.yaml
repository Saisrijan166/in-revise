id: kruskal-vs-prim
tech: dsa
title: Kruskal vs Prim
compares: [kruskal, prim]
gist:
  - "Sort all edges; add the cheapest that skips a cycle"
  - "Grow one tree; add the cheapest edge leaving it"
rows:
  - { aspect: "Works on", a: "The whole edge list", b: "Adjacency lists, from a start vertex" }
  - { aspect: "Helper", a: "Union-find, to spot cycles", b: "Min-heap of crossing edges" }
  - { aspect: "While running", a: "A forest that merges into one tree", b: "Always one growing tree" }
  - { aspect: "Time", a: "O(E log E)", b: "O(E log V) (eager, binary heap)" }
verdict: "Edge list given? Kruskal. Adjacency lists or a start vertex? Prim. Both give a minimum spanning tree."
sources:
  - title: "Minimum Spanning Trees (Algorithms, 4th Edition, 4.3)"
    url: "https://algs4.cs.princeton.edu/43mst/"
    verifiedOn: "2026-10-19"
  - title: "Minimum spanning tree: Prim's algorithm (cp-algorithms)"
    url: "https://cp-algorithms.com/graph/mst_prim.html"
    verifiedOn: "2026-10-19"
