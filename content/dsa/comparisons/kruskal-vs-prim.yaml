id: kruskal-vs-prim
tech: dsa
title: Kruskal vs Prim
compares: [kruskal, prim]
gist:
  - "Sort all edges; add the cheapest that skips a cycle"
  - "Grow one tree; add the cheapest edge leaving it"
explain:
  - "Kruskal's algorithm sorts all edges by weight and adds them cheapest first, skipping any edge whose ends are already connected. Union-find makes that check almost O(1)."
  - "Prim's algorithm grows one tree from a start vertex. At each step it adds the cheapest edge from the tree to a vertex outside it, found with a min-heap of candidate edges."
example: "City graph: Kruskal takes 0-2 (1), 1-2 (2), 3-4 (3), skips 0-1 (4), then takes 1-3 (5) and 3-5 (6), total 17. Prim from city 0 takes 0-2, 2-1, 1-3, 3-4, 3-5: the same five roads in a different order, again total 17."
rows:
  - { aspect: "Works on", a: "The whole edge list", b: "Adjacency lists, from a start vertex" }
  - { aspect: "Helper", a: "Union-find, to spot cycles", b: "Min-heap of edges leaving the tree" }
  - { aspect: "While running", a: "A forest that merges into one tree", b: "Always one growing tree" }
  - { aspect: "Time", a: "O(E log E), mostly the sort", b: "O(E log V) with a binary heap; O(V²) with a matrix" }
verdict: "Edge list given? Kruskal. Adjacency lists or a start vertex? Prim. Both give a minimum spanning tree."
sayIt: "Both are greedy and give an MST. Kruskal sorts the edges and uses union-find to skip cycles, O(E log E), so I use it on an edge list. Prim grows one tree with a min-heap, O(E log V), and fits adjacency lists, or dense graphs in its O(V²) form."
sources:
