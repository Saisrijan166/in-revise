id: string-vs-stringbuilder
tech: dsa
title: String vs StringBuilder
compares: [java-string, stringbuilder]
gist:
  - "Immutable: every change makes a new String"
  - "Mutable: changes one buffer in place"
explain:
  - "A String is fixed text. No method changes it; methods such as toUpperCase or replace return a new String, which makes a String safe to share and to use as a map key."
  - "A StringBuilder is a text buffer with spare room. append, insert and reverse change it in place, and toString() turns the result into a String."
example: "Joining 10,000 words with result += word creates 10,000 Strings and copies the growing text each time, O(n²). Appending each word to one StringBuilder and calling toString() once copies each character about once, O(n)."
rows:
  - { aspect: "Can change", a: "No", b: "Yes: append, insert, reverse, setCharAt, deleteCharAt" }
  - { aspect: "Build n characters in a loop", a: "O(n²): copies the text each time", b: "O(n) in total" }
  - { aspect: "Compare text", a: "s.equals(t)", b: "sb.toString().equals(...): it has no equals of its own" }
  - { aspect: "Map key", a: "Safe: the value never changes", b: "Avoid: the value can change" }
  - { aspect: "Threads", a: "Safe to share: it never changes", b: "Not synchronised; StringBuffer is the synchronised version" }
verdict: "Build text with StringBuilder, then call toString() once; keep and compare it as a String."
sayIt: "A String is immutable, so += in a loop copies the text each time and costs O(n²). A StringBuilder changes one buffer in place, so building text is O(n). I build with StringBuilder, call toString once, and keep and compare the result as a String."
