id: string-vs-stringbuilder
tech: dsa
title: String vs StringBuilder
compares: [java-string, stringbuilder]
gist:
  - "Immutable: every change makes a new String"
  - "Mutable: changes one buffer in place"
rows:
  - { aspect: "Can change", a: "No", b: "Yes: append, insert, reverse, setCharAt, deleteCharAt" }
  - { aspect: "Build n characters in a loop", a: "O(n²): copies the text each time", b: "O(n) total" }
  - { aspect: "Compare text", a: "equals", b: "toString(), then equals" }
  - { aspect: "Map key", a: "Safe: the value never changes", b: "Avoid: the value can change" }
verdict: "Build text with StringBuilder, then call toString() once; keep and compare it as a String."
sources:
  - title: "String (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html"
    verifiedOn: "2026-10-19"
  - title: "StringBuilder (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StringBuilder.html"
    verifiedOn: "2026-10-19"
  - title: "4.1 Analysis of Algorithms: strings (Princeton, Computer Science: An Interdisciplinary Approach)"
    url: "https://introcs.cs.princeton.edu/java/41analysis/"
    verifiedOn: "2026-10-19"
