id: bfs-vs-dfs
tech: dsa
title: BFS vs DFS
compares: [bfs, dfs]
gist:
  - "Ring by ring: nearest vertices first"
  - "One path as deep as it goes, then back up"
diagrams:
  - |
    flowchart TD
      A((A)) -- 1 --> B((B))
      A -- 2 --> C((C))
      B -- 3 --> D((D))
  - |
    flowchart TD
      A((A)) -- 1 --> B((B))
      B -- 2 --> D((D))
      A -- 3 --> C((C))
diagramAlt: "The same graph: A links to B and C, and B links to D. BFS visits A, B, C, then D: both neighbours of A before going deeper. DFS visits A, B, D, then C: it follows A to B to D before coming back for C."
rows:
  - { aspect: "Uses", a: "Queue (first in, first out)", b: "Stack or recursion (last in, first out)" }
  - { aspect: "Holds", a: "The frontier still to explore", b: "The current path" }
  - { aspect: "Shortest path", a: "Yes, in edges, if all edges cost the same", b: "No" }
  - { aspect: "Typical uses", a: "Fewest moves, level by level", b: "Components, cycles, topological sort, backtracking" }
  - { aspect: "Time", a: "O(V + E)", b: "O(V + E)" }
verdict: "Need the fewest steps? BFS. Need to explore, connect or detect loops? DFS."
sources:
  - title: "Undirected Graphs (Algorithms, 4th Edition, 4.1)"
    url: "https://algs4.cs.princeton.edu/41graph/"
    verifiedOn: "2026-10-19"
  - title: "Depth First Search (cp-algorithms)"
    url: "https://cp-algorithms.com/graph/depth-first-search.html"
    verifiedOn: "2026-10-19"
  - title: "Graph cheatsheet (Tech Interview Handbook)"
    url: "https://www.techinterviewhandbook.org/algorithms/graph/"
    verifiedOn: "2026-10-19"
