id: bfs-vs-dfs
tech: dsa
title: BFS vs DFS
compares: [bfs, dfs]
gist:
  - "Ring by ring: nearest vertices first"
  - "One path as deep as it goes, then back up"
explain:
  - "BFS visits vertices in order of distance from the start, using a queue. It answers 'what is the fewest number of steps?' in a graph where every edge costs the same."
  - "DFS follows one path as deep as it can, then backs up and tries the next branch, using recursion or a stack. It answers 'is it connected, is there a cycle, in what order do things finish?'"
example: "City graph, from city 0: BFS visits 0, 1, 2, 3, 4, 5 and knows city 4 is two roads away. DFS visits 0, 1, 2, 4, 3, 5 and first reaches city 4 by a three-road path, 0-1-2-4. For 'fewest roads to city 4' only BFS is right; for 'can city 0 reach city 5?' both are."
diagrams:
  - |
    flowchart TD
      A((A)) -- 1 --> B((B))
      A -- 2 --> C((C))
      B -- 3 --> D((D))
  - |
    flowchart TD
      A((A)) -- 1 --> B((B))
      B -- 2 --> D((D))
      A -- 3 --> C((C))
diagramAlt: "The same graph: A links to B and C, and B links to D. BFS visits A, B, C, then D: both neighbours of A before going deeper. DFS visits A, B, D, then C: it follows A to B to D before coming back for C."
rows:
  - { aspect: "Uses", a: "Queue (first in, first out)", b: "Stack or recursion (last in, first out)" }
  - { aspect: "Holds", a: "Vertices found but not yet explored; large on wide graphs", b: "The current path; long on deep graphs" }
  - { aspect: "Shortest path", a: "Yes, in edges, if all edges cost the same", b: "No" }
  - { aspect: "Typical uses", a: "Fewest moves, level by level", b: "Components, cycles, topological sort, backtracking" }
  - { aspect: "Time", a: "O(V + E)", b: "O(V + E)" }
verdict: "Need the fewest steps? BFS. Need to explore, connect or detect loops? DFS."
sayIt: "Both run in O(V + E). BFS uses a queue and explores level by level, so it gives fewest-edge paths in unweighted graphs. DFS uses recursion or a stack and goes deep first, which suits components, cycle checks and topological sort."
