id: linear-vs-binary-search
tech: dsa
title: Linear Search vs Binary Search
compares: [linear-search, binary-search]
gist:
  - "Check every item in turn"
  - "Check the middle, drop half"
rows:
  - { aspect: "Needs sorted data", a: "No", b: "Yes, or a monotonic check" }
  - { aspect: "Search time", a: "O(n)", b: "O(log n)" }
  - { aspect: "Upkeep", a: "None: data can stay unsorted", b: "Each insert costs O(n) to keep order" }
  - { aspect: "Works on linked lists", a: "Yes, same O(n)", b: "No gain: reaching the middle is O(n)" }
verdict: "One search on unsorted data: scan. Many searches on data that rarely changes: sort once, then binary search."
sources:
  - { title: "Algorithms and Data Structures Cheatsheet: symbol tables (Algorithms, 4th Edition)", url: "https://algs4.cs.princeton.edu/cheatsheet/", verifiedOn: "2026-10-19" }
  - { title: "Collections.binarySearch (Java SE 25 API)", url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Collections.html", verifiedOn: "2026-10-19" }
