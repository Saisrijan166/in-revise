id: linear-vs-binary-search
tech: dsa
title: Linear Search vs Binary Search
compares: [linear-search, binary-search]
gist:
  - "Check every item in turn"
  - "Check the middle, drop half"
explain:
  - "Linear search checks the items one by one from the start until it finds the target or reaches the end. It works on any data, sorted or not, and needs no preparation."
  - "Binary search checks the middle of a sorted range and drops the half that cannot hold the target, repeating until it finds it or the range is empty."
example: "In nums = [2, 7, 11, 15, 20, 26, 31], linear search for 26 checks 2, 7, 11, 15, 20 and 26: six checks. Binary search checks 15, then 26: two checks. On a million sorted items the gap grows to up to a million checks against about 20."
rows:
  - { aspect: "Needs sorted data", a: "No", b: "Yes, or a yes/no check that switches only once" }
  - { aspect: "Search time", a: "O(n)", b: "O(log n)" }
  - { aspect: "Upkeep", a: "None: the data can stay unsorted", b: "Inserting into a sorted array shifts items: O(n)" }
  - { aspect: "On a linked list", a: "Same O(n)", b: "No gain: reaching the middle takes O(n) steps" }
verdict: "One search in unsorted data: scan it. Many searches in data that rarely changes: sort once, then binary search."
sayIt: "Linear search is O(n) and works on any data. Binary search is O(log n) but needs sorted data with fast index access. For one lookup in unsorted data I scan; for many lookups in data that rarely changes I sort once and binary search."
sources:
  - { title: "Algorithms and Data Structures Cheatsheet: symbol tables (Algorithms, 4th Edition)", url: "https://algs4.cs.princeton.edu/cheatsheet/", verifiedOn: "2026-10-19" }
