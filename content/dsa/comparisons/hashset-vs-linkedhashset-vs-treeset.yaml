id: hashset-vs-linkedhashset-vs-treeset
tech: dsa
title: HashSet vs LinkedHashSet vs TreeSet
compares: [java-hashset, linkedhashset, treeset]
gist:
  - "Unique items; fastest; no order"
  - "Unique items in insertion order"
  - "Unique items kept sorted"
explain:
  - "HashSet keeps unique items in a hash table: O(1) average add and contains, with no defined order."
  - "LinkedHashSet is a HashSet that also remembers the order items were first added, so iteration follows that order."
  - "TreeSet keeps unique items sorted in a tree, so iteration is sorted and it can find the nearest item to a value."
example: "Remove duplicates from [pear, apple, fig, apple]. HashSet keeps three words in no defined order, LinkedHashSet gives [pear, apple, fig], and TreeSet gives [apple, fig, pear]."
rows:
  - { aspect: "Built on", a: "A HashMap", b: "Hash table plus a linked list", c: "A TreeMap" }
  - { aspect: "add, contains", a: "O(1) average", b: "O(1) average", c: "O(log n)" }
  - { aspect: "Iteration order", a: "Not defined", b: "Insertion order", c: "Sorted" }
  - { aspect: "Null item", a: "Allowed", b: "Allowed", c: "Throws with natural ordering" }
  - { aspect: "Extra powers", a: "None", b: "None beyond order", c: "floor, ceiling, first, last, pollFirst" }
verdict: "HashSet for \"seen?\" checks; LinkedHashSet to drop duplicates but keep order; TreeSet for sorted items or floor and ceiling."
sayIt: "All three keep unique items. HashSet is the fastest with no order, LinkedHashSet keeps insertion order, and TreeSet keeps items sorted at O(log n) and can answer floor and ceiling queries. Each one mirrors the map of the same name."
