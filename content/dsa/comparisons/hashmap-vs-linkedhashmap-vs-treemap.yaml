id: hashmap-vs-linkedhashmap-vs-treemap
tech: dsa
title: HashMap vs LinkedHashMap vs TreeMap
compares: [java-hashmap, linkedhashmap, treemap]
gist:
  - "Fastest; no order"
  - "Fast; insertion or access order"
  - "Sorted keys; O(log n)"
explain:
  - "HashMap is a plain hash table: O(1) average lookups, and no promise about the order keys come out in."
  - "LinkedHashMap is a HashMap that also links its entries in a list, so it iterates in insertion order, or in last-used order if you ask for access order."
  - "TreeMap keeps its keys in a red-black tree, a balanced sorted tree, so keys iterate sorted and it can find the nearest key to a value."
example: "Put the words pear, apple, fig into each map. A HashMap may print them in any order. A LinkedHashMap prints pear, apple, fig, the order they arrived. A TreeMap prints apple, fig, pear, sorted, and floorKey(\"banana\") returns apple."
rows:
  - { aspect: "Built on", a: "Hash table", b: "Hash table plus a linked list", c: "Red-black tree" }
  - { aspect: "get, put", a: "O(1) average", b: "O(1) average", c: "O(log n)" }
  - { aspect: "Iteration order", a: "Not defined", b: "Insertion, or access if chosen", c: "Sorted by key" }
  - { aspect: "Null key", a: "Allowed", b: "Allowed", c: "Throws with natural ordering" }
  - { aspect: "Extra powers", a: "None", b: "removeEldestEntry for caches", c: "floorKey, ceilingKey, headMap, tailMap" }
verdict: "Default to HashMap; LinkedHashMap when the order of arrival or use matters; TreeMap when keys must be sorted."
sayIt: "HashMap is the fastest and keeps no order. LinkedHashMap keeps insertion or access order at nearly the same speed, which makes it the base of an LRU cache. TreeMap keeps keys sorted at O(log n) and adds floor, ceiling and range queries."
