id: stack-vs-queue
tech: dsa
title: Stack vs Queue
compares: [stack, queue-and-deque]
gist:
  - "LIFO: the newest item leaves first"
  - "FIFO: the oldest item leaves first"
explain:
  - "A stack adds and removes at one end, the top, so the newest item always leaves first (LIFO). It solves problems where the latest unfinished item must be finished first, such as closing the most recently opened bracket."
  - "A queue adds at the tail and removes at the head, so the oldest item always leaves first (FIFO). It solves problems where items must be served in arrival order, such as tasks waiting for a worker."
example: "Push and offer 1, 2, 3 into each. The stack's pop returns 3, the item added last; the queue's poll returns 1, the item added first. Exploring a graph, a stack goes deep down one path first (DFS), while a queue visits all neighbours at distance 1 before any at distance 2 (BFS)."
diagrams:
  - |
    flowchart TB
      IN([push 3]) --> T["top: 3"] --> M[2] --> B[1]
      T --> OUT([pop gives 3])
  - |
    flowchart LR
      IN([offer 3]) --> T3[3] --> M2[2] --> H1["head: 1"] --> OUT([poll gives 1])
diagramAlt: "Stack: 1, 2 and 3 were pushed; 3 is on top, so pop returns 3. Queue: 1, 2 and 3 were offered at the tail; 1 is at the head, so poll returns 1."
rows:
  - { aspect: "Leaves first", a: "The newest item", b: "The oldest item" }
  - { aspect: "Ends used", a: "One: the top", b: "Two: add at the tail, remove at the head" }
  - { aspect: "Java methods", a: "Deque push, pop, peek", b: "Queue offer, poll, peek" }
  - { aspect: "Java class", a: "ArrayDeque", b: "ArrayDeque" }
  - { aspect: "Graph search", a: "DFS", b: "BFS" }
verdict: "Need the latest item first, as in nesting or backtracking? Stack. Need arrival order or level by level? Queue."
sayIt: "A stack is LIFO: one end, the newest item leaves first, so it fits nesting and DFS. A queue is FIFO: add at the tail, remove at the head, the oldest leaves first, so it fits arrival order and BFS. In Java I use ArrayDeque for both."
