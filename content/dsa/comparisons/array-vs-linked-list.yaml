id: array-vs-linked-list
tech: dsa
title: Array vs Linked List
compares: [arrays, linked-list]
gist:
  - "One block of memory: jump to any index"
  - "Nodes joined by links: walk to reach one"
explain:
  - "An array keeps its items side by side in one block of memory, so the place of item i is computed from i and read in O(1)."
  - "A linked list keeps each item in a separate node that holds a link to the next node, so items can be added or removed by changing links, without shifting anything."
example: "To read the 500th item, an array jumps straight to it, while a linked list follows 499 links from the head. To add an item at the front, a linked list changes one link, while an array shifts every item one slot right."
diagrams:
  - |
    flowchart LR
      A0["[0] 10"] --- A1["[1] 20"] --- A2["[2] 30"]
  - |
    flowchart LR
      H([head]) --> N1[10] --> N2[20] --> N3[30] --> X([null])
diagramAlt: "Array: the values 10, 20 and 30 sit side by side at indices 0, 1 and 2. Linked list: head points to node 10, which links to 20, then 30, then null."
rows:
  - { aspect: "Memory", a: "One contiguous block", b: "Separate nodes joined by links" }
  - { aspect: "Get the i-th item", a: "O(1)", b: "O(n): walk from the head" }
  - { aspect: "Insert or delete at the front", a: "O(n): shift the rest", b: "O(1)" }
  - { aspect: "Insert or delete in the middle", a: "O(n): shift the rest", b: "O(1) at a node you hold; O(n) to find it" }
  - { aspect: "Extra memory per item", a: "None", b: "One or two links per node" }
  - { aspect: "Looping speed in practice", a: "Fast: neighbours share the CPU cache", b: "Slower: nodes are scattered in memory" }
verdict: "Default to an array or ArrayList; pick a linked list when you insert and delete at nodes you already hold."
sayIt: "An array gives O(1) access by index and fast loops, but inserting at the front or middle shifts items, O(n). A linked list inserts or deletes in O(1) at a node you already hold, but reaching the i-th item is O(n). So I default to arrays and use linked lists for splicing at known nodes."
