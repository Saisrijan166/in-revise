id: array-vs-linked-list
tech: dsa
title: Array vs Linked List
compares: [arrays, linked-list]
gist:
  - "One block of memory: jump to any index"
  - "Nodes joined by links: walk to reach one"
diagrams:
  - |
    flowchart LR
      A0["[0] 10"] --- A1["[1] 20"] --- A2["[2] 30"]
  - |
    flowchart LR
      H([head]) --> N1[10] --> N2[20] --> N3[30] --> X([null])
diagramAlt: "Array: the values 10, 20 and 30 sit side by side at indices 0, 1 and 2. Linked list: head points to node 10, which links to 20, then 30, then null."
rows:
  - { aspect: "Memory", a: "One contiguous block", b: "Scattered nodes, joined by links" }
  - { aspect: "Get the i-th item", a: "O(1)", b: "O(n): walk from the head" }
  - { aspect: "Insert or delete at the front", a: "O(n): shift the rest", b: "O(1)" }
  - { aspect: "Insert or delete in the middle", a: "O(n): shift the rest", b: "O(1) at a held node; O(n) to find it" }
  - { aspect: "Extra memory", a: "None per item", b: "One or two links per node" }
  - { aspect: "Cache use", a: "Good: neighbours sit together", b: "Poor: nodes are scattered" }
verdict: "Default to an array or ArrayList; pick a linked list when you insert and delete at nodes you already hold."
sources:
  - title: "Linked Lists, chapter 3 (Open Data Structures, Morin)"
    url: "https://opendatastructures.org/ods-java/3_Linked_Lists.html"
    verifiedOn: "2026-10-19"
  - title: "SLList: a singly-linked list (Open Data Structures, Morin)"
    url: "https://opendatastructures.org/ods-java/3_1_SLList_Singly_Linked_Li.html"
    verifiedOn: "2026-10-19"
  - title: "Linked List vs Array (GeeksforGeeks)"
    url: "https://www.geeksforgeeks.org/dsa/linked-list-vs-array/"
    verifiedOn: "2026-10-19"
