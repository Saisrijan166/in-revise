id: memoisation-vs-tabulation
tech: dsa
title: Memoisation vs Tabulation
compares: [memoisation, tabulation]
gist:
  - "Top-down: the recursion plus a cache"
  - "Bottom-up: loops fill a table from the base cases"
explain:
  - "Memoisation keeps the plain recursive solution and adds a cache, such as an array or a HashMap. Before computing a state it checks the cache, so each state is computed once."
  - "Tabulation removes the recursion. Loops fill a table starting from the base cases, in an order where every state's inputs are already filled."
example: "Fibonacci. Memoised: fib(n) returns memo[n] if it is set, else computes fib(n - 1) + fib(n - 2) and stores it. Tabulated: dp[0] = 0, dp[1] = 1, then a loop sets dp[i] = dp[i - 1] + dp[i - 2] up to n. Both are O(n), but for a very large n only the loop is safe from a stack overflow."
rows:
  - { aspect: "Code style", a: "Recursive function with a cache", b: "Iterative loops over a table" }
  - { aspect: "Order of states", a: "Found by the recursion", b: "You choose it: base cases first" }
  - { aspect: "States computed", a: "Only the ones the recursion reaches", b: "Usually every state in the table" }
  - { aspect: "Overhead", a: "One call per state; a deep input can overflow the stack", b: "No recursion" }
  - { aspect: "Easier when", a: "You already have the brute-force recursion", b: "You want to keep only the last rows" }
verdict: "Start with memoisation to get the recurrence right; switch to tabulation for deep inputs or to save memory."
sayIt: "Both compute each state once and have the same Big-O. Memoisation is the recursion plus a cache, so it is quick to write and skips unneeded states. Tabulation fills a table with loops from the base cases, so it has no recursion depth limit and lets me keep only the last rows."
sources:
