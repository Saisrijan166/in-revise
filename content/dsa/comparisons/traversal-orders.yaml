id: traversal-orders
tech: dsa
title: "Preorder vs Inorder vs Postorder vs Level Order"
compares: [preorder-traversal, inorder-traversal, postorder-traversal, level-order-traversal]
gist:
  - "Node first, then left, then right"
  - "Left, then node, then right"
  - "Left, then right, then node last"
  - "Row by row from the root, using a queue"
explain:
  - "Preorder handles a node before either of its subtrees. You see every parent before its children, which suits passing information down or writing a tree out so it can be rebuilt (serialising)."
  - "Inorder handles a node between its left and right subtrees. In a binary search tree this lists the keys in sorted order."
  - "Postorder handles a node after both subtrees. The children's answers are ready first, which suits computing a height or a subtree size."
  - "Level order handles nodes row by row from the root, left to right, using a queue. It suits any answer that is per level."
example: "On the tree 8 (3 (1, 6), 10 (-, 14)): preorder gives 8 3 1 6 10 14, inorder gives 1 3 6 8 10 14, postorder gives 1 6 3 14 10 8, and level order gives 8, then 3 10, then 1 6 14. To compute every subtree's size, use postorder, because each node needs its children's sizes first."
rows:
  - { aspect: "Order", a: "N L R", b: "L N R", c: "L R N", d: "Level 0, 1, 2 ..." }
  - { aspect: "Kind", a: "DFS", b: "DFS", c: "DFS", d: "BFS" }
  - { aspect: "Helper", a: "Recursion or a stack", b: "Recursion or a stack", c: "Recursion or a stack", d: "A queue" }
  - { aspect: "Typical use", a: "Pass data down, serialise a tree", b: "Sorted keys from a BST", c: "Height, subtree size", d: "Per-level answers" }
verdict: "Need children's results first: postorder. Need sorted BST keys: inorder. Need rows: level order. Pass data down from the root: preorder."
sayIt: "Preorder, inorder and postorder are depth-first and differ only in when the node is handled: before, between or after its subtrees. Level order is breadth-first with a queue. Postorder for answers built from children, inorder for sorted BST keys, level order for per-level answers."
