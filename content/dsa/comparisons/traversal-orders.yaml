id: traversal-orders
tech: dsa
title: "Preorder vs Inorder vs Postorder vs Level Order"
compares: [preorder-traversal, inorder-traversal, postorder-traversal, level-order-traversal]
gist:
  - "Node first, then left, then right"
  - "Left, then node, then right"
  - "Left, then right, then node last"
  - "Row by row from the root, using a queue"
rows:
  - { aspect: "Order", a: "N L R", b: "L N R", c: "L R N", d: "Level 0, 1, 2 ..." }
  - { aspect: "Kind", a: "DFS", b: "DFS", c: "DFS", d: "BFS" }
  - { aspect: "Helper", a: "Recursion or a stack", b: "Recursion or a stack", c: "Recursion or a stack", d: "A queue" }
  - { aspect: "Typical use", a: "Copy or serialise a tree", b: "Sorted keys from a BST", c: "Height, size, delete a tree", d: "Per-level answers" }
verdict: "Need children's results first: postorder. Need sorted BST keys: inorder. Need rows: level order. Copy the shape: preorder."
sources:
  - title: "Competitive Programmer's Handbook, ch. 14 Tree algorithms (Laaksonen)"
    url: "https://cses.fi/book/book.pdf"
    verifiedOn: "2026-10-19"
  - title: "BinaryTree: traversals and breadth-first traversal (Open Data Structures, Java edition)"
    url: "https://opendatastructures.org/ods-java/6_1_BinaryTree_Basic_Binary.html"
    verifiedOn: "2026-10-19"
  - title: "Binary Search Trees: inorder gives keys in order (Algorithms, 4th Edition, Princeton)"
    url: "https://algs4.cs.princeton.edu/32bst/"
    verifiedOn: "2026-10-19"
