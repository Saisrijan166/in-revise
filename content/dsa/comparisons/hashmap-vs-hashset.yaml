id: hashmap-vs-hashset
tech: dsa
title: HashMap vs HashSet
compares: [java-hashmap, java-hashset]
gist:
  - "Unique keys, each with a value"
  - "Unique items, no values"
explain:
  - "A HashMap stores key-value pairs with unique keys, such as word → count. It answers \"what is stored for this key?\" in O(1) on average."
  - "A HashSet stores unique items with no values. It answers \"is this item here?\" in O(1) on average, and inside it is a HashMap whose keys are the items."
example: "To count how often each word appears, use a HashMap<String, Integer>: count.merge(w, 1, Integer::sum). To check whether a number appeared before, use a HashSet<Integer>: seen.add(x) returns false the second time."
rows:
  - { aspect: "Stores", a: "Key-value pairs", b: "Items only" }
  - { aspect: "Add", a: "put(k, v): returns the old value, or null", b: "add(x): returns false if x is already there" }
  - { aspect: "Look up", a: "get(k), containsKey(k)", b: "contains(x)" }
  - { aspect: "Inside", a: "A hash table of entries", b: "A HashMap whose keys are the items" }
  - { aspect: "Nulls", a: "One null key, many null values", b: "One null item" }
verdict: "Need a value per key, such as a count or an index? HashMap. Only need \"seen or not\"? HashSet."
sayIt: "A HashMap maps unique keys to values; a HashSet stores unique items only, as the keys of an inner HashMap. Both give O(1) average lookups and need correct equals and hashCode. I use a map for counts or positions and a set for \"seen before\" checks."
sources:
