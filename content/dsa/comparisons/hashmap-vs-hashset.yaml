id: hashmap-vs-hashset
tech: dsa
title: HashMap vs HashSet
compares: [java-hashmap, java-hashset]
gist:
  - "Unique keys, each with a value"
  - "Unique items, no values"
rows:
  - { aspect: "Add", a: "put(k, v): returns the old value or null", b: "add(x): returns false if already there" }
  - { aspect: "Look up", a: "get(k), containsKey(k)", b: "contains(x)" }
  - { aspect: "Inside", a: "Hash table of entries", b: "A HashMap whose keys are the items" }
  - { aspect: "Nulls", a: "One null key, many null values", b: "One null item" }
verdict: "Need a value per key (counts, positions)? HashMap. Only need 'seen or not'? HashSet."
sources:
  - title: "HashMap (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html"
    verifiedOn: "2026-10-19"
  - title: "HashSet (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashSet.html"
    verifiedOn: "2026-10-19"
