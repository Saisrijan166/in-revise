id: dijkstra-vs-bellman-ford
tech: dsa
title: Dijkstra vs Bellman-Ford
compares: [dijkstra, bellman-ford]
gist:
  - "Greedy: settle the closest vertex next, via a heap"
  - "Brute rounds: relax every edge, V - 1 times"
rows:
  - { aspect: "Edge weights", a: "Non-negative only", b: "Negative allowed" }
  - { aspect: "Negative cycle", a: "Not handled", b: "Detected by one extra round" }
  - { aspect: "Time", a: "O((V + E) log V) with a binary heap", b: "O(V·E)" }
  - { aspect: "Needs", a: "Adjacency lists and a min-heap", b: "Just an edge list" }
verdict: "Use Dijkstra when no weight is negative; switch to Bellman-Ford only for negative edges or to find a negative cycle."
sources:
