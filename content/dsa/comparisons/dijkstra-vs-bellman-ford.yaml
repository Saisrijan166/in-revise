id: dijkstra-vs-bellman-ford
tech: dsa
title: Dijkstra vs Bellman-Ford
compares: [dijkstra, bellman-ford]
gist:
  - "Greedy: settle the closest vertex next, via a heap"
  - "Brute rounds: relax every edge, V - 1 times"
explain:
  - "Dijkstra's algorithm finds the cheapest path from one start to every vertex by always settling the closest unsettled vertex, taken from a min-heap. It is fast, but needs every edge weight to be zero or more."
  - "Bellman-Ford finds the same answers by relaxing every edge in V - 1 rounds. It is slower, but it allows negative weights and can report a negative cycle."
example: "Edges A→B 2, A→C 3 and C→B -2, say a fare with a cashback. The cheapest A to B is A-C-B, cost 1. Classic Dijkstra settles B at 2, because B is closest, and never revisits it. Bellman-Ford relaxes all three edges in each round and finds 1."
rows:
  - { aspect: "Method", a: "Settle the closest vertex next", b: "Relax every edge, round after round" }
  - { aspect: "Edge weights", a: "Non-negative only", b: "Negative allowed" }
  - { aspect: "Negative cycle", a: "Not handled", b: "Detected by one extra round" }
  - { aspect: "Time", a: "O((V + E) log V) with a binary heap", b: "O(V·E)" }
  - { aspect: "Needs", a: "Adjacency lists and a min-heap", b: "Just an edge list" }
verdict: "Use Dijkstra when no weight is negative; switch to Bellman-Ford only for negative edges or to find a negative cycle."
sayIt: "Dijkstra is O((V + E) log V) with a heap but needs non-negative weights, because it treats a polled vertex as final. Bellman-Ford is O(V·E) but handles negative weights, and a round after V - 1 that still improves a distance proves a negative cycle."
