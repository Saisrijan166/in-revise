id: two-pointers-vs-sliding-window
tech: dsa
title: Two Pointers vs Sliding Window
compares: [two-pointers, sliding-window]
gist:
  - "Two indices move by a rule: from both ends, read/write, two arrays"
  - "Two indices bound one contiguous range, the window"
explain:
  - "Two pointers keeps two indices and moves one of them per step by a rule, so you avoid checking every pair. In a sorted array they start at both ends and close in on a pair with a target sum."
  - "A sliding window keeps two indices that both move forward. The items between them are the window, and a running sum or counts describe it, so you find the best contiguous range in one pass."
example: "nums = [2, 7, 11, 15]. 'Find two values that add up to 9' is two pointers: start at 2 and 15, move inward, and stop at 2 + 7. 'Find the longest run of items whose sum is at most 20' is a sliding window: grow it over 2, 7, 11 (sum 20), then shrink from the left when 15 arrives."
rows:
  - { aspect: "Pointers move", a: "Toward each other, or the same way", b: "The same way; left never passes right" }
  - { aspect: "Usually needs", a: "Sorted data, for the pair version", b: "A contiguous range and a rule that shrinking fixes" }
  - { aspect: "What it remembers", a: "Only the two values it points at", b: "A summary of the window, such as a sum or counts" }
  - { aspect: "Typical question", a: "Pair sum, palindrome, in-place removal", b: "Longest or shortest subarray or substring" }
  - { aspect: "Cost", a: "O(n) time, O(1) space", b: "O(n) time, plus space for the window's summary" }
verdict: "A pair or an in-place rewrite of an array: two pointers. The best contiguous range: a sliding window."
sayIt: "A sliding window is a kind of two pointers. Two pointers is any two indices moving by a rule, often from both ends to find a pair in sorted data. A sliding window moves both forward and measures the range between them, for the longest or shortest subarray."
