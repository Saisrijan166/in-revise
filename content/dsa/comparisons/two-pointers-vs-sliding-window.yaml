id: two-pointers-vs-sliding-window
tech: dsa
title: Two Pointers vs Sliding Window
compares: [two-pointers, sliding-window]
gist:
  - "Two indices anywhere: both ends, read/write, two arrays"
  - "Two indices that bound one contiguous range"
rows:
  - { aspect: "Pointers move", a: "Toward each other, or the same way", b: "Same way; left never passes right" }
  - { aspect: "Usually needs", a: "Sorted data (pair version)", b: "A contiguous range and a rule to check" }
  - { aspect: "Remembers", a: "Only the two values", b: "Window state: a sum or counts" }
  - { aspect: "Typical ask", a: "Pair sum, palindrome, in-place removal", b: "Longest or shortest subarray or substring" }
  - { aspect: "Cost", a: "O(n) time, O(1) space", b: "O(n) time, plus space for the window state" }
verdict: "A pair or in-place rewrite on an array: two pointers. The best contiguous range: sliding window."
