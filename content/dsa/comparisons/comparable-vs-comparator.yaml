id: comparable-vs-comparator
tech: dsa
title: Comparable vs Comparator
compares: [comparable, comparator]
gist:
  - "Inside the class: its one natural order"
  - "Outside the class: any order you pass in"
explain:
  - "Comparable is an interface a class implements to give itself one natural order. Its compareTo method returns a negative number, zero or a positive number, and sorting or a TreeMap then uses that order with no extra code."
  - "Comparator is a separate object, usually a lambda, whose compare method orders two objects. You pass it to a sort or a PriorityQueue when you need a different order, or when the class is not yours to change."
example: "Employee implements Comparable by id, so Collections.sort(list) puts ids 1, 2, 3 in order. For a salary report you pass list.sort(Comparator.comparingInt(Employee::salary).reversed()) and get the highest salary first, without touching the Employee class."
rows:
  - { aspect: "Package", a: "java.lang", b: "java.util" }
  - { aspect: "Method", a: "compareTo(T o)", b: "compare(T o1, T o2)" }
  - { aspect: "Written in", a: "The class itself (implements Comparable)", b: "A separate object, usually a lambda" }
  - { aspect: "Orders per class", a: "One", b: "As many as you need" }
  - { aspect: "Used by", a: "Collections.sort(list), new TreeMap<>()", b: "list.sort(cmp), new PriorityQueue<>(cmp)" }
verdict: "Implement Comparable for the one obvious order; pass a Comparator for any other order or for classes you cannot edit."
sayIt: "Comparable lives in the class: compareTo gives its one natural order, used by Collections.sort and TreeMap. A Comparator is passed in from outside, so I can sort the same class many ways, such as Comparator.comparingInt(Employee::salary).reversed()."
