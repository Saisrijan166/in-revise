id: comparable-vs-comparator
tech: dsa
title: Comparable vs Comparator
compares: [comparable, comparator]
gist:
  - "Inside the class: its one natural order"
  - "Outside the class: any order you pass in"
rows:
  - { aspect: "Package", a: "java.lang", b: "java.util" }
  - { aspect: "Method", a: "compareTo(T o)", b: "compare(T o1, T o2)" }
  - { aspect: "Written in", a: "The class itself (implements Comparable)", b: "A separate object, usually a lambda" }
  - { aspect: "Orders per class", a: "One", b: "As many as you need" }
  - { aspect: "Used by", a: "Collections.sort(list), new TreeMap<>()", b: "list.sort(cmp), new PriorityQueue<>(cmp)" }
verdict: "Implement Comparable for the one obvious order; pass a Comparator for any other order or for classes you cannot edit."
sources:
  - title: "Comparable (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Comparable.html"
    verifiedOn: "2026-10-19"
  - title: "Comparator (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Comparator.html"
    verifiedOn: "2026-10-19"
  - title: "PriorityQueue (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/PriorityQueue.html"
    verifiedOn: "2026-10-19"
