id: binary-tree-vs-bst
tech: dsa
title: "Binary Tree vs Binary Search Tree"
compares: [binary-tree, binary-search-tree]
gist:
  - "Shape rule only: at most two children"
  - "Shape rule plus order: left < node < right"
diagrams:
  - |
    flowchart TD
      A((5)) --> B((9))
      A --> C((2))
  - |
    flowchart TD
      A((5)) --> B((2))
      A --> C((9))
diagramAlt: "Binary tree: root 5 with left child 9 and right child 2, no order rule. BST: root 5 with left child 2, smaller, and right child 9, larger."
rows:
  - { aspect: "Rule", a: "At most two children", b: "Also: left subtree < node < right subtree" }
  - { aspect: "Find a key", a: "O(n): check every node", b: "O(h): go one way at each node" }
  - { aspect: "Inorder walk", a: "No special order", b: "Keys in sorted order" }
  - { aspect: "Relation", a: "The general shape", b: "A binary tree that also keeps order" }
verdict: "Say binary tree for the shape; say BST only when the left-smaller, right-larger order holds for every subtree."
sources:
  - title: "Binary Search Trees (Algorithms, 4th Edition, Princeton)"
    url: "https://algs4.cs.princeton.edu/32bst/"
    verifiedOn: "2026-10-19"
  - title: "Lecture 6: Binary Trees I (MIT 6.006, Spring 2020)"
    url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec6/"
    verifiedOn: "2026-10-19"
