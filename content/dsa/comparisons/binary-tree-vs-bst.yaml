id: binary-tree-vs-bst
tech: dsa
title: "Binary Tree vs Binary Search Tree"
compares: [binary-tree, binary-search-tree]
gist:
  - "Shape rule only: at most two children"
  - "Shape rule plus order: left < node < right"
explain:
  - "A binary tree is any tree where each node has at most two children, left and right. It describes only the shape, so it can hold a hierarchy, an expression or any data with no order between the keys."
  - "A binary search tree is a binary tree with an order rule: every key in a node's left subtree is smaller and every key in its right subtree is larger. The rule lets a search skip one side at each node."
example: "The tree 5 with children 9 (left) and 2 (right) is a binary tree, but not a BST, because 9 is on the left and larger than 5. Searching it for 2 may mean checking every node. Swap the two children and it becomes a BST: a search for 2 goes left once and stops."
diagrams:
  - |
    flowchart TD
      A((5)) --> B((9))
      A --> C((2))
  - |
    flowchart TD
      A((5)) --> B((2))
      A --> C((9))
diagramAlt: "Binary tree: root 5 with left child 9 and right child 2, no order rule. BST: root 5 with left child 2, smaller, and right child 9, larger."
rows:
  - { aspect: "Rule", a: "At most two children", b: "Also: left subtree < node < right subtree" }
  - { aspect: "Find a key", a: "O(n): check every node", b: "O(h): go one way at each node" }
  - { aspect: "Inorder walk", a: "No special order", b: "Keys in sorted order" }
  - { aspect: "Relation", a: "The general shape", b: "A binary tree that also keeps order" }
verdict: "Say binary tree for the shape; say BST only when the left-smaller, right-larger order holds for every subtree."
sayIt: "A binary tree only limits each node to two children. A BST adds an order rule, left subtree smaller and right subtree larger for every node, so search, insert and delete walk one path in O(height), and an inorder walk gives sorted keys."
sources:
