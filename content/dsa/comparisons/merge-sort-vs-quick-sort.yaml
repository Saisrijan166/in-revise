id: merge-sort-vs-quick-sort
tech: dsa
title: Merge Sort vs Quick Sort
compares: [merge-sort, quick-sort]
gist:
  - "Split at the middle, then merge: work after recursing"
  - "Partition around a pivot: work before recursing"
explain:
  - "Merge sort splits the array at the middle index, sorts both halves recursively, then merges them. The real work happens in the merge, after the recursive calls."
  - "Quick sort partitions the array around a pivot, smaller items before it and the rest after it, then sorts both sides. The real work happens in the partition, before the recursive calls."
example: "Sorting [15, 2, 11, 7]: merge sort splits by position into [15, 2] and [11, 7], sorts them to [2, 15] and [7, 11], then merges. Quick sort with pivot 7 partitions to [2, 7, 11, 15]; 7 is already in its final place, and only [2] and [11, 15] remain."
rows:
  - { aspect: "Worst case", a: "O(n log n)", b: "O(n²) with bad pivots" }
  - { aspect: "Average", a: "O(n log n)", b: "O(n log n), usually faster in practice" }
  - { aspect: "Extra space", a: "O(n) helper array", b: "O(log n) stack on average, in place" }
  - { aspect: "Stable", a: "Yes", b: "No" }
  - { aspect: "Best fit", a: "Linked lists, stable sorting of objects", b: "Arrays of primitives, speed" }
verdict: "Need stability or a guaranteed bound: merge sort. Sorting an array in place, fast: quick sort with a random pivot."
sayIt: "Both are O(n log n) on average. Merge sort guarantees it and is stable, but needs O(n) extra space on arrays. Quick sort is in place and usually faster, but not stable and O(n²) with bad pivots, so I pick a random pivot."
sources:
