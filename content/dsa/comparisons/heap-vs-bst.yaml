id: heap-vs-bst
tech: dsa
title: "Heap vs Binary Search Tree"
compares: [heap-priority-queue, binary-search-tree]
gist:
  - "Parent beats children: only the top is known"
  - "Left < node < right: everything is in order"
rows:
  - { aspect: "Order kept", a: "Parent ≤ children (min-heap)", b: "Left subtree < node < right subtree" }
  - { aspect: "Get min", a: "O(1) peek", b: "O(h): walk left" }
  - { aspect: "Find any key", a: "O(n)", b: "O(h)" }
  - { aspect: "Sorted walk, floor, ceiling", a: "No", b: "Yes" }
  - { aspect: "Build from n items", a: "O(n)", b: "O(n log n): n inserts, kept balanced" }
  - { aspect: "Stored as", a: "An array, no pointers", b: "Nodes with left and right links" }
verdict: "Need only the next min or max: heap (PriorityQueue). Need search, order or ranges: balanced BST (TreeMap)."
sources:
  - title: "Lecture 8: Binary Heaps (MIT 6.006, Spring 2020)"
    url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec8/"
    verifiedOn: "2026-10-19"
