id: heap-vs-bst
tech: dsa
title: "Heap vs Binary Search Tree"
compares: [heap-priority-queue, binary-search-tree]
gist:
  - "Parent beats children: only the top is known"
  - "Left < node < right: everything is in order"
explain:
  - "A heap is a complete binary tree where every parent comes before its children, smaller in a min-heap. It solves one problem: always knowing the minimum, or maximum, while items keep arriving."
  - "A binary search tree keeps every left subtree smaller and every right subtree larger than its node. It solves search by key and ordered questions: sorted order, the next larger key, keys in a range."
example: "A task scheduler always runs the most urgent task next, so a heap fits: peek is O(1) and poll is O(log n). A booking system must find the first free slot at or after 10:30, so it needs a balanced BST such as TreeMap with ceilingKey, which a heap cannot answer without checking every item."
rows:
  - { aspect: "Order kept", a: "Parent ≤ children (min-heap)", b: "Left subtree < node < right subtree" }
  - { aspect: "Get min", a: "O(1) peek", b: "O(h): walk left" }
  - { aspect: "Find any key", a: "O(n)", b: "O(h)" }
  - { aspect: "Sorted walk, floor, ceiling", a: "No", b: "Yes" }
  - { aspect: "Build from n items", a: "O(n)", b: "O(n log n): n inserts, kept balanced" }
  - { aspect: "Stored as", a: "An array, no pointers", b: "Nodes with left and right links" }
verdict: "Need only the next min or max: heap (PriorityQueue). Need search, order or ranges: balanced BST (TreeMap)."
sayIt: "A heap only keeps the min or max on top, so peek is O(1) and offer and poll are O(log n), but finding any other key is O(n). A balanced BST keeps full order, so search, floor, ceiling and sorted walks are O(log n). Only the next min or max: heap; anything ordered: BST."
