sources:
  - { title: "Algorithms, 4th Edition: Analysis of Algorithms (Princeton)", url: "https://algs4.cs.princeton.edu/14analysis/", verifiedOn: "2026-10-17" }
  - { title: "Java Collections Framework (Java SE 26)", url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/package-summary.html", verifiedOn: "2026-10-17" }
  - { title: "Algorithms, 4th Edition: Searching (Princeton)", url: "https://algs4.cs.princeton.edu/30fundamentals/", verifiedOn: "2026-10-17" }
topics:
  foundations-patterns:
    - id: complexity
      children:
        - { id: big-o, label: "Big-O", note: "How work grows as input size grows" }
        - { id: space-complexity, label: "Space complexity", note: "Extra memory used beyond the input" }
        - { id: amortised-analysis, label: "Amortised cost", note: "Average cost across a sequence of operations" }
    - id: java-dsa-toolkit
      children:
        - { id: arraylist, label: "ArrayList", note: "Resizable indexed list" }
        - { id: hash-map, label: "HashMap", note: "Key to value lookup table" }
        - { id: hash-set, label: "HashSet", note: "Set of unique values" }
        - { id: array-deque, label: "ArrayDeque", note: "Double-ended queue for stack or queue work" }
        - { id: priority-queue, label: "PriorityQueue", note: "Heap-backed queue whose head is least by default" }
    - id: pattern-recognition
      children:
        - { id: constraint-clue, label: "Constraint clue", note: "Input size often rules out slow approaches" }
        - { id: invariant, label: "Invariant", note: "A fact kept true after every loop step" }
    - id: arrays-and-strings
      children:
        - { id: index-scan, label: "Index scan", note: "Visit each position once when local state is enough" }
        - { id: frequency-count, label: "Frequency count", note: "Count values to answer duplicate or anagram questions" }
    - id: hash-map-and-set
      children:
        - { id: complement-lookup, label: "Complement lookup", note: "Store what was seen; ask whether its partner exists" }
        - { id: seen-set, label: "Seen set", note: "Remember membership instead of scanning again" }
    - id: two-pointers
      children:
        - { id: opposite-ends, label: "Opposite ends", note: "Move the end that can improve the answer" }
        - { id: fast-slow, label: "Fast and slow", note: "Two speeds expose a list cycle or middle" }
    - id: sliding-window
      children:
        - { id: fixed-window, label: "Fixed window", note: "Add one item and remove one item each move" }
        - { id: variable-window, label: "Variable window", note: "Grow right; shrink left until valid" }
    - id: prefix-sum
      children:
        - { id: running-sum, label: "Running sum", note: "Prefix i stores the total before or through i" }
        - { id: remainder-map, label: "Remainder map", note: "Equal remainders make a divisible subarray" }
    - id: sorting-and-binary-search
      children:
        - { id: sorted-invariant, label: "Sorted invariant", note: "A sorted range lets each comparison discard half" }
        - { id: answer-space-search, label: "Answer-space search", note: "Binary search a monotonic feasible answer" }
    - id: interview-solution-workflow
      children:
        - { id: dry-run, label: "Dry run", note: "Trace a tiny normal case and edge cases" }
        - { id: boundary-check, label: "Boundary check", note: "Check empty input, one item, and end indices" }
