sources:
  - { title: "Algorithms, 4th Edition (Princeton)", url: "https://algs4.cs.princeton.edu/home/", verifiedOn: "2026-10-17" }
  - { title: "Java Collections Framework (Java SE 26)", url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/package-summary.html", verifiedOn: "2026-10-17" }
topics:
  java-prerequisites:
    - { id: java-basics, children: [{ id: primitive-type, label: "Primitive type", note: "A value such as int, long, double or boolean" }, { id: variable, label: "Variable", note: "Named storage with a declared type" }] }
    - { id: input-output, children: [{ id: scanner, label: "Scanner", note: "Reads formatted values from an input source" }, { id: buffered-reader, label: "BufferedReader", note: "Reads text efficiently through a buffer" }] }
    - { id: control-flow, children: [{ id: conditional, label: "Conditional", note: "Chooses a branch from a boolean condition" }, { id: loop, label: "Loop", note: "Repeats work while a condition holds" }] }
    - { id: methods, children: [{ id: parameter, label: "Parameter", note: "Named input of a method" }, { id: return-value, label: "Return value", note: "Result sent back by a method" }] }
    - { id: java-oop, children: [{ id: class, label: "Class", note: "Blueprint for state and behaviour" }, { id: object, label: "Object", note: "Instance created from a class" }] }
  foundations-patterns:
    - { id: complexity, children: [{ id: big-o, label: "Big-O", note: "How work grows with input size" }, { id: space-complexity, label: "Space complexity", note: "Extra memory beyond the input" }] }
    - { id: java-dsa-toolkit, children: [{ id: arraylist, label: "ArrayList", note: "Resizable indexed list" }, { id: array-deque, label: "ArrayDeque", note: "Double-ended queue" }, { id: priority-queue, label: "PriorityQueue", note: "Heap-backed priority queue" }] }
    - { id: arrays-and-strings, children: [{ id: array, label: "Array", note: "Fixed-size indexed sequence" }, { id: string, label: "String", note: "Immutable character sequence" }, { id: string-builder, label: "StringBuilder", note: "Mutable character buffer" }] }
    - { id: two-dimensional-arrays, children: [{ id: matrix, label: "Matrix", note: "Array indexed by row and column" }, { id: jagged-array, label: "Jagged array", note: "Rows may have different lengths" }] }
    - { id: strings-and-stringbuilder, children: [{ id: char-array, label: "Character array", note: "Mutable indexed characters" }, { id: substring, label: "Substring", note: "Part of a string selected by index range" }] }
    - { id: bit-manipulation, children: [{ id: bitwise-and, label: "Bitwise AND", note: "One only where both input bits are one" }, { id: bitwise-xor, label: "Bitwise XOR", note: "One where input bits differ" }] }
    - { id: hash-map-and-set, children: [{ id: hash-map, label: "HashMap", note: "Key to value mapping" }, { id: hash-set, label: "HashSet", note: "Unique values" }, { id: collision, label: "Collision", note: "Two keys reach one bucket" }] }
  linear-structures:
    - { id: linked-lists, children: [{ id: singly-linked-list, label: "Singly linked list", note: "Node points to next" }, { id: doubly-linked-list, label: "Doubly linked list", note: "Node points both directions" }, { id: circular-linked-list, label: "Circular linked list", note: "Tail links back to head" }] }
    - { id: stacks, children: [{ id: array-stack, label: "Array stack", note: "Top index tracks last item" }, { id: linked-stack, label: "Linked stack", note: "Head node is the top" }] }
    - { id: queues-and-deques, children: [{ id: linear-queue, label: "Linear queue", note: "Front removes and rear inserts" }, { id: circular-queue, label: "Circular queue", note: "Indices wrap around an array" }, { id: deque, label: "Deque", note: "Both ends can add and remove" }] }
  recursion-sorting:
    - { id: recursion, children: [{ id: base-case, label: "Base case", note: "Smallest case returns directly" }, { id: recursive-case, label: "Recursive case", note: "Moves input towards base case" }] }
    - { id: backtracking, children: [{ id: choice, label: "Choice", note: "One candidate step in a partial solution" }, { id: undo, label: "Undo", note: "Restore state after exploring a choice" }] }
    - { id: sorting-and-binary-search, children: [{ id: linear-search, label: "Linear search", note: "Check one value at a time" }, { id: binary-search, label: "Binary search", note: "Discard half a sorted range" }] }
    - { id: sorting, children: [{ id: bubble-sort, label: "Bubble sort", note: "Swap adjacent out-of-order values" }, { id: selection-sort, label: "Selection sort", note: "Select next smallest value" }, { id: insertion-sort, label: "Insertion sort", note: "Insert into sorted prefix" }] }
    - { id: merge-sort, children: [{ id: divide-and-conquer, label: "Divide and conquer", note: "Split, solve, then merge" }] }
    - { id: quicksort, children: [{ id: partition, label: "Partition", note: "Pivot separates smaller and larger values" }] }
  trees-heaps:
    - { id: tree-basics, children: [{ id: root, label: "Root", note: "Top node with no parent" }, { id: leaf, label: "Leaf", note: "Node with no children" }, { id: binary-tree, label: "Binary tree", note: "At most two children" }] }
    - { id: tree-traversal, children: [{ id: preorder, label: "Pre-order", note: "Node, left, right" }, { id: inorder, label: "In-order", note: "Left, node, right" }, { id: postorder, label: "Post-order", note: "Left, right, node" }, { id: level-order, label: "Level order", note: "Visit one depth at a time" }] }
    - { id: binary-search-tree, children: [{ id: bst-order, label: "BST property", note: "Left keys smaller; right keys larger" }, { id: balanced-tree, label: "Balanced tree", note: "Height stays near logarithmic" }] }
    - { id: heap, children: [{ id: min-heap, label: "Min-heap", note: "Parent is no greater than child" }, { id: max-heap, label: "Max-heap", note: "Parent is no less than child" }] }
    - { id: trie, children: [{ id: trie-node, label: "Trie node", note: "Character and child links" }, { id: word-end, label: "Word end", note: "Marks a complete word" }] }
  graphs:
    - { id: graph-basics, children: [{ id: vertex, label: "Vertex", note: "Graph item" }, { id: edge, label: "Edge", note: "Connection" }, { id: adjacency-list, label: "Adjacency list", note: "Neighbours per vertex" }, { id: adjacency-matrix, label: "Adjacency matrix", note: "Table indexed by vertex pair" }] }
    - { id: breadth-first-search, children: [{ id: bfs-queue, label: "BFS queue", note: "Processes discovery order" }] }
    - { id: depth-first-search, children: [{ id: dfs-recursion, label: "DFS recursion", note: "Explore path then backtrack" }] }
    - { id: shortest-path, children: [{ id: dijkstra, label: "Dijkstra", note: "Non-negative weighted shortest paths" }] }
