sources:
  - { title: "Algorithms, 4th Edition: Analysis of Algorithms (Princeton)", url: "https://algs4.cs.princeton.edu/14analysis/", verifiedOn: "2026-10-17" }
  - { title: "Java Collections Framework (Java SE 26)", url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/package-summary.html", verifiedOn: "2026-10-17" }
  - { title: "Algorithms, 4th Edition: Searching (Princeton)", url: "https://algs4.cs.princeton.edu/30fundamentals/", verifiedOn: "2026-10-17" }
topics:
  foundations-patterns:
    - id: complexity
      children:
        - { id: big-o, label: "Big-O", note: "How work grows as input size grows" }
        - { id: space-complexity, label: "Space complexity", note: "Extra memory used beyond the input" }
        - { id: amortised-analysis, label: "Amortised cost", note: "Average cost across a sequence of operations" }
    - id: java-dsa-toolkit
      children:
        - { id: arraylist, label: "ArrayList", note: "Resizable indexed list" }
        - { id: hash-map, label: "HashMap", note: "Key to value lookup table" }
        - { id: hash-set, label: "HashSet", note: "Set of unique values" }
        - { id: array-deque, label: "ArrayDeque", note: "Double-ended queue for stack or queue work" }
        - { id: priority-queue, label: "PriorityQueue", note: "Heap-backed queue whose head is least by default" }
    - id: pattern-recognition
      children:
        - { id: constraint-clue, label: "Constraint clue", note: "Input size often rules out slow approaches" }
        - { id: invariant, label: "Invariant", note: "A fact kept true after every loop step" }
    - id: arrays-and-strings
      children:
        - { id: index-scan, label: "Index scan", note: "Visit each position once when local state is enough" }
        - { id: frequency-count, label: "Frequency count", note: "Count values to answer duplicate or anagram questions" }
    - id: hash-map-and-set
      children:
        - { id: complement-lookup, label: "Complement lookup", note: "Store what was seen; ask whether its partner exists" }
        - { id: seen-set, label: "Seen set", note: "Remember membership instead of scanning again" }
    - id: two-pointers
      children:
        - { id: opposite-ends, label: "Opposite ends", note: "Move the end that can improve the answer" }
        - { id: fast-slow, label: "Fast and slow", note: "Two speeds expose a list cycle or middle" }
    - id: sliding-window
      children:
        - { id: fixed-window, label: "Fixed window", note: "Add one item and remove one item each move" }
        - { id: variable-window, label: "Variable window", note: "Grow right; shrink left until valid" }
    - id: prefix-sum
      children:
        - { id: running-sum, label: "Running sum", note: "Prefix i stores the total before or through i" }
        - { id: remainder-map, label: "Remainder map", note: "Equal remainders make a divisible subarray" }
    - id: sorting-and-binary-search
      children:
        - { id: sorted-invariant, label: "Sorted invariant", note: "A sorted range lets each comparison discard half" }
        - { id: answer-space-search, label: "Answer-space search", note: "Binary search a monotonic feasible answer" }
    - id: interview-solution-workflow
      children:
        - { id: dry-run, label: "Dry run", note: "Trace a tiny normal case and edge cases" }
        - { id: boundary-check, label: "Boundary check", note: "Check empty input, one item, and end indices" }
  linear-structures:
    - { id: linked-lists, children: [{ id: singly-linked-list, label: "Singly linked list", note: "Each node points to its next node" }, { id: doubly-linked-list, label: "Doubly linked list", note: "Each node also points back to its previous node" }] }
    - { id: linked-list-patterns, children: [{ id: dummy-node, label: "Dummy node", note: "A safe fixed node before the real head" }, { id: pointer-rewire, label: "Pointer rewiring", note: "Save next before changing a node link" }] }
    - { id: stacks, children: [{ id: lifo, label: "LIFO", note: "Last added item is removed first" }, { id: matching-brackets, label: "Matching brackets", note: "Push opens and pop matching closes" }] }
    - { id: queues-and-deques, children: [{ id: fifo, label: "FIFO", note: "First added item is removed first" }, { id: deque, label: "Deque", note: "Add or remove at either end" }] }
  recursion-sorting:
    - { id: recursion, children: [{ id: base-case, label: "Base case", note: "The smallest input that returns directly" }, { id: call-stack, label: "Call stack", note: "Pending recursive calls stored by the runtime" }] }
    - { id: sorting, children: [{ id: stable-sort, label: "Stable sort", note: "Equal items retain their previous order" }, { id: in-place-sort, label: "In-place sort", note: "Rearranges values using little extra memory" }] }
    - { id: merge-sort, children: [{ id: divide-and-conquer, label: "Divide and conquer", note: "Split, solve parts, then combine" }] }
    - { id: quicksort, children: [{ id: partition, label: "Partition", note: "Place a pivot with smaller and larger sides" }] }
  trees-heaps:
    - { id: tree-basics, children: [{ id: root, label: "Root", note: "The tree's top node" }, { id: leaf, label: "Leaf", note: "A node with no children" }] }
    - { id: tree-traversal, children: [{ id: inorder, label: "In-order", note: "Left, node, right" }, { id: preorder, label: "Pre-order", note: "Node, left, right" }, { id: postorder, label: "Post-order", note: "Left, right, node" }] }
    - { id: binary-search-tree, children: [{ id: bst-order, label: "BST order", note: "Left keys are smaller and right keys are larger" }] }
    - { id: heap, children: [{ id: min-heap, label: "Min-heap", note: "Parent is no greater than each child" }, { id: max-heap, label: "Max-heap", note: "Parent is no less than each child" }] }
    - { id: trie, children: [{ id: prefix, label: "Prefix", note: "Starting sequence shared by several words" }] }
  graphs:
    - { id: graph-basics, children: [{ id: adjacency-list, label: "Adjacency list", note: "Neighbours stored for each vertex" }, { id: directed-graph, label: "Directed graph", note: "Each edge has a direction" }] }
    - { id: breadth-first-search, children: [{ id: level-order, label: "Level order", note: "Visit all nodes one edge away before the next level" }] }
    - { id: depth-first-search, children: [{ id: visited-set, label: "Visited set", note: "Marks explored vertices to stop cycles repeating" }] }
    - { id: topological-sort, children: [{ id: indegree, label: "In-degree", note: "Number of edges entering a vertex" }] }
    - { id: shortest-path, children: [{ id: dijkstra, label: "Dijkstra", note: "Repeatedly finalises the closest unvisited path with non-negative edges" }] }
    - { id: union-find, children: [{ id: disjoint-set, label: "Disjoint set", note: "Groups elements by connected component" }] }
  advanced-patterns:
    - { id: backtracking, children: [{ id: choose-explore-unchoose, label: "Choose, explore, unchoose", note: "Try a choice then restore state for the next choice" }] }
    - { id: dynamic-programming, children: [{ id: overlapping-subproblems, label: "Overlapping subproblems", note: "The same smaller result is needed repeatedly" }] }
    - { id: dp-one-dimensional, children: [{ id: state-transition, label: "State transition", note: "Rule that builds a state from earlier states" }] }
    - { id: dp-two-dimensional, children: [{ id: grid-dp, label: "Grid DP", note: "A row and column describe a pair of subproblems" }] }
    - { id: greedy, children: [{ id: local-choice, label: "Local choice", note: "Choose the best immediate option with a proof it stays safe" }] }
    - { id: intervals, children: [{ id: merge-intervals, label: "Merge intervals", note: "Combine overlapping ranges after sorting by start" }] }
    - { id: monotonic-stack, children: [{ id: monotonic, label: "Monotonic", note: "Values stay increasing or decreasing in the stack" }] }
    - { id: heap-patterns, children: [{ id: top-k, label: "Top K", note: "Keep only the best K values in a bounded heap" }] }
    - { id: bit-manipulation, children: [{ id: xor, label: "XOR", note: "Equal bits cancel when XORed twice" }] }
    - { id: modular-arithmetic, children: [{ id: remainder, label: "Remainder", note: "Value left after integer division" }] }
    - { id: string-patterns, children: [{ id: character-count, label: "Character count", note: "Frequency state for characters in a string" }] }
