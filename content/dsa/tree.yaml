topics:
  foundations:
    - id: data-structures
      children:
        - id: linear-data-structures
          label: Linear data structures
          note: "Items in one sequence: array, linked list, stack, queue"
        - id: non-linear-data-structures
          label: Non-linear data structures
          note: "Items branch to many others: tree, heap, graph"
        - id: hash-based-data-structures
          label: Hash-based data structures
          note: "A hash function maps each key to a slot: HashMap, HashSet"
        - id: static-data-structure
          label: Static data structure
          note: "Size fixed at creation: a Java array's length never changes"
        - id: dynamic-data-structure
          label: Dynamic data structure
          note: "Grows while running: ArrayList is a resizable array"
        - id: abstract-data-type
          label: Abstract data type (ADT)
          note: The operations and their meaning, with no storage details
    - id: big-o
      children:
        - id: time-complexity
          label: Time complexity
          note: How the number of steps grows with input size n
        - id: space-complexity
          label: Space complexity
          note: All memory used, input included
          children:
            - id: auxiliary-space
              label: Auxiliary space
              note: Only the extra memory the algorithm adds
        - id: running-time-guarantees
          label: Worst, expected and amortised cost
          note: Three kinds of guarantee for an operation's cost
          children:
            - id: worst-case-time
              label: Worst case
              note: "Strongest: no single call ever takes longer"
            - id: expected-time
              label: Expected case
              note: Average over the algorithm's random choices
            - id: amortised-cost
              label: Amortised cost
              note: Average per operation over a long run; one call may be slow
        - id: asymptotic-bounds
          label: Big-O, Big-Omega, Big-Theta
          note: Upper, lower and tight bounds on growth
        - id: logarithmic-time
          label: O(log n)
          note: "Halve each step: log₂ n halvings take n down to 1"
    - id: java-collections
      children:
        - id: java-collection-interface
          label: Collection
          term: java-collection
          note: Root interface for groups of single elements
          children:
            - id: java-list-interface
              label: List
              note: "Ordered by position, duplicates allowed: ArrayList, LinkedList"
            - id: java-set-interface
              label: Set
              note: "No duplicate elements: HashSet, LinkedHashSet, TreeSet"
            - id: java-queue-interface
              label: Queue
              note: "Holds elements before processing: PriorityQueue"
              children:
                - id: java-deque-interface
                  label: Deque
                  note: "Add and remove at both ends: ArrayDeque, LinkedList"
            - id: sequenced-collection
              label: SequencedCollection (Java 21)
              note: "Defined order: getFirst, getLast, reversed on List, Deque"
        - id: java-map-interface
          label: Map
          term: java-map
          note: Unique keys to values; its own root, not a Collection
        - id: utility-classes
          label: Collections and Arrays classes
          note: "Static helpers: Collections for collections, Arrays for arrays"
        - id: comparable
          label: Comparable
          note: compareTo gives a class its natural ordering
        - id: comparator
          label: Comparator
          note: A separate compare function, often built with Comparator.comparing
        - id: autoboxing
          label: Autoboxing
          note: Automatic int to Integer conversion, and unboxing back
  arrays-hashing:
    - id: arrays
      children:
        - id: array-2d
          label: 2D array (matrix)
          note: "An array of row arrays: grid[row][col]"
        - id: jagged-array
          label: Jagged array
          note: Rows of different lengths, e.g. new int[3][] then each row
        - id: array-default-values
          label: Default values
          note: New arrays hold 0, false, '\u0000' or null
        - id: array-index-out-of-bounds
          label: ArrayIndexOutOfBoundsException
          note: Thrown for an index below 0 or at least length
    - id: dynamic-array
      children:
        - id: arraylist-capacity
          label: Capacity vs size
          note: Slots allocated vs items stored; capacity is at least size
        - id: arraylist-resize
          label: Resize
          note: "When full, allocate a larger array and copy every item: O(n)"
        - id: amortised-append
          label: Amortised O(1) add
          note: n adds at the end take O(n) time in total
    - id: strings
      children:
        - id: java-string
          label: String
          note: Immutable; charAt(i) reads index 0 to length() - 1
        - id: stringbuilder
          label: StringBuilder
          note: Mutable text buffer; not synchronised
        - id: string-equality
          label: == vs equals
          note: == is the same object; equals is the same characters
        - id: char-arithmetic
          label: c - 'a' counting
          note: An int[26] counter for lowercase letters is O(1) space
    - id: hashing
      children:
        - id: hash-function
          label: Hash function
          note: Turns a key into an array index
        - id: hash-collision
          label: Collision
          note: Two different keys map to the same index
        - id: separate-chaining
          label: Separate chaining
          note: A list per bucket; search hashes, then scans that list
        - id: open-addressing
          label: Open addressing
          note: All keys in the array itself; on a collision, probe on
          children:
            - id: linear-probing
              label: Linear probing
              note: Try the next slot, then the next; can form clusters
            - id: quadratic-probing
              label: Quadratic probing
              note: Probe gaps grow with the square of the attempt number
            - id: double-hashing
              label: Double hashing
              note: A second hash function sets the probe step
        - id: load-factor
          label: Load factor
          note: Keys ÷ buckets; open addressing needs it below 1
        - id: rehashing
          label: Rehashing
          note: Build a bigger table and re-insert every key
    - id: hashmap-hashset
      children:
        - id: java-hashmap
          label: HashMap
          note: Unique keys to values; one null key; no order
        - id: java-hashset
          label: HashSet
          note: Unique items, stored as the keys of a HashMap
        - id: equals-hashcode-contract
          label: equals/hashCode contract
          note: Equal objects must return the same hashCode
        - id: hashmap-treeified-bucket
          label: Treeified bucket (OpenJDK)
          note: A bucket of about 8 keys becomes a tree if the table has 64+ slots
        - id: concurrent-hashmap
          label: ConcurrentHashMap
          note: Thread-safe map; null keys and values not allowed
    - id: ordered-maps-sets
      children:
        - id: linkedhashmap
          label: LinkedHashMap
          note: "Hash table plus a doubly linked list: predictable order"
          children:
            - id: lru-cache
              label: LRU cache
              note: accessOrder = true plus removeEldestEntry over a size limit
        - id: treemap
          label: TreeMap
          note: Red-black tree; sorted keys; O(log n) get, put, remove
        - id: linkedhashset
          label: LinkedHashSet
          note: Unique items in insertion order
        - id: treeset
          label: TreeSet
          note: Unique items sorted; built on a TreeMap; O(log n)
  linear:
    - id: linked-list
      children:
        - id: singly-linked-list
          label: Singly linked list
          note: Each node links only to the next; the last links to null
        - id: doubly-linked-list
          label: Doubly linked list
          note: Nodes link to next and previous; O(1) work at both ends
          children:
            - id: java-linkedlist
              label: Java LinkedList
              note: Doubly linked; implements List and Deque; not synchronised
        - id: circular-linked-list
          label: Circular linked list
          note: The last node links back to the first; no null end
        - id: sentinel-node
          label: Dummy (sentinel) node
          note: A fake node at the edge, so empty-list cases need no special code
        - id: reverse-linked-list
          label: Reverse a Linked List
          note: "Classic: flip every next link with prev, curr and next"
        - id: merge-two-sorted-lists
          label: Merge Two Sorted Lists
          note: "Classic: splice the smaller head each step behind a dummy"
    - id: stack
      children:
        - id: call-stack
          label: Call stack
          note: "Each unfinished method call keeps a frame; too deep: overflow"
        - id: valid-parentheses
          label: Valid Parentheses
          note: "Classic: push openers; each closer must match the top"
        - id: two-stack-evaluation
          label: Dijkstra's two-stack evaluation
          note: One stack for operands, one for operators, to evaluate expressions
        - id: min-stack
          label: Min Stack
          note: "Store each value with the minimum below it: getMin in O(1)"
        - id: queue-using-two-stacks
          label: Queue using two stacks
          note: Push to one, pop from the other; refill it when empty
        - id: java-stack-class
          label: java.util.Stack
          note: Legacy Vector subclass, synchronised; docs prefer Deque
    - id: queue-and-deque
      children:
        - id: circular-queue
          label: Circular queue
          note: Fixed array; head and tail indices wrap with modulo
        - id: deque
          label: Deque (double-ended queue)
          note: Add and remove at both ends; pronounced deck
          children:
            - id: arraydeque
              label: ArrayDeque
              note: Resizable array deque; no nulls; not thread-safe
        - id: queue-methods
          label: offer / poll / peek vs add / remove / element
          note: First set returns false or null; second set throws
  trees:
    - id: tree-basics
      children:
        - id: binary-tree
          label: Binary tree
          note: "Each node has at most two children: left and right"
          children:
            - id: full-binary-tree
              label: Full binary tree
              note: Every node has 0 or 2 children
            - id: complete-binary-tree
              label: Complete binary tree
              note: Every level full except the last, which fills from the left
            - id: perfect-binary-tree
              label: Perfect binary tree
              note: All leaves at one depth; 2^(h+1) - 1 nodes for height h
            - id: skewed-tree
              label: Skewed (degenerate) tree
              note: Each node has one child, so the tree is a chain of n nodes
        - id: tree-depth
          label: Depth
          note: Edges from the root down to a node; the root has depth 0
        - id: tree-height
          label: Height
          note: Edges on the longest path from a node down to a leaf
    - id: tree-traversals
      children:
        - id: inorder-traversal
          label: Inorder
          note: Left, node, right; a BST comes out sorted
        - id: preorder-traversal
          label: Preorder
          note: Node, left, right; the node is seen before its children
        - id: postorder-traversal
          label: Postorder
          note: Left, right, node; children are finished first
        - id: level-order-traversal
          label: Level order
          note: Level by level, left to right, using a queue
    - id: binary-search-tree
      children:
        - id: bst-search-insert
          label: Search and insert
          note: Go left if smaller, right if larger; cost O(height)
        - id: bst-delete
          label: Delete
          note: "Two children: replace with the inorder successor"
        - id: inorder-successor
          label: Inorder successor
          note: "Next larger key: the smallest key in the right subtree"
        - id: validate-bst
          label: Validate BST
          note: Pass a (min, max) range down; every key must fit it
        - id: kth-smallest-bst
          label: Kth Smallest in a BST
          note: Inorder walk; stop at the kth visited node
    - id: balanced-trees
      children:
        - id: avl-tree
          label: AVL tree
          note: Every node's two subtree heights differ by at most 1
        - id: red-black-tree
          label: Red-black tree
          note: Height at most 2 lg n; Java TreeMap is built on one
        - id: tree-rotation
          label: Rotation
          note: Relinks O(1) pointers and keeps the inorder order
    - id: heap-priority-queue
      children:
        - id: min-heap
          label: Min-heap
          note: Parent ≤ children, so the smallest is at the root
        - id: max-heap
          label: Max-heap
          note: Parent ≥ children, so the largest is at the root
        - id: heap-array-layout
          label: Array layout
          note: Children of i at 2i+1 and 2i+2; parent at (i-1)/2
        - id: build-heap
          label: Build heap (heapify)
          note: "Sift down every parent, last to first: O(n)"
        - id: java-priorityqueue
          label: Java PriorityQueue
          note: A min-heap unless you pass a Comparator
    - id: trie
      children:
        - id: trie-node
          label: Trie node
          note: Child links per character plus an end-of-word mark
        - id: trie-search
          label: Insert and search
          note: "Follow one link per character: O(L) for length L"
        - id: trie-starts-with
          label: startsWith
          note: Same walk as search; the end mark is not needed
        - id: trie-autocomplete
          label: Autocomplete
          note: Walk to the prefix node, then collect all words below it
  graphs:
    - id: graph-basics
      children:
        - id: graph-kinds
          label: Kinds of graph
          note: Directed or not, weighted or not, with or without cycles
          children:
            - id: directed-graph
              label: Directed graph
              note: Each edge points one way, from u to v
            - id: undirected-graph
              label: Undirected graph
              note: Each edge links its two vertices both ways
            - id: weighted-graph
              label: Weighted graph
              note: "Each edge carries a number: cost, distance or time"
            - id: dag
              label: DAG
              note: A directed graph with no directed cycle
        - id: adjacency-list
          label: Adjacency list
          note: Each vertex lists its neighbours; O(V + E) space
        - id: adjacency-matrix
          label: Adjacency matrix
          note: A V × V grid; O(1) edge check, O(V²) space
        - id: connected-component
          label: Connected component
          note: A largest set of vertices that can all reach each other
    - id: bfs
      children:
        - id: bfs-shortest-path
          label: Shortest path in edges
          note: "Unweighted graphs only: dist[v] = dist[u] + 1"
        - id: bfs-levels
          label: Level by level
          note: Every vertex at distance k is queued before any at k + 1
        - id: clone-graph
          label: Clone Graph
          note: Common practice problem; BFS or DFS both work
    - id: dfs
      children:
        - id: dfs-recursive
          label: Recursive DFS
          note: Shortest code; a very deep graph can overflow the stack
        - id: dfs-iterative
          label: Iterative DFS
          note: An explicit stack replaces the call stack
        - id: dfs-components
          label: Number of Connected Components
          note: Start DFS from each unvisited vertex; count the starts
        - id: dfs-cycle-undirected
          label: Cycle check (undirected)
          note: A visited neighbour that is not the parent means a cycle
        - id: dfs-cycle-directed
          label: Cycle check (directed)
          note: "White, grey, black: an edge to a grey vertex is a cycle"
    - id: topological-sort
      children:
        - id: kahns-algorithm
          label: Kahn's algorithm
          note: Queue in-degree 0 vertices; a short output means a cycle
        - id: dfs-postorder-topo
          label: DFS reverse postorder
          note: List vertices by decreasing DFS finish time
        - id: course-schedule
          label: Course Schedule
          note: "Common problem: can the prerequisite graph be ordered?"
    - id: shortest-paths
      children:
        - id: dijkstra
          label: Dijkstra's algorithm
          note: Non-negative weights, min-heap, O((V + E) log V)
        - id: bellman-ford
          label: Bellman-Ford
          note: Negative weights allowed; V - 1 rounds; O(V·E)
          children:
            - id: negative-cycle
              label: Negative cycle
              note: "A cycle with total weight below zero: no shortest path"
        - id: floyd-warshall
          label: Floyd-Warshall
          note: All pairs in O(V³); negative edges ok, negative cycles not
        - id: zero-one-bfs
          label: 0-1 BFS
          note: "Weights 0 or 1: a deque replaces the heap; O(E)"
    - id: union-find
      children:
        - id: path-compression
          label: Path compression
          note: find points every vertex it passes straight at the root
        - id: union-by-rank
          label: Union by rank or size
          note: Smaller tree under larger keeps height at most log n
        - id: graph-valid-tree
          label: Graph Valid Tree
          note: "A tree: connected and no edge closes a cycle"
    - id: minimum-spanning-tree
      children:
        - id: kruskal
          label: Kruskal's algorithm
          note: Edges by weight; union-find skips cycles; O(E log E)
        - id: prim
          label: Prim's algorithm
          note: Grow from one vertex with a min-heap; O(E log V)
  search-sort:
    - id: recursion
      children:
        - id: base-case
          label: Base case
          note: Returns an answer without another call; stops the recursion
        - id: recursive-case
          label: Recursive case
          note: Calls itself on a smaller input that moves toward the base case
        - id: stack-frame
          label: Stack frame per call
          note: The JVM makes a new frame for every method call
        - id: recursion-tree
          label: Recursion tree
          note: Draw each call as a node to count the total work
          children:
            - id: naive-fibonacci
              label: Naive Fibonacci
              note: "fib(n-1) + fib(n-2) repeats the same calls: exponential time"
        - id: tail-recursion
          label: Tail recursion
          note: The recursive call is the last thing the method does
        - id: iterative-version
          label: Iterative version
          note: Any recursion can be rewritten as a loop, maybe with an explicit stack
    - id: binary-search
      children:
        - id: linear-search
          label: Linear search
          note: "Check items one by one: O(n), works on unsorted data"
        - id: binary-search-template
          label: Classic template
          note: while (lo <= hi), mid = lo + (hi - lo) / 2
        - id: lower-bound
          label: Lower bound
          note: First index whose value is >= target
        - id: upper-bound
          label: Upper bound
          note: First index whose value is > target
        - id: arrays-binary-search
          label: Arrays.binarySearch
          note: Index if found, else -(insertion point) - 1
        - id: collections-binary-search
          label: Collections.binarySearch
          note: O(log n) on random-access lists; O(n) link walks on others
    - id: sorting-basics
      children:
        - id: comparison-sorts
          label: Comparison sorts
          note: Only compare pairs; need about n log n compares in the worst case
          children:
            - id: bubble-sort
              label: Bubble sort
              note: Swaps neighbours out of order; O(n²); stable, in place
            - id: selection-sort
              label: Selection sort
              note: Picks the minimum each round; O(n²) even if sorted; not stable
            - id: insertion-sort
              label: Insertion sort
              note: Inserts each item into the sorted left part; O(n) if nearly sorted
            - id: heap-sort
              label: Heap sort
              note: Build a heap, then remove the max n times; O(n log n), in place
        - id: non-comparison-sorts
          label: Non-comparison sorts
          note: Use key values as indexes, so the n log n bound does not apply
          children:
            - id: counting-sort
              label: Counting sort
              note: "Count each value in 0..k-1: O(n + k), stable"
            - id: radix-sort
              label: Radix sort
              note: Counting sort digit by digit, least significant first
        - id: java-sorts
          label: Java's built-in sorts
          note: Arrays.sort, List.sort and Collections.sort
          children:
            - id: dual-pivot-quicksort
              label: Dual-Pivot Quicksort
              note: Arrays.sort on primitives; O(n log n) on all data (API note)
            - id: timsort
              label: TimSort
              note: "Arrays.sort on objects and List.sort: stable merge sort"
    - id: merge-sort
      children:
        - id: merge-step
          label: Merge step
          note: Join two sorted halves in O(n) using a helper array
        - id: bottom-up-merge-sort
          label: Bottom-up merge sort
          note: Merge runs of size 1, 2, 4, ... with loops, no recursion
        - id: merge-sort-linked-list
          label: Sort a linked list
          note: "Best choice for lists: no extra array, still n log n"
        - id: count-inversions
          label: Count inversions
          note: Count out-of-order pairs while merging, in n log n
    - id: quick-sort
      children:
        - id: lomuto-partition
          label: Lomuto partition
          note: Pivot is the last item; one scan; simple, more swaps
        - id: hoare-partition
          label: Hoare partition
          note: Scan from both ends and swap pairs; about 3x fewer swaps
        - id: random-pivot
          label: Random pivot
          note: Shuffle or pick a random pivot so O(n²) is very unlikely
        - id: three-way-partition
          label: 3-way partition
          note: Split into <, = and > pivot; fast with many duplicates
        - id: quickselect
          label: Quickselect
          note: "Partition, then recurse into one side only: k-th item in average O(n)"
  patterns:
    - id: spotting-the-pattern
      children:
        - id: clue-in-the-input
          label: Clue in the input
          note: Sorted array, linked list, grid, ranges, tree or graph
        - id: clue-in-the-question
          label: Clue in the question
          note: Words like longest contiguous, kth, how many ways, all
        - id: clue-in-the-constraints
          label: Clue in the constraints
          note: The input size limits which cost will pass
    - id: two-pointers
      children:
        - id: opposite-ends-pointers
          label: Opposite ends
          note: Start at both ends of sorted data; move inward
        - id: read-write-pointers
          label: Read and write pointers
          note: Same direction; rewrite the array in place
        - id: one-pointer-per-array
          label: One pointer per array
          note: Merge two sorted arrays by advancing the smaller
        - id: three-sum
          label: 3Sum
          note: "Sort, fix one value, two pointers on the rest: O(n²)"
    - id: fast-slow-pointers
      children:
        - id: linked-list-cycle
          label: Linked List Cycle
          note: Slow +1, fast +2; they meet only if a cycle exists
        - id: cycle-start-node
          label: Start of the cycle
          note: Reset one to the head, step both by 1; they meet there
        - id: middle-of-linked-list
          label: Middle of the Linked List
          note: When fast reaches the end, slow is at the middle
        - id: happy-number
          label: Happy Number
          note: Digit-square sums reach 1 or loop; Floyd spots the loop
    - id: sliding-window
      children:
        - id: fixed-size-window
          label: Fixed-size window
          note: "Size k: add the new item, remove the one k back"
        - id: variable-size-window
          label: Variable-size window
          note: Grow right; shrink left while the window is invalid
        - id: longest-substring-without-repeating
          label: Longest Substring Without Repeating
          note: Variable window with letter counts
        - id: minimum-window-substring
          label: Minimum Window Substring
          note: Variable window; shrink while it still has every letter
    - id: prefix-sum
      children:
        - id: range-sum-query
          label: Range sum query
          note: Any range sum in O(1) after an O(n) build
        - id: subarray-sum-equals-k
          label: Subarray Sum Equals K
          note: Map of prefix-sum counts; O(n), works with negatives
        - id: prefix-sum-2d
          label: 2D prefix sum
          note: Any rectangle sum in O(1) from four stored corners
        - id: difference-array
          label: Difference array
          note: Add x to a range by changing two cells
        - id: product-except-self
          label: Product of Array Except Self
          note: Prefix product times suffix product; no division
    - id: frequency-counting
      children:
        - id: two-sum
          label: Two Sum
          note: Store value → index; look up target - x first
        - id: valid-anagram
          label: Valid Anagram
          note: Equal letter counts; int[26] gives O(1) space
        - id: group-anagrams
          label: Group Anagrams
          note: Key = the sorted letters; map key → list of words
        - id: contains-duplicate
          label: Contains Duplicate
          note: HashSet.add returns false when the item is already in
    - id: monotonic-stack
      children:
        - id: next-greater-element
          label: Next Greater Element
          note: Decreasing stack; the item that pops you is your answer
        - id: daily-temperatures
          label: Daily Temperatures
          note: Next greater, answered as a distance in days
        - id: largest-rectangle-histogram
          label: Largest Rectangle in Histogram
          note: Smaller bars on each side bound a bar's widest span
        - id: monotonic-queue
          label: Monotonic deque
          note: Sliding Window Maximum in O(n); the front is the max
    - id: binary-search-on-answer
      children:
        - id: koko-eating-bananas
          label: Koko Eating Bananas
          note: Smallest eating speed that finishes all piles in h hours
        - id: ship-within-d-days
          label: Capacity to Ship Packages in D Days
          note: Search capacity between the largest weight and the total weight
        - id: rotated-sorted-array
          label: Search in Rotated Sorted Array
          note: One half around mid is always sorted; check if the target is in it
    - id: top-k-heap
      children:
        - id: kth-largest-element
          label: Kth Largest Element
          note: Min-heap of size k; its top is the answer; O(n log k)
        - id: top-k-frequent
          label: Top K Frequent Elements
          note: Count with a HashMap, then keep a size-k min-heap on counts
        - id: merge-k-sorted-lists
          label: Merge K Sorted Lists
          note: Heap holds one head per list; O(N log k) for N items
        - id: two-heaps-median
          label: Running median (two heaps)
          note: Max-heap for the lower half, min-heap for the upper half
    - id: merge-intervals
      children:
        - id: merge-overlapping-intervals
          label: Merge Intervals
          note: Sort by start; extend the last merged end or start a new one
        - id: insert-interval
          label: Insert Interval
          note: Input already sorted, so one O(n) pass is enough
        - id: meeting-rooms
          label: Meeting Rooms II (minimum rooms)
          note: Rooms needed = the most meetings that overlap at one time
          children:
            - id: sweep-line
              label: Sweep line
              note: Sort start and end events; +1 on start, -1 on end; track the max
        - id: non-overlapping-intervals
          label: Non-overlapping Intervals
          note: "Fewest removals: sort by end, keep the one that ends first"
    - id: grid-traversal
      children:
        - id: direction-array
          label: Direction arrays
          note: Up, down, left, right as row and column offsets
        - id: flood-fill
          label: Flood fill
          note: Visit every cell connected to a start cell, by DFS or BFS
        - id: number-of-islands
          label: Number of Islands
          note: Count how many times a new flood fill starts on unvisited land
        - id: multi-source-bfs
          label: Rotting Oranges (multi-source BFS)
          note: Queue every rotten cell first; each BFS level is one minute
        - id: shortest-path-binary-maze
          label: Shortest Path in a Binary Maze
          note: BFS from the source; the first time it reaches the target is shortest
    - id: backtracking
      children:
        - id: subsets
          label: Subsets
          note: "Include or skip each element: 2^n subsets"
        - id: permutations
          label: Permutations
          note: Mark used elements; n! orders
        - id: combination-sum
          label: Combination Sum
          note: Choose numbers, each reusable, that add up to a target
        - id: n-queens
          label: N-Queens
          note: One queen per row; 92 solutions on an 8 x 8 board
        - id: pruning
          label: Pruning
          note: Stop a branch as soon as it cannot reach a solution
        - id: skip-duplicates
          label: Skip duplicates
          note: Sort, then skip a value equal to the previous one at the same level
    - id: dynamic-programming
      children:
        - id: memoisation
          label: Memoisation (top-down)
          note: Recursion plus a cache; fills only the entries it needs
        - id: tabulation
          label: Tabulation (bottom-up)
          note: Loop that fills a table from the base cases up
        - id: one-d-dp
          label: 1D DP
          note: dp[i] depends on a few earlier entries
          children:
            - id: climbing-stairs
              label: Climbing Stairs
              note: ways(n) = ways(n - 1) + ways(n - 2)
            - id: house-robber
              label: House Robber
              note: "Per house: skip it, or rob it plus the best two houses back"
            - id: coin-change
              label: Coin Change
              note: Fewest coins for x = 1 + min of dp[x - c]; O(n k)
            - id: longest-increasing-subsequence
              label: Longest Increasing Subsequence
              note: Best length ending at k from earlier smaller items; O(n²)
        - id: two-d-dp
          label: 2D DP
          note: "dp[i][j] over two indices: a grid, or two strings"
          children:
            - id: grid-paths
              label: Unique Paths / grid path sum
              note: A cell builds on the cell above and the cell to the left
            - id: longest-common-subsequence
              label: Longest Common Subsequence
              note: Table over prefixes of both strings; O(m n)
            - id: edit-distance
              label: Edit distance
              note: Fewest inserts, removes or changes; LOVE to MOVIE is 2
            - id: zero-one-knapsack
              label: 0/1 Knapsack
              note: Each item used once; a 1D table updated right to left
    - id: greedy
      children:
        - id: interval-scheduling
          label: Activity selection
          note: "Most events: always take the one that ends first"
        - id: jump-game
          label: Jump Game II (fewest jumps)
          note: Jump only at the end of the current reach; track the farthest; O(n)
        - id: gas-station
          label: Gas Station
          note: If the tank goes negative at i, restart from i + 1; O(n)
        - id: greedy-coin-counterexample
          label: Coins {1, 3, 4}, sum 6
          note: Greedy gives 4 + 1 + 1; best is 3 + 3
  tricks:
    - id: problem-solving-steps
      children:
        - id: clarify-the-problem
          label: Clarify the problem
          note: Ask size, range, sorted, duplicates, empty before solving
        - id: brute-force-first
          label: Brute force first
          note: Simplest correct idea; Two Sum by nested loops is O(n²)
        - id: optimise-the-bottleneck
          label: Optimise the bottleneck
          note: "Remove repeated work: hash lookups, prefix sums, caching"
        - id: dry-run-and-test
          label: Dry-run and test
          note: Step through small and edge inputs; look for off-by-one
    - id: constraints-to-complexity
      children:
        - id: small-n-exponential
          label: "n ≤ 20: exponential"
          note: O(2^n) fits at n ≤ 20; O(n!) only at n ≤ 10
        - id: medium-n-polynomial
          label: "n ≤ 5000: polynomial"
          note: O(n³) fits at n ≤ 500; O(n²) at n ≤ 5000
        - id: large-n-near-linear
          label: "n ≤ 10^6: near-linear"
          note: O(n log n) or O(n) fits for n up to 10^6
        - id: huge-n-logarithmic
          label: "Larger n: O(log n) or O(1)"
          note: When n is huge, only O(log n) or O(1) fits
    - id: choosing-a-data-structure
      children:
        - id: pick-by-access
          label: Lookup by position or key
          note: Array for an index; HashMap or HashSet for a key
        - id: pick-by-arrival-order
          label: LIFO or FIFO order
          note: "ArrayDeque: faster than Stack and than LinkedList as a queue"
        - id: pick-by-sorted-order
          label: Sorted or nearest key
          note: TreeMap / TreeSet; floorKey and ceilingKey find neighbours
        - id: pick-by-priority
          label: Repeated min or max
          note: "PriorityQueue: the head is the least element by default"
        - id: pick-by-structure
          label: Prefixes, groups, links
          note: Trie for prefixes, union-find for groups, graph for links
    - id: edge-cases
      children:
        - id: edge-small-inputs
          label: Empty, one, two items
          note: Empty input, a single item and two items break most loops
        - id: edge-duplicates-and-order
          label: Duplicates and order
          note: Repeated or all-equal values; sorted or reversed input
        - id: edge-extreme-values
          label: Extreme values
          note: Negatives, zero and very large values that overflow
        - id: edge-graph-shapes
          label: Graph shapes
          note: Empty, one or two nodes, disconnected parts, cycles
        - id: edge-tree-shapes
          label: Tree shapes
          note: Empty, one node, two nodes, skewed like a linked list
    - id: java-pitfalls
      children:
        - id: int-overflow-pitfall
          label: int overflow
          note: int maths wraps with no error; Math.addExact throws instead
        - id: integer-equality-pitfall
          label: Integer == vs equals
          note: Boxing must share objects only for -128 to 127
        - id: integer-division-pitfall
          label: Integer division
          note: "Rounds toward 0: -7 / 2 is -3"
        - id: comparator-subtraction-pitfall
          label: Subtraction comparator
          note: a - b can overflow and flip the sign; use Integer.compare
        - id: concurrent-modification-pitfall
          label: Removing while iterating
          note: Fail-fast iterators throw, on a best-effort basis
        - id: fixed-size-list-pitfall
          label: Fixed-size and unmodifiable lists
          note: Arrays.asList cannot grow; List.of rejects changes and nulls
    - id: bit-manipulation
      children:
        - id: lowest-set-bit-trick
          label: x & (x - 1)
          note: Clears the lowest 1 bit; 0 for a power of two
        - id: xor-pairs-cancel
          label: XOR cancels pairs
          note: "a ^ a = 0 and a ^ 0 = a: finds the Single Number"
        - id: bit-masks
          label: Masks with 1 << k
          note: Test, set, clear or flip bit k with &, |, & ~, ^
        - id: signed-vs-unsigned-shift
          label: ">> vs >>>"
          note: ">> copies the sign bit; >>> shifts in zeros"
        - id: bitmask-subsets
          label: Bitmask subsets
          note: Masks 0 to 2^n - 1 list every subset of n items
