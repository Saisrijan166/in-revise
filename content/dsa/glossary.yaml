terms:
  - id: data-structure
    term: Data structure
    aka:
      - data structures
    definition: A way to store data in memory together with the operations it supports.
    see: data-structures
    source:
      title: "Lecture 1: Algorithms and Computation (MIT 6.006, Spring 2020)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec1/
      verifiedOn: 2026-10-19
  - id: abstract-data-type
    term: Abstract data type (ADT)
    aka:
      - abstract data type
      - ADT
    definition: The set of operations a structure supports and what they mean, without saying how data is stored.
    see: data-structures
    source:
      title: 1.2 Interfaces (Open Data Structures, Java edition)
      url: https://opendatastructures.org/ods-java/1_2_Interfaces.html
      verifiedOn: 2026-10-19
  - id: big-o-notation
    term: Big-O notation
    aka:
      - Big-O
      - Big O
    definition: An upper bound on how a cost grows with input size, ignoring constants and smaller terms.
    see: big-o
    source:
      title: "Lecture 1: Algorithms and Computation (MIT 6.006, Spring 2020)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec1/
      verifiedOn: 2026-10-19
  - id: big-omega
    term: Big-Omega
    aka:
      - Big Omega
    definition: "A lower bound on growth: the cost grows at least this fast."
    see: big-o
    source:
      title: "Lecture 1: Algorithms and Computation (MIT 6.006, Spring 2020)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec1/
      verifiedOn: 2026-10-19
  - id: big-theta
    term: Big-Theta
    aka:
      - Big Theta
    definition: "A tight bound: the cost grows exactly at this rate, up to constant factors."
    see: big-o
    source:
      title: "Lecture 1: Algorithms and Computation (MIT 6.006, Spring 2020)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec1/
      verifiedOn: 2026-10-19
  - id: time-complexity
    term: Time complexity
    definition: How the number of steps an algorithm takes grows with the input size.
    see: big-o
    source:
      title: "Competitive Programmer's Handbook, chapter 2: Time complexity (Laaksonen)"
      url: https://cses.fi/book/book.pdf
      verifiedOn: 2026-10-19
  - id: space-complexity
    term: Space complexity
    definition: The total memory an algorithm uses as the input grows, counting the input itself.
    see: big-o
    source:
      title: Auxiliary Space vs Space Complexity (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/dsa/g-fact-86/
      verifiedOn: 2026-10-19
  - id: auxiliary-space
    term: Auxiliary space
    aka:
      - extra space
    definition: Only the extra memory an algorithm adds beyond its input, such as helper arrays or the call stack.
    see: big-o
    source:
      title: Auxiliary Space vs Space Complexity (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/dsa/g-fact-86/
      verifiedOn: 2026-10-19
  - id: logarithmic-time
    term: Logarithmic time
    aka:
      - logarithmic
      - O(log n)
    definition: Cost that grows like log n, typical when each step halves the input.
    see: big-o
    source:
      title: "Competitive Programmer's Handbook, chapter 2: Time complexity (Laaksonen)"
      url: https://cses.fi/book/book.pdf
      verifiedOn: 2026-10-19
  - id: java-collection
    term: Collection (Java)
    aka:
      - Collection interface
      - java.util.Collection
    definition: The root interface for groups of single elements; List, Set and Queue extend it.
    see: java-collections
    source:
      title: Collections Framework Overview (Java SE 25)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/doc-files/coll-overview.html
      verifiedOn: 2026-10-19
  - id: java-map
    term: Map (Java)
    aka:
      - Map interface
      - java.util.Map
    definition: An interface that maps unique keys to values; it is not a Collection.
    see: java-collections
    source:
      title: Collections Framework Overview (Java SE 25)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/doc-files/coll-overview.html
      verifiedOn: 2026-10-19
  - id: comparable
    term: Comparable
    definition: A java.lang interface whose compareTo method gives a class its natural ordering.
    see: java-collections
    source:
      title: Comparable (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Comparable.html
      verifiedOn: 2026-10-19
  - id: comparator
    term: Comparator
    definition: A java.util functional interface whose compare method defines an ordering from outside the class.
    see: java-collections
    source:
      title: Comparator (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Comparator.html
      verifiedOn: 2026-10-19
  - id: generics
    term: Generics
    aka:
      - generic type
      - type argument
    definition: Type parameters such as List<Integer>; the type arguments must be reference types, not primitives.
    see: java-collections
    source:
      title: JLS 25, 4.5.1 Type Arguments of Parameterized Types
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html#jls-4.5.1
      verifiedOn: 2026-10-19
  - id: autoboxing
    term: Autoboxing
    aka:
      - boxing
      - unboxing
      - autoboxed
    definition: Automatic conversion of a primitive to its wrapper (int to Integer); unboxing a null throws NullPointerException.
    see: java-collections
    source:
      title: JLS 25, 5.1.7 Boxing and 5.1.8 Unboxing Conversion
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html#jls-5.1.7
      verifiedOn: 2026-10-19
  - id: wrapper-class
    term: Wrapper class
    aka:
      - wrapper type
      - wrapper classes
    definition: "The object type for a primitive: Integer for int, Long for long, Character for char, Boolean for boolean."
    see: java-collections
    source:
      title: JLS 25, 5.1.7 Boxing Conversion
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-5.html#jls-5.1.7
      verifiedOn: 2026-10-19
  - id: contiguous-memory
    term: Contiguous memory
    aka:
      - contiguous block
      - contiguous
    definition: Items stored one after another in a single block of memory, with no gaps.
    see: arrays
    source:
      title: "Recitation 2: Sequences and arrays (MIT 6.006)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_r02/
      verifiedOn: 2026-10-19
  - id: random-access
    term: Random access
    aka:
      - direct access
    definition: Reading any position in O(1) by its index, without walking from the start.
    see: arrays
    source:
      title: "Recitation 2: Sequences and arrays (MIT 6.006)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_r02/
      verifiedOn: 2026-10-19
  - id: array-index
    term: Index (array)
    aka:
      - array index
      - zero-based index
    definition: The position of an item in an array; Java counts from 0 to length - 1.
    see: arrays
    source:
      title: Chapter 10. Arrays (JLS, Java SE 25)
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-10.html
      verifiedOn: 2026-10-19
  - id: matrix
    term: Matrix (2D array)
    aka:
      - 2D array
      - two-dimensional array
    definition: A grid of rows and columns; in Java an array of row arrays, read as grid[row][col].
    see: arrays
    source:
      title: 15.10.2 Array creation (JLS, Java SE 25)
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.10.2
      verifiedOn: 2026-10-19
  - id: jagged-array
    term: Jagged array
    aka:
      - ragged array
    definition: A 2D array whose rows have different lengths, such as a triangle.
    see: arrays
    source:
      title: 15.10.2 Array creation (JLS, Java SE 25)
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.10.2
      verifiedOn: 2026-10-19
  - id: amortised-time
    term: Amortised O(1)
    aka:
      - amortised
      - amortized
      - amortized O(1)
    definition: "A cost averaged over many operations: rare slow steps are paid for by many fast ones."
    see: dynamic-array
    source:
      title: "Lecture 2: Data Structures (MIT 6.006)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec2/
      verifiedOn: 2026-10-19
  - id: capacity
    term: Capacity (ArrayList)
    aka:
      - ArrayList capacity
    definition: How many items the backing array can hold before it must grow; always at least the size.
    see: dynamic-array
    source:
      title: ArrayList (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/ArrayList.html
      verifiedOn: 2026-10-19
  - id: immutable
    term: Immutable object
    aka:
      - immutable
      - immutability
    definition: An object whose value cannot change after it is created; String is one.
    see: strings
    source:
      title: String (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html
      verifiedOn: 2026-10-19
  - id: hash-function
    term: Hash function
    aka:
      - hashing function
    definition: A function that turns a key into a number used to pick an array index.
    see: hashing
    source:
      title: 3.4 Hash Tables (Algorithms 4th ed.)
      url: https://algs4.cs.princeton.edu/34hash/
      verifiedOn: 2026-10-19
  - id: hash-code
    term: Hash code
    aka:
      - hashCode
    definition: The int an object's hashCode() returns; equal objects must return the same one.
    see: hashmap-hashset
    source:
      title: Object.hashCode (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#hashCode()
      verifiedOn: 2026-10-19
  - id: bucket
    term: Bucket (hash table)
    aka:
      - hash bucket
    definition: One slot of a hash table's array, holding the entries whose keys hash to it.
    see: hashing
    source:
      title: 3.4 Hash Tables (Algorithms 4th ed.)
      url: https://algs4.cs.princeton.edu/34hash/
      verifiedOn: 2026-10-19
  - id: hash-collision
    term: Collision (hashing)
    aka:
      - hash collision
    definition: Two different keys that map to the same index of a hash table.
    see: hashing
    source:
      title: 3.4 Hash Tables (Algorithms 4th ed.)
      url: https://algs4.cs.princeton.edu/34hash/
      verifiedOn: 2026-10-19
  - id: load-factor
    term: Load factor
    definition: Keys divided by table size; when it passes a limit (0.75 in HashMap), the table grows.
    see: hashing
    source:
      title: HashMap (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html
      verifiedOn: 2026-10-19
  - id: rehashing
    term: Rehashing
    aka:
      - rehash
    definition: Rebuilding a hash table with about twice the buckets and placing every key again.
    see: hashing
    source:
      title: HashMap (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/HashMap.html
      verifiedOn: 2026-10-19
  - id: separate-chaining
    term: Separate chaining
    definition: Collision handling that keeps a list of entries in each bucket.
    see: hashing
    source:
      title: 3.4 Hash Tables (Algorithms 4th ed.)
      url: https://algs4.cs.princeton.edu/34hash/
      verifiedOn: 2026-10-19
  - id: open-addressing
    term: Open addressing
    definition: Collision handling that stores every key in the array itself and probes for a free slot.
    see: hashing
    source:
      title: 3.4 Hash Tables (Algorithms 4th ed.)
      url: https://algs4.cs.princeton.edu/34hash/
      verifiedOn: 2026-10-19
  - id: linear-probing
    term: Linear probing
    definition: Open addressing that tries the next slot, then the next, until it finds a match or an empty one.
    see: hashing
    source:
      title: 3.4 Hash Tables (Algorithms 4th ed.)
      url: https://algs4.cs.princeton.edu/34hash/
      verifiedOn: 2026-10-19
  - id: equals-hashcode-contract
    term: equals/hashCode contract
    aka:
      - hashCode contract
    definition: If a.equals(b) is true, a.hashCode() must equal b.hashCode(); override both together.
    see: hashmap-hashset
    source:
      title: Object.hashCode (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#hashCode()
      verifiedOn: 2026-10-19
  - id: concurrent-hashmap
    term: ConcurrentHashMap
    definition: A thread-safe hash map whose reads do not lock; it rejects null keys and values.
    see: hashmap-hashset
    source:
      title: ConcurrentHashMap (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html
      verifiedOn: 2026-10-19
  - id: lru-cache
    term: LRU cache
    aka:
      - least recently used cache
    definition: A fixed-size cache that evicts the entry used least recently when it is full.
    see: ordered-maps-sets
    source:
      title: LinkedHashMap (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/LinkedHashMap.html
      verifiedOn: 2026-10-19
  - id: list-node
    term: Node (linked list)
    aka:
      - list node
      - ListNode
    definition: "One element of a linked list: a value plus a link to the next node."
    see: linked-list
    source:
      title: Linked Lists, chapter 3 (Open Data Structures, Morin)
      url: https://opendatastructures.org/ods-java/3_Linked_Lists.html
      verifiedOn: 2026-10-19
  - id: pointer-reference
    term: Pointer (reference)
    aka:
      - next pointer
      - next reference
    definition: A field that refers to another node; in Java it is an object reference, null when it points nowhere.
    see: linked-list
    source:
      title: Linked Lists, chapter 3 (Open Data Structures, Morin)
      url: https://opendatastructures.org/ods-java/3_Linked_Lists.html
      verifiedOn: 2026-10-19
  - id: list-head
    term: Head (linked list)
    aka:
      - head node
      - head of the list
    definition: The first node of a linked list; the only entry point of a singly linked list.
    see: linked-list
    source:
      title: "SLList: a singly-linked list (Open Data Structures, Morin)"
      url: https://opendatastructures.org/ods-java/3_1_SLList_Singly_Linked_Li.html
      verifiedOn: 2026-10-19
  - id: list-tail
    term: Tail (linked list)
    aka:
      - tail node
      - tail pointer
    definition: The last node of a linked list; keeping a reference to it makes adding at the end O(1).
    see: linked-list
    source:
      title: "SLList: a singly-linked list (Open Data Structures, Morin)"
      url: https://opendatastructures.org/ods-java/3_1_SLList_Singly_Linked_Li.html
      verifiedOn: 2026-10-19
  - id: singly-linked-list
    term: Singly linked list
    definition: A linked list whose nodes link only to the next node.
    see: linked-list
    source:
      title: "SLList: a singly-linked list (Open Data Structures, Morin)"
      url: https://opendatastructures.org/ods-java/3_1_SLList_Singly_Linked_Li.html
      verifiedOn: 2026-10-19
  - id: doubly-linked-list
    term: Doubly linked list
    definition: A linked list whose nodes link to both the next and the previous node.
    see: linked-list
    source:
      title: "DLList: a doubly-linked list (Open Data Structures, Morin)"
      url: https://opendatastructures.org/ods-java/3_2_DLList_Doubly_Linked_Li.html
      verifiedOn: 2026-10-19
  - id: circular-linked-list
    term: Circular linked list
    definition: A linked list whose last node links back to the first, so no link is null.
    see: linked-list
    source:
      title: Circular Linked List (GeeksforGeeks)
      url: https://www.geeksforgeeks.org/dsa/circular-linked-list/
      verifiedOn: 2026-10-19
  - id: sentinel-node
    term: Sentinel node
    aka:
      - dummy node
      - dummy head
    definition: A fake node that holds no data, placed at an edge of a list so empty-list cases need no special code.
    see: linked-list
    source:
      title: "DLList: a doubly-linked list (Open Data Structures, Morin)"
      url: https://opendatastructures.org/ods-java/3_2_DLList_Doubly_Linked_Li.html
      verifiedOn: 2026-10-19
  - id: lifo
    term: LIFO
    aka:
      - last in, first out
      - last-in-first-out
    definition: Order where the most recently added item is removed first, as in a stack.
    see: stack
    source:
      title: Bags, Queues, and Stacks (Algorithms, 4th Edition, Princeton)
      url: https://algs4.cs.princeton.edu/13stacks/
      verifiedOn: 2026-10-19
  - id: fifo
    term: FIFO
    aka:
      - first in, first out
      - first-in-first-out
    definition: Order where the earliest added item is removed first, as in a queue.
    see: queue-and-deque
    source:
      title: Bags, Queues, and Stacks (Algorithms, 4th Edition, Princeton)
      url: https://algs4.cs.princeton.edu/13stacks/
      verifiedOn: 2026-10-19
  - id: push
    term: Push (stack)
    aka:
      - push operation
    definition: Add an item to the top of a stack; O(1).
    see: stack
    source:
      title: Deque (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Deque.html
      verifiedOn: 2026-10-19
  - id: pop
    term: Pop (stack)
    aka:
      - pop operation
    definition: Remove and return the top item of a stack; O(1).
    see: stack
    source:
      title: Deque (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Deque.html
      verifiedOn: 2026-10-19
  - id: peek
    term: Peek
    aka:
      - peek operation
    definition: Return the top of a stack or the head of a queue without removing it.
    see: stack
    source:
      title: Deque (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Deque.html
      verifiedOn: 2026-10-19
  - id: stack-overflow
    term: Stack overflow
    aka:
      - StackOverflowError
    definition: Running out of call-stack space, usually from recursion that is too deep; Java throws StackOverflowError.
    see: stack
    source:
      title: StackOverflowError (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/StackOverflowError.html
      verifiedOn: 2026-10-19
  - id: stack-underflow
    term: Stack underflow
    definition: Popping from an empty stack; java.util.Stack throws EmptyStackException.
    see: stack
    source:
      title: Stack (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Stack.html
      verifiedOn: 2026-10-19
  - id: call-stack
    term: Call stack
    definition: The stack of frames for method calls that have not yet returned; recursion grows it.
    see: stack
    source:
      title: Stack cheatsheet (Tech Interview Handbook)
      url: https://www.techinterviewhandbook.org/algorithms/stack/
      verifiedOn: 2026-10-19
  - id: enqueue
    term: Enqueue
    definition: Add an item at the tail of a queue; offer() in Java.
    see: queue-and-deque
    source:
      title: Bags, Queues, and Stacks (Algorithms, 4th Edition, Princeton)
      url: https://algs4.cs.princeton.edu/13stacks/
      verifiedOn: 2026-10-19
  - id: dequeue
    term: Dequeue
    definition: Remove the item at the head of a queue; poll() in Java.
    see: queue-and-deque
    source:
      title: Bags, Queues, and Stacks (Algorithms, 4th Edition, Princeton)
      url: https://algs4.cs.princeton.edu/13stacks/
      verifiedOn: 2026-10-19
  - id: circular-queue
    term: Circular queue
    aka:
      - circular array
    definition: A queue in a fixed array whose indices wrap around with modulo, so freed front slots are reused.
    see: queue-and-deque
    source:
      title: "ArrayQueue: an array-based queue (Open Data Structures, Morin)"
      url: https://opendatastructures.org/ods-java/2_3_ArrayQueue_Array_Based_.html
      verifiedOn: 2026-10-19
  - id: deque
    term: Deque
    aka:
      - double-ended queue
    definition: "A double-ended queue: add and remove at both the front and the back; pronounced deck."
    see: queue-and-deque
    source:
      title: Deque (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Deque.html
      verifiedOn: 2026-10-19
  - id: arraydeque
    term: ArrayDeque
    definition: Java's resizable-array Deque; no capacity limit, no null elements, not thread-safe.
    see: queue-and-deque
    source:
      title: ArrayDeque (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/ArrayDeque.html
      verifiedOn: 2026-10-19
  - id: tree-root
    term: Tree root
    aka:
      - root node
      - root of the tree
    definition: The one node with no parent; every other node hangs below it.
    see: tree-basics
    source:
      title: Competitive Programmer's Handbook (Laaksonen)
      url: https://cses.fi/book/book.pdf
      verifiedOn: 2026-10-19
  - id: leaf
    term: Leaf (tree)
    aka:
      - leaf node
      - leaf nodes
    definition: A tree node with no children.
    see: tree-basics
    source:
      title: "Binary Trees: definitions (Open Data Structures, Java edition)"
      url: https://opendatastructures.org/ods-java/6_Binary_Trees.html
      verifiedOn: 2026-10-19
  - id: subtree
    term: Subtree
    aka:
      - subtrees
    definition: A node together with all of its descendants.
    see: tree-basics
    source:
      title: "Binary Trees: definitions (Open Data Structures, Java edition)"
      url: https://opendatastructures.org/ods-java/6_Binary_Trees.html
      verifiedOn: 2026-10-19
  - id: tree-depth
    term: Depth (tree)
    aka:
      - depth of a node
    definition: Number of edges from the root down to a node; the root has depth 0.
    see: tree-basics
    source:
      title: "Binary Trees: definitions (Open Data Structures, Java edition)"
      url: https://opendatastructures.org/ods-java/6_Binary_Trees.html
      verifiedOn: 2026-10-19
  - id: tree-height
    term: Height (tree)
    aka:
      - height of a tree
      - height of a node
      - tree height
    definition: Number of edges on the longest path from a node down to a leaf.
    see: tree-basics
    source:
      title: "Binary Trees: definitions (Open Data Structures, Java edition)"
      url: https://opendatastructures.org/ods-java/6_Binary_Trees.html
      verifiedOn: 2026-10-19
  - id: binary-tree
    term: Binary tree
    aka:
      - binary trees
    definition: A tree in which each node has at most two children, called left and right.
    see: tree-basics
    source:
      title: "Lecture 6: Binary Trees I (MIT 6.006, Spring 2020)"
      url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/mit6_006s20_lec6/
      verifiedOn: 2026-10-19
  - id: full-binary-tree
    term: Full binary tree
    aka:
      - proper binary tree
    definition: A binary tree in which every node has either zero or two children.
