    see: bit-manipulation
    source:
      title: Java Language Specification SE 25, 15.19 Shift operators
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.19
      verifiedOn: 2026-10-19
  - id: right-shift
    term: Right shift
    aka:
      - signed right shift
    definition: x >> k moves bits right and copies the sign bit; equal to floor(x / 2^k).
    see: bit-manipulation
    source:
      title: Java Language Specification SE 25, 15.19 Shift operators
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.19
      verifiedOn: 2026-10-19
  - id: unsigned-right-shift
    term: Unsigned right shift
    definition: x >>> k moves bits right and fills the top with zeros, so negatives become positive.
    see: bit-manipulation
    source:
      title: Java Language Specification SE 25, 15.19 Shift operators
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.19
      verifiedOn: 2026-10-19
  - id: bitmask
    term: Bitmask
    aka:
      - bit mask
    definition: An integer whose 1 bits mark chosen positions, used to test bits or store a small set.
    see: bit-manipulation
    source:
      title: Competitive Programmer's Handbook, 10.3 Representing sets
      url: https://cses.fi/book/book.pdf
      verifiedOn: 2026-10-19
  - id: set-bit
    term: Set bit
    aka:
      - 1 bit
      - one bit
    definition: A bit whose value is 1; Integer.bitCount counts them.
    see: bit-manipulation
    source:
      title: Integer.bitCount (Java SE 25 API)
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Integer.html
      verifiedOn: 2026-10-19
