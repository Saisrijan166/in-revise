terms:
  - { id: big-o, term: "Big-O", definition: "A way to describe how an algorithm's work grows as its input grows.", see: complexity, source: { title: "Algorithms, 4th Edition: Analysis of Algorithms (Princeton)", url: "https://algs4.cs.princeton.edu/14analysis/", verifiedOn: "2026-10-17" } }
  - { id: invariant, term: "Invariant", definition: "A condition that is true before and after every iteration or recursive call.", see: pattern-recognition, source: { title: "Algorithms, 4th Edition: Principles of Algorithm Design (Princeton)", url: "https://algs4.cs.princeton.edu/10fundamentals/", verifiedOn: "2026-10-17" } }
  - { id: amortised-analysis, term: "Amortised analysis", definition: "Analysis that averages the cost of expensive operations across a sequence of operations.", see: complexity, source: { title: "Algorithms, 4th Edition: Analysis of Algorithms (Princeton)", url: "https://algs4.cs.princeton.edu/14analysis/", verifiedOn: "2026-10-17" } }
  - { id: hash-map, term: "HashMap", definition: "A Java map implementation that stores key-value pairs using hashing.", see: hash-map-and-set, source: { title: "HashMap (Java SE 26)", url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/HashMap.html", verifiedOn: "2026-10-17" } }
  - { id: hash-set, term: "HashSet", definition: "A Java set implementation backed by a HashMap that keeps no duplicate elements.", see: hash-map-and-set, source: { title: "HashSet (Java SE 26)", url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/HashSet.html", verifiedOn: "2026-10-17" } }
  - { id: priority-queue, term: "Priority queue", definition: "A queue where removal returns the element with highest priority; Java's default head is the least element.", see: java-dsa-toolkit, source: { title: "PriorityQueue (Java SE 26)", url: "https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/PriorityQueue.html", verifiedOn: "2026-10-17" } }
  - { id: prefix-sum, term: "Prefix sum", definition: "A running total that makes a range sum available by subtraction.", see: prefix-sum, source: { title: "Algorithms, 4th Edition: Analysis of Algorithms (Princeton)", url: "https://algs4.cs.princeton.edu/14analysis/", verifiedOn: "2026-10-17" } }
  - { id: sliding-window, term: "Sliding window", definition: "A moving contiguous range whose state is updated as its ends move.", see: sliding-window, source: { title: "Algorithms, 4th Edition: Analysis of Algorithms (Princeton)", url: "https://algs4.cs.princeton.edu/14analysis/", verifiedOn: "2026-10-17" } }
