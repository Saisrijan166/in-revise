  - id: exception-translation-filter
    term: ExceptionTranslationFilter
    definition: "Security filter that turns security errors into responses: it starts login for an unknown caller and calls the access-denied handler (403) for a known one."
    see: security-filter-chain
    source:
      title: Spring Security architecture (Spring Security 7.1 reference)
      url: https://docs.spring.io/spring-security/reference/servlet/architecture.html
      verifiedOn: 2026-10-21
  - id: same-origin-policy
    term: Same-origin policy
    definition: The browser rule that a page's scripts may read responses only from their own origin, unless the other server allows it with CORS.
    see: csrf-cors
    source:
      title: Same-origin policy (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
      verifiedOn: 2026-10-21
  - id: session-fixation
    term: Session fixation
    definition: An attack where the attacker makes the victim use a session id the attacker knows; Spring blocks it by changing the session id at login.
    see: authentication-flow
    source:
      title: Authentication Persistence and Session Management (Spring Security 7.1 reference)
      url: https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html
      verifiedOn: 2026-10-21
  - id: csrf-token
    term: CSRF token
    aka:
      - _csrf
      - X-CSRF-TOKEN
      - XSRF-TOKEN
    definition: A random value that every unsafe request must send back, in a header or form field; another site cannot read it, so it cannot forge the request.
    see: csrf-cors
    source:
      title: Cross Site Request Forgery (CSRF) (Spring Security 7.1 reference)
      url: https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html
      verifiedOn: 2026-10-21
  - id: context-caching
    term: Test context caching
    aka:
      - context cache
      - cached context
    definition: Spring's test framework keeps a started application context and reuses it for later tests with the same configuration.
    see: spring-boot-testing
    source:
      title: Testing Spring Boot Applications (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html
      verifiedOn: 2026-10-21
  - id: strict-stubs
    term: Strict stubs
    aka:
      - UnnecessaryStubbingException
    definition: "Mockito's default strictness with MockitoExtension: a test fails when it sets up a stub that the code never uses."
    see: mockito
    source:
      title: "Strictness.java: STRICT_STUBS (Mockito source, GitHub)"
      url: https://github.com/mockito/mockito/blob/main/mockito-core/src/main/java/org/mockito/quality/Strictness.java
      verifiedOn: 2026-10-21
  - id: observation-api
    term: Observation (Micrometer)
    aka:
      - observation
      - observations
      - ObservationRegistry
    definition: A timed, named piece of work recorded by Micrometer; it produces a timer metric and, when tracing is on, a trace span.
    see: observability
    source:
      title: Observability (Spring Boot 4.1 reference)
      url: https://docs.spring.io/spring-boot/reference/actuator/observability.html
      verifiedOn: 2026-10-21
  - id: trace-sampling
    term: Trace sampling
    aka:
      - sampling probability
    definition: Recording only a share of requests as traces; Spring Boot samples 10% by default (management.tracing.sampling.probability).
    see: observability
    source:
      title: Tracing (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/actuator/tracing.html
      verifiedOn: 2026-10-21
  - id: spring-cloud-bus
    term: Spring Cloud Bus
    definition: Links service instances through a message broker so one event, such as a config refresh, reaches every instance.
    see: config-server
    source:
      title: "Spring Cloud Bus 5.0.3: bus endpoints"
      url: https://docs.spring.io/spring-cloud-bus/reference/spring-cloud-bus/bus-endpoints.html
      verifiedOn: 2026-10-19
  - id: eureka-self-preservation
    term: Self-preservation (Eureka)
    aka:
      - self-preservation mode
      - self-preservation
    definition: When far fewer heartbeats arrive than expected, the Eureka server stops evicting instances, in case the cause is a network fault.
    see: service-discovery-eureka
    source:
      title: Server Self Preservation Mode (Netflix Eureka wiki)
      url: https://github.com/Netflix/eureka/wiki/Server-Self-Preservation-Mode
      verifiedOn: 2026-10-19
  - id: cb-half-open
    term: Half-open state
    aka:
      - half-open
    definition: "The circuit breaker state after the open wait ends: a few trial calls decide whether it closes again or reopens."
    see: resilience4j
    source:
      title: CircuitBreaker (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/circuitbreaker
      verifiedOn: 2026-10-19
  - id: transactional-outbox
    term: Transactional outbox
    aka:
      - outbox pattern
      - outbox
    definition: Save an outgoing event in the same database transaction as the data, then publish it from that table, so no event is sent for a rolled-back change.
    see: spring-kafka
    source:
      title: "Pattern: Transactional outbox (microservices.io)"
      url: https://microservices.io/patterns/data/transactional-outbox.html
      verifiedOn: 2026-10-21
  - id: servlet
    term: Servlet
    aka:
      - servlets
    definition: A Java class that a servlet container such as Tomcat calls to handle HTTP requests, defined by the Jakarta Servlet API (6.1 in Spring Boot 4.1).
    see: dispatcher-servlet
    source:
      title: "System Requirements: servlet containers (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/system-requirements.html
      verifiedOn: 2026-10-21
  - id: enable-web-mvc
    term: "@EnableWebMvc"
    definition: Imports Spring MVC's own configuration; in a Spring Boot app it switches off Boot's MVC auto-configuration, so you configure MVC yourself.
    see: dispatcher-servlet
    source:
      title: "Servlet Web Applications: Spring MVC auto-configuration (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/web/servlet.html
      verifiedOn: 2026-10-21
  - id: web-mvc-configurer
    term: WebMvcConfigurer
    definition: A callback interface for customising Spring MVC, such as adding interceptors, CORS mappings or formatters, while keeping Boot's defaults.
    see: filters-interceptors
    source:
      title: "Servlet Web Applications: Spring MVC auto-configuration (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/web/servlet.html
      verifiedOn: 2026-10-21
  - id: handler-exception-resolver-term
    term: HandlerExceptionResolver
    definition: A strategy that DispatcherServlet calls to turn an exception from request mapping or a controller into an error response.
    see: exception-handling
    source:
      title: "Exceptions: HandlerExceptionResolver (Spring Framework 7.0 reference)"
      url: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/exceptionhandlers.html
      verifiedOn: 2026-10-21
  - id: method-argument-not-valid-exception
    term: MethodArgumentNotValidException
    definition: Thrown when a @Valid @RequestBody object fails Bean Validation; Spring MVC answers it with 400 Bad Request.
    see: validation
    source:
      title: Validation (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-validation.html
      verifiedOn: 2026-10-21
  - id: handler-method-validation-exception
    term: HandlerMethodValidationException
    definition: Thrown when method validation of a controller fails, for example @Min on a @RequestParam (Framework 6.1+); Spring MVC answers it with 400.
    see: validation
    source:
      title: Validation (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-validation.html
      verifiedOn: 2026-10-21
  - id: constraint-violation-exception
    term: ConstraintViolationException
    definition: The Jakarta Validation exception thrown when method validation on a @Validated bean, such as a service, fails.
    see: validation
    source:
      title: "Validation: method validation with @Validated (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/io/validation.html
      verifiedOn: 2026-10-21
  - id: hibernate-validator
    term: Hibernate Validator
    definition: The reference implementation of Jakarta Validation; spring-boot-starter-validation brings it in.
    see: validation
    source:
      title: Validation (Spring Boot 4.1 reference)
      url: https://docs.spring.io/spring-boot/reference/io/validation.html
      verifiedOn: 2026-10-21
  - id: response-entity-exception-handler
    term: ResponseEntityExceptionHandler
    definition: A base class for a @ControllerAdvice that turns all built-in Spring MVC exceptions into RFC 9457 ProblemDetail responses.
    see: exception-handling
    source:
      title: Error Responses (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-rest-exceptions.html
      verifiedOn: 2026-10-21
  - id: once-per-request-filter-term
    term: OncePerRequestFilter
    definition: Spring's base class for servlet filters; it aims for one run per request dispatch and gives you a doFilterInternal method.
    see: filters-interceptors
    source:
      title: OncePerRequestFilter (Spring Framework 7.0 API)
      url: https://docs.spring.io/spring-framework/docs/7.0.x/javadoc-api/org/springframework/web/filter/OncePerRequestFilter.html
      verifiedOn: 2026-10-21
  - id: event-loop
    term: Event loop
    aka:
      - event-loop threads
      - event-loop thread
    definition: A small, fixed set of threads that serve many connections by never waiting; non-blocking servers such as Netty use it.
    see: mvc-vs-webflux
    source:
      title: "Spring WebFlux overview: concurrency model (Spring Framework 7.0 reference)"
      url: https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html
      verifiedOn: 2026-10-21
  - id: blocking-call
    term: Blocking call
    aka:
      - blocking code
      - blocking calls
    definition: A call that makes the current thread wait, doing nothing, until the result arrives, such as a JDBC query or a RestClient call.
    see: mvc-vs-webflux
    source:
      title: "Spring WebFlux overview: concurrency model (Spring Framework 7.0 reference)"
      url: https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html
      verifiedOn: 2026-10-21
  - id: r2dbc
    term: R2DBC
    definition: "Reactive Relational Database Connectivity: non-blocking database APIs for relational databases, used with WebFlux instead of JDBC."
    see: mvc-vs-webflux
    source:
      title: "SQL Databases: Using R2DBC (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/data/sql.html
      verifiedOn: 2026-10-21
  - id: import-http-services
    term: "@ImportHttpServices"
    definition: Registers @HttpExchange interfaces as client beans, optionally in a named group whose settings come from spring.http.serviceclient.<group>.*.
    see: http-clients
    source:
      title: "Calling REST Services: HTTP Service Interface Clients (Spring Boot 4.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/io/rest-client.html
      verifiedOn: 2026-10-21
