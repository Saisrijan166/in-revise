  - id: crud-repository
    term: CrudRepository
    definition: "Spring Data's basic interface: save, findById, findAll, count, delete."
    see: spring-data-repositories
    source:
      title: "Spring Data JPA 4.1: Core concepts"
      url: https://docs.spring.io/spring-data/jpa/reference/repositories/core-concepts.html
      verifiedOn: 2026-10-19
  - id: derived-query
    term: Derived query
    aka:
      - derived query method
      - query method name
    definition: A repository query Spring Data builds from the method name, such as findByEmail.
    see: spring-data-repositories
    source:
      title: "Spring Data JPA 4.1: JPA query methods"
      url: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
      verifiedOn: 2026-10-19
  - id: query-annotation
    term: "@Query"
    definition: Puts your own JPQL, or SQL with nativeQuery = true, on a repository method.
    see: spring-data-repositories
    source:
      title: "Spring Data JPA 4.1: JPA query methods"
      url: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
      verifiedOn: 2026-10-19
  - id: jpql
    term: JPQL
    aka:
      - Jakarta Persistence Query Language
    definition: "JPA's query language: SQL-like, but over entities and fields instead of tables."
    see: spring-data-repositories
    source:
      title: Jakarta Persistence 3.2 specification
      url: https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html
      verifiedOn: 2026-10-19
  - id: native-query
    term: Native query
    aka:
      - nativeQuery
      - "@NativeQuery"
    definition: Plain SQL over tables and columns, run through JPA; tied to one database.
    see: spring-data-repositories
    source:
      title: "Spring Data JPA 4.1: JPA query methods"
      url: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
      verifiedOn: 2026-10-19
  - id: pageable-param
    term: Pageable
    aka:
      - PageRequest
    definition: "Asks for one page of results: page number from 0, size, and sort."
    see: spring-data-repositories
    source:
      title: PageRequest (Spring Data Commons 4.1 API)
      url: https://docs.spring.io/spring-data/commons/docs/current/api/org/springframework/data/domain/PageRequest.html
      verifiedOn: 2026-10-19
  - id: page-result
    term: Page (Spring Data)
    aka:
      - Page<T>
    definition: One page of results plus totals; costs an extra count query.
    see: spring-data-repositories
    source:
      title: "Spring Data JPA 4.1: Defining query methods"
      url: https://docs.spring.io/spring-data/jpa/reference/repositories/query-methods-details.html
      verifiedOn: 2026-10-19
  - id: sort-param
    term: Sort (Spring Data)
    aka:
      - Sort.by
    definition: Sort order for a repository query, such as Sort.by("amount").descending().
    see: spring-data-repositories
    source:
      title: "Spring Data JPA 4.1: Defining query methods"
      url: https://docs.spring.io/spring-data/jpa/reference/repositories/query-methods-details.html
      verifiedOn: 2026-10-19
  - id: persistence-context
    term: Persistence context
    definition: The set of managed entities, with one instance per id; usually one per transaction.
    see: persistence-context
    source:
      title: Jakarta Persistence 3.2 specification
      url: https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html
      verifiedOn: 2026-10-19
  - id: entity-manager
    term: EntityManager
    definition: The JPA API to persist, find, remove and query entities; each has a persistence context.
    see: persistence-context
    source:
      title: Jakarta Persistence 3.2 specification
      url: https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html
      verifiedOn: 2026-10-19
  - id: dirty-checking
    term: Dirty checking
    definition: Finding changed managed entities and writing them at flush, with no update call.
    see: persistence-context
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: jpa-flush
    term: Flush (JPA)
    aka:
      - flush
      - flushing
    definition: Sending pending entity changes to the database as SQL; it does not commit.
    see: persistence-context
    source:
      title: FlushModeType (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/FlushModeType.html
      verifiedOn: 2026-10-19
  - id: entity-states
    term: Entity states
    aka:
      - entity lifecycle
    definition: Transient, managed, detached or removed, relative to a persistence context.
    see: persistence-context
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: first-level-cache
    term: First-level cache
    definition: "The persistence context itself: one loaded instance per id, reused within it."
    see: persistence-context
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: second-level-cache
    term: Second-level cache
    aka:
      - L2 cache
    definition: An optional cache shared across persistence contexts; off until configured in Hibernate.
    see: persistence-context
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: lazy-fetch
    term: Lazy loading
    aka:
      - lazy fetching
      - FetchType.LAZY
    definition: Loading an association when it is first read; to JPA only a hint.
    see: lazy-loading-n-plus-one
    source:
      title: FetchType (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/FetchType.html
      verifiedOn: 2026-10-19
  - id: eager-fetch
    term: Eager loading
    aka:
      - eager fetching
      - FetchType.EAGER
    definition: Loading an association together with its owner; a rule the provider must follow.
    see: lazy-loading-n-plus-one
    source:
      title: FetchType (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/FetchType.html
      verifiedOn: 2026-10-19
  - id: n-plus-one-problem
    term: N+1 problem
    aka:
      - N+1
      - N+1 selects
      - N+1 query problem
    definition: One query loads N rows, then one more query runs per row for an association.
    see: lazy-loading-n-plus-one
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: join-fetch
    term: JOIN FETCH
    aka:
      - join fetch
    definition: A JPQL join that loads an association in the same query as its owner.
    see: lazy-loading-n-plus-one
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: entity-graph
    term: "@EntityGraph"
    definition: Names the associations a repository method loads in the same query.
    see: lazy-loading-n-plus-one
    source:
      title: "Spring Data JPA 4.1: JPA query methods"
      url: https://docs.spring.io/spring-data/jpa/reference/jpa/query-methods.html
      verifiedOn: 2026-10-19
  - id: lazy-initialization-exception
    term: LazyInitializationException
    definition: Hibernate's error when lazy data is read after its persistence context ended.
    see: lazy-loading-n-plus-one
    source:
      title: A Short Guide to Hibernate 7 (7.4)
      url: https://docs.hibernate.org/orm/7.4/introduction/html_single/
      verifiedOn: 2026-10-19
  - id: open-session-in-view
    term: Open Session in View
    aka:
      - open-in-view
      - spring.jpa.open-in-view
      - Open EntityManager in View
    definition: Keeps the EntityManager open for the whole web request; on by default in Spring Boot MVC apps (spring.jpa.open-in-view=true).
    see: lazy-loading-n-plus-one
    source:
      title: "JpaBaseConfiguration: open-in-view (Spring Boot v4.1.1 source)"
      url: https://github.com/spring-projects/spring-boot/blob/v4.1.1/module/spring-boot-jpa/src/main/java/org/springframework/boot/jpa/autoconfigure/JpaBaseConfiguration.java
      verifiedOn: 2026-10-19
  - id: version-annotation
    term: "@Version"
    definition: An entity field checked and incremented on update, for optimistic locking.
    see: locking
    source:
      title: Version (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/Version.html
      verifiedOn: 2026-10-19
  - id: optimistic-locking
    term: Optimistic locking
    aka:
      - optimistic lock
    definition: No lock on read; an update fails if the @Version changed since the read.
    see: locking
    source:
      title: Version (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/Version.html
      verifiedOn: 2026-10-19
  - id: pessimistic-locking
    term: Pessimistic locking
    aka:
      - pessimistic lock
    definition: A database row lock, such as select for update, held until the transaction ends.
    see: locking
    source:
      title: LockModeType (Jakarta Persistence 3.2 API)
      url: https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/LockModeType.html
      verifiedOn: 2026-10-19
  - id: lost-update
    term: Lost update
    aka:
      - lost updates
    definition: Two transactions update the same row and the later write silently erases the earlier one.
    see: locking
    source:
      title: Jakarta Persistence 3.2 specification
      url: https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html
      verifiedOn: 2026-10-19
  - id: transaction
    term: Transaction
    aka:
      - database transaction
    definition: "Several database steps run as one all-or-nothing unit: commit keeps them all, rollback cancels them all."
    see: transactional
    source:
      title: Glossary (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/current/glossary.html
      verifiedOn: 2026-10-19
  - id: transactional-annotation
    term: "@Transactional"
    definition: Spring annotation that runs a method or class inside a transaction, through a proxy.
    see: transactional
    source:
      title: Using @Transactional (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
      verifiedOn: 2026-10-19
  - id: transaction-manager
    term: Transaction manager
    aka:
      - PlatformTransactionManager
      - TransactionManager
    definition: The Spring object that begins, commits and rolls back transactions, such as JpaTransactionManager.
    see: transactional
    source:
      title: Using @Transactional (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html
      verifiedOn: 2026-10-19
  - id: rollback
    term: Rollback
    definition: Cancelling all changes a transaction made, so the database is as it was before.
    see: transactional
    source:
      title: Rolling Back a Declarative Transaction (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
      verifiedOn: 2026-10-19
  - id: rollback-rules
    term: Rollback rules
    aka:
      - rollbackFor
      - noRollbackFor
    definition: "@Transactional settings for which exceptions roll back; by default RuntimeException and Error do, checked ones do not."
    see: transactional
    source:
      title: Rolling Back a Declarative Transaction (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html
      verifiedOn: 2026-10-19
  - id: read-only-transaction
    term: Read-only transaction
    aka:
      - readOnly = true
      - readOnly
    definition: A hint that a transaction only reads; it may speed things up but does not block writes.
    see: transactional
    source:
      title: Transactional (Spring Framework 7.0.9 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Transactional.html
      verifiedOn: 2026-10-19
  - id: transaction-propagation-term
    term: Propagation (transactions)
    aka:
      - transaction propagation
      - propagation level
    definition: The @Transactional setting that says whether a method joins the current transaction, starts a new one, or runs without one.
    see: transaction-propagation
    source:
      title: Transaction Propagation (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
      verifiedOn: 2026-10-19
  - id: propagation-required
    term: REQUIRED (propagation)
    aka:
      - Propagation.REQUIRED
      - PROPAGATION_REQUIRED
    definition: "The default propagation: join the current transaction, or start one if none exists."
    see: transaction-propagation
    source:
      title: Transaction Propagation (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
      verifiedOn: 2026-10-19
  - id: propagation-requires-new
    term: REQUIRES_NEW
    aka:
      - Propagation.REQUIRES_NEW
      - PROPAGATION_REQUIRES_NEW
    definition: Propagation that suspends the current transaction and runs in a new one that commits on its own.
    see: transaction-propagation
    source:
      title: Transaction Propagation (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
      verifiedOn: 2026-10-19
  - id: propagation-nested
    term: NESTED (propagation)
    aka:
      - Propagation.NESTED
      - PROPAGATION_NESTED
    definition: Propagation that stays in the current transaction but sets a savepoint, so the inner part can roll back alone.
    see: transaction-propagation
    source:
      title: Transaction Propagation (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
      verifiedOn: 2026-10-19
  - id: savepoint
    term: Savepoint
    definition: A mark inside a transaction; changes after it can be rolled back without undoing the rest.
    see: transaction-propagation
    source:
      title: Glossary (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/current/glossary.html
      verifiedOn: 2026-10-19
  - id: unexpected-rollback-exception
    term: UnexpectedRollbackException
    definition: Thrown when the outer method commits but an inner scope had already marked the shared transaction rollback-only.
    see: transaction-propagation
    source:
      title: Transaction Propagation (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
      verifiedOn: 2026-10-19
  - id: acid
    term: ACID
    definition: "Atomicity, Consistency, Isolation, Durability: the guarantees a database transaction gives."
    see: acid-isolation
    source:
      title: Glossary (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/current/glossary.html
      verifiedOn: 2026-10-19
  - id: isolation-level
    term: Isolation level
    aka:
      - transaction isolation
    definition: How much a transaction sees of other transactions' changes, from READ_UNCOMMITTED to SERIALIZABLE.
    see: acid-isolation
    source:
      title: Isolation (Spring Framework 7.0.9 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html
      verifiedOn: 2026-10-19
  - id: read-committed
    term: READ COMMITTED
    aka:
      - READ_COMMITTED
    definition: Isolation level that stops dirty reads; PostgreSQL's default.
    see: acid-isolation
    source:
      title: Transaction Isolation (PostgreSQL 18 documentation)
      url: https://www.postgresql.org/docs/current/transaction-iso.html
      verifiedOn: 2026-10-19
  - id: repeatable-read
    term: REPEATABLE READ
    aka:
      - REPEATABLE_READ
    definition: Isolation level where re-reading a row gives the same values; MySQL InnoDB's default.
    see: acid-isolation
    source:
      title: InnoDB Transaction Isolation Levels (MySQL 8.4 Reference Manual)
      url: https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html
      verifiedOn: 2026-10-19
  - id: serializable-isolation
    term: SERIALIZABLE (isolation)
    aka:
      - SERIALIZABLE isolation
    definition: "The strictest isolation level: transactions behave as if they ran one after another."
    see: acid-isolation
    source:
      title: Isolation (Spring Framework 7.0.9 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html
      verifiedOn: 2026-10-19
  - id: dirty-read
    term: Dirty read
    definition: Reading a change another transaction has made but not yet committed.
    see: acid-isolation
    source:
      title: Isolation (Spring Framework 7.0.9 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html
      verifiedOn: 2026-10-19
  - id: non-repeatable-read
    term: Non-repeatable read
    definition: Reading the same row twice and getting different values, because another transaction changed it in between.
    see: acid-isolation
    source:
      title: Isolation (Spring Framework 7.0.9 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html
      verifiedOn: 2026-10-19
  - id: phantom-read
    term: Phantom read
    definition: Running the same WHERE query twice and getting a different set of rows, after another transaction's insert or delete.
    see: acid-isolation
    source:
      title: Isolation (Spring Framework 7.0.9 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html
      verifiedOn: 2026-10-19
  - id: cache-abstraction
    term: Cache abstraction
    aka:
      - Spring cache abstraction
    definition: Spring's caching annotations and interfaces; a provider such as Caffeine or Redis stores the data.
    see: spring-cache
    source:
      title: How can I set the TTL/TTI/eviction policy? (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/specific-config.html
      verifiedOn: 2026-10-19
  - id: enable-caching
    term: "@EnableCaching"
    definition: Turns on Spring's annotation-driven caching; Boot then auto-configures a cache manager.
    see: spring-cache
    source:
      title: Caching (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/io/caching.html
      verifiedOn: 2026-10-19
  - id: cacheable-annotation
    term: "@Cacheable"
    definition: Returns the cached value for the same key without running the method; on a miss, runs it and stores the result.
    see: spring-cache
    source:
      title: Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-19
  - id: cache-put-annotation
    term: "@CachePut"
    definition: Always runs the method and puts its result in the cache.
    see: spring-cache
    source:
      title: Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-19
  - id: cache-evict-annotation
    term: "@CacheEvict"
    definition: Removes an entry from the cache, or every entry with allEntries = true.
    see: spring-cache
    source:
      title: Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-19
  - id: cache-hit
    term: Cache hit
    aka:
      - cache hits
    definition: The value for the key is already in the cache, so it is returned without the slow work.
    see: spring-cache
    source:
      title: Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-19
  - id: cache-miss
    term: Cache miss
    aka:
      - cache misses
    definition: The key is not in the cache, so the method runs and its result is stored.
    see: spring-cache
    source:
      title: Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
      verifiedOn: 2026-10-19
  - id: ttl
    term: TTL (time to live)
    aka:
      - TTL
      - time to live
      - time-to-live
    definition: How long a cache entry lives before it expires; set on the provider, not on @Cacheable.
    see: spring-cache
    source:
      title: How can I set the TTL/TTI/eviction policy? (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/cache/specific-config.html
      verifiedOn: 2026-10-19
  - id: caffeine
    term: Caffeine
    definition: A fast in-memory caching library for Java; a common local provider for Spring's cache.
    see: spring-cache
    source:
      title: Caffeine README (ben-manes, GitHub)
      url: https://github.com/ben-manes/caffeine
      verifiedOn: 2026-10-17
  - id: redis
    term: Redis
    definition: An in-memory data store often used as a cache shared by all app instances.
    see: spring-cache
    source:
      title: "Redis Open Source: get started (redis.io)"
      url: https://redis.io/docs/latest/get-started/
      verifiedOn: 2026-10-17
  - id: connection-pool-term
    term: Connection pool
    aka:
      - connection pooling
    definition: A set of open database connections that threads borrow and give back, instead of opening a new one each time.
    see: connection-pool
    source:
      title: SQL Databases (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/data/sql.html
      verifiedOn: 2026-10-19
  - id: hikaricp
    term: HikariCP
    aka:
      - Hikari
    definition: The JDBC connection pool Spring Boot picks first; Boot 4.1 manages HikariCP 7.0.2.
    see: connection-pool
    source:
      title: Dependency versions (Spring Boot 4.1.1 appendix)
      url: https://docs.spring.io/spring-boot/appendix/dependency-versions/coordinates.html
      verifiedOn: 2026-10-19
  - id: datasource
    term: DataSource
    definition: The JDBC object the app gets connections from; Boot builds a pooled one from spring.datasource.* properties.
    see: connection-pool
    source:
      title: SQL Databases (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/data/sql.html
      verifiedOn: 2026-10-19
  - id: database-migration
    term: Database migration
    aka:
      - schema migration
      - migration script
    definition: A versioned script that changes the schema; a tool applies each one once and records it.
    see: schema-migrations
    source:
      title: Versioned migrations (Redgate Flyway docs)
      url: https://documentation.red-gate.com/fd/versioned-migrations-273973333.html
      verifiedOn: 2026-10-19
  - id: flyway
    term: Flyway
    definition: A migration tool that runs versioned SQL files once each and records them in flyway_schema_history.
    see: schema-migrations
    source:
      title: Versioned migrations (Redgate Flyway docs)
      url: https://documentation.red-gate.com/fd/versioned-migrations-273973333.html
      verifiedOn: 2026-10-19
  - id: liquibase
    term: Liquibase
    definition: A migration tool that applies changesets from a changelog and records them in DATABASECHANGELOG.
    see: schema-migrations
    source:
      title: What is a Changelog? (Liquibase docs)
      url: https://docs.liquibase.com/concepts/changelogs/home.html
      verifiedOn: 2026-10-19
  - id: ddl-auto
    term: ddl-auto
    aka:
      - spring.jpa.hibernate.ddl-auto
      - hbm2ddl
    definition: "Boot property for Hibernate's schema handling: none, validate, update, create or create-drop."
    see: schema-migrations
    source:
      title: Database Initialization how-to (Spring Boot 4.1.1)
      url: https://docs.spring.io/spring-boot/how-to/data-initialization.html
      verifiedOn: 2026-10-19
