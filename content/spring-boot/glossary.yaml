# Interviewer terms, one line each. `aka` = other words that link to the same term.
# `see` = the concept that explains it fully (optional). The first mention in a concept links automatically;
# when two terms match at the same place, the longer match wins.
terms:
  # Boot Basics
  - id: spring-framework
    term: "Spring Framework"
    definition: "The core Java framework under Spring Boot: a dependency injection container plus modules for web, data access and transactions."
    see: spring-vs-spring-boot
    source: { title: "Spring Framework Overview (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/overview.html", verifiedOn: "2026-10-17" }

  - id: convention-over-configuration
    term: "Convention over configuration"
    aka: [ "opinionated defaults" ]
    definition: "Sensible defaults are chosen for you, so you configure only what differs. Spring Boot follows this idea."
    see: spring-vs-spring-boot
    source: { title: "Spring Framework Overview: Spring Boot favors convention over configuration", url: "https://docs.spring.io/spring-framework/reference/overview.html", verifiedOn: "2026-10-17" }

  - id: starter
    term: "Starter"
    aka: [ "Spring Boot starter" ]
    definition: "A dependency descriptor that brings a tested set of libraries for one feature, e.g. spring-boot-starter-data-jpa."
    see: starters
    source: { title: "Build Systems: Starters (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/using/build-systems.html", verifiedOn: "2026-10-17" }

  - id: bom
    term: "BOM (bill of materials)"
    aka: [ "BOM", "bill of materials" ]
    definition: "A Maven POM that only lists versions. Import it into dependencyManagement and you can leave versions out; Boot's is spring-boot-dependencies."
    see: starters
    source: { title: "Introduction to the Dependency Mechanism: BOM POMs (Apache Maven)", url: "https://maven.apache.org/guides/introduction/introduction-to-dependency-mechanism.html", verifiedOn: "2026-10-17" }

  - id: spring-boot-starter-parent
    term: "spring-boot-starter-parent"
    definition: "Boot's Maven parent POM: managed versions from spring-boot-dependencies plus build defaults such as Java 17 and UTF-8."
    see: starters
    source: { title: "Using the Plugin: inheriting the starter parent POM (Spring Boot 4.1.1 Maven plugin)", url: "https://docs.spring.io/spring-boot/maven-plugin/using.html", verifiedOn: "2026-10-17" }

  - id: spring-initializr
    term: "Spring Initializr"
    aka: [ "start.spring.io" ]
    definition: "A web tool at start.spring.io that generates a new Spring Boot project with your build tool, versions and starters."
    see: starters
    source: { title: "Developing Your First Spring Boot Application: start.spring.io (Spring Boot 4.1.1 tutorial)", url: "https://docs.spring.io/spring-boot/tutorial/first-application/index.html", verifiedOn: "2026-10-17" }

  - id: classpath
    term: "Classpath"
    aka: [ "class path" ]
    definition: "The list of folders and jar files the JVM searches for classes. Boot's auto-configuration checks which classes are on it."
    see: auto-configuration
    source: { title: "The java Command: --class-path (Java SE 25 docs)", url: "https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html", verifiedOn: "2026-10-17" }

  - id: meta-annotation
    term: "Meta-annotation"
    aka: [ "composed annotation" ]
    definition: "An annotation placed on another annotation, so using the outer one applies the inner ones too, like @SpringBootApplication."
    see: spring-boot-application
    source: { title: "Classpath Scanning: meta-annotations and composed annotations (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html", verifiedOn: "2026-10-17" }

  - id: component-scanning
    term: "Component scanning"
    aka: [ "component scan", "classpath scanning" ]
    definition: "Spring searches given packages for classes marked @Component, @Service, @Repository or @Controller and registers them as beans."
    see: spring-boot-application
    source: { title: "Classpath Scanning and Managed Components (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html", verifiedOn: "2026-10-17" }

  - id: auto-configuration
    term: "Auto-configuration"
    aka: [ "autoconfiguration" ]
    definition: "Boot creates commonly needed beans from the jars on the classpath, and backs off when you define your own."
    see: auto-configuration
    source: { title: "Auto-configuration (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/using/auto-configuration.html", verifiedOn: "2026-10-17" }

  - id: condition-evaluation-report
    term: "Condition evaluation report"
    aka: [ "conditions report" ]
    definition: "Lists each auto-configuration and why its conditions matched or not; shown with --debug or at /actuator/conditions."
    see: auto-configuration
    source: { title: "Spring Boot Application how-to: troubleshoot auto-configuration (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/application.html", verifiedOn: "2026-10-17" }

  - id: spring-application
    term: "SpringApplication"
    definition: "The Boot class whose run method starts the app from main: it creates and refreshes the context, then calls the runners."
    see: application-startup
    source: { title: "SpringApplication (Spring Boot 4.1.1 API)", url: "https://docs.spring.io/spring-boot/api/java/org/springframework/boot/SpringApplication.html", verifiedOn: "2026-10-17" }

  - id: command-line-runner
    term: "CommandLineRunner"
    definition: "A bean whose run(String... args) is called once, just before SpringApplication.run returns."
    see: application-startup
    source: { title: "SpringApplication: ApplicationRunner and CommandLineRunner (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/spring-application.html", verifiedOn: "2026-10-17" }

  - id: application-runner
    term: "ApplicationRunner"
    definition: "Like CommandLineRunner, but run gets ApplicationArguments, with --name=value options already parsed."
    see: application-startup
    source: { title: "SpringApplication: ApplicationRunner and CommandLineRunner (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/spring-application.html", verifiedOn: "2026-10-17" }

  - id: application-ready-event
    term: "ApplicationReadyEvent"
    definition: "Published after the runners have been called; right after it, the app's readiness turns to accepting traffic."
    see: application-startup
    source: { title: "SpringApplication: application events and listeners (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/spring-application.html", verifiedOn: "2026-10-17" }

  - id: lazy-initialization
    term: "Lazy initialisation"
    aka: [ "lazy initialization", "lazy init" ]
    definition: "Beans are created when first needed, not at startup. spring.main.lazy-initialization=true does it for all beans."
    see: application-startup
    source: { title: "SpringApplication: lazy initialization (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/spring-application.html", verifiedOn: "2026-10-17" }

  - id: failure-analyzer
    term: "FailureAnalyzer"
    aka: [ "failure analyser", "failure analyzer" ]
    definition: "Turns a startup exception into a readable description of the problem and a suggested action."
    see: application-startup
    source: { title: "Spring Boot Application how-to: create your own FailureAnalyzer (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/application.html", verifiedOn: "2026-10-17" }

  - id: embedded-server
    term: "Embedded server"
    aka: [ "embedded web server", "embedded servlet container" ]
    definition: "A web server that runs inside the app as a library, so java -jar starts the app and the server together."
    see: embedded-server
    source: { title: "Embedded Web Servers how-to (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/webserver.html", verifiedOn: "2026-10-17" }

  - id: servlet-container
    term: "Servlet container"
    aka: [ "servlet engine" ]
    definition: "The part of a web server that receives HTTP requests and passes them to servlets it manages, such as Tomcat or Jetty."
    see: embedded-server
    source: { title: "Jakarta Servlet Specification 6.1: what is a servlet container?", url: "https://jakarta.ee/specifications/servlet/6.1/jakarta-servlet-spec-6.1.html", verifiedOn: "2026-10-17" }

  - id: tomcat
    term: "Tomcat"
    aka: [ "Apache Tomcat" ]
    definition: "Apache's open-source servlet container; Spring Boot's default embedded server (Tomcat 11.0 in Boot 4.1)."
    see: embedded-server
    source: { title: "Apache Tomcat home page", url: "https://tomcat.apache.org/", verifiedOn: "2026-10-17" }

  - id: jetty
    term: "Jetty"
    aka: [ "Eclipse Jetty" ]
    definition: "Eclipse's web server and servlet container; Spring Boot's alternative to Tomcat (Jetty 12.1 in Boot 4.1)."
    see: embedded-server
    source: { title: "Eclipse Jetty home page", url: "https://jetty.org/", verifiedOn: "2026-10-17" }

  - id: graceful-shutdown
    term: "Graceful shutdown"
    definition: "On stop, the server refuses new requests but lets running ones finish within a timeout; Boot's default since 3.4."
    see: embedded-server
    source: { title: "Graceful Shutdown (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html", verifiedOn: "2026-10-17" }

  - id: devtools
    term: "DevTools"
    aka: [ "Spring Boot DevTools", "spring-boot-devtools" ]
    definition: "Boot's development-only module: automatic restart, development property defaults and remote restart; off in packaged apps."
    see: devtools
    source: { title: "Developer Tools (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/using/devtools.html", verifiedOn: "2026-10-17" }

  - id: livereload
    term: "LiveReload"
    definition: "A small server that tells the browser to refresh when resources change. In DevTools it is off by default and deprecated in 4.1."
    see: devtools
    source: { title: "Developer Tools: LiveReload (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/using/devtools.html", verifiedOn: "2026-10-17" }

  # Beans and DI
  - id: inversion-of-control
    term: "Inversion of control (IoC)"
    aka: ["inversion of control", "IoC"]
    definition: "A design where the framework, not your code, creates objects and connects them to each other."
    see: ioc-container
    source: { title: "Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html", verifiedOn: "2026-10-17" }

  - id: dependency-injection
    term: "Dependency injection (DI)"
    aka: ["dependency injection", "DI"]
    definition: "A form of IoC where an object receives its collaborators through its constructor, setters or fields instead of creating them."
    see: dependency-injection
    source: { title: "Dependency Injection (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html", verifiedOn: "2026-10-17" }

  - id: bean
    term: "Bean"
    aka: ["Spring bean"]
    definition: "An object that the Spring IoC container creates, wires and manages."
    see: ioc-container
    source: { title: "Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html", verifiedOn: "2026-10-17" }

  - id: bean-definition
    term: "Bean definition"
    definition: "The container's recipe for a bean: its class, name, scope, dependencies, lazy flag and lifecycle callbacks."
    see: ioc-container
    source: { title: "Bean Overview (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/definition.html", verifiedOn: "2026-10-17" }

  - id: application-context
    term: "ApplicationContext"
    aka: ["application context"]
    definition: "Spring's main container interface: BeanFactory plus events, i18n messages, AOP integration and automatic post-processor registration."
    see: ioc-container
    source: { title: "Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html", verifiedOn: "2026-10-17" }

  - id: bean-factory
    term: "BeanFactory"
    aka: ["bean factory"]
    definition: "The root interface of Spring's container: it creates and wires beans, without the extras that ApplicationContext adds."
    see: ioc-container
    source: { title: "The BeanFactory API (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/beanfactory.html", verifiedOn: "2026-10-17" }

  - id: autowiring
    term: "Autowiring"
    aka: ["autowire"]
    definition: "Spring finding a matching bean by type and injecting it into a constructor, setter or field, usually marked @Autowired."
    see: dependency-injection
    source: { title: "Using @Autowired (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired.html", verifiedOn: "2026-10-17" }

  - id: constructor-injection
    term: "Constructor injection"
    definition: "Passing dependencies as constructor arguments; the fields can be final and the object is never half-built."
    see: dependency-injection
    source: { title: "Dependency Injection: constructor-based DI (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html", verifiedOn: "2026-10-17" }

  - id: setter-injection
    term: "Setter injection"
    definition: "The container builds the object with a no-argument constructor, then calls setters to inject dependencies; suits optional ones."
    see: dependency-injection
    source: { title: "Dependency Injection: setter-based DI (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html", verifiedOn: "2026-10-17" }

  - id: field-injection
    term: "Field injection"
    definition: "Spring sets @Autowired fields by reflection right after the constructor runs; the fields cannot be final."
    see: dependency-injection
    source: { title: "Autowired: autowired fields (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/annotation/Autowired.html", verifiedOn: "2026-10-17" }

  - id: stereotype-annotation
    term: "Stereotype annotation"
    aka: ["stereotype", "stereotypes"]
    definition: "@Component or an annotation built on it, such as @Service, @Repository or @Controller, that marks a bean and its layer."
    see: component-vs-bean
    source: { title: "Classpath Scanning and Managed Components (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html", verifiedOn: "2026-10-17" }

  - id: exception-translation
    term: "Exception translation"
    aka: ["persistence exception translation"]
    definition: "Turning database-specific exceptions into Spring's DataAccessException hierarchy; a post-processor applies it to @Repository beans."
    see: component-vs-bean
    source: { title: "PersistenceExceptionTranslationPostProcessor (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/dao/annotation/PersistenceExceptionTranslationPostProcessor.html", verifiedOn: "2026-10-17" }

  - id: lite-bean-mode
    term: "Lite mode (@Bean)"
    aka: ["lite mode"]
    definition: "@Bean methods processed without a CGLIB subclass, in a plain class or with proxyBeanMethods = false; calls between them are plain Java."
    see: component-vs-bean
    source: { title: "Basic Concepts: @Bean and @Configuration (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/java/basic-concepts.html", verifiedOn: "2026-10-17" }

  - id: bean-registrar
    term: "BeanRegistrar"
    definition: "A Spring Framework 7 interface for registering beans in code, with conditions or loops; imported with @Import."
    see: component-vs-bean
    source: { title: "Programmatic Bean Registration (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/java/programmatic-bean-registration.html", verifiedOn: "2026-10-17" }

  - id: bean-scope
    term: "Bean scope"
    definition: "How many instances of a bean exist and how long each lives: singleton, prototype, request, session, application or websocket."
    see: bean-scopes
    source: { title: "Bean Scopes (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html", verifiedOn: "2026-10-17" }

  - id: singleton-scope
    term: "Singleton scope"
    aka: ["singleton bean"]
    definition: "The default scope: one shared instance per container and bean definition, created at startup unless lazy."
    see: bean-scopes
    source: { title: "Bean Scopes: the singleton scope (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html", verifiedOn: "2026-10-17" }

  - id: prototype-scope
    term: "Prototype scope"
    aka: ["prototype bean"]
    definition: "A scope where the container makes a new instance each time the bean is requested, and never calls its destroy callbacks."
    see: bean-scopes
    source: { title: "Bean Scopes: the prototype scope (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html", verifiedOn: "2026-10-17" }

  - id: scoped-proxy
    term: "Scoped proxy"
    definition: "A proxy injected in place of a request- or session-scoped bean; each call goes to the instance of the current request or session."
    see: bean-scopes
    source: { title: "Bean Scopes: scoped beans as dependencies (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html", verifiedOn: "2026-10-17" }

  - id: object-provider
    term: "ObjectProvider"
    definition: "An injectable handle that looks beans up on demand: getObject(), getIfAvailable(), getIfUnique() or a stream of all matches."
    see: bean-scopes
    source: { title: "ObjectProvider (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/ObjectProvider.html", verifiedOn: "2026-10-17" }

  - id: lookup-method-injection
    term: "Lookup method injection"
    aka: ["method injection", "lookup method"]
    definition: "Spring overrides a method through a CGLIB subclass so each call returns a bean from the container, such as a new prototype."
    see: bean-scopes
    source: { title: "Method Injection (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-method-injection.html", verifiedOn: "2026-10-17" }

  - id: lifecycle-callback
    term: "Lifecycle callback"
    aka: ["init callback", "destroy callback"]
    definition: "A method Spring calls at a fixed point in a bean's life: after injection (init) or when the context closes (destroy)."
    see: bean-lifecycle
    source: { title: "Customizing the Nature of a Bean: lifecycle callbacks (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html", verifiedOn: "2026-10-17" }

  - id: aware-interfaces
    term: "Aware interface"
    aka: ["Aware callback"]
    definition: "An interface such as ApplicationContextAware that makes Spring hand the bean a container object; it couples code to Spring."
    see: bean-lifecycle
    source: { title: "Customizing the Nature of a Bean: Aware interfaces (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html", verifiedOn: "2026-10-17" }

  - id: bean-post-processor
    term: "BeanPostProcessor"
    definition: "A container hook that runs before and after each bean's init callbacks and may return a wrapper, such as an AOP proxy."
    see: bean-lifecycle
    source: { title: "Container Extension Points: BeanPostProcessor (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-extension.html", verifiedOn: "2026-10-17" }

  - id: bean-factory-post-processor
    term: "BeanFactoryPostProcessor"
    definition: "A container hook that edits bean definitions, never instances, before regular beans are created; it fills ${...} placeholders, for example."
    see: bean-lifecycle
    source: { title: "BeanFactoryPostProcessor (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/config/BeanFactoryPostProcessor.html", verifiedOn: "2026-10-17" }

  - id: no-unique-bean-definition-exception
    term: "NoUniqueBeanDefinitionException"
    definition: "Thrown when several beans match an injection point that needs exactly one, and nothing decides between them."
    see: bean-selection
    source: { title: "NoUniqueBeanDefinitionException (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/NoUniqueBeanDefinitionException.html", verifiedOn: "2026-10-17" }

  - id: qualifier-annotation
    term: "Qualifier"
    definition: "A label on beans; @Qualifier at an injection point keeps only the matching beans with that label or bean name."
    see: bean-selection
    source: { title: "Fine-tuning Annotation-based Autowiring with Qualifiers (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html", verifiedOn: "2026-10-17" }

  - id: primary-annotation
    term: "Primary bean"
    definition: "The bean marked @Primary: Spring injects it when several beans of the requested type match."
    see: bean-selection
    source: { title: "Using @Primary or @Fallback (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-primary.html", verifiedOn: "2026-10-17" }

  - id: circular-dependency
    term: "Circular dependency"
    aka: ["circular dependencies", "circular reference", "dependency cycle"]
    definition: "Beans that need each other, directly or through others. Spring Boot rejects them at startup by default since 2.6."
    see: circular-dependencies
    source: { title: "Spring Boot 2.6 Release Notes: circular references prohibited by default", url: "https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes", verifiedOn: "2026-10-17" }

  - id: bean-currently-in-creation-exception
    term: "BeanCurrentlyInCreationException"
    definition: "Thrown on a reference to a bean that is still being created, typically a constructor cycle that cannot be resolved."
    see: circular-dependencies
    source: { title: "BeanCurrentlyInCreationException (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/BeanCurrentlyInCreationException.html", verifiedOn: "2026-10-17" }

  - id: early-bean-reference
    term: "Early bean reference"
    aka: ["early reference", "three-level cache"]
    definition: "A reference to a singleton that is still being built, which plain Spring injects to break setter or field cycles."
    see: circular-dependencies
    source: { title: "AbstractAutowireCapableBeanFactory.setAllowCircularReferences (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/support/AbstractAutowireCapableBeanFactory.html", verifiedOn: "2026-10-17" }

  - id: aop
    term: "AOP"
    aka: ["aspect-oriented programming", "Spring AOP"]
    definition: "Aspect-oriented programming: writing cross-cutting code, such as logging or transactions, once and applying it to many methods."
    see: aop-proxies
    source: { title: "AOP Concepts (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html", verifiedOn: "2026-10-17" }

  - id: cross-cutting-concern
    term: "Cross-cutting concern"
    aka: ["cross-cutting code", "cross-cutting logic", "cross-cutting behaviour"]
    definition: "Logic needed in many classes, such as logging, security or transactions, which AOP keeps in one place."
    see: aop-proxies
    source: { title: "AOP Concepts: aspect (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html", verifiedOn: "2026-10-17" }

  - id: aspect
    term: "Aspect"
    definition: "A class holding cross-cutting logic: advice plus the pointcuts that say where it runs. In Spring, @Aspect with @Component."
    see: aop-proxies
    source: { title: "Declaring an Aspect (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/at-aspectj.html", verifiedOn: "2026-10-17" }

  - id: advice
    term: "Advice (AOP)"
    aka: ["around advice", "before advice", "after advice", "AOP advice"]
    definition: "The code an aspect runs at a join point: before, after returning, after throwing, after (finally) or around."
    see: aop-proxies
    source: { title: "AOP Concepts: advice types (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html", verifiedOn: "2026-10-17" }

  - id: pointcut
    term: "Pointcut"
    definition: "An expression that selects join points, such as execution(* com.shop.service..*.*(..)) for every service method."
    see: aop-proxies
    source: { title: "Declaring a Pointcut (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/pointcuts.html", verifiedOn: "2026-10-17" }

  - id: join-point
    term: "Join point"
    definition: "A point in program execution where advice can run; in Spring AOP it is always a method execution."
    see: aop-proxies
    source: { title: "AOP Concepts: join point (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html", verifiedOn: "2026-10-17" }

  - id: weaving
    term: "Weaving"
    definition: "Linking aspects to the code they advise: at compile or load time in AspectJ, at runtime through proxies in Spring AOP."
    see: aop-proxies
    source: { title: "AOP Concepts: weaving (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html", verifiedOn: "2026-10-17" }

  - id: aop-proxy
    term: "Proxy (Spring AOP)"
    aka: ["AOP proxy", "AOP proxies", "Spring proxy", "Spring proxies"]
    definition: "An object Spring puts in place of a bean: it runs advice around each call, then calls the real bean. A JDK or CGLIB proxy."
    see: aop-proxies
    source: { title: "AOP Concepts: AOP proxy (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html", verifiedOn: "2026-10-17" }

  - id: jdk-dynamic-proxy
    term: "JDK dynamic proxy"
    aka: ["JDK proxy", "JDK proxies", "JDK dynamic proxies"]
    definition: "A proxy built into the JDK that implements the target's interfaces; only interface methods can be advised."
    see: aop-proxies
    source: { title: "Proxying Mechanisms (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/proxying.html", verifiedOn: "2026-10-17" }

  - id: cglib-proxy
    term: "CGLIB proxy"
    aka: ["CGLIB", "CGLIB proxies"]
    definition: "A proxy that is a runtime-generated subclass of the target class; Spring Boot's default. Final and private methods cannot be advised."
    see: aop-proxies
    source: { title: "Proxying Mechanisms (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/proxying.html", verifiedOn: "2026-10-17" }

  - id: self-invocation
    term: "Self-invocation"
    aka: ["self invocation", "self-call"]
    definition: "A bean calling its own method through this; the call skips the proxy, so @Transactional, @Async or @Cacheable does not apply."
    see: aop-proxies
    source: { title: "Proxying Mechanisms: understanding AOP proxies (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/core/aop/proxying.html", verifiedOn: "2026-10-17" }

  # Configuration
  - id: spring-environment
    term: "Environment (Spring)"
    aka: [ "Spring Environment" ]
    definition: "Spring's single view of all property sources and the active profiles; code asks it for a key, not for a file."
    see: externalized-configuration
    source: { title: "Environment Abstraction (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/environment.html", verifiedOn: "2026-10-17" }

  - id: property-source
    term: "PropertySource"
    aka: [ "property source" ]
    definition: "One named set of key-value pairs in the Environment, such as a config file, the env vars or the system properties."
    see: externalized-configuration
    source: { title: "Environment Abstraction (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/environment.html", verifiedOn: "2026-10-17" }

  - id: twelve-factor-app
    term: "Twelve-Factor App"
    aka: [ "twelve-factor", "12-factor" ]
    definition: "A set of rules for cloud apps. Rule III: keep config, anything that changes per deploy, out of the code, in environment variables."
    see: externalized-configuration
    source: { title: "III. Config (The Twelve-Factor App)", url: "https://12factor.net/config", verifiedOn: "2026-10-17" }

  - id: spring-application-json
    term: "SPRING_APPLICATION_JSON"
    definition: "An env var or system property holding properties as inline JSON; it ranks just below command-line arguments."
    see: externalized-configuration
    source: { title: "Externalized Configuration: JSON Application Properties (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: config-tree
    term: "Configuration tree"
    aka: [ "configtree" ]
    definition: "A folder imported with configtree: where each file name becomes a key and its content the value; used for Kubernetes and Docker secrets."
    see: externalized-configuration
    source: { title: "Externalized Configuration: Using Configuration Trees (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: property-placeholder
    term: "Property placeholder"
    definition: "A ${name} reference in a value or in @Value, replaced by that property; ${name:fallback} gives a default."
    see: externalized-configuration
    source: { title: "Externalized Configuration: Property Placeholders (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: yaml
    term: "YAML"
    definition: "A text format that nests keys by indentation; a superset of JSON. Spring Boot reads application.yaml with SnakeYAML."
    see: externalized-configuration
    source: { title: "How-to: Use YAML for External Properties (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/properties-and-configuration.html", verifiedOn: "2026-10-17" }

  - id: snakeyaml
    term: "SnakeYAML"
    definition: "The YAML library Spring Boot needs on the classpath to read YAML config; spring-boot-starter brings it."
    see: externalized-configuration
    source: { title: "Externalized Configuration: Working With YAML (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: relaxed-binding
    term: "Relaxed binding"
    definition: "Spring Boot matches property names loosely: first-name, firstName, first_name and the upper-case env var form bind the same field."
    see: configuration-properties
    source: { title: "Externalized Configuration: Relaxed Binding (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: kebab-case
    term: "Kebab case"
    aka: [ "kebab-case" ]
    definition: "Lower-case words joined by dashes, like item-price; the recommended form for property keys in files and in @Value."
    see: configuration-properties
    source: { title: "Externalized Configuration: Relaxed Binding (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: spel
    term: "SpEL"
    aka: [ "Spring Expression Language" ]
    definition: "Spring's expression language, written #{...}; @Value evaluates it at runtime, @ConfigurationProperties does not."
    see: configuration-properties
    source: { title: "Using @Value (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/value-annotations.html", verifiedOn: "2026-10-17" }

  - id: constructor-binding
    term: "Constructor binding"
    definition: "Binding @ConfigurationProperties through a constructor or a record, so the values are immutable; @DefaultValue sets defaults."
    see: configuration-properties
    source: { title: "Externalized Configuration: Constructor Binding (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: configuration-metadata
    term: "Configuration metadata"
    definition: "JSON files that describe each property key, generated at compile time, so IDEs can autocomplete application.properties."
    see: configuration-properties
    source: { title: "Configuration Metadata (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/specification/configuration-metadata/index.html", verifiedOn: "2026-10-17" }

  - id: spring-profile
    term: "Profile (Spring)"
    aka: [ "Spring profile" ]
    definition: "A named switch, like dev or prod, that turns on its own beans and property files when it is active."
    see: profiles
    source: { title: "Profiles (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/profiles.html", verifiedOn: "2026-10-17" }

  - id: default-profile
    term: "Default profile"
    definition: "The profile named default, which is on only when no other profile is active; spring.profiles.default renames it."
    see: profiles
    source: { title: "Environment Abstraction: Default Profile (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/environment.html", verifiedOn: "2026-10-17" }

  - id: profile-groups
    term: "Profile group"
    definition: "One logical profile name that turns on several profiles, set with spring.profiles.group.<name>."
    see: profiles
    source: { title: "Profiles: Profile Groups (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/profiles.html", verifiedOn: "2026-10-17" }

  - id: multi-document-files
    term: "Multi-document file"
    definition: "One config file split into parts by --- (YAML) or #--- (properties); parts load top to bottom and can be tied to a profile."
    see: profiles
    source: { title: "Externalized Configuration: Working With Multi-Document Files (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }

  - id: logging-facade
    term: "Logging facade"
    definition: "A logging API that hides which library writes the logs, so the backend can change without touching code; SLF4J is one."
    see: logging
    source: { title: "SLF4J user manual", url: "https://www.slf4j.org/manual.html", verifiedOn: "2026-10-17" }

  - id: slf4j
    term: "SLF4J"
    aka: [ "Simple Logging Facade for Java" ]
    definition: "The Simple Logging Facade for Java: the logging API most code calls; a backend such as Logback does the writing."
    see: logging
    source: { title: "SLF4J user manual", url: "https://www.slf4j.org/manual.html", verifiedOn: "2026-10-17" }

  - id: logback
    term: "Logback"
    definition: "The default logging library in Spring Boot starters; it implements the SLF4J API natively."
    see: logging
    source: { title: "Logging (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }

  - id: log4j2
    term: "Log4j2"
    aka: [ "Log4j 2" ]
    definition: "Apache's logging library; Spring Boot supports it as an alternative to Logback through spring-boot-starter-log4j2."
    see: logging
    source: { title: "How-to: Configure Log4j for Logging (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/logging.html", verifiedOn: "2026-10-17" }

  - id: commons-logging
    term: "Commons Logging"
    definition: "Apache's logging API that Spring Boot itself uses internally; it leaves the real logging library open."
    see: logging
    source: { title: "Logging (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }

  - id: appender
    term: "Appender (Logback)"
    aka: [ "appender" ]
    definition: "The Logback part that writes each log event to a destination, such as the console or a rolling file."
    see: logging
    source: { title: "Appenders (Logback manual)", url: "https://logback.qos.ch/manual/appenders.html", verifiedOn: "2026-10-17" }

  - id: log-levels
    term: "Log level"
    definition: "How important a log message is: TRACE, DEBUG, INFO, WARN, ERROR, FATAL; OFF turns a logger off. Set with logging.level.*."
    see: logging
    source: { title: "Logging: Log Levels (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }

  - id: log-groups
    term: "Log group"
    definition: "A name for several loggers, so one logging.level.<group> sets them all; Spring Boot predefines web and sql."
    see: logging
    source: { title: "Logging: Log Groups (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }

  - id: log-rotation
    term: "Log rotation"
    definition: "Starting a new log file when the current one is full and keeping only some old ones; Logback in Boot rotates at 10MB."
    see: logging
    source: { title: "Logging: File Output, File Rotation (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }

  - id: structured-logging
    term: "Structured logging"
    definition: "Writing each log event as machine-readable JSON, such as ECS, GELF or Logstash, instead of a plain text line."
    see: logging
    source: { title: "Logging: Structured Logging (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }

  # Web and REST
  - id: spring-mvc
    term: "Spring MVC"
    definition: "Spring's Servlet-based web framework for controllers and REST APIs, built around DispatcherServlet."
    see: dispatcher-servlet
    source: { title: "DispatcherServlet (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html", verifiedOn: "2026-10-17" }

  - id: dispatcher-servlet
    term: "DispatcherServlet"
    definition: "Spring MVC's front-controller servlet: it receives every request and hands mapping, calling, rendering and errors to helper beans."
    see: dispatcher-servlet
    source: { title: "DispatcherServlet (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html", verifiedOn: "2026-10-17" }

  - id: front-controller
    term: "Front controller"
    aka: [ "front-controller" ]
    definition: "A design where one entry point receives all requests and dispatches each to the right handler."
    see: dispatcher-servlet
    source: { title: "DispatcherServlet: front controller pattern (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet.html", verifiedOn: "2026-10-17" }

  - id: handler-mapping
    term: "HandlerMapping"
    definition: "Finds the handler, such as a controller method, for a request, plus the interceptors to run around it."
    see: dispatcher-servlet
    source: { title: "Special Bean Types (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/special-bean-types.html", verifiedOn: "2026-10-17" }

  - id: handler-adapter
    term: "HandlerAdapter"
    definition: "Calls a handler for DispatcherServlet, for example resolving the arguments of an annotated controller method."
    see: dispatcher-servlet
    source: { title: "Special Bean Types (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/special-bean-types.html", verifiedOn: "2026-10-17" }

  - id: view-resolver
    term: "ViewResolver"
    definition: "Turns the logical view name a controller returns into a View that renders the page."
    see: dispatcher-servlet
    source: { title: "Special Bean Types (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/special-bean-types.html", verifiedOn: "2026-10-17" }

  - id: http-message-converter
    term: "HttpMessageConverter"
    aka: [ "message converter" ]
    definition: "Reads a request body into an object and writes an object to the response body, for example JSON with Jackson."
    see: dispatcher-servlet
    source: { title: "HTTP Message Conversion (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/message-converters.html", verifiedOn: "2026-10-17" }

  - id: jackson
    term: "Jackson"
    definition: "The JSON library Spring Boot uses by default; Boot 4 prefers Jackson 3, which has new tools.jackson group IDs and packages."
    see: dispatcher-servlet
    source: { title: "Spring Boot 4.0 Migration Guide: Jackson 3 (spring-projects wiki)", url: "https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide", verifiedOn: "2026-10-17" }

  - id: enable-web-mvc
    term: "@EnableWebMvc"
    definition: "Imports Spring MVC's configuration; in Spring Boot it switches off Boot's MVC auto-configuration."
    see: dispatcher-servlet
    source: { title: "Servlet Web Applications: Spring MVC auto-configuration (Spring Boot 4.1 reference)", url: "https://docs.spring.io/spring-boot/reference/web/servlet.html", verifiedOn: "2026-10-17" }

  - id: web-mvc-configurer
    term: "WebMvcConfigurer"
    definition: "Callback interface to customise Spring MVC, such as interceptors and formatters, while keeping Boot's auto-configuration."
    see: filters-interceptors
    source: { title: "Servlet Web Applications: Spring MVC auto-configuration (Spring Boot 4.1 reference)", url: "https://docs.spring.io/spring-boot/reference/web/servlet.html", verifiedOn: "2026-10-17" }

  - id: restcontroller-annotation
    term: "@RestController"
    definition: "@Controller plus @ResponseBody: every handler method writes its return value to the response body."
    see: rest-controller
    source: { title: "Declaration: @Controller and @RestController (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann.html", verifiedOn: "2026-10-17" }

  - id: response-body
    term: "@ResponseBody"
    definition: "Makes a handler method's return value the response body, written by a message converter, instead of a view name."
    see: rest-controller
    source: { title: "@ResponseBody (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/responsebody.html", verifiedOn: "2026-10-17" }

  - id: response-entity
    term: "ResponseEntity"
    definition: "A return type that carries the response body together with the HTTP status and headers."
    see: rest-controller
    source: { title: "ResponseEntity (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/responseentity.html", verifiedOn: "2026-10-17" }

  - id: response-status
    term: "@ResponseStatus"
    definition: "Sets a fixed HTTP status on a handler method, or on an exception class when it is thrown."
    see: rest-controller
    source: { title: "Exceptions: ResponseStatusExceptionResolver (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/exceptionhandlers.html", verifiedOn: "2026-10-17" }

  - id: content-negotiation
    term: "Content negotiation"
    definition: "Choosing the response media type, such as JSON or XML, from the request; Spring MVC reads only the Accept header by default."
    see: rest-controller
    source: { title: "MVC Config: Content Types (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-config/content-negotiation.html", verifiedOn: "2026-10-17" }

  - id: request-mapping-annotation
    term: "@RequestMapping"
    definition: "Maps requests to controller methods by path, HTTP method, parameters, headers and media types."
    see: request-mapping
    source: { title: "Mapping Requests (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html", verifiedOn: "2026-10-17" }

  - id: path-variable
    term: "@PathVariable"
    definition: "Binds a {name} segment of the URL path, such as the id in /users/42, to a method parameter."
    see: request-mapping
    source: { title: "Mapping Requests: URI patterns (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html", verifiedOn: "2026-10-17" }

  - id: request-param
    term: "@RequestParam"
    definition: "Binds a query parameter or form field to a method parameter; required unless required = false or a default is given."
    see: request-mapping
    source: { title: "@RequestParam (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestparam.html", verifiedOn: "2026-10-17" }

  - id: request-body
    term: "@RequestBody"
    definition: "Converts the request body, usually JSON, into a method parameter using a message converter."
    see: request-mapping
    source: { title: "@RequestBody (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html", verifiedOn: "2026-10-17" }

  - id: api-versioning
    term: "API versioning (Spring)"
    aka: [ "API versioning" ]
    definition: "Spring Framework 7 support for mapping one path to several API versions, read from a header, query parameter, path or media type."
    see: request-mapping
    source: { title: "API Versioning (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc-versioning.html", verifiedOn: "2026-10-17" }

  - id: jakarta-validation
    term: "Jakarta Validation"
    aka: [ "Bean Validation", "Jakarta Bean Validation" ]
    definition: "The Jakarta standard for constraint annotations such as @NotNull and @Size; version 3.1 dropped the word Bean from its name."
    see: validation
    source: { title: "Jakarta Validation 3.1 specification", url: "https://jakarta.ee/specifications/bean-validation/3.1/jakarta-validation-spec-3.1.html", verifiedOn: "2026-10-17" }

  - id: hibernate-validator
    term: "Hibernate Validator"
    definition: "The Jakarta Validation implementation that spring-boot-starter-validation brings in; version 9.1 in Spring Boot 4.1."
    see: validation
    source: { title: "Dependency Versions: hibernate-validator 9.1.3.Final (Spring Boot 4.1.1 appendix)", url: "https://docs.spring.io/spring-boot/appendix/dependency-versions/coordinates.html", verifiedOn: "2026-10-17" }

  - id: valid-annotation
    term: "@Valid"
    definition: "Jakarta annotation that validates an object and cascades into the nested objects it marks."
    see: validation
    source: { title: "Jakarta Validation 3.1 specification: graph validation", url: "https://jakarta.ee/specifications/bean-validation/3.1/jakarta-validation-spec-3.1.html", verifiedOn: "2026-10-17" }

  - id: validated-annotation
    term: "@Validated"
    definition: "Spring's variant of @Valid that can name validation groups; on a class it turns on method validation."
    see: validation
    source: { title: "@Validated (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/7.0.9/javadoc-api/org/springframework/validation/annotation/Validated.html", verifiedOn: "2026-10-17" }

  - id: validation-groups
    term: "Validation group"
    definition: "An interface that names a subset of constraints, such as OnCreate; constraints without a group belong to Default."
    see: validation
    source: { title: "Jakarta Validation 3.1 specification: group and group sequence", url: "https://jakarta.ee/specifications/bean-validation/3.1/jakarta-validation-spec-3.1.html", verifiedOn: "2026-10-17" }

  - id: method-argument-not-valid
    term: "MethodArgumentNotValidException"
    definition: "Thrown when a @Valid @RequestBody or model attribute fails validation; Spring MVC answers 400."
    see: validation
    source: { title: "Validation (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-validation.html", verifiedOn: "2026-10-17" }

  - id: handler-method-validation
    term: "HandlerMethodValidationException"
    definition: "Thrown when constraints declared directly on controller method parameters fail (Spring Framework 6.1+); answers 400."
    see: validation
    source: { title: "Validation (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-validation.html", verifiedOn: "2026-10-17" }

  - id: binding-result
    term: "BindingResult"
    definition: "A parameter declared right after a validated argument; it receives the errors, so no exception is thrown."
    see: validation
    source: { title: "@RequestBody: Errors or BindingResult argument (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html", verifiedOn: "2026-10-17" }

  - id: exception-handler
    term: "@ExceptionHandler"
    definition: "Marks a method that handles given exception types from controllers and returns the error response."
    see: exception-handling
    source: { title: "Exceptions: @ExceptionHandler (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-exceptionhandler.html", verifiedOn: "2026-10-17" }

  - id: controller-advice
    term: "@ControllerAdvice"
    aka: [ "@RestControllerAdvice" ]
    definition: "A bean whose @ExceptionHandler methods apply to all controllers; @RestControllerAdvice adds @ResponseBody."
    see: exception-handling
    source: { title: "Controller Advice (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-advice.html", verifiedOn: "2026-10-17" }

  - id: problem-detail
    term: "ProblemDetail"
    aka: [ "problem details", "RFC 9457" ]
    definition: "Spring's class for RFC 9457 error bodies: type, title, status, detail and instance, sent as application/problem+json."
    see: exception-handling
    source: { title: "Error Responses (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-ann-rest-exceptions.html", verifiedOn: "2026-10-17" }

  - id: response-status-exception
    term: "ResponseStatusException"
    definition: "An exception you throw with an HTTP status and a reason; the reason becomes the ProblemDetail detail."
    see: exception-handling
    source: { title: "ResponseStatusException (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/7.0.9/javadoc-api/org/springframework/web/server/ResponseStatusException.html", verifiedOn: "2026-10-17" }

  - id: whitelabel-error-page
    term: "Whitelabel error page"
    aka: [ "whitelabel page" ]
    definition: "Spring Boot's default HTML error page for browsers, served by BasicErrorController at /error."
    see: exception-handling
    source: { title: "Servlet Web Applications: Error Handling (Spring Boot 4.1 reference)", url: "https://docs.spring.io/spring-boot/reference/web/servlet.html", verifiedOn: "2026-10-17" }

  - id: servlet-filter
    term: "Servlet filter"
    definition: "A jakarta.servlet.Filter that runs logic before and after the rest of the chain and can wrap the request and response."
    see: filters-interceptors
    source: { title: "Filters (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/filters.html", verifiedOn: "2026-10-17" }

  - id: handler-interceptor
    term: "HandlerInterceptor"
    aka: [ "handler interceptor" ]
    definition: "Spring MVC hook around a handler with preHandle, postHandle and afterCompletion callbacks."
    see: filters-interceptors
    source: { title: "Interception (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html", verifiedOn: "2026-10-17" }

  - id: once-per-request-filter
    term: "OncePerRequestFilter"
    definition: "Spring base class for a filter that aims to run once per request dispatch; you implement doFilterInternal."
    see: filters-interceptors
    source: { title: "OncePerRequestFilter (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/7.0.9/javadoc-api/org/springframework/web/filter/OncePerRequestFilter.html", verifiedOn: "2026-10-17" }

  - id: filter-registration-bean
    term: "FilterRegistrationBean"
    definition: "Spring Boot class that registers a filter with its order, URL patterns and dispatcher types."
    see: filters-interceptors
    source: { title: "Servlet Web Applications: registering Filters (Spring Boot 4.1 reference)", url: "https://docs.spring.io/spring-boot/reference/web/servlet.html", verifiedOn: "2026-10-17" }

  - id: response-body-advice
    term: "ResponseBodyAdvice"
    definition: "A callback that can change a @ResponseBody or ResponseEntity value before a message converter writes it."
    see: filters-interceptors
    source: { title: "Interception: ResponseBodyAdvice (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/handlermapping-interceptor.html", verifiedOn: "2026-10-17" }

  - id: rest-client
    term: "RestClient"
    definition: "Spring's synchronous HTTP client with a fluent API (Spring Framework 6.1+), the replacement for RestTemplate."
    see: http-clients
    source: { title: "REST Clients (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/rest-clients.html", verifiedOn: "2026-10-17" }

  - id: web-client
    term: "WebClient"
    definition: "Spring's non-blocking, reactive HTTP client (Spring Framework 5.0+); it returns Mono and Flux."
    see: http-clients
    source: { title: "REST Clients (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/rest-clients.html", verifiedOn: "2026-10-17" }

  - id: rest-template
    term: "RestTemplate"
    definition: "Spring's classic synchronous HTTP client with template methods; deprecated in favour of RestClient from Framework 7."
    see: http-clients
    source: { title: "Spring Framework 7.0 Release Notes: Deprecations (spring-projects wiki)", url: "https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes", verifiedOn: "2026-10-17" }

  - id: http-interface-client
    term: "HTTP interface client"
    aka: [ "HTTP Service client", "@HttpExchange" ]
    definition: "A Java interface with @HttpExchange methods; Spring generates a proxy that calls the API through RestClient or WebClient."
    see: http-clients
    source: { title: "REST Clients: HTTP Service Clients (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/rest-clients.html", verifiedOn: "2026-10-17" }

  - id: spring-webflux
    term: "Spring WebFlux"
    aka: [ "WebFlux" ]
    definition: "Spring's non-blocking, reactive web framework, built on Reactor; Spring Boot runs it on Reactor Netty by default."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: reactor-mono
    term: "Mono"
    definition: "A Project Reactor publisher of zero or one value."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview: Reactive API (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: reactor-flux
    term: "Flux"
    definition: "A Project Reactor publisher of zero to many values, which may be an endless stream."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview: Reactive API (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: project-reactor
    term: "Project Reactor"
    definition: "The reactive library behind WebFlux; it provides Mono and Flux and implements Reactive Streams."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview: Reactive API (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: reactive-streams
    term: "Reactive Streams"
    definition: "A small specification for asynchronous components that exchange data with non-blocking back pressure."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview: Define Reactive (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: back-pressure
    term: "Back pressure"
    aka: [ "backpressure" ]
    definition: "A consumer signalling how much data it is ready for, so a fast producer does not overwhelm it."
    see: mvc-vs-webflux
    source: { title: "Reactive Programming: backpressure (Reactor 3.8.7 reference)", url: "https://projectreactor.io/docs/core/release/reference/reactiveProgramming.html", verifiedOn: "2026-10-17" }

  - id: event-loop
    term: "Event loop"
    aka: [ "event-loop" ]
    definition: "A small, fixed set of threads that handle many connections with non-blocking callbacks; their code must not block."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview: Concurrency Model (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: reactor-netty
    term: "Reactor Netty"
    definition: "A non-blocking HTTP server and client built on Netty; the default server of Spring Boot's WebFlux starter."
    see: mvc-vs-webflux
    source: { title: "Spring WebFlux overview: Servers (Spring Framework 7.0 reference)", url: "https://docs.spring.io/spring-framework/reference/web/webflux/new-framework.html", verifiedOn: "2026-10-17" }

  - id: thread-per-request
    term: "Thread per request"
    aka: [ "thread-per-request" ]
    definition: "A server model in which each request gets its own thread for its whole life; simple, but limited by thread count."
    see: mvc-vs-webflux
    source: { title: "JEP 444: Virtual Threads (OpenJDK)", url: "https://openjdk.org/jeps/444", verifiedOn: "2026-10-17" }

  - id: virtual-thread
    term: "Virtual thread"
    definition: "A lightweight JDK thread (Java 21+) that frees its OS thread while it waits, so very many can run at once."
    see: virtual-threads
    source: { title: "JEP 444: Virtual Threads (OpenJDK)", url: "https://openjdk.org/jeps/444", verifiedOn: "2026-10-17" }

  - id: platform-thread
    term: "Platform thread"
    definition: "A classic Java thread, usually mapped 1:1 to an OS thread; costly, so servers keep them in pools."
    see: virtual-threads
    source: { title: "Thread (Java SE 21 API)", url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Thread.html", verifiedOn: "2026-10-17" }

  - id: carrier-thread
    term: "Carrier thread"
    definition: "The platform thread a virtual thread runs on while mounted; it is freed when the virtual thread blocks."
    see: virtual-threads
    source: { title: "JEP 444: Virtual Threads (OpenJDK)", url: "https://openjdk.org/jeps/444", verifiedOn: "2026-10-17" }

  - id: virtual-thread-pinning
    term: "Pinning (virtual threads)"
    aka: [ "virtual thread pinning", "pinned virtual thread" ]
    definition: "A virtual thread that cannot unmount while it blocks, so it holds its carrier; synchronized caused this before JDK 24."
    see: virtual-threads
    source: { title: "JEP 491: Synchronize Virtual Threads without Pinning (OpenJDK)", url: "https://openjdk.org/jeps/491", verifiedOn: "2026-10-17" }

  # Data and Transactions
  - id: jpa
    term: "JPA (Jakarta Persistence)"
    aka: [ "JPA", "Jakarta Persistence" ]
    definition: "The Java standard for mapping objects to relational tables; Spring Boot 4.1 uses version 3.2, with jakarta.persistence imports."
    see: jpa-entities
    source: { title: "Jakarta Persistence 3.2 specification", url: "https://jakarta.ee/specifications/persistence/3.2/", verifiedOn: "2026-10-17" }

  - id: hibernate
    term: "Hibernate ORM"
    aka: [ "Hibernate" ]
    definition: "The JPA implementation that spring-boot-starter-data-jpa brings in; Spring Boot 4.1 manages Hibernate 7.4."
    see: jpa-entities
    source: { title: "SQL Databases: JPA and Spring Data JPA (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/data/sql.html", verifiedOn: "2026-10-17" }

  - id: orm
    term: "ORM (object-relational mapping)"
    aka: [ "ORM", "object-relational mapping" ]
    definition: "Mapping classes to tables and object links to foreign keys, so code loads and saves objects instead of writing SQL."
    see: jpa-entities
    source: { title: "A Short Guide to Hibernate 7 (7.4): introduction", url: "https://docs.hibernate.org/orm/7.4/introduction/html_single/", verifiedOn: "2026-10-17" }

  - id: spring-data-jpa
    term: "Spring Data JPA"
    definition: "A Spring project that implements repository interfaces for you, with queries derived from method names."
    see: spring-data-repositories
    source: { title: "SQL Databases: Spring Data JPA repositories (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/data/sql.html", verifiedOn: "2026-10-17" }

  - id: spring-data-repository
    term: "Spring Data repository"
    aka: [ "repository interface" ]
    definition: "An interface such as JpaRepository<Book, Long> that Spring Data implements at runtime and registers as a bean."
    see: spring-data-repositories
    source: { title: "Spring Data JPA 4.1: Defining repository interfaces", url: "https://docs.spring.io/spring-data/jpa/reference/repositories/definition.html", verifiedOn: "2026-10-17" }

  - id: simple-jpa-repository
    term: "SimpleJpaRepository"
    definition: "The default class behind CrudRepository and JpaRepository methods; class-level @Transactional(readOnly = true)."
    see: spring-data-repositories
    source: { title: "SimpleJpaRepository (Spring Data JPA 4.1 API)", url: "https://docs.spring.io/spring-data/jpa/docs/current/api/org/springframework/data/jpa/repository/support/SimpleJpaRepository.html", verifiedOn: "2026-10-17" }

  - id: derived-query
    term: "Derived query"
    aka: [ "derived query method", "query derivation" ]
    definition: "A repository method whose query Spring Data builds from its name, such as findByLastnameOrderByFirstnameAsc."
    see: spring-data-repositories
    source: { title: "Spring Data JPA 4.1: Defining query methods", url: "https://docs.spring.io/spring-data/jpa/reference/repositories/query-methods-details.html", verifiedOn: "2026-10-17" }

  - id: jpql
    term: "JPQL"
    aka: [ "Jakarta Persistence Query Language" ]
    definition: "JPA's string-based query language: SQL-like syntax, but over entities and their fields instead of tables."
    see: spring-data-repositories
    source: { title: "Jakarta Persistence 3.2 specification, chapter 4 (query language)", url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html", verifiedOn: "2026-10-17" }

  - id: projection
    term: "Projection (Spring Data)"
    aka: [ "projection" ]
    definition: "A repository result with only some fields: an interface of getters, or a DTO class or record."
    see: spring-data-repositories
    source: { title: "Spring Data JPA 4.1: Projections", url: "https://docs.spring.io/spring-data/jpa/reference/repositories/projections.html", verifiedOn: "2026-10-17" }

  - id: pageable
    term: "Pageable"
    aka: [ "PageRequest" ]
    definition: "A query-method parameter with the page number, page size and sort, built with PageRequest.of(page, size)."
    see: spring-data-repositories
    source: { title: "Spring Data JPA 4.1: Defining query methods (paging and sorting)", url: "https://docs.spring.io/spring-data/jpa/reference/repositories/query-methods-details.html", verifiedOn: "2026-10-17" }

  - id: entity
    term: "Entity"
    aka: [ "entities", "JPA entity" ]
    definition: "A class marked @Entity whose instances are stored as rows of a table; it needs a primary key (@Id)."
    see: jpa-entities
    source: { title: "Jakarta Persistence 3.2 specification, 2.1 and 2.4", url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html", verifiedOn: "2026-10-17" }

  - id: entity-manager
    term: "EntityManager"
    aka: [ "entity manager" ]
    definition: "The JPA API to create, find, remove and query entities; each EntityManager has its own persistence context."
    see: jpa-entities
    source: { title: "Jakarta Persistence 3.2 specification, 3.1 EntityManager", url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html", verifiedOn: "2026-10-17" }

  - id: persistence-context
    term: "Persistence context"
    aka: [ "first-level cache" ]
    definition: "The set of managed entities, with one instance per id; by default it lives for one transaction."
    see: jpa-entities
    source: { title: "Jakarta Persistence 3.2 specification, 3.1 and 3.4", url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html", verifiedOn: "2026-10-17" }

  - id: dirty-checking
    term: "Dirty checking"
    definition: "Hibernate finds changed fields of managed entities and writes them at flush, without an explicit update call."
    see: jpa-entities
    source: { title: "A Short Guide to Hibernate 7 (7.4): persistence contexts", url: "https://docs.hibernate.org/orm/7.4/introduction/html_single/", verifiedOn: "2026-10-17" }

  - id: jpa-flush
    term: "Flush (JPA)"
    aka: [ "flush", "flushing" ]
    definition: "Sending pending entity changes to the database as SQL; in the default AUTO mode, before queries and at commit."
    see: jpa-entities
    source: { title: "FlushModeType (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/FlushModeType.html", verifiedOn: "2026-10-17" }

  - id: detached-entity
    term: "Detached entity"
    aka: [ "detached" ]
    definition: "An entity with an id that no persistence context tracks any more, for example after its transaction committed."
    see: jpa-entities
    source: { title: "Jakarta Persistence 3.2 specification, 3.3.7 detached entities", url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html", verifiedOn: "2026-10-17" }

  - id: owning-side
    term: "Owning side"
    definition: "The side of a relationship whose field decides the foreign key in the database; the many side in one-to-many."
    see: jpa-entities
    source: { title: "Jakarta Persistence 3.2 specification, 2.11 entity relationships", url: "https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2.html", verifiedOn: "2026-10-17" }

  - id: mapped-by
    term: "mappedBy"
    definition: "Set on the inverse side of a two-way relationship to name the owning side's field."
    see: jpa-entities
    source: { title: "OneToMany (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/OneToMany.html", verifiedOn: "2026-10-17" }

  - id: cascade-type
    term: "Cascade (JPA)"
    aka: [ "cascade", "CascadeType" ]
    definition: "Passing an operation such as persist or remove from a parent entity to its associated entities; none by default."
    see: jpa-entities
    source: { title: "CascadeType (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/CascadeType.html", verifiedOn: "2026-10-17" }

  - id: orphan-removal
    term: "Orphan removal"
    aka: [ "orphanRemoval" ]
    definition: "A child entity removed from its parent's relationship is deleted at flush; off by default."
    see: jpa-entities
    source: { title: "OneToMany (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/OneToMany.html", verifiedOn: "2026-10-17" }

  - id: lazy-loading
    term: "Lazy loading"
    aka: [ "lazy fetching", "FetchType.LAZY" ]
    definition: "Loading an association only when it is first accessed; to JPA it is a hint, not a rule."
    see: lazy-loading-n-plus-one
    source: { title: "FetchType (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/FetchType.html", verifiedOn: "2026-10-17" }

  - id: eager-loading
    term: "Eager loading"
    aka: [ "eager fetching", "FetchType.EAGER" ]
    definition: "Loading an association together with its owner; the JPA provider must do it."
    see: lazy-loading-n-plus-one
    source: { title: "FetchType (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/FetchType.html", verifiedOn: "2026-10-17" }

  - id: n-plus-one-problem
    term: "N+1 problem"
    aka: [ "N+1 selects", "N+1 select problem", "N+1 query problem" ]
    definition: "One query loads N rows, then a lazy association runs one more query per row: N+1 in total."
    see: lazy-loading-n-plus-one
    source: { title: "A Short Guide to Hibernate 7 (7.4): N+1 selects", url: "https://docs.hibernate.org/orm/7.4/introduction/html_single/", verifiedOn: "2026-10-17" }

  - id: lazy-initialization-exception
    term: "LazyInitializationException"
    definition: "Hibernate's error when unfetched data is accessed after its session (persistence context) closed."
    see: lazy-loading-n-plus-one
    source: { title: "LazyInitializationException (Hibernate ORM 7.4 API)", url: "https://docs.hibernate.org/orm/7.4/javadocs/org/hibernate/LazyInitializationException.html", verifiedOn: "2026-10-17" }

  - id: open-session-in-view
    term: "Open Session in View"
    aka: [ "Open EntityManager in View", "OSIV", "open-in-view" ]
    definition: "Keeping the EntityManager open for a whole web request so views can lazy-load; on by default in Spring Boot."
    see: lazy-loading-n-plus-one
    source: { title: "OpenEntityManagerInViewInterceptor (Spring Framework 7.0 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/orm/jpa/support/OpenEntityManagerInViewInterceptor.html", verifiedOn: "2026-10-17" }

  - id: join-fetch
    term: "JOIN FETCH"
    aka: [ "fetch join" ]
    definition: "A JPQL join that loads an association together with its owner in the same query."
    see: lazy-loading-n-plus-one
    source: { title: "A Short Guide to Hibernate 7 (7.4): join fetching", url: "https://docs.hibernate.org/orm/7.4/introduction/html_single/", verifiedOn: "2026-10-17" }

  - id: entity-graph
    term: "Entity graph"
    aka: [ "EntityGraph" ]
    definition: "A list of associations to load eagerly for one query; in Spring Data, @EntityGraph on a repository method."
    see: lazy-loading-n-plus-one
    source: { title: "EntityGraph (Spring Data JPA 4.1 API)", url: "https://docs.spring.io/spring-data/jpa/docs/current/api/org/springframework/data/jpa/repository/EntityGraph.html", verifiedOn: "2026-10-17" }

  - id: batch-fetching
    term: "Batch fetching"
    aka: [ "BatchSize", "default_batch_fetch_size" ]
    definition: "Hibernate loads unfetched data for many parents in one IN query; set with @BatchSize or hibernate.default_batch_fetch_size."
    see: lazy-loading-n-plus-one
    source: { title: "A Short Guide to Hibernate 7 (7.4): batch fetching", url: "https://docs.hibernate.org/orm/7.4/introduction/html_single/", verifiedOn: "2026-10-17" }

  - id: transaction
    term: "Transaction"
    aka: [ "database transaction" ]
    definition: "Several database steps bundled into one all-or-nothing unit: COMMIT keeps them all, ROLLBACK cancels them all."
    see: transactional
    source: { title: "Transactions (PostgreSQL 18 tutorial)", url: "https://www.postgresql.org/docs/current/tutorial-transactions.html", verifiedOn: "2026-10-17" }

  - id: transaction-manager
    term: "Transaction manager"
    aka: [ "PlatformTransactionManager", "TransactionManager" ]
    definition: "The Spring object that begins, commits and rolls back transactions, such as JpaTransactionManager."
    see: transactional
    source: { title: "Understanding the Spring Framework Transaction Abstraction (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/strategies.html", verifiedOn: "2026-10-17" }

  - id: rollback-rules
    term: "Rollback rules"
    aka: [ "rollbackFor", "noRollbackFor" ]
    definition: "@Transactional settings that say which exceptions roll back; by default RuntimeException and Error do, checked ones do not."
    see: transactional
    source: { title: "Rolling Back a Declarative Transaction (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html", verifiedOn: "2026-10-17" }

  - id: transaction-propagation-term
    term: "Propagation (transactions)"
    aka: [ "transaction propagation", "propagation level" ]
    definition: "The @Transactional setting that says whether a method joins the current transaction, starts a new one, or runs without one."
    see: transaction-propagation
    source: { title: "Propagation (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Propagation.html", verifiedOn: "2026-10-17" }

  - id: isolation-level
    term: "Isolation level"
    aka: [ "transaction isolation" ]
    definition: "How much a transaction sees of other transactions' changes, from READ_UNCOMMITTED to SERIALIZABLE."
    see: transaction-propagation
    source: { title: "Isolation (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html", verifiedOn: "2026-10-17" }

  - id: dirty-read
    term: "Dirty read"
    definition: "Reading a row another transaction has changed but not yet committed."
    see: transaction-propagation
    source: { title: "Isolation (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html", verifiedOn: "2026-10-17" }

  - id: non-repeatable-read
    term: "Non-repeatable read"
    definition: "Reading the same row twice and getting different values, because another transaction changed it in between."
    see: transaction-propagation
    source: { title: "Isolation (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html", verifiedOn: "2026-10-17" }

  - id: phantom-read
    term: "Phantom read"
    definition: "Running the same WHERE query twice and getting an extra row that another transaction inserted."
    see: transaction-propagation
    source: { title: "Isolation (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Isolation.html", verifiedOn: "2026-10-17" }

  - id: savepoint
    term: "Savepoint"
    aka: [ "savepoints" ]
    definition: "A marker inside a transaction that it can roll back to without undoing everything; used by NESTED propagation."
    see: transaction-propagation
    source: { title: "Transaction Propagation: PROPAGATION_NESTED (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html", verifiedOn: "2026-10-17" }

  - id: optimistic-locking
    term: "Optimistic locking"
    aka: [ "optimistic lock" ]
    definition: "A @Version field is checked on update; if the row changed since it was read, OptimisticLockException is thrown."
    see: transaction-propagation
    source: { title: "Version (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/Version.html", verifiedOn: "2026-10-17" }

  - id: pessimistic-locking
    term: "Pessimistic locking"
    aka: [ "pessimistic lock" ]
    definition: "Taking a database lock on a row, such as PESSIMISTIC_WRITE, so other transactions trying to update it wait."
    see: transaction-propagation
    source: { title: "LockModeType (Jakarta Persistence 3.2 API)", url: "https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/LockModeType.html", verifiedOn: "2026-10-17" }

  - id: connection-pool-term
    term: "Connection pool"
    aka: [ "connection pooling" ]
    definition: "A set of open database connections that threads borrow and give back, instead of opening a new one each time."
    see: connection-pool
    source: { title: "SQL Databases: supported connection pools (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/data/sql.html", verifiedOn: "2026-10-17" }

  - id: hikaricp
    term: "HikariCP"
    aka: [ "Hikari" ]
    definition: "The JDBC connection pool Spring Boot picks first; Boot 4.1 manages HikariCP 7.0.2."
    see: connection-pool
    source: { title: "Dependency versions (Spring Boot 4.1.1 appendix)", url: "https://docs.spring.io/spring-boot/appendix/dependency-versions/coordinates.html", verifiedOn: "2026-10-17" }

  - id: datasource
    term: "DataSource"
    aka: [ "data source" ]
    definition: "The JDBC object the app gets connections from; Boot creates a pooled one from spring.datasource.* properties."
    see: connection-pool
    source: { title: "SQL Databases: DataSource configuration (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/data/sql.html", verifiedOn: "2026-10-17" }

  - id: embedded-database
    term: "Embedded database"
    aka: [ "in-memory database" ]
    definition: "A database that runs inside the app, such as H2 or HSQL; Boot configures it with no URL needed."
    see: schema-migrations
    source: { title: "SQL Databases: embedded database support (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/data/sql.html", verifiedOn: "2026-10-17" }

  - id: ddl-auto
    term: "ddl-auto"
    aka: [ "hbm2ddl" ]
    definition: "spring.jpa.hibernate.ddl-auto: none, validate, update, create or create-drop for Hibernate's schema handling."
    see: schema-migrations
    source: { title: "Database Initialization how-to (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/data-initialization.html", verifiedOn: "2026-10-17" }

  - id: database-migration
    term: "Database migration"
    aka: [ "schema migration", "migration script" ]
    definition: "A versioned script that changes the schema; a tool applies each one once and records it."
    see: schema-migrations
    source: { title: "Versioned migrations (Redgate Flyway docs)", url: "https://documentation.red-gate.com/fd/versioned-migrations-273973333.html", verifiedOn: "2026-10-17" }

  - id: flyway
    term: "Flyway"
    definition: "A migration tool that runs versioned SQL files, V1__name.sql and up, and records them in flyway_schema_history."
    see: schema-migrations
    source: { title: "Versioned migrations (Redgate Flyway docs)", url: "https://documentation.red-gate.com/fd/versioned-migrations-273973333.html", verifiedOn: "2026-10-17" }

  - id: liquibase
    term: "Liquibase"
    definition: "A migration tool that applies changesets from a changelog in SQL, XML, YAML or JSON and records them in DATABASECHANGELOG."
    see: schema-migrations
    source: { title: "What is a changelog? (Liquibase docs)", url: "https://docs.liquibase.com/concepts/changelogs/home.html", verifiedOn: "2026-10-17" }

  - id: liquibase-changeset
    term: "Changeset (Liquibase)"
    aka: [ "changeset" ]
    definition: "One unit of change in a Liquibase changelog, identified by its id, author and file."
    see: schema-migrations
    source: { title: "What is a changelog? (Liquibase docs)", url: "https://docs.liquibase.com/concepts/changelogs/home.html", verifiedOn: "2026-10-17" }

  - id: cache-abstraction
    term: "Cache abstraction"
    aka: [ "Spring cache abstraction" ]
    definition: "Spring's caching annotations and interfaces; they need a provider, such as Caffeine or Redis, to store the data."
    see: spring-cache
    source: { title: "Understanding the Cache Abstraction (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/cache/strategies.html", verifiedOn: "2026-10-17" }

  - id: cache-manager
    term: "CacheManager"
    aka: [ "cache manager" ]
    definition: "Spring's interface that hands out named caches; Boot auto-configures one for the provider it finds."
    see: spring-cache
    source: { title: "CacheManager (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/cache/CacheManager.html", verifiedOn: "2026-10-17" }

  - id: ttl
    term: "TTL (time to live)"
    aka: [ "TTL", "time to live", "time-to-live" ]
    definition: "How long a cache entry lives before it expires; set on the cache provider, not on @Cacheable."
    see: spring-cache
    source: { title: "How can I set the TTL/TTI/eviction policy? (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/cache/specific-config.html", verifiedOn: "2026-10-17" }

  - id: caffeine
    term: "Caffeine"
    definition: "A fast in-memory caching library for Java, with size limits and expiry; a common local provider for Spring's cache."
    see: spring-cache
    source: { title: "Caffeine README (ben-manes, GitHub)", url: "https://github.com/ben-manes/caffeine", verifiedOn: "2026-10-17" }

  - id: redis
    term: "Redis"
    definition: "An in-memory data store often used as a shared cache; Boot auto-configures a RedisCacheManager when Redis is set up."
    see: spring-cache
    source: { title: "Redis Open Source: get started (redis.io)", url: "https://redis.io/docs/latest/get-started/", verifiedOn: "2026-10-17" }

  - id: jcache
    term: "JCache (JSR-107)"
    aka: [ "JCache", "JSR-107" ]
    definition: "The standard Java caching API; providers include Ehcache 3, Hazelcast and Infinispan."
    see: spring-cache
    source: { title: "Caching: JCache (JSR-107) (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/io/caching.html", verifiedOn: "2026-10-17" }

  # Security
  - id: authentication
    term: "Authentication"
    definition: "Checking who is calling, for example with a username and password. It comes before authorization."
    see: authentication-flow
    source: { title: "Authentication (Spring Security 7.1 reference, Features)", url: "https://docs.spring.io/spring-security/reference/features/authentication/index.html", verifiedOn: "2026-10-17" }

  - id: authorization
    term: "Authorization"
    definition: "Deciding whether an authenticated caller may do an action, such as calling a URL or a method."
    see: authorization-rules
    source: { title: "Authorization (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authorization/index.html", verifiedOn: "2026-10-17" }

  - id: principal
    term: "Principal"
    definition: "The identity of the logged-in user inside an Authentication, often a UserDetails object."
    see: authentication-flow
    source: { title: "Servlet Authentication Architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html", verifiedOn: "2026-10-17" }

  - id: granted-authority
    term: "GrantedAuthority"
    aka: [ "granted authority" ]
    definition: "One permission held by a user, as a string such as ROLE_ADMIN or SCOPE_read."
    see: authorization-rules
    source: { title: "Authorization Architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authorization/architecture.html", verifiedOn: "2026-10-17" }

  - id: security-context-holder
    term: "SecurityContextHolder"
    definition: "Holds the SecurityContext, and so the Authentication, of the current user; per thread by default."
    see: authentication-flow
    source: { title: "Servlet Authentication Architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html", verifiedOn: "2026-10-17" }

  - id: authentication-manager
    term: "AuthenticationManager"
    definition: "The interface login filters call to authenticate; it returns an authenticated Authentication or throws."
    see: authentication-flow
    source: { title: "Servlet Authentication Architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html", verifiedOn: "2026-10-17" }

  - id: provider-manager
    term: "ProviderManager"
    definition: "The usual AuthenticationManager: it asks a list of AuthenticationProviders in turn until one can decide."
    see: authentication-flow
    source: { title: "Servlet Authentication Architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html", verifiedOn: "2026-10-17" }

  - id: authentication-provider
    term: "AuthenticationProvider"
    definition: "Authenticates one kind of credential, such as a password (DaoAuthenticationProvider) or a JWT."
    see: authentication-flow
    source: { title: "Servlet Authentication Architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/architecture.html", verifiedOn: "2026-10-17" }

  - id: user-details-service
    term: "UserDetailsService"
    definition: "Loads a user by username and returns UserDetails, or throws UsernameNotFoundException."
    see: authentication-flow
    source: { title: "UserDetailsService (Spring Security 7.1 API)", url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/core/userdetails/UserDetailsService.html", verifiedOn: "2026-10-17" }

  - id: user-details
    term: "UserDetails"
    definition: "Spring Security's view of a user: username, password, authorities, and flags such as enabled or locked."
    see: authentication-flow
    source: { title: "UserDetails (Spring Security 7.1 API)", url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/core/userdetails/UserDetails.html", verifiedOn: "2026-10-17" }

  - id: form-login
    term: "Form login"
    definition: "Logging in through an HTML form that posts the username and password to /login."
    see: authentication-flow
    source: { title: "Form Login (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/form.html", verifiedOn: "2026-10-17" }

  - id: http-basic
    term: "HTTP Basic authentication"
    aka: [ "HTTP Basic", "Basic authentication", "basic auth" ]
    definition: "Sends username:password, only Base64-encoded, in the Authorization header of each request; use it over HTTPS only."
    see: authentication-flow
    source: { title: "RFC 7617: The 'Basic' HTTP Authentication Scheme", url: "https://www.rfc-editor.org/rfc/rfc7617", verifiedOn: "2026-10-17" }

  - id: jsessionid
    term: "JSESSIONID"
    definition: "The default name of the servlet session cookie (Tomcat); the browser sends it with each request to the site."
    see: authentication-flow
    source: { title: "Context configuration: sessionCookieName (Apache Tomcat 11)", url: "https://tomcat.apache.org/tomcat-11.0-doc/config/context.html", verifiedOn: "2026-10-17" }

  - id: session-fixation-protection
    term: "Session fixation protection"
    aka: [ "session fixation" ]
    definition: "Changing the session id at login, so an id an attacker made the victim use before login becomes useless."
    see: authentication-flow
    source: { title: "Authentication Persistence and Session Management (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html", verifiedOn: "2026-10-17" }

  - id: stateless-session-policy
    term: "Stateless (session policy)"
    aka: [ "stateless session", "stateless sessions" ]
    definition: "No server session keeps the login; each request brings its own credentials or token (SessionCreationPolicy.STATELESS)."
    see: jwt-resource-server
    source: { title: "Authentication Persistence and Session Management (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html", verifiedOn: "2026-10-17" }

  - id: http-401
    term: "401 Unauthorized"
    aka: [ "401" ]
    definition: "The status for a request without valid authentication credentials; it comes with a WWW-Authenticate header."
    see: authentication-flow
    source: { title: "401 Unauthorized (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401", verifiedOn: "2026-10-17" }

  - id: http-403
    term: "403 Forbidden"
    aka: [ "403" ]
    definition: "The status for a caller with valid credentials who is still not allowed to do the action."
    see: authorization-rules
    source: { title: "401 Unauthorized: difference from 403 (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401", verifiedOn: "2026-10-17" }

  - id: delegating-filter-proxy
    term: "DelegatingFilterProxy"
    definition: "A servlet filter registered with the container that passes each request to a Spring bean, FilterChainProxy."
    see: security-filter-chain
    source: { title: "Spring Security architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/architecture.html", verifiedOn: "2026-10-17" }

  - id: filter-chain-proxy
    term: "FilterChainProxy"
    definition: "The Spring Security bean that picks the first SecurityFilterChain matching a request and runs its filters."
    see: security-filter-chain
    source: { title: "Spring Security architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/architecture.html", verifiedOn: "2026-10-17" }

  - id: security-filter-chain
    term: "SecurityFilterChain"
    aka: [ "security filter chain" ]
    definition: "A bean holding an ordered list of security filters and a matcher for the requests it handles."
    see: security-filter-chain
    source: { title: "Spring Security architecture (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/architecture.html", verifiedOn: "2026-10-17" }

  - id: password-encoder
    term: "PasswordEncoder"
    definition: "Spring Security interface that hashes a password one way (encode) and checks a login attempt (matches)."
    see: password-encoding
    source: { title: "Password Storage (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html", verifiedOn: "2026-10-17" }

  - id: bcrypt
    term: "BCrypt"
    definition: "An adaptive, salted password hash; each step up in strength (log rounds) doubles the work."
    see: password-encoding
    source: { title: "BCrypt (Spring Security 7.1 API)", url: "https://docs.spring.io/spring-security/reference/api/java/org/springframework/security/crypto/bcrypt/BCrypt.html", verifiedOn: "2026-10-17" }

  - id: salt
    term: "Salt"
    definition: "Random bytes mixed into each password before hashing, so equal passwords get different hashes."
    see: password-encoding
    source: { title: "Password Storage: salted passwords (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html", verifiedOn: "2026-10-17" }

  - id: work-factor
    term: "Work factor"
    aka: [ "cost factor" ]
    definition: "A setting that makes a password hash slow on purpose; raise it as hardware gets faster."
    see: password-encoding
    source: { title: "Password Storage: adaptive one-way functions (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html", verifiedOn: "2026-10-17" }

  - id: method-security
    term: "Method security"
    definition: "Authorization checks on bean methods, such as @PreAuthorize, switched on with @EnableMethodSecurity."
    see: authorization-rules
    source: { title: "Method Security (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html", verifiedOn: "2026-10-17" }

  - id: role-hierarchy
    term: "Role hierarchy"
    definition: "Declares that one role includes others, e.g. ADMIN includes USER, so USER rules also admit admins."
    see: authorization-rules
    source: { title: "Authorization Architecture: hierarchical roles (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/authorization/architecture.html", verifiedOn: "2026-10-17" }

  - id: jwt
    term: "JWT"
    aka: [ "JSON Web Token" ]
    definition: "A compact, URL-safe token of claims. Usually signed, so it cannot be changed unnoticed, but anyone can read it."
    see: jwt-resource-server
    source: { title: "RFC 7519: JSON Web Token (JWT)", url: "https://www.rfc-editor.org/rfc/rfc7519", verifiedOn: "2026-10-17" }

  - id: jwt-claims
    term: "Claims (JWT)"
    aka: [ "JWT claim", "claims" ]
    definition: "The facts inside a JWT, such as iss (issuer), sub (user), aud (audience) and exp (expiry time)."
    see: jwt-resource-server
    source: { title: "RFC 7519: JSON Web Token (JWT), Section 4.1", url: "https://www.rfc-editor.org/rfc/rfc7519", verifiedOn: "2026-10-17" }

  - id: jwk-set
    term: "JWK Set"
    aka: [ "JWKS", "JSON Web Key Set" ]
    definition: "A JSON document listing an issuer's public keys; a resource server uses it to check JWT signatures."
    see: jwt-resource-server
    source: { title: "RFC 7517: JSON Web Key (JWK)", url: "https://www.rfc-editor.org/rfc/rfc7517", verifiedOn: "2026-10-17" }

  - id: oauth2
    term: "OAuth 2.0"
    aka: [ "OAuth2", "OAuth" ]
    definition: "An authorization framework: a client gets a limited access token from an authorization server to call an API."
    see: jwt-resource-server
    source: { title: "RFC 6749: The OAuth 2.0 Authorization Framework", url: "https://www.rfc-editor.org/rfc/rfc6749", verifiedOn: "2026-10-17" }

  - id: openid-connect
    term: "OpenID Connect"
    aka: [ "OIDC" ]
    definition: "A login layer on top of OAuth 2.0: it adds an ID token that tells the app who the user is."
    see: jwt-resource-server
    source: { title: "OAuth2 overview (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/index.html", verifiedOn: "2026-10-17" }

  - id: access-token
    term: "Access token"
    definition: "The credential a client sends to call a protected API; it stands for the access granted to that client."
    see: jwt-resource-server
    source: { title: "RFC 6749: The OAuth 2.0 Authorization Framework, Section 1.4", url: "https://www.rfc-editor.org/rfc/rfc6749", verifiedOn: "2026-10-17" }

  - id: refresh-token
    term: "Refresh token"
    definition: "A credential the client gives the authorization server to get a new access token, for example when the old one expires."
    see: jwt-resource-server
    source: { title: "RFC 6749: The OAuth 2.0 Authorization Framework, Section 1.5", url: "https://www.rfc-editor.org/rfc/rfc6749", verifiedOn: "2026-10-17" }

  - id: bearer-token
    term: "Bearer token"
    definition: "A token that works for whoever holds it, sent as Authorization: Bearer <token>; guard it like a password."
    see: jwt-resource-server
    source: { title: "RFC 6750: OAuth 2.0 Bearer Token Usage", url: "https://www.rfc-editor.org/rfc/rfc6750", verifiedOn: "2026-10-17" }

  - id: oauth2-scope
    term: "Scope (OAuth2)"
    aka: [ "OAuth2 scope" ]
    definition: "A named permission in an access token, such as orders.read; Spring maps it to the authority SCOPE_orders.read."
    see: jwt-resource-server
    source: { title: "OAuth 2.0 Resource Server JWT (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html", verifiedOn: "2026-10-17" }

  - id: opaque-token
    term: "Opaque token"
    aka: [ "token introspection" ]
    definition: "An access token the API does not read; it asks the issuer's introspection endpoint whether the token is active."
    see: jwt-resource-server
    source: { title: "OAuth 2.0 Resource Server Opaque Token (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/opaque-token.html", verifiedOn: "2026-10-17" }

  - id: oauth2-resource-server
    term: "Resource server"
    definition: "The server hosting protected resources; it accepts requests that carry a valid access token."
    see: jwt-resource-server
    source: { title: "RFC 6749: The OAuth 2.0 Authorization Framework, Section 1.1", url: "https://www.rfc-editor.org/rfc/rfc6749", verifiedOn: "2026-10-17" }

  - id: authorization-server
    term: "Authorization server"
    definition: "Issues access tokens to clients after authenticating the user; in Spring it is part of Spring Security 7."
    see: jwt-resource-server
    source: { title: "What's New in Spring Security 7.0: Spring Authorization Server joins Spring Security", url: "https://docs.spring.io/spring-security/reference/7.0/whats-new.html", verifiedOn: "2026-10-17" }

  - id: oauth2-login
    term: "OAuth2 login"
    aka: [ "social login" ]
    definition: "Spring Security's OAuth2 client feature that logs users in through an outside provider, such as GitHub."
    see: jwt-resource-server
    source: { title: "OAuth2 overview: OAuth2 Login (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/servlet/oauth2/index.html", verifiedOn: "2026-10-17" }

  - id: csrf
    term: "CSRF"
    aka: [ "cross-site request forgery" ]
    definition: "An attack where another site makes the user's browser send a request to your app, with your cookies attached."
    see: csrf-cors
    source: { title: "Cross Site Request Forgery (CSRF) (Spring Security 7.1 reference, Features)", url: "https://docs.spring.io/spring-security/reference/features/exploits/csrf.html", verifiedOn: "2026-10-17" }

  - id: csrf-token
    term: "CSRF token"
    definition: "A secret random value the server expects in unsafe requests, in a form field or header; other sites cannot read it."
    see: csrf-cors
    source: { title: "Cross Site Request Forgery (CSRF): Synchronizer Token Pattern (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/features/exploits/csrf.html", verifiedOn: "2026-10-17" }

  - id: samesite-cookie
    term: "SameSite cookie"
    aka: [ "SameSite" ]
    definition: "A cookie attribute (Strict or Lax) that tells the browser not to send the cookie on cross-site requests."
    see: csrf-cors
    source: { title: "Cross Site Request Forgery (CSRF): SameSite attribute (Spring Security 7.1 reference)", url: "https://docs.spring.io/spring-security/reference/features/exploits/csrf.html", verifiedOn: "2026-10-17" }

  - id: cors
    term: "CORS"
    aka: [ "cross-origin resource sharing" ]
    definition: "HTTP headers with which a server tells the browser which other origins may read its responses."
    see: csrf-cors
    source: { title: "Cross-Origin Resource Sharing (CORS) (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS", verifiedOn: "2026-10-17" }

  - id: same-origin-policy
    term: "Same-origin policy"
    definition: "Browser rule: a script from one origin (scheme, host and port) cannot read another origin's resources by default."
    see: csrf-cors
    source: { title: "Same-origin policy (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy", verifiedOn: "2026-10-17" }

  - id: preflight-request
    term: "Preflight request"
    aka: [ "preflight" ]
    definition: "An OPTIONS request the browser sends before a non-simple cross-origin request, to ask if it is allowed."
    see: csrf-cors
    source: { title: "Cross-Origin Resource Sharing (CORS): preflighted requests (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS", verifiedOn: "2026-10-17" }

  # Testing and Production
  - id: test-slice
    term: "Test slice"
    aka: [ "test slices", "slice test", "sliced test" ]
    definition: "A test annotation, such as @WebMvcTest or @DataJpaTest, that loads only the beans and auto-configuration of one layer."
    see: spring-boot-testing
    source: { title: "Testing Spring Boot Applications: auto-configured tests (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html", verifiedOn: "2026-10-17" }

  - id: mockmvc
    term: "MockMvc"
    aka: [ "MockMvcTester" ]
    definition: "Spring's way to test MVC controllers without a server: mock requests go through the real DispatcherServlet. MockMvcTester adds AssertJ assertions."
    see: spring-boot-testing
    source: { title: "MockMvc Overview (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/testing/mockmvc/overview.html", verifiedOn: "2026-10-17" }

  - id: mockito-bean
    term: "@MockitoBean"
    aka: [ "MockitoBean", "@MockitoSpyBean", "MockitoSpyBean" ]
    definition: "A Spring Framework 6.2+ test annotation that replaces a bean with a Mockito mock (or a spy); it replaces Boot's removed @MockBean."
    see: spring-boot-testing
    source: { title: "MockitoBean (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/test/context/bean/override/mockito/MockitoBean.html", verifiedOn: "2026-10-17" }

  - id: context-caching
    term: "Context caching"
    aka: [ "context cache", "cached context", "cached contexts" ]
    definition: "Spring reuses one test ApplicationContext for every test class with the same configuration, keeping up to 32 by default."
    see: spring-boot-testing
    source: { title: "Context Caching (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/caching.html", verifiedOn: "2026-10-17" }

  - id: testcontainers
    term: "Testcontainers"
    definition: "A Java library that starts throwaway real services, such as databases and message brokers, in Docker containers for tests."
    see: testcontainers
    source: { title: "Testcontainers for Java", url: "https://java.testcontainers.org/", verifiedOn: "2026-10-17" }

  - id: service-connection
    term: "Service connection"
    aka: [ "@ServiceConnection", "ServiceConnection" ]
    definition: "Spring Boot creates ConnectionDetails beans from a running container, so the app connects to it without connection properties."
    see: testcontainers
    source: { title: "Testcontainers: service connections (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/testing/testcontainers.html", verifiedOn: "2026-10-17" }

  - id: actuator
    term: "Actuator"
    aka: [ "Spring Boot Actuator" ]
    definition: "The Spring Boot module that adds production endpoints, such as health, metrics and info, over HTTP or JMX."
    see: actuator
    source: { title: "Enabling Production-ready Features (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/enabling.html", verifiedOn: "2026-10-17" }

  - id: health-indicator
    term: "Health indicator"
    aka: [ "health indicators", "HealthIndicator" ]
    definition: "One health check, such as db or diskspace; Actuator combines all of them into the app's overall health status."
    see: actuator
    source: { title: "Endpoints: health information (Spring Boot 4.1.1 Actuator reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html", verifiedOn: "2026-10-17" }

  - id: liveness-probe
    term: "Liveness probe"
    aka: [ "liveness" ]
    definition: "A Kubernetes check of whether the app can still work; after repeated failures the kubelet restarts the container."
    see: actuator
    source: { title: "Liveness, Readiness, and Startup Probes (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/", verifiedOn: "2026-10-17" }

  - id: readiness-probe
    term: "Readiness probe"
    aka: [ "readiness" ]
    definition: "A Kubernetes check of whether the app can take traffic; while it fails, the pod gets no requests from its Services."
    see: actuator
    source: { title: "Liveness, Readiness, and Startup Probes (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/", verifiedOn: "2026-10-17" }

  - id: observability
    term: "Observability"
    definition: "Seeing a running system's internal state from the outside, through logs, metrics and traces."
    see: observability
    source: { title: "Observability (Spring Boot 4.1.1 Actuator reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/observability.html", verifiedOn: "2026-10-17" }

  - id: micrometer
    term: "Micrometer"
    definition: "A vendor-neutral facade for metrics and observations, like SLF4J but for observability; Spring Boot's metrics are built on it."
    see: observability
    source: { title: "Micrometer documentation (Micrometer 1.17)", url: "https://docs.micrometer.io/micrometer/reference/", verifiedOn: "2026-10-17" }

  - id: meter-registry
    term: "MeterRegistry"
    aka: [ "meter registry" ]
    definition: "The Micrometer object that creates and holds meters; each monitoring system, such as Prometheus, has its own implementation."
    see: observability
    source: { title: "Registry (Micrometer 1.17 docs)", url: "https://docs.micrometer.io/micrometer/reference/concepts/registry.html", verifiedOn: "2026-10-17" }

  - id: prometheus
    term: "Prometheus"
    definition: "A monitoring system that pulls (scrapes) metrics from each app instance; Spring Boot serves them at /actuator/prometheus."
    see: observability
    source: { title: "Metrics: Prometheus (Spring Boot 4.1.1 Actuator reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/metrics.html", verifiedOn: "2026-10-17" }

  - id: observation-api
    term: "Observation API"
    aka: [ "ObservationRegistry" ]
    definition: "Micrometer's API to instrument code once; handlers turn each observation into timers, spans and log entries."
    see: observability
    source: { title: "Micrometer Observation (Micrometer 1.17 docs)", url: "https://docs.micrometer.io/micrometer/reference/observation/introduction.html", verifiedOn: "2026-10-17" }

  - id: distributed-tracing
    term: "Distributed tracing"
    definition: "Following one request across services as a trace: a tree of spans, each one timed unit of work."
    see: observability
    source: { title: "Glossary (Micrometer Tracing docs)", url: "https://docs.micrometer.io/tracing/reference/glossary.html", verifiedOn: "2026-10-17" }

  - id: trace-id
    term: "Trace ID"
    aka: [ "traceId" ]
    definition: "The identifier shared by all spans of one trace; Spring Boot adds it to log lines so you can find one request's logs."
    see: observability
    source: { title: "Tracing: logging correlation IDs (Spring Boot 4.1.1 Actuator reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/tracing.html", verifiedOn: "2026-10-17" }

  - id: span
    term: "Span (tracing)"
    aka: [ "span ID", "spanId" ]
    definition: "The basic unit of work in a trace, with its own timing; spans nest to form the trace's tree."
    see: observability
    source: { title: "Glossary (Micrometer Tracing docs)", url: "https://docs.micrometer.io/tracing/reference/glossary.html", verifiedOn: "2026-10-17" }

  - id: opentelemetry
    term: "OpenTelemetry"
    aka: [ "OTel" ]
    definition: "An open-source, vendor-neutral toolkit for creating and exporting traces, metrics and logs; it is not a backend itself."
    see: observability
    source: { title: "What is OpenTelemetry? (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/what-is-opentelemetry/", verifiedOn: "2026-10-17" }

  - id: otlp
    term: "OTLP"
    aka: [ "OpenTelemetry Protocol" ]
    definition: "The OpenTelemetry protocol that delivers telemetry from apps to collectors and backends, over gRPC or HTTP."
    see: observability
    source: { title: "OTLP Specification (OpenTelemetry)", url: "https://opentelemetry.io/docs/specs/otlp/", verifiedOn: "2026-10-17" }

  - id: tag-cardinality
    term: "Cardinality (tags)"
    aka: [ "high cardinality", "low cardinality", "high-cardinality", "low-cardinality" ]
    definition: "How many distinct values a tag can take. Low (HTTP method) suits metrics; high (user ID) belongs on traces only."
    see: observability
    source: { title: "Observability: low and high cardinality (Spring Boot 4.1.1 Actuator reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/observability.html", verifiedOn: "2026-10-17" }

  - id: trace-sampling
    term: "Sampling (tracing)"
    aka: [ "sampling probability" ]
    definition: "Keeping only a share of traces to limit cost; Spring Boot keeps 10% by default."
    see: observability
    source: { title: "Tracing: sampling (Spring Boot 4.1.1 Actuator reference)", url: "https://docs.spring.io/spring-boot/reference/actuator/tracing.html", verifiedOn: "2026-10-17" }

  - id: executable-jar
    term: "Executable jar"
    aka: [ "fat jar", "uber jar", "uber-jar" ]
    definition: "One jar with your classes, all dependency jars nested inside, and a loader; you run it with java -jar."
    see: packaging-deployment
    source: { title: "Developing Your First Spring Boot Application: executable jars (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/tutorial/first-application/index.html", verifiedOn: "2026-10-17" }

  - id: layered-jar
    term: "Layered jar"
    aka: [ "layered jars", "layers.idx" ]
    definition: "A jar whose layers.idx groups content by how often it changes, so container image layers can be cached."
    see: packaging-deployment
    source: { title: "Efficient Container Images (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/container-images/efficient-images.html", verifiedOn: "2026-10-17" }

  - id: buildpacks
    term: "Cloud Native Buildpacks"
    aka: [ "buildpacks", "buildpack" ]
    definition: "Tools that turn an app into an OCI image; Spring Boot's build-image goal runs them with a Paketo builder."
    see: packaging-deployment
    source: { title: "Packaging OCI Images (Spring Boot 4.1.1 Maven plugin)", url: "https://docs.spring.io/spring-boot/maven-plugin/build-image.html", verifiedOn: "2026-10-17" }

  - id: oci-image
    term: "OCI image"
    aka: [ "container image", "container images" ]
    definition: "A container image in the Open Container Initiative format, holding what an app needs to start on its target platform."
    see: packaging-deployment
    source: { title: "OCI Image Format Specification (GitHub)", url: "https://github.com/opencontainers/image-spec", verifiedOn: "2026-10-17" }

  - id: aot-cache
    term: "AOT cache"
    definition: "A JVM feature (Java 25+ in Spring Boot) that saves classes from a training run, so later starts are faster and lighter."
    see: packaging-deployment
    source: { title: "AOT Cache (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/aot-cache.html", verifiedOn: "2026-10-17" }

  - id: cds
    term: "Class Data Sharing"
    aka: [ "CDS" ]
    definition: "An older JVM archive of classes made in a training run; Spring Boot recommends the AOT cache instead on Java 25+."
    see: packaging-deployment
    source: { title: "AOT Cache: CDS (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/aot-cache.html", verifiedOn: "2026-10-17" }

  - id: native-image
    term: "Native image"
    aka: [ "native images", "native executable" ]
    definition: "A platform-specific executable that GraalVM compiles ahead of time from Java code; it runs without a JVM."
    see: native-images
    source: { title: "Introducing GraalVM Native Images (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/native-image/introducing-graalvm-native-images.html", verifiedOn: "2026-10-17" }

  - id: graalvm
    term: "GraalVM"
    definition: "A Java platform whose Native Image tool compiles an app ahead of time into a standalone native executable."
    see: native-images
    source: { title: "Introduction to GraalVM (GraalVM docs)", url: "https://www.graalvm.org/latest/introduction/", verifiedOn: "2026-10-17" }

  - id: aot-processing
    term: "AOT processing"
    aka: [ "Spring AOT", "ahead-of-time processing" ]
    definition: "Spring's build-time step that turns bean definitions into Java code and writes hint files, for native images or faster JVM starts."
    see: native-images
    source: { title: "Ahead-of-Time Processing With the JVM (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/aot.html", verifiedOn: "2026-10-17" }

  - id: closed-world-assumption
    term: "Closed-world assumption"
    aka: [ "closed world" ]
    definition: "The native image rule that all code is known at build time; no classes can be added or loaded later."
    see: native-images
    source: { title: "Native Image Basics (GraalVM docs)", url: "https://www.graalvm.org/latest/reference-manual/native-image/basics/", verifiedOn: "2026-10-17" }

  - id: runtime-hints
    term: "Runtime hints"
    aka: [ "RuntimeHints", "RuntimeHintsRegistrar" ]
    definition: "Build-time notes that tell GraalVM about reflection, resources, serialisation and proxies the app uses."
    see: native-images
    source: { title: "Advanced Native Images Topics: custom hints (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/native-image/advanced-topics.html", verifiedOn: "2026-10-17" }

  - id: reachability-metadata
    term: "Reachability metadata"
    definition: "Hint files for libraries that ship none, shared in the GraalVM Reachability Metadata repository; Spring relies on it."
    see: native-images
    source: { title: "Advanced Native Images Topics (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/packaging/native-image/advanced-topics.html", verifiedOn: "2026-10-17" }

  - id: task-executor
    term: "TaskExecutor"
    aka: [ "task executor" ]
    definition: "Spring's interface for running tasks, identical to java.util.concurrent.Executor; Boot's default is the applicationTaskExecutor pool."
    see: async-scheduling
    source: { title: "Task Execution and Scheduling (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html", verifiedOn: "2026-10-17" }

  - id: task-scheduler
    term: "TaskScheduler"
    aka: [ "task scheduler" ]
    definition: "Spring's interface for running tasks later: once, at a fixed rate, with a fixed delay or by a trigger such as cron."
    see: async-scheduling
    source: { title: "Task Execution and Scheduling (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html", verifiedOn: "2026-10-17" }

  - id: cron-expression
    term: "Cron expression"
    aka: [ "cron" ]
    definition: "A schedule string; Spring's has six fields, starting with seconds, such as 0 0 9 * * MON-FRI."
    see: async-scheduling
    source: { title: "Task Execution and Scheduling: cron expressions (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html", verifiedOn: "2026-10-17" }

  - id: completable-future
    term: "CompletableFuture"
    definition: "A Java Future that can be composed with further steps; the usual return type of an @Async method that returns a result."
    see: async-scheduling
    source: { title: "Async (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/annotation/Async.html", verifiedOn: "2026-10-17" }

  - id: shedlock
    term: "ShedLock"
    definition: "A library that locks scheduled jobs in a shared store, so each job runs at most once at a time across instances."
    see: async-scheduling
    source: { title: "ShedLock README (GitHub)", url: "https://github.com/lukas-krecan/ShedLock", verifiedOn: "2026-10-17" }

  # Spring Cloud
  - id: spring-cloud
    term: "Spring Cloud"
    definition: "A family of Spring projects for patterns between services: config, discovery, routing, load balancing, circuit breakers and messaging."
    see: spring-cloud-overview
    source: { title: "Spring Cloud project page (spring.io)", url: "https://spring.io/projects/spring-cloud", verifiedOn: "2026-10-17" }

  - id: spring-cloud-release-train
    term: "Release train (Spring Cloud)"
    aka: [ "release train", "release trains" ]
    definition: "One published set of Spring Cloud project versions, tested together and imported as one BOM, e.g. 2025.1.3."
    see: spring-cloud-overview
    source: { title: "Release Train Naming Convention (spring-cloud-release wiki)", url: "https://github.com/spring-cloud/spring-cloud-release/wiki/Release-Train-Naming-Convention", verifiedOn: "2026-10-17" }

  - id: service-discovery
    term: "Service discovery"
    definition: "Finding a live instance of a service by its name at runtime, instead of hardcoding its host and port."
    see: service-discovery-eureka
    source: { title: "Spring Cloud Commons 5.0.3: DiscoveryClient", url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/common-abstractions.html", verifiedOn: "2026-10-17" }

  - id: service-registry
    term: "Service registry"
    definition: "A directory of running service instances: services register in it and callers query it. Eureka is one."
    see: service-discovery-eureka
    source: { title: "Spring Cloud Netflix 5.0.2 reference: Eureka", url: "https://docs.spring.io/spring-cloud-netflix/reference/spring-cloud-netflix.html", verifiedOn: "2026-10-17" }

  - id: eureka
    term: "Eureka"
    aka: [ "Netflix Eureka", "Eureka server" ]
    definition: "Netflix's service registry, used through Spring Cloud Netflix. Instances register and send heartbeats; clients fetch the list."
    see: service-discovery-eureka
    source: { title: "Understanding Eureka client/server communication (Netflix Eureka wiki)", url: "https://github.com/Netflix/eureka/wiki/Understanding-eureka-client-server-communication", verifiedOn: "2026-10-17" }

  - id: eureka-heartbeat
    term: "Heartbeat (Eureka lease renewal)"
    aka: [ "lease renewal", "Eureka heartbeat" ]
    definition: "A client's call to renew its lease, every 30 s by default; after 90 s without one the server drops the instance."
    see: service-discovery-eureka
    source: { title: "Spring Cloud Netflix: configuration properties", url: "https://docs.spring.io/spring-cloud-netflix/reference/configprops.html", verifiedOn: "2026-10-17" }

  - id: eureka-self-preservation
    term: "Self-preservation mode"
    aka: [ "self-preservation" ]
    definition: "When far fewer heartbeats arrive than expected, the Eureka server stops evicting instances, so a network fault does not empty the registry."
    see: service-discovery-eureka
    source: { title: "Server Self Preservation Mode (Netflix Eureka wiki)", url: "https://github.com/Netflix/eureka/wiki/Server-Self-Preservation-Mode", verifiedOn: "2026-10-17" }

  - id: client-side-load-balancing
    term: "Client-side load balancing"
    definition: "The caller holds the list of instances and picks one for each call, instead of going through a central load balancer."
    see: service-discovery-eureka
    source: { title: "Spring Cloud LoadBalancer (Spring Cloud Commons 5.0.3)", url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html", verifiedOn: "2026-10-17" }

  - id: spring-cloud-loadbalancer
    term: "Spring Cloud LoadBalancer"
    definition: "Spring Cloud's client-side load balancer: it picks an instance of a service id, round robin by default. It replaced Ribbon."
    see: service-discovery-eureka
    source: { title: "Spring Cloud LoadBalancer (Spring Cloud Commons 5.0.3)", url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html", verifiedOn: "2026-10-17" }

  - id: api-gateway
    term: "API gateway"
    definition: "A single entry point that routes client requests to services and handles shared concerns such as rate limiting once."
    see: spring-cloud-gateway
    source: { title: "Spring Cloud Gateway 5.0.3 reference", url: "https://docs.spring.io/spring-cloud-gateway/reference/", verifiedOn: "2026-10-17" }

  - id: rate-limiting
    term: "Rate limiting"
    aka: [ "rate limiter" ]
    definition: "Capping how many requests a client may make in a period; extra requests are rejected, often with HTTP 429."
    see: spring-cloud-gateway
    source: { title: "Spring Cloud Gateway 5.0.3: RequestRateLimiter GatewayFilter factory", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/gatewayfilter-factories/requestratelimiter-factory.html", verifiedOn: "2026-10-17" }

  - id: token-bucket
    term: "Token bucket"
    definition: "A rate-limiting algorithm: tokens refill at a steady rate up to the bucket size; each request takes one; an empty bucket rejects."
    see: spring-cloud-gateway
    source: { title: "Spring Cloud Gateway 5.0.3: RequestRateLimiter (replenishRate, burstCapacity)", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/gatewayfilter-factories/requestratelimiter-factory.html", verifiedOn: "2026-10-17" }

  - id: config-server
    term: "Config Server"
    aka: [ "Spring Cloud Config" ]
    definition: "A Spring Cloud server that serves configuration from Git or another backend to client apps over HTTP."
    see: config-server
    source: { title: "Spring Cloud Config 5.0.5: Spring Cloud Config Server", url: "https://docs.spring.io/spring-cloud-config/reference/server.html", verifiedOn: "2026-10-17" }

  - id: refresh-scope
    term: "@RefreshScope"
    definition: "Marks a bean as a lazy proxy that is rebuilt with the new config on its next call after a refresh."
    see: config-server
    source: { title: "Spring Cloud Commons 5.0.3: refresh scope", url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/application-context-services.html", verifiedOn: "2026-10-17" }

  - id: spring-cloud-bus
    term: "Spring Cloud Bus"
    definition: "Links service instances through a message broker, RabbitMQ or Kafka, to broadcast events such as a config refresh."
    see: config-server
    source: { title: "Spring Cloud Bus 5.0.3: Quick Start", url: "https://docs.spring.io/spring-cloud-bus/reference/quickstart.html", verifiedOn: "2026-10-17" }

  - id: feign
    term: "Feign"
    aka: [ "OpenFeign" ]
    definition: "A declarative HTTP client: you write an annotated Java interface and it generates the calls."
    see: openfeign
    source: { title: "Spring Cloud OpenFeign 5.0.3 reference", url: "https://docs.spring.io/spring-cloud-openfeign/reference/spring-cloud-openfeign.html", verifiedOn: "2026-10-17" }

  - id: circuit-breaker
    term: "Circuit breaker"
    definition: "A guard around a remote call: after too many failures it stops calling and fails fast, then tests whether the service is back."
    see: resilience4j
    source: { title: "Circuit Breaker pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker", verifiedOn: "2026-10-17" }

  - id: resilience4j
    term: "Resilience4j"
    definition: "A Java fault-tolerance library with circuit breaker, retry, rate limiter, bulkhead and time limiter modules."
    see: resilience4j
    source: { title: "Spring Cloud CircuitBreaker 5.0.3 reference: implementations", url: "https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker.html", verifiedOn: "2026-10-17" }

  - id: bulkhead
    term: "Bulkhead"
    definition: "Caps how many calls to one dependency may run at the same time, so it cannot use up all threads."
    see: resilience4j
    source: { title: "Bulkhead (Resilience4j docs)", url: "https://resilience4j.readme.io/docs/bulkhead", verifiedOn: "2026-10-17" }

  - id: fallback-method
    term: "Fallback method"
    aka: [ "fallbackMethod" ]
    definition: "A method that returns a substitute answer when the protected call fails or the circuit is open."
    see: resilience4j
    source: { title: "Getting started with resilience4j-spring-boot (Resilience4j docs)", url: "https://resilience4j.readme.io/docs/getting-started-3", verifiedOn: "2026-10-17" }

  - id: hystrix
    term: "Hystrix"
    aka: [ "Netflix Hystrix" ]
    definition: "Netflix's circuit-breaker library. Spring put it into maintenance mode in 2018 and removed it in 2020.0; use Resilience4j."
    see: spring-cloud-overview
    source: { title: "Spring Cloud Greenwich.RC1: Netflix modules in maintenance mode (spring.io blog)", url: "https://spring.io/blog/2018/12/12/spring-cloud-greenwich-rc1-available-now", verifiedOn: "2026-10-17" }

  - id: kafka
    term: "Apache Kafka"
    aka: [ "Kafka" ]
    definition: "A distributed event log: producers write records to partitioned topics, and consumer groups read them."
    see: spring-kafka
    source: { title: "Introduction (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/getting-started/introduction/", verifiedOn: "2026-10-17" }

  - id: kafka-topic
    term: "Kafka topic"
    definition: "A named stream of records in Kafka, split into partitions spread over the brokers."
    see: spring-kafka
    source: { title: "Introduction (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/getting-started/introduction/", verifiedOn: "2026-10-17" }

  - id: kafka-partition
    term: "Kafka partition"
    definition: "One ordered part of a topic. Records with the same key go to the same partition and are read in write order."
    see: spring-kafka
    source: { title: "Introduction (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/getting-started/introduction/", verifiedOn: "2026-10-17" }

  - id: consumer-group
    term: "Consumer group"
    definition: "Consumers that share a group id. Each partition is read by exactly one of them, so they share the work."
    see: spring-kafka
    source: { title: "Design (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/design/design/", verifiedOn: "2026-10-17" }

  - id: kafka-offset
    term: "Offset (Kafka)"
    aka: [ "consumer offset", "committed offset" ]
    definition: "A consumer's position in a partition. Committing it records how far the group has processed."
    see: spring-kafka
    source: { title: "Design: consumer position (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/design/design/", verifiedOn: "2026-10-17" }

  - id: dead-letter-topic
    term: "Dead-letter topic"
    aka: [ "DLT", "dead letter topic" ]
    definition: "A topic for records that keep failing, so the main topic moves on and they can be checked later."
    see: spring-kafka
    source: { title: "Handling exceptions: DeadLetterPublishingRecoverer (Spring for Apache Kafka 4.1.1)", url: "https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html", verifiedOn: "2026-10-17" }

  - id: at-least-once
    term: "At-least-once delivery"
    aka: [ "at least once", "at-least-once" ]
    definition: "Messages are never lost but may be delivered more than once. Kafka's default guarantee."
    see: spring-kafka
    source: { title: "Design: message delivery semantics (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/design/design/", verifiedOn: "2026-10-17" }

  - id: at-most-once
    term: "At-most-once delivery"
    aka: [ "at most once", "at-most-once" ]
    definition: "Messages may be lost but are never delivered twice."
    see: spring-kafka
    source: { title: "Design: message delivery semantics (Apache Kafka 4.2 docs)", url: "https://kafka.apache.org/42/design/design/", verifiedOn: "2026-10-17" }

  - id: exactly-once
    term: "Exactly-once semantics"
    aka: [ "exactly once", "exactly-once", "EOS" ]
    definition: "Each message is processed once and only once; in Kafka, through transactions for read-process-write work."
    see: spring-kafka
    source: { title: "Exactly Once Semantics (Spring for Apache Kafka 4.1.1)", url: "https://docs.spring.io/spring-kafka/reference/kafka/exactly-once.html", verifiedOn: "2026-10-17" }

  - id: idempotent-consumer
    term: "Idempotent consumer"
    aka: [ "idempotent listener", "idempotent listeners" ]
    definition: "A consumer that handles a repeated message with no extra effect, for example by recording the ids it has processed."
    see: spring-kafka
    source: { title: "Pattern: Idempotent Consumer (microservices.io)", url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html", verifiedOn: "2026-10-17" }
