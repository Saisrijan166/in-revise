terms:
  - id: convention-over-configuration
    term: Convention over configuration
    definition: Sensible defaults are chosen for you, so you configure only what differs. Spring Boot follows it.
    see: spring-vs-spring-boot
    source:
      title: "Spring Framework Overview: Spring Boot favours convention over configuration"
      url: https://docs.spring.io/spring-framework/reference/overview.html
      verifiedOn: 2026-10-19
  - id: starter
    term: Starter
    aka:
      - Spring Boot starter
      - starters
    definition: A dependency descriptor that brings a tested set of libraries for one feature, e.g. spring-boot-starter-data-jpa.
    see: starters
    source:
      title: "Build Systems: Starters (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/using/build-systems.html
      verifiedOn: 2026-10-19
  - id: bom
    term: BOM (bill of materials)
    aka:
      - BOM
      - bill of materials
    definition: A POM that only lists versions; import it and leave versions out. Boot's is spring-boot-dependencies.
    see: starters
    source:
      title: "Using the Plugin: importing spring-boot-dependencies (Spring Boot 4.1.1 Maven plugin)"
      url: https://docs.spring.io/spring-boot/maven-plugin/using.html
      verifiedOn: 2026-10-19
  - id: spring-boot-starter-parent
    term: spring-boot-starter-parent
    definition: "Boot's Maven parent POM: managed versions from the BOM plus build defaults such as Java 17."
    see: starters
    source:
      title: "Using the Plugin: inheriting the starter parent (Spring Boot 4.1.1 Maven plugin)"
      url: https://docs.spring.io/spring-boot/maven-plugin/using.html
      verifiedOn: 2026-10-19
  - id: maven
    term: Maven
    aka:
      - Apache Maven
    definition: A Java build tool that reads the project and its dependencies from pom.xml.
    see: starters
    source:
      title: Using the Plugin (Spring Boot 4.1.1 Maven plugin)
      url: https://docs.spring.io/spring-boot/maven-plugin/using.html
      verifiedOn: 2026-10-19
  - id: gradle
    term: Gradle
    definition: A build tool whose build script is written in a Groovy or Kotlin DSL.
    see: starters
    source:
      title: Managing Dependencies (Spring Boot 4.1.1 Gradle plugin)
      url: https://docs.spring.io/spring-boot/gradle-plugin/managing-dependencies.html
      verifiedOn: 2026-10-19
  - id: auto-configuration
    term: Auto-configuration
    aka:
      - autoconfiguration
      - auto-configured
    definition: Boot creates commonly needed beans from the jars on the classpath, and backs off when you define your own.
    see: auto-configuration
    source:
      title: Auto-configuration (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/using/auto-configuration.html
      verifiedOn: 2026-10-19
  - id: conditional-annotations
    term: "@Conditional annotations"
    aka:
      - condition annotations
      - "@ConditionalOnClass"
      - "@ConditionalOnMissingBean"
      - "@ConditionalOnProperty"
      - "@ConditionalOnBean"
    definition: Annotations that apply a configuration only if a class, bean, property or app type matches.
    see: auto-configuration
    source:
      title: "Creating Your Own Auto-configuration: condition annotations (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/developing-auto-configuration.html
      verifiedOn: 2026-10-19
  - id: embedded-server
    term: Embedded server
    aka:
      - embedded web server
      - embedded servlet container
    definition: A web server that runs inside the app as a library, so java -jar starts both together.
    see: embedded-server
    source:
      title: Embedded Web Servers how-to (Spring Boot 4.1.1)
      url: https://docs.spring.io/spring-boot/how-to/webserver.html
      verifiedOn: 2026-10-19
  - id: tomcat
    term: Tomcat
    aka:
      - Apache Tomcat
    definition: A servlet container; Spring Boot's default embedded server (Tomcat 11.0 in Boot 4.1).
    see: embedded-server
    source:
      title: "System Requirements: servlet containers (Spring Boot 4.1.1)"
      url: https://docs.spring.io/spring-boot/system-requirements.html
      verifiedOn: 2026-10-19
  - id: jetty
    term: Jetty
    aka:
      - Eclipse Jetty
    definition: A servlet container; Spring Boot's alternative to Tomcat (Jetty 12.1 in Boot 4.1).
    see: embedded-server
    source:
      title: "System Requirements: servlet containers (Spring Boot 4.1.1)"
      url: https://docs.spring.io/spring-boot/system-requirements.html
      verifiedOn: 2026-10-19
  - id: devtools
    term: DevTools
    aka:
      - Spring Boot DevTools
      - spring-boot-devtools
    definition: "Boot's development-only module: automatic restart and dev property defaults; off in a packaged app."
    see: spring-vs-spring-boot
    source:
      title: Developer Tools (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/using/devtools.html
      verifiedOn: 2026-10-19
  - id: spring-application
    term: SpringApplication
    definition: The Boot class whose run method starts the app from main and creates the context.
    see: application-startup
    source:
      title: SpringApplication (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/features/spring-application.html
      verifiedOn: 2026-10-19
  - id: command-line-runner
    term: CommandLineRunner
    definition: A bean whose run(String... args) is called once, just before SpringApplication.run completes.
    see: application-startup
    source:
      title: "SpringApplication: runners (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/spring-application.html
      verifiedOn: 2026-10-19
  - id: application-runner
    term: ApplicationRunner
    definition: Like CommandLineRunner, but run gets ApplicationArguments with --name=value options parsed.
    see: application-startup
    source:
      title: "SpringApplication: runners (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/spring-application.html
      verifiedOn: 2026-10-19
  - id: inversion-of-control
    term: Inversion of control (IoC)
    aka:
      - inversion of control
      - IoC
    definition: A design where the framework, not your code, creates objects and connects them.
    see: ioc-container
    source:
      title: Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/introduction.html
      verifiedOn: 2026-10-19
  - id: dependency-injection
    term: Dependency injection (DI)
    aka:
      - dependency injection
      - DI
    definition: "A form of IoC: an object receives its dependencies through its constructor, setters or fields."
    see: dependency-injection
    source:
      title: Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/introduction.html
      verifiedOn: 2026-10-19
  - id: bean
    term: Bean
    aka:
      - Spring bean
      - beans
    definition: An object that the Spring IoC container creates, wires and manages.
    see: ioc-container
    source:
      title: Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/introduction.html
      verifiedOn: 2026-10-19
  - id: application-context
    term: ApplicationContext
    aka:
      - application context
    definition: "Spring's main container: a BeanFactory plus events, i18n messages and AOP support."
    see: ioc-container
    source:
      title: Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/introduction.html
      verifiedOn: 2026-10-19
  - id: bean-factory
    term: BeanFactory
    definition: "The root container interface: it creates and wires beans, without ApplicationContext's extras."
    see: ioc-container
    source:
      title: The BeanFactory API (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/beanfactory.html
      verifiedOn: 2026-10-19
  - id: component-annotation
    term: "@Component"
    definition: Marks a class as a Spring-managed component that component scanning registers as a bean.
    see: component-vs-bean
    source:
      title: Classpath Scanning and Managed Components (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html
      verifiedOn: 2026-10-19
  - id: bean-annotation
    term: "@Bean"
    definition: Marks a method whose returned object Spring registers and manages as a bean.
    see: component-vs-bean
    source:
      title: Using the @Bean Annotation (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/java/bean-annotation.html
      verifiedOn: 2026-10-19
  - id: configuration-annotation
    term: "@Configuration"
    definition: Marks a class that declares @Bean methods; it is itself a @Component.
    see: component-vs-bean
    source:
      title: Configuration (Spring Framework 7.0 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/context/annotation/Configuration.html
      verifiedOn: 2026-10-19
  - id: stereotype-annotation
    term: Stereotype annotation
    aka:
      - stereotype annotations
      - stereotypes
    definition: "@Component or an annotation built on it, like @Service, @Repository or @Controller, naming a bean's layer."
    see: component-vs-bean
    source:
      title: Classpath Scanning and Managed Components (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html
      verifiedOn: 2026-10-19
  - id: autowired-annotation
    term: "@Autowired"
    aka:
      - autowiring
    definition: Asks Spring to inject a matching bean into a constructor, setter or field.
    see: dependency-injection
    source:
      title: Using @Autowired (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired.html
      verifiedOn: 2026-10-19
  - id: component-scanning
    term: Component scanning
    aka:
      - component scan
      - classpath scanning
    definition: Spring searching base packages for @Component classes and registering them as beans.
    see: component-scanning
    source:
      title: Classpath Scanning and Managed Components (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html
      verifiedOn: 2026-10-19
  - id: qualifier-annotation
    term: "@Qualifier"
    definition: At an injection point, narrows the matching beans to those with that qualifier or bean name.
    see: bean-selection
    source:
      title: Fine-tuning Annotation-based Autowiring with Qualifiers (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html
      verifiedOn: 2026-10-19
  - id: primary-annotation
    term: "@Primary"
    definition: Marks the bean Spring prefers when several beans match one injection point.
    see: bean-selection
    source:
      title: Using @Primary or @Fallback (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-primary.html
      verifiedOn: 2026-10-19
  - id: no-unique-bean-definition-exception
    term: NoUniqueBeanDefinitionException
    definition: Thrown when several beans match where exactly one was expected.
    see: bean-selection
    source:
      title: NoUniqueBeanDefinitionException (Spring Framework 7.0 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/NoUniqueBeanDefinitionException.html
      verifiedOn: 2026-10-19
  - id: bean-scope
    term: Bean scope
    definition: How many instances of a bean exist and how long each lives.
    see: bean-scopes
    source:
      title: Bean Scopes (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
      verifiedOn: 2026-10-19
  - id: singleton-scope
    term: Singleton scope
    aka:
      - singleton bean
      - singleton beans
    definition: "The default scope: one shared instance per container and bean definition."
    see: bean-scopes
    source:
      title: Bean Scopes (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
      verifiedOn: 2026-10-19
  - id: prototype-scope
    term: Prototype scope
    aka:
      - prototype bean
      - prototype beans
    definition: A new instance each time the bean is requested; Spring never calls its destroy callbacks.
    see: bean-scopes
    source:
      title: Bean Scopes (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
      verifiedOn: 2026-10-19
  - id: request-scope
    term: Request scope
    aka:
      - "@RequestScope"
    definition: One bean instance per HTTP request; web applications only.
    see: bean-scopes
    source:
      title: Bean Scopes (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
      verifiedOn: 2026-10-19
  - id: session-scope
    term: Session scope
    aka:
      - "@SessionScope"
    definition: One bean instance per HTTP session; web applications only.
    see: bean-scopes
    source:
      title: Bean Scopes (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
      verifiedOn: 2026-10-19
  - id: post-construct
    term: "@PostConstruct"
    definition: Marks a method Spring calls once the bean's dependencies are injected (jakarta.annotation).
    see: bean-lifecycle
    source:
      title: Customizing the Nature of a Bean (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
      verifiedOn: 2026-10-19
  - id: pre-destroy
    term: "@PreDestroy"
    definition: Marks a method Spring calls before the bean is destroyed, when the context closes.
    see: bean-lifecycle
    source:
      title: Customizing the Nature of a Bean (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html
      verifiedOn: 2026-10-19
  - id: lazy-annotation
    term: "@Lazy"
    definition: Creates a bean on first use instead of at startup; on an injection point, injects a lazy proxy.
    see: bean-lifecycle
    source:
      title: Lazy (Spring Framework 7.0 API)
      url: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/context/annotation/Lazy.html
      verifiedOn: 2026-10-19
  - id: circular-dependency
    term: Circular dependency
    aka:
      - circular dependencies
      - circular reference
      - circular references
    definition: Beans that need each other, directly or through others; Spring Boot rejects them by default.
    see: circular-dependencies
    source:
      title: "Spring Boot 2.6 Release Notes: circular references prohibited by default"
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.6-Release-Notes
      verifiedOn: 2026-10-19
  - id: aop
    term: AOP
    aka:
      - aspect-oriented programming
      - Spring AOP
    definition: "Aspect-oriented programming: writing cross-cutting code, like logging or transactions, once for many methods."
    see: spring-aop
    source:
      title: AOP Concepts (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html
      verifiedOn: 2026-10-19
  - id: aop-aspect
    term: Aspect (AOP)
    aka:
      - "@Aspect"
    definition: "A class holding cross-cutting logic: advice plus pointcuts. In Spring, @Aspect with @Component."
    see: spring-aop
    source:
      title: Declaring an Aspect (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/at-aspectj.html
      verifiedOn: 2026-10-19
  - id: aop-advice
    term: Advice (AOP)
    aka:
      - AOP advice
      - around advice
      - before advice
    definition: "The code an aspect runs at a join point: before, after returning, after throwing, after or around."
    see: spring-aop
    source:
      title: AOP Concepts (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html
      verifiedOn: 2026-10-19
  - id: aop-pointcut
    term: Pointcut
    aka:
      - pointcuts
    definition: An expression that selects join points, such as every method in a service package.
    see: spring-aop
    source:
      title: AOP Concepts (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html
      verifiedOn: 2026-10-19
  - id: aop-join-point
    term: Join point
    aka:
      - join points
    definition: A point where advice can run; in Spring AOP always a method execution.
    see: spring-aop
    source:
      title: AOP Concepts (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html
      verifiedOn: 2026-10-19
  - id: aop-weaving
    term: Weaving
    definition: "Linking aspects to the code they advise: at compile, load or run time; Spring AOP does it at runtime."
    see: spring-aop
    source:
      title: AOP Concepts (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html
      verifiedOn: 2026-10-19
  - id: aop-proxy
    term: Proxy (Spring AOP)
    aka:
      - AOP proxy
      - Spring proxy
      - Spring proxies
    definition: "An object Spring puts in place of a bean: it runs the advice, then calls the real bean."
    see: aop-proxies
    source:
      title: AOP Concepts (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/introduction-defn.html
      verifiedOn: 2026-10-19
  - id: jdk-dynamic-proxy
    term: JDK dynamic proxy
    aka:
      - JDK proxy
      - JDK proxies
    definition: A proxy that implements the bean's interfaces; only interface methods can be advised.
    see: aop-proxies
    source:
      title: Proxying Mechanisms (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
      verifiedOn: 2026-10-19
  - id: cglib-proxy
    term: CGLIB proxy
    aka:
      - CGLIB
    definition: A proxy that is a runtime subclass of the bean's class; final and private methods cannot be advised.
    see: aop-proxies
    source:
      title: Proxying Mechanisms (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
      verifiedOn: 2026-10-19
  - id: self-invocation
    term: Self-invocation
    aka:
      - self invocation
      - self-call
    definition: A bean calling its own method through this; the call skips the proxy, so no advice runs.
    see: aop-proxies
    source:
      title: Proxying Mechanisms (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/aop/proxying.html
      verifiedOn: 2026-10-19
  - id: async-annotation
    term: "@Async"
    definition: Marks a method to run on another thread from a task executor; the caller does not wait.
    see: async-scheduling
    source:
      title: Task Execution and Scheduling (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
      verifiedOn: 2026-10-19
  - id: enable-async
    term: "@EnableAsync"
    definition: Switches on processing of @Async methods; put it on a @Configuration class.
    see: async-scheduling
    source:
      title: Task Execution and Scheduling (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
      verifiedOn: 2026-10-19
  - id: scheduled-annotation
    term: "@Scheduled"
    aka:
      - "@EnableScheduling"
    definition: Runs a method by fixedRate, fixedDelay or cron; needs @EnableScheduling.
    see: async-scheduling
    source:
      title: Task Execution and Scheduling (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
      verifiedOn: 2026-10-19
  - id: cron-expression
    term: Cron expression
    aka:
      - cron
    definition: A schedule string; Spring's has six fields, seconds first, like 0 0 9 * * MON-FRI.
    see: async-scheduling
    source:
      title: Task Execution and Scheduling (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
      verifiedOn: 2026-10-19
  - id: task-executor
    term: TaskExecutor
    aka:
      - task executor
    definition: Spring's interface for running tasks on other threads, like java.util.concurrent.Executor.
    see: async-scheduling
    source:
      title: Task Execution and Scheduling (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/integration/scheduling.html
      verifiedOn: 2026-10-19
  - id: application-event-publisher
    term: ApplicationEventPublisher
    aka:
      - publishEvent
    definition: The interface a bean uses to publish an application event to all matching listeners.
    see: application-events
    source:
      title: Standard and Custom Events (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html
      verifiedOn: 2026-10-19
  - id: event-listener
    term: "@EventListener"
    definition: Marks a bean method as a listener for events of its parameter type.
    see: application-events
    source:
      title: Standard and Custom Events (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/context-introduction.html
      verifiedOn: 2026-10-19
  - id: transactional-event-listener
    term: "@TransactionalEventListener"
    definition: A listener that runs at a transaction phase, after the commit by default.
    see: application-events
    source:
      title: Transaction-bound Events (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/event.html
      verifiedOn: 2026-10-19
  - id: shedlock
    term: ShedLock
    definition: A library that locks scheduled jobs in a shared store, so each runs at most once at a time.
    see: async-scheduling
    source:
      title: ShedLock README (GitHub)
      url: https://github.com/lukas-krecan/ShedLock
      verifiedOn: 2026-10-19
  - id: application-properties-file
    term: application.properties
    definition: The default Spring Boot config file of flat key=value lines, read from the classpath and the start folder.
    see: externalized-configuration
    source:
      title: Externalized Configuration (Spring Boot 4.1.1 reference)
      url: https://docs.spring.io/spring-boot/reference/features/external-config.html
      verifiedOn: 2026-10-19
  - id: application-yaml-file
    term: application.yml
    aka:
      - application.yaml
    definition: "The YAML form of the config file: the same keys, nested by indentation."
    see: externalized-configuration
    source:
      title: "Externalized Configuration: Working With YAML (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/external-config.html
      verifiedOn: 2026-10-19
  - id: property-source
    term: PropertySource
    aka:
      - property source
    definition: One named set of key-value pairs in the Environment, such as a config file or the env vars.
    see: externalized-configuration
    source:
      title: Environment Abstraction (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/environment.html
      verifiedOn: 2026-10-19
  - id: relaxed-binding
    term: Relaxed binding
    definition: "Spring Boot matches property names loosely: first-name, firstName and FIRSTNAME in env vars bind one field."
    see: configuration-properties
    source:
      title: "Externalized Configuration: Relaxed Binding (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/external-config.html
      verifiedOn: 2026-10-19
  - id: property-placeholders
    term: Property placeholder
    definition: A ${name} reference replaced by that property's value; ${name:default} gives a fallback.
    see: externalized-configuration
    source:
      title: "Externalized Configuration: Property Placeholders (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/external-config.html
      verifiedOn: 2026-10-19
  - id: value-annotation
    term: "@Value"
    definition: "Injects one property, ${key}, or a SpEL result, #{...}, into a field or constructor parameter."
    see: configuration-properties
    source:
      title: Using @Value (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/value-annotations.html
      verifiedOn: 2026-10-19
  - id: config-properties-class
    term: "@ConfigurationProperties"
    definition: Binds every property under a prefix to the fields of one typed class or record.
    see: configuration-properties
    source:
      title: "Externalized Configuration: Type-safe Configuration Properties (Spring Boot 4.1.1 reference)"
      url: https://docs.spring.io/spring-boot/reference/features/external-config.html
      verifiedOn: 2026-10-19
  - id: spring-environment
    term: Environment (Spring)
    aka:
      - Spring Environment
    definition: Spring's single view of all property sources and the active profiles; code asks it for a key.
    see: configuration-properties
    source:
      title: Environment Abstraction (Spring Framework 7.0.9 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/environment.html
      verifiedOn: 2026-10-19
