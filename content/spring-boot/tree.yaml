topics:
  boot-basics:
    - id: spring-vs-spring-boot
      children:
        - id: spring-framework
          label: Spring Framework
          note: Core container and DI, data access, transactions, web
        - id: spring-mvc
          label: Spring MVC
          note: Spring's Servlet-based web framework (module spring-webmvc)
        - id: spring-boot-project
          label: Spring Boot
          note: Built on Spring; opinionated, production-ready setup
        - id: convention-over-configuration
          label: Convention over configuration
          note: Sensible defaults; you configure only what differs
        - id: devtools
          label: DevTools
          note: Dev-only restart on classpath change; off in a packaged jar
    - id: starters
      children:
        - id: official-starters
          label: Official starters (spring-boot-starter-*)
          note: One dependency per feature; versions come from the BOM
          children:
            - id: starter-webmvc
              label: spring-boot-starter-webmvc
              note: Spring MVC and Tomcat; starter-web is deprecated since 4.0
            - id: starter-data-jpa
              label: spring-boot-starter-data-jpa
              note: Spring Data JPA, Hibernate, HikariCP; add the DB driver
            - id: starter-validation
              label: spring-boot-starter-validation
              note: Hibernate Validator; not in the web starters since 2.3
            - id: test-starters
              label: Test starters (-test)
              note: One per technology since 4.0, e.g. starter-webmvc-test
        - id: third-party-starters
          label: Third-party starters
          note: Named acme-spring-boot-starter; spring-boot-* is reserved
        - id: spring-boot-dependencies-bom
          label: spring-boot-dependencies (BOM)
          term: bom
          note: The curated version list of one Boot release
        - id: spring-boot-starter-parent
          label: spring-boot-starter-parent
          note: "Maven parent: BOM versions, Java 17 level, UTF-8"
        - id: build-tools
          label: Maven or Gradle
          note: Boot recommends one of the two; both use the same BOM
          children:
            - id: maven
              label: Maven
              note: pom.xml; parent or imported BOM; Maven 3.6.3+ for Boot 4.1
            - id: gradle
              label: Gradle
              note: Groovy or Kotlin DSL; Gradle 8.14+ or 9.x for Boot 4.1
    - id: auto-configuration
      children:
        - id: conditional-annotations
          label: "@Conditional annotations"
          note: Rules that decide whether an auto-configuration applies
          children:
            - id: conditional-on-class
              label: "@ConditionalOnClass"
              note: Applies only if a class is on the classpath
            - id: conditional-on-missing-bean
              label: "@ConditionalOnMissingBean"
              note: Applies only if no bean of that type exists yet
            - id: conditional-on-bean
              label: "@ConditionalOnBean"
              note: Applies only if a bean of that type exists
            - id: conditional-on-property
              label: "@ConditionalOnProperty"
              note: By default matches if the property exists and is not false
            - id: conditional-on-web-application
              label: "@ConditionalOnWebApplication"
              note: Applies only in a web application
        - id: backing-off
          label: Backing off
          note: Define your own bean and Boot's default is not created
        - id: excluding-auto-configuration
          label: Excluding an auto-configuration
          note: exclude, excludeName, or spring.autoconfigure.exclude
        - id: condition-evaluation-report
          label: Condition evaluation report
          note: --debug logs what matched, what did not, and why
        - id: auto-configuration-imports
          label: AutoConfiguration.imports file
          note: In META-INF/spring; lists auto-config classes, one per line
    - id: spring-boot-application
      children:
        - id: spring-boot-configuration
          label: "@SpringBootConfiguration"
          note: Boot's @Configuration; helps tests find the app config
        - id: enable-auto-configuration
          label: "@EnableAutoConfiguration"
          note: Turns on auto-configuration; add it only once
        - id: component-scan
          label: "@ComponentScan"
          note: Scans the main class's package and its sub-packages
        - id: import-annotation
          label: "@Import"
          note: Adds chosen configuration classes, e.g. when not scanning
    - id: application-startup
      children:
        - id: web-application-type
          label: Web application type
          note: "Spring MVC: servlet; else WebFlux: reactive; else none"
        - id: startup-runners
          label: Runners
          note: Called once, just before run() completes; order with @Order
          children:
            - id: command-line-runner
              label: CommandLineRunner
              note: "run(String... args): the raw arguments"
            - id: application-runner
              label: ApplicationRunner
              note: "run(ApplicationArguments args): parsed options"
        - id: application-started-event
          label: ApplicationStartedEvent
          note: Context refreshed; runners not called yet
        - id: application-ready-event
          label: ApplicationReadyEvent
          note: After the runners; then the app accepts traffic
        - id: failure-analyzer
          label: Failure analysers
          note: Print a cause and a fix, e.g. port 8080 already in use
    - id: embedded-server
      children:
        - id: embedded-tomcat
          label: Tomcat (default)
          term: tomcat
          note: Comes with the webmvc starter; Tomcat 11.0 in Boot 4.1
        - id: embedded-jetty
          label: Jetty
          term: jetty
          note: Exclude the Tomcat starter, add starter-jetty; Jetty 12.1
        - id: embedded-reactor-netty
          label: Reactor Netty
          note: The default server of spring-boot-starter-webflux
        - id: undertow-removed
          label: Undertow (removed in 4.0)
          note: Not yet compatible with the Servlet 6.1 baseline
        - id: server-port
          label: server.port
          note: 8080 by default; 0 picks a free port; -1 opens no HTTP port
        - id: graceful-shutdown
          label: Graceful shutdown
          note: Default since 3.4; up to 30s per shutdown phase
  beans-di:
    - id: ioc-container
      children:
        - id: inversion-of-control
          label: Inversion of control (IoC)
          note: The container, not your code, creates and connects objects
        - id: bean
          label: Bean
          note: An object the container creates, wires and manages
        - id: configuration-metadata
          label: Configuration metadata
          note: "Annotated classes, @Bean methods or XML: what to build"
        - id: bean-factory
          label: BeanFactory
          note: "The basic container interface: creates and wires beans"
        - id: application-context
          label: ApplicationContext
          note: BeanFactory plus events, i18n messages and AOP support
    - id: dependency-injection
      children:
        - id: constructor-injection
          label: Constructor injection
          note: Required dependencies as constructor arguments; recommended
        - id: setter-injection
          label: Setter injection
          note: For optional dependencies with a sensible default
        - id: field-injection
          label: Field injection
          note: "@Autowired on a field; cannot be final"
        - id: autowired-annotation
          label: "@Autowired"
          note: Not needed on a single constructor; picks one among several
    - id: component-vs-bean
      children:
        - id: component-annotation
          label: "@Component"
          note: Generic stereotype; registered by component scanning
          children:
            - id: service-stereotype
              label: "@Service"
              note: A @Component for the service (business) layer
            - id: repository-stereotype
              label: "@Repository"
              note: Data layer; eligible for DataAccessException translation
            - id: controller-stereotype
              label: "@Controller"
              note: A @Component for the web (presentation) layer
            - id: configuration-annotation
              label: "@Configuration"
              note: A @Component that declares @Bean methods
        - id: bean-annotation
          label: "@Bean"
          note: On a method; the returned object is registered as a bean
        - id: proxy-bean-methods
          label: proxyBeanMethods
          note: "true by default: @Bean method calls return the shared bean"
    - id: component-scanning
      children:
        - id: scan-base-package
          label: Base package
          note: The main class's package and all sub-packages
        - id: component-scan-annotation
          label: "@ComponentScan"
          note: Inside @SpringBootApplication; sets packages to scan
        - id: scan-base-packages
          label: scanBasePackages
          note: "@SpringBootApplication attribute; replaces the default package"
        - id: outside-base-package
          label: Class outside the base package
          note: Never scanned, so never registered as a bean
        - id: no-such-bean-definition-exception
          label: NoSuchBeanDefinitionException
          note: No bean definition found for the requested type or name
    - id: bean-selection
      children:
        - id: no-unique-bean-definition-exception
          label: NoUniqueBeanDefinitionException
          note: Several beans match where exactly one was expected
        - id: primary-annotation
          label: "@Primary"
          note: "On a bean: preferred when several beans match"
        - id: qualifier-annotation
          label: "@Qualifier"
          note: "At the injection point: narrows the matching beans"
        - id: fallback-annotation
          label: "@Fallback"
          note: "Spring Framework 6.2+: used only if no regular bean is left"
        - id: default-bean-name
          label: Default bean name
          note: "Scanned class: name with lower-case first letter; @Bean: method"
        - id: inject-all-beans
          label: List<T> and Map<String, T>
          note: Inject every match; Map keys are bean names
    - id: bean-scopes
      children:
        - id: singleton-scope
          label: Singleton scope
          note: "Default: one instance per container and bean definition"
        - id: prototype-scope
          label: Prototype scope
          note: A new instance each time the bean is requested
        - id: request-scope
          label: Request scope
          note: One instance per HTTP request; web apps only
        - id: session-scope
          label: Session scope
          note: One instance per HTTP session; web apps only
        - id: application-scope
          label: Application scope
          note: One instance per ServletContext; web apps only
        - id: websocket-scope
          label: WebSocket scope
          note: One instance per WebSocket session; web apps only
        - id: object-provider
          label: ObjectProvider
          note: Resolves the bean afresh on every call, e.g. a new prototype
    - id: bean-lifecycle
      children:
        - id: post-construct
          label: "@PostConstruct"
          note: Init callback; runs first among init callbacks
        - id: pre-destroy
          label: "@PreDestroy"
          note: Destroy callback; runs when the context closes
        - id: bean-post-processor
          label: BeanPostProcessor
          note: Hook around each bean's init; AOP proxies are made here
        - id: lazy-annotation
          label: "@Lazy"
          note: Create the bean on first use instead of at startup
        - id: lazy-initialization
          label: spring.main.lazy-initialization
          note: Make every bean lazy; false by default (Boot 4.1)
    - id: circular-dependencies
      children:
        - id: constructor-cycle
          label: Constructor cycle
          note: "Unresolvable: BeanCurrentlyInCreationException"
        - id: allow-circular-references
          label: spring.main.allow-circular-references
          note: false by default since Spring Boot 2.6
        - id: extract-third-bean
          label: Extract a third bean
          note: Move the shared logic out, so neither bean needs the other
        - id: lazy-injection-fix
          label: "@Lazy on one dependency"
          note: Injects a proxy; the real bean is resolved on first call
    - id: spring-aop
      children:
        - id: aop-aspect
          label: Aspect
          note: "A class with cross-cutting logic: @Aspect plus @Component"
        - id: aop-join-point
          label: Join point
          note: Where advice can run; in Spring AOP always a method execution
        - id: aop-pointcut
          label: Pointcut
          note: An expression that picks join points, e.g. execution(...)
        - id: aop-advice
          label: Advice
          note: The code an aspect runs at the matched join points
          children:
            - id: before-advice
              label: "@Before"
              note: Runs first; cannot stop the call unless it throws
            - id: after-returning-advice
              label: "@AfterReturning"
              note: Runs after a normal return
            - id: after-throwing-advice
              label: "@AfterThrowing"
              note: Runs when the method throws
            - id: after-finally-advice
              label: "@After (finally)"
              note: Runs however the method ends
            - id: around-advice
              label: "@Around"
              note: Wraps the call; decides whether proceed() runs
        - id: aop-weaving
          label: Weaving
          note: Linking aspects to beans; Spring AOP does it at runtime
    - id: aop-proxies
      children:
        - id: proxy-based-annotations
          label: "@Transactional, @Async, @Cacheable"
          note: Applied by a proxy; only calls through the proxy get them
        - id: jdk-dynamic-proxy
          label: JDK dynamic proxy
          note: Implements the bean's interfaces; core Spring's choice with one
        - id: cglib-proxy
          label: CGLIB proxy
          note: A runtime subclass; Spring Boot's default
        - id: final-private-methods
          label: Final and private methods
          note: Cannot be overridden, so a CGLIB proxy cannot advise them
        - id: self-invocation
          label: Self-invocation
          note: this.other() calls the real object, so no advice runs
          children:
            - id: move-to-other-bean
              label: Move the method to another bean
              note: The call now passes that bean's proxy; the docs' preferred fix
            - id: self-injection
              label: Inject the bean into itself
              note: Call through the injected proxy instead of this
            - id: aspectj-weaving
              label: AspectJ weaving
              note: Advice is in the bytecode, so self-calls are advised too
    - id: async-scheduling
      children:
        - id: async-annotation
          label: "@Async"
          note: Runs the method on another thread; needs @EnableAsync
          children:
            - id: async-return-types
              label: void or CompletableFuture
              note: A void method's exception never reaches the caller
            - id: boot-task-executor
              label: Boot's task executor
              note: ThreadPoolTaskExecutor, 8 core threads (Boot 4.1)
            - id: async-exception-handler
              label: AsyncUncaughtExceptionHandler
              note: Handles exceptions from void @Async methods
        - id: scheduled-annotation
          label: "@Scheduled"
          note: Runs a void, no-argument method on a timer; needs @EnableScheduling
          children:
            - id: fixed-rate
              label: fixedRate
              note: Period counted between start times
            - id: fixed-delay
              label: fixedDelay
              note: Delay counted from the end of the previous run
            - id: cron-schedule
              label: cron
              note: Six fields, seconds first, e.g. 0 0 9 * * MON-FRI
            - id: boot-task-scheduler
              label: Boot's scheduler
              note: ThreadPoolTaskScheduler with 1 thread (Boot 4.1)
        - id: scheduled-on-many-instances
          label: Many instances
          note: Each instance has its own scheduler, so each runs the job
          children:
            - id: shedlock
              label: ShedLock
              note: "A shared lock: a job runs at most once at a time"
    - id: application-events
      children:
        - id: event-publisher
          label: ApplicationEventPublisher
          note: publishEvent() takes any object as the event
        - id: event-listener
          label: "@EventListener"
          note: Marks a bean method as a listener for its parameter type
        - id: sync-event-delivery
          label: Synchronous by default
          note: publishEvent() blocks until every listener has finished
        - id: async-event-listener
          label: "@Async listener"
          note: Runs on another thread; its exceptions do not reach the caller
        - id: transactional-event-listener
          label: "@TransactionalEventListener"
          note: Runs at a transaction phase; not at all without a transaction
          children:
            - id: after-commit-phase
              label: AFTER_COMMIT
              note: "The default: runs only if the commit succeeded"
            - id: after-rollback-phase
              label: AFTER_ROLLBACK
              note: Runs if the transaction rolled back
            - id: before-commit-phase
              label: BEFORE_COMMIT
              note: Runs just before the commit
            - id: after-completion-phase
              label: AFTER_COMPLETION
              note: Runs after commit or rollback
  configuration:
    - id: externalized-configuration
      children:
        - id: property-sources
          label: Property sources (highest first)
          note: Where values come from; a higher source overrides a lower one
          children:
            - id: command-line-args
              label: Command-line arguments
              note: --server.port=9000; beats every file-based source
            - id: java-system-properties
              label: Java system properties
              note: -Dserver.port=9000; beats env vars
            - id: os-environment-variables
              label: OS environment variables
              note: "SERVER_PORT sets server.port: dots to _, dashes dropped, upper case"
            - id: config-data-files
              label: Config files
              note: Outside the jar beats inside; application-{profile} beats plain
        - id: application-properties-file
          label: application.properties
          note: Flat key=value lines; wins over YAML in the same folder
        - id: application-yaml-file
          label: application.yml
          note: Nested keys; needs SnakeYAML, which spring-boot-starter brings
        - id: property-placeholders
          label: Placeholders ${...}
          note: "${name:default} reads another key; text after : is the fallback"
        - id: config-secrets
          label: Secrets
          note: No built-in encryption; use env vars, config trees or Vault
    - id: configuration-properties
      children:
        - id: value-annotation
          label: "@Value"
          note: "Injects one key into a field or parameter; also runs SpEL #{...}"
        - id: config-properties-class
          label: "@ConfigurationProperties"
          note: Binds every key under a prefix to one typed bean
          children:
            - id: constructor-binding
              label: Constructor binding (records)
              note: "One constructor or a record: immutable; @DefaultValue sets defaults"
            - id: relaxed-binding
              label: Relaxed binding
              note: first-name, firstName and the env var form bind one field
            - id: properties-validation
              label: "@Validated"
              note: Constraints checked at binding; nested objects need @Valid
            - id: properties-registration
              label: "@ConfigurationPropertiesScan"
              note: Registers the classes as beans; or use @EnableConfigurationProperties
        - id: spring-environment
          label: Environment
          note: env.getProperty(key) reads any key in code; null if missing
    - id: profiles
      children:
        - id: active-profiles
          label: spring.profiles.active
          note: Profiles to turn on; a higher source replaces the list
        - id: profile-specific-files
          label: application-{profile}.properties
          note: Always overrides the plain file; last active profile wins
        - id: profile-annotation
          label: "@Profile"
          note: On a @Component, @Configuration or @Bean method; supports !, & and |
        - id: default-profile
          label: Default profile
          note: Named default; on only when no profile is active
        - id: profile-include
          label: spring.profiles.include
          note: Adds profiles instead of replacing them
        - id: profile-groups
          label: Profile groups
          note: "spring.profiles.group.production=proddb,prodmq: one name, many on"
    - id: logging
      children:
        - id: slf4j
          label: SLF4J
          note: The logging API your code calls; the backend behind it can change
        - id: logback
          label: Logback (default)
          note: Used by default when you use the starters
        - id: log-levels
          label: Log levels
          note: TRACE < DEBUG < INFO < WARN < ERROR; a request at or above shows
        - id: logging-level-property
          label: logging.level.<logger>
          note: Sets a level per package; logging.level.root for all
        - id: log-file-output
          label: Log file
          note: Console only until logging.file.name or logging.file.path is set
        - id: logback-spring-xml
          label: logback-spring.xml
          note: Custom setup Boot controls; allows <springProfile>
        - id: debug-mode
          label: --debug
          note: More output from core loggers only, not your code
        - id: structured-logging
          label: Structured logging (JSON)
          note: ECS, GELF or Logstash via logging.structured.format.*
  web:
    - id: dispatcher-servlet
      children:
        - id: front-controller
          label: Front controller pattern
          note: One central servlet runs the shared steps; helper beans do the work
        - id: handler-mapping
          label: HandlerMapping
          note: Maps a request to a handler plus its interceptors
        - id: handler-adapter
          label: HandlerAdapter
          note: Calls the handler, so DispatcherServlet needs no calling details
        - id: http-message-converter
          label: HttpMessageConverter
          note: Reads request bodies and writes response bodies, e.g. JSON
        - id: view-resolver
          label: ViewResolver
          note: Turns a returned view name into a view that renders HTML
        - id: handler-exception-resolver
          label: HandlerExceptionResolver
          note: Turns an exception from a handler into an error response
    - id: rest-controller
      children:
        - id: controller-annotation
          label: "@Controller"
          note: Web controller stereotype; a String return value is a view name
        - id: response-body
          label: "@ResponseBody"
          note: The return value is written to the body by a message converter
        - id: response-entity
          label: ResponseEntity
          note: Like @ResponseBody, plus the status and headers
        - id: response-status
          label: "@ResponseStatus"
          note: Fixes one status for a method or an exception class
        - id: jackson-json
          label: Jackson (JSON)
          note: "Boot 4 prefers Jackson 3: packages moved to tools.jackson"
    - id: request-mapping
      children:
        - id: request-mapping-annotation
          label: "@RequestMapping"
          note: Matches all HTTP methods by default; use it on the class
        - id: shortcut-mappings
          label: "@GetMapping and other shortcuts"
          note: "@GetMapping, @PostMapping, @PutMapping, @DeleteMapping, @PatchMapping"
        - id: path-variable
          label: "@PathVariable"
          note: Binds a {name} segment of the URL path, e.g. /users/{id}
        - id: request-param
          label: "@RequestParam"
          note: Binds a query parameter or form field; required by default
        - id: request-body
          label: "@RequestBody"
          note: Reads the body into an object through a message converter
        - id: request-header
          label: "@RequestHeader"
          note: Binds one HTTP request header, e.g. Authorization
        - id: api-versioning
          label: API versioning (Framework 7)
          note: Map one path to several versions with the version attribute
    - id: dto
      children:
        - id: request-dto
          label: Request DTO
          note: Only the fields a client may send; blocks mass assignment
        - id: response-dto
          label: Response DTO
          note: Only the fields a client should see
        - id: record-dto
          label: Java record as a DTO
          note: Records are transparent carriers for immutable data (Java 16+)
        - id: json-ignore
          label: "@JsonIgnore"
          note: Hides a field from JSON; OWASP advises picking fields instead
        - id: open-in-view
          label: Open EntityManager in View
          note: "On by default in Boot web apps: lazy loading during the request"
    - id: validation
      children:
        - id: validation-starter
          label: spring-boot-starter-validation
          note: Not in the web starters since Boot 2.3; add it yourself
        - id: constraint-annotations
          label: Constraint annotations
          note: Jakarta Validation built-ins in jakarta.validation.constraints
          children:
            - id: not-null-constraint
              label: "@NotNull"
              note: Must not be null; any type
            - id: not-empty-constraint
              label: "@NotEmpty"
              note: "Not null and not empty: string, collection, map or array"
            - id: not-blank-constraint
              label: "@NotBlank"
              note: Not null and at least one non-whitespace character
            - id: size-min-max-constraint
              label: "@Size, @Min, @Max"
              note: Length or number within bounds
            - id: email-pattern-constraint
              label: "@Email, @Pattern"
              note: A well-formed email; matches a regular expression
        - id: valid-annotation
          label: "@Valid"
          note: "Jakarta: validate this object and cascade into nested ones"
        - id: validated-annotation
          label: "@Validated"
          note: "Spring's variant: validation groups and method validation on a class"
        - id: method-argument-not-valid
          label: MethodArgumentNotValidException
          note: "A @Valid @RequestBody failed: 400 Bad Request"
    - id: exception-handling
      children:
        - id: exception-handler-annotation
          label: "@ExceptionHandler"
          note: A method that turns given exception types into a response
        - id: controller-advice
          label: "@ControllerAdvice"
          note: Applies its handlers to all controllers by default
        - id: rest-controller-advice
          label: "@RestControllerAdvice"
          note: "@ControllerAdvice + @ResponseBody: handlers write the body"
        - id: problem-detail
          label: ProblemDetail (RFC 9457)
          note: "Standard error body: type, title, status, detail, instance"
        - id: response-status-exception
          label: ResponseStatusException
          note: Throw it with a status and a reason; no custom class needed
        - id: error-endpoint
          label: /error (BasicErrorController)
          note: "Boot's fallback: JSON for API clients, whitelabel page for browsers"
    - id: rest-api-design
      children:
        - id: crud-http-methods
          label: CRUD to HTTP methods
          note: POST create, GET read, PUT replace, PATCH partial, DELETE remove
        - id: safe-method
          label: Safe method
          note: "Read-only by meaning: GET, HEAD, OPTIONS, TRACE"
        - id: idempotent-method
          label: Idempotent method
          note: "Repeating it has the same effect: PUT, DELETE and safe methods"
        - id: status-code-classes
          label: Status code classes
          note: The first digit gives the class of the response
          children:
            - id: status-2xx
              label: 2xx Success
              note: 200 OK, 201 Created, 204 No Content
            - id: status-4xx
              label: 4xx Client error
              note: 400, 401, 403, 404, 409 Conflict, 422 Unprocessable Content
            - id: status-5xx
              label: 5xx Server error
              note: 500 Internal Server Error, 502 Bad Gateway, 503 Unavailable
        - id: location-header
          label: 201 + Location header
          note: Location names the new resource after a create
        - id: idempotency-key
          label: Idempotency-Key header
          note: Client key that makes a retried POST safe; an IETF draft
    - id: filters-interceptors
      children:
        - id: servlet-filter
          label: Servlet filter
          note: "jakarta.servlet.Filter: runs before and after DispatcherServlet"
          children:
            - id: once-per-request-filter
              label: OncePerRequestFilter
              note: "Spring base class: runs once per request dispatch"
            - id: filter-registration-bean
              label: FilterRegistrationBean
              note: "Boot: sets a filter's order and URL patterns"
        - id: handler-interceptor
          label: HandlerInterceptor
          note: Spring MVC hooks around the chosen handler
          children:
            - id: pre-handle
              label: preHandle
              note: Before the handler; return false to stop the request
            - id: post-handle
              label: postHandle
              note: After the handler; a @ResponseBody response is already written
            - id: after-completion
              label: afterCompletion
              note: After the request is complete; good for cleanup
    - id: http-clients
      children:
        - id: rest-client
          label: RestClient
          note: Synchronous client with a fluent API (Framework 6.1+)
        - id: web-client
          label: WebClient
          note: Non-blocking, reactive client; returns Mono and Flux
        - id: rest-template
          label: RestTemplate
          note: Template-method client; deprecated in Framework 7.0
        - id: http-interface-client
          label: HTTP service client (@HttpExchange)
          note: An annotated interface; Spring generates the client proxy
        - id: openfeign-client
          label: OpenFeign (@FeignClient)
          note: Spring Cloud's interface client; feature-complete
        - id: http-client-timeouts
          label: Timeouts
          note: Set connect and read timeouts, e.g. spring.http.clients.*
    - id: mvc-vs-webflux
      children:
        - id: mvc-servlet-stack
          label: Spring MVC (Servlet stack)
          note: Blocking I/O; a large thread pool absorbs blocking
        - id: webflux-stack
          label: Spring WebFlux (reactive stack)
          note: Non-blocking I/O on a small, fixed number of threads
          children:
            - id: reactor-mono
              label: Mono
              note: Reactor type for 0..1 values
            - id: reactor-flux
              label: Flux
              note: Reactor type for 0..N values
            - id: functional-endpoints
              label: Functional endpoints
              note: Lambda-based routing; an alternative to annotated controllers
        - id: mvc-virtual-threads
          label: MVC on virtual threads
          note: spring.threads.virtual.enabled=true; Java 21+, 24+ advised
        - id: blocking-in-webflux
          label: Blocking call in WebFlux
          note: Stalls an event-loop thread; move it to another thread or use MVC
  data:
    - id: jpa-hibernate-spring-data
      children:
        - id: jpa
          label: JPA (Jakarta Persistence 3.2)
          note: "The standard: annotations, EntityManager, JPQL; no engine"
        - id: hibernate
          label: Hibernate ORM 7.4
          note: The JPA provider in Boot's data-jpa starter
        - id: spring-data-jpa
          label: Spring Data JPA 4.1
          note: Implements repository interfaces at runtime
        - id: spring-data-jdbc
          label: Spring Data JDBC
          note: No lazy loading, no dirty tracking; save() writes
    - id: jpa-entities
      children:
        - id: core-entity-annotations
          label: Core annotations
          children:
            - id: entity-annotation
              label: "@Entity"
              note: Marks a class as an entity; needs an @Id
            - id: id-annotation
              label: "@Id"
              note: The primary key field
            - id: table-annotation
              label: "@Table / @Column"
              note: Override the table or column name
            - id: transient-annotation
              label: "@Transient"
              note: A field that is not stored
            - id: embeddable-annotation
              label: "@Embeddable / @Embedded"
              note: A value object stored in the owner's table
        - id: id-generation
          label: "@GeneratedValue strategies"
          note: "Default strategy: AUTO"
          children:
            - id: generation-auto
              label: AUTO
              note: The provider picks a strategy for the database
            - id: generation-identity
              label: IDENTITY
              note: A database identity (auto-increment) column
            - id: generation-sequence
              label: SEQUENCE
              note: A database sequence gives the next id
            - id: generation-table
              label: TABLE
              note: A helper table hands out unique ids
            - id: generation-uuid
              label: UUID
              note: The provider generates an RFC 4122 UUID
        - id: relationship-annotations
          label: Relationship annotations
          children:
            - id: many-to-one
              label: "@ManyToOne"
              note: Holds the foreign key; EAGER by default
            - id: one-to-many
              label: "@OneToMany"
              note: The parent's collection; LAZY by default
            - id: one-to-one
              label: "@OneToOne"
              note: One row to one row; EAGER by default
            - id: many-to-many
              label: "@ManyToMany"
              note: Through a join table; LAZY by default
        - id: owning-side
          label: Owning side
          note: Its changes are written; the many side in one-to-many
        - id: mapped-by
          label: mappedBy
          note: On the inverse side; names the owner's field
        - id: join-column
          label: "@JoinColumn"
          note: Names the foreign key column on the owning side
        - id: cascade-types
          label: Cascade types
          note: No operation cascades by default
          children:
            - id: cascade-persist
              label: CascadeType.PERSIST
              note: persist() on the parent also persists children
            - id: cascade-merge
              label: CascadeType.MERGE
              note: merge() on the parent also merges children
            - id: cascade-remove
              label: CascadeType.REMOVE
              note: Deleting the parent deletes its children
            - id: cascade-all
              label: CascadeType.ALL
              note: PERSIST, MERGE, REMOVE, REFRESH and DETACH
        - id: orphan-removal
          label: orphanRemoval = true
          note: A child removed from the collection is deleted at flush
    - id: spring-data-repositories
      children:
        - id: repository-interfaces
          label: Repository interfaces
          children:
            - id: repository-marker
              label: Repository
              note: "Marker interface: only the entity and id types"
            - id: crud-repository
              label: CrudRepository
              note: save, findById, findAll, delete; lists as Iterable
            - id: list-crud-repository
              label: ListCrudRepository
              note: The same CRUD methods, returning List
            - id: paging-and-sorting-repository
              label: PagingAndSortingRepository
              note: findAll(Sort), findAll(Pageable); extends only Repository
            - id: jpa-repository
              label: JpaRepository
              note: List CRUD and paging, flush, batch deletes
        - id: repository-query-kinds
          label: Ways to write a query
          children:
            - id: derived-query
              label: Derived query
              note: "findByEmailAndStatus: parsed from the method name"
            - id: query-annotation
              label: "@Query (JPQL)"
              note: Your own JPQL over entities and fields
            - id: native-query
              label: Native query
              note: "Plain SQL: @Query(nativeQuery = true) or @NativeQuery"
        - id: paged-results
          label: Paging and sorting
          children:
            - id: pageable-param
              label: Pageable
              note: PageRequest.of(page, size, sort); page numbers start at 0
            - id: page-result
              label: Page<T>
              note: Rows plus totals; runs an extra count query
            - id: slice-result
              label: Slice<T>
              note: Rows plus 'has next'; no count query
            - id: sort-param
              label: Sort
              note: Sort.by("amount").descending()
        - id: optional-result
          label: Optional<T> results
          note: findById returns Optional; use orElseThrow
    - id: persistence-context
      children:
        - id: entity-states
          label: Entity states
          children:
            - id: entity-state-transient
              label: Transient (new)
              note: Not saved yet; not tracked
            - id: entity-state-managed
              label: Managed
              note: In a persistence context; changes saved at flush
            - id: entity-state-detached
              label: Detached
              note: Has an id but is no longer tracked
            - id: entity-state-removed
              label: Removed
              note: Marked for deletion at flush
        - id: dirty-checking
          label: Dirty checking
          note: Changed managed entities are written at flush
        - id: jpa-flush
          label: Flush
          note: Sends pending changes as SQL; does not commit
          children:
            - id: flush-mode-auto
              label: FlushModeType.AUTO (default)
              note: Flush before queries the changes affect, and at commit
            - id: flush-mode-commit
              label: FlushModeType.COMMIT
              note: Flush at commit; queries may see old data
        - id: first-level-cache
          label: First-level cache
          note: One instance per id inside one persistence context
        - id: second-level-cache
          label: Second-level cache
          note: Shared across contexts; Hibernate needs a provider
        - id: save-persist-or-merge
          label: "save(): persist or merge"
          note: New if the version, else the id, is null
        - id: save-and-flush
          label: saveAndFlush()
          note: save(), then flush at once
    - id: lazy-loading-n-plus-one
      children:
        - id: fetch-types
          label: Fetch types
          children:
            - id: lazy-fetch
              label: LAZY
              note: Load on first access; only a hint
            - id: eager-fetch
              label: EAGER
              note: Load with the owner; a requirement
        - id: n-plus-one-problem
          label: N+1 problem
          note: 1 query for N parents, then 1 per parent
        - id: n-plus-one-fixes
          label: Fixes for N+1
          children:
            - id: join-fetch
              label: JOIN FETCH
              note: Parents and children in one JPQL query
            - id: entity-graph
              label: "@EntityGraph"
              note: Names associations a repository method loads
            - id: batch-fetching
              label: Batch fetching
              note: "hibernate.default_batch_fetch_size: one IN query per batch"
        - id: lazy-initialization-exception
          label: LazyInitializationException
          note: Lazy data read after its persistence context ended
        - id: open-session-in-view
          label: Open Session in View
          note: spring.jpa.open-in-view; on by default in web apps
    - id: locking
      children:
        - id: lost-update
          label: Lost update
          note: Two writers; the second silently overwrites the first
        - id: optimistic-locking
          label: Optimistic locking
          children:
            - id: version-annotation
              label: "@Version"
              note: Checked and incremented on each update
            - id: optimistic-lock-exception
              label: OptimisticLockException
              note: Stale update; the transaction is marked for rollback
        - id: pessimistic-locking
          label: Pessimistic locking
          children:
            - id: pessimistic-write
              label: PESSIMISTIC_WRITE
              note: select ... for update; serialises writers
            - id: pessimistic-read
              label: PESSIMISTIC_READ
              note: A shared lock; other readers are not blocked
        - id: lock-annotation
          label: "@Lock"
          note: Sets the lock mode on a repository query method
    - id: transactional
      children:
        - id: transaction-proxy
          label: Transaction proxy
          note: Boot enables it; it wraps each call in begin and commit or rollback
        - id: platform-transaction-manager
          label: PlatformTransactionManager
          note: Does the real begin, commit and rollback, e.g. JpaTransactionManager
        - id: rollback-rules
          label: Rollback rules
          note: RuntimeException and Error roll back; checked exceptions commit
          children:
            - id: rollback-for
              label: rollbackFor
              note: Extra exception types that roll back, including subclasses
            - id: no-rollback-for
              label: noRollbackFor
              note: Exception types that should still commit
        - id: read-only-tx
          label: readOnly = true
          note: A hint for reads; not a guard against writes
        - id: service-layer-transaction
          label: Service-layer boundary
          note: Start the transaction where the unit of work starts
        - id: transaction-template
          label: TransactionTemplate
          note: "Programmatic option: set the boundary in code"
    - id: transaction-propagation
      children:
        - id: propagation-required
          label: REQUIRED
          note: "Default: join the current transaction, or start one"
          children:
            - id: unexpected-rollback-exception
              label: UnexpectedRollbackException
              note: "Outer commit fails: an inner scope marked it rollback-only"
        - id: propagation-requires-new
          label: REQUIRES_NEW
          note: Suspend the current transaction and start a new one
        - id: propagation-nested
          label: NESTED
          note: Inside the current transaction with a savepoint; else like REQUIRED
          children:
            - id: savepoint
              label: Savepoint
              note: A mark the transaction can roll back to; JDBC savepoints
        - id: propagation-supports
          label: SUPPORTS
          note: Join one if it exists; else run without
        - id: propagation-mandatory
          label: MANDATORY
          note: Join one; throw if none exists
        - id: propagation-not-supported
          label: NOT_SUPPORTED
          note: Run without; suspend the current one
        - id: propagation-never
          label: NEVER
          note: Run without; throw if one exists
    - id: acid-isolation
      children:
        - id: acid-properties
          label: ACID
          note: The four guarantees of a database transaction
          children:
            - id: atomicity
              label: Atomicity
              note: All steps complete, or none do
            - id: consistency-acid
              label: Consistency
              note: Integrity constraints hold when the transaction commits
            - id: isolation-acid
              label: Isolation
              note: Others do not see a transaction's work before it commits
            - id: durability
              label: Durability
              note: A committed change survives a crash
        - id: read-anomalies
          label: Read problems
          note: What one transaction may see of another's work
          children:
            - id: dirty-read
              label: Dirty read
              note: Reading another transaction's uncommitted change
            - id: non-repeatable-read
              label: Non-repeatable read
              note: A re-read row has changed values
            - id: phantom-read
              label: Phantom read
              note: A re-run WHERE query returns a different set of rows
        - id: isolation-levels
          label: Isolation levels
          note: Spring's Isolation enum, weakest to strongest
          children:
            - id: isolation-default
              label: DEFAULT
              note: "Spring's default: use the database's own level"
            - id: read-uncommitted
              label: READ_UNCOMMITTED
              note: Allows dirty, non-repeatable and phantom reads
            - id: read-committed
              label: READ_COMMITTED
              note: Stops dirty reads; PostgreSQL's default
            - id: repeatable-read
              label: REPEATABLE_READ
              note: Also stops non-repeatable reads; MySQL InnoDB's default
            - id: serializable-level
              label: SERIALIZABLE
              note: Stops all three; as if transactions ran one by one
    - id: spring-cache
      children:
        - id: enable-caching
          label: "@EnableCaching"
          note: Turns on caching; Boot then configures a CacheManager
        - id: cacheable-annotation
          label: "@Cacheable"
          note: On a hit, return the stored value and skip the method
        - id: cache-put-annotation
          label: "@CachePut"
          note: Always run the method and store its result
        - id: cache-evict-annotation
          label: "@CacheEvict"
          note: Remove an entry, or all with allEntries = true
        - id: cache-key
          label: Cache key
          note: "Default: the single argument, or a SimpleKey of all"
        - id: cache-providers
          label: Cache providers
          note: Boot uses the first one found; spring.cache.type picks one
          children:
            - id: caffeine-cache-provider
              label: Caffeine
              note: Local, in-memory cache inside each instance
            - id: redis-cache-provider
              label: Redis
              note: Shared cache; TTL via spring.cache.redis.time-to-live
            - id: simple-cache-provider
              label: Simple
              note: Fallback ConcurrentHashMap; not for production
    - id: connection-pool
      children:
        - id: hikaricp
          label: HikariCP
          note: Boot's first choice; comes with the jdbc and data-jpa starters
        - id: maximum-pool-size
          label: maximum-pool-size
          note: "Default 10: idle plus in-use connections"
        - id: hikari-connection-timeout
          label: connection-timeout
          note: Default 30 s wait for a connection, then SQLException
        - id: hikari-max-lifetime
          label: max-lifetime
          note: Default 30 min; keep it below the database's own limit
        - id: leak-detection-threshold
          label: leak-detection-threshold
          note: Off by default; logs connections held too long
        - id: fallback-pools
          label: Other pools
          note: Tomcat JDBC, then DBCP2, then Oracle UCP if HikariCP is absent
    - id: schema-migrations
      children:
        - id: flyway
          label: Flyway
          note: Runs versioned SQL files once each, in version order
          children:
            - id: flyway-versioned-script
              label: V2__name.sql
              note: Version, two underscores, description; in db/migration
            - id: flyway-schema-history
              label: flyway_schema_history
              note: Applied versions with checksums
        - id: liquibase
          label: Liquibase
          note: Applies changesets listed in a changelog
          children:
            - id: liquibase-changelog
              label: Changelog
              note: SQL, XML, YAML or JSON file of changesets
            - id: databasechangelog-table
              label: DATABASECHANGELOG
              note: Table of the changesets already applied
        - id: ddl-auto
          label: ddl-auto
          note: "Hibernate's schema handling: spring.jpa.hibernate.ddl-auto"
          children:
            - id: ddl-auto-none
              label: none
              note: Hibernate leaves the schema alone; default outside embedded DBs
            - id: ddl-auto-validate
              label: validate
              note: Checks the schema against the entities; changes nothing
            - id: ddl-auto-update
              label: update
              note: Adds what is missing and alters wrong column types
            - id: ddl-auto-create-drop
              label: create-drop
              note: Builds the schema at start, drops it at shutdown
        - id: sql-init-scripts
          label: schema.sql and data.sql
          note: Run for embedded in-memory databases only, by default
  security:
    - id: security-filter-chain
      children:
        - id: delegating-filter-proxy
          label: DelegatingFilterProxy
          note: Servlet filter that hands each request to a Spring bean
        - id: filter-chain-proxy
          label: FilterChainProxy
          note: Runs only the first SecurityFilterChain that matches
        - id: built-in-security-filters
          label: Built-in security filters
          note: Run in a fixed order; login filters come before authorization
          children:
            - id: csrf-filter
              label: CsrfFilter
              note: Rejects unsafe requests without a valid CSRF token
            - id: login-filters
              label: Login filters (form, Basic, bearer)
              note: Read credentials from the request and log the user in
            - id: exception-translation-filter
              label: ExceptionTranslationFilter
              note: Turns security errors into a login challenge or access denied
            - id: authorization-filter
              label: AuthorizationFilter
              note: Applies the authorizeHttpRequests rules
        - id: custom-security-filter
          label: addFilterBefore / After / At
          note: Places your own filter next to a built-in one
        - id: boot-security-defaults
          label: Spring Boot defaults
          note: User 'user', random password logged; whole app needs login
        - id: web-security-configurer-adapter
          label: WebSecurityConfigurerAdapter (removed)
          note: Removed in Spring Security 6.0; use a SecurityFilterChain bean
    - id: authentication-flow
      children:
        - id: authentication-manager
          label: AuthenticationManager
          note: The API login filters call; ProviderManager is the usual one
        - id: authentication-provider
          label: AuthenticationProvider
          note: Checks one credential type, e.g. DaoAuthenticationProvider
        - id: user-details-service
          label: UserDetailsService
          note: Loads a user by username for password logins
        - id: security-context-holder
          label: SecurityContextHolder
          note: Holds the current Authentication; ThreadLocal by default
        - id: authentication-entry-point
          label: AuthenticationEntryPoint
          note: "Asks for credentials: login redirect or WWW-Authenticate"
        - id: session-login
          label: Session login (stateful)
          note: SecurityContext saved in the HTTP session by default
        - id: http-401
          label: 401 Unauthorized
          note: No valid credentials; logging in may fix it
        - id: http-403
          label: 403 Forbidden
          note: Logged in but not allowed; logging in again changes nothing
    - id: authorization-rules
      children:
        - id: url-authorization
          label: authorizeHttpRequests
          note: URL rules, checked in order; first match applies
        - id: any-request-rule
          label: anyRequest()
          note: Catch-all rule; denyAll() turns the rules into an allow-list
        - id: method-security
          label: "@EnableMethodSecurity"
          note: Turns on method rules; Boot leaves it off by default
          children:
            - id: pre-authorize
              label: "@PreAuthorize"
              note: Checks a SpEL expression before the method runs
            - id: post-authorize
              label: "@PostAuthorize"
              note: Checks after the method runs
            - id: secured-annotation
              label: "@Secured"
              note: Role names only; needs securedEnabled = true
        - id: has-role
          label: hasRole("X")
          note: "Adds the prefix: checks ROLE_X"
        - id: has-authority
          label: hasAuthority("X")
          note: Checks the exact string X
        - id: role-hierarchy
          label: Role hierarchy
          note: One role includes others, e.g. ADMIN implies USER
    - id: password-encoding
      children:
        - id: delegating-password-encoder
          label: DelegatingPasswordEncoder
          note: Default; stores {id}hash and encodes new ones with bcrypt
        - id: bcrypt-password-encoder
          label: BCryptPasswordEncoder
          note: Strength 10 by default; each +1 doubles the work
        - id: argon2-password-encoder
          label: Argon2PasswordEncoder
          note: Needs a lot of memory; Argon2 won the 2015 hashing contest
        - id: pbkdf2-password-encoder
          label: Pbkdf2PasswordEncoder
          note: A good choice when FIPS certification is required
        - id: noop-password-encoder
          label: NoOpPasswordEncoder ({noop})
          note: Plain text; not secure
        - id: password-salt
          label: Salt
          term: salt
          note: Random per password; defeats precomputed rainbow tables
    - id: jwt-resource-server
      children:
        - id: jwt-structure
          label: header.payload.signature
          note: Three Base64url parts joined by dots
        - id: jws-signed-jwt
          label: JWS (signed JWT)
          term: jws
          note: "Signed or MAC-protected: tamper-proof, but readable"
        - id: jwe-encrypted-jwt
          label: JWE (encrypted JWT)
          term: jwe
          note: Claims are encrypted, so only the receiver reads them
        - id: jwt-claims
          label: Claims
          note: "Registered names: iss, sub, aud, exp, nbf, iat, jti"
        - id: oauth2-resource-server
          label: OAuth2 resource server
          note: "Boot 4 starter: spring-boot-starter-security-oauth2-resource-server"
        - id: authorization-server
          label: Authorization server
          note: Issues tokens; part of Spring Security since 7.0
        - id: jwt-scope-authorities
          label: SCOPE_ authorities
          note: Each token scope becomes the authority SCOPE_<scope>
        - id: stateless-session-policy
          label: SessionCreationPolicy.STATELESS
          note: No HTTP session is used to keep the login
    - id: csrf-cors
      children:
        - id: csrf-protection
          label: CSRF protection
          note: On by default for unsafe methods such as POST
        - id: csrf-token
          label: CSRF token
          note: Kept in the HTTP session by default; sent in a form field or header
        - id: csrf-spa
          label: csrf.spa()
          note: Ready-made CSRF setup for single-page apps, added in 7.0
        - id: cors-support
          label: http.cors()
          note: Runs CORS before Spring Security's login checks
        - id: cors-configuration-source
          label: CorsConfigurationSource bean
          note: Allowed origins, methods and headers per path
        - id: cross-origin-annotation
          label: "@CrossOrigin"
          note: Allows CORS on one Spring MVC controller or method
        - id: preflight-request
          label: Preflight request
          note: OPTIONS call the browser sends before a non-simple request
        - id: same-origin-policy
          label: Same-origin policy
          note: Scripts may only call their own origin unless CORS allows it
  testing-production:
    - id: spring-boot-testing
      children:
        - id: unit-test
          label: Unit test
          note: Plain JUnit and mocks; objects made with new, no Spring
        - id: test-slices
          label: Test slices
          note: Load one layer's beans and a small set of auto-configuration
          children:
            - id: web-mvc-test
              label: "@WebMvcTest"
              note: Controllers, advice, filters and MockMvc; no @Service beans
            - id: data-jpa-test
              label: "@DataJpaTest"
              note: Entities and JPA repositories; each test rolls back
              children:
                - id: embedded-test-database
                  label: Embedded test database (H2)
                  note: Used by @DataJpaTest when one is on the classpath
            - id: data-jdbc-test
              label: "@DataJdbcTest"
              note: Spring Data JDBC repositories, JdbcTemplate and an embedded DB
            - id: json-test
              label: "@JsonTest"
              note: Only the JSON mapping, to check serialisation
            - id: rest-client-test
              label: "@RestClientTest"
              note: Your HTTP client code, against a mock server
        - id: full-context-test
          label: "@SpringBootTest"
          note: Whole context; no server by default, RANDOM_PORT starts one
        - id: mockmvc
          label: MockMvc
          note: Mock requests through the DispatcherServlet; no server
        - id: context-caching
          label: Context caching
          note: Tests with the same configuration reuse one context
    - id: mockito
      children:
        - id: mock-annotation
          label: "@Mock"
          note: Creates a Mockito fake for a field
        - id: inject-mocks
          label: "@InjectMocks"
          note: Builds the class under test with the mocks passed in
        - id: mockito-stub
          label: "Stubbing: when().thenReturn()"
          note: A stubbed call always returns the canned value
        - id: mockito-verify
          label: verify()
          note: Checks that a call happened on the mock
        - id: mockito-spy
          label: Spy
          note: Wraps a real object; real methods run unless stubbed
        - id: mockito-bean
          label: "@MockitoBean and @MockitoSpyBean"
          note: Replace or wrap a bean in the test context; Framework 6.2+
        - id: mock-bean-removed
          label: "@MockBean (removed)"
          note: Deprecated in Boot 3.4, removed in 4.0
    - id: testcontainers
      children:
        - id: service-connection
          label: "@ServiceConnection"
          note: Connection details from the container beat connection properties
        - id: container-beans
          label: Containers as @Bean
          note: Started once per cached context, before other beans
        - id: dynamic-property-source
          label: "@DynamicPropertySource"
          note: "The manual way: add the container URL as a property"
    - id: actuator
      children:
        - id: health-endpoint
          label: /actuator/health
          note: UP gives 200; DOWN or OUT_OF_SERVICE gives 503
          children:
            - id: health-indicator
              label: Health indicators
              note: One check each, such as db, diskspace or ping
            - id: liveness-probe
              label: Liveness probe
              note: "/actuator/health/liveness: must the app restart?"
            - id: readiness-probe
              label: Readiness probe
              note: "/actuator/health/readiness: can it take traffic now?"
        - id: info-endpoint
          label: /actuator/info
          note: Free-form application information
        - id: metrics-endpoint
          label: /actuator/metrics
          note: The app's metrics, by name
        - id: prometheus-endpoint
          label: /actuator/prometheus
          note: Metrics in Prometheus format; needs micrometer-registry-prometheus
        - id: loggers-endpoint
          label: /actuator/loggers
          note: Shows and changes logger levels at run time
        - id: env-endpoint
          label: /actuator/env
          note: Configuration properties, with values masked
        - id: mappings-endpoint
          label: /actuator/mappings
          note: Every @RequestMapping path
    - id: observability
      children:
        - id: metrics-signal
          label: Metrics (Micrometer)
          note: A MeterRegistry per backend found on the classpath
        - id: traces-signal
          label: Traces (Micrometer Tracing)
          note: One trace per request across services, a span per step
          children:
            - id: otel-tracer
              label: OpenTelemetry with OTLP
              note: Added by spring-boot-starter-opentelemetry
            - id: brave-tracer
              label: Brave with Zipkin
              note: Added by spring-boot-starter-zipkin
            - id: trace-sampling-node
              label: Sampling
              note: 10% of requests by default
        - id: logs-signal
          label: Logs with trace IDs
          note: traceId and spanId go into each log line by default
        - id: observation-api
          label: Observation API
          note: One observation gives both a metric and a span
    - id: packaging-deployment
      children:
        - id: executable-jar
          label: Executable jar
          note: Libraries nested in BOOT-INF/lib; run with java -jar
        - id: deployable-war
          label: Deployable war
          note: For an external servlet container; not for WebFlux
        - id: buildpacks-image
          label: Buildpacks image
          note: spring-boot:build-image or bootBuildImage; needs Docker
        - id: native-image
          label: GraalVM native image
          note: A platform-specific executable; no JVM to ship
        - id: spring-aot
          label: Spring AOT processing
          note: Turns bean definitions into code and GraalVM hints at build time
  spring-cloud:
    - id: spring-cloud-overview
      children:
        - id: spring-cloud-release-train
          label: Release train (BOM)
          note: spring-cloud-dependencies; Boot does not manage its version
          children:
            - id: spring-cloud-oakwood
              label: 2025.1.x (Oakwood)
              note: For Spring Boot 4.0.x, and 4.1.x from 2025.1.2
        - id: spring-cloud-stream
          label: Spring Cloud Stream
          note: Event-driven messaging with Kafka or RabbitMQ
        - id: spring-cloud-kubernetes
          label: Spring Cloud Kubernetes
          note: Discovery and config backed by Kubernetes
        - id: spring-cloud-consul
          label: Spring Cloud Consul
          note: Discovery and config with HashiCorp Consul
        - id: removed-netflix-modules
          label: Removed Netflix modules
          note: Removed in Spring Cloud 2020.0; Eureka stays
          children:
            - id: hystrix
              label: Hystrix
              note: Circuit breaker; use Resilience4j instead
            - id: ribbon
              label: Ribbon
              note: Client-side load balancer; use Spring Cloud LoadBalancer
            - id: zuul
              label: Zuul 1
              note: Edge router; use Spring Cloud Gateway
    - id: config-server
      children:
        - id: config-server-app
          label: "@EnableConfigServer"
          note: Turns a Boot app into the server; 8888 is the usual port
        - id: config-git-backend
          label: Git backend
          note: Label = branch, tag or commit; default label main
        - id: config-other-backends
          label: Other backends
          note: File system, Vault, JDBC, Redis, AWS S3 and more
        - id: config-http-api
          label: /{application}/{profile}/{label}
          note: App name, active profile, Git label, e.g. /orders/prod/main
        - id: config-client
          label: Config client (spring.config.import)
          note: "configserver: location; default http://localhost:8888"
          children:
            - id: config-import-optional
              label: "optional: prefix"
              note: Without it, startup fails when the server is unreachable
        - id: refresh-scope
          label: "@RefreshScope"
          note: Lazy proxy; rebuilt on its next call after a refresh
        - id: actuator-refresh
          label: /actuator/refresh
          note: Refreshes one instance; expose it first
        - id: spring-cloud-bus
          label: Spring Cloud Bus (/actuator/busrefresh)
          note: Spreads the refresh to every instance over a broker
    - id: service-discovery-eureka
      children:
        - id: eureka-server
          label: Eureka server (@EnableEurekaServer)
          note: The registry; UI and REST API under /eureka/*
        - id: eureka-client
          label: Eureka client
          note: Starter registers the app; brings Spring Cloud LoadBalancer
        - id: eureka-heartbeat
          label: Heartbeat (lease renewal)
          note: Every 30 s; dropped after 90 s without one
        - id: eureka-registry-fetch
          label: Registry fetch
          note: Clients cache the registry and refetch it every 30 s
        - id: eureka-self-preservation
          label: Self-preservation mode
          note: "Many ungraceful drops at once: the server stops evicting"
        - id: spring-cloud-loadbalancer
          label: Spring Cloud LoadBalancer
          note: "Client-side: picks one instance per call; round robin default"
          children:
            - id: load-balanced-builder
              label: "@LoadBalanced RestClient.Builder"
              note: URIs use a service name, e.g. http://stores/stores
        - id: kubernetes-discovery
          label: Kubernetes Services (DNS)
          note: Call a Service by DNS name; Kubernetes tracks its Pods
    - id: spring-cloud-gateway
      children:
        - id: gateway-route
          label: Route
          note: An id, a destination URI, predicates and filters
        - id: gateway-predicate
          label: Predicate
          note: Matches anything in the request, such as path or headers
        - id: gateway-filter
          label: Gateway filter
          note: Changes the request before or the response after the call
          children:
            - id: request-rate-limiter
              label: RequestRateLimiter (Redis)
              note: Token bucket per key; over the limit returns 429
            - id: gateway-circuit-breaker-filter
              label: CircuitBreaker filter
              note: "Wraps a route in a circuit breaker; fallbackUri forward:"
        - id: lb-uri-scheme
          label: lb:// URI
          note: LoadBalancer resolves the service name; 503 if none found
        - id: gateway-server-webflux
          label: Gateway Server WebFlux
          note: Needs Netty; not in a servlet container or as a war
        - id: gateway-server-webmvc
          label: Gateway Server Web MVC
          note: The same gateway on Spring Web MVC (servlet)
    - id: resilience4j
      children:
        - id: circuit-breaker-annotation
          label: "@CircuitBreaker"
          note: Fails fast while open; CallNotPermittedException
          children:
            - id: cb-closed
              label: Closed state
              note: Calls pass; outcomes recorded in a sliding window
            - id: cb-open
              label: Open state
              note: Calls rejected; after the wait (60 s) goes half-open
            - id: cb-half-open
              label: Half-open state
              note: "10 trial calls decide: close or open again"
        - id: retry-annotation
          label: "@Retry"
          note: 3 attempts in total, 500 ms apart; backoff optional
        - id: bulkhead-annotation
          label: "@Bulkhead"
          note: Caps concurrent calls; 25 by default
        - id: rate-limiter-annotation
          label: "@RateLimiter"
          note: Caps calls per refresh period; 50 per period by default
        - id: fallback-method
          label: fallbackMethod
          note: Same class, same parameters plus one exception
        - id: spring-retryable
          label: "@Retryable (Spring Framework 7)"
          note: Core retry, on with @EnableResilientMethods; no breaker
    - id: spring-kafka
      children:
        - id: kafka-template
          label: KafkaTemplate
          note: send() is async; returns CompletableFuture<SendResult>
        - id: kafka-listener
          label: "@KafkaListener"
          note: Boot builds its container factory from spring.kafka.*
        - id: kafka-partition
          label: Partition
          note: Same key, same partition; order holds within one only
        - id: consumer-group
          label: Consumer group
          note: Each partition goes to one consumer of the group
        - id: kafka-offset
          label: Offset commit (AckMode BATCH)
          note: Committed after all records of a poll are processed
        - id: default-error-handler
          label: DefaultErrorHandler
          note: 10 attempts, no delay, then logs the record
          children:
            - id: dead-letter-topic
              label: Dead-letter topic
              note: DeadLetterPublishingRecoverer sends to <topic>-dlt
        - id: delivery-guarantees
          label: Delivery guarantees
          note: Depend on producer retries and when offsets are committed
          children:
            - id: at-most-once
              label: At most once
              note: May be lost, never redelivered
            - id: at-least-once
              label: At least once (Kafka default)
              note: Never lost, may be redelivered
            - id: exactly-once
              label: Exactly once
              note: Kafka transactions; outside systems need their own support
        - id: idempotent-consumer
          label: Idempotent listener
          note: A repeated message has no extra effect
