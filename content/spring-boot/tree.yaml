topics:
  boot-basics:
    - id: spring-vs-spring-boot
      children:
        - { id: spring-framework, label: "Spring Framework", note: "The core: DI container, web, data access and transactions" }
        - { id: spring-boot-project, label: "Spring Boot", note: "Built on Spring Framework; adds starters, auto-configuration, Actuator" }
        - { id: convention-over-configuration, label: "Convention over configuration", note: "Boot picks sensible defaults; you configure only what differs" }

    - id: starters
      children:
        - id: official-starters
          label: "Official starters (spring-boot-starter-*)"
          note: "One dependency per feature, e.g. spring-boot-starter-data-jpa"
          children:
            - { id: starter-webmvc, label: "spring-boot-starter-webmvc", note: "Spring MVC and Tomcat; replaces the deprecated spring-boot-starter-web" }
            - { id: test-starters, label: "Test starters (-test)", note: "Test support per technology, e.g. spring-boot-starter-webmvc-test" }
            - { id: technical-starters, label: "Technical starters", note: "Swap one part, e.g. spring-boot-starter-log4j2 for logging" }
        - { id: classic-starters, label: "Classic starters", note: "All 4.x modules without their transitive deps; a migration aid" }
        - { id: third-party-starters, label: "Third-party starters", note: "Named acme-spring-boot-starter; must not start with spring-boot" }
        - { id: spring-boot-starter-parent, label: "spring-boot-starter-parent", note: "Maven parent: managed versions, Java 17 level, UTF-8, repackage goal" }
        - { id: spring-boot-dependencies-bom, label: "spring-boot-dependencies (BOM)", note: "The curated version list; import it when you keep another parent" }
        - { id: spring-initializr, label: "Spring Initializr (start.spring.io)", note: "Generates a project with your build tool, versions and starters" }

    - id: spring-boot-application
      children:
        - { id: spring-boot-configuration, label: "@SpringBootConfiguration", note: "The app's @Configuration; only one per app; tests find it" }
        - { id: enable-auto-configuration, label: "@EnableAutoConfiguration", note: "Turns on auto-configuration; declare it only once" }
        - { id: component-scan, label: "@ComponentScan", note: "Scans the main class's package and its sub-packages" }
        - { id: main-class-placement, label: "Main class in the root package", note: "Avoid the default package: then every class in every jar is read" }
        - { id: scan-base-packages, label: "scanBasePackages", note: "Scans other packages; no effect on @Entity or repository scanning" }

    - id: auto-configuration
      children:
        - id: conditional-annotations
          label: "@Conditional annotations"
          note: "Rules that decide whether an auto-configuration or bean applies"
          children:
            - { id: conditional-on-class, label: "@ConditionalOnClass / @ConditionalOnMissingClass", note: "Apply only if a class is (or is not) on the classpath" }
            - { id: conditional-on-bean, label: "@ConditionalOnBean / @ConditionalOnMissingBean", note: "Apply only if a bean exists (or not); this is how Boot backs off" }
            - { id: conditional-on-property, label: "@ConditionalOnProperty", note: "By default, applies if the property exists and is not false" }
            - { id: conditional-on-web-application, label: "@ConditionalOnWebApplication", note: "Apply only in a web app; @ConditionalOnNotWebApplication for the rest" }
            - { id: conditional-on-resource, label: "@ConditionalOnResource", note: "Apply only if a resource, such as a file, exists" }
            - { id: conditional-on-expression, label: "@ConditionalOnExpression", note: "Apply if a SpEL expression is true" }
        - { id: backing-off, label: "Backing off", note: "Define your own bean, and the auto-configured one is not created" }
        - { id: excluding-auto-configuration, label: "Excluding an auto-configuration", note: "exclude or excludeName on the annotation, or spring.autoconfigure.exclude" }
        - { id: condition-evaluation-report, label: "Condition evaluation report", note: "--debug logs what matched and why; or Actuator's /actuator/conditions" }
        - { id: auto-configuration-imports, label: "AutoConfiguration.imports file", note: "Lists auto-configuration classes, one per line; since 2.7" }
        - { id: custom-auto-configuration, label: "Custom auto-configuration", note: "An @AutoConfiguration class with conditions, named in the imports file" }
        - { id: custom-starter, label: "Custom starter", note: "An autoconfigure module plus an empty starter jar that pulls it in" }

    - id: application-startup
      children:
        - id: web-application-type
          label: "Web application type"
          note: "Detected from the classpath; spring.main.web-application-type forces it"
          children:
            - { id: web-application-type-servlet, label: "Servlet", note: "Spring MVC present: a servlet context with an embedded server" }
            - { id: web-application-type-reactive, label: "Reactive", note: "WebFlux but no Spring MVC: a reactive context" }
            - { id: web-application-type-none, label: "None", note: "Neither: a plain context with no web server" }
        - id: application-events
          label: "Application events"
          note: "Sent in a fixed order during run(); some before the context exists"
          children:
            - { id: application-starting-event, label: "ApplicationStartingEvent", note: "First: before any processing except registering listeners" }
            - { id: application-environment-prepared-event, label: "ApplicationEnvironmentPreparedEvent", note: "The Environment is known; the context is not created yet" }
            - { id: application-prepared-event, label: "ApplicationPreparedEvent", note: "Bean definitions are loaded; the refresh has not started" }
            - { id: application-started-event, label: "ApplicationStartedEvent", note: "The context is refreshed; runners not called yet" }
            - { id: application-ready-event, label: "ApplicationReadyEvent", note: "Runners are done; readiness then turns to ACCEPTING_TRAFFIC" }
            - { id: application-failed-event, label: "ApplicationFailedEvent", note: "Startup threw an exception" }
        - id: startup-runners
          label: "Runners"
          note: "Called once, just before run() returns; order them with @Order"
          children:
            - { id: command-line-runner, label: "CommandLineRunner", note: "run(String... args): the raw command-line arguments" }
            - { id: application-runner, label: "ApplicationRunner", note: "run(ApplicationArguments args): parsed --name=value options" }
        - { id: lazy-initialization, label: "Lazy initialisation", note: "Beans are created on first use; off by default" }
        - { id: failure-analyzer, label: "Failure analysers (FailureAnalyzer)", note: "Turn a startup exception into a problem and a suggested fix" }

    - id: embedded-server
      children:
        - { id: embedded-tomcat, label: "Tomcat (default)", note: "Comes with spring-boot-starter-webmvc; Tomcat 11.0 in Boot 4.1" }
        - { id: embedded-jetty, label: "Jetty", note: "Exclude the Tomcat starter, add spring-boot-starter-jetty; Jetty 12.1" }
        - { id: reactor-netty, label: "Reactor Netty", note: "The default server of spring-boot-starter-webflux" }
        - { id: undertow-removed, label: "Undertow (removed in 4.0)", note: "Dropped: it does not yet support the Servlet 6.1 baseline" }
        - { id: server-port, label: "server.port", note: "8080 by default; 0 picks a free port; -1 turns off HTTP" }
        - { id: graceful-shutdown, label: "Graceful shutdown", note: "On by default since 3.4; server.shutdown=immediate turns it off" }

    - id: devtools
      children:
        - id: automatic-restart
          label: "Automatic restart"
          note: "Restarts the app when files on the classpath change"
          children:
            - { id: base-classloader, label: "Base class loader", note: "Holds classes that do not change, such as third-party jars" }
            - { id: restart-classloader, label: "Restart class loader", note: "Holds your project's classes; replaced on every restart" }
            - { id: restart-exclusions, label: "Excluded paths", note: "Changes in /static, /public, /templates and others do not restart" }
            - { id: restart-trigger-file, label: "Trigger file", note: "Restart only when one chosen file changes" }
        - { id: devtools-property-defaults, label: "Development property defaults", note: "Template caching off, error details on; add-properties=false removes them" }
        - { id: livereload, label: "LiveReload (deprecated)", note: "Browser refresh; off by default since 4.0, deprecated in 4.1" }
        - { id: devtools-global-settings, label: "Global settings", note: "Files in $HOME/.config/spring-boot apply to every app on the machine" }
        - { id: remote-devtools, label: "Remote DevTools", note: "Opt-in remote restart; a security risk, never in production" }

  beans-di:
    - id: ioc-container
      children:
        - { id: inversion-of-control, label: "Inversion of control (IoC)", note: "The container, not your code, creates objects and links them" }
        - { id: bean-definition, label: "Bean definition", note: "Recipe for a bean: class, name, scope, dependencies, lazy flag, callbacks" }
        - id: container-metadata
          label: "Configuration metadata (bean sources)"
          note: "Tells the container what to build: annotations, Java config or XML"
          children:
            - { id: annotation-metadata, label: "Annotations (@Component + scanning)", note: "Marked classes are found by component scanning" }
            - { id: java-config-metadata, label: "Java config (@Configuration + @Bean)", note: "Factory methods in a configuration class return the beans" }
            - { id: xml-metadata, label: "XML (<bean/>)", note: "<bean/> elements inside a top-level <beans/> element" }
        - { id: bean-factory, label: "BeanFactory", note: "Root container interface: creates and wires beans; no automatic extras" }
        - { id: application-context, label: "ApplicationContext", note: "Extends BeanFactory: events, i18n messages, AOP, post-processor detection" }
        - { id: lazy-init-bean, label: "Lazy bean (@Lazy)", note: "Created on first use; still made at startup if a non-lazy bean needs it" }

    - id: dependency-injection
      children:
        - { id: autowired-annotation, label: "@Autowired", note: "Marks a constructor, setter or field to be injected by type" }
        - { id: constructor-injection, label: "Constructor injection", note: "Dependencies are constructor arguments; the style Spring recommends" }
        - { id: setter-injection, label: "Setter injection", note: "Setters are called after the no-arg constructor; for optional deps" }
        - { id: field-injection, label: "Field injection", note: "@Autowired on a field, set by reflection after the constructor" }
        - { id: optional-dependency, label: "Optional dependencies", note: "Optional<T>, @Nullable or @Autowired(required = false)" }
        - { id: inject-annotation, label: "@Inject (JSR-330)", note: "Standard jakarta.inject alternative to @Autowired; no required flag" }

    - id: component-vs-bean
      children:
        - id: component-annotation
          label: "@Component (on a class, scanned)"
          note: "Component scanning finds the class; Spring calls its constructor"
          children:
            - { id: service-annotation, label: "@Service", note: "Service-layer marker; treated the same way as @Component" }
            - { id: repository-annotation, label: "@Repository", note: "Data-access marker; adds persistence exception translation" }
            - { id: controller-stereotype, label: "@Controller", note: "Web-layer marker; @RestController is @Controller + @ResponseBody" }
            - { id: configuration-annotation, label: "@Configuration", note: "Meta-annotated with @Component; holds @Bean methods" }
        - id: bean-annotation
          label: "@Bean (on a method, you build it)"
          note: "The method's return value becomes a bean named after the method"
          children:
            - { id: full-configuration-mode, label: "Full mode (@Configuration)", note: "CGLIB subclass: a call to a @Bean method returns the shared bean" }
            - { id: lite-bean-mode, label: "Lite mode (proxyBeanMethods = false)", note: "No subclass: a @Bean-to-@Bean call is plain Java and makes a new object" }
        - { id: bean-registrar, label: "BeanRegistrar (Spring Framework 7)", note: "Registers beans in code with if/for logic; imported with @Import" }

    - id: bean-scopes
      children:
        - id: singleton-scope
          label: "Singleton (default)"
          note: "One shared instance per container and per bean definition"
          children:
            - { id: singleton-thread-safety, label: "Thread safety", note: "All threads share it: keep it stateless or guard state that changes" }
        - id: prototype-scope
          label: "Prototype"
          note: "A new instance each time the bean is requested; no destroy callback"
          children:
            - id: prototype-in-singleton
              label: "Prototype inside a singleton"
              note: "Injected once, so the singleton keeps using one instance"
              children:
                - { id: object-provider, label: "ObjectProvider<T>", note: "getObject() asks the container each time: a fresh prototype" }
                - { id: lookup-method, label: "@Lookup method", note: "Spring overrides the method (CGLIB) to return a new bean per call" }
        - { id: request-scope, label: "Request (@RequestScope)", note: "One instance per HTTP request; web apps only" }
        - { id: session-scope, label: "Session (@SessionScope)", note: "One instance per HTTP session; web apps only" }
        - { id: application-scope, label: "Application (@ApplicationScope)", note: "One instance per ServletContext; web apps only" }
        - { id: websocket-scope, label: "WebSocket (@WebSocketScope)", note: "One instance per WebSocket session (STOMP apps)" }
        - { id: scoped-proxy, label: "Scoped proxy", note: "Forwards each call to the bean of the current request or session" }

    - id: bean-lifecycle
      children:
        - { id: aware-interfaces, label: "Aware interfaces", note: "BeanNameAware, ApplicationContextAware...: after injection, before init" }
        - { id: bean-post-processor, label: "BeanPostProcessor", note: "Hooks before and after every bean's init; may return a wrapper" }
        - id: init-callbacks
          label: "Init callbacks (in this order)"
          note: "Called right after the bean has all its dependencies"
          children:
            - { id: post-construct, label: "@PostConstruct", note: "1st. Jakarta annotation; the recommended choice" }
            - { id: initializing-bean, label: "InitializingBean.afterPropertiesSet()", note: "2nd. Spring interface; couples the class to Spring" }
            - { id: custom-init-method, label: "@Bean(initMethod = \"...\")", note: "3rd. A named method; the class stays free of Spring types" }
        - id: destroy-callbacks
          label: "Destroy callbacks (in this order)"
          note: "Called when the context closes; never for prototype beans"
          children:
            - { id: pre-destroy, label: "@PreDestroy", note: "1st. Jakarta annotation; the recommended choice" }
            - { id: disposable-bean, label: "DisposableBean.destroy()", note: "2nd. Spring interface; couples the class to Spring" }
            - { id: custom-destroy-method, label: "@Bean(destroyMethod = \"...\")", note: "3rd. A named method; a public close() or shutdown() is found by default" }
        - { id: bean-factory-post-processor, label: "BeanFactoryPostProcessor", note: "Edits bean definitions before any regular bean is created" }

    - id: bean-selection
      children:
        - { id: no-unique-bean-definition-exception, label: "NoUniqueBeanDefinitionException", note: "Several beans match one injection point and nothing picks one" }
        - id: qualifier-annotation
          label: "@Qualifier"
          note: "At the injection point: keep only matches with this qualifier or name"
          children:
            - { id: custom-qualifier, label: "Custom qualifier annotation", note: "Your own annotation marked with @Qualifier, such as @Offline" }
        - { id: primary-annotation, label: "@Primary", note: "On a bean: the default pick when several beans match" }
        - { id: fallback-annotation, label: "@Fallback (Spring Framework 6.2+)", note: "On a bean: used only when no regular bean is left" }
        - { id: default-candidate-false, label: "@Bean(defaultCandidate = false) (6.2+)", note: "Skipped for injection by type alone; used only where a qualifier asks" }
        - { id: name-matching, label: "Name match (last resort)", note: "Field or parameter name equals a bean name; needs -parameters" }
        - { id: inject-all-beans, label: "All matches: List, Map, ObjectProvider", note: "List<T> gets every match (sorted by @Order); Map keys are bean names" }
        - { id: resource-annotation, label: "@Resource (by name)", note: "Picks a bean by its unique name; fields and setters only" }

    - id: circular-dependencies
      children:
        - { id: constructor-cycle, label: "Constructor cycle", note: "A and B need each other in constructors: no order can build them" }
        - { id: early-bean-reference, label: "Early reference (three caches)", note: "Plain Spring injects a half-built singleton to break setter cycles" }
        - { id: allow-circular-references, label: "spring.main.allow-circular-references", note: "false since Spring Boot 2.6: any cycle fails at startup" }
        - id: cycle-fixes
          label: "Fixes, best first"
          note: "Break the loop; switch cycles back on only as a last resort"
          children:
            - { id: extract-third-bean, label: "Move shared logic to a third bean", note: "Both beans use the new one; neither needs the other (Spring's advice)" }
            - { id: event-decoupling, label: "Publish an event", note: "A publishes; B handles it with @EventListener; A no longer calls B" }
            - { id: lazy-injection-fix, label: "@Lazy on one dependency", note: "Injects a lazy proxy; the real bean is looked up on first call" }

    - id: aop-proxies
      children:
        - { id: aspect, label: "Aspect", note: "A class with cross-cutting logic: @Aspect plus @Component" }
        - { id: join-point, label: "Join point", note: "A place to add logic; in Spring AOP always a method execution" }
        - { id: pointcut, label: "Pointcut", note: "An expression that picks join points, such as an execution(...) pattern" }
        - id: advice
          label: "Advice"
          note: "The code an aspect runs at the matched join points"
          children:
            - { id: before-advice, label: "@Before", note: "Runs first; cannot stop the call unless it throws" }
            - { id: after-returning-advice, label: "@AfterReturning", note: "Runs after a normal return" }
            - { id: after-throwing-advice, label: "@AfterThrowing", note: "Runs when the method throws" }
            - { id: after-finally-advice, label: "@After (finally)", note: "Runs however the method ends" }
            - { id: around-advice, label: "@Around", note: "Wraps the call; decides if and when proceed() runs" }
        - { id: weaving, label: "Weaving", note: "Linking aspects to beans; Spring AOP does it at runtime with proxies" }
        - { id: jdk-dynamic-proxy, label: "JDK dynamic proxy", note: "Implements the bean's interfaces; only interface methods are advised" }
        - { id: cglib-proxy, label: "CGLIB proxy", note: "A runtime subclass; Spring Boot's default; cannot advise final methods" }
        - id: self-invocation
          label: "Self-invocation"
          note: "this.other() calls the real object, not the proxy, so no advice runs"
          children:
            - { id: move-to-other-bean, label: "Move the method to another bean", note: "The call now goes through that bean's proxy; the docs' preferred fix" }
            - { id: aspectj-weaving, label: "AspectJ weaving", note: "Advice is woven into the bytecode, so self-calls are advised too" }
        - { id: proxyable-annotation, label: "@Proxyable (Spring Framework 7)", note: "Picks JDK or CGLIB for one bean, overriding the global default" }

  configuration:
    - id: externalized-configuration
      children:
        - id: property-sources
          label: "Property sources (highest first)"
          note: "Where values come from; a higher source overrides a lower one"
          children:
            - { id: command-line-args, label: "Command-line arguments", note: "--server.port=9000; always beats file-based sources" }
            - { id: spring-application-json, label: "SPRING_APPLICATION_JSON", note: "A block of properties as JSON in one env var or system property" }
            - { id: java-system-properties, label: "Java system properties", note: "-Dserver.port=9000; read from System.getProperties()" }
            - { id: os-environment-variables, label: "OS environment variables", note: "SERVER_PORT sets server.port: dots to _, dashes dropped, upper case" }
            - { id: config-data-files, label: "Config files (application.*)", note: "Outside the jar beats inside; in each place, profile-specific beats plain" }
            - { id: property-source-annotation, label: "@PropertySource", note: "Added at context refresh: too late for logging.* and spring.main.*" }
            - { id: spring-default-properties, label: "Default properties", note: "Set with SpringApplication.setDefaultProperties; the lowest of all" }
        - { id: config-file-locations, label: "Config file locations", note: "classpath:/, classpath:/config/, ./, ./config/, ./config/*/; later wins" }
        - { id: properties-format, label: "application.properties", note: "Flat key=value lines; wins over YAML in the same folder" }
        - { id: yaml-format, label: "application.yaml", note: "Nested keys; read with SnakeYAML, which spring-boot-starter brings" }
        - id: config-import
          label: "spring.config.import"
          note: "Loads more config; a missing location stops start-up unless optional:"
          children:
            - { id: config-tree, label: "Configuration tree (configtree:)", note: "A folder of files: file name = key, content = value (Kubernetes)" }
        - { id: property-placeholders, label: "Placeholders ${...}", note: "${name:default} reuses another property; text after : is the fallback" }

    - id: configuration-properties
      children:
        - { id: value-annotation, label: "@Value", note: "Injects one property into a field or parameter; also runs SpEL #{...}" }
        - id: config-properties-class
          label: "@ConfigurationProperties"
          note: "Binds every key under a prefix to one typed bean"
          children:
            - { id: javabean-binding, label: "JavaBean binding (setters)", note: "A default constructor plus getters and setters" }
            - { id: constructor-binding, label: "Constructor binding (records)", note: "One constructor or a record: immutable; @DefaultValue sets defaults" }
            - { id: relaxed-binding, label: "Relaxed binding", note: "first-name, firstName, first_name and ..._FIRSTNAME bind one field" }
            - { id: unit-conversion, label: "Duration and DataSize values", note: "30s or 10MB; a bare number means milliseconds or bytes" }
            - { id: properties-validation, label: "Validation (@Validated)", note: "Jakarta constraints checked at binding; nested objects need @Valid" }
            - { id: properties-registration, label: "@ConfigurationPropertiesScan", note: "Registers the classes as beans; or list them in @EnableConfigurationProperties" }
            - { id: third-party-binding, label: "On a @Bean method", note: "Binds a prefix onto an object from a library you cannot annotate" }
            - { id: configuration-metadata, label: "Configuration metadata", note: "spring-boot-configuration-processor generates it at compile time" }

    - id: profiles
      children:
        - { id: active-profiles, label: "spring.profiles.active", note: "Comma-separated profiles to turn on; a higher source replaces the list" }
        - { id: default-profile, label: "Default profile", note: "Named default; on only when no profile is active (spring.profiles.default)" }
        - { id: profile-annotation, label: "@Profile", note: "On a @Component, @Configuration or @Bean method; supports !, & and |" }
        - { id: profile-specific-files, label: "Profile-specific files", note: "application-{profile}.* overrides the plain file in the same location" }
        - id: multi-document-files
          label: "Multi-document files"
          note: "One file split by --- (YAML) or #--- (properties); read top to bottom"
          children:
            - { id: activate-on-profile, label: "spring.config.activate.on-profile", note: "Uses that document only when the profile expression matches" }
        - { id: profile-include, label: "spring.profiles.include", note: "Adds profiles on top of the active ones; they are added first" }
        - { id: profile-groups, label: "Profile groups", note: "spring.profiles.group.production=proddb,prodmq: one name, three on" }

    - id: logging
      children:
        - { id: slf4j, label: "SLF4J (logging API)", note: "The API your code calls; the backend behind it can be swapped" }
        - id: logging-systems
          label: "Logging systems"
          note: "Spring Boot ships default setups for three backends"
          children:
            - { id: logback, label: "Logback (default)", note: "Brought by spring-boot-starter-logging, which every starter includes" }
            - { id: log4j2, label: "Log4j2", note: "Exclude spring-boot-starter-logging; add spring-boot-starter-log4j2" }
            - { id: java-util-logging, label: "Java Util Logging (JUL)", note: "The JDK's built-in logging; configured with logging.properties" }
        - { id: log-levels, label: "Log levels", note: "TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF via logging.level.<name>" }
        - { id: log-groups, label: "Log groups", note: "logging.group.* names many loggers; built-in groups web and sql" }
        - { id: debug-mode, label: "--debug and --trace", note: "More output from core loggers (server, Hibernate, Boot), not all" }
        - id: log-file-output
          label: "File output"
          note: "Console only by default; logging.file.name or logging.file.path adds a file"
          children:
            - { id: log-rotation, label: "Log rotation (Logback)", note: "A new file at 10MB; 7 archives kept by default" }
        - id: logback-spring-xml
          label: "logback-spring.xml"
          note: "Custom Logback setup that Boot fully controls; allows Spring extensions"
          children:
            - { id: spring-profile-tag, label: "<springProfile>", note: "Includes a block only when a profile matches, e.g. name=\"dev | staging\"" }
            - { id: spring-property-tag, label: "<springProperty>", note: "Copies a Spring property into a Logback variable" }
        - { id: structured-logging, label: "Structured logging (JSON)", note: "ECS, GELF or Logstash JSON via logging.structured.format.*; Boot 3.4+" }

  web:
    - id: dispatcher-servlet
      children:
        - { id: front-controller, label: "Front controller pattern", note: "One central servlet runs the shared steps; delegate beans do the work" }
        - id: handler-mapping
          label: "HandlerMapping"
          note: "Maps a request to a handler plus the interceptors that wrap it"
          children:
            - { id: request-mapping-handler-mapping, label: "RequestMappingHandlerMapping", note: "Maps requests to @RequestMapping controller methods" }
            - { id: simple-url-handler-mapping, label: "SimpleUrlHandlerMapping", note: "Explicit URL path patterns registered to handlers" }
        - { id: handler-adapter, label: "HandlerAdapter", note: "Invokes the handler, so DispatcherServlet needs no invocation details" }
        - { id: http-message-converter, label: "HttpMessageConverter", note: "Reads request bodies and writes response bodies, e.g. JSON via Jackson" }
        - { id: view-resolver, label: "ViewResolver", note: "Turns a view name returned by a handler into a View to render" }
        - { id: multipart-resolver, label: "MultipartResolver", note: "Parses multipart requests, such as browser file uploads" }

    - id: rest-controller
      children:
        - { id: controller-annotation, label: "@Controller", note: "Web controller stereotype; a String return value is a view name" }
        - { id: restcontroller-annotation, label: "@RestController", note: "@Controller + @ResponseBody: every method writes to the body" }
        - { id: response-body, label: "@ResponseBody", note: "The return value is written to the body by a message converter" }
        - { id: response-entity, label: "ResponseEntity", note: "A return value that carries the body plus the status and headers" }
        - { id: response-status, label: "@ResponseStatus", note: "Fixes the status for a handler method or an exception class" }
        - { id: content-negotiation, label: "Content negotiation", note: "Picks the response media type; only the Accept header by default" }

    - id: request-mapping
      children:
        - { id: request-mapping-annotation, label: "@RequestMapping", note: "Maps by path, method, params, headers and media types; all methods by default" }
        - { id: shortcut-mappings, label: "@GetMapping and other shortcuts", note: "@GetMapping, @PostMapping, @PutMapping, @DeleteMapping, @PatchMapping" }
        - { id: path-variable, label: "@PathVariable", note: "Binds a {name} segment of the URL path, e.g. /users/{id}" }
        - { id: request-param, label: "@RequestParam", note: "Binds a query parameter or form field; required by default" }
        - { id: request-body, label: "@RequestBody", note: "Reads the body into an object through a message converter" }
        - { id: consumes-produces, label: "consumes and produces", note: "Narrow a mapping by the Content-Type and by the Accept header" }
        - id: api-versioning
          label: "API versioning (Spring Framework 7)"
          note: "Maps one path to several API versions with the version attribute"
          children:
            - { id: fixed-version, label: "Fixed version (\"1.2\")", note: "Matches only that version" }
            - { id: baseline-version, label: "Baseline version (\"1.2+\")", note: "Matches 1.2 and the supported versions above it" }
            - { id: version-header, label: "From a request header", note: "e.g. X-Version; in Boot: spring.mvc.apiversion.use.header" }
            - { id: version-query-param, label: "From a query parameter", note: "In Boot: spring.mvc.apiversion.use.query-parameter" }
            - { id: version-path-segment, label: "From a path segment", note: "The segment at a given index, e.g. v1 in /api/v1/...; a leading v is skipped" }
            - { id: version-media-type, label: "From a media type parameter", note: "A named parameter of the Accept or Content-Type media type" }

    - id: validation
      children:
        - id: jakarta-validation
          label: "Jakarta Validation (Bean Validation)"
          note: "The standard constraint API (3.1); Boot 4.1 uses Hibernate Validator 9.1"
          children:
            - { id: not-null-constraint, label: "@NotNull", note: "Must not be null; accepts any type" }
            - { id: not-empty-constraint, label: "@NotEmpty", note: "Not null and not empty: string, collection, map or array" }
            - { id: not-blank-constraint, label: "@NotBlank", note: "Not null and at least one non-whitespace character" }
            - { id: size-min-max-constraint, label: "@Size, @Min, @Max", note: "Size within bounds; number at least or at most a value; null passes" }
            - { id: email-pattern-constraint, label: "@Email, @Pattern", note: "Well-formed email; matches a regular expression; null passes" }
        - { id: valid-annotation, label: "@Valid", note: "Jakarta: validate this object and cascade into nested ones" }
        - { id: validated-annotation, label: "@Validated", note: "Spring's variant of @Valid that supports validation groups" }
        - { id: validation-groups, label: "Validation groups", note: "Interfaces naming a subset of constraints; ungrouped ones are Default" }
        - { id: method-argument-not-valid, label: "MethodArgumentNotValidException", note: "A @Valid @RequestBody or model attribute failed: 400" }
        - { id: handler-method-validation, label: "HandlerMethodValidationException", note: "Constraints on method parameters failed (Framework 6.1+): 400" }
        - { id: binding-result, label: "BindingResult (Errors)", note: "Declared right after the argument: errors come in, no exception" }

    - id: exception-handling
      children:
        - { id: exception-handler, label: "@ExceptionHandler", note: "A method that handles given exception types and returns the response" }
        - { id: controller-advice, label: "@ControllerAdvice / @RestControllerAdvice", note: "Applies handlers to all controllers; Rest variant adds @ResponseBody" }
        - { id: problem-detail, label: "ProblemDetail (RFC 9457)", note: "Standard error body: type, title, status, detail, instance" }
        - { id: response-entity-exception-handler, label: "ResponseEntityExceptionHandler", note: "Base advice that renders built-in Spring MVC exceptions with a body" }
        - { id: response-status-exception, label: "ResponseStatusException", note: "Throw it with a status and a reason; the reason becomes the detail" }
        - id: handler-exception-resolver
          label: "HandlerExceptionResolver chain"
          note: "Resolvers tried in order; an unresolved exception goes to the container"
          children:
            - { id: exception-handler-resolver, label: "ExceptionHandlerExceptionResolver", note: "1st: calls a matching @ExceptionHandler, local before global" }
            - { id: response-status-resolver, label: "ResponseStatusExceptionResolver", note: "2nd: uses @ResponseStatus or a ResponseStatusException" }
            - { id: default-handler-resolver, label: "DefaultHandlerExceptionResolver", note: "3rd: maps Spring MVC exceptions to codes, e.g. 405, 406, 415" }
        - { id: basic-error-controller, label: "/error (BasicErrorController)", note: "Boot's fallback: JSON for API clients, whitelabel page for browsers" }

    - id: filters-interceptors
      children:
        - id: servlet-filter
          label: "Servlet filter"
          note: "jakarta.servlet.Filter: logic before and after the rest of the chain"
          children:
            - { id: once-per-request-filter, label: "OncePerRequestFilter", note: "Spring base class that runs once per request dispatch" }
            - { id: filter-registration-bean, label: "FilterRegistrationBean", note: "Boot: sets a filter's order, URL patterns and dispatcher types" }
        - id: handler-interceptor
          label: "HandlerInterceptor"
          note: "Spring MVC hooks around a handler, registered via WebMvcConfigurer"
          children:
            - { id: pre-handle, label: "preHandle", note: "Before the handler; return false to stop the chain" }
            - { id: post-handle, label: "postHandle", note: "After the handler; a @ResponseBody response is already written" }
            - { id: after-completion, label: "afterCompletion", note: "After the request, on any outcome, if preHandle returned true" }

    - id: http-clients
      children:
        - { id: rest-client, label: "RestClient", note: "Synchronous client with a fluent API (Spring Framework 6.1+)" }
        - { id: web-client, label: "WebClient", note: "Non-blocking reactive client with a fluent API (Spring Framework 5.0+)" }
        - { id: rest-template, label: "RestTemplate", note: "Classic template API; deprecated in the 7.0 docs, @Deprecated in 7.1" }
        - id: http-interface-client
          label: "HTTP interface client (@HttpExchange)"
          note: "An annotated Java interface; Spring generates the client proxy (6.0+)"
          children:
            - { id: http-service-group, label: "HTTP Service group", note: "Interfaces sharing one client setup, typically one group per host" }
            - { id: import-http-services, label: "@ImportHttpServices", note: "Registers interface clients as beans, listed by type or by package" }
        - { id: client-http-library, label: "Underlying HTTP library", note: "Boot prefers Apache HttpClient, then Jetty, Reactor Netty, the JDK client" }

    - id: mvc-vs-webflux
      children:
        - { id: mvc-servlet-stack, label: "Spring MVC (Servlet stack)", term: spring-mvc, note: "Blocking I/O; a large thread pool absorbs blocking (Tomcat max 200)" }
        - id: webflux-reactive-stack
          label: "Spring WebFlux (reactive stack)"
          term: spring-webflux
          note: "Non-blocking I/O on a small, fixed pool of event-loop threads"
          children:
            - { id: reactor-mono, label: "Mono", note: "Reactor type for 0..1 values" }
            - { id: reactor-flux, label: "Flux", note: "Reactor type for 0..N values" }
            - { id: functional-endpoints, label: "Functional endpoints", note: "Lambda-based routing and handling, an alternative to annotations" }
            - { id: blocking-on-event-loop, label: "Blocking call on an event loop", note: "Bad fit; wrap it with subscribeOn(Schedulers.boundedElastic())" }

    - id: virtual-threads
      children:
        - { id: mvc-on-virtual-threads, label: "Spring MVC on virtual threads", note: "Tomcat and Jetty run each request on a virtual thread" }
        - { id: vt-task-executor, label: "@Async executor", note: "Becomes a SimpleAsyncTaskExecutor that uses virtual threads" }
        - { id: vt-task-scheduler, label: "@Scheduled scheduler", note: "Becomes a SimpleAsyncTaskScheduler that uses virtual threads" }
        - { id: vt-http-clients, label: "JDK HttpClient-based clients", note: "Auto-configured JDK HTTP clients use virtual threads (Boot 4.0+)" }
        - { id: carrier-thread, label: "Carrier thread", note: "The platform thread a virtual thread is mounted on while it runs" }
        - id: virtual-thread-pinning
          label: "Pinning"
          note: "A blocked virtual thread that cannot unmount holds its carrier"
          children:
            - { id: jep-491, label: "JEP 491 (JDK 24)", note: "Blocking inside synchronized no longer pins the carrier" }
            - { id: remaining-pinning, label: "Still pins after JDK 24", note: "Blocking in a class initialiser, or native code calling back into Java" }
        - { id: main-keep-alive, label: "spring.main.keep-alive", note: "Virtual threads are daemon threads; true keeps the JVM alive" }

  data:
    - id: spring-data-repositories
      children:
        - id: repository-interfaces
          label: "Repository interfaces"
          note: "Extend one; Spring Data creates the implementation at runtime"
          children:
            - { id: repository-marker-interface, label: "Repository", note: "Marker interface: no methods, only the entity and id types" }
            - { id: crud-repository, label: "CrudRepository", note: "save, findById, findAll, count, delete, existsById; lists as Iterable" }
            - { id: list-crud-repository, label: "ListCrudRepository", note: "The same CRUD methods, but returns List instead of Iterable" }
            - { id: paging-and-sorting-repository, label: "PagingAndSortingRepository", note: "Only findAll(Sort) and findAll(Pageable); does not extend CrudRepository" }
            - { id: jpa-repository, label: "JpaRepository", note: "List CRUD, paging, query by example, flush and batch deletes" }
            - { id: simple-jpa-repository, label: "SimpleJpaRepository", note: "The class behind the CRUD methods; reads run readOnly" }
        - id: repository-query-kinds
          label: "Ways to write a query"
          children:
            - { id: derived-query, label: "Derived query (method name)", note: "findByEmailAndStatus: the query is parsed from the name after By" }
            - { id: query-annotation, label: "@Query (JPQL)", note: "Your own JPQL on the method; takes precedence over @NamedQuery" }
            - { id: native-query, label: "@NativeQuery (SQL)", note: "Plain SQL; short for @Query(nativeQuery = true)" }
            - { id: modifying-query, label: "@Modifying (update or delete)", note: "Runs a @Query as an update; the EntityManager is not cleared" }
        - id: projections
          label: "Projections"
          note: "Return only some fields instead of whole entities"
          children:
            - { id: interface-projection, label: "Interface projection", note: "Getters for the needed fields; a closed one selects only those" }
            - { id: dto-projection, label: "DTO (record) projection", note: "A record; its constructor parameter names pick the fields" }
            - { id: dynamic-projection, label: "Dynamic projection", note: "A Class<T> parameter lets the caller choose the result type" }
        - id: paged-results
          label: "Paged results"
          note: "Pass a Pageable, such as PageRequest.of(0, 20)"
          children:
            - { id: page-result, label: "Page<T>", note: "Rows plus total count and pages; runs an extra count query" }
            - { id: slice-result, label: "Slice<T>", note: "Rows plus 'has next'; reads size + 1 rows, no count query" }
            - { id: list-result, label: "List<T>", note: "Only the rows of that page; no count query" }

    - id: jpa-entities
      children:
        - id: id-generation
          label: "ID generation (@GeneratedValue)"
          children:
            - { id: generation-auto, label: "AUTO (default)", note: "Hibernate picks SEQUENCE if the database has sequences, else TABLE" }
            - { id: generation-identity, label: "IDENTITY", note: "Auto-increment column; Hibernate cannot batch these inserts" }
            - { id: generation-sequence, label: "SEQUENCE", note: "A database sequence hands out the next id" }
            - { id: generation-table, label: "TABLE", note: "A helper table hands out unique ids" }
            - { id: generation-uuid, label: "UUID", note: "The provider generates a UUID (RFC 4122)" }
        - id: relationship-mappings
          label: "Relationship annotations"
          children:
            - { id: many-to-one, label: "@ManyToOne", note: "The child holds the foreign key; owning side; EAGER by default" }
            - { id: one-to-many, label: "@OneToMany", note: "The parent's collection of children; LAZY by default" }
            - { id: one-to-one, label: "@OneToOne", note: "One row to one row; EAGER by default" }
            - { id: many-to-many, label: "@ManyToMany", note: "A join table links both sides; LAZY by default; either side may own" }
            - { id: owning-side, label: "Owning side", note: "Its changes are written to the database; the many side in one-to-many" }
            - { id: mapped-by, label: "mappedBy", note: "Set on the inverse side; names the owning side's field" }
        - id: cascade-options
          label: "Cascade and orphan removal"
          note: "No operation cascades by default"
          children:
            - { id: cascade-persist, label: "CascadeType.PERSIST", note: "persist() on the parent also persists its new children" }
            - { id: cascade-merge, label: "CascadeType.MERGE", note: "merge() on the parent also merges its children" }
            - { id: cascade-remove, label: "CascadeType.REMOVE", note: "Deleting the parent deletes its children; one-to-one or one-to-many only" }
            - { id: cascade-all, label: "CascadeType.ALL", note: "PERSIST, MERGE, REMOVE, REFRESH and DETACH together" }
            - { id: orphan-removal, label: "orphanRemoval = true", note: "A child removed from the collection is deleted at flush" }
        - id: entity-states
          label: "Entity states"
          children:
            - { id: entity-state-new, label: "New (transient)", note: "Not saved yet; not in any persistence context" }
            - { id: entity-state-managed, label: "Managed (persistent)", note: "In a persistence context; its changes are saved at flush" }
            - { id: entity-state-detached, label: "Detached", note: "Has an id but is no longer tracked, e.g. after the transaction ends" }
            - { id: entity-state-removed, label: "Removed", note: "Marked for delete; the row goes at flush or commit" }
        - id: persistence-context
          label: "Persistence context (first-level cache)"
          note: "One managed instance per id; by default it lives for one transaction"
          children:
            - { id: dirty-checking, label: "Dirty checking", note: "Changed managed entities are written at flush; no save() call needed" }
            - { id: jpa-flush, label: "Flush", note: "Sends pending changes as SQL; AUTO mode: before queries and at commit" }

    - id: lazy-loading-n-plus-one
      children:
        - id: fetch-types
          label: "Fetch types (FetchType)"
          children:
            - { id: lazy-fetch, label: "LAZY", note: "Load on first access; default for collections; only a hint" }
            - { id: eager-fetch, label: "EAGER", note: "Load with the owner; default for @ManyToOne and @OneToOne" }
        - { id: n-plus-one-problem, label: "N+1 selects problem", note: "1 query for N parents, then 1 more query per parent" }
        - { id: lazy-initialization-exception, label: "LazyInitializationException", note: "Unloaded data touched after the persistence context closed" }
        - { id: open-session-in-view, label: "Open Session in View (open-in-view)", note: "The EntityManager stays open for the whole web request; on by default" }
        - id: n-plus-one-fixes
          label: "Fixes for N+1"
          children:
            - { id: join-fetch, label: "JOIN FETCH (JPQL)", note: "Loads the parents and their children in one query" }
            - { id: entity-graph, label: "@EntityGraph", note: "Names the associations one repository method loads eagerly" }
            - { id: batch-fetching, label: "Batch fetching (@BatchSize)", note: "Loads lazy data for many parents with one IN query" }

    - id: transactional
      children:
        - id: tx-attributes
          label: "Main attributes"
          children:
            - { id: rollback-rules, label: "rollbackFor / noRollbackFor", note: "Default: roll back on RuntimeException and Error, commit on checked" }
            - { id: read-only-tx, label: "readOnly = true", note: "A hint; with Hibernate the flush mode is MANUAL, so no dirty checks" }
            - { id: tx-timeout, label: "timeout", note: "In seconds; defaults to the transaction system's own timeout" }
            - { id: tx-manager-qualifier, label: "transactionManager", note: "Picks one of several transaction managers by name or qualifier" }
        - id: tx-silently-ignored
          label: "When it silently does nothing"
          children:
            - { id: tx-self-invocation, label: "Self-invocation (this.method())", note: "The call never passes the proxy, so no transaction starts" }
            - { id: tx-private-final-method, label: "Private or final method", note: "A CGLIB proxy cannot override it, so it is never advised" }
            - { id: tx-not-a-bean, label: "Object made with new", note: "Spring does not manage it, so there is no proxy around it" }
            - { id: tx-exception-caught, label: "Exception caught inside", note: "The proxy never sees it, so the transaction commits" }
            - { id: tx-checked-exception, label: "Checked exception thrown", note: "Commits by default; add rollbackFor = Exception.class" }
        - id: tx-styles
          label: "Ways to manage transactions"
          children:
            - { id: declarative-tx, label: "Declarative (@Transactional)", note: "A proxy begins, commits or rolls back around the method" }
            - { id: programmatic-tx, label: "Programmatic (TransactionTemplate)", note: "Runs a callback in a transaction; setRollbackOnly() rolls back" }
            - { id: transactional-event-listener, label: "@TransactionalEventListener", note: "Runs a listener after the commit by default (AFTER_COMMIT)" }

    - id: transaction-propagation
      children:
        - id: propagation-types
          label: "Propagation types"
          children:
            - id: propagation-required
              label: "REQUIRED (default)"
              note: "Join the current transaction, or start one if there is none"
              children:
                - { id: unexpected-rollback-exception, label: "UnexpectedRollbackException", note: "An inner scope set rollback-only, then the outer one tried to commit" }
            - { id: propagation-requires-new, label: "REQUIRES_NEW", note: "Suspend the current one; run in a new, independent transaction" }
            - { id: propagation-nested, label: "NESTED", note: "A savepoint inside the current one; DataSourceTransactionManager only" }
            - { id: propagation-supports, label: "SUPPORTS", note: "Join if a transaction exists; otherwise run without one" }
            - { id: propagation-mandatory, label: "MANDATORY", note: "Join the current transaction; throw if there is none" }
            - { id: propagation-not-supported, label: "NOT_SUPPORTED", note: "Suspend the current transaction; run without one" }
            - { id: propagation-never, label: "NEVER", note: "Run without a transaction; throw if one exists" }
        - id: isolation-levels
          label: "Isolation levels"
          children:
            - { id: isolation-default, label: "DEFAULT", note: "The database's level: PostgreSQL READ COMMITTED, InnoDB REPEATABLE READ" }
            - { id: isolation-read-uncommitted, label: "READ_UNCOMMITTED", note: "Allows dirty, non-repeatable and phantom reads" }
            - { id: isolation-read-committed, label: "READ_COMMITTED", note: "Stops dirty reads only" }
            - { id: isolation-repeatable-read, label: "REPEATABLE_READ", note: "Stops dirty and non-repeatable reads; phantoms can occur" }
            - { id: isolation-serializable, label: "SERIALIZABLE", note: "Stops all three read problems" }
        - id: read-phenomena
          label: "Read problems"
          children:
            - { id: dirty-read, label: "Dirty read", note: "Reading another transaction's change before it commits" }
            - { id: non-repeatable-read, label: "Non-repeatable read", note: "Re-reading a row gives a new value: another transaction changed it" }
            - { id: phantom-read, label: "Phantom read", note: "Re-running a query returns a row another transaction inserted" }
        - id: jpa-locking
          label: "Locking for concurrent updates"
          children:
            - { id: optimistic-locking, label: "Optimistic locking (@Version)", note: "A version column; a stale update fails with OptimisticLockException" }
            - { id: pessimistic-locking, label: "Pessimistic locking (@Lock)", note: "A database lock, e.g. PESSIMISTIC_WRITE, serialises updates" }

    - id: connection-pool
      children:
        - id: hikari-settings
          label: "Key HikariCP settings (7.x defaults)"
          children:
            - { id: maximum-pool-size, label: "maximumPoolSize", note: "Most connections, idle plus in use; default 10" }
            - { id: minimum-idle, label: "minimumIdle", note: "Defaults to maximumPoolSize: a fixed-size pool, as recommended" }
            - { id: connection-timeout, label: "connectionTimeout", note: "How long a caller waits for a connection; default 30 s" }
            - { id: idle-timeout, label: "idleTimeout", note: "Retires idle connections after 10 min; only if minimumIdle < max" }
            - { id: max-lifetime, label: "maxLifetime", note: "Replaces each connection after 30 min; set it below DB time limits" }
            - { id: keepalive-time, label: "keepaliveTime", note: "Keeps idle connections alive every 2 min so they are not timed out" }
            - { id: leak-detection-threshold, label: "leakDetectionThreshold", note: "Logs a connection held longer than this; 0 (off) by default" }
        - id: pool-implementations
          label: "Pools Boot picks, in order"
          children:
            - { id: hikaricp, label: "HikariCP", note: "Always chosen when present; comes with the jdbc and data-jpa starters" }
            - { id: tomcat-jdbc-pool, label: "Tomcat JDBC pool", note: "Used when HikariCP is not on the classpath" }
            - { id: dbcp2-pool, label: "Commons DBCP2", note: "Third choice, when neither of the first two is present" }
            - { id: oracle-ucp-pool, label: "Oracle UCP", note: "Last choice" }
        - id: pool-sizing
          label: "Pool sizing"
          children:
            - { id: pool-size-formula, label: "Cores x 2 + spindles", note: "HikariCP's starting point: 4 cores and 1 disk give 9" }
            - { id: pool-deadlock, label: "Pool deadlock", note: "Every thread waits for a 2nd connection; size = Tn x (Cm - 1) + 1" }

    - id: schema-migrations
      children:
        - id: ddl-auto-values
          label: "spring.jpa.hibernate.ddl-auto values"
          children:
            - { id: ddl-auto-none, label: "none", note: "Do nothing; the default unless the DB is embedded and has no migration tool" }
            - { id: ddl-auto-validate, label: "validate", note: "Check the tables against the entities; change nothing" }
            - { id: ddl-auto-update, label: "update", note: "Add what is missing and alter wrong column types; no history" }
            - { id: ddl-auto-create, label: "create", note: "Drop and recreate the schema at startup" }
            - { id: ddl-auto-create-drop, label: "create-drop", note: "Like create, plus a drop at shutdown; embedded-DB default with no Flyway" }
        - { id: sql-init-scripts, label: "schema.sql and data.sql", note: "Plain scripts; run by default only for embedded databases" }
        - id: flyway
          label: "Flyway"
          children:
            - { id: flyway-versioned-migration, label: "Versioned (V1__init.sql)", note: "Applied once each, in version order" }
            - { id: flyway-repeatable-migration, label: "Repeatable (R__views.sql)", note: "Re-applied when its checksum changes; always after versioned ones" }
            - { id: flyway-undo-migration, label: "Undo (U1__init.sql)", note: "Reverses one versioned migration; Flyway Teams edition" }
            - { id: flyway-schema-history, label: "flyway_schema_history table", note: "Applied migrations and their checksums; an edited file fails migrate" }
        - id: liquibase
          label: "Liquibase"
          children:
            - { id: liquibase-changelog, label: "Changelog", note: "An ordered list of changesets in SQL, XML, YAML or JSON" }
            - { id: liquibase-changeset, label: "Changeset", note: "One unit of change, identified by id, author and file" }
            - { id: databasechangelog-table, label: "DATABASECHANGELOG table", note: "Records which changesets have already run" }
            - { id: databasechangeloglock-table, label: "DATABASECHANGELOGLOCK table", note: "Lets only one Liquibase instance run at a time" }

    - id: spring-cache
      children:
        - id: cache-annotations
          label: "Cache annotations"
          children:
            - { id: cacheable-annotation, label: "@Cacheable", note: "Hit: return the cached value and skip the method. Miss: run and store" }
            - { id: cache-put-annotation, label: "@CachePut", note: "Always runs the method and stores the result" }
            - { id: cache-evict-annotation, label: "@CacheEvict", note: "Removes one entry, or allEntries; after the method by default" }
            - { id: caching-annotation, label: "@Caching", note: "Groups several cache annotations on one method" }
            - { id: cache-config-annotation, label: "@CacheConfig", note: "Class-level shared settings such as cache names; caches nothing itself" }
        - id: cache-options
          label: "Keys and options"
          children:
            - { id: default-cache-key, label: "Default key", note: "No args: SimpleKey.EMPTY; one: that arg; more: a SimpleKey of all" }
            - { id: spel-cache-key, label: "key = \"#id\"", note: "A SpEL expression over the parameters builds the key" }
            - { id: cache-condition-unless, label: "condition / unless", note: "condition is checked before the call; unless after it, on #result" }
            - { id: cache-sync, label: "sync = true", note: "One thread computes a missing value; the others wait" }
        - id: cache-providers
          label: "Providers Boot looks for, in order"
          children:
            - { id: generic-cache-provider, label: "Generic", note: "Used when the context defines at least one Cache bean" }
            - { id: jcache-provider, label: "JCache (JSR-107)", note: "Used when a CachingProvider is on the classpath, e.g. Ehcache 3" }
            - { id: hazelcast-cache-provider, label: "Hazelcast", note: "Wraps an auto-configured HazelcastInstance" }
            - { id: infinispan-cache-provider, label: "Infinispan", note: "Needs its configuration file set explicitly" }
            - { id: couchbase-cache-provider, label: "Couchbase", note: "When Spring Data Couchbase is present and configured" }
            - { id: redis-cache-provider, label: "Redis", note: "When Redis is configured; TTL via spring.cache.redis.time-to-live" }
            - { id: caffeine-cache-provider, label: "Caffeine", note: "Local cache; size and expiry via spring.cache.caffeine.spec" }
            - { id: cache2k-provider, label: "Cache2k", note: "When the Cache2k Spring integration is present" }
            - { id: simple-cache-provider, label: "Simple (ConcurrentHashMap)", note: "The fallback; no expiry; not recommended for production" }

  security:
    - id: security-filter-chain
      children:
        - { id: delegating-filter-proxy, label: "DelegatingFilterProxy", note: "A servlet filter that hands each request to a Spring bean, looked up lazily" }
        - { id: filter-chain-proxy, label: "FilterChainProxy", note: "The springSecurityFilterChain bean; runs the first matching SecurityFilterChain" }
        - id: built-in-security-filters
          label: "Built-in security filters (in order)"
          note: "Each feature you switch on adds its filter at a fixed position"
          children:
            - { id: security-context-holder-filter, label: "SecurityContextHolderFilter", note: "Loads the saved SecurityContext, by default from the HTTP session" }
            - { id: header-writer-filter, label: "HeaderWriterFilter", note: "Adds protective headers such as X-Frame-Options and X-Content-Type-Options" }
            - { id: cors-filter, label: "CorsFilter", note: "Handles CORS before any login check, so preflight requests get through" }
            - { id: csrf-filter, label: "CsrfFilter", note: "Rejects unsafe requests, such as POST, that lack a valid CSRF token" }
            - { id: logout-filter, label: "LogoutFilter", note: "On POST /logout: ends the session and clears the SecurityContext" }
            - { id: login-filters, label: "Login filters (form, bearer token, Basic)", note: "Read the credentials from the request and log the user in" }
            - { id: anonymous-authentication-filter, label: "AnonymousAuthenticationFilter", note: "Nobody logged in yet? It stores an anonymous Authentication" }
            - { id: exception-translation-filter, label: "ExceptionTranslationFilter", note: "Turns security exceptions into a login challenge or an access-denied reply" }
            - { id: authorization-filter, label: "AuthorizationFilter", note: "Runs late: applies the authorizeHttpRequests rules" }
        - { id: multiple-filter-chains, label: "Several chains (securityMatcher + @Order)", note: "Each chain covers some URLs; one without securityMatcher matches all" }
        - { id: custom-security-filter, label: "Custom filter (addFilterBefore / After / At)", note: "Places your filter relative to the position of a built-in filter" }
        - id: boot-security-defaults
          label: "Spring Boot defaults"
          note: "Active until you define your own SecurityFilterChain bean"
          children:
            - { id: default-user, label: "Default user", note: "Name user; a random password is logged at WARN on startup" }
            - { id: default-security-chain, label: "Default chain", note: "Every request needs login; form login and HTTP Basic are both on" }
        - { id: web-security-configurer-adapter, label: "WebSecurityConfigurerAdapter (removed)", note: "Deprecated in 5.7, removed in Spring Security 6.0; use SecurityFilterChain" }

    - id: authentication-flow
      children:
        - id: authentication-manager
          label: "AuthenticationManager"
          note: "The API login filters call: credentials in, authenticated user out"
          children:
            - { id: provider-manager, label: "ProviderManager", note: "The usual AuthenticationManager: tries each AuthenticationProvider in turn" }
        - id: authentication-provider
          label: "AuthenticationProvider"
          note: "Checks one kind of credential, or lets the next provider decide"
          children:
            - { id: dao-authentication-provider, label: "DaoAuthenticationProvider", note: "Username and password: loads the user, then checks the password" }
            - { id: jwt-authentication-provider, label: "JwtAuthenticationProvider", note: "Bearer JWT: decodes and validates the token" }
        - id: user-details-service
          label: "UserDetailsService"
          note: "loadUserByUsername returns UserDetails or throws UsernameNotFoundException"
          children:
            - { id: in-memory-user-details-manager, label: "InMemoryUserDetailsManager", note: "Users kept in memory; Boot's default user lives in one" }
            - { id: jdbc-user-details-manager, label: "JdbcUserDetailsManager", note: "Users and authorities read from database tables over JDBC" }
        - id: security-context-holder
          label: "SecurityContextHolder"
          note: "Holds the current user's SecurityContext; ThreadLocal by default"
          children:
            - { id: authentication-object, label: "Authentication", note: "Principal (who), credentials (proof) and authorities (what is allowed)" }
            - { id: granted-authority, label: "GrantedAuthority", note: "One permission string, such as ROLE_ADMIN or SCOPE_read" }
        - id: login-mechanisms
          label: "Ways to log in"
          note: "Each is a filter that builds an Authentication and calls the manager"
          children:
            - { id: form-login, label: "Form login", note: "POST /login with username and password parameters" }
            - { id: http-basic, label: "HTTP Basic", note: "Base64 user:password in the Authorization header of every request" }
        - { id: authentication-entry-point, label: "AuthenticationEntryPoint", note: "Asks for credentials: a redirect to the login page or WWW-Authenticate" }
        - id: session-authentication
          label: "Session login (stateful)"
          note: "After login the SecurityContext is saved in the HTTP session"
          children:
            - { id: session-fixation-protection, label: "Session fixation protection", note: "The session id changes on login (changeSessionId on Servlet 3.1+)" }
            - { id: stateless-session-policy, label: "Stateless (SessionCreationPolicy.STATELESS)", note: "No session is used to keep the login; credentials come every time" }

    - id: password-encoding
      children:
        - { id: delegating-password-encoder, label: "DelegatingPasswordEncoder", note: "Default: stores {id}hash, checks known ids, encodes new ones with bcrypt" }
        - { id: bcrypt-password-encoder, label: "BCryptPasswordEncoder", note: "Strength 10 by default; each +1 doubles the work; allowed 4 to 31" }
        - { id: argon2-password-encoder, label: "Argon2PasswordEncoder", note: "Won the Password Hashing Competition; needs a lot of memory" }
        - { id: scrypt-password-encoder, label: "SCryptPasswordEncoder", note: "Deliberately slow and needs a lot of memory" }
        - { id: pbkdf2-password-encoder, label: "Pbkdf2PasswordEncoder", note: "A good choice when FIPS certification is required" }
        - { id: noop-password-encoder, label: "NoOpPasswordEncoder ({noop})", note: "Keeps plain text; not secure; for demos only" }
        - { id: compromised-password-checker, label: "CompromisedPasswordChecker", note: "Rejects breached passwords, e.g. via Have I Been Pwned (Security 6.3+)" }

    - id: jwt-resource-server
      children:
        - id: jwt-parts
          label: "JWT parts"
          note: "header.payload.signature, each part Base64url-encoded"
          children:
            - { id: jwt-claims, label: "Registered claims", note: "iss issuer, sub subject, aud audience, exp expiry, nbf, iat, jti" }
        - id: jwt-checks
          label: "What the resource server checks"
          note: "On every request, before the controller runs"
          children:
            - { id: jwt-signature-check, label: "Signature", note: "Public key from the issuer's JWK Set; only RS256 is trusted by default" }
            - { id: jwt-time-check, label: "exp and nbf", note: "The token must be inside its time window; 60 s clock skew allowed" }
            - { id: jwt-issuer-check, label: "iss (issuer)", note: "Must match the configured issuer" }
            - { id: jwt-audience-check, label: "aud (audience)", note: "Checked only when spring.security.oauth2.resourceserver.jwt.audiences is set" }
        - { id: jwt-scope-authorities, label: "Scopes to authorities (SCOPE_)", note: "Each scope in the token becomes the authority SCOPE_<scope>" }
        - id: oauth2-roles
          label: "OAuth2 roles in Spring"
          note: "Spring Security covers all three; Boot 4 has a starter for each"
          children:
            - { id: oauth2-resource-server, label: "Resource server", note: "Your API: serves requests that carry a valid access token" }
            - { id: oauth2-login, label: "OAuth2 client and login (oauth2Login)", note: "Your app gets tokens or logs users in, e.g. Log in with GitHub" }
            - { id: authorization-server, label: "Authorization server", note: "Issues the tokens; part of Spring Security since 7.0" }
        - { id: opaque-token, label: "Opaque token (introspection)", note: "Not parsed by the API: each check calls the issuer's introspection endpoint" }

    - id: authorization-rules
      children:
        - id: url-authorization
          label: "URL rules (authorizeHttpRequests)"
          note: "Rules are checked in order; only the first matching rule applies"
          children:
            - { id: permit-all, label: "permitAll()", note: "Anyone may call it; unlike ignoring(), the request still goes through the chain" }
            - { id: authenticated-rule, label: "authenticated()", note: "Any logged-in user" }
            - { id: has-role, label: "hasRole()", note: "Adds the ROLE_ prefix: hasRole(\"ADMIN\") needs ROLE_ADMIN" }
            - { id: has-authority, label: "hasAuthority()", note: "Exact name, no prefix, e.g. hasAuthority(\"SCOPE_read\")" }
            - { id: deny-all, label: "denyAll()", note: "Nobody; a safe last rule for an allow-list setup" }
        - id: method-security
          label: "Method security (@EnableMethodSecurity)"
          note: "Off by default in Boot; checks rules when a bean method is called"
          children:
            - { id: pre-authorize, label: "@PreAuthorize", note: "SpEL check before the method runs" }
            - { id: post-authorize, label: "@PostAuthorize", note: "SpEL check on the result, available as returnObject" }
            - { id: pre-post-filter, label: "@PreFilter / @PostFilter", note: "Removes items from a collection argument or result (filterObject)" }
            - { id: secured-annotation, label: "@Secured (legacy)", note: "Lists roles, no SpEL; needs securedEnabled = true" }
            - { id: roles-allowed, label: "@RolesAllowed (JSR-250)", note: "Standard JSR-250 annotation; needs jsr250Enabled = true" }
        - { id: role-hierarchy, label: "Role hierarchy", note: "ADMIN implies STAFF implies USER, so each user needs fewer roles" }
        - { id: authorization-manager, label: "AuthorizationManager", note: "Makes each allow or deny decision; the old voter API is legacy in 7.0" }

    - id: csrf-cors
      children:
        - id: csrf-protection
          label: "CSRF protection"
          note: "On by default: unsafe methods such as POST need a valid CSRF token"
          children:
            - { id: http-session-csrf-token-repository, label: "HttpSessionCsrfTokenRepository (default)", note: "Keeps the expected token in the HTTP session" }
            - { id: cookie-csrf-token-repository, label: "CookieCsrfTokenRepository", note: "XSRF-TOKEN cookie; the page sends it back as the X-XSRF-TOKEN header" }
            - { id: csrf-spa, label: "csrf.spa() (Spring Security 7.0+)", note: "Ready-made CSRF setup for single-page apps" }
            - { id: samesite-cookie, label: "SameSite cookie", note: "The browser skips the cookie on cross-site requests; defence in depth" }
            - { id: csrf-disable, label: "Disabling CSRF", note: "Only when no browser sends cookies or Basic credentials to the app" }
        - id: cors-support
          label: "CORS support"
          note: "Lets a page from another origin read your responses"
          children:
            - { id: preflight-request, label: "Preflight request (OPTIONS)", note: "The browser asks first for a non-simple request; it carries no cookies" }
            - { id: cors-configuration-source, label: "CorsConfigurationSource bean", note: "Allowed origins, methods and headers per path; used by http.cors()" }
            - { id: cross-origin-annotation, label: "@CrossOrigin", note: "Per controller: all origins and a 30-minute max age by default" }
            - { id: cors-credentials, label: "Credentials and origins", note: "With allowCredentials, list the origins; \"*\" is not allowed" }

  testing-production:
    - id: spring-boot-testing
      children:
        - id: full-context-test
          label: "@SpringBootTest (full context)"
          note: "Starts the whole app through SpringApplication"
          children:
            - { id: mock-web-env, label: "MOCK (default)", note: "A mock web environment; no embedded server starts" }
            - { id: random-port-test, label: "RANDOM_PORT", note: "A real embedded server on a random port; inject it with @LocalServerPort" }
            - { id: defined-port-test, label: "DEFINED_PORT", note: "A real embedded server on server.port, or 8080" }
            - { id: none-web-env, label: "NONE", note: "A plain ApplicationContext with no web environment" }
        - id: test-slices
          label: "Test slices"
          note: "Load only one layer's beans and auto-configuration"
          children:
            - { id: web-mvc-test, label: "@WebMvcTest", note: "Controllers, advice, filters, interceptors and MockMvc; no @Service beans" }
            - { id: web-flux-test, label: "@WebFluxTest", note: "WebFlux controllers with WebTestClient; no server" }
            - id: data-jpa-test
              label: "@DataJpaTest"
              note: "Entities and JPA repositories; each test rolls back"
              children:
                - { id: embedded-test-database, label: "Embedded test database (H2)", note: "Used if one is on the classpath; fast, nothing to install" }
            - { id: jdbc-test, label: "@JdbcTest", note: "A DataSource and JdbcTemplate only; each test rolls back" }
            - { id: data-mongo-test, label: "@DataMongoTest", note: "MongoTemplate, @Document classes and Mongo repositories" }
            - { id: json-test, label: "@JsonTest", note: "The JSON mapper and JacksonTester, to check serialisation" }
            - { id: rest-client-test, label: "@RestClientTest", note: "RestClient.Builder with MockRestServiceServer, for client code" }
        - { id: mockmvc, label: "MockMvc and MockMvcTester", note: "Call the DispatcherServlet with mock requests; no server" }
        - { id: rest-test-client, label: "RestTestClient", note: "A fluent test client, on MockMvc or on a running server" }
        - { id: mockito-bean, label: "@MockitoBean and @MockitoSpyBean", note: "Replace a bean with a Mockito mock, or wrap it in a spy" }
        - { id: test-configuration, label: "@TestConfiguration", note: "Extra beans for tests, added to the app's configuration" }
        - { id: context-caching, label: "Context caching", note: "Same configuration, same context: up to 32 kept, least recently used dropped" }

    - id: testcontainers
      children:
        - { id: container-junit-extension, label: "@Testcontainers and @Container", note: "JUnit starts static container fields once per test class" }
        - { id: container-beans, label: "Containers as @Bean", note: "Started before all other beans, stopped after them" }
        - id: service-connection
          label: "@ServiceConnection"
          note: "Creates ConnectionDetails beans that win over connection properties"
          children:
            - { id: connection-details, label: "ConnectionDetails", note: "Where and how to connect, e.g. JdbcConnectionDetails" }
        - { id: dynamic-property-source, label: "@DynamicPropertySource", note: "A static method adds container URLs as properties; more manual" }
        - { id: import-testcontainers, label: "@ImportTestcontainers", note: "Reuse static container fields declared in an interface" }
        - id: dev-time-services
          label: "Development-time services"
          note: "Real services while you run the app locally; off when deployed"
          children:
            - { id: docker-compose-support, label: "Docker Compose support", note: "docker compose up at start, stop at shutdown; skipped in tests" }
            - { id: testcontainers-dev-time, label: "Testcontainers at development time", note: "A test main: SpringApplication.from(App::main).with(Containers.class)" }
            - { id: restart-scope, label: "@RestartScope", note: "Keeps a container bean alive across DevTools restarts" }

    - id: actuator
      children:
        - id: health-endpoint
          label: "/actuator/health"
          note: "UP or DOWN from health indicators; DOWN answers HTTP 503"
          children:
            - { id: health-indicator, label: "Health indicators", note: "One check each, e.g. db, diskspace, ping, ssl" }
            - { id: health-group, label: "Health groups", note: "A named set of indicators at /actuator/health/<group>" }
            - { id: liveness-probe, label: "Liveness probe", note: "/actuator/health/liveness: can the app work, or must it restart?" }
            - { id: readiness-probe, label: "Readiness probe", note: "/actuator/health/readiness: can it take traffic right now?" }
        - { id: info-endpoint, label: "/actuator/info", note: "App info: build and git details by default; env, java, os on request" }
        - { id: metrics-endpoint, label: "/actuator/metrics", note: "Lists meters; drill down, e.g. /actuator/metrics/jvm.memory.max" }
        - { id: prometheus-endpoint, label: "/actuator/prometheus", note: "Metrics in Prometheus format; needs micrometer-registry-prometheus" }
        - { id: env-endpoint, label: "/actuator/env and /configprops", note: "Properties and @ConfigurationProperties; values masked by default" }
        - { id: loggers-endpoint, label: "/actuator/loggers", note: "Read and change log levels while the app runs" }
        - { id: beans-endpoint, label: "/actuator/beans", note: "Every bean in the ApplicationContext" }
        - { id: conditions-endpoint, label: "/actuator/conditions", note: "Which auto-configuration conditions matched, and why" }
        - { id: mappings-endpoint, label: "/actuator/mappings", note: "Every @RequestMapping path" }
        - { id: heapdump-endpoint, label: "/actuator/heapdump", note: "Downloads a heap dump; access is none by default since Boot 3.5" }
        - { id: shutdown-endpoint, label: "/actuator/shutdown", note: "Shuts the app down gracefully; disabled by default" }

    - id: observability
      children:
        - id: micrometer-metrics
          label: "Metrics (Micrometer)"
          note: "Meters, each a name plus tags, held in a MeterRegistry"
          children:
            - { id: meter-counter, label: "Counter", note: "A count that only goes up, e.g. orders placed" }
            - { id: meter-gauge, label: "Gauge", note: "The current value, e.g. queue size or running threads" }
            - { id: meter-timer, label: "Timer", note: "Count and total time of short events, e.g. request latency" }
            - { id: prometheus-scraping, label: "Prometheus (pull)", note: "Prometheus scrapes /actuator/prometheus on each instance" }
        - id: observation-api
          label: "Observation API"
          note: "Instrument code once; handlers turn it into timers and spans"
          children:
            - { id: observed-annotation, label: "@Observed", note: "Needs management.observations.annotations.enabled=true and AspectJ" }
            - { id: tag-cardinality, label: "Low and high cardinality tags", note: "Low (method): metrics and traces; high (user id): traces only" }
        - id: micrometer-tracing
          label: "Tracing (Micrometer Tracing)"
          note: "A trace is a tree of spans; a span is one unit of work"
          children:
            - { id: trace-sampling, label: "Sampling", note: "Boot keeps 10% of traces by default" }
            - { id: trace-propagation, label: "Propagation", note: "Trace headers go out only through auto-configured client builders" }
            - { id: log-correlation, label: "Trace IDs in logs", note: "traceId and spanId are added to log lines by default" }
            - { id: otel-otlp, label: "OpenTelemetry (OTLP)", note: "spring-boot-starter-opentelemetry exports traces over OTLP" }
            - { id: brave-zipkin, label: "Brave and Zipkin", note: "spring-boot-starter-zipkin sends traces to a Zipkin server" }

    - id: packaging-deployment
      children:
        - id: executable-jar
          label: "Executable jar (fat jar)"
          note: "App classes, dependency jars and a loader; run with java -jar"
          children:
            - { id: boot-inf-layout, label: "BOOT-INF/classes and BOOT-INF/lib", note: "Your classes, and dependency jars nested unchanged" }
            - { id: jar-launcher, label: "JarLauncher (Main-Class)", note: "Loads the nested jars, then calls the main method of Start-Class" }
            - { id: extracted-jar, label: "Extracted jar (jarmode tools)", note: "java -Djarmode=tools -jar app.jar extract: faster start" }
        - { id: deployable-war, label: "Deployable war", note: "Extends SpringBootServletInitializer; embedded server marked provided" }
        - id: layered-jar
          label: "Layered jar"
          note: "layers.idx orders the content so image layers can be cached"
          children:
            - { id: layer-dependencies, label: "dependencies", note: "Released libraries: change least, so they come first" }
            - { id: layer-spring-boot-loader, label: "spring-boot-loader", note: "The loader classes under org/springframework/boot/loader" }
            - { id: layer-snapshot-dependencies, label: "snapshot-dependencies", note: "Libraries whose version contains SNAPSHOT" }
            - { id: layer-application, label: "application", note: "Your classes and resources: change most, so they come last" }
        - id: container-image
          label: "Container image"
          note: "A Docker-compatible OCI image of the app that runs anywhere"
          children:
            - { id: buildpacks-image, label: "Buildpacks (build-image)", note: "mvn spring-boot:build-image or gradle bootBuildImage; needs Docker" }
            - { id: dockerfile-image, label: "Dockerfile", note: "Extract the layers, then COPY each one in its own step" }
        - id: jvm-startup-caches
          label: "Faster JVM startup"
          note: "A training run records classes; later runs start faster"
          children:
            - { id: aot-cache, label: "AOT cache (Java 25+)", note: "-XX:AOTCacheOutput in training, -XX:AOTCache at run time" }
            - { id: class-data-sharing, label: "CDS (Class Data Sharing)", note: "The older archive for Java before 25: -XX:SharedArchiveFile" }

    - id: native-images
      children:
        - id: spring-aot-processing
          label: "Spring AOT processing"
          note: "At build time, turns bean setup into Java code and hint files"
          children:
            - { id: aot-generated-code, label: "Generated bean definitions", note: "Code such as MyConfiguration__BeanDefinitions replaces reflection" }
            - { id: aot-proxies, label: "Build-time proxies", note: "CGLIB proxy classes are generated during the build" }
            - { id: runtime-hints, label: "Runtime hints", note: "Tell GraalVM about reflection, resources, serialisation, proxies" }
            - { id: aot-on-jvm, label: "AOT on the JVM", note: "java -Dspring.aot.enabled=true runs the generated code on a JVM" }
        - id: closed-world-assumption
          label: "Closed-world assumption"
          note: "Only code reachable at build time is in the binary"
          children:
            - { id: native-bean-limits, label: "Beans fixed at build time", note: "@Profile and @ConditionalOnProperty cannot change beans later" }
        - { id: reachability-metadata, label: "GraalVM Reachability Metadata", note: "Shared hints for third-party libraries; Spring relies on it" }
        - { id: graalvm-tracing-agent, label: "Native image tracing agent", note: "Run on the JVM to record missing reflection and resource hints" }
        - { id: native-buildpacks, label: "Native via buildpacks", note: "mvn -Pnative spring-boot:build-image: a native container image" }
        - { id: native-build-tools, label: "Native Build Tools", note: "mvn -Pnative native:compile: a local executable; needs GraalVM" }

    - id: async-scheduling
      children:
        - id: async-annotation
          label: "@Async"
          note: "Runs the method on another thread; the caller does not wait"
          children:
            - { id: async-return-types, label: "void or CompletableFuture", note: "void: exceptions are only logged; Future: thrown from get()" }
            - { id: application-task-executor, label: "applicationTaskExecutor", note: "Boot's executor: 8 core threads, unbounded queue (Boot 4.1)" }
            - { id: async-exception-handler, label: "AsyncUncaughtExceptionHandler", note: "Handles exceptions thrown by void @Async methods" }
        - id: scheduled-annotation
          label: "@Scheduled"
          note: "Runs a no-argument method on a timer; needs @EnableScheduling"
          children:
            - { id: fixed-rate, label: "fixedRate", note: "Period counted between start times" }
            - { id: fixed-delay, label: "fixedDelay", note: "Delay counted from the end of the previous run" }
            - { id: cron-schedule, label: "cron", note: "Six fields, seconds first, e.g. 0 0 9 * * MON-FRI" }
            - { id: initial-delay, label: "initialDelay", note: "Wait before the first run; used alone, it runs once" }
            - { id: scheduler-single-thread, label: "One scheduler thread", note: "Boot's scheduler has 1 thread by default, so jobs wait in line" }
            - { id: scheduled-cluster-lock, label: "Clusters and ShedLock", note: "Every instance runs the job; a shared lock runs it once at a time" }

  spring-cloud:
    - id: spring-cloud-overview
      children:
        - id: spring-cloud-release-train
          label: "Release train (BOM)"
          note: "spring-cloud-dependencies: one set of project versions tested together"
          children:
            - { id: spring-cloud-calver, label: "Calendar versions (YYYY.MINOR.MICRO)", note: "Used since 2020.0; London Tube station codenames, e.g. Oakwood" }
            - { id: spring-cloud-oakwood, label: "2025.1.x (Oakwood)", note: "For Spring Boot 4.0.x, and for 4.1.x from 2025.1.2" }
        - { id: spring-cloud-commons, label: "Spring Cloud Commons", note: "Shared APIs: DiscoveryClient, LoadBalancer, circuit breaker" }
        - { id: spring-cloud-stream, label: "Spring Cloud Stream", note: "Event-driven microservices; binders for Kafka, RabbitMQ, Pulsar and more" }
        - { id: spring-cloud-kubernetes, label: "Spring Cloud Kubernetes", note: "DiscoveryClient and configuration backed by Kubernetes" }
        - { id: spring-cloud-consul, label: "Spring Cloud Consul", note: "Service discovery and configuration with HashiCorp Consul" }
        - { id: spring-cloud-zookeeper, label: "Spring Cloud Zookeeper", note: "Service discovery and configuration with Apache ZooKeeper" }
        - { id: spring-cloud-contract, label: "Spring Cloud Contract", note: "Contract tests: generated producer tests, WireMock stubs for consumers" }
        - id: removed-netflix-modules
          label: "Removed Netflix modules"
          note: "Maintenance mode announced in 2018, removed in 2020.0; Eureka stays"
          children:
            - { id: hystrix, label: "Hystrix", note: "Netflix circuit breaker; the suggested replacement is Resilience4j" }
            - { id: ribbon, label: "Ribbon", note: "Netflix client-side load balancer; replaced by Spring Cloud LoadBalancer" }
            - { id: zuul, label: "Zuul 1", note: "Netflix edge router; replaced by Spring Cloud Gateway" }

    - id: config-server
      children:
        - id: config-server-app
          label: "Config Server (@EnableConfigServer)"
          note: "Serves config over HTTP; port 8080 unless set, 8888 by convention"
          children:
            - { id: config-git-backend, label: "Git backend", note: "Label = branch, tag or commit; default label main, then master" }
            - { id: config-other-backends, label: "Other backends", note: "File system, Vault, JDBC, Redis, AWS S3, MongoDB and more" }
            - { id: config-http-api, label: "HTTP API", note: "/{application}/{profile}[/{label}], e.g. /orders/prod/main" }
            - { id: config-cipher-values, label: "Encrypted values ({cipher})", note: "Stored encrypted in Git; the server decrypts them before sending" }
        - id: config-client
          label: "Config client"
          note: "spring-cloud-starter-config and spring.config.import=configserver:"
          children:
            - { id: config-import-optional, label: "optional: prefix", note: "Without it, the app fails to start when the server is unreachable" }
            - { id: legacy-bootstrap, label: "bootstrap.yml (legacy)", note: "Off by default since 2020.0; spring.config.import replaces it" }
        - id: config-refresh
          label: "Refresh at runtime"
          note: "Clients do not poll by default; something must trigger a refresh"
          children:
            - { id: refresh-scope, label: "@RefreshScope", note: "Lazy proxy: the bean is rebuilt on its next call after a refresh" }
            - { id: configuration-properties-rebind, label: "@ConfigurationProperties rebind", note: "Rebound on refresh without @RefreshScope; records cannot be" }
            - { id: actuator-refresh, label: "/actuator/refresh", note: "POST; refreshes one instance; expose it, only health is exposed by default" }
            - { id: spring-cloud-bus, label: "Spring Cloud Bus (/actuator/busrefresh)", note: "Spreads the refresh to all instances over RabbitMQ or Kafka" }
            - { id: config-monitor, label: "Git webhook (/monitor)", note: "spring-cloud-config-monitor: a Git push triggers a bus refresh" }

    - id: service-discovery-eureka
      children:
        - { id: eureka-server, label: "Eureka server (registry)", note: "@EnableEurekaServer; a UI and REST API under /eureka/*" }
        - id: eureka-client
          label: "Eureka client"
          note: "Registers on startup; its starter brings Spring Cloud LoadBalancer"
          children:
            - { id: eureka-heartbeat, label: "Heartbeat (lease renewal)", note: "Every 30 s; the server drops an instance after 90 s without one" }
            - { id: eureka-registry-fetch, label: "Registry fetch (local cache)", note: "Every 30 s; changes can take up to 2 minutes to reach all clients" }
        - { id: eureka-self-preservation, label: "Self-preservation mode", note: "Renewals below the threshold (0.85): the server stops evicting" }
        - { id: eureka-peer-replication, label: "Peer replication", note: "Several servers register with each other and sync registrations" }
        - id: spring-cloud-loadbalancer
          label: "Spring Cloud LoadBalancer"
          note: "Client-side: picks one instance of a service id for each call"
          children:
            - { id: round-robin-loadbalancer, label: "Round robin (default)", note: "RoundRobinLoadBalancer takes the instances in turn" }
            - { id: random-loadbalancer, label: "Random", note: "RandomLoadBalancer, switched on with a custom configuration" }
            - { id: zone-preference-loadbalancer, label: "Zone preference", note: "Prefers instances in the caller's zone; falls back to all" }
            - { id: load-balanced-builder, label: "@LoadBalanced RestClient.Builder", note: "URIs use a service name, e.g. http://stores/stores" }
        - { id: kubernetes-discovery, label: "Kubernetes-native discovery", note: "Call a Kubernetes Service by DNS name; Kubernetes tracks the Pods" }

    - id: spring-cloud-gateway
      children:
        - { id: gateway-route, label: "Route", note: "An id, a destination URI, predicates and filters" }
        - { id: gateway-predicate, label: "Predicate", note: "Matches the request: Path, Host, Method, Header, Query, After and more" }
        - id: gateway-filter
          label: "Gateway filter"
          note: "Changes the request before, or the response after, the proxied call"
          children:
            - { id: global-filter, label: "Global filter", note: "Runs on every route; a route filter runs on its own route only" }
            - { id: request-rate-limiter, label: "RequestRateLimiter (Redis)", note: "Token bucket kept in Redis; over the limit it returns 429" }
            - { id: gateway-circuit-breaker-filter, label: "CircuitBreaker filter", note: "Wraps a route with Resilience4j; fallbackUri forward:/..." }
        - { id: lb-uri-scheme, label: "lb:// URIs", note: "Resolve a service id with Spring Cloud LoadBalancer; 503 if none found" }
        - { id: gateway-server-webflux, label: "Gateway Server WebFlux", note: "Reactive, on Netty; does not work in a servlet container or as a war" }
        - { id: gateway-server-webmvc, label: "Gateway Server Web MVC", note: "Servlet runtimes such as Tomcat and Jetty; built on WebMvc.fn" }

    - id: openfeign
      children:
        - { id: feign-client-annotation, label: "@FeignClient interface", note: "Spring MVC annotations; the name is also the service id" }
        - { id: enable-feign-clients, label: "@EnableFeignClients", note: "Scans packages for @FeignClient interfaces" }
        - { id: feign-client-config, label: "Per-client settings", note: "spring.cloud.openfeign.client.config.<name>: timeouts, logger, retryer" }
        - { id: feign-fallback, label: "fallback / fallbackFactory", note: "Needs spring.cloud.openfeign.circuitbreaker.enabled=true" }
        - { id: cloud-http-service-clients, label: "HTTP Service Clients (@HttpExchange)", note: "Spring's own interface clients; load-balanced since Spring Cloud 2025.1" }

    - id: resilience4j
      children:
        - id: resilience4j-annotations
          label: "Resilience4j annotations"
          note: "resilience4j-spring-boot4 (2.4.0); settings under resilience4j.*"
          children:
            - { id: circuit-breaker-annotation, label: "@CircuitBreaker", note: "Default: opens at 50% failures over the last 100 calls, for 60 s" }
            - { id: retry-annotation, label: "@Retry", note: "Default: 3 attempts in total, 500 ms apart" }
            - { id: rate-limiter-annotation, label: "@RateLimiter", note: "Caps calls per period; waits up to 5 s for a permit by default" }
            - { id: bulkhead-annotation, label: "@Bulkhead", note: "Caps concurrent calls: semaphore of 25 by default, or a thread pool" }
            - { id: time-limiter-annotation, label: "@TimeLimiter", note: "Times out a CompletableFuture or Future call; 1 s by default" }
            - { id: fallback-method, label: "fallbackMethod", note: "Same class, same parameters plus one exception parameter" }
        - { id: spring-cloud-circuit-breaker, label: "Spring Cloud Circuit Breaker", note: "One CircuitBreakerFactory API over Resilience4j, Spring Retry and more" }
        - id: spring-framework-resilience
          label: "Spring Framework 7 resilience"
          note: "In the core since 7.0; switch on with @EnableResilientMethods"
          children:
            - { id: retryable-annotation, label: "@Retryable", note: "Default: up to 3 retries after the first failure, 1 s apart" }
            - { id: concurrency-limit-annotation, label: "@ConcurrencyLimit", note: "Caps concurrent calls of a method; a limit of 1 works like a lock" }
            - { id: retry-template, label: "RetryTemplate and RetryPolicy", note: "Programmatic retry with the same policy options" }

    - id: spring-kafka
      children:
        - { id: kafka-template, label: "KafkaTemplate", note: "Sends records; send() returns a CompletableFuture<SendResult>" }
        - id: kafka-listener
          label: "@KafkaListener"
          note: "Receives records; Boot auto-configures its container factory"
          children:
            - { id: consumer-group, label: "Consumer group", note: "Each partition goes to exactly one consumer in the group" }
            - { id: listener-concurrency, label: "concurrency", note: "One consumer per thread; more than the partition count sit idle" }
            - { id: ack-mode, label: "AckMode (offset commits)", note: "Default BATCH: commit once the records of a poll are processed" }
        - id: kafka-error-handling
          label: "Error handling"
          note: "A failing record is retried, then given to a recoverer"
          children:
            - { id: default-error-handler, label: "DefaultErrorHandler", note: "Default: 10 attempts with no delay, then it logs the record" }
            - { id: dead-letter-topic, label: "Dead-letter topic (DLT)", note: "DeadLetterPublishingRecoverer sends to <topic>-dlt, same partition" }
            - { id: retryable-topic, label: "@RetryableTopic (non-blocking)", note: "Retries through separate retry topics; not for batch listeners" }
        - { id: kafka-json-serde, label: "JSON (JacksonJsonSerializer)", note: "Jackson 3 classes since Spring Kafka 4.0; set trusted packages" }
        - id: delivery-guarantees
          label: "Delivery guarantees"
          note: "Depend on producer retries and on when offsets are committed"
          children:
            - { id: at-most-once, label: "At most once", note: "Commit before processing: a crash can lose messages, none repeat" }
            - { id: at-least-once, label: "At least once (Kafka default)", note: "Commit after processing: nothing lost, but a record may repeat" }
            - { id: exactly-once, label: "Exactly once (Kafka transactions)", note: "Read-process-write in one transaction; Kafka writes only" }
            - { id: idempotent-consumer, label: "Idempotent listener", note: "Records processed message ids, so a repeat has no extra effect" }
