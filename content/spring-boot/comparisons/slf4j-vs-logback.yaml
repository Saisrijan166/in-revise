id: slf4j-vs-logback
tech: spring-boot
title: SLF4J vs Logback
compares: [slf4j, logback]
gist:
  - "The logging API your code calls"
  - "The library behind it that writes the log lines"
diagrams:
  - |
    flowchart LR
      C[Your code] -- "log.info(...)" --> S[SLF4J API]
  - |
    flowchart LR
      S[SLF4J API] --> L[Logback] --> A[Console and file appenders]
diagramAlt: "SLF4J: your code calls log.info on the SLF4J API. Logback: the SLF4J API hands the event to Logback, whose appenders write it to the console and to files."
rows:
  - { aspect: "What it is", a: "A facade: one API over many logging libraries", b: "An implementation (backend)" }
  - { aspect: "In your code", a: "import org.slf4j.Logger; LoggerFactory.getLogger(...)", b: "Usually only in config: logback-spring.xml" }
  - { aspect: "Writes logs", a: "No: hands each call to the backend on the classpath", b: "Yes: appenders write to the console, files and more" }
  - { aspect: "Swap it", a: "Code stays the same", b: "Replace with Log4j2 by changing starters" }
  - { aspect: "In Spring Boot 4.1.1", a: "SLF4J 2.0 (jul-to-slf4j 2.0.18 in the starter)", b: "logback-classic 1.5.38, the default backend" }
verdict: "Write code against SLF4J and let Spring Boot pick and configure the backend: Logback by default, Log4j2 if you swap starters."
sources:
  - { title: "SLF4J user manual", url: "https://www.slf4j.org/manual.html", verifiedOn: "2026-10-17" }
  - { title: "Appenders (Logback manual)", url: "https://logback.qos.ch/manual/appenders.html", verifiedOn: "2026-10-17" }
  - { title: "Logging (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/logging.html", verifiedOn: "2026-10-17" }
  - { title: "spring-boot-starter-logging 4.1.1 POM (Maven Central)", url: "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-starter-logging/4.1.1/spring-boot-starter-logging-4.1.1.pom", verifiedOn: "2026-10-17" }
  - { title: "spring-boot-starter-log4j2 4.1.1 POM (Maven Central)", url: "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-starter-log4j2/4.1.1/spring-boot-starter-log4j2-4.1.1.pom", verifiedOn: "2026-10-17" }
