id: constructor-vs-setter-vs-field-injection
tech: spring-boot
title: Constructor vs Setter vs Field Injection
compares: [constructor-injection, setter-injection, field-injection]
gist:
  - "Dependencies are constructor arguments"
  - "Spring calls setters after building the object"
  - "Spring sets @Autowired fields by reflection"
explain:
  - "Constructor injection: the class lists its dependencies as constructor parameters, and Spring passes the beans when it creates the object. The object is complete from its first moment."
  - "Setter injection: Spring first creates the object, then calls a setter method marked @Autowired to pass a dependency. It suits optional dependencies that have a sensible default."
  - "Field injection: you put @Autowired on a field, and Spring fills the field by reflection after creating the object. It is short to write but hides what the class needs."
example: "PaymentService cannot work without PaymentRepository, so it takes it in the constructor. An optional AuditLogger with a do-nothing default could come through a setter. With field injection, a unit test that calls new PaymentService() gets a null repository and fails with a NullPointerException."
rows:
  - { aspect: "Fields can be final", a: "Yes", b: "No", c: "No" }
  - { aspect: "Object without its dependencies", a: "Impossible: it is built complete", b: "Possible until the setters run", c: "Possible: new X() leaves the fields null" }
  - { aspect: "Plain unit test", a: "Call new X(fake)", b: "Call new X(), then the setters", c: "Needs reflection or Spring" }
  - { aspect: "Use for", a: "Required dependencies", b: "Optional ones with a default", c: "Avoid in application code" }
verdict: "Constructor injection for required dependencies, setters for optional ones; avoid field injection."
sayIt: "I use constructor injection for required dependencies: fields can be final, the object is never half-built, and a test just calls the constructor. Setter injection only for optional ones. I avoid field injection, because it hides dependencies and needs Spring or reflection in tests."
sources:
