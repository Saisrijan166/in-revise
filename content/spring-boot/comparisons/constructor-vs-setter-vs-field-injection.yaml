id: constructor-vs-setter-vs-field-injection
tech: spring-boot
title: Constructor vs Setter vs Field Injection
compares: [constructor-injection, setter-injection, field-injection]
gist:
  - "Dependencies are constructor arguments"
  - "Spring calls setters after building the object"
  - "Spring sets @Autowired fields by reflection"
rows:
  - { aspect: "Fields can be final", a: "Yes", b: "No", c: "No" }
  - { aspect: "Object without its dependencies", a: "Impossible: built complete", b: "Possible until setters run", c: "Possible: new X() leaves nulls" }
  - { aspect: "Plain unit test", a: "new X(mock)", b: "Call the setters", c: "Needs reflection or Spring" }
  - { aspect: "Use for", a: "Required dependencies", b: "Optional ones with a default", c: "Avoid in application code" }
verdict: "Constructor injection for required dependencies, setters for optional ones; avoid field injection."
