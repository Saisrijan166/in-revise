id: constructor-vs-setter-vs-field-injection
tech: spring-boot
title: Constructor vs Setter vs Field Injection
compares: [constructor-injection, setter-injection, field-injection]
gist:
  - "Dependencies are constructor arguments; fields can be final"
  - "Spring calls setters after the object is built"
  - "Spring sets annotated fields by reflection"
rows:
  - { aspect: "Fields can be final", a: "Yes", b: "No", c: "No" }
  - { aspect: "Object can exist without its dependencies", a: "No: it is built complete", b: "Yes, until the setters run", c: "Yes: new X() leaves the fields null" }
  - { aspect: "Plain unit test", a: "new X(mock): no Spring needed", b: "Call the setters yourself", c: "Needs reflection or a Spring context" }
  - { aspect: "Too many dependencies", a: "A long constructor makes it obvious", b: "Hidden among the setters", c: "Hidden among the fields" }
  - { aspect: "Can be re-injected later", a: "No", b: "Yes: call the setter again", c: "Only by reflection" }
  - { aspect: "Use for", a: "Required dependencies (Spring's advice)", b: "Optional dependencies with a default", c: "Avoid in application code" }
verdict: "Constructor injection for required dependencies, setter injection for optional ones; avoid field injection."
sources:
  - title: "Dependency Injection: constructor-based or setter-based DI? (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    verifiedOn: "2026-10-17"
  - title: "Autowired: fields are injected right after construction (Spring Framework 7.0.9 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/annotation/Autowired.html"
    verifiedOn: "2026-10-17"
  - title: "Spring Beans and Dependency Injection (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/using/spring-beans-and-dependency-injection.html"
    verifiedOn: "2026-10-17"
  - title: "Why Is Field Injection Not Recommended? (Baeldung)"
    url: "https://www.baeldung.com/java-spring-field-injection-cons"
    verifiedOn: "2026-10-17"
