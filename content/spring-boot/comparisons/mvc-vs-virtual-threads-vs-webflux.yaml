id: mvc-vs-virtual-threads-vs-webflux
tech: spring-boot
title: "Spring MVC vs MVC on Virtual Threads vs WebFlux"
compares: [mvc-servlet-stack, mvc-on-virtual-threads, webflux-reactive-stack]
gist:
  - "A pooled platform thread per request; blocking is fine"
  - "A new virtual thread per request; blocking is cheap"
  - "A few event-loop threads; code must never block"
rows:
  - { aspect: "Threads", a: "A pool of platform threads (Tomcat: at most 200)", b: "One virtual thread per request, no pool", c: "About one event-loop thread per CPU core" }
  - { aspect: "While waiting on I/O", a: "The thread is blocked and idle", b: "The virtual thread unmounts; its carrier is freed", c: "No thread waits; processing resumes on a callback" }
  - { aspect: "Code style", a: "Plain imperative code", b: "Plain imperative code", c: "Reactive: Mono, Flux and operators" }
  - { aspect: "Blocking libraries (JPA, JDBC)", a: "Fine", b: "Fine; the connection pool still caps concurrency", c: "Must be moved off the event loop" }
  - { aspect: "Turn on with", a: "spring-boot-starter-webmvc", b: "spring.threads.virtual.enabled=true (Java 21+)", c: "spring-boot-starter-webflux" }
  - { aspect: "Learning curve", a: "Lowest", b: "Same as MVC", c: "Steep: non-blocking, functional style" }
verdict: "Default to MVC; turn on virtual threads when many requests wait on I/O; pick WebFlux for streaming, back pressure or an end-to-end reactive stack."
