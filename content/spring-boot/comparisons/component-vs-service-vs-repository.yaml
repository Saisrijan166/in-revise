id: component-vs-service-vs-repository
tech: spring-boot
title: "@Component vs @Service vs @Repository"
compares: [component-annotation, service-stereotype, repository-stereotype]
gist:
  - "Generic: any Spring-managed class"
  - "Service layer: business logic"
  - "Data layer: storage access, with exception translation"
rows:
  - { aspect: "Is a @Component", a: "Yes, the base", b: "Yes, a specialisation", c: "Yes, a specialisation" }
  - { aspect: "Found by scanning", a: "Yes", b: "Yes", c: "Yes" }
  - { aspect: "Extra behaviour", a: "None", b: "None today; names the layer", c: "Persistence exceptions become DataAccessException" }
  - { aspect: "Typical class", a: "A helper or validator", b: "PaymentService", c: "A DAO or custom repository" }
verdict: "All three register a bean the same way; pick the one that names the layer, and use @Repository for data access to get exception translation."
sources:
  - title: "Classpath Scanning and Managed Components (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html"
    verifiedOn: "2026-10-19"
  - title: "Repository (Spring Framework 7.0 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/stereotype/Repository.html"
    verifiedOn: "2026-10-19"
