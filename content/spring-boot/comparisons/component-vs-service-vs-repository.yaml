id: component-vs-service-vs-repository
tech: spring-boot
title: "@Component vs @Service vs @Repository"
compares: [component-annotation, service-stereotype, repository-stereotype]
gist:
  - "Generic: any Spring-managed class"
  - "Service layer: business logic"
  - "Data layer: storage access, with exception translation"
explain:
  - "@Component is the generic marker: it tells component scanning to make this class a bean. Use it for helpers that belong to no particular layer, such as a validator."
  - "@Service is a @Component for the business layer, the classes that hold your rules, like PaymentService. It adds no behaviour today; it tells readers and tools what the class does."
  - "@Repository is a @Component for the data layer. Besides naming the layer, it lets Spring translate database exceptions into Spring's DataAccessException family."
example: "In the payment service, PaymentService is a @Service and an AmountValidator helper is a @Component. A hand-written JdbcPaymentDao is a @Repository, so a SQL error from it reaches callers as a DataAccessException instead of an exception specific to one database driver."
rows:
  - { aspect: "Is a @Component", a: "Yes, the base", b: "Yes, a specialisation", c: "Yes, a specialisation" }
  - { aspect: "Found by scanning", a: "Yes", b: "Yes", c: "Yes" }
  - { aspect: "Extra behaviour", a: "None", b: "None today; it names the layer", c: "Database exceptions become DataAccessException" }
  - { aspect: "Typical class", a: "A helper or validator", b: "PaymentService", c: "A DAO or custom repository" }
verdict: "All three register a bean the same way; pick the one that names the layer, and use @Repository for data access to get exception translation."
sayIt: "All three register a bean through the same component scanning, because @Service and @Repository are specialisations of @Component. The name documents the layer, and @Repository also enables translation of persistence exceptions into DataAccessException."
sources:
  - title: "Classpath Scanning and Managed Components (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html"
    verifiedOn: "2026-10-19"
  - title: "Repository (Spring Framework 7.0 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/stereotype/Repository.html"
    verifiedOn: "2026-10-19"
