id: value-vs-configuration-properties-vs-environment
tech: spring-boot
title: "@Value vs @ConfigurationProperties vs Environment"
compares: [value-annotation, config-properties-class, spring-environment]
gist:
  - "Inject one key into one field or parameter"
  - "Bind every key under a prefix to one typed bean"
  - "Read any key in code, when you call it"
explain:
  - "@Value(\"${key}\") goes on a field or constructor parameter. When Spring creates the bean, it puts that one setting there, converted to the parameter's type."
  - "@ConfigurationProperties(\"prefix\") goes on a class or record. Boot fills its fields from every key under the prefix, and you inject the whole object as a bean."
  - "Environment is the bean that holds all merged settings. You inject it and call getProperty(\"key\") in your code whenever you need a value."
example: "In the payment service, @Value(\"${app.name:payment-service}\") fits the one app name. The currency, timeout and retry count go into one PaymentProperties record bound to app.payment. A report job that builds the key app.limits.<country> at runtime calls env.getProperty(key)."
rows:
  - { aspect: "Looks like", a: "@Value(\"${app.timeout:30}\")", b: "@ConfigurationProperties(\"app\")", c: "env.getProperty(\"app.timeout\")" }
  - { aspect: "Type", a: "Converted to the field's type", b: "A typed bean; can be a record", c: "String, or a type you pass: getProperty(key, Integer.class)" }
  - { aspect: "Runs SpEL #{...}", a: "Yes", b: "No", c: "No" }
  - { aspect: "IDE completion of keys", a: "No", b: "Yes, with the configuration processor", c: "No" }
  - { aspect: "Key missing", a: "Startup fails unless you write ${key:default}", b: "Not bound, so the field keeps its default; add @Validated constraints to require it", c: "Returns null, or the default you pass" }
  - { aspect: "Best for", a: "One or two values", b: "Your own groups of settings", c: "Keys known only at runtime" }
verdict: "Use @ConfigurationProperties for your own settings, @Value for a single value or SpEL, and Environment only when the key is decided at runtime."
sayIt: "@Value injects one key when the bean is created, @ConfigurationProperties binds a whole prefix to one typed, validated bean, and Environment reads any key in code on demand. For my own settings I use @ConfigurationProperties; Environment only when the key is built at runtime."
sources:
  - { title: "Externalized Configuration: @ConfigurationProperties vs. @Value (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-21" }
  - { title: "Using @Value (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/value-annotations.html", verifiedOn: "2026-10-19" }
  - { title: "PropertyResolver (Spring Framework 7.0.9 API)", url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/core/env/PropertyResolver.html", verifiedOn: "2026-10-19" }
