---
id: pathvariable-vs-requestparam-vs-requestbody
tech: spring-boot
title: "@PathVariable vs @RequestParam vs @RequestBody"
compares: [path-variable, request-param, request-body]
gist:
  - "A value inside the path: the 42 in /payments/42"
  - "A query parameter or form field: ?status=PAID"
  - "The whole body, usually JSON, as one object"
explain:
  - "@PathVariable reads a {name} segment of the URL path. It says which resource the request is about, such as payment 42 in /payments/42."
  - "@RequestParam reads a value from the query string after ? (or a form field). It carries options that change how you read the data, such as a status filter or a page number."
  - "@RequestBody reads the whole request body into one Java object, using a message converter such as Jackson for JSON. It carries the data you want to create or change."
example: "POST /payments/42/refunds?notify=true with the body {\"amount\": 200} gives three values: 42 is the @PathVariable (which payment), notify=true is a @RequestParam (an option), and the JSON becomes a RefundRequest through @RequestBody (the data)."
rows:
  - { aspect: "Reads from", a: "A {name} segment of the URL path", b: "The query string or form data", c: "The request body" }
  - { aspect: "Typical use", a: "Say which resource", b: "Filter, sort or page", c: "Data to create or update" }
  - { aspect: "Converted by", a: "Type conversion from text, e.g. to long or an enum", b: "Type conversion from text, e.g. to long or an enum", c: "An HttpMessageConverter, e.g. Jackson" }
  - { aspect: "If it is missing", a: "The URL does not match this mapping", b: "400, unless required = false or a defaultValue", c: "400, unless required = false" }
verdict: "Path variable for which resource, request param for options such as filters and paging, request body for the data you send."
sayIt: "@PathVariable takes a value from the path and identifies the resource, like /payments/42. @RequestParam takes a query parameter for filtering or paging, like ?status=PAID. @RequestBody converts the JSON body into an object, for the data being created or updated."
