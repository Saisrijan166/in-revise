id: value-vs-configuration-properties
tech: spring-boot
title: "@Value vs @ConfigurationProperties"
compares: [value-annotation, config-properties-class]
gist:
  - "One key into one field or parameter; can run SpEL"
  - "A whole prefix bound to one typed, validated class"
rows:
  - { aspect: "Binds", a: "One key: @Value(\"${app.timeout:5s}\")", b: "Every key under a prefix, such as app.mail.*" }
  - { aspect: "Relaxed binding", a: "Limited: write the key in kebab-case", b: "Full: first-name, firstName, first_name, env var form" }
  - { aspect: "SpEL #{...}", a: "Yes, evaluated when injected", b: "No" }
  - { aspect: "IDE completion (metadata)", a: "No", b: "Yes, with spring-boot-configuration-processor" }
  - { aspect: "Key missing", a: "Start-up fails unless ${key:default} gives a fallback", b: "Nothing is bound; add @Validated constraints to require it" }
  - { aspect: "Best for", a: "One or two values, or a computed value", b: "Your own groups of settings (the docs recommend it)" }
verdict: "Use @ConfigurationProperties for your own settings: typed, validated and autocompleted. Keep @Value for a single value or a SpEL expression."
sources:
  - { title: "Externalized Configuration: @ConfigurationProperties vs. @Value (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }
  - { title: "Using @Value (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/value-annotations.html", verifiedOn: "2026-10-17" }
  - { title: "Configuration Metadata (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/specification/configuration-metadata/index.html", verifiedOn: "2026-10-17" }
