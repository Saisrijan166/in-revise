  - { aspect: "Slow run", a: "By default, the next run starts late, not in parallel", b: "The gap after it stays the same", c: "By default, not in parallel either" }
  - { aspect: "Value", a: "Milliseconds, or set timeUnit", b: "Milliseconds, or set timeUnit", c: "Six fields: second, minute, hour, day, month, weekday" }
