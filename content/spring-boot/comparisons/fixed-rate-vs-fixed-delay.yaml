id: fixed-rate-vs-fixed-delay
tech: spring-boot
title: "fixedRate vs fixedDelay vs cron"
compares: [fixed-rate, fixed-delay, cron-schedule]
gist:
  - "Start every N ms, counted from each start"
  - "Wait N ms after each run ends"
  - "Run at clock times, like 09:00 on weekdays"
explain:
  - "fixedRate tells @Scheduled to start the method every N milliseconds, measured from one start to the next. It keeps a steady beat, whatever each run takes."
  - "fixedDelay tells @Scheduled to wait N milliseconds after a run finishes before starting the next one. It gives every run a rest period, so runs never pile up."
  - "cron tells @Scheduled to run at calendar times, written as six fields with seconds first, such as 0 0 9 * * MON-FRI for 09:00 on weekdays. The zone attribute sets the time zone."
example: "The payment service expires stale payments with fixedDelay = 10 minutes: a run that takes 2 minutes is followed by a 10-minute rest. A health ping to the fraud-check service uses fixedRate = 30 seconds for a steady beat. The daily settlement report uses cron = \"0 0 9 * * MON-FRI\" with zone = \"Asia/Kolkata\"."
rows:
  - { aspect: "Next run is counted from", a: "The start of the previous run", b: "The end of the previous run", c: "The clock and the calendar" }
  - { aspect: "How you write it", a: "fixedRate = 5000, in milliseconds unless you set timeUnit", b: "fixedDelay = 5000, in milliseconds unless you set timeUnit", c: "Six fields, seconds first, with an optional zone" }
  - { aspect: "A run takes longer than planned", a: "On Boot's default scheduler, the next run starts late, not in parallel", b: "The next run still waits the full delay after it ends", c: "The next run is the next matching time after it ends" }
  - { aspect: "Good for", a: "A steady beat, such as a heartbeat or metrics push", b: "Polling or cleanup where runs must not pile up", c: "Calendar jobs, such as a daily report" }
verdict: "fixedDelay when each run must finish and rest; fixedRate for a steady beat; cron for clock times."
sayIt: "fixedRate starts a run every N milliseconds counted from the previous start; fixedDelay waits N milliseconds after the previous run ends; cron runs at clock times, written with six fields, seconds first. I use fixedDelay for cleanup jobs so runs never overlap."
