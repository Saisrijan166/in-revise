id: fixed-rate-vs-fixed-delay
tech: spring-boot
title: "fixedRate vs fixedDelay vs cron"
compares: [fixed-rate, fixed-delay, cron-schedule]
gist:
  - "Start every N ms, counted from each start"
  - "Wait N ms after each run ends"
  - "Run at clock times, like 09:00 on weekdays"
rows:
  - { aspect: "Next run counted from", a: "The previous start", b: "The previous end", c: "The clock and calendar" }
  - { aspect: "Example", a: "fixedRate = 5000", b: "fixedDelay = 5000", c: "cron = \"0 0 9 * * MON-FRI\"" }
  - { aspect: "Value", a: "Milliseconds, or set timeUnit", b: "Milliseconds, or set timeUnit", c: "Six fields, seconds first" }
  - { aspect: "Run longer than N", a: "Next one starts late, not in parallel", b: "Still waits N after it ends", c: "Next match after it ends; no overlap" }
  - { aspect: "Good for", a: "A steady beat, like heartbeats", b: "Polling where runs must not pile up", c: "Calendar jobs, like daily reports" }
verdict: "fixedDelay when each run must finish and rest; fixedRate for a steady beat; cron for clock times."
sources:
  - title: "Task Execution and Scheduling (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html"
    verifiedOn: "2026-10-19"
  - title: "ThreadPoolTaskScheduler wraps a ScheduledThreadPoolExecutor (Spring Framework 7.0 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/concurrent/ThreadPoolTaskScheduler.html"
    verifiedOn: "2026-10-19"
  - title: "CronTrigger: next time from the previous completion (Spring Framework 7.0 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/support/CronTrigger.html"
    verifiedOn: "2026-10-19"
  - title: "ScheduledExecutorService.scheduleAtFixedRate (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ScheduledExecutorService.html"
    verifiedOn: "2026-10-19"
