  - { aspect: "Good for", a: "A steady beat, such as heartbeats", b: "Polling where runs must never pile up", c: "Calendar jobs, such as daily reports" }
verdict: "Use fixedDelay when each run must finish and rest before the next; fixedRate for a steady beat; cron for clock times."
