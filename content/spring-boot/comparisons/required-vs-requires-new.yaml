id: required-vs-requires-new
tech: spring-boot
title: REQUIRED vs REQUIRES_NEW
compares: [propagation-required, propagation-requires-new]
gist:
  - "Join the caller's transaction: all or nothing together"
  - "Suspend the caller's; run and commit on its own"
diagrams:
  - |
    flowchart LR
      O["outer method"] --> T[("one transaction")]
      I["inner method"] --> T
  - |
    flowchart LR
      O["outer method"] --> T1[("transaction 1")]
      I["inner method"] --> T2[("transaction 2")]
diagramAlt: "REQUIRED: the outer and the inner method share one transaction. REQUIRES_NEW: the outer method runs in transaction 1, which waits while the inner method runs in transaction 2."
rows:
  - { aspect: "A transaction exists", a: "Joins it", b: "Suspends it, starts a new one" }
  - { aspect: "Inner failure", a: "The whole transaction rolls back", b: "Only the inner work rolls back" }
  - { aspect: "Inner isolation, readOnly", a: "Ignored: the outer's apply", b: "Its own settings apply" }
  - { aspect: "Connections", a: "One", b: "Two at once" }
  - { aspect: "Typical use", a: "Normal business methods", b: "Audit log that must survive a rollback" }
verdict: "Keep REQUIRED; use REQUIRES_NEW only for work that must commit on its own, with a pool bigger than the thread count."
sources:
  - title: "Transaction Propagation (Spring Framework 7.0.9 reference)"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html"
    verifiedOn: "2026-10-19"
  - title: "Propagation (Spring Framework 7.0.9 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Propagation.html"
    verifiedOn: "2026-10-19"
