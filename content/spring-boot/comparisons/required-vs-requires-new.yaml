id: required-vs-requires-new
tech: spring-boot
title: REQUIRED vs REQUIRES_NEW
compares: [propagation-required, propagation-requires-new]
gist:
  - "Join the caller's transaction: all or nothing together"
  - "Pause the caller's; run and commit on its own"
explain:
  - "REQUIRED is the default propagation. If the caller already has a transaction, the method joins it, so both commit or roll back together; if not, it starts one. It keeps one business action in one unit."
  - "REQUIRES_NEW always starts a new transaction. It pauses the caller's, runs its own on a second connection, commits or rolls back, then resumes the caller's. It is for work that must be saved whatever the caller does."
example: "pay() runs in a transaction and calls AuditService.record(). With REQUIRED the audit row joins pay()'s transaction, so when the debit fails it is rolled back too. With REQUIRES_NEW the audit row commits at once and stays, even though the payment rolls back."
diagrams:
  - |
    flowchart LR
      O["pay()"] --> T[("one transaction")]
      I["record()"] --> T
  - |
    flowchart LR
      O["pay()"] --> T1[("transaction 1, paused")]
      I["record()"] --> T2[("transaction 2")]
diagramAlt: "REQUIRED: pay() and record() share one transaction. REQUIRES_NEW: pay() runs in transaction 1, which is paused while record() runs and commits in transaction 2."
rows:
  - { aspect: "When a transaction already exists", a: "Joins it", b: "Pauses it and starts a new one" }
  - { aspect: "If the inner method fails", a: "The whole shared transaction rolls back", b: "Only the inner work rolls back, if the caller catches the error" }
  - { aspect: "If the outer method fails later", a: "The inner work rolls back too", b: "The inner work stays committed" }
  - { aspect: "Inner isolation, timeout and readOnly", a: "Ignored; the caller's settings apply", b: "Its own settings apply" }
  - { aspect: "Connections held at once", a: "One", b: "Two, so the pool must be bigger than the thread count" }
  - { aspect: "Typical use", a: "Normal business methods", b: "An audit or failure record that must survive a rollback" }
verdict: "Keep REQUIRED for normal work; use REQUIRES_NEW only for work that must commit on its own, with a pool bigger than the number of concurrent threads."
sayIt: "REQUIRED joins the caller's transaction or starts one, so everything commits or rolls back together. REQUIRES_NEW pauses the caller's and runs its own, so an audit record survives a rollback, but it holds a second connection."
sources:
  - title: "Transaction Propagation (Spring Framework 7.0.9 reference)"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html"
    verifiedOn: "2026-10-21"
  - title: "Propagation (Spring Framework 7.0.9 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/transaction/annotation/Propagation.html"
    verifiedOn: "2026-10-19"
