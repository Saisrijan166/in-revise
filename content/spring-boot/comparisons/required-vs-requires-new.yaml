---
id: required-vs-requires-new
tech: spring-boot
title: REQUIRED vs REQUIRES_NEW
compares: [propagation-required, propagation-requires-new]
gist:
  - "Join the caller's transaction: commit or roll back together"
  - "Suspend the caller's; run and commit in a new transaction"
diagrams:
  - |
    flowchart LR
      O["outer method"] --> T[("one transaction")]
      I["inner method"] --> T
  - |
    flowchart LR
      O["outer method"] --> T1[("transaction 1")]
      I["inner method"] --> T2[("transaction 2")]
diagramAlt: "REQUIRED: the outer and the inner method share one transaction. REQUIRES_NEW: the outer method runs in transaction 1, which is suspended while the inner method runs in transaction 2."
rows:
  - { aspect: "A transaction exists", a: "Joins it", b: "Suspends it and starts a new one" }
  - { aspect: "No transaction", a: "Starts one", b: "Starts one" }
  - { aspect: "Inner failure", a: "Marks the shared transaction rollback-only: all of it rolls back", b: "Rolls back only the inner work; the outer can go on if it catches the error" }
  - { aspect: "Inner isolation, timeout, readOnly", a: "Ignored by default: the outer's apply", b: "Applied: it is a new transaction" }
  - { aspect: "Connections", a: "One", b: "Two at once: the outer one stays bound" }
  - { aspect: "Risk", a: "One failure undoes everything", b: "Pool exhaustion or deadlock if the pool is too small" }
verdict: "Keep REQUIRED; use REQUIRES_NEW only for work that must commit on its own, with a pool larger than the number of concurrent threads."
sources:
