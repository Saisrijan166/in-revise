---
id: exceptionhandler-vs-controlleradvice
tech: spring-boot
title: "@ExceptionHandler vs @ControllerAdvice vs @RestControllerAdvice"
compares: [exception-handler-annotation, controller-advice, rest-controller-advice]
gist:
  - "The handler method: exception type in, response out"
  - "The global place: its handlers serve all controllers"
  - "The same, plus @ResponseBody: its handlers write JSON"
explain:
  - "@ExceptionHandler goes on a method and names the exception types it handles. The method builds the response, such as a 404 ProblemDetail. Inside a controller, it covers only that controller."
  - "@ControllerAdvice goes on a class that holds @ExceptionHandler methods. Its handlers apply to every controller by default, so you write them once. A returned String is still a view name."
  - "@RestControllerAdvice is @ControllerAdvice plus @ResponseBody. Its handlers' return values are written to the body, usually as JSON, which is what a REST API needs."
example: "PaymentController has its own @ExceptionHandler for PaymentNotFoundException, so RefundController still answers 500 for the same exception. Moving that handler into an ApiErrors class marked @RestControllerAdvice makes both controllers answer 404 with the same ProblemDetail."
rows:
  - { aspect: "Is a", a: "Method annotation", b: "Class annotation (a kind of @Component)", c: "Class annotation: @ControllerAdvice plus @ResponseBody" }
  - { aspect: "Applies to", a: "Its own controller, unless it sits in an advice class", b: "All controllers by default; can be narrowed", c: "All controllers by default; can be narrowed" }
  - { aspect: "A return value means", a: "Depends on the class it is in", b: "A view name, unless the method has @ResponseBody", c: "The response body" }
  - { aspect: "Typical use", a: "Map one exception type to one status", b: "Error pages in an HTML app", c: "One JSON error shape for a REST API" }
verdict: "Write @ExceptionHandler methods inside one @RestControllerAdvice for a REST API; keep local handlers for cases that belong to one controller only."
sayIt: "@ExceptionHandler is the mechanism: a method that turns an exception into a response. @ControllerAdvice is the global place for such methods, and @RestControllerAdvice adds @ResponseBody so they write JSON. For an API I use one @RestControllerAdvice."
sources:
