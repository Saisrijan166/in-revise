---
id: spring-data-jdbc-vs-jpa
tech: spring-boot
title: Spring Data JDBC vs Spring Data JPA
compares: [spring-data-jdbc, spring-data-jpa]
gist:
  - "Simple mapping: load runs SQL, save writes it"
  - "Full ORM: tracked entities, lazy loading"
explain:
  - "Spring Data JDBC maps entities to tables with plain JDBC. Loading runs SQL and gives you a complete object; save() writes it. Nothing is tracked, so the behaviour is easy to predict."
  - "Spring Data JPA uses JPA, run by Hibernate. Loaded entities are tracked in a persistence context, changes are written at flush, and associations can load lazily."
example: "To mark payment 42 as PAID with Spring Data JPA, you load it inside a transaction and call setStatus(\"PAID\"); dirty checking writes the UPDATE at flush. With Spring Data JDBC, the same setStatus changes only the Java object; nothing reaches the database until you call paymentRepository.save(payment)."
rows:
  - { aspect: "Runs on", a: "Plain JDBC", b: "JPA, with Hibernate as the provider" }
  - { aspect: "Lazy loading", a: "None: an entity always loads complete", b: "Yes, per association" }
  - { aspect: "Change tracking", a: "None: call save() or nothing is written", b: "Dirty checking writes changes at flush" }
  - { aspect: "Mapping", a: "Simple, with few annotations", b: "Rich: relationships, inheritance, cascades" }
  - { aspect: "Boot starter", a: "spring-boot-starter-data-jdbc", b: "spring-boot-starter-data-jpa" }
verdict: "Pick JDBC for simple, explicit SQL behaviour; pick JPA when you need a rich object model."
sayIt: "Spring Data JDBC is a simple mapper: loading runs SQL, save() writes, and there is no lazy loading or dirty checking. Spring Data JPA is a full ORM through Hibernate, with a persistence context, dirty checking and lazy loading. I pick JDBC for simple models and JPA for rich object graphs."
