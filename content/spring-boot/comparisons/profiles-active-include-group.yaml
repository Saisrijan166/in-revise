id: profiles-active-include-group
tech: spring-boot
title: spring.profiles.active vs include vs group
compares: [active-profiles, profile-include, profile-groups]
gist:
  - "Says which profiles are on; a higher source replaces the list"
  - "Adds profiles on top of the active ones, on every run"
  - "One name that switches on several profiles at once"
rows:
  - { aspect: "Example", a: "spring.profiles.active=prod", b: "spring.profiles.include=common", c: "spring.profiles.group.prod=proddb,prodmq" }
  - { aspect: "Effect", a: "Turns on exactly the listed profiles", b: "Turns these on too, added before the active ones", c: "Activating prod also turns on proddb and prodmq" }
  - { aspect: "Typical use", a: "Chosen per deploy, by env var or argument", b: "Profiles that every run needs", c: "Bundle related profiles under one logical name" }
  - { aspect: "Allowed in profile-specific files", a: "No", b: "No", c: "No" }
verdict: "Set active per environment at deploy time; use include for profiles every run needs; use a group to turn on several with one name."
sources:
  - { title: "Profiles: Adding Active Profiles, Profile Groups (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/profiles.html", verifiedOn: "2026-10-17" }
  - { title: "Common Application Properties: spring.profiles.* (Spring Boot 4.1.1 appendix)", url: "https://docs.spring.io/spring-boot/appendix/application-properties/index.html", verifiedOn: "2026-10-17" }
