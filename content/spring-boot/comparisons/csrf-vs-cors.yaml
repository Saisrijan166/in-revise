---
id: csrf-vs-cors
tech: spring-boot
title: CSRF vs CORS
compares: [csrf-protection, cors-support]
gist:
  - "Blocks forged requests that ride on your cookies"
  - "Lets chosen origins call your API from a browser"
diagrams:
  - |
    flowchart LR
      E([Other site]) -- "POST with cookie, no token" --> F[CsrfFilter]
      F --> X([403])
  - |
    flowchart LR
      P([app.example.com page]) -- "OPTIONS preflight" --> C[CORS check]
      C -- "Access-Control-Allow-Origin" --> P
diagramAlt: "CSRF: another site makes the browser POST with your cookie but no token, and CsrfFilter rejects it with 403. CORS: a page on app.example.com sends a preflight OPTIONS request, and the server answers with Access-Control-Allow-Origin so the browser allows the call."
rows:
  - { aspect: "Stands for", a: "Cross-site request forgery", b: "Cross-origin resource sharing" }
  - { aspect: "Problem", a: "Another site sends requests with your user's cookies", b: "Browsers block calls to other origins" }
  - { aspect: "Enforced by", a: "Your server (CsrfFilter)", b: "The browser, reading your headers" }
  - { aspect: "Spring Security 7.1", a: "On by default", b: "Off until cors() or a CORS source bean" }
  - { aspect: "Needed when", a: "Browsers send cookies or Basic credentials", b: "A page on another origin calls your API" }
verdict: "Different problems: keep CSRF on for cookie logins, and allow CORS only for your front end's exact origins."
