---
id: csrf-vs-cors
tech: spring-boot
title: CSRF vs CORS
compares: [csrf-protection, cors-support]
gist:
  - "Blocks forged requests that ride on your cookies"
  - "Lets chosen origins call your API from a browser"
explain:
  - "CSRF protection stops an attack where another site makes the user's browser send a request to your app with your cookies attached. Spring Security asks every unsafe request for a secret token that the other site cannot read."
  - "CORS support lets a page from another origin call your API in a browser. The browser asks first, and your server answers with headers that name the origins, methods and headers it allows."
example: "evil.example auto-submits a form POST to /payments: the browser adds the session cookie, but the request has no CSRF token, so CsrfFilter answers 403. The real front end at app.example.com calls the same API: CORS headers allow that origin, and the request also carries the token, so it succeeds."
diagrams:
  - |
    flowchart LR
      E([Other site]) -- "POST with cookie, no token" --> F[CsrfFilter]
      F --> X([403])
  - |
    flowchart LR
      P([app.example.com page]) -- "OPTIONS preflight" --> C[CORS check]
      C -- "Access-Control-Allow-Origin" --> P
diagramAlt: "CSRF: another site makes the browser POST with your cookie but no token, and CsrfFilter rejects it with 403. CORS: a page on app.example.com sends a preflight OPTIONS request, and the server answers with Access-Control-Allow-Origin so the browser allows the call."
rows:
  - { aspect: "Stands for", a: "Cross-site request forgery", b: "Cross-origin resource sharing" }
  - { aspect: "Problem it handles", a: "Another site sends requests with your user's cookies", b: "Browsers block calls to other origins" }
  - { aspect: "Enforced by", a: "Your server, in CsrfFilter", b: "The browser, reading your response headers" }
  - { aspect: "Default in Spring Security 7.1", a: "On for unsafe methods", b: "Off until http.cors() or a CORS source bean" }
  - { aspect: "Needed when", a: "Browsers send cookies or HTTP Basic credentials", b: "A page on another origin calls your API" }
verdict: "Different problems: keep CSRF on for cookie logins, and allow CORS only for your front end's exact origins."
sayIt: "CSRF protection blocks forged requests: browsers attach cookies automatically, so I require a token another site cannot read. CORS is permission: the browser asks my server which other origins may call it, and I allow only my front end's exact origin."
