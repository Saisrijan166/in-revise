---
id: csrf-vs-cors
tech: spring-boot
title: CSRF Protection vs CORS
compares: [csrf-protection, cors-support]
gist:
  - "Blocks forged requests that ride on the user's cookies"
  - "Allows chosen origins to read your responses"
diagrams:
  - |
    flowchart LR
      E([Evil site]) -- "POST with your cookie, no token" --> F[CsrfFilter]
      F --> X([403 Forbidden])
  - |
    flowchart LR
      P([Page on app.example.com]) -- "OPTIONS preflight" --> C[CorsFilter]
      C -- "Access-Control-Allow-Origin" --> P
diagramAlt: "CSRF: an evil site makes the browser POST to your app with your cookie but without the CSRF token, and CsrfFilter rejects it with 403. CORS: a page on app.example.com sends a preflight OPTIONS request, and CorsFilter answers with Access-Control-Allow-Origin so the browser lets the page read the response."
rows:
  - { aspect: "Problem", a: "Another site sends requests using your user's cookies", b: "The browser stops scripts reading other origins" }
  - { aspect: "Who enforces it", a: "Your server (CsrfFilter)", b: "The browser, using your CORS headers" }
  - { aspect: "Effect", a: "Rejects unsafe requests without a valid token (403)", b: "Lets the listed origins read responses" }
  - { aspect: "In Spring Security 7.1", a: "On by default", b: "Off until cors() is set or a CORS config bean exists" }
  - { aspect: "Needed when", a: "Browsers send cookies or Basic credentials", b: "A page on another origin calls your API" }
verdict: "They solve different problems: keep CSRF on for cookie logins, and allow CORS only for the exact origins of your front end."
