id: gateway-webflux-vs-webmvc
tech: spring-boot
title: Gateway Server WebFlux vs Gateway Server Web MVC
compares: [gateway-server-webflux, gateway-server-webmvc]
gist:
  - "Reactive gateway on Spring WebFlux and Netty"
  - "Servlet gateway on Tomcat or Jetty, built on WebMvc.fn"
rows:
  - { aspect: "Starter", a: "spring-cloud-starter-gateway-server-webflux", b: "spring-cloud-starter-gateway-server-webmvc" }
  - { aspect: "Runs on", a: "Netty; not in a servlet container or as a war", b: "Servlet runtimes such as Tomcat and Jetty" }
  - { aspect: "Routes in properties", a: "spring.cloud.gateway.server.webflux.routes", b: "spring.cloud.gateway.server.webmvc.routes" }
  - { aspect: "Routes in Java", a: "A RouteLocator bean from RouteLocatorBuilder", b: "A RouterFunction bean, e.g. GatewayRouterFunctions.route()" }
  - { aspect: "Rate limiting", a: "RequestRateLimiter with Redis (token bucket)", b: "rateLimit filter with Bucket4j (token bucket)" }
  - { aspect: "Library fit", a: "Many blocking libraries may not apply", b: "Many reactive or async libraries may not apply" }
verdict: "Pick the stack your team already runs: WebFlux for reactive apps, Web MVC for servlet apps and blocking libraries."
sources:
  - { title: "Spring Cloud Gateway 5.0.3 reference: the two server variants", url: "https://docs.spring.io/spring-cloud-gateway/reference/", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Gateway 5.0.3: how to include Gateway Server WebFlux", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/starter.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Gateway 5.0.3: how to include Gateway Server Web MVC", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webmvc/starter.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Gateway 5.0.3: route predicate and filter configuration (WebFlux)", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/configuring-route-predicate-factories-and-filter-factories.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Gateway 5.0.3: Web MVC request predicates", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webmvc/gateway-request-predicates.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Gateway 5.0.3: Web MVC Java routes API", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webmvc/java-routes-api.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Gateway 5.0.3: fluent Java routes API (WebFlux)", url: "https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webflux/fluent-java-routes-api.html", verifiedOn: "2026-10-17" }
