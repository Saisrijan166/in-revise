---
id: jar-vs-war-vs-native-image
tech: spring-boot
title: "Executable Jar vs War vs Native Image"
compares: [executable-jar, deployable-war, native-image]
gist:
  - "Server inside; run it with java -jar"
  - "Deploy into an existing servlet container"
  - "A compiled executable; no JVM needed"
explain:
  - "An executable jar holds your classes, every library and the embedded server. java -jar runs it on any machine with Java, so nothing else needs installing."
  - "A war is deployed into a servlet container that already runs, such as a shared Tomcat. It suits companies that operate their servers centrally."
  - "A native image is a machine executable built ahead of time by GraalVM. It starts much faster and uses less memory, but everything is fixed at build time."
example: "The payment service ships as payment-service.jar in a buildpacks image. A bank that runs one central Tomcat gets payment-service.war instead. A burst-driven function that must start in milliseconds would be built as a native image."
rows:
  - { aspect: "Runs with", a: "java -jar app.jar", b: "A servlet container such as Tomcat; java -jar also works", c: "./app, directly" }
  - { aspect: "Web server", a: "Embedded, inside the jar", b: "The container's own", c: "Embedded, compiled in" }
  - { aspect: "Startup and memory", a: "Normal JVM", b: "Normal JVM", c: "Much faster start, less memory" }
  - { aspect: "Build", a: "Quick", b: "Quick", c: "Slow native-image step; needs GraalVM 25+" }
  - { aspect: "Limits", a: "None special", b: "No WebFlux apps", c: "Reflection needs hints; beans fixed at build" }
verdict: "Default to the executable jar; build a war only for an existing server, and go native when startup and memory really matter."
sayIt: "I default to the executable jar, because the server is inside and java -jar runs it anywhere. A war is only for deploying into an existing servlet container. A native image starts fast and uses little memory, but builds slowly and fixes the beans at build time."
