---
id: metrics-vs-traces
tech: spring-boot
title: "Metrics vs Traces"
compares: [micrometer-metrics, micrometer-tracing]
gist:
  - "Numbers over time: how many, how fast, how full"
  - "One request's path through the services, step by step"
diagrams:
  - |
    flowchart LR
      A[App instances] -- "timers, counters" --> R[(MeterRegistry)]
      P[Prometheus] -- "scrapes" --> R
  - |
    flowchart LR
      G[Gateway span] --> O[Order service span] --> D[Database query span]
diagramAlt: "Metrics: app instances record timers and counters in a MeterRegistry, and Prometheus scrapes it. Traces: one request makes a gateway span, which leads to an order service span, which leads to a database query span."
rows:
  - { aspect: "Answers", a: "Is something wrong? How often, how slow?", b: "Where did this one request spend its time?" }
  - { aspect: "Unit", a: "A meter: a name plus tags, such as http.server.requests", b: "A trace: a tree of spans, each one timed unit of work" }
  - { aspect: "Tags", a: "Low cardinality only, such as method or status", b: "High cardinality allowed, such as a user or order ID" }
  - { aspect: "Volume in Spring Boot", a: "Aggregated, so every request counts", b: "Sampled: 10% of traces by default" }
  - { aspect: "Sent to", a: "Prometheus (pull), or a push backend such as OTLP", b: "Zipkin, or an OpenTelemetry backend over OTLP" }
  - { aspect: "Dependency", a: "micrometer-registry-<backend>, e.g. -prometheus", b: "spring-boot-starter-opentelemetry or spring-boot-starter-zipkin" }
verdict: "Alert on metrics, then open a trace to find the slow or failing service; in Spring Boot both come from the same Observation."
