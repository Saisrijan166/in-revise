---
id: spring-framework-vs-spring-boot
tech: spring-boot
title: Spring Framework vs Spring Boot
compares: [spring-framework, spring-boot-project]
gist:
  - "The parts: DI container, MVC, data access, transactions"
  - "The same Spring, set up for you and ready to run"
diagrams:
  - |
    flowchart LR
      Y[You] -- "pick versions, declare beans" --> S[Spring app]
      S -- "war" --> T[Separate server]
  - |
    flowchart LR
      Y[You] -- "add starters" --> B[Spring Boot]
      B -- "auto-configures" --> S[Spring app]
      S -- "java -jar" --> E[Embedded server]
diagramAlt: "Spring Framework: you pick library versions and declare beans, then deploy the app as a war to a separate server. Spring Boot: you add starters, Boot auto-configures the Spring app, and java -jar starts it with an embedded server."
rows:
  - { aspect: "What it is", a: "The core framework", b: "A layer built on Spring Framework" }
  - { aspect: "Library versions", a: "You choose and align them", b: "Managed by the spring-boot-dependencies BOM" }
  - { aspect: "Infrastructure beans", a: "You declare them", b: "Auto-configured from the classpath; your beans replace them" }
  - { aspect: "Web server", a: "Usually a war on a separate servlet container", b: "Embedded Tomcat or Jetty; run with java -jar" }
  - { aspect: "Production features", a: "You add them yourself", b: "Actuator: health, metrics, info" }
  - { aspect: "Configuration", a: "Java @Configuration classes or XML", b: "Defaults plus application.properties; no XML needed" }
verdict: "It is not either-or: Boot is Spring with the setup done. Start new apps with Boot; you can still replace any default it picks."
