---
id: restclient-vs-webclient-vs-resttemplate
tech: spring-boot
title: "RestClient vs WebClient vs RestTemplate"
compares: [rest-client, web-client, rest-template]
gist:
  - "Blocking, fluent API; the modern default"
  - "Non-blocking, reactive; returns Mono and Flux"
  - "Blocking, template methods; deprecated"
explain:
  - "RestClient is Spring's synchronous HTTP client with a fluent API, added in Framework 6.1. The calling thread waits for the answer, which fits Spring MVC apps and plain blocking code."
  - "WebClient is Spring's non-blocking, reactive HTTP client. A call returns a Mono or Flux at once and no thread waits for the answer, which fits WebFlux apps and streaming."
  - "RestTemplate is the older synchronous client with one method per kind of call, such as getForObject. Spring Framework 7.0 deprecates it in favour of RestClient, with removal planned for 8.0."
example: "The payment service is a Spring MVC app, so FraudCheckClient uses RestClient: http.post().uri(\"/checks\").body(request).retrieve().body(FraudResult.class). A WebFlux gateway in front of it would use WebClient and get a Mono<FraudResult>. Old code calling restTemplate.postForObject should move to RestClient."
rows:
  - { aspect: "API style", a: "Fluent chain: get(), uri(), retrieve(), body()", b: "Fluent chain that returns a Mono or Flux", c: "One method per call type: getForObject, exchange" }
  - { aspect: "Calling thread", a: "Waits for the response", b: "Does not wait", c: "Waits for the response" }
  - { aspect: "Async and streaming", a: "No async; limited streaming through an InputStream", b: "Yes", c: "No; the docs point to WebClient" }
  - { aspect: "Status in Framework 7.0", a: "Recommended for blocking calls", b: "Recommended for reactive apps", c: "Deprecated in favour of RestClient" }
  - { aspect: "Spring Boot 4.1 gives you", a: "A RestClient.Builder bean", b: "A WebClient.Builder bean", c: "A RestTemplateBuilder, but no RestTemplate bean" }
verdict: "New blocking code: RestClient. Reactive or streaming: WebClient. Existing RestTemplate code: move it to RestClient step by step."
sayIt: "RestClient and RestTemplate both block the calling thread, but RestTemplate is deprecated since Framework 7.0 and RestClient has a fluent API. WebClient is non-blocking and returns Mono or Flux. I use RestClient in MVC apps and WebClient in reactive ones."
