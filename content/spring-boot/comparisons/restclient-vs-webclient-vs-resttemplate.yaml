id: restclient-vs-webclient-vs-resttemplate
tech: spring-boot
title: "RestClient vs WebClient vs RestTemplate"
compares: [rest-client, web-client, rest-template]
gist:
  - "Blocking, fluent API; the modern default (Framework 6.1+)"
  - "Non-blocking and reactive, returns Mono and Flux (Framework 5.0+)"
  - "Blocking, template methods; deprecated in favour of RestClient"
rows:
  - { aspect: "API style", a: "Fluent: get().uri(...).retrieve().body(...)", b: "Fluent, returns Mono or Flux", c: "Template methods: getForObject, exchange" }
  - { aspect: "Calling thread", a: "Waits for the response", b: "Does not wait; non-blocking I/O", c: "Waits for the response" }
  - { aspect: "Async and streaming", a: "Synchronous only; Spring points to WebClient", b: "Yes, with Reactive Streams back pressure", c: "Synchronous only; Spring points to WebClient" }
  - { aspect: "Status in Spring Framework 7", a: "Recommended for blocking calls", b: "Recommended for reactive apps", c: "Deprecated in 7.0 docs, @Deprecated in 7.1, removal planned for 8.0" }
  - { aspect: "Spring Boot 4.1 gives you", a: "A prototype RestClient.Builder", b: "A prototype WebClient.Builder", c: "A RestTemplateBuilder, no RestTemplate bean" }
  - { aspect: "Default HTTP library in Boot", a: "Apache, Jetty, Reactor Netty, then JDK", b: "Reactor Netty, Jetty, Apache, then JDK", c: "Same detection as RestClient" }
verdict: "New blocking code: RestClient, or an @HttpExchange interface on it. Reactive or streaming: WebClient. Existing RestTemplate code: wrap it with RestClient.create(restTemplate) and migrate step by step."
