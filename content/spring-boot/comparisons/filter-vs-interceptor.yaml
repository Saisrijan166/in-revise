id: filter-vs-interceptor
tech: spring-boot
title: "Servlet Filter vs HandlerInterceptor"
compares: [servlet-filter, handler-interceptor]
gist:
  - "Servlet API: wraps every request before DispatcherServlet"
  - "Spring MVC: wraps the chosen handler inside DispatcherServlet"
diagrams:
  - |
    flowchart LR
      R([Request]) --> F[Filter] --> D[DispatcherServlet] --> C[Controller]
  - |
    flowchart LR
      D[DispatcherServlet] --> P[preHandle] --> C[Controller] --> Q[postHandle]
diagramAlt: "Filter: the request passes the filter first, then DispatcherServlet, then the controller. Interceptor: inside DispatcherServlet, preHandle runs, then the controller, then postHandle."
rows:
  - { aspect: "Belongs to", a: "Servlet API (jakarta.servlet.Filter)", b: "Spring MVC (HandlerInterceptor)" }
  - { aspect: "Runs", a: "Before and after the whole servlet, for every request", b: "Around the handler chosen by a HandlerMapping" }
  - { aspect: "Hooks", a: "doFilter: one method around the chain", b: "preHandle, postHandle, afterCompletion" }
  - { aspect: "Can", a: "Wrap or replace the request and response", b: "See the handler; stop the call from preHandle" }
  - { aspect: "Register in Boot", a: "A Filter bean (mapped to /*) or a FilterRegistrationBean", b: "WebMvcConfigurer.addInterceptors, with path patterns" }
  - { aspect: "Good for", a: "Logging, compression, request IDs, security", b: "Handler-aware checks and shared handler code" }
verdict: "Use a filter for anything about the raw request or every URL; use an interceptor when the logic needs the matched handler; use Spring Security for access control."
