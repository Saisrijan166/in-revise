---
id: session-vs-jwt
tech: spring-boot
title: Session Login vs JWT
compares: [session-login, jwt-resource-server]
gist:
  - "The server keeps the login; a cookie points to it"
  - "The token carries the login; the server keeps nothing"
explain:
  - "With session login, the server stores the logged-in user in an HTTP session after login. The browser gets a session cookie and sends it back, so later requests find the same user."
  - "With a JWT, an authorization server issues a signed token that says who the user is. The client sends it in the Authorization header on every request, and the API verifies the signature itself."
example: "The payment web app with its own backend uses form login: one server, one session cookie, and logout ends the session at once. The payment API called by the mobile app and three other services accepts JWTs, so any of its five instances can check a request without a shared session store."
rows:
  - { aspect: "Where the login lives", a: "On the server, in the HTTP session", b: "In the signed token the client holds" }
  - { aspect: "Sent as", a: "A session cookie, added by the browser", b: "An Authorization: Bearer header" }
  - { aspect: "Logout", a: "Invalidate the session, and it takes effect at once", b: "The token works until it expires, unless you add a deny list" }
  - { aspect: "CSRF protection", a: "Needed, because the browser sends the cookie by itself", b: "Not needed for tokens sent in a header" }
  - { aspect: "Several instances", a: "Need sticky sessions or a shared session store", b: "Any instance can check the token alone" }
verdict: "Sessions suit a browser app with its own backend; JWTs suit APIs called by many clients and instances. Neither is always better."
sayIt: "A session keeps the login on the server and the browser sends a cookie, so logout is instant but instances must share sessions. A JWT carries the signed login, so any instance can verify it alone, but it stays valid until it expires."
