title: Session Login vs JWT
compares: [session-login, jwt-resource-server]
gist:
  - "The server keeps the login; a cookie points to it"
  - "The token carries the login; the server keeps nothing"
rows:
  - { aspect: "Login lives", a: "On the server, in the HTTP session", b: "In the signed token" }
  - { aspect: "Sent as", a: "Session cookie, added by the browser", b: "Authorization: Bearer header" }
  - { aspect: "Logout", a: "Invalidate the session: instant", b: "Valid until exp, unless you add a deny list" }
  - { aspect: "CSRF", a: "Needed: the cookie goes automatically", b: "Not needed for header tokens" }
  - { aspect: "Many instances", a: "Need a shared session store", b: "Any instance can check the token" }
verdict: "Sessions suit a browser app with its own backend; JWTs suit APIs called by many clients. Neither is always better."
