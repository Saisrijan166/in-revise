---
id: session-vs-jwt
tech: spring-boot
title: Session Login vs JWT Bearer Token
compares: [session-authentication, jwt-resource-server]
gist:
  - "The server keeps the login; the browser sends a session cookie"
  - "The client sends a signed token; the server keeps nothing"
diagrams:
  - |
    flowchart LR
      B([Browser]) -- "Cookie: JSESSIONID" --> S[App]
      S --> H[(HTTP session holds the user)]
  - |
    flowchart LR
      C([Client]) -- "Authorization: Bearer JWT" --> A[API]
      A --> K{Check signature and claims}
diagramAlt: "Session login: the browser sends the JSESSIONID cookie and the app finds the user in its HTTP session. JWT: the client sends the token in the Authorization header and the API checks the token's signature and claims, with no stored session."
rows:
  - { aspect: "Where the login lives", a: "On the server, in the HTTP session", b: "In the token; any instance can check it" }
  - { aspect: "Sent as", a: "The JSESSIONID cookie, added by the browser", b: "Authorization: Bearer header, added by the client code" }
  - { aspect: "Logout", a: "Invalidate the session: takes effect at once", b: "Valid until exp: keep it short-lived or use a jti denylist" }
  - { aspect: "CSRF", a: "Needed: the cookie is sent automatically", b: "Not needed for header tokens; Spring skips the check" }
  - { aspect: "More instances", a: "Share sessions, e.g. Spring Session with Redis", b: "No shared state needed" }
verdict: "Use a session for a browser app with its own backend; use JWTs for APIs called by many clients or services, and keep the tokens short-lived."
