id: singleton-vs-prototype
tech: spring-boot
title: Singleton vs Prototype Scope
compares: [singleton-scope, prototype-scope]
gist:
  - "One shared instance per container"
  - "A new instance every time the bean is requested"
rows:
  - { aspect: "Instances", a: "One per container and bean definition", b: "A new one for each injection or getBean() call" }
  - { aspect: "Default", a: "Yes", b: "No: set @Scope(\"prototype\")" }
  - { aspect: "Created", a: "At startup (eager), unless @Lazy", b: "Only when requested" }
  - { aspect: "Destroy callbacks", a: "Called when the context closes", b: "Never called by Spring" }
  - { aspect: "Good for", a: "Stateless beans: services, repositories", b: "Stateful objects used by one caller" }
  - { aspect: "Inside a singleton", a: "The shared instance", b: "Fixed at injection; use ObjectProvider for new ones" }
verdict: "Use singletons for stateless beans, which is almost all of them; use prototype for stateful objects and fetch them through ObjectProvider."
sources:
  - title: "Bean Scopes (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html"
    verifiedOn: "2026-10-17"
  - title: "Dependency Injection: eager pre-instantiation of singletons (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    verifiedOn: "2026-10-17"
  - title: "ObjectProvider (Spring Framework 7.0.9 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/ObjectProvider.html"
    verifiedOn: "2026-10-17"
