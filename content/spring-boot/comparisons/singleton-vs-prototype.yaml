id: singleton-vs-prototype
tech: spring-boot
title: Singleton vs Prototype Scope
compares: [singleton-scope, prototype-scope]
gist:
  - "One shared object per container"
  - "A new object every time it is requested"
explain:
  - "Singleton is the default scope: the container creates one object from the bean definition, usually at startup, and gives that same object to every class that asks for it."
  - "Prototype scope makes the container create a new object every time the bean is injected or requested with getBean. After handing it out, the container keeps no record of it."
example: "PaymentService holds no data about one payment, so it stays a singleton shared by all requests. PaymentReceipt collects lines for one payment, so it is a prototype. PaymentService gets a fresh receipt per payment from ObjectProvider<PaymentReceipt>.getObject(); a constructor parameter would give it one receipt forever."
rows:
  - { aspect: "Objects", a: "One per container and bean definition", b: "A new one per injection or getBean() call" }
  - { aspect: "Default", a: "Yes", b: "No: set @Scope(\"prototype\")" }
  - { aspect: "Created", a: "At startup, unless @Lazy", b: "Only when requested" }
  - { aspect: "Destroy callbacks", a: "Run when the context closes", b: "Never run by Spring" }
  - { aspect: "Good for", a: "Stateless services and repositories", b: "Stateful objects used by one caller" }
verdict: "Use singletons for stateless beans, which is almost all of them; use prototype for stateful objects and fetch them through ObjectProvider."
sayIt: "A singleton is one shared object per container, created at startup, so it must be stateless. A prototype is a new object per request for the bean, and Spring never calls its destroy callbacks. Injecting a prototype into a singleton happens once, so I use ObjectProvider for fresh ones."
sources:
  - title: "Bean Scopes (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html"
    verifiedOn: "2026-10-21"
