---
id: liveness-vs-readiness
tech: spring-boot
title: "Liveness vs Readiness Probe"
compares: [liveness-probe, readiness-probe]
gist:
  - "Is the app broken beyond repair? Then restart it"
  - "Can the app take traffic right now? If not, skip it"
diagrams:
  - |
    flowchart LR
      K[Kubernetes] -- "GET /actuator/health/liveness" --> A[App]
      A -- "keeps failing" --> R[Restart the container]
  - |
    flowchart LR
      K[Kubernetes] -- "GET /actuator/health/readiness" --> A[App]
      A -- "fails" --> O[Stop routing traffic to the pod]
diagramAlt: "Liveness: Kubernetes calls /actuator/health/liveness; if it keeps failing, Kubernetes restarts the container. Readiness: Kubernetes calls /actuator/health/readiness; if it fails, Kubernetes stops routing traffic to the pod but does not restart it."
rows:
  - { aspect: "Question", a: "Can the app still work correctly?", b: "Is the app ready to handle requests?" }
  - { aspect: "Path", a: "/actuator/health/liveness", b: "/actuator/health/readiness" }
  - { aspect: "When it fails", a: "Kubernetes restarts the container", b: "The pod leaves the Service endpoints; no restart" }
  - { aspect: "Spring state", a: "LivenessState: CORRECT or BROKEN", b: "ReadinessState: ACCEPTING_TRAFFIC or REFUSING_TRAFFIC" }
  - { aspect: "During startup", a: "CORRECT once the context is refreshed", b: "Refuses traffic until the runners have run" }
  - { aspect: "During graceful shutdown", a: "Stays CORRECT", b: "Turns REFUSING_TRAFFIC" }
  - { aspect: "External checks (DB, APIs)", a: "Never: one outage would restart every instance", b: "Only with care, for systems not shared by all instances" }
verdict: "Keep liveness about the app itself; use readiness to hold back traffic during startup, shutdown or overload."
sources:
