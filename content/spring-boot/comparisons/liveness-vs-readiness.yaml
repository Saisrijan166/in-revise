---
id: liveness-vs-readiness
tech: spring-boot
title: "Liveness vs Readiness"
compares: [liveness-probe, readiness-probe]
gist:
  - "Is the app broken? Then restart it"
  - "Can it take traffic now? If not, skip it"
explain:
  - "The liveness probe, /actuator/health/liveness, tells Kubernetes whether the app's own state is broken beyond repair. If it keeps failing, Kubernetes restarts the container."
  - "The readiness probe, /actuator/health/readiness, tells Kubernetes whether the app can take requests right now. If it fails, Kubernetes stops sending traffic to that pod but does not restart it."
example: "While the payment service starts and its runners warm a cache, liveness is already UP but readiness is not, so no requests arrive yet. When the database goes down, a restart would not help, so the database check is not part of liveness."
rows:
  - { aspect: "Asks", a: "Can the app still work at all?", b: "Is the app ready for requests now?" }
  - { aspect: "Path", a: "/actuator/health/liveness", b: "/actuator/health/readiness" }
  - { aspect: "On failure", a: "Kubernetes restarts the container", b: "The pod gets no traffic; no restart" }
  - { aspect: "At startup", a: "UP once the context is refreshed", b: "UP only after the runners have run" }
  - { aspect: "During graceful shutdown", a: "Stays live (state CORRECT)", b: "Switches to refusing traffic" }
  - { aspect: "External checks such as the database", a: "Avoid: an outage would restart every instance", b: "Only with care" }
verdict: "Keep liveness about the app itself; use readiness to hold back traffic while starting, shutting down or overloaded."
sayIt: "Liveness asks whether the app must be restarted; readiness asks whether it should get traffic now. I keep external checks out of liveness, because a database outage would restart every instance, and let readiness hold traffic back during startup and shutdown."
