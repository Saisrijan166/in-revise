id: beanfactory-vs-applicationcontext
tech: spring-boot
title: BeanFactory vs ApplicationContext
compares: [bean-factory, application-context]
gist:
  - "The basic container: creates and wires beans"
  - "BeanFactory plus events, messages and AOP support"
explain:
  - "BeanFactory is the basic container interface. It holds bean definitions, creates beans and injects their dependencies. Used on its own, it needs extra setup, such as registering its helper processors by hand."
  - "ApplicationContext is a sub-interface of BeanFactory. It adds events, messages in several languages, AOP integration and automatic setup of helper processors. It is the container Spring Boot creates."
example: "In the payment service you never create either one yourself: SpringApplication.run creates an ApplicationContext. That is why @PostConstruct runs and a PaymentCompleted event reaches its listeners. A bare BeanFactory would publish no events, and would not run @PostConstruct until you registered the processor for it."
rows:
  - { aspect: "What it is", a: "The root container interface", b: "A sub-interface: a complete superset" }
  - { aspect: "Helper processors", a: "You register them by hand", b: "Found and registered automatically" }
  - { aspect: "Shared beans created", a: "When first requested", b: "At startup, by default" }
  - { aspect: "Events and i18n messages", a: "Not supported", b: "Built in" }
  - { aspect: "Use it when", a: "You need full control over bean processing (rare)", b: "Almost always; Spring Boot creates one" }
verdict: "Use an ApplicationContext; a bare BeanFactory is only for rare cases that need full control over bean processing."
sayIt: "BeanFactory is the basic container that creates and wires beans. ApplicationContext extends it with events, i18n messages, AOP integration and automatic post-processor registration, and it creates singletons at startup. I always use ApplicationContext; Spring Boot creates one."
sources:
