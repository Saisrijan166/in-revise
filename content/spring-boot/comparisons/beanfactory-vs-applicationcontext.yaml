id: beanfactory-vs-applicationcontext
tech: spring-boot
title: BeanFactory vs ApplicationContext
compares: [bean-factory, application-context]
gist:
  - "The basic container: creates and wires beans"
  - "BeanFactory plus events, messages and AOP support"
rows:
  - { aspect: "What it is", a: "The root container interface", b: "A sub-interface: a complete superset" }
  - { aspect: "Post-processors", a: "Registered by hand", b: "Found and registered automatically" }
  - { aspect: "Events and i18n messages", a: "No", b: "Yes" }
  - { aspect: "Integrated lifecycle management", a: "No", b: "Yes" }
  - { aspect: "Use it when", a: "You need full control (rare)", b: "Almost always; Spring Boot creates one" }
verdict: "Use an ApplicationContext; a bare BeanFactory is only for rare cases that need full control over bean processing."
sources:
  - title: "The BeanFactory API: feature matrix (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/beanfactory.html"
    verifiedOn: "2026-10-19"
  - title: "Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html"
    verifiedOn: "2026-10-19"
