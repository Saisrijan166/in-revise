id: beanfactory-vs-applicationcontext
tech: spring-boot
title: BeanFactory vs ApplicationContext
compares: [bean-factory, application-context]
gist:
  - "The basic container: creates and wires beans on request"
  - "BeanFactory plus events, messages, AOP and eager singletons"
rows:
  - { aspect: "What it is", a: "The root container interface", b: "A sub-interface of BeanFactory: a complete superset" }
  - { aspect: "Singletons are created", a: "When first asked for with getBean()", b: "At startup (eager), unless marked @Lazy" }
  - { aspect: "Bean and bean-factory post-processors", a: "Must be registered by hand", b: "Found and registered automatically" }
  - { aspect: "Events and i18n messages", a: "No", b: "Yes: ApplicationEvent publishing and MessageSource" }
  - { aspect: "Integrated lifecycle management", a: "No", b: "Yes" }
  - { aspect: "Use it when", a: "You need full control of bean processing (rare)", b: "Almost always; Spring Boot creates one for you" }
verdict: "Use an ApplicationContext; a bare BeanFactory is only for rare cases that need full control over bean processing."
sources:
  - title: "The BeanFactory API: feature matrix (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/beanfactory.html"
    verifiedOn: "2026-10-17"
  - title: "Introduction to the Spring IoC Container and Beans (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html"
    verifiedOn: "2026-10-17"
  - title: "Lazy-initialized Beans (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-lazy-init.html"
    verifiedOn: "2026-10-17"
  - title: "Spring Interview Questions, Q7: BeanFactory vs ApplicationContext (Baeldung)"
    url: "https://www.baeldung.com/spring-interview-questions"
    verifiedOn: "2026-10-17"
