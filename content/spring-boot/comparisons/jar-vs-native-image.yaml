---
id: jar-vs-native-image
tech: spring-boot
title: "JVM Jar vs GraalVM Native Image"
compares: [executable-jar, native-images]
gist:
  - "Bytecode that a JVM loads and optimises while it runs"
  - "A platform-specific executable, compiled ahead of time"
diagrams:
  - |
    flowchart LR
      J[app.jar] --> V[JVM: load classes, wire beans, warm up] --> R[Running app]
  - |
    flowchart LR
      B[Build: Spring AOT + GraalVM] --> X[Executable] --> R[Running app, no JVM]
diagramAlt: "JVM jar: app.jar is started by a JVM, which loads classes, wires beans and warms up before the app runs at full speed. Native image: the build runs Spring AOT and GraalVM to make an executable, which runs without a JVM."
rows:
  - { aspect: "Needs at run time", a: "A JVM", b: "Nothing: no JVM is shipped" }
  - { aspect: "Startup and memory", a: "Slower start, more memory", b: "Much faster start, smaller memory footprint" }
  - { aspect: "Peak performance", a: "The JIT optimises hot code after warm-up", b: "Fast at once, but fewer optimisations after warm-up" }
  - { aspect: "Build", a: "Quick, with a normal JDK (17+ for Spring Boot 4)", b: "Heavy and slow; GraalVM 25+ for Spring Boot 4" }
  - { aspect: "Dynamic Java", a: "Reflection, proxies and classpath changes just work", b: "Needs hints; classpath and beans fixed at build time" }
  - { aspect: "Good fit", a: "Most services, long-running apps", b: "Functions (FaaS), scale-to-zero, many small containers" }
verdict: "Stay on the JVM by default, with an AOT cache for faster starts; go native when startup time and memory per instance really matter."
