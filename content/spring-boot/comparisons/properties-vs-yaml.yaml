id: properties-vs-yaml
tech: spring-boot
title: application.properties vs application.yml
compares: [application-properties-file, application-yaml-file]
gist:
  - "Flat key=value lines; the full key on every line"
  - "Keys nested by indentation; shorter for deep settings"
rows:
  - { aspect: "Shape", a: "server.port=8080", b: "server: then port: 8080 indented under it" }
  - { aspect: "Several documents in one file", a: "Split with #---", b: "Split with ---" }
  - { aspect: "@PropertySource, @TestPropertySource", a: "Can load it", b: "Cannot load it" }
  - { aspect: "Both in the same folder", a: "Wins", b: "Loses" }
  - { aspect: "Needs", a: "Nothing extra", b: "SnakeYAML, which spring-boot-starter brings" }
verdict: "Same keys, same Environment, different syntax. Pick one format per app: YAML for deep or list-heavy settings, properties for flat ones."
sources:
  - { title: "Externalized Configuration: Working With YAML, Multi-document Files (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-19" }
  - { title: "Spring Boot Interview Questions: where to define properties (InterviewBit)", url: "https://www.interviewbit.com/spring-boot-interview-questions/", verifiedOn: "2026-10-19" }
