id: properties-vs-yaml
tech: spring-boot
title: application.properties vs application.yml
compares: [application-properties-file, application-yaml-file]
gist:
  - "Flat key=value lines; the full key on every line"
  - "Keys nested by indentation; shorter for deep settings"
explain:
  - "application.properties is a plain text file with one setting per line, written as the full key, an equals sign and the value, such as server.port=8080."
  - "application.yml holds the same settings in YAML, where each part of the key sits on its own indented line, so shared prefixes such as app.payment are written only once."
example: "The payment service needs app.payment.currency=INR and app.payment.max-retries=5. In properties both lines repeat app.payment. In YAML you write app:, then payment: indented under it, then currency: INR and max-retries: 5 indented under that. Both files give the Environment the same two keys."
rows:
  - { aspect: "Shape", a: "Each line holds the full key, such as server.port=8080", b: "Indentation builds the key: port: 8080 sits under server:" }
  - { aspect: "Several documents in one file", a: "Split with a #--- line", b: "Split with a --- line" }
  - { aspect: "Loaded by @PropertySource or @TestPropertySource", a: "Yes (single-document files only)", b: "No, YAML cannot be loaded this way" }
  - { aspect: "Both in the same folder", a: "Its values win", b: "Its values lose" }
  - { aspect: "Needs", a: "Nothing extra", b: "SnakeYAML, which spring-boot-starter already brings" }
verdict: "Same keys, same Environment, different syntax. Pick one format per app: YAML for deep or list-heavy settings, properties for flat ones."
sayIt: "Both files feed the same keys into the same Environment; only the syntax differs. Properties repeat the full key on each line, YAML nests keys by indentation. I pick one per app, and if both exist in one folder, properties win."
sources:
  - { title: "Externalized Configuration: Working With YAML, Multi-document Files (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-21" }
  - { title: "Spring Boot Interview Questions: where to define properties (InterviewBit)", url: "https://www.interviewbit.com/spring-boot-interview-questions/", verifiedOn: "2026-10-19" }
