id: properties-vs-yaml
tech: spring-boot
title: application.properties vs application.yaml
compares: [properties-format, yaml-format]
gist:
  - "Flat key=value lines; the full key on every line"
  - "Keys nested by indentation; shorter for deep settings"
rows:
  - { aspect: "Shape", a: "server.port=8080, one full key per line", b: "server: on one line, port: 8080 indented under it" }
  - { aspect: "Lists", a: "Indexed keys: my.servers[0]=a, my.servers[1]=b", b: "Dash items under the key: - a, - b" }
  - { aspect: "Several documents in one file", a: "Split with #--- (or !---)", b: "Split with ---" }
  - { aspect: "@PropertySource, @TestPropertySource", a: "Can load it", b: "Cannot load it" }
  - { aspect: "Both in the same folder", a: "Wins", b: "Loses" }
  - { aspect: "Needs", a: "Nothing extra", b: "SnakeYAML, which spring-boot-starter brings" }
  - { aspect: "Common slip", a: "Long, repeated key prefixes", b: "Indentation mistakes" }
verdict: "Both load the same keys into the same Environment. Pick one format per app: YAML for deep or list-heavy settings, properties for flat ones."
sources:
  - { title: "Externalized Configuration: Working With YAML, Multi-document Files (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/features/external-config.html", verifiedOn: "2026-10-17" }
  - { title: "How-to: Use YAML for External Properties (Spring Boot 4.1.1)", url: "https://docs.spring.io/spring-boot/how-to/properties-and-configuration.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Boot Interview Questions: Q16 properties or YAML (Baeldung)", url: "https://www.baeldung.com/spring-boot-interview-questions", verifiedOn: "2026-10-17" }
