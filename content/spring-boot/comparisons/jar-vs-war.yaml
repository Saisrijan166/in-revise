  - { aspect: "Layout", a: "BOOT-INF/classes and BOOT-INF/lib", b: "WEB-INF/classes, WEB-INF/lib and WEB-INF/lib-provided" }
  - { aspect: "Launcher (java -jar)", a: "JarLauncher", b: "WarLauncher" }
  - { aspect: "WebFlux apps", a: "Supported", b: "Not supported" }
verdict: "Default to the executable jar; build a war only when you must deploy into an existing servlet container."
