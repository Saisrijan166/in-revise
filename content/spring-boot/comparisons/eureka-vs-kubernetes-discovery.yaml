id: eureka-vs-kubernetes-discovery
tech: spring-boot
title: Eureka vs Kubernetes Service Discovery
compares: [eureka-server, kubernetes-discovery]
gist:
  - "A registry app that services register with and heartbeat to"
  - "Kubernetes tracks the Pods; callers use a Service's DNS name"
diagrams:
  - |
    flowchart LR
      S[orders] -- "register, heartbeat" --> E[(Eureka)]
      C[checkout] -- "fetch list, pick one" --> S
  - |
    flowchart LR
      C[checkout] -- "http://orders" --> SVC[Service orders]
      SVC --> P1[Pod 1]
      SVC --> P2[Pod 2]
diagramAlt: "Eureka: the orders service registers and sends heartbeats to Eureka; checkout fetches the list and picks an orders instance itself. Kubernetes: checkout calls http://orders, the orders Service, which forwards to one of its Pods."
rows:
  - { aspect: "Registry", a: "A Eureka server you deploy and run", b: "Built into Kubernetes: Services and their endpoints" }
  - { aspect: "How instances join", a: "Each app registers and renews every 30 s", b: "Pods that match the Service's label selector" }
  - { aspect: "Finding an instance", a: "Cached registry plus Spring Cloud LoadBalancer", b: "DNS name to the Service IP; kube-proxy picks a Pod" }
  - { aspect: "Code in each service", a: "The Eureka client starter", b: "None; Spring Cloud Kubernetes adds a DiscoveryClient if needed" }
  - { aspect: "Where it works", a: "Any platform: VMs, containers, Kubernetes", b: "Only inside a Kubernetes cluster" }
verdict: "On Kubernetes, use its Services and DNS; use Eureka when services run outside Kubernetes."
sources:
  - { title: "Spring Cloud Netflix 5.0.2 reference: Eureka client and server", url: "https://docs.spring.io/spring-cloud-netflix/reference/spring-cloud-netflix.html", verifiedOn: "2026-10-17" }
  - { title: "Service (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/services-networking/service/", verifiedOn: "2026-10-17" }
  - { title: "DNS for Services and Pods (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/", verifiedOn: "2026-10-17" }
  - { title: "Virtual IPs and Service Proxies: kube-proxy (Kubernetes docs)", url: "https://kubernetes.io/docs/reference/networking/virtual-ips/", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud Kubernetes 5.0.3: DiscoveryClient for Kubernetes", url: "https://docs.spring.io/spring-cloud-kubernetes/reference/discovery-client.html", verifiedOn: "2026-10-17" }
