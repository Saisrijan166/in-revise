---
id: command-line-runner-vs-application-runner
tech: spring-boot
title: CommandLineRunner vs ApplicationRunner
compares: [command-line-runner, application-runner]
gist:
  - "Gets the raw arguments as typed, in a String array"
  - "Gets ApplicationArguments with options already parsed"
explain:
  - "CommandLineRunner is an interface for a bean that runs once at the end of startup. Its run method gets the program arguments exactly as typed, as a String array."
  - "ApplicationRunner is the same startup hook, but its run method gets ApplicationArguments, which has already split --name=value options from plain arguments."
example: "The payment service starts with --seed=demo report.txt. A CommandLineRunner sees [\"--seed=demo\", \"report.txt\"] and must parse the first string itself. An ApplicationRunner calls args.getOptionValues(\"seed\") and gets [demo], and args.getNonOptionArgs() gives [report.txt]."
rows:
  - { aspect: "Method", a: "run(String... args)", b: "run(ApplicationArguments args)" }
  - { aspect: "For --seed=demo", a: "You split the string yourself", b: "containsOption(\"seed\") is true; getOptionValues gives [demo]" }
  - { aspect: "When it runs", a: "Once, after all beans exist, just before run() returns", b: "The same" }
  - { aspect: "Ordering several", a: "With @Order or the Ordered interface", b: "The same" }
verdict: "Same timing and ordering. Pick ApplicationRunner when you read --name=value options; otherwise either works."
sayIt: "Both run once at the end of startup, after all beans exist and before the app is ready. CommandLineRunner gets the raw String arguments; ApplicationRunner gets ApplicationArguments with options parsed, so I use it when I read --name=value flags."
sources:
  - title: "SpringApplication: using the ApplicationRunner or CommandLineRunner (Spring Boot 4.1.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/features/spring-application.html"
    verifiedOn: "2026-10-21"
---
