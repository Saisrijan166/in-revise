---
id: entity-vs-dto
tech: spring-boot
title: "Entity vs DTO"
compares: [jpa-entities, dto]
gist:
  - "The database's shape: the table, its relations, all fields"
  - "The API's shape: only what the client sends or sees"
explain:
  - "An entity is a class that JPA maps to a database table, such as Payment. It holds every column, including internal ones, and its relations to other entities, and JPA tracks its changes."
  - "A DTO (data transfer object) is a plain class or record for one API call, such as PaymentRequest or PaymentResponse. It holds only the fields a client may send or see, and nothing tracks it."
example: "The Payment entity has id, amount, status, cardToken and fraudScore. GET /payments/42 returns a PaymentResponse with only id, amount and status, so the card token never appears in the JSON, and renaming the fraudScore column changes nothing for clients."
rows:
  - { aspect: "Models", a: "A database table and its relations", b: "The request or response of one API call" }
  - { aspect: "Used in", a: "The repository and service layers", b: "The controller and service layers" }
  - { aspect: "Holds", a: "Every column, including internal fields such as a card token", b: "Only the fields chosen for this call" }
  - { aspect: "Managed by", a: "JPA: changes are tracked and relations can load lazily", b: "Nobody: a plain object or Java record" }
  - { aspect: "Changes when", a: "The database schema changes", b: "The API contract changes" }
verdict: "Use entities for persistence and DTOs at the API edge; map between them in the service."
sayIt: "The entity is the persistence model, mapped to a table and managed by JPA. The DTO is the API contract with only the fields a client should send or see. Keeping them apart hides internal fields, blocks mass assignment and lets the schema change without breaking clients."
sources:
