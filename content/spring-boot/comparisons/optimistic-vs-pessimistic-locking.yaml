---
id: optimistic-vs-pessimistic-locking
tech: spring-boot
title: Optimistic vs Pessimistic Locking
compares: [optimistic-locking, pessimistic-locking]
gist:
  - "No lock: detect the conflict when saving, then retry"
  - "Lock the row when reading; others wait"
explain:
  - "Optimistic locking adds a @Version field to the entity. Every update checks that the version is still the one you read and increases it. If someone else saved first, the update fails, so a lost update is detected instead of hidden."
  - "Pessimistic locking asks the database to lock the row when you read it, with select ... for update. Other transactions that want the row wait until you commit, so a lost update cannot happen at all."
example: "Two refunds of 300 hit account 7 (balance 1000) at once. Optimistic: both read version 3; the first saves 700 and version 4, the second fails and retries, reading 700 and saving 400. Pessimistic: the second refund's read waits until the first commits, then reads 700 and saves 400."
rows:
  - { aspect: "How you add it", a: "A @Version field on the entity", b: "@Lock(PESSIMISTIC_WRITE) on a repository query" }
  - { aspect: "Database locks while you work", a: "None", b: "A row lock until the transaction ends" }
  - { aspect: "When two writers clash", a: "The second gets an exception and its transaction rolls back", b: "The second waits, or times out" }
  - { aspect: "Cost", a: "Retries when conflicts happen", b: "Waiting, and a risk of deadlocks" }
  - { aspect: "Best for", a: "Rare conflicts and many readers", b: "Busy rows where a retry is costly" }
verdict: "Default to optimistic locking with @Version; lock pessimistically only in short transactions on rows that many writers update at once."
sayIt: "Optimistic locking uses a @Version field: no locks, and a stale update fails so I retry. Pessimistic locking runs select for update, so others wait. I default to optimistic and use pessimistic only for short transactions on busy rows."
