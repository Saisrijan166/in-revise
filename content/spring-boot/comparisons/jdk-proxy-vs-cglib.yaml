id: jdk-proxy-vs-cglib
tech: spring-boot
title: JDK Dynamic Proxy vs CGLIB Proxy
compares: [jdk-dynamic-proxy, cglib-proxy]
gist:
  - "Implements the bean's interfaces"
  - "Generates a subclass of the bean's class"
explain:
  - "A JDK dynamic proxy is built into Java. It is a new object that implements the same interfaces as your bean, so Spring can hand it out wherever that interface is asked for and run advice on interface methods."
  - "A CGLIB proxy is a class generated at runtime that extends your bean's class and overrides its methods. It lets Spring proxy a class that has no interface, and callers can inject the class type itself."
example: "PaymentService has no interface. Spring Boot makes a CGLIB subclass, PaymentService$$SpringCGLIB$$0, and the controller injects PaymentService directly. If PaymentService implemented a Payments interface and you set spring.aop.proxy-target-class=false, the proxy would be a JDK proxy and the controller would have to inject Payments."
diagrams:
  - |
    flowchart LR
      P["JDK proxy"] -- implements --> I["Payments interface"]
      S[PaymentService] -- implements --> I
      P -- "calls" --> S
  - |
    flowchart LR
      P["CGLIB subclass of PaymentService"] -- extends --> S[PaymentService]
      P -- "calls super method" --> S
diagramAlt: "JDK proxy: the proxy and PaymentService both implement the Payments interface, and the proxy calls PaymentService. CGLIB proxy: a generated class extends PaymentService and calls the real methods after running the advice."
rows:
  - { aspect: "Needs", a: "At least one interface on the bean", b: "A class that is not final" }
  - { aspect: "Methods it can advise", a: "Only methods declared in the interfaces", b: "Any method that is not final or private" }
  - { aspect: "Can you inject the class type?", a: "No, only the interface", b: "Yes, because the proxy is a subclass" }
  - { aspect: "Final class", a: "No problem, nothing is subclassed", b: "Startup fails: the class cannot be extended" }
  - { aspect: "Used by default in", a: "Plain Spring Framework, when the bean has an interface", b: "Spring Boot, through spring.aop.proxy-target-class=true" }
verdict: "Keep Spring Boot's CGLIB default; just do not make advised classes or methods final."
sayIt: "A JDK proxy implements the bean's interfaces, so only interface methods are advised and you inject the interface. CGLIB generates a subclass, so no interface is needed, but final classes and final or private methods cannot be proxied. Spring Boot uses CGLIB by default."
sources:
  - title: "Proxying Mechanisms (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/proxying.html"
    verifiedOn: "2026-10-21"
  - title: "Aspect Oriented Programming (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/features/aop.html"
    verifiedOn: "2026-10-21"
