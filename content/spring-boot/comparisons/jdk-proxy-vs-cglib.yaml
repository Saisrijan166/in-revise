id: jdk-proxy-vs-cglib
tech: spring-boot
title: JDK Dynamic Proxy vs CGLIB Proxy
compares: [jdk-dynamic-proxy, cglib-proxy]
gist:
  - "Implements the bean's interfaces"
  - "Generates a subclass of the bean's class"
diagrams:
  - |
    flowchart LR
      I[["OrderApi (interface)"]] -. implemented by .-> P1[JDK proxy]
      I -. implemented by .-> T1[OrderServiceImpl]
      P1 -- calls --> T1
  - |
    flowchart LR
      S2["CGLIB proxy (a subclass of OrderService)"] -- calls --> T2[Real OrderService object]
diagramAlt: "JDK proxy: the proxy and the real OrderServiceImpl both implement the OrderApi interface, and the proxy calls the real object. CGLIB: the proxy is a generated subclass of OrderService, and it calls the real OrderService object."
rows:
  - { aspect: "Built by", a: "The JDK itself", b: "CGLIB, repackaged inside spring-core" }
  - { aspect: "Needs", a: "At least one interface on the bean", b: "A class that is not final" }
  - { aspect: "Methods that can be advised", a: "Public interface methods only", b: "Public, protected, package-visible; not final or private" }
  - { aspect: "Inject as the concrete class", a: "No: the proxy only implements the interfaces", b: "Yes: the proxy is a subclass" }
  - { aspect: "Used by default", a: "Core Spring, when the bean has interfaces", b: "Spring Boot auto-proxying; core Spring when there is no interface" }
  - { aspect: "Spring Boot switch", a: "spring.aop.proxy-target-class=false", b: "spring.aop.proxy-target-class=true (the default)" }
verdict: "Keep Spring Boot's CGLIB default, which works with or without interfaces; just avoid final on classes and methods that need advice."
sources:
