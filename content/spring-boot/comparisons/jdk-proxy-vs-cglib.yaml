id: jdk-proxy-vs-cglib
tech: spring-boot
title: JDK Dynamic Proxy vs CGLIB Proxy
compares: [jdk-dynamic-proxy, cglib-proxy]
gist:
  - "Implements the bean's interfaces"
  - "Generates a subclass of the bean's class"
rows:
  - { aspect: "Needs", a: "At least one interface on the bean", b: "A class that is not final" }
  - { aspect: "Advised methods", a: "Interface methods only", b: "Any method that is not final or private" }
  - { aspect: "Inject as the concrete class", a: "No, only as the interface", b: "Yes, the proxy is a subclass" }
  - { aspect: "Default", a: "Core Spring, when the bean has an interface", b: "Spring Boot (proxy-target-class=true)" }
verdict: "Keep Spring Boot's CGLIB default; just do not make advised classes or methods final."
sources:
  - title: "Proxying Mechanisms (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/proxying.html"
    verifiedOn: "2026-10-19"
  - title: "Aspect Oriented Programming (Spring Boot 4.1 reference)"
    url: "https://docs.spring.io/spring-boot/reference/features/aop.html"
    verifiedOn: "2026-10-19"
