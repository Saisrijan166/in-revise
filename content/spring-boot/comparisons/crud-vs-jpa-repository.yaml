---
id: crud-vs-jpa-repository
tech: spring-boot
title: CrudRepository vs PagingAndSortingRepository vs JpaRepository
compares: [crud-repository, paging-and-sorting-repository, jpa-repository]
gist:
  - "Basic CRUD for any store; lists as Iterable"
  - "Only findAll with Sort or Pageable"
  - "JPA: List CRUD, paging, flush, batch deletes"
explain:
  - "CrudRepository is Spring Data's basic interface for any store, such as JPA, JDBC or MongoDB: save, findById, findAll, count and deleteById. Methods that return many entities return Iterable."
  - "PagingAndSortingRepository adds only findAll(Sort) and findAll(Pageable). Since Spring Data 3.0 it no longer extends CrudRepository, so on its own it has no save or findById."
  - "JpaRepository is the JPA module's interface. It includes the CRUD and paging methods, returning List, and adds JPA extras: flush, saveAndFlush, batch deletes and getReferenceById."
example: "PaymentRepository extends JpaRepository<Payment, Long>, so PaymentService gets findAll(PageRequest.of(0, 20)) and saveAndFlush. An AuditLogRepository that must never delete can extend plain Repository and declare only findById and findAll, which Spring Data still implements."
rows:
  - { aspect: "Extends", a: "Repository", b: "Repository, not CrudRepository", c: "ListCrudRepository and ListPagingAndSortingRepository" }
  - { aspect: "CRUD methods", a: "save, findById, findAll, delete", b: "None of its own", c: "All of them, returning List" }
  - { aspect: "Paging and sorting", a: "No", b: "Yes", c: "Yes" }
  - { aspect: "JPA extras", a: "No", b: "No", c: "flush, saveAndFlush, getReferenceById" }
verdict: "Extend JpaRepository in a JPA app; use CrudRepository to expose fewer methods or stay store-neutral."
sayIt: "CrudRepository gives basic CRUD for any Spring Data store. PagingAndSortingRepository adds only sorted and paged findAll, and since Spring Data 3 it no longer extends CrudRepository. JpaRepository combines both with List results and adds JPA extras such as flush and getReferenceById."
