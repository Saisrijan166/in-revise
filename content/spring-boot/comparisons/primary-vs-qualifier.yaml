id: primary-vs-qualifier
tech: spring-boot
title: "@Primary vs @Qualifier"
compares: [primary-annotation, qualifier-annotation]
gist:
  - "On the bean: the default when several match"
  - "At the injection point: use this one here"
explain:
  - "@Primary goes on a bean, such as EmailSender. It says: when several beans of my type fit and nothing else decides, use me. It sets one default for the whole app."
  - "@Qualifier goes on an injection point, such as a constructor parameter. It names the bean this one place needs, such as smsSender, and filters the candidates before @Primary is checked."
example: "EmailSender and SmsSender both implement NotificationSender, and EmailSender is @Primary. NotificationService injects NotificationSender with no qualifier and gets EmailSender. OtpService must send texts, so its parameter has @Qualifier(\"smsSender\") and gets SmsSender, even though EmailSender is primary."
rows:
  - { aspect: "Goes on", a: "The bean class or @Bean method", b: "The field or parameter (and optionally the bean)" }
  - { aspect: "Decides for", a: "Every injection point of that type", b: "Only this injection point" }
  - { aspect: "When both apply", a: "Loses", b: "Wins, because it filters the candidates first" }
  - { aspect: "How many per type", a: "Exactly one, or the choice is ambiguous again", b: "Any number: a filter, not a unique id" }
verdict: "Mark the usual bean @Primary; add @Qualifier only where a class needs a different one."
sayIt: "@Primary goes on a bean and sets the default when several of one type match. @Qualifier goes on the injection point and picks the exact bean for that place. When both apply, @Qualifier wins, because it narrows the candidates first."
sources:
  - title: "Using @Primary or @Fallback (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-primary.html"
    verifiedOn: "2026-10-19"
  - title: "Fine-tuning Annotation-based Autowiring with Qualifiers (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html"
    verifiedOn: "2026-10-19"
