---
id: controller-vs-restcontroller
tech: spring-boot
title: "@Controller vs @RestController"
compares: [controller-annotation, restcontroller-annotation]
gist:
  - "Returns a view name; the server renders an HTML page"
  - "Returns data; a converter writes it to the body as JSON"
diagrams:
  - |
    flowchart LR
      C["@Controller"] -- "'users'" --> V[ViewResolver]
      V --> H[HTML page]
  - |
    flowchart LR
      R["@RestController"] -- "User object" --> M[HttpMessageConverter]
      M --> J[JSON body]
diagramAlt: "@Controller: the method returns the view name 'users', a ViewResolver finds the template, and an HTML page is rendered. @RestController: the method returns a User object, and an HttpMessageConverter writes it to the response body as JSON."
rows:
  - { aspect: "What it is", a: "Stereotype for a web controller", b: "@Controller plus @ResponseBody" }
  - { aspect: "A return value means", a: "A view name, unless the method has @ResponseBody", b: "The response body" }
  - { aspect: "Who writes the response", a: "ViewResolver and a view (template)", b: "HttpMessageConverter, e.g. Jackson for JSON" }
  - { aspect: "Typical use", a: "Server-rendered pages, e.g. Thymeleaf", b: "REST APIs for browser apps, phones, other services" }
  - { aspect: "Since", a: "Spring 2.5", b: "Spring 4.0" }
verdict: "Use @RestController for APIs; use @Controller when the server renders HTML, and add @ResponseBody to the odd method that returns data."
