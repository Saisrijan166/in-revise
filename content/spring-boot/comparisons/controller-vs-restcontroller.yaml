---
id: controller-vs-restcontroller
tech: spring-boot
title: "@Controller vs @RestController"
compares: [controller-annotation, rest-controller]
gist:
  - "Returns a view name; the server renders HTML"
  - "Returns data; a converter writes it as JSON"
diagrams:
  - |
    flowchart LR
      C["@Controller"] -- "'users'" --> V[ViewResolver]
      V --> H[HTML page]
  - |
    flowchart LR
      R["@RestController"] -- "User object" --> M[HttpMessageConverter]
      M --> J[JSON body]
diagramAlt: "@Controller: the method returns the view name 'users', a ViewResolver finds the template and an HTML page is rendered. @RestController: the method returns a User object and an HttpMessageConverter writes it to the body as JSON."
rows:
  - { aspect: "What it is", a: "Web controller stereotype", b: "@Controller + @ResponseBody" }
  - { aspect: "A return value means", a: "A view name, unless the method has @ResponseBody", b: "The response body" }
  - { aspect: "Who writes the response", a: "ViewResolver and a template", b: "HttpMessageConverter, e.g. Jackson" }
  - { aspect: "Typical use", a: "Server-rendered pages, e.g. Thymeleaf", b: "REST APIs for apps and other services" }
verdict: "Use @RestController for APIs; use @Controller when the server renders HTML."
