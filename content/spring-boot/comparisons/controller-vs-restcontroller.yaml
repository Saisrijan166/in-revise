---
id: controller-vs-restcontroller
tech: spring-boot
title: "@Controller vs @RestController"
compares: [controller-annotation, rest-controller]
gist:
  - "Returns a view name; the server renders an HTML page"
  - "Returns data; a converter writes it into the body as JSON"
explain:
  - "@Controller marks a web controller class. By default a method's return value is the name of a view, and a template engine such as Thymeleaf renders that view as an HTML page for the browser."
  - "@RestController is @Controller plus @ResponseBody. Every method's return value is the response body itself, written by a message converter, usually as JSON for apps and other services."
example: "A @Controller method in an admin site returns \"payments\", and Thymeleaf renders payments.html with a table of payments. The PaymentController of the API is a @RestController: its get method returns a PaymentResponse, and the client receives {\"id\": 42, \"amount\": 500.00, \"status\": \"PAID\"}."
diagrams:
  - |
    flowchart LR
      C["@Controller"] -- "'payments'" --> V[ViewResolver]
      V --> H[HTML page]
  - |
    flowchart LR
      R["@RestController"] -- "PaymentResponse" --> M[HttpMessageConverter]
      M --> J[JSON body]
diagramAlt: "@Controller: the method returns the view name 'payments', a ViewResolver finds the template and an HTML page is rendered. @RestController: the method returns a PaymentResponse object and an HttpMessageConverter writes it to the body as JSON."
rows:
  - { aspect: "What it is", a: "The web controller stereotype", b: "@Controller with @ResponseBody on every method" }
  - { aspect: "A return value means", a: "A view name, unless the method has @ResponseBody", b: "The response body itself" }
  - { aspect: "Who writes the response", a: "A ViewResolver and a template engine", b: "An HttpMessageConverter, such as Jackson for JSON" }
  - { aspect: "Typical client", a: "A browser showing server-rendered pages", b: "Mobile apps, single-page apps and other services" }
verdict: "Use @RestController for APIs that return data; use @Controller when the server renders HTML pages."
sayIt: "@RestController is @Controller plus @ResponseBody. In a @Controller a returned String is a view name that a template renders as HTML; in a @RestController the return value is written to the body as JSON. I use @RestController for APIs."
sources:
