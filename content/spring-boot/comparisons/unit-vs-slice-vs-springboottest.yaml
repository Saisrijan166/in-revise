---
id: unit-vs-slice-vs-springboottest
tech: spring-boot
title: "Unit Test vs Slice Test vs @SpringBootTest"
compares: [unit-test, test-slices, full-context-test]
gist:
  - "One class, fakes around it, no Spring"
  - "One layer of Spring, such as web or JPA"
  - "The whole app context, every bean"
explain:
  - "A unit test creates one class with new and passes fakes for its dependencies. It checks that class's logic in milliseconds, with no Spring at all."
  - "A slice test, such as @WebMvcTest or @DataJpaTest, starts Spring with only one layer's beans and auto-configuration. It checks that layer's wiring: URL mappings, JSON, queries."
  - "@SpringBootTest starts the whole application context, as in production. It checks that beans, configuration, transactions and the database work together."
example: "For the payment service: PaymentServiceTests checks the PAID status rule with Mockito only; PaymentControllerTests (@WebMvcTest) checks that GET /payments/1 returns JSON with a fake service; one PaymentFlowTests (@SpringBootTest) pays through the real controller, service and database."
rows:
  - { aspect: "Starts", a: "Nothing: you call new", b: "One layer's beans and auto-configuration", c: "Every bean and all auto-configuration" }
  - { aspect: "Typical tools", a: "JUnit with Mockito", b: "@WebMvcTest, @DataJpaTest, @JsonTest", c: "@SpringBootTest" }
  - { aspect: "Speed", a: "Fastest", b: "Fast", c: "Slowest" }
  - { aspect: "Catches", a: "Mistakes in business logic", b: "Wrong mappings, JSON or queries", c: "Beans, config and database not fitting together" }
  - { aspect: "How many to write", a: "Many", b: "Some", c: "A few" }
verdict: "Write many unit tests, slice tests for each layer, and a few @SpringBootTest tests for whole flows."
sayIt: "A unit test checks one class with mocks and no Spring. A slice like @WebMvcTest starts one layer to test its wiring. @SpringBootTest starts everything and checks it all fits, so I keep only a few of those, because they are slow."
