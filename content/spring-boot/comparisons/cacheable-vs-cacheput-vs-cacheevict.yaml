id: cacheable-vs-cacheput-vs-cacheevict
tech: spring-boot
title: "@Cacheable vs @CachePut vs @CacheEvict"
compares: [cacheable-annotation, cache-put-annotation, cache-evict-annotation]
gist:
  - "Read: on a hit, skip the method"
  - "Write: always run the method, store the result"
  - "Delete: remove one entry, or all of them"
explain:
  - "@Cacheable goes on a read method. Spring looks in the cache first; on a hit it returns the stored value and the method does not run. On a miss it runs the method and stores the result."
  - "@CachePut goes on an update method. The method always runs, and its return value replaces the cache entry, so later reads see the new data without a database query."
  - "@CacheEvict goes on a delete or change method. After the method runs, Spring removes the entry for that key, or every entry with allEntries = true, so the next read loads fresh data."
example: "In the payment service, find(42) is @Cacheable: the second call returns the stored PaymentResponse with no SQL. complete(42) is @CachePut: it runs and stores the COMPLETED response. cancel(42) is @CacheEvict: it removes entry 42, so the next find(42) goes to the database."
rows:
  - { aspect: "Does the method run?", a: "Only on a miss", b: "Always", c: "Always" }
  - { aspect: "Cache after the call", a: "Result stored, on a miss", b: "Result stored or replaced", c: "Entry removed" }
  - { aspect: "Typical method", a: "find by id", b: "update", c: "delete" }
  - { aspect: "Useful option", a: "sync = true lets one thread load a miss", b: "key = \"#id\" names the entry to replace", c: "allEntries = true clears the whole cache" }
verdict: "@Cacheable on reads, @CachePut on updates that return the new value, @CacheEvict on deletes; never put @Cacheable and @CachePut on the same method."
sayIt: "@Cacheable checks the cache first and skips the method on a hit. @CachePut always runs the method and stores its result. @CacheEvict removes the entry. So reads use @Cacheable, updates @CachePut, deletes @CacheEvict."
sources:
  - title: "Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html"
    verifiedOn: "2026-10-21"
