id: cacheable-vs-cacheput-vs-cacheevict
tech: spring-boot
title: "@Cacheable vs @CachePut vs @CacheEvict"
compares: [cacheable-annotation, cache-put-annotation, cache-evict-annotation]
gist:
  - "Read: on a hit, skip the method"
  - "Write: always run the method, store the result"
  - "Delete: remove one entry, or all of them"
rows:
  - { aspect: "Method runs", a: "Only on a miss", b: "Always", c: "Always" }
  - { aspect: "Cache after the call", a: "Result stored on a miss", b: "Result stored or replaced", c: "Entry removed" }
  - { aspect: "Typical method", a: "findById", b: "update", c: "delete" }
  - { aspect: "Useful option", a: "sync = true: one thread loads a miss", b: "key = \"#product.id\" from an argument", c: "allEntries = true" }
verdict: "@Cacheable on reads, @CachePut on updates, @CacheEvict on deletes; never @Cacheable and @CachePut on one method."
sources:
  - title: "Declarative Annotation-based Caching (Spring Framework 7.0.9 reference)"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html"
    verifiedOn: "2026-10-19"
