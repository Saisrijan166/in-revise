id: valid-vs-validated
tech: spring-boot
title: "@Valid vs @Validated"
compares: [valid-annotation, validated-annotation]
gist:
  - "Jakarta standard: validate this object and cascade into nested ones"
  - "Spring's variant: adds validation groups and method validation"
rows:
  - { aspect: "Comes from", a: "jakarta.validation (Jakarta Validation 3.1)", b: "org.springframework.validation.annotation" }
  - { aspect: "Validation groups", a: "No: the Default group is checked", b: "Yes: @Validated(OnCreate.class)" }
  - { aspect: "Allowed on", a: "Fields, methods, constructors, parameters, type uses", b: "Classes, methods, parameters" }
  - { aspect: "Nested objects", a: "Yes: put @Valid on the field to cascade", b: "No: nested fields still need @Valid" }
  - { aspect: "On a @RequestBody", a: "Works", b: "Works, with optional groups" }
  - { aspect: "On a class", a: "Not allowed", b: "Turns on method validation for that bean, through a proxy" }
verdict: "Use @Valid on request bodies and nested fields; use @Validated when you need groups, or on a service class to validate its method parameters."
