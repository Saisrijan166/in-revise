  - "Servlet level: wraps every HTTP request"
  - "Spring MVC level: wraps the chosen controller call"
  - "Method level: wraps calls to Spring bean methods"
diagrams:
  - |
    flowchart LR
      R([Request]) --> F[Filter] --> D[DispatcherServlet]
  - |
    flowchart LR
      D[DispatcherServlet] --> P[preHandle] --> C[Controller]
  - |
    flowchart LR
      C[Controller] --> X[AOP proxy] --> S[Service method]
diagramAlt: "Filter: the request passes the filter before DispatcherServlet. Interceptor: inside DispatcherServlet, preHandle runs before the controller. AOP: the controller calls the service through an AOP proxy that wraps the method."
rows:
  - { aspect: "Belongs to", a: "Servlet API (jakarta.servlet.Filter)", b: "Spring MVC (HandlerInterceptor)", c: "Spring AOP (aspects and proxies)" }
  - { aspect: "Wraps", a: "The whole request and response", b: "The handler a HandlerMapping chose", c: "A bean method call" }
  - { aspect: "Knows", a: "Raw request and response", b: "The request and the handler", c: "The method and its arguments" }
  - { aspect: "Good for", a: "Logging, request IDs, security, CORS", b: "Handler-aware checks and timing", c: "Transactions, custom timing or auditing" }
verdict: "Use a filter for anything about the raw request, an interceptor when you need the matched handler, and AOP for logic around business methods."
