---
id: filter-vs-interceptor-vs-aop
tech: spring-boot
title: "Filter vs Interceptor vs AOP"
compares: [servlet-filter, handler-interceptor, spring-aop]
gist:
  - "Servlet level: wraps every HTTP request"
  - "Spring MVC level: wraps the chosen controller call"
  - "Method level: wraps calls to Spring bean methods"
explain:
  - "A servlet filter is part of the Servlet API. It wraps every HTTP request before and after DispatcherServlet and sees the raw request and response, so it suits request IDs, logging and security."
  - "A HandlerInterceptor is part of Spring MVC. It runs inside DispatcherServlet around the controller method that was chosen, so it can use knowledge of that handler, for example to time payment endpoints only."
  - "AOP wraps calls to Spring bean methods through a proxy. It knows the method and its arguments but nothing about HTTP, so it suits business concerns such as transactions or auditing on a service."
example: "In the payment service, RequestIdFilter adds X-Request-Id to every response, even a 404 for an unknown URL. PaymentTimingInterceptor runs only for /payments/** handlers. @Transactional on PaymentService.create is AOP: it wraps the method call, whether a controller or a scheduled job calls it."
diagrams:
  - |
    flowchart LR
      R([Request]) --> F[Filter] --> D[DispatcherServlet]
  - |
    flowchart LR
      D[DispatcherServlet] --> P[preHandle] --> C[Controller]
  - |
    flowchart LR
      C[Controller] --> X[AOP proxy] --> S[Service method]
diagramAlt: "Filter: the request passes the filter before DispatcherServlet. Interceptor: inside DispatcherServlet, preHandle runs before the controller. AOP: the controller calls the service through an AOP proxy that wraps the method."
rows:
  - { aspect: "Belongs to", a: "The Servlet API (jakarta.servlet.Filter)", b: "Spring MVC (HandlerInterceptor)", c: "Spring AOP (aspects and proxies)" }
  - { aspect: "Wraps", a: "The whole request and response", b: "The handler that a HandlerMapping chose", c: "One call to a bean method" }
  - { aspect: "Can see", a: "The raw request and response", b: "The request and the chosen handler", c: "The method and its arguments" }
  - { aspect: "Good for", a: "Logging, request IDs, security, CORS", b: "Checks and timing that depend on the handler", c: "Transactions, custom timing or auditing" }
verdict: "Use a filter for anything about the raw request, an interceptor when you need the matched handler, and AOP for logic around business methods."
sayIt: "A filter is a Servlet component that wraps every request before Spring MVC. An interceptor is a Spring MVC hook around the chosen controller method. AOP wraps Spring bean method calls, like transactions on a service. Outside to inside: filter, interceptor, AOP."
