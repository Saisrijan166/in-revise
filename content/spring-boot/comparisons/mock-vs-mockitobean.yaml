---
id: mock-vs-mockitobean
tech: spring-boot
title: "@Mock vs @MockitoBean"
compares: [mock-annotation, mockito-bean]
gist:
  - "A Mockito fake that lives only in the test class"
  - "A Mockito fake that replaces a bean in Spring"
explain:
  - "@Mock comes from Mockito. It creates a fake object for a field of the test class, and @InjectMocks passes it into the class under test. No Spring is involved."
  - "@MockitoBean comes from Spring Framework 6.2+. It creates a Mockito fake and puts it into the test's application context in place of the real bean, so Spring injects it wherever that bean is needed."
example: "PaymentServiceTests builds PaymentService itself, so @Mock PaymentRepository is enough. PaymentControllerTests is a @WebMvcTest, where Spring builds PaymentController, so the PaymentService it needs must be a @MockitoBean."
rows:
  - { aspect: "Comes from", a: "Mockito", b: "Spring Framework 6.2 and later" }
  - { aspect: "Spring context", a: "None", b: "The test's application context" }
  - { aspect: "Who injects the fake", a: "@InjectMocks, in the test", b: "Spring, into every bean that needs it" }
  - { aspect: "Used in", a: "Plain unit tests", b: "@WebMvcTest, @DataJpaTest, @SpringBootTest" }
  - { aspect: "Speed", a: "Fast", b: "Slower; a new set of fakes can start a new context" }
verdict: "Use @Mock when you create the object yourself; use @MockitoBean when Spring creates it."
sayIt: "@Mock is Mockito's fake, used when I create the class under test myself. @MockitoBean replaces a bean inside the Spring test context, so I use it in slice or full tests where Spring builds the object. It replaced Boot's removed @MockBean."
sources:
