---
id: mvc-vs-webflux-vs-virtual-threads
tech: spring-boot
title: "Spring MVC vs WebFlux vs MVC on Virtual Threads"
compares: [mvc-servlet-stack, webflux-stack, mvc-virtual-threads]
gist:
  - "A pooled thread per request; blocking is fine"
  - "A few event-loop threads; code must never block"
  - "A new virtual thread per request; blocking is cheap"
explain:
  - "Spring MVC runs on the Servlet API. Each request holds one thread from a pool until its response is written, so code may block, but the pool size limits how many requests can wait at once."
  - "WebFlux is Spring's reactive stack. A small, fixed set of event-loop threads serves all requests, and code returns Mono or Flux instead of waiting, so a single blocking call stalls many requests."
  - "MVC on virtual threads keeps Spring MVC code but runs each request on a virtual thread (Java 21+). Waiting is cheap because the JVM frees the real thread underneath while the virtual one waits."
example: "The payment service waits 300 ms on the fraud service for each payment. On plain MVC, 200 such requests fill Tomcat's default pool. On WebFlux, the code must be rewritten with WebClient and Mono. With spring.threads.virtual.enabled=true, the same MVC code can keep many more requests waiting at once."
rows:
  - { aspect: "Threads", a: "A platform thread pool (Tomcat: at most 200 by default)", b: "A small, fixed number of threads", c: "One virtual thread per request, never pooled" }
  - { aspect: "Code style", a: "Plain imperative code", b: "Reactive: Mono, Flux and operators", c: "Plain imperative code" }
  - { aspect: "JPA or JDBC", a: "Fine", b: "A poor fit, because those calls block", c: "Fine" }
  - { aspect: "Turn on with", a: "spring-boot-starter-webmvc", b: "spring-boot-starter-webflux", c: "spring.threads.virtual.enabled=true (Java 21+)" }
  - { aspect: "Makes each request faster?", a: "No", b: "No: it scales, it is not faster", c: "No: more requests in flight, not faster ones" }
verdict: "Default to Spring MVC; turn on virtual threads when many requests wait on I/O; pick WebFlux for streaming or an end-to-end reactive stack."
sayIt: "Spring MVC holds one pooled thread per request, so blocking is fine but the pool limits concurrency. WebFlux uses a few event-loop threads and must never block. Virtual threads keep plain MVC code and make waiting cheap, which is often the simplest way to scale."
