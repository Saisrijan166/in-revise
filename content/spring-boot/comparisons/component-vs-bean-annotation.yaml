id: component-vs-bean-annotation
tech: spring-boot
title: "@Component vs @Bean"
compares: [component-annotation, bean-annotation]
gist:
  - "On your class: scanning finds it, Spring calls new"
  - "On a method: your code builds the object"
diagrams:
  - |
    flowchart LR
      S[Component scanning] -- finds --> C["@Service InvoiceService"]
      C -- "Spring calls the constructor" --> B1((bean))
  - |
    flowchart LR
      K["@Configuration class"] -- runs --> M["@Bean Clock clock()"]
      M -- "returns object" --> B2((bean))
diagramAlt: "@Component: component scanning finds the annotated class, and Spring calls its constructor to make the bean. @Bean: Spring runs the clock() method in a @Configuration class, and the returned object becomes the bean."
rows:
  - { aspect: "Goes on", a: "A class", b: "A method, usually in a @Configuration class" }
  - { aspect: "Found by", a: "Component scanning", b: "Processing the configuration class" }
  - { aspect: "Who builds the object", a: "Spring calls the constructor", b: "Your method body" }
  - { aspect: "Best for", a: "Your own classes", b: "Library classes, or objects that need setup code" }
  - { aspect: "Default bean name", a: "Class name, first letter lower-case", b: "The method name" }
verdict: "Annotate your own classes with @Component or a stereotype; use @Bean for classes you cannot annotate or that need code to build."
sources:
  - title: "Classpath Scanning and Managed Components (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html"
    verifiedOn: "2026-10-19"
  - title: "Using the @Bean Annotation (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/java/bean-annotation.html"
    verifiedOn: "2026-10-19"
