id: retry-vs-circuit-breaker
tech: spring-boot
title: "@Retry vs @CircuitBreaker"
compares: [retry-annotation, circuit-breaker-annotation]
gist:
  - "Try the failed call again, betting the fault is brief"
  - "Stop calling a failing service for a while and fail fast"
rows:
  - { aspect: "Assumes", a: "The fault is short, a blip", b: "The fault lasts, an outage" }
  - { aspect: "On a failure", a: "Waits, then calls again (3 attempts, 500 ms apart by default)", b: "Records it; opens at 50% failures over 100 calls by default" }
  - { aspect: "Load on the sick service", a: "Adds more calls", b: "Removes calls while open" }
  - { aspect: "Caller waits", a: "Longer with each attempt", b: "Not at all while open: CallNotPermittedException" }
  - { aspect: "Default order", a: "Outermost aspect", b: "Inside Retry, around the rest" }
verdict: "Use both: retry rides out brief blips, the breaker stops calls during an outage, and retries should stop once the breaker reports open."
sources:
  - { title: "Retry (Resilience4j docs)", url: "https://resilience4j.readme.io/docs/retry", verifiedOn: "2026-10-17" }
  - { title: "CircuitBreakerConfig.java defaults (Resilience4j source, GitHub)", url: "https://github.com/resilience4j/resilience4j/blob/master/resilience4j-circuitbreaker/src/main/java/io/github/resilience4j/circuitbreaker/CircuitBreakerConfig.java", verifiedOn: "2026-10-17" }
  - { title: "Getting started with resilience4j-spring-boot: aspect order (Resilience4j docs)", url: "https://resilience4j.readme.io/docs/getting-started-3", verifiedOn: "2026-10-17" }
  - { title: "Circuit Breaker pattern: different purpose than Retry (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker", verifiedOn: "2026-10-17" }
