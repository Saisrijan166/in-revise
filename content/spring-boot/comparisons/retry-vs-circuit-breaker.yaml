id: retry-vs-circuit-breaker
tech: spring-boot
title: "Retry vs Circuit Breaker"
compares: [retry-annotation, circuit-breaker-annotation]
gist:
  - "Call again, betting the fault is brief"
  - "Stop calling a failing service for a while"
explain:
  - "A retry calls a failed operation again after a short wait, a few times. It solves faults that last a moment, such as one dropped connection or a brief timeout."
  - "A circuit breaker counts recent failures, and past a threshold it stops calling for a while and fails at once. It protects the caller's threads and gives a sick service room to recover."
example: "One fraud-check call times out once: a retry 500 ms later succeeds and the customer notices nothing. Fraud-check is down for 10 minutes: retries would triple the load and the waiting, so the breaker opens and the payment goes to manual review at once."
rows:
  - { aspect: "Assumes", a: "A short blip", b: "A lasting outage" }
  - { aspect: "On a failure", a: "Waits, then calls again", b: "Counts it; opens past the failure-rate threshold" }
  - { aspect: "Load on the sick service", a: "Adds calls", b: "Removes calls while open" }
  - { aspect: "Caller waits", a: "Longer with each attempt", b: "Not at all while open: fails fast" }
  - { aspect: "Resilience4j default", a: "3 attempts in total, 500 ms apart", b: "Opens at 50% failures over 100 calls" }
verdict: "Use both: retry for blips, the breaker for outages, and stop retrying once the breaker is open."
sayIt: "Retry bets the fault is brief and calls again; a circuit breaker assumes an outage and stops calling for a while, failing fast. I combine them: retry outside, breaker inside, and I do not retry once the breaker is open."
sources:
  - { title: "Circuit Breaker pattern: different purpose than Retry (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker", verifiedOn: "2026-10-19" }
  - { title: "Retry (Resilience4j docs)", url: "https://resilience4j.readme.io/docs/retry", verifiedOn: "2026-10-19" }
  - { title: "CircuitBreakerConfig.java defaults (Resilience4j source, GitHub)", url: "https://github.com/resilience4j/resilience4j/blob/master/resilience4j-circuitbreaker/src/main/java/io/github/resilience4j/circuitbreaker/CircuitBreakerConfig.java", verifiedOn: "2026-10-19" }
