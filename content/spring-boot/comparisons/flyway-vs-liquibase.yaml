id: flyway-vs-liquibase
tech: spring-boot
title: Flyway vs Liquibase
compares: [flyway, liquibase]
gist:
  - "Versioned SQL files, run once each in version order"
  - "Changesets in XML, YAML, JSON or SQL, listed in a changelog"
rows:
  - { aspect: "Change files", a: "V<version>__<name>.sql, mostly plain SQL", b: "Changesets in a changelog: XML, YAML, JSON or SQL" }
  - { aspect: "Boot default location", a: "classpath:db/migration", b: "db/changelog/db.changelog-master.yaml" }
  - { aspect: "Order", a: "By version number", b: "By position in the changelog" }
  - { aspect: "History table", a: "flyway_schema_history, with checksums", b: "DATABASECHANGELOG, plus DATABASECHANGELOGLOCK" }
  - { aspect: "Database-independent changes", a: "No: you write SQL for your database", b: "Yes, with change types in XML, YAML or JSON" }
  - { aspect: "Undo", a: "Undo (U) scripts need Flyway Teams", b: "rollback command; automatic for some change types" }
  - { aspect: "Boot 4 starter", a: "spring-boot-starter-flyway", b: "spring-boot-starter-liquibase" }
verdict: "Pick Flyway for simple, SQL-first migrations; pick Liquibase for database-independent changes or rollback in the free edition."
