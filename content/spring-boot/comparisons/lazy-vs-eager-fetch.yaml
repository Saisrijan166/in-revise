---
id: lazy-vs-eager-fetch
tech: spring-boot
title: LAZY vs EAGER Fetching
compares: [lazy-fetch, eager-fetch]
gist:
  - "Load on first access; only a hint"
  - "Load with the owner; a rule the provider must follow"
explain:
  - "LAZY means a linked entity is not loaded with its owner. JPA puts a stand-in object (a proxy) or an unloaded collection in its place and runs a query on first use. It saves work when the data is not needed. To JPA it is only a hint."
  - "EAGER means the linked entity must be loaded whenever its owner loads, through a join or an extra select. The data is always there, but it is loaded even when nobody uses it."
example: "Payment has a @ManyToOne Customer customer. With LAZY, a query for 100 payments runs once, and customers load only if the code reads them. With EAGER, the same JPQL query runs, and then Hibernate at once runs extra selects for the customers, even for a screen that shows only amounts."
rows:
  - { aspect: "When the link loads", a: "When the code first reads it", b: "Together with the owner, every time" }
  - { aspect: "JPA 3.2 default for", a: "@OneToMany and @ManyToMany", b: "@ManyToOne and @OneToOne" }
  - { aspect: "Must the provider obey?", a: "No, it is only a hint", b: "Yes, it is a requirement" }
  - { aspect: "Main risk", a: "N+1 queries; LazyInitializationException", b: "Loading unused data; extra selects in JPQL queries" }
verdict: "Map associations LAZY, including @ManyToOne, and fetch per query with JOIN FETCH or @EntityGraph."
sayIt: "LAZY loads an association on first use; EAGER loads it with the owner every time. JPA defaults to-one links to EAGER and to-many links to LAZY. I map everything LAZY and fetch what each query needs with JOIN FETCH or @EntityGraph."
