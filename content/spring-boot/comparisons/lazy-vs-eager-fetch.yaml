---
id: lazy-vs-eager-fetch
tech: spring-boot
title: LAZY vs EAGER Fetching
compares: [lazy-fetch, eager-fetch]
gist:
  - "Load the association on first access; only a hint to the provider"
  - "Load it together with the owner; a rule the provider must follow"
diagrams:
  - |
    flowchart LR
      A["find author"] --> Q1[("select author")]
      A -. "getBooks() later" .-> Q2[("select books")]
  - |
    flowchart LR
      B["find book"] --> Q[("select book and its author")]
diagramAlt: "LAZY: finding an author selects only the author; the books are selected later, when the code first reads them. EAGER: finding a book also loads its author right away."
rows:
  - { aspect: "Loads the association", a: "On first access", b: "Together with the owner" }
  - { aspect: "JPA 3.2 default for", a: "@OneToMany, @ManyToMany", b: "@ManyToOne, @OneToOne" }
  - { aspect: "Binding on the provider", a: "No, only a hint", b: "Yes, a requirement" }
  - { aspect: "Risk", a: "N+1 queries; LazyInitializationException outside the context", b: "Loads data you do not need, every time the entity loads" }
  - { aspect: "Hibernate 7's advice", a: "Use for almost all associations", b: "Avoid; never on @ManyToMany" }
verdict: "Map every association LAZY, including @ManyToOne and @OneToOne, and fetch what each use case needs with JOIN FETCH or @EntityGraph."
