---
id: spring-framework-vs-mvc-vs-boot
tech: spring-boot
title: Spring Framework vs Spring MVC vs Spring Boot
compares: [spring-framework, spring-mvc, spring-boot-project]
gist:
  - "The core: container, DI, data access, transactions"
  - "Spring's Servlet-based web framework, one module"
  - "Spring set up for you and ready to run"
explain:
  - "Spring Framework is the base: the container that creates and connects beans, plus support for data access, transactions and AOP. Every other Spring project builds on it."
  - "Spring MVC is the web module of Spring Framework (spring-webmvc). It receives HTTP requests through one servlet and calls the matching controller method."
  - "Spring Boot is a separate project on top of Spring. It picks compatible libraries, creates the common beans through auto-configuration and runs the app with an embedded server."
example: "The payment service uses all three. PaymentService and its transactions come from Spring Framework. PaymentController with @GetMapping is Spring MVC. Spring Boot chose the library versions, set up Spring MVC and Tomcat on port 8080, and lets you start everything with java -jar."
rows:
  - { aspect: "What it is", a: "The base framework", b: "A web module of Spring (spring-webmvc)", c: "A layer built on top of Spring" }
  - { aspect: "Main job", a: "Create and connect beans", b: "Send HTTP requests to controller methods", c: "Pick libraries, create common beans, run the app" }
  - { aspect: "Setup", a: "You declare the beans yourself", b: "You configure it, or Boot does it for you", c: "Auto-configured; your own beans win" }
  - { aspect: "Web server", a: "None of its own", b: "Runs inside a servlet container", c: "Embedded Tomcat or Jetty, started by java -jar" }
verdict: "Not either-or: Spring MVC is part of Spring, and Boot sets up Spring and Spring MVC for you. Start new apps with Boot."
sayIt: "They are layers, not rivals. Spring Framework is the core container and its modules, Spring MVC is its web module, and Spring Boot sets both up and runs them, with starters, auto-configuration and an embedded server."
