---
id: hasrole-vs-hasauthority
tech: spring-boot
title: hasRole vs hasAuthority
compares: [has-role, has-authority]
gist:
  - "Adds ROLE_: hasRole(\"ADMIN\") needs ROLE_ADMIN"
  - "Exact match: hasAuthority(\"ADMIN\") needs ADMIN"
rows:
  - { aspect: "Looks for", a: "\"ROLE_\" plus the name you pass", b: "Exactly the string you pass" }
  - { aspect: "Pass", a: "\"ADMIN\", not \"ROLE_ADMIN\"", b: "\"ROLE_ADMIN\", \"orders:write\" or \"SCOPE_read\"" }
  - { aspect: "Typical use", a: "Coarse job roles: ADMIN, USER", b: "Fine permissions and OAuth2 scopes" }
  - { aspect: "Granted with", a: "User.withUsername(...).roles(\"ADMIN\")", b: "User.withUsername(...).authorities(\"orders:write\")" }
  - { aspect: "Change the prefix", a: "A GrantedAuthorityDefaults bean", b: "Not affected: no prefix" }
verdict: "Both read the same GrantedAuthority list: use hasRole for ROLE_ names and hasAuthority for everything else, including JWT scopes."
