---
id: hasrole-vs-hasauthority
tech: spring-boot
title: hasRole vs hasAuthority
compares: [has-role, has-authority]
gist:
  - "Adds ROLE_: hasRole(\"ADMIN\") needs ROLE_ADMIN"
  - "Exact match: hasAuthority(\"ADMIN\") needs ADMIN"
explain:
  - "hasRole checks for a role, which in Spring Security is an authority whose name starts with ROLE_. You pass the name without the prefix, and Spring adds ROLE_ before comparing."
  - "hasAuthority checks for an authority by its exact name, with nothing added. Use it for fine permissions such as payments:refund and for OAuth2 scopes such as SCOPE_payments.write."
example: "An admin logs in, and roles(\"ADMIN\") stored the authority ROLE_ADMIN. hasRole(\"ADMIN\") and hasAuthority(\"ROLE_ADMIN\") both allow them; hasAuthority(\"ADMIN\") denies them. Writing hasRole(\"ROLE_ADMIN\") in authorizeHttpRequests fails at startup with IllegalArgumentException, because Spring adds the prefix itself."
rows:
  - { aspect: "Looks for", a: "ROLE_ followed by the name you pass", b: "Exactly the string you pass" }
  - { aspect: "What you pass", a: "\"ADMIN\"; in the URL rules \"ROLE_ADMIN\" is rejected", b: "\"ROLE_ADMIN\", \"payments:refund\" or \"SCOPE_payments.write\"" }
  - { aspect: "Typical use", a: "Coarse job roles such as ADMIN and USER", b: "Fine permissions and OAuth2 scopes" }
  - { aspect: "Changing the prefix", a: "Define a GrantedAuthorityDefaults bean", b: "Not affected, because no prefix is added" }
verdict: "Both read the same authority list: use hasRole for ROLE_ names, and hasAuthority for everything else, including JWT scopes."
sayIt: "Both check the user's authorities. hasRole(\"ADMIN\") adds the ROLE_ prefix and looks for ROLE_ADMIN; hasAuthority checks the exact string, so I use it for fine permissions and JWT scopes like SCOPE_payments.write."
sources:
