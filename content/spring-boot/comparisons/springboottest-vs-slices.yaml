id: springboottest-vs-slices
tech: spring-boot
title: "@SpringBootTest vs @WebMvcTest vs @DataJpaTest"
compares: [full-context-test, web-mvc-test, data-jpa-test]
gist:
  - "Starts the whole app: every bean, all auto-configuration"
  - "Starts only the web layer; you mock the services"
  - "Starts only JPA: entities, repositories, a test database"
diagrams:
  - |
    flowchart LR
      T[Test] --> C[Controller] --> S[Service] --> R[Repository] --> D[(Database)]
  - |
    flowchart LR
      T[Test] -- MockMvc --> C[Controller] --> M[Mock service]
  - |
    flowchart LR
      T[Test] --> R[Repository] --> D[(Test database)]
diagramAlt: "@SpringBootTest: the test reaches the controller, the real service, the repository and the database. @WebMvcTest: the test calls the controller through MockMvc, and the controller talks to a mock service. @DataJpaTest: the test calls the repository, which talks to a test database."
rows:
  - { aspect: "Loads", a: "Every bean, through SpringApplication", b: "Controllers, advice, filters, interceptors, converters", c: "@Entity classes and Spring Data JPA repositories" }
  - { aspect: "Left out", a: "Nothing", b: "@Service, @Repository and other @Component beans", c: "The web layer and other @Component beans" }
  - { aspect: "Server", a: "None by default (MOCK); RANDOM_PORT starts a real one", b: "None: MockMvc calls the DispatcherServlet", c: "None" }
  - { aspect: "Database", a: "The app's configured DataSource", b: "None", c: "An embedded one if on the classpath, or a container" }
  - { aspect: "Rollback", a: "Only if the test is @Transactional and has no real server", b: "No database to roll back", c: "Every test runs in a transaction that rolls back" }
  - { aspect: "Typical test", a: "A whole flow, end to end", b: "Mapping, validation, JSON and status codes", c: "Queries, mappings and constraints" }
verdict: "Write many unit and slice tests, and a few @SpringBootTest tests for whole flows; share their configuration so Spring reuses cached contexts."
