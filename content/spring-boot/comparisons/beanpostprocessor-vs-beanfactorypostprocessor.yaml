id: beanpostprocessor-vs-beanfactorypostprocessor
tech: spring-boot
title: BeanPostProcessor vs BeanFactoryPostProcessor
compares: [bean-post-processor, bean-factory-post-processor]
gist:
  - "Changes bean instances, before and after each bean's init"
  - "Changes bean definitions, before any regular bean is created"
rows:
  - { aspect: "Works on", a: "Bean instances (objects)", b: "Bean definitions (metadata)" }
  - { aspect: "Runs", a: "Around the init callbacks of every bean", b: "Once, before regular beans are instantiated" }
  - { aspect: "Typical job", a: "Inject @Autowired, wrap beans in AOP proxies", b: "Fill ${...} placeholders in definitions" }
  - { aspect: "Built-in example", a: "AutowiredAnnotationBeanPostProcessor", b: "PropertySourcesPlaceholderConfigurer" }
  - { aspect: "Can return", a: "The bean, or a wrapper such as a proxy", b: "Nothing: it edits the definitions in place" }
verdict: "Change bean objects with a BeanPostProcessor; change the recipes, before any bean exists, with a BeanFactoryPostProcessor."
sources:
  - title: "Container Extension Points (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-extension.html"
    verifiedOn: "2026-10-17"
  - title: "The BeanFactory API: AutowiredAnnotationBeanPostProcessor (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/beanfactory.html"
    verifiedOn: "2026-10-17"
  - title: "BeanFactoryPostProcessor: void postProcessBeanFactory, definitions not instances (Spring Framework 7.0.9 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/beans/factory/config/BeanFactoryPostProcessor.html"
    verifiedOn: "2026-10-17"
  - title: "AbstractAutoProxyCreator (Spring Framework 7.0.9 API)"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/aop/framework/autoproxy/AbstractAutoProxyCreator.html"
    verifiedOn: "2026-10-17"
