---
id: authentication-vs-authorization
tech: spring-boot
title: Authentication vs Authorization
compares: [authentication-flow, authorization-rules]
gist:
  - "Who are you? Check the credentials and store the user"
  - "What may you do? Check the user's authorities"
diagrams:
  - |
    flowchart LR
      R([Request with credentials]) --> M[AuthenticationManager]
      M --> S[(SecurityContextHolder)]
  - |
    flowchart LR
      S[(SecurityContextHolder)] --> A{AuthorizationManager}
      A -- allow --> C([Controller])
      A -- deny --> D([403])
diagramAlt: "Authentication: a request with credentials goes to the AuthenticationManager, and the authenticated user is stored in the SecurityContextHolder. Authorization: the AuthorizationManager reads that user from the SecurityContextHolder and either lets the request reach the controller or denies it with 403."
rows:
  - { aspect: "Question", a: "Who is calling?", b: "Is this caller allowed to do this?" }
  - { aspect: "Order", a: "First, in the login filters", b: "After it, in AuthorizationFilter or a method proxy" }
  - { aspect: "Main types", a: "AuthenticationManager, AuthenticationProvider, UserDetailsService", b: "AuthorizationManager, authorizeHttpRequests, @PreAuthorize" }
  - { aspect: "Result", a: "An Authentication in the SecurityContextHolder", b: "Allow, or an AccessDeniedException" }
  - { aspect: "Failure in a REST API", a: "401 Unauthorized: send valid credentials", b: "403 Forbidden: credentials are fine, access is not" }
verdict: "Authentication always comes first; authorization then decides using the authorities that authentication found."
