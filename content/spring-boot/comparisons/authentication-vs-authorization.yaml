---
id: authentication-vs-authorization
tech: spring-boot
title: Authentication vs Authorization
compares: [authentication-flow, authorization-rules]
gist:
  - "Who are you? Check the credentials, store the user"
  - "What may you do? Check the user's authorities"
explain:
  - "Authentication proves who the caller is, for example by checking a username and password or a token. In Spring Security, the login filters do it and store the result in the SecurityContext."
  - "Authorization decides whether that known caller may do this action, such as refunding a payment. Spring Security checks it with URL rules and @PreAuthorize, using the authorities found at login."
example: "A customer logs in with the right password: authentication succeeds. They then call POST /payments/42/refund, which needs ROLE_ADMIN. They are known but not allowed, so authorization fails with 403. A caller with a wrong password never gets that far and receives 401."
rows:
  - { aspect: "Question", a: "Who is calling?", b: "Is this caller allowed to do this?" }
  - { aspect: "When it runs", a: "First, in the login filters", b: "After it, in AuthorizationFilter or a @PreAuthorize proxy" }
  - { aspect: "Main Spring types", a: "AuthenticationManager and UserDetailsService", b: "authorizeHttpRequests and @PreAuthorize" }
  - { aspect: "Result", a: "An Authentication stored in the SecurityContext", b: "Allowed, or an AccessDeniedException" }
  - { aspect: "Failure status", a: "401 Unauthorized", b: "403 Forbidden" }
verdict: "Authentication always comes first; authorization then decides using the authorities it found."
sayIt: "Authentication checks who the caller is, from a password or token, and stores the user in the SecurityContext. Authorization then checks that user's authorities against URL or method rules. A failed login gives 401; a known user without permission gets 403."
