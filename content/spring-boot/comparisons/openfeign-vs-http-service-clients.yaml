id: openfeign-vs-http-service-clients
tech: spring-boot
title: OpenFeign vs HTTP Service Clients
compares: [openfeign, cloud-http-service-clients]
gist:
  - "Spring Cloud's declarative client; feature-complete, no new features"
  - "Spring Framework's own interface clients; the suggested way forward"
diagrams:
  - |
    flowchart LR
      I["@FeignClient interface"] --> F[Feign proxy] --> LB[LoadBalancer] --> S[service]
  - |
    flowchart LR
      I["@HttpExchange interface"] --> R[RestClient or WebClient] --> LB[LoadBalancer] --> S[service]
diagramAlt: "OpenFeign: a @FeignClient interface becomes a Feign proxy that calls the service through Spring Cloud LoadBalancer. HTTP Service Clients: an @HttpExchange interface becomes a proxy on RestClient or WebClient, which Spring Cloud can also send through LoadBalancer."
rows:
  - { aspect: "Comes from", a: "Spring Cloud OpenFeign, on the Feign library", b: "Spring Framework, set up by Spring Boot" }
  - { aspect: "Method annotations", a: "Spring MVC ones: @GetMapping, @PathVariable", b: "@GetExchange, @PostExchange, @HttpExchange" }
  - { aspect: "Switch on", a: "@EnableFeignClients", b: "@ImportHttpServices (group and types or packages)" }
  - { aspect: "Runs on", a: "A Feign client", b: "RestClient (blocking) or WebClient (reactive)" }
  - { aspect: "Load balancing", a: "Client name = service id, via Spring Cloud LoadBalancer", b: "Since Spring Cloud 2025.1: group name = service id, or an lb:// base URL" }
  - { aspect: "Status", a: "Feature-complete: no new features planned", b: "Recommended by the OpenFeign docs for new code" }
verdict: "Keep Feign where it already works; write new clients as HTTP Service Clients, which Spring Cloud can also load-balance."
sources:
  - { title: "Spring Cloud OpenFeign 5.0.3 reference: feature-complete note", url: "https://docs.spring.io/spring-cloud-openfeign/reference/spring-cloud-openfeign.html", verifiedOn: "2026-10-17" }
  - { title: "REST Clients: HTTP Service Clients and groups (Spring Framework 7.0.9 reference)", url: "https://docs.spring.io/spring-framework/reference/integration/rest-clients.html", verifiedOn: "2026-10-17" }
  - { title: "Calling REST Services: HTTP Service Interface Clients (Spring Boot 4.1.1 reference)", url: "https://docs.spring.io/spring-boot/reference/io/rest-client.html", verifiedOn: "2026-10-17" }
  - { title: "Spring Cloud LoadBalancer: HTTP Service Clients integration (Spring Cloud Commons 5.0.3)", url: "https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html", verifiedOn: "2026-10-17" }
