id: jpa-vs-hibernate-vs-spring-data-jpa
tech: spring-boot
title: JPA vs Hibernate vs Spring Data JPA
compares: [jpa, hibernate, spring-data-jpa]
gist:
  - "The standard: interfaces and annotations, no engine"
  - "The engine: implements JPA and runs the SQL"
  - "The helper: writes repository classes for you"
explain:
  - "JPA (Jakarta Persistence) is a standard. It defines annotations such as @Entity and APIs such as EntityManager and JPQL, so code can map objects to tables without depending on one library. It has no engine of its own."
  - "Hibernate ORM is a library that implements JPA. It reads your entity mappings, generates SQL, runs it through JDBC and tracks the objects it loaded. It also offers features beyond the standard."
  - "Spring Data JPA is a Spring project on top of JPA. You declare a repository interface, and it generates the implementation that calls the EntityManager, including queries built from method names."
example: "PaymentService calls paymentRepository.findById(42L). The class Spring Data JPA generated calls entityManager.find(Payment.class, 42L), a JPA API. Hibernate, the JPA provider, turns that into select ... from payment where id = ? and builds the Payment object from the row."
rows:
  - { aspect: "What it is", a: "A specification (Jakarta Persistence)", b: "An ORM library that implements JPA", c: "A Spring project on top of JPA" }
  - { aspect: "You write", a: "@Entity classes, EntityManager calls, JPQL", b: "Usually nothing Hibernate-specific", c: "Repository interfaces" }
  - { aspect: "Main types", a: "EntityManager, @Entity, @Id", b: "Session, SessionFactory", c: "JpaRepository, @Query" }
  - { aspect: "Version in Boot 4.1", a: "Jakarta Persistence 3.2", b: "Hibernate ORM 7.4", c: "Spring Data JPA 4.1" }
verdict: "Code against JPA, let Hibernate run it, and use Spring Data JPA to skip the data access boilerplate."
sayIt: "JPA is the specification: annotations, EntityManager and JPQL. Hibernate is the provider that implements it and runs the SQL. Spring Data JPA sits on top and generates repositories, so I write an interface instead of EntityManager code."
