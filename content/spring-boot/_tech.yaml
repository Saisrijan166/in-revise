name: Spring Boot
slug: spring-boot
accent: green
summary: "How Spring Boot apps are wired, configured, served, stored, secured, tested and run, as of Spring Boot 4.1."
# Spring Boot code is Java only (owner's decision, 17-10-2026); System Design pairs Java with Python.
codeLanguages: [java]

# The whole tech as one story: problem → fix. Every concept sits on at least one step.
storySpine:
  - step: "Plain Spring needs many library versions and beans set up by hand → Spring Boot adds starters that pick the libraries and auto-configuration that creates the beans"
    cards: [spring-vs-spring-boot, starters, auto-configuration]
  - step: "The app must start the same way every time and run anywhere → one @SpringBootApplication main class, SpringApplication.run and an embedded web server"
    cards: [spring-boot-application, application-startup, embedded-server]
  - step: "Restarting by hand after every change is slow → DevTools restarts the app for you during development"
    cards: [devtools]
  - step: "Classes that build their own collaborators are tied together and hard to test → let the IoC container create the beans and inject what each one needs"
    cards: [ioc-container, dependency-injection, component-vs-bean]
  - step: "Beans need the right lifetime and the right partner → pick a scope, use the lifecycle callbacks, and settle ties with @Primary or @Qualifier"
    cards: [bean-scopes, bean-lifecycle, bean-selection]
  - step: "Wiring can loop, and cross-cutting code repeats everywhere → break dependency cycles, and add shared behaviour through AOP proxies"
    cards: [circular-dependencies, aop-proxies]
  - step: "Each environment needs its own URLs, ports and secrets → keep them outside the jar and let higher property sources override lower ones"
    cards: [externalized-configuration]
  - step: "Scattered @Value strings are untyped and easy to mistype → bind each prefix to a typed, validated @ConfigurationProperties class"
    cards: [configuration-properties]
  - step: "Dev and prod need different beans, settings and log output → switch them with profiles and tune logging with properties"
    cards: [profiles, logging]
  - step: "Every request needs routing, input binding, checks and clear errors → one DispatcherServlet, mapped controllers, @Valid and @ControllerAdvice"
    cards: [dispatcher-servlet, rest-controller, request-mapping, validation, exception-handling]
  - step: "Logic must run around many requests, and the app must call other services → filters, interceptors and HTTP clients"
    cards: [filters-interceptors, http-clients]
  - step: "Threads run out while requests wait on I/O → WebFlux's event loop, or plain MVC on virtual threads"
    cards: [mvc-vs-webflux, virtual-threads]
  - step: "Hand-written SQL and data-access code for every table is slow to write → map classes to tables as JPA entities and let Spring Data repositories write the queries"
    cards: [jpa-entities, spring-data-repositories]
  - step: "Lazy associations fire one query per row, and every request waits for a connection → fetch per use case and keep a small HikariCP pool"
    cards: [lazy-loading-n-plus-one, connection-pool]
  - step: "Writes must succeed or fail together, schemas drift between environments, and hot reads repeat → @Transactional with the right propagation, Flyway or Liquibase migrations, and @Cacheable"
    cards: [transactional, transaction-propagation, schema-migrations, spring-cache]
  - step: "Anyone can call any URL of the app → put a security filter chain in front of it that logs users in"
    cards: [security-filter-chain, authentication-flow]
  - step: "Stored passwords leak, and every logged-in user can reach everything → hash passwords with BCrypt and add URL and method rules"
    cards: [password-encoding, authorization-rules]
  - step: "APIs and browser apps on other origins need access without server sessions → JWT bearer tokens, with CSRF and CORS set up correctly"
    cards: [jwt-resource-server, csrf-cors]
  - step: "Changes break things nobody tested → test each layer with slices, whole flows with @SpringBootTest, real services with Testcontainers"
    cards: [spring-boot-testing, testcontainers]
  - step: "Slow or timed work holds up requests → move it to @Async methods and @Scheduled jobs"
    cards: [async-scheduling]
  - step: "The app must run anywhere, start fast and be watched → ship a jar, image or native image; watch it with Actuator and Micrometer"
    cards: [packaging-deployment, native-images, actuator, observability]
  - step: "Many services each need config, and their instances come and go → Spring Cloud with a Config Server, and Eureka or Kubernetes for discovery"
    cards: [spring-cloud-overview, config-server, service-discovery-eureka]
  - step: "Clients should not know every service, and calls between services fail → one gateway at the edge, declarative clients, circuit breakers and retries"
    cards: [spring-cloud-gateway, openfeign, resilience4j]
  - step: "Synchronous calls tie services to each other's speed and uptime → publish events to Kafka and let consumer groups share the work"
    cards: [spring-kafka]

topics:
  - { id: boot-basics, title: "Boot Basics", order: 1, blurb: "What Spring Boot adds to Spring, and how an app starts." }
  - { id: beans-di, title: "Beans and DI", order: 2, blurb: "The container, beans, and how Spring wires them together." }
  - { id: configuration, title: "Configuration", order: 3, blurb: "Properties, profiles and logging, kept outside the code." }
  - { id: web, title: "Web and REST", order: 4, blurb: "Controllers, validation, errors and HTTP clients." }
  - { id: data, title: "Data and Transactions", order: 5, blurb: "Repositories, JPA, transactions and caching." }
  - { id: security, title: "Security", order: 6, blurb: "The filter chain, logins, tokens and access rules." }
  - { id: testing-production, title: "Testing and Production", order: 7, blurb: "Tests, Actuator, metrics, packaging and background work." }
  - { id: spring-cloud, title: "Spring Cloud", order: 8, blurb: "Config, discovery, gateway, resilience and messaging for microservices." }
