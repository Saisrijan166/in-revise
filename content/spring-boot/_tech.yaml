  - id: web
    title: Web and REST
    order: 4
    blurb: The request path, controllers, validation, errors and HTTP clients.
  - id: data
    title: Data and Transactions
    order: 5
    blurb: JPA, repositories, transactions, locking and caching.
  - id: security
    title: Security
    order: 6
    blurb: The filter chain, logins, tokens and access rules.
  - id: testing-production
    title: Testing and Production
    order: 7
