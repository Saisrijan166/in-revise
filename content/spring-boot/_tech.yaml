name: Spring Boot
slug: spring-boot
accent: green
summary: How Spring Boot apps are wired, configured, served, stored, secured, tested and run, as of Spring Boot 4.1.
codeLanguages:
  - java
storySpine:
  - step: Plain Spring needs versions, beans and a server set up by hand → Spring Boot adds starters and an embedded server
    cards:
      - spring-vs-spring-boot
      - starters
      - embedded-server
  - step: Every app declares the same infrastructure beans → auto-configuration creates them, switched on by @SpringBootApplication
    cards:
      - auto-configuration
      - spring-boot-application
  - step: Some work must run once the app is up → SpringApplication.run calls your runners, then marks the app ready
    cards:
      - application-startup
  - step: Classes that build their own collaborators are tied together and hard to test → let the container create beans and inject what each one needs
    cards:
      - ioc-container
      - dependency-injection
      - circular-dependencies
  - step: The container must know which classes to manage → mark your classes with @Component, build library objects in @Bean methods, and let scanning find them
    cards:
      - component-vs-bean
      - component-scanning
  - step: Two beans fit one slot, and some beans need their own copy or setup → choose with @Primary or @Qualifier, set a scope, and use lifecycle callbacks
    cards:
      - bean-selection
      - bean-scopes
      - bean-lifecycle
  - step: Logging and transactions repeat in every class → write them once as an aspect; Spring applies it through a proxy, which this-calls skip
    cards:
      - spring-aop
      - aop-proxies
  - step: Slow, timed or fan-out work blocks the caller → @Async hands it to a thread pool, @Scheduled runs it on a timer, and events let listeners react
    cards:
      - async-scheduling
      - application-events
  - step: Each environment needs its own URLs, ports and secrets, and rebuilding per environment is slow → keep settings outside the jar and let the higher source win
    cards:
      - externalized-configuration
  - step: "@Value strings spread everywhere are untyped and unchecked → bind a prefix to one typed, validated class; switch whole setups with profiles"
    cards:
      - configuration-properties
      - profiles
  - step: println has no levels and no files → log through SLF4J and Logback, tuned with logging.level properties
    cards:
      - logging
  - step: Every endpoint repeats routing, JSON conversion and layering → one DispatcherServlet routes requests to thin @RestController methods that bind path, query and body
    cards:
      - dispatcher-servlet
      - rest-controller
      - request-mapping
      - rest-api-design
  - step: Entities leak fields, bad input slips in, and each error looks different → send DTOs, check them with @Valid, and map errors in one @RestControllerAdvice
    cards:
      - dto
      - validation
      - exception-handling
  - step: Cross-cutting code, outgoing calls and slow I/O clog the threads → filters and interceptors wrap requests, RestClient calls out, and WebFlux or virtual threads scale waiting
    cards:
      - filters-interceptors
      - http-clients
      - mvc-vs-webflux
  - step: Hand-written SQL and row mapping for every table → map entities with JPA, let Hibernate run it, and declare Spring Data repositories
    cards:
      - jpa-hibernate-spring-data
      - jpa-entities
      - spring-data-repositories
  - step: Changes and SQL seem to happen by magic → the persistence context tracks managed entities and flushes changes before commit
    cards:
      - persistence-context
  - step: A list page runs hundreds of queries, or two users overwrite each other → fetch per query to stop N+1, and add @Version locking
    cards:
      - lazy-loading-n-plus-one
      - locking
  - step: Two writes must all succeed or all fail, but an audit row must survive a rollback → @Transactional on the service, the right isolation level, and REQUIRES_NEW for the audit
    cards:
      - transactional
      - acid-isolation
      - transaction-propagation
  - step: Connections are slow to open, the same reads repeat and schemas drift → pool with HikariCP, cache with @Cacheable, version changes with Flyway
    cards:
      - connection-pool
      - spring-cache
      - schema-migrations
  - step: Every request must be checked before any controller runs → put Spring Security's filter chain in front, and know who the caller is before deciding what they may do
    cards:
      - security-filter-chain
      - authentication-flow
      - authorization-rules
  - step: A leaked user table exposes every password → store only slow, salted hashes such as bcrypt
    cards:
      - password-encoding
  - step: Many clients and instances cannot share a session, and browsers add risks of their own → stateless JWTs for APIs, CSRF tokens for cookie logins, CORS for other origins
    cards:
      - jwt-resource-server
      - csrf-cors
  - step: Starting the whole app for every test is slow, and H2 hides real database bugs → unit test with mocks, slice-test one layer, and run the real database with Testcontainers
    cards:
      - spring-boot-testing
      - mockito
      - testcontainers
  - step: A running app is a black box → expose health and metrics with Actuator, ship one executable jar, and follow requests with metrics, traces and logs
    cards:
      - actuator
      - observability
      - packaging-deployment
  - step: Each service keeps its own config and hardcoded addresses → serve config from a Config Server and find instances through a Eureka registry
    cards:
      - spring-cloud-overview
      - config-server
      - service-discovery-eureka
  - step: Clients need one door, and one failing service drags down its callers → route through Spring Cloud Gateway and guard calls with a circuit breaker and retry
    cards:
      - spring-cloud-gateway
      - resilience4j
  - step: Direct calls tie services together → publish events to Kafka, where a consumer group shares the work and idempotent listeners absorb repeats
    cards:
      - spring-kafka
topics:
