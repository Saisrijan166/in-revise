name: Git
slug: git
accent: sienna
template: 3
summary: "Git for interviews: snapshots and the three areas, branching, merge vs rebase, remotes and pull requests, undoing changes safely, stash and tags."
codeLanguages:
  - java
storySpine:
  - step: "You edit the payment service and email yourself zipped folders as backups → put the project under Git, which saves a full snapshot each time you commit"
    cards: [what-is-git, how-git-stores-data, init-and-clone]
  - step: "You want some edits in the next save but not others → move the ready files to the staging area, then commit just those"
    cards: [working-staging-repo, git-config, git-status, staging-and-add, git-commit]
  - step: "A week later you cannot tell what changed or why → read the history and the exact changes with log, diff and show"
    cards: [git-diff, git-log]
  - step: "Git keeps flagging build output and secrets as changes → list them in .gitignore, and untrack the one you already committed"
    cards: [gitignore, git-rm-and-mv]
  - step: "You must add a risky refund feature without breaking the working code → do it on its own branch and switch back any time"
    cards: [git-branches, head-and-detached-head, switching-branches]
  - step: "The refund branch is done and must go into main → merge it, and resolve the clash when both branches touched the same line"
    cards: [git-merge, merge-conflicts]
  - step: "Your branch has drifted far behind main and the history is messy → rebase it onto main for a straight line, or pick one commit across with cherry-pick"
    cards: [git-rebase, git-cherry-pick, squash-merge]
  - step: "Your teammates need your commits and you need theirs → connect a remote, then fetch, pull and push"
    cards: [git-remotes, fetch-pull-push, tracking-branches, pull-strategies]
  - step: "The team reviews every change before it reaches main → open a pull request, or fork a repo you cannot push to"
    cards: [pull-requests, forking]
  - step: "You committed to the wrong place, or want to throw away a change → undo it the safe way for your situation"
    cards: [git-restore, git-reset, git-revert, git-clean]
  - step: "You ran reset --hard and lost a good commit → find it again in the reflog and restore it"
    cards: [git-reflog]
  - step: "An urgent bug interrupts your half-done work → stash the work, fix the bug, then bring the work back; mark the release with a tag"
    cards: [git-stash, git-tags]
  - step: "An interviewer asks what a commit really is → it is an object; the .git folder stores them, and hooks can run on each one"
    cards: [git-objects, git-directory, git-hooks]
  - step: "Your last commit has a typo in the message or a forgotten file → amend it before you push"
    cards: [commit-amend]
  - step: "The team argues about how to branch and what a good commit looks like → agree on a branching strategy and small, clear commits"
    cards: [branching-strategies, good-commits]
  - step: "A bug appeared somewhere in 200 commits and nobody knows which → find who changed the line with blame, and the exact commit with bisect"
    cards: [git-blame, git-bisect]
topics:
  - { id: basics, title: "Git Basics", order: 1, blurb: "What Git is and how it stores your work." }
  - { id: changes, title: "Everyday Changes", order: 2, blurb: "Stage, commit, and read what changed." }
  - { id: branching, title: "Branching", order: 3, blurb: "Work on parallel lines without breaking main." }
  - { id: integrating, title: "Combining Work", order: 4, blurb: "Merge, rebase, and resolve conflicts." }
  - { id: remotes, title: "Remotes and GitHub", order: 5, blurb: "Share work with a team and review it." }
  - { id: undoing, title: "Undoing Changes", order: 6, blurb: "Take back changes safely, shared or not." }
  - { id: saving, title: "Stash and Tags", order: 7, blurb: "Park work aside and mark releases." }
  - { id: internals, title: "Under the Hood and Workflow", order: 8, blurb: "Objects, hooks, and team habits." }
