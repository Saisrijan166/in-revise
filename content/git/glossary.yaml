terms:
  - id: version-control
    term: Version control
    aka: ["VCS"]
    definition: "A system that records changes to files over time so you can review or go back to any version."
    source: { title: "Pro Git: About Version Control", url: "https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control", verifiedOn: "2026-11-02" }
  - id: distributed-version-control
    term: Distributed version control
    aka: ["DVCS", "distributed VCS"]
    definition: "Version control where every clone holds the full history, not just the latest files."
    see: what-is-git
    source: { title: "Pro Git: About Version Control", url: "https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control", verifiedOn: "2026-11-02" }
  - id: repository
    term: Repository
    aka: ["repo"]
    definition: "A project tracked by Git, including its files and the full history in the .git folder."
    source: { title: "Git - gitglossary", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: working-directory
    term: Working directory
    aka: ["working tree"]
    definition: "The actual files you see and edit on disk, checked out from a commit."
    see: working-staging-repo
    source: { title: "Git - gitglossary (working tree)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: staging-area
    term: Staging area
    aka: ["index", "staging"]
    definition: "The area that holds exactly what will go into your next commit."
    see: staging-and-add
    source: { title: "Git - gitglossary (index)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: commit
    term: Commit
    definition: "A saved snapshot of your staged changes, with a message, author and a link to its parent."
    see: git-commit
    source: { title: "Git - gitglossary (commit)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: snapshot
    term: Snapshot
    definition: "The full state of the tracked files at a commit; Git stores snapshots, not line-by-line diffs."
    see: how-git-stores-data
    source: { title: "Pro Git: What is Git?", url: "https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F", verifiedOn: "2026-11-02" }
  - id: head
    term: HEAD
    definition: "A pointer to your current commit, usually through the branch you have checked out."
    see: head-and-detached-head
    source: { title: "Git - gitglossary (HEAD)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: detached-head
    term: Detached HEAD
    definition: "When HEAD points straight at a commit, not a branch, so new commits belong to no branch."
    see: head-and-detached-head
    source: { title: "Git - git-checkout (Detached HEAD)", url: "https://git-scm.com/docs/git-checkout", verifiedOn: "2026-11-02" }
  - id: branch
    term: Branch
    definition: "A movable pointer to a commit; it follows forward as you add commits."
    see: git-branches
    source: { title: "Git - gitglossary (branch)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: main
    term: main
    definition: "The common default branch name on hosting platforms like GitHub."
    source: { title: "About the default branch (GitHub Docs)", url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-branches-in-your-repository/changing-the-default-branch", verifiedOn: "2026-11-02" }
  - id: master
    term: master
    definition: "Git's own built-in default branch name, used unless init.defaultBranch is set."
    source: { title: "Git - git-init (init.defaultBranch)", url: "https://git-scm.com/docs/git-init", verifiedOn: "2026-11-02" }
  - id: origin
    term: origin
    definition: "The conventional default name Git gives the remote you cloned from."
    see: git-remotes
    source: { title: "Git - gitglossary (origin)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: remote
    term: Remote
    aka: ["remote repository"]
    definition: "A version of the repository hosted elsewhere, such as on GitHub, that you fetch from and push to."
    see: git-remotes
    source: { title: "Git - git-remote", url: "https://git-scm.com/docs/git-remote", verifiedOn: "2026-11-02" }
  - id: upstream
    term: Upstream
    aka: ["upstream branch"]
    definition: "The remote branch your local branch tracks, used as the default for push and pull."
    see: tracking-branches
    source: { title: "Git - gitglossary (upstream branch)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: tracking-branch
    term: Remote-tracking branch
    aka: ["tracking branch"]
    definition: "A local read-only reference like origin/main that records where a remote branch was."
    see: tracking-branches
    source: { title: "Git - gitglossary (remote-tracking branch)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: clone
    term: Clone
    definition: "A local copy of a repository with its full history, with the source set as origin."
    see: init-and-clone
    source: { title: "Git - git-clone", url: "https://git-scm.com/docs/git-clone", verifiedOn: "2026-11-02" }
  - id: fork
    term: Fork
    definition: "A hosting-platform copy of a repo under your own account, used when you cannot push to the original."
    see: forking
    source: { title: "Fork a repository (GitHub Docs)", url: "https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/fork-a-repo", verifiedOn: "2026-11-02" }
  - id: fetch
    term: Fetch
    definition: "Download new commits and update remote-tracking branches, without changing your branch."
    see: fetch-pull-push
    source: { title: "Git - git-fetch", url: "https://git-scm.com/docs/git-fetch", verifiedOn: "2026-11-02" }
  - id: pull
    term: Pull
    definition: "Fetch from the remote and then integrate (merge or rebase) into your current branch."
    see: fetch-pull-push
    source: { title: "Git - git-pull", url: "https://git-scm.com/docs/git-pull", verifiedOn: "2026-11-02" }
  - id: push
    term: Push
    definition: "Upload your local commits to a remote branch so others can get them."
    see: fetch-pull-push
    source: { title: "Git - git-push", url: "https://git-scm.com/docs/git-push", verifiedOn: "2026-11-02" }
  - id: merge
    term: Merge
    definition: "Combine the changes from one branch into another, joining their histories."
    see: git-merge
    source: { title: "Git - git-merge", url: "https://git-scm.com/docs/git-merge", verifiedOn: "2026-11-02" }
  - id: fast-forward
    term: Fast-forward
    definition: "A merge that just moves the branch pointer forward because the branch has not diverged."
    see: git-merge
    source: { title: "Git - git-merge (fast-forward)", url: "https://git-scm.com/docs/git-merge", verifiedOn: "2026-11-02" }
  - id: three-way-merge
    term: Three-way merge
    definition: "A merge of two diverged branches using their common ancestor, recording a merge commit."
    see: git-merge
    source: { title: "Git - git-merge", url: "https://git-scm.com/docs/git-merge", verifiedOn: "2026-11-02" }
  - id: merge-commit
    term: Merge commit
    definition: "A commit with two parents that ties two branch histories together."
    see: git-merge
    source: { title: "Git - gitglossary (merge)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: merge-conflict
    term: Merge conflict
    definition: "When Git cannot combine two changes to the same lines automatically and needs you to resolve them."
    see: merge-conflicts
    source: { title: "Pro Git: Basic Merge Conflicts", url: "https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging", verifiedOn: "2026-11-02" }
  - id: rebase
    term: Rebase
    definition: "Replay your commits onto a new base commit, giving a linear history with new commit ids."
    see: git-rebase
    source: { title: "Git - git-rebase", url: "https://git-scm.com/docs/git-rebase", verifiedOn: "2026-11-02" }
  - id: interactive-rebase
    term: Interactive rebase
    definition: "git rebase -i, which lets you reorder, squash, edit, reword or drop commits."
    see: git-rebase
    source: { title: "Git - git-rebase (interactive mode)", url: "https://git-scm.com/docs/git-rebase", verifiedOn: "2026-11-02" }
  - id: squash
    term: Squash
    definition: "Combine several commits into a single commit."
    see: squash-merge
    source: { title: "Git - git-rebase", url: "https://git-scm.com/docs/git-rebase", verifiedOn: "2026-11-02" }
  - id: cherry-pick
    term: Cherry-pick
    definition: "Apply one specific commit from another branch onto your current branch as a new commit."
    see: git-cherry-pick
    source: { title: "Git - git-cherry-pick", url: "https://git-scm.com/docs/git-cherry-pick", verifiedOn: "2026-11-02" }
  - id: reset
    term: Reset
    definition: "Move the current branch to another commit, optionally updating the index and working tree."
    see: git-reset
    source: { title: "Git - git-reset", url: "https://git-scm.com/docs/git-reset", verifiedOn: "2026-11-02" }
  - id: revert
    term: Revert
    definition: "Create a new commit that undoes the changes of an earlier commit, keeping history intact."
    see: git-revert
    source: { title: "Git - git-revert", url: "https://git-scm.com/docs/git-revert", verifiedOn: "2026-11-02" }
  - id: restore
    term: Restore
    definition: "Discard unstaged edits in a file, or unstage a file, without moving the branch."
    see: git-restore
    source: { title: "Git - git-restore", url: "https://git-scm.com/docs/git-restore", verifiedOn: "2026-11-02" }
  - id: stash
    term: Stash
    definition: "Temporarily set aside uncommitted changes so you can work on something else, then bring them back."
    see: git-stash
    source: { title: "Git - git-stash", url: "https://git-scm.com/docs/git-stash", verifiedOn: "2026-11-02" }
  - id: tag
    term: Tag
    definition: "A fixed reference to a specific commit, usually marking a release like v1.0."
    see: git-tags
    source: { title: "Git - git-tag", url: "https://git-scm.com/docs/git-tag", verifiedOn: "2026-11-02" }
  - id: lightweight-tag
    term: Lightweight tag
    definition: "A tag that is just a name pointing at a commit, with no extra metadata."
    see: git-tags
    source: { title: "Pro Git: Git Basics - Tagging", url: "https://git-scm.com/book/en/v2/Git-Basics-Tagging", verifiedOn: "2026-11-02" }
  - id: annotated-tag
    term: Annotated tag
    definition: "A tag stored as a full object with tagger, date and message, recommended for releases."
    see: git-tags
    source: { title: "Pro Git: Git Basics - Tagging", url: "https://git-scm.com/book/en/v2/Git-Basics-Tagging", verifiedOn: "2026-11-02" }
  - id: sha-1
    term: SHA-1
    definition: "The 40-character hash Git uses by default to name objects by their content."
    see: how-git-stores-data
    source: { title: "Git - hash-function-transition", url: "https://git-scm.com/docs/hash-function-transition", verifiedOn: "2026-11-02" }
  - id: sha-256
    term: SHA-256
    definition: "A newer, stronger object hash Git supports; repositories opt in at creation."
    see: how-git-stores-data
    source: { title: "Git - hash-function-transition", url: "https://git-scm.com/docs/hash-function-transition", verifiedOn: "2026-11-02" }
  - id: blob
    term: Blob
    definition: "The Git object type that stores the contents of a file."
    see: git-objects
    source: { title: "Pro Git: Git Internals - Git Objects", url: "https://git-scm.com/book/en/v2/Git-Internals-Git-Objects", verifiedOn: "2026-11-02" }
  - id: tree-object
    term: Tree (object)
    aka: ["tree object"]
    definition: "A Git object that stores a directory: names pointing to blobs and other trees."
    see: git-objects
    source: { title: "Pro Git: Git Internals - Git Objects", url: "https://git-scm.com/book/en/v2/Git-Internals-Git-Objects", verifiedOn: "2026-11-02" }
  - id: object-id
    term: Object id
    aka: ["object hash", "commit hash"]
    definition: "The hash that names a Git object; a commit's object id is its unique identifier."
    see: git-objects
    source: { title: "Git - gitglossary (object name)", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }
  - id: gitignore
    term: .gitignore
    definition: "A file listing patterns for untracked files Git should ignore; it does not untrack committed files."
    see: gitignore
    source: { title: "Git - gitignore", url: "https://git-scm.com/docs/gitignore", verifiedOn: "2026-11-02" }
  - id: dot-git
    term: .git directory
    aka: [".git folder"]
    definition: "The hidden folder holding a repo's objects, refs and config; deleting it un-tracks the project."
    see: git-directory
    source: { title: "Git - gitrepository-layout", url: "https://git-scm.com/docs/gitrepository-layout", verifiedOn: "2026-11-02" }
  - id: git-hook
    term: Git hook
    aka: ["hook"]
    definition: "A script Git runs automatically at an event, such as pre-commit or pre-push."
    see: git-hooks
    source: { title: "Git - githooks", url: "https://git-scm.com/docs/githooks", verifiedOn: "2026-11-02" }
  - id: pull-request
    term: Pull request
    aka: ["PR", "merge request"]
    definition: "A request on a hosting platform to review and merge your branch into another."
    see: pull-requests
    source: { title: "About pull requests (GitHub Docs)", url: "https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests", verifiedOn: "2026-11-02" }
  - id: code-review
    term: Code review
    definition: "A teammate reading your proposed change for correctness and quality before it is merged."
    see: pull-requests
    source: { title: "About pull request reviews (GitHub Docs)", url: "https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/about-pull-request-reviews", verifiedOn: "2026-11-02" }
  - id: protected-branch
    term: Protected branch
    definition: "A branch like main that requires reviews or passing checks before anyone can merge or push."
    see: pull-requests
    source: { title: "About protected branches (GitHub Docs)", url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches", verifiedOn: "2026-11-02" }
  - id: reflog
    term: Reflog
    definition: "A log of where HEAD and branches have pointed, used to recover lost commits."
    see: git-reflog
    source: { title: "Git - git-reflog", url: "https://git-scm.com/docs/git-reflog", verifiedOn: "2026-11-02" }
  - id: bisect
    term: Bisect
    definition: "A binary search over history that finds the commit that introduced a bug."
    see: git-bisect
    source: { title: "Git - git-bisect", url: "https://git-scm.com/docs/git-bisect", verifiedOn: "2026-11-02" }
  - id: blame
    term: Blame
    definition: "Shows which commit and author last changed each line of a file."
    see: git-blame
    source: { title: "Git - git-blame", url: "https://git-scm.com/docs/git-blame", verifiedOn: "2026-11-02" }
  - id: amend
    term: Amend
    definition: "Replace the last commit with a new one, to fix its message or add forgotten changes."
    see: commit-amend
    source: { title: "Git - git-commit (--amend)", url: "https://git-scm.com/docs/git-commit", verifiedOn: "2026-11-02" }
  - id: force-with-lease
    term: force-with-lease
    definition: "A safer forced push that refuses if the remote has commits you have not seen."
    see: git-rebase
    source: { title: "Git - git-push (--force-with-lease)", url: "https://git-scm.com/docs/git-push", verifiedOn: "2026-11-02" }
  - id: checkout
    term: Checkout
    definition: "The older command that switches branches and also restores files; now split into switch and restore."
    see: switching-branches
    source: { title: "Git - git-checkout", url: "https://git-scm.com/docs/git-checkout", verifiedOn: "2026-11-02" }
  - id: clean
    term: Clean
    definition: "Delete untracked files and directories from the working tree; git clean -n previews first."
    see: git-clean
    source: { title: "Git - git-clean", url: "https://git-scm.com/docs/git-clean", verifiedOn: "2026-11-02" }
