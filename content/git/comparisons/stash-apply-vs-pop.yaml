id: stash-apply-vs-pop
tech: git
title: "stash apply vs stash pop"
compares: [stash-apply, stash-pop]
gist:
  - "Reapply the stash and keep it in the list"
  - "Reapply the stash and remove it from the list"
explain:
  - "git stash apply puts the stashed changes back into your working tree but leaves the stash entry in the list, so you can apply it again, for example on another branch."
  - "git stash pop does the same reapply, then deletes the stash entry, but only if the reapply succeeded with no conflict. If there is a conflict, the stash is kept so you do not lose it."
example: "You stashed a fix. git stash apply brings it back and stash@{0} still exists, handy if you want it on two branches. git stash pop brings it back and clears it, the usual one-branch case, unless a conflict stops it."
rows:
  - { aspect: "Reapplies changes", a: "Yes", b: "Yes" }
  - { aspect: "Keeps the stash", a: "Yes", b: "No (removed on success)" }
  - { aspect: "On conflict", a: "Stash kept", b: "Stash kept, conflict to resolve" }
  - { aspect: "Use when", a: "You may reuse the stash", b: "You are done with it" }
verdict: "Use pop for the normal one-off case; use apply when you might need the same stash again."
sayIt: "Both reapply stashed changes to the working tree. apply keeps the stash in the list; pop removes it after a successful apply. If popping hits a conflict, Git keeps the stash so nothing is lost. I use apply when I might reuse the stash on another branch."
sources:
  - { title: "Git - git-stash Documentation", url: "https://git-scm.com/docs/git-stash", verifiedOn: "2026-11-02" }
