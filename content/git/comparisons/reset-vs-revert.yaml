id: reset-vs-revert
tech: git
title: Reset vs Revert
compares: [git-reset, git-revert]
gist:
  - "Move the branch pointer back; can rewrite history"
  - "Add a new commit that undoes an old one; history stays"
explain:
  - "git reset moves the current branch to an earlier commit. The commits after it drop off the branch, so the history changes. On a shared branch that is dangerous, because others still have the old commits."
  - "git revert creates a brand-new commit that is the opposite of a chosen commit, cancelling its changes while leaving all history in place. Nothing is rewritten, so it is safe to push."
example: "You pushed a bad commit to main. git reset --hard HEAD~1 would remove it locally but rewrite shared history. git revert <bad> instead adds a new commit that undoes it, which you can push without disturbing anyone."
rows:
  - { aspect: "What it does", a: "Moves HEAD/branch to an older commit", b: "Adds a commit that reverses one" }
  - { aspect: "History", a: "Rewritten", b: "Preserved" }
  - { aspect: "Safe after pushing", a: "No", b: "Yes" }
  - { aspect: "Typical use", a: "Undo local, unpushed commits", b: "Undo a commit already shared" }
verdict: "Use revert for anything already pushed; use reset only on local commits you have not shared."
sayIt: "Reset moves the branch pointer to an earlier commit and rewrites history, so I use it only on local, unpushed work. Revert makes a new commit that undoes an old one and keeps history intact, so it is the safe choice for commits already pushed to a shared branch."
sources:
  - { title: "Git - git-reset Documentation", url: "https://git-scm.com/docs/git-reset", verifiedOn: "2026-11-02" }
  - { title: "Git - git-revert Documentation", url: "https://git-scm.com/docs/git-revert", verifiedOn: "2026-11-02" }
