id: restore-vs-reset
tech: git
title: Restore vs Reset
compares: [git-restore, git-reset]
gist:
  - "Change files or unstage, without moving the branch"
  - "Move HEAD/branch, and optionally the index and files"
explain:
  - "git restore works on file contents: it throws away unstaged edits in a file, or with --staged it unstages a file. It never moves the branch pointer, so history is untouched."
  - "git reset is about where the branch points: it moves HEAD to another commit and, depending on --soft/--mixed/--hard, also updates the staging area and working files. It can rewrite history."
example: "To drop edits in one file, git restore app.js. To unstage a file you added by mistake, git restore --staged app.js. To undo the last commit entirely, that is a job for git reset HEAD~1, not restore."
rows:
  - { aspect: "Scope", a: "One or more files", b: "The whole branch/HEAD" }
  - { aspect: "Moves the branch", a: "No", b: "Yes" }
  - { aspect: "Unstage a file", a: "git restore --staged <f>", b: "git reset <f> (older way)" }
  - { aspect: "Discard file edits", a: "git restore <f>", b: "git reset --hard (whole tree)" }
verdict: "Reach for restore to fix files and staging; reach for reset to move the branch. restore was added to split these jobs that checkout and reset used to share."
sayIt: "restore changes file contents or unstages files and never moves the branch. reset moves HEAD to another commit and can also touch the index and working tree. Git added restore and switch to split the overloaded checkout and reset into clearer commands."
sources:
  - { title: "Git - git-restore Documentation", url: "https://git-scm.com/docs/git-restore", verifiedOn: "2026-11-02" }
  - { title: "Git - git-reset Documentation", url: "https://git-scm.com/docs/git-reset", verifiedOn: "2026-11-02" }
