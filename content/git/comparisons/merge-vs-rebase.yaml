id: merge-vs-rebase
tech: git
title: Merge vs Rebase
compares: [git-merge, git-rebase]
gist:
  - "Join two branches, keeping both histories as they happened"
  - "Replay your commits on a new base, for one straight line"
explain:
  - "git merge takes two branches and ties them together. When they have diverged it makes a new merge commit with two parents, so the real history, including when the branch split, is kept exactly."
  - "git rebase lifts your branch's commits off and replays them one by one on top of the latest target branch. The result is a straight line, but every replayed commit gets a new id, so it is a rewritten history."
example: "Your feature branch and main both got commits. git merge main gives a merge commit that joins them. git rebase main instead rewrites your commits on top of main's latest commit, as if you had started today, leaving no merge commit."
rows:
  - { aspect: "History", a: "Kept as it happened, with a merge commit", b: "Rewritten into a straight line" }
  - { aspect: "Commit ids", a: "Unchanged", b: "New ids for replayed commits" }
  - { aspect: "Merge commit", a: "Usually one", b: "None" }
  - { aspect: "Safe on shared branches", a: "Yes", b: "No: only on commits nobody else has" }
  - { aspect: "Best for", a: "Integrating finished work", b: "Tidying a private branch before it lands" }
verdict: "Merge to combine shared branches and keep true history; rebase to clean up your own branch before sharing. Never rebase commits others already pulled."
sayIt: "Merge joins two branches and records a merge commit, keeping history as it happened. Rebase replays my commits on top of another branch for a linear history, but it rewrites commit ids, so I only rebase my own unpushed work and merge when combining shared branches."
sources:
