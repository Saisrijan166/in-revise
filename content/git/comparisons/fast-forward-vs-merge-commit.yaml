id: fast-forward-vs-merge-commit
tech: git
title: Fast-forward vs Merge Commit
compares: [fast-forward-merge, three-way-merge]
gist:
  - "Just slide the pointer forward, no new commit"
  - "Join two diverged lines with a new merge commit"
explain:
  - "A fast-forward merge happens when the target branch has not moved since the feature branch started. Git simply moves the target's pointer forward to the feature's tip; no merge commit is made and history stays linear."
  - "A three-way merge happens when both branches have new commits. Git combines them using their common ancestor and records a merge commit with two parents, so the branch point stays visible in history."
example: "main has not changed since you branched: merging your feature just fast-forwards main to your commits. If main also got a commit meanwhile, Git cannot fast-forward, so it makes a merge commit tying both lines together."
rows:
  - { aspect: "When it happens", a: "Target branch has not moved", b: "Both branches have new commits" }
  - { aspect: "Creates a commit", a: "No", b: "Yes, a merge commit" }
  - { aspect: "History shape", a: "Straight line", b: "A fork and a join" }
  - { aspect: "Force a merge commit", a: "git merge --no-ff", b: "Happens automatically" }
verdict: "Fast-forward keeps history linear when there is no divergence; a merge commit is needed when both branches moved. Use --no-ff to always record the merge."
sayIt: "A fast-forward merge moves the branch pointer forward when the target has not diverged, so there is no merge commit. A three-way merge joins two diverged branches via their common ancestor and records a merge commit with two parents. --no-ff forces a merge commit anyway."
sources:
  - { title: "Git - git-merge Documentation", url: "https://git-scm.com/docs/git-merge", verifiedOn: "2026-11-02" }
  - { title: "Pro Git: Git Branching - Basic Branching and Merging", url: "https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging", verifiedOn: "2026-11-02" }
