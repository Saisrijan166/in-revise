id: clone-vs-fork
tech: git
title: Clone vs Fork
compares: [git-clone, fork]
gist:
  - "A local copy on your machine, linked to the original"
  - "Your own server-side copy of someone else's repo"
explain:
  - "git clone is a Git command that downloads a repository to your computer with its full history, and sets the original as the remote named origin, so you can fetch and push if you have access."
  - "A fork is a hosting-platform feature (GitHub, GitLab): it makes a second copy of the repo under your account on the server. You cannot push to a project you do not own, so you fork it, then clone your fork."
example: "To contribute to an open-source repo you cannot push to, you fork it on GitHub (a copy under your account), clone that fork to your laptop, push your branch to the fork, and open a pull request back to the original."
rows:
  - { aspect: "Where the copy lives", a: "Your computer", b: "Your account on the server" }
  - { aspect: "It is a", a: "Git command", b: "Platform (GitHub) feature" }
  - { aspect: "Can push back to original", a: "Only if you have access", b: "No; you push to the fork and open a PR" }
  - { aspect: "Typical use", a: "Work on a repo you can access", b: "Contribute to a repo you cannot push to" }
verdict: "Clone when you can push to the repo; fork first when you cannot, then clone your fork and open pull requests."
sayIt: "Clone is a Git command that copies a repo to my machine with its history and sets origin. A fork is a platform feature that copies the repo under my account so I can contribute to a project I cannot push to. The flow is fork, clone the fork, push, then open a pull request."
sources:
  - { title: "Git - git-clone Documentation", url: "https://git-scm.com/docs/git-clone", verifiedOn: "2026-11-02" }
  - { title: "Fork a repository (GitHub Docs)", url: "https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/fork-a-repo", verifiedOn: "2026-11-02" }
