id: merge-vs-cherry-pick
tech: git
title: Merge vs Cherry-pick
compares: [git-merge, git-cherry-pick]
gist:
  - "Bring in a whole branch of commits"
  - "Bring in one chosen commit"
explain:
  - "git merge integrates every commit on another branch into yours at once, joining the two histories, usually with a merge commit."
  - "git cherry-pick copies just one (or a few) specific commits from another branch and applies them onto your current branch as new commits, leaving the rest of that branch behind."
example: "Development has ten commits; one is an urgent bug fix. git merge development would bring all ten into production. git cherry-pick <fix> brings only that one fix across, without the nine unfinished commits."
rows:
  - { aspect: "How much comes across", a: "The whole branch", b: "One chosen commit" }
  - { aspect: "Commit ids", a: "Kept", b: "New id for the copy" }
  - { aspect: "Merge commit", a: "Usually one", b: "None" }
  - { aspect: "Use when", a: "Integrating finished work", b: "Needing one fix elsewhere now" }
verdict: "Merge to integrate a finished branch; cherry-pick to grab one commit, like a hotfix, without the rest."
sayIt: "Merge brings an entire branch's commits into mine and joins the histories. Cherry-pick copies just one specific commit onto my current branch as a new commit. I cherry-pick when I need a single fix on another branch without merging everything else."
sources:
  - { title: "Git - git-cherry-pick Documentation", url: "https://git-scm.com/docs/git-cherry-pick", verifiedOn: "2026-11-02" }
  - { title: "Git - git-merge Documentation", url: "https://git-scm.com/docs/git-merge", verifiedOn: "2026-11-02" }
