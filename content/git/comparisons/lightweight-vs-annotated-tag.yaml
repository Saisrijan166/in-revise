id: lightweight-vs-annotated-tag
tech: git
title: Lightweight vs Annotated Tag
compares: [lightweight-tag, annotated-tag]
gist:
  - "A plain name pointing at a commit"
  - "A full tag object with message, tagger and date"
explain:
  - "A lightweight tag is just a name that points to a commit, like a branch that never moves. It stores no extra information, so it is fine for a quick private bookmark."
  - "An annotated tag is a real object in the database: it records who tagged it, when, and a message, and it can be signed. This is the recommended kind for releases."
example: "git tag v1.0 makes a lightweight tag: just a pointer. git tag -a v1.0 -m 'First release' makes an annotated tag that also stores the tagger, date and message, which git show v1.0 then displays."
rows:
  - { aspect: "Stores metadata", a: "No", b: "Yes: tagger, date, message" }
  - { aspect: "Is a Git object", a: "No, just a ref", b: "Yes, a tag object" }
  - { aspect: "Can be signed", a: "No", b: "Yes (GPG)" }
  - { aspect: "Recommended for", a: "Quick private marks", b: "Releases" }
verdict: "Use annotated tags for anything you release or share; a lightweight tag is fine only as a temporary private marker."
sayIt: "A lightweight tag is just a name pointing at a commit with no extra data. An annotated tag is a full object storing the tagger, date and message, and it can be signed. I use annotated tags for releases and lightweight ones only as throwaway bookmarks."
sources:
  - { title: "Git - git-tag Documentation", url: "https://git-scm.com/docs/git-tag", verifiedOn: "2026-11-02" }
  - { title: "Pro Git: Git Basics - Tagging", url: "https://git-scm.com/book/en/v2/Git-Basics-Tagging", verifiedOn: "2026-11-02" }
