id: branch-vs-tag
tech: git
title: Branch vs Tag
compares: [git-branches, git-tags]
gist:
  - "A moving pointer that follows new commits"
  - "A fixed label that stays on one commit"
explain:
  - "A branch is a movable reference. As you add commits on it, the branch pointer moves forward to the newest commit, so it always marks the tip of a line of work."
  - "A tag is a fixed reference to one specific commit, used to mark a release like v1.0. It does not move when new commits are added, so it keeps pointing at that exact snapshot."
example: "You commit three times on main: the main branch pointer moves to each new commit. You tag v1.0 on the third commit: later commits do not move v1.0, so it always marks exactly what v1.0 shipped."
rows:
  - { aspect: "Moves with new commits", a: "Yes", b: "No" }
  - { aspect: "Purpose", a: "A line of ongoing work", b: "Mark a release or milestone" }
  - { aspect: "Typical name", a: "main, feature-x", b: "v1.0, v2.3.1" }
  - { aspect: "Pushed", a: "On push", b: "Only with git push --tags or by name" }
verdict: "Use a branch for work that keeps moving; use a tag to pin a release so you can always find it."
sayIt: "A branch is a movable pointer that follows new commits, marking the tip of a line of work. A tag is a fixed pointer to one commit, used to mark releases like v1.0 and it does not move. Tags also need an explicit push."
sources:
  - { title: "Git - git-tag Documentation", url: "https://git-scm.com/docs/git-tag", verifiedOn: "2026-11-02" }
  - { title: "Pro Git: Git Basics - Tagging", url: "https://git-scm.com/book/en/v2/Git-Basics-Tagging", verifiedOn: "2026-11-02" }
