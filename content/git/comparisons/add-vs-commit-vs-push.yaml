id: add-vs-commit-vs-push
tech: git
title: Add vs Commit vs Push
compares: [staging-and-add, git-commit, git-push]
gist:
  - "Choose which changes go in the next snapshot"
  - "Save those staged changes to local history"
  - "Upload your local commits to the remote"
explain:
  - "git add moves changes from the working directory into the staging area, marking what will go into the next commit. Nothing is saved to history yet."
  - "git commit takes everything staged and records it as a new snapshot in your local repository, with a message. It is still only on your machine."
  - "git push sends your local commits up to the remote, so teammates can pull them. Nothing leaves your machine until you push."
example: "You edit two files, git add one of them, git commit it (saved locally, one file), then git push (now on the remote). The second, unstaged file is still only a working-directory change."
rows:
  - { aspect: "Acts on", a: "Working dir to staging", b: "Staging to local repo", c: "Local repo to remote" }
  - { aspect: "Creates a commit", a: "No", b: "Yes", c: "No (sends commits)" }
  - { aspect: "Leaves your machine", a: "No", b: "No", c: "Yes" }
  - { aspect: "Undo with", a: "git restore --staged", b: "git reset / revert", c: "a new push" }
verdict: "Think of it as a pipeline: add picks the changes, commit saves them locally, push shares them. Each step is separate on purpose."
sayIt: "add stages which changes go in the next commit, commit saves those staged changes to my local history with a message, and push uploads my local commits to the remote. Work only reaches teammates after push; the three steps are deliberately separate."
sources:
  - { title: "Pro Git: Git Basics - Recording Changes to the Repository", url: "https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository", verifiedOn: "2026-11-02" }
  - { title: "Git - git-push Documentation", url: "https://git-scm.com/docs/git-push", verifiedOn: "2026-11-02" }
