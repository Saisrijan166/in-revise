id: fetch-vs-pull-vs-push
tech: git
title: Fetch vs Pull vs Push
compares: [git-fetch, git-pull, git-push]
gist:
  - "Download remote commits, change nothing you are on"
  - "Download and then integrate into your branch"
  - "Upload your commits to the remote"
explain:
  - "git fetch downloads new commits and updated remote-tracking branches from the remote, but leaves your working branch exactly as it is, so you can review before integrating."
  - "git pull is fetch plus integrate: it downloads, then merges (or rebases) the remote changes into your current branch in one step."
  - "git push sends your local commits up to the remote branch, so teammates can see them. It is rejected if the remote has commits you do not have yet."
example: "A teammate pushed to main. git fetch brings those commits down so you can look; your main is unchanged. git pull brings them down and merges them into your main. After you commit locally, git push sends your commits up."
rows:
  - { aspect: "Direction", a: "Remote to you", b: "Remote to you", c: "You to remote" }
  - { aspect: "Changes your branch", a: "No", b: "Yes", c: "No (changes the remote)" }
  - { aspect: "Does a merge/rebase", a: "No", b: "Yes", c: "No" }
  - { aspect: "Can be rejected", a: "No", b: "On conflict", c: "Yes, if remote is ahead" }
verdict: "Fetch to look before you leap, pull to update your branch, push to share. When unsure, fetch then review, rather than pull blindly."
sayIt: "Fetch downloads remote commits without touching my branch. Pull is fetch plus a merge or rebase into my current branch. Push uploads my commits to the remote. I often fetch first to review, and push only after my local branch is up to date."
sources:
  - { title: "Git - git-fetch Documentation", url: "https://git-scm.com/docs/git-fetch", verifiedOn: "2026-11-02" }
  - { title: "Git - git-pull Documentation", url: "https://git-scm.com/docs/git-pull", verifiedOn: "2026-11-02" }
  - { title: "Git - git-push Documentation", url: "https://git-scm.com/docs/git-push", verifiedOn: "2026-11-02" }
