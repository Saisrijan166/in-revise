id: reset-soft-mixed-hard
tech: git
title: "reset --soft vs --mixed vs --hard"
compares: [reset-soft, reset-mixed, reset-hard]
gist:
  - "Move HEAD; keep changes staged"
  - "Move HEAD; keep changes, unstaged"
  - "Move HEAD; discard tracked changes"
explain:
  - "--soft moves the branch to an earlier commit but leaves the index and working files alone, so everything from the undone commits sits staged, ready to recommit."
  - "--mixed is the default: it moves the branch and resets the staging area to match, but keeps your files, so the changes are back to unstaged."
  - "--hard moves the branch and also throws away staged and working changes in tracked files, so the working tree matches the target commit. Uncommitted work is lost."
example: "After git reset --soft HEAD~1 the last commit is gone but its changes are staged. --mixed HEAD~1 leaves them unstaged. --hard HEAD~1 deletes them. Only --hard can lose work you have not committed."
rows:
  - { aspect: "Moves HEAD/branch", a: "Yes", b: "Yes", c: "Yes" }
  - { aspect: "Staging area", a: "Unchanged (stays staged)", b: "Reset (unstaged)", c: "Reset" }
  - { aspect: "Working files", a: "Unchanged", b: "Unchanged", c: "Overwritten" }
  - { aspect: "Can lose work", a: "No", b: "No", c: "Yes" }
verdict: "Use --soft to re-commit, --mixed (default) to re-stage, --hard only when you truly want the changes gone."
sayIt: "All three move the branch to an earlier commit. --soft keeps the changes staged, --mixed (the default) keeps them but unstaged, and --hard discards them so the working tree matches the target. Only --hard can lose uncommitted work."
sources:
  - { title: "Git - git-reset Documentation", url: "https://git-scm.com/docs/git-reset", verifiedOn: "2026-11-02" }
  - { title: "Pro Git: Reset Demystified", url: "https://git-scm.com/book/en/v2/Git-Tools-Reset-Demystified", verifiedOn: "2026-11-02" }
