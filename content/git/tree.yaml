sources:
  - { title: "Git Reference (official docs)", url: "https://git-scm.com/docs", verifiedOn: "2026-11-02" }
  - { title: "Pro Git book (2nd edition)", url: "https://git-scm.com/book/en/v2", verifiedOn: "2026-11-02" }
  - { title: "Git - git-switch Documentation", url: "https://git-scm.com/docs/git-switch", verifiedOn: "2026-11-02" }
  - { title: "Git - git-reset Documentation", url: "https://git-scm.com/docs/git-reset", verifiedOn: "2026-11-02" }
  - { title: "Git - gitglossary Documentation", url: "https://git-scm.com/docs/gitglossary", verifiedOn: "2026-11-02" }

topics:
  basics:
    - id: what-is-git
      children:
        - { id: distributed-vcs, label: "Distributed VCS", note: "Every clone has the full history, not just the latest files" }
        - { id: centralized-vcs, label: "Centralized VCS", note: "One central server holds history, e.g. SVN; Git is not this" }
    - id: how-git-stores-data
      children:
        - { id: snapshot-not-diff, label: "Snapshots, not diffs", note: "Each commit records the whole tree; unchanged files are reused" }
        - { id: content-addressing, label: "Content addressing", note: "Every object is named by the hash of its content" }
        - { id: sha-1-sha-256, label: "SHA-1 and SHA-256", note: "Object ids; SHA-256 repos are supported, SHA-1 is still the default" }
    - id: working-staging-repo
      children:
        - { id: working-directory, label: "Working directory", note: "The files you edit on disk" }
        - { id: staging-area, label: "Staging area (index)", note: "What will go into the next commit" }
        - { id: local-repository, label: "Local repository", note: "The committed history in .git" }
        - { id: head-pointer, label: "HEAD", note: "Points to your current commit, usually via the current branch" }
    - id: git-config
      children:
        - { id: config-system, label: "--system", note: "Settings for all users on the machine" }
        - { id: config-global, label: "--global", note: "Settings for your user, all repos" }
        - { id: config-local, label: "--local", note: "Settings for one repo; overrides global" }
    - id: init-and-clone
      children:
        - { id: git-init, label: "git init", note: "Make a new empty repository in the current folder" }
        - { id: git-clone, label: "git clone", note: "Copy a remote repository with its full history" }

  changes:
    - id: git-status
    - id: staging-and-add
      children:
        - { id: add-dot, label: "git add .", note: "Stage changes in the current directory and below" }
        - { id: add-all, label: "git add -A", note: "Stage adds, edits and deletes across the whole tree" }
        - { id: add-patch, label: "git add -p", note: "Choose which chunks of a file to stage" }
    - id: git-commit
    - id: git-diff
      children:
        - { id: diff-unstaged, label: "git diff", note: "Working directory vs the staging area" }
        - { id: diff-staged, label: "git diff --staged", note: "Staging area vs the last commit" }
    - id: git-log
      children:
        - { id: log-oneline, label: "git log --oneline", note: "One compact line per commit" }
        - { id: git-show, label: "git show", note: "The full change a single commit made" }
    - id: gitignore
      children:
        - { id: gitignore-patterns, label: "Patterns", note: "Globs like *.log, build/, and ! to re-include" }
        - { id: already-tracked, label: "Already tracked", note: ".gitignore does not untrack a committed file" }
    - id: git-rm-and-mv
      children:
        - { id: rm-cached, label: "git rm --cached", note: "Stop tracking a file but keep it on disk" }

  branching:
    - id: git-branches
      children:
        - { id: branch-pointer, label: "A branch is a pointer", note: "A movable reference to one commit" }
        - { id: delete-branch, label: "-d and -D", note: "-d deletes a merged branch; -D forces it" }
    - id: head-and-detached-head
      children:
        - { id: detached-head, label: "Detached HEAD", note: "HEAD points at a commit, not a branch; new commits can be lost" }
    - id: switching-branches
      children:
        - { id: git-switch, label: "git switch", note: "Change branch; -c creates and switches" }
        - { id: git-checkout, label: "git checkout", note: "Older command that also switches branches and restores files" }

  integrating:
    - id: git-merge
      children:
        - { id: fast-forward-merge, label: "Fast-forward", note: "Move the pointer forward; no merge commit" }
        - { id: three-way-merge, label: "Three-way merge", note: "Join two diverged lines using their common ancestor" }
        - { id: merge-commit, label: "Merge commit", note: "A commit with two parents that joins histories" }
    - id: merge-conflicts
      children:
        - { id: conflict-markers, label: "Conflict markers", note: "<<<<<<< ======= >>>>>>> mark the two sides to resolve" }
    - id: git-rebase
      children:
        - { id: interactive-rebase, label: "Interactive rebase", note: "git rebase -i to squash, reorder, edit or drop commits" }
        - { id: rebase-golden-rule, label: "Golden rule", note: "Do not rebase commits others have already pulled" }
    - id: git-cherry-pick
    - id: squash-merge
      children:
        - { id: squash-commit, label: "Squash", note: "Combine many commits into one before it lands" }

  remotes:
    - id: git-remotes
      children:
        - { id: origin, label: "origin", note: "The conventional name for your main remote" }
        - { id: remote-v, label: "git remote -v", note: "Show the remote names and their URLs" }
    - id: fetch-pull-push
      children:
        - { id: git-fetch, label: "git fetch", note: "Download remote commits without changing your branch" }
        - { id: git-pull, label: "git pull", note: "Fetch, then merge or rebase into your branch" }
        - { id: git-push, label: "git push", note: "Upload your commits to the remote" }
    - id: tracking-branches
      children:
        - { id: upstream-branch, label: "Upstream", note: "The remote branch your local branch tracks" }
        - { id: push-u, label: "push -u", note: "Set the upstream so later push and pull need no arguments" }
    - id: pull-strategies
      children:
        - { id: pull-rebase, label: "pull --rebase", note: "Replay your commits on top instead of making a merge commit" }
        - { id: ff-only, label: "--ff-only", note: "Refuse to pull if it would need a merge commit" }
    - id: pull-requests
      children:
        - { id: code-review, label: "Code review", note: "Teammates read and approve the change first" }
        - { id: protected-branch, label: "Protected branch", note: "main needs reviews and passing checks before merge" }
    - id: forking
      children:
        - { id: fork, label: "Fork", note: "Your own server-side copy of a repo you cannot push to" }

  undoing:
    - id: git-restore
      children:
        - { id: restore-worktree, label: "git restore <file>", note: "Throw away unstaged edits in a file" }
        - { id: restore-staged, label: "git restore --staged", note: "Unstage a file, keeping the edits" }
    - id: git-reset
      children:
        - { id: reset-soft, label: "--soft", note: "Move HEAD back; keep changes staged" }
        - { id: reset-mixed, label: "--mixed (default)", note: "Move HEAD back; keep changes unstaged" }
        - { id: reset-hard, label: "--hard", note: "Move HEAD back; discard tracked changes" }
    - id: git-revert
    - id: git-clean
      children:
        - { id: clean-fd, label: "git clean -fd", note: "Delete untracked files and folders; -n previews" }
    - id: git-reflog
      children:
        - { id: reflog-recovery, label: "Recovery", note: "reflog lists where HEAD has been, so lost commits can be found" }

  saving:
    - id: git-stash
      children:
        - { id: stash-apply, label: "stash apply", note: "Reapply stashed changes and keep the stash" }
        - { id: stash-pop, label: "stash pop", note: "Reapply stashed changes and drop the stash" }
        - { id: stash-u, label: "stash -u", note: "Include untracked files in the stash" }
    - id: git-tags
      children:
        - { id: lightweight-tag, label: "Lightweight tag", note: "A plain pointer to a commit" }
        - { id: annotated-tag, label: "Annotated tag", note: "A tag object with tagger, date and message" }

  internals:
    - id: git-objects
      children:
        - { id: blob, label: "Blob", note: "Stores file content" }
        - { id: tree-object, label: "Tree", note: "Stores a directory: names pointing to blobs and trees" }
        - { id: commit-object, label: "Commit", note: "A snapshot plus parent(s), author and message" }
        - { id: tag-object, label: "Tag object", note: "An annotated tag with its own metadata" }
    - id: git-directory
      children:
        - { id: dot-git, label: ".git", note: "Holds objects, refs and config; delete it to un-track the project" }
    - id: git-hooks
      children:
        - { id: pre-commit-hook, label: "pre-commit", note: "Runs before a commit is created; used for linting and formatting" }
        - { id: pre-push-hook, label: "pre-push", note: "Runs before a push; used to run tests" }
    - id: commit-amend
    - id: branching-strategies
      children:
        - { id: trunk-based, label: "Trunk-based", note: "Everyone commits to main behind short-lived branches" }
        - { id: git-flow, label: "Git Flow", note: "Long-lived develop and release branches" }
        - { id: github-flow, label: "GitHub Flow", note: "Feature branch, PR, merge to main, deploy" }
    - id: good-commits
    - id: git-blame
    - id: git-bisect
