terms:
  - id: microservice-term
    term: Microservice
    aka:
      - microservice architecture
    definition: A small service that runs in its own process, owns one business capability and is deployed on its own.
    see: monolith-and-microservices
    source: &a2
      title: Microservices (James Lewis and Martin Fowler)
      url: https://martinfowler.com/articles/microservices.html
      verifiedOn: 2026-10-20
  - id: monolith
    term: Monolith
    aka:
      - monolithic architecture
      - monolithic application
    definition: An application built and deployed as one unit, usually with one database.
    see: monolith-and-microservices
    source: &a1
      title: "Pattern: Monolithic Architecture (microservices.io)"
      url: https://microservices.io/patterns/monolithic.html
      verifiedOn: 2026-10-20
  - id: modular-monolith
    term: Modular monolith
    definition: One deployable application whose code is split into business modules with enforced boundaries.
    see: monolith-and-microservices
    source: *a1
  - id: distributed-system
    term: Distributed system
    aka:
      - distributed systems
    definition: Separate processes on a network that work together; parts can fail independently.
    see: distributed-systems-fallacies
    source: &a7
      title: Challenges with distributed systems (AWS Builders' Library, Jacob Gabrielson)
      url: https://builder.aws.com/content/3F08f7GPFiZMCgXD8gny6OjxR0Z/challenges-with-distributed-systems
      verifiedOn: 2026-10-20
  - id: independent-deployment
    term: Independent deployment
    aka:
      - independently deployable
      - deployed independently
    definition: Releasing one service without rebuilding or redeploying any other service.
    see: monolith-and-microservices
    source: *a2
  - id: service-autonomy
    term: Service autonomy
    definition: A service's team can change, test and deploy it without coordinating with other teams.
    see: monolith-and-microservices
    source: &a5
      title: "Pattern: Microservice Architecture (microservices.io)"
      url: https://microservices.io/patterns/microservices.html
      verifiedOn: 2026-10-20
  - id: conways-law
    term: Conway's law
    definition: "Melvin Conway, 1968: a system's design copies the communication structure of the organisation that builds it."
    see: monolith-and-microservices
    source:
      title: Conway's Law (Martin Fowler)
      url: https://martinfowler.com/bliki/ConwaysLaw.html
      verifiedOn: 2026-10-20
  - id: domain-driven-design
    term: Domain-driven design
    aka:
      - DDD
    definition: Designing software around a model of the business domain, built with domain experts.
    see: service-boundaries
    source: &a3
      title: Domain-Driven Design Reference (Eric Evans, 2015)
      url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
      verifiedOn: 2026-10-20
  - id: bounded-context
    term: Bounded context
    aka:
      - bounded contexts
    definition: The explicit boundary inside which one domain model and its terms stay consistent.
    see: service-boundaries
    source: *a3
  - id: ubiquitous-language
    term: Ubiquitous language
    definition: The shared terms a team uses in speech, diagrams and code inside one bounded context.
    see: service-boundaries
    source: *a3
  - id: aggregate
    term: Aggregate (DDD)
    aka:
      - DDD aggregate
      - aggregates
    definition: A cluster of domain objects loaded and saved as one unit; a transaction should not cross it.
    see: service-boundaries
    source: &a4
      title: DDD Aggregate (Martin Fowler)
      url: https://martinfowler.com/bliki/DDD_Aggregate.html
      verifiedOn: 2026-10-20
  - id: aggregate-root
    term: Aggregate root
    definition: The one entity of an aggregate that outside code may reference; it guards the aggregate's rules.
    see: service-boundaries
    source: *a4
  - id: domain-service
    term: Domain service
    aka:
      - domain services
    definition: A domain operation that is not a natural job of any single entity or value object.
    see: service-boundaries
    source: *a3
  - id: business-capability
    term: Business capability
    aka:
      - business capabilities
    definition: Something the business does to create value, such as order management or inventory.
    see: service-boundaries
    source:
      title: "Pattern: Decompose by business capability (microservices.io)"
      url: https://microservices.io/patterns/decomposition/decompose-by-business-capability.html
      verifiedOn: 2026-10-20
  - id: subdomain
    term: Subdomain
    aka:
      - subdomains
      - core subdomain
    definition: "One part of the business domain: core (the differentiator), supporting or generic."
    see: service-boundaries
    source:
      title: "Pattern: Decompose by subdomain (microservices.io)"
      url: https://microservices.io/patterns/decomposition/decompose-by-subdomain.html
      verifiedOn: 2026-10-20
  - id: loose-coupling
    term: Loose coupling
    aka:
      - loosely coupled
      - low coupling
    definition: Services depend on each other's APIs only, so one can change without changing the others.
    see: service-boundaries
    source: &a8
      title: Architecture strategies for optimizing scaling and partitioning (Azure Well-Architected Framework)
      url: https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/scale-partition
      verifiedOn: 2026-10-20
  - id: high-cohesion
    term: High cohesion
    definition: The responsibilities inside one service are closely related, so a change usually stays in one service.
    see: service-boundaries
    source: &a6
      title: Identify microservice boundaries (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/microservices/model/microservice-boundaries
      verifiedOn: 2026-10-20
  - id: distributed-monolith
    term: Distributed monolith
    definition: Separately deployed services so tightly coupled that they must change and deploy together.
    see: service-boundaries
    source: *a5
  - id: chatty-communication
    term: Chatty communication
    aka:
      - chatty calls
      - chatty services
    definition: Many small remote calls for one operation, adding latency and failure points.
    see: service-boundaries
    source: *a6
  - id: partial-failure
    term: Partial failure
    definition: Some parts of a distributed system fail while others keep running.
    see: distributed-systems-fallacies
    source: *a7
  - id: fallacies-of-distributed-computing
    term: Fallacies of distributed computing
    aka:
      - eight fallacies
    definition: Eight false assumptions about networks listed at Sun in the 1990s, starting with 'the network is reliable'.
    see: distributed-systems-fallacies
    source:
      title: Fallacies of distributed computing (Wikipedia)
      url: https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing
      verifiedOn: 2026-10-20
  - id: vertical-scaling
    term: Vertical scaling
    aka:
      - scale up
      - scaling up
    definition: Adding CPU, memory or other capacity to an existing instance.
    see: scaling-services
    source: *a8
  - id: horizontal-scaling
    term: Horizontal scaling
    aka:
      - scale out
      - scaling out
    definition: Adding more instances of the same service and spreading the load across them.
    see: scaling-services
    source: *a8
  - id: stateless-service
    term: Stateless service
    aka:
      - stateless services
    definition: A service that keeps nothing between requests on the instance; lasting data lives in a backing store.
    see: scaling-services
    source:
      title: "The Twelve-Factor App: VI. Processes"
      url: https://12factor.net/processes
      verifiedOn: 2026-10-20
  - id: stateful-service
    term: Stateful service
    aka:
      - stateful services
    definition: A service that keeps state on the instance, so later requests depend on that instance.
    see: scaling-services
    source: *a8
  - id: throughput
    term: Throughput
    definition: Requests completed per unit of time, such as 200 requests per second.
    see: scaling-services
    source: &a9
      title: "JEP 444: Virtual Threads, Little's Law (OpenJDK)"
      url: https://openjdk.org/jeps/444
      verifiedOn: 2026-10-20
  - id: latency
    term: Latency
    definition: How long one request takes from start to finish.
    see: scaling-services
    source: *a9
  - id: concurrency-term
    term: Concurrency (requests in flight)
    aka:
      - requests in flight
      - in-flight requests
    definition: How many requests a service is handling at the same moment.
    see: scaling-services
    source: *a9
  - id: littles-law
    term: Little's law
    definition: Requests in flight equal throughput times latency, for a stable system.
    see: scaling-services
    source: *a9
  - id: connection-pool
    term: Connection pool
    aka:
      - connection pooling
    definition: A fixed set of open database connections that threads borrow and return, instead of opening new ones.
    see: scaling-services
    source:
      title: About Pool Sizing (HikariCP wiki)
      url: https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
      verifiedOn: 2026-10-20
  - id: backpressure
    term: Backpressure
    aka:
      - back-pressure
      - back pressure
    definition: A struggling component signals upstream to send less, instead of failing or dropping work.
    see: scaling-services
    source:
      title: "The Reactive Manifesto: Glossary, Back-Pressure"
      url: https://www.reactivemanifesto.org/glossary
      verifiedOn: 2026-10-20
  - id: availability-term
    term: Availability (uptime)
    aka:
      - service availability
    definition: The share of time a service works when needed, such as 99.9% in a month.
    see: scaling-services
    source:
      title: Availability (AWS Well-Architected, Reliability Pillar)
      url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html
      verifiedOn: 2026-10-20
  - id: reliability
    term: Reliability
    definition: A workload performing its intended function correctly and consistently whenever it is expected to.
    see: scaling-services
    source:
      title: Reliability pillar (AWS Well-Architected Framework)
      url: https://docs.aws.amazon.com/wellarchitected/latest/framework/reliability.html
      verifiedOn: 2026-10-20
  - id: synchronous-communication
    term: Synchronous communication
    aka:
      - sync communication
      - synchronous call
      - request-response
    definition: The caller sends a request and waits for the reply before it can finish, as with HTTP.
    see: sync-and-async-communication
    source:
      title: Communication in a microservice architecture (Microsoft Learn, .NET microservices guide)
      url: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/architect-microservice-container-applications/communication-in-microservice-architecture
      verifiedOn: 2026-10-20
  - id: asynchronous-communication
    term: Asynchronous communication
    aka:
      - async communication
      - asynchronous messaging
    definition: The sender passes a message, usually to a broker, and carries on without waiting for the receiver.
    see: sync-and-async-communication
    source:
      title: Communication in a microservice architecture (Microsoft Learn, .NET microservices guide)
      url: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/architect-microservice-container-applications/communication-in-microservice-architecture
      verifiedOn: 2026-10-20
  - id: temporal-coupling
    term: Temporal coupling
    aka: []
    definition: Both services must be running at the same moment for a call to work; sync calls have it.
    see: sync-and-async-communication
    source:
      title: "Pattern: Messaging (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/communication-style/messaging.html
      verifiedOn: 2026-10-20
  - id: rest
    term: REST
    aka:
      - RESTful
      - representational state transfer
    definition: "An architectural style for network APIs: resources, a uniform interface and stateless requests (Roy Fielding, 2000)."
    see: rest-apis
    source:
      title: "Architectural Styles and the Design of Network-based Software Architectures, chapter 5: REST (Roy Fielding, 2000)"
      url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
      verifiedOn: 2026-10-20
  - id: idempotent-method
    term: Idempotent method
    aka:
      - idempotent methods
      - idempotent HTTP method
    definition: "An HTTP method whose repeats have the effect of one call: PUT, DELETE and the safe methods."
    see: rest-apis
    source:
      title: "RFC 9110: HTTP Semantics, 9.2.2 Idempotent Methods"
      url: https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods
      verifiedOn: 2026-10-20
  - id: dto
    term: DTO
    aka:
      - data transfer object
      - data transfer objects
    definition: A plain object that carries data across a process boundary, kept separate from database entities.
    see: rest-apis
    source:
      title: Data Transfer Object (Martin Fowler, Patterns of Enterprise Application Architecture)
      url: https://martinfowler.com/eaaCatalog/dataTransferObject.html
      verifiedOn: 2026-10-20
  - id: api-contract
    term: API contract
    aka:
      - API contracts
    definition: The agreed requests, responses, errors and behaviour of an API, often written as an OpenAPI document.
    see: rest-apis
    source:
      title: OpenAPI Specification v3.2.1
      url: https://spec.openapis.org/oas/latest.html
      verifiedOn: 2026-10-20
  - id: openapi
    term: OpenAPI
    aka:
      - OpenAPI Specification
    definition: A standard, language-neutral way to describe HTTP APIs; version 3.2.1 came out in September 2026.
    see: rest-apis
    source:
      title: OpenAPI Specification v3.2.1
      url: https://spec.openapis.org/oas/latest.html
      verifiedOn: 2026-10-20
  - id: api-versioning
    term: API versioning
    aka:
      - versioned API
    definition: Shipping a breaking change as a new version, marked in the URI, query string, a header or media type.
    see: rest-apis
    source:
      title: "Web API design best practices: versioning (Azure Architecture Center)"
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
      verifiedOn: 2026-10-20
  - id: problem-details
    term: Problem details (RFC 9457)
    aka:
      - problem details
      - application/problem+json
    definition: A standard JSON error body with type, title, status, detail and instance; it replaced RFC 7807 in 2023.
    see: rest-apis
    source:
      title: "RFC 9457: Problem Details for HTTP APIs"
      url: https://www.rfc-editor.org/rfc/rfc9457.html
      verifiedOn: 2026-10-20
  - id: grpc-term
    term: gRPC
    aka: []
    definition: "An RPC framework: contracts in .proto files, generated stubs, Protocol Buffers messages over HTTP/2."
    see: grpc
    source:
      title: gRPC FAQ (grpc.io)
      url: https://grpc.io/docs/what-is-grpc/faq/
      verifiedOn: 2026-10-20
  - id: protocol-buffers
    term: Protocol Buffers
    aka:
      - protobuf
    definition: Google's binary serialisation format and schema language; smaller and faster to parse than JSON.
    see: grpc
    source:
      title: Protocol Buffers overview (protobuf.dev)
      url: https://protobuf.dev/overview/
      verifiedOn: 2026-10-20
  - id: grpc-deadline
    term: Deadline (gRPC)
    aka:
      - gRPC deadline
      - DEADLINE_EXCEEDED
    definition: How long a gRPC client will wait; once passed, the call fails with DEADLINE_EXCEEDED.
    see: grpc
    source:
      title: Deadlines (grpc.io guides)
      url: https://grpc.io/docs/guides/deadlines/
      verifiedOn: 2026-10-20
  - id: idempotency-term
    term: Idempotency
    aka:
      - idempotent operation
    definition: Doing an operation many times has the same effect as doing it once.
    see: idempotency
    source:
      title: "RFC 9110: HTTP Semantics, 9.2.2 Idempotent Methods"
      url: https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods
      verifiedOn: 2026-10-20
  - id: idempotency-key
    term: Idempotency key
    aka:
      - Idempotency-Key
    definition: A unique client-made value sent with a request so the server can recognise retries and answer them safely.
    see: idempotency
    source:
      title: The Idempotency-Key HTTP Header Field (IETF httpapi draft-07)
      url: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
      verifiedOn: 2026-10-20
  - id: api-gateway-term
    term: API gateway
    aka:
      - API gateways
    definition: The single entry point for clients; it routes requests to services and applies shared policies.
    see: api-gateway
    source:
      title: "Pattern: API Gateway / Backends for Frontends (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/apigateway.html
      verifiedOn: 2026-10-20
  - id: backend-for-frontend
    term: Backend for Frontend
    aka:
      - BFF
      - backends for frontends
    definition: A separate API gateway for each kind of client, such as web, mobile or third-party apps.
    see: api-gateway
    source:
      title: "Pattern: API Gateway / Backends for Frontends (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/apigateway.html
      verifiedOn: 2026-10-20
  - id: tls-termination
    term: TLS termination
    aka:
      - TLS offloading
    definition: Decrypting client HTTPS at a gateway or load balancer; traffic on to the services should be re-encrypted.
    see: api-gateway
    source:
      title: Gateway Offloading pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-offloading
      verifiedOn: 2026-10-20
  - id: cross-cutting-concern
    term: Cross-cutting concern
    aka:
      - cross-cutting concerns
    definition: A need shared by many services, such as authentication, logging, monitoring or throttling.
    see: api-gateway
    source:
      title: Gateway Offloading pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-offloading
      verifiedOn: 2026-10-20
  - id: service-discovery-term
    term: Service discovery
    aka: []
    definition: Finding the current network locations of a service's instances, usually through a service registry.
    see: service-discovery
    source:
      title: "Pattern: Service registry (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/service-registry.html
      verifiedOn: 2026-10-20
  - id: service-registry
    term: Service registry
    aka: []
    definition: A database of service instances and their addresses; instances register on startup and leave on shutdown.
    see: service-discovery
    source:
      title: "Pattern: Service registry (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/service-registry.html
      verifiedOn: 2026-10-20
  - id: client-side-discovery
    term: Client-side discovery
    aka: []
    definition: The calling service queries the registry and chooses an instance itself.
    see: service-discovery
    source:
      title: "Pattern: Client-side service discovery (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/client-side-discovery.html
      verifiedOn: 2026-10-20
  - id: server-side-discovery
    term: Server-side discovery
    aka: []
    definition: The caller sends to a router at a known address; the router looks up the registry and forwards.
    see: service-discovery
    source:
      title: "Pattern: Server-side service discovery (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/server-side-discovery.html
      verifiedOn: 2026-10-20
  - id: eureka
    term: Eureka
    aka:
      - Netflix Eureka
      - Eureka server
    definition: Netflix's service registry, used through Spring Cloud Netflix; clients renew with a heartbeat every 30 seconds.
    see: service-discovery
    source:
      title: "Spring Cloud Netflix 5.0: Service Discovery with Eureka"
      url: https://docs.spring.io/spring-cloud-netflix/reference/spring-cloud-netflix.html
      verifiedOn: 2026-10-20
  - id: health-check
    term: Health check
    aka:
      - health checks
    definition: A regular test of an instance; instances that fail stop getting traffic until they pass again.
    see: load-balancing
    source:
      title: What is an Application Load Balancer? (AWS Elastic Load Balancing)
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      verifiedOn: 2026-10-20
  - id: load-balancer
    term: Load balancer
    aka:
      - load balancers
    definition: A component that spreads incoming requests across several instances, sending only to healthy ones.
    see: load-balancing
    source:
      title: What is an Application Load Balancer? (AWS Elastic Load Balancing)
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      verifiedOn: 2026-10-20
  - id: round-robin
    term: Round robin
    aka: []
    definition: Sending each new request to the next instance in a fixed rotation.
    see: load-balancing
    source:
      title: HTTP load balancing (NGINX documentation)
      url: https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/
      verifiedOn: 2026-10-20
  - id: least-connections
    term: Least connections
    aka:
      - least_conn
    definition: Sending each request to the instance with the fewest active connections.
    see: load-balancing
    source:
      title: HTTP load balancing (NGINX documentation)
      url: https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/
      verifiedOn: 2026-10-20
  - id: sticky-session
    term: Sticky session
    aka:
      - sticky sessions
    definition: Pinning a user's requests to one instance; the Twelve-Factor App says never to rely on it.
    see: load-balancing
    source:
      title: "The Twelve-Factor App: VI. Processes"
      url: https://12factor.net/processes
      verifiedOn: 2026-10-20
  - id: layer-7-load-balancing
    term: Layer 7 load balancing
    aka:
      - L7 load balancing
      - L7 load balancer
      - layer 7 load balancer
    definition: Balancing by reading each HTTP request, so traffic can be routed by path, host or header.
    see: load-balancing
    source:
      title: What is an Application Load Balancer? (AWS Elastic Load Balancing)
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
      verifiedOn: 2026-10-20
  - id: layer-4-load-balancing
    term: Layer 4 load balancing
    aka:
      - L4 load balancing
      - L4 load balancer
      - layer 4 load balancer
    definition: Balancing network connections by address and port, without reading the HTTP inside.
    see: load-balancing
    source:
      title: Elastic Load Balancing features (AWS)
      url: https://aws.amazon.com/elasticloadbalancing/features/
      verifiedOn: 2026-10-20
  - id: service-mesh-term
    term: Service mesh
    aka: []
    definition: A layer of proxies beside services that adds security, reliability and observability without app changes.
    see: service-mesh
    source:
      title: What is a service mesh? (Linkerd)
      url: https://linkerd.io/what-is-a-service-mesh/
      verifiedOn: 2026-10-20
  - id: sidecar
    term: Sidecar
    aka:
      - sidecar proxy
      - sidecar container
      - sidecars
    definition: A helper process or container deployed beside each app instance and sharing its life cycle.
    see: service-mesh
    source:
      title: Sidecar pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/sidecar
      verifiedOn: 2026-10-20
  - id: istio
    term: Istio
    aka: []
    definition: "An open-source service mesh: Envoy proxies form its data plane and istiod its control plane."
    see: service-mesh
    source:
      title: Istio architecture (istio.io, Istio 1.31)
      url: https://istio.io/latest/docs/ops/deployment/architecture/
      verifiedOn: 2026-10-20
  - id: linkerd
    term: Linkerd
    aka: []
    definition: An open-source service mesh that has used lightweight Rust proxies since 2018.
    see: service-mesh
    source:
      title: What is a service mesh? (Linkerd)
      url: https://linkerd.io/what-is-a-service-mesh/
      verifiedOn: 2026-10-20
  - id: timeout-term
    term: Timeout
    aka:
      - timeouts
      - time-out
    definition: A limit on how long a caller waits for an answer before giving up.
    see: timeouts-and-retries
    source:
      title: Timeouts, retries, and backoff with jitter (Amazon Builders' Library)
      url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
      verifiedOn: 2026-10-20
  - id: retry-term
    term: Retry (pattern)
    aka:
      - retry pattern
      - retry policy
      - retries
    definition: Sending a failed request again, hoping the fault was brief.
    see: timeouts-and-retries
    source:
      title: Retry pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/retry
      verifiedOn: 2026-10-20
  - id: exponential-backoff
    term: Exponential backoff
    aka:
      - backoff
    definition: Waiting longer before each new retry, usually doubling the wait up to a cap.
    see: timeouts-and-retries
    source:
      title: Timeouts, retries, and backoff with jitter (Amazon Builders' Library)
      url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
      verifiedOn: 2026-10-20
  - id: jitter
    term: Jitter
    aka:
      - full jitter
    definition: Randomness added to retry waits, so many clients do not retry at the same moment.
    see: timeouts-and-retries
    source:
      title: Exponential Backoff And Jitter (AWS Architecture Blog)
      url: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
      verifiedOn: 2026-10-20
  - id: retry-storm
    term: Retry storm
    aka:
      - retry storms
    definition: A flood of retries that adds load to a service already failing, making it worse.
    see: timeouts-and-retries
    source:
      title: Addressing Cascading Failures (Google SRE book)
      url: https://sre.google/sre-book/addressing-cascading-failures/
      verifiedOn: 2026-10-20
  - id: retry-budget
    term: Retry budget
    aka:
      - retry quota
    definition: A cap on retries per client or process; once used up, calls fail without retrying.
    see: timeouts-and-retries
    source:
      title: Handling Overload (Google SRE book)
      url: https://sre.google/sre-book/handling-overload/
      verifiedOn: 2026-10-20
  - id: transient-fault
    term: Transient fault
    aka:
      - transient error
      - transient errors
      - transient failure
      - transient faults
    definition: A short-lived failure, like a dropped connection or a busy service, that may succeed on a retry.
    see: timeouts-and-retries
    source:
      title: Retry pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/retry
      verifiedOn: 2026-10-20
  - id: cascading-failure
    term: Cascading failure
    aka:
      - cascading failures
    definition: "A failure that spreads: one sick service makes its callers fail, then their callers."
    see: circuit-breaker
    source:
      title: Addressing Cascading Failures (Google SRE book)
      url: https://sre.google/sre-book/addressing-cascading-failures/
      verifiedOn: 2026-10-20
  - id: circuit-breaker-term
    term: Circuit breaker
    aka:
      - circuit breakers
    definition: A guard that stops calls to a failing dependency for a while and fails fast instead.
    see: circuit-breaker
    source:
      title: CircuitBreaker (Martin Fowler, bliki)
      url: https://martinfowler.com/bliki/CircuitBreaker.html
      verifiedOn: 2026-10-20
  - id: closed-state-term
    term: CLOSED (circuit breaker)
    aka:
      - CLOSED state
    definition: "The normal breaker state: calls pass through and their results are counted."
    see: circuit-breaker
    source:
      title: CircuitBreaker (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/circuitbreaker
      verifiedOn: 2026-10-20
  - id: open-state-term
    term: OPEN (circuit breaker)
    aka:
      - OPEN state
    definition: "The tripped breaker state: calls are rejected at once without reaching the dependency."
    see: circuit-breaker
    source:
      title: CircuitBreaker (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/circuitbreaker
      verifiedOn: 2026-10-20
  - id: half-open-state-term
    term: HALF_OPEN (circuit breaker)
    aka:
      - HALF_OPEN
      - half-open state
    definition: "The test state: a few trial calls decide whether the breaker closes or opens again."
    see: circuit-breaker
    source:
      title: CircuitBreaker (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/circuitbreaker
      verifiedOn: 2026-10-20
  - id: failure-rate-threshold
    term: Failure rate threshold
    aka:
      - failureRateThreshold
    definition: "The share of failed calls, in percent, at which a breaker opens. Resilience4j default: 50%."
    see: circuit-breaker
    source:
      title: CircuitBreaker (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/circuitbreaker
      verifiedOn: 2026-10-20
  - id: breaker-sliding-window-term
    term: Sliding window (circuit breaker)
    aka:
      - count-based sliding window
      - time-based sliding window
    definition: "The recent calls a breaker measures: the last N calls or the last N seconds."
    see: circuit-breaker
    source:
      title: CircuitBreaker (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/circuitbreaker
      verifiedOn: 2026-10-20
  - id: fail-fast
    term: Fail fast
    aka:
      - fails fast
      - failing fast
    definition: Return an error at once when the call is unlikely to succeed, instead of waiting.
    see: circuit-breaker
    source:
      title: Circuit Breaker pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker
      verifiedOn: 2026-10-20
  - id: resilience4j-term
    term: Resilience4j
    definition: "A Java fault-tolerance library: circuit breaker, retry, bulkhead, rate limiter and time limiter."
    see: circuit-breaker
    source:
      title: Getting started with Spring Boot (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/getting-started-3
      verifiedOn: 2026-10-20
  - id: hystrix
    term: Hystrix
    aka:
      - Netflix Hystrix
    definition: Netflix's older circuit-breaker library, now in maintenance mode; Netflix points new projects to Resilience4j.
    see: circuit-breaker
    source:
      title: "Hystrix README: maintenance mode, use resilience4j (Netflix, GitHub)"
      url: https://github.com/Netflix/Hystrix
      verifiedOn: 2026-10-20
  - id: bulkhead-term
    term: Bulkhead
    aka:
      - bulkheads
      - bulkhead pattern
    definition: Separate pools per dependency or client, so a failure in one cannot use up all resources.
    see: bulkhead
    source:
      title: Bulkhead pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
      verifiedOn: 2026-10-20
  - id: thread-pool-bulkhead-term
    term: Thread-pool bulkhead
    aka:
      - ThreadPoolBulkhead
      - thread pool bulkhead
    definition: A bulkhead that runs calls on its own fixed thread pool with a bounded queue.
    see: bulkhead
    source:
      title: Bulkhead (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/bulkhead
      verifiedOn: 2026-10-20
  - id: semaphore-bulkhead-term
    term: Semaphore bulkhead
    aka:
      - SemaphoreBulkhead
    definition: A bulkhead that only counts concurrent calls and rejects those over the limit.
    see: bulkhead
    source:
      title: Bulkhead (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/bulkhead
      verifiedOn: 2026-10-20
  - id: rate-limiting-term
    term: Rate limiting
    aka:
      - rate limit
      - rate limits
      - rate limiter
      - throttling
    definition: Capping how many requests a client may send in a time period.
    see: rate-limiting
    source:
      title: Scaling your API with rate limiters (Stripe engineering blog)
      url: https://stripe.com/blog/rate-limiters
      verifiedOn: 2026-10-20
  - id: token-bucket
    term: Token bucket
    definition: "A rate-limit algorithm: tokens refill steadily, each request spends one, an empty bucket means reject."
    see: rate-limiting
    source:
      title: Scaling your API with rate limiters (Stripe engineering blog)
      url: https://stripe.com/blog/rate-limiters
      verifiedOn: 2026-10-20
  - id: leaky-bucket
    term: Leaky bucket
    definition: A rate-limit algorithm that lets requests out at a fixed rate and delays or rejects the excess.
    see: rate-limiting
    source:
      title: ngx_http_limit_req_module (nginx docs)
      url: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
      verifiedOn: 2026-10-20
  - id: fixed-window
    term: Fixed window
    aka:
      - fixed window counter
    definition: A rate-limit counter that resets at the start of each period, such as each minute.
    see: rate-limiting
    source:
      title: How we built rate limiting capable of scaling to millions of domains (Cloudflare blog)
      url: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
      verifiedOn: 2026-10-20
  - id: sliding-window-log
    term: Sliding window log
    definition: A rate-limit method that stores each request's time and counts those in the last period.
    see: rate-limiting
    source:
      title: How we built rate limiting capable of scaling to millions of domains (Cloudflare blog)
      url: https://blog.cloudflare.com/counting-things-a-lot-of-different-things/
      verifiedOn: 2026-10-20
  - id: retry-after
    term: Retry-After
    aka:
      - Retry-After header
    definition: "An HTTP response header telling the client how long to wait: seconds or a date."
    see: rate-limiting
    source:
      title: "RFC 9110 HTTP Semantics: Retry-After (section 10.2.3)"
      url: https://www.rfc-editor.org/rfc/rfc9110.html#name-retry-after
      verifiedOn: 2026-10-20
  - id: load-shedding
    term: Load shedding
    aka:
      - shed load
      - sheds load
    definition: Dropping some requests, lowest priority first, so an overloaded server keeps serving the rest.
    see: rate-limiting
    source:
      title: Addressing Cascading Failures (Google SRE book)
      url: https://sre.google/sre-book/addressing-cascading-failures/
      verifiedOn: 2026-10-20
  - id: fallback-term
    term: Fallback
    aka:
      - fallbacks
      - fallback method
    definition: An alternative answer used when the normal call fails or is not allowed.
    see: fallback-and-degradation
    source:
      title: Getting started with Spring Boot (Resilience4j docs)
      url: https://resilience4j.readme.io/docs/getting-started-3
      verifiedOn: 2026-10-20
  - id: graceful-degradation
    term: Graceful degradation
    aka:
      - degraded mode
    definition: Keeping the core function working with less, such as stale data or fewer features, during a failure.
    see: fallback-and-degradation
    source:
      title: REL05-BP01 Implement graceful degradation (AWS Well-Architected)
      url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_graceful_degradation.html
      verifiedOn: 2026-10-20
  - id: fault-tolerance
    term: Fault tolerance
    aka:
      - fault-tolerant
    definition: Continuing to give acceptable service even when some parts fail.
    see: fallback-and-degradation
    source:
      title: REL05-BP01 Implement graceful degradation (AWS Well-Architected)
      url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_graceful_degradation.html
      verifiedOn: 2026-10-20
  - id: fault-isolation
    term: Fault isolation
    definition: Keeping a failure inside one part, so the rest of the system keeps working.
    see: bulkhead
    source:
      title: Bulkhead pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
      verifiedOn: 2026-10-20
  - id: database-per-service-term
    term: Database per service
    aka:
      - database-per-service
    definition: Each service keeps its data private and shares it only through its API or events.
    see: database-per-service
    source:
      title: "Pattern: Database per service (microservices.io)"
      url: https://microservices.io/patterns/data/database-per-service.html
      verifiedOn: 2026-10-20
  - id: shared-database
    term: Shared database (anti-pattern)
    aka:
      - shared database
    definition: Several services read and write the same tables, so their schemas and releases are coupled.
    see: database-per-service
    source:
      title: "Pattern: Shared database (microservices.io)"
      url: https://microservices.io/patterns/data/shared-database.html
      verifiedOn: 2026-10-20
  - id: polyglot-persistence
    term: Polyglot persistence
    aka: []
    definition: Different services use different kinds of databases, each picking the one that fits its data.
    see: database-per-service
    source:
      title: Data sovereignty per microservice (Microsoft Learn)
      url: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/architect-microservice-container-applications/data-sovereignty-per-microservice
      verifiedOn: 2026-10-20
  - id: api-composition
    term: API composition
    aka:
      - API composer
    definition: "A query pattern: call the services that own the data and join their results in memory."
    see: database-per-service
    source:
      title: "Pattern: API Composition (microservices.io)"
      url: https://microservices.io/patterns/data/api-composition.html
      verifiedOn: 2026-10-20
  - id: cap-theorem
    term: CAP theorem
    aka:
      - CAP
    definition: During a network partition, replicated data cannot be both linearizable and available for every request.
    see: cap-and-consistency
    source: &a10
      title: Perspectives on the CAP Theorem (Gilbert and Lynch)
      url: https://groups.csail.mit.edu/tds/papers/Gilbert/Brewer2.pdf
      verifiedOn: 2026-10-20
  - id: network-partition
    term: Network partition
    aka:
      - network split
    definition: A network failure that splits nodes into groups that cannot exchange messages.
    see: cap-and-consistency
    source: *a10
  - id: linearizability
    term: Linearizability
    aka:
      - linearizable
      - strong consistency
      - strongly consistent
    definition: "Each operation appears to happen at one instant, in real-time order: a read sees the latest write."
    see: cap-and-consistency
    source:
      title: Linearizability (Jepsen)
      url: https://jepsen.io/consistency/models/linearizable
      verifiedOn: 2026-10-20
  - id: eventual-consistency
    term: Eventual consistency
    aka:
      - eventually consistent
    definition: If no new updates arrive, all copies eventually return the last written value; reads may be stale meanwhile.
    see: cap-and-consistency
    source: &a11
      title: Eventually Consistent, Revisited (Werner Vogels)
      url: https://www.allthingsdistributed.com/2008/12/eventually_consistent.html
      verifiedOn: 2026-10-20
  - id: read-your-writes
    term: Read-your-writes consistency
    aka:
      - read-your-writes
      - read your own write
    definition: After a client writes a value, its own later reads never return an older value.
    see: cap-and-consistency
    source: *a11
  - id: causal-consistency
    term: Causal consistency
    aka: []
    definition: Operations where one may have caused the other are seen by everyone in the same order.
    see: cap-and-consistency
    source:
      title: Causal consistency (Jepsen)
      url: https://jepsen.io/consistency/models/causal
      verifiedOn: 2026-10-20
  - id: pacelc
    term: PACELC
    aka: []
    definition: "Extends CAP: with a partition, choose availability or consistency; else, choose latency or consistency."
    see: cap-and-consistency
    source:
      title: Consistency Tradeoffs in Modern Distributed Database System Design (Abadi)
      url: https://www.cs.umd.edu/~abadi/papers/abadi-pacelc.pdf
      verifiedOn: 2026-10-20
  - id: split-brain
    term: Split brain
    aka:
      - split-brain
    definition: A cluster splits into parts that each act as the leader, making conflicting decisions.
    see: cap-and-consistency
    source:
      title: Quorum-based decision making (Elasticsearch docs)
      url: https://www.elastic.co/docs/deploy-manage/distributed-architecture/discovery-cluster-formation/modules-discovery-quorums
      verifiedOn: 2026-10-20
  - id: quorum
    term: Quorum
    aka:
      - majority quorum
    definition: "The number of nodes that must agree before a decision counts, usually a majority: (n/2)+1."
    see: cap-and-consistency
    source:
      title: "FAQ: why an odd number of cluster members (etcd v3.6 docs)"
      url: https://etcd.io/docs/v3.6/faq/
      verifiedOn: 2026-10-20
  - id: clock-skew
    term: Clock skew
    aka: []
    definition: Clocks on different machines disagree, so timestamps cannot safely order events across nodes.
    see: cap-and-consistency
    source: &a13
      title: How to do distributed locking (Martin Kleppmann)
      url: https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html
      verifiedOn: 2026-10-20
  - id: distributed-cache
    term: Distributed cache
    aka:
      - shared cache
    definition: A cache that all instances of a service share, such as Redis, so they see the same data.
    see: caching-in-microservices
    source:
      title: Caching guidance (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching
      verifiedOn: 2026-10-20
  - id: cache-aside
    term: Cache-aside
    aka:
      - lazy loading
      - lazy caching
    definition: The app reads the cache, loads from the database on a miss, and deletes the key after a write.
    see: caching-in-microservices
    source: &a12
      title: Caching best practices (AWS)
      url: https://aws.amazon.com/caching/best-practices/
      verifiedOn: 2026-10-20
  - id: write-through
    term: Write-through
    aka:
      - write-through cache
    definition: Every write updates the database and the cache together, so reads after a write hit fresh data.
    see: caching-in-microservices
    source: *a12
  - id: write-behind
    term: Write-behind
    aka: []
    definition: The cache accepts the write and stores it to the database later, after a delay.
    see: caching-in-microservices
    source:
      title: Configuring a MapStore (Hazelcast 5.7 docs)
      url: https://docs.hazelcast.com/hazelcast/5.7/mapstore/configuration-guide
      verifiedOn: 2026-10-20
  - id: ttl
    term: TTL
    aka:
      - time to live
    definition: A timeout on a cached key; when it runs out, the key is deleted automatically.
    see: caching-in-microservices
    source:
      title: EXPIRE (Redis docs)
      url: https://redis.io/docs/latest/commands/expire/
      verifiedOn: 2026-10-20
  - id: cache-stampede
    term: Cache stampede
    aka:
      - thundering herd
      - dog-piling
    definition: Many requests miss the same key at once and all run the same database query.
    see: caching-in-microservices
    source: *a12
  - id: cache-penetration
    term: Cache penetration
    aka: []
    definition: Requests for keys that exist nowhere always miss the cache and reach the database.
    see: caching-in-microservices
    source:
      title: Bloom filter (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/probabilistic/bloom-filter/
      verifiedOn: 2026-10-20
  - id: cache-avalanche
    term: Cache avalanche
    aka: []
    definition: Many keys with the same TTL expire together, and the database takes all their reads at once.
    see: caching-in-microservices
    source: *a12
  - id: redis
    term: Redis
    aka: []
    definition: A fast in-memory database, often used as the shared cache that all service instances read.
    see: caching-in-microservices
    source:
      title: About Redis
      url: https://redis.io/about/
      verifiedOn: 2026-10-20
  - id: distributed-lock
    term: Distributed lock
    aka: []
    definition: A lock held across processes, for example a Redis key set with NX and an expiry.
    see: caching-in-microservices
    source:
      title: Distributed locks with Redis (Redis docs)
      url: https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
      verifiedOn: 2026-10-20
  - id: fencing-token
    term: Fencing token
    aka: []
    definition: A number that grows with each lock grant; storage rejects writes carrying an older number.
    see: caching-in-microservices
    source: *a13
  - id: cqrs-term
    term: CQRS
    aka:
      - Command Query Responsibility Segregation
    definition: Separate models for changing data (commands) and for reading it (queries).
    see: cqrs
    source:
      title: CQRS (Martin Fowler)
      url: https://martinfowler.com/bliki/CQRS.html
      verifiedOn: 2026-10-20
  - id: command-model
    term: Command model
    aka:
      - write model
    definition: The CQRS side that validates commands, applies business rules and changes the data.
    see: cqrs
    source: &a14
      title: CQRS pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs
      verifiedOn: 2026-10-20
  - id: query-model
    term: Query model
    aka:
      - read model
      - read models
    definition: The CQRS side that serves queries from views shaped for reading, without business logic.
    see: cqrs
    source: *a14
  - id: materialized-view
    term: Materialized view
    aka:
      - materialized views
    definition: Read data computed ahead of time from source data; it can be thrown away and rebuilt.
    see: cqrs
    source:
      title: Materialized View pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/materialized-view
      verifiedOn: 2026-10-20
  - id: event-sourcing-term
    term: Event sourcing
    aka:
      - event-sourced
    definition: Storing every change as an event in an append-only store and deriving the state from them.
    see: event-sourcing
    source: &a15
      title: Event Sourcing pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
      verifiedOn: 2026-10-20
  - id: event-store
    term: Event store
    aka: []
    definition: The append-only database of events that is the system of record in event sourcing.
    see: event-sourcing
    source: *a15
  - id: event-snapshot
    term: Snapshot (event sourcing)
    aka: []
    definition: A saved copy of an entity's state, so a rebuild replays only the events after it.
    see: event-sourcing
    source:
      title: "Pattern: Event sourcing (microservices.io)"
      url: https://microservices.io/patterns/data/event-sourcing.html
      verifiedOn: 2026-10-20
  - id: event-replay
    term: Replay (event sourcing)
    aka:
      - event replay
    definition: Applying stored events in order to rebuild an entity's state or a read view.
    see: event-sourcing
    source: *a15
  - id: event-driven-architecture-term
    term: Event-driven architecture
    aka:
      - EDA
      - event-driven design
    definition: A style where services publish events about changes and other services react to them on their own.
    see: event-driven-architecture
    source:
      title: What do you mean by Event-Driven? (Martin Fowler)
      url: https://martinfowler.com/articles/201701-event-driven.html
      verifiedOn: 2026-10-20
  - id: domain-event
    term: Domain event
    aka: []
    definition: A message stating a fact that already happened, named in past tense, such as OrderCreated.
    see: event-driven-architecture
    source:
      title: "Implementing the microservice application layer: commands (Microsoft .NET microservices guide)"
      url: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-application-layer-implementation-web-api
      verifiedOn: 2026-10-20
  - id: command-message
    term: Command (messaging)
    aka:
      - command message
    definition: A message asking one receiver to perform an action, such as ReserveStock; the receiver may refuse it.
    see: event-driven-architecture
    source:
      title: "Implementing the microservice application layer: commands (Microsoft .NET microservices guide)"
      url: https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-application-layer-implementation-web-api
      verifiedOn: 2026-10-20
  - id: schema-registry
    term: Schema registry
    aka: []
    definition: A service that stores event schemas and rejects incompatible changes; Confluent's default rule is BACKWARD.
    see: event-driven-architecture
    source:
      title: Schema evolution and compatibility (Confluent Schema Registry docs)
      url: https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html
      verifiedOn: 2026-10-20
  - id: message-broker
    term: Message broker
    aka:
      - event broker
    definition: Middleware that receives messages from producers, stores them and delivers them to consumers.
    see: message-brokers
    source:
      title: Publisher-Subscriber pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber
      verifiedOn: 2026-10-20
  - id: point-to-point-queue
    term: Point-to-point
    aka:
      - point-to-point queue
      - message queue
    definition: Messaging where each message on a queue is processed by exactly one consumer.
    see: message-brokers
    source:
      title: Competing Consumers pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers
      verifiedOn: 2026-10-20
  - id: publish-subscribe-topic
    term: Publish-subscribe
    aka:
      - pub/sub
      - pub-sub
      - publish/subscribe
    definition: Messaging where every subscriber receives its own copy of each published message.
    see: message-brokers
    source:
      title: Publisher-Subscriber pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber
      verifiedOn: 2026-10-20
  - id: competing-consumers
    term: Competing consumers
    aka: []
    definition: Several consumer instances read one queue, so each message is handled once and the load is shared.
    see: message-brokers
    source:
      title: Competing Consumers pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers
      verifiedOn: 2026-10-20
  - id: apache-kafka
    term: Apache Kafka
    aka:
      - Kafka
    definition: A distributed event-streaming platform storing records in replicated, partitioned topics that consumers can re-read.
    see: kafka-fundamentals
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: rabbitmq
    term: RabbitMQ
    aka: []
    definition: A message broker that routes messages through exchanges into queues and removes them once acknowledged.
    see: message-brokers
    source:
      title: AMQP 0-9-1 model explained (RabbitMQ docs)
      url: https://www.rabbitmq.com/tutorials/amqp-concepts
      verifiedOn: 2026-10-20
  - id: kafka-topic
    term: Topic (Kafka)
    aka:
      - Kafka topic
    definition: A named stream of records in Kafka, split into partitions, with many producers and consumers.
    see: kafka-fundamentals
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: kafka-partition
    term: Partition (Kafka)
    aka:
      - Kafka partition
    definition: An ordered, append-only slice of a Kafka topic; records with the same key go to one partition.
    see: kafka-fundamentals
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: kafka-offset
    term: Offset (Kafka)
    aka:
      - Kafka offset
      - consumer offset
      - committed offset
    definition: A record's position in a partition; a consumer commits the offset it has processed up to.
    see: kafka-fundamentals
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: consumer-group
    term: Consumer group
    aka:
      - group.id
    definition: Kafka consumers sharing one group id; each partition is assigned to exactly one consumer in the group.
    see: kafka-fundamentals
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: replication-factor
    term: Replication factor
    aka: []
    definition: How many copies of each partition Kafka keeps on different brokers; 3 is a common production setting.
    see: kafka-fundamentals
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: in-sync-replicas
    term: In-sync replicas
    aka:
      - ISR
    definition: Replicas caught up with the partition leader; a write counts as committed once all of them have it.
    see: kafka-fundamentals
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: acks-term
    term: acks (Kafka)
    aka:
      - acks=all
      - acks=1
      - acks=0
    definition: Producer setting for how many replicas must confirm a write; default all since Kafka 3.0, before that 1.
    see: kafka-fundamentals
    source:
      title: "Upgrading: notable changes in 3.0.0 (Apache Kafka 3.0 docs)"
      url: https://kafka.apache.org/30/getting-started/upgrade/
      verifiedOn: 2026-10-20
  - id: min-insync-replicas
    term: min.insync.replicas
    aka: []
    definition: Fewest in-sync replicas for an acks=all write to succeed; default 1 in Kafka 4.3.
    see: kafka-fundamentals
    source:
      title: Broker configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: kafka-retention
    term: Retention (Kafka)
    aka:
      - retention period
      - log.retention.hours
    definition: How long Kafka keeps records, read or not; 168 hours (7 days) by default in Kafka 4.3.
    see: kafka-fundamentals
    source:
      title: Broker configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: consumer-lag
    term: Consumer lag
    aka: []
    definition: "How far a consumer group is behind: log-end offset minus its current offset, per partition."
    see: kafka-fundamentals
    source:
      title: "Basic Kafka operations: checking consumer position (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: kraft-mode
    term: KRaft
    aka:
      - KRaft mode
    definition: Kafka's built-in metadata controllers; the only mode since Kafka 4.0, which removed ZooKeeper.
    see: kafka-fundamentals
    source:
      title: "Upgrading to 4.0: ZooKeeper mode removed (Apache Kafka docs)"
      url: https://kafka.apache.org/40/getting-started/upgrade/
      verifiedOn: 2026-10-20
  - id: at-most-once
    term: At-most-once
    aka: []
    definition: Delivery where a message is never repeated but may be lost.
    see: delivery-guarantees
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: at-least-once
    term: At-least-once
    aka: []
    definition: Delivery where a message is never lost but may arrive more than once.
    see: delivery-guarantees
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: exactly-once
    term: Exactly-once
    aka:
      - exactly-once semantics
      - EOS
    definition: Each message affects the result once; Kafka offers it for Kafka-to-Kafka processing with transactions.
    see: delivery-guarantees
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: idempotent-producer
    term: Idempotent producer
    aka:
      - enable.idempotence
    definition: A Kafka producer whose retries cannot write duplicates; on by default since Kafka 3.0.
    see: delivery-guarantees
    source:
      title: "Upgrading: notable changes in 3.0.0 (Apache Kafka 3.0 docs)"
      url: https://kafka.apache.org/30/getting-started/upgrade/
      verifiedOn: 2026-10-20
  - id: idempotent-consumer
    term: Idempotent consumer
    aka:
      - deduplication
      - message deduplication
    definition: A consumer that records processed message ids and discards repeats, so a duplicate changes nothing.
    see: delivery-guarantees
    source:
      title: Idempotent consumer (microservices.io)
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      verifiedOn: 2026-10-20
  - id: dual-write
    term: Dual write
    aka:
      - dual-write problem
    definition: Writing to a database and a broker as two separate steps, so one can succeed while the other fails.
    see: outbox-and-inbox
    source:
      title: Transactional outbox (microservices.io)
      url: https://microservices.io/patterns/data/transactional-outbox.html
      verifiedOn: 2026-10-20
  - id: transactional-outbox
    term: Transactional outbox
    aka:
      - outbox pattern
      - outbox table
    definition: Saving an outgoing event in an outbox table in the same transaction as the change; a relay publishes it.
    see: outbox-and-inbox
    source:
      title: Transactional outbox (microservices.io)
      url: https://microservices.io/patterns/data/transactional-outbox.html
      verifiedOn: 2026-10-20
  - id: transactional-inbox
    term: Transactional inbox
    aka:
      - inbox pattern
      - inbox table
    definition: A consumer-side table of received message ids, saved with the consumer's change, to block duplicate effects.
    see: outbox-and-inbox
    source:
      title: Idempotent consumer (microservices.io)
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      verifiedOn: 2026-10-20
  - id: change-data-capture
    term: Change data capture
    aka:
      - CDC
    definition: Streaming row changes from a database's transaction log to other systems; Debezium is a common tool.
    see: outbox-and-inbox
    source:
      title: Debezium features (Debezium docs)
      url: https://debezium.io/documentation/reference/stable/features.html
      verifiedOn: 2026-10-20
  - id: dead-letter-queue
    term: Dead-letter queue
    aka:
      - DLQ
      - dead-letter topic
      - DLT
    definition: A place where messages that keep failing are parked for inspection and replay.
    see: dead-letter-queues
    source:
      title: Competing Consumers pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers
      verifiedOn: 2026-10-20
  - id: poison-message
    term: Poison message
    aka: []
    definition: A message that fails processing every time, for example because its data is malformed.
    see: dead-letter-queues
    source:
      title: Competing Consumers pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers
      verifiedOn: 2026-10-20
  - id: distributed-transaction
    term: Distributed transaction
    aka:
      - global transaction
    definition: One transaction that must commit or roll back across several independent databases or resources.
    see: distributed-transactions
    source:
      title: "Transaction management: local vs global transactions (Spring Framework 7.0 reference)"
      url: https://docs.spring.io/spring-framework/reference/data-access/transaction/motivation.html
      verifiedOn: 2026-10-20
  - id: two-phase-commit
    term: Two-phase commit
    aka:
      - 2PC
    definition: A coordinator asks every participant to prepare, then tells all to commit or all to roll back.
    see: distributed-transactions
    source:
      title: XA transactions (MySQL 9.7 Reference Manual)
      url: https://dev.mysql.com/doc/refman/9.7/en/xa.html
      verifiedOn: 2026-10-20
  - id: saga-term
    term: Saga
    aka:
      - saga pattern
    definition: A sequence of local transactions with compensating transactions to undo finished steps; named in a 1987 paper.
    see: saga
    source:
      title: Sagas (Garcia-Molina and Salem, SIGMOD 1987)
      url: https://www.cs.cornell.edu/andru/cs711/2002fa/reading/sagas.pdf
      verifiedOn: 2026-10-20
  - id: compensating-transaction
    term: Compensating transaction
    aka:
      - compensating action
    definition: A business action that offsets an earlier completed step, such as a refund; it may not restore the old state.
    see: saga
    source:
      title: Compensating Transaction pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction
      verifiedOn: 2026-10-20
  - id: saga-orchestration
    term: Orchestration (saga)
    aka:
      - saga orchestration
      - saga orchestrator
    definition: A saga where a central orchestrator tells each service which step to run and tracks the state.
    see: saga
    source:
      title: Saga design pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/saga
      verifiedOn: 2026-10-20
  - id: saga-choreography
    term: Choreography (saga)
    aka:
      - saga choreography
    definition: "A saga with no central controller: each service reacts to events and publishes the next one."
    see: saga
    source:
      title: Saga design pattern (Azure Architecture Center)
      url: https://learn.microsoft.com/en-us/azure/architecture/patterns/saga
      verifiedOn: 2026-10-20
  - id: authentication
    term: Authentication
    definition: Verifying who the caller is, a user or a service, from a password, token or certificate.
    see: microservices-security
    source:
      title: Authorization Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: authorization
    term: Authorization
    aka:
      - authorisation
    definition: Deciding whether an identified caller may do this action on this resource.
    see: microservices-security
    source:
      title: Authorization Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: zero-trust
    term: Zero trust
    aka:
      - zero-trust security
      - zero trust architecture
    definition: No trust from network location; every request is authenticated and authorised.
    see: microservices-security
    source:
      title: SP 800-207 Zero Trust Architecture (NIST)
      url: https://csrc.nist.gov/pubs/sp/800/207/final
      verifiedOn: 2026-10-20
  - id: mtls
    term: mTLS
    aka:
      - mutual TLS
    definition: TLS where both sides present certificates, so each proves its identity and traffic is encrypted.
    see: microservices-security
    source:
      title: Microservices Security Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: least-privilege
    term: Least privilege
    aka:
      - principle of least privilege
    definition: Give each user or service only the minimum permissions its job needs.
    see: microservices-security
    source:
      title: Authorization Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: secrets-management
    term: Secrets management
    definition: Central storage, access control, auditing and rotation of passwords, keys and certificates.
    see: configuration-management
    source:
      title: Secrets Management Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: encryption-in-transit
    term: Encryption in transit
    aka:
      - data in transit
    definition: Protecting data on the network, usually with TLS, so others cannot read or change it.
    see: microservices-security
    source:
      title: Transport Layer Security Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: encryption-at-rest
    term: Encryption at rest
    aka:
      - data at rest
    definition: Protecting stored data, such as databases, files and backups, with encryption.
    see: microservices-security
    source:
      title: Cryptographic Storage Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: audit-logging
    term: Audit logging
    aka:
      - audit log
      - audit logs
    definition: Recording security-relevant actions, who did what and when, for accountability.
    see: microservices-security
    source:
      title: Microservices Security Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: jwt
    term: JWT
    aka:
      - JSON Web Token
      - JWTs
    definition: A compact token of JSON claims, signed (JWS) or encrypted (JWE); RFC 7519.
    see: jwt-and-oauth
    source:
      title: RFC 7519 JSON Web Token (JWT)
      url: https://www.rfc-editor.org/rfc/rfc7519
      verifiedOn: 2026-10-20
  - id: jwt-claim
    term: Claim (JWT)
    aka:
      - JWT claims
      - registered claims
    definition: One field in a JWT, such as sub, iss, aud or exp.
    see: jwt-and-oauth
    source:
      title: RFC 7519 JSON Web Token (JWT)
      url: https://www.rfc-editor.org/rfc/rfc7519
      verifiedOn: 2026-10-20
  - id: access-token
    term: Access token
    aka:
      - access tokens
    definition: A credential an app sends to an API; it stands for granted scopes and a lifetime.
    see: jwt-and-oauth
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: refresh-token
    term: Refresh token
    aka:
      - refresh tokens
    definition: A credential sent only to the authorization server to get a new access token.
    see: jwt-and-oauth
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: id-token
    term: ID token
    aka:
      - ID tokens
    definition: An OpenID Connect JWT that tells the client app who logged in and how.
    see: jwt-and-oauth
    source:
      title: OpenID Connect Core 1.0
      url: https://openid.net/specs/openid-connect-core-1_0.html
      verifiedOn: 2026-10-20
  - id: oauth-2
    term: OAuth 2.0
    aka:
      - OAuth
      - OAuth2
    definition: A framework that lets an app get a scoped access token to call an API; RFC 6749.
    see: jwt-and-oauth
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: openid-connect
    term: OpenID Connect
    aka:
      - OIDC
    definition: An identity layer on OAuth 2.0 that adds the ID token for login.
    see: jwt-and-oauth
    source:
      title: OpenID Connect Core 1.0
      url: https://openid.net/specs/openid-connect-core-1_0.html
      verifiedOn: 2026-10-20
  - id: authorization-code-flow
    term: Authorization code flow
    aka:
      - authorization code grant
      - authorization code
    definition: The user logs in at the authorization server; the app swaps the returned code for tokens.
    see: jwt-and-oauth
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: pkce
    term: PKCE
    aka:
      - Proof Key for Code Exchange
    definition: A one-time secret that stops a stolen authorization code being swapped for tokens; RFC 7636.
    see: jwt-and-oauth
    source:
      title: RFC 7636 Proof Key for Code Exchange (PKCE)
      url: https://www.rfc-editor.org/rfc/rfc7636
      verifiedOn: 2026-10-20
  - id: client-credentials-flow
    term: Client credentials flow
    aka:
      - client credentials grant
      - client-credentials
    definition: A service gets an access token with its own credentials; no user is involved.
    see: jwt-and-oauth
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: identity-provider
    term: Identity provider (IdP)
    aka:
      - IdP
      - identity provider
      - authorization server
      - OpenID provider
    definition: The server where users log in and that issues tokens; OAuth calls it the authorization server.
    see: jwt-and-oauth
    source:
      title: OpenID Connect Core 1.0
      url: https://openid.net/specs/openid-connect-core-1_0.html
      verifiedOn: 2026-10-20
  - id: oauth-scope
    term: Scope (OAuth)
    aka:
      - OAuth scope
      - OAuth scopes
    definition: A named permission an access token grants, such as orders.read.
    see: jwt-and-oauth
    source:
      title: RFC 6749 The OAuth 2.0 Authorization Framework
      url: https://www.rfc-editor.org/rfc/rfc6749
      verifiedOn: 2026-10-20
  - id: api-key
    term: API key
    aka:
      - API keys
    definition: A secret string an app sends with each call; do not rely on it alone for sensitive data.
    see: jwt-and-oauth
    source:
      title: "REST Security Cheat Sheet: API keys (OWASP)"
      url: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: bearer-token
    term: Bearer token
    aka:
      - Bearer scheme
      - bearer tokens
    definition: "A token that works for whoever holds it, sent as Authorization: Bearer; RFC 6750."
    see: jwt-and-oauth
    source:
      title: RFC 6750 OAuth 2.0 Bearer Token Usage
      url: https://www.rfc-editor.org/rfc/rfc6750
      verifiedOn: 2026-10-20
  - id: structured-logging
    term: Structured logging
    aka:
      - structured logs
      - structured log
    definition: Logs with a stable schema of named, typed fields, often JSON, so tools can parse them.
    see: observability
    source:
      title: "Logs: structured logs (OpenTelemetry docs)"
      url: https://opentelemetry.io/docs/concepts/signals/logs/
      verifiedOn: 2026-10-20
  - id: correlation-id
    term: Correlation ID
    aka:
      - correlation IDs
    definition: An ID added to every log line of one call chain so the lines can be grouped.
    see: observability
    source:
      title: Microservices Security Cheat Sheet (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
      verifiedOn: 2026-10-20
  - id: centralised-logging
    term: Centralised logging
    aka:
      - log aggregation
      - centralized logging
    definition: Collecting the logs of all service instances into one searchable store.
    see: observability
    source:
      title: "Pattern: Log aggregation (microservices.io)"
      url: https://microservices.io/patterns/observability/application-logging.html
      verifiedOn: 2026-10-20
  - id: high-cardinality
    term: High cardinality
    aka:
      - high-cardinality
    definition: A label with many distinct values, such as user IDs; each value makes a new time series.
    see: observability
    source:
      title: Metric and label naming (Prometheus docs)
      url: https://prometheus.io/docs/practices/naming/
      verifiedOn: 2026-10-20
  - id: span-tracing
    term: Span (tracing)
    aka:
      - root span
      - child span
      - spans of a trace
    definition: One timed unit of work in a trace, with a name, parent, start and end.
    see: distributed-tracing
    source:
      title: Traces (OpenTelemetry docs)
      url: https://opentelemetry.io/docs/concepts/signals/traces/
      verifiedOn: 2026-10-20
  - id: trace-id
    term: Trace ID
    aka:
      - trace IDs
      - traceId
    definition: A 16-byte ID, written as 32 hex characters, shared by all spans of one trace.
    see: distributed-tracing
    source:
      title: Trace Context (W3C Recommendation)
      url: https://www.w3.org/TR/trace-context/
      verifiedOn: 2026-10-20
  - id: traceparent
    term: traceparent
    aka:
      - W3C Trace Context
      - trace context
    definition: The W3C header that carries version, trace ID, parent span ID and flags between services.
    see: distributed-tracing
    source:
      title: Trace Context (W3C Recommendation)
      url: https://www.w3.org/TR/trace-context/
      verifiedOn: 2026-10-20
  - id: opentelemetry
    term: OpenTelemetry
    aka:
      - OTel
    definition: A vendor-neutral CNCF project of APIs, SDKs and a Collector for traces, metrics and logs.
    see: distributed-tracing
    source:
      title: What is OpenTelemetry? (OpenTelemetry docs)
      url: https://opentelemetry.io/docs/what-is-opentelemetry/
      verifiedOn: 2026-10-20
  - id: trace-sampling
    term: Sampling (tracing)
    aka:
      - head sampling
      - tail sampling
      - trace sampling
    definition: Keeping only some traces to cut cost; head decides at the start, tail after the trace ends.
    see: distributed-tracing
    source:
      title: Sampling (OpenTelemetry docs)
      url: https://opentelemetry.io/docs/concepts/sampling/
      verifiedOn: 2026-10-20
  - id: golden-signals
    term: Golden signals
    aka:
      - four golden signals
    definition: "Latency, traffic, errors and saturation: the four metrics to watch first."
    see: metrics-and-slos
    source:
      title: Monitoring Distributed Systems (Google SRE book, ch. 6)
      url: https://sre.google/sre-book/monitoring-distributed-systems/
      verifiedOn: 2026-10-20
  - id: sli
    term: SLI
    aka:
      - service level indicator
    definition: A measured level of service, such as request latency or error rate.
    see: metrics-and-slos
    source:
      title: Service Level Objectives (Google SRE book, ch. 4)
      url: https://sre.google/sre-book/service-level-objectives/
      verifiedOn: 2026-10-20
  - id: slo
    term: SLO
