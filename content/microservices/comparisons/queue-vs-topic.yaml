id: queue-vs-topic
tech: microservices
title: Queue vs Topic
compares: [point-to-point-queue, publish-subscribe-topic]
gist:
  - "One message, one consumer: share the work"
  - "One message, every subscriber: broadcast"
diagrams:
  - |
    flowchart LR
      P[Producer] --> Q[[Queue]]
      Q -- "msg 1" --> C1[Worker 1]
      Q -- "msg 2" --> C2[Worker 2]
  - |
    flowchart LR
      P[Producer] --> T[[Topic]]
      T -- copy --> S1[Inventory]
      T -- copy --> S2[Notification]
diagramAlt: "Queue: a producer sends to a queue; message 1 goes to worker 1 and message 2 to worker 2. Topic: a producer sends to a topic; Inventory and Notification each get a copy of every message."
rows:
  - { aspect: "Each message goes to", a: "One consumer", b: "Every subscription" }
  - { aspect: "Adding a consumer", a: "Shares the load", b: "Gets its own copy of everything" }
  - { aspect: "Used for", a: "Work distribution, tasks", b: "Announcing events to many services" }
  - { aspect: "In Kafka", a: "All instances in one consumer group", b: "One consumer group per subscribing service" }
  - { aspect: "In RabbitMQ", a: "Consumers share one queue", b: "Fanout or topic exchange, one queue per subscriber" }
verdict: "Use a queue to spread work over instances; use a topic when several services each need every event."
sources:
  - title: "Competing Consumers pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers"
    verifiedOn: "2026-10-20"
  - title: "KafkaConsumer: consumer groups and topic subscriptions (Apache Kafka 4.3 Javadoc)"
    url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html"
    verifiedOn: "2026-10-20"
  - title: "AMQP 0-9-1 model explained: exchanges, queues, bindings (RabbitMQ docs)"
    url: "https://www.rabbitmq.com/tutorials/amqp-concepts"
    verifiedOn: "2026-10-20"
