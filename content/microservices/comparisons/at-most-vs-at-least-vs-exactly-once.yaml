id: at-most-vs-at-least-vs-exactly-once
tech: microservices
title: At-most-once vs At-least-once vs Exactly-once
compares: [at-most-once, at-least-once, exactly-once]
gist:
  - "May lose, never repeats"
  - "Never loses, may repeat"
  - "No loss, no repeat, inside one boundary"
explain:
  - "At-most-once delivers each message zero or one time. Nothing is ever repeated, but a message lost on the way is gone for good."
  - "At-least-once delivers each message one or more times. The sender keeps trying until delivery is confirmed, so nothing is lost, but the receiver can see repeats."
  - "Exactly-once means each message takes effect one time. Kafka offers it only for work that reads from and writes to Kafka inside one Kafka transaction."
example: "Notification Service receives PaymentCompleted for order 9001. At-most-once: a crash at the wrong moment means no email. At-least-once: a crash after sending but before marking the message done means a second email, unless the consumer records message ids and skips repeats."
rows:
  - { aspect: "Lost message", a: "Possible", b: "No", c: "No" }
  - { aspect: "Duplicate", a: "No", b: "Possible", c: "No, within the boundary" }
  - { aspect: "Kafka consumer", a: "Commit offset, then process", b: "Process, then commit offset", c: "Output and offsets in one Kafka transaction" }
  - { aspect: "Kafka default", a: "No", b: "Yes", c: "Opt in: transactions or Kafka Streams" }
  - { aspect: "You must add", a: "Accept the loss", b: "An idempotent consumer", c: "Idempotency for effects outside Kafka" }
verdict: "Plan for at-least-once and make consumers idempotent; Kafka's exactly-once covers only Kafka-to-Kafka work."
sayIt: "At-most-once may lose messages, at-least-once may repeat them, and exactly-once avoids both only inside one boundary, such as Kafka transactions. In practice I plan for at-least-once and make consumers idempotent, because effects outside Kafka can still repeat."
sources:
  - title: "Design: message delivery semantics (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
  - title: "Publisher-Subscriber pattern: delivery guarantees (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber"
    verifiedOn: "2026-10-20"
