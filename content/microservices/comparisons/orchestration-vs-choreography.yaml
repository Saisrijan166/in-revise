id: orchestration-vs-choreography
tech: microservices
title: Orchestration vs Choreography
compares: [saga-orchestration, saga-choreography]
gist:
  - "A conductor tells each service what to do"
  - "Services react to each other's events"
explain:
  - "In orchestration, one component, the orchestrator, runs the saga: it sends a command to each service in turn, waits for the reply, and stores how far the saga has gone."
  - "In choreography, no component is in charge. Each service listens for the previous step's event, does its own work, and publishes an event that triggers the next step."
example: "Order saga with orchestration: the orchestrator sends ReserveStock, then ChargePayment, then ConfirmOrder. With choreography: Order publishes OrderCreated, Inventory reacts and publishes StockReserved, Payment reacts and publishes PaymentCompleted, and Order confirms. Adding a fraud check means changing the orchestrator, or rewiring which events two services listen to."
diagrams:
  - |
    flowchart LR
      O[Order saga orchestrator] -- ReserveStock --> I[Inventory]
      O -- ChargePayment --> P[Payment]
  - |
    flowchart LR
      Or[Order] -- OrderCreated --> I[Inventory]
      I -- StockReserved --> P[Payment]
diagramAlt: "Orchestration: an order saga orchestrator sends ReserveStock to Inventory and ChargePayment to Payment. Choreography: Order publishes OrderCreated, Inventory reacts and publishes StockReserved, Payment reacts to that."
rows:
  - { aspect: "Flow lives in", a: "One orchestrator", b: "Spread across the services" }
  - { aspect: "Messages", a: "Commands to each step, replies back", b: "Events that trigger the next step" }
  - { aspect: "Fits", a: "Complex flows, many steps", b: "Simple flows, few services" }
  - { aspect: "Risk", a: "The orchestrator is one more point of failure", b: "Hard to follow, risk of cyclic dependencies, tests need every service running" }
  - { aspect: "Extra component", a: "Yes: the orchestrator", b: "None: no coordinator needed" }
verdict: "Choreography for a simple flow with few services; orchestration for complex flows or when more services will join."
sayIt: "Orchestration puts the saga's flow in one orchestrator that sends commands and tracks state, which keeps complex flows clear. Choreography lets services react to each other's events with no coordinator, which is simpler for a short flow but hard to follow as it grows."
sources:
  - title: "Saga design pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Saga (microservices.io)"
    url: "https://microservices.io/patterns/data/saga.html"
    verifiedOn: "2026-10-20"
