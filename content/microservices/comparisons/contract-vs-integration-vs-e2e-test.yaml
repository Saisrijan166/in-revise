id: contract-vs-integration-vs-e2e-test
tech: microservices
title: Contract vs Integration vs End-to-End Test
compares: [contract-test, integration-test, end-to-end-test]
gist:
  - "Do two services agree on the API?"
  - "Does my service work with real infrastructure?"
  - "Does the whole journey work across services?"
rows:
  - { aspect: "Scope", a: "One API or message between consumer and provider", b: "One service with its database or broker", c: "Many deployed services together" }
  - { aspect: "Runs in", a: "Each team's own build", b: "The service's build, often with Testcontainers", c: "A shared, deployed environment" }
  - { aspect: "Speed", a: "Fast and stable", b: "Slower: real infrastructure starts", c: "Slowest, often flaky" }
  - { aspect: "Catches", a: "Renamed or removed fields", b: "Wrong SQL, mapping or config", c: "Broken flows across many parts" }
  - { aspect: "How many", a: "One set per consumer and provider", b: "Some", c: "A few key journeys" }
verdict: "Lean on contract and integration tests; keep end-to-end tests for a handful of critical journeys."
sources:
  - title: "The Practical Test Pyramid (Ham Vocke, martinfowler.com)"
    url: "https://martinfowler.com/articles/practical-test-pyramid.html"
    verifiedOn: "2026-10-20"
  - title: "Introduction to contract testing (Pact docs)"
    url: "https://docs.pact.io/"
    verifiedOn: "2026-10-20"
  - title: "Testcontainers"
    url: "https://testcontainers.com/"
    verifiedOn: "2026-10-20"
