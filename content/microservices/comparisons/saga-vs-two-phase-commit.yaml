id: saga-vs-two-phase-commit
tech: microservices
title: Saga vs Two-Phase Commit
compares: [saga, two-phase-commit]
gist:
  - "Commit each step now; undo by compensation"
  - "All prepare, then all commit together"
rows:
  - { aspect: "Commits", a: "Each local step at once", b: "Everything together at the end" }
  - { aspect: "On failure", a: "Run compensating transactions", b: "Coordinator rolls everyone back" }
  - { aspect: "Isolation", a: "None: others see in-between states", b: "Prepared work stays hidden until commit" }
  - { aspect: "Locks", a: "Released after each local step", b: "Held while prepared, until the coordinator decides" }
  - { aspect: "Needs", a: "Messaging and idempotent steps", b: "Every resource supports 2PC (XA)" }
verdict: "Use a saga across microservices; keep ACID for changes that fit inside one service's database."
sources:
  - title: "Saga design pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga"
    verifiedOn: "2026-10-20"
  - title: "PREPARE TRANSACTION (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/sql-prepare-transaction.html"
    verifiedOn: "2026-10-20"
  - title: "XA transactions (MySQL 9.7 Reference Manual)"
    url: "https://dev.mysql.com/doc/refman/9.7/en/xa.html"
    verifiedOn: "2026-10-20"
