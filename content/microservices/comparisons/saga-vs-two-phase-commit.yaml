id: saga-vs-two-phase-commit
tech: microservices
title: Saga vs Two-Phase Commit
compares: [saga, two-phase-commit]
gist:
  - "Commit each step now; undo by compensation"
  - "All prepare, then all commit together"
explain:
  - "A saga runs one business transaction as a chain of local transactions, one per service. Each commits at once, and if a later step fails, compensating transactions undo the earlier steps."
  - "Two-phase commit makes several databases commit as one. A coordinator asks every participant to prepare and vote, then tells all of them to commit, or all of them to roll back."
example: "Placing an order: with a saga, Inventory commits the reservation at once, and if the ₹500 charge fails, a ReleaseStock step undoes it. With 2PC, Order and Inventory would both stay prepared, holding their locks, until the coordinator decides, and a coordinator crash would leave them waiting."
rows:
  - { aspect: "Commits", a: "Each local step at once", b: "Everything together at the end" }
  - { aspect: "On failure", a: "Run compensating transactions", b: "Coordinator rolls everyone back" }
  - { aspect: "Isolation", a: "None: others see in-between states", b: "Prepared work stays hidden until commit" }
  - { aspect: "Locks", a: "Released after each local step", b: "Held while prepared, until the coordinator decides" }
  - { aspect: "Needs", a: "Messaging and idempotent steps", b: "Every resource supports 2PC (XA)" }
verdict: "Use a saga across microservices; keep ACID for changes that fit inside one service's database."
sayIt: "2PC gives one atomic commit across databases, but prepared participants hold locks until the coordinator decides, and not every broker supports it. A saga commits each step locally and repairs failures with compensations, so I use sagas across services and ACID inside one."
sources:
