id: docker-vs-kubernetes
tech: microservices
title: Docker vs Kubernetes
compares: [docker, kubernetes]
gist:
  - "Builds images and runs containers"
  - "Runs, scales and heals containers on a cluster"
rows:
  - { aspect: "Main job", a: "Build, ship and run containers", b: "Schedule, scale, heal and connect containers" }
  - { aspect: "Works on", a: "The containers of one host (Docker Engine)", b: "A cluster of many nodes" }
  - { aspect: "Needs the other?", a: "No: runs containers without Kubernetes", b: "No: since 1.24 it uses containerd or CRI-O; Docker-built images still run" }
verdict: "Not either-or: build images with Docker (or any OCI tool) and run them in production on Kubernetes."
