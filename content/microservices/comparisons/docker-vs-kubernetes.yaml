id: docker-vs-kubernetes
tech: microservices
title: Docker vs Kubernetes
compares: [docker, kubernetes]
gist:
  - "Builds images and runs containers"
  - "Runs, scales and heals containers on a cluster"
explain:
  - "Docker is a set of tools that builds an image from a Dockerfile and runs containers from it, usually on one machine. It solves 'make the service run the same everywhere'."
  - "Kubernetes runs containers across a cluster of machines. It keeps the declared number of copies, replaces failed ones, gives them one stable name and rolls out new versions."
example: "A developer runs docker build to make order-service:1.4.2 and docker run to try it on a laptop. In production, a Kubernetes Deployment runs three Pods from the same image and a Service gives them the name order-service."
rows:
  - { aspect: "Main job", a: "Build, ship and run containers", b: "Schedule, scale, heal and connect containers" }
  - { aspect: "Works on", a: "The containers of one host (Docker Engine)", b: "A cluster of many nodes" }
  - { aspect: "Needs the other?", a: "No: runs containers without Kubernetes", b: "No: since 1.24 it runs any CRI runtime, such as containerd; Docker-built images still run" }
verdict: "Not either-or: build images with Docker (or any OCI tool) and run them in production on Kubernetes."
sayIt: "They work at different levels: Docker builds images and runs containers on one host, and Kubernetes runs, scales and heals those containers across a cluster. Kubernetes does not need Docker Engine; since 1.24 it uses a CRI runtime such as containerd, and Docker-built images still run."
sources:
  - title: "Docker overview (Docker docs)"
    url: "https://docs.docker.com/get-started/docker-overview/"
    verifiedOn: "2026-10-20"
  - title: "Overview: why you need Kubernetes (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/overview/"
    verifiedOn: "2026-10-20"
  - title: "Updated: Dockershim Removal FAQ (Kubernetes blog)"
    url: "https://kubernetes.io/blog/2022/02/17/dockershim-faq/"
    verifiedOn: "2026-10-20"
