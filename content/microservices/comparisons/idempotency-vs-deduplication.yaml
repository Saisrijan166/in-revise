id: idempotency-vs-deduplication
tech: microservices
title: Idempotency vs Deduplication
compares: [idempotency, request-deduplication]
gist:
  - "Repeating the operation changes nothing more"
  - "Spot a repeat by its id and skip it"
explain:
  - "Idempotency is a property of an operation: running it again has no further effect. Setting an order's status to PAID is idempotent by nature."
  - "Deduplication is a technique: the receiver records the ids it has already handled and skips any request or message whose id it has seen before."
example: "Payment Service stores each Idempotency-Key of POST /payments and returns the saved result to a repeat: deduplication that makes the POST idempotent. A handler that sets order 9001's status to PAID is idempotent with no stored ids at all."
rows:
  - { aspect: "Question it answers", a: "Is it safe to do this again?", b: "Have I seen this one before?" }
  - { aspect: "Needs stored state", a: "Not always: \"set status = PAID\" is safe by itself", b: "Yes: the ids already handled" }
  - { aspect: "Example", a: "PUT /orders/9001, or a POST with an Idempotency-Key", b: "A processed_messages table keyed by message id" }
  - { aspect: "Typical place", a: "API design and request handlers", b: "Message consumers (the inbox table)" }
verdict: "Design operations to be idempotent where you can; add deduplication by id where they cannot be, as for most messages."
sayIt: "Idempotency means repeating an operation does no extra harm; deduplication means spotting a repeat by its id and skipping it. I make operations idempotent where I can, and add deduplication with stored ids where I cannot, as for payment requests and most messages."
sources:
  - title: "RFC 9110: HTTP Semantics, 9.2.2 Idempotent Methods"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Idempotent Consumer (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    verifiedOn: "2026-10-20"
