id: circuit-breaker-vs-bulkhead
tech: microservices
title: "Circuit Breaker vs Bulkhead"
compares: [circuit-breaker, bulkhead]
gist:
  - "Stops calls to a dependency that keeps failing"
  - "Caps how many calls to one dependency run at once"
explain:
  - "A circuit breaker watches the results of recent calls to one dependency. When too many fail or are slow, it opens and rejects every call for a while, so callers fail fast."
  - "A bulkhead gives one dependency a fixed number of slots, such as 10 concurrent calls. Calls keep going, but a slow dependency can never hold more than its own slots."
example: "Payment becomes slow, not dead. At first, Payment's bulkhead keeps its calls to 10 slots, so Inventory calls still get threads. When the slow calls start timing out and the failure rate reaches the threshold, Payment's breaker opens, and Payment calls fail at once instead of filling the slots again."
rows:
  - { aspect: "Reacts to", a: "Failure rate and slow calls", b: "Number of calls in flight" }
  - { aspect: "Protects", a: "The caller, and gives the callee time to recover", b: "The caller's threads and connections" }
  - { aspect: "When it trips", a: "OPEN: every call is rejected for a wait time", b: "Full: only the extra calls are rejected" }
  - { aspect: "Resilience4j error", a: "CallNotPermittedException", b: "BulkheadFullException" }
verdict: "Use both: the bulkhead limits the damage while a dependency is slow; the breaker cuts it off once it clearly fails."
sayIt: "A circuit breaker decides whether to call a dependency at all: after too many failures it opens and fails fast. A bulkhead decides how many calls may run at once, so a slow dependency cannot take every thread. I use both on each important dependency."
sources:
