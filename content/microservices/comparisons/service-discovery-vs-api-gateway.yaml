id: service-discovery-vs-api-gateway
tech: microservices
title: Service Discovery vs API Gateway
compares: [service-discovery, api-gateway]
gist:
  - "Finds where the instances of a service are now"
  - "The single front door for outside clients"
explain:
  - "Service discovery is the system's internal address book. It keeps a live list of the instances of each service, so callers can find a healthy one by name."
  - "An API gateway is the front door for outside clients. It decides which service handles each external call and applies policies such as authentication and rate limits."
example: "The mobile app calls GET /orders/9001 on the gateway. The gateway's route says /orders belongs to order-service, and it asks discovery where order-service runs now, getting two live instances to choose from."
rows:
  - { aspect: "Answers", a: "Where is Payment Service running right now?", b: "Which service handles this external call, and is it allowed?" }
  - { aspect: "Used by", a: "Services, gateways and load balancers", b: "Browsers, mobile apps, partners" }
  - { aspect: "Holds", a: "A registry of instance addresses and health", b: "Routes and policies: auth, rate limits" }
  - { aspect: "Works with the other", a: "Feeds the gateway live addresses", b: "Asks discovery where to send each call" }
verdict: "Discovery is the address book inside the system; the gateway is the front door, and it uses discovery to route."
sayIt: "Service discovery tells callers where the instances of a service are running right now; an API gateway is the entry point for outside clients that routes calls and applies policies. The gateway uses discovery to find the instances it routes to."
sources:
  - title: "Pattern: Service registry (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/service-registry.html"
    verifiedOn: "2026-10-20"
  - title: "Pattern: API Gateway (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/apigateway.html"
    verifiedOn: "2026-10-20"
