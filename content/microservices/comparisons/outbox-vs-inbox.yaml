id: outbox-vs-inbox
tech: microservices
title: Outbox vs Inbox
compares: [transactional-outbox, transactional-inbox]
gist:
  - "Producer side: never lose an event"
  - "Consumer side: never apply an event twice"
rows:
  - { aspect: "Lives in", a: "The sending service's database", b: "The receiving service's database" }
  - { aspect: "Saved in the same transaction as", a: "The business change", b: "The consumer's own change" }
  - { aspect: "Stops", a: "Change saved but event never sent", b: "Same event applied twice" }
  - { aspect: "Leaves open", a: "The relay may send an event twice", b: "Nothing about lost sends" }
verdict: "Use both: the outbox makes sending reliable, the inbox makes receiving safe to repeat."
sources:
  - title: "Transactional outbox (microservices.io)"
    url: "https://microservices.io/patterns/data/transactional-outbox.html"
    verifiedOn: "2026-10-20"
  - title: "Idempotent consumer (microservices.io)"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    verifiedOn: "2026-10-20"
