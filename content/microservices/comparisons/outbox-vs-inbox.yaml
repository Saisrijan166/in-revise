id: outbox-vs-inbox
tech: microservices
title: Outbox vs Inbox
compares: [transactional-outbox, transactional-inbox]
gist:
  - "Producer side: never lose an event"
  - "Consumer side: never apply an event twice"
explain:
  - "The outbox is a table in the sending service's database. The service writes each event there in the same local transaction as the change, and a relay publishes it, so a committed change never loses its event."
  - "The inbox is a table in the receiving service's database. The consumer saves each event id there in the same transaction as its own change, so a delivered duplicate is recognised and skipped."
example: "Order Service saves order ord-456 and its OrderCreated outbox row together. The relay publishes the event, crashes before marking the row sent, and publishes it again. Inventory receives two copies; the second finds its eventId in the inbox, so stock is reserved once."
rows:
  - { aspect: "Lives in", a: "The sending service's database", b: "The receiving service's database" }
  - { aspect: "Saved in the same transaction as", a: "The business change", b: "The consumer's own change" }
  - { aspect: "Stops", a: "Change saved but event never sent", b: "Same event applied twice" }
  - { aspect: "Leaves open", a: "The relay may send an event twice", b: "Nothing about lost sends" }
verdict: "Use both: the outbox makes sending reliable, the inbox makes receiving safe to repeat."
sayIt: "The outbox is on the producer side: the event is saved with the business change and published after commit, so nothing is lost. The inbox is on the consumer side: processed ids are saved with the consumer's change, so a repeat is skipped. Reliable flows use both."
sources:
  - title: "Transactional outbox (microservices.io)"
    url: "https://microservices.io/patterns/data/transactional-outbox.html"
    verifiedOn: "2026-10-20"
  - title: "Idempotent consumer (microservices.io)"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    verifiedOn: "2026-10-20"
