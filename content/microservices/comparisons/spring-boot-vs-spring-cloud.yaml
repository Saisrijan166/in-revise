id: spring-boot-vs-spring-cloud
tech: microservices
title: Spring Boot vs Spring Cloud
compares: [spring-boot-built-in, spring-cloud-projects]
gist:
  - "Builds and runs one production-ready service"
  - "Adds the parts a system of many services needs"
rows:
  - { aspect: "Gives you", a: "Starters, auto-configuration, embedded server, Actuator", b: "Gateway, Config, discovery, LoadBalancer, CircuitBreaker" }
  - { aspect: "Scope", a: "One application", b: "Services that call each other over a network" }
  - { aspect: "Version (20-10-2026)", a: "Spring Boot 4.1", b: "Release train 2025.1 (Oakwood), for Boot 4.0 and 4.1" }
  - { aspect: "Used alone?", a: "Yes: many services need only Boot", b: "No: each release train matches Boot versions" }
  - { aspect: "On Kubernetes", a: "Same", b: "Spring Cloud Kubernetes reads discovery and config from the platform" }
verdict: "Start every service on Spring Boot; add a Spring Cloud project only for a distributed need you really have."
sources:
  - title: "Spring Boot project page (spring.io)"
    url: "https://spring.io/projects/spring-boot"
    verifiedOn: "2026-10-20"
  - title: "Spring Cloud project page: features, release trains and Boot compatibility (spring.io)"
    url: "https://spring.io/projects/spring-cloud"
    verifiedOn: "2026-10-20"
