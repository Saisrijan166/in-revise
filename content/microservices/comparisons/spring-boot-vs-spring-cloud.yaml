id: spring-boot-vs-spring-cloud
tech: microservices
title: Spring Boot vs Spring Cloud
compares: [spring-boot-built-in, spring-cloud-projects]
gist:
  - "Builds and runs one production-ready service"
  - "Adds the parts a system of many services needs"
explain:
  - "Spring Boot turns one Java app into a stand-alone, production-ready service: starters pick the libraries, auto-configuration wires them, and it ships an embedded server and Actuator."
  - "Spring Cloud is a family of projects on top of Spring Boot for systems of many services: Gateway, Config, discovery, LoadBalancer and CircuitBreaker, released together as a release train."
example: "Inventory Service needs only a REST API and a database, so it is a plain Spring Boot app. The shop's edge needs routing and auth checks, so the gateway adds Spring Cloud Gateway, and Order Service adds Spring Cloud CircuitBreaker for its calls to Payment."
rows:
  - { aspect: "Gives you", a: "Starters, auto-configuration, embedded server, Actuator", b: "Gateway, Config, discovery, LoadBalancer, CircuitBreaker" }
  - { aspect: "Scope", a: "One application", b: "Services that call each other over a network" }
  - { aspect: "Version (21-10-2026)", a: "Spring Boot 4.1", b: "Release train 2025.1 (Oakwood), for Boot 4.0 and 4.1 (4.1 from 2025.1.2)" }
  - { aspect: "Used alone?", a: "Yes: many services need only Boot", b: "No: each release train matches Boot versions" }
  - { aspect: "On Kubernetes", a: "Runs the same; nothing to add", b: "Spring Cloud Kubernetes reads discovery and config from the platform" }
verdict: "Start every service on Spring Boot; add a Spring Cloud project only for a distributed need you really have."
sayIt: "Spring Boot builds and runs one service. Spring Cloud adds distributed-system parts on top, such as a gateway, central config, discovery, load balancing and circuit breakers, and each release train matches certain Boot versions. Many services need only Boot."
sources:
  - title: "Spring Boot project page (spring.io)"
    url: "https://spring.io/projects/spring-boot"
    verifiedOn: "2026-10-20"
  - title: "Spring Cloud project page: features, release trains and Boot compatibility (spring.io)"
    url: "https://spring.io/projects/spring-cloud"
    verifiedOn: "2026-10-21"
