id: oauth2-vs-oidc
tech: microservices
title: OAuth 2.0 vs OpenID Connect
compares: [oauth-2-framework, openid-connect-layer]
gist:
  - "Authorisation: lets an app call an API for you"
  - "Authentication: tells the app who you are"
explain:
  - "OAuth 2.0 is an authorisation framework. It lets an app get an access token with limited scopes so it can call an API for a user or for itself, without seeing the user's password."
  - "OpenID Connect is an identity layer on top of OAuth 2.0. It adds an ID token, always a JWT, that tells the app who logged in and how."
example: "The shop's app shows \"Hello, Priya\" after login: it reads her name from the OIDC ID token. When the app then lists her orders, it sends the OAuth access token to the Order Service. The ID token never goes to the API."
rows:
  - { aspect: "Main token", a: "Access token", b: "ID token (always a JWT), plus the access token" }
  - { aspect: "Token is for", a: "The API (resource server)", b: "The client app: aud is its client ID" }
  - { aspect: "Request marker", a: "Scopes such as orders.read", b: "Must include the openid scope" }
  - { aspect: "Spec", a: "RFC 6749 (2012)", b: "OpenID Connect Core 1.0, built on OAuth 2.0" }
verdict: "Use OAuth 2.0 to give apps scoped access to APIs; add OpenID Connect when the app needs to log the user in."
sayIt: "OAuth 2.0 is for access: the app gets an access token to call APIs with given scopes. OpenID Connect adds login on top: with the openid scope, the app also gets an ID token, a JWT that says who the user is. Access token for the API, ID token for the app."
sources:
  - title: "RFC 6749 The OAuth 2.0 Authorization Framework"
    url: "https://www.rfc-editor.org/rfc/rfc6749"
    verifiedOn: "2026-10-20"
  - title: "OpenID Connect Core 1.0"
    url: "https://openid.net/specs/openid-connect-core-1_0.html"
    verifiedOn: "2026-10-20"
