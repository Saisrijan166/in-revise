id: cqrs-vs-event-sourcing
tech: microservices
title: CQRS vs Event Sourcing
compares: [cqrs, event-sourcing]
gist:
  - "Split the model: one for writes, others for reads"
  - "Store changes as events; state comes from replay"
explain:
  - "CQRS splits the code that changes data from the code that reads it. The write side checks rules and saves; read views shaped for each screen answer queries, so reads stay fast and simple."
  - "Event sourcing changes what you store: every change is kept as an event in an append-only stream, and the current state is rebuilt by replaying it. It keeps the full history for audit and rebuilds."
example: "The shop's 'My orders' page reads one view that combines Order and Payment data, while both services keep ordinary tables: that is CQRS alone. A payment ledger that stores every PaymentCharged and PaymentRefunded event and replays them is event sourcing, and listing payments by customer still needs a CQRS view."
rows:
  - { aspect: "Solves", a: "Reads and writes need different shapes or scale", b: "Keeping every change: audit, history, rebuilds" }
  - { aspect: "Stores", a: "Current state, plus read views", b: "An append-only stream of events" }
  - { aspect: "Needs the other?", a: "No: it works on ordinary databases", b: "Queries need read views, so it usually comes with CQRS" }
  - { aspect: "Main cost", a: "Two models to keep in sync; stale reads", b: "Event versioning; the store itself is hard to query" }
verdict: "CQRS answers how to read fast; event sourcing answers how to keep every change. Event sourcing usually brings CQRS; CQRS often comes alone."
sayIt: "CQRS splits the write model from read models so each can be shaped and scaled for its job; event sourcing stores changes as events and rebuilds state by replay. CQRS often comes alone, but event sourcing usually needs CQRS views for queries."
