id: cqrs-vs-event-sourcing
tech: microservices
title: CQRS vs Event Sourcing
compares: [cqrs, event-sourcing]
gist:
  - "Split the model: one for writes, others for reads"
  - "Store changes as events; state comes from replay"
rows:
  - { aspect: "Solves", a: "Reads and writes need different shapes or scale", b: "Keeping every change: audit, history, rebuilds" }
  - { aspect: "Stores", a: "Current state, plus read views", b: "An append-only stream of events" }
  - { aspect: "Needs the other?", a: "No: works on ordinary databases", b: "Queries need projections, so nearly always CQRS" }
  - { aspect: "Main cost", a: "Two models to keep in sync; stale reads", b: "Event versioning; cannot query the store directly" }
verdict: "CQRS answers how to read fast; event sourcing answers how to keep every change. Event sourcing almost always brings CQRS; CQRS often comes alone."
sources:
  - title: "CQRS (Martin Fowler, bliki)"
    url: "https://martinfowler.com/bliki/CQRS.html"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Event sourcing (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/data/event-sourcing.html"
    verifiedOn: "2026-10-20"
  - title: "CQRS pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs"
    verifiedOn: "2026-10-20"
