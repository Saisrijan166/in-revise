id: kafka-vs-rabbitmq
tech: microservices
title: Kafka vs RabbitMQ
compares: [apache-kafka, rabbitmq]
gist:
  - "A log you keep and re-read"
  - "A broker that routes and hands off messages"
explain:
  - "Apache Kafka stores records in an append-only log split into partitions. Reading does not delete, so many consumer groups read the same stream at their own pace and can replay it."
  - "RabbitMQ receives messages on exchanges, which route them to queues by rules called bindings. A consumer takes a message from a queue and acknowledges it, and the queue then removes it."
example: "The shop publishes OrderCreated to Kafka, because Inventory, Notification and later a Loyalty service each read every order and may replay. It sends SendEmail jobs to a RabbitMQ queue, where three Notification workers share them and each message is gone once acknowledged."
rows:
  - { aspect: "Model", a: "Topics split into ordered partitions", b: "Exchanges route messages to queues" }
  - { aspect: "After a consumer reads", a: "Record stays until retention ends", b: "Queue message is removed on ack" }
  - { aspect: "Replay", a: "Yes: move the offset back", b: "Not from a queue; streams (3.9+) allow it" }
  - { aspect: "Routing", a: "By topic; key picks the partition", b: "Rich: direct, fanout, topic, headers" }
  - { aspect: "Scale consumers", a: "Consumer group: one consumer per partition (share groups, 4.2+, lift this)", b: "Competing consumers on a queue" }
verdict: "Kafka for event streams that many services read and replay; RabbitMQ for task queues and flexible routing. Neither is better everywhere."
sayIt: "Kafka is a partitioned log: records stay after reading, so many services read and replay the same stream, with order per key. RabbitMQ routes messages through exchanges to queues and removes them on ack, which suits task queues and flexible routing."
