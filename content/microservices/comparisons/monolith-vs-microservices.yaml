id: monolith-vs-microservices
tech: microservices
title: "Monolith vs Modular Monolith vs Microservices"
compares: [monolith, modular-monolith, microservice-architecture]
gist:
  - "One deployable unit, one database"
  - "One deployable unit, strict modules inside"
  - "Many services, each deployed on its own"
explain:
  - "A monolith is the whole app as one program, built, tested and deployed together, usually with one database. It is the simplest way to start and to run."
  - "A modular monolith is still one program, but its code is split into business modules that call each other only through module APIs. It keeps clear boundaries without network calls."
  - "Microservices put each business capability in its own program with its own data, so each team can release and scale its service alone, at the cost of network calls."
example: "The shop's Payment team wants to release a fix today. In a monolith or a modular monolith, the whole app is rebuilt and redeployed. With microservices, only the Payment service is released, and Order, Inventory and Notification keep running untouched."
rows:
  - { aspect: "Deploy", a: "Whole app at once", b: "Whole app at once", c: "One service at a time" }
  - { aspect: "Calls between parts", a: "In-process method calls", b: "In-process, through module APIs", c: "Over the network" }
  - { aspect: "Data", a: "Usually one shared database", b: "Usually one database, tables owned by modules", c: "Each service owns its data" }
  - { aspect: "Transactions", a: "Local database transactions", b: "Local database transactions", c: "Sagas and eventual consistency" }
  - { aspect: "Scale", a: "The whole app", b: "The whole app", c: "Each service separately" }
  - { aspect: "When a part fails", a: "A crash can stop the whole app", b: "A crash can stop the whole app", c: "One service fails; callers must handle it" }
  - { aspect: "Operations cost", a: "Low", b: "Low", c: "High: many pipelines, tracing, discovery" }
verdict: "Start with a modular monolith; extract a service when a part needs its own team, release cycle or scaling."
sayIt: "A monolith and a modular monolith both deploy as one program; the modular one keeps strict module boundaries inside. Microservices make each module its own deployable service with its own data. I start modular and extract a service only when independent release or scaling pays for the network cost."
