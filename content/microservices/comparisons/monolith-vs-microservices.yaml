id: monolith-vs-microservices
tech: microservices
title: "Monolith vs Modular Monolith vs Microservices"
compares: [monolith, modular-monolith, microservice-architecture]
gist:
  - "One deployable unit, one database"
  - "One deployable unit, strict modules inside"
  - "Many services, each deployed on its own"
rows:
  - { aspect: "Deploy", a: "Whole app at once", b: "Whole app at once", c: "One service at a time" }
  - { aspect: "Calls between parts", a: "In-process", b: "In-process, through module APIs", c: "Over the network" }
  - { aspect: "Data", a: "Usually one shared database", b: "One database, tables owned by modules", c: "Each service owns its data" }
  - { aspect: "Transactions", a: "Local ACID", b: "Local ACID", c: "Sagas, eventual consistency" }
  - { aspect: "Scale", a: "The whole app", b: "The whole app", c: "Each service separately" }
  - { aspect: "Operations cost", a: "Low", b: "Low", c: "High: many pipelines, tracing, discovery" }
verdict: "Start with a modular monolith; extract a service when a part needs its own team, release cycle or scaling."
sources:
  - title: "Pattern: Monolithic Architecture (microservices.io)"
    url: "https://microservices.io/patterns/monolithic.html"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Microservice Architecture (microservices.io)"
    url: "https://microservices.io/patterns/microservices.html"
    verifiedOn: "2026-10-20"
  - title: "Microservice Trade-Offs (Martin Fowler)"
    url: "https://martinfowler.com/articles/microservice-trade-offs.html"
    verifiedOn: "2026-10-20"
