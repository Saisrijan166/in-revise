id: vertical-vs-horizontal-scaling
tech: microservices
title: "Vertical vs Horizontal Scaling"
compares: [vertical-scaling, horizontal-scaling]
gist:
  - "Scale up: a bigger machine"
  - "Scale out: more instances"
explain:
  - "Vertical scaling gives one instance more CPU or memory. The code does not change, so it is the quickest fix, but one machine can only grow so big and is still one point of failure."
  - "Horizontal scaling runs more copies of the same service behind a load balancer. It can keep growing and survives one instance dying, but only if the service keeps no user state in memory."
example: "During a sale the Order service needs five times its normal capacity. Order is stateless, so you run five more instances behind the load balancer. The single PostgreSQL primary cannot be copied for writes, so it gets a bigger machine instead."
rows:
  - { aspect: "Adds", a: "CPU and memory to one instance", b: "More instances of the service" }
  - { aspect: "Limit", a: "The largest machine size", b: "Shared parts, such as the database" }
  - { aspect: "App must be", a: "Unchanged", b: "Stateless, behind a load balancer" }
  - { aspect: "One instance fails", a: "Down, if it is the only instance", b: "Others keep serving" }
  - { aspect: "Fits", a: "Stateful parts that are hard to split", b: "Stateless services" }
verdict: "Scale stateless services out; scale up the parts that cannot be split, such as a single database primary."
sayIt: "Vertical scaling means a bigger machine; horizontal scaling means more instances behind a load balancer. I scale stateless services out, because that keeps growing and survives a dead instance, and scale up the parts that cannot be split, like a database primary."
sources:
