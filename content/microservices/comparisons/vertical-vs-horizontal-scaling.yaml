id: vertical-vs-horizontal-scaling
tech: microservices
title: "Vertical vs Horizontal Scaling"
compares: [vertical-scaling, horizontal-scaling]
gist:
  - "Scale up: a bigger machine"
  - "Scale out: more instances"
rows:
  - { aspect: "Adds", a: "CPU and memory to one instance", b: "More instances of the service" }
  - { aspect: "Limit", a: "The largest machine size", b: "Shared parts, such as the database" }
  - { aspect: "App must be", a: "Unchanged", b: "Stateless, behind a load balancer" }
  - { aspect: "One instance fails", a: "The service is down", b: "Others keep serving" }
  - { aspect: "Fits", a: "Stateful parts that are hard to split", b: "Stateless services" }
verdict: "Scale stateless services out; scale up the parts that cannot be split, such as a single database primary."
sources:
  - title: "Architecture strategies for optimizing scaling and partitioning (Azure Well-Architected Framework)"
    url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/scale-partition"
    verifiedOn: "2026-10-20"
  - title: "The Twelve-Factor App: VI. Processes"
    url: "https://12factor.net/processes"
    verifiedOn: "2026-10-20"
