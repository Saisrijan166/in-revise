id: api-key-vs-jwt
tech: microservices
title: API Key vs JWT
compares: [api-key-credential, json-web-token]
gist:
  - "A secret string the server looks up"
  - "Signed claims the server can verify itself"
explain:
  - "An API key is a long secret string issued to one app. The app sends it on every call, and the server looks it up in its store to see which app is calling and what it may use."
  - "A JWT is a token that carries signed claims, such as who the user is, its scopes and its expiry. The server checks the signature and claims itself, without a lookup."
example: "A partner's price-feed script calls the shop's public catalogue API with an API key, so the shop can count its calls and cut it off by deleting the key. A logged-in customer cancelling order 1001 sends a JWT, because the Order Service needs the user ID and scopes inside it."
rows:
  - { aspect: "Carries", a: "Usually nothing readable: an opaque secret", b: "Claims: subject, scopes, issuer, audience, expiry" }
  - { aspect: "Check", a: "Look it up in a key store", b: "Verify signature and claims locally" }
  - { aspect: "Expiry", a: "Whatever your key policy sets", b: "The exp claim" }
  - { aspect: "Revoke", a: "Delete the key: works at once", b: "Hard before exp: short lifetime or a jti denylist" }
  - { aspect: "Good for", a: "Identifying an app on low-risk APIs", b: "User or service identity with scopes" }
verdict: "Use API keys for simple app-level access and quotas; use OAuth access tokens (often JWTs) for users, services and sensitive data."
sayIt: "An API key is an opaque secret the server looks up; it identifies an app and is easy to revoke. A JWT carries signed claims the service verifies itself, such as user, scopes and expiry, but it stays valid until exp. Keys for simple app access, OAuth tokens for users and sensitive data."
sources:
  - title: "REST Security Cheat Sheet: JWT and API keys (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "RFC 7519 JSON Web Token (JWT)"
    url: "https://www.rfc-editor.org/rfc/rfc7519"
    verifiedOn: "2026-10-20"
