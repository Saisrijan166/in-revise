id: api-key-vs-jwt
tech: microservices
title: API Key vs JWT
compares: [api-key-credential, json-web-token]
gist:
  - "A secret string the server looks up"
  - "Signed claims the server can verify itself"
rows:
  - { aspect: "Carries", a: "Usually nothing readable: an opaque secret", b: "Claims: subject, scopes, issuer, audience, expiry" }
  - { aspect: "Check", a: "Look it up in a key store", b: "Verify signature and claims locally" }
  - { aspect: "Expiry", a: "Whatever your key policy sets", b: "The exp claim" }
  - { aspect: "Revoke", a: "Delete the key: works at once", b: "Hard before exp: short lifetime or a jti denylist" }
  - { aspect: "Good for", a: "Identifying an app on low-risk APIs", b: "User or service identity with scopes" }
verdict: "Use API keys for simple app-level access and quotas; use OAuth access tokens (often JWTs) for users, services and sensitive data."
sources:
  - title: "REST Security Cheat Sheet: JWT and API keys (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "RFC 7519 JSON Web Token (JWT)"
    url: "https://www.rfc-editor.org/rfc/rfc7519"
    verifiedOn: "2026-10-20"
