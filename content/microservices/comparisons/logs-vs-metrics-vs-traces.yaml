id: logs-vs-metrics-vs-traces
tech: microservices
title: Logs vs Metrics vs Traces
compares: [logs-pillar, metrics-pillar, traces-pillar]
gist:
  - "What happened? One record per event"
  - "How much, how often? Numbers over time"
  - "Where did the time go? One request's path"
rows:
  - { aspect: "Shape", a: "Timestamped text or JSON record", b: "Counter, gauge or histogram per time series", c: "Tree of timed spans with one trace ID" }
  - { aspect: "Best for", a: "Details of one failure", b: "Alerts, dashboards, trends", c: "The slow or failing hop across services" }
  - { aspect: "Cost grows with", a: "Every event written", b: "Number of label combinations", c: "Traffic; so traces are often sampled" }
  - { aspect: "Shop example", a: "PaymentFailed for order 1001", b: "8% of payment calls failed in 5 min", c: "Payment span took 1.5 s of 1.6 s" }
verdict: "Alert on metrics, find the slow hop with a trace, then read that service's logs by trace ID."
sources:
  - title: "Observability primer (OpenTelemetry docs)"
    url: "https://opentelemetry.io/docs/concepts/observability-primer/"
    verifiedOn: "2026-10-20"
  - title: "Metric and label naming: cardinality (Prometheus docs)"
    url: "https://prometheus.io/docs/practices/naming/"
    verifiedOn: "2026-10-20"
  - title: "Sampling (OpenTelemetry docs)"
    url: "https://opentelemetry.io/docs/concepts/sampling/"
    verifiedOn: "2026-10-20"
