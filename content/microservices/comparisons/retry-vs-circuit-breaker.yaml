id: retry-vs-circuit-breaker
tech: microservices
title: "Retry vs Circuit Breaker"
compares: [retry-policy, circuit-breaker]
gist:
  - "Call again after a short wait"
  - "Stop calling for a while; fail fast"
explain:
  - "A retry makes a new attempt after a failed call, usually after a short, growing, random wait. It solves brief faults, such as one dropped connection, that pass by themselves."
  - "A circuit breaker counts failures over many recent calls. When the failure rate is too high, it stops sending calls for a while, so callers fail at once and the sick service can recover."
example: "Inventory drops one connection: the retry's second attempt succeeds and the customer never notices. Inventory then goes down for five minutes: retries alone would triple its traffic, but the breaker opens after enough failures, and each attempt now fails at once instead of waiting for a timeout."
rows:
  - { aspect: "Best for", a: "Brief, transient faults", b: "A dependency that keeps failing" }
  - { aspect: "What it does", a: "Repeats the call, with backoff", b: "Rejects calls without sending them" }
  - { aspect: "Risk", a: "Too many retries add load to a sick service", b: "Fails fast too long if the wait is long" }
  - { aspect: "You configure", a: "Attempts, backoff, which errors", b: "Failure-rate threshold, wait time, trial calls" }
  - { aspect: "Used together", a: "The outer layer: each attempt passes the breaker", b: "Once OPEN, attempts fail at once; stop retrying" }
verdict: "Use both: retry for blips, the breaker for outages, and stop retrying while the breaker is open."
sayIt: "A retry repeats a call that failed once, for brief faults. A circuit breaker stops calling a dependency that keeps failing, so callers fail fast and it can recover. Resilience4j puts Retry outside CircuitBreaker by default, and I do not retry a CallNotPermittedException."
sources:
