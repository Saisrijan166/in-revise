id: strong-vs-eventual-consistency
tech: microservices
title: Strong vs Eventual Consistency
compares: [linearizability, eventual-consistency]
gist:
  - "Every read sees the latest write"
  - "Reads may be stale for a while; copies converge"
explain:
  - "Strong (linearizable) consistency means every read returns the latest completed write, as if there were only one copy. It protects rules such as never selling more stock than you have."
  - "Eventual consistency means copies may disagree for a while, but reach the same value once updates stop and messages get through. It keeps the system fast and answering when nodes cannot talk."
example: "Reserving the last phone needs strong consistency: the replicas must agree before saying yes, so during a partition one side returns an error. A review count that shows 41 on one page and 42 on another for a few seconds is fine with eventual consistency."
rows:
  - { aspect: "Read just after a write", a: "Always the new value", b: "May return the old value" }
  - { aspect: "During a partition", a: "Some requests fail or wait", b: "Keeps answering" }
  - { aspect: "Cost", a: "Coordination on writes: more latency", b: "Fast, but the app must handle stale data" }
  - { aspect: "Good for", a: "Stock reservation, payments, account balances", b: "Review counts, feeds, search, analytics" }
  - { aspect: "Across microservices", a: "Hard: needs one database or two-phase commit", b: "The usual result of events and sagas" }
verdict: "Pay for strong consistency only where a stale read loses money or breaks a rule; use eventual consistency everywhere else."
sayIt: "Strong consistency means every read sees the latest write, at the cost of coordination and errors during a partition. Eventual consistency always answers but may return stale data for a while. I use strong where a stale read loses money, like stock reservation, and eventual elsewhere."
