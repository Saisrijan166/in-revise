id: command-vs-event
tech: microservices
title: Command vs Event
compares: [command-message, domain-event]
gist:
  - "Please do this: one receiver, may say no"
  - "This happened: any number of listeners"
explain:
  - "A command is a message that asks one specific service to do something, such as ReserveStock. The receiver may do it or refuse it."
  - "An event is a message announcing that something has already happened, such as OrderCreated. The sender does not know or care who listens."
example: "Order Service sends ReserveStock to Inventory Service and expects StockReserved or OutOfStock back. It also publishes OrderCreated: Notification and Analytics both react, and adding a third listener needs no change in Order Service."
rows:
  - { aspect: "Name", a: "Imperative verb: ReserveStock", b: "Past tense: OrderCreated" }
  - { aspect: "Receivers", a: "Exactly one handler", b: "Zero, one or many subscribers" }
  - { aspect: "Can be refused", a: "Yes, it is only a request", b: "No, it is already a fact" }
  - { aspect: "Sender knows", a: "Who must act", b: "Nothing about who reacts" }
  - { aspect: "Coupling", a: "Sender depends on the receiver's job", b: "Looser: add listeners without changing the sender" }
verdict: "Send a command when you need one service to act; publish an event to announce a fact others may react to."
sayIt: "A command asks one service to do something and can be refused, like ReserveStock. An event states a fact that already happened, like OrderCreated, and any number of services may react. Commands tie the sender to the receiver's job; events let you add listeners freely."
sources:
  - title: "Implementing the microservice application layer: commands (Microsoft .NET microservices guide)"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-application-layer-implementation-web-api"
    verifiedOn: "2026-10-20"
  - title: "What do you mean by Event-Driven? (Martin Fowler)"
    url: "https://martinfowler.com/articles/201701-event-driven.html"
    verifiedOn: "2026-10-20"
