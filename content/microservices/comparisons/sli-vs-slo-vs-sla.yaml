id: sli-vs-slo-vs-sla
tech: microservices
title: SLI vs SLO vs SLA
compares: [sli-indicator, slo-objective, sla-agreement]
gist:
  - "The measurement"
  - "The target for that measurement"
  - "The contract, with a consequence if missed"
explain:
  - "An SLI is a measurement of the service that users feel, such as the share of checkouts that succeed in under 300 ms."
  - "An SLO is the target an SLI should meet over a time window, such as 99.9% over 30 days. The gap to 100% is the error budget."
  - "An SLA is a contract with customers that promises a level of service and names a consequence, such as a refund, if it is missed."
example: "The shop measures checkout success at the gateway (SLI), aims for 99.9% over 30 days internally (SLO), and promises business customers 99.5% a month with a service credit if missed (SLA). The looser SLA leaves room to fix problems before paying a penalty."
rows:
  - { aspect: "Shop example", a: "Share of checkouts under 300 ms", b: "99.9% under 300 ms over 30 days", c: "99.5% a month, or a credit to the customer" }
  - { aspect: "Set by", a: "Engineers (what to measure)", b: "Product and engineering", c: "Business and the customer" }
  - { aspect: "If missed", a: "Nothing: it is a number", b: "Error budget spent: slow releases", c: "Penalty or refund" }
verdict: "Pick SLIs users feel, set SLOs on them, and keep any SLA promise looser than your internal SLO."
sayIt: "The SLI is what I measure, such as successful checkouts under 300 ms. The SLO is my internal target for it, say 99.9% over 30 days. The SLA is the customer contract with a penalty, and I keep it looser than the SLO."
sources:
