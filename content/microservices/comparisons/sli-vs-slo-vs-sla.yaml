id: sli-vs-slo-vs-sla
tech: microservices
title: SLI vs SLO vs SLA
compares: [sli-indicator, slo-objective, sla-agreement]
gist:
  - "The measurement"
  - "The target for that measurement"
  - "The contract, with a consequence if missed"
rows:
  - { aspect: "Shop example", a: "Share of checkouts under 300 ms", b: "99.9% under 300 ms over 30 days", c: "99.5% a month, or a credit to the customer" }
  - { aspect: "Set by", a: "Engineers (what to measure)", b: "Product and engineering", c: "Business and the customer" }
  - { aspect: "If missed", a: "Nothing: it is a number", b: "Error budget spent: slow releases", c: "Penalty or refund" }
verdict: "Pick SLIs users feel, set SLOs on them, and keep any SLA promise looser than your internal SLO."
sources:
  - title: "Service Level Objectives (Google SRE book, ch. 4)"
    url: "https://sre.google/sre-book/service-level-objectives/"
    verifiedOn: "2026-10-20"
  - title: "Error Budget Policy (Google SRE workbook)"
    url: "https://sre.google/workbook/error-budget-policy/"
    verifiedOn: "2026-10-20"
