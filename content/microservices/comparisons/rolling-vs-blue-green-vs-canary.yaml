id: rolling-vs-blue-green-vs-canary
tech: microservices
title: Rolling vs Blue-Green vs Canary
compares: [rolling-update, blue-green-deployment, canary-release]
gist:
  - "Replace old Pods with new ones a few at a time"
  - "Two full environments; flip the router at once"
  - "A small share of users tries the new version first"
rows:
  - { aspect: "Users on the new version", a: "Grows Pod by Pod", b: "None, then all at once", c: "A small subset, then more" }
  - { aspect: "Extra capacity", a: "A few surge Pods", b: "A second full environment", c: "A few Pods for the canary" }
  - { aspect: "Rollback", a: "Roll back Pod by Pod (rollout undo)", b: "Flip the router back: fastest", c: "Route the subset back to the old version" }
  - { aspect: "Old and new serve together", a: "Yes, during the rollout", b: "No: one colour serves at a time", c: "Yes, by design" }
  - { aspect: "In Kubernetes", a: "Built in: the Deployment default", b: "Two Deployments; repoint the Service", c: "Weighted routes (Gateway API) or a mesh" }
verdict: "Rolling by default; canary when a change is risky; blue-green when you need an instant switch back and can pay for two environments."
sources:
  - title: "Deployments (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"
    verifiedOn: "2026-10-20"
  - title: "BlueGreenDeployment (Martin Fowler)"
    url: "https://martinfowler.com/bliki/BlueGreenDeployment.html"
    verifiedOn: "2026-10-20"
  - title: "CanaryRelease (Danilo Sato, martinfowler.com)"
    url: "https://martinfowler.com/bliki/CanaryRelease.html"
    verifiedOn: "2026-10-20"
  - title: "Gateway API (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/services-networking/gateway/"
    verifiedOn: "2026-10-20"
