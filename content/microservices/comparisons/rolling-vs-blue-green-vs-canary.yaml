id: rolling-vs-blue-green-vs-canary
tech: microservices
title: Rolling vs Blue-Green vs Canary
compares: [rolling-update, blue-green-deployment, canary-release]
gist:
  - "Replace old Pods with new ones a few at a time"
  - "Two full environments; flip the router at once"
  - "A small share of users tries the new version first"
explain:
  - "A rolling update replaces the old Pods with new ones a few at a time, inside one Deployment. It needs little extra capacity and is the Kubernetes default."
  - "Blue-green keeps two full environments: blue runs the current version, green the new one. You test green, then switch all traffic to it at once, and switch back just as fast."
  - "A canary release sends a small share of real traffic to the new version first. If its errors and latency stay normal, the share grows step by step until it takes all traffic."
example: "Order Service 1.4.3 has a bug in 1 order out of 50. A rolling update reaches all users within minutes. Blue-green reaches all users at once, but one switch undoes it. A 5% canary sends only 1 order in 20 to the new version, so few orders meet the bug before that share is routed back."
rows:
  - { aspect: "Users on the new version", a: "Grows Pod by Pod", b: "None, then all at once", c: "A small subset, then more" }
  - { aspect: "Extra capacity", a: "A few surge Pods", b: "A second full environment", c: "A few Pods for the canary" }
  - { aspect: "Rollback", a: "Roll back Pod by Pod (rollout undo)", b: "Flip the router back: fastest", c: "Route the subset back to the old version" }
  - { aspect: "Old and new serve together", a: "Yes, during the rollout", b: "No: one colour serves at a time", c: "Yes, by design" }
  - { aspect: "In Kubernetes", a: "Built in: the Deployment default", b: "Two Deployments; repoint the Service", c: "Weighted routes (Gateway API) or a mesh" }
verdict: "Rolling by default; canary when a change is risky; blue-green when you need an instant switch back and can pay for two environments."
sayIt: "Rolling update is the Kubernetes default and swaps Pods gradually. Blue-green switches all traffic between two full environments, so rollback is one switch. Canary exposes a small share of users first. In rolling and canary, two versions run together, so changes must be backward compatible."
