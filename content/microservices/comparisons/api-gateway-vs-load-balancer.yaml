id: api-gateway-vs-load-balancer
tech: microservices
title: API Gateway vs Load Balancer
compares: [api-gateway, load-balancing]
gist:
  - "Routes API calls to services and applies policies"
  - "Spreads traffic across instances of one service"
diagrams:
  - |
    flowchart LR
      C[Client] --> G[API gateway]
      G -- "/orders" --> O[Order Service]
      G -- "/payments" --> P[Payment Service]
  - |
    flowchart LR
      C[Caller] --> L[Load balancer]
      L --> P1[Payment 1]
      L --> P2[Payment 2]
diagramAlt: "API gateway: one client calls the gateway, which sends /orders to Order Service and /payments to Payment Service. Load balancer: a caller hits the load balancer, which spreads calls across Payment instance 1 and Payment instance 2."
rows:
  - { aspect: "Main job", a: "Pick the service for this API call", b: "Pick a healthy instance" }
  - { aspect: "Understands", a: "API paths, tokens, clients", b: "Connections (layer 4) or HTTP requests (layer 7)" }
  - { aspect: "Policies", a: "Auth, rate limits, aggregation, protocol translation", b: "Balancing algorithm and health checks" }
  - { aspect: "Where", a: "At the edge, in front of many services", b: "In front of any group of instances, the gateway too" }
verdict: "Use both: a load balancer spreads traffic over gateway instances, and the gateway routes each API call to the right service."
sources:
  - title: "Pattern: API Gateway (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/apigateway.html"
    verifiedOn: "2026-10-20"
  - title: "Gateway Offloading pattern (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-offloading"
    verifiedOn: "2026-10-20"
  - title: "Elastic Load Balancing features: layer 4 and layer 7 load balancers (AWS)"
    url: "https://aws.amazon.com/elasticloadbalancing/features/"
    verifiedOn: "2026-10-20"
