id: liveness-vs-readiness-probe
tech: microservices
title: Liveness vs Readiness vs Startup Probe
compares: [liveness-probe, readiness-probe, startup-probe]
gist:
  - "Is it stuck? Restart it"
  - "Can it serve now? Send it traffic"
  - "Has it started? Hold the other probes"
rows:
  - { aspect: "On failure", a: "Container is restarted", b: "Pod leaves the Service endpoints; keeps running", c: "Container is restarted" }
  - { aspect: "Typical case", a: "Deadlock: running but making no progress", b: "Warming caches, or briefly overloaded", c: "A service that boots slowly" }
  - { aspect: "Should check", a: "Only the app itself", b: "The app, plus what it cannot serve without", c: "The same endpoint as liveness" }
  - { aspect: "Spring Boot 4.1 path", a: "/actuator/health/liveness", b: "/actuator/health/readiness", c: "/actuator/health/liveness" }
verdict: "Readiness for traffic, liveness only for stuck processes, startup for slow boots."
sources:
  - title: "Liveness, Readiness, and Startup Probes (Kubernetes 1.37 docs)"
    url: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"
    verifiedOn: "2026-10-20"
  - title: "Actuator endpoints: Kubernetes probes (Spring Boot 4.1)"
    url: "https://docs.spring.io/spring-boot/reference/actuator/endpoints.html"
    verifiedOn: "2026-10-20"
