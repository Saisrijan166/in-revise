id: rest-vs-messaging
tech: microservices
title: REST Calls vs Messaging
compares: [request-response-call, async-messaging]
gist:
  - "Ask and wait for the answer"
  - "Hand a message to a broker and move on"
diagrams:
  - |
    flowchart LR
      O[Order] -- "GET stock" --> I[Inventory]
      I -- "200 OK" --> O
  - |
    flowchart LR
      O[Order] -- OrderCreated --> B[(Broker)]
      B --> I[Inventory]
      B --> P[Payment]
diagramAlt: "REST: Order Service asks Inventory Service for stock and waits for the 200 OK reply. Messaging: Order Service publishes OrderCreated to a broker, which delivers it to Inventory and Payment later."
rows:
  - { aspect: "Caller", a: "Waits for the reply", b: "Continues after the broker accepts the message" }
  - { aspect: "Receiver down", a: "The call fails or times out", b: "The broker keeps the message until it is back" }
  - { aspect: "Receivers", a: "Exactly one", b: "One (queue) or many (publish-subscribe)" }
  - { aspect: "Best for", a: "Queries and answers the user needs now", b: "Events and background work" }
  - { aspect: "You must handle", a: "Timeouts and safe retries", b: "Duplicate deliveries and stale data" }
verdict: "Use REST when the caller needs the result now; use messaging when the work can finish later or many services react."
sources:
  - title: "Communication in a microservice architecture (Microsoft Learn, .NET microservices guide)"
    url: "https://learn.microsoft.com/en-us/dotnet/architecture/microservices/architect-microservice-container-applications/communication-in-microservice-architecture"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Messaging (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/communication-style/messaging.html"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Idempotent Consumer (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    verifiedOn: "2026-10-20"
