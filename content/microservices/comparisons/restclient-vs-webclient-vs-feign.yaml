id: restclient-vs-webclient-vs-feign
tech: microservices
title: RestClient vs WebClient vs OpenFeign
compares: [restclient, webclient, openfeign]
gist:
  - "Blocking fluent client; the default for new code"
  - "Non-blocking reactive client for WebFlux and streams"
  - "Declarative interface; feature-complete, bug fixes and small PRs"
explain:
  - "RestClient is Spring's blocking HTTP client with a fluent API: the calling thread waits for the answer. It is the default choice for new code that is not reactive."
  - "WebClient is Spring's non-blocking, reactive HTTP client. It returns Mono or Flux, so a thread is not held while waiting, and it fits WebFlux apps and streaming."
  - "OpenFeign lets you declare a remote API as an annotated interface with @FeignClient, and creates the client for you. It comes from Spring Cloud OpenFeign."
example: "Order Service is a normal Spring MVC app, so it calls Payment with RestClient behind a PaymentApi interface whose method carries @GetExchange. A reactive price-streaming service uses WebClient. An older service already full of @FeignClient interfaces keeps working, and moves to HTTP service clients over time."
rows:
  - { aspect: "Style", a: "Fluent: get().uri().retrieve()", b: "Fluent, returns Mono or Flux", c: "Annotated interface: @FeignClient" }
  - { aspect: "Blocks the thread?", a: "Yes", b: "No", c: "Yes" }
  - { aspect: "Comes from", a: "Spring Framework 6.1+", b: "Spring Framework 5.0+", c: "Spring Cloud OpenFeign" }
  - { aspect: "Status", a: "Actively maintained", b: "Actively maintained", c: "Feature-complete since Spring Cloud 2022.0" }
  - { aspect: "Declarative option", a: "HTTP service client (@GetExchange) on top", b: "HTTP service client on top", c: "Built in" }
verdict: "RestClient (or an HTTP service client on it) for new blocking code, WebClient in reactive apps; move Feign clients to HTTP service clients over time."
sayIt: "For new blocking code I use RestClient, usually behind an HTTP service client interface; WebClient only in reactive apps. OpenFeign is feature-complete, with only bug fixes and small community changes, and RestTemplate is deprecated in Spring Framework 7.0, so I would start neither."
sources:
