id: rest-vs-grpc
tech: microservices
title: REST vs gRPC
compares: [rest-apis, grpc]
gist:
  - "Resources and HTTP methods, usually JSON text"
  - "Typed remote calls from a .proto file, binary"
explain:
  - "REST designs an API around resources and HTTP methods, usually with JSON text. Any browser, tool or language can call it without generated code."
  - "gRPC calls typed methods defined in a .proto file, with generated client code and binary protobuf messages over HTTP/2, and it supports streams."
example: "The shop's mobile app and partners call REST at the gateway: GET /orders/9001 returns JSON that anyone can read. Inside, Order Service calls Payment Service's Charge method over gRPC for small, fast, typed calls, and follows payment status through a server stream."
rows:
  - { aspect: "Contract", a: "Optional (often OpenAPI)", b: "Required: the .proto file, code generated" }
  - { aspect: "Payload", a: "Usually JSON text", b: "Protocol Buffers binary: smaller, faster to parse" }
  - { aspect: "Transport", a: "Any HTTP version", b: "HTTP/2" }
  - { aspect: "Streaming", a: "One reply per request", b: "Server, client and bidirectional streams" }
  - { aspect: "Browsers", a: "Call it directly", b: "Need gRPC-Web and a proxy" }
  - { aspect: "Errors", a: "HTTP status codes", b: "gRPC status codes, e.g. DEADLINE_EXCEEDED" }
verdict: "REST for public APIs, browsers and partners; gRPC for internal calls that need speed, strict contracts or streaming."
sayIt: "REST is resource-based HTTP, usually JSON, and works with any client, so I use it for public APIs and browsers. gRPC is contract-first RPC with protobuf over HTTP/2: typed, compact and able to stream, so I use it for internal service-to-service calls."
sources:
