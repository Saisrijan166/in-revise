id: put-vs-post-vs-patch
tech: microservices
title: PUT vs POST vs PATCH
compares: [http-put, http-post, http-patch]
gist:
  - "Store this whole resource at this URI"
  - "Server, process this (often: create one)"
  - "Apply these changes to the resource"
rows:
  - { aspect: "Body holds", a: "The full new state", b: "Data for the server to process", c: "Only the changes (a patch document)" }
  - { aspect: "Target URI", a: "The item: /orders/9001", b: "Often the collection: /orders", c: "The item: /orders/9001" }
  - { aspect: "Idempotent", a: "Yes", b: "No: use an idempotency key", c: "No, unless designed so" }
  - { aspect: "Typical success", a: "200 or 204; 201 if it created", b: "201 Created with a Location header", c: "200 or 204" }
verdict: "POST to create when the server picks the id, PUT to replace a whole resource, PATCH to change a few fields."
sources:
  - title: "RFC 9110: HTTP Semantics (POST 9.3.3, PUT 9.3.4, 201 Created 15.3.2)"
    url: "https://www.rfc-editor.org/rfc/rfc9110.html"
    verifiedOn: "2026-10-20"
  - title: "RFC 5789: PATCH Method for HTTP"
    url: "https://www.rfc-editor.org/rfc/rfc5789.html"
    verifiedOn: "2026-10-20"
  - title: "Web API design best practices (Azure Architecture Center)"
    url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design"
    verifiedOn: "2026-10-20"
