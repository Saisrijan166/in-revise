id: client-side-vs-server-side-discovery
tech: microservices
title: Client-Side vs Server-Side Discovery
compares: [client-side-discovery, server-side-discovery]
gist:
  - "The caller asks the registry and picks an instance"
  - "The caller hits a router; the router picks"
explain:
  - "In client-side discovery, the calling service asks the registry for the list of instances and picks one itself, using a library such as Spring Cloud LoadBalancer."
  - "In server-side discovery, the caller sends every request to one fixed name or address, and a router or load balancer there looks up the instances and picks one."
example: "With Eureka, Order Service's RestClient turns payment-service into 10.0.3.17:8080 itself and calls that instance. On Kubernetes, Order Service calls payment-service, DNS points it to the Service, and the platform forwards the call to one of the Payment Pods."
diagrams:
  - |
    flowchart LR
      O[Order] -- "where is payment?" --> R[(Registry)]
      O -- "then calls" --> P2[Payment 2]
  - |
    flowchart LR
      O[Order] --> LB[Router]
      LB -. asks .-> R[(Registry)]
      LB --> P2[Payment 2]
diagramAlt: "Client-side: Order Service asks the registry where Payment Service runs, then calls Payment instance 2 directly. Server-side: Order Service calls a router, which checks the registry and forwards the call to Payment instance 2."
rows:
  - { aspect: "Who picks the instance", a: "The calling service", b: "A router or load balancer" }
  - { aspect: "Network hops", a: "Fewer: straight to the instance", b: "One more, through the router" }
  - { aspect: "Client code", a: "Discovery logic in every language used", b: "None: call one fixed address" }
  - { aspect: "Extra part to run", a: "The registry", b: "The router too, highly available" }
  - { aspect: "Examples", a: "Eureka + Spring Cloud LoadBalancer", b: "Kubernetes Service, AWS Elastic Load Balancing" }
verdict: "On Kubernetes or a cloud load balancer, use server-side discovery; use client-side (Eureka) when the platform gives you none."
sayIt: "In client-side discovery the caller queries the registry and picks an instance, like Eureka with Spring Cloud LoadBalancer: one hop less, but a library per language. In server-side discovery the caller hits a router that picks, like a Kubernetes Service: simpler clients, one more component."
sources:
  - title: "Pattern: Client-side service discovery (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/client-side-discovery.html"
    verifiedOn: "2026-10-20"
