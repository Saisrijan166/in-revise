id: authentication-vs-authorization
tech: microservices
title: Authentication vs Authorization
compares: [authentication-check, authorization-check]
gist:
  - "Who are you? Prove your identity"
  - "What may you do? Check the rules for this action"
rows:
  - { aspect: "Order", a: "First", b: "After, for every action" }
  - { aspect: "Input", a: "Password, token signature, certificate", b: "Identity, scopes, roles, the resource itself" }
  - { aspect: "In the shop", a: "Token is valid: this is user 42", b: "May user 42 cancel order 1001?" }
  - { aspect: "Where", a: "Gateway and each service", b: "Coarse rules at the gateway; each service enforces its own" }
verdict: "Authentication gives an identity; authorisation must still check each action. A valid token is not permission for everything."
sources:
  - title: "Authorization Cheat Sheet (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
  - title: "Microservices Security Cheat Sheet: edge and service-level authorization (OWASP)"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html"
    verifiedOn: "2026-10-20"
