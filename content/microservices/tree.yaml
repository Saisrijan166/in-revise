topics:
  basics:
    - id: monolith-and-microservices
      children:
        - id: monolith
          label: Monolith
          note: One deployable unit that usually uses one database
        - id: modular-monolith
          label: Modular monolith
          note: One deployable unit, split inside into strict business modules
          children:
            - id: spring-modulith
              label: Spring Modulith
              note: Spring project that verifies module boundaries in a Boot app
        - id: microservice-architecture
          label: Microservice architecture
          note: Two or more independently deployable, loosely coupled services
        - id: conways-law
          label: Conway's law
          note: A system's structure copies the team's communication structure
        - id: microservice-premium
          label: Microservice premium
          note: Extra cost of running many services; pays off for complex systems
        - id: monolith-first
          label: Monolith first
          note: Start with a monolith; split once the boundaries are known
    - id: service-boundaries
      children:
        - id: decompose-by-business-capability
          label: By business capability
          note: "One service per thing the business does: orders, stock"
        - id: decompose-by-subdomain
          label: By subdomain
          note: One service per core, supporting or generic subdomain
        - id: bounded-context
          label: Bounded context
          note: Boundary inside which one domain model stays consistent
          children:
            - id: ubiquitous-language
              label: Ubiquitous language
              note: One set of terms used in talk, diagrams and code
        - id: aggregate
          label: Aggregate
          note: Cluster of objects saved as one unit; a transaction stays inside it
          children:
            - id: aggregate-root
              label: Aggregate root
              note: The only object outside code may hold a reference to
        - id: domain-service
          label: Domain service
          note: Domain operation that fits no single entity or value object
        - id: boundary-anti-patterns
          label: Boundary anti-patterns
          note: Splits that add network calls but give no independence
          children:
            - id: distributed-monolith
              label: Distributed monolith
              note: Separate services that must change and deploy in lockstep
            - id: chatty-services
              label: Chatty services
              note: "Many calls per operation: a hint they belong together"
            - id: too-fine-grained-services
              label: Too fine-grained services
              note: Splitting very fine on purpose; a known adoption anti-pattern
            - id: split-by-technical-layer
              label: Split by technical layer
              note: "UI, logic and data services: every change touches all"
    - id: distributed-systems-fallacies
      children:
        - id: partial-failure
          label: Partial failure
          note: Client, network and server fail independently of each other
        - id: unknown-outcome
          label: Unknown outcome
          note: "No reply: the request may or may not have happened"
        - id: request-reply-failure-points
          label: Eight failure points
          note: One request-reply round trip can fail at any of 8 steps
    - id: scaling-services
      children:
        - id: vertical-scaling
          label: Vertical scaling (scale up)
          note: Add CPU or memory to an existing instance
        - id: horizontal-scaling
          label: Horizontal scaling (scale out)
          note: Add more instances of the same service
        - id: stateless-service
          label: Stateless service
          note: Keeps nothing between requests; data lives in a backing service
        - id: stateful-service
          label: Stateful service
          note: Keeps state on the instance, so it is harder to scale out
        - id: connection-pool-sizing
          label: Connection pool sizing
          note: "HikariCP wiki: start at cores × 2 + effective spindles, then load-test"
        - id: backpressure
          label: Backpressure
          note: A struggling component makes upstream slow down, not crash it
  communication:
    - id: sync-and-async-communication
      children:
        - id: request-response-call
          label: Request-response
          note: The caller waits for the reply; both sides must be up together
        - id: async-messaging
          label: Messaging
          note: The sender passes a message to a broker and carries on
        - id: async-request-reply
          label: 202 Accepted + status URL
          note: "Long work over HTTP: accept now, the client polls a status URL"
        - id: sync-call-chain
          label: Chain of sync calls
          note: "A calls B calls C in one request: an anti-pattern"
    - id: rest-apis
      children:
        - id: http-methods
          label: HTTP methods
          note: "GET, HEAD, OPTIONS, TRACE only read: the safe methods"
          children:
            - id: http-post
              label: POST
              note: The server processes the body, often creating a resource
            - id: http-put
              label: PUT
              note: Create or replace the whole resource at this URI
            - id: http-patch
              label: PATCH
              note: Apply a patch document; neither safe nor idempotent by default
        - id: success-codes
          label: "2xx: 200, 201, 202, 204"
          note: 201 created (Location); 202 accepted, not done; 204 no body
        - id: client-error-codes
          label: "4xx: 400, 401, 403, 404, 409, 422, 429"
          note: 409 clashes with current state; 429 too many requests
        - id: server-error-codes
          label: "5xx: 500, 502, 503, 504"
          note: 502 bad upstream reply; 503 overloaded; 504 upstream too slow
        - id: api-versioning-styles
          label: API versioning
          note: In the URI (/v2/), query string, a header or the media type
    - id: grpc
      children:
        - id: unary-rpc
          label: Unary RPC
          note: One request, one response, like a normal method call
        - id: server-streaming-rpc
          label: Server streaming
          note: One request; the server sends back a stream of messages
        - id: client-streaming-rpc
          label: Client streaming
          note: The client sends a stream; the server replies once
        - id: bidirectional-streaming-rpc
          label: Bidirectional streaming
          note: Both sides send streams that run independently
        - id: grpc-web
          label: gRPC-Web
          note: Browsers via a proxy (Envoy); unary and server streaming only
    - id: idempotency
      children:
        - id: natural-idempotency
          label: Naturally idempotent
          note: "PUT, DELETE, absolute updates: a repeat changes nothing"
        - id: idempotency-key-header
          label: Idempotency-Key header
          note: A client-made unique key (a UUID) sent with a POST or PATCH
        - id: idempotency-unique-constraint
          label: Unique constraint on the key
          note: The database rejects a second insert of the same key
        - id: request-deduplication
          label: Deduplication
          note: Recognise a repeat by its id and skip it
    - id: api-gateway
      children:
        - id: gateway-routing
          label: Routing
          note: Maps each path to the service that owns it
        - id: gateway-offloading
          label: Gateway offloading
          note: TLS termination, auth, throttling and logging done once
        - id: gateway-aggregation
          label: Gateway aggregation
          note: Fans one client call out to several services
        - id: backend-for-frontend
          label: Backend for Frontend (BFF)
          note: Separate gateways for web, mobile and third-party apps
    - id: service-discovery
      children:
        - id: service-registry
          label: Service registry
          note: Eureka, Consul, etcd, ZooKeeper; built into Kubernetes
        - id: client-side-discovery
          label: Client-side discovery
          note: "Example: Eureka with Spring Cloud LoadBalancer"
        - id: server-side-discovery
          label: Server-side discovery
          note: "Example: a Kubernetes Service or an AWS load balancer"
        - id: self-registration
          label: Self-registration
          note: The instance registers at startup and renews by heartbeat
        - id: third-party-registration
          label: Third-party registration
          note: "A registrar or the platform registers instances: Kubernetes"
    - id: load-balancing
      children:
        - id: round-robin
          label: Round robin
          note: Default in NGINX, Spring Cloud LoadBalancer and AWS ALB
        - id: least-connections
          label: Least connections
          note: AWS ALB calls it least outstanding requests
        - id: weighted-routing
          label: Weighted
          note: "Weight 5 vs 1: the heavier instance gets 5 of every 6 requests"
        - id: consistent-hash-routing
          label: Consistent hashing
          note: "Same key, same instance: NGINX hash consistent, Envoy ring hash"
        - id: power-of-two-choices
          label: Power of two choices
          note: "Envoy least request: sample 2 hosts, use the less busy"
        - id: layer-4-vs-layer-7
          label: Layer 4 vs layer 7
          note: AWS NLB balances at layer 4 (TCP, UDP); ALB at layer 7 (HTTP)
    - id: service-mesh
      children:
        - id: sidecar-proxy
          label: Sidecar proxy
          note: One per instance, sharing its life cycle
        - id: mesh-data-plane
          label: Data plane
          note: "Istio: Envoy proxies, the only parts that touch traffic"
        - id: mesh-control-plane
          label: Control plane
          note: "Istio: istiod configures proxies and issues mTLS certificates"
        - id: ambient-mode
          label: Ambient mode (Istio)
          note: Per-node ztunnel, optional waypoint proxy; GA in Istio 1.24
  resilience:
    - id: timeouts-and-retries
      children:
        - id: connect-timeout
          label: Connect timeout
          note: "Limit on opening the connection; Spring Boot 4.1: spring.http.clients"
        - id: read-timeout
          label: Read timeout
          note: Limit on waiting for response data once connected
        - id: deadline-propagation
          label: Deadline propagation
          note: Pass the time left downstream, so callees drop doomed work
        - id: retry-policy
          label: Retry
          note: Repeat a failed call a capped number of times
          children:
            - id: exponential-backoff
              label: Exponential backoff
              note: Wait doubles per attempt; AWS SDKs cap it at 20 s
            - id: jitter
              label: Full jitter
              note: Wait a random time between 0 and the backoff value
            - id: retry-budget
              label: Retry budget
              note: "Google SRE: retry only while retries are under 10% of requests"
    - id: circuit-breaker
      children:
        - id: closed-state
          label: CLOSED
          note: Normal state; call results fill the sliding window
        - id: open-state
          label: OPEN
          note: "Tripped: calls return an error without being sent"
        - id: half-open-state
          label: HALF_OPEN
          note: "After the reset timeout, trial calls decide: close or reopen"
        - id: breaker-sliding-window
          label: Sliding window
          note: Where the failure rate is counted
          children:
            - id: count-based-window
              label: COUNT_BASED
              note: The last N calls; Resilience4j 2.x default, N = 100
            - id: time-based-window
              label: TIME_BASED
              note: The calls of the last N seconds
        - id: special-breaker-states
          label: DISABLED, FORCED_OPEN, METRICS_ONLY
          note: "Resilience4j manual states: always allow, always deny, only measure"
    - id: bulkhead
      children:
        - id: semaphore-bulkhead
          label: Semaphore bulkhead
          note: Counts calls in flight on the caller's thread; Resilience4j
        - id: thread-pool-bulkhead
          label: Thread-pool bulkhead
          note: A fixed thread pool plus a bounded queue; Resilience4j
        - id: connection-pool-per-dependency
          label: Connection pool per dependency
          note: A failing service exhausts only its own pool
        - id: instance-partitioning
          label: Instances per client group
          note: One client overloading its instances leaves the others unaffected
    - id: rate-limiting
      children:
        - id: token-bucket
          label: Token bucket
          note: Tokens refill at a steady rate; each request takes one; bursts OK
        - id: leaky-bucket
          label: Leaky bucket
          note: Serves at a fixed rate; extra waits or is rejected; nginx limit_req
        - id: fixed-window
          label: Fixed window
          note: Counter resets each period; spikes at the edges get through
        - id: sliding-window-log
          label: Sliding window log
          note: Stores every request time; exact, but heavy on memory
        - id: sliding-window-counter
          label: Sliding window counter
          note: Adds a weighted share of the last window; a cheap close estimate
        - id: load-shedding
          label: Load shedding
          note: Drops low-priority requests when the server nears overload
    - id: fallback-and-degradation
      children:
        - id: stale-data-fallback
          label: Cached or stale data
          note: The last good answer, possibly slightly out of date
        - id: default-value-fallback
          label: Default value
          note: A safe built-in answer, like default settings baked into the image
        - id: partial-response
          label: Partial response
          note: Return the parts that worked when one of many sources fails
        - id: queue-for-later
          label: Accept now, finish later
          note: Buffer writes in a queue until the dependency is back
        - id: fail-clearly
          label: Clear error
          note: Report the failure and ask the user to try again later
  data:
    - id: database-per-service
      children:
        - id: data-isolation-options
          label: Ways to keep data private
          note: "No new server needed: private tables, schema or server per service"
          children:
            - id: private-tables-per-service
              label: Private tables per service
              note: Lowest overhead; only the owner may access them
            - id: schema-per-service
              label: Schema per service
              note: A private schema; ownership is clearer than tables
            - id: database-server-per-service
              label: Database server per service
              note: For high-throughput services that need their own server
        - id: shared-database
          label: Shared database (anti-pattern)
          note: "Many services, one schema: changes need every team; load interferes"
        - id: polyglot-persistence
          label: Polyglot persistence
          note: "Each service picks its store: relational, document, key-value"
        - id: api-composition
          label: API composition
          note: A composer calls each owner and joins the results in memory
        - id: data-duplication
          label: Data duplication (local copy)
          note: Keep the fields you need, updated from the owner's events
    - id: cap-and-consistency
      children:
        - id: cp-choice
          label: CP choice
          note: During a partition one side refuses requests to stay consistent
        - id: ap-choice
          label: AP choice
          note: During a partition both sides answer; copies may disagree
        - id: consistency-models
          label: Consistency models
          note: Guarantees about when a write becomes visible, strongest first
          children:
            - id: linearizability
              label: Linearizable (strong)
              note: Each operation appears atomic, in real-time order
            - id: causal-consistency
              label: Causal
              note: Operations linked by cause are seen in the same order by all
            - id: read-your-writes
              label: Read-your-writes
              note: A client always sees its own completed writes
            - id: eventual-consistency
              label: Eventual
              note: If updates stop, all copies converge to the last value
        - id: pacelc
          label: PACELC
          note: "Partition: A or C. Else: latency or consistency"
        - id: quorum
          label: Quorum
          note: Usually a majority, (n/2)+1, must agree; the minority side stops
    - id: caching-in-microservices
      children:
        - id: local-cache
          label: Local (in-process) cache
          note: Fastest; each instance holds its own copy, which can disagree
        - id: distributed-cache
          label: Distributed cache
          note: Shared by all instances, for example Redis; one network hop
        - id: caching-patterns
          label: Caching patterns
          note: Who fills the cache, and when the database is written
          children:
            - id: cache-aside
              label: Cache-aside
              note: The app loads on a miss; on write, update DB then delete key
            - id: write-through
              label: Write-through
              note: Every write updates the database and the cache together
            - id: write-behind
              label: Write-behind
              note: The cache takes the write; the database is updated later
        - id: cache-failure-modes
          label: Cache failure modes
          note: Ways a cache miss turns into a flood on the database
          children:
            - id: cache-stampede
              label: Cache stampede
              note: A hot key expires; many requests reload it at once
            - id: cache-penetration
              label: Cache penetration
              note: Requests for ids that do not exist always miss
            - id: cache-avalanche
              label: Cache avalanche
              note: Many keys expire at the same time
        - id: distributed-lock
          label: Distributed lock
          note: Redis SET key value NX PX; for correctness, add a fencing token
    - id: cqrs
      children:
        - id: command-model
          label: Command (write) model
          note: Handles business tasks, validates, changes data
        - id: query-model
          label: Query (read) model
          note: Returns data for views; no business logic
        - id: materialized-view
          label: Materialized view
          note: Prepared read data; can be fully rebuilt from the source
        - id: read-model-sync
          label: Sync by events
          note: Write side publishes events; the read side updates later
    - id: event-sourcing
      children:
        - id: event-store
          label: Event store
          note: Append-only store of events; the system of record
        - id: event-replay
          label: Replay
          note: Rebuild current state by applying the events in order
        - id: event-snapshot
          label: Snapshot
          note: Saved state every N events; replay starts from it
        - id: compensating-event
          label: Compensating event
          note: A new event that reverses an earlier one; nothing is edited
        - id: event-upcasting
          label: Event versioning (upcasting)
          note: Old event shapes are converted to the current one on read
  messaging:
    - id: event-driven-architecture
      children:
        - id: domain-event
          label: Event
          note: "A fact that already happened, named in past tense: OrderCreated"
        - id: command-message
          label: Command
          note: "A request to one receiver to act: ReserveStock; it may be refused"
        - id: event-notification
          label: Event notification
          note: Event carries an id; consumers call back for details
        - id: event-carried-state-transfer
          label: Event-carried state transfer
          note: Event carries the changed data; consumers keep a local copy
        - id: event-versioning
          label: Event versioning
          note: Add optional fields; for a breaking change, publish a new version
          children:
            - id: schema-registry
              label: Schema registry
              note: Stores event schemas and rejects incompatible changes
    - id: message-brokers
      children:
        - id: point-to-point-queue
          label: Queue (point-to-point)
          note: Each message is processed by one consumer
        - id: publish-subscribe-topic
          label: Topic (publish-subscribe)
          note: Every subscriber gets its own copy of each message
        - id: competing-consumers
          label: Competing consumers
          note: Many instances read one queue to share the load
        - id: apache-kafka
          label: Apache Kafka
          note: Partitioned log; records kept 7 days by default, read or not
        - id: rabbitmq
          label: RabbitMQ
          note: Routes messages through exchanges to queues; ack removes them
          children:
            - id: rabbitmq-exchange
              label: Exchange types
              note: direct, fanout, topic, headers
            - id: rabbitmq-streams
              label: Streams (3.9+)
              note: Append-only log in RabbitMQ; reading does not delete, replay works
    - id: kafka-fundamentals
      children:
        - id: kafka-partition
          label: Partition
          note: Ordered slice of a topic; same key goes to the same partition
        - id: kafka-offset
          label: Offset
          note: A record's position in a partition; the consumer commits its own
        - id: consumer-group
          label: Consumer group
          note: Each partition goes to exactly one consumer in the group
        - id: share-group
          label: Share group (4.2+)
          note: "Queue-style reading: many consumers per partition, per-record acks"
        - id: kafka-replication
          label: Replication
          note: One leader and followers per partition; often 3 copies in production
          children:
            - id: in-sync-replicas
              label: ISR (in-sync replicas)
              note: Replicas caught up with the leader; acks=all waits for them
        - id: kraft-mode
          label: KRaft
          note: Kafka's own controllers keep metadata; ZooKeeper removed in 4.0
    - id: delivery-guarantees
      children:
        - id: at-most-once
          label: At-most-once
          note: "Commit offset, then process: a crash can lose a message"
        - id: at-least-once
          label: At-least-once
          note: "Process, then commit offset: a crash can repeat a message"
        - id: exactly-once
          label: Exactly-once
          note: "Kafka transactions: output and offsets commit together"
        - id: idempotent-producer
          label: Idempotent producer
          note: Broker drops retried duplicates of a send; on by default (3.0.1+)
        - id: idempotent-consumer
          label: Idempotent consumer
          note: Saves processed message ids; a repeated id is skipped
    - id: outbox-and-inbox
      children:
        - id: dual-write
          label: Dual write problem
          note: DB commit and broker send are separate; one can fail alone
        - id: transactional-outbox
          label: Outbox table
          note: Event row saved in the same local transaction as the change
        - id: polling-publisher
          label: Polling publisher
          note: A relay queries the outbox for unsent rows; works on any SQL DB
        - id: transaction-log-tailing
          label: Log tailing (CDC)
          note: A relay reads the DB log (binlog, WAL); Debezium does this
        - id: transactional-inbox
          label: Inbox table
          note: Consumer saves each message id with its own change
    - id: dead-letter-queues
      children:
        - id: poison-message
          label: Poison message
          note: A message that fails every time; retried forever it blocks others
        - id: retry-topic
          label: Retry topics (non-blocking)
          note: Failed record moves to delayed topics; Kafka ordering is lost
        - id: dead-letter-exchange
          label: Dead-letter exchange (RabbitMQ)
          note: Receives rejected, expired or over-limit messages
    - id: distributed-transactions
      children:
        - id: local-transaction
          label: Local transaction
          note: ACID inside one service's own database
        - id: two-phase-commit
          label: Two-phase commit (2PC)
          note: Coordinator asks all to prepare, then tells all to commit
        - id: xa-standard
          label: XA
          note: X/Open standard for 2PC between resource managers
    - id: saga
      children:
        - id: compensating-transaction
          label: Compensating transaction
          note: "A business action that offsets a finished step: refund, release"
        - id: saga-orchestration
          label: Orchestration
          note: A central orchestrator tells each service which step to run
        - id: saga-choreography
          label: Choreography
          note: Each service reacts to events and publishes the next one
        - id: pivot-transaction
          label: Pivot transaction
          note: Point of no return; later steps must be retryable
        - id: semantic-lock
          label: Semantic lock
          note: App-level flag such as PENDING while a saga is in progress
  security-observability:
    - id: microservices-security
      children:
        - id: authentication-check
          term: authentication
          label: Authentication
          note: "Proves who the caller is: a user or a service"
        - id: authorization-check
          term: authorization
          label: Authorization
          note: Decides what that caller may do with this resource
        - id: zero-trust-model
          term: zero-trust
          label: Zero trust
          note: No trust from network location; verify every request
        - id: mutual-tls-auth
          term: mtls
          label: mTLS (mutual TLS)
          note: "Both sides show certificates: identity plus encryption"
        - id: least-privilege-rule
          term: least-privilege
          label: Least privilege
          note: Each caller gets only the minimum rights its job needs
        - id: audit-log-trail
          term: audit-logging
          label: Audit log
          note: Security-relevant actions, kept for accountability
    - id: jwt-and-oauth
      children:
        - id: json-web-token
          term: jwt
          label: JWT
          note: JSON claims, signed (JWS) or encrypted (JWE); RFC 7519
        - id: oauth-2-framework
          term: oauth-2
          label: OAuth 2.0
          note: "Delegated authorisation: an app gets a scoped access token"
          children:
            - id: authorization-code-pkce
              term: authorization-code-flow
              label: Authorization code + PKCE
              note: "For users: log in at the IdP, swap a one-time code for tokens"
            - id: client-credentials-grant
              term: client-credentials-flow
              label: Client credentials
              note: "For services: no user; the client uses its own credentials"
            - id: oauth-access-token
              term: access-token
              label: Access token
              note: Sent to APIs; carries scopes and a lifetime
            - id: oauth-refresh-token
              term: refresh-token
              label: Refresh token
              note: Gets new access tokens; sent only to the authorization server
        - id: openid-connect-layer
          term: openid-connect
          label: OpenID Connect
          note: "Identity layer on OAuth 2.0: tells the app who logged in"
          children:
            - id: oidc-id-token
              term: id-token
              label: ID token
              note: A JWT about the login; its aud holds the client ID
        - id: api-key-credential
          term: api-key
          label: API key
          note: A secret sent on every call; not enough alone for sensitive data
    - id: observability
      children:
        - id: logs-pillar
          label: Logs
          note: Timestamped records of single events
        - id: metrics-pillar
          label: Metrics
          note: Measurements captured at runtime, aggregated over time
        - id: traces-pillar
          label: Traces
          note: The path of one request through many services
        - id: structured-log-format
          term: structured-logging
          label: Structured logging
          note: A stable schema of typed fields, often JSON
        - id: correlation-id-field
          term: correlation-id
          label: Correlation ID
          note: One ID in every log line of a call chain
        - id: log-aggregation
          term: centralised-logging
          label: Centralised logging
          note: Logs of all instances in one searchable store
    - id: distributed-tracing
      children:
        - id: tracing-span
          term: span-tracing
          label: Span
          note: "One unit of work: name, parent, start, end, attributes"
        - id: trace-id-field
          term: trace-id
          label: Trace ID
          note: Shared by all spans of one trace; 32 hex characters
        - id: traceparent-header
          term: traceparent
          label: traceparent header
          note: "W3C Trace Context: version-traceid-parentid-flags"
        - id: opentelemetry-project
          term: opentelemetry
          label: OpenTelemetry
          note: Vendor-neutral APIs, SDKs and tools; not a backend
          children:
            - id: otel-collector
              label: OpenTelemetry Collector
              note: Receives, processes and exports telemetry to backends
        - id: trace-sampling-modes
          term: trace-sampling
          label: Head vs tail sampling
          note: Head decides at the start; tail decides after the whole trace
        - id: micrometer-tracing
          label: Micrometer Tracing
          note: Spring Boot's tracing facade over OpenTelemetry or Brave
    - id: metrics-and-slos
      children:
        - id: four-golden-signals
          term: golden-signals
          label: Four golden signals
          note: The first four metrics of a user-facing service
          children:
            - id: latency-signal
              label: Latency
              note: Time to serve a request; track failed ones separately
              children:
                - id: latency-p99
                  term: latency-percentile
                  label: p95 / p99
                  note: 95% or 99% of requests finish at or below this time
            - id: traffic-signal
              label: Traffic
              note: Demand on the system, such as HTTP requests per second
            - id: errors-signal
              label: Errors
              note: "Failed requests: 500s, wrong content, or too slow by policy"
            - id: saturation-signal
              label: Saturation
              note: How full the most limited resource is
        - id: red-method
          label: RED method
          note: "Per service: request rate, errors, duration"
        - id: use-method
          label: USE method
          note: "Per resource: utilisation, saturation, errors"
        - id: sli-indicator
          term: sli
          label: SLI
          note: A measured level of service, such as request latency
        - id: slo-objective
          term: slo
          label: SLO
          note: "A target value or range for an SLI"
          children:
            - id: error-budget-allowance
              term: error-budget
              label: Error budget
              note: "100% minus the SLO: failure allowed in the window"
        - id: sla-agreement
          term: sla
          label: SLA
          note: A contract with users, with a consequence if missed
  deployment:
    - id: containers-and-kubernetes
      children:
        - id: docker
          label: Docker
          children:
            - id: container-image
              label: Image
            - id: software-container
              label: Container
              note: Its writable layer is lost when the container is removed
        - id: kubernetes
          label: Kubernetes
          children:
            - id: kubernetes-pod
              label: Pod
              note: "Disposable: replaced, not repaired; each Pod has its own IP"
            - id: kubernetes-deployment
              label: Deployment
              children:
                - id: kubernetes-replicaset
                  label: ReplicaSet
                  note: Keeps a stable number of identical Pods running
            - id: kubernetes-service
              label: Service
              note: "Type ClusterIP by default: reachable only inside the cluster"
            - id: kubernetes-ingress
              label: Ingress / Gateway API
              note: Ingress API is frozen; Kubernetes now recommends Gateway API
            - id: kubernetes-configmap
              label: ConfigMap
              note: No secrecy or encryption; at most 1 MiB
            - id: kubernetes-secret
              label: Secret
              note: Only base64; unencrypted in etcd unless encryption at rest is on
            - id: horizontal-pod-autoscaler
              label: HorizontalPodAutoscaler
              note: Checks the metrics every 15 s by default
    - id: health-probes
      children:
        - id: liveness-probe
          label: Liveness probe
        - id: readiness-probe
          label: Readiness probe
        - id: startup-probe
          label: Startup probe
          note: Allow failureThreshold x periodSeconds for the slowest start
        - id: actuator-probe-groups
          label: Actuator probe groups
          note: Spring Boot 4.1 maps them from the app's availability state
    - id: deployment-strategies
      children:
        - id: rolling-update
          label: Rolling update
          note: Tuned by maxSurge and maxUnavailable
        - id: recreate-strategy
          label: Recreate
          note: "Stop all old Pods, then start new ones: brief downtime"
        - id: blue-green-deployment
          label: Blue-green deployment
        - id: canary-release
          label: Canary release
        - id: feature-flag
          label: Feature flag
        - id: expand-and-contract
          label: Expand and contract
        - id: ci-cd-pipeline
          label: CI/CD pipeline
          note: Continuous deployment needs continuous delivery first
          children:
            - id: continuous-integration
              label: Continuous integration
            - id: continuous-delivery
              label: Continuous delivery
            - id: continuous-deployment
              label: Continuous deployment
    - id: configuration-management
      children:
        - id: twelve-factor-config
          label: Twelve-Factor config
          term: twelve-factor-app
          note: "Factor III: config in env vars, strictly apart from code"
        - id: spring-profiles
          label: Spring profiles
          note: application-{profile}.properties overrides the base file
        - id: config-server
          label: Config server
          note: "Spring Cloud Config: Git, Vault or file backends over HTTP"
        - id: secret-manager
          label: Secret manager
          note: Vault can issue short-lived database credentials
        - id: immutable-artifact
          label: Immutable artifact
          note: A release is never changed; any change makes a new one
        - id: configuration-drift
          label: Configuration drift
          note: Untracked changes make running servers differ over time
    - id: testing-microservices
      children:
        - id: unit-test
          label: Unit test
          note: "The base of the pyramid: many, small and fast"
        - id: integration-test
          label: Integration test
          note: Your code with a real database or broker
        - id: component-test
          label: Component test
          note: One whole service; its collaborators replaced by doubles
        - id: contract-test
          label: Contract test
          children:
            - id: consumer-driven-contract
              label: Consumer-driven contract
            - id: pact-tool
              label: Pact
              note: Code-first contract tests for HTTP and message integrations
        - id: end-to-end-test
          label: End-to-end test
        - id: test-double
          label: Test double
        - id: chaos-engineering
          label: Chaos engineering
  playbook:
    - id: spring-cloud-stack
      children:
        - id: spring-cloud-projects
          label: Spring Cloud
          note: "Release train 2025.1 (Oakwood): every project at 5.0"
          children:
            - id: spring-cloud-gateway
              label: Spring Cloud Gateway
              note: Edge router; Server Web MVC or Server WebFlux variant
            - id: spring-cloud-loadbalancer
              label: Spring Cloud LoadBalancer
              note: Client-side load balancer; round robin by default
            - id: spring-cloud-config
              label: Spring Cloud Config
              note: Config server and client; Git is the default backend
            - id: spring-cloud-circuitbreaker
              label: Spring Cloud CircuitBreaker
              note: One API over Resilience4j, Spring Retry or Framework Retry
            - id: spring-cloud-kubernetes
              label: Spring Cloud Kubernetes
              note: Discovery and config read from Kubernetes
        - id: spring-http-clients
          label: HTTP clients
          note: How one service calls another over HTTP
          children:
            - id: restclient
              label: RestClient
              note: Blocking, fluent client; Spring Framework 6.1+
            - id: webclient
              label: WebClient
              note: Non-blocking reactive client; Spring Framework 5.0+
            - id: http-service-client
              label: HTTP service client
              note: Interface with @GetExchange, backed by a proxy; 6.0+
            - id: openfeign
              label: OpenFeign
              note: "@FeignClient interfaces; feature-complete since 2022.0"
            - id: resttemplate
              label: RestTemplate
              note: Deprecated in Spring Framework 7.0; removal planned
        - id: spring-boot-built-in
          label: Spring Boot
          note: Builds one stand-alone, production-grade service
          children:
            - id: spring-kafka
              label: Spring for Apache Kafka
              note: KafkaTemplate sends; @KafkaListener consumes
            - id: spring-boot-actuator
              label: Spring Boot Actuator
              note: Only /actuator/health is exposed over HTTP by default
            - id: micrometer
              label: Micrometer
              note: Vendor-neutral metrics and tracing facade for the JVM
            - id: framework-retryable
              label: "@Retryable, @ConcurrencyLimit"
              note: In core Spring since 7.0; default 3 retries, 1 s apart
    - id: microservice-patterns-map
      children:
        - id: leader-election
          label: Leader election
          note: One instance coordinates; another takes over if it fails
          children:
            - id: leader-lease
              label: Lease (distributed mutex)
              note: First to take the lease leads; it must keep renewing it
            - id: election-algorithms
              label: Raft, Bully
              note: Election algorithms; every candidate needs a unique id
        - id: pattern-groups
          label: Pattern groups
          note: Boundaries, collaboration, messaging, discovery, reliability, refactoring
    - id: strangler-fig-migration
      children:
        - id: strangler-facade
          label: Strangler facade
          note: Proxy that routes each request to the legacy or the new system
        - id: anti-corruption-layer
          label: Anti-corruption layer
          note: Translates between two models; from Eric Evans' DDD
        - id: transitional-architecture
          label: Transitional architecture
          note: Temporary code that lets old and new run side by side
        - id: domain-data-cutover
          label: Data cutover
          note: Copy with ETL, sync with CDC, validate, then switch
        - id: first-service-choice
          label: First service
          note: Fairly decoupled, with few calls back to the monolith
        - id: big-bang-rewrite
          label: Big-bang rewrite
          note: Replace all at once; long and risky
    - id: design-walkthrough
      children:
        - id: shared-library
          label: Shared library
          note: Fine for technical code; shared domain code couples releases
        - id: microservice-chassis
          label: Microservice chassis
          note: Framework for cross-cutting concerns, e.g. Spring Boot + Spring Cloud
        - id: service-template
          label: Service template
          note: Runnable sample service you copy; each copy is updated by hand
