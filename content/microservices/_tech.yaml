name: Microservices
slug: microservices
accent: amber
summary: "Microservices for interviews: boundaries, APIs, resilience, data and sagas, Kafka and events, security, observability, deployment and Spring Cloud."
codeLanguages:
  - java
storySpine:
  - step: One big app makes every team wait for one release and scale the whole thing → split it by business capability into services that deploy on their own
    cards:
      - monolith-and-microservices
      - service-boundaries
  - step: Calls now cross a network that is slow and can fail, while load keeps growing → design for partial failure and scale stateless instances out
    cards:
      - distributed-systems-fallacies
      - scaling-services
  - step: Services must talk, and the caller cannot always wait → call with REST or gRPC when it needs the answer now, send a message when it does not; make retried calls idempotent
    cards:
      - sync-and-async-communication
      - rest-apis
      - grpc
      - idempotency
  - step: Clients and services cannot track moving instances → one API gateway at the edge, a registry to find instances, a load balancer to spread calls, a mesh for mTLS and retries
    cards:
      - api-gateway
      - service-discovery
      - load-balancing
      - service-mesh
  - step: A slow Payment service holds every thread in the Order service → give each call a timeout, retry blips with backoff and jitter, and give each dependency its own bulkhead
    cards:
      - timeouts-and-retries
      - bulkhead
  - step: Payment keeps failing during a sale rush → open a circuit breaker, limit each client's rate, and show a degraded page instead of an error
    cards:
      - circuit-breaker
      - rate-limiting
      - fallback-and-degradation
  - step: Services share one database, so every schema change needs every team → give each service its own data, reached only through its API or events
    cards:
      - database-per-service
  - step: Copies of data in services, replicas and caches drift apart → accept eventual consistency where it is safe, cache with TTLs, and build read views from events
    cards:
      - cap-and-consistency
      - caching-in-microservices
      - cqrs
      - event-sourcing
  - step: Order Service must tell Inventory, Payment and Notification, and messages get lost, repeated or stuck → publish events through Kafka from an outbox; consumers deduplicate and park bad messages in a DLQ
    cards:
      - event-driven-architecture
      - message-brokers
      - kafka-fundamentals
      - delivery-guarantees
      - outbox-and-inbox
      - dead-letter-queues
  - step: A payment fails after stock was reserved, and one ACID transaction cannot span services → run a saga that releases the stock and cancels the order
    cards:
      - distributed-transactions
      - saga
  - step: Any caller inside the network can reach every service → check a signed token at the gateway and again in each service, with mTLS between services
    cards:
      - microservices-security
      - jwt-and-oauth
  - step: A checkout is slow and nobody knows which service is to blame → join logs, metrics and traces by trace ID and alert on SLOs
    cards:
      - observability
      - distributed-tracing
      - metrics-and-slos
  - step: Services must run the same everywhere, recover from crashes and ship without downtime → run them as containers on Kubernetes, with health probes and gradual rollouts
    cards:
      - containers-and-kubernetes
      - health-probes
      - deployment-strategies
  - step: Each environment needs its own settings, and a renamed field can break a caller → inject config at runtime and catch API breaks with contract tests
    cards:
      - configuration-management
      - testing-microservices
  - step: Each service needs the same plumbing, and an interviewer wants the right pattern for each problem → build on Spring Boot, add Spring Cloud parts as needed, and keep a problem-to-pattern map
    cards:
      - spring-cloud-stack
      - microservice-patterns-map
  - step: A big monolith cannot be rewritten at once, and a design round needs one clear answer → strangle it one capability at a time, and answer in a fixed order from boundaries to deployment
    cards:
      - strangler-fig-migration
      - design-walkthrough
topics:
  - id: basics
    title: Microservices Basics
    order: 1
    blurb: What microservices are, when a monolith is better, how to draw service boundaries, and how services scale.
  - id: communication
    title: Communication and APIs
    order: 2
    blurb: Sync and async calls, REST and gRPC, idempotency, the API gateway, discovery and load balancing.
  - id: resilience
    title: Resilience
    order: 3
    blurb: Timeouts, retries, circuit breakers, bulkheads, rate limits and graceful degradation.
  - id: data
    title: Data and Consistency
    order: 4
    blurb: Database per service, CAP and consistency, caching, CQRS and event sourcing.
  - id: messaging
    title: Events, Messaging and Sagas
    order: 5
    blurb: Event-driven design, Kafka, delivery guarantees, outbox and inbox, dead letters, 2PC and sagas.
  - id: security-observability
    title: Security and Observability
    order: 6
    blurb: Authentication between services, JWT and OAuth, logs, metrics, traces and SLOs.
  - id: deployment
    title: Deployment and Testing
    order: 7
    blurb: Containers, Kubernetes, health probes, release strategies, configuration and contract tests.
  - id: playbook
    title: Spring, Patterns and Playbook
    order: 8
    blurb: The Spring Cloud stack, a map of the patterns, migrating a monolith, and how to answer a design question.
