---
id: strong-vs-eventual-consistency
tech: system-design
title: Strong vs Eventual Consistency
compares: [linearizability, eventual-consistency]
gist:
  - "Every read returns the latest write, as if there were one copy"
  - "Reads may be stale for a while; copies agree once writes stop"
explain:
  - "Strong (linearizable) consistency makes a read always return the newest completed write, as if the data lived on one machine. It solves the problem of a read acting on stale data, at the cost of waiting for replicas before a write is confirmed."
  - "Eventual consistency lets a write confirm quickly and copies to other replicas afterwards, so reads can be stale for a while. It solves the need to stay fast and available, accepting that all copies only converge once writes stop."
example: "A payment balance is read with strong consistency, so a withdrawal always sees the true amount and cannot overdraw. The same app shows a post's like count with eventual consistency: if the count is a few behind for a moment, nothing breaks, and reads stay fast and always available."
sayIt: "Strong consistency returns the latest write every time but adds write latency and can fail during a partition. Eventual consistency stays fast and available but may serve stale reads briefly. I use strong for money, stock and locks, and eventual for counts, feeds and view numbers."
diagrams:
  - |
    flowchart LR
      W["write x = 2"] --> A[("A: x = 2")]
      A -- "copy, then confirm" --> B[("B: x = 2")]
      B --> R["read from B: 2"]
  - |
    flowchart LR
      W["write x = 2"] --> A[("A: x = 2")]
      A -.->|copy later| B[("B: x = 1")]
      B --> R["read from B: 1, stale"]
diagramAlt: "Strong: a write of x = 2 reaches replica A, is copied to replica B before it is confirmed, so a read from B returns 2. Eventual: the write is confirmed at A and copied to B later, so a read from B can still return the old value 1."
rows:
  - { aspect: "A read returns", a: "The latest completed write", b: "Maybe an older value, for a while" }
  - { aspect: "Write latency", a: "Higher: waits until other replicas have the write", b: "Lower: other copies catch up in the background" }
  - { aspect: "During a partition", a: "Some requests must fail", b: "Every node can still answer" }
  - { aspect: "Read cost in DynamoDB", a: "1 read unit per 4 KB", b: "Half a read unit per 4 KB (the default)" }
  - { aspect: "Good for", a: "Balances, stock counts, bookings, locks", b: "Likes, feeds, view counts, DNS" }
  - { aspect: "Examples", a: "etcd reads by default; MongoDB \"linearizable\" read concern", b: "DynamoDB default reads; Cassandra at level ONE" }
verdict: "Use strong consistency where acting on an old value does real harm (money, stock, locks); use eventual for data that may lag a little, and add read-your-writes for a user's own edits."
