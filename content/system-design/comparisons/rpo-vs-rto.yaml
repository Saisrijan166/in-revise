---
id: rpo-vs-rto
tech: system-design
title: RPO vs RTO
compares: [rpo, rto]
gist:
  - "How much data you can lose, measured in time"
  - "How long you can be down"
explain:
  - "RPO (Recovery Point Objective) is how much data you may lose, expressed as a length of time back to the last good copy. It answers 'how far back do we recover to?' and is set by how often you back up or replicate: hourly backups give an RPO of up to an hour."
  - "RTO (Recovery Time Objective) is how long the service may be down before it is restored. It answers 'how fast must we be back?' and is set by how quickly you detect the failure and fail over or restore. It says nothing about data loss."
example: "A disaster hits the orders database at 14:00. The last backup was at 13:00, so one hour of orders is lost: the RPO is 1 hour. The team restores and the service is back at 15:30, so the downtime, the RTO, is 90 minutes. Lowering the RPO needs more frequent backups; lowering the RTO needs a faster or already-running standby."
diagrams:
  - |
    flowchart LR
      B["Last backup 13:00"] -- "1 h of data lost" --> D["Disaster 14:00"]
  - |
    flowchart LR
      D["Disaster 14:00"] -- "1.5 h of downtime" --> R["Service back 15:30"]
diagramAlt: "RPO looks back: from the last backup at 13:00 to the disaster at 14:00, one hour of data is lost. RTO looks forward: from the disaster at 14:00 until service is back at 15:30, the system is down for 90 minutes."
rows:
  - { aspect: "Question it answers", a: "How much data can we lose?", b: "How long can we be down?" }
  - { aspect: "On the timeline", a: "Backwards: from the disaster to the last good copy", b: "Forwards: from the disaster until service is back" }
  - { aspect: "Set by", a: "How often you back up or replicate", b: "How fast you detect, fail over or restore" }
  - { aspect: "Lower it with", a: "More frequent backups, continuous or synchronous replication", b: "A running standby, automated failover, infrastructure as code" }
  - { aspect: "Zero means", a: "No lost writes: needs synchronous replication", b: "No downtime: other sites already serve traffic" }
verdict: "Agree both numbers with the business for each workload; lower numbers cost more, so choose the cheapest setup that meets them."
sayIt: "RPO is how much data I can lose, measured as time back to the last good copy, and it is set by how often I back up or replicate. RTO is how long I can be down, set by how fast I detect and recover. I agree both per workload and pick the cheapest design that meets them."
