id: rpo-vs-rto
tech: system-design
title: RPO vs RTO
compares: [rpo, rto]
gist:
  - "How much data you can lose, measured in time"
  - "How long you can be down"
diagrams:
  - |
    flowchart LR
      B["Last backup 13:00"] -- "1 h of data lost" --> D["Disaster 14:00"]
  - |
    flowchart LR
      D["Disaster 14:00"] -- "1.5 h of downtime" --> R["Service back 15:30"]
diagramAlt: "RPO looks back: from the last backup at 13:00 to the disaster at 14:00, one hour of data is lost. RTO looks forward: from the disaster at 14:00 until service is back at 15:30, the system is down for 90 minutes."
rows:
  - { aspect: "Question it answers", a: "How much data can we lose?", b: "How long can we be down?" }
  - { aspect: "On the timeline", a: "Backwards: from the disaster to the last good copy", b: "Forwards: from the disaster until service is back" }
  - { aspect: "Set by", a: "How often you back up or replicate", b: "How fast you detect, fail over or restore" }
  - { aspect: "Lower it with", a: "More frequent backups, continuous or synchronous replication", b: "A running standby, automated failover, infrastructure as code" }
  - { aspect: "Zero means", a: "No lost writes: needs synchronous replication", b: "No downtime: other sites already serve traffic" }
verdict: "Agree both numbers with the business for each workload; lower numbers cost more, so choose the cheapest setup that meets them."
