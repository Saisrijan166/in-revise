---
id: delivery-semantics
tech: system-design
title: At-most-once vs At-least-once vs Exactly-once
compares: [at-most-once, at-least-once, exactly-once]
gist:
  - "Zero or one delivery: may be lost, never repeated"
  - "One or more deliveries: never lost, may repeat"
  - "The effect happens once: repeats are detected and skipped"
explain:
  - "At-most-once acknowledges the message before doing the work, so a crash in between loses it. It fits data where a little loss is cheap, like metrics, and costs the least because it never retries."
  - "At-least-once does the work first and acknowledges after, so a crash re-delivers the message. Nothing is lost, but the same message can arrive again, so the consumer must handle duplicates."
  - "Exactly-once keeps at-least-once delivery and adds deduplication (a recorded message ID or a transaction), so a repeat is detected and skipped and the effect happens once. It fits payments and balances and costs the most."
example: "A payment worker charges a card. At-most-once could lose the charge on a crash. At-least-once could charge twice if it crashes before acking. Exactly-once records the message ID with the charge in one transaction, so a redelivered message is skipped and the card is charged once."
diagrams:
  - |
    flowchart LR
      A[Receive] --> B[Ack] --> C[Process]
  - |
    flowchart LR
      A[Receive] --> B[Process] --> C[Ack]
  - |
    flowchart LR
      A[Receive] --> B["Process + save ID, one transaction"] --> C[Ack]
diagramAlt: "At-most-once: receive, acknowledge, then process, so a crash after the ack loses the message. At-least-once: receive, process, then acknowledge, so a crash before the ack brings the message back. Exactly-once: receive, then process and save the message ID in one transaction, then acknowledge, so a repeat is skipped."
rows:
  - { aspect: "Lost if the consumer crashes?", a: "Yes, if it crashes after the ack", b: "No", c: "No" }
  - { aspect: "Repeated if it crashes?", a: "No", b: "Yes, if it crashes before the ack", c: "Delivered again, but skipped" }
  - { aspect: "Consumer order", a: "Ack (commit), then process", b: "Process, then ack", c: "Process and record the ID atomically, then ack" }
  - { aspect: "Cost", a: "Lowest: no retries, no tracking", b: "Retries, plus duplicates to handle", c: "Highest: a dedupe store or transactions" }
  - { aspect: "Examples", a: "Kafka with retries off and commit before processing", b: "Kafka default; SQS standard queues", c: "Kafka transactions (inside Kafka); SQS FIFO for resends; idempotent consumers" }
  - { aspect: "Fits", a: "Metrics, where a little loss is fine", b: "Most work, with an idempotent consumer", c: "Payments, orders and balances" }
verdict: "Default to at-least-once with an idempotent consumer. Accept at-most-once only where loss is cheap. Treat exactly-once as something you build, not a switch."
sayIt: "At-most-once may lose a message, at-least-once may repeat it, and exactly-once makes the effect happen once. End to end I use at-least-once with an idempotent consumer: a stable message ID recorded with the change, so a redelivery is skipped. True exactly-once is something I build, not a flag."
