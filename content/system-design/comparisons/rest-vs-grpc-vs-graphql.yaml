---
id: rest-vs-grpc-vs-graphql
tech: system-design
title: REST vs gRPC vs GraphQL
compares: [rest, grpc, graphql]
gist:
  - "Resources at URLs, standard HTTP methods, usually JSON"
  - "Typed method calls over HTTP/2 with Protocol Buffers"
  - "One endpoint; the client's query picks the fields"
diagrams:
  - |
    flowchart LR
      C[Client] -- "GET /users/42" --> A[API]
      C -- "GET /users/42/orders" --> A
  - |
    flowchart LR
      S1[Service A] -- "GetUser(id), binary Protobuf" --> S2[Service B]
  - |
    flowchart LR
      C[Client] -- "one query: user name + order totals" --> G["/graphql"]
diagramAlt: "REST: a client makes two calls, GET /users/42 and GET /users/42/orders. gRPC: service A calls the GetUser method on service B with a binary Protobuf message. GraphQL: a client sends one query for the user's name and order totals to the single /graphql endpoint."
rows:
  - { aspect: "You call", a: "A resource URL with a method, e.g. GET /users/42", b: "A method on a service, e.g. UserService.GetUser", c: "One URL, usually /graphql, with a query" }
  - { aspect: "Contract", a: "Optional, e.g. an OpenAPI document", b: ".proto file; client and server code is generated", c: "Typed schema; every query is checked against it" }
  - { aspect: "Data format", a: "Usually JSON (text)", b: "Protocol Buffers (binary) by default", c: "JSON responses" }
  - { aspect: "Who shapes the reply", a: "The server, per URL", b: "The .proto message type", c: "The client, field by field" }
  - { aspect: "Streaming", a: "Request-response; add SSE or WebSockets for push", b: "Server, client and bidirectional streams", c: "Subscriptions for real-time updates" }
  - { aspect: "HTTP caching", a: "Works well for GET responses", b: "Not built in: every call is an HTTP/2 POST", c: "Mostly for GET queries; most caches skip POST" }
  - { aspect: "Browsers", a: "Native, any HTTP client", b: "Need gRPC-Web and a proxy such as Envoy", c: "Native, any HTTP client" }
verdict: "REST for public and simple CRUD APIs; gRPC for fast, typed internal service-to-service calls and streaming; GraphQL when many clients need different shapes of the same data."
