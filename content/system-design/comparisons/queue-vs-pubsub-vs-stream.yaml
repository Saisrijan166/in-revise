---
id: queue-vs-pubsub-vs-stream
tech: system-design
title: Message Queue vs Pub/Sub vs Event Stream
compares: [message-queue, pub-sub, event-streaming]
gist:
  - "One message, one worker: workers share the jobs"
  - "One message, a copy for every subscriber"
  - "A kept, ordered log; each reader tracks its own offset"
diagrams:
  - |
    flowchart LR
      P[Producer] --> Q[(Queue)]
      Q -- "job 1" --> W1[Worker 1]
      Q -- "job 2" --> W2[Worker 2]
  - |
    flowchart LR
      P[Publisher] --> T{{Topic}}
      T -- copy --> S1[Billing]
      T -- copy --> S2[Email]
  - |
    flowchart LR
      P[Producer] --> L["Log: 0 1 2 3 4"]
      L -- "at offset 4" --> A[Group A]
      L -- "at offset 1" --> B[Group B]
diagramAlt: "Queue: a producer sends jobs to a queue; job 1 goes to worker 1 and job 2 goes to worker 2. Pub/sub: a publisher sends to a topic, which sends one copy to billing and one copy to email. Stream: a producer appends to a log with offsets 0 to 4; group A has read up to offset 4 and group B only up to offset 1."
rows:
  - { aspect: "Who gets each message", a: "One consumer; workers share the queue", b: "Every subscription gets its own copy", c: "Every consumer group; inside a group, one consumer per partition" }
  - { aspect: "After it is processed", a: "Deleted once acked", b: "Gone for that subscription once acked", c: "Kept until retention ends (Kafka default: 7 days)" }
  - { aspect: "Read old messages again", a: "No: an acked message is deleted", b: "Usually no; Google Pub/Sub can seek back if retention is on", c: "Yes: move the offset back and replay" }
  - { aspect: "Order", a: "Best-effort (SQS standard); strict per group in FIFO queues", b: "Not guaranteed by default", c: "Strict within one partition only" }
  - { aspect: "Progress is tracked by", a: "The broker, one ack per message", b: "The broker, per subscription", c: "The consumer group: one offset per partition" }
  - { aspect: "Typical use", a: "Background jobs: emails, image resizing", b: "Tell many services about one event", c: "Activity tracking, metrics, logs, stream processing" }
  - { aspect: "Examples", a: "Amazon SQS, RabbitMQ queues", b: "Amazon SNS, Google Pub/Sub, Redis Pub/Sub", c: "Apache Kafka, Amazon Kinesis, Azure Event Hubs" }
verdict: "Use a queue to share jobs among workers, pub/sub to tell many services about one event, and a stream when many readers need ordered events they can replay."
