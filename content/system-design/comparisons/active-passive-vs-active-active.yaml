---
id: active-passive-vs-active-active
tech: system-design
title: Active-Passive vs Active-Active
compares: [active-passive, active-active]
gist:
  - "One copy serves traffic; a standby waits to take over"
  - "Every copy serves traffic all the time"
explain:
  - "Active-passive runs one live copy (the primary) plus a standby that only waits. The standby keeps its data in sync but serves nothing until the primary fails, when it is promoted. It solves the single-writer case simply: there is never a write conflict."
  - "Active-active runs every copy live at once, all serving traffic. There is no promotion step on failure; you just stop routing to the dead copy. It gives near-zero downtime and uses all capacity, at the cost of handling concurrent writes."
example: "A payment service runs its stateless web servers active-active behind a load balancer: all serve requests, and a dead one is simply dropped from the pool. Its primary database runs active-passive: one writer with a standby replica, so there is no write conflict, and a failure triggers a failover that takes a minute or two."
diagrams:
  - |
    flowchart LR
      U[Users] --> P[Primary]
      P -. copies data .-> S["Standby (idle)"]
  - |
    flowchart LR
      U[Users] --> A[Copy A]
      U --> B[Copy B]
      A -- "sync both ways" --- B
diagramAlt: "Active-passive: users reach only the primary, which copies its data to an idle standby. Active-active: users reach copy A and copy B at the same time, and the two keep each other in sync."
rows:
  - { aspect: "Who serves traffic", a: "Only the primary", b: "All copies at once" }
  - { aspect: "When one copy fails", a: "Fail over: detect, promote the standby, redirect traffic", b: "No failover step: stop sending traffic to the failed copy" }
  - { aspect: "Downtime (RTO)", a: "Often minutes", b: "Can be zero" }
  - { aspect: "Spare capacity", a: "The standby sits idle until needed", b: "Each copy needs room for a lost peer's load" }
  - { aspect: "Writes", a: "One writer, so no write conflicts", b: "Concurrent writes can conflict and must be reconciled" }
  - { aspect: "Typical use", a: "A primary database with a standby replica", b: "Stateless web servers behind a load balancer" }
verdict: "Use active-passive for a single-writer database; use active-active for stateless tiers, or when you need near-zero downtime and can handle write conflicts."
sayIt: "Active-passive has one live copy and a waiting standby: no write conflicts, but failover takes time. I use it for a single-writer database. Active-active runs every copy live: no failover step and no idle capacity, but writes can conflict. I use it for stateless tiers behind a load balancer."
