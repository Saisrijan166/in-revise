---
id: btree-vs-lsm
tech: system-design
title: B-tree vs LSM Tree
compares: [b-tree, lsm-tree]
gist:
  - "Sorted pages changed in place: fast reads and range scans"
  - "Writes buffered in memory, flushed as sorted files, merged later"
explain:
  - "A B-tree keeps keys sorted in pages and changes the right page in place. A read walks one root-to-leaf path, a few page reads, so it is strong for point lookups and range scans. It is the default index in PostgreSQL, MySQL InnoDB and MongoDB."
  - "An LSM tree buffers writes in memory and flushes them as immutable sorted files (SSTables), merged later by compaction. Writes are fast and sequential, so it suits write-heavy workloads like logs and event history. Cassandra and RocksDB use it."
example: "An events table takes a huge stream of writes and few reads. On a B-tree each insert may read and rewrite a random page on disk. On an LSM tree the writes go to memory and are flushed sequentially, so the write path is far cheaper; a read may check several files, and a Bloom filter skips the ones that cannot hold the key."
sayIt: "I default to a B-tree for read-heavy or mixed workloads with range queries, since a lookup is a few page reads. I choose an LSM tree when writes far outnumber reads, like logs or event history, because it turns random writes into sequential flushes, at the cost of read and compaction work."
diagrams:
  - |
    flowchart TD
      R["Root page"] --> I["Internal page"]
      I --> L1["Leaf page: keys 40 to 49"]
      I --> L2["Leaf page: keys 50 to 59"]
  - |
    flowchart LR
      W["Write"] --> M["Memtable in memory"]
      M -- flush --> S1["SSTable 1"]
      M -- flush --> S2["SSTable 2"]
      S1 --> C["Compaction"]
      S2 --> C
      C --> S3["Merged SSTable"]
diagramAlt: "B-tree: a root page points to an internal page, which points to leaf pages that each hold a sorted range of keys; a write changes the right leaf page in place. LSM tree: a write goes to an in-memory memtable, which is flushed to immutable SSTable files; compaction later merges SSTables into one new file."
rows:
  - { aspect: "A write", a: "Finds its leaf page and changes it in place", b: "Goes to a log and the memtable; flushed later as a new file" }
  - { aspect: "A read", a: "One root-to-leaf path: a few page reads", b: "May check the memtable and several files; Bloom filters skip most" }
  - { aspect: "Background work", a: "Page splits when a page is full", b: "Compaction merges files and drops old versions" }
  - { aspect: "Main cost", a: "An insert may read and rewrite a random page on disk", b: "Write amplification: compaction rewrites data many times" }
  - { aspect: "Used by", a: "PostgreSQL, MySQL InnoDB, MongoDB indexes", b: "Apache Cassandra, RocksDB" }
verdict: "Default to a B-tree for read-heavy or mixed workloads with range queries; choose an LSM tree when writes far outnumber reads, such as logs and event history."
