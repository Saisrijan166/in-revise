id: rate-limit-algorithms
tech: system-design
title: Token Bucket vs Leaky Bucket vs Fixed and Sliding Windows
compares: [token-bucket, leaky-bucket, fixed-window, sliding-window]
gist:
  - "Spend a token per request; tokens refill at a fixed rate"
  - "Requests queue up and leave at a fixed rate"
  - "Count per clock window; the counter resets at the edge"
  - "Count the last N seconds, measured from now"
diagrams:
  - |
    flowchart LR
      F["refill r per second"] --> B[("bucket: up to N tokens")]
      B --> Q["each request takes 1"]
  - |
    flowchart LR
      I["requests in"] --> Q[("queue")]
      Q --> O["out at a fixed rate"]
  - |
    flowchart LR
      W1["12:00 to 12:01: max 100"] --> W2["12:01: counter back to 0"]
  - |
    flowchart LR
      N["now"] --> L["count requests in the last 60 s"]
diagramAlt: "Token bucket: tokens refill at r per second into a bucket that holds up to N; each request takes one. Leaky bucket: requests enter a queue and leave at a fixed rate. Fixed window: from 12:00 to 12:01 at most 100 requests, then the counter resets to 0. Sliding window: at every moment, count the requests in the last 60 seconds."
rows:
  - { aspect: "Bursts", a: "Allowed, up to the bucket size", b: "Smoothed: extras wait in the queue or are dropped", c: "Up to 2x the limit across a reset", d: "Held close to the limit" }
  - { aspect: "Tuned by", a: "Bucket size and refill rate", b: "Leak rate and burst size (nginx: rate, burst)", c: "Window length and limit", d: "Window length and limit" }
  - { aspect: "State per key", a: "Token count and last refill time", b: "One small entry (nginx: 64 or 128 bytes)", c: "One counter", d: "Log: every timestamp. Counter: a few counts (Cloudflare: 2)" }
  - { aspect: "Used by", a: "AWS API Gateway, Stripe", b: "nginx limit_req", c: "The Redis INCR + EXPIRE pattern", d: "Cloudflare and Figma (counter variant, 2017 posts)" }
  - { aspect: "Watch out", a: "Read-then-write races in a shared store", b: "Queued requests wait, which adds delay", c: "Simple, but loose at window edges", d: "The log needs memory for every request" }
verdict: "Use a token bucket when short bursts are fine, a leaky bucket for a smooth fixed outflow, a sliding window counter for accurate limits with little memory, and a fixed window only when simple is enough."
