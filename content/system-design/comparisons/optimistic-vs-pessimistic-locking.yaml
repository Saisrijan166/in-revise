---
id: optimistic-vs-pessimistic-locking
tech: system-design
title: Optimistic vs Pessimistic Locking
compares: [optimistic-locking, pessimistic-locking]
gist:
  - "No lock: check the version when you write; retry on conflict"
  - "Lock the rows first; other writers wait until you commit"
diagrams:
  - |
    flowchart LR
      R["read row, version 3"] --> W["UPDATE ... WHERE version = 3"]
      W -- "1 row" --> OK[saved]
      W -- "0 rows" --> RT[reload and retry]
  - |
    flowchart LR
      L["SELECT ... FOR UPDATE"] --> U[update] --> C["commit: lock released"]
      O[other writer] -. waits .-> L
diagramAlt: "Optimistic: read the row with version 3, then update only where the version is still 3. One row changed means saved; zero rows means someone else changed it, so reload and retry. Pessimistic: lock the row with SELECT FOR UPDATE, update it and commit, which releases the lock; another writer waits meanwhile."
rows:
  - { aspect: "When it acts", a: "At write time: did the version change?", b: "Before the change: lock the rows" }
  - { aspect: "Other writers meanwhile", a: "Not blocked; the later writer fails", b: "Wait until the lock holder commits" }
  - { aspect: "On conflict", a: "0 rows updated: reload, then retry or merge", b: "Writers wait instead; a deadlock aborts one, which must retry" }
  - { aspect: "Best when", a: "Conflicts are rare; long edits such as forms", b: "Many writers hit the same rows; short transactions" }
  - { aspect: "Tools", a: "Version column, JPA @Version, DynamoDB condition expressions", b: "SELECT ... FOR UPDATE, JPA PESSIMISTIC_WRITE" }
  - { aspect: "Watch out", a: "Retries pile up under heavy contention", b: "Lock waits; never hold a lock across user think time" }
verdict: "Default to optimistic when conflicts are rare or edits are long; lock pessimistically, in short transactions, when many writers fight over the same rows."
