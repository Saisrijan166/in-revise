---
id: cache-aside-vs-write-through
tech: system-design
title: Cache-Aside vs Write-Through
compares: [cache-aside, write-through]
gist:
  - "Fill the cache on read misses; a write deletes the key"
  - "Every write updates the cache and the database together"
diagrams:
  - |
    flowchart LR
      A[App] -- "1. miss" --> C[(Cache)]
      A -- "2. read" --> D[(Database)]
      A -- "3. fill" --> C
  - |
    flowchart LR
      A[App] -- write --> C[(Cache)]
      C -- "same write" --> D[(Database)]
diagramAlt: "Cache-aside: the app misses in the cache, reads the database, then fills the cache itself. Write-through: the app writes to the cache, and the same write goes on to the database."
rows:
  - { aspect: "Cache is filled", a: "On a read miss (lazy loading)", b: "On every write" }
  - { aspect: "On a write", a: "Update the database, then delete the key", b: "Update the database and the cache in the same operation" }
  - { aspect: "Read right after a write", a: "A miss, or briefly stale data", b: "The new value" }
  - { aspect: "Extra cost", a: "A miss costs 3 trips: cache, database, cache", b: "A write costs 2 writes: cache and database" }
  - { aspect: "What the cache holds", a: "Only data someone has read", b: "Much data that is never read; add a TTL" }
  - { aspect: "New, empty cache node", a: "Still works, just slower until it fills", b: "Data is missing until it is written again" }
verdict: "Default to cache-aside for read-heavy data; add write-through where a read must see the latest write. AWS suggests using both, with a TTL."
