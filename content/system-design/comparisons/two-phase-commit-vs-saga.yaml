---
id: two-phase-commit-vs-saga
tech: system-design
title: Two-Phase Commit vs Saga
compares: [two-phase-commit, saga]
gist:
  - "One atomic commit across nodes, run by a coordinator"
  - "A chain of local commits; failures undone by compensations"
explain:
  - "Two-phase commit (2PC) makes several databases commit as one atomic step: a coordinator asks all to prepare and lock, then tells all to commit or all to roll back. It solves cross-database atomicity, but it holds locks and blocks if the coordinator fails."
  - "A saga runs the action as a chain of local transactions, one per service. If a later step fails, it runs compensating actions to undo the committed steps. It solves consistency across services that each own a database, accepting eventual consistency."
example: "An order charges the card in the payment service and reserves stock in the stock service. With 2PC a coordinator prepares both and commits both atomically, holding locks meanwhile. With a saga the charge commits, then stock reservation fails, so the saga issues a refund (the charge's compensation) and cancels the order."
sayIt: "2PC gives atomic commit across a few databases but blocks and holds locks if the coordinator dies. A saga uses local commits with compensating actions and stays available, at the price of eventual consistency. Across microservices I use a saga; 2PC only for a few local databases."
diagrams:
  - |
    flowchart LR
      C[Coordinator] -- "1 prepare, 2 commit" --> A[(Orders DB)]
      C -- "1 prepare, 2 commit" --> B[(Payments DB)]
  - |
    flowchart LR
      T1[Step 1] --> T2[Step 2] --> T3[Step 3 fails]
      T3 -. undo .-> C2[Compensate 2] -.-> C1[Compensate 1]
diagramAlt: "Two-phase commit: a coordinator sends prepare and then commit to an orders database and a payments database. Saga: step 1, then step 2, then step 3 fails, so the saga runs the compensation for step 2 and then for step 1."
rows:
  - { aspect: "All or nothing?", a: "Yes: every participant commits, or none does", b: "No: each step commits; failures are undone afterwards" }
  - { aspect: "Others see half-done work?", a: "No: locks are held until the commit", b: "Yes: there is no isolation between steps" }
  - { aspect: "If the coordinator fails", a: "Prepared participants block, holding locks, until it recovers", b: "Saved saga state lets it resume or compensate later" }
  - { aspect: "Each participant needs", a: "Support for prepare (XA, PREPARE TRANSACTION)", b: "A compensating action for every step" }
  - { aspect: "Cost", a: "Extra round trips and held locks: more latency, less throughput", b: "No global locks, but data is only eventually consistent" }
  - { aspect: "Fits", a: "A few databases, short transactions", b: "Services that each own a database; long business flows" }
verdict: "Use 2PC only for a few databases that support it and short transactions; across microservices, use a saga with idempotent steps and compensations."
