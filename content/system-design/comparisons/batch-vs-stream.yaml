id: batch-vs-stream
tech: system-design
title: Batch vs Stream Processing
compares: [batch-processing, stream-processing]
gist:
  - "Collect a bounded dataset, then process it all at once"
  - "Process each event of an endless stream as it arrives"
diagrams:
  - |
    flowchart LR
      L[(Logs from yesterday)] --> J[Nightly job] --> R[Report]
  - |
    flowchart LR
      E[Events] --> P[Stream job with state] --> D[Live dashboard]
diagramAlt: "Batch: yesterday's logs go into a nightly job that writes a report. Stream: events flow continuously into a stream job that keeps state and updates a live dashboard."
rows:
  - { aspect: "Input", a: "Bounded: has a start and an end", b: "Unbounded: has a start, no end" }
  - { aspect: "When it runs", a: "On a schedule, then stops", b: "All the time" }
  - { aspect: "Freshness", a: "Only as fresh as the last run", b: "Seconds or less (Spark micro-batch: about 100 ms)" }
  - { aspect: "Hard parts", a: "Very large jobs; failed tasks must rerun", b: "State, late and out-of-order events, checkpoints" }
  - { aspect: "Fix a bug", a: "Rerun the job on the same input", b: "Replay the retained log through the fixed job" }
  - { aspect: "Tools", a: "MapReduce, Apache Spark", b: "Apache Flink, Kafka Streams, Spark Structured Streaming" }
verdict: "Use batch when results from the last run are fresh enough; it is simpler and cheaper. Use stream when the answer must be ready in seconds, like alerts, fraud checks or live counts."
