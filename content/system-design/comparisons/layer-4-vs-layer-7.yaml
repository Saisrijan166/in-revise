id: layer-4-vs-layer-7
tech: system-design
title: Layer 4 vs Layer 7 Load Balancing
compares: [layer-4-lb, layer-7-lb]
gist:
  - "Routes by IP and port; never reads the request"
  - "Reads HTTP; routes by path, host, header or cookie"
diagrams:
  - |
    flowchart LR
      C([Client]) -- "TCP to port 443" --> L4[Layer 4 LB]
      L4 -- "same flow" --> S1[Server]
  - |
    flowchart LR
      L7[Layer 7 LB] -- "/api" --> A[API servers]
      L7 -- "/images" --> I[Image servers]
diagramAlt: "Layer 4: a client opens a TCP connection to port 443, and the load balancer passes that whole flow to one server. Layer 7: the load balancer reads each HTTP request and sends /api to API servers and /images to image servers."
rows:
  - { aspect: "Decides using", a: "IP addresses, ports and protocol", b: "HTTP path, host, headers, method, query string" }
  - { aspect: "Traffic it handles", a: "Any TCP or UDP traffic, not only HTTP", b: "HTTP and HTTPS, including HTTP/2, gRPC and WebSockets" }
  - { aspect: "Connections", a: "Each TCP connection goes to one server for its life", b: "Ends the client connection, opens its own to the server" }
  - { aspect: "Client IP at the server", a: "Can keep the original source IP (AWS NLB)", b: "Passed in the X-Forwarded-For header (AWS ALB)" }
  - { aspect: "Cost per request", a: "Less work; AWS NLB handles millions of requests per second", b: "More work per request, but far more routing control" }
  - { aspect: "AWS product", a: "Network Load Balancer (NLB)", b: "Application Load Balancer (ALB)" }
verdict: "Default to Layer 7 for web apps and APIs that route by URL or header; pick Layer 4 for non-HTTP traffic, or when raw speed matters more than smart routing."
