---
id: lb-vs-proxy-vs-gateway
tech: system-design
title: Load Balancer vs Reverse Proxy vs API Gateway
compares: [load-balancer, reverse-proxy, api-gateway]
gist:
  - "Spreads requests over many copies of one service"
  - "One front door for servers: TLS, caching, hiding them"
  - "One front door for APIs: routing, auth, rate limits"
diagrams:
  - |
    flowchart LR
      LB[Load balancer] --> S1[Copy 1]
      LB --> S2[Copy 2]
      LB --> S3[Copy 3]
  - |
    flowchart LR
      C([Client]) -- HTTPS --> P[Reverse proxy]
      P --> A[App server]
  - |
    flowchart LR
      G[API gateway] -- "/users" --> U[Users service]
      G -- "/orders" --> O[Orders service]
diagramAlt: "Load balancer: spreads requests over three copies of the same app. Reverse proxy: a client connects over HTTPS to the proxy, which forwards to one app server. API gateway: sends /users to the users service and /orders to the orders service."
rows:
  - { aspect: "Main job", a: "Share load across copies of one service", b: "Front servers: TLS, caching, compression, hiding them", c: "Manage APIs: route, authenticate, rate-limit, log" }
  - { aspect: "Worth it with one server?", a: "No: it needs several servers to share load", b: "Yes: TLS, caching and security still help", c: "Rarely: it pays off with many services" }
  - { aspect: "Reads", a: "Layer 4 (IP, port) or layer 7 (HTTP)", b: "Mostly layer 7 (HTTP)", c: "Layer 7, plus API keys, tokens and quotas" }
  - { aspect: "Sends requests to", a: "Identical servers", b: "One or more backend servers", c: "Different services, chosen by path or header" }
  - { aspect: "Examples", a: "AWS ALB and NLB, HAProxy", b: "nginx, HAProxy", c: "Amazon API Gateway, Azure API Management" }
verdict: "Many copies of one service: load balancer. One public front door with TLS and caching: reverse proxy. Many APIs that need auth and limits: API gateway. nginx can play all three roles."
