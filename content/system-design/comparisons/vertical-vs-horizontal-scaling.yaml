---
id: vertical-vs-horizontal-scaling
tech: system-design
title: Vertical vs Horizontal Scaling
compares: [vertical-scaling, horizontal-scaling]
gist:
  - "One bigger machine: simple, but has a ceiling"
  - "More machines: scales further, needs a load balancer"
explain:
  - "Vertical scaling (scale up) means giving one machine more CPU, memory or disk. It solves the problem of a server running out of capacity, with no code change and no new moving parts, as long as the work still fits on one machine."
  - "Horizontal scaling (scale out) means adding more machines that share the work behind a load balancer. It solves the problem that one machine has a ceiling and is a single point of failure, by spreading load across many stateless servers."
example: "The payment API saturates one server during a sale. Scaling up to a bigger instance buys headroom with a restart and no code change, but the next bigger sale saturates it again and the machine is still a single point of failure. Scaling out, after moving sessions to Redis, runs several copies behind a load balancer, so you add machines per sale and survive one server failing."
diagrams:
  - |
    flowchart LR
      A["Server: 4 CPU"] -- resize --> B["Server: 16 CPU"]
  - |
    flowchart LR
      LB[Load balancer] --> S1[Server]
      LB --> S2[Server]
      LB --> S3[Server]
diagramAlt: "Vertical: one server is resized from 4 CPUs to 16 CPUs. Horizontal: a load balancer spreads requests over three servers."
rows:
  - { aspect: "What you add", a: "More CPU, memory or disk to one machine", b: "More machines that share the work" }
  - { aspect: "Ceiling", a: "The biggest machine available", b: "Much higher: keep adding machines" }
  - { aspect: "Downtime to grow", a: "Often a restart (resize or change instance type)", b: "Usually none: add machines while running" }
  - { aspect: "If one machine fails", a: "Everything on it stops", b: "Only part of the capacity is lost" }
  - { aspect: "App changes needed", a: "Usually none", b: "Stateless servers, shared session store, load balancer" }
  - { aspect: "Fits best", a: "Parts that are hard to split, like one database", b: "Stateless web and app servers" }
verdict: "Scale up for a quick win or a part that is hard to split; scale out when you need more than one machine can give or must survive a machine failure."
sayIt: "Scaling up gives one machine more power: simple, but it has a ceiling and stays a single point of failure. Scaling out adds stateless machines behind a load balancer: it goes further and survives failures, but adds coordination. I scale the web tier out and scale up parts hard to split."
