gist:
  - "The promise to customers, with a penalty if it is broken"
  - "The internal target the team steers by"
  - "The measured number: good events ÷ total events"
rows:
  - { aspect: "What it is", a: "A contract with users, with consequences", b: "A target value or range for an SLI", c: "A measurement of one aspect of the service" }
  - { aspect: "Example", a: "Amazon EC2: 99.99% monthly uptime per Region", b: "99.9% of requests succeed over 4 weeks", c: "Successful requests ÷ all requests" }
  - { aspect: "Set by", a: "Business and legal teams", b: "Product and engineering together", c: "Engineers define it; monitoring measures it" }
  - { aspect: "If missed", a: "Penalty: service credits or a refund", b: "Error budget spent: pause releases, fix reliability", c: "Nothing by itself: it is a reading, not a goal" }
  - { aspect: "Time window", a: "Often monthly, e.g. Amazon EC2", b: "A rolling window, e.g. 4 weeks", c: "Short periods, e.g. 1 or 5 minutes" }
  - { aspect: "How strict", a: "Looser than the internal SLO", b: "Tighter, so you react before the SLA breaks", c: "Not a goal: both targets are checked against it" }
verdict: "Measure an SLI users feel, steer engineering with an SLO on it, and promise customers a looser SLA."
