---
id: sla-vs-slo-vs-sli
tech: system-design
title: SLA vs SLO vs SLI
compares: [sla, slo, sli]
gist:
  - "The promise to customers, with a penalty if it is broken"
  - "The internal target the team steers by"
  - "The measured number: good events ÷ total events"
explain:
  - "An SLA is a contract you give customers, such as 99.99% monthly uptime. It states what you promise and the penalty, like service credits, if you miss it. It solves the problem of putting reliability in writing for the people who pay you."
  - "An SLO is the internal target your team steers by, such as 99.9% of requests succeeding over four weeks. It is set tighter than the SLA so you react before the contract is breached. It solves the problem of knowing when to stop shipping and fix reliability."
  - "An SLI is the actual measured number, such as successful requests ÷ all requests over the last five minutes. It is a reading, not a goal. It solves the problem of having real data to check both targets against."
example: "Payment API. SLI: monitoring reports 99.93% of requests succeeded this window. SLO: the team targets 99.9% over four weeks, so 99.93% is within target and releases continue. SLA: customers are promised 99.9% monthly; below that they get service credits. The SLO is tighter than the SLA so the team fixes issues before customers are owed credits."
rows:
  - { aspect: "What it is", a: "A contract with users, with consequences", b: "A target value or range for an SLI", c: "A measurement of one aspect of the service" }
  - { aspect: "Example", a: "Amazon EC2: 99.99% monthly uptime per Region", b: "99.9% of requests succeed over 4 weeks", c: "Successful requests ÷ all requests" }
  - { aspect: "Set by", a: "Business and legal teams", b: "Product and engineering together", c: "Engineers define it; monitoring measures it" }
  - { aspect: "If missed", a: "Penalty: service credits or a refund", b: "Error budget spent: pause releases, fix reliability", c: "Nothing by itself: it is a reading, not a goal" }
  - { aspect: "Time window", a: "Often monthly, e.g. Amazon EC2", b: "A rolling window, e.g. 4 weeks", c: "Short periods, e.g. 1 or 5 minutes" }
  - { aspect: "How strict", a: "Looser than the internal SLO", b: "Tighter, so you react before the SLA breaks", c: "Not a goal: both targets are checked against it" }
verdict: "Measure an SLI users feel, steer engineering with an SLO on it, and promise customers a looser SLA."
sayIt: "SLI is what I measure, like successful requests ÷ all requests. SLO is my internal target for it, such as 99.9% over four weeks. SLA is the customer contract with penalties, set looser than the SLO so I fix problems before I owe credits."
