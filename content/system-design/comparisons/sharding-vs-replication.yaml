---
id: sharding-vs-replication
tech: system-design
title: Sharding vs Replication
compares: [sharding, replication]
gist:
  - "Split the data: each node holds a different slice"
  - "Copy the data: each node holds the same data"
diagrams:
  - |
    flowchart LR
      R[Router] -- "users A-M" --> S1[(Shard 1)]
      R -- "users N-Z" --> S2[(Shard 2)]
  - |
    flowchart LR
      P[(Primary)] -- copies --> R1[(Replica 1)]
      P -- copies --> R2[(Replica 2)]
diagramAlt: "Sharding: a router sends users A to M to shard 1 and users N to Z to shard 2. Replication: a primary copies every write to two replicas."
rows:
  - { aspect: "Each node holds", a: "A different slice of the data", b: "A full copy of the same data" }
  - { aspect: "Main goal", a: "Scale writes and total storage", b: "Availability and more read capacity" }
  - { aspect: "Where writes go", a: "Spread across shards by the shard key", b: "To the primary (in leader-based setups)" }
  - { aspect: "If a node fails", a: "Its slice is offline, unless the shard is replicated", b: "A replica can take over (failover)" }
  - { aspect: "Hard part", a: "Choosing the shard key; cross-shard queries; resharding", b: "Replication lag and stale reads from async replicas" }
verdict: "Replicate first for availability and read load; shard when writes or data size outgrow one primary. Large systems do both: every shard is replicated."
