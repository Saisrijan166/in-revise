---
id: monolith-vs-microservices
tech: system-design
title: Monolith vs Microservices
compares: [monolith, microservices]
gist:
  - "One codebase, built and deployed as one unit"
  - "Small services, each deployed, scaled and run on its own"
explain:
  - "A monolith is one application: all the code is built, shipped and run together, usually against one shared database, and its parts call each other in-process. It is the simplest thing to build, deploy and debug when the system is small."
  - "Microservices split the application into small services, each around one business capability with its own process and database, deployed on its own. Separate teams ship and scale their service independently, at the cost of network calls between them."
example: "A shop runs orders, payments and search. As a monolith, a sale that floods search means running 10 copies of the whole app, payments code and all. As microservices, you run 10 search instances and one of everything else, but checkout now calls payments over the network and needs timeouts, retries and tracing."
diagrams:
  - |
    flowchart LR
      A["One app: orders + payments + search"] --> D[(One database)]
  - |
    flowchart LR
      G[API gateway] --> O[Orders] --> OD[(Orders DB)]
      G --> P[Payments] --> PD[(Payments DB)]
diagramAlt: "Monolith: one app holds orders, payments and search and uses one database. Microservices: an API gateway routes to an orders service with its own database and a payments service with its own database."
rows:
  - { aspect: "Deploy", a: "Any change means rebuilding and redeploying the whole app", b: "Each service is deployed and rolled back on its own" }
  - { aspect: "Scaling", a: "Scale the whole app, even the quiet parts", b: "Scale only the service that is busy" }
  - { aspect: "Calls between parts", a: "In-process function calls: fast and simple", b: "Network calls: slower, and they can time out or fail" }
  - { aspect: "Data", a: "Shared database; ACID transactions across modules", b: "Each service owns its data; sagas and eventual consistency" }
  - { aspect: "Teams", a: "Many teams share one codebase and release", b: "One small team owns each service end to end" }
  - { aspect: "Running it", a: "One app to deploy, monitor and debug", b: "Needs CI/CD, orchestration, tracing: the microservice premium" }
  - { aspect: "Fits best", a: "New products, small teams, unclear boundaries", b: "Large systems with many teams and clear domain boundaries" }
verdict: "Start with a well-modularised monolith; split out services when team size, release speed or uneven scaling needs are worth the extra operational cost."
sayIt: "A monolith is one deployable app on one database, simplest to start with. Microservices split it into independently deployable services that own their data, which helps when teams ship alone or parts scale differently. I go monolith-first and split later, since the operations cost is real."
