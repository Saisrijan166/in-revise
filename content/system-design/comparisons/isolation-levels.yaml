id: isolation-levels
tech: system-design
title: "Isolation Levels: Read Uncommitted to Serializable"
compares: [read-uncommitted, read-committed, repeatable-read, serializable]
gist:
  - "May read changes other transactions have not committed"
  - "Each statement sees only data committed before it began"
  - "The whole transaction reads one snapshot"
  - "Same result as running the transactions one at a time"
explain:
  - "Read Uncommitted is the weakest level: a transaction may read another's uncommitted changes (a dirty read). It is cheapest, but the data read may later be rolled back. PostgreSQL has no true dirty-read mode and runs this as Read Committed."
  - "Read Committed means each statement sees only data committed before that statement began, so no dirty reads, but a row can change between two reads in the same transaction. It is the common default and fits most work."
  - "Repeatable Read gives the whole transaction one consistent snapshot, so rows do not change under it. In PostgreSQL and MySQL InnoDB this is snapshot isolation, which still allows write skew."
  - "Serializable gives the result of running the transactions one at a time. It prevents every anomaly, but causes the most aborts (PostgreSQL) or lock waits (MySQL) and needs retry logic."
example: "Two sales each read stock = 10, then each set it to 9. At Read Committed this lost update is allowed, so stock ends at 9 after two sales. At Serializable one transaction is aborted with a serialization error and retried, so the final stock correctly reaches 8."
sayIt: "I keep the default (Read Committed in PostgreSQL, Repeatable Read in MySQL) for most work and make critical steps safe with an atomic UPDATE or SELECT FOR UPDATE. When a rule spans many rows and write skew is possible, I use Serializable and retry on serialization failures."
rows:
