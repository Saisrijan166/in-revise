---
id: tcp-vs-udp
tech: system-design
title: TCP vs UDP
compares: [tcp, udp]
gist:
  - "Connect first; every byte arrives, in order"
  - "No connection; each packet travels alone and may be lost"
explain:
  - "TCP opens a connection with a handshake, then gives the app a reliable, in-order stream of bytes. It resends anything lost and paces the sender, so data arrives complete; the cost is setup and head-of-line blocking."
  - "UDP sends independent datagrams with no handshake and no resending. The app gets each packet as it arrives, if it arrives, so it is light and fast but must handle any loss, reordering or pacing itself."
example: "A payment API runs over TCP: every byte of the request must arrive in order, so a lost packet is resent before the response is built. A live video call runs over UDP: a lost frame is dropped and the next one plays, because waiting for a resend would only freeze the picture."
sayIt: "TCP connects first and guarantees an in-order, complete byte stream, so I use it for APIs, payments and databases. UDP sends packets with no setup or resend, so I use it for live media, games and most DNS lookups, where a late packet is useless. QUIC gives reliable streams over UDP."
diagrams:
  - |
    sequenceDiagram
      Client->>Server: SYN
      Server->>Client: SYN-ACK
      Client->>Server: ACK, then data
      Server->>Client: ACK, lost data is resent
  - |
    sequenceDiagram
      Client->>Server: datagram 1
      Client-xServer: datagram 2 is lost
      Client->>Server: datagram 3
diagramAlt: "TCP: the client sends SYN, the server answers SYN-ACK, the client sends ACK and then data; the server acknowledges data and anything lost is sent again. UDP: the client sends datagrams 1, 2 and 3 with no setup; datagram 2 is lost and nobody resends it."
rows:
  - { aspect: "Setup", a: "Three-way handshake before any data", b: "None: the first datagram carries data" }
  - { aspect: "Delivery", a: "Lost data is resent; arrives complete and in order", b: "No resend; may be lost, reordered or duplicated" }
  - { aspect: "Speed control", a: "Flow control and congestion control slow the sender", b: "None built in: the app must pace itself" }
  - { aspect: "Data unit", a: "One byte stream with no message edges", b: "Separate messages (datagrams)" }
  - { aspect: "Header size", a: "20 bytes without options", b: "8 bytes" }
  - { aspect: "Used by", a: "HTTP/1.1, HTTP/2, database connections such as PostgreSQL", b: "Most DNS lookups, RTP voice and video, games, QUIC (HTTP/3)" }
verdict: "Default to TCP when every byte must arrive; choose UDP when fresh data beats complete data, or use QUIC to get reliable streams on UDP."
