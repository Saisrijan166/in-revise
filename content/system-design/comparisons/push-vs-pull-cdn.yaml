---
id: push-vs-pull-cdn
tech: system-design
title: Push CDN vs Pull CDN
compares: [push-cdn, pull-cdn]
gist:
  - "You upload files to the CDN yourself"
  - "The CDN fetches from your origin on the first miss"
explain:
  - "With a push CDN, you upload each file to the CDN's storage whenever it changes, and it stays there ready to serve. Even the very first request is fast, because the file is already on the CDN, but you manage the uploads and storage yourself."
  - "With a pull CDN, you do nothing up front: the edge fetches a file from your origin the first time a user asks for it, then caches it. The first request is slower (a miss), but only files users actually want end up cached."
example: "A large software installer that changes rarely fits a push CDN: upload it once and every download is fast, including the first. A busy news site fits a pull CDN: there is no upload step, and only the articles people are reading stay cached at the edge, while cold pages are fetched on demand."
sayIt: "A push CDN means I upload files to the CDN myself, so even the first request is fast; it suits large, rarely changing files. A pull CDN fetches from my origin on the first miss and caches only what users ask for; it suits heavy traffic. I default to pull because there is no upload step."
diagrams:
  - |
    flowchart LR
      D([You]) -- "upload when changed" --> S[(CDN storage)]
      S --> U([Users])
  - |
    flowchart LR
      U([User]) --> E[Edge]
      E -- "first miss only" --> O[(Origin)]
diagramAlt: "Push CDN: you upload files to the CDN's storage whenever they change, and users get them from there. Pull CDN: a user asks the edge; only on the first miss does the edge fetch the file from your origin, then it serves the cached copy."
rows:
  - { aspect: "Who moves the file", a: "You, when it is new or changed", b: "The CDN, when a user asks and it is not cached" }
  - { aspect: "First request", a: "Fast: the file is already on the CDN", b: "Slower: the miss goes to the origin" }
  - { aspect: "CDN storage", a: "Every file you upload stays stored", b: "Only recently requested files stay cached" }
  - { aspect: "Origin traffic", a: "Low: each file is uploaded once", b: "Re-fetches after the TTL ends, even if unchanged" }
  - { aspect: "Fits", a: "Large files that rarely change; low-traffic sites", b: "Sites with heavy traffic: only hot files stay cached" }
  - { aspect: "Example", a: "KeyCDN Push Zone (upload by FTP or rsync)", b: "CloudFront, Cloudflare, KeyCDN Pull Zone" }
verdict: "Default to pull: there is no upload step, and the CDN keeps only what users ask for. Push suits large, rarely changing files, or when even the first request must be fast."
