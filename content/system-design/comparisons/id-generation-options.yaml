---
id: id-generation-options
tech: system-design
title: UUID vs Snowflake ID vs Auto-Increment
compares: [uuid, snowflake-id, db-auto-increment]
gist:
  - "128 bits, made anywhere with no coordination"
  - "64 bits: time + machine id + sequence; roughly time-sorted"
  - "1, 2, 3 from one database: simple, but central"
explain:
  - "A UUID is a 128-bit identifier any server can create with no coordination. Version 4 is fully random; version 7 puts a millisecond timestamp first so the IDs sort by time. It solves the need for globally unique IDs without a central counter."
  - "A Snowflake ID packs a timestamp, a machine id and a per-millisecond sequence into 64 bits. Each generator makes IDs locally and they sort roughly by time. It solves the need for compact, time-ordered, uncoordinated IDs at a high rate."
  - "Auto-increment asks one database for the next number on insert. It is small and strictly ordered, but every server shares that one counter, which is central and reveals how many rows exist. It fits a single database."
example: "A single-database payment app uses auto-increment ids: 1, 2, 3. When it shards payments across many servers, a shared counter becomes a bottleneck, so it switches to Snowflake ids (compact 64-bit, time-sorted) or UUID v7 so each server mints ids locally while inserts stay close together in the index."
sayIt: "Auto-increment suits one database but needs a central counter. UUID v7 lets any server make a time-ordered 128-bit id with no coordination. Snowflake gives compact 64-bit, roughly time-sorted ids at a high rate. I use auto-increment for one DB, and UUID v7 or Snowflake once many servers create ids."
diagrams:
  - |
    flowchart LR
      V["v7: 48-bit ms time"] --- R["version, variant and 74 random bits"]
  - |
    flowchart LR
      T["41 bits: ms since epoch"] --- M["10 bits: machine id"] --- S["12 bits: sequence"]
  - |
    flowchart LR
      A[App server 1] --> DB[(Database counter)]
      B[App server 2] --> DB
diagramAlt: "UUID v7: a 48-bit millisecond timestamp followed by version and variant bits and 74 random bits. Snowflake: 41 bits of milliseconds since a custom epoch, 10 bits of machine id, 12 bits of sequence. Auto-increment: every app server asks one database counter for the next number."
rows:
  - { aspect: "Size", a: "128 bits (36 characters as text)", b: "64 bits: fits a BIGINT", c: "An integer column; pick a type big enough (MySQL)" }
  - { aspect: "Who makes it", a: "Any server, no coordination", b: "Each generator, with a unique machine id", c: "The database, on insert" }
  - { aspect: "Sorts by time", a: "v7 yes (time first); v4 no", b: "Roughly (k-sorted)", c: "In the order the counter hands them out" }
  - { aspect: "Index inserts", a: "v7 close together; v4 at random places", b: "Mostly close together: IDs grow over time", c: "Close together: always the next number" }
  - { aspect: "Weak spot", a: "Large; v4 has poor index locality", b: "Needs machine ids; a clock going back stalls it", c: "One central counter to keep alive; IDs are guessable" }
  - { aspect: "Seen in", a: "Python 3.14 uuid7(), PostgreSQL 18 uuidv7()", b: "Twitter (2010), Discord", c: "MySQL AUTO_INCREMENT, Flickr ticket servers" }
verdict: "Auto-increment for one database; UUID v7 when any server must make IDs; Snowflake when you need compact 64-bit, time-sorted IDs at a high rate."
