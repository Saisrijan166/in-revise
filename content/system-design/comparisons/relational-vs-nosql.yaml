  - { aspect: "Schema", a: "Predefined, checked when you write", b: "Flexible, often read as-is (schema-on-read)" }
  - { aspect: "Queries", a: "SQL, with joins across tables", b: "Mostly by key or one access pattern; few joins" }
  - { aspect: "Transactions", a: "ACID across many rows and tables", b: "Atomic per item; some support multi-item transactions" }
