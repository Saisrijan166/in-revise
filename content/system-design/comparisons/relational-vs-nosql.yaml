---
id: relational-vs-nosql
tech: system-design
title: Relational (SQL) vs NoSQL
compares: [relational, nosql]
gist:
  - "Related tables, predefined schema, joins, ACID"
  - "Data shaped for one access pattern, built to scale out"
explain:
  - "A relational (SQL) database stores data in tables of rows and columns with a fixed schema, links tables by keys, and reads them back with joins and multi-row ACID transactions. It fits related data queried many ways."
  - "NoSQL is a family of stores (document, key-value, wide-column, graph), each shaped for one access pattern and built to spread across many machines. It fits one dominant read pattern at very large scale, or data whose shape keeps changing."
example: "A user and their orders. SQL keeps a users table and an orders table and joins them to list a user's orders. A document store embeds the orders inside the user document, so one read by user id returns the user and the orders with no join, as long as the order list stays small."
sayIt: "SQL stores related tables with a fixed schema, joins and ACID transactions, so I default to it for orders and payments. NoSQL shapes data for one access pattern and scales out, so I choose it when one read pattern dominates at huge scale or the schema keeps changing."
diagrams:
