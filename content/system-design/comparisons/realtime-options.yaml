id: realtime-options
tech: system-design
title: Short Polling vs Long Polling vs SSE vs WebSockets
compares: [short-polling, long-polling, sse, websockets]
gist:
  - "Ask again on a timer; most answers are empty"
  - "Ask once; the server answers when there is news"
  - "One open response; the server streams events"
  - "One open connection; both sides send any time"
diagrams:
  - |
    sequenceDiagram
      Client->>Server: any news?
      Server-->>Client: no
      Client->>Server: any news?
      Server-->>Client: yes, 1 update
  - |
    sequenceDiagram
      Client->>Server: any news?
      Note over Server: holds the request
      Server-->>Client: yes, 1 update
      Client->>Server: any news?
  - |
    sequenceDiagram
      Client->>Server: GET /events
      Server-->>Client: event 1
      Server-->>Client: event 2
  - |
    sequenceDiagram
      Client->>Server: HTTP Upgrade
      Server-->>Client: 101 Switching Protocols
      Client->>Server: message
      Server-->>Client: message
diagramAlt: "Short polling: the client asks 'any news?' again and again; the server says no until it has an update. Long polling: the client asks once, the server holds the request until there is an update, answers, and the client asks again. SSE: the client opens GET /events and the server sends event after event on that one response. WebSockets: the client sends an HTTP Upgrade, the server replies 101 Switching Protocols, then both send messages."
rows:
  - { aspect: "Who sends", a: "Client pulls", b: "Client pulls; server answers when ready", c: "Server to client only", d: "Both ways, any time" }
  - { aspect: "Delay for an update", a: "Up to one poll interval", b: "Low; a new request after each answer", c: "Low: events stream as they happen", d: "Low: messages flow as they happen" }
  - { aspect: "Connection", a: "A new request each time", b: "One held request at a time", c: "One long-lived HTTP response", d: "One long-lived TCP connection after an HTTP Upgrade" }
  - { aspect: "Data", a: "Any HTTP response", b: "Any HTTP response", c: "UTF-8 text events only", d: "Text or binary frames" }
  - { aspect: "If the connection drops", a: "Next poll just works", b: "Client sends a new request", c: "Browser reconnects and sends Last-Event-ID", d: "Your code reconnects, with backoff" }
  - { aspect: "Fits", a: "Rare updates, such as a job status", b: "Fallback when WebSockets are blocked", c: "Feeds, status updates, notifications, live prices", d: "Chat (instant messaging) and online games" }
verdict: "Use SSE when only the server pushes, WebSockets when clients also send often, long polling as a fallback, and short polling only for rare updates."
