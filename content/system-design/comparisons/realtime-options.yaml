id: realtime-options
tech: system-design
title: Short Polling vs Long Polling vs SSE vs WebSockets
compares: [short-polling, long-polling, sse, websockets]
gist:
  - "Ask again on a timer; most answers are empty"
  - "Ask once; the server answers when there is news"
  - "One open response; the server streams events"
  - "One open connection; both sides send any time"
explain:
  - "Short polling: the client re-sends a normal request on a fixed timer and the server answers at once, usually with nothing new. It is the simplest to build and works everywhere, but wastes requests and shows updates up to one interval late."
  - "Long polling: the client sends a request and the server holds it open until it has news or hits a timeout, then answers; the client immediately asks again. Updates arrive sooner than short polling, and it works even where WebSockets are blocked."
  - "SSE: the client opens one HTTP request and the server keeps the response open, streaming text events one way; the browser reconnects on its own and resends Last-Event-ID. It fits server-to-client feeds over plain HTTP."
  - "WebSockets: after an HTTP Upgrade handshake, one TCP connection carries two-way messages that either side can send at any time. It fits chat and games, where the client sends often too, at the cost of a stateful connection and extra proxy setup."
example: "A live match page. With SSE the server streams each score change down one open response and the browser shows it instantly; the client never needs to send anything back. For an in-match chat beside the scores, where viewers also type messages, you add a WebSocket so both sides can send. Short polling would refresh the score every few seconds, usually fetching no change."
sayIt: "For server-only updates such as feeds, notifications or live scores I use SSE: plain HTTP, auto-reconnect, one way. For chat or games, where the client also sends often, I use WebSockets. Long polling is my fallback when WebSockets are blocked, and short polling only for rare updates."
diagrams:
  - |
    sequenceDiagram
      Client->>Server: any news?
      Server-->>Client: no
      Client->>Server: any news?
      Server-->>Client: yes, 1 update
  - |
    sequenceDiagram
      Client->>Server: any news?
      Note over Server: holds the request
      Server-->>Client: yes, 1 update
      Client->>Server: any news?
  - |
    sequenceDiagram
      Client->>Server: GET /events
      Server-->>Client: event 1
      Server-->>Client: event 2
  - |
    sequenceDiagram
      Client->>Server: HTTP Upgrade
      Server-->>Client: 101 Switching Protocols
      Client->>Server: message
      Server-->>Client: message
diagramAlt: "Short polling: the client asks 'any news?' again and again; the server says no until it has an update. Long polling: the client asks once, the server holds the request until there is an update, answers, and the client asks again. SSE: the client opens GET /events and the server sends event after event on that one response. WebSockets: the client sends an HTTP Upgrade, the server replies 101 Switching Protocols, then both send messages."
