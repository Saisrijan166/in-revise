---
id: normalisation-vs-denormalisation
tech: system-design
title: Normalisation vs Denormalisation
compares: [normalisation, denormalisation]
gist:
  - "Store each fact once; join tables when you read"
  - "Copy data to where it is read; fewer joins, harder writes"
diagrams:
  - |
    flowchart LR
      O[orders] -- customer_id --> C[customers]
  - |
    flowchart LR
      O["orders, with a copy of customer_name"]
diagramAlt: "Normalised: the orders table points to the customers table by customer_id, and a read joins them. Denormalised: the orders table keeps its own copy of the customer name, so no join is needed."
rows:
  - { aspect: "Each fact is stored", a: "Once", b: "In several places, on purpose" }
  - { aspect: "Reads", a: "Join tables (or a second read in a document store)", b: "Fewer joins; often one read" }
  - { aspect: "Writes", a: "One row to update", b: "Every copy must be updated" }
  - { aspect: "Risk", a: "Slow reads if many large tables must be joined", b: "Copies drift apart: an update anomaly" }
  - { aspect: "Fits", a: "Data that changes often; write-heavy work", b: "Read-heavy paths over data that rarely changes" }
verdict: "Start normalised; denormalise a hot read path only when joins are measured to be too slow and the copied data rarely changes."
