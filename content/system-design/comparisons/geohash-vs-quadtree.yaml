      W --> Q3["SW: a leaf"]
      W --> Q4["SE: a leaf"]
      Q2 --> Q5["4 smaller squares"]
diagramAlt: "Geohash: each extra character narrows the cell around central Bengaluru, from t (about 5,000 km wide) to tdr (156 km), tdr1v (4.9 km) and tdr1v9q (153 m); sizes are for the equator. Quadtree: a city square with too many points splits into four quadrants; the busy north-east quadrant splits again into four smaller squares, while the quiet quadrants stay leaves."
rows:
  - { aspect: "Cell size", a: "Fixed by length: 6 characters is about 1.2 km by 0.6 km", b: "Varies: small where points are dense, large where sparse" }
  - { aspect: "Stored as", a: "A plain key in any B-tree or a Redis sorted set", b: "A tree of nodes, usually in memory (or PostgreSQL SP-GiST)" }
  - { aspect: "Busy areas", a: "Same cell size, so a busy cell holds many points", b: "Split deeper until each leaf holds few points" }
  - { aspect: "Moving points", a: "An update changes one key", b: "An update may split or merge nodes" }
  - { aspect: "Near an edge", a: "Search the cell and its 8 neighbours", b: "Search every node that overlaps the search area" }
  - { aspect: "Seen in", a: "Redis GEO, MongoDB 2d index", b: "PostgreSQL SP-GiST quad_point_ops" }
verdict: "Use geohash to store locations in an existing database or Redis, especially points that move; use a quadtree when density is very uneven and the tree fits in memory."
sayIt: "A geohash encodes a point into one string key on a fixed grid, so it stores in any database or Redis and a moving point is a one-key update. A quadtree splits busy areas into smaller cells but usually lives in memory. I use geohash by default, a quadtree when density is very uneven."
