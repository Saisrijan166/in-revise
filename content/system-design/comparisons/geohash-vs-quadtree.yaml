---
id: geohash-vs-quadtree
tech: system-design
title: Geohash vs Quadtree
compares: [geohash, quadtree]
gist:
  - "Fixed grid: every cell has a string id; longer id, smaller cell"
  - "Adaptive tree: a square splits into 4 when it holds too many points"
explain:
  - "A geohash encodes a point's latitude and longitude into one short string. The grid is fixed: every cell has an id, and a longer id names a smaller cell. It solves storing and searching locations as plain keys in any database or Redis."
  - "A quadtree stores points in a square that splits into four smaller squares whenever it holds too many. It adapts to density, giving small cells where points are packed and large cells where they are sparse."
example: "Index drivers across a city. A geohash gives each driver a string key, so a crowded area and an empty one both use the same cell size and crowded cells hold many drivers. A quadtree keeps splitting the crowded downtown square into smaller squares until each holds only a few drivers, while the quiet outskirts stay one big square."
diagrams:
