name: System Design
slug: system-design
accent: blue
summary: "How to design systems that scale, stay available, and stay correct."

# The whole tech as one story: problem → fix. Every concept sits on at least one step.
storySpine:
  - step: "One server is simple, but it runs out of room as users grow → scale up, then scale out"
    cards: [scalability]
  - step: "You cannot plan what you have not measured → know your latency, throughput and rough numbers"
    cards: [latency-and-throughput, capacity-estimation]
  - step: "Machines must send data to each other → pick TCP for reliability or UDP for speed"
    cards: [transport-protocols]
  - step: "Users need to reach your servers by name → DNS turns names into addresses"
    cards: [dns]
  - step: "Users far away wait for every byte → serve static files from a CDN close to them"
    cards: [cdn]
  - step: "Many servers need one front door → put a load balancer, reverse proxy or API gateway in front"
    cards: [load-balancer, reverse-proxy, api-gateway]
  - step: "A few clients send far too many requests → rate-limit them"
    cards: [rate-limiting]
  - step: "Clients want updates the moment they happen → use polling, server-sent events or WebSockets"
    cards: [realtime-communication]
  - step: "Services must agree on how to talk → choose an API style and make retries safe"
    cards: [api-styles, idempotency]
  - step: "One codebase grows too big for one team → split it into services that can find each other"
    cards: [microservices, service-discovery]
  - step: "The database answers the same reads again and again → cache the hot data"
    cards: [caching-layers, cache-aside, write-through, eviction, cache-invalidation]
  - step: "Different data has different shapes → choose SQL or NoSQL, model it, keep big files apart"
    cards: [sql-vs-nosql, denormalisation, object-storage]
  - step: "Money and stock counts must never go wrong → use transactions and the right locking"
    cards: [acid-transactions, concurrency-control]
  - step: "Queries slow down as data grows → add the right index"
    cards: [indexing, search-index, geospatial-index, bloom-filter]
  - step: "One database is too small or too fragile → replicate for copies, shard for size"
    cards: [sharding-and-replication, consistent-hashing]
  - step: "Slow work blocks fast requests → hand it to a queue or a stream"
    cards: [message-queue, pub-sub, event-streaming, delivery-guarantees, batch-and-stream, event-sourcing-cqrs]
  - step: "At scale, parts fail every day → add redundancy, timeouts, circuit breakers and backups"
    cards: [redundancy-failover, timeouts-retries, circuit-breaker, load-shedding, disaster-recovery]
  - step: "Copies on many machines can disagree → decide what to give up and how nodes agree"
    cards: [cap-theorem, consistency-models, quorum, consensus]
  - step: "One action spans many services → coordinate it and give everything a unique ID"
    cards: [distributed-transactions, unique-ids]
  - step: "You cannot fix what you cannot see → measure with logs, metrics and traces against an SLO"
    cards: [observability, availability]

topics:
  - { id: foundations, title: "Foundations", order: 1, blurb: "The words and numbers every design starts from." }
  - { id: traffic, title: "Traffic & networking", order: 2, blurb: "How requests reach your servers, and how fast." }
  - { id: apis, title: "APIs & services", order: 3, blurb: "How services talk, and stay safe to call." }
  - { id: caching, title: "Caching", order: 4, blurb: "Serve hot data from memory." }
  - { id: databases, title: "Databases & storage", order: 5, blurb: "Pick, model, index, copy and split your data." }
  - { id: messaging, title: "Messaging & streams", order: 6, blurb: "Do slow work later, and move events between services." }
  - { id: reliability, title: "Reliability", order: 7, blurb: "Keep working when parts fail." }
  - { id: distributed-systems, title: "Distributed systems", order: 8, blurb: "Trade-offs when data lives on many machines." }
