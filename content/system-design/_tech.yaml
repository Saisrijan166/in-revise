name: System Design
slug: system-design
accent: blue
summary: "How to design systems that scale, stay available, and stay correct."

# The whole tech as one story: problem → fix. Each card sits on at least one step.
# Steps without cards are still part of the story; their cards come in Phase 3.
storySpine:
  - step: "One server is simple, but it runs out of room as users grow → scale up, then scale out"
    cards: [scalability]
  - step: "Many servers need one front door that shares the traffic → put a load balancer in front"
    cards: [load-balancer]
  - step: "The database answers the same reads again and again → cache the hot data"
    cards: [cache-aside]
  - step: "Different data has different shapes and access patterns → choose SQL or NoSQL on purpose"
    cards: [sql-vs-nosql]
  - step: "One database is too small or too fragile → replicate for copies, shard for size"
    cards: [sharding-and-replication]
  - step: "Copies on many machines can disagree when the network splits → decide what to give up (CAP)"
    cards: [cap-theorem]
  - step: "Users far away wait for every byte → serve static files from a CDN close to them"
  - step: "Slow work blocks fast requests → hand it to a message queue and process it later"
  - step: "At scale, parts fail every day → add redundancy, timeouts, retries, and failover"
  - step: "You cannot fix what you cannot see → measure with metrics, logs, and traces"

topics:
  - { id: scalability, title: "Scalability", order: 1, blurb: "Grow capacity and share traffic." }
  - { id: caching, title: "Caching", order: 2, blurb: "Serve hot data from memory." }
  - { id: databases, title: "Databases", order: 3, blurb: "Pick, copy, and split your data store." }
  - { id: distributed-systems, title: "Distributed systems", order: 4, blurb: "Trade-offs when data lives on many machines." }
