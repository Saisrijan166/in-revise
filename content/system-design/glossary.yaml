# Interviewer terms, one line each. `aka` = other words that link to the same term.
# `see` = the concept that explains it fully (optional). The first mention in a concept links automatically;
# when two terms match at the same place, the longer match wins.
terms:
  - id: latency
    term: "Latency"
    definition: "How long one request takes to get its response, usually measured in milliseconds."
    see: latency-and-throughput
    source: { title: "Service Level Objectives (Google SRE Book)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-15" }

  - id: throughput
    term: "Throughput"
    definition: "How much work a system finishes per unit of time, often requests per second."
    see: latency-and-throughput
    source: { title: "Service Level Objectives (Google SRE Book)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-15" }

  - id: availability
    term: "Availability (nines)"
    aka: [ "nines" ]
    definition: "Share of time a service is usable. 99.9% allows about 8.8 hours of downtime a year; 99.99% about 53 minutes."
    see: availability
    source: { title: "Availability Table (Google SRE Book, Appendix A)", url: "https://sre.google/sre-book/availability-table/", verifiedOn: "2026-10-15" }

  - id: single-point-of-failure
    term: "Single point of failure"
    aka: [ "SPOF" ]
    definition: "One part whose failure stops the whole system. Remove it with redundancy."
    see: redundancy-failover
    source: { title: "Redundancy, replication, and backup (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-redundancy-replication-backup", verifiedOn: "2026-10-15" }

  - id: vertical-scaling
    term: "Vertical scaling"
    aka: [ "scale up", "scaling up" ]
    definition: "Adding more CPU, memory, or disk to one existing machine."
    see: scalability
    source: { title: "Architecture strategies for optimizing scaling and partitioning (Azure Well-Architected)", url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/scale-partition", verifiedOn: "2026-10-15" }

  - id: horizontal-scaling
    term: "Horizontal scaling"
    aka: [ "scale out", "scaling out" ]
    definition: "Adding more machines (instances) and sharing the work between them."
    see: scalability
    source: { title: "Architecture strategies for optimizing scaling and partitioning (Azure Well-Architected)", url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/scale-partition", verifiedOn: "2026-10-15" }

  - id: stateless
    term: "Stateless server"
    aka: [ "stateless" ]
    definition: "A server that keeps no session data between requests, so any copy can handle any request."
    see: scalability
    source: { title: "REL05-BP06 Make systems stateless where possible (AWS Well-Architected)", url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_stateless.html", verifiedOn: "2026-10-15" }

  - id: sticky-session
    term: "Sticky session"
    aka: [ "sticky sessions", "session affinity" ]
    definition: "The load balancer keeps sending one client to the same server, often using a cookie."
    see: load-balancer
    source: { title: "Edit target group attributes for your Application Load Balancer (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html", verifiedOn: "2026-10-15" }

  - id: health-check
    term: "Health check"
    definition: "A regular probe a load balancer sends to each server; servers that fail stop getting traffic."
    see: load-balancer
    source: { title: "Health checks for Application Load Balancer target groups (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html", verifiedOn: "2026-10-15" }

  - id: ttl
    term: "TTL"
    aka: [ "time to live" ]
    definition: "A timeout on a cached key; when it runs out, the key is deleted automatically."
    see: cache-invalidation
    source: { title: "EXPIRE (Redis docs)", url: "https://redis.io/docs/latest/commands/expire/", verifiedOn: "2026-10-15" }

  - id: eviction
    term: "Eviction"
    aka: [ "evicts", "evicted" ]
    definition: "Removing keys from a full cache to make room, chosen by a policy such as LRU or LFU."
    see: eviction
    source: { title: "Key eviction (Redis docs)", url: "https://redis.io/docs/latest/develop/reference/eviction/", verifiedOn: "2026-10-15" }

  - id: thundering-herd
    term: "Thundering herd"
    aka: [ "cache stampede" ]
    definition: "Many requests miss the cache for the same hot key at once, often right after it expires or is invalidated, and all hit the database."
    see: cache-invalidation
    source: { title: "Scaling Memcache at Facebook (Nishtala et al., NSDI 2013)", url: "https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf", verifiedOn: "2026-10-15" }

  - id: linearizability
    term: "Linearizability"
    aka: [ "linearizable" ]
    definition: "Every operation seems to happen at one instant, in real-time order, as if there were one copy of the data."
    see: consistency-models
    source: { title: "Linearizability (Jepsen consistency models)", url: "https://jepsen.io/consistency/models/linearizable", verifiedOn: "2026-10-15" }

  - id: eventual-consistency
    term: "Eventual consistency"
    aka: [ "eventually consistent" ]
    definition: "If no new writes happen, all copies eventually return the same, latest value."
    see: consistency-models
    source: { title: "Eventually Consistent - Revisited (Werner Vogels, 2008)", url: "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html", verifiedOn: "2026-10-15" }

  - id: network-partition
    term: "Network partition"
    aka: [ "network partitions" ]
    definition: "A network failure that splits nodes into groups that cannot reach each other."
    see: cap-theorem
    source: { title: "Brewer's Conjecture and the Feasibility of Consistent, Available, Partition-Tolerant Web Services (Gilbert & Lynch, 2002)", url: "https://www.comp.nus.edu.sg/~gilbert/pubs/BrewersConjecture-SigAct.pdf", verifiedOn: "2026-10-15" }

  - id: acid
    term: "ACID"
    definition: "Atomicity, Consistency, Isolation, Durability: the guarantees of a database transaction."
    see: acid-transactions
    source: { title: "Glossary (PostgreSQL documentation)", url: "https://www.postgresql.org/docs/current/glossary.html", verifiedOn: "2026-10-15" }

  - id: replication
    term: "Replication"
    definition: "Keeping copies of the same data on several nodes, for availability and more read capacity."
    see: sharding-and-replication
    source: { title: "Replication (MongoDB Manual)", url: "https://www.mongodb.com/docs/manual/replication/", verifiedOn: "2026-10-15" }

  - id: sharding
    term: "Sharding"
    aka: [ "horizontal partitioning" ]
    definition: "Splitting rows across several nodes, so each node (shard) holds a different slice of the data."
    see: sharding-and-replication
    source: { title: "Sharding pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding", verifiedOn: "2026-10-15" }

  - id: shard-key
    term: "Shard key"
    definition: "The field that decides which shard stores a row, for example user_id."
    see: sharding-and-replication
    source: { title: "Data partitioning recommendations for reliability (Azure Well-Architected)", url: "https://learn.microsoft.com/en-us/azure/well-architected/design-guides/partition-data", verifiedOn: "2026-10-15" }

  - id: consistent-hashing
    term: "Consistent hashing"
    definition: "A way to map keys to nodes so that adding or removing a node moves only a small share of keys."
    see: consistent-hashing
    source: { title: "Consistent Hashing and Random Trees (Karger et al., STOC 1997)", url: "https://doi.org/10.1145/258533.258660", verifiedOn: "2026-10-15" }

  - id: latency-percentiles
    term: "Percentile (p50, p95, p99)"
    aka: [ "percentile", "p50", "p95", "p99", "p99.9" ]
    definition: "The value that a given share of measurements stays within: a p99 of 200 ms means 99% of requests took 200 ms or less."
    see: latency-and-throughput
    source: { title: "Service Level Objectives (Google SRE Book, chapter 4)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-16" }

  - id: tail-latency
    term: "Tail latency"
    aka: [ "latency tail" ]
    definition: "The latency of the slowest requests, such as the p99 or p99.9. At scale, rare slowdowns on many servers make it worse."
    see: latency-and-throughput
    source: { title: "The Tail at Scale (Jeffrey Dean and Luiz André Barroso, CACM 2013)", url: "https://www.barroso.org/publications/TheTailAtScale.pdf", verifiedOn: "2026-10-16" }

  - id: fan-out
    term: "Fan-out"
    aka: [ "fan out", "fans out", "fanout" ]
    definition: "Sending one thing to many: one request calling many servers at once (it waits for the slowest), or one message copied to many subscribers."
    source: { title: "The Tail at Scale (Jeffrey Dean and Luiz André Barroso, CACM 2013)", url: "https://www.barroso.org/publications/TheTailAtScale.pdf", verifiedOn: "2026-10-16" }

  - id: hedged-requests
    term: "Hedged request"
    definition: "Send a request to one replica, and if it is slow, send a copy to another after a short delay; use whichever reply comes first."
    see: latency-and-throughput
    source: { title: "The Tail at Scale (Jeffrey Dean and Luiz André Barroso, CACM 2013)", url: "https://www.barroso.org/publications/TheTailAtScale.pdf", verifiedOn: "2026-10-16" }

  - id: littles-law
    term: "Little's law"
    definition: "Average number of items in a system = arrival rate × average time each item spends there (L = λW)."
    see: latency-and-throughput
    source: { title: "Little's Law as Viewed on Its 50th Anniversary (John D. C. Little, 2011; reprint)", url: "https://projectproduction.org/journal/reprint-littles-law-as-viewed-on-its-50th-anniversary/", verifiedOn: "2026-10-16" }

  - id: sli
    term: "SLI"
    aka: [ "service level indicator", "service-level indicator" ]
    definition: "Service level indicator: a measured number about a service, such as the share of requests that succeed."
    see: availability
    source: { title: "Service Level Objectives (Google SRE Book, chapter 4)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-16" }

  - id: slo
    term: "SLO"
    aka: [ "service level objective", "service-level objective" ]
    definition: "Service level objective: a target value for an SLI, such as 99.9% of requests succeed over four weeks."
    see: availability
    source: { title: "Service Level Objectives (Google SRE Book, chapter 4)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-16" }

  - id: sla
    term: "SLA"
    aka: [ "service level agreement", "service-level agreement" ]
    definition: "Service level agreement: a contract with users that says what happens, often service credits, if the promised SLOs are missed."
    see: availability
    source: { title: "Service Level Objectives (Google SRE Book, chapter 4)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-16" }

  - id: error-budget
    term: "Error budget"
    definition: "1 minus the SLO: the share of failures allowed in the window. While some is left, the team may ship changes."
    see: availability
    source: { title: "Example Error Budget Policy (Google SRE Workbook)", url: "https://sre.google/workbook/error-budget-policy/", verifiedOn: "2026-10-16" }

  - id: mtbf
    term: "MTBF"
    aka: [ "mean time between failures", "mean time between failure" ]
    definition: "Mean time between failures: how long a part usually runs before it fails."
    see: availability
    source: { title: "Availability (AWS Well-Architected Reliability Pillar)", url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html", verifiedOn: "2026-10-16" }

  - id: mttr
    term: "MTTR"
    aka: [ "mean time to recover", "mean time to recovery" ]
    definition: "Mean time to recover: how long it usually takes to restore a part after a failure is detected."
    see: availability
    source: { title: "Architecture strategies for defining reliability targets (Azure Well-Architected Framework)", url: "https://learn.microsoft.com/en-us/azure/well-architected/reliability/metrics", verifiedOn: "2026-10-16" }

  - id: qps
    term: "QPS"
    aka: [ "queries per second", "requests per second", "RPS" ]
    definition: "Queries (requests) per second: the usual unit for how much load a service handles."
    see: capacity-estimation
    source: { title: "Service Level Objectives (Google SRE Book, chapter 4)", url: "https://sre.google/sre-book/service-level-objectives/", verifiedOn: "2026-10-16" }

  - id: peak-qps
    term: "Peak QPS"
    definition: "The highest requests per second you plan for, often the average times a stated peak factor such as 2."
    see: capacity-estimation
    source: { title: "Back-of-the-envelope Estimation (ByteByteGo, System Design Interview)", url: "https://bytebytego.com/courses/system-design-interview/back-of-the-envelope-estimation", verifiedOn: "2026-10-16" }

  - id: dau
    term: "DAU"
    aka: [ "daily active users" ]
    definition: "Daily active users: how many distinct users use the product in a day; the usual starting point of a load estimate."
    see: capacity-estimation
    source: { title: "Back-of-the-envelope Estimation (ByteByteGo, System Design Interview)", url: "https://bytebytego.com/courses/system-design-interview/back-of-the-envelope-estimation", verifiedOn: "2026-10-16" }

  - id: capacity-estimation
    term: "Back-of-the-envelope estimate"
    aka: [ "back-of-the-envelope", "napkin math", "capacity estimation" ]
    definition: "A quick estimate with round numbers of load, storage or time, used to judge a design without building it."
    see: capacity-estimation
    source: { title: "Designs, Lessons and Advice from Building Large Distributed Systems (Jeff Dean, LADIS 2009)", url: "https://www.cs.cornell.edu/projects/ladis2009/talks/dean-keynote-ladis2009.pdf", verifiedOn: "2026-10-16" }

  - id: autoscaling
    term: "Autoscaling"
    aka: [ "auto scaling", "autoscale" ]
    definition: "Adding or removing resources automatically as demand changes; in practice usually instances (scale out and in)."
    see: scalability
    source: { title: "Autoscaling guidance (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/auto-scaling", verifiedOn: "2026-10-16" }

  - id: tcp
    term: "TCP"
    aka: [ "Transmission Control Protocol" ]
    definition: "Transport protocol that sets up a connection and delivers a reliable, in-order stream of bytes, resending anything lost."
    see: transport-protocols
    source: { title: "RFC 9293: Transmission Control Protocol (TCP)", url: "https://www.rfc-editor.org/rfc/rfc9293.html", verifiedOn: "2026-10-16" }

  - id: udp
    term: "UDP"
    aka: [ "User Datagram Protocol" ]
    definition: "Transport protocol that sends separate datagrams with no connection; delivery, order and no-duplicates are not guaranteed."
    see: transport-protocols
    source: { title: "RFC 768: User Datagram Protocol", url: "https://www.rfc-editor.org/rfc/rfc768.html", verifiedOn: "2026-10-16" }

  - id: datagram
    term: "Datagram"
    definition: "One self-contained message sent on its own, with no connection, like a UDP packet."
    see: transport-protocols
    source: { title: "RFC 8085: UDP Usage Guidelines (BCP 145)", url: "https://www.rfc-editor.org/rfc/rfc8085.html", verifiedOn: "2026-10-16" }

  - id: tcp-handshake
    term: "Three-way handshake"
    aka: [ "TCP handshake" ]
    definition: "How TCP opens a connection: the client sends SYN, the server answers SYN-ACK, the client replies ACK."
    see: transport-protocols
    source: { title: "RFC 9293: Transmission Control Protocol (TCP)", url: "https://www.rfc-editor.org/rfc/rfc9293.html", verifiedOn: "2026-10-16" }

  - id: round-trip-time
    term: "Round-trip time"
    aka: [ "RTT", "round trip" ]
    definition: "The time for a message to go to the other side and for the reply to come back."
    source: { title: "RFC 6298: Computing TCP's Retransmission Timer", url: "https://www.rfc-editor.org/rfc/rfc6298.html", verifiedOn: "2026-10-16" }

  - id: flow-control
    term: "Flow control"
    definition: "Keeps a fast sender from overrunning a slow receiver; in TCP the receiver advertises a window of how much it can take."
    see: transport-protocols
    source: { title: "RFC 9293: Transmission Control Protocol (TCP)", url: "https://www.rfc-editor.org/rfc/rfc9293.html", verifiedOn: "2026-10-16" }

  - id: congestion-control
    term: "Congestion control"
    definition: "The sender grows its rate step by step (slow start) and cuts it when packet loss shows the network is overloaded."
    see: transport-protocols
    source: { title: "RFC 5681: TCP Congestion Control", url: "https://www.rfc-editor.org/rfc/rfc5681.html", verifiedOn: "2026-10-16" }

  - id: head-of-line-blocking
    term: "Head-of-line blocking"
    aka: [ "HOL blocking" ]
    definition: "One lost or slow item at the front holds up everything behind it, such as data behind a lost TCP packet."
    see: transport-protocols
    source: { title: "RFC 9114: HTTP/3 (Section 1.1)", url: "https://www.rfc-editor.org/rfc/rfc9114.html", verifiedOn: "2026-10-16" }

  - id: quic
    term: "QUIC"
    definition: "A transport protocol on UDP with reliable, encrypted streams and a combined connection and TLS handshake."
    see: transport-protocols
    source: { title: "RFC 9000: QUIC, a UDP-based multiplexed and secure transport", url: "https://www.rfc-editor.org/rfc/rfc9000.html", verifiedOn: "2026-10-16" }

  - id: http3
    term: "HTTP/3"
    definition: "The version of HTTP that runs over QUIC instead of TCP."
    see: transport-protocols
    source: { title: "RFC 9114: HTTP/3", url: "https://www.rfc-editor.org/rfc/rfc9114.html", verifiedOn: "2026-10-16" }

  - id: throttling
    term: "Throttling"
    aka: [ "throttle", "throttled" ]
    definition: "Slowing down or rejecting a client's requests once it passes a set rate; AWS uses this word for rate limiting."
    see: rate-limiting
    source: { title: "Throttle requests to your REST APIs (Amazon API Gateway docs)", url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html", verifiedOn: "2026-10-16" }

  - id: token-bucket
    term: "Token bucket"
    definition: "Rate-limit algorithm: a bucket holds up to N tokens, refilled at a steady rate; each request spends one, so short bursts pass."
    see: rate-limiting
    source: { title: "Throttle requests to your REST APIs (Amazon API Gateway docs)", url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html", verifiedOn: "2026-10-16" }

  - id: leaky-bucket
    term: "Leaky bucket"
    aka: [ "leaking bucket" ]
    definition: "Rate-limit algorithm: requests queue up and leave at a fixed rate; when the queue is full, new ones are dropped."
    see: rate-limiting
    source: { title: "Rate Limiting with NGINX (NGINX blog)", url: "https://blog.nginx.org/blog/rate-limiting-nginx", verifiedOn: "2026-10-16" }

  - id: fixed-window
    term: "Fixed window counter"
    aka: [ "fixed window" ]
    definition: "Rate-limit algorithm: one counter per clock window, such as per minute, reset at the start of each window."
    see: rate-limiting
    source: { title: "An alternative approach to rate limiting (Figma blog, 2017)", url: "https://www.figma.com/blog/an-alternative-approach-to-rate-limiting/", verifiedOn: "2026-10-16" }

  - id: sliding-window
    term: "Sliding window"
    aka: [ "sliding window log", "sliding window counter" ]
    definition: "Rate-limit algorithm that counts requests in the last N seconds from now, exactly (a log) or estimated (a counter)."
    see: rate-limiting
    source: { title: "How we built rate limiting capable of scaling to millions of domains (Cloudflare blog, 2017)", url: "https://blog.cloudflare.com/counting-things-a-lot-of-different-things/", verifiedOn: "2026-10-16" }

  - id: http-429
    term: "429 Too Many Requests"
    aka: [ "HTTP 429", "429" ]
    definition: "HTTP status code meaning the client sent too many requests in a given time; it may come with Retry-After."
    see: rate-limiting
    source: { title: "RFC 6585: Additional HTTP Status Codes", url: "https://www.rfc-editor.org/rfc/rfc6585.html", verifiedOn: "2026-10-16" }

  - id: retry-after
    term: "Retry-After"
    definition: "HTTP response header that tells the client how long to wait, in seconds or until a date, before trying again."
    see: rate-limiting
    source: { title: "Retry-After header (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Retry-After", verifiedOn: "2026-10-16" }

  - id: short-polling
    term: "Short polling"
    definition: "The client asks the server for news on a timer, and the server answers at once, often with nothing."
    see: realtime-communication
    source: { title: "RFC 6202: Long Polling and Streaming in Bidirectional HTTP", url: "https://www.rfc-editor.org/rfc/rfc6202.html", verifiedOn: "2026-10-16" }

  - id: long-polling
    term: "Long polling"
    definition: "The server holds the client's request open until it has news or a timeout, then the client sends a new one."
    see: realtime-communication
    source: { title: "RFC 6202: Long Polling and Streaming in Bidirectional HTTP", url: "https://www.rfc-editor.org/rfc/rfc6202.html", verifiedOn: "2026-10-16" }

  - id: sse
    term: "Server-sent events"
    aka: [ "SSE", "EventSource" ]
    definition: "A browser API and text format for one long HTTP response in which the server streams events; the browser reconnects itself."
    see: realtime-communication
    source: { title: "HTML Living Standard: Server-sent events (WHATWG)", url: "https://html.spec.whatwg.org/multipage/server-sent-events.html", verifiedOn: "2026-10-16" }

  - id: websockets
    term: "WebSocket"
    aka: [ "WebSocket protocol" ]
    definition: "A protocol that upgrades an HTTP connection into one long-lived, two-way channel over TCP for messages in both directions."
    see: realtime-communication
    source: { title: "RFC 6455: The WebSocket Protocol", url: "https://www.rfc-editor.org/rfc/rfc6455.html", verifiedOn: "2026-10-16" }

  - id: full-duplex
    term: "Full-duplex"
    aka: [ "bidirectional" ]
    definition: "Both sides can send at the same time over one connection, as with WebSockets."
    see: realtime-communication
    source: { title: "RFC 6455: The WebSocket Protocol", url: "https://www.rfc-editor.org/rfc/rfc6455.html", verifiedOn: "2026-10-16" }

  - id: webrtc
    term: "WebRTC"
    definition: "Browser technology for sending audio, video and data directly between browsers, without requiring a server in the middle."
    see: realtime-communication
    source: { title: "WebRTC API (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API", verifiedOn: "2026-10-16" }

  - id: dns
    term: "DNS"
    aka: [ "Domain Name System" ]
    definition: "The internet's naming system: it turns a name like example.com into the IP address of a server."
    see: dns
    source: { title: "What is DNS? (Amazon Route 53)", url: "https://aws.amazon.com/route53/what-is-dns/", verifiedOn: "2026-10-16" }

  - id: dns-resolver
    term: "Recursive resolver"
    aka: [ "DNS resolver", "recursive DNS resolver" ]
    definition: "The DNS server a device asks first; it queries the other DNS servers on the device's behalf and caches the answers."
    see: dns
    source: { title: "What is DNS? (Amazon Route 53)", url: "https://aws.amazon.com/route53/what-is-dns/", verifiedOn: "2026-10-16" }

  - id: root-server
    term: "Root name server"
    aka: [ "root server", "root DNS server" ]
    definition: "A top-level DNS server that points resolvers to the right TLD servers; there are 13 named root identities."
    see: dns
    source: { title: "Root Servers (IANA)", url: "https://www.iana.org/domains/root/servers", verifiedOn: "2026-10-16" }

  - id: tld-server
    term: "TLD name server"
    aka: [ "TLD server", "top-level domain" ]
    definition: "The DNS server for one top-level domain, such as .com, that points to each domain's authoritative servers."
    see: dns
    source: { title: "What is DNS? (Amazon Route 53)", url: "https://aws.amazon.com/route53/what-is-dns/", verifiedOn: "2026-10-16" }

  - id: authoritative-server
    term: "Authoritative name server"
    aka: [ "authoritative server", "authoritative DNS server" ]
    definition: "The DNS server that holds a domain's actual records and gives the final answer, such as its IP address."
    see: dns
    source: { title: "What is DNS? (Amazon Route 53)", url: "https://aws.amazon.com/route53/what-is-dns/", verifiedOn: "2026-10-16" }

  - id: a-record
    term: "A record"
    aka: [ "AAAA record" ]
    definition: "A DNS record that maps a name to an IPv4 address; an AAAA record does the same for an IPv6 address."
    see: dns
    source: { title: "Supported DNS record types (Amazon Route 53 docs)", url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/ResourceRecordTypes.html", verifiedOn: "2026-10-16" }

  - id: cname-record
    term: "CNAME record"
    aka: [ "CNAME" ]
    definition: "A DNS record that points one name to another name; it cannot be used at the zone apex or beside other records."
    see: dns
    source: { title: "Supported DNS record types (Amazon Route 53 docs)", url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/ResourceRecordTypes.html", verifiedOn: "2026-10-16" }

  - id: zone-apex
    term: "Zone apex"
    definition: "The top name of a DNS zone, such as example.com itself rather than www.example.com."
    see: dns
    source: { title: "Supported DNS record types: CNAME (Amazon Route 53 docs)", url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/ResourceRecordTypes.html", verifiedOn: "2026-10-16" }

  - id: geo-dns
    term: "GeoDNS"
    aka: [ "geolocation routing", "geo DNS" ]
    definition: "DNS that answers based on where the user is, for example sending users in Europe to a Frankfurt server."
    see: dns
    source: { title: "Geolocation routing (Amazon Route 53 docs)", url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-geo.html", verifiedOn: "2026-10-16" }

  - id: dns-failover
    term: "DNS failover"
    definition: "DNS stops returning an endpoint that fails health checks and returns a healthy standby instead."
    see: dns
    source: { title: "Active-active and active-passive failover (Amazon Route 53 docs)", url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html", verifiedOn: "2026-10-16" }

  - id: cdn
    term: "CDN"
    aka: [ "content delivery network", "content delivery networks" ]
    definition: "A network of cache servers near users that serves copies of your files, so most requests never reach the origin."
    see: cdn
    source: { title: "How CloudFront delivers content (Amazon CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html", verifiedOn: "2026-10-16" }

  - id: edge-server
    term: "Edge location"
    aka: [ "edge server", "point of presence" ]
    definition: "A CDN site close to users that caches content and answers their requests nearby."
    see: cdn
    source: { title: "How CloudFront delivers content (Amazon CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html", verifiedOn: "2026-10-16" }

  - id: origin-server
    term: "Origin server"
    definition: "The server or storage bucket that holds the original files that a CDN or cache fetches from."
    see: cdn
    source: { title: "How CloudFront delivers content (Amazon CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html", verifiedOn: "2026-10-16" }

  - id: cache-hit-ratio
    term: "Cache hit ratio"
    aka: [ "hit ratio", "cache hit rate" ]
    definition: "The share of requests answered from the cache instead of the origin; higher means less load on the origin."
    source: { title: "Increase the cache hit ratio (Amazon CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-hit-ratio.html", verifiedOn: "2026-10-16" }

  - id: cache-control
    term: "Cache-Control"
    aka: [ "Cache-Control header" ]
    definition: "The HTTP header that tells browsers and CDNs whether they may store a response and for how long, e.g. max-age=3600."
    source: { title: "Cache-Control header (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control", verifiedOn: "2026-10-16" }

  - id: cdn-invalidation
    term: "Purge (CDN invalidation)"
    aka: [ "purge", "purged", "CDN invalidation" ]
    definition: "Removing a file from CDN edge caches before it expires, so the next request fetches the new copy from the origin."
    see: cdn
    source: { title: "Invalidate files to remove content (Amazon CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Invalidation.html", verifiedOn: "2026-10-16" }

  - id: tiered-cache
    term: "Tiered cache"
    aka: [ "origin shield", "regional edge cache", "mid-tier cache" ]
    definition: "A larger cache layer between CDN edges and the origin that merges misses for the same file, e.g. CloudFront Origin Shield."
    see: cdn
    source: { title: "Use Amazon CloudFront Origin Shield (Amazon CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html", verifiedOn: "2026-10-16" }

  - id: push-cdn
    term: "Push CDN"
    definition: "A CDN where you upload files to its storage yourself, before users ask for them."
    see: cdn
    source: { title: "The System Design Primer: Push CDNs (donnemartin, GitHub)", url: "https://github.com/donnemartin/system-design-primer", verifiedOn: "2026-10-16" }

  - id: pull-cdn
    term: "Pull CDN"
    definition: "A CDN that fetches a file from your origin on the first request, then serves it from its cache."
    see: cdn
    source: { title: "The System Design Primer: Pull CDNs (donnemartin, GitHub)", url: "https://github.com/donnemartin/system-design-primer", verifiedOn: "2026-10-16" }

  - id: tls-termination
    term: "TLS termination"
    aka: [ "SSL termination", "TLS offloading", "SSL offloading" ]
    definition: "Decrypting HTTPS at a proxy, load balancer or gateway, so the servers behind it do not have to."
    see: reverse-proxy
    source: { title: "Gateway Offloading pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-offloading", verifiedOn: "2026-10-16" }

  - id: forward-proxy
    term: "Forward proxy"
    definition: "A proxy that sits in front of clients and sends their requests out to the internet for them."
    see: reverse-proxy
    source: { title: "Proxy server (MDN Glossary)", url: "https://developer.mozilla.org/en-US/docs/Glossary/Proxy_server", verifiedOn: "2026-10-16" }

  - id: x-forwarded-for
    term: "X-Forwarded-For"
    definition: "An HTTP header a proxy or load balancer adds to pass on the original client's IP address."
    see: reverse-proxy
    source: { title: "How Elastic Load Balancing works: HTTP headers (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html", verifiedOn: "2026-10-16" }

  - id: layer-4-lb
    term: "Layer 4 load balancer"
    aka: [ "L4 load balancer", "layer 4 load balancing" ]
    definition: "A load balancer that routes connections by IP address and port without reading the request, e.g. AWS NLB."
    see: load-balancer
    source: { title: "What is a Network Load Balancer? (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html", verifiedOn: "2026-10-16" }

  - id: layer-7-lb
    term: "Layer 7 load balancer"
    aka: [ "L7 load balancer", "layer 7 load balancing" ]
    definition: "A load balancer that reads each HTTP request and routes it by path, host or header, e.g. AWS ALB."
    see: load-balancer
    source: { title: "What is an Application Load Balancer? (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html", verifiedOn: "2026-10-16" }

  - id: gateway-routing
    term: "Gateway routing"
    definition: "One public endpoint that sends each request to the right service using layer 7 rules such as the URL path."
    see: api-gateway
    source: { title: "Gateway Routing pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-routing", verifiedOn: "2026-10-16" }

  - id: gateway-offloading
    term: "Gateway offloading"
    definition: "Moving shared jobs such as TLS, authentication and rate limiting out of every service and into the gateway."
    see: api-gateway
    source: { title: "Gateway Offloading pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-offloading", verifiedOn: "2026-10-16" }

  - id: gateway-aggregation
    term: "Gateway aggregation"
    aka: [ "request aggregation" ]
    definition: "A gateway takes one client request, calls several services, and returns one combined reply."
    see: api-gateway
    source: { title: "Gateway Aggregation pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/gateway-aggregation", verifiedOn: "2026-10-16" }

  - id: bff
    term: "Backend for Frontend (BFF)"
    aka: [ "BFF", "backend for frontend", "backends for frontends" ]
    definition: "A separate backend layer for each client type, such as mobile and web, shaped to that client's needs."
    see: api-gateway
    source: { title: "Backends for Frontends pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends", verifiedOn: "2026-10-16" }

  - id: protocol-translation
    term: "Protocol translation"
    definition: "A gateway accepts one protocol from clients, such as HTTP, and talks to the services behind it in another."
    see: api-gateway
    source: { title: "API gateways (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/microservices/design/gateway", verifiedOn: "2026-10-16" }

  - id: rest
    term: "REST (Representational State Transfer)"
    aka: [ "REST API", "RESTful" ]
    definition: "An API style from Roy Fielding (2000): resources at URLs, a uniform interface of standard methods, stateless requests and cacheable responses."
    see: api-styles
    source: { title: "Architectural Styles and the Design of Network-based Software Architectures, Chapter 5: REST (Roy Fielding, 2000)", url: "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm", verifiedOn: "2026-10-16" }

  - id: rpc
    term: "RPC (remote procedure call)"
    aka: [ "RPC", "remote procedure call" ]
    definition: "Calling a function that runs on another machine as if it were local; a library sends the call and its arguments over the network."
    see: api-styles
    source: { title: "Introduction to gRPC (grpc.io docs)", url: "https://grpc.io/docs/what-is-grpc/introduction/", verifiedOn: "2026-10-16" }

  - id: grpc-web
    term: "gRPC-Web"
    definition: "A form of gRPC that browsers can use; calls go through a proxy such as Envoy that talks normal gRPC to the server."
    see: api-styles
    source: { title: "gRPC Web (grpc/grpc-web repository README)", url: "https://github.com/grpc/grpc-web", verifiedOn: "2026-10-16" }

  - id: grpc
    term: "gRPC"
    definition: "An RPC framework: call methods on a remote service as if they were local, over HTTP/2, with Protocol Buffers by default."
    see: api-styles
    source: { title: "Introduction to gRPC (grpc.io docs)", url: "https://grpc.io/docs/what-is-grpc/introduction/", verifiedOn: "2026-10-16" }

  - id: protobuf
    term: "Protocol Buffers"
    aka: [ "protobuf" ]
    definition: "A language-neutral way to serialise typed data into compact binary messages, described in a .proto file."
    see: api-styles
    source: { title: "Protocol Buffers overview (protobuf.dev)", url: "https://protobuf.dev/overview/", verifiedOn: "2026-10-16" }

  - id: http-2
    term: "HTTP/2"
    definition: "A version of HTTP that carries many requests at once over one connection (multiplexing) and compresses headers."
    source: { title: "RFC 9113: HTTP/2 (IETF, 2022)", url: "https://www.rfc-editor.org/rfc/rfc9113.html", verifiedOn: "2026-10-16" }

  - id: http-status-codes
    term: "HTTP status code"
    aka: [ "status code" ]
    definition: "The three-digit result of an HTTP request: 2xx success, 3xx redirection, 4xx client error, 5xx server error."
    see: api-styles
    source: { title: "RFC 9110: HTTP Semantics, Section 15 Status Codes (IETF, 2022)", url: "https://www.rfc-editor.org/rfc/rfc9110.html", verifiedOn: "2026-10-16" }

  - id: crud
    term: "CRUD"
    definition: "Create, read, update, delete: the four basic operations on stored data."
    source: { title: "CRUD (MDN Web Docs glossary)", url: "https://developer.mozilla.org/en-US/docs/Glossary/CRUD", verifiedOn: "2026-10-16" }

  - id: openapi
    term: "OpenAPI"
    aka: [ "OpenAPI Specification" ]
    definition: "A standard, language-agnostic format for describing an HTTP API: its paths, methods, inputs and outputs."
    source: { title: "OpenAPI Specification v3.2.1 (OpenAPI Initiative)", url: "https://spec.openapis.org/oas/latest.html", verifiedOn: "2026-10-16" }

  - id: graphql
    term: "GraphQL"
    definition: "A query language for APIs: the client sends one query to one endpoint and gets back exactly the fields it asked for."
    see: api-styles
    source: { title: "Introduction to GraphQL (graphql.org)", url: "https://graphql.org/learn/introduction/", verifiedOn: "2026-10-16" }

  - id: graphql-n-plus-one
    term: "N+1 problem"
    aka: [ "N+1 query problem" ]
    definition: "One query loads a list, then one more query runs for each item: N+1 calls in total. Fixed by batching the lookups."
    see: api-styles
    source: { title: "Performance (graphql.org)", url: "https://graphql.org/learn/performance/", verifiedOn: "2026-10-16" }

  - id: dataloader
    term: "DataLoader"
    definition: "A batching tool, first from Facebook, that collects the keys a GraphQL query asks for and loads them in one backend call."
    see: api-styles
    source: { title: "Performance (graphql.org)", url: "https://graphql.org/learn/performance/", verifiedOn: "2026-10-16" }

  - id: pagination
    term: "Pagination"
    aka: [ "cursor pagination", "cursor-based pagination", "offset pagination" ]
    definition: "Returning a long list one page at a time. Offset pages can shift when rows are added; cursor pages stay stable."
    see: api-styles
    source: { title: "Pagination (graphql.org)", url: "https://graphql.org/learn/pagination/", verifiedOn: "2026-10-16" }

  - id: idempotency-key
    term: "Idempotency key"
    aka: [ "Idempotency-Key" ]
    definition: "A unique ID the client sends with a write and reuses on every retry, so the server returns the first result instead of running it again."
    see: idempotency
    source: { title: "Idempotent requests (Stripe API reference)", url: "https://docs.stripe.com/api/idempotent_requests", verifiedOn: "2026-10-16" }

  - id: idempotency
    term: "Idempotency"
    aka: [ "idempotent" ]
    definition: "An operation is idempotent if doing it many times has the same effect as doing it once."
    see: idempotency
    source: { title: "RFC 9110: HTTP Semantics, 9.2.2 Idempotent Methods (IETF, 2022)", url: "https://www.rfc-editor.org/rfc/rfc9110.html#name-idempotent-methods", verifiedOn: "2026-10-16" }

  - id: safe-methods
    term: "Safe method"
    aka: [ "safe methods", "safe HTTP method" ]
    definition: "An HTTP method meant to be read-only, such as GET or HEAD: the client asks for no change on the server."
    see: idempotency
    source: { title: "RFC 9110: HTTP Semantics, 9.2.1 Safe Methods (IETF, 2022)", url: "https://www.rfc-editor.org/rfc/rfc9110.html#name-safe-methods", verifiedOn: "2026-10-16" }

  - id: microservice-premium
    term: "Microservice premium"
    definition: "The extra cost and slowdown of running many services; Fowler says it pays off only for systems too complex for a monolith."
    see: microservices
    source: { title: "MicroservicePremium (Martin Fowler, 2015)", url: "https://martinfowler.com/bliki/MicroservicePremium.html", verifiedOn: "2026-10-16" }

  - id: microservices
    term: "Microservices"
    aka: [ "microservice", "microservice architecture" ]
    definition: "An architecture of small services, each built around one business capability, running in its own process and deployed on its own."
    see: microservices
    source: { title: "Microservices (James Lewis and Martin Fowler, 2014)", url: "https://martinfowler.com/articles/microservices.html", verifiedOn: "2026-10-16" }

  - id: monolith
    term: "Monolith"
    aka: [ "monolithic" ]
    definition: "An application built and deployed as one single unit, usually with one shared database."
    see: microservices
    source: { title: "Pattern: Monolithic Architecture (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/monolithic.html", verifiedOn: "2026-10-16" }

  - id: modular-monolith
    term: "Modular monolith"
    definition: "One deployable app, split inside into modules with strictly enforced boundaries between them."
    see: microservices
    source: { title: "Deconstructing the Monolith (Kirsten Westeinde, Shopify Engineering, 2019)", url: "https://shopify.engineering/deconstructing-monolith-designing-software-maximizes-developer-productivity", verifiedOn: "2026-10-16" }

  - id: business-capability
    term: "Business capability"
    aka: [ "business capabilities" ]
    definition: "Something the business does, like taking orders or payments; microservices are usually split along these lines."
    see: microservices
    source: { title: "Microservices (James Lewis and Martin Fowler, 2014)", url: "https://martinfowler.com/articles/microservices.html", verifiedOn: "2026-10-16" }

  - id: database-per-service
    term: "Database per service"
    definition: "Each microservice keeps its data private; other services reach that data only through its API."
    see: microservices
    source: { title: "Pattern: Database per service (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/data/database-per-service.html", verifiedOn: "2026-10-16" }

  - id: api-composition
    term: "API composition"
    definition: "Answering a query that spans services by calling each service's API and joining the results in code."
    see: microservices
    source: { title: "Pattern: Database per service (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/data/database-per-service.html", verifiedOn: "2026-10-16" }

  - id: conways-law
    term: "Conway's law"
    definition: "Organisations design systems whose structure copies their own communication structure (Melvin Conway, 1968)."
    see: microservices
    source: { title: "Conway's Law (Martin Fowler, 2022)", url: "https://martinfowler.com/bliki/ConwaysLaw.html", verifiedOn: "2026-10-16" }

  - id: strangler-fig
    term: "Strangler fig pattern"
    aka: [ "strangler fig" ]
    definition: "Replace an old system bit by bit: a facade sends each migrated feature to the new system until the old one can be retired."
    see: microservices
    source: { title: "Strangler Fig pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/strangler-fig", verifiedOn: "2026-10-16" }

  - id: service-discovery
    term: "Service discovery"
    definition: "How a caller finds the current address of a healthy instance of a service, usually by asking a service registry."
    see: service-discovery
    source: { title: "Pattern: Client-side service discovery (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/client-side-discovery.html", verifiedOn: "2026-10-16" }

  - id: service-registry
    term: "Service registry"
    definition: "A database of service instances and their addresses; instances register on start and are removed on shutdown."
    see: service-discovery
    source: { title: "Pattern: Service registry (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/service-registry.html", verifiedOn: "2026-10-16" }

  - id: client-side-discovery
    term: "Client-side discovery"
    definition: "The caller queries the service registry itself and picks an instance with its own load-balancing logic."
    see: service-discovery
    source: { title: "Pattern: Client-side service discovery (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/client-side-discovery.html", verifiedOn: "2026-10-16" }

  - id: server-side-discovery
    term: "Server-side discovery"
    definition: "The caller sends requests to a router or load balancer, which looks up the registry and forwards to an instance."
    see: service-discovery
    source: { title: "Pattern: Server-side service discovery (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/server-side-discovery.html", verifiedOn: "2026-10-16" }

  - id: kubernetes-service
    term: "Kubernetes Service"
    definition: "A stable name and virtual IP for a changing set of Pods, picked by a label selector."
    see: service-discovery
    source: { title: "Service (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/services-networking/service/", verifiedOn: "2026-10-16" }

  - id: kube-proxy
    term: "kube-proxy"
    definition: "A Kubernetes component on every node that sends traffic for a Service's virtual IP to one of its endpoints."
    see: service-discovery
    source: { title: "Virtual IPs and Service Proxies (Kubernetes docs)", url: "https://kubernetes.io/docs/reference/networking/virtual-ips/", verifiedOn: "2026-10-16" }

  - id: readiness-probe
    term: "Readiness probe"
    aka: [ "readiness probes" ]
    definition: "A Kubernetes check on a container; while it fails, the Pod is removed from its Services' endpoints and gets no traffic."
    see: service-discovery
    source: { title: "Liveness, Readiness, and Startup Probes (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/workloads/pods/probes/", verifiedOn: "2026-10-16" }

  - id: pod
    term: "Pod"
    aka: [ "Pods" ]
    definition: "The smallest unit Kubernetes runs: one or more containers that share network and storage."
    see: service-discovery
    source: { title: "Pods (Kubernetes docs)", url: "https://kubernetes.io/docs/concepts/workloads/pods/", verifiedOn: "2026-10-16" }

  - id: cache-hit
    term: "Cache hit"
    aka: [ "cache hits" ]
    definition: "The requested key is in the cache and has not expired, so the source is not touched."
    see: caching-layers
    source: { title: "Caching strategies for Memcached (Amazon ElastiCache docs)", url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html", verifiedOn: "2026-10-16" }

  - id: cache-miss
    term: "Cache miss"
    aka: [ "cache misses" ]
    definition: "The key is not in the cache, or has expired, so the value must be fetched from the source."
    see: cache-aside
    source: { title: "Caching strategies for Memcached (Amazon ElastiCache docs)", url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html", verifiedOn: "2026-10-16" }

  - id: lazy-loading
    term: "Lazy loading"
    definition: "AWS's name for cache-aside: a value enters the cache only after someone reads it and misses."
    see: cache-aside
    source: { title: "Caching strategies for Memcached (Amazon ElastiCache docs)", url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html", verifiedOn: "2026-10-16" }

  - id: cache-warming
    term: "Cache warming"
    aka: [ "cache seeding", "warm the cache", "prewarming" ]
    definition: "Loading likely-needed data into a cache in advance, for example at start-up, so the first requests do not all miss."
    see: caching-layers
    source: { title: "Caching guidance: seeding (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching", verifiedOn: "2026-10-16" }

  - id: cold-cache
    term: "Cold cache"
    aka: [ "cold caches" ]
    definition: "An empty cache, such as one on a newly started server, so most requests miss until it fills."
    see: caching-layers
    source: { title: "Caching challenges and strategies (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/caching-challenges-and-strategies/", verifiedOn: "2026-10-16" }

  - id: private-cache
    term: "Private cache"
    aka: [ "private caches" ]
    definition: "A cache used by one client or one process only, such as the browser cache or an app server's own memory."
    see: caching-layers
    source: { title: "Caching guidance: private and shared caching (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching", verifiedOn: "2026-10-16" }

  - id: shared-cache
    term: "Shared cache"
    aka: [ "shared caches" ]
    definition: "A cache that many users or servers read from, such as a CDN, a reverse proxy, or one Redis cluster used by all app servers."
    see: caching-layers
    source: { title: "Caching guidance: private and shared caching (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching", verifiedOn: "2026-10-16" }

  - id: in-process-cache
    term: "In-process cache"
    aka: [ "local cache", "local caches" ]
    definition: "A cache inside the app's own memory: no network hop, but each server keeps its own copy."
    see: caching-layers
    source: { title: "Caching guidance: private caching (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching", verifiedOn: "2026-10-16" }

  - id: distributed-cache
    term: "Distributed cache"
    aka: [ "distributed caches" ]
    definition: "A cache service on its own servers, such as Redis or Memcached, shared by all app servers and grown by adding nodes."
    see: caching-layers
    source: { title: "Caching guidance: shared caching (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching", verifiedOn: "2026-10-16" }

  - id: cache-busting
    term: "Cache busting"
    aka: [ "cache-busting" ]
    definition: "Giving a file a new URL when it changes, such as app.v2.js, so caches can safely keep the old one for a long time."
    see: caching-layers
    source: { title: "HTTP caching: cache busting (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching", verifiedOn: "2026-10-16" }

  - id: lru
    term: "LRU (least recently used)"
    aka: [ "LRU", "least recently used" ]
    definition: "An eviction policy that removes the key that has gone unused for the longest time."
    see: eviction
    source: { title: "Key eviction (Redis docs)", url: "https://redis.io/docs/latest/develop/reference/eviction/", verifiedOn: "2026-10-16" }

  - id: lfu
    term: "LFU (least frequently used)"
    aka: [ "LFU", "least frequently used" ]
    definition: "An eviction policy that removes the key used the fewest times; Redis 4.0+ counts uses with a counter that decays."
    see: eviction
    source: { title: "Key eviction: LFU eviction (Redis docs)", url: "https://redis.io/docs/latest/develop/reference/eviction/", verifiedOn: "2026-10-16" }

  - id: read-through
    term: "Read-through"
    aka: [ "read-through cache" ]
    definition: "On a miss, the cache itself loads the value from the database, so the app only talks to the cache."
    see: caching-strategies
    source: { title: "Caching Data Sources: read-through caching (Oracle Coherence 14.1.1 docs)", url: "https://docs.oracle.com/en/middleware/standalone/coherence/14.1.1.2206/develop-applications/caching-data-sources.html", verifiedOn: "2026-10-16" }

  - id: write-behind
    term: "Write-behind"
    aka: [ "write-back", "write behind" ]
    definition: "The cache confirms a write at once and saves it to the database later, often in batches; a crash before that loses it."
    see: write-through
    source: { title: "Caching Data Sources: write-behind caching (Oracle Coherence 14.1.1 docs)", url: "https://docs.oracle.com/en/middleware/standalone/coherence/14.1.1.2206/develop-applications/caching-data-sources.html", verifiedOn: "2026-10-16" }

  - id: write-around
    term: "Write-around"
    aka: [ "write around", "no-write allocate" ]
    definition: "A write goes only to the database, not the cache; the cache gets the value on a later read miss."
    see: caching-strategies
    source: { title: "Cache (computing): writing policies, no-write allocate (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cache_(computing)", verifiedOn: "2026-10-16" }

  - id: refresh-ahead
    term: "Refresh-ahead"
    definition: "The cache reloads a key that is read close to its expiry in the background, so the next reads do not miss."
    see: caching-strategies
    source: { title: "Caching Data Sources: refresh-ahead caching (Oracle Coherence 14.1.1 docs)", url: "https://docs.oracle.com/en/middleware/standalone/coherence/14.1.1.2206/develop-applications/caching-data-sources.html", verifiedOn: "2026-10-16" }

  - id: request-coalescing
    term: "Request coalescing"
    aka: [ "single flight", "singleflight" ]
    definition: "When many requests miss the same key, only one fetches it from the source; the others wait and share its result."
    see: cache-invalidation
    source: { title: "Caching challenges and strategies (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/caching-challenges-and-strategies/", verifiedOn: "2026-10-16" }

  - id: cache-lease
    term: "Lease (memcache)"
    aka: [ "lease token", "lease tokens" ]
    definition: "A token memcached gives one client on a miss; only that client may refill the key, and a delete cancels the token."
    see: cache-invalidation
    source: { title: "Scaling Memcache at Facebook (Nishtala et al., NSDI 2013)", url: "https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf", verifiedOn: "2026-10-16" }

  - id: stale-data
    term: "Stale data"
    aka: [ "stale value", "stale values", "stale copy" ]
    definition: "A cached copy that no longer matches the source, because the source changed after it was cached."
    see: cache-invalidation
    source: { title: "Caching guidance: manage data expiration (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching", verifiedOn: "2026-10-16" }

  - id: normalisation
    term: "Normalisation"
    aka: [ "normalization", "normalise", "normalize", "normalised", "normalized" ]
    definition: "Organising tables so each fact is stored once, linked by keys, to avoid duplicate data and update anomalies."
    see: denormalisation
    source: { title: "Normalization in database design (IBM Db2 13 for z/OS documentation)", url: "https://www.ibm.com/docs/en/SSEPEK_13.0.0/intro/src/tpc/db2z_normalizationtoavoidredundancy.html", verifiedOn: "2026-10-16" }

  - id: denormalisation
    term: "Denormalisation"
    aka: [ "denormalization", "denormalise", "denormalize", "denormalised", "denormalized" ]
    definition: "Duplicating data on purpose, such as copying a column into another table, so reads need fewer joins; writes must update every copy."
    see: denormalisation
    source: { title: "Database design with denormalization (IBM Db2 13 for z/OS documentation)", url: "https://www.ibm.com/docs/en/SSEPEK_13.0.0/intro/src/tpc/db2z_denormalizationforperformance.html", verifiedOn: "2026-10-16" }

  - id: normal-form
    term: "Normal form (1NF, 2NF, 3NF)"
    aka: [ "normal forms", "1NF", "2NF", "3NF", "first normal form", "second normal form", "third normal form" ]
    definition: "A rule a table design meets to avoid duplicate data. The rules are cumulative: a table in 3NF also meets 1NF and 2NF."
    see: denormalisation
    source: { title: "Normalization in database design (IBM Db2 13 for z/OS documentation)", url: "https://www.ibm.com/docs/en/SSEPEK_13.0.0/intro/src/tpc/db2z_normalizationtoavoidredundancy.html", verifiedOn: "2026-10-16" }

  - id: update-anomaly
    term: "Update anomaly"
    aka: [ "update anomalies" ]
    definition: "Data that disagrees after an update, because a duplicated fact was changed in some rows but not in others."
    see: denormalisation
    source: { title: "Normalization in database design (IBM Db2 13 for z/OS documentation)", url: "https://www.ibm.com/docs/en/SSEPEK_13.0.0/intro/src/tpc/db2z_normalizationtoavoidredundancy.html", verifiedOn: "2026-10-16" }

  - id: materialized-view
    term: "Materialised view"
    aka: [ "materialized view", "materialised views", "materialized views" ]
    definition: "A query result stored like a table, so reads are fast. In PostgreSQL it is not current until you run REFRESH MATERIALIZED VIEW."
    see: denormalisation
    source: { title: "Materialized Views (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/rules-materializedviews.html", verifiedOn: "2026-10-16" }

  - id: isolation-level
    term: "Isolation level"
    aka: [ "isolation levels", "transaction isolation" ]
    definition: "How much concurrent transactions can see of each other. SQL defines Read Uncommitted, Read Committed, Repeatable Read and Serializable."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: dirty-read
    term: "Dirty read"
    aka: [ "dirty reads" ]
    definition: "A transaction reads data written by another transaction that has not committed yet."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: non-repeatable-read
    term: "Non-repeatable read"
    aka: [ "nonrepeatable read", "non-repeatable reads", "fuzzy read" ]
    definition: "A transaction reads the same row twice and gets different values, because another transaction committed a change in between."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: phantom-read
    term: "Phantom read"
    aka: [ "phantom reads", "phantoms" ]
    definition: "A transaction reruns a query and finds a different set of matching rows, because another transaction committed inserts or deletes."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: lost-update
    term: "Lost update"
    aka: [ "lost updates" ]
    definition: "Two transactions read the same value and both write back a result based on it; the second write silently erases the first."
    see: acid-transactions
    source: { title: "A Critique of ANSI SQL Isolation Levels (Berenson, Bernstein, Gray et al., SIGMOD 1995)", url: "https://arxiv.org/abs/cs/0701157", verifiedOn: "2026-10-16" }

  - id: write-skew
    term: "Write skew"
    definition: "Two transactions read the same data, then each updates a different row; neither overwrites the other, but a rule across the rows breaks."
    see: acid-transactions
    source: { title: "A Critique of ANSI SQL Isolation Levels (Berenson, Bernstein, Gray et al., SIGMOD 1995)", url: "https://arxiv.org/abs/cs/0701157", verifiedOn: "2026-10-16" }

  - id: read-uncommitted
    term: "Read Uncommitted"
    definition: "The weakest isolation level: it may read uncommitted changes. PostgreSQL accepts it but behaves as Read Committed."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: read-committed
    term: "Read Committed"
    definition: "Isolation level where each statement sees only data committed before it began. The default in PostgreSQL."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: repeatable-read
    term: "Repeatable Read"
    definition: "Isolation level where a transaction keeps seeing the rows it read unchanged. The default in MySQL InnoDB; snapshot isolation in PostgreSQL."
    see: acid-transactions
    source: { title: "Transaction Isolation Levels (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html", verifiedOn: "2026-10-16" }

  - id: serializable
    term: "Serializable"
    aka: [ "serializability", "serialization failure" ]
    definition: "The strongest isolation level: the result equals running the transactions one at a time. Conflicting transactions may fail and must retry."
    see: acid-transactions
    source: { title: "Transaction Isolation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/transaction-iso.html", verifiedOn: "2026-10-16" }

  - id: snapshot-isolation
    term: "Snapshot isolation"
    definition: "Each transaction reads a snapshot of committed data from when it started; if two write the same row, the first to commit wins."
    see: acid-transactions
    source: { title: "A Critique of ANSI SQL Isolation Levels (Berenson, Bernstein, Gray et al., SIGMOD 1995)", url: "https://arxiv.org/abs/cs/0701157", verifiedOn: "2026-10-16" }

  - id: write-ahead-log
    term: "Write-ahead log (WAL)"
    aka: [ "WAL", "write-ahead log", "write-ahead logging" ]
    definition: "A log of changes written to disk before the data files; after a crash, the database replays it to recover committed work."
    see: acid-transactions
    source: { title: "Write-Ahead Logging (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/wal-intro.html", verifiedOn: "2026-10-16" }

  - id: mvcc
    term: "MVCC"
    aka: [ "multi-version concurrency control", "multiversion concurrency control" ]
    definition: "The database keeps several versions of each row, so readers see a snapshot and reading never blocks writing (and the other way round)."
    see: concurrency-control
    source: { title: "MVCC Introduction (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/mvcc-intro.html", verifiedOn: "2026-10-16" }

  - id: optimistic-locking
    term: "Optimistic locking"
    aka: [ "optimistic concurrency control", "optimistic concurrency", "optimistic lock" ]
    definition: "Take no lock; on write, check that the row's version is unchanged since you read it, and retry if it changed."
    see: concurrency-control
    source: { title: "Handling Concurrency Conflicts (EF Core, Microsoft Learn)", url: "https://learn.microsoft.com/en-us/ef/core/saving/concurrency", verifiedOn: "2026-10-16" }

  - id: pessimistic-locking
    term: "Pessimistic locking"
    aka: [ "pessimistic lock", "pessimistic locks" ]
    definition: "Lock the data before changing it, for example with SELECT ... FOR UPDATE, so other writers wait until you commit."
    see: concurrency-control
    source: { title: "Handling Concurrency Conflicts (EF Core, Microsoft Learn)", url: "https://learn.microsoft.com/en-us/ef/core/saving/concurrency", verifiedOn: "2026-10-16" }

  - id: deadlock
    term: "Deadlock"
    aka: [ "deadlocks" ]
    definition: "Two or more transactions each wait for a lock the other holds. PostgreSQL and MySQL InnoDB detect it and abort one."
    see: concurrency-control
    source: { title: "Explicit Locking: Deadlocks (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/explicit-locking.html", verifiedOn: "2026-10-16" }

  - id: conditional-write
    term: "Conditional write"
    aka: [ "conditional writes", "conditional update" ]
    definition: "A write that succeeds only if a condition on the current data holds, such as a version or ETag still matching."
    see: concurrency-control
    source: { title: "Condition expressions (Amazon DynamoDB docs)", url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html", verifiedOn: "2026-10-16" }

  - id: distributed-lock
    term: "Distributed lock"
    aka: [ "distributed locks", "Redlock" ]
    definition: "A lock shared by processes on many machines, often a key with an expiry in a shared store such as Redis, so only one holder acts at a time."
    see: concurrency-control
    source: { title: "Distributed Locks with Redis (Redis docs)", url: "https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/", verifiedOn: "2026-10-16" }

  - id: object-storage
    term: "Object storage"
    aka: [ "object store", "blob storage" ]
    definition: "Storage that keeps data as objects (bytes plus metadata) in a flat namespace, each found by a unique key, e.g. Amazon S3."
    see: object-storage
    source: { title: "What's the difference between block, object and file storage? (AWS)", url: "https://aws.amazon.com/compare/the-difference-between-block-file-object-storage/", verifiedOn: "2026-10-16" }

  - id: presigned-url
    term: "Presigned URL"
    aka: [ "presigned URLs", "pre-signed URL" ]
    definition: "A URL signed with the creator's credentials that lets anyone holding it GET or PUT one object until it expires."
    see: object-storage
    source: { title: "Download and upload objects with presigned URLs (Amazon S3 User Guide)", url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html", verifiedOn: "2026-10-16" }

  - id: multipart-upload
    term: "Multipart upload"
    aka: [ "multipart uploads" ]
    definition: "Uploading one large object as separate parts, in any order and in parallel; the store joins them when the upload completes."
    see: object-storage
    source: { title: "Uploading and copying objects using multipart upload (Amazon S3 User Guide)", url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html", verifiedOn: "2026-10-16" }

  - id: storage-class
    term: "Storage class"
    aka: [ "storage classes" ]
    definition: "A price and access tier for stored objects, such as S3 Standard, Standard-IA or Glacier: less frequent access costs less to store."
    see: object-storage
    source: { title: "Understanding and managing Amazon S3 storage classes (Amazon S3 User Guide)", url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html", verifiedOn: "2026-10-16" }

  - id: lifecycle-rule
    term: "Lifecycle rule"
    aka: [ "lifecycle rules", "lifecycle policy", "lifecycle configuration" ]
    definition: "A bucket rule that moves objects to a cheaper storage class or deletes them after a set time."
    see: object-storage
    source: { title: "Managing the lifecycle of objects (Amazon S3 User Guide)", url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html", verifiedOn: "2026-10-16" }

  - id: block-storage
    term: "Block storage"
    definition: "Storage that splits data into fixed-size blocks on a volume a server mounts like a disk, e.g. Amazon EBS."
    see: object-storage
    source: { title: "What's the difference between block, object and file storage? (AWS)", url: "https://aws.amazon.com/compare/the-difference-between-block-file-object-storage/", verifiedOn: "2026-10-16" }

  - id: file-storage
    term: "File storage"
    definition: "Storage that keeps data as files in folders that many machines can share over a network, e.g. Amazon EFS."
    see: object-storage
    source: { title: "What's the difference between block, object and file storage? (AWS)", url: "https://aws.amazon.com/compare/the-difference-between-block-file-object-storage/", verifiedOn: "2026-10-16" }

  - id: b-tree
    term: "B-tree"
    aka: [ "B-trees", "btree" ]
    definition: "A balanced tree of sorted pages. It finds one key or a range of keys in a few page reads; most relational databases index with it by default."
    see: indexing
    source: { title: "B-Tree Indexes: Implementation (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/btree.html", verifiedOn: "2026-10-16" }

  - id: lsm-tree
    term: "LSM tree"
    aka: [ "LSM trees", "log-structured merge tree", "log-structured merge-tree" ]
    definition: "Write-optimised storage: writes go to a sorted memory buffer, are flushed as immutable sorted files, and the files are merged in the background."
    see: indexing
    source: { title: "Storage Engine (Apache Cassandra 5.0 documentation)", url: "https://cassandra.apache.org/doc/5.0/cassandra/architecture/storage-engine.html", verifiedOn: "2026-10-16" }

  - id: memtable
    term: "Memtable"
    aka: [ "memtables" ]
    definition: "The in-memory, sorted buffer where an LSM store puts new writes before flushing them to disk."
    see: indexing
    source: { title: "Storage Engine (Apache Cassandra 5.0 documentation)", url: "https://cassandra.apache.org/doc/5.0/cassandra/architecture/storage-engine.html", verifiedOn: "2026-10-16" }

  - id: sstable
    term: "SSTable"
    aka: [ "SSTables", "SST file", "SST files" ]
    definition: "An immutable file of sorted key-value data, written when an LSM store flushes its memtable."
    see: indexing
    source: { title: "Storage Engine (Apache Cassandra 5.0 documentation)", url: "https://cassandra.apache.org/doc/5.0/cassandra/architecture/storage-engine.html", verifiedOn: "2026-10-16" }

  - id: lsm-compaction
    term: "Compaction (LSM)"
    aka: [ "LSM compaction", "SSTable compaction" ]
    definition: "Background merging of an LSM store's sorted files into new ones, dropping overwritten and deleted data."
    see: indexing
    source: { title: "RocksDB Overview (RocksDB wiki, GitHub)", url: "https://github.com/facebook/rocksdb/wiki/RocksDB-Overview", verifiedOn: "2026-10-16" }

  - id: write-amplification
    term: "Write amplification"
    definition: "Bytes written to storage divided by bytes the application wrote. LSM compaction raises it, because data is rewritten several times."
    see: indexing
    source: { title: "RocksDB Tuning Guide: amplification factors (RocksDB wiki, GitHub)", url: "https://github.com/facebook/rocksdb/wiki/RocksDB-Tuning-Guide", verifiedOn: "2026-10-16" }

  - id: read-amplification
    term: "Read amplification"
    definition: "The number of disk reads one query needs. An LSM store may read several files for one key; Bloom filters cut this."
    see: indexing
    source: { title: "RocksDB Tuning Guide: amplification factors (RocksDB wiki, GitHub)", url: "https://github.com/facebook/rocksdb/wiki/RocksDB-Tuning-Guide", verifiedOn: "2026-10-16" }

  - id: clustered-index
    term: "Clustered index"
    aka: [ "clustered indexes" ]
    definition: "The index that stores the table rows themselves, in key order. In MySQL InnoDB it is the primary key."
    see: indexing
    source: { title: "Clustered and Secondary Indexes (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-index-types.html", verifiedOn: "2026-10-16" }

  - id: secondary-index
    term: "Secondary index"
    aka: [ "secondary indexes" ]
    definition: "Any index other than the clustered one. In InnoDB each entry also holds the row's primary key, used to fetch the full row."
    see: indexing
    source: { title: "Clustered and Secondary Indexes (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-index-types.html", verifiedOn: "2026-10-16" }

  - id: composite-index
    term: "Composite index"
    aka: [ "composite indexes", "multi-column index", "multicolumn index", "compound index" ]
    definition: "One index over several columns, sorted by the first column, then by the next."
    see: indexing
    source: { title: "Multiple-Column Indexes (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/multiple-column-indexes.html", verifiedOn: "2026-10-16" }

  - id: leftmost-prefix
    term: "Leftmost-prefix rule"
    aka: [ "leftmost prefix" ]
    definition: "A composite index on (a, b, c) can look up a; a, b; or a, b, c. It usually cannot look up b or c alone."
    see: indexing
    source: { title: "Multiple-Column Indexes (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/multiple-column-indexes.html", verifiedOn: "2026-10-16" }

  - id: covering-index
    term: "Covering index"
    aka: [ "covering indexes" ]
    definition: "An index that holds every column a query reads, so the answer comes from the index alone, without reading the table."
    see: indexing
    source: { title: "MySQL Glossary: covering index (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/glossary.html", verifiedOn: "2026-10-16" }

  - id: full-table-scan
    term: "Full table scan"
    aka: [ "table scan", "sequential scan", "seq scan" ]
    definition: "Reading every row of a table to answer a query. It happens when no index fits, or when most rows match anyway."
    see: indexing
    source: { title: "MySQL Glossary: full table scan (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/glossary.html", verifiedOn: "2026-10-16" }

  - id: inverted-index
    term: "Inverted index"
    aka: [ "inverted indexes" ]
    definition: "A map from each term to the documents that contain it: the reverse of each document listing its own words."
    see: search-index
    source: { title: "Index File Formats: Inverted Indexing (Apache Lucene 10.3.0 docs)", url: "https://lucene.apache.org/core/10_3_0/core/org/apache/lucene/codecs/lucene103/package-summary.html", verifiedOn: "2026-10-16" }

  - id: text-analysis
    term: "Text analysis"
    aka: [ "analyzer", "analyser" ]
    definition: "Turning text into searchable terms: split it into tokens, then normalise them, for example lowercase and stem. Done at index time and query time."
    see: search-index
    source: { title: "Text analysis (Elasticsearch docs)", url: "https://www.elastic.co/docs/manage-data/data-store/text-analysis", verifiedOn: "2026-10-16" }

  - id: tokenisation
    term: "Tokenisation"
    aka: [ "tokenization", "tokenizer", "tokeniser" ]
    definition: "Splitting text into small pieces called tokens, usually single words."
    see: search-index
    source: { title: "Text analysis (Elasticsearch docs)", url: "https://www.elastic.co/docs/manage-data/data-store/text-analysis", verifiedOn: "2026-10-16" }

  - id: stemming
    term: "Stemming"
    aka: [ "stemmer" ]
    definition: "Reducing a word to its root, so 'foxes' and 'fox' match the same term."
    see: search-index
    source: { title: "Text analysis (Elasticsearch docs)", url: "https://www.elastic.co/docs/manage-data/data-store/text-analysis", verifiedOn: "2026-10-16" }

  - id: bm25
    term: "BM25"
    definition: "The default relevance score in Elasticsearch: a TF-IDF style score where repeats of a term give diminishing returns and field length is taken into account."
    see: search-index
    source: { title: "Similarity settings (Elasticsearch docs)", url: "https://www.elastic.co/docs/reference/elasticsearch/index-settings/similarity", verifiedOn: "2026-10-16" }

  - id: tf-idf
    term: "TF-IDF"
    aka: [ "TF/IDF" ]
    definition: "A relevance score that grows when a term appears often in a document and appears in few documents overall."
    see: search-index
    source: { title: "TFIDFSimilarity (Apache Lucene 10.3.0 API)", url: "https://lucene.apache.org/core/10_3_0/core/org/apache/lucene/search/similarities/TFIDFSimilarity.html", verifiedOn: "2026-10-16" }

  - id: near-real-time
    term: "Near real-time search"
    aka: [ "NRT search" ]
    definition: "New or changed documents become searchable shortly after they are written, at the next refresh: every 1 s by default in Elasticsearch."
    see: search-index
    source: { title: "Near real-time search (Elasticsearch docs)", url: "https://www.elastic.co/docs/manage-data/data-store/near-real-time-search", verifiedOn: "2026-10-16" }

  - id: change-data-capture
    term: "Change data capture (CDC)"
    aka: [ "CDC", "change data capture" ]
    definition: "Reading a database's change log (such as the MySQL binlog or PostgreSQL WAL) and streaming each change to other systems."
    see: search-index
    source: { title: "Debezium Architecture (Debezium docs)", url: "https://debezium.io/documentation/reference/stable/architecture.html", verifiedOn: "2026-10-16" }

  - id: full-text-search
    term: "Full-text search"
    aka: [ "full text search" ]
    definition: "Searching natural-language text by words, including other forms of a word, and ranking the matches, instead of exact column comparisons."
    see: search-index
    source: { title: "Full Text Search: Introduction (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/textsearch-intro.html", verifiedOn: "2026-10-16" }

  - id: geohash
    term: "Geohash"
    aka: [ "geohashes", "geohashing" ]
    definition: "Encodes a latitude and longitude as one short base32 string by interleaving their bits. Each extra character means a smaller cell."
    see: geospatial-index
    source: { title: "Geohash (Wikipedia)", url: "https://en.wikipedia.org/wiki/Geohash", verifiedOn: "2026-10-16" }

  - id: quadtree
    term: "Quadtree"
    aka: [ "quadtrees", "quad tree" ]
    definition: "A tree that splits a 2D area into four quadrants, and splits a quadrant again when it holds too many points."
    see: geospatial-index
    source: { title: "The Quadtree and Related Hierarchical Data Structures (Hanan Samet, ACM Computing Surveys, 1984)", url: "https://www.cs.umd.edu/users/hjs/pubs/SameCSUR84-ocr.pdf", verifiedOn: "2026-10-16" }

  - id: r-tree
    term: "R-tree"
    aka: [ "R-trees" ]
    definition: "A tree of nested bounding rectangles used to index shapes. PostGIS builds its spatial index as an R-tree on GiST."
    see: geospatial-index
    source: { title: "Spatial indexes: GiST (PostGIS manual)", url: "https://postgis.net/docs/using_postgis_dbmanagement.html", verifiedOn: "2026-10-16" }

  - id: h3
    term: "H3"
    definition: "Uber's open-source grid that splits the world into hexagonal cells; used for pricing and dispatch."
    see: geospatial-index
    source: { title: "H3: Uber's Hexagonal Hierarchical Spatial Index (Uber Engineering blog, 2018)", url: "https://www.uber.com/blog/h3/", verifiedOn: "2026-10-16" }

  - id: bounding-box
    term: "Bounding box"
    aka: [ "bounding boxes" ]
    definition: "The smallest rectangle around a shape. Spatial indexes store these, then test the exact shape only for candidates."
    see: geospatial-index
    source: { title: "Spatial Indexing (PostGIS workshop)", url: "https://postgis.net/workshops/postgis-intro/indexing.html", verifiedOn: "2026-10-16" }

  - id: haversine
    term: "Haversine formula"
    aka: [ "haversine" ]
    definition: "Computes the distance between two latitude/longitude points on a sphere. Redis GEO uses it; error can reach 0.5% on the real Earth."
    see: geospatial-index
    source: { title: "GEOADD: Earth model (Redis docs)", url: "https://redis.io/docs/latest/commands/geoadd/", verifiedOn: "2026-10-16" }

  - id: bloom-filter
    term: "Bloom filter"
    aka: [ "Bloom filters" ]
    definition: "A bit array with k hash functions that answers 'definitely not in the set' or 'maybe in the set', using little memory."
    see: bloom-filter
    source: { title: "Network Applications of Bloom Filters: A Survey (Broder & Mitzenmacher, 2004)", url: "https://www.eecs.harvard.edu/~michaelm/postscripts/im2005b.pdf", verifiedOn: "2026-10-16" }

  - id: false-positive
    term: "False positive"
    aka: [ "false positives" ]
    definition: "A check says 'yes' when the true answer is 'no'. A Bloom filter can give these, but never false negatives."
    see: bloom-filter
    source: { title: "Network Applications of Bloom Filters: A Survey (Broder & Mitzenmacher, 2004)", url: "https://www.eecs.harvard.edu/~michaelm/postscripts/im2005b.pdf", verifiedOn: "2026-10-16" }

  - id: counting-bloom-filter
    term: "Counting Bloom filter"
    aka: [ "counting Bloom filters" ]
    definition: "A Bloom filter with a small counter in each slot instead of one bit, so an item can be removed by decrementing."
    see: bloom-filter
    source: { title: "Network Applications of Bloom Filters: A Survey (Broder & Mitzenmacher, 2004)", url: "https://www.eecs.harvard.edu/~michaelm/postscripts/im2005b.pdf", verifiedOn: "2026-10-16" }

  - id: cuckoo-filter
    term: "Cuckoo filter"
    aka: [ "cuckoo filters" ]
    definition: "A Bloom filter alternative that stores short fingerprints in buckets. It supports deletes and fast checks."
    see: bloom-filter
    source: { title: "Cuckoo filter (Redis docs)", url: "https://redis.io/docs/latest/develop/data-types/probabilistic/cuckoo-filter/", verifiedOn: "2026-10-16" }

  - id: hash-ring
    term: "Hash ring"
    aka: [ "token ring" ]
    definition: "The range of hash values treated as a circle; servers and keys are placed on it, and each key belongs to the next server clockwise."
    see: consistent-hashing
    source: { title: "Dynamo: Amazon's Highly Available Key-value Store (DeCandia et al., SOSP 2007)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf", verifiedOn: "2026-10-16" }

  - id: virtual-nodes
    term: "Virtual node"
    aka: [ "virtual nodes", "vnodes", "vnode" ]
    definition: "One of many points a single server takes on a hash ring, so data spreads evenly and a failed server's load is shared."
    see: consistent-hashing
    source: { title: "Dynamo (Apache Cassandra docs)", url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html", verifiedOn: "2026-10-16" }

  - id: hash-slots
    term: "Hash slot"
    aka: [ "hash slots" ]
    definition: "A fixed bucket a key hashes into; Redis Cluster has 16,384 of them and moves whole slots between nodes."
    see: consistent-hashing
    source: { title: "Scale with Redis Cluster (Redis docs)", url: "https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/", verifiedOn: "2026-10-16" }

  - id: hotspot
    term: "Hotspot"
    aka: [ "hot spot", "hotspots", "hot partition", "hot shard" ]
    definition: "A shard or partition that gets far more load than the others, so it slows down while the rest sit idle."
    see: sharding-and-replication
    source: { title: "Sharding pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding", verifiedOn: "2026-10-16" }

  - id: replication-lag
    term: "Replication lag"
    aka: [ "replica lag" ]
    definition: "How far an asynchronous replica is behind the primary; reads from it can return old data."
    see: sharding-and-replication
    source: { title: "Log-Shipping Standby Servers (PostgreSQL 18 documentation)", url: "https://www.postgresql.org/docs/current/warm-standby.html", verifiedOn: "2026-10-16" }

  - id: read-replica
    term: "Read replica"
    aka: [ "read replicas" ]
    definition: "A read-only copy of a database that serves read queries; Amazon RDS updates it asynchronously from the primary."
    see: sharding-and-replication
    source: { title: "Working with DB instance read replicas (Amazon RDS docs)", url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html", verifiedOn: "2026-10-16" }

  - id: federation
    term: "Federation (databases)"
    aka: [ "functional partitioning" ]
    definition: "Splitting databases by function, such as users, products and forums, instead of keeping one big database."
    see: sharding-and-replication
    source: { title: "The System Design Primer: Federation (donnemartin, GitHub)", url: "https://github.com/donnemartin/system-design-primer", verifiedOn: "2026-10-16" }

  - id: two-phase-commit
    term: "Two-phase commit"
    aka: [ "2PC", "two phase commit" ]
    definition: "A coordinator asks every participant to prepare and vote, then tells all of them to commit, or all to roll back."
    see: distributed-transactions
    source: { title: "XA Transactions (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/xa.html", verifiedOn: "2026-10-16" }

  - id: xa-transactions
    term: "XA transaction"
    aka: [ "XA transactions" ]
    definition: "A global transaction across several databases using the X/Open XA standard, which commits with two-phase commit."
    see: distributed-transactions
    source: { title: "XA Transactions (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/xa.html", verifiedOn: "2026-10-16" }

  - id: saga
    term: "Saga"
    aka: [ "sagas", "saga pattern" ]
    definition: "A long business transaction split into local transactions; if one fails, compensating transactions undo the steps already done."
    see: distributed-transactions
    source: { title: "Sagas (Garcia-Molina & Salem, SIGMOD 1987)", url: "https://www.cs.cornell.edu/andru/cs711/2002fa/reading/sagas.pdf", verifiedOn: "2026-10-16" }

  - id: compensating-transaction
    term: "Compensating transaction"
    aka: [ "compensating transactions", "compensating action", "compensating actions" ]
    definition: "A new action that undoes the effect of an earlier step, like a refund for a charge; it may not restore the exact old state."
    see: distributed-transactions
    source: { title: "Compensating Transaction pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction", verifiedOn: "2026-10-16" }

  - id: pivot-transaction
    term: "Pivot transaction"
    definition: "The point of no return in a saga: once it succeeds, the remaining steps must be retried until they finish, not undone."
    see: distributed-transactions
    source: { title: "Saga design pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga", verifiedOn: "2026-10-16" }

  - id: choreography
    term: "Choreography (sagas)"
    definition: "A saga style with no central controller: each service publishes events that trigger the next service's step."
    see: distributed-transactions
    source: { title: "Saga design pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga", verifiedOn: "2026-10-16" }

  - id: orchestration
    term: "Orchestration (sagas)"
    definition: "A saga style where one orchestrator tells each service which step to run and runs the compensations on failure."
    see: distributed-transactions
    source: { title: "Saga design pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/saga", verifiedOn: "2026-10-16" }

  - id: transactional-outbox
    term: "Transactional outbox"
    aka: [ "outbox pattern", "outbox table" ]
    definition: "Save an outgoing event in an outbox table in the same local transaction as the data; a relay later publishes it."
    see: distributed-transactions
    source: { title: "Pattern: Transactional outbox (Chris Richardson, microservices.io)", url: "https://microservices.io/patterns/data/transactional-outbox.html", verifiedOn: "2026-10-16" }

  - id: uuid
    term: "UUID"
    aka: [ "UUIDs", "GUID", "GUIDs" ]
    definition: "A 128-bit identifier any machine can create without asking a central service; defined in RFC 9562 (2024)."
    see: unique-ids
    source: { title: "RFC 9562: Universally Unique IDentifiers (UUIDs) (IETF, May 2024)", url: "https://www.rfc-editor.org/rfc/rfc9562.html", verifiedOn: "2026-10-16" }

  - id: snowflake-id
    term: "Snowflake ID"
    aka: [ "Snowflake IDs", "Snowflake-style ID", "Snowflake-style IDs" ]
    definition: "A 64-bit ID made of a timestamp, a machine id and a sequence number, so servers create unique, roughly time-sorted IDs alone."
    see: unique-ids
    source: { title: "Snowflake README (Twitter, archived repo, snowflake-2010 tag)", url: "https://github.com/twitter-archive/snowflake/tree/snowflake-2010", verifiedOn: "2026-10-16" }

  - id: db-auto-increment
    term: "Auto-increment"
    aka: [ "AUTO_INCREMENT", "auto-increment ID" ]
    definition: "A database column that gets the next number in a sequence on each insert, such as MySQL AUTO_INCREMENT."
    see: unique-ids
    source: { title: "Using AUTO_INCREMENT (MySQL 8.4 Reference Manual)", url: "https://dev.mysql.com/doc/refman/8.4/en/example-auto-increment.html", verifiedOn: "2026-10-16" }

  - id: ticket-server
    term: "Ticket server"
    aka: [ "ticket servers" ]
    definition: "A database whose only job is to hand out unique IDs from an auto-increment counter, as Flickr did."
    see: unique-ids
    source: { title: "Ticket Servers: Distributed Unique Primary Keys on the Cheap (Flickr Engineering, 2010)", url: "https://code.flickr.net/2010/02/08/ticket-servers-distributed-unique-primary-keys-on-the-cheap/", verifiedOn: "2026-10-16" }

  - id: message-queue
    term: "Message queue"
    definition: "A buffer that holds messages from producers until a consumer takes them; each message is processed by one consumer."
    see: message-queue
    source: { title: "Competing Consumers pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers", verifiedOn: "2026-10-16" }

  - id: pub-sub
    term: "Pub/sub"
    aka: [ "publish-subscribe", "publish/subscribe", "publisher-subscriber" ]
    definition: "Messaging where a publisher sends to a topic and every subscriber gets its own copy, without the publisher knowing who they are."
    see: pub-sub
    source: { title: "Publisher-Subscriber pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber", verifiedOn: "2026-10-16" }

  - id: event-streaming
    term: "Event streaming"
    aka: [ "event stream", "event streams" ]
    definition: "Writing events to a durable, partitioned log that many consumers read, and re-read, at their own pace, as in Apache Kafka."
    see: event-streaming
    source: { title: "Introduction (Apache Kafka docs)", url: "https://kafka.apache.org/intro", verifiedOn: "2026-10-16" }

  - id: message-broker
    term: "Message broker"
    aka: [ "broker" ]
    definition: "A server that receives messages from producers, stores them and delivers them to consumers, e.g. RabbitMQ or a Kafka broker."
    source: { title: "AMQP 0-9-1 Model Explained (RabbitMQ docs)", url: "https://www.rabbitmq.com/tutorials/amqp-concepts", verifiedOn: "2026-10-16" }

  - id: competing-consumers
    term: "Competing consumers"
    definition: "Many consumers read the same queue at once; each message is handled by only one of them, so adding consumers adds throughput."
    see: message-queue
    source: { title: "Competing Consumers pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers", verifiedOn: "2026-10-16" }

  - id: task-queue
    term: "Task queue"
    aka: [ "job queue", "work queue" ]
    definition: "A queue of jobs that background workers run, such as resizing an upload; some, like Celery, can also schedule jobs."
    see: message-queue
    source: { title: "The System Design Primer: Asynchronism (donnemartin, GitHub)", url: "https://github.com/donnemartin/system-design-primer", verifiedOn: "2026-10-16" }

  - id: acknowledgement
    term: "Acknowledgement (messaging)"
    aka: [ "ack", "acked" ]
    definition: "The consumer's signal that it finished a message; only then does the broker delete it. No ack means it can be delivered again."
    see: message-queue
    source: { title: "Consumer Acknowledgements and Publisher Confirms (RabbitMQ docs)", url: "https://www.rabbitmq.com/docs/confirms", verifiedOn: "2026-10-16" }

  - id: visibility-timeout
    term: "Visibility timeout"
    definition: "In Amazon SQS, how long a received message stays hidden from other consumers; if it is not deleted by then, it shows again (default 30 s)."
    see: message-queue
    source: { title: "Amazon SQS visibility timeout (Amazon SQS Developer Guide)", url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html", verifiedOn: "2026-10-16" }

  - id: dead-letter-queue
    term: "Dead-letter queue"
    aka: [ "DLQ", "dead letter queue" ]
    definition: "A side queue that receives messages that failed too many times, so they can be inspected and sent back later."
    see: message-queue
    source: { title: "Using dead-letter queues in Amazon SQS (Amazon SQS Developer Guide)", url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html", verifiedOn: "2026-10-16" }

  - id: poison-message
    term: "Poison message"
    definition: "A message that fails every time it is processed, for example because of bad data; move it to a dead-letter queue."
    see: message-queue
    source: { title: "Competing Consumers pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers", verifiedOn: "2026-10-16" }

  - id: back-pressure
    term: "Back pressure"
    aka: [ "backpressure" ]
    definition: "Pushing back on producers when consumers cannot keep up, e.g. a full queue returns HTTP 503 so clients retry later."
    see: message-queue
    source: { title: "The System Design Primer: Back pressure (donnemartin, GitHub)", url: "https://github.com/donnemartin/system-design-primer", verifiedOn: "2026-10-16" }

  - id: fifo-queue
    term: "FIFO queue"
    aka: [ "FIFO queues" ]
    definition: "A queue that keeps strict first-in, first-out order; in Amazon SQS, per message group, with duplicate sends removed for 5 minutes."
    see: message-queue
    source: { title: "Exactly-once processing in Amazon SQS (Amazon SQS Developer Guide)", url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-exactly-once-processing.html", verifiedOn: "2026-10-16" }

  - id: topic
    term: "Topic"
    definition: "A named channel that producers publish to; subscribers or consumer groups read from it."
    see: pub-sub
    source: { title: "What is Amazon SNS? (Amazon SNS Developer Guide)", url: "https://docs.aws.amazon.com/sns/latest/dg/welcome.html", verifiedOn: "2026-10-16" }

  - id: partition-log
    term: "Partitioned log"
    aka: [ "append-only log" ]
    definition: "A topic split into partitions, each an ordered list of records that only grows at the end; partitions spread over brokers."
    see: event-streaming
    source: { title: "Introduction (Apache Kafka docs)", url: "https://kafka.apache.org/intro", verifiedOn: "2026-10-16" }

  - id: message-key
    term: "Message key"
    aka: [ "event key", "record key" ]
    definition: "A field on a record, like a customer ID, that picks its partition; records with the same key go to the same partition."
    see: event-streaming
    source: { title: "Introduction (Apache Kafka docs)", url: "https://kafka.apache.org/intro", verifiedOn: "2026-10-16" }

  - id: consumer-offset
    term: "Offset (Kafka)"
    aka: [ "committed offset", "consumer offset" ]
    definition: "A record's position number in its partition. A consumer group saves the offset it reached, so it can resume or rewind."
    see: event-streaming
    source: { title: "KafkaConsumer: offsets and consumer position (Apache Kafka 4.3 Javadoc)", url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html", verifiedOn: "2026-10-16" }

  - id: consumer-group
    term: "Consumer group"
    aka: [ "consumer groups" ]
    definition: "Consumers that share one group ID and split a topic's partitions, each partition to one member; each group gets all the data."
    see: event-streaming
    source: { title: "KafkaConsumer: consumer groups (Apache Kafka 4.3 Javadoc)", url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html", verifiedOn: "2026-10-16" }

  - id: consumer-lag
    term: "Consumer lag"
    definition: "How far a consumer group is behind: the newest offset in a partition minus the group's offset."
    see: event-streaming
    source: { title: "Basic Kafka operations: checking consumer position (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/operations/basic-kafka-operations/", verifiedOn: "2026-10-16" }

  - id: share-group
    term: "Share group"
    definition: "Kafka 4.2+ queue-style consumption: many consumers read the same partitions and acknowledge each record on its own."
    see: event-streaming
    source: { title: "Apache Kafka 4.2.0 release announcement", url: "https://kafka.apache.org/blog/2026/02/17/apache-kafka-4.2.0-release-announcement/", verifiedOn: "2026-10-16" }

  - id: message-retention
    term: "Retention (messages)"
    aka: [ "retention period", "message retention" ]
    definition: "How long a broker keeps messages. Kafka keeps records after they are read until time or size runs out (default 7 days)."
    see: event-streaming
    source: { title: "Broker configs (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/configuration/broker-configs/", verifiedOn: "2026-10-16" }

  - id: log-compaction
    term: "Log compaction"
    aka: [ "compacted topic" ]
    definition: "A Kafka cleanup mode that keeps at least the latest record for each key instead of deleting by age."
    see: event-streaming
    source: { title: "Design: log compaction (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/design/design/", verifiedOn: "2026-10-16" }

  - id: event-replay
    term: "Replay"
    aka: [ "re-consume" ]
    definition: "Reading old events again by moving a consumer's offset back, for example after fixing a bug."
    see: event-streaming
    source: { title: "Design: consumer position (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/design/design/", verifiedOn: "2026-10-16" }

  - id: producer
    term: "Producer"
    aka: [ "publisher" ]
    definition: "An application that sends messages to a queue or topic."
    source: { title: "AMQP 0-9-1 Model Explained (RabbitMQ docs)", url: "https://www.rabbitmq.com/tutorials/amqp-concepts", verifiedOn: "2026-10-16" }

  - id: consumer
    term: "Consumer"
    aka: [ "subscriber" ]
    definition: "An application that receives and processes messages from a queue or topic."
    source: { title: "AMQP 0-9-1 Model Explained (RabbitMQ docs)", url: "https://www.rabbitmq.com/tutorials/amqp-concepts", verifiedOn: "2026-10-16" }

  - id: at-most-once
    term: "At-most-once"
    aka: [ "at most once" ]
    definition: "A delivery guarantee: each message arrives zero or one time. It may be lost, but it is never repeated."
    see: delivery-guarantees
    source: { title: "Design: Message Delivery Semantics (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/design/design/", verifiedOn: "2026-10-16" }

  - id: at-least-once
    term: "At-least-once"
    aka: [ "at least once" ]
    definition: "A delivery guarantee: each message arrives one or more times. Nothing is lost, but duplicates can happen. Kafka's default."
    see: delivery-guarantees
    source: { title: "Design: Message Delivery Semantics (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/design/design/", verifiedOn: "2026-10-16" }

  - id: exactly-once
    term: "Exactly-once"
    aka: [ "exactly once", "effectively once", "effectively-once" ]
    definition: "Each message's effect happens once. In practice: at-least-once delivery plus deduplication or transactions."
    see: delivery-guarantees
    source: { title: "Idempotent Consumer pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/idempotent-consumer", verifiedOn: "2026-10-16" }

  - id: idempotent-consumer
    term: "Idempotent consumer"
    aka: [ "idempotent consumers" ]
    definition: "A consumer that records the IDs of messages it has processed and skips repeats, so a redelivery changes nothing."
    see: delivery-guarantees
    source: { title: "Idempotent Consumer pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/idempotent-consumer", verifiedOn: "2026-10-16" }

  - id: idempotent-producer
    term: "Idempotent producer"
    definition: "A Kafka producer mode: the broker uses a producer ID and sequence numbers to drop messages the producer resent."
    see: delivery-guarantees
    source: { title: "Design: Message Delivery Semantics (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/design/design/", verifiedOn: "2026-10-16" }

  - id: kafka-transactions
    term: "Kafka transactions"
    aka: [ "transactional producer" ]
    definition: "Write to several Kafka partitions, plus consumer offsets, all or nothing. read_committed consumers see only committed data."
    see: delivery-guarantees
    source: { title: "Design: Message Delivery Semantics (Apache Kafka 4.3 docs)", url: "https://kafka.apache.org/43/design/design/", verifiedOn: "2026-10-16" }

  - id: sqs-fifo-dedup
    term: "Message deduplication ID"
    aka: [ "deduplication ID", "dedupe ID" ]
    definition: "An ID on an SQS FIFO message. A resend with the same ID within the 5-minute deduplication interval adds no new copy."
    see: delivery-guarantees
    source: { title: "Exactly-once processing in Amazon SQS (AWS docs)", url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-exactly-once-processing.html", verifiedOn: "2026-10-16" }

  - id: batch-processing
    term: "Batch processing"
    aka: [ "batch job" ]
    definition: "Processing a bounded dataset all at once, usually on a schedule, such as a nightly job over yesterday's logs."
    see: batch-and-stream
    source: { title: "What is Apache Flink? Architecture: bounded and unbounded streams (Apache Flink)", url: "https://flink.apache.org/what-is-flink/flink-architecture/", verifiedOn: "2026-10-16" }

  - id: stream-processing
    term: "Stream processing"
    aka: [ "stream job", "stream processor" ]
    definition: "Processing an unbounded stream continuously, event by event, as the data arrives."
    see: batch-and-stream
    source: { title: "What is Apache Flink? Architecture: bounded and unbounded streams (Apache Flink)", url: "https://flink.apache.org/what-is-flink/flink-architecture/", verifiedOn: "2026-10-16" }

  - id: bounded-data
    term: "Bounded data"
    aka: [ "bounded stream", "bounded dataset" ]
    definition: "Data with a defined start and end, like one day of logs. It can be fully collected before processing (batch)."
    see: batch-and-stream
    source: { title: "What is Apache Flink? Architecture: bounded and unbounded streams (Apache Flink)", url: "https://flink.apache.org/what-is-flink/flink-architecture/", verifiedOn: "2026-10-16" }

  - id: unbounded-data
    term: "Unbounded data"
    aka: [ "unbounded stream" ]
    definition: "Data with a start but no defined end, like a click stream. It is never complete, so it must be processed continuously."
    see: batch-and-stream
    source: { title: "What is Apache Flink? Architecture: bounded and unbounded streams (Apache Flink)", url: "https://flink.apache.org/what-is-flink/flink-architecture/", verifiedOn: "2026-10-16" }

  - id: mapreduce
    term: "MapReduce"
    definition: "Google's batch model (2004): map turns each record into key/value pairs; reduce merges all values that share a key."
    see: batch-and-stream
    source: { title: "MapReduce: Simplified Data Processing on Large Clusters (Dean and Ghemawat, OSDI 2004)", url: "https://www.usenix.org/legacy/events/osdi04/tech/full_papers/dean/dean.pdf", verifiedOn: "2026-10-16" }

  - id: tumbling-window
    term: "Tumbling window"
    definition: "A fixed-size time window that does not overlap the next one, so each event belongs to exactly one window."
    see: batch-and-stream
    source: { title: "Windows (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", verifiedOn: "2026-10-16" }

  - id: sliding-time-window
    term: "Sliding window (stream)"
    aka: [ "hopping window" ]
    definition: "A fixed-size time window that starts every slide interval; when the slide is smaller than the size, windows overlap."
    see: batch-and-stream
    source: { title: "Windows (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", verifiedOn: "2026-10-16" }

  - id: session-window
    term: "Session window"
    definition: "A window that groups events by activity and closes after a gap with no events, so it has no fixed start or end."
    see: batch-and-stream
    source: { title: "Windows (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", verifiedOn: "2026-10-16" }

  - id: event-time
    term: "Event time"
    definition: "The time an event happened on the device that produced it, as opposed to processing time, when a machine handles it."
    see: batch-and-stream
    source: { title: "Timely Stream Processing: event time and watermarks (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/", verifiedOn: "2026-10-16" }

  - id: watermark
    term: "Watermark"
    aka: [ "watermarks" ]
    definition: "A marker in a stream saying event time has reached t, so no more events at or before t are expected. Later ones are late."
    see: batch-and-stream
    source: { title: "Timely Stream Processing: event time and watermarks (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/", verifiedOn: "2026-10-16" }

  - id: allowed-lateness
    term: "Allowed lateness"
    definition: "How long a window keeps accepting events after the watermark passes its end. Flink's default is 0: late events are dropped."
    see: batch-and-stream
    source: { title: "Windows (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", verifiedOn: "2026-10-16" }

  - id: side-output
    term: "Side output"
    definition: "An extra output stream in Flink; late events can be sent there instead of being dropped."
    see: batch-and-stream
    source: { title: "Windows (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/operators/windows/", verifiedOn: "2026-10-16" }

  - id: stream-checkpoint
    term: "Checkpoint (stream processing)"
    definition: "A consistent snapshot of a stream job's state. After a crash, the job restores it and replays input from that point."
    see: batch-and-stream
    source: { title: "Stateful Stream Processing: checkpointing (Apache Flink 2.3 docs)", url: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/", verifiedOn: "2026-10-16" }

  - id: micro-batch
    term: "Micro-batch"
    aka: [ "micro-batching" ]
    definition: "Running a stream as a series of small batch jobs. Spark Structured Streaming does this, with latency from about 100 ms."
    see: batch-and-stream
    source: { title: "Structured Streaming Programming Guide (Apache Spark 4.2.0 docs)", url: "https://spark.apache.org/docs/latest/streaming/index.html", verifiedOn: "2026-10-16" }

  - id: lambda-architecture
    term: "Lambda architecture"
    definition: "Running a batch system and a stream system side by side on the same input and merging their results at query time."
    see: batch-and-stream
    source: { title: "Questioning the Lambda Architecture (Jay Kreps, O'Reilly Radar, 2014)", url: "https://www.oreilly.com/radar/questioning-the-lambda-architecture/", verifiedOn: "2026-10-16" }

  - id: kappa-architecture
    term: "Kappa architecture"
    definition: "Only a stream processor; to reprocess, replay the retained log (for example in Kafka) through a new job and switch over."
    see: batch-and-stream
    source: { title: "Questioning the Lambda Architecture (Jay Kreps, O'Reilly Radar, 2014)", url: "https://www.oreilly.com/radar/questioning-the-lambda-architecture/", verifiedOn: "2026-10-16" }

  - id: event-sourcing
    term: "Event sourcing"
    definition: "Storing every change to state as an event in an append-only log, and rebuilding the state by replaying those events."
    see: event-sourcing-cqrs
    source: { title: "Event Sourcing (Martin Fowler, 2005)", url: "https://martinfowler.com/eaaDev/EventSourcing.html", verifiedOn: "2026-10-16" }

  - id: event-store
    term: "Event store"
    definition: "The append-only database that holds each entity's stream of events; the source of truth in event sourcing."
    see: event-sourcing-cqrs
    source: { title: "Event Sourcing pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing", verifiedOn: "2026-10-16" }

  - id: event-snapshot
    term: "Snapshot (event sourcing)"
    definition: "The saved state of an entity at a point in its event stream, so a rebuild replays only the events after it."
    see: event-sourcing-cqrs
    source: { title: "Event Sourcing pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing", verifiedOn: "2026-10-16" }

  - id: compensating-event
    term: "Compensating event"
    aka: [ "compensating events" ]
    definition: "A new event that reverses or corrects an earlier one. Stored events are never edited, so this is how you undo."
    see: event-sourcing-cqrs
    source: { title: "Event Sourcing pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing", verifiedOn: "2026-10-16" }

  - id: upcasting
    term: "Upcasting"
    aka: [ "upcast", "upcaster" ]
    definition: "Converting an old version of a stored event to the current format while reading it, without changing the stored event."
    see: event-sourcing-cqrs
    source: { title: "Event Sourcing pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing", verifiedOn: "2026-10-16" }

  - id: cqrs
    term: "CQRS"
    aka: [ "Command Query Responsibility Segregation" ]
    definition: "Command Query Responsibility Segregation: one model handles writes (commands) and a separate model handles reads (queries)."
    see: event-sourcing-cqrs
    source: { title: "CQRS (Martin Fowler, bliki, 2011)", url: "https://martinfowler.com/bliki/CQRS.html", verifiedOn: "2026-10-16" }

  - id: command-model
    term: "Write model"
    aka: [ "command model", "write side" ]
    definition: "In CQRS, the model that handles commands: it validates input, applies business rules and changes data."
    see: event-sourcing-cqrs
    source: { title: "CQRS pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs", verifiedOn: "2026-10-16" }

  - id: read-model
    term: "Read model"
    aka: [ "query model", "read side" ]
    definition: "In CQRS, the model that serves queries: data shaped for each screen, often denormalised, with no business logic."
    see: event-sourcing-cqrs
    source: { title: "CQRS pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs", verifiedOn: "2026-10-16" }

  - id: projection
    term: "Projection (event sourcing)"
    definition: "A read-only view built by applying events, such as an order list for the UI. It can be rebuilt at any time by replaying."
    see: event-sourcing-cqrs
    source: { title: "Event Sourcing pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing", verifiedOn: "2026-10-16" }

  - id: failover
    term: "Failover"
    aka: [ "fail over", "fail-over" ]
    definition: "Switching work from a failed instance to a healthy one, for example by promoting a standby to primary."
    see: redundancy-failover
    source: { title: "Failover and failback (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-failover-failback", verifiedOn: "2026-10-16" }

  - id: failback
    term: "Failback"
    aka: [ "fail back" ]
    definition: "Moving work back to the original primary after it recovers; syncing the data written meanwhile is the hard part."
    see: redundancy-failover
    source: { title: "Failover and failback (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-failover-failback", verifiedOn: "2026-10-16" }

  - id: active-passive
    term: "Active-passive"
    aka: [ "active/passive" ]
    definition: "Only the primary copy serves traffic; passive copies stay ready and take over on failover."
    see: redundancy-failover
    source: { title: "Redundancy, replication, and backup (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-redundancy-replication-backup", verifiedOn: "2026-10-16" }

  - id: active-active
    term: "Active-active"
    aka: [ "active/active" ]
    definition: "Every copy serves traffic at the same time, so there is no standby to promote when one fails."
    see: redundancy-failover
    source: { title: "Failover and failback (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-failover-failback", verifiedOn: "2026-10-16" }

  - id: fencing
    term: "Fencing (STONITH)"
    aka: [ "fencing", "STONITH" ]
    definition: "Making a node unable to run, even if it is unresponsive, so a failed old primary cannot keep acting as primary."
    see: redundancy-failover
    source: { title: "Fencing (Pacemaker Explained, ClusterLabs)", url: "https://clusterlabs.org/projects/pacemaker/doc/3.0/Pacemaker_Explained/html/fencing.html", verifiedOn: "2026-10-16" }

  - id: hot-standby
    term: "Hot standby"
    definition: "A standby copy that is running and ready to take production traffic at any time."
    see: redundancy-failover
    source: { title: "Failover and failback (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-failover-failback", verifiedOn: "2026-10-16" }

  - id: cold-standby
    term: "Cold standby"
    definition: "A standby that is not running or not even deployed; it must be started first, so recovery takes longer."
    see: redundancy-failover
    source: { title: "Failover and failback (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-failover-failback", verifiedOn: "2026-10-16" }

  - id: availability-zone
    term: "Availability zone"
    aka: [ "AZ" ]
    definition: "One or more data centres in a cloud region, isolated from faults in the region's other zones."
    source: { title: "Disaster recovery is different in the cloud (AWS whitepaper)", url: "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-is-different-in-the-cloud.html", verifiedOn: "2026-10-16" }

  - id: multi-az
    term: "Multi-AZ"
    aka: [ "zone redundancy", "zone-redundant" ]
    definition: "Running copies in two or more availability zones, so the loss of one data centre does not stop the service."
    see: redundancy-failover
    source: { title: "Redundancy, replication, and backup (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-redundancy-replication-backup", verifiedOn: "2026-10-16" }

  - id: multi-region
    term: "Multi-region"
    aka: [ "geo-redundancy", "geo-redundant" ]
    definition: "Running copies in two or more distant regions to survive a whole-region outage, at higher cost and latency."
    see: redundancy-failover
    source: { title: "Redundancy, replication, and backup (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-redundancy-replication-backup", verifiedOn: "2026-10-16" }

  - id: high-availability
    term: "High availability"
    aka: [ "HA", "highly available" ]
    definition: "Staying up through everyday faults, like a failed server or zone, by using redundancy and failover."
    source: { title: "What are business continuity, high availability, and disaster recovery? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-business-continuity-high-availability-disaster-recovery", verifiedOn: "2026-10-16" }

  - id: observability
    term: "Observability"
    definition: "Understanding what a running system is doing from the data it emits: metrics, logs and traces."
    see: observability
    source: { title: "Observability primer (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/concepts/observability-primer/", verifiedOn: "2026-10-16" }

  - id: golden-signals
    term: "Four golden signals"
    aka: [ "golden signals" ]
    definition: "Latency, traffic, errors and saturation: the four things Google SRE says to measure for a user-facing system."
    see: observability
    source: { title: "Monitoring Distributed Systems (Google SRE Book)", url: "https://sre.google/sre-book/monitoring-distributed-systems/", verifiedOn: "2026-10-16" }

  - id: traces
    term: "Trace (distributed)"
    aka: [ "distributed trace", "distributed tracing" ]
    definition: "The recorded path of one request through every service it touched, made of timed spans."
    see: observability
    source: { title: "Traces (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/concepts/signals/traces/", verifiedOn: "2026-10-16" }

  - id: span
    term: "Span (tracing)"
    aka: [ "timed span", "trace span" ]
    definition: "One timed operation inside a trace, with the trace ID, its own span ID and its parent's span ID."
    see: observability
    source: { title: "Traces (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/concepts/signals/traces/", verifiedOn: "2026-10-16" }

  - id: context-propagation
    term: "Context propagation"
    aka: [ "trace context" ]
    definition: "Passing the trace ID and span ID from one service to the next, usually in a request header such as traceparent."
    see: observability
    source: { title: "Context propagation (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/concepts/context-propagation/", verifiedOn: "2026-10-16" }

  - id: trace-sampling
    term: "Trace sampling"
    aka: [ "head sampling", "tail sampling" ]
    definition: "Keeping only a share of traces to cut cost; head sampling decides at the start, tail sampling after seeing the trace."
    see: observability
    source: { title: "Sampling (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/concepts/sampling/", verifiedOn: "2026-10-16" }

  - id: high-cardinality
    term: "High cardinality"
    definition: "Many distinct values in a field, like user IDs. As a metric label, each value creates a new time series."
    see: observability
    source: { title: "Metric and label naming (Prometheus docs)", url: "https://prometheus.io/docs/practices/naming/", verifiedOn: "2026-10-16" }

  - id: structured-logging
    term: "Structured logs"
    aka: [ "structured logging", "structured log" ]
    definition: "Logs with a fixed schema of typed fields, often JSON, so they can be searched and queried at scale."
    see: observability
    source: { title: "Logs (OpenTelemetry docs)", url: "https://opentelemetry.io/docs/concepts/signals/logs/", verifiedOn: "2026-10-16" }

  - id: correlation-id
    term: "Correlation ID"
    aka: [ "request ID" ]
    definition: "A unique ID attached to every event of one request across components, so its logs and traces can be joined."
    see: observability
    source: { title: "Architecture strategies for designing a monitoring system (Azure Well-Architected, OE:07)", url: "https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/observability", verifiedOn: "2026-10-16" }

  - id: burn-rate
    term: "Burn rate"
    definition: "How fast a service uses up its error budget, relative to the SLO; 1 means the budget runs out exactly at the window's end."
    see: observability
    source: { title: "Alerting on SLOs (Google SRE Workbook)", url: "https://sre.google/workbook/alerting-on-slos/", verifiedOn: "2026-10-16" }

  - id: rpo
    term: "RPO"
    aka: [ "recovery point objective" ]
    definition: "The most data you accept losing in a disaster, measured as time since the last recovery point, e.g. 15 minutes."
    see: disaster-recovery
    source: { title: "Business Continuity Plan (BCP): Recovery objectives (AWS whitepaper)", url: "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/business-continuity-plan-bcp.html", verifiedOn: "2026-10-16" }

  - id: rto
    term: "RTO"
    aka: [ "recovery time objective" ]
    definition: "The longest acceptable delay between a service interruption and restoring the service, e.g. 1 hour."
    see: disaster-recovery
    source: { title: "Business Continuity Plan (BCP): Recovery objectives (AWS whitepaper)", url: "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/business-continuity-plan-bcp.html", verifiedOn: "2026-10-16" }

  - id: disaster-recovery
    term: "Disaster recovery"
    aka: [ "DR" ]
    definition: "Plans and tools to bring a whole workload back after a rare, major event such as a region outage, data loss or ransomware."
    see: disaster-recovery
    source: { title: "What are business continuity, high availability, and disaster recovery? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-business-continuity-high-availability-disaster-recovery", verifiedOn: "2026-10-16" }

  - id: pilot-light
    term: "Pilot light"
    definition: "A DR strategy: data is replicated live to the recovery region, but app servers stay off until a failover."
    see: disaster-recovery
    source: { title: "REL13-BP02 Use defined recovery strategies (AWS Well-Architected)", url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html", verifiedOn: "2026-10-16" }

  - id: warm-standby
    term: "Warm standby"
    definition: "A DR strategy: a scaled-down but working copy always runs in the recovery region and scales up on failover."
    see: disaster-recovery
    source: { title: "REL13-BP02 Use defined recovery strategies (AWS Well-Architected)", url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html", verifiedOn: "2026-10-16" }

  - id: point-in-time-recovery
    term: "Point-in-time recovery"
    aka: [ "PITR", "point-in-time restore" ]
    definition: "Restoring data to a chosen moment within the backup retention window, using backups plus saved transaction logs."
    see: disaster-recovery
    source: { title: "Restoring a DB instance to a specified time (Amazon RDS User Guide)", url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html", verifiedOn: "2026-10-16" }

  - id: backup
    term: "Backup"
    definition: "A timestamped copy of data, kept apart from the live data, used to restore it after loss or corruption."
    see: disaster-recovery
    source: { title: "Redundancy, replication, and backup (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/reliability/concept-redundancy-replication-backup", verifiedOn: "2026-10-16" }

  - id: infrastructure-as-code
    term: "Infrastructure as code"
    aka: [ "IaC" ]
    definition: "Defining servers, networks and settings in files, so an environment can be rebuilt the same way, fast."
    source: { title: "Disaster recovery options in the cloud (AWS whitepaper)", url: "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html", verifiedOn: "2026-10-16" }

  - id: timeout
    term: "Timeout"
    definition: "A limit on how long a caller waits for an answer. When it runs out, the caller stops waiting and handles the failure."
    see: timeouts-retries
    source: { title: "REL05-BP05 Set client timeouts (AWS Well-Architected)", url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_client_timeouts.html", verifiedOn: "2026-10-16" }

  - id: transient-fault
    term: "Transient fault"
    aka: [ "transient error", "transient failure", "transient faults", "transient errors" ]
    definition: "A short-lived failure, such as a dropped connection or a brief overload, that often succeeds if tried again after a short delay."
    see: timeouts-retries
    source: { title: "Retry pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/retry", verifiedOn: "2026-10-16" }

  - id: exponential-backoff
    term: "Exponential backoff"
    aka: [ "backoff", "back off" ]
    definition: "Waiting longer after each failed try, usually doubling the wait, up to a maximum (the cap)."
    see: timeouts-retries
    source: { title: "Timeouts, retries, and backoff with jitter (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", verifiedOn: "2026-10-16" }

  - id: jitter
    term: "Jitter"
    definition: "Randomness added to a wait time, so many clients that failed together do not all retry at the same moment."
    see: timeouts-retries
    source: { title: "Exponential Backoff And Jitter (AWS Architecture Blog, Marc Brooker, 2015)", url: "https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/", verifiedOn: "2026-10-16" }

  - id: retry-storm
    term: "Retry storm"
    definition: "Many clients retrying too often at once, which keeps a busy or failed service from recovering."
    see: timeouts-retries
    source: { title: "Retry Storm antipattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/antipatterns/retry-storm/", verifiedOn: "2026-10-16" }

  - id: retry-budget
    term: "Retry budget"
    definition: "A cap on retries, per request or as a share of all requests (for example under 10%), so retries cannot multiply the load."
    see: timeouts-retries
    source: { title: "Handling Overload (Google SRE Book)", url: "https://sre.google/sre-book/handling-overload/", verifiedOn: "2026-10-16" }

  - id: deadline-propagation
    term: "Deadline propagation"
    definition: "Passing the time left on the original request to every downstream call, so no service keeps working after the caller gave up."
    see: timeouts-retries
    source: { title: "Addressing Cascading Failures (Google SRE Book)", url: "https://sre.google/sre-book/addressing-cascading-failures/", verifiedOn: "2026-10-16" }

  - id: circuit-breaker
    term: "Circuit breaker"
    definition: "A wrapper around a remote call that stops calling after too many failures, fails fast for a while, then tests if the service is back."
    see: circuit-breaker
    source: { title: "CircuitBreaker (Martin Fowler, bliki)", url: "https://martinfowler.com/bliki/CircuitBreaker.html", verifiedOn: "2026-10-16" }

  - id: half-open
    term: "Half-open"
    definition: "The circuit breaker state that lets a few trial calls through to test whether the failing service has recovered."
    see: circuit-breaker
    source: { title: "Circuit Breaker pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker", verifiedOn: "2026-10-16" }

  - id: fail-fast
    term: "Fail fast"
    aka: [ "fails fast", "failing fast" ]
    definition: "Return an error at once instead of waiting on an operation that is likely to fail."
    see: circuit-breaker
    source: { title: "Circuit Breaker pattern (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker", verifiedOn: "2026-10-16" }

  - id: fallback
    term: "Fallback"
    definition: "A simpler backup answer, such as cached or default data, returned when the normal call fails or is blocked."
    see: circuit-breaker
    source: { title: "Avoiding fallback in distributed systems (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/avoiding-fallback-in-distributed-systems/", verifiedOn: "2026-10-16" }

  - id: cascading-failure
    term: "Cascading failure"
    definition: "A failure that spreads: one overloaded part fails, its load moves to the others, and they fail too."
    see: load-shedding
    source: { title: "Addressing Cascading Failures (Google SRE Book)", url: "https://sre.google/sre-book/addressing-cascading-failures/", verifiedOn: "2026-10-16" }

  - id: load-shedding
    term: "Load shedding"
    aka: [ "shed load", "shedding load" ]
    definition: "Rejecting some requests on purpose when overloaded, so the requests that are accepted still succeed quickly."
    see: load-shedding
    source: { title: "Using load shedding to avoid overload (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/", verifiedOn: "2026-10-16" }

  - id: graceful-degradation
    term: "Graceful degradation"
    aka: [ "degrades gracefully", "degrade gracefully" ]
    definition: "Keeping the core function working during a failure by doing less, such as serving cached, partial or simpler results."
    see: load-shedding
    source: { title: "REL05-BP01 Implement graceful degradation (AWS Well-Architected)", url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_graceful_degradation.html", verifiedOn: "2026-10-16" }

  - id: goodput
    term: "Goodput"
    definition: "The part of throughput that is answered without errors and fast enough for the client to use."
    see: load-shedding
    source: { title: "Using load shedding to avoid overload (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/", verifiedOn: "2026-10-16" }

  - id: strong-consistency
    term: "Strong consistency"
    aka: [ "strongly consistent" ]
    definition: "After a write completes, every later read returns it. In practice it usually means linearizable."
    see: consistency-models
    source: { title: "Eventually Consistent - Revisited (Werner Vogels, 2008)", url: "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html", verifiedOn: "2026-10-16" }

  - id: causal-consistency
    term: "Causal consistency"
    aka: [ "causally consistent" ]
    definition: "Writes that depend on each other are seen in the same order by everyone; unrelated writes may be seen in different orders."
    see: consistency-models
    source: { title: "Causal (Jepsen consistency models)", url: "https://jepsen.io/consistency/models/causal", verifiedOn: "2026-10-16" }

  - id: read-your-writes
    term: "Read-your-writes"
    aka: [ "read your writes", "read-your-own-writes" ]
    definition: "A client always sees its own earlier writes, even if other clients do not see them yet."
    see: consistency-models
    source: { title: "Read Your Writes (Jepsen consistency models)", url: "https://jepsen.io/consistency/models/read-your-writes", verifiedOn: "2026-10-16" }

  - id: monotonic-reads
    term: "Monotonic reads"
    aka: [ "monotonic read" ]
    definition: "Once a client has seen a value, its later reads never return an older one."
    see: consistency-models
    source: { title: "Monotonic Reads (Jepsen consistency models)", url: "https://jepsen.io/consistency/models/monotonic-reads", verifiedOn: "2026-10-16" }

  - id: pacelc
    term: "PACELC"
    definition: "If there is a Partition, trade Availability against Consistency; Else, trade Latency against Consistency (Daniel Abadi, 2012)."
    see: cap-theorem
    source: { title: "Consistency Tradeoffs in Modern Distributed Database System Design (Daniel Abadi, 2012)", url: "https://www.cs.umd.edu/~abadi/papers/abadi-pacelc.pdf", verifiedOn: "2026-10-15" }

  - id: quorum
    term: "Quorum"
    aka: [ "quorums" ]
    definition: "The minimum number of replicas that must answer for a read or write to succeed, often a majority."
    see: quorum
    source: { title: "Dynamo: tunable consistency (Apache Cassandra 5.0 docs)", url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html", verifiedOn: "2026-10-16" }

  - id: replication-factor
    term: "Replication factor"
    aka: [ "RF" ]
    definition: "How many copies of each piece of data the system keeps, for example 3. Often written N."
    see: quorum
    source: { title: "Dynamo: tunable consistency (Apache Cassandra 5.0 docs)", url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html", verifiedOn: "2026-10-16" }

  - id: tunable-consistency
    term: "Tunable consistency"
    aka: [ "consistency level", "consistency levels" ]
    definition: "Choosing per request how many replicas must answer, such as Cassandra's ONE, QUORUM or ALL."
    see: quorum
    source: { title: "Dynamo: tunable consistency (Apache Cassandra 5.0 docs)", url: "https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html", verifiedOn: "2026-10-16" }

  - id: sloppy-quorum
    term: "Sloppy quorum"
    definition: "When some home replicas are down, reads and writes use the first N healthy nodes instead. Dynamo does this to stay writable."
    see: quorum
    source: { title: "Dynamo: Amazon's Highly Available Key-value Store (DeCandia et al., SOSP 2007)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf", verifiedOn: "2026-10-16" }

  - id: hinted-handoff
    term: "Hinted handoff"
    definition: "A stand-in node keeps a write meant for a replica that is down, with a hint, and sends it on when that replica returns."
    see: quorum
    source: { title: "Dynamo: Amazon's Highly Available Key-value Store (DeCandia et al., SOSP 2007)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf", verifiedOn: "2026-10-16" }

  - id: read-repair
    term: "Read repair"
    definition: "When a read finds replicas with an old version, the newer version is written back to them."
    source: { title: "Dynamo: Amazon's Highly Available Key-value Store (DeCandia et al., SOSP 2007)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf", verifiedOn: "2026-10-16" }

  - id: consensus
    term: "Consensus"
    definition: "Getting several servers to agree on one value, such as the leader or the next log entry, even when some of them fail."
    see: consensus
    source: { title: "The Raft Consensus Algorithm (raft.github.io)", url: "https://raft.github.io/", verifiedOn: "2026-10-16" }

  - id: leader-election
    term: "Leader election"
    definition: "Choosing one node to coordinate the others. In Raft, a candidate needs votes from a majority to become leader."
    see: consensus
    source: { title: "In Search of an Understandable Consensus Algorithm (Ongaro & Ousterhout, 2014)", url: "https://raft.github.io/raft.pdf", verifiedOn: "2026-10-16" }

  - id: raft
    term: "Raft"
    definition: "A leader-based consensus algorithm (Ongaro and Ousterhout, 2014) designed to be easier to understand than Paxos. etcd uses it."
    see: consensus
    source: { title: "In Search of an Understandable Consensus Algorithm (Ongaro & Ousterhout, 2014)", url: "https://raft.github.io/raft.pdf", verifiedOn: "2026-10-16" }

  - id: paxos
    term: "Paxos"
    definition: "Leslie Lamport's consensus algorithm: proposers suggest a value, and it is chosen once a majority of acceptors accept it."
    see: consensus
    source: { title: "Paxos Made Simple (Leslie Lamport, 2001)", url: "https://lamport.azurewebsites.net/pubs/paxos-simple.pdf", verifiedOn: "2026-10-16" }

  - id: zab
    term: "Zab"
    aka: [ "ZooKeeper Atomic Broadcast" ]
    definition: "ZooKeeper's leader-based atomic broadcast protocol, similar to Paxos, that delivers state changes to all servers in one order."
    see: consensus
    source: { title: "Zab1.0 (Apache ZooKeeper wiki)", url: "https://cwiki.apache.org/confluence/display/ZOOKEEPER/Zab1.0", verifiedOn: "2026-10-16" }

  - id: split-brain
    term: "Split brain"
    aka: [ "split-brain" ]
    definition: "After a network partition, two groups of nodes each act as the owner or leader and accept conflicting writes."
    see: consensus
    source: { title: "Understand cluster and pool quorum (Microsoft Learn, Windows Server and Azure Local)", url: "https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/quorum", verifiedOn: "2026-10-16" }

  - id: heartbeat
    term: "Heartbeat"
    aka: [ "heartbeats" ]
    definition: "A small message sent at a fixed interval to show a node is alive. When heartbeats stop, others start failover or an election."
    source: { title: "Tuning (etcd v3.6 docs)", url: "https://etcd.io/docs/v3.6/tuning/", verifiedOn: "2026-10-16" }

  - id: election-timeout
    term: "Election timeout"
    definition: "How long a Raft follower waits without hearing from the leader before it starts an election. etcd v3.6 default: 1000 ms."
    see: consensus
    source: { title: "Tuning (etcd v3.6 docs)", url: "https://etcd.io/docs/v3.6/tuning/", verifiedOn: "2026-10-16" }
