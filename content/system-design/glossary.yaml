# Interviewer terms, one line each. `aka` = other words that link to the same term.
# `see` = the card that explains it fully (optional).
terms:
  - id: latency
    term: Latency
    definition: "How long one request takes to get its response, usually measured in milliseconds."
    source:
      title: "Service Level Objectives (Google SRE Book)"
      url: "https://sre.google/sre-book/service-level-objectives/"
      verifiedOn: "2026-10-15"

  - id: throughput
    term: Throughput
    definition: "How much work a system finishes per unit of time, often requests per second."
    source:
      title: "Service Level Objectives (Google SRE Book)"
      url: "https://sre.google/sre-book/service-level-objectives/"
      verifiedOn: "2026-10-15"

  - id: availability
    term: "Availability (nines)"
    aka: ["nines"]
    definition: "Share of time a service is usable. 99.9% allows about 8.8 hours of downtime a year; 99.99% about 53 minutes."
    source:
      title: "Availability Table (Google SRE Book, Appendix A)"
      url: "https://sre.google/sre-book/availability-table/"
      verifiedOn: "2026-10-15"

  - id: single-point-of-failure
    term: Single point of failure
    aka: ["SPOF"]
    definition: "One part whose failure stops the whole system. Remove it with redundancy."
    source:
      title: "Redundancy, replication, and backup (Microsoft Learn)"
      url: "https://learn.microsoft.com/en-us/azure/reliability/concept-redundancy-replication-backup"
      verifiedOn: "2026-10-15"

  - id: vertical-scaling
    term: Vertical scaling
    aka: ["scale up", "scaling up"]
    definition: "Adding more CPU, memory, or disk to one existing machine."
    see: scalability
    source:
      title: "Architecture strategies for optimizing scaling and partitioning (Azure Well-Architected)"
      url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/scale-partition"
      verifiedOn: "2026-10-15"

  - id: horizontal-scaling
    term: Horizontal scaling
    aka: ["scale out", "scaling out"]
    definition: "Adding more machines (instances) and sharing the work between them."
    see: scalability
    source:
      title: "Architecture strategies for optimizing scaling and partitioning (Azure Well-Architected)"
      url: "https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/scale-partition"
      verifiedOn: "2026-10-15"

  - id: stateless
    term: Stateless server
    aka: ["stateless"]
    definition: "A server that keeps no session data between requests, so any copy can handle any request."
    see: scalability
    source:
      title: "REL05-BP06 Make systems stateless where possible (AWS Well-Architected)"
      url: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_stateless.html"
      verifiedOn: "2026-10-15"

  - id: sticky-session
    term: Sticky session
    aka: ["sticky sessions", "session affinity"]
    definition: "The load balancer keeps sending one client to the same server, often using a cookie."
    see: load-balancer
    source:
      title: "Edit target group attributes for your Application Load Balancer (AWS docs)"
      url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html"
      verifiedOn: "2026-10-15"

  - id: health-check
    term: Health check
    definition: "A regular probe a load balancer sends to each server; servers that fail stop getting traffic."
    see: load-balancer
    source:
      title: "Health checks for Application Load Balancer target groups (AWS docs)"
      url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html"
      verifiedOn: "2026-10-15"

  - id: ttl
    term: TTL
    aka: ["time to live"]
    definition: "A timeout on a cached key; when it runs out, the key is deleted automatically."
    see: cache-aside
    source:
      title: "EXPIRE (Redis docs)"
      url: "https://redis.io/docs/latest/commands/expire/"
      verifiedOn: "2026-10-15"

  - id: eviction
    term: Eviction
    aka: ["evicts", "evicted"]
    definition: "Removing keys from a full cache to make room, chosen by a policy such as LRU or LFU."
    see: cache-aside
    source:
      title: "Key eviction (Redis docs)"
      url: "https://redis.io/docs/latest/develop/reference/eviction/"
      verifiedOn: "2026-10-15"

  - id: thundering-herd
    term: Thundering herd
    aka: ["cache stampede"]
    definition: "Many requests miss the cache for the same hot key at once, often right after it expires or is invalidated, and all hit the database."
    see: cache-aside
    source:
      title: "Scaling Memcache at Facebook (Nishtala et al., NSDI 2013)"
      url: "https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf"
      verifiedOn: "2026-10-15"

  - id: linearizability
    term: Linearizability
    aka: ["linearizable"]
    definition: "Every operation seems to happen at one instant, in real-time order, as if there were one copy of the data."
    see: cap-theorem
    source:
      title: "Linearizability (Jepsen consistency models)"
      url: "https://jepsen.io/consistency/models/linearizable"
      verifiedOn: "2026-10-15"

  - id: eventual-consistency
    term: Eventual consistency
    aka: ["eventually consistent"]
    definition: "If no new writes happen, all copies eventually return the same, latest value."
    source:
      title: "Eventually Consistent - Revisited (Werner Vogels, 2008)"
      url: "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html"
      verifiedOn: "2026-10-15"

  - id: network-partition
    term: Network partition
    aka: ["network partitions"]
    definition: "A network failure that splits nodes into groups that cannot reach each other."
    see: cap-theorem
    source:
      title: "Brewer's Conjecture and the Feasibility of Consistent, Available, Partition-Tolerant Web Services (Gilbert & Lynch, 2002)"
      url: "https://www.comp.nus.edu.sg/~gilbert/pubs/BrewersConjecture-SigAct.pdf"
      verifiedOn: "2026-10-15"

  - id: acid
    term: ACID
    definition: "Atomicity, Consistency, Isolation, Durability: the guarantees of a database transaction."
    source:
      title: "Glossary (PostgreSQL documentation)"
      url: "https://www.postgresql.org/docs/current/glossary.html"
      verifiedOn: "2026-10-15"

  - id: replication
    term: Replication
    definition: "Keeping copies of the same data on several nodes, for availability and more read capacity."
    see: sharding-and-replication
    source:
      title: "Replication (MongoDB Manual)"
      url: "https://www.mongodb.com/docs/manual/replication/"
      verifiedOn: "2026-10-15"

  - id: sharding
    term: Sharding
    aka: ["horizontal partitioning"]
    definition: "Splitting rows across several nodes, so each node (shard) holds a different slice of the data."
    see: sharding-and-replication
    source:
      title: "Sharding pattern (Azure Architecture Center)"
      url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding"
      verifiedOn: "2026-10-15"

  - id: shard-key
    term: Shard key
    definition: "The field that decides which shard stores a row, for example user_id."
    see: sharding-and-replication
    source:
      title: "Data partitioning recommendations for reliability (Azure Well-Architected)"
      url: "https://learn.microsoft.com/en-us/azure/well-architected/design-guides/partition-data"
      verifiedOn: "2026-10-15"

  - id: consistent-hashing
    term: Consistent hashing
    definition: "A way to map keys to nodes so that adding or removing a node moves only a small share of keys."
    see: sharding-and-replication
    source:
      title: "Consistent Hashing and Random Trees (Karger et al., STOC 1997)"
      url: "https://doi.org/10.1145/258533.258660"
      verifiedOn: "2026-10-15"
