topics:
  scalability:
    - id: scalability
      children:
        - { id: vertical-scaling, label: "Vertical scaling (scale up)", note: "Bigger machine: more CPU, memory or disk" }
        - id: horizontal-scaling
          label: "Horizontal scaling (scale out)"
          note: "More machines share the work"
          children:
            - { id: stateless, label: "Stateless servers", note: "No session data on the server, so any server can serve any request" }
        - { id: diagonal-scaling, label: "Diagonal scaling", note: "Grow one machine to its limit, then add machines" }
        - { id: autoscaling, label: "Autoscaling", note: "Add or remove instances automatically as demand changes" }
    - { id: single-point-of-failure, label: "Single point of failure", note: "One part whose failure stops everything" }
    - id: load-balancer
      children:
        - id: lb-layers
          label: "By network layer"
          children:
            - { id: layer-4-lb, label: "Layer 4 (transport)", note: "Routes by IP address and port, e.g. AWS NLB" }
            - { id: layer-7-lb, label: "Layer 7 (application)", note: "Reads HTTP: path, host, headers, e.g. AWS ALB" }
        - id: lb-algorithms
          label: "Algorithms"
          note: "How the next server is picked"
          children:
            - { id: round-robin, label: "Round robin (weighted)", note: "Servers take turns; more weight, more turns (nginx default)" }
            - { id: least-connections, label: "Least connections", note: "Pick the server with the fewest active connections" }
            - { id: lb-hash, label: "Hash / IP hash", note: "The same client or key goes to the same server" }
            - { id: lb-random, label: "Random (two choices)", note: "Pick two servers at random, use the less busy one" }
        - id: health-check
          label: "Health checks"
          children:
            - { id: active-health-check, label: "Active", note: "The load balancer probes each server on a timer" }
            - { id: passive-health-check, label: "Passive", note: "Failed real requests mark a server down for a short time" }
        - { id: sticky-session, label: "Sticky sessions", note: "Keep one user on the same server" }
        - id: lb-redundancy
          label: "Redundant load balancers"
          note: "No single load balancer to fail"
          children:
            - { id: active-passive, label: "Active-passive", note: "A standby takes over if the main one fails" }
            - { id: active-active, label: "Active-active", note: "Two or more serve traffic at the same time" }

  caching:
    - id: caching-strategies
      label: "Caching strategies"
      note: "Who fills and updates the cache"
      children:
        - id: cache-aside
        - { id: read-through, label: "Read-through", note: "The cache itself loads from the DB on a miss" }
        - { id: write-through, label: "Write-through", note: "Writes go to the cache and the DB together" }
        - { id: write-behind, label: "Write-behind (write-back)", note: "Write to the cache now, to the DB a little later" }
    - id: eviction
      label: "Eviction policies"
      note: "What to drop when the cache is full"
      children:
        - { id: lru, label: "LRU", note: "Drop the least recently used keys first" }
        - { id: lfu, label: "LFU", note: "Drop the least frequently used keys first" }
        - { id: volatile-ttl, label: "Shortest TTL first", note: "Evict keys with the shortest TTL left (Redis volatile-ttl)" }
        - { id: no-eviction, label: "No eviction (Redis OSS default)", note: "When memory is full, writes get errors; reads still work" }
    - { id: ttl, label: "TTL (expiry)", note: "Expiry, not eviction: a key is deleted once its TTL runs out" }
    - id: cache-placement
      label: "Where caches live"
      children:
        - { id: browser-cache, label: "Browser (HTTP cache)", note: "The user's browser keeps copies of responses" }
        - { id: cdn, label: "CDN", note: "Copies kept on edge servers close to users" }
        - { id: in-process-cache, label: "In-process (local)", note: "Each app server keeps its own copy in memory" }
        - { id: distributed-cache, label: "Distributed (shared)", note: "One shared cache such as Redis or Memcached" }
    - id: cache-problems
      label: "Common problems"
      children:
        - { id: stale-data, label: "Stale data", note: "The cache still holds an old value after the DB changed" }
        - { id: thundering-herd, label: "Thundering herd", note: "Many requests miss the same hot key at once" }

  databases:
    - id: sql-vs-nosql
      children:
        - id: relational
          label: "Relational (SQL)"
          note: "Tables with a predefined schema, joins and ACID transactions"
          children:
            - { id: acid, label: "ACID", note: "Atomic, consistent, isolated, durable transactions" }
        - id: nosql
          label: "NoSQL"
          note: "Non-relational, flexible schema, built for specific access patterns"
          children:
            - { id: key-value-store, label: "Key-value", note: "Get and put by key, e.g. Amazon DynamoDB" }
            - { id: document-store, label: "Document", note: "JSON-like documents, e.g. MongoDB" }
            - { id: wide-column-store, label: "Wide-column", note: "Rows grouped into partitions by a key, e.g. Apache Cassandra" }
            - { id: graph-database, label: "Graph", note: "Nodes and edges for connected data, e.g. Amazon Neptune" }
    - id: sharding-and-replication
      children:
        - id: replication
          label: "Replication"
          note: "The same data copied to several nodes"
          children:
            - id: replication-writers
              label: "By who accepts writes"
              children:
                - { id: single-leader, label: "Single leader", note: "One primary takes all writes" }
                - { id: multi-leader, label: "Multi-leader", note: "More than one node accepts writes" }
                - { id: leaderless, label: "Leaderless", note: "No leader; writes go to several replicas; R + W > N quorums" }
            - id: replication-timing
              label: "By when a write is confirmed"
              children:
                - { id: sync-replication, label: "Synchronous", note: "Wait for the replica: safer, slower" }
                - id: async-replication
                  label: "Asynchronous"
                  note: "Don't wait: faster, but replicas lag; a crash can lose recent commits"
                  children:
                    - { id: replication-lag, label: "Replication lag", note: "A replica is behind the primary" }
            - { id: read-replica, label: "Read replica", note: "A read-only copy that serves reads" }
        - id: sharding
          label: "Sharding"
          note: "Different rows on different nodes"
          children:
            - { id: shard-key, label: "Shard key", note: "The field(s) that decide which shard holds a row" }
            - { id: range-sharding, label: "Range", note: "Split by key ranges, like A–M and N–Z" }
            - id: hash-sharding
              label: "Hash"
              note: "A hash of the key picks the shard"
              children:
                - { id: consistent-hashing, label: "Consistent hashing", note: "Adding a shard moves only a small share of keys" }
            - { id: directory-sharding, label: "Lookup (directory)", note: "A map records which shard holds each key" }
            - { id: geo-sharding, label: "Geographic", note: "Data is placed by user location" }
            - { id: hotspot, label: "Hotspot", note: "One shard gets far more load than the others" }

  distributed-systems:
    - id: cap-theorem
      children:
        - { id: cap-consistency, label: "Consistency (C)", note: "Every read sees the latest write" }
        - { id: cap-availability, label: "Availability (A)", note: "Every request to a non-failed node gets a response" }
        - { id: network-partition, label: "Partition tolerance (P)", note: "Keep working when messages between nodes are lost" }
        - { id: cp-choice, label: "CP choice", note: "During a partition, refuse some requests to stay consistent" }
        - { id: ap-choice, label: "AP choice", note: "During a partition, keep answering; data may be stale or conflict" }
        - { id: pacelc, label: "PACELC", note: "Else (no partition): latency vs consistency" }
    - id: consistency-models
      label: "Consistency models"
      note: "What a read is allowed to return"
      children:
        - { id: linearizability, label: "Strong (linearizable)", note: "Behaves like one up-to-date copy" }
        - { id: eventual-consistency, label: "Eventual", note: "If writes stop, all copies eventually return the latest value" }
        - { id: read-your-writes, label: "Read-your-writes", note: "You always see your own writes" }
