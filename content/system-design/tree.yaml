  - { title: "Monotonic Reads (Jepsen consistency models)", url: "https://jepsen.io/consistency/models/monotonic-reads", verifiedOn: "2026-10-16" }
  - { title: "Paxos Made Simple (Leslie Lamport, 2001)", url: "https://lamport.azurewebsites.net/pubs/paxos-simple.pdf", verifiedOn: "2026-10-16" }
  - { title: "ZooKeeper Internals (Apache ZooKeeper 3.9 docs)", url: "https://zookeeper.apache.org/doc/current/zookeeperInternals.html", verifiedOn: "2026-10-16" }
  - { title: "Zab1.0 (Apache ZooKeeper wiki)", url: "https://cwiki.apache.org/confluence/display/ZOOKEEPER/Zab1.0", verifiedOn: "2026-10-16" }
  - { title: "In Search of an Understandable Consensus Algorithm, extended version (Ongaro & Ousterhout, 2014)", url: "https://raft.github.io/raft.pdf", verifiedOn: "2026-10-16" }
  - { title: "Understand cluster and pool quorum (Microsoft Learn, Windows Server and Azure Local)", url: "https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/quorum", verifiedOn: "2026-10-16" }
  - { title: "Why etcd (etcd v3.6 docs)", url: "https://etcd.io/docs/v3.6/learning/why/", verifiedOn: "2026-10-16" }
  - { title: "ZooKeeper: A Distributed Coordination Service (Apache ZooKeeper 3.9 overview)", url: "https://zookeeper.apache.org/doc/current/zookeeperOver.html", verifiedOn: "2026-10-16" }

topics:
  
  foundations:
    - id: scalability
      children:
        - { id: vertical-scaling, label: "Vertical scaling (scale up)", note: "Bigger machine: more CPU, memory or disk" }
        - id: horizontal-scaling
          label: "Horizontal scaling (scale out)"
          note: "More machines share the work"
          children:
            - { id: stateless, label: "Stateless servers", note: "No session data on the server, so any server can serve any request" }
        - { id: diagonal-scaling, label: "Diagonal scaling", note: "Grow one machine to its limit, then add machines" }
        - { id: autoscaling, label: "Autoscaling", note: "Add or remove instances automatically as demand changes" }

    - id: latency-and-throughput
      children:
        - id: latency
          label: "Latency"
          note: "Time for one request, usually in milliseconds"
          children:
            - { id: latency-percentiles, label: "Percentiles (p50, p95, p99)", note: "p99: 99% of requests finish within this time" }
            - id: tail-latency
              label: "Tail latency"
              note: "The slowest requests, such as the p99 or p99.9"
              children:
                - { id: request-fan-out, label: "Fan-out", term: fan-out, note: "One request calls many servers and waits for the slowest reply" }
                - { id: hedged-requests, label: "Hedged requests", note: "Send a second copy after a short delay; use the first reply" }
            - { id: latency-numbers, label: "Latency numbers", note: "Memory 100 ns; datacentre round trip 0.5 ms; CA to NL and back 150 ms" }
        - { id: throughput, label: "Throughput", note: "Work finished per unit of time, such as requests per second" }
        - { id: littles-law, label: "Little's law", note: "Items in a system = arrival rate × time each item spends inside" }

    - id: availability
      children:
        - { id: nines, label: "The nines", term: availability, note: "99.9% allows 8.76 hours down a year; 99.99% allows 52.6 minutes" }
        - { id: availability-in-series, label: "In series", note: "Every part must work, so multiply: 99.9% × 99.9% ≈ 99.8%" }
        - { id: availability-in-parallel, label: "In parallel (redundant)", note: "Independent copies: 1 − 0.1% × 0.1% = 99.9999%" }
        - { id: mtbf, label: "MTBF", note: "Mean time between failures: how long it runs before it fails" }
        - { id: mttr, label: "MTTR", note: "Mean time to recover: how long it takes to restore service" }
        - { id: sli, label: "SLI (indicator)", note: "The measurement, e.g. successful requests ÷ all requests" }
        - id: slo
          label: "SLO (objective)"
          note: "A target for an SLI, e.g. 99.9% of requests succeed over 4 weeks"
          children:
            - { id: error-budget, label: "Error budget", note: "1 − SLO: the failures you may spend; when spent, releases pause" }
        - { id: sla, label: "SLA (agreement)", note: "A contract with users; missing it costs credits or refunds" }

    - id: capacity-estimation
      children:
        - id: qps
          label: "Requests per second (QPS)"
          note: "Requests a day ÷ 86,400; 1 million a day is about 12 per second"
          children:
            - { id: peak-qps, label: "Peak QPS", note: "The average × a peak factor you state, e.g. 2x" }
        - { id: read-write-ratio, label: "Read:write ratio", note: "More reads than writes: caches and read replicas pay off" }
        - { id: storage-estimate, label: "Storage", note: "New items a day × size × days kept × copies" }
        - { id: bandwidth-estimate, label: "Bandwidth", note: "Requests per second × response size; 1 Gbps = 125 MB/s" }
        - { id: powers-of-two, label: "Powers of two", note: "2^10 ≈ 1 thousand (KB), 2^20 ≈ 1 million (MB), 2^30 ≈ 1 billion (GB)" }

  traffic:
    - id: transport-protocols
      children:
        - id: tcp
          label: "TCP"
          note: "Connection first; a reliable, in-order byte stream (RFC 9293)"
          children:
            - { id: tcp-handshake, label: "Three-way handshake", note: "SYN, SYN-ACK, ACK: the connection is set up before data" }
            - { id: retransmission, label: "Retransmission", note: "Lost segments are found by sequence numbers and sent again" }
            - { id: flow-control, label: "Flow control", note: "The receive window stops a sender from overrunning the receiver" }
            - { id: congestion-control, label: "Congestion control", note: "Slow start, then back off when loss shows the network is busy" }
            - { id: head-of-line-blocking, label: "Head-of-line blocking", note: "One lost segment holds back later data that already arrived" }
        - { id: udp, label: "UDP", note: "No connection; datagrams may be lost, reordered or doubled (RFC 768)" }
        - id: quic
          label: "QUIC"
          note: "Reliable, encrypted streams carried in UDP datagrams (RFC 9000)"
          children:
            - { id: http3, label: "HTTP/3", note: "HTTP over QUIC; a lost packet stalls only its own stream (RFC 9114)" }

    - id: dns
      children:
        - id: dns-servers
          label: "Servers in a lookup"
          note: "The resolver walks from the root down to the authoritative server"
          children:
            - { id: dns-resolver, label: "Recursive resolver", note: "Asks the other servers for you and caches answers; often your ISP's" }
            - { id: root-server, label: "Root server", note: "Points to TLD servers; 13 named identities run by 12 organisations" }
            - { id: tld-server, label: "TLD server", note: "Serves one top-level domain like .com; points to a domain's servers" }
            - { id: authoritative-server, label: "Authoritative server", note: "Holds the domain's real records and gives the final answer" }
        - id: dns-records
          label: "Record types"
          note: "What a name can point to"
          children:
            - { id: a-record, label: "A and AAAA", note: "Name to IPv4 address (A) or IPv6 address (AAAA)" }
            - { id: cname-record, label: "CNAME", note: "Name to another name; not allowed at the zone apex (example.com)" }
            - { id: ns-record, label: "NS", note: "Names the authoritative servers for a zone" }
            - { id: mx-record, label: "MX", note: "The domain's mail servers; the lowest priority number is tried first" }
        - { id: dns-ttl, label: "TTL and caching", note: "Seconds a resolver may cache an answer; 0 means do not cache" }
        - id: dns-routing
          label: "DNS-based routing"
          note: "The answer depends on a policy (Amazon Route 53 names)"
          children:
            - { id: weighted-dns, label: "Weighted", note: "Shares you set: weights 1 and 255 send 1/256 of traffic to the first" }
            - { id: geo-dns, label: "Geolocation (GeoDNS)", note: "Answer by the user's location, e.g. Europe to a Frankfurt server" }
            - { id: latency-dns, label: "Latency-based", note: "Answer with the AWS Region that gives this user the lowest latency" }
            - { id: dns-failover, label: "Failover", note: "Answer with the standby only when the primary fails health checks" }

    - id: cdn
      children:
        - { id: edge-server, label: "Edge server (PoP)", note: "A cache near users; CloudFront calls these POPs or edge locations" }
        - { id: origin-server, label: "Origin", note: "Holds the real files: your web server or a bucket such as Amazon S3" }
        - { id: tiered-cache, label: "Tiered cache", note: "A bigger mid-tier cache between edges and origin, e.g. Origin Shield" }
        - id: cdn-types
          label: "Push vs pull"
          note: "Who puts files on the CDN"
          children:
            - { id: push-cdn, label: "Push CDN", note: "You upload files to the CDN's storage yourself" }
            - { id: pull-cdn, label: "Pull CDN", note: "The edge fetches a file from the origin on the first miss" }
        - id: cdn-updates
          label: "Updating cached files"
          note: "Purge the old copy, or publish the new one under a new name"
          children:
            - { id: cdn-invalidation, label: "Invalidation (purge)", note: "Removes a file from the edge caches before its TTL ends" }
            - { id: versioned-urls, label: "Versioned file names", term: cache-busting, note: "app.v2.js instead of a purge; CloudFront's advice for frequent updates" }

    - id: load-balancer
      children:
        - id: lb-layers
          label: "By network layer"
          children:
            - { id: layer-4-lb, label: "Layer 4 (transport)", note: "Routes by IP address and port, e.g. AWS NLB" }
            - { id: layer-7-lb, label: "Layer 7 (application)", note: "Reads HTTP: path, host, headers, e.g. AWS ALB" }
        - id: lb-algorithms
          label: "Algorithms"
          note: "How the next server is picked"
          children:
            - { id: round-robin, label: "Round robin (weighted)", note: "Servers take turns; more weight, more turns (nginx default)" }
            - { id: least-connections, label: "Least connections", note: "Pick the server with the fewest active connections" }
            - { id: lb-hash, label: "Hash / IP hash", note: "The same client or key goes to the same server" }
            - { id: lb-random, label: "Random (two choices)", note: "Pick two servers at random, use the less busy one" }
        - id: health-check
          label: "Health checks"
          children:
            - { id: active-health-check, label: "Active", note: "The load balancer probes each server on a timer" }
            - { id: passive-health-check, label: "Passive", note: "Failed real requests mark a server down for a short time" }
        - { id: sticky-session, label: "Sticky sessions", note: "Keep one user on the same server" }
        - { id: lb-redundancy, label: "Redundant load balancers", note: "No single load balancer to fail: run an active-passive or active-active pair" }

    - id: reverse-proxy
      children:
        - id: proxy-jobs
          label: "What it does"
          note: "Jobs done once at the front instead of on every server"
          children:
            - { id: tls-termination, label: "TLS termination", note: "Decrypts HTTPS at the proxy, so servers skip that work" }
            - { id: proxy-caching, label: "Response caching", note: "Serves repeat responses itself (nginx proxy_cache, off by default)" }
            - { id: proxy-compression, label: "Compression", note: "Gzips responses to save bandwidth (nginx gzip, off by default)" }
            - { id: hide-backends, label: "Hides the servers", note: "Clients see only the proxy's address, so servers can change freely" }
        - { id: forward-proxy, label: "Forward proxy (the opposite)", note: "Acts for clients going out to the internet, not for servers" }

    - id: api-gateway
      children:
        - { id: gateway-routing, label: "Gateway routing", note: "One endpoint; layer 7 rules send each request to the right service" }
        - id: gateway-offloading
          label: "Gateway offloading"
          note: "Shared jobs done once at the gateway, not in every service"
          children:
            - { id: gateway-auth, label: "Authentication", note: "Checks tokens or keys before a request reaches any service" }
            - { id: gateway-throttling, label: "Rate limiting", note: "Caps requests per client; AWS API Gateway returns 429 when over" }
            - { id: protocol-translation, label: "Protocol translation", note: "Clients speak HTTP; services behind can use other protocols" }
        - { id: gateway-aggregation, label: "Gateway aggregation", note: "One client call; the gateway calls several services, merges replies" }
        - { id: bff, label: "Backend for Frontend (BFF)", note: "A separate backend layer for each client type, e.g. mobile and web" }

    - id: rate-limiting
      children:
        - id: rl-algorithms
          label: "Algorithms"
          note: "How the limiter decides whether a request fits"
          children:
            - { id: token-bucket, label: "Token bucket", note: "Tokens refill at a fixed rate; each request spends one; bursts OK" }
            - { id: leaky-bucket, label: "Leaky bucket", note: "Requests leave at a fixed rate; extras wait or are dropped (nginx)" }
            - id: fixed-window
              label: "Fixed window counter"
              note: "One counter per clock window, such as per minute"
              children:
                - { id: window-boundary-burst, label: "Burst at the window edge", note: "Bursts either side of a reset can let through twice the limit" }
            - id: sliding-window
              label: "Sliding window"
              note: "Counts the last N seconds, not the current clock window"
              children:
                - { id: sliding-window-log, label: "Sliding window log", note: "Stores a timestamp per request: exact, but memory-heavy" }
                - { id: sliding-window-counter, label: "Sliding window counter", note: "Weights the previous window's count: two numbers per key" }
        - id: rl-keys
          label: "Count per"
          note: "Who each counter belongs to"
          children:
            - { id: limit-by-ip, label: "IP address", note: "Works without login; users behind one NAT share an IP" }
            - { id: limit-by-key, label: "API key or user", note: "One limit per customer; the caller must identify itself" }
        - { id: distributed-rate-limiting, label: "Distributed limits", note: "All servers share counters in one store, such as Redis" }
        - id: http-429
          label: "429 Too Many Requests"
          note: "The HTTP status for 'too many requests in a given time' (RFC 6585)"
          children:
            - { id: retry-after, label: "Retry-After header", note: "Seconds (or a date) to wait before trying again" }

    - id: realtime-communication
      children:
        - { id: short-polling, label: "Short polling", note: "The client asks on a timer; empty answers when there is no news" }
        - { id: long-polling, label: "Long polling", note: "The server holds each request until an event or a timeout" }
        - id: sse
          label: "Server-sent events (SSE)"
          note: "One long HTTP response of text events, server to client only"
          children:
            - { id: last-event-id, label: "Last-Event-ID", note: "Sent on reconnect so the server can resume the stream" }
        - id: websockets
          label: "WebSockets"
          note: "Two-way messages over one TCP connection (RFC 6455)"
          children:
            - { id: websocket-handshake, label: "Upgrade handshake", note: "HTTP Upgrade request; the server replies 101 Switching Protocols" }
            - { id: ping-pong, label: "Ping and pong", note: "Control frames; a pong must answer each ping" }
        - { id: webrtc, label: "WebRTC", note: "Audio, video and data between browsers, peer to peer" }
        - { id: realtime-fanout, label: "Pushing from many servers", note: "Servers relay events over pub/sub, e.g. the Socket.IO Redis adapter" }

  apis:
    - id: api-styles
      children:
        - id: rest
          label: "REST"
          note: "Resources at URLs, acted on with standard HTTP methods"
          children:
            - { id: http-methods, label: "HTTP methods", note: "GET reads, POST often creates, PUT replaces, PATCH edits, DELETE removes" }
            - { id: http-status-codes, label: "Status codes", note: "2xx success, 3xx redirect, 4xx client error, 5xx server error" }
            - { id: rest-constraints, label: "REST constraints", note: "Client-server, stateless, cacheable, uniform interface, layered" }
        - id: grpc
          label: "gRPC"
          note: "Call methods on a remote service as if local; HTTP/2 + Protobuf"
          children:
            - { id: protobuf, label: "Protocol Buffers", note: "Typed binary messages from a .proto file; code is generated" }
            - { id: grpc-streaming, label: "Streaming", note: "Unary, server streaming, client streaming, bidirectional" }
            - { id: grpc-deadline, label: "Deadlines", note: "Client sets a max wait; past it the call fails: DEADLINE_EXCEEDED" }
            - { id: grpc-web, label: "gRPC-Web", note: "Browsers call gRPC through a proxy such as Envoy" }
        - id: graphql
          label: "GraphQL"
          note: "One endpoint; the client's query picks exactly the fields it needs"
          children:
            - { id: graphql-schema, label: "Typed schema", note: "Server defines types and fields; queries are checked against it" }
            - { id: graphql-operations, label: "Query, mutation, subscription", note: "Read data, change data, get real-time updates" }
            - { id: graphql-n-plus-one, label: "N+1 problem", note: "1 query for a list, then 1 per item; fix by batching (DataLoader)" }
        - { id: pagination, label: "Pagination", note: "Return long lists in pages; cursors stay stable as rows are added" }

    - id: idempotency
      children:
        - id: idempotent-methods
          label: "Idempotent HTTP methods"
          note: "GET, HEAD, OPTIONS, TRACE, PUT and DELETE (RFC 9110)"
          children:
            - { id: safe-methods, label: "Safe methods", note: "Read-only: GET, HEAD, OPTIONS, TRACE; all are idempotent too" }
        - { id: non-idempotent-methods, label: "Not idempotent", note: "POST (RFC 9110) and PATCH (RFC 5789): a repeat can apply twice" }
        - id: idempotency-key
          label: "Idempotency key"
          note: "Unique ID the client sends with a write and reuses on every retry"
          children:
            - { id: saved-response, label: "Saved response", note: "Server stores key and first result; any retry gets that result" }
            - { id: request-fingerprint, label: "Request fingerprint", note: "Checksum of the body; same key with a new body is an error (422)" }
            - { id: concurrent-retry, label: "Concurrent retry", note: "A retry while the first still runs gets 409 Conflict" }
            - { id: idempotency-key-header, label: "Idempotency-Key header", note: "IETF draft, not an RFC; used by Stripe, Adyen and others" }
        - { id: natural-idempotency, label: "Set, don't add", note: "Setting status to PAID repeats safely; adding 100 to a balance does not" }

    - id: microservices
      children:
        - id: monolith
          label: "Monolith"
          note: "One codebase, built and deployed as a single unit"
          children:
            - { id: modular-monolith, label: "Modular monolith", note: "One deploy, strict boundaries between modules (Shopify)" }
        - { id: business-capability, label: "Split by business capability", note: "Each service owns one area, like orders, payments or shipping" }
        - { id: independent-deploy, label: "Independent deploys", note: "Update or roll back one service without redeploying the rest" }
        - id: database-per-service
          label: "Database per service"
          note: "A service's data is private; others reach it only via its API"
          children:
            - { id: api-composition, label: "API composition", note: "Join data from several services by calling each API, in code" }
        - { id: conways-law, label: "Conway's law", note: "A system's structure copies how its teams communicate" }
        - { id: microservice-premium, label: "Microservice premium", note: "Extra cost of running many services; pays off only for complex systems" }
        - { id: strangler-fig, label: "Strangler fig migration", note: "A facade moves features one by one from the old app to new services" }

    - id: service-discovery
      children:
        - id: service-registry
          label: "Service registry"
          note: "Database of service instances and their network locations"
          children:
            - { id: self-registration, label: "Self-registration", note: "Each instance registers on start and unregisters on shutdown" }
            - { id: third-party-registration, label: "Third-party registration", note: "Another part registers instances, e.g. Kubernetes, AWS ASGs" }
            - { id: registry-examples, label: "Examples", note: "Consul, etcd, Apache ZooKeeper, Netflix Eureka" }
        - { id: client-side-discovery, label: "Client-side discovery", note: "Caller queries the registry and load-balances itself (Eureka)" }
        - { id: server-side-discovery, label: "Server-side discovery", note: "Caller hits a router that looks up and forwards (AWS ELB)" }
        - { id: dns-discovery, label: "DNS-based", note: "Look up a name like api.service.consul; failing ones are left out" }
        - id: kubernetes-service
          label: "Kubernetes Service"
          note: "Stable name and virtual IP in front of a changing set of Pods"
          children:
            - { id: readiness-probe, label: "Readiness probe", note: "A Pod that fails it is removed from the Service's endpoints" }

  caching:
    - id: caching-layers
      children:
        - { id: browser-cache, label: "Browser (HTTP cache)", note: "A private cache for one user, steered by the Cache-Control header" }
        - { id: reverse-proxy-cache, label: "Reverse-proxy cache", note: "A shared HTTP cache in front of app servers, e.g. nginx proxy_cache" }
        - { id: in-process-cache, label: "In-process (local)", note: "Inside the app's memory: fastest, but each server has its own copy" }
        - { id: distributed-cache, label: "Distributed (shared)", note: "A separate service such as Redis or Memcached, shared by all servers" }
        - { id: two-level-cache, label: "Local + shared (two levels)", note: "Check local memory, then the shared cache, then the database" }
        - { id: db-buffer-cache, label: "Database buffer cache", note: "The database keeps hot pages in RAM, e.g. PostgreSQL shared_buffers" }
        - { id: cache-hit-ratio, label: "Hit ratio", note: "hits / (hits + misses): the share of lookups the cache answers" }

    - id: caching-strategies
      label: "Caching strategies"
      note: "Who fills the cache, and how writes reach it"
      children:
        - { id: cache-aside }
        - { id: read-through, label: "Read-through", note: "On a miss, the cache itself loads the value from the database" }
        - id: write-through
          children:
            - { id: write-behind, label: "Write-behind (write-back)", note: "Confirm after the cache write; write to the database later, in batches" }
        - { id: refresh-ahead, label: "Refresh-ahead", note: "A key read close to its expiry is reloaded in the background" }

    - id: eviction
      children:
        - id: lru
          label: "LRU"
          note: "Evict the key unused for the longest time; the most common policy"
          children:
            - { id: approximated-lru, label: "Approximated LRU (Redis)", note: "Samples a few keys (5 by default) and evicts the least recent" }
            - { id: segmented-lru, label: "Segmented LRU (Memcached)", note: "HOT, WARM and COLD queues; evicts from COLD (default since 1.5.0)" }
        - { id: lfu, label: "LFU", note: "Evict the key used least often; in Redis 4.0+, with a decaying counter" }
        - { id: random-eviction, label: "Random", note: "Evict any key; fits when all keys are read about equally" }
        - { id: fifo-eviction, label: "FIFO", note: "Evict the oldest added key, however often it is read" }
        - { id: volatile-ttl, label: "Shortest TTL first", note: "Evict keys with the least time to live left (Redis volatile-ttl)" }
        - { id: no-eviction, label: "No eviction (Redis OSS default)", note: "When memory is full, writes that add data fail; reads still work" }

    - id: cache-invalidation
      children:
        - { id: ttl, label: "TTL (expiry)", note: "The key is deleted once its time runs out; this caps staleness" }
        - { id: delete-on-write, label: "Delete on write", note: "Update the database, then delete the key; the next read reloads it" }
        - { id: versioned-keys, label: "Versioned keys", note: "Put a version in the key; bump it and the old keys are never read" }
        - { id: event-invalidation, label: "Event-driven invalidation", note: "A daemon reads committed DB changes and sends deletes (Facebook)" }
        - id: stale-data
          label: "Stale data"
          note: "The cache still holds an old value after the database changed"
          children:
            - { id: stale-set, label: "Stale set", note: "A cache set that writes an out-of-date value, due to reordered updates" }
        - id: thundering-herd
          label: "Thundering herd (stampede)"
          note: "Many requests miss the same hot key at once and all hit the database"
          children:
            - { id: request-coalescing, label: "Request coalescing", note: "Only one request fetches a missing key; the others wait for it" }
            - { id: cache-lease, label: "Leases (memcache)", note: "One client gets a token to refill a key; the others wait briefly" }
            - { id: serve-stale, label: "Serve stale while refreshing", note: "Return the old copy while one request reloads it" }
            - { id: early-expiration, label: "Probabilistic early refresh", note: "Each request may reload a hot key early; the chance rises near expiry" }

  databases:
    - id: sql-vs-nosql
      children:
        - { id: relational, label: "Relational (SQL)", note: "Tables with a predefined schema, joins and ACID transactions" }
        - id: nosql
          label: "NoSQL"
          note: "Non-relational, flexible schema, built for specific access patterns"
          children:
            - { id: key-value-store, label: "Key-value", note: "Get and put by key, e.g. Amazon DynamoDB" }
            - { id: document-store, label: "Document", note: "JSON-like documents, e.g. MongoDB" }
            - { id: wide-column-store, label: "Wide-column", note: "Rows grouped into partitions by a key, e.g. Apache Cassandra" }
            - { id: graph-database, label: "Graph", note: "Nodes and edges for connected data, e.g. Amazon Neptune" }

    - id: denormalisation
      children:
        - id: normalisation
          label: "Normalisation"
          note: "Store each fact once; link tables by keys and join on read"
          children:
            - { id: first-normal-form, label: "1NF", note: "One value per cell; no repeating groups such as phone1, phone2" }
            - { id: second-normal-form, label: "2NF", note: "Every non-key column depends on the whole primary key" }
            - { id: third-normal-form, label: "3NF", note: "Non-key columns depend only on the key, not on each other" }
            - { id: referencing, label: "Reference (document stores)", note: "Store another document's id; fetch it with a second read" }
        - id: denormalisation-techniques
          label: "Ways to denormalise"
          children:
            - { id: duplicated-column, label: "Copy a column", note: "Repeat a field where it is read, e.g. customer name in orders" }
            - { id: embedding, label: "Embed (document stores)", note: "Nest related data in one document, so one read returns it" }
            - { id: precomputed-aggregate, label: "Precomputed value", note: "Store a count or total and update it on each write" }
            - { id: materialized-view, label: "Materialised view", note: "A stored query result; PostgreSQL refreshes it only on REFRESH" }
        - { id: update-anomaly, label: "Update anomaly", note: "One copy of a fact changes and the others do not; rows disagree" }

    - id: acid-transactions
      children:
        - id: acid
          label: "ACID properties"
          note: "The four guarantees of a database transaction"
          children:
            - { id: acid-atomicity, label: "Atomicity", note: "All of a transaction's changes commit, or none do" }
            - { id: acid-consistency, label: "Consistency (ACID)", note: "Constraints hold; a transaction that breaks one rolls back" }
            - { id: acid-isolation, label: "Isolation", note: "Others do not see a transaction's changes before it commits" }
            - { id: acid-durability, label: "Durability", note: "Committed changes survive a crash, replayed from the write-ahead log" }
        - id: isolation-anomalies
          label: "Anomalies (what can go wrong)"
          children:
            - { id: dirty-read, label: "Dirty read", note: "Reading a change another transaction has not committed" }
            - { id: non-repeatable-read, label: "Non-repeatable read", note: "Reading a row twice gives two different committed values" }
            - { id: phantom-read, label: "Phantom read", note: "Rerunning a query returns a different set of rows" }
            - { id: lost-update, label: "Lost update", note: "Two read-then-write transactions; one overwrites the other" }
            - { id: write-skew, label: "Write skew", note: "Both read the same rows, then write different ones; a rule breaks" }
        - id: isolation-level
          label: "Isolation levels"
          note: "From weakest to strongest; stronger allows fewer anomalies"
          children:
            - { id: read-uncommitted, label: "Read uncommitted", note: "May see uncommitted data; PostgreSQL runs it as Read Committed" }
            - { id: read-committed, label: "Read committed", note: "Each statement sees data committed before it began (PostgreSQL default)" }
            - id: repeatable-read
              label: "Repeatable read"
              note: "The whole transaction reads one snapshot (MySQL InnoDB default)"
              children:
                - { id: snapshot-isolation, label: "Snapshot isolation", note: "Reads one snapshot; a second concurrent writer of a row fails (PostgreSQL)" }
            - id: serializable
              label: "Serializable"
              note: "Same result as some one-at-a-time order of the transactions"
              children:
                - { id: ssi, label: "Serializable snapshot isolation (SSI)", note: "PostgreSQL: snapshot plus conflict checks; the loser must retry" }

    - id: concurrency-control
      children:
        - id: optimistic-locking
          label: "Optimistic locking"
          note: "No lock; check a version at write time and retry on conflict"
          children:
            - { id: version-column, label: "Version column", note: "A number bumped on every update, e.g. JPA @Version" }
            - { id: conditional-write, label: "Conditional write", note: "Write only if a condition holds, e.g. DynamoDB, S3 If-Match" }
        - id: pessimistic-locking
          label: "Pessimistic locking"
          note: "Lock rows before changing them; other writers wait"
          children:
            - { id: select-for-update, label: "SELECT ... FOR UPDATE", note: "Locks the selected rows until the transaction ends" }
            - { id: skip-locked, label: "NOWAIT and SKIP LOCKED", note: "Fail at once, or skip locked rows (useful for job queues)" }
            - { id: deadlock, label: "Deadlock", note: "Two transactions wait for each other's locks; one is aborted" }
        - { id: mvcc, label: "MVCC", note: "Keeps row versions, so reads never block writes (PostgreSQL)" }
        - { id: distributed-lock, label: "Distributed lock", note: "A lock key in a shared store, e.g. Redis SET NX PX, that expires" }

    - id: indexing
      children:
        - id: b-tree
          label: "B-tree"
          note: "Balanced tree of sorted pages; default index in PostgreSQL and MySQL"
          children:
            - { id: clustered-index, label: "Clustered index", note: "The table rows stored in key order; in MySQL InnoDB, the primary key" }
            - { id: secondary-index, label: "Secondary index", note: "Any other index; InnoDB entries also hold the row's primary key" }
        - id: lsm-tree
          label: "LSM tree"
          note: "Buffer writes in memory, flush sorted immutable files, merge later"
          children:
            - { id: memtable, label: "Memtable", note: "In-memory, sorted buffer that takes new writes" }
            - { id: sstable, label: "SSTable", note: "Immutable sorted file, written when a memtable is flushed" }
            - { id: lsm-compaction, label: "Compaction", note: "Background merge of files; drops overwritten and deleted data" }
        - { id: hash-index, label: "Hash index", note: "Stores a hash of the value: equality lookups only (PostgreSQL)" }
        - id: composite-index
          label: "Composite index"
          note: "One index on several columns, sorted by the first, then the next"
          children:
            - { id: leftmost-prefix, label: "Leftmost-prefix rule", note: "Index (a, b, c) serves a; a, b; a, b, c; usually not b or c alone" }
        - { id: covering-index, label: "Covering index", note: "Holds every column the query reads, so the table can be skipped" }
        - { id: expression-index, label: "Expression index", note: "Indexes a computed value such as lower(email) (PostgreSQL)" }

    - id: search-index
      children:
        - id: inverted-index
          label: "Inverted index"
          note: "Each term lists the documents that contain it (Lucene)"
          children:
            - id: text-analysis
              label: "Text analysis"
              note: "Turn text into terms at index time and at query time"
              children:
                - { id: tokenisation, label: "Tokenisation", note: "Split text into tokens, usually words" }
                - { id: stemming, label: "Stemming", note: "Reduce a word to its root: 'foxes' becomes 'fox'" }
        - { id: bm25, label: "BM25 ranking", note: "Default score in Elasticsearch: rare and repeated terms count more" }
        - { id: near-real-time, label: "Near real-time", note: "New docs are searchable after a refresh (1 s default in Elasticsearch)" }
        - { id: search-sync, label: "Sync from the database", note: "The database is the source of truth; stream its changes (CDC) in" }
        - id: search-engines
          label: "Where it runs"
          children:
            - { id: elasticsearch, label: "Elasticsearch", note: "Search engine on Lucene; each index is split into shards" }
            - { id: postgres-full-text, label: "PostgreSQL full-text search", note: "A tsvector column plus a GIN index; rank with ts_rank" }

    - id: geospatial-index
      children:
        - id: geohash
          label: "Geohash"
          note: "Latitude and longitude bits interleaved into one base32 string"
          children:
            - { id: geohash-precision, label: "Precision", note: "5 chars ≈ 4.9 km cell; 6 ≈ 1.2 × 0.6 km; 7 ≈ 153 m (at the equator)" }
            - { id: cell-edge-problem, label: "Edge problem", note: "Two close points across a cell edge can share no prefix" }
            - { id: neighbour-cells, label: "Search 9 cells", note: "Query the cell and its 8 neighbours, then filter by distance" }
            - { id: redis-geo, label: "Redis GEO", note: "Sorted set scored by a 52-bit geohash; GEOSEARCH since Redis 6.2" }
        - { id: quadtree, label: "Quadtree", note: "A square splits into 4 when it holds too many points" }
        - { id: r-tree, label: "R-tree", note: "Tree of nested bounding boxes for shapes; PostGIS builds it on GiST" }
        - { id: h3, label: "H3 (hexagons)", note: "Uber's open-source hexagon grid; one distance to all 6 neighbours" }
        - { id: exact-distance-check, label: "Exact distance check", note: "An index returns candidates; compute the real distance last" }

    - id: bloom-filter
      children:
        - { id: counting-bloom-filter, label: "Counting Bloom filter", note: "Small counters instead of bits, so items can be deleted (Fan et al.)" }
        - { id: cuckoo-filter, label: "Cuckoo filter", note: "Stores short fingerprints in buckets; supports deletes (Redis CF.DEL)" }
        - { id: scalable-bloom-filter, label: "Scalable Bloom filter", note: "Stacks a bigger sub-filter when full to hold the error rate (Redis)" }

    - id: object-storage
      children:
        - id: object-parts
          label: "Parts of an object"
          children:
            - { id: storage-bucket, label: "Bucket", note: "A container for objects; S3 names are globally unique by default" }
            - { id: object-key, label: "Key", note: "The object's unique name in its bucket, e.g. photos/a.jpg" }
            - { id: object-metadata, label: "Metadata", note: "Name-value pairs stored with the object, e.g. Content-Type" }
        - { id: presigned-url, label: "Presigned URL", note: "Time-limited URL to GET or PUT one object without credentials" }
        - { id: multipart-upload, label: "Multipart upload", note: "Upload parts in parallel; S3 joins them into one object" }
        - id: storage-class
          label: "Storage classes"
          note: "Pay less to store data you read less often"
          children:
            - { id: frequent-access-class, label: "Frequent access", note: "Millisecond reads and no retrieval fee, e.g. S3 Standard" }
            - { id: infrequent-access-class, label: "Infrequent access", note: "Per-GB retrieval fee and a 30-day minimum, e.g. S3 Standard-IA" }
            - { id: archive-class, label: "Archive", note: "Lowest cost; restore before reading, e.g. S3 Glacier Deep Archive" }
        - { id: lifecycle-rule, label: "Lifecycle rule", note: "Move objects to cheaper classes, or delete them, after N days" }
        - { id: object-versioning, label: "Versioning", note: "Keeps old versions to restore deleted or overwritten objects" }
        - id: other-storage-types
          label: "Other storage types"
          children:
            - { id: block-storage, label: "Block storage", note: "Fixed-size blocks on a disk volume, e.g. Amazon EBS for EC2" }
            - { id: file-storage, label: "File storage", note: "Shared folders and files over a network, e.g. Amazon EFS" }

    - id: sharding-and-replication
      children:
        - id: replication
          label: "Replication"
          note: "The same data copied to several nodes"
          children:
            - id: replication-writers
              label: "By who accepts writes"
              children:
                - { id: single-leader, label: "Single leader", note: "One primary takes all writes" }
                - { id: multi-leader, label: "Multi-leader", note: "More than one node accepts writes" }
                - { id: leaderless, label: "Leaderless", note: "No leader; writes go to several replicas; R + W > N quorums" }
            - id: replication-timing
              label: "By when a write is confirmed"
              children:
                - { id: sync-replication, label: "Synchronous", note: "Wait for the replica: safer, slower" }
                - id: async-replication
                  label: "Asynchronous"
                  note: "Don't wait: faster, but replicas lag; a crash can lose recent commits"
                  children:
                    - { id: replication-lag, label: "Replication lag", note: "A replica is behind the primary" }
            - { id: read-replica, label: "Read replica", note: "A read-only copy that serves reads" }
        - id: sharding
          label: "Sharding"
          note: "Different rows on different nodes"
          children:
            - { id: shard-key, label: "Shard key", note: "The field(s) that decide which shard holds a row" }
            - { id: range-sharding, label: "Range", note: "Split by key ranges, like A–M and N–Z" }
            - id: hash-sharding
              label: "Hash"
              note: "A hash of the key picks the shard"
              children:
                - id: consistent-hashing
                  children:
                    - { id: hash-ring, label: "Hash ring", note: "Hash values form a circle; a key goes to the next server clockwise" }
                    - { id: virtual-nodes, label: "Virtual nodes (vnodes)", note: "Many ring points per server, for an even spread" }
                - { id: hash-slots, label: "Fixed hash slots", note: "Keys hash to fixed slots; whole slots move between nodes (Redis)" }
            - { id: directory-sharding, label: "Lookup (directory)", note: "A map records which shard holds each key" }
            - { id: geo-sharding, label: "Geographic", note: "Data is placed by user location" }
            - { id: hotspot, label: "Hotspot", note: "One shard gets far more load than the others" }
        - { id: federation, label: "Federation (functional partitioning)", note: "Split by function: forums, users and products in separate databases" }

  messaging:
    - id: message-queue
      children:
        - { id: competing-consumers, label: "Competing consumers", note: "Many workers read one queue; each message goes to only one of them" }
        - id: acknowledgement
          label: "Acknowledgement (ack)"
          note: "The worker says it is done; only then does the broker delete the message"
          children:
            - { id: visibility-timeout, label: "Visibility timeout", note: "SQS hides a received message; if not deleted in time, it shows again" }
            - { id: prefetch-limit, label: "Prefetch limit", note: "RabbitMQ caps unacked messages per channel, so a worker is not flooded" }
        - id: dead-letter-queue
          label: "Dead-letter queue"
          note: "Holds messages that failed too many times, to inspect and redrive"
          children:
            - { id: poison-message, label: "Poison message", note: "Bad data or a missing resource makes it fail every time" }
        - { id: back-pressure, label: "Back pressure", note: "Cap the queue; when full, reject (e.g. HTTP 503) so clients retry later" }
        - id: queue-ordering
          label: "By ordering"
          note: "Strict order costs throughput: SQS FIFO vs standard queues"
          children:
            - { id: standard-queue, label: "Standard queue", note: "Best-effort order; a message may arrive more than once (SQS)" }
            - { id: fifo-queue, label: "FIFO queue", note: "Strict order per message group; no duplicate sends within 5 min (SQS)" }
        - { id: task-queue, label: "Task queue (job queue)", note: "Runs slow jobs in the background and can schedule them, e.g. Celery" }

    - id: pub-sub
      children:
        - { id: topic, label: "Topic", note: "A named channel; publishers send to it without knowing the subscribers" }
        - id: subscription
          label: "Subscription"
          note: "A named interest in a topic; it receives every message on the topic"
          children:
            - { id: push-subscription, label: "Push subscription", note: "The broker sends each message to the subscriber's endpoint (HTTP POST)" }
            - { id: pull-subscription, label: "Pull subscription", note: "The subscriber's client asks the broker for messages" }
        - id: message-fan-out
          label: "Fan-out"
          term: fan-out
          note: "One published message is copied to every subscription"
          children:
            - { id: topic-to-queues, label: "Topic to queues (SNS + SQS)", note: "An SNS topic feeds one SQS queue per service for parallel async work" }
        - { id: message-filtering, label: "Message filtering", note: "A subscription receives only matching messages (SNS filter policy)" }
        - { id: fire-and-forget-pubsub, label: "Fire-and-forget (Redis Pub/Sub)", note: "At-most-once: a disconnected subscriber loses the message" }

    - id: event-streaming
      children:
        - id: partition-log
          label: "Partitioned log"
          note: "A topic split into partitions; each is an ordered, append-only log"
          children:
            - { id: consumer-offset, label: "Offset", note: "A record's number in its partition; a group saves the next one to read" }
            - { id: message-key, label: "Message key", note: "Same key, same partition, so one key's records stay in order" }
        - id: consumer-group
          label: "Consumer group"
          note: "Consumers with one group.id split the partitions: one consumer each"
          children:
            - { id: consumer-lag, label: "Consumer lag", note: "Log-end offset minus the group's offset: how far behind it is" }
            - { id: share-group, label: "Share group (Kafka 4.2+)", note: "Queue-style: consumers share partitions and ack each record" }
        - id: message-retention
          label: "Retention"
          note: "Records stay after they are read, until a time or size limit"
          children:
            - { id: log-compaction, label: "Log compaction", note: "Keeps at least the latest record for each key" }
            - { id: event-replay, label: "Replay", note: "Move a group's offset back to read old records again" }

    - id: delivery-guarantees
      children:
        - { id: at-most-once, label: "At-most-once", note: "Zero or one delivery: may be lost, never repeated" }
        - id: at-least-once
          label: "At-least-once"
          note: "One or more deliveries: never lost, may repeat (Kafka's default)"
          children:
            - { id: idempotent-consumer, label: "Idempotent consumer", note: "Saves processed message IDs and skips repeats" }
        - id: exactly-once
          label: "Exactly-once (effectively once)"
          note: "Each message's effect happens once, even if it is delivered twice"
          children:
            - { id: idempotent-producer, label: "Idempotent producer (Kafka)", note: "Producer ID + sequence numbers let the broker drop resent copies" }
            - { id: kafka-transactions, label: "Kafka transactions", note: "Writes to many partitions, plus offsets, commit all or nothing" }
            - { id: sqs-fifo-dedup, label: "SQS FIFO deduplication", note: "A resend with the same dedupe ID within 5 minutes adds no copy" }

    - id: batch-and-stream
      children:
        - id: batch-processing
          label: "Batch processing"
          note: "Process a bounded dataset all at once, often on a schedule"
          children:
            - { id: mapreduce, label: "MapReduce", note: "Map emits key/value pairs; reduce merges values per key (Google, 2004)" }
        - id: stream-processing
          label: "Stream processing"
          note: "Process an unbounded stream continuously, as events arrive"
          children:
            - id: stream-windows
              label: "Windows"
              note: "Split an endless stream into finite groups to aggregate"
              children:
                - { id: tumbling-window, label: "Tumbling", note: "Fixed size, no overlap: each event falls in one window" }
                - { id: sliding-time-window, label: "Sliding", note: "Fixed size, a new one every slide, so windows overlap" }
                - { id: session-window, label: "Session", note: "Closes after a gap with no events; no fixed start or end" }
            - { id: event-time, label: "Event time", note: "When the event happened on its device, not when it arrived" }
            - { id: watermark, label: "Watermark", note: "Says event time has reached t; older events are now late" }
            - { id: stream-checkpoint, label: "Checkpoint", note: "Snapshot of job state; after a crash, restore it and replay input" }
            - { id: micro-batch, label: "Micro-batch", note: "A stream run as many small batch jobs (Spark Structured Streaming)" }
        - { id: lambda-architecture, label: "Lambda architecture", note: "Batch and stream systems side by side, merged at query time" }
        - { id: kappa-architecture, label: "Kappa architecture", note: "Stream only; reprocess by replaying the retained log" }

    - id: event-sourcing-cqrs
      children:
        - id: event-sourcing
          label: "Event sourcing"
          note: "Store every change as an event; replay the events to get the state"
          children:
            - { id: event-store, label: "Event store", note: "Append-only store of each entity's events; the source of truth" }
            - { id: event-snapshot, label: "Snapshot", note: "Saved state every N events; replay only what came after" }
            - { id: compensating-event, label: "Compensating event", note: "A new event that undoes an earlier one; stored events never change" }
        - id: cqrs
          label: "CQRS"
          note: "Separate models for writes (commands) and reads (queries)"
          children:
            - { id: command-model, label: "Write model (commands)", note: "Runs validation and business rules, then changes data" }
            - { id: read-model, label: "Read model (queries)", note: "Data shaped for queries, often denormalised; no business logic" }
            - { id: projection, label: "Projection", note: "Builds a read view from events; rebuild it any time by replay" }

  reliability:
    - id: redundancy-failover
      children:
        - { id: single-point-of-failure, label: "Single point of failure", note: "One part whose failure stops everything; remove it with redundancy" }
        - id: redundancy-scope
          label: "Where the copies live"
          note: "Copies help only if they fail separately"
          children:
            - { id: multi-az, label: "Multiple zones (multi-AZ)", note: "Separate data centres in one region; survives a data-centre outage" }
            - { id: multi-region, label: "Multiple regions", note: "Distant regions; survives a region outage, but costs more and adds latency" }
        - id: active-passive
          label: "Active-passive"
          note: "Only the primary serves traffic; a standby takes over if it fails"
          children:
            - { id: hot-standby, label: "Hot standby", note: "Running and ready to take production traffic at any time" }
            - { id: cold-standby, label: "Cold standby", note: "Not running or not deployed; must start first, so downtime is longer" }
        - { id: active-active, label: "Active-active", note: "All copies serve traffic at once, so there is no standby to promote" }
        - id: failover
          label: "Failover"
          note: "Detect the failure, pick a new primary, redirect requests"
          children:
            - { id: heartbeat, label: "Heartbeat", note: "A regular signal between nodes; when it stops, the standby takes over" }
            - { id: fencing, label: "Fencing (STONITH)", note: "Make the old primary unable to run, so two primaries (split brain) can't happen" }
            - { id: failback, label: "Failback", note: "Move back to the original primary later; syncing its data is the hard part" }

    - id: timeouts-retries
      children:
        - id: timeout
          label: "Timeouts"
          note: "Stop waiting after a set time, so threads and connections are freed"
          children:
            - { id: connect-timeout, label: "Connect timeout", note: "Limit on opening a new connection" }
            - { id: request-timeout, label: "Request timeout", note: "Limit on waiting for the response" }
            - { id: deadline-propagation, label: "Deadline propagation", note: "Each hop gets only the time left on the original request" }
        - id: retry
          label: "Retries"
          note: "Try again only for transient faults on idempotent calls"
          children:
            - { id: exponential-backoff, label: "Exponential backoff", note: "The wait doubles after each failed try, up to a cap" }
            - id: jitter
              label: "Jitter"
              note: "A random wait, so clients that failed together do not retry together"
              children:
                - { id: full-jitter, label: "Full jitter", note: "Sleep a random time from 0 to the full backoff" }
                - { id: equal-jitter, label: "Equal jitter", note: "Half the backoff is fixed, the other half is random" }
                - { id: decorrelated-jitter, label: "Decorrelated jitter", note: "Random from base to 3 times the last sleep, capped" }
            - { id: retry-budget, label: "Retry budget", note: "Cap retries as a share of requests, e.g. under 10% per client" }
        - { id: retry-storm, label: "Retry storm", note: "Too many retries keep a struggling service from recovering" }

    - id: circuit-breaker
      children:
        - id: cb-states
          label: "States"
          note: "A small state machine, named after the electrical breaker"
          children:
            - { id: cb-closed, label: "Closed", note: "Calls pass; recent failures are counted" }
            - { id: cb-open, label: "Open", note: "Calls fail at once, with no remote call, until a timer ends" }
            - { id: half-open, label: "Half-open", note: "A few trial calls: success closes it, a failure opens it again" }
        - { id: fallback, label: "Fallback", note: "What to return when open: cached data, a default or a clear error" }

    - id: load-shedding
      children:
        - { id: goodput, label: "Goodput", note: "Requests answered fast enough to be useful to the client" }
        - { id: priority-shedding, label: "Shed by priority", note: "Drop low-value work first; keep health checks and user requests" }
        - { id: drop-expired-work, label: "Drop expired work", note: "Skip queued requests whose caller has already timed out" }
        - { id: graceful-degradation, label: "Graceful degradation", note: "Do less, not nothing: cached, partial or simpler results" }
        - { id: cascading-failure, label: "Cascading failure", note: "Overload spreads as failing servers push their load onto the rest" }

    - id: observability
      children:
        - id: metrics
          label: "Metrics"
          note: "Numbers measured at runtime; aggregated for dashboards and alerts"
          children:
            - { id: golden-signals, label: "Four golden signals", note: "Latency, traffic, errors, saturation (Google SRE)" }
            - { id: high-cardinality, label: "High cardinality", note: "Each unique label set is a new time series; keep user IDs out of labels" }
        - id: traces
          label: "Traces"
          note: "The path of one request through the services, as a tree of spans"
          children:
            - { id: span, label: "Span", note: "One timed operation, with a trace ID, its own span ID and a parent ID" }
            - { id: context-propagation, label: "Context propagation", note: "Pass trace and span IDs to the next service, e.g. W3C traceparent" }
            - { id: trace-sampling, label: "Sampling", note: "Keep only some traces to cut cost: decide at the start (head) or end (tail)" }
        - id: logs
          label: "Logs"
          note: "Timestamped records of events: the details of what happened"
          children:
            - { id: structured-logging, label: "Structured logs", note: "A fixed schema of typed fields, often JSON, so logs can be queried" }
            - { id: correlation-id, label: "Correlation ID", note: "One ID on every event of a request, e.g. the trace ID in each log line" }
        - id: alerting
          label: "Alerting"
          note: "Page only for urgent, actionable, user-visible problems"
          children:
            - { id: burn-rate, label: "Burn rate", note: "How fast errors use up the SLO's error budget; page on a fast burn" }

    - id: disaster-recovery
      children:
        - { id: rpo, label: "RPO (recovery point objective)", note: "Max acceptable time since the last recovery point: the data you may lose" }
        - { id: rto, label: "RTO (recovery time objective)", note: "Max acceptable delay from interruption until service is restored" }
        - id: dr-strategies
          label: "DR strategies (AWS)"
          note: "Listed by rising cost and complexity, falling RPO and RTO"
          children:
            - { id: backup-and-restore, label: "Backup and restore", note: "Restore data and redeploy in the recovery Region; RPO hours, RTO ≤ 24 h" }
            - { id: pilot-light, label: "Pilot light", note: "Data replicated live, app servers off; RPO minutes, RTO tens of minutes" }
            - { id: warm-standby, label: "Warm standby", note: "Scaled-down working copy always on; RPO seconds, RTO minutes" }
            - { id: multi-site, label: "Multi-site active-active", note: "All Regions serve traffic; RPO near zero, RTO potentially zero" }
        - id: backup
          label: "Backups"
          note: "Timestamped copies kept apart, to restore lost or corrupted data"
          children:
            - { id: point-in-time-recovery, label: "Point-in-time recovery", note: "Restore to any moment in the retention window, from backups plus logs" }
            - { id: incremental-backup, label: "Incremental backup", note: "Save only what changed since the last backup: faster, uses less storage" }
            - { id: restore-test, label: "Restore test", note: "Restore on a schedule, check the data, time it against the RTO" }

  distributed-systems:
    - id: cap-theorem
      children:
        - { id: cap-consistency, label: "Consistency (C)", note: "Every read sees the latest write" }
        - { id: cap-availability, label: "Availability (A)", note: "Every request to a non-failed node gets a response" }
        - { id: network-partition, label: "Partition tolerance (P)", note: "Keep working when messages between nodes are lost" }
        - { id: cp-choice, label: "CP choice", note: "During a partition, refuse some requests to stay consistent" }
        - { id: ap-choice, label: "AP choice", note: "During a partition, keep answering; data may be stale or conflict" }
        - { id: pacelc, label: "PACELC", note: "Else (no partition): latency vs consistency" }

    - id: consistency-models
      children:
        - { id: linearizability, label: "Strong (linearizable)", note: "Behaves like one up-to-date copy, in real-time order" }
        - { id: causal-consistency, label: "Causal", note: "Cause before effect for everyone; unrelated writes may differ in order" }
        - id: session-guarantees
          label: "Per-client (session) guarantees"
          note: "Promises about what one client sees of its own reads and writes"
          children:
            - { id: read-your-writes, label: "Read-your-writes", note: "You always see your own writes" }
            - { id: monotonic-reads, label: "Monotonic reads", note: "Your reads never go back to an older value" }
        - { id: eventual-consistency, label: "Eventual", note: "If writes stop, all copies eventually return the latest value" }

    - id: quorum
      children:
        - { id: strict-quorum, label: "Strict quorum (R + W > N)", note: "Read and write replica sets always share at least one node" }
        - { id: majority-quorum, label: "Majority quorum", note: "floor(N/2) + 1 nodes; any two majorities share a node" }
        - { id: sloppy-quorum, label: "Sloppy quorum", note: "Dynamo: use the first N healthy nodes; stand-ins hand data back later" }
        - { id: tunable-consistency, label: "Tunable levels (Cassandra)", note: "Choose per query how many replicas answer: ONE, QUORUM, ALL and more" }

    - id: consensus
      children:
        - id: leader-election
          label: "Leader election"
          note: "Followers that miss heartbeats start a vote; a majority picks one leader"
          children:
            - { id: split-brain, label: "Split brain", note: "Two sides each act as leader; requiring a majority prevents it" }
        - id: raft
          label: "Raft"
          note: "Leader-based consensus designed to be easy to understand (2014)"
          children:
            - { id: raft-term, label: "Terms", note: "Numbered election rounds; at most one leader per term" }
            - { id: raft-log-replication, label: "Log replication", note: "The leader copies entries; one commits once a majority stores it" }
        - { id: paxos, label: "Paxos", note: "Lamport's algorithm: a value is chosen once a majority accepts it" }
        - { id: zab, label: "Zab (ZooKeeper)", note: "ZooKeeper's leader-based atomic broadcast protocol, similar to Paxos" }
        - { id: coordination-service, label: "Coordination services", note: "etcd and ZooKeeper: replicated stores that run consensus for your app" }

    - id: distributed-transactions
      children:
        - id: two-phase-commit
          label: "Two-phase commit (2PC)"
          note: "A coordinator gets every participant to commit, or none"
          children:
            - { id: prepare-phase, label: "Phase 1: prepare", note: "Each participant saves its changes durably and votes yes or no" }
            - { id: commit-phase, label: "Phase 2: commit or abort", note: "All voted yes: commit everywhere; any no: roll back everywhere" }
            - { id: coordinator-blocking, label: "Blocking", note: "If the coordinator fails, prepared participants wait for it" }
            - { id: xa-transactions, label: "XA transactions", note: "X/Open standard interface for 2PC; MySQL InnoDB supports it" }
        - id: saga
          label: "Saga"
          note: "A chain of local transactions; compensations undo the done steps"
          children:
            - { id: compensating-transaction, label: "Compensating transaction", note: "Undoes a step's effect by meaning, like a refund; not a rollback" }
            - { id: pivot-transaction, label: "Pivot transaction", note: "Point of no return: later steps are retried, never undone" }
            - { id: choreography, label: "Choreography", note: "Each service reacts to the last one's event; no central controller" }
            - { id: orchestration, label: "Orchestration", note: "A central orchestrator tells each service which step to run" }
            - { id: transactional-outbox, label: "Transactional outbox", note: "Event saved in an outbox table in the same local transaction" }

    - id: unique-ids
      children:
        - id: db-auto-increment
          label: "Database auto-increment"
          note: "The database hands out 1, 2, 3 on insert"
          children:
            - { id: ticket-server, label: "Ticket server", note: "A database that only hands out IDs; Flickr ran two: odds and evens" }
        - id: uuid
          label: "UUID"
          note: "128-bit ID that any server can make alone (RFC 9562)"
          children:
            - { id: uuid-v4, label: "UUID v4 (random)", note: "122 random bits; no order" }
            - { id: uuid-v7, label: "UUID v7 (time-ordered)", note: "48-bit Unix ms timestamp first, then random bits" }
        - id: snowflake-id
          label: "Snowflake-style ID"
          note: "64 bits: time, machine id, sequence; made locally, sorts roughly by time"
          children:
            - { id: snowflake-timestamp, label: "Timestamp: 41 bits", note: "Milliseconds since a custom epoch; lasts about 69 years" }
            - { id: snowflake-machine-id, label: "Machine id: 10 bits", note: "Up to 1,024 generators, set in config" }
            - { id: snowflake-sequence, label: "Sequence: 12 bits", note: "Up to 4,096 IDs per millisecond per generator" }
