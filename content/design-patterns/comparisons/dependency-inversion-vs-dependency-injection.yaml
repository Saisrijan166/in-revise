id: dependency-inversion-vs-dependency-injection
tech: design-patterns
title: Dependency Inversion vs Dependency Injection
compares: [dependency-inversion, dependency-injection]
gist:
  - "A principle: which way source dependencies point"
  - "A technique: someone else creates and passes the object"
explain:
  - "Dependency Inversion is the D in SOLID: a design rule that high-level policy and low-level details both depend on an abstraction the policy side owns, so the detail's source dependency points up to the policy."
  - "Dependency Injection is a technique (named by Fowler, 2004): a class does not create or look up its collaborators; something outside builds them and passes them in, usually through the constructor."
example: "PaymentService depends on a PaymentStrategy interface it owns (DIP), and UpiPayment implements it. At startup, Spring's container creates UpiPayment and passes it into PaymentService's constructor (DI). You could instead pass it by hand in main() and still satisfy DIP without any DI."
rows:
  - { aspect: "Kind", a: "Design principle, the D in SOLID (Martin)", b: "A pattern named by Fowler in 2004" }
  - { aspect: "Answers", a: "What should my code depend on?", b: "How does my code get its collaborators?" }
  - { aspect: "Rule", a: "Depend on abstractions, not details", b: "Do not create or look up dependencies; receive them" }
  - { aspect: "Without the other", a: "Yes: a factory or service locator can supply the detail", b: "Yes: injecting a concrete UpiPayment class still breaks DIP" }
  - { aspect: "In Spring", a: "You design the interfaces", b: "The IoC container injects the beans" }
verdict: "Say DIP for the design rule and DI for the delivery mechanism; DI is the usual way to satisfy DIP."
sayIt: "DIP is the design principle about which way dependencies point: depend on abstractions, not details. DI is one technique for supplying the implementation from outside. DI is the usual way to satisfy DIP, but a factory also works, and injecting a concrete class still breaks DIP."
