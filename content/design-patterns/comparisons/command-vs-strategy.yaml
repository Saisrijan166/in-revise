id: command-vs-strategy
tech: design-patterns
title: Command vs Strategy
compares: [command, strategy]
gist:
  - "One requested action, packed to run later"
  - "One of several ways to do the same job"
explain:
  - "Command wraps a single request as an object that holds the receiver and the data, so an invoker can queue it, delay it, log it or undo it, and run it later without knowing what it does."
  - "Strategy puts each way of doing one job behind a shared interface, so a context can hold one and call it now, and you can swap in a different way without changing the context."
example: "A refund that must run on a background worker a minute later is a Command: RefundCommand holds the service and the payment id, and a job runner calls execute() later. Choosing whether to pay by UPI, card or wallet is Strategy: PaymentService holds a PaymentStrategy and calls pay() straight away."
rows:
  - { aspect: "Captures", a: "What to do: refund payment P1", b: "How to do it: by UPI or card" }
  - { aspect: "Holds", a: "The receiver and the request data", b: "The algorithm; the data comes in as arguments" }
  - { aspect: "Typical uses", a: "Queue, delay, keep a history, undo", b: "Swap the algorithm inside a context" }
  - { aspect: "Called by", a: "An invoker, such as a job runner", b: "The context, such as PaymentService" }
  - { aspect: "When it runs", a: "Later, decided by the invoker", b: "Now, when the context calls it" }
  - { aspect: "JDK example", a: "Runnable given to an ExecutorService", b: "Comparator given to a sort method" }
verdict: "Run, queue or undo a request later: Command. Choose among ways to do one task: Strategy."
sayIt: "Command captures a request as an object, with its receiver and data, so an invoker can queue, delay or undo it and run it later. Strategy holds one of several interchangeable ways to do a job and runs it now. Command is about when and by whom; Strategy is about how."
