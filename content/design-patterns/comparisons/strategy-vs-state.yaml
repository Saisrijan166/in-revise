id: strategy-vs-state
tech: design-patterns
title: Strategy vs State
compares: [strategy, state]
gist:
  - "The client picks one way to do a job"
  - "The object changes behaviour as its state moves"
explain:
  - "Strategy puts several interchangeable ways to do one job behind an interface. The caller picks one and the context runs it; the strategies do not know each other and do not change themselves."
  - "State gives each status of an object its own behaviour. The context forwards events to its current state, and the states move the context from one status to the next as events arrive."
example: "Paying by UPI, card or wallet is Strategy: the caller picks the way and PaymentService just runs it. A payment moving CREATED to PENDING to SUCCESS to REFUNDED is State: each status allows different moves and sets the next status, and refunding a FAILED payment is rejected."
rows:
  - { aspect: "Answers", a: "How should this job be done?", b: "What may happen in the current state?" }
  - { aspect: "Who switches it", a: "The client, a factory or config", b: "The states or the context, on each event" }
  - { aspect: "Do the parts know each other", a: "No: strategies are independent", b: "Yes: a state can pick the next one" }
  - { aspect: "Changes over time", a: "Usually set once per use", b: "Moves through a lifecycle of states" }
  - { aspect: "Payment example", a: "UPI, card or wallet", b: "PENDING, SUCCESS, REFUNDED" }
verdict: "Several ways to do the same job: Strategy. One object whose allowed actions change through a lifecycle: State."
sayIt: "Strategy and State share the same shape, a context delegating to a helper, but differ in intent. In Strategy the caller picks one of several interchangeable algorithms. In State the object's status decides its behaviour and the states move it to the next status as events happen."
sources:
