id: singleton-vs-static-class
tech: design-patterns
title: Singleton vs Static Utility Class
compares: [singleton, static-utility-class]
gist:
  - "One object, reached through one access point"
  - "No object at all: only static methods"
explain:
  - "A singleton is a real object that a class limits to a single instance, reached through one static access point. Because it is an object it can implement an interface, hold state, be passed around and be swapped for a fake in tests."
  - "A static utility class holds only static methods and a private constructor, so it is never instantiated. Callers name the class directly, like java.util.Collections.sort, which suits stateless helper functions that need no object."
example: "A shared PaymentConfig that implements a ConfigSource interface and can be faked in a test is a singleton. java.util.Collections, a bag of stateless helpers called as Collections.sort(list), is a static utility class: there is no instance to pass or fake."
rows:
  - { aspect: "You get", a: "An instance", b: "No instance; the constructor is private" }
  - { aspect: "Implements an interface", a: "Yes", b: "No: a static method cannot implement one" }
  - { aspect: "Passed or injected", a: "Yes, as a reference or a Spring bean", b: "No: callers name the class directly" }
  - { aspect: "Fake in tests", a: "Swap it behind its interface", b: "Hard: every caller is wired to the class" }
  - { aspect: "Typical use", a: "Shared config, ID generator", b: "Stateless helpers, like java.util.Collections" }
verdict: "Stateless helpers: a static utility class. Needs an interface, state or a test double: a singleton, ideally a Spring bean."
sayIt: "A singleton is one object behind a single access point, so it can implement an interface, carry state and be faked in tests. A static utility class has no instance, just static methods callers name directly. Stateless helpers: static class. Need an interface, state or a test double: singleton."
sources:
  - title: "JLS SE 25, 8.4.3.2 static Methods, 8.4.8 Inheritance and Hiding, 8.8.10 Preventing Instantiation"
    url: "https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html"
    verifiedOn: "2026-10-20"
  - title: "java.util.Collections (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Collections.html"
    verifiedOn: "2026-10-20"
