id: repository-vs-dao
tech: design-patterns
title: Repository vs DAO
compares: [repository-pattern, dao-pattern]
gist:
  - "A collection of domain objects, in domain words"
  - "A gateway to one data source, in storage words"
explain:
  - "A Repository is an interface that looks like a collection of domain objects: you call save and findByStatus and think in business terms. It comes from Fowler's PoEAA and Evans's DDD, and keeps persistence out of business logic."
  - "A DAO (Data Access Object) wraps all access to one data source behind storage-shaped methods like insertPayment and updatePayment. It comes from the Core J2EE Patterns catalogue and isolates JDBC or JPA calls in one class."
example: "For payments, a Repository exposes paymentRepository.findByStatus(SUCCESS), reading like a collection of Payment objects. A DAO exposes paymentDao.selectPaymentsByStatus(\"SUCCESS\") and holds the raw SQL and ResultSet handling. In Spring Data the Repository is just an interface you declare; a DAO is usually a @Repository class you write over JDBC."
rows:
  - { aspect: "Comes from", a: "Fowler's PoEAA and Evans's DDD", b: "Core J2EE Patterns" }
  - { aspect: "Sits between", a: "The domain and the data-mapping layer", b: "Business code and a data source" }
  - { aspect: "Methods look like", a: "A collection: save, findByStatus", b: "Storage calls: insertCustomer, updateCustomer" }
  - { aspect: "One per", a: "Aggregate root (Spring Data)", b: "Business object it serves" }
  - { aspect: "In Spring", a: "An interface extending JpaRepository", b: "A @Repository class over JDBC or JPA" }
verdict: "In Spring the two blur, since @Repository marks both; say Repository for domain-shaped access to aggregates and DAO for a thin wrapper over a data source."
sayIt: "Both hide persistence from business code. A Repository is domain-oriented and reads like a collection of objects; a DAO is storage-oriented and wraps one data source. In Spring the two blur because @Repository marks either role."
