id: repository-vs-dao
tech: design-patterns
title: Repository vs DAO
compares: [repository-pattern, dao-pattern]
gist:
  - "A collection of domain objects, in domain words"
  - "A gateway to one data source, in storage words"
rows:
  - { aspect: "Comes from", a: "Fowler's PoEAA and Evans's DDD", b: "Core J2EE Patterns" }
  - { aspect: "Sits between", a: "The domain and the data-mapping layer", b: "Business code and a data source" }
  - { aspect: "Methods look like", a: "A collection: save, findByStatus", b: "Storage calls: insertCustomer, updateCustomer" }
  - { aspect: "One per", a: "Aggregate root (Spring Data)", b: "Business object it serves" }
  - { aspect: "In Spring", a: "An interface extending JpaRepository", b: "A @Repository class over JDBC or JPA" }
verdict: "In Spring the two blur, since @Repository marks both; say Repository for domain-shaped access to aggregates and DAO for a thin wrapper over a data source."
sources:
