    url: "https://martinfowler.com/eaaCatalog/repository.html"
    verifiedOn: "2026-10-20"
  - title: "Core J2EE Patterns: Data Access Object (Oracle)"
    url: "https://www.oracle.com/java/technologies/dataaccessobject.html"
    verifiedOn: "2026-10-20"
  - title: "Domain Driven Design and Relational Databases: one repository per aggregate root (Spring Data Relational reference)"
    url: "https://docs.spring.io/spring-data/relational/reference/jdbc/domain-driven-design.html"
    verifiedOn: "2026-10-20"
  - title: "Classpath scanning: @Repository, also known as DAO (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html"
    verifiedOn: "2026-10-20"
