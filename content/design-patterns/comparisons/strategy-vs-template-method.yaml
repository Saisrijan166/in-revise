id: strategy-vs-template-method
tech: design-patterns
title: Strategy vs Template Method
compares: [strategy, template-method]
gist:
  - "Composition: pass in an object with the algorithm"
  - "Inheritance: a subclass fills in some steps"
explain:
  - "Strategy passes the varying behaviour in as an object behind an interface, so the whole algorithm can be swapped, even at runtime, and can be a lambda. The context has-a strategy."
  - "Template Method keeps the fixed order of steps in a final method of a base class and leaves some steps for subclasses to fill in. The varying step is chosen when you pick the subclass. The subclass is-a processor."
example: "If the whole way to pay is interchangeable and may change per request, use Strategy: PaymentService(PaymentStrategy). If every processor shares the same validate, charge, notify order and only the charge step differs, use Template Method: UpiProcessor extends PaymentProcessor and overrides only executePayment."
rows:
  - { aspect: "What varies", a: "The whole algorithm", b: "Some steps; the order stays fixed" }
  - { aspect: "Built with", a: "Composition (has-a)", b: "Inheritance (is-a)" }
  - { aspect: "Change at runtime", a: "Yes: swap the object", b: "No: fixed once the class is chosen" }
  - { aspect: "Who fixes the order", a: "The context, in its own code", b: "The base class, in a final template method" }
  - { aspect: "Smallest form", a: "A lambda, if the interface is functional", b: "A subclass that overrides one method" }
  - { aspect: "Payment example", a: "PaymentService(PaymentStrategy)", b: "UpiProcessor extends PaymentProcessor" }
verdict: "Fixed steps with one or two varying parts: Template Method. The whole algorithm varies or must change at runtime: Strategy."
sayIt: "Strategy varies behaviour by composition: you pass in an object, so it can change at runtime and even be a lambda. Template Method varies steps by inheritance: a base class fixes the order and a subclass fills in the varying step, chosen when you pick the class."
sources:
  - title: "Strategy: relation to Template Method (refactoring.guru)"
    url: "https://refactoring.guru/design-patterns/strategy"
    verifiedOn: "2026-10-20"
