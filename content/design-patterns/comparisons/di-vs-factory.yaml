id: di-vs-factory
tech: design-patterns
title: Dependency Injection vs Factory
compares: [dependency-injection, factory-method]
gist:
  - "Someone hands you the object; you never ask"
  - "You ask a factory; it builds or picks one"
explain:
  - "Dependency injection means a class lists the collaborators it needs, usually as constructor parameters, and an outside assembler (the Spring container) passes them in. The class never looks them up; it just receives them, so it stays easy to test and swap."
  - "A factory is code the class calls to create or choose an object at the moment it needs one. The class holds a reference to the factory and asks it, so it can pass runtime input, like the payment method in a request, to decide what gets made."
example: "PaymentService always needs a PaymentRepository, so it takes it as a constructor parameter and Spring injects it: fixed collaborator, injected once. But which gateway to use depends on the request's PaymentMethod, known only at runtime, so PaymentService holds a GatewayFactory and calls create(method) per request."
rows:
  - { aspect: "Your class knows", a: "Only the interface", b: "The interface and the factory" }
  - { aspect: "Who calls whom", a: "The container calls your constructor", b: "Your code calls create()" }
  - { aspect: "Choice made", a: "Once, when the app is wired", b: "On each call; can use runtime input" }
  - { aspect: "In Spring", a: "Constructor parameters", b: "BeanFactory, FactoryBean, @Bean methods" }
  - { aspect: "In a unit test", a: "Pass a fake to the constructor", b: "Stub or replace the factory" }
verdict: "Inject a class's fixed collaborators; use a factory when the object depends on runtime input, like the PaymentMethod in a request, and inject that factory."
sayIt: "DI means my class receives its fixed collaborators from the container and never asks for them. A factory is something my class calls to create or pick an object, often using runtime input. I inject the stable dependencies and keep a factory for the per-request choice, then inject that factory too."
sources:
