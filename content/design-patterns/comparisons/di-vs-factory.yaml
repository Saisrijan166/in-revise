id: di-vs-factory
tech: design-patterns
title: Dependency Injection vs Factory
compares: [dependency-injection, factory-method]
gist:
  - "Someone hands you the object; you never ask"
  - "You ask a factory; it builds or picks one"
rows:
  - { aspect: "Your class knows", a: "Only the interface", b: "The interface and the factory" }
  - { aspect: "Who calls whom", a: "The container calls your constructor", b: "Your code calls create()" }
  - { aspect: "Choice made", a: "Once, when the app is wired", b: "On each call; can use runtime input" }
  - { aspect: "In Spring", a: "Constructor parameters", b: "BeanFactory, FactoryBean, @Bean methods" }
  - { aspect: "In a unit test", a: "Pass a fake to the constructor", b: "Stub or replace the factory" }
verdict: "Inject a class's fixed collaborators; use a factory when the object depends on runtime input, like the PaymentMethod in a request, and inject that factory."
sources:
  - title: "Inversion of Control Containers and the Dependency Injection pattern (Martin Fowler, 2004)"
    url: "https://martinfowler.com/articles/injection.html"
    verifiedOn: "2026-10-20"
  - title: "Introduction to the Spring IoC Container and Beans: BeanFactory (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html"
    verifiedOn: "2026-10-20"
  - title: "Basic Concepts: @Bean methods as factory methods (Spring Framework 7.0 reference)"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/java/basic-concepts.html"
    verifiedOn: "2026-10-20"
