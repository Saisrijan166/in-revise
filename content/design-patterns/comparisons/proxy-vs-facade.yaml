id: proxy-vs-facade
tech: design-patterns
title: Proxy vs Facade
compares: [proxy, facade]
gist:
  - "Same interface as one object; stands in for it"
  - "New, simpler interface over many objects"
diagrams:
  - |
    flowchart LR
      C[Caller] -- "charge()" --> P[Proxy] -- "charge()" --> G[UpiGateway]
  - |
    flowchart LR
      C[Caller] -- "pay()" --> F[PaymentFacade]
      F --> V[Validator]
      F --> G[PaymentGateway]
      F --> N[Notifier]
diagramAlt: "Proxy: the caller calls charge on the proxy, which calls the same charge on UpiGateway. Facade: the caller calls pay on PaymentFacade, which calls Validator, PaymentGateway and Notifier."
rows:
  - { aspect: "Interface", a: "Identical to the real object", b: "Its own, simpler one" }
  - { aspect: "Stands in front of", a: "One object", b: "A whole subsystem" }
  - { aspect: "Swappable with the real thing", a: "Yes, callers cannot tell", b: "No, it is a different API" }
  - { aspect: "Goal", a: "Control access to the object", b: "Make the subsystem easy to use" }
verdict: "Proxy when callers must keep the same interface but access needs control; Facade when callers need one easy entry into many classes."
sources:
  - title: "Proxy: relations with other patterns (refactoring.guru)"
    url: "https://refactoring.guru/design-patterns/proxy"
    verifiedOn: "2026-10-20"
