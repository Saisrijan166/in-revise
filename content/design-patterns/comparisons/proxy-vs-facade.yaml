id: proxy-vs-facade
tech: design-patterns
title: Proxy vs Facade
compares: [proxy, facade]
gist:
  - "Same interface as one object; stands in for it"
  - "New, simpler interface over many objects"
explain:
  - "Proxy stands in front of one object and keeps that object's exact interface, so it can be swapped in for the real object. It solves the problem of controlling access to that object: lazy creation, security, remote calls or caching."
  - "Facade puts one new, simpler interface in front of a whole subsystem of classes. It solves the problem of callers having to know many classes and the order to call them in."
example: "A caching proxy for a gateway has the same charge method as the gateway, so callers cannot tell them apart; it is a Proxy. PaymentFacade.pay is a new method that runs validation, fraud check, charge, receipt and notification across five classes; it is a Facade with its own simpler interface."
sayIt: "Proxy keeps the real object's exact interface and stands in for one object to control access. Facade invents a new, simpler interface over a whole subsystem. A proxy is swappable with the real object; a facade is a different, easier API."
diagrams:
  - |
    flowchart LR
      C[Caller] -- "charge()" --> P[Proxy] -- "charge()" --> G[UpiGateway]
  - |
    flowchart LR
      C[Caller] -- "pay()" --> F[PaymentFacade]
      F --> V[Validator]
      F --> G[PaymentGateway]
      F --> N[Notifier]
diagramAlt: "Proxy: the caller calls charge on the proxy, which calls the same charge on UpiGateway. Facade: the caller calls pay on PaymentFacade, which calls Validator, PaymentGateway and Notifier."
rows:
  - { aspect: "Interface", a: "Identical to the real object", b: "Its own, simpler one" }
  - { aspect: "Stands in front of", a: "One object", b: "A whole subsystem" }
  - { aspect: "Swappable with the real thing", a: "Yes, callers cannot tell", b: "No, it is a different API" }
  - { aspect: "Goal", a: "Control access to the object", b: "Make the subsystem easy to use" }
verdict: "Proxy when callers must keep the same interface but access needs control; Facade when callers need one easy entry into many classes."
sources:
  - title: "Proxy: relations with other patterns (refactoring.guru)"
    url: "https://refactoring.guru/design-patterns/proxy"
    verifiedOn: "2026-10-20"
