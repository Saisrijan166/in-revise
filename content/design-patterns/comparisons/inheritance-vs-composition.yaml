id: inheritance-vs-composition
tech: design-patterns
title: Inheritance vs Composition
compares: [class-inheritance, object-composition]
gist:
  - "is-a: extend a parent and reuse its code"
  - "has-a: hold a part and delegate to it"
explain:
  - "Inheritance makes one class a subtype of another with extends, so it reuses and can override the parent's code. It solves 'this new class is a kind of that class' and gives polymorphism through the base type."
  - "Composition gives a class another object as a field and forwards work to it (delegation). It solves 'this class needs what that object does' and lets you swap the held part at run time."
example: "A PaymentService that must support UPI, card and wallet. With inheritance you write UpiCheckout, CardCheckout and WalletCheckout subclasses, fixed at compile time. With composition PaymentService holds one PaymentStrategy field, and you pass whichever method you need, or a fake in a test."
rows:
  - { aspect: "Relation", a: "is-a: UpiCheckout extends Checkout", b: "has-a: PaymentService holds a PaymentStrategy" }
  - { aspect: "Fixed when", a: "At compile time, by extends", b: "At run time: pass another part" }
  - { aspect: "Depends on", a: "The parent's internals", b: "Only the part's interface" }
  - { aspect: "Parent or part changes", a: "Can silently break subclasses", b: "Hidden behind the interface" }
  - { aspect: "Testing", a: "Needs the whole hierarchy", b: "Swap the part for a test double" }
verdict: "Default to composition; extend only for a true is-a, from a base class designed for extension."
sayIt: "Inheritance is an is-a: a subclass reuses the parent's code but depends on its internals and is fixed at compile time. Composition is a has-a: a class holds a part behind its interface and delegates, so I can swap it at run time. I default to composition and inherit only for a genuine is-a."
sources:
  - title: "Compositional Design Principles (H. B. Christensen, Aarhus University lecture)"
    url: "https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf"
    verifiedOn: "2026-10-20"
  - title: "Design Principles from Design Patterns: Erich Gamma interview (Artima, 2005)"
    url: "https://www.artima.com/articles/design-principles-from-design-patterns"
    verifiedOn: "2026-10-20"
  - title: "A Study of the Fragile Base Class Problem (Mikhajlov and Sekerinski, ECOOP 1998)"
    url: "http://www.cas.mcmaster.ca/~emil/Publications_files/MikhajlovSekerinski98FragileBaseClassProblem.pdf"
