id: factory-method-vs-abstract-factory
tech: design-patterns
title: Factory Method vs Abstract Factory
compares: [factory-method, abstract-factory]
gist:
  - "One method makes one product; a subclass picks it"
  - "One object makes a whole family of matching products"
explain:
  - "Factory Method is a pattern where a superclass declares one creating method and each subclass overrides it to decide which single product is made. It varies one product type through inheritance, keeping the caller unaware of the concrete class."
  - "Abstract Factory is an object with one creating method per product in a related family. Each concrete factory makes a matching set of products of one variant, so the family can be swapped as a whole without ever mixing variants."
example: "UpiCheckout extends Checkout and overrides createGateway() to return a UpiGateway: Factory Method, one product chosen by subclass. A SandboxProviderFactory makes both a test PaymentClient and a test RefundClient: Abstract Factory, a whole family from one variant."
rows:
  - { aspect: "Creates", a: "One product", b: "A family of related products" }
  - { aspect: "Varies by", a: "Inheritance: a subclass overrides the method", b: "Composition: the client is given a factory object" }
  - { aspect: "Add a variant", a: "A new creator subclass", b: "A new concrete factory" }
  - { aspect: "Add a product type", a: "Not applicable: one product", b: "Edit the interface and every factory" }
  - { aspect: "Payment example", a: "UpiCheckout overrides createGateway()", b: "LiveProviderFactory makes PaymentClient + RefundClient" }
verdict: "One product whose class a subclass decides: Factory Method. Several products that must match: Abstract Factory, often built from factory methods."
sayIt: "Factory Method varies one product by subclass overriding a creating method. Abstract Factory is one object that makes a family of related products that must match, usually built from several factory methods. One product: Factory Method. A matching set: Abstract Factory."
sources:
  - title: "Abstract Factory: structure and relations with Factory Method (refactoring.guru)"
    url: "https://refactoring.guru/design-patterns/abstract-factory"
    verifiedOn: "2026-10-20"
