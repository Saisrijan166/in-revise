    url: "https://docs.oracle.com/javase/specs/jls/se8/html/jls-9.html#jls-9.4"
    verifiedOn: "2026-10-20"
  - title: "JEP 213: Milling Project Coin, private interface methods (OpenJDK, Java 9)"
    url: "https://openjdk.org/jeps/213"
    verifiedOn: "2026-10-20"
