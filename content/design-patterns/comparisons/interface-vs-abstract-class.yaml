id: interface-vs-abstract-class
tech: design-patterns
title: Interface vs Abstract Class
compares: [java-interface-type, abstract-base-class]
gist:
  - "A role: what a class can do; many per class"
  - "A partial parent: shared state and code; one only"
explain:
  - "An interface is a pure role: a set of method signatures a class promises to provide. It has no instance state, and a class may implement any number of interfaces, so unrelated classes can share one role."
  - "An abstract class is a partial parent: it can hold instance fields, constructors and finished methods, leaving some abstract for subclasses. A class extends only one, so it suits close relatives sharing state and code."
example: "PaymentStrategy is a role many unrelated classes play, so it is an interface. A base AbstractGateway that stores a shared HttpClient and timeout, and implements connect() once for all gateways, holds state and so is an abstract class that concrete gateways extend."
rows:
  - { aspect: "A class uses it with", a: "implements: any number", b: "extends: only one superclass" }
  - { aspect: "Fields", a: "Only public static final constants", b: "Any instance fields" }
  - { aspect: "Constructors", a: "None", b: "Yes, run through super(...)" }
  - { aspect: "Method bodies", a: "default and static (Java 8), private (Java 9)", b: "Any concrete method, any access level" }
  - { aspect: "Fits", a: "Unrelated classes sharing a role: PaymentStrategy", b: "Close relatives sharing code and state" }
verdict: "Start with an interface for the role; add an abstract class only when implementations share state or code."
sayIt: "An interface is a role with no instance state, and a class implements many, so I use it for a contract unrelated classes share. An abstract class holds state and shared code but allows single inheritance only. Since Java 8 interfaces also have default methods, the real splitter is instance state."
