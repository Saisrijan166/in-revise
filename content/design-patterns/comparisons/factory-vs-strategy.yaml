id: factory-vs-strategy
tech: design-patterns
title: Factory vs Strategy
compares: [factory-method, strategy]
gist:
  - "Creates or selects the right object"
  - "Is the behaviour that object then carries out"
explain:
  - "A factory is creational: its job is to decide which object to make or pick, hiding the concrete class from the caller. It answers the question which object do I need?"
  - "Strategy is behavioural: it is an interchangeable algorithm behind a common interface, so the same operation can be done different ways. It answers the question how is the job done?"
example: "GatewayFactory.create(UPI) decides which gateway object to build: that is the factory. The returned UpiPayment.pay(amount) runs one of several interchangeable payment algorithms: that is the strategy. The factory selects it; the service executes it."
rows:
  - { aspect: "Question it answers", a: "Which object do I need?", b: "How is the job done?" }
  - { aspect: "GoF family", a: "Creational", b: "Behavioural" }
  - { aspect: "Changes when", a: "A new type must be created", b: "A new algorithm is added" }
  - { aspect: "Payment example", a: "GatewayFactory.create(UPI)", b: "UpiPayment.pay(amount)" }
verdict: "Not either-or: a factory (or Spring) picks the strategy, and the service runs it."
sayIt: "A factory selects or creates the right object; a strategy is the interchangeable behaviour that object performs. They are not either-or: a factory (or Spring) picks the strategy, and the service runs it. Creational versus behavioural."
sources:
  - title: "Design patterns catalogue: creational and behavioural families (refactoring.guru)"
    url: "https://refactoring.guru/design-patterns/catalog"
    verifiedOn: "2026-10-20"
