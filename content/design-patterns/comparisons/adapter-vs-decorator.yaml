id: adapter-vs-decorator
tech: design-patterns
title: Adapter vs Decorator
compares: [adapter, decorator]
gist:
  - "Changes the interface; adds no new behaviour"
  - "Keeps the interface; adds behaviour around it"
diagrams:
  - |
    flowchart LR
      C[PaymentService] -- "charge(BigDecimal)" --> A[UpiAdapter] -- "makePaymentInPaise(long)" --> S[ExternalUpiSdk]
  - |
    flowchart LR
      C[PaymentService] -- "charge(BigDecimal)" --> L[LoggingGateway] -- "charge(BigDecimal)" --> U[UpiGateway]
diagramAlt: "Adapter: PaymentService calls charge with a BigDecimal, and UpiAdapter calls the SDK's makePaymentInPaise with a long, a different method. Decorator: PaymentService calls charge, and LoggingGateway calls the same charge method on UpiGateway."
rows:
  - { aspect: "Interface", a: "Different on each side: target vs adaptee", b: "The same on both sides" }
  - { aspect: "Goal", a: "Make an existing class fit", b: "Add a feature such as logging" }
  - { aspect: "Stacking", a: "Not recursive: one translation layer", b: "Decorators wrap decorators, any depth" }
  - { aspect: "Java example", a: "InputStreamReader: bytes read as chars", b: "BufferedInputStream around a stream" }
verdict: "Use Adapter when the interfaces do not match; use Decorator when they match and you need extra behaviour."
sources:
  - title: "Adapter: relations with other patterns (refactoring.guru)"
    url: "https://refactoring.guru/design-patterns/adapter"
    verifiedOn: "2026-10-20"
  - title: "InputStreamReader (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/InputStreamReader.html"
    verifiedOn: "2026-10-20"
  - title: "BufferedInputStream (Java SE 25 API)"
    url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/BufferedInputStream.html"
    verifiedOn: "2026-10-20"
