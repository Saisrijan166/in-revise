id: observer-vs-pub-sub
tech: design-patterns
title: Observer vs Pub/Sub
compares: [observer, publish-subscribe]
gist:
  - "The subject calls its observers directly, in one app"
  - "A broker passes messages; sides never know each other"
diagrams:
  - |
    flowchart LR
      S[PaymentService] -- calls --> R[ReceiptService]
      S -- calls --> L[LoyaltyService]
  - |
    flowchart LR
      P[Payment service] -- PaymentSucceeded --> B[(Broker topic)]
      B --> R[Receipt service]
      B --> L[Loyalty service]
diagramAlt: "Observer: PaymentService calls ReceiptService and LoyaltyService directly. Pub/sub: the payment service sends PaymentSucceeded to a broker topic, and the broker delivers a copy to the receipt and loyalty services."
rows:
  - { aspect: "Who knows whom", a: "Subject holds references to its observers", b: "Publisher and subscribers know only the topic" }
  - { aspect: "Where", a: "One process, in memory", b: "Across services, through a broker" }
  - { aspect: "Timing", a: "Usually synchronous: the subject waits", b: "Asynchronous: the publisher does not wait" }
  - { aspect: "If the app crashes mid-way", a: "The in-memory event is lost", b: "The broker can keep it and redeliver" }
  - { aspect: "Watch out for", a: "Slow listeners slow the subject", b: "Duplicates and order: make consumers idempotent" }
verdict: "Use Observer (Spring events) inside one app; use pub/sub through a broker when other services must get the event reliably."
sources:
