id: observer-vs-pub-sub
tech: design-patterns
title: Observer vs Pub/Sub
compares: [observer, publish-subscribe]
gist:
  - "The subject calls its observers directly, in one app"
  - "A broker passes messages; sides never know each other"
explain:
  - "Observer keeps a subject with a list of observer objects in one process. When it changes it loops the list and calls each observer directly. It adds reactions inside one app without the subject depending on them."
  - "Publish/subscribe puts a message broker between a publisher and its subscribers. The publisher sends a message to a topic and the broker delivers a copy to each subscriber, so separate services can react without knowing each other."
example: "After a payment succeeds, a receipt and loyalty points are needed. If both are code in the same app, PaymentService publishes a Spring event and two @EventListener observers react in-process. If the loyalty service is a separate microservice, PaymentService instead sends a PaymentSucceeded message to a broker topic, and the loyalty service consumes it even if it was briefly down."
diagrams:
  - |
    flowchart LR
      S[PaymentService] -- calls --> R[ReceiptService]
      S -- calls --> L[LoyaltyService]
  - |
    flowchart LR
      P[Payment service] -- PaymentSucceeded --> B[(Broker topic)]
      B --> R[Receipt service]
      B --> L[Loyalty service]
diagramAlt: "Observer: PaymentService calls ReceiptService and LoyaltyService directly. Pub/sub: the payment service sends PaymentSucceeded to a broker topic, and the broker delivers a copy to the receipt and loyalty services."
rows:
  - { aspect: "Who knows whom", a: "Subject holds references to its observers", b: "Publisher and subscribers know only the topic" }
  - { aspect: "Where", a: "One process, in memory", b: "Across services, through a broker" }
  - { aspect: "Timing", a: "Usually synchronous: the subject waits", b: "Asynchronous: the publisher does not wait" }
  - { aspect: "If the app crashes mid-way", a: "The in-memory event is lost", b: "The broker can keep it and redeliver" }
  - { aspect: "Watch out for", a: "Slow listeners slow the subject", b: "Duplicates and order: make consumers idempotent" }
verdict: "Use Observer (Spring events) inside one app; use pub/sub through a broker when other services must get the event reliably."
sayIt: "Observer has a subject call its observers directly in one process, usually synchronously. Pub/sub puts a broker between publisher and subscribers, so they do not know each other and the event crosses services reliably. I use Observer in one app and a broker between services."
