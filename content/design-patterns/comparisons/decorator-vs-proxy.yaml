id: decorator-vs-proxy
tech: design-patterns
title: Decorator vs Proxy
compares: [decorator, proxy]
gist:
  - "Adds responsibilities; the client builds the chain"
  - "Controls access; usually manages the real object"
diagrams:
  - |
    flowchart LR
      C[Client builds the chain] --> L[LoggingGateway] --> M[MetricsGateway] --> U[UpiGateway]
  - |
    flowchart LR
      C[Client] --> P[Proxy] -- "allowed? created yet?" --> R[Real object]
diagramAlt: "Decorator: the client itself nests LoggingGateway around MetricsGateway around UpiGateway. Proxy: the client calls the proxy, which checks access or creates the real object, then passes the call on."
rows:
  - { aspect: "Intent", a: "Add behaviour such as logging or metrics", b: "Control access: lazy load, security, remote" }
  - { aspect: "Who creates the wrapped object", a: "The client, which composes the layers", b: "Usually the proxy, or a framework like Spring" }
  - { aspect: "Does the client know", a: "Yes, it chose the decorators", b: "Often not; it thinks it has the real object" }
  - { aspect: "Java example", a: "BufferedInputStream(FileInputStream)", b: "java.lang.reflect.Proxy, Spring AOP proxies" }
verdict: "Same structure, different intent: Decorator to add features the caller picks, Proxy to guard or defer access to one object."
sources:
