name: Design Patterns
slug: design-patterns
accent: violet
summary: "Software design patterns for Java interviews: core principles and SOLID, the 23 GoF patterns, DI, Repository and MVC, and how to pick and explain a pattern."
codeLanguages:
  - java
storySpine:
  - step: The same design problems keep coming back and take long to explain → reuse a named GoF pattern from one of three families
    cards:
      - what-are-design-patterns
  - step: A subclass per payment method breaks whenever the parent changes → depend on an interface, hold the part and delegate to it
    cards:
      - composition-over-inheritance
      - design-principles
  - step: One class mixes payment rules, receipts and SMS, so every change breaks something else → give each reason to change its own class
    cards:
      - single-responsibility
  - step: Each new payment method means editing working code, and some implementations surprise their callers → depend on small interfaces the business side owns, and make every implementation keep the contract
    cards:
      - open-closed
      - liskov-substitution
      - interface-segregation
      - dependency-inversion
  - step: Code calls new everywhere, so changing which class is made means editing many places → let a factory pick the class, or one factory per family
    cards:
      - factory-method
      - abstract-factory
  - step: Some objects need one shared instance, many optional fields, or a near-copy of another → use a singleton (or a Spring bean), a builder, or a prototype copy
    cards:
      - singleton
      - builder
      - prototype
  - step: A provider SDK does not fit your PaymentGateway, and you want logging and checks around every charge → adapt the SDK, then wrap the gateway in decorators or a proxy
    cards:
      - adapter
      - decorator
      - proxy
  - step: Callers repeat five payment steps, split payments nest, and millions of objects copy the same data → put a facade in front, model parts as a composite or bridge, and share flyweights
    cards:
      - facade
      - composite
      - bridge
      - flyweight
  - step: Every new payment method edits one huge if-else, and similar processors copy the same flow → put each method behind a PaymentStrategy, and fix shared steps in a template method
    cards:
      - strategy
      - template-method
  - step: Status checks spread through every method, refunds must run later, and checks pile into one block → state objects, command objects and a chain of handlers
    cards:
      - state
      - command
      - chain-of-responsibility
  - step: After a ₹500 payment succeeds, receipts and loyalty points must react, and screen parts keep calling each other → publish an event to observers, and route the screen's talk through a mediator
    cards:
      - observer
      - mediator
  - step: Callers must loop over payments, undo form changes and add fee rules without touching stable classes → hide storage behind an iterator, save mementos, and put new operations in a visitor
    cards:
      - iterator
      - memento
      - visitor
  - step: Each class builds its own collaborators with new and mixes SQL into business code → let the container inject them, keep persistence behind a repository, and route every request through one front controller
    cards:
      - dependency-injection
      - repository-and-dao
      - mvc
  - step: Patterns get learnt as definitions and then forced everywhere → spot them in the JDK and Spring, and recognise the anti-patterns that overengineering creates
    cards:
      - patterns-in-jdk-and-spring
      - anti-patterns
  - step: You know 23 pattern names but freeze when asked which one fits → match the problem you hear to a pattern and explain it in five beats
    cards:
      - choosing-a-pattern
  - step: Two patterns look the same on the whiteboard → split them by intent with one question per pair
    cards:
      - pattern-confusions-map
topics:
  - id: basics
    title: Pattern Basics
    order: 1
    blurb: What a design pattern is, the three GoF families, and the principles every pattern rests on.
  - id: solid
    title: SOLID Principles
    order: 2
    blurb: "Five rules for code that is easy to change: one reason to change, extend not edit, safe subtypes, small interfaces, depend on abstractions."
  - id: creational
    title: Creational Patterns
    order: 3
    blurb: "Control how objects are made: one shared instance, factories, step-by-step builders and copies."
  - id: structural
    title: Structural Patterns
    order: 4
    blurb: "Wrap, adapt, simplify and share objects: adapter, decorator, proxy, facade, composite, bridge and flyweight."
  - id: behavioural
    title: "Behavioural Patterns: Algorithms and Requests"
    order: 5
    blurb: Swap an algorithm, fix the steps, react to state, turn a request into an object, pass it along a chain.
  - id: behavioural-objects
    title: "Behavioural Patterns: Events and Object Structures"
    order: 6
    blurb: Notify listeners, route talk through a mediator, walk a collection, save and restore state, add operations with a visitor.
  - id: enterprise
    title: Patterns in Real Apps
    order: 7
    blurb: Dependency injection, Repository and DAO, MVC, where the JDK and Spring use patterns, and the anti-patterns to avoid.
  - id: playbook
    title: Choosing a Pattern
    order: 8
    blurb: Pick the pattern from the problem, explain it in 20 seconds, and tell look-alike patterns apart.
