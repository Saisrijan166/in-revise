topics:
  basics:
    - id: what-are-design-patterns
      children:
        - id: gof-book
          label: GoF book (1994)
          note: Gamma, Helm, Johnson, Vlissides; Addison-Wesley; 23 patterns
        - id: creational-family
          label: Creational patterns
          note: 5 patterns that control how objects are created
        - id: structural-family
          label: Structural patterns
          note: 7 patterns that assemble classes and objects into structures
        - id: behavioural-family
          label: Behavioural patterns
          note: 11 patterns that share work and talk between objects
        - id: pattern-levels
          label: Pattern levels
          note: From small language idioms up to whole-app architecture
          children:
            - id: idiom-level
              label: Idiom
              note: "Lowest level: a small pattern for one language"
            - id: architectural-pattern-level
              label: Architectural pattern
              note: "Highest level: shapes the architecture of a whole app"
    - id: composition-over-inheritance
      children:
        - id: class-inheritance
          label: Inheritance (is-a)
          note: "extends: the subclass reuses and overrides the parent's code"
          children:
            - id: fragile-base-class
              label: Fragile base class
              note: A safe-looking base class change breaks subclasses
            - id: stack-extends-vector
              label: Stack extends Vector
              note: "JDK misfit: its Javadoc says use Deque, such as ArrayDeque"
            - id: when-to-inherit
              label: When to inherit
              note: A true is-a, and a base class built for extension
        - id: object-composition
          label: Composition (has-a)
          note: Hold a part in a field; swap it at run time
          children:
            - id: delegation-call
              label: Delegation
              note: The holder forwards the call to its part
    - id: design-principles
      children:
        - id: program-to-interface
          label: Program to an interface
          note: "Declare the role type: List, PaymentStrategy"
          children:
            - id: java-interface-type
              label: Interface
              note: A role with no instance fields; a class may implement many
            - id: abstract-base-class
              label: Abstract class
              note: Shared state and code; a class extends only one class
        - id: encapsulate-varies
          label: Encapsulate what varies
          note: "GoF: decide what should vary, then hide it behind a role"
        - id: coupling-and-cohesion
          label: Coupling and cohesion
          note: Low coupling between classes, high cohesion inside each
        - id: dry-rule
          label: DRY
          note: One authoritative home for each piece of knowledge
        - id: simplicity-rules
          label: KISS and YAGNI
          note: Simplest design now; nothing built for a guessed future
          children:
            - id: kiss-rule
              label: KISS
              note: "Keep it simple: simpler code is easier to read and maintain"
            - id: yagni-rule
              label: YAGNI
              note: From Extreme Programming; refactoring is still allowed
        - id: demeter-rule
          label: Law of Demeter
          note: Talk only to friends; Northeastern University, 1987
  solid:
    - id: single-responsibility
      children:
        - id: srp-one-reason
          label: One reason to change
          note: "Martin: a module should have one, and only one, reason to change"
        - id: srp-people-not-bugs
          label: Reasons are people
          note: One business function asks for changes; bug fixes do not count
        - id: srp-gather-separate
          label: Gather and separate
          note: Group what changes for the same reason; split what does not
        - id: srp-parnas-roots
          label: Parnas and separation of concerns
          note: Martin traces SRP to Parnas (1972) and Dijkstra (1974)
    - id: open-closed
      children:
        - id: ocp-meyer-1988
          label: Meyer's definition (1988)
          note: Bertrand Meyer, Object-Oriented Software Construction, 1988
        - id: ocp-abstraction-form
          label: "Martin's form: abstraction"
          note: Depend on a fixed abstraction; new implementations extend it
        - id: ocp-strategic-closure
          label: Strategic closure
          note: No program is 100% closed; close against the likely changes
        - id: ocp-plugin-architecture
          label: Plugin architecture
          note: Plugins depend on the core; the core knows no plugin
    - id: liskov-substitution
      children:
        - id: lsp-precondition-rule
          label: Preconditions not stronger
          note: A subtype method accepts every call the base method accepts
        - id: lsp-postcondition-rule
          label: Postconditions not weaker
          note: A subtype method promises at least what the base method does
        - id: lsp-invariant-rule
          label: Invariants kept
          note: What is always true of the base type stays true of the subtype
        - id: lsp-exception-rule
          label: No new exceptions
          note: A subtype method may not signal more than the base method
        - id: lsp-square-rectangle
          label: Square and Rectangle
          note: "Square.setWidth also changes height: a weaker postcondition"
        - id: lsp-optional-operations
          label: Optional operations (JDK)
          note: Collection lets mutators throw UnsupportedOperationException
    - id: interface-segregation
      children:
        - id: isp-fat-interface-node
          label: Fat interface
          note: One large interface that serves every kind of client
        - id: isp-role-interface-node
          label: Role interface
          note: One interface per interaction; a supplier implements several
        - id: isp-client-types
          label: Per client type
          note: Group clients by type; a shared method may sit in two interfaces
        - id: isp-many-interfaces-java
          label: implements A, B, C
          note: A Java class may name several interfaces in its implements clause
        - id: isp-rebuild-cost
          label: Rebuild cost
          note: A change for one client can force others to recompile and redeploy
    - id: dependency-inversion
      children:
        - id: dip-high-level-node
          label: High-level module
          note: Holds business policy, such as PaymentService
        - id: dip-low-level-node
          label: Low-level module
          note: "Holds details: an SDK call, SQL, formatting"
        - id: dip-policy-owns-interface
          label: Policy owns the interface
          note: Source dependencies point towards the high-level abstractions
        - id: dip-ways-to-supply
          label: Ways to supply the detail
          note: Code depends on the interface; something must create the class
          children:
            - id: dip-via-injection
              label: Dependency injection
              note: An assembler passes the implementation in (Fowler, 2004)
            - id: dip-via-abstract-factory
              label: Abstract factory
              note: "Martin (2000): hides the concrete class at creation time"
            - id: dip-via-service-locator
              label: Service locator
              note: The class asks a registry; it still sees only the interface
  creational:
    - id: singleton
      children:
        - id: eager-singleton
          label: Eager static final field
          note: Created during class initialisation, which is thread-safe
        - id: double-checked-locking
          label: Double-checked locking
          note: Locks only on first creation; correct only with volatile (Java 5+)
        - id: holder-idiom
          label: Initialisation-on-demand holder
          note: A nested class holds the instance; created on first use
        - id: enum-singleton
          label: Enum singleton
          note: One-constant enum; no reflective or deserialised copies
        - id: spring-singleton-scope
          label: Spring singleton scope
          note: "Default scope: one instance per bean definition per container"
        - id: static-utility-class
          label: Static utility class (not a singleton)
          note: Only static methods, no instance; e.g. java.util.Collections
    - id: factory-method
      children:
        - id: simple-factory
          label: Simple factory
          note: One method with a big conditional; from Head First, not GoF
        - id: static-factory-method
          label: Static factory method
          note: A named static method instead of new, e.g. List.of (Java 9)
        - id: gof-factory-method
          label: Factory Method (GoF)
          note: A subclass overrides the creating method to change the product
          children:
            - id: factory-creator
              label: Creator
              note: Declares the factory method; returns the product interface
            - id: factory-product
              label: Product
              note: The common interface of every object the method returns
        - id: spring-bean-map
          label: Map of beans (Spring)
          note: Inject Map<String, PaymentStrategy>; keys are bean names
    - id: abstract-factory
      children:
        - id: product-family
          label: Product family
          note: Products used together, e.g. payment client + refund client
        - id: abstract-factory-interface
          label: Abstract factory interface
          note: One creation method per product of the family
        - id: concrete-factory
          label: Concrete factory
          note: One per variant; makes only products of that variant
        - id: abstract-product
          label: Abstract product
          note: An interface per product; the client sees only these
    - id: builder
      children:
        - id: bloch-builder
          label: Static nested builder
          note: Setters return the builder; build() makes the object
        - id: gof-builder
          label: GoF builder with a director
          note: A director runs the building steps in a fixed order
        - id: lombok-builder
          label: Lombok @Builder
          note: Generates the builder class and builder() for you
        - id: http-request-builder
          label: HttpRequest.newBuilder()
          note: JDK builder (Java 11); build() returns an immutable request
        - id: record-instead-of-builder
          label: Record instead (Java 16)
          note: A carrier for immutable data; enough when all fields are required
    - id: prototype
      children:
        - id: shallow-copy
          label: Shallow copy
          note: Copies field values; mutable objects inside stay shared
        - id: deep-copy
          label: Deep copy
          note: Also copies the mutable objects inside
        - id: object-clone
          label: Object.clone() + Cloneable
          note: Protected and shallow; throws without Cloneable
        - id: copy-constructor
          label: Copy constructor
          note: Copies an object of the same type, like new ArrayList<>(list)
        - id: prototype-registry
          label: Prototype registry
          note: A name-to-object map of ready-made objects to copy
        - id: spring-prototype-scope
          label: Spring prototype scope (not a copy)
          note: A new bean instance on every request; nothing is copied
  structural:
    - id: adapter
      children:
        - id: target-interface
          label: Target
          note: "The interface the client already calls: PaymentGateway"
        - id: adaptee
          label: Adaptee
          note: "The existing, incompatible class: ExternalUpiSdk"
        - id: object-adapter
          label: Object adapter
          note: Implements the target and wraps the adaptee
        - id: class-adapter
          label: Class adapter
          note: Inherits from the adaptee instead of wrapping it
        - id: adapters-in-java
          label: Adapters in Java and Spring
          note: Library classes that make one interface usable as another
          children:
            - id: input-stream-reader
              label: InputStreamReader
              note: Reads a byte stream as characters, using a charset
            - id: arrays-as-list
              label: Arrays.asList
              note: A fixed-size List view backed by an array
            - id: handler-adapter
              label: HandlerAdapter (Spring MVC)
              note: Lets DispatcherServlet invoke a handler, however it is called
    - id: decorator
      children:
        - id: concrete-component
          label: Wrapped object
          note: The real object, UpiGateway, at the centre of the layers
        - id: base-decorator
          label: Decorator
          note: Holds a field of the shared interface and delegates to it
        - id: java-io-decorators
          label: Java I/O streams
          note: FilterInputStream wraps another stream and passes calls to it
          children:
            - id: buffered-input-stream
              label: BufferedInputStream
              note: Adds a buffer and mark/reset to another input stream
    - id: proxy
      children:
        - id: proxy-kinds
          label: Kinds by purpose
          note: Same interface as the real object; differ in why they stand in
          children:
            - id: virtual-proxy
              label: Virtual (lazy) proxy
              note: Creates the costly real object only when first needed
            - id: protection-proxy
              label: Protection proxy
              note: Passes the call on only if the caller's rights allow it
            - id: remote-proxy
              label: Remote proxy
              note: Looks local; sends the call to an object on another server
            - id: caching-proxy
              label: Caching or logging proxy
              note: Reuses earlier results, or records each call
        - id: proxy-mechanisms
          label: How Java builds them
          note: Spring AOP uses either of these at runtime
          children:
            - id: jdk-dynamic-proxy
              label: JDK dynamic proxy
              note: "java.lang.reflect.Proxy: a runtime class for listed interfaces"
            - id: cglib-proxy
              label: CGLIB proxy
              note: A runtime subclass; final classes cannot be proxied
    - id: facade
      children:
        - id: facade-subsystem
          label: Subsystem
          note: The classes behind the facade; they do not know it exists
        - id: slf4j
          label: SLF4J
          note: Simple Logging Facade for Java over Logback, JUL and others
        - id: bloated-facade
          label: Bloated facade
          note: A facade can grow into a god object; split it when big
    - id: composite
      children:
        - id: composite-component
          label: Component
          note: One interface for simple and complex tree elements
        - id: composite-leaf
          label: Leaf
          note: Has no children; usually does the real work
        - id: composite-container
          label: Container (composite)
          note: Holds children and delegates work to them
        - id: awt-container
          label: java.awt.Container
          note: A Component that can contain other AWT components
    - id: bridge
      children:
        - id: bridge-abstraction
          label: Abstraction
          note: High-level logic that delegates to an implementation object
        - id: bridge-implementor
          label: Implementation
          note: "The low-level side the abstraction calls: PaymentProvider"
    - id: flyweight
      children:
        - id: intrinsic-state
          label: Intrinsic state
          note: Unchanging data kept inside the shared object
        - id: extrinsic-state
          label: Extrinsic state
          note: Per-use data the caller passes into methods
        - id: flyweight-factory
          label: Flyweight factory
          note: Returns an existing flyweight before creating a new one
        - id: integer-cache
          label: Integer cache
          note: Integer.valueOf always caches -128 to 127 (Java SE 25)
        - id: string-interning
          label: String interning
          note: Equal string literals share one String instance (JLS 3.10.5)
        - id: currency-instance
          label: Currency.getInstance
          note: Never more than one Currency instance per currency
  behavioural:
    - id: strategy
      children:
        - id: strategy-context
          label: Context
          note: "Holds a strategy and delegates the work to it: PaymentService"
        - id: strategy-interface
          label: Strategy interface
          note: "The one method every algorithm shares: pay(amount)"
        - id: concrete-strategies
          label: Concrete strategies
          note: "UpiPayment, CardPayment, WalletPayment: one algorithm each"
        - id: lambda-strategy
          label: Lambda as a strategy
          note: A functional interface lets a lambda replace the class (Java 8)
        - id: comparator-strategy
          label: Comparator (JDK)
          note: Passed to a sort method to control the order
    - id: state
      children:
        - id: state-context
          label: Context (State)
          note: Holds the current state object and forwards each event to it
        - id: concrete-states
          label: Concrete states
          note: One class per state; it does the work and may set the next state
        - id: state-transitions
          label: Transitions
          note: Allowed moves between states; the rest are rejected
        - id: switch-state-machine
          label: Switch-based state machine
          note: "Without the pattern: a switch on status in every method"
        - id: enum-constant-states
          label: Enum with constant bodies
          note: Each enum constant overrides a method, so behaviour lives per state
    - id: template-method
      children:
        - id: final-template-method
          label: Template method
          note: A final method that calls the steps in a fixed order
        - id: abstract-steps
          label: Abstract steps
          note: Steps every subclass must implement
        - id: hook-methods
          label: Hook methods
          note: Optional steps with an empty default body
        - id: abstractlist-template
          label: AbstractList (JDK)
          note: Implement get(int) and size(); the rest of List is built on them
        - id: jdbctemplate-callbacks
          label: JdbcTemplate (callbacks)
          note: Fixed JDBC workflow; your code comes in as callbacks, not subclasses
    - id: command
      children:
        - id: command-client
          label: Client
          note: Creates the command and gives it the receiver and the data
        - id: command-invoker
          label: Invoker
          note: Triggers execute() without knowing what the command does
        - id: command-object
          label: Command object
          note: "Stores the request's parameters as fields: RefundCommand"
        - id: command-receiver
          label: Receiver
          note: "Does the real work: RefundService.refund(id)"
        - id: runnable-callable-tasks
          label: Runnable and Callable (JDK)
          note: Task objects submitted to an ExecutorService to run later
    - id: chain-of-responsibility
      children:
        - id: first-handler-chain
          label: Classic chain (one handler)
          note: Passed along until one handler can deal with it, then stops
        - id: pipeline-chain
          label: Pipeline chain (every handler)
          note: Each handler does its part, then passes it on or stops it
        - id: servlet-filter-chain
          label: Servlet FilterChain
          note: A filter calls chain.doFilter() to pass on, or skips it to block
        - id: spring-security-filter-chain
          label: Spring Security filter chain
          note: FilterChainProxy runs only the first SecurityFilterChain that matches
  behavioural-objects:
    - id: observer
      children:
        - id: push-model
          label: Push model
          note: The subject sends the event data with each notification
        - id: pull-model
          label: Pull model
          note: The subject passes itself; each observer fetches what it needs
        - id: java-util-observer-api
          label: java.util.Observer and Observable
          note: "Deprecated since Java 9: limited model, unspecified order"
        - id: spring-application-events
          label: Spring application events
          note: publishEvent() on ApplicationEventPublisher; @EventListener receives
          children:
            - id: async-event-listener
              label: "@Async listener"
              note: Runs on another thread; its exceptions do not reach the caller
            - id: transactional-listener
              label: "@TransactionalEventListener"
              note: Runs after commit by default; skipped if no transaction
        - id: publish-subscribe
          label: Publish-subscribe (broker)
          note: A broker copies each message to every interested subscriber
    - id: mediator
      children:
        - id: mediator-colleagues
          label: Colleagues (components)
          note: Hold a reference to the mediator interface, not to each other
        - id: concrete-mediator
          label: Concrete mediator
          note: Holds the rules and the components it coordinates
        - id: observer-based-mediator
          label: Mediator built on Observer
          note: The mediator publishes events; components subscribe
    - id: iterator
      children:
        - id: java-util-iterator
          label: java.util.Iterator
          note: hasNext(), next() and an optional remove(); since Java 1.2
        - id: iterable-type
          label: Iterable
          note: Its iterator() makes a type work in the enhanced for loop
        - id: fail-fast-iterators
          label: Fail-fast iterator
          note: Throws ConcurrentModificationException, on a best-effort basis
        - id: weakly-consistent-iterators
          label: Weakly consistent iterator
          note: "java.util.concurrent: never throws it; may miss later changes"
        - id: external-iteration
          label: External iteration
          note: The caller drives the loop with hasNext() and next()
        - id: internal-iteration
          label: Internal iteration
          note: "The collection drives it: forEach(action), Java 8"
    - id: memento
      children:
        - id: memento-originator
          label: Originator
          note: Makes a snapshot of its own state and restores from one
        - id: memento-snapshot
          label: Memento (snapshot)
          note: Holds the saved state; a record (Java 16) keeps it immutable
        - id: memento-caretaker
          label: Caretaker
          note: Keeps the history, often a stack, for undo
    - id: visitor
      children:
        - id: classic-visitor
          label: Classic accept and visit
          note: element.accept(v) calls v.visit(this); one visit per type
        - id: double-dispatch-node
          label: Double dispatch
          note: Both the element's and the visitor's runtime types pick the code
        - id: sealed-switch-visitor
          label: Sealed interface + pattern switch
          note: "Java 17 + 21: an exhaustive switch needs no default"
        - id: file-visitor
          label: FileVisitor (JDK)
          note: Files.walkFileTree calls it for each file and directory
        - id: interpreter
          label: Interpreter (related)
          note: "GoF behavioural: a small grammar as an object tree, then evaluate it"
          children:
            - id: terminal-expression
              label: Terminal expression
              note: A leaf rule, like one discount condition
            - id: non-terminal-expression
              label: Non-terminal expression
              note: Combines smaller expressions, like AND of two rules
  enterprise:
    - id: dependency-injection
      children:
        - id: constructor-injection
          label: Constructor injection
          note: For required dependencies; the style the Spring team advocates
        - id: setter-injection
          label: Setter injection
          note: For optional dependencies; allows re-injection later
        - id: field-injection
          label: Field injection
          note: "@Autowired on a field; tests set private fields by reflection"
        - id: interface-injection
          label: Interface injection
          note: Fowler's third style; not one of Spring's two DI variants
        - id: service-locator
          label: Service locator
          note: "The alternative to DI: the class asks a registry for it"
        - id: ioc-container
          label: IoC container
          note: Spring's ApplicationContext creates, configures and wires beans
          children:
            - id: bean-factory
              label: BeanFactory
              note: The basic container; ApplicationContext is a sub-interface
    - id: repository-and-dao
      children:
        - id: repository-pattern
          label: Repository
          term: repository-term
          note: Sits between the domain and data mapping, like a collection
          children:
            - id: jpa-repository
              label: JpaRepository
              note: Spring Data's JPA-specific repository interface
            - id: derived-query-method
              label: Derived query method
              note: "findByStatus: the query is built from the method name"
            - id: aggregate-ddd
              label: Aggregate root (DDD)
              note: "Spring Data: one repository per aggregate root"
        - id: dao-pattern
          label: DAO
          term: dao
          note: "Core J2EE: hides the data source from business components"
        - id: data-mapper
          label: Data Mapper
          note: Objects need no SQL and no knowledge of the schema
    - id: mvc
      children:
        - id: mvc-model
          label: Model
          note: Domain objects that are completely ignorant of the UI
        - id: mvc-view
          label: View
          note: "Spring: a ViewResolver turns a view name into a View"
        - id: mvc-controller
          label: Controller
          note: "Spring: a @Controller class; no base class to extend"
        - id: front-controller
          label: Front Controller
          note: Shared steps such as security run once, then dispatch
          children:
            - id: dispatcher-servlet
              label: DispatcherServlet
              note: Spring Boot 4.1 maps it to / by default (spring.mvc.servlet.path)
              children:
                - id: handler-mapping
                  label: HandlerMapping
                  note: Maps a request to a handler plus its interceptors
                - id: mvc-handler-adapter
                  label: HandlerAdapter
                  note: Invokes the handler, hiding how it is called
                - id: view-resolver
                  label: ViewResolver
                  note: Turns a logical view name into a View to render
        - id: rest-controller
          label: "@RestController"
          note: "@Controller plus @ResponseBody: no view rendering"
    - id: patterns-in-jdk-and-spring
      children:
        - id: factory-bean
          label: FactoryBean
          note: More than 50 implementations ship with Spring itself
        - id: configuration-cglib
          label: "@Configuration CGLIB subclass"
          note: The class and its @Bean methods must not be final
          children:
            - id: proxy-bean-methods-false
              label: proxyBeanMethods = false
              note: "Bean lite mode: each direct call makes a new object"
        - id: rest-client-builder
          label: RestClient.builder()
          note: RestClient.create() gives a default client instead
        - id: handler-interceptor
          label: HandlerInterceptor
          note: Not ideal for security; Spring recommends Spring Security
        - id: handler-exception-resolver
          label: HandlerExceptionResolver
          note: Spring's docs call it a strategy to resolve exceptions
    - id: anti-patterns
      children:
        - id: god-object
          label: God object
          note: Also called god class; a misapplied Mediator, per c2
        - id: golden-hammer
          label: Golden hammer
          note: "Cure: learn more tools so the familiar one is not forced"
        - id: singleton-abuse
          label: Singleton abuse
          note: "Fix: create one instance at the top and pass it down"
        - id: speculative-generality
          label: Speculative generality
          note: A code smell named in Fowler's book Refactoring
        - id: anemic-domain-model
          label: Anemic domain model
          note: "Fowler (2003): a domain model's costs without its benefits"
  playbook:
    - id: choosing-a-pattern
      children:
        - id: twenty-second-answer
          label: The 20-second answer
          note: Five beats, in order; worked on Strategy in this concept
          children:
            - id: answer-beat-problem
              label: 1. Problem
              note: "What hurts now: an if-else that grows with each method"
            - id: answer-beat-idea
              label: 2. Pattern idea
              note: The pattern's intent in one line
            - id: answer-beat-example
              label: 3. Payment example
              note: The ₹500 UPI, card or wallet payment
            - id: answer-beat-elsewhere
              label: 4. Where else
              note: One JDK or Spring use of the same pattern
            - id: answer-beat-trade-off
              label: 5. Trade-off
              note: "What it costs: more classes, more indirection"
        - id: pattern-only-when-needed
          label: No problem, no pattern
          note: "YAGNI: do not build for a need you only presume"
        - id: lld-interview-round
          label: Low-level design round
          term: lld-term
          note: Classes, methods and links for one component; patterns are tools
        - id: machine-coding-interview-round
          label: Machine coding round
          term: machine-coding-round-term
          note: Working, modular, extensible code in a couple of hours
    - id: pattern-confusions-map
      children:
        - id: wrapper-look-alikes
          label: Wrapper look-alikes
          note: "Adapter, Decorator, Proxy, Facade, Composite: ask about the interface"
        - id: behaviour-look-alikes
          label: Behaviour look-alikes
          note: "Strategy, State, Command, Template Method: who picks the behaviour"
        - id: creation-look-alikes
          label: Creation look-alikes
          note: "Factory Method, Abstract Factory, DI: who makes the object"
        - id: same-structure-different-intent
          label: Same structure, different intent
          note: Bridge, State and Strategy share a shape but solve different problems
