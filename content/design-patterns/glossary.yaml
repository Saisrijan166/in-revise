terms:
  - id: design-pattern
    term: Design pattern
    definition: A named, reusable solution shape for a design problem that keeps coming back.
    see: what-are-design-patterns
    source:
      title: "Design Patterns: Elements of Reusable Object-Oriented Software, eBook (InformIT, Addison-Wesley)"
      url: https://www.informit.com/store/design-patterns-elements-of-reusable-object-oriented-9780321700742
      verifiedOn: 2026-10-20
  - id: gang-of-four
    term: Gang of Four (GoF)
    aka:
      - Gang of Four
      - GoF
    definition: Gamma, Helm, Johnson and Vlissides, whose 1994 book catalogued 23 design patterns.
    see: what-are-design-patterns
    source:
      title: "Design Patterns: Elements of Reusable Object-Oriented Software, eBook (InformIT, Addison-Wesley)"
      url: https://www.informit.com/store/design-patterns-elements-of-reusable-object-oriented-9780321700742
      verifiedOn: 2026-10-20
  - id: creational-pattern
    term: Creational pattern
    definition: A pattern that controls how objects are created, such as Builder or Singleton.
    see: what-are-design-patterns
    source:
      title: Classification of patterns (Refactoring.Guru)
      url: https://refactoring.guru/design-patterns/classification
      verifiedOn: 2026-10-20
  - id: structural-pattern
    term: Structural pattern
    definition: A pattern that assembles classes and objects into larger structures, such as Adapter or Proxy.
    see: what-are-design-patterns
    source:
      title: Classification of patterns (Refactoring.Guru)
      url: https://refactoring.guru/design-patterns/classification
      verifiedOn: 2026-10-20
  - id: behavioural-pattern
    term: Behavioural pattern
    aka:
      - behavioral pattern
    definition: A pattern that shares responsibilities and communication between objects, such as Strategy or Observer.
    see: what-are-design-patterns
    source:
      title: Classification of patterns (Refactoring.Guru)
      url: https://refactoring.guru/design-patterns/classification
      verifiedOn: 2026-10-20
  - id: design-principle
    term: Design principle
    definition: A general rule for good design, such as DRY; patterns apply such rules to one problem.
    see: design-principles
    source:
      title: Compositional Design Principles (H. B. Christensen, Aarhus University lecture)
      url: https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf
      verifiedOn: 2026-10-20
  - id: programming-idiom
    term: Idiom (programming)
    aka:
      - programming idiom
      - idiom
    definition: A small, everyday pattern that applies to one programming language.
    see: what-are-design-patterns
    source:
      title: Programming Idiom (WikiWikiWeb, c2.com)
      url: https://wiki.c2.com/?ProgrammingIdiom
      verifiedOn: 2026-10-20
  - id: composition
    term: Composition
    aka:
      - object composition
    definition: Building behaviour by holding other objects in fields and delegating to them (has-a).
    see: composition-over-inheritance
    source:
      title: Compositional Design Principles (H. B. Christensen, Aarhus University lecture)
      url: https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf
      verifiedOn: 2026-10-20
  - id: inheritance
    term: Inheritance
    aka:
      - class inheritance
    definition: "Reusing a class by extending it: the subclass gets the parent's members and may override methods."
    see: composition-over-inheritance
    source:
      title: "JLS SE 25, chapter 8: Classes"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html
      verifiedOn: 2026-10-20
  - id: delegation
    term: Delegation
    definition: An object forwards part of its work to another object it holds.
    see: composition-over-inheritance
    source:
      title: "Design Principles from Design Patterns: Erich Gamma interview (Artima, 2005)"
      url: https://www.artima.com/articles/design-principles-from-design-patterns
      verifiedOn: 2026-10-20
  - id: is-a-relationship
    term: Is-a relationship
    aka:
      - is-a
    definition: "A subtype link: a UpiPayment is a PaymentStrategy; written with extends or implements."
    see: composition-over-inheritance
    source:
      title: Compositional Design Principles (H. B. Christensen, Aarhus University lecture)
      url: https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf
      verifiedOn: 2026-10-20
  - id: has-a-relationship
    term: Has-a relationship
    aka:
      - has-a
    definition: "A part link: PaymentService has a PaymentStrategy field; built with composition."
    see: composition-over-inheritance
    source:
      title: Compositional Design Principles (H. B. Christensen, Aarhus University lecture)
      url: https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf
      verifiedOn: 2026-10-20
  - id: fragile-base-class-problem
    term: Fragile base class problem
    aka:
      - fragile base class
    definition: A change to a base class that looks safe breaks subclasses its authors never saw.
    see: composition-over-inheritance
    source:
      title: A Study of the Fragile Base Class Problem (Mikhajlov and Sekerinski, ECOOP 1998)
      url: http://www.cas.mcmaster.ca/~emil/Publications_files/MikhajlovSekerinski98FragileBaseClassProblem.pdf
      verifiedOn: 2026-10-20
  - id: program-to-an-interface
    term: Program to an interface
    aka:
      - programming to an interface
    definition: Depend on an interface type, not a concrete class, so the implementation can change.
    see: design-principles
    source:
      title: "Design Principles from Design Patterns: Erich Gamma interview (Artima, 2005)"
      url: https://www.artima.com/articles/design-principles-from-design-patterns
      verifiedOn: 2026-10-20
  - id: abstract-class
    term: Abstract class
    definition: A class that cannot be instantiated; it may hold fields, constructors and abstract or concrete methods.
    see: design-principles
    source:
      title: "JLS SE 25, chapter 8: Classes"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html
      verifiedOn: 2026-10-20
  - id: java-interface
    term: Interface (Java)
    aka:
      - Java interface
    definition: A type listing methods that classes promise to provide; it has constants but no instance fields.
    see: design-principles
    source:
      title: "JLS SE 25, chapter 9: Interfaces"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-9.html
      verifiedOn: 2026-10-20
  - id: default-method
    term: Default method
    definition: An interface method with a body (Java 8), used by classes that do not override it.
    see: design-principles
    source:
      title: "JLS SE 25, chapter 9: Interfaces"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-9.html
      verifiedOn: 2026-10-20
  - id: loose-coupling
    term: Loose coupling
    aka:
      - low coupling
    definition: Classes rely on few, stable details of each other, so one can change without the others.
    see: design-principles
    source:
      title: "Law of Demeter: general formulation (Northeastern University)"
      url: https://www.ccs.neu.edu/research/demeter/demeter-method/LawOfDemeter/general-formulation.html
      verifiedOn: 2026-10-20
  - id: tight-coupling
    term: Tight coupling
    aka:
      - tightly coupled
    definition: Classes know each other's concrete details, so changing one forces changes in the others.
    see: design-principles
    source:
      title: Compositional Design Principles (H. B. Christensen, Aarhus University lecture)
      url: https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf
      verifiedOn: 2026-10-20
  - id: high-cohesion
    term: High cohesion
    definition: A class keeps together only the code that changes for the same reason.
    see: design-principles
    source:
      title: The Single Responsibility Principle (Robert C. Martin, 2014)
      url: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
      verifiedOn: 2026-10-20
  - id: encapsulate-what-varies
    term: Encapsulate what varies
    definition: Find the part of a design likely to change and hide it behind a stable interface.
    see: design-principles
    source:
      title: Compositional Design Principles (H. B. Christensen, Aarhus University lecture)
      url: https://baerbak.cs.au.dk/c/swea/slides/pdf/W6-4%20Compositional%20Design.pptx.pdf
      verifiedOn: 2026-10-20
  - id: dry
    term: DRY
    aka:
      - don't repeat yourself
    definition: "Don't Repeat Yourself: each piece of knowledge, in code, schema or docs, has one authoritative home."
    see: design-principles
    source:
      title: "Orthogonality and the DRY Principle: Hunt and Thomas interview (Artima, 2003)"
      url: https://www.artima.com/articles/orthogonality-and-the-dry-principle
      verifiedOn: 2026-10-20
  - id: kiss
    term: KISS
    aka:
      - keep it simple, stupid
    definition: "Keep It Simple, Stupid: choose the simplest design that does the job."
    see: design-principles
    source:
      title: Keep It Simple (WikiWikiWeb, c2.com)
      url: https://wiki.c2.com/?KeepItSimple
      verifiedOn: 2026-10-20
  - id: yagni
    term: YAGNI
    aka:
      - you aren't gonna need it
    definition: "You Aren't Gonna Need It: do not build a feature before it is needed."
    see: design-principles
    source:
      title: Yagni (Martin Fowler, bliki)
      url: https://martinfowler.com/bliki/Yagni.html
      verifiedOn: 2026-10-20
  - id: law-of-demeter
    term: Law of Demeter
    definition: A method talks only to its own object, its arguments, objects it creates and its direct parts.
    see: design-principles
    source:
      title: "Law of Demeter: general formulation (Northeastern University)"
      url: https://www.ccs.neu.edu/research/demeter/demeter-method/LawOfDemeter/general-formulation.html
      verifiedOn: 2026-10-20
  - id: solid-acronym
    term: SOLID
    aka:
      - SOLID principles
    definition: "Robert C. Martin's five class-design principles: SRP, OCP, LSP, ISP and DIP."
    see: single-responsibility
    source:
      title: The Principles of OOD (Robert C. Martin)
      url: http://butunclebob.com/ArticleS.UncleBob.PrinciplesOfOod
      verifiedOn: 2026-10-20
  - id: srp-term
    term: SRP
    aka:
      - single responsibility principle
    definition: A module should have one, and only one, reason to change.
    see: single-responsibility
    source:
      title: The Single Responsibility Principle (Robert C. Martin, Clean Coder Blog, 2014)
      url: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
      verifiedOn: 2026-10-20
  - id: reason-to-change
    term: Reason to change
    aka:
      - reasons to change
    definition: In SRP, a group of people or business function that may ask for a change; a bug fix is not one.
    see: single-responsibility
    source:
      title: The Single Responsibility Principle (Robert C. Martin, Clean Coder Blog, 2014)
      url: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
      verifiedOn: 2026-10-20
  - id: actor-srp
    term: Actor (SRP)
    aka:
      - SRP actor
    definition: The one group of people, one business function, that a module should answer to under SRP.
    see: single-responsibility
    source:
      title: The Single Responsibility Principle (Robert C. Martin, Clean Coder Blog, 2014)
      url: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
      verifiedOn: 2026-10-20
  - id: ocp-term
    term: OCP
    aka:
      - open/closed principle
      - open-closed principle
      - open closed principle
    definition: Software should be open for extension but closed for modification.
    see: open-closed
    source:
      title: The Open Closed Principle (Robert C. Martin, Clean Coder Blog, 2014)
      url: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
      verifiedOn: 2026-10-20
  - id: extension-point
    term: Extension point
    aka:
      - extension points
      - hinge point
      - hinge points
    definition: An abstraction where a design can be extended without editing it; Martin calls these hinge points.
    see: open-closed
    source:
      title: Design Principles and Design Patterns (Robert C. Martin, 2000, archived objectmentor.com)
      url: https://web.archive.org/web/20150924054349/http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf
      verifiedOn: 2026-10-20
  - id: lsp-term
    term: LSP
    aka:
      - Liskov substitution principle
    definition: A subtype must be usable wherever its base type is expected without breaking the program.
    see: liskov-substitution
    source:
      title: A Behavioral Notion of Subtyping (Liskov and Wing, ACM TOPLAS, 1994)
      url: https://www.cs.cmu.edu/~wing/publications/LiskovWing94.pdf
      verifiedOn: 2026-10-20
  - id: behavioural-subtyping
    term: Behavioural subtyping
    aka:
      - behavioral subtyping
    definition: "Subtyping judged by behaviour, not just signatures: what holds for the supertype must hold for the subtype."
    see: liskov-substitution
    source:
      title: A Behavioral Notion of Subtyping (Liskov and Wing, ACM TOPLAS, 1994)
      url: https://www.cs.cmu.edu/~wing/publications/LiskovWing94.pdf
      verifiedOn: 2026-10-20
  - id: precondition
    term: Precondition
    aka:
      - preconditions
    definition: What must be true before a method is called; a subtype may not demand more.
    see: liskov-substitution
    source:
      title: A Behavioral Notion of Subtyping (Liskov and Wing, ACM TOPLAS, 1994)
      url: https://www.cs.cmu.edu/~wing/publications/LiskovWing94.pdf
      verifiedOn: 2026-10-20
  - id: postcondition
    term: Postcondition
    aka:
      - postconditions
    definition: What a method guarantees when it returns; a subtype may promise more, never less.
    see: liskov-substitution
    source:
      title: A Behavioral Notion of Subtyping (Liskov and Wing, ACM TOPLAS, 1994)
      url: https://www.cs.cmu.edu/~wing/publications/LiskovWing94.pdf
      verifiedOn: 2026-10-20
  - id: invariant-term
    term: Invariant (class)
    aka:
      - invariants
      - class invariant
    definition: A property true in every state of an object, such as an amount never being negative.
    see: liskov-substitution
    source:
      title: A Behavioral Notion of Subtyping (Liskov and Wing, ACM TOPLAS, 1994)
      url: https://www.cs.cmu.edu/~wing/publications/LiskovWing94.pdf
      verifiedOn: 2026-10-20
  - id: design-by-contract
    term: Design by contract
    aka:
      - DbC
    definition: "Bertrand Meyer's method: a routine states its preconditions and postconditions, which callers and subtypes respect."
    see: liskov-substitution
    source:
      title: The Liskov Substitution Principle (Robert C. Martin, C++ Report 1996, archived objectmentor.com)
      url: https://web.archive.org/web/20130303213802/http://www.objectmentor.com/resources/articles/lsp.pdf
      verifiedOn: 2026-10-20
  - id: unsupported-operation-exception
    term: UnsupportedOperationException
    definition: Thrown when an operation is not supported, such as add on a List.of list (Java 9+).
    see: liskov-substitution
    source:
      title: "List: unmodifiable lists (Java SE 25 API)"
      url: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html
      verifiedOn: 2026-10-20
  - id: isp-term
    term: ISP
    aka:
      - interface segregation principle
    definition: Clients should not be forced to depend on methods they do not use.
    see: interface-segregation
    source:
      title: Solid Relevance (Robert C. Martin, Clean Coder Blog, 2020)
      url: https://blog.cleancoder.com/uncle-bob/2020/10/18/Solid-Relevance.html
      verifiedOn: 2026-10-20
  - id: fat-interface
    term: Fat interface
    aka:
      - fat interfaces
    definition: One large interface that serves many kinds of client; ISP splits it into smaller ones.
    see: interface-segregation
    source:
      title: Design Principles and Design Patterns (Robert C. Martin, 2000, archived objectmentor.com)
      url: https://web.archive.org/web/20150924054349/http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf
      verifiedOn: 2026-10-20
  - id: role-interface
    term: Role interface
    aka:
      - role interfaces
      - client-specific interface
    definition: A small interface for one kind of interaction; a supplier usually implements several.
    see: interface-segregation
    source:
      title: Role Interface (Martin Fowler, bliki, 2006)
      url: https://martinfowler.com/bliki/RoleInterface.html
      verifiedOn: 2026-10-20
  - id: dip-term
    term: DIP
    aka:
      - dependency inversion principle
    definition: High-level and low-level modules both depend on abstractions, and details depend on abstractions.
    see: dependency-inversion
    source:
      title: The Dependency Inversion Principle (Robert C. Martin, C++ Report 1996, archived objectmentor.com)
      url: https://web.archive.org/web/20130326114036/http://www.objectmentor.com/resources/articles/dip.pdf
      verifiedOn: 2026-10-20
  - id: high-level-module
    term: High-level module
    aka:
      - high-level modules
      - high level modules
    definition: Code that holds the business policy, such as PaymentService.
    see: dependency-inversion
    source:
      title: The Dependency Inversion Principle (Robert C. Martin, C++ Report 1996, archived objectmentor.com)
      url: https://web.archive.org/web/20130326114036/http://www.objectmentor.com/resources/articles/dip.pdf
      verifiedOn: 2026-10-20
  - id: low-level-module
    term: Low-level module
    aka:
      - low-level modules
      - low level modules
    definition: "Code that holds the details a policy uses: SDK calls, SQL, formatting."
    see: dependency-inversion
    source:
      title: The Dependency Inversion Principle (Robert C. Martin, C++ Report 1996, archived objectmentor.com)
      url: https://web.archive.org/web/20130326114036/http://www.objectmentor.com/resources/articles/dip.pdf
      verifiedOn: 2026-10-20
  - id: abstraction-design
    term: Abstraction (design)
    aka:
      - abstractions (design)
    definition: An interface or abstract class that callers depend on instead of a concrete class.
    see: dependency-inversion
    source:
      title: Design Principles and Design Patterns (Robert C. Martin, 2000, archived objectmentor.com)
      url: https://web.archive.org/web/20150924054349/http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf
      verifiedOn: 2026-10-20
  - id: singleton-term
    term: Singleton (pattern)
    aka:
      - singleton pattern
    definition: A class with exactly one instance in its scope and one global access point to it.
    see: singleton
    source:
      title: Singleton (refactoring.guru)
      url: https://refactoring.guru/design-patterns/singleton
      verifiedOn: 2026-10-20
  - id: eager-initialisation
    term: Eager initialisation
    aka:
      - eager initialization
    definition: Creating the instance when the class initialises, not on the first getInstance() call.
    see: singleton
    source:
      title: JLS SE 25, 12.4.1 When Initialization Occurs
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-12.html
      verifiedOn: 2026-10-20
  - id: lazy-initialisation
    term: Lazy initialisation
    aka:
      - lazy initialization
    definition: Creating an object only when it is first needed.
    see: singleton
    source:
      title: The "Double-Checked Locking is Broken" Declaration (Pugh et al.)
      url: https://www.cs.umd.edu/~pugh/java/memoryModel/DoubleCheckedLocking.html
      verifiedOn: 2026-10-20
  - id: double-checked-locking
    term: Double-checked locking
    definition: Check for null, lock, check again, then create; correct in Java 5+ only with a volatile field.
    see: singleton
    source:
      title: The "Double-Checked Locking is Broken" Declaration (Pugh et al.)
      url: https://www.cs.umd.edu/~pugh/java/memoryModel/DoubleCheckedLocking.html
      verifiedOn: 2026-10-20
  - id: volatile-term
    term: volatile (Java)
    aka:
      - volatile field
      - volatile keyword
    definition: "A field modifier: a write to the field happens-before every later read of it by any thread."
    see: singleton
    source:
      title: JLS SE 25, 17.4.5 Happens-before Order
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html
      verifiedOn: 2026-10-20
  - id: holder-idiom
    term: Initialisation-on-demand holder
    aka:
      - holder idiom
      - initialization-on-demand holder
    definition: A lazy singleton kept in a static field of a nested class, created safely on first use.
    see: singleton
    source:
      title: The "Double-Checked Locking is Broken" Declaration (Pugh et al.)
      url: https://www.cs.umd.edu/~pugh/java/memoryModel/DoubleCheckedLocking.html
      verifiedOn: 2026-10-20
  - id: enum-singleton
    term: Enum singleton
    definition: A singleton written as a one-constant enum; Java blocks extra copies by reflection or deserialisation.
    see: singleton
    source:
      title: "JLS SE 25, chapter 8: Classes (8.8.10, 8.9)"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html
      verifiedOn: 2026-10-20
  - id: static-utility-class
    term: Utility class
    aka:
      - static utility class
    definition: A class with only static methods and a private constructor, so it is never instantiated.
    see: singleton
    source:
      title: "JLS SE 25, chapter 8: Classes (8.8.10, 8.9)"
      url: https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html
      verifiedOn: 2026-10-20
  - id: spring-singleton-scope
    term: Singleton scope (Spring)
    aka:
      - singleton scope
    definition: "Spring's default bean scope: one shared instance per bean definition per container."
    see: singleton
    source:
      title: Bean Scopes (Spring Framework 7.0 reference)
      url: https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html
      verifiedOn: 2026-10-20
  - id: simple-factory
    term: Simple factory
    definition: One creation method with a conditional that picks the class to create; not a GoF pattern.
    see: factory-method
    source:
      title: Factory Comparison (refactoring.guru)
      url: https://refactoring.guru/design-patterns/factory-comparison
      verifiedOn: 2026-10-20
  - id: static-factory-method
    term: Static factory method
    aka:
      - static creation method
    definition: A named static method that returns an instance in place of a public constructor.
    see: factory-method
    source:
      title: Factory Comparison (refactoring.guru)
      url: https://refactoring.guru/design-patterns/factory-comparison
      verifiedOn: 2026-10-20
  - id: factory-method-term
    term: Factory Method (pattern)
    aka:
      - factory method pattern
      - virtual constructor
    definition: "GoF pattern: a superclass declares a creating method and subclasses override it to change the product."
    see: factory-method
    source:
      title: Factory Method (refactoring.guru)
      url: https://refactoring.guru/design-patterns/factory-method
      verifiedOn: 2026-10-20
  - id: factory-creator
    term: Creator (Factory Method)
    definition: The class that declares the factory method, which subclasses override.
    see: factory-method
    source:
      title: Factory Method (refactoring.guru)
      url: https://refactoring.guru/design-patterns/factory-method
      verifiedOn: 2026-10-20
  - id: factory-product
    term: Product (Factory Method)
    definition: The common interface of every object a factory method returns.
    see: factory-method
    source:
      title: Factory Method (refactoring.guru)
      url: https://refactoring.guru/design-patterns/factory-method
      verifiedOn: 2026-10-20
  - id: abstract-factory-term
    term: Abstract Factory (pattern)
    aka:
      - abstract factory pattern
    definition: "GoF pattern: an interface that creates families of related objects without naming their classes."
    see: abstract-factory
    source:
      title: Abstract Factory (refactoring.guru)
      url: https://refactoring.guru/design-patterns/abstract-factory
      verifiedOn: 2026-10-20
  - id: product-family
    term: Product family
    definition: Related objects meant to be used together, so all come from one factory variant.
    see: abstract-factory
    source:
      title: Abstract Factory (refactoring.guru)
      url: https://refactoring.guru/design-patterns/abstract-factory
      verifiedOn: 2026-10-20
  - id: builder-term
    term: Builder (pattern)
    aka:
      - builder pattern
    definition: GoF pattern that constructs a complex object step by step, then returns it.
    see: builder
    source:
      title: Builder (refactoring.guru)
      url: https://refactoring.guru/design-patterns/builder
      verifiedOn: 2026-10-20
