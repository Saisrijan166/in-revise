terms:
  - id: artificial-intelligence
    term: Artificial intelligence (AI)
    aka:
      - AI
      - artificial intelligence
    definition: Systems that do tasks normally needing human reasoning, learning or perception; machine learning is one part.
    see: ai-ml-dl-genai
    source:
      title: "Glossary: artificial intelligence (NIST CSRC)"
      url: https://csrc.nist.gov/glossary/term/artificial_intelligence
      verifiedOn: 2026-10-21
  - id: machine-learning
    term: Machine learning (ML)
    aka:
      - ML
      - machine learning
    definition: Building systems that learn from data to improve accuracy, instead of following hand-written rules.
    see: ai-ml-dl-genai
    source:
      title: "Glossary: machine learning (NIST CSRC)"
      url: https://csrc.nist.gov/glossary/term/machine_learning
      verifiedOn: 2026-10-21
  - id: deep-learning
    term: Deep learning
    definition: Machine learning with neural networks of many layers that learn their own features from raw data.
    see: neural-networks
    source:
      title: "Deep Learning, chapter 1: Introduction (Goodfellow, Bengio and Courville)"
      url: https://www.deeplearningbook.org/contents/intro.html
      verifiedOn: 2026-10-21
  - id: generative-ai
    term: Generative AI (GenAI)
    aka:
      - GenAI
      - generative AI
    definition: AI that creates new content, such as text, images, audio or video, from patterns learned in data.
    see: ai-ml-dl-genai
    source: &a2
      title: What is machine learning? (Google, Introduction to Machine Learning)
      url: https://developers.google.com/machine-learning/intro-to-ml/what-is-ml
      verifiedOn: 2026-10-21
  - id: foundation-model
    term: Foundation model
    aka:
      - foundation models
    definition: A large model trained on broad data at scale that can be adapted to many tasks.
    see: ai-ml-dl-genai
    source:
      title: On the Opportunities and Risks of Foundation Models (Bommasani et al., 2021, arXiv 2108.07258)
      url: https://arxiv.org/abs/2108.07258
      verifiedOn: 2026-10-21
  - id: discriminative-model
    term: Discriminative model
    definition: A model that predicts a label from features, such as spam or not spam, rather than creating content.
    see: ai-ml-dl-genai
    source: &a1
      title: Machine Learning Glossary (Google for Developers)
      url: https://developers.google.com/machine-learning/glossary
      verifiedOn: 2026-10-21
  - id: modality
    term: Modality
    aka:
      - modalities
    definition: A kind of data a model handles, such as text, images, audio, video or numbers.
    see: ai-ml-dl-genai
    source: *a1
  - id: multimodal-model
    term: Multimodal model
    aka:
      - multimodal
      - multimodal models
    definition: A model whose inputs, outputs or both span more than one modality, such as text and images.
    see: ai-ml-dl-genai
    source: *a1
  - id: feature-ml
    term: Feature (ML)
    aka:
      - input feature
      - input features
    definition: An input variable to a model; one example is made of one or more features.
    see: machine-learning-types
    source: *a1
  - id: label-ml
    term: Label (ML)
    aka:
      - labelled data
      - labelled examples
      - labelled example
    definition: The right answer attached to a training example in supervised learning.
    see: machine-learning-types
    source: *a1
  - id: supervised-learning
    term: Supervised learning
    definition: Training a model on features paired with their labels, so it predicts labels for new data.
    see: machine-learning-types
    source: *a2
  - id: unsupervised-learning
    term: Unsupervised learning
    definition: Training a model to find patterns, such as clusters, in data that has no labels.
    see: machine-learning-types
    source: *a2
  - id: reinforcement-learning
    term: Reinforcement learning (RL)
    aka:
      - reinforcement learning
    definition: Learning a policy of actions in an environment by getting rewards or penalties.
    see: machine-learning-types
    source: *a2
  - id: self-supervised-learning
    term: Self-supervised learning
    aka:
      - self-supervised
    definition: Learning from unlabelled data by making labels from the data itself, such as a hidden next word.
    see: machine-learning-types
    source: *a1
  - id: ml-classification
    term: Classification
    aka:
      - classification model
    definition: Supervised learning that predicts a category, such as fraud or not fraud.
    see: machine-learning-types
    source: *a2
  - id: ml-regression
    term: Regression
    aka:
      - regression model
    definition: Supervised learning that predicts a number, such as a price or a number of days.
    see: machine-learning-types
    source: *a2
  - id: ml-clustering
    term: Clustering
    definition: Grouping similar examples without labels; a person interprets the groups afterwards.
    see: machine-learning-types
    source: *a2
  - id: model-parameter
    term: Model parameter
    aka:
      - weights
      - model weights
      - weights and biases
    definition: A weight or bias a model learns during training; model size is the count of them.
    see: how-models-learn
    source: *a1
  - id: loss-function
    term: Loss function
    aka:
      - loss
    definition: A function that scores how far predictions are from the labels; training tries to lower it.
    see: how-models-learn
    source: *a1
  - id: gradient-descent
    term: Gradient descent
    definition: The method that repeatedly nudges weights in the direction that lowers the loss.
    see: how-models-learn
    source:
      title: Gradient descent (Google ML Crash Course)
      url: https://developers.google.com/machine-learning/crash-course/linear-regression/gradient-descent
      verifiedOn: 2026-10-21
  - id: epoch
    term: Epoch
    aka:
      - epochs
    definition: One full training pass over the whole training set, each example processed once.
    see: how-models-learn
    source: *a1
  - id: training
    term: Training (ML)
    aka:
      - model training
    definition: Finding a model's weights and biases by adjusting them over many examples.
    see: how-models-learn
    source: *a1
  - id: inference
    term: Inference
    definition: Using a trained model, with fixed weights, to predict or to generate a reply to a prompt.
    see: how-models-learn
    source: *a1
  - id: overfitting
    term: Overfitting
    aka:
      - overfits
      - overfit
    definition: A model fits its training data so closely that it fails on new data.
    see: how-models-learn
    source: *a1
  - id: underfitting
    term: Underfitting
    definition: A model predicts poorly even on its training data because it missed the pattern.
    see: how-models-learn
    source: *a1
  - id: validation-set
    term: Validation set
    definition: Held-out examples used again and again to tune a model during training.
    see: how-models-learn
    source: &a3
      title: Dividing the original dataset (Google ML Crash Course)
      url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
      verifiedOn: 2026-10-21
  - id: test-set
    term: Test set
    definition: Held-out examples used for the final check of a trained model on unseen data.
    see: how-models-learn
    source: *a3
  - id: neural-network
    term: Neural network
    aka:
      - neural networks
      - deep neural network
    definition: A model of layers of connected neurons with at least one hidden layer; deep ones have many.
    see: neural-networks
    source: *a1
  - id: neuron-nn
    term: Neuron (neural network)
    aka:
      - artificial neuron
      - neurons
    definition: A unit that takes a weighted sum of its inputs, adds a bias and applies an activation function.
    see: neural-networks
    source: *a1
  - id: hidden-layer
    term: Hidden layer
    aka:
      - hidden layers
    definition: A layer of neurons between the input features and the output prediction.
    see: neural-networks
    source: *a1
  - id: activation-function
    term: Activation function
    aka:
      - activation functions
    definition: A non-linear function on each neuron's output that lets a network learn complex patterns.
    see: neural-networks
    source: *a1
  - id: relu
    term: ReLU
    aka:
      - rectified linear unit
    definition: An activation function that outputs 0 for negative inputs and the input itself otherwise.
    see: neural-networks
    source: *a1
  - id: gpu
    term: GPU
    aka:
      - GPUs
      - graphics processing unit
    definition: A chip built for parallel processing, used to speed up neural network training and inference.
    see: neural-networks
    source: *a1
  - id: cnn
    term: CNN
    aka:
      - convolutional neural network
    definition: A neural network with convolutional layers, widely used for image recognition.
    see: neural-networks
    source: *a1
  - id: rnn
    term: RNN
    aka:
      - recurrent neural network
    definition: A neural network that feeds each step's hidden state into the next; built for sequences.
    see: neural-networks
    source: *a1
  - id: large-language-model
    term: Large language model
    aka:
      - LLM
      - LLMs
    definition: A large neural network, usually a transformer, trained on huge text to predict the next token.
    see: what-is-an-llm
    source: &a4
      title: "LLMs: What's a large language model? (Google Machine Learning Crash Course)"
      url: https://developers.google.com/machine-learning/crash-course/llm/transformers
      verifiedOn: 2026-10-21
  - id: next-token-prediction
    term: Next-token prediction
    definition: "The model's core task: give a probability to each possible next token given the text so far."
    see: what-is-an-llm
    source: *a4
  - id: autoregressive
    term: Autoregressive
    aka:
      - autoregressive generation
    definition: Generating one token at a time, each conditioned on all the tokens produced before it.
    see: what-is-an-llm
    source: &a5
      title: Attention Is All You Need (Vaswani et al., 2017, arXiv 1706.03762)
      url: https://arxiv.org/html/1706.03762v7
      verifiedOn: 2026-10-21
  - id: token
    term: Token
    aka:
      - tokens
    definition: "The unit a model reads and writes: a word, part of a word, or punctuation, stored as an id."
    see: tokens
    source:
      title: "Key concepts: tokens (OpenAI docs)"
      url: https://developers.openai.com/api/docs/concepts
      verifiedOn: 2026-10-21
  - id: tokenizer
    term: Tokenizer
    aka:
      - tokeniser
    definition: The component that turns text into token ids and back; each model family has its own.
    see: tokens
    source:
      title: tiktoken (OpenAI, GitHub)
      url: https://github.com/openai/tiktoken
      verifiedOn: 2026-10-21
  - id: bpe
    term: Byte-pair encoding (BPE)
    aka:
      - byte-pair encoding
      - BPE
    definition: A tokenisation method that merges frequent character sequences into sub-word tokens, so any word can be encoded.
    see: tokens
    source:
      title: Neural Machine Translation of Rare Words with Subword Units (Sennrich et al., 2015, arXiv 1508.07909)
      url: https://arxiv.org/abs/1508.07909
      verifiedOn: 2026-10-21
  - id: context-window-term
    term: Context window
    aka:
      - context length
    definition: The most tokens a model can handle in one request, counting the input and the output together.
    see: context-window
    source:
      title: Context windows (Anthropic docs)
      url: https://platform.claude.com/docs/en/build-with-claude/context-windows
      verifiedOn: 2026-10-21
  - id: lost-in-the-middle
    term: Lost in the middle
    definition: Models use facts at the start or end of a long input better than facts in the middle.
    see: context-window
    source:
      title: Lost in the Middle (Liu et al., 2023, arXiv 2307.03172)
      url: https://arxiv.org/abs/2307.03172
      verifiedOn: 2026-10-21
  - id: knowledge-cutoff
    term: Knowledge cutoff
    aka:
      - training data cutoff
    definition: The date the model's training data ends; it knows nothing reliable after it.
    see: llm-limits
    source:
      title: Models overview (Anthropic docs)
      url: https://platform.claude.com/docs/en/about-claude/models/overview
      verifiedOn: 2026-10-21
  - id: transformer
    term: Transformer
    aka:
      - transformer architecture
    definition: A neural network design built on attention instead of recurrence; the basis of today's LLMs.
    see: transformer-and-attention
    source: *a5
  - id: attention
    term: Attention
    aka:
      - attention mechanism
    definition: A step that builds each token's output as a weighted mix of other tokens' information.
    see: transformer-and-attention
    source: *a5
  - id: self-attention
    term: Self-attention
    definition: Attention where every token of one input weighs every other token of the same input.
    see: transformer-and-attention
    source: *a4
  - id: query-key-value
    term: Query, key and value
    aka:
      - query, key, value
      - Q, K, V
    definition: "Vectors per token: the query is matched with keys, and the match weights mix the values."
    see: transformer-and-attention
    source: *a5
  - id: multi-head-attention
    term: Multi-head attention
    definition: Several attention operations run in parallel, each free to learn a different relation between tokens.
    see: transformer-and-attention
    source: *a5
  - id: positional-encoding
    term: Positional encoding
    definition: Position information added to token inputs, since attention alone ignores word order.
    see: transformer-and-attention
    source: *a5
  - id: encoder-term
    term: Encoder (transformer)
    aka:
      - encoder-only model
      - encoder-only
    definition: The part that turns input into a representation, reading in both directions; used alone for embeddings.
    see: transformer-and-attention
    source: *a4
  - id: decoder-only-model
    term: Decoder-only model
    aka:
      - decoder-only
    definition: A transformer that sees only earlier tokens and generates text; the GPT-style chat LLM design.
    see: transformer-and-attention
    source: *a4
  - id: bert
    term: BERT
    definition: Google's 2018 encoder-only transformer, pre-trained on both left and right context.
    see: transformer-and-attention
    source:
      title: BERT (Devlin et al., 2018, arXiv 1810.04805)
      url: https://arxiv.org/abs/1810.04805
      verifiedOn: 2026-10-21
  - id: pre-training
    term: Pre-training
    aka:
      - pretraining
    definition: "The first, costliest training stage: next-token prediction over huge unlabelled text."
    see: llm-training-stages
    source: *a4
  - id: fine-tuning
    term: Fine-tuning
    aka:
      - fine-tune
      - fine-tuned
    definition: Further training of an already trained model on examples for one task, style or format.
    see: llm-training-stages
    source:
      title: "Model optimization: fine-tuning (OpenAI docs)"
      url: https://developers.openai.com/api/docs/guides/model-optimization
      verifiedOn: 2026-10-21
  - id: supervised-fine-tuning
    term: Supervised fine-tuning (SFT)
    aka:
      - supervised fine-tuning
      - SFT
    definition: Fine-tuning on prompt and ideal-answer pairs written or approved by people.
    see: llm-training-stages
    source: &a6
      title: Training language models to follow instructions with human feedback (Ouyang et al., 2022, arXiv 2203.02155)
      url: https://arxiv.org/abs/2203.02155
      verifiedOn: 2026-10-21
  - id: instruction-tuning
    term: Instruction tuning
    definition: Fine-tuning on many instruction prompts with good answers, so a model follows instructions across tasks.
    see: llm-training-stages
    source: { title: "Machine Learning Glossary (Google for Developers)", url: "https://developers.google.com/machine-learning/glossary", verifiedOn: "2026-10-21" }
  - id: rlhf
    term: RLHF
    aka:
      - reinforcement learning from human feedback
    definition: Train a reward model on human rankings of answers, then tune the LLM with reinforcement learning against it.
    see: llm-training-stages
    source: *a6
  - id: reward-model
    term: Reward model
    definition: A model trained on human rankings that scores how good an answer is, used in RLHF.
    see: llm-training-stages
    source: *a6
  - id: dpo
    term: DPO
    aka:
      - direct preference optimization
    definition: Preference tuning straight from ranked answer pairs, with no separate reward model or RL loop.
    see: llm-training-stages
    source:
      title: Direct Preference Optimization (Rafailov et al., 2023, arXiv 2305.18290)
      url: https://arxiv.org/abs/2305.18290
      verifiedOn: 2026-10-21
  - id: lora
    term: LoRA
    aka:
      - low-rank adaptation
    definition: Fine-tuning that freezes the model's weights and trains small low-rank matrices added to its layers.
    see: llm-training-stages
    source:
      title: LoRA (Hu et al., 2021, arXiv 2106.09685)
      url: https://arxiv.org/abs/2106.09685
      verifiedOn: 2026-10-21
  - id: peft
    term: Parameter-efficient fine-tuning (PEFT)
    aka:
      - parameter-efficient fine-tuning
      - PEFT
    definition: Fine-tuning methods that train only a small number of (often extra) parameters, cutting compute and storage.
    see: llm-training-stages
    source:
      title: PEFT documentation (Hugging Face)
      url: https://huggingface.co/docs/peft/index
      verifiedOn: 2026-10-21
  - id: distillation
    term: Distillation
    aka:
      - knowledge distillation
    definition: Training a smaller model to copy a larger model's behaviour, so it is cheaper to serve.
    see: llm-training-stages
    source:
      title: Distilling the Knowledge in a Neural Network (Hinton et al., 2015, arXiv 1503.02531)
      url: https://arxiv.org/abs/1503.02531
      verifiedOn: 2026-10-21
  - id: base-model
    term: Base model
    definition: A model after pre-training only; it continues text but does not reliably follow instructions.
    see: what-is-an-llm
    source: *a6
  - id: instruction-tuned-model
    term: Instruction-tuned model
    aka:
      - chat model
      - instruct model
    definition: A base model fine-tuned to follow instructions and hold a conversation.
    see: what-is-an-llm
    source: *a6
  - id: reasoning-model
    term: Reasoning model
    aka:
      - reasoning models
      - thinking model
    definition: An LLM that produces reasoning tokens, often hidden, before its answer; they are billed as output tokens.
    see: what-is-an-llm
    source:
      title: Reasoning models (OpenAI docs)
      url: https://developers.openai.com/api/docs/guides/reasoning
      verifiedOn: 2026-10-21
  - id: open-weight-model
    term: Open-weight model
    aka:
      - open-weight
      - open-weights model
    definition: A model whose trained weights are published, so you can download and run it yourself.
    see: what-is-an-llm
    source:
      title: gpt-oss-120b model page (OpenAI docs)
      url: https://developers.openai.com/api/docs/models/gpt-oss-120b
      verifiedOn: 2026-10-21
  - id: hallucination-term
    term: Hallucination
    aka:
      - hallucinate
      - hallucinations
    definition: Fluent, confident output that is false or not consistent with the context given.
    see: hallucination
    source:
      title: Reduce hallucinations (Anthropic docs)
      url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
      verifiedOn: 2026-10-21
  - id: confabulation
    term: Confabulation
    definition: "NIST's name for hallucination: confidently stated but false content that may mislead users."
    see: hallucination
    source:
      title: "NIST AI 600-1: Generative AI Profile (2024)"
      url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf
      verifiedOn: 2026-10-21
  - id: non-determinism
    term: Non-determinism
    aka:
      - non-deterministic
    definition: The same prompt can give different outputs; Anthropic notes this even at temperature 0.
    see: llm-limits
    source:
      title: "Messages API: temperature (Anthropic docs)"
      url: https://platform.claude.com/docs/en/api/messages/create
      verifiedOn: 2026-10-21
  - id: prompt-term
    term: Prompt
    aka: []
    definition: The instructions, context and examples sent to a model to get a reply.
    see: prompt-design
    source:
      title: Prompt engineering (OpenAI API docs)
      url: https://developers.openai.com/api/docs/guides/prompt-engineering
      verifiedOn: 2026-10-21
  - id: prompt-engineering
    term: Prompt engineering
    aka: []
    definition: Designing instructions, context, examples and output format so a model gives reliable output.
    see: prompt-design
    source:
      title: Prompt engineering (OpenAI API docs)
      url: https://developers.openai.com/api/docs/guides/prompt-engineering
      verifiedOn: 2026-10-21
  - id: system-message
    term: System prompt
    aka:
      - system message
      - system prompts
    definition: App-written instructions that set the model's role, rules and format for a conversation.
    see: message-roles
    source:
      title: "Create a Message: system (Anthropic API reference)"
      url: https://platform.claude.com/docs/en/api/messages/create
      verifiedOn: 2026-10-21
  - id: developer-message
    term: Developer message
    aka:
      - developer messages
    definition: OpenAI's role for app instructions; it ranks above user messages in the chain of command.
    see: message-roles
    source:
      title: "OpenAI Model Spec (2026-08-18): chain of command"
      url: https://model-spec.openai.com/2026-08-18.html
      verifiedOn: 2026-10-21
  - id: user-message
    term: User message
    aka:
      - user messages
      - user prompt
    definition: The end user's request; followed unless it conflicts with higher-level instructions.
    see: message-roles
    source:
      title: "OpenAI Model Spec (2026-08-18): chain of command"
      url: https://model-spec.openai.com/2026-08-18.html
      verifiedOn: 2026-10-21
  - id: assistant-message
    term: Assistant message
    aka:
      - assistant messages
      - assistant turn
    definition: A message written by the model, such as an earlier reply sent back as history.
    see: message-roles
    source:
      title: "Create a Message: messages (Anthropic API reference)"
      url: https://platform.claude.com/docs/en/api/messages/create
      verifiedOn: 2026-10-21
  - id: instruction-hierarchy
    term: Instruction hierarchy
    aka:
      - chain of command
    definition: "The order in which instructions win when they conflict: platform, developer, then user; pasted data has none."
    see: message-roles
    source:
      title: "OpenAI Model Spec (2026-08-18): chain of command"
      url: https://model-spec.openai.com/2026-08-18.html
      verifiedOn: 2026-10-21
  - id: prompt-template
    term: Prompt template
    aka:
      - prompt templates
      - PromptTemplate
    definition: Prompt text with placeholders that code fills with values at runtime.
    see: prompt-design
    source:
      title: Prompts (Spring AI 2.0 reference)
      url: https://docs.spring.io/spring-ai/reference/api/prompt.html
      verifiedOn: 2026-10-21
  - id: delimiter-term
    term: Delimiter (prompt)
    aka:
      - XML tags
      - prompt delimiters
    definition: Tags or headings that mark where instructions, data and examples start and end in a prompt.
    see: prompt-design
    source:
      title: Prompt engineering (OpenAI API docs)
      url: https://developers.openai.com/api/docs/guides/prompt-engineering
      verifiedOn: 2026-10-21
  - id: zero-shot
    term: Zero-shot prompting
    aka:
      - zero-shot
    definition: Prompting with instructions only and no examples.
    see: zero-and-few-shot
    source:
      title: Prompt design strategies (Google Gemini API docs)
      url: https://ai.google.dev/gemini-api/docs/prompting-strategies
      verifiedOn: 2026-10-21
  - id: one-shot
    term: One-shot prompting
    aka:
      - one-shot
    definition: Prompting with exactly one worked example before the real input.
    see: zero-and-few-shot
    source:
      title: Language Models are Few-Shot Learners (Brown et al., 2020, arXiv 2005.14165)
      url: https://arxiv.org/abs/2005.14165
      verifiedOn: 2026-10-21
  - id: few-shot
    term: Few-shot prompting
    aka:
      - few-shot
      - multishot prompting
    definition: Prompting with a few input → output examples so the model copies the format and labels.
    see: zero-and-few-shot
    source:
      title: "Prompting best practices: use examples effectively (Anthropic docs)"
      url: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
      verifiedOn: 2026-10-21
  - id: in-context-learning
    term: In-context learning
    aka: []
    definition: A model doing a task from instructions and examples in the prompt, with no weight updates.
    see: zero-and-few-shot
    source:
      title: Language Models are Few-Shot Learners (Brown et al., 2020, arXiv 2005.14165)
      url: https://arxiv.org/abs/2005.14165
      verifiedOn: 2026-10-21
  - id: chain-of-thought-term
    term: Chain-of-thought (CoT)
    aka:
      - chain-of-thought
      - CoT
    definition: Intermediate reasoning steps a model writes before its final answer.
    see: chain-of-thought
    source:
      title: Chain-of-Thought Prompting Elicits Reasoning in Large Language Models (Wei et al., 2022, arXiv 2201.11903)
      url: https://arxiv.org/abs/2201.11903
