  - id: exponential-backoff
    term: Exponential backoff
    aka:
      - backoff
    definition: Waiting longer after each failed attempt, up to a cap, before retrying.
    see: calling-llm-apis
    source:
      title: Timeouts, retries and backoff with jitter (Amazon Builders' Library)
      url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
      verifiedOn: 2026-10-21
  - id: jitter
    term: Jitter
    definition: Random extra delay added to backoff so many clients do not retry at the same moment.
    see: calling-llm-apis
    source:
      title: Timeouts, retries and backoff with jitter (Amazon Builders' Library)
      url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
      verifiedOn: 2026-10-21
  - id: http-429
    term: HTTP 429
    aka:
      - Too Many Requests
      - "429"
    definition: The status code meaning the client sent too many requests in a given time (rate limiting).
