    source:
      title: Rate limits (OpenAI docs)
      url: https://developers.openai.com/api/docs/guides/rate-limits
      verifiedOn: 2026-10-21
  - id: tokens-per-minute
    term: Tokens per minute
    aka:
      - TPM
      - ITPM
      - OTPM
    definition: A provider rate limit on tokens processed per minute, next to requests per minute (RPM).
    see: calling-llm-apis
    source:
      title: Rate limits (Claude API docs)
      url: https://platform.claude.com/docs/en/api/rate-limits
      verifiedOn: 2026-10-21
