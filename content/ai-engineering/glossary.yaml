    source:
      title: "RFC 6585: Additional HTTP Status Codes, section 4"
      url: https://www.rfc-editor.org/rfc/rfc6585#section-4
      verifiedOn: 2026-10-21
  - id: retry-after
    term: Retry-After
    aka:
      - retry-after header
    definition: A response header telling the client how long to wait before the next request.
    see: calling-llm-apis
    source:
      title: "RFC 9110: HTTP Semantics, section 10.2.3"
      url: https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
      verifiedOn: 2026-10-21
