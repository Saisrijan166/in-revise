    source:
      title: Spring Cloud Circuit Breaker reference
      url: https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker.html
      verifiedOn: 2026-10-21
  - id: model-routing
    term: Model routing
    aka:
      - model router
    definition: Sending each request to a cheaper or stronger model depending on how hard the task is.
    see: model-selection-and-cost
    source:
      title: "Choosing the right model: combine models (Claude docs)"
      url: https://platform.claude.com/docs/en/about-claude/models/choosing-a-model
      verifiedOn: 2026-10-21
  - id: quantisation
    term: Quantisation
    aka:
      - quantization
      - quantised model
      - quantized model
    definition: Storing model weights in lower precision, such as int8 or int4, to cut memory use.
    see: model-selection-and-cost
    source:
      title: Quantization overview (Hugging Face Transformers docs)
      url: https://huggingface.co/docs/transformers/main/en/quantization/overview
      verifiedOn: 2026-10-21
  - id: response-caching
    term: Response caching
    aka:
      - response cache
      - LLM response cache
    definition: Your app stores full model answers by key and returns them on a repeat, skipping the model.
    see: model-selection-and-cost
    source:
      title: Redis semantic cache (Redis docs)
      url: https://redis.io/docs/latest/develop/use-cases/semantic-cache/
      verifiedOn: 2026-10-21
  - id: semantic-caching
    term: Semantic caching
    aka:
      - semantic cache
    definition: A response cache that also hits for similar questions, matched by embedding distance under a threshold.
    see: model-selection-and-cost
    source:
      title: Redis semantic cache (Redis docs)
      url: https://redis.io/docs/latest/develop/use-cases/semantic-cache/
      verifiedOn: 2026-10-21
  - id: prompt-caching
    term: Prompt caching
    aka:
      - prompt cache
      - cached input tokens
    definition: The provider reuses its work on an identical prompt prefix, making input cheaper and faster.
    see: model-selection-and-cost
    source:
      title: Prompt caching (Claude docs)
      url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
      verifiedOn: 2026-10-21
  - id: batch-api
    term: Batch API
    aka:
      - Message Batches API
      - batch processing
    definition: Submit many requests as one async job; results come later at a lower price.
    see: model-selection-and-cost
    source:
      title: Batch API (OpenAI docs)
      url: https://developers.openai.com/api/docs/guides/batch
      verifiedOn: 2026-10-21
