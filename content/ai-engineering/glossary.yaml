      title: "PostgreSQL 18 docs: Client Connection Defaults"
      url: https://www.postgresql.org/docs/18/runtime-config-client.html
      verifiedOn: 2026-10-21
  - id: allowlist
    term: Allowlist
    aka:
      - allowlisted
      - allow list
    definition: A documented list of the specific items that are allowed; everything else is refused.
    see: ai-and-databases
    source:
      title: "NIST CSRC glossary: allowlist"
      url: https://csrc.nist.gov/glossary/term/allowlist
      verifiedOn: 2026-10-21
