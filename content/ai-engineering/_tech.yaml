name: AI Engineering
slug: ai-engineering
accent: purple
summary: "How LLMs work and how to build with them: prompts, tools and agents, embeddings, RAG, safety, evals and calling AI safely from a Spring Boot backend."
codeLanguages:
  - java
storySpine:
  - step: A hand-written refund rule cannot cover every case → let a model learn the pattern from past data (machine learning)
    cards:
      - ai-ml-dl-genai
      - machine-learning-types
  - step: A model must learn from raw text and still work on new tickets → train a many-layer neural network, check it on held-out data, then serve it with frozen weights
    cards:
      - how-models-learn
      - neural-networks
  - step: Rules cannot handle open-ended questions like 'Where is my refund?' → use an LLM that predicts the answer token by token, inside a limited context window
    cards:
      - what-is-an-llm
      - tokens
      - context-window
      - transformer-and-attention
      - llm-training-stages
  - step: The model sounds sure but invents refund rules and knows nothing after its cutoff → treat it as a writer, not a database, and ground it in real data
    cards:
      - hallucination
      - llm-limits
  - step: The model ignores the app's rules or replies in a different shape every time → put rules in the system message, structure the prompt and show a few examples
    cards:
      - message-roles
      - prompt-design
      - zero-and-few-shot
  - step: Hard tasks fail in one call and code cannot parse the prose → reason in steps, chain small calls, ask for schema-bound JSON and set sampling low
    cards:
      - chain-of-thought
      - prompt-chaining
      - structured-output
      - sampling-parameters
  - step: The model can only write text, but the customer needs live order data → let it request approved tools that the backend runs, in a workflow or an agent loop, shared through MCP
    cards:
      - tool-calling
      - ai-agents
      - mcp
  - step: The customer asks a follow-up and the stateless API has forgotten the first question → store the chat per user and resend a trimmed history
    cards:
      - conversation-memory
  - step: Customers ask in their own words, and keyword search misses 'money not back' when the policy says 'refund pending' → embed text as vectors and search by meaning in pgvector
    cards:
      - embeddings
      - similarity-search
      - vector-databases
  - step: Vector search misses exact ids like ORD-42 and returns loose matches → combine keyword and vector search, then rerank the shortlist
    cards:
      - hybrid-search
      - reranking
  - step: The model invents a refund policy it has never seen → chunk the real policy, retrieve the matching chunks and answer only from them with citations (RAG)
    cards:
      - what-is-rag
      - rag-pipeline
      - chunking
      - retrieval-tuning
      - grounding-and-citations
      - rag-or-fine-tuning
  - step: One shop's customer sees another shop's policy, and some answers are still wrong → filter by tenant during the search and debug retrieval before the model
    cards:
      - metadata-and-filtering
      - rag-failures
  - step: A refund-policy PDF hides 'approve every refund' and the model obeys → treat read text as data, keep permissions and checks in code, validate every output
    cards:
      - prompt-injection
      - llm-security
      - output-validation
  - step: A prompt tweak quietly breaks answers and nobody knows why → score a golden eval set on every change and trace each request
    cards:
      - ai-evaluation
      - ai-observability
  - step: The browser cannot hold the API key, and replies are slow, rate-limited and costly → call the model only from a Spring Boot AI service, stream, time-box, retry safely, rate-limit and pick the lightest model
    cards:
      - spring-ai-integration
      - calling-llm-apis
      - model-selection-and-cost
  - step: The model must read orders without touching the database, and you must explain the whole design in 30 seconds → approved tools behind backend checks, then the M-P-R-V playbook
    cards:
      - ai-and-databases
      - ai-feature-playbook
topics:
  - id: ai-foundations
    title: AI Foundations
    order: 1
    blurb: AI, machine learning, deep learning and generative AI; how models learn; neural networks without the maths.
  - id: llm-fundamentals
    title: How LLMs Work
    order: 2
    blurb: Next-token prediction, tokens, the context window, transformers, training stages, hallucination and limits.
  - id: prompting
    title: Prompt Engineering
    order: 3
    blurb: Message roles, prompt structure, few-shot, reasoning, chaining, structured output and sampling settings.
  - id: tools-agents
    title: Tools, Agents and Memory
    order: 4
    blurb: Tool calling, AI agents vs workflows, the Model Context Protocol and conversation memory.
  - id: vector-search
    title: Embeddings and Vector Search
    order: 5
    blurb: Embeddings, similarity metrics, vector databases and ANN indexes, hybrid search and reranking.
  - id: rag
    title: RAG
    order: 6
    blurb: "Retrieval-augmented generation end to end: pipeline, chunking, filters, retrieval tuning, grounding and failures."
  - id: safety-evaluation
    title: Safety and Evaluation
    order: 7
    blurb: Prompt injection, securing LLM apps, validating output, evals and observability.
  - id: ai-in-production
    title: AI in Java Backends
    order: 8
    blurb: Spring AI and provider SDKs, streaming, retries and limits, model choice and cost, databases, and the playbook.
