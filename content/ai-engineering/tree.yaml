topics:
  ai-foundations:
    - id: ai-ml-dl-genai
      children:
        - id: artificial-intelligence
          label: Artificial intelligence (AI)
          note: The broad field; ML is one way to build it, not the only one
          children:
            - id: rule-based-system
              label: Rule-based system
              note: "Knowledge written by hand as rules: AI without ML"
        - id: machine-learning
          label: Machine learning (ML)
          note: Trains a model on data to predict well on new data
          children:
            - id: discriminative-model
              label: Discriminative model
              note: Predicts a label from features, e.g. spam or not spam
        - id: deep-learning
          label: Deep learning
          note: ML with many layers that learn their own features
        - id: generative-ai
          label: Generative AI
          note: Creates new text, images, audio or video; LLMs are one kind
          children:
            - id: foundation-model
              label: Foundation model
              note: Broad data at scale, adaptable to many tasks (2021 term)
        - id: modalities
          label: Modalities
          note: Kinds of data a model takes in or puts out
          children:
            - id: text-modality
              label: Text
              note: Written language; what LLMs read and write
            - id: image-modality
              label: Image
              note: Pictures; video counts as its own modality
            - id: audio-modality
              label: Audio
              note: Speech and music
            - id: multimodal-model
              label: Multimodal model
              note: Inputs or outputs span more than one modality
    - id: machine-learning-types
      children:
        - id: supervised-learning
          label: Supervised learning
          note: Learns from features paired with their labels
          children:
            - id: ml-classification
              label: Classification
              note: "Predicts a category: binary or multiclass"
              children:
                - id: logistic-regression
                  label: Logistic regression
                  note: Predicts a probability for a two-value label
            - id: ml-regression
              label: Regression
              note: Predicts a number, such as a price or a count of days
        - id: unsupervised-learning
          label: Unsupervised learning
          note: Finds patterns in data that has no labels
          children:
            - id: ml-clustering
              label: Clustering
              note: Groups similar examples; a person names the groups later
              children:
                - id: k-means
                  label: k-means
                  note: Assigns each example to the nearest of k centre points
        - id: reinforcement-learning
          label: Reinforcement learning (RL)
          note: Learns a policy that maximises reward in an environment
        - id: self-supervised-learning
          label: Self-supervised learning
          note: Makes surrogate labels from unlabelled data; LLM pre-training
    - id: how-models-learn
      children:
        - id: dataset-split
          label: Train / validation / test split
          note: About 70 / 15 / 15 is a sound three-way split (Google MLCC)
          children:
            - id: training-set
              label: Training set
              note: The examples the model learns from
            - id: validation-set
              label: Validation set
              note: Checked many times while tuning the model
            - id: test-set
              label: Test set
              note: Used at the end as a final check on unseen data
        - id: training
          label: Training
          note: Sets weights and biases from examples, over many iterations
        - id: inference
          label: Inference
          note: Uses the learned weights; for an LLM, generating a reply
        - id: overfitting
          label: Overfitting
          note: Validation loss rises while training loss keeps falling
        - id: underfitting
          label: Underfitting
          note: Poor even on training data, e.g. too few epochs
    - id: neural-networks
      children:
        - id: network-layers
          label: Layers
          note: Input layer, hidden layers, output layer
          children:
            - id: hidden-layer
              label: Hidden layer
              note: Neurons between the input features and the output
        - id: activation-function
          label: Activation function
          note: Non-linear step that lets layers learn complex patterns
          children:
            - id: relu
              label: ReLU
              note: 0 for negative inputs, else the input; a good default
        - id: feed-forward-network
          label: Feed-forward network
          note: "No loops: values flow one way, input to output"
        - id: cnn
          label: Convolutional neural network (CNN)
          note: Has convolutional layers; strong at image recognition
        - id: rnn
          label: Recurrent neural network (RNN)
          note: Feeds each step into the next; built for sequences
        - id: transformer-architecture
          label: Transformer
          note: Attention only, no recurrence; trains in parallel (2017)
  llm-fundamentals:
    - id: what-is-an-llm
      children:
        - id: base-model
          label: Base model
          note: Pre-trained only; continues text rather than following requests
        - id: instruction-tuned-model
          label: Instruction-tuned (chat) model
          note: Tuned on demonstrations and rankings to follow instructions
        - id: reasoning-model
          label: Reasoning model
          note: Writes reasoning tokens before answering; billed as output
        - id: multimodal-llm
          label: Multimodal model
          term: multimodal-model
          note: Takes images as well as text; current Claude models do
        - id: open-weight-model
          label: Open-weight model
          note: Weights downloadable to self-host, e.g. gpt-oss (Apache 2.0)
    - id: tokens
      children:
        - id: tokenizer
          label: Tokenizer
          note: Turns text into token ids and back, without loss
        - id: bpe
          label: Byte-pair encoding (BPE)
          note: Builds sub-word units so rare words still encode
        - id: input-output-tokens
          label: Input vs output tokens
          note: Counted and billed separately; output tokens cost more
        - id: token-counting
          label: Token counting
          note: tiktoken locally, or Anthropic's free count_tokens endpoint
    - id: context-window
      children:
        - id: window-input
          label: Input side
          note: System prompt, tools, all messages, tool results, documents
        - id: window-output
          label: Output side
          note: The reply, including thinking tokens, also counts
        - id: context-overflow
          label: Context overflow
          note: "Anthropic: input over the window returns a 400 error"
        - id: lost-in-the-middle
          label: Lost in the middle
          note: Best recall at the start or end of a long input
        - id: context-rot
          label: Context rot
          note: "Anthropic: accuracy and recall degrade as tokens grow"
    - id: transformer-and-attention
      children:
        - id: self-attention
          label: Self-attention
          note: Each token weighs how much every other token shapes its meaning
          children:
            - id: query-key-value
              label: Query, key, value
              note: Output is values weighted by query-key match
        - id: multi-head-attention
          label: Multi-head attention
          note: Several attentions in parallel learn different relations
        - id: positional-encoding
          label: Positional encoding
          note: Adds word-order information, since there is no recurrence
        - id: encoder-only-model
          label: Encoder-only (BERT)
          note: Reads both directions; used for embeddings and classifiers
        - id: decoder-only-model
          label: Decoder-only (GPT-style)
          note: Sees earlier tokens only; generates text
        - id: encoder-decoder-model
          label: Encoder-decoder
          note: The original transformer design; classic use is translation
    - id: llm-training-stages
      children:
        - id: pre-training
          label: Pre-training
          note: Next-token prediction on huge text; gives a base model
        - id: fine-tuning
          label: Fine-tuning
          note: Further training of a trained model on a task's examples
          children:
            - id: supervised-fine-tuning
              label: Supervised fine-tuning (SFT)
              note: Learn from demonstrations of good answers
            - id: peft
              label: Parameter-efficient fine-tuning (PEFT)
              note: Train a small number of (often extra) parameters; freeze the rest
              children:
                - id: lora
                  label: LoRA
                  note: Small low-rank matrices; base weights frozen
        - id: preference-tuning
          label: Preference tuning
          note: Tune the model towards answers people rank higher
          children:
            - id: rlhf
              label: RLHF
              note: Reward model from human rankings, then reinforcement learning
            - id: dpo
              label: DPO
              note: Learns from preference pairs with a simple classification loss
        - id: distillation
          label: Distillation
          note: Compress a big model's knowledge into a smaller one
    - id: hallucination
      children:
        - id: factual-hallucination
          label: Factual error
          note: Output that is false about the world
        - id: unfaithful-output
          label: Unfaithful to context
          note: Output inconsistent with the documents given
        - id: confabulation
          label: Confabulation (NIST)
          note: NIST AI 600-1 name for confident false content
    - id: llm-limits
      children:
        - id: knowledge-cutoff
          label: Knowledge cutoff
          note: Models list a training data cutoff date
        - id: database
          label: Database
          note: All-or-nothing transactions; the source of truth
        - id: search-engine
          label: Search engine
          note: Finds and ranks existing documents by relevance
        - id: non-determinism
          label: Non-determinism
          note: "Anthropic: not fully deterministic even at temperature 0"
        - id: stateless-calls
          label: Stateless calls
          note: "OpenAI: each request is independent; resend history or chain by id"
  prompting:
    - id: message-roles
      children:
        - id: system-message
          label: System or developer message
          note: The app's rules, persona and format; ranked above user messages
        - id: user-message
          label: User message
          note: The end user's request; followed unless higher rules conflict
        - id: assistant-message
          label: Assistant message
          note: The model's earlier replies; no authority of their own
        - id: tool-result-message
          label: Tool result message
          note: Output of a tool call; information, not instructions
        - id: instruction-hierarchy
          label: Instruction hierarchy
          note: "OpenAI Model Spec: root > system > developer > user > guideline"
    - id: prompt-design
      children:
        - id: prompt-role-part
          label: Role
          note: One sentence of role in the system prompt focuses tone and behaviour
        - id: prompt-task-part
          label: Task
          note: Clear, specific instructions; numbered steps when order matters
        - id: prompt-context-part
          label: Context
          note: Data the model needs; long documents go above the question
        - id: prompt-constraints-part
          label: Constraints
          note: Rules and limits; giving the reason helps the model generalise
        - id: prompt-output-part
          label: Output format
          note: Say the format wanted; ask for what to do, not what to avoid
        - id: prompt-template
          label: Prompt template
          note: Spring AI PromptTemplate fills {placeholders} at runtime
    - id: zero-and-few-shot
      children:
        - id: zero-shot
          label: Zero-shot
          note: Instructions only, no examples
        - id: one-shot
          label: One-shot
          note: Exactly one worked example before the real input
        - id: few-shot
          label: Few-shot
          note: A few diverse examples; Anthropic suggests 3–5
        - id: in-context-learning
          label: In-context learning
          note: Task learned from the prompt text, no gradient updates (Brown 2020)
    - id: chain-of-thought
      children:
        - id: manual-cot
          label: Chain-of-thought prompt
          note: Steps before the answer lift large models on maths (Wei 2022)
        - id: reasoning-effort
          label: Reasoning effort
          note: OpenAI reasoning.effort; Anthropic output_config.effort
        - id: thinking-budget
          label: Thinking budget (budget_tokens)
          note: Older Anthropic setting; newer models use adaptive thinking
        - id: reasoning-summary
          label: Reasoning summary
          note: OpenAI hides raw reasoning tokens; a summary can be requested
    - id: prompt-chaining
      children:
        - id: chain-gate
          label: Gate
          note: A code check between steps keeps the chain on track
        - id: routing-workflow
          label: Routing
          note: Classify the input, then send it to a specialised prompt
        - id: parallelisation-workflow
          label: Parallelisation
          note: Sectioning or voting; results combined in code
        - id: orchestrator-workers
          label: Orchestrator-workers
          note: A central LLM splits work among worker LLMs and merges it
        - id: evaluator-optimiser
          label: Evaluator-optimiser
          note: One call drafts, another critiques, in a loop
    - id: structured-output
      children:
        - id: prompt-only-json
          label: JSON asked in the prompt
          note: Format instructions added; reply parsed after (Spring AI)
        - id: json-mode
          label: JSON mode
          note: Valid JSON guaranteed, schema not guaranteed
        - id: schema-constrained-output
          label: Schema-constrained output
          note: Reply follows your JSON Schema via constrained decoding
        - id: spring-ai-entity
          label: Spring AI .entity()
          note: ChatClient maps the reply to a Java class or record
        - id: sdk-class-schema
          label: Java SDK class schemas
          note: openai-java text(Class); anthropic-java outputConfig(Class)
    - id: sampling-parameters
      children:
        - id: greedy-decoding
          label: Greedy decoding
          note: Always the most likely token; long text turns bland and repetitive
        - id: temperature
          label: Temperature
          note: OpenAI 0 to 2; Anthropic 0 to 1, default 1.0, deprecated on newer models
        - id: top-p
          label: Top-p (nucleus sampling)
          note: Sample from the smallest token set whose probability reaches p
        - id: top-k
          label: Top-k sampling
          note: Only the k most likely tokens; Anthropic top_k, deprecated on newer models
        - id: max-output-tokens
          label: Max output tokens
          note: Upper bound on generated tokens; reasoning tokens count too (OpenAI)
        - id: stop-sequence
          label: Stop sequence
          note: Custom text that ends generation when it appears
  tools-agents:
    - id: tool-calling
      children:
        - id: tool-definition
          label: Tool definition
          note: Name, description and JSON Schema of the arguments
        - id: strict-tool-use
          label: Strict tool use
          note: "strict: true makes arguments always match the schema"
        - id: parallel-tool-calls
          label: Parallel tool calls
          note: Several calls in one turn; an API flag turns it off
        - id: tool-result
          label: Tool result
          note: Your code's output, sent back for the model's next turn
        - id: tool-context
          label: ToolContext (Spring AI)
          note: Passes user or tenant id to the tool, never to the model
    - id: ai-agents
      children:
        - id: plain-chatbot
          label: Chatbot
          note: One LLM call per message; no tools, no loop
        - id: llm-workflow
          label: Workflow (LLM)
          note: LLMs and tools run on code-defined paths (Anthropic)
          children:
            - id: agent-routing
              label: Routing
              term: routing-workflow
              note: Classify the input, then send it to a specialised step
        - id: react-pattern
          label: ReAct
          note: Reasoning steps interleaved with actions (Yao 2022)
        - id: agent-stop-conditions
          label: Stopping conditions
          note: Goal met or max iterations; Spring AI also caps tool calls
        - id: human-in-the-loop
          label: Human approval
          note: Agent pauses for a person at checkpoints or blockers
        - id: multi-agent-system
          label: Multi-agent system
          note: Orchestrator LLM splits work and delegates to worker LLMs
    - id: mcp
      children:
        - id: mcp-host
          label: MCP host
          note: "The AI app: creates clients, enforces consent"
        - id: mcp-client
          label: MCP client
          note: Lives in the host; talks to exactly one server
        - id: mcp-server
          label: MCP server
          note: Local process or remote service exposing features
          children:
            - id: mcp-server-tools
              label: Tools (MCP)
              note: "Functions the model can call: tools/list, tools/call"
            - id: mcp-resource
              label: Resources (MCP)
              note: Context and data for the user or the model
            - id: mcp-prompt
              label: Prompts (MCP)
              note: Templated messages and workflows for users
        - id: mcp-client-features
          label: Client features
          note: What a client can offer back to servers
          children:
            - id: elicitation
              label: Elicitation
              note: Server asks the user for input, in form or URL mode
            - id: mcp-sampling
              label: Sampling (MCP)
              note: Server asks the host's LLM; deprecated in 2026-07-28
            - id: mcp-roots
              label: Roots (MCP)
              note: Folders the client shares; deprecated in 2026-07-28
        - id: mcp-transports
          label: Transports
          note: Same JSON-RPC messages, different delivery
          children:
            - id: stdio-transport
              label: stdio
              note: Newline-delimited JSON-RPC over a subprocess's streams
            - id: streamable-http
              label: Streamable HTTP
              note: POST to one endpoint; reply as JSON or an SSE stream
        - id: spring-ai-mcp
          label: Spring AI MCP starters
          note: Client and server Boot starters; @McpTool exposes a method
    - id: conversation-memory
      children:
        - id: full-history
          label: Full history
          note: Resend every turn; all of it is billed as input tokens
        - id: sliding-window-memory
          label: Sliding window
          note: Keep the last N messages; Spring AI default is 20
        - id: summary-memory
          label: Summary memory
          note: Old turns replaced by a summary; Anthropic calls it compaction
        - id: long-term-memory
          label: Long-term memory
          note: Facts kept outside the window, read back on demand
        - id: provider-conversation-state
          label: Provider-managed state
          note: OpenAI previous_response_id or the Conversations API
        - id: spring-ai-chat-memory
          label: Spring AI ChatMemory
          note: Advisor loads history by conversation id; in memory by default
  vector-search:
    - id: embeddings
      children:
        - id: embedding-model
          label: Embedding model
          note: Returns one fixed-length vector per input text
        - id: vector
          label: Vector
          note: A list of floating-point numbers, e.g. [0.12, -0.45, 0.73]
        - id: embedding-dimension
          label: Dimension
          note: "text-embedding-3-small: 1,536 numbers by default (OpenAI)"
        - id: embedding-uses
          label: Common uses
          note: Search, clustering, recommendations, classification
    - id: similarity-search
      children:
        - id: exact-knn
          label: Exact kNN
          note: "Scores every stored vector: perfect recall, slow at scale"
        - id: cosine-similarity
          label: Cosine similarity
          note: "Angle only: 1 = same direction, 0 = unrelated"
        - id: cosine-distance
          label: Cosine distance
          note: 1 − cosine similarity; pgvector operator <=>
        - id: dot-product
          label: Dot product (inner product)
          note: Counts length too; equals cosine on unit-length vectors
        - id: euclidean-distance
          label: Euclidean (L2) distance
          note: Straight-line gap; smaller means more similar
        - id: normalised-vector
          label: Normalised vector
          note: Length 1; OpenAI embeddings come normalised
    - id: vector-databases
      children:
        - id: ann-search
          label: Approximate nearest neighbour (ANN)
          note: Trades some recall for speed; results can differ from exact
        - id: hnsw
          label: HNSW index
          note: Multi-layer graph; better speed-recall, more memory
        - id: ivfflat
          label: IVFFlat index
          note: Splits vectors into lists; searches the closest few
        - id: vector-database
          label: Vector database
          note: Stores embeddings; returns the most similar to a query
          children:
            - id: pgvector
              label: pgvector
              note: "PostgreSQL extension: vector type, distances, HNSW, IVFFlat"
            - id: dedicated-vector-stores
              label: Dedicated vector stores
              note: e.g. Pinecone, Weaviate, Milvus, Qdrant (in Spring AI 2.0)
        - id: relational-database
          label: Relational database
          note: "Data in tables (relations): orders, payments, refunds"
    - id: hybrid-search
      children:
        - id: keyword-search
          label: Keyword search
          note: Literal word matches; misses synonyms and acronyms
          children:
            - id: bm25
              label: BM25
              note: Ranks by term frequency, term rarity (IDF) and length
            - id: postgres-full-text
              label: PostgreSQL full-text search
              note: tsvector @@ tsquery; ranked by ts_rank, not BM25
        - id: semantic-search
          label: Semantic search
          note: Finds nearby embeddings; handles synonyms and paraphrases
        - id: rrf
          label: Reciprocal rank fusion (RRF)
          note: Sums 1 / (k + rank) over lists; k = 60 in the 2009 paper
        - id: weighted-score-blend
          label: Weighted score blending
          note: Normalise scores (e.g. min-max), then a weighted mean
    - id: reranking
      children:
        - id: bi-encoder
          label: Bi-encoder
          note: Embeds each text separately; vectors can be indexed
        - id: cross-encoder
          label: Cross-encoder reranker
          note: Scores a (query, document) pair; makes no vector
        - id: hosted-rerank-api
          label: Hosted rerank API
          note: e.g. Cohere Rerank, Voyage rerankers (2026)
        - id: open-cross-encoder
          label: Open cross-encoder model
          note: Self-hosted, e.g. loaded with Sentence Transformers
        - id: llm-reranker
          label: LLM as reranker
          note: A prompted LLM orders passages (Sun et al., 2023)
  rag:
    - id: what-is-rag
      children:
        - id: plain-llm-call
          label: Plain LLM call
          note: Answers only from what the model learned in training
        - id: rag-call
          label: RAG call
          note: Adds retrieved text to the prompt before generating
        - id: rag-origin-paper
          label: RAG paper (Lewis et al., 2020)
          note: Seq2seq model plus a dense Wikipedia index, fine-tuned together
    - id: rag-pipeline
      children:
        - id: ingestion-phase
          label: Ingestion (offline)
          note: Read, split, embed and store documents ahead of time
          children:
            - id: spring-document-reader
              label: DocumentReader (Spring AI)
              note: Reads text, PDF, HTML or Markdown into Document objects
            - id: spring-token-text-splitter
              label: TokenTextSplitter (Spring AI)
              note: Splits Documents into chunks by token count
            - id: spring-vector-store-add
              label: VectorStore.add (Spring AI)
              note: Embeds chunks with the EmbeddingModel and stores them
        - id: query-phase
          label: Query time (online)
          note: Embed the question, search, augment the prompt, generate
          children:
            - id: question-answer-advisor
              label: QuestionAnswerAdvisor
              note: "Spring AI: searches the store, appends results to the prompt"
            - id: retrieval-augmentation-advisor
              label: RetrievalAugmentationAdvisor
              note: "Spring AI: modular flow of transformers, retriever, augmenter"
        - id: index-refresh
          label: Index refresh
          note: Delete a document's old chunks by id or filter, then re-add
    - id: chunking
      children:
        - id: fixed-size-chunking
          label: Fixed-size chunking
          note: Cut every N tokens or characters, often with overlap
        - id: sentence-aware-chunking
          label: Sentence-aware splitting
          note: TokenTextSplitter cuts at . ? ! or a newline where it can
        - id: structure-chunking
          label: Structure-based chunking
          note: Split on headings, sections or pages
        - id: semantic-chunking
          label: Semantic chunking
          note: Split into units that keep related sentences together
        - id: chunk-overlap
          label: Chunk overlap
          note: "OpenAI: overlap must not exceed half the chunk size"
        - id: contextual-chunk-context
          label: Contextual retrieval
          term: contextual-retrieval
          note: "Anthropic: prepend 50-100 tokens of document context"
    - id: metadata-and-filtering
      children:
        - id: pre-filtering
          label: Pre-filtering
          note: Limit the search to allowed rows first; K results stay K
        - id: post-filtering
          label: Post-filtering
          note: "pgvector ANN indexes filter after the scan: can return fewer"
        - id: pgvector-iterative-scan
          label: Iterative index scan
          note: "pgvector 0.8.0+: scans more of the index until enough match"
        - id: tenant-id-filter
          label: tenant_id filter
          note: Shared table; every search adds the caller's tenant
        - id: tenant-partition
          label: Partition or table per tenant
          note: pgvector advice for tenant isolation; also better recall
        - id: pg-row-level-security
          label: Row-level security
          term: row-level-security
          note: PostgreSQL policies filter rows; with RLS on, no policy = deny all
    - id: retrieval-tuning
      children:
        - id: top-k-setting
          label: Top-K
          term: top-k
          note: Spring AI 2.0 SearchRequest default is 4
        - id: similarity-threshold-setting
          label: Similarity threshold
          term: similarity-threshold
          note: "Spring AI: 0 to 1; default 0.0 accepts all"
        - id: rewrite-query-transformer
          label: RewriteQueryTransformer
          note: "Spring AI: an LLM rewrites a vague query for search"
        - id: compression-query-transformer
          label: CompressionQueryTransformer
          note: "Spring AI: history plus follow-up into one standalone query"
        - id: multi-query-expander
          label: MultiQueryExpander
          note: "Spring AI: LLM writes query variants; keeps the original"
        - id: hyde-technique
          label: HyDE
          term: hyde
          note: Embed an LLM-written hypothetical answer, then search with it
    - id: rag-or-fine-tuning
      children:
        - id: fine-tuning-route
          label: Fine-tuning
          note: Train on examples for consistent behaviour or fewer tokens
        - id: long-context
          label: Long context
          note: "Anthropic: under about 200,000 tokens, skip RAG and send all"
        - id: rag-plus-fine-tuning
          label: RAG + fine-tuning
          note: "OpenAI: they stack; fine-tune on examples that include RAG"
    - id: grounding-and-citations
      children:
        - id: anthropic-citations
          label: Citations (Anthropic API)
          note: citations.enabled per document; returns cited_text and location
        - id: openai-file-citation
          label: file_citation annotations (OpenAI)
          note: File search answers carry annotations pointing to files
        - id: quote-then-answer
          label: Quote first, then answer
          note: "Anthropic: extract exact quotes, then answer from them"
        - id: allow-i-dont-know
          label: Allow 'I don't know'
          note: "Anthropic: permitting uncertainty reduces false answers"
    - id: rag-failures
      children:
        - id: data-failure
          label: Data failure
          note: "Barnett FP1: the answer is not in the documents"
        - id: retrieval-failure
          label: Retrieval and ranking failure
          note: "Barnett FP2: the answer exists but is not in the top K"
        - id: context-failure
          label: Context failure
          note: "Barnett FP3: retrieved but dropped when building the context"
        - id: generation-failure
          label: Generation failure
          note: "Barnett FP4-FP7: not extracted, wrong format or specificity, incomplete"
  safety-evaluation:
    - id: prompt-injection
      children:
        - id: direct-prompt-injection
          label: Direct prompt injection
          note: The user's own input changes the model's behaviour
        - id: indirect-prompt-injection
          label: Indirect prompt injection
          note: Instructions hidden in pages, files, emails or tool results
        - id: jailbreak
          label: Jailbreak
          note: Injection that makes the model drop its safety rules
        - id: injection-data-exfiltration
          label: Data exfiltration via links
          note: Injected image or link URL sends chat data to an attacker
        - id: tool-result-screening
          label: Tool-result screening
          note: A small model classifies tool output for injection before use
    - id: llm-security
      children:
        - id: owasp-llm-top-10
          label: OWASP LLM Top 10 (2025)
          note: Ten risks, from LLM01 Prompt Injection to LLM10
        - id: least-privilege
          label: Least privilege for tools
          note: Only needed tools, run as the user with narrow scopes
        - id: secrets-outside-prompts
          label: Secrets outside prompts
          note: Keys and roles in systems the model cannot read
        - id: data-minimisation
          label: Data minimisation and masking
          note: Send less; redact or tokenise sensitive data
        - id: zero-data-retention
          label: Zero data retention
          note: "OpenAI: approved customers only; skips abuse-log storage"
        - id: denial-of-wallet
          label: Denial of wallet
          note: Flooding pay-per-use calls to run up the bill
    - id: output-validation
      children:
        - id: output-schema-check
          label: Schema check
          note: Reply parses into the expected type, or is rejected
        - id: business-rule-check
          label: Business-rule check
          note: Amount, owner and state checked against the database
        - id: context-aware-encoding
          label: Context-aware encoding
          note: HTML-encode for pages; parameterised queries for SQL
        - id: guardrail
          label: Guardrails
          note: Independent checks on input and output, outside the prompt
          children:
            - id: input-guardrail
              label: Input filter
              note: Screens user input for injection or harmful content
            - id: output-guardrail
              label: Output filter
              note: Inspects replies before they reach the user
            - id: moderation-api
              label: Moderation API
              note: "OpenAI: free endpoint classifying harmful text and images"
            - id: pii-scrubbing
              label: PII scrubbing
              note: Masks personal data in prompts or replies
            - id: topic-restriction
              label: Topic and scope limits
              note: System prompt fixes the role; checks keep it on task
        - id: human-review
          label: Human approval
          note: A person approves high-impact actions
    - id: ai-evaluation
      children:
        - id: golden-dataset
          label: Golden dataset
          note: Typical, edge and adversarial cases from real traffic
        - id: eval-graders
          label: Graders
          note: Code, model or human scores for each case
          children:
            - id: code-grader
              label: Code grader
              note: Exact or string match, schema validity; cheap, repeatable
            - id: llm-as-a-judge
              label: LLM-as-a-judge
              note: Model grades pairwise, single answer or against a reference
            - id: human-grader
              label: Human grader
              note: Best quality, slow and costly; calibrates the others
        - id: judge-biases
          label: Judge biases
          note: Named by Zheng et al. 2023 (arXiv 2306.05685)
          children:
            - id: position-bias
              label: Position bias
              note: Prefers an answer because of its order
            - id: verbosity-bias
              label: Verbosity bias
              note: Prefers longer answers
            - id: self-enhancement-bias
              label: Self-enhancement bias
              note: Prefers answers from itself
        - id: rag-eval-metrics
          label: RAG metrics (Ragas)
          note: Retrieval and generation scored apart
          children:
            - id: context-precision
              label: Context precision
              note: Useful chunks ranked above useless ones
            - id: context-recall
              label: Context recall
              note: Share of needed facts found; needs a reference
            - id: faithfulness
              label: Faithfulness
              note: Claims in the answer backed by retrieved context
            - id: answer-relevancy
              label: Answer relevancy
              note: Answer fits the question; does not check facts
        - id: regression-eval
          label: Regression eval
          note: Re-run the eval set on every change to catch breaks
    - id: ai-observability
      children:
        - id: genai-trace
          label: Trace of one AI request
          note: Spans share one trace id; operation names per OTel GenAI
          children:
            - id: retrieval-span
              label: retrieval span
              note: Vector-store search; query text is opt-in
            - id: chat-span
              label: chat span
              note: "Model call: model name, input and output tokens"
            - id: execute-tool-span
              label: execute_tool span
              note: One tool call made for the model
        - id: opentelemetry-genai
          label: OpenTelemetry GenAI conventions
          note: Standard span and metric names; status Development
        - id: spring-ai-observations
          label: Spring AI observations
          note: Micrometer observations for chat, tools, vector stores
        - id: ttft
          label: Time to first token
          note: Time until the first output token arrives
        - id: safe-logging
          label: Safe logging
          note: Prompt and completion content off by default (Spring AI)
  ai-in-production:
    - id: spring-ai-integration
      children:
        - id: spring-ai-chatclient
          label: Spring AI ChatClient
          note: Fluent prompt API over any ChatModel; Spring AI 2.0 on Boot 4.0/4.1
        - id: advisor-spring-ai
          label: Advisors
          note: Intercept each call to add chat memory or retrieved documents
        - id: provider-sdk
          label: Official provider Java SDK
          note: OpenAI and Anthropic SDKs; Spring AI 2.0 wraps them
        - id: raw-http-client
          label: RestClient / WebClient
          note: "Raw HTTP: RestClient is synchronous, WebClient non-blocking"
        - id: api-key-storage
          label: API key storage
          note: "Server-side only: key management service or environment variable"
    - id: calling-llm-apis
      children:
        - id: blocking-response
          label: Blocking call
          note: Waits for the whole reply; Spring AI .call()
        - id: streaming-response
          label: Streaming (SSE)
          note: Provider sends output as server-sent events; Spring AI .stream()
        - id: llm-timeouts
          label: Connect and request timeouts
          note: Cap the wait; Spring AI 2.0 OpenAI request timeout 60 s
        - id: llm-retries
          label: Retry with backoff and jitter
          note: Retry 429 and 5xx; wait at least Retry-After
          children:
            - id: idempotency-key
              label: Idempotency key
              note: Same client request id on a retry = treated as a duplicate
            - id: circuit-breaker
              label: Circuit breaker + fallback
              note: Fail fast after repeated failures; return a fallback reply
        - id: llm-rate-limits
          label: Rate limits
          note: Limits at the provider and your own limits in front of it
          children:
            - id: provider-rate-limits
              label: Provider limits
              note: Requests and tokens per minute; 429 when exceeded
            - id: per-user-quota
              label: Per-user quota
              note: "OWASP LLM10: rate limits and user quotas cap consumption"
    - id: model-selection-and-cost
      children:
        - id: model-routing
          label: Model routing
          note: Lower-cost model for bulk work, frontier model for hard parts
        - id: response-cache
          label: Response cache
          note: Your app stores whole answers; a hit skips the model
          children:
            - id: semantic-caching
              label: Semantic cache
              note: Reuses an answer when a new question is close in embedding space
        - id: prompt-caching
          label: Provider prompt caching
          note: Reuses an identical prompt prefix; output is unchanged
        - id: batch-api
          label: Batch API
          note: Async jobs, results within 24 h, 50% off (OpenAI, Anthropic)
        - id: self-hosted-model
          label: Self-hosted open-weight model
          note: Run the model on your own servers, e.g. via Ollama
          children:
            - id: quantisation
              label: Quantisation
              note: Lower-precision weights (int8, int4) to cut memory
    - id: ai-and-databases
      children:
        - id: unrestricted-db-access
          label: Raw DB access for the model
          note: "Excessive agency (OWASP LLM06): avoid"
        - id: approved-db-tool
          label: Approved tool
          note: Fixed query; user id from ToolContext, never shown to the model
        - id: text-to-sql
          label: Text-to-SQL
          note: Model writes SQL; treat it as untrusted (OWASP LLM05)
          children:
            - id: read-only-role
              label: Read-only role
              note: SELECT on allowlisted views only (least privilege)
            - id: statement-timeout
              label: statement_timeout
              note: Aborts a slow statement; 0 (off) by default in PostgreSQL 18
        - id: shared-postgres-pgvector
          label: One PostgreSQL with pgvector
          note: Vectors stored with the rest of your data, with JOINs and ACID
    - id: ai-feature-playbook
      children:
        - id: mprv-model
          label: Model
          note: Generates the reply from the prompt
        - id: mprv-prompt
          label: Prompt
          note: Instructions, context and the question
        - id: mprv-retrieval
          label: Retrieval
          note: Fetches relevant documents before generation (RAG)
        - id: mprv-validation
          label: Validation
          note: "Checks output before use: model output is untrusted (OWASP LLM05)"
