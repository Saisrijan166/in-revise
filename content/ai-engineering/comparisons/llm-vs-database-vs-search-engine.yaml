id: llm-vs-database-vs-search-engine
tech: ai-engineering
title: LLM vs Database vs Search Engine
compares: [what-is-an-llm, database, search-engine]
gist:
  - "Generates new text from learned patterns"
  - "Stores and returns exact records"
  - "Finds and ranks existing documents"
explain:
  - "An LLM writes new text from patterns it learned in training. It is excellent at phrasing, summarising and reasoning over what you give it, but its facts are only plausible and can be wrong."
  - "A database stores exact records and returns precisely what you ask for. It is the source of truth for orders, payments and balances, and it is transactional and current after each commit."
  - "A search engine indexes existing documents and returns a ranked list of the most relevant ones. It retrieves text that already exists; it does not invent new text."
example: "'Where is my refund for order 42?' The database holds the exact refund row and amount; a search engine finds the refund-policy document; the LLM reads both and writes the friendly reply. Ask the LLM alone for the amount and it may guess a number that was never real."
sayIt: "An LLM generates text, a database stores exact records, and a search engine ranks existing documents. I keep facts in the database, find documents with search, and let the LLM write the answer from both. That combination is RAG plus tools."
rows:
  - { aspect: "Returns", a: "New text it writes", b: "The exact rows asked for", c: "A ranked list of documents" }
  - { aspect: "Freshness", a: "Frozen at the knowledge cutoff", b: "Current after each commit", c: "As fresh as its index" }
  - { aspect: "Exactness", a: "Plausible, can be wrong", b: "Exact, transactional", c: "Exact text, ranked by relevance" }
  - { aspect: "Source of truth for", a: "Nothing", b: "Orders, payments, refunds", c: "Which document says what" }
verdict: "Keep facts in the database, find documents with search, and let the LLM write the answer from both (RAG and tools)."
sources:
