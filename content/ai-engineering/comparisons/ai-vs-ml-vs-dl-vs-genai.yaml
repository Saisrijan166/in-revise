id: ai-vs-ml-vs-dl-vs-genai
tech: ai-engineering
title: AI vs ML vs Deep Learning vs GenAI
compares: [artificial-intelligence, machine-learning, deep-learning, generative-ai]
gist:
  - "Any system doing tasks that need human-like reasoning"
  - "Learns patterns from data instead of hand-written rules"
  - "ML with neural networks of many layers"
  - "Deep learning models that create new content"
explain:
  - "Artificial intelligence is the broad goal: any system that does tasks needing human-like reasoning, from a hand-written rule to a chatbot. It is the widest of the four."
  - "Machine learning is the part of AI where the model learns its behaviour from example data instead of a person coding every case. It solves problems whose rules are too fuzzy to write by hand."
  - "Deep learning is machine learning built from neural networks with many layers. It learns its own features from raw text, images or sound, so nobody hand-crafts them."
  - "Generative AI is deep learning that creates new content, such as text, images or audio. LLMs are the text kind. It solves 'produce something new', not 'pick a label'."
example: "In the payments app: a fixed rule 'auto-approve refunds under ₹500' is AI but not ML. A fraud score on a refund request is machine learning (a number from features). Spotting a damaged item in a photo uses deep learning. Drafting the customer reply is generative AI."
rows:
  - { aspect: "Is", a: "The broad field", b: "A part of AI", c: "A part of ML", d: "A part of deep learning" }
  - { aspect: "Learns from", a: "Nothing, if rules are hand-written", b: "Examples, often with labels", c: "Data; learns its own features too", d: "Broad data at scale, then tuning" }
  - { aspect: "Typical output", a: "A decision or action", b: "A label or a number", c: "A label or number from images, audio or text", d: "New text, images, audio or video" }
  - { aspect: "In a refund assistant", a: "Auto-approve under ₹500 (example rule)", b: "Fraud score on a refund request", c: "Spot a damaged item in a photo", d: "Draft the reply to the customer" }
verdict: "Use rules when the logic is known, classic ML to predict a label or number, and GenAI when the output is new language or content."
sayIt: "They nest rather than compete: AI is the broad goal, ML learns from data, deep learning is ML with many-layer networks, and GenAI is deep learning that creates new content. For a known rule I write code, for a label or number I use classic ML, and for new text I use an LLM."
