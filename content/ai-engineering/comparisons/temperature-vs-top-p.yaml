id: temperature-vs-top-p
tech: ai-engineering
title: Temperature vs Top-P
compares: [temperature, top-p]
gist:
  - "Reshapes the whole probability spread"
  - "Keeps only the top tokens that add up to p"
explain:
  - "Temperature scales the model's next-token probabilities before picking. Low makes the gaps bigger, so the top token almost always wins (focused). High flattens them, so less likely tokens get a real chance (varied)."
  - "Top-p (nucleus sampling) first keeps the smallest set of top tokens whose probabilities add up to p, then samples from that set only. A low p leaves only the few most likely tokens in the pool."
example: "You extract an order id and want the same answer every time. Set temperature 0.2 and leave top-p at its default. Turning both knobs together makes the effect hard to reason about, so you change only one. For varied marketing drafts you would raise temperature instead."
rows:
  - { aspect: "What it changes", a: "How sharp or flat the probabilities are", b: "Which tokens may be picked at all" }
  - { aspect: "Low value", a: "Focused and more deterministic", b: "Only the few most likely tokens" }
  - { aspect: "High value", a: "More varied, more random", b: "Most tokens stay in the pool" }
  - { aspect: "Range", a: "OpenAI 0 to 2; Anthropic 0 to 1", b: "A probability mass from 0 to 1" }
  - { aspect: "Tip", a: "The usual knob to tune", b: "Leave at default when tuning temperature" }
verdict: "Tune temperature, leave top-p alone, and check the model still accepts them: low for facts, higher for ideas."
sayIt: "Both control randomness. Temperature reshapes the whole probability spread; top-p keeps only the top tokens that add up to p, then samples from those. I tune one, usually temperature, keep it low for facts, and check the model still accepts the setting."
