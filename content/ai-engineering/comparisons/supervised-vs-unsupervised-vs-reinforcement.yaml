id: supervised-vs-unsupervised-vs-reinforcement
tech: ai-engineering
title: Supervised vs Unsupervised vs Reinforcement Learning
compares: [supervised-learning, unsupervised-learning, reinforcement-learning]
gist:
  - "Learns from examples with the right answers"
  - "Finds patterns in data with no answers"
  - "Learns which actions earn rewards"
explain:
  - "Supervised learning trains on examples that each carry the right answer (a label), and learns to predict that answer for new inputs. Use it when your data is already labelled, for classification or regression."
  - "Unsupervised learning gets no labels. It finds structure in the data on its own, such as grouping similar items into clusters. Use it to explore unlabelled data and discover themes."
  - "Reinforcement learning has no labelled answers either. An agent takes actions, receives rewards or penalties, and learns a policy of which action to take. Use it when success is judged over a series of actions."
example: "In the payments app: predicting fraud-or-not on a refund request from labelled past requests is supervised. Grouping unlabelled complaint texts by theme is unsupervised clustering. Tuning the assistant's replies from human rankings of good and bad answers is reinforcement learning (the idea behind RLHF)."
rows:
  - { aspect: "Data it needs", a: "Labelled examples: features plus a label", b: "Unlabelled examples", c: "An environment to act in" }
  - { aspect: "Learns", a: "To map features to the label", b: "Groups or structure in the data", c: "A policy: which action to take" }
  - { aspect: "Feedback", a: "The label of each example", b: "None", c: "A reward or penalty for actions" }
  - { aspect: "Typical task", a: "Classification, regression", b: "Clustering", c: "Games; RLHF for LLMs" }
  - { aspect: "In a refund assistant", a: "Fraud or not on a refund request", b: "Group complaint texts by theme", c: "Tune replies from human rankings" }
verdict: "Have labels: supervised. No labels, want structure: unsupervised. A series of actions judged by a reward: reinforcement."
sayIt: "The kind of learning depends on the data. Labelled examples mean supervised learning, for classification or regression. No labels but a wish to find structure means unsupervised, such as clustering. Rewards for actions over time mean reinforcement learning, which is how RLHF tunes LLMs."
