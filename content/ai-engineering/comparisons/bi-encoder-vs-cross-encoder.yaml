id: bi-encoder-vs-cross-encoder
tech: ai-engineering
title: Bi-encoder vs Cross-encoder
compares: [bi-encoder, cross-encoder]
gist:
  - "Embeds query and document separately"
  - "Reads query and document together"
rows:
  - { aspect: "Reads", a: "Each text alone, into its own vector", b: "The (query, document) pair at once" }
  - { aspect: "Speed", a: "Fast: compare stored vectors", b: "Slow: one model run per pair" }
  - { aspect: "Accuracy", a: "Good", b: "Better" }
  - { aspect: "Pre-compute", a: "Yes: embed documents once", b: "No: needs the query" }
  - { aspect: "Used for", a: "Retrieval over millions", b: "Reranking a shortlist" }
verdict: "Retrieve with a bi-encoder, then rerank the shortlist with a cross-encoder."
explain:
  - "A bi-encoder embeds the query and each document separately into vectors, so documents can be embedded once and reused; it is built for fast retrieval over millions of items."
  - "A cross-encoder reads the query and one document together in a single pass and outputs a relevance score; it is more accurate but must run per pair, so it is used for reranking a shortlist."
example: "A refund question retrieves 50 chunks with a bi-encoder in about 20 ms (vectors were pre-computed). A cross-encoder then scores all 50 (query, chunk) pairs to pick the best 5, adding latency because it cannot reuse any stored vector."
sayIt: "A bi-encoder embeds query and documents separately, so it is fast and pre-indexable for retrieval. A cross-encoder reads the pair together, so it is more accurate but runs per pair. Retrieve with the bi-encoder, rerank the shortlist with the cross-encoder."
sources:
  - title: "Cross-Encoders (Sentence Transformers docs)"
    url: "https://sbert.net/examples/cross_encoder/applications/README.html"
    verifiedOn: "2026-10-21"
  - title: "Rerankers (Voyage AI docs)"
    url: "https://docs.voyageai.com/docs/reranker"
    verifiedOn: "2026-10-21"
