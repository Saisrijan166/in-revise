id: rag-vs-plain-llm
tech: ai-engineering
title: RAG vs Plain LLM Call
compares: [plain-llm-call, rag-call]
gist:
  - "Answers from what the model learned in training"
  - "Answers from documents fetched for this request"
explain:
  - "A plain LLM call sends only your prompt and answers from what the model learned in training. It is one call with no setup, but it cannot know your private or post-cutoff data and cannot cite a source."
  - "A RAG call first retrieves relevant documents and puts them in the prompt, so the answer can use your own and recent data and cite the chunks used. It costs a search plus extra input tokens, and does not change the model's weights."
example: "Ask 'What is our refund window for order 42?' A plain call guesses from general training and may be wrong or stale. A RAG call retrieves your current refund policy and the order's record, answers from them, and can cite the policy chunk it used."
sayIt: "A plain LLM call answers from training data only; a RAG call retrieves relevant documents first and answers from them, so it can use private and current data and cite sources. Neither changes the model. I use RAG when the answer depends on my own or recent documents."
rows:
  - { aspect: "Knowledge used", a: "Training data only", b: "Training data plus retrieved chunks" }
  - { aspect: "Freshness", a: "Stops at the knowledge cutoff", b: "As fresh as the last indexed document" }
  - { aspect: "Private data", a: "Not known", b: "Your policies and FAQs, filtered per user" }
  - { aspect: "Sources", a: "Cannot point to a source", b: "Can cite the chunks it used" }
  - { aspect: "Per call", a: "One LLM call", b: "A search plus extra input tokens" }
  - { aspect: "Model weights", a: "Unchanged", b: "Unchanged" }
verdict: "Plain call for general skills such as rewriting or summarising; RAG when the answer depends on your own or recent documents."
sources:
  - title: "Lewis et al. 2020, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (arXiv 2005.11401)"
    url: "https://arxiv.org/abs/2005.11401"
    verifiedOn: "2026-10-21"
  - title: "Optimizing LLM accuracy (OpenAI docs)"
    url: "https://developers.openai.com/api/docs/guides/optimizing-llm-accuracy"
    verifiedOn: "2026-10-21"
