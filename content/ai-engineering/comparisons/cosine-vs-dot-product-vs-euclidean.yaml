id: cosine-vs-dot-product-vs-euclidean
tech: ai-engineering
title: Cosine vs Dot Product vs Euclidean Distance
compares: [cosine-similarity, dot-product, euclidean-distance]
gist:
  - "The angle between vectors"
  - "Angle and length together"
  - "Straight-line gap between points"
rows:
  - { aspect: "Measures", a: "Direction only", b: "Direction and vector length", c: "Distance between the two points" }
  - { aspect: "Closer means", a: "Bigger (1 = same direction)", b: "Bigger", c: "Smaller (0 = identical)" }
  - { aspect: "Unit-length vectors", a: "Same ranking as the others", b: "Equals cosine", c: "Same ranking as cosine" }
  - { aspect: "pgvector 0.8 operator", a: "<=> (cosine distance)", b: "<#> (negative inner product)", c: "<-> (L2 distance)" }
verdict: "Use the metric your embedding model recommends; for unit-length embeddings all three rank results the same."
explain:
  - "Cosine similarity scores two vectors by the angle between them and ignores their length; it is the usual default for embeddings, where meaning lives in direction."
  - "Dot product multiplies the vectors element by element and sums, so it counts both direction and length; it is slightly cheaper and equals cosine for length-1 vectors."
  - "Euclidean (L2) distance is the straight-line gap between the two points; smaller means closer, and it ranks the same as cosine for normalised vectors."
example: "With OpenAI embeddings, which are normalised to length 1, searching the refund policy returns the same five chunks in the same order whether you use cosine distance (pgvector <=>), negative inner product (<#>) or L2 distance (<->)."
sayIt: "Cosine looks at direction, dot product adds length, Euclidean measures straight-line gap. For normalised embeddings all three give the same ranking, so I use the metric the embedding model recommends rather than tuning it."
