id: json-mode-vs-structured-outputs
tech: ai-engineering
title: JSON Mode vs Structured Outputs
compares: [json-mode, schema-constrained-output]
gist:
  - "Valid JSON, any shape"
  - "JSON that follows your schema"
explain:
  - "JSON mode tells the model to return syntactically valid JSON, so a parser will not choke. It does not promise which fields appear or what types they have; the shape is up to the model."
  - "Structured outputs constrain the reply to a JSON Schema you supply, so the required fields and their types are present. The provider enforces the schema while generating, not after."
example: "You need { orderId, status, nextStep } to drive refund code. JSON mode might return valid JSON that omits nextStep or names it next_step, and your code breaks. Structured outputs with that schema guarantee the three fields and their types, so the mapping to a Java record is safe."
rows:
  - { aspect: "Valid JSON", a: "Yes", b: "Yes" }
  - { aspect: "Follows your schema", a: "No", b: "Yes: required fields and types" }
  - { aspect: "How to ask", a: "OpenAI json_object format", b: "OpenAI json_schema (strict); Anthropic output_config.format" }
  - { aspect: "Provider advice", a: "Older; OpenAI prefers json_schema", b: "Recommended where the model supports it" }
  - { aspect: "Still check", a: "Shape, fields, refusals", b: "Refusals, cut-off replies, values" }
verdict: "Use schema-constrained structured outputs; keep JSON mode for models without schema support."
sayIt: "JSON mode guarantees valid JSON but any shape; structured outputs constrain the reply to my JSON Schema, so required fields and types are present. I use structured outputs where supported, keep JSON mode as a fallback, and still handle refusals and cut-off replies."
