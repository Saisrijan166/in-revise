id: response-cache-vs-prompt-cache
tech: ai-engineering
title: Response Cache vs Prompt Caching
compares: [response-cache, prompt-caching]
gist:
  - "Your app stores whole answers and skips the model"
  - "The provider reuses an identical prompt prefix"
explain:
  - "A response cache is run by you, often in Redis. You store the whole final answer under a key, and on a repeat request you return the stored answer without calling the model at all. It saves the full call, but risks serving a stale or personal answer."
  - "Prompt caching is run by the provider. When calls share an identical prompt prefix, the provider reuses the work it did on that prefix, so repeated input is cheaper and faster. The model still runs every call, so the output is always freshly generated."
example: "A support assistant sends the same 2,000-token policy text before each short question. Prompt caching reuses that policy prefix every call, cutting input cost and first-token time while the model still answers. A response cache would instead store the final answer to \"What is the refund window?\" and skip the model for the next person who asks the same thing."
rows:
  - { aspect: "Who runs it", a: "You, for example in Redis", b: "The provider" }
  - { aspect: "What is reused", a: "The full final answer", b: "The work done on the prompt's start" }
  - { aspect: "Model runs on a hit", a: "No", b: "Yes, every call" }
  - { aspect: "Saves", a: "The whole call: cost and time", b: "Input cost and time before the reply starts" }
  - { aspect: "Risk", a: "Wrong, stale or another user's answer", b: "None to the output: it is generated as usual" }
  - { aspect: "Expiry", a: "Yours: TTL and cache-key design", b: "The provider's: Anthropic default 5 minutes" }
verdict: "Use prompt caching whenever calls share a long static prefix; add a response cache only for repeated, non-personal answers, with a TTL."
sayIt: "Prompt caching is the provider reusing an identical prompt prefix, so input is cheaper while the model still generates each reply; it is always safe. A response cache is my app storing whole answers to skip the model, so I use it only for repeated, non-personal answers with careful keys and a TTL."
