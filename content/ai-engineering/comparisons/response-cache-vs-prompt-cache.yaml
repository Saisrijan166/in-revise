id: response-cache-vs-prompt-cache
tech: ai-engineering
title: Response Cache vs Prompt Caching
compares: [response-cache, prompt-caching]
gist:
  - "Your app stores whole answers and skips the model"
  - "The provider reuses an identical prompt prefix"
rows:
  - { aspect: "Who runs it", a: "You, for example in Redis", b: "The provider" }
  - { aspect: "What is reused", a: "The full final answer", b: "The work done on the prompt's start" }
  - { aspect: "Model runs on a hit", a: "No", b: "Yes, every call" }
  - { aspect: "Saves", a: "The whole call: cost and time", b: "Input cost and time before the reply starts" }
  - { aspect: "Risk", a: "Wrong, stale or another user's answer", b: "None to the output: it is generated as usual" }
  - { aspect: "Expiry", a: "Yours: TTL and cache-key design", b: "The provider's: Anthropic default 5 minutes" }
verdict: "Use prompt caching whenever calls share a long static prefix; add a response cache only for repeated, non-personal answers, with a TTL."
sources:
  - title: "Redis semantic cache (Redis docs)"
    url: "https://redis.io/docs/latest/develop/use-cases/semantic-cache/"
    verifiedOn: "2026-10-21"
  - title: "Prompt caching (OpenAI docs)"
    url: "https://developers.openai.com/api/docs/guides/prompt-caching"
    verifiedOn: "2026-10-21"
  - title: "Prompt caching (Claude docs)"
    url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"
    verifiedOn: "2026-10-21"
