id: rag-vs-fine-tuning-vs-long-context
tech: ai-engineering
title: RAG vs Fine-Tuning vs Long Context
compares: [what-is-rag, fine-tuning-route, long-context]
gist:
  - "Fetch the relevant text at request time"
  - "Train the model on examples to change behaviour"
  - "Send the whole document set in every prompt"
explain:
  - "RAG retrieves the few relevant pieces of text at request time and adds them to the prompt. It suits large, private or frequently changing knowledge, can cite its sources, and never changes the model's weights."
  - "Fine-tuning trains the model on examples to change how it behaves, such as format or tone. It suits behaviour you cannot get from a prompt; it does not keep facts fresh, since retraining is needed to update them."
  - "Long context means sending the whole document set in every prompt and letting the model read it. It suits a small, stable set and needs no pipeline, but it costs tokens on every call and recalls the middle less well."
example: "The assistant must answer from 50,000 policy pages that change weekly. RAG fetches the few relevant chunks per question. Fine-tuning would need retraining every week and still could not cite sources. Long context cannot fit 50,000 pages and would be slow and costly even if it did, so RAG wins here."
sayIt: "Knowledge that is large, private or changing goes to RAG. Behaviour you cannot get from a prompt goes to fine-tuning. A small, stable document set can just go in long context. They combine: RAG for knowledge, a fine-tune for format, within the context budget."
rows:
  - { aspect: "Changes", a: "The prompt", b: "The model weights", c: "The prompt" }
  - { aspect: "Best for", a: "Large, private or changing knowledge", b: "Format, tone, a narrow task", c: "Small, stable document sets" }
  - { aspect: "Update facts", a: "Re-index the document", b: "Train again", c: "Edit the text you send" }
  - { aspect: "Sources", a: "Can cite chunks", b: "No built-in sources", c: "Can cite, if asked" }
  - { aspect: "Per-user access", a: "Filter during retrieval", b: "None: one model for all users", c: "Only by choosing what to send" }
  - { aspect: "Effort", a: "Pipeline and vector store", b: "Data set, training, evals", c: "Lowest; tokens per call" }
verdict: "Knowledge that changes: RAG. Behaviour you cannot prompt: fine-tuning. A small, stable set: long context. Combine when needed."
