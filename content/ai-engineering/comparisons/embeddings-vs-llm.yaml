id: embeddings-vs-llm
tech: ai-engineering
title: Embedding Model vs LLM
compares: [embedding-model, what-is-an-llm]
gist:
  - "Text in, a vector of numbers out"
  - "Text in, new text out"
rows:
  - { aspect: "Input", a: "Text (or images) to represent", b: "A prompt with instructions and context" }
  - { aspect: "Output", a: "One fixed-length vector", b: "Generated text or structured data" }
  - { aspect: "Job in RAG", a: "Find similar chunks (retrieval)", b: "Write the answer (generation)" }
  - { aspect: "When it runs", a: "Once per chunk at ingestion, once per question", b: "Once per answer" }
  - { aspect: "Example", a: "OpenAI text-embedding-3-small (2026)", b: "A chat model from any provider" }
verdict: "Use an embedding model to find the right text and an LLM to write the answer; RAG needs both."
explain:
  - "An embedding model takes text (or an image) and returns one fixed-length vector that stands for its meaning; its job in RAG is retrieval, finding similar chunks."
  - "An LLM takes a prompt of instructions and context and returns new text or structured data; its job in RAG is generation, writing the grounded answer."
example: "A support question first goes to the embedding model, which turns it into a vector used to fetch the five nearest policy chunks. Those chunks plus the question then go to the LLM, which writes the reply. Two models, two outputs: numbers, then text."
sayIt: "An embedding model turns text into a vector to find similar chunks; an LLM turns a prompt into an answer. In RAG the embedding model retrieves and the LLM generates, so you need both, not one doing both jobs."
sources:
  - title: "Vector embeddings (OpenAI API docs)"
    url: "https://developers.openai.com/api/docs/guides/embeddings"
    verifiedOn: "2026-10-21"
