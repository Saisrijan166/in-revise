id: training-vs-inference
tech: ai-engineering
title: Training vs Inference
compares: [training, inference]
gist:
  - "Learns the weights from example data"
  - "Uses the fixed weights to predict or generate"
explain:
  - "Training is the loop that learns a model's weights from example data: it predicts, measures how wrong it is (the loss), nudges the weights, and repeats over many passes. It is done once per model version, on heavy hardware."
  - "Inference is running the finished model with its weights frozen to answer one input. It happens on every request. When your app calls an LLM API, it is paying for inference."
example: "A model maker trains an LLM for weeks on GPUs, updating its weights, then freezes it. Your payments assistant then makes an API call per customer question; each call is inference on those frozen weights. The assistant never changes the model, no matter how many questions it answers."
rows:
  - { aspect: "What happens", a: "Predict, measure loss, update weights, repeat", b: "Run one input through the model" }
  - { aspect: "Weights", a: "Change", b: "Frozen" }
  - { aspect: "Compute", a: "Many passes over a large dataset on GPUs or TPUs", b: "One run per request, on every request" }
  - { aspect: "How often", a: "Once per model version", b: "Every call" }
  - { aspect: "For an app developer", a: "Done by the model maker, or by you when fine-tuning", b: "Your app, through an API call" }
verdict: "As an app developer you mostly run inference; you train only when you fine-tune or build your own model."
sayIt: "Training learns the weights from data over many passes, done once per model version on heavy hardware. Inference runs the frozen model to answer one input, on every request. As a backend developer I almost always do inference through an API call, and the model does not learn from that call."
