id: chatbot-vs-workflow-vs-agent
tech: ai-engineering
title: Chatbot vs Workflow vs Agent
compares: [plain-chatbot, llm-workflow, ai-agents]
gist:
  - "One LLM call: message in, reply out"
  - "Your code fixes the steps; LLM calls fill them"
  - "The model picks the next step and tool in a loop"
rows:
  - { aspect: "Who decides the steps", a: "Nobody: one call", b: "Your code", c: "The model, at run time" }
  - { aspect: "Tools", a: "None", b: "At fixed points in the code", c: "Chosen by the model each step" }
  - { aspect: "Loop", a: "No", b: "Only where coded", c: "Yes, until goal met or a limit" }
  - { aspect: "Predictability", a: "High", b: "High", c: "Lower; errors can compound" }
  - { aspect: "Cost and latency", a: "Lowest", b: "Medium", c: "Highest" }
  - { aspect: "Use when", a: "Simple questions", b: "The steps are known", c: "Steps cannot be fixed in advance" }
verdict: "Use the simplest that works: one call, then a workflow; an agent only when the path cannot be fixed in code."
sources:
  - title: "Building effective agents (Anthropic engineering)"
    url: "https://www.anthropic.com/engineering/building-effective-agents"
    verifiedOn: "2026-10-21"
