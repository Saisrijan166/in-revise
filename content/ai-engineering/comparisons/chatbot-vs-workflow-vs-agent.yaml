id: chatbot-vs-workflow-vs-agent
tech: ai-engineering
title: Chatbot vs Workflow vs Agent
compares: [plain-chatbot, llm-workflow, ai-agents]
gist:
  - "One LLM call: message in, reply out"
  - "Your code fixes the steps; LLM calls fill them"
  - "The model picks the next step and tool in a loop"
explain:
  - "A chatbot is a single LLM call: a message goes in and a reply comes out. There are no tools and no steps, so it is cheap and predictable but can only answer from what is in the prompt."
  - "A workflow is a path your code fixes in advance, with LLM calls at set points. Your code decides the order and when to call a tool, so it stays predictable while handling a multi-step task."
  - "An agent lets the model choose the next step and which tool to call, in a loop, until the goal is met or a limit is hit. It handles tasks whose path cannot be fixed in code, at the cost of predictability."
example: "A refund question: one call answers from the prompt (chatbot). A fixed classify-then-fetch-then-draft path your code runs is a workflow. If the model must decide on its own whether to look up the order, check the policy or escalate, each step chosen at run time, that is an agent."
rows:
  - { aspect: "Who decides the steps", a: "Nobody: one call", b: "Your code", c: "The model, at run time" }
  - { aspect: "Tools", a: "None", b: "At fixed points in the code", c: "Chosen by the model each step" }
  - { aspect: "Loop", a: "No", b: "Only where coded", c: "Yes, until goal met or a limit" }
  - { aspect: "Predictability", a: "High", b: "High", c: "Lower; errors can compound" }
  - { aspect: "Cost and latency", a: "Lowest", b: "Medium", c: "Highest" }
  - { aspect: "Use when", a: "Simple questions", b: "The steps are known", c: "Steps cannot be fixed in advance" }
verdict: "Use the simplest that works: one call, then a workflow; an agent only when the path cannot be fixed in code."
sayIt: "A chatbot is one call. A workflow is steps my code fixes with LLM calls inside. An agent lets the model choose steps and tools in a loop. I pick the simplest that works and reach for an agent only when the path cannot be fixed in code."
sources:
  - title: "Building effective agents (Anthropic engineering)"
    url: "https://www.anthropic.com/engineering/building-effective-agents"
    verifiedOn: "2026-10-21"
