id: vector-db-vs-relational-db
tech: ai-engineering
title: Vector Database vs Relational Database
compares: [vector-database, relational-database]
gist:
  - "Finds what is similar in meaning"
  - "Finds exact rows; keeps money correct"
diagrams:
  - |
    flowchart LR
      Q[Question vector] --> I[ANN index]
      I --> C[5 nearest policy chunks]
  - |
    flowchart LR
      S["WHERE order_id = 42"] --> T[(orders, payments)]
      T --> R[Exact rows]
diagramAlt: "Vector database: a question vector goes to an ANN index, which returns the 5 nearest policy chunks. Relational database: a query with WHERE order_id = 42 reads the orders and payments tables and returns the exact rows."
rows:
  - { aspect: "Stores", a: "Embeddings plus the text and metadata", b: "Rows in tables with keys and joins" }
  - { aspect: "Query", a: "Nearest vectors to a query vector", b: "SQL with exact conditions" }
  - { aspect: "Answers", a: "'What is similar?' (approximate)", b: "'What exactly matches?'" }
  - { aspect: "Example data", a: "Refund-policy and FAQ chunks", b: "Order 42, ₹500 UPI refund row" }
  - { aspect: "Transactions", a: "With pgvector: PostgreSQL's all-or-nothing transactions", b: "All-or-nothing transactions" }
verdict: "Keep orders and payments relational; add vectors for meaning, often with pgvector in the same PostgreSQL."
sources:
  - title: "pgvector 0.8 README"
    url: "https://github.com/pgvector/pgvector"
    verifiedOn: "2026-10-21"
  - title: "PostgreSQL 18 docs: 3.4 Transactions"
    url: "https://www.postgresql.org/docs/18/tutorial-transactions.html"
    verifiedOn: "2026-10-21"
  - title: "Vector search concepts (Elastic docs)"
    url: "https://www.elastic.co/docs/solutions/search/vector"
    verifiedOn: "2026-10-21"
