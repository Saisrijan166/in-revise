id: zero-shot-vs-few-shot
tech: ai-engineering
title: Zero-Shot vs Few-Shot
compares: [zero-shot, few-shot]
gist:
  - "Instructions only, no examples"
  - "Instructions plus a few input → output examples"
explain:
  - "Zero-shot means you give the model only the instructions and the input, and let it work out the answer. It is the simplest prompt and what you try first."
  - "Few-shot means you add a few worked examples, each an input with its correct output, before the real input. The model copies their format and labels for this one call."
example: "You classify support messages. Zero-shot: \"Label this message as refund-status, payment-failed or other: {message}\". If the labels drift, go few-shot by adding three examples that each show a message and its label, then the real message. The model now follows the shown pattern."
rows:
  - { aspect: "Examples in the prompt", a: "None", b: "A few (Anthropic suggests 3–5)" }
  - { aspect: "Input tokens", a: "Fewest", b: "More, on every call" }
  - { aspect: "Format consistency", a: "Depends on the instructions", b: "Higher: the model copies the pattern" }
  - { aspect: "Use when", a: "The task is common and easy to describe", b: "The format or labels are unusual" }
  - { aspect: "Model weights", a: "Unchanged", b: "Unchanged (in-context learning)" }
verdict: "Start zero-shot; add a few diverse examples when the format or labels drift."
sayIt: "Zero-shot gives only instructions, few-shot adds a few input-to-output examples the model copies for that call. Neither changes the weights. I start zero-shot and add three to five diverse examples when the format or labels drift."
sources:
  - title: "Language Models are Few-Shot Learners (Brown et al., 2020, arXiv 2005.14165)"
    url: "https://arxiv.org/abs/2005.14165"
    verifiedOn: "2026-10-21"
