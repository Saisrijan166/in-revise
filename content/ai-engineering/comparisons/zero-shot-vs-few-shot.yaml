id: zero-shot-vs-few-shot
tech: ai-engineering
title: Zero-Shot vs Few-Shot
compares: [zero-shot, few-shot]
gist:
  - "Instructions only, no examples"
  - "Instructions plus a few input → output examples"
rows:
  - { aspect: "Examples in the prompt", a: "None", b: "A few (Anthropic suggests 3–5)" }
  - { aspect: "Input tokens", a: "Fewest", b: "More, on every call" }
  - { aspect: "Format consistency", a: "Depends on the instructions", b: "Higher: the model copies the pattern" }
  - { aspect: "Use when", a: "The task is common and easy to describe", b: "The format or labels are unusual" }
  - { aspect: "Model weights", a: "Unchanged", b: "Unchanged (in-context learning)" }
verdict: "Start zero-shot; add a few diverse examples when the format or labels drift."
sources:
  - title: "Language Models are Few-Shot Learners (Brown et al., 2020, arXiv 2005.14165)"
    url: "https://arxiv.org/abs/2005.14165"
    verifiedOn: "2026-10-21"
  - title: "Prompting best practices: use examples effectively (Anthropic docs)"
    url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
    verifiedOn: "2026-10-21"
  - title: "Reasoning best practices: try zero-shot first (OpenAI API docs)"
    url: "https://developers.openai.com/api/docs/guides/reasoning-best-practices"
    verifiedOn: "2026-10-21"
