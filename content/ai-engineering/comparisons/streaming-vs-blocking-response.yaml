id: streaming-vs-blocking-response
tech: ai-engineering
title: Streaming vs Blocking Response
compares: [blocking-response, streaming-response]
gist:
  - "Wait for the whole reply, then send it once"
  - "Send tokens to the browser as they arrive"
explain:
  - "A blocking response waits for the whole reply, then sends it at once. In Spring AI it is .call().content(), returning a String. You can validate the full reply before anyone sees it, but the user sees nothing until generation finishes."
  - "A streaming response sends tokens as the model produces them, over server-sent events. In Spring AI it is .stream().content(), returning a Flux. The first words show within a second, but partial text is already on screen and an error can arrive mid-stream."
example: "A chat UI asks a question whose answer takes six seconds to generate. With blocking, the user stares at a spinner for six seconds, then the whole answer appears. With streaming, the first words appear in under a second and the rest fills in as it is produced; total time is still six seconds, but it feels responsive."
rows:
  - { aspect: "User sees", a: "Nothing until the end", b: "Text appearing word by word" }
  - { aspect: "First text shown", a: "After the whole reply is done", b: "As soon as the first token arrives" }
  - { aspect: "Total generation time", a: "Same", b: "Same" }
  - { aspect: "Spring AI 2.0", a: ".call().content() returns a String", b: ".stream().content() returns a Flux<String>, sent as SSE" }
  - { aspect: "Errors", a: "The HTTP status tells you", b: "Can fail mid-stream, after a 200" }
  - { aspect: "Checking the output", a: "Validate before sending", b: "Harder: partial text is already shown" }
verdict: "Stream replies a person reads in a chat UI; block when code needs the full reply first, such as JSON to parse and validate."
sayIt: "Streaming sends tokens as they arrive, so the first words show in under a second; in Spring AI that is .stream().content() returning a Flux. Blocking waits for the whole reply as a String, which I use when code must validate the full output before anyone sees it."
