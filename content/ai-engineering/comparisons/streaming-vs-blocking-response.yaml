id: streaming-vs-blocking-response
tech: ai-engineering
title: Streaming vs Blocking Response
compares: [blocking-response, streaming-response]
gist:
  - "Wait for the whole reply, then send it once"
  - "Send tokens to the browser as they arrive"
rows:
  - { aspect: "User sees", a: "Nothing until the end", b: "Text appearing word by word" }
  - { aspect: "First text shown", a: "After the whole reply is done", b: "As soon as the first token arrives" }
  - { aspect: "Total generation time", a: "Same", b: "Same" }
  - { aspect: "Spring AI 2.0", a: ".call().content() returns a String", b: ".stream().content() returns a Flux<String>, sent as SSE" }
  - { aspect: "Errors", a: "The HTTP status tells you", b: "Can fail mid-stream, after a 200" }
  - { aspect: "Checking the output", a: "Validate before sending", b: "Harder: partial text is already shown" }
verdict: "Stream replies a person reads in a chat UI; block when code needs the full reply first, such as JSON to parse and validate."
sources:
  - title: "Streaming API responses (OpenAI docs)"
    url: "https://developers.openai.com/api/docs/guides/streaming-responses"
    verifiedOn: "2026-10-21"
  - title: "Errors: mid-stream errors after a 200 (Claude API docs)"
    url: "https://platform.claude.com/docs/en/api/errors"
    verifiedOn: "2026-10-21"
  - title: "Chat Client API: call() and stream() (Spring AI 2.0 reference)"
    url: "https://docs.spring.io/spring-ai/reference/api/chatclient.html"
    verifiedOn: "2026-10-21"
