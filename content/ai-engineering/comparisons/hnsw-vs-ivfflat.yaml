id: hnsw-vs-ivfflat
tech: ai-engineering
title: HNSW vs IVFFlat
compares: [hnsw, ivfflat]
gist:
  - "Layered graph: fast, accurate, heavier"
  - "Clustered lists: light, quick to build"
rows:
  - { aspect: "Structure", a: "Multi-layer graph of neighbours", b: "Vectors split into lists (clusters)" }
  - { aspect: "Build time and memory", a: "Slower build, more memory", b: "Faster build, less memory" }
  - { aspect: "Speed-recall", a: "Better", b: "Lower" }
  - { aspect: "Query knob (pgvector 0.8)", a: "hnsw.ef_search (default 40)", b: "ivfflat.probes (default 1)" }
  - { aspect: "Build on an empty table", a: "Yes: no training step", b: "Possible, but recall suffers: build after loading data" }
verdict: "Start with HNSW; pick IVFFlat when build time or memory matters more than recall."
explain:
  - "HNSW builds a multi-layer graph linking each vector to near neighbours, giving the best speed-for-recall; it costs more memory and a slower build, and needs no training so it can be built on an empty table."
  - "IVFFlat splits the vectors into lists (clusters) and searches only the nearest lists; it builds faster and uses less memory, but recall is lower and it must be built after data is loaded so the clusters are learned from real vectors."
example: "On a policy-chunk table in pgvector, an HNSW index returns the nearest chunks with high recall out of the box; switching to IVFFlat builds faster and uses less memory, but you must load the rows first and raise ivfflat.probes to recover the recall HNSW gave for free."
sayIt: "HNSW is a neighbour graph with the best speed-for-recall but heavier to build; IVFFlat clusters vectors into lists, lighter and faster to build but lower recall and it must be built after loading data. I start with HNSW and move to IVFFlat only if build time or memory hurts."
sources:
  - title: "pgvector 0.8 README: HNSW and IVFFlat"
    url: "https://github.com/pgvector/pgvector"
    verifiedOn: "2026-10-21"
  - title: "Malkov and Yashunin, 2016, HNSW (arXiv 1603.09320)"
    url: "https://arxiv.org/abs/1603.09320"
    verifiedOn: "2026-10-21"
