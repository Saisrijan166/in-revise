id: hnsw-vs-ivfflat
tech: ai-engineering
title: HNSW vs IVFFlat
compares: [hnsw, ivfflat]
gist:
  - "Layered graph: fast, accurate, heavier"
  - "Clustered lists: light, quick to build"
rows:
  - { aspect: "Structure", a: "Multi-layer graph of neighbours", b: "Vectors split into lists (clusters)" }
  - { aspect: "Build time and memory", a: "Slower build, more memory", b: "Faster build, less memory" }
  - { aspect: "Speed-recall", a: "Better", b: "Lower" }
  - { aspect: "Query knob (pgvector 0.8)", a: "hnsw.ef_search (default 40)", b: "ivfflat.probes (default 1)" }
  - { aspect: "Build on an empty table", a: "Yes: no training step", b: "Possible, but recall suffers: build after loading data" }
verdict: "Start with HNSW; pick IVFFlat when build time or memory matters more than recall."
sources:
  - title: "pgvector 0.8 README: HNSW and IVFFlat"
    url: "https://github.com/pgvector/pgvector"
    verifiedOn: "2026-10-21"
  - title: "Malkov and Yashunin, 2016, HNSW (arXiv 1603.09320)"
    url: "https://arxiv.org/abs/1603.09320"
    verifiedOn: "2026-10-21"
