id: tool-calling-vs-mcp
tech: ai-engineering
title: Tool Calling vs MCP
compares: [tool-calling, mcp]
gist:
  - "A model feature: ask for a function call with JSON args"
  - "A protocol: how apps find and call tools on servers"
explain:
  - "Tool calling is a feature of the LLM API. You describe functions to the model; when it needs one, it replies with the function name and JSON arguments, and your own app runs it. It solves 'how does the model ask for a real action'."
  - "MCP is an open protocol over JSON-RPC. The host app runs one client per server, and servers expose tools, resources and prompts so they can be reused. It solves 'how do apps and teams share the same tools', with tool calling still underneath."
example: "Your support app has a getPaymentStatus function. With tool calling you wire it into this one app. With MCP you build it once as an orders server; this app and three others each connect a client to that server and reuse the same tool, without rewiring it four times."
rows:
  - { aspect: "What it is", a: "A feature of the provider's LLM API", b: "An open protocol on JSON-RPC 2.0" }
  - { aspect: "Defined by", a: "Each provider's API format", b: "The MCP specification" }
  - { aspect: "Who runs the tool", a: "Your app's code", b: "An MCP server, called by the host's client" }
  - { aspect: "Reuse", a: "Wired into one app", b: "One server works in any MCP host" }
  - { aspect: "Offers", a: "Functions only", b: "Tools, resources and prompts" }
verdict: "Plain tool calling for a few in-app tools; MCP when tools should be shared across apps or teams. They work together."
sayIt: "Tool calling is the model feature for asking my app to run a function. MCP is an open protocol that lets apps discover and reuse tools on shared servers, with tool calling still underneath. I use plain tool calling for a few in-app tools and MCP when tools should be shared across apps."
