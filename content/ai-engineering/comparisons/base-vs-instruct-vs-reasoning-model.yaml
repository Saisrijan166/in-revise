id: base-vs-instruct-vs-reasoning-model
tech: ai-engineering
title: Base vs Instruction-Tuned vs Reasoning Model
compares: [base-model, instruction-tuned-model, reasoning-model]
gist:
  - "Continues text; does not follow requests"
  - "Follows instructions and chats"
  - "Writes reasoning tokens, then answers"
explain:
  - "A base model is the raw result of pre-training. It only continues text, so given an instruction it may just add more text instead of doing what you asked. Used for research and as the starting point for further training."
  - "An instruction-tuned model is a base model further trained to follow instructions and chat. It is the default model for app features such as answering, extraction and classification."
  - "A reasoning model is an instruction model built to think first: it writes internal reasoning tokens before the visible answer, which helps on hard, multi-step problems but costs more and is slower."
example: "Ask all three 'Write a one-line refund apology for order 42.' The base model might continue with more task instructions; the instruction-tuned model writes the apology directly; the reasoning model also writes the apology but spends extra hidden reasoning tokens first, so it is slower and dearer for no gain on this simple task."
sayIt: "A base model only continues text. An instruction-tuned model is trained to follow instructions and is my default for app features. A reasoning model thinks first with internal tokens, so I reserve it for hard multi-step tasks where evals show it is worth the extra cost and latency."
rows:
  - { aspect: "Trained by", a: "Pre-training only", b: "Plus SFT and preference tuning", c: "An instruction model built to reason first" }
  - { aspect: "How you prompt it", a: "Start the text you want continued", b: "Plain instructions and examples", c: "State the goal; it plans the steps" }
  - { aspect: "Speed and cost", a: "One pass, no extra tokens", b: "One pass, no extra tokens", c: "Slower; reasoning billed as output" }
  - { aspect: "Good for", a: "Research and further fine-tuning", b: "Chat, extraction, most app features", c: "Hard problems, coding, multi-step agent work" }
verdict: "Use an instruction-tuned model by default; switch to a reasoning model only when evals show multi-step tasks need it."
sources:
  - title: "Training language models to follow instructions with human feedback (Ouyang et al., 2022, arXiv 2203.02155)"
    url: "https://arxiv.org/abs/2203.02155"
    verifiedOn: "2026-10-21"
