id: pretraining-vs-fine-tuning
tech: ai-engineering
title: Pre-Training vs Fine-Tuning
compares: [pre-training, fine-tuning]
gist:
  - "Learn language from huge unlabelled text"
  - "Adapt a trained model to one job"
explain:
  - "Pre-training is the first stage: the model predicts the next token over huge unlabelled text and learns language in general. It is done once by model labs at very high cost, and produces a base model."
  - "Fine-tuning takes an already-trained model and adapts it to one job, such as a fixed format, a tone or a narrow task, using a small set of examples. Labs and app teams both do it, and LoRA makes it far cheaper."
example: "To learn English and world patterns, a lab pre-trains a base model on terabytes of text. To make the support assistant always reply in a strict JSON shape, an app team fine-tunes an instruction model on a few hundred example replies in that shape. The first builds general ability; the second shapes behaviour."
sayIt: "Pre-training learns language from huge unlabelled text and makes a base model; it is a lab-scale, one-time cost. Fine-tuning adapts an existing model to one job with a small set of examples. App teams rarely pre-train: we prompt first, add RAG for knowledge, and fine-tune only for behaviour."
rows:
  - { aspect: "Data", a: "Huge general text, no labels", b: "Small set of examples or preference pairs" }
  - { aspect: "Goal", a: "Predict the next token well", b: "Fix format, tone or a narrow task" }
  - { aspect: "Who does it", a: "Model labs, at very high cost", b: "Labs and app teams, far cheaper (LoRA)" }
  - { aspect: "Result", a: "A base model", b: "A tuned copy or an adapter" }
  - { aspect: "How often", a: "Once per model generation", b: "Whenever the task changes" }
verdict: "App teams rarely pre-train; they prompt first, add RAG for knowledge, and fine-tune only for behaviour."
