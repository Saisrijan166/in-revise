id: keyword-vs-semantic-search
tech: ai-engineering
title: Keyword Search vs Semantic Search
compares: [keyword-search, semantic-search]
gist:
  - "Matches the exact words"
  - "Matches the meaning"
rows:
  - { aspect: "Matches", a: "The query words, literally", b: "Nearby embedding vectors" }
  - { aspect: "Good at", a: "Ids, codes, names: ORD-42, ERR_CONNECTION_REFUSED", b: "Paraphrases and synonyms" }
  - { aspect: "Weak at", a: "Synonyms, acronyms, spelling variations", b: "Exact rare tokens" }
  - { aspect: "Index", a: "Inverted index; BM25 ranking", b: "Vector index such as HNSW" }
  - { aspect: "Example query", a: "\"UPI ref 4321 status\"", b: "\"my money is not back yet\"" }
verdict: "Use both and fuse the results (hybrid search) when users type ids as well as plain questions."
sources:
  - title: "Retrieve and Re-Rank: lexical vs semantic search (Sentence Transformers docs)"
    url: "https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html"
    verifiedOn: "2026-10-21"
  - title: "Introducing Contextual Retrieval (Anthropic)"
    url: "https://www.anthropic.com/news/contextual-retrieval"
    verifiedOn: "2026-10-21"
  - title: "Robertson and Zaragoza, 2009, The Probabilistic Relevance Framework: BM25 and Beyond"
    url: "https://www.staff.city.ac.uk/~sbrp622/papers/foundations_bm25_review.pdf"
    verifiedOn: "2026-10-21"
