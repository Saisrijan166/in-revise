topics:
  basics:
    - id: containers-and-vms
      children:
        - id: container-process
          label: "Container: isolated process"
          note: Shares the host kernel; carries the app, libraries and files
        - id: virtual-machine
          label: Virtual machine
          note: Runs a full guest OS with its own kernel on a hypervisor
        - id: windows-containers
          label: Windows containers
          note: Need a Windows host; Docker Desktop runs them on Windows only
        - id: containers-in-vms
          label: Containers inside VMs
          note: "Common in the cloud: one VM runs several containers"
    - id: namespaces-and-cgroups
      children:
        - id: linux-namespace
          label: "Namespaces: what it can see"
          note: Each wraps one kernel resource in a private view
          children:
            - id: pid-namespace
              label: PID namespace
              note: Own process IDs; the first process is PID 1
            - id: network-namespace
              label: Network namespace
              note: Own network devices, IP stack and ports
            - id: mount-namespace
              label: Mount namespace
              note: Own list of mount points, so its own filesystem view
            - id: uts-namespace
              label: UTS namespace
              note: Own hostname
            - id: user-namespace
              label: User namespace
              note: Maps container root to a non-root host user; off by default
        - id: control-groups
          label: "cgroups: how much it can use"
          note: Limit and account CPU, memory, PIDs and I/O per group
          children:
            - id: cgroup-v2
              label: cgroup v2
              note: One unified hierarchy; Docker supports it since 20.10
    - id: docker-architecture
      children:
        - id: docker-cli-client
          label: docker CLI (client)
          note: Sends each command as an API call to a daemon, local or remote
        - id: dockerd-daemon
          label: dockerd (daemon)
          note: Serves the API; manages images, containers, networks, volumes
        - id: containerd
          label: containerd
          note: "Runtime daemon: image transfer and storage, runs containers"
        - id: runc
          label: runc
          note: "Default OCI runtime: spawns the container process on Linux"
        - id: oci-specs
          label: OCI specifications
          note: Open standards that let tools share images and runtimes
          children:
            - id: oci-image-spec
              label: Image spec
              note: Format of the manifest, config and layers; v1.1.1
            - id: oci-runtime-spec
              label: Runtime spec
              note: How to run an unpacked filesystem bundle
            - id: oci-distribution-spec
              label: Distribution spec
              note: HTTP API to push and pull content to and from registries
        - id: podman
          label: Podman
          note: Daemonless engine; alias docker=podman mostly just works
    - id: images-and-layers
      children:
        - id: read-only-image
          label: Image (read-only)
          note: Immutable stack of layers plus config; shared by containers
        - id: base-image
          label: Base image
          note: The image named in FROM; its layers come first
        - id: image-layer
          label: Image layer
          note: Read-only set of changes from one filesystem step
        - id: writable-container-layer
          label: Writable container layer
          note: One per container; deleted with the container
        - id: copy-on-write
          label: Copy-on-write
          note: A file is copied up the first time a layer changes it
        - id: layer-storage
          label: Layer storage on the host
          note: How the engine keeps layers on disk
          children:
            - id: storage-driver
              label: Storage driver (overlay2)
              note: Classic store; hosts upgraded to Engine 29 keep using it
            - id: containerd-snapshotters
              label: containerd snapshotters
              note: Default for fresh installs since Engine 29.0
    - id: registries
      children:
        - id: image-reference
          label: Image reference
          note: "[host[:port]/]namespace/repository[:tag], or @digest"
        - id: image-tag
          label: Image tag
          note: Human-readable pointer to a manifest; can be moved
        - id: image-digest
          label: Image digest
          note: Hash of the content; identifies one exact image
        - id: docker-hub
          label: Docker Hub
          note: Default public registry; Official Images live under library/
        - id: private-registries
          label: Private registries
          note: Your own registry, cloud-managed or self-hosted
          children:
            - id: amazon-ecr
              label: Amazon ECR
              note: AWS managed container registry
            - id: azure-container-registry
              label: Azure Container Registry
              note: Azure managed registry service
            - id: google-artifact-registry
              label: Google Artifact Registry
              note: Google Cloud registry for images and other packages
            - id: harbor-registry
              label: Harbor
              note: Open-source registry you run yourself
  dockerfile:
    - id: dockerfile-instructions
      children:
        - id: copy-instruction
          label: COPY
          note: Copies from the build context, another stage or an image
        - id: add-instruction
          label: ADD
          note: Like COPY, plus URLs, Git repos and local tar extraction
        - id: arg-instruction
          label: ARG
          term: build-argument
          note: Build-time variable, set with --build-arg; not in the container
        - id: env-instruction
          label: ENV
          note: Variable stored in the image; containers see it
        - id: label-instruction
          label: LABEL
          note: Key-value metadata on the image
        - id: syntax-directive
          label: "# syntax=docker/dockerfile:1"
          term: dockerfile-syntax-directive
          note: "First line: BuildKit uses the latest stable Dockerfile syntax"
    - id: run-cmd-entrypoint
      children:
        - id: run-instruction
          label: RUN
          note: Runs a command at build time and saves the result as a layer
        - id: cmd-instruction
          label: CMD
          note: Default command or args; docker run args replace it
        - id: entrypoint-instruction
          label: ENTRYPOINT
          note: The executable the container runs; docker run --entrypoint replaces it
        - id: exec-form-syntax
          term: exec-form
          label: Exec form
          note: JSON array in double quotes; runs the program with no shell
        - id: shell-form-syntax
          term: shell-form
          label: Shell form
          note: Plain string; runs under a shell (/bin/sh -c on Linux)
    - id: build-cache
      children:
        - id: docker-build-context
          term: build-context
          label: Build context
          note: "The files a build can access: the path given to docker build"
        - id: dockerignore-file
          term: dockerignore
          label: .dockerignore
          note: Excludes files and folders from the context, like .gitignore
        - id: build-cache-miss
          term: cache-invalidation
          label: Cache miss
          note: A changed step runs again, and so does every step after it
        - id: maven-cache-mount
          term: cache-mount
          label: RUN --mount=type=cache
          note: Keeps a package cache such as /root/.m2 between builds
        - id: no-cache-flag
          label: --no-cache
          note: Builds every step again without the cache
        - id: pull-flag
          label: --pull
          note: Always tries to pull fresh copies of the base images
    - id: multi-stage-builds
      children:
        - id: named-stage
          label: FROM ... AS build
          term: build-stage
          note: Names a stage; unnamed stages are numbered from 0
        - id: copy-from-stage
          label: COPY --from=build
          note: Copies files from an earlier stage or another image
        - id: target-flag
          label: --target
          note: Stops the build at the named stage
    - id: buildkit-and-multi-platform
      children:
        - id: buildkit-builder
          term: buildkit
          label: BuildKit
          note: The build server; default on Linux since Engine 23.0
        - id: buildx-client
          term: buildx
          label: Buildx
          note: The build client; docker build is its alias since Engine 23.0
        - id: legacy-builder
          label: Legacy builder
          note: Still used for Windows containers; DOCKER_BUILDKIT=0 forces it
        - id: multi-platform-image-index
          term: image-index
          label: Image index (manifest list)
          note: One tag pointing to one image per platform
        - id: platform-flag
          label: --platform linux/amd64,linux/arm64
          note: Target platforms; default is the builder's own platform
        - id: cache-to-from
          label: --cache-to and --cache-from
          note: Export the build cache to a store and import it in a later build
    - id: java-in-containers
      children:
        - id: jvm-container-support
          term: use-container-support
          label: UseContainerSupport
          note: "On by default on Linux: the JVM reads container limits"
          children:
            - id: max-ram-percentage-flag
              term: max-ram-percentage
              label: -XX:MaxRAMPercentage
              note: Max heap as a % of available memory; default 25 (Java 25)
            - id: active-processor-count
              label: -XX:ActiveProcessorCount
              note: Overrides the CPU count used to size GC and pool threads
        - id: spring-boot-layered-jar
          term: layered-jar
          label: Layered jar
          note: "Spring Boot layers: dependencies, loader, snapshots, application"
        - id: spring-boot-buildpacks
          term: cloud-native-buildpacks
          label: Cloud Native Buildpacks
          note: mvn spring-boot:build-image makes an image with no Dockerfile
        - id: jlink-runtime
          term: jlink
          label: jlink
          note: Builds a custom Java runtime with only the modules needed (JDK 9+)
        - id: jvm-aot-cache
          term: aot-cache
          label: AOT cache
          note: "Faster startup: JDK 24 added it; JDK 25 made it one step"
  runtime:
    - id: container-lifecycle
      children:
        - id: container-status-list
          label: Container statuses
          term: container-lifecycle-term
          note: created, running, paused, restarting, exited, removing, dead
        - id: docker-stop-cmd
          label: docker stop
          note: Sends the stop signal (SIGTERM), then SIGKILL after the grace period
        - id: docker-kill-cmd
          label: docker kill
          note: Sends SIGKILL at once, or the signal given with --signal
        - id: auto-remove-rm
          label: --rm
          note: Removes the container and its anonymous volumes when it exits
        - id: restart-policies
          label: Restart policies
          term: restart-policy
          note: Set with --restart; they act only after 10 s of uptime
          children:
            - id: restart-no
              label: "Restart policy: no"
              note: "The default: never restart"
            - id: restart-on-failure
              label: "Restart policy: on-failure"
              note: Restarts on a non-zero exit code; optional max retries
            - id: restart-always
              label: "Restart policy: always"
              note: Restarts on any exit; after a manual stop, only on daemon restart
            - id: restart-unless-stopped
              label: "Restart policy: unless-stopped"
              note: Like always, but a manual stop survives daemon restarts
    - id: docker-cli-essentials
      children:
        - id: docker-run-cmd
          label: docker run
          note: Creates and starts a new container, pulling the image if needed
        - id: docker-start-cmd
          label: docker start
          note: Starts one or more stopped containers
        - id: docker-exec-cmd
          label: docker exec
          note: Runs a new command in a running container
        - id: docker-ps-cmd
          label: docker ps
          note: Lists running containers; -a adds stopped ones
        - id: docker-rm-cmd
          label: docker rm
          note: Removes containers; -f force-removes a running one with SIGKILL
        - id: docker-rmi-cmd
          label: docker rmi
          note: Removes an image, or only the tag if it has several
        - id: docker-system-prune-cmd
          label: docker system prune
          note: Removes unused data; anonymous volumes only with --volumes
        - id: docker-save-load-cmd
          label: docker save / docker load
          note: An image with all its layers and tags to a tar file, and back
    - id: signals-and-graceful-shutdown
      children:
        - id: pid-1-in-container
          label: PID 1 in a container
          term: pid-1
          note: Gets only signals it has a handler for; adopts orphaned processes
        - id: stopsignal-instruction
          label: STOPSIGNAL
          note: Changes the signal docker stop sends first; the default is SIGTERM
        - id: init-flag-tini
          label: --init (tini)
          term: init-process
          note: docker-init, based on tini, runs as PID 1 and reaps zombies
        - id: exec-in-start-script
          label: exec in a start script
          note: exec replaces the shell, so the final program receives signals
        - id: spring-graceful-shutdown
          label: Spring Boot graceful shutdown
          term: graceful-shutdown
          note: On by default; no new requests, waits up to 30 s per phase
        - id: jvm-shutdown-hook
          label: JVM shutdown hook
          term: shutdown-hook
          note: Threads the JVM starts when shutdown begins, as on a signal
    - id: container-health-checks
      children:
        - id: health-starting
          label: "Health: starting"
          note: The first state, until a check passes
        - id: health-healthy
          label: "Health: healthy"
          note: Set whenever a check passes
        - id: health-unhealthy
          label: "Health: unhealthy"
          note: After retries failures in a row (default 3)
        - id: healthcheck-none
          label: HEALTHCHECK NONE
          note: Turns off a check inherited from the base image
        - id: compose-healthcheck-key
          label: "Compose healthcheck:"
          note: Same options and defaults; overrides the image's check
    - id: resource-limits
      children:
        - id: memory-flag
          label: --memory
          term: memory-limit
          note: Hard memory limit; the minimum is 6 MB
        - id: memory-reservation-flag
          label: --memory-reservation
          note: Soft limit below --memory, used when the host runs low
        - id: cpus-flag
          label: --cpus
          term: cpu-quota
          note: "CPU cap as a CFS quota: 1.5 means 150 ms per 100 ms period"
        - id: cpu-shares-flag
          label: --cpu-shares
          term: cpu-shares
          note: Relative weight, default 1024; applies only under contention
        - id: pids-limit-flag
          label: --pids-limit
          term: pids-limit
          note: Caps the number of processes; -1 means unlimited
        - id: oom-kill-event
          label: OOM kill
          term: oom-killer
          note: The kernel kills a process; docker inspect shows OOMKilled true
    - id: container-logging
      children:
        - id: json-file-log-driver
          label: json-file
          term: json-file-driver
          note: "The default driver: JSON lines, no rotation unless configured"
        - id: local-log-driver
          label: local
          note: Compact format; keeps 100 MB per container by default
        - id: journald-syslog-drivers
          label: journald / syslog
          note: Write to the host's journald or syslog daemon
        - id: fluentd-log-driver
          label: fluentd
          note: Forwards log messages to a fluentd daemon
        - id: cloud-log-drivers
          label: awslogs / gcplogs
          note: Send logs to Amazon CloudWatch Logs or Google Cloud Logging
        - id: none-log-driver
          label: none
          note: No logs are kept; docker logs returns nothing
        - id: dual-logging-cache
          label: Dual logging
          term: dual-logging
          note: A local cache so docker logs works with remote drivers
  networking-storage:
    - id: docker-networking
      children:
        - id: default-bridge-network-node
          label: Default bridge
          term: default-bridge-network
          note: Joined when no --network is given; peers reach each other by IP only
        - id: user-defined-bridge
          label: User-defined bridge
          term: user-defined-bridge-network
          note: docker network create payments-net; isolated, with name lookup
          children:
            - id: embedded-dns-server
              label: Embedded DNS (127.0.0.11)
              term: embedded-dns
              note: Resolves container names; forwards other names to the host's DNS
            - id: network-alias-flag
              label: --network-alias
              term: network-alias
              note: An extra DNS name for the container on that network
        - id: host-network-mode
          label: Host network
          term: host-network
          note: Shares the host's network stack, no own IP; -p and -P are ignored
        - id: none-network-mode
          label: None network
          term: none-network
          note: Fully isolated from the host and other containers
        - id: overlay-network-driver
          label: Overlay network
          term: overlay-network
          note: Connects containers across several Docker hosts (Swarm)
        - id: macvlan-ipvlan-drivers
          label: Macvlan and ipvlan
          term: macvlan-network
          note: "Macvlan: container looks like a device on the LAN; ipvlan: VLANs"
    - id: port-mapping
      children:
        - id: expose-metadata
          label: EXPOSE 8080
          term: expose-instruction
          note: Documents the listening port in the image; publishes nothing
        - id: publish-host-port
          label: -p 8080:8080
          term: port-publishing
          note: Host port to container port, on all host interfaces by default
        - id: publish-loopback-only
          label: -p 127.0.0.1:8080:8080
          note: "Binds the host side to loopback: reachable from the host only"
        - id: publish-ephemeral-port
          label: -p 8080 (no host port)
          note: Docker picks an ephemeral host port; docker ps shows it
        - id: publish-all-flag
          label: -P (publish all)
          note: Publishes every EXPOSEd port to random host ports
        - id: docker-port-command
          label: docker port
          note: Lists a container's port mappings
    - id: volumes-and-mounts
      children:
        - id: docker-volume-mount
          label: Volume
          term: docker-volume
          note: Created and managed by Docker; data outlives the container
          children:
            - id: named-volume-node
              label: Named volume
              term: named-volume
              note: -v pgdata:/var/lib/postgresql; kept after docker rm
            - id: anonymous-volume-node
              label: Anonymous volume
              term: anonymous-volume
              note: Random name; removed by --rm or docker rm -v
        - id: bind-mount-node
          label: Bind mount
          term: bind-mount
          note: A host path mounted in; container can write host files by default
        - id: tmpfs-mount-node
          label: tmpfs mount
          term: tmpfs-mount
          note: Host memory only, Linux only; lost when the container stops
        - id: volume-instruction-node
          label: VOLUME in a Dockerfile
          note: Marks a mount point; docker run fills a new volume from the image
        - id: read-only-mount-option
          label: Read-only mount (:ro)
          note: "ro or readonly option: the container cannot write to the mount"
    - id: env-and-secrets
      children:
        - id: env-flag-node
          label: -e KEY=value
          term: environment-variable
          note: Sets one env var, or overrides an ENV from the image
        - id: env-file-flag
          label: --env-file
          term: env-file
          note: Reads env vars from a file of KEY=value lines
        - id: spring-relaxed-binding-node
          label: Spring relaxed binding
          term: relaxed-binding
          note: "Dots to _, drop dashes, upper case: SPRING_DATASOURCE_URL"
        - id: build-secret-mount
          label: RUN --mount=type=secret
          term: build-secret
          note: Secret file for one build step at /run/secrets/<id>; not in the image
        - id: compose-secret-files
          label: Compose secrets
          term: secret-sensitive-config
          note: Mounted as a file at /run/secrets/<name> for granted services only
          children:
            - id: postgres-file-variables
              label: _FILE variables
              note: "POSTGRES_PASSWORD_FILE: postgres reads the password from a file"
            - id: spring-configtree-import
              label: Spring configtree
              note: configtree:/run/secrets/ turns each file into a property
        - id: external-secret-manager
          label: Secret manager (Vault, AWS)
          note: App fetches secrets at run time; AWS Secrets Manager can rotate them
  compose:
    - id: docker-compose
      children:
        - id: compose-yaml-file
          label: compose.yaml
          term: compose-yaml-term
          note: Preferred file name; docker-compose.yaml is still read
        - id: compose-top-level-elements
          label: Top-level elements
          note: The sections of a Compose file that define the app model
          children:
            - id: compose-services-key
              label: services
              note: Each runs one image and its config, one or more times
            - id: compose-networks-key
              label: networks
              note: IP routes between the services attached to them
            - id: compose-volumes-key
              label: volumes
              note: Named volumes for persistent data, shareable by services
            - id: compose-configs-key
              label: configs
              note: Non-sensitive config mounted into containers as files
            - id: compose-secrets-key
              label: secrets
              note: Sensitive data mounted into containers as files
        - id: compose-default-network
          label: Default network <project>_default
          note: Bridge network; each service is found by its service name
        - id: compose-project-name
          label: Project name
          term: compose-project-term
          note: Top-level name, -p, or the folder name; prefixes all resources
        - id: compose-version-field
          label: "version: field (obsolete)"
          note: Only informative; Compose validates with the latest schema
        - id: compose-cli-versions
          label: Compose v1 vs v2 and v5
          note: v1 docker-compose (Python) unsupported; v2 and v5 are docker compose
    - id: compose-startup-order
      children:
        - id: depends-on-short-form
          label: depends_on (short form)
          term: depends-on-term
          note: Start order only; does not wait for readiness
        - id: condition-service-started
          label: "condition: service_started"
          note: "Same as the short form: the dependency has started"
        - id: condition-service-healthy
          label: "condition: service_healthy"
          term: service-healthy-term
          note: Waits until the dependency's healthcheck passes
        - id: condition-service-completed
          label: "condition: service_completed_successfully"
          note: Waits until the dependency has run to completion successfully
        - id: depends-on-restart
          label: "restart: true"
          note: Restarts this service after a Compose command restarts the dependency
        - id: depends-on-required
          label: "required: false"
          note: Only warns if the dependency is not started or available
    - id: compose-in-practice
      children:
        - id: compose-dotenv-file
          label: .env file
          term: dotenv-file-term
          note: Default source of values for ${VAR} interpolation
        - id: compose-env-file-attr
          label: env_file
          term: env-file-attr-term
          note: Loads variables from files into the service's containers
        - id: compose-override-file
          label: compose.override.yaml
          term: override-file-term
          note: Read with compose.yaml by default and merged on top
        - id: compose-profiles-attr
          label: profiles
          term: compose-profile-term
          note: Service starts only when one of its profiles is active
        - id: compose-watch-mode
          label: Compose Watch
          term: compose-watch-term
          note: Actions sync, rebuild or sync+restart when files change
        - id: compose-one-off-commands
          label: up vs start vs run
          note: Three ways to get containers running
          children:
            - id: compose-up-cmd
              label: docker compose up
              note: Builds, creates and starts the services' containers
            - id: compose-start-cmd
              label: docker compose start
              note: Starts existing containers for a service
            - id: compose-run-cmd
              label: docker compose run
              note: One-off container with your command; service ports not published
        - id: compose-scale-flag
          label: --scale
          note: Publish only the container port so Docker picks a free host port
        - id: spring-boot-compose-support
          label: spring-boot-docker-compose
          term: spring-boot-compose-term
          note: Runs docker compose up at app start; creates service connections
  security:
    - id: image-security
      children:
        - id: non-root-user-setting
          label: Non-root USER
          note: Without USER or --user, the container runs as root (UID 0)
        - id: trusted-base-images
          label: Trusted base image
          note: Official or hardened images with only the packages you need
          children:
            - id: docker-hardened-images
              label: Docker Hardened Images
              note: Minimal, non-root by default, free core under Apache 2.0
        - id: image-scanners
          label: Image scanning in CI
          note: Match the image's packages against a CVE database
          children:
            - id: docker-scout-cves-cmd
              label: docker scout cves
              note: --exit-code returns 2 when vulnerabilities are found
            - id: trivy-image-cmd
              label: trivy image
              note: --severity HIGH,CRITICAL with --exit-code 1 fails the job
        - id: base-digest-pinning
          label: Pin the base by digest
          note: Repeatable builds, but you opt out of automatic security fixes
        - id: sbom-attestation
          label: SBOM attestation
          note: --sbom=true lists the software inside the image
        - id: provenance-attestation-node
          label: Provenance attestation
          note: How it was built; mode=min by default, mode=max on request
    - id: container-runtime-security
      children:
        - id: read-only-rootfs
          label: --read-only
          note: Root filesystem read-only; add --tmpfs /tmp for scratch files
        - id: cap-drop-all
          label: --cap-drop ALL
          note: Drops even the default capabilities, such as NET_RAW and CHOWN
        - id: privileged-flag
          label: --privileged
          note: All capabilities and host devices; default AppArmor profile off
        - id: no-new-privileges-opt
          label: no-new-privileges
          note: Stops container processes gaining new privileges
        - id: kernel-security-profiles
          label: Kernel security profiles
          note: On by default; layered on top of capabilities
          children:
            - id: default-seccomp-profile
              label: Default seccomp profile
              note: Blocks about 44 of 300+ system calls
            - id: docker-default-apparmor
              label: "AppArmor: docker-default"
              note: Used for containers on AppArmor hosts unless overridden
        - id: rootless-docker
          label: Rootless mode
          note: Daemon and containers run as a non-root user
          children:
            - id: userns-remap-mode
              label: userns-remap
              note: Container root maps to an unprivileged host UID; daemon stays root
        - id: docker-socket-mount
          label: Mounting docker.sock
          note: Control of the daemon gives root-level access to the host
    - id: image-size-optimization
      children:
        - id: alpine-base
          label: Alpine base
          note: musl libc and busybox; the base is under 6 MB
        - id: debian-slim-base
          label: Debian slim base
          note: Debian minus docs and man pages; slim tags may change
        - id: distroless-base
          label: Distroless base
          note: App and runtime dependencies only; no shell or package manager
          children:
            - id: distroless-debug-tag
              label: Distroless :debug tag
              note: Adds a busybox shell for debugging
            - id: distroless-nonroot-tag
              label: Distroless :nonroot tag
              note: Runs as user nonroot (UID 65532) instead of root
        - id: jre-runtime-image
          label: JRE at run time
          note: Temurin publishes JRE images for every version
        - id: same-run-cleanup
          label: Clean up in the same RUN
          note: Remove /var/lib/apt/lists/* in the install step
        - id: dive-tool
          label: dive
          note: Explores each layer and estimates wasted space
    - id: container-best-practices
      children:
        - id: one-concern-per-container
          label: One concern per container
          note: Web app, database and cache in three containers
        - id: ephemeral-containers
          label: Ephemeral containers
          note: Destroy and replace with minimal set-up and config
        - id: rebuild-images-often
          label: Rebuild images often
          note: Images are snapshots; rebuilds bring in patched dependencies
        - id: twelve-factor-for-containers
          label: Twelve-Factor App
          note: Methodology behind stateless, disposable containers
          children:
            - id: factor-config
              label: III. Config
              note: Config lives in the environment, not in the code
            - id: factor-processes
              label: VI. Processes
              note: Stateless processes; keep data in backing services
            - id: factor-disposability
              label: IX. Disposability
              note: Start fast, shut down gracefully
            - id: factor-logs
              label: XI. Logs
              note: Write logs as an event stream to stdout
  playbook:
    - id: docker-in-ci-cd
      children:
        - id: build-once-promote
          label: Build once, promote
          note: One immutable release; any change makes a new release
        - id: ci-image-tags
          label: CI image tags
          note: Tags generated from the commit and the release version
          children:
            - id: tag-git-sha
              label: "Tag: git SHA"
              note: Ties the image to the commit that built it
            - id: tag-semver
              label: "Tag: semantic version"
              note: docker/metadata-action can turn git tag v1.4.0 into 1.4.0, 1.4, 1
        - id: ci-registry-cache
          label: Registry cache
          note: --cache-to and --cache-from type=registry keep layers between runs
        - id: testcontainers-tests
          label: Testcontainers tests
          note: JUnit tests start real services in throwaway containers
          children:
            - id: service-connection-annotation
              label: "@ServiceConnection"
              note: Spring Boot 4.1 points the app at the test container
        - id: ci-docker-in-docker
          label: Docker-in-Docker (dind)
          note: A Docker daemon inside the CI container; needs --privileged
        - id: ci-socket-mount
          label: Mounting docker.sock
          note: Uses the host daemon; only trusted users should control it
    - id: troubleshooting-containers
      children:
        - id: exit-code-125
          label: Exit code 125
          note: docker run itself failed, such as an unknown flag
        - id: exit-code-126-127
          label: Exit codes 126 and 127
          note: "126: the command cannot be invoked; 127: not found"
        - id: exit-code-137
          label: Exit code 137
          note: "128 + 9: SIGKILL, from the OOM killer, docker kill or a stop timeout"
        - id: exit-code-139
          label: Exit code 139
          note: "128 + 11: SIGSEGV, an invalid memory access (segfault)"
        - id: exit-code-143
          label: Exit code 143
          note: "128 + 15: SIGTERM, usually a normal docker stop"
        - id: exec-format-error-node
          label: exec format error
          note: The binary is for another CPU, such as amd64 on arm64
    - id: docker-and-orchestration
      children:
        - id: docker-engine-one-host
          label: Docker Engine alone
          note: Builds images and runs containers on one host
        - id: compose-one-host
          label: Compose on one host
          note: Production is possible on a single server
        - id: kubernetes-cluster
          label: Kubernetes cluster
          note: Runs Pods on nodes; each node needs a CRI runtime
          children:
            - id: cri-containerd
              label: containerd
              note: A CRI runtime; Kubernetes talks to it over a Unix socket
            - id: cri-o-runtime
              label: CRI-O
              note: A CRI implementation made for Kubernetes
            - id: dockershim-removed
              label: dockershim (removed)
              note: Built-in Docker Engine support, removed in Kubernetes 1.24
        - id: swarm-mode
          label: Docker Swarm mode
          note: Built into Docker Engine; manages a cluster of Docker hosts
    - id: docker-playbook
      children:
        - id: build-time-instructions
          label: Build time
          note: FROM, RUN, COPY, ADD and ARG act during docker build
        - id: run-time-settings
          label: Run time
          note: CMD and ENTRYPOINT give the command a container starts with
        - id: env-both-times
          label: "ENV: both"
          note: Set in the image, kept in containers, changed with docker run --env
