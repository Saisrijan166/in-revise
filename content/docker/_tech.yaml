name: Docker
slug: docker
accent: sky
summary: "Docker for interviews: containers vs VMs, images and layers, Dockerfiles, running and debugging containers, networks, volumes, Compose, security and Spring Boot images."
codeLanguages:
  - java
storySpine:
  - step: The payment service runs on a developer's laptop but fails on the server → package the app and its Java runtime into an image and run it as an isolated container
    cards:
      - containers-and-vms
      - namespaces-and-cgroups
      - docker-architecture
  - step: Every server must run the same image, byte for byte → build it once from shared layers, push it to a registry, and pull it by tag or digest
    cards:
      - images-and-layers
      - registries
  - step: Every code change rebuilds the payment-service image from scratch and ships Maven inside it → write a Dockerfile, order its steps for the layer cache and use a multi-stage build
    cards:
      - dockerfile-instructions
      - run-cmd-entrypoint
      - build-cache
      - multi-stage-builds
  - step: The image built on an ARM laptop will not start on x86 servers, and the JVM uses only a quarter of the container's memory for heap → build multi-platform images with Buildx and size the heap with MaxRAMPercentage
    cards:
      - buildkit-and-multi-platform
      - java-in-containers
  - step: The payment service crashed at night and stayed down, and nobody could see why → know the container states, set a restart policy, and use the everyday commands to inspect it
    cards:
      - container-lifecycle
      - docker-cli-essentials
      - container-logging
  - step: A deploy cut a ₹500 payment off mid-way and one container ate the host's memory → handle SIGTERM in PID 1, add a health check, and cap memory and CPU
    cards:
      - signals-and-graceful-shutdown
      - container-health-checks
      - resource-limits
  - step: The payment service calls localhost:5432 and finds no database, and nobody outside can reach it → put both containers on the user-defined network payments-net, call postgres by name, and publish only port 8080
    cards:
      - docker-networking
      - port-mapping
  - step: Removing the Postgres container wipes the payments, and the DB password sits in the image → keep the data in a named volume, pass config as env vars and secrets as files
    cards:
      - volumes-and-mounts
      - env-and-secrets
  - step: Running the payment service, Postgres and Redis takes three long docker run commands → describe the stack once in compose.yaml and start it with docker compose up
    cards:
      - docker-compose
  - step: The payment service starts before Postgres accepts connections, and each developer needs small local changes → wait with service_healthy, then use .env, override files and profiles
    cards:
      - compose-startup-order
      - compose-in-practice
  - step: The payment-service image is large, runs as root and carries known CVEs → use a small base, a non-root USER, scanning in CI and a locked-down docker run
    cards:
      - image-size-optimization
      - image-security
      - container-runtime-security
  - step: Fixes made inside running containers vanish on every deploy → keep containers stateless and disposable, and replace them from a new image
    cards:
      - container-best-practices
  - step: Each environment rebuilds its own image, so production runs code nobody tested → build once in CI, test with Testcontainers, and promote the same image by digest
    cards:
      - docker-in-ci-cd
  - step: The payment service dies, or one server can no longer keep it alive → read the exit code, logs and inspect in order, then move to an orchestrator such as Kubernetes; answer each question in one fixed order
    cards:
      - troubleshooting-containers
      - docker-and-orchestration
      - docker-playbook
topics:
  - id: basics
    title: Container Basics
    order: 1
    blurb: What a container is, how it differs from a VM, how Docker is built, and how images, layers and registries work.
  - id: dockerfile
    title: Dockerfile and Builds
    order: 2
    blurb: Dockerfile instructions, RUN vs CMD vs ENTRYPOINT, the build cache, multi-stage builds, BuildKit and packaging a Java app.
  - id: runtime
    title: Running Containers
    order: 3
    blurb: The container lifecycle, everyday commands, signals and shutdown, health checks, resource limits and logs.
  - id: networking-storage
    title: Networking and Data
    order: 4
    blurb: Networks and name lookup, publishing ports, volumes and mounts, configuration and secrets.
  - id: compose
    title: Docker Compose
    order: 5
    blurb: "One YAML file for a multi-container app: services, networks, volumes, startup order and a local dev stack."
  - id: security
    title: Security and Image Size
    order: 6
    blurb: Safer and smaller images, locked-down containers, and the habits that keep containers easy to run.
  - id: playbook
    title: Delivery and Playbook
    order: 7
    blurb: Images in CI/CD, troubleshooting, where Docker ends and Kubernetes begins, and how to answer Docker questions.
template: 3
