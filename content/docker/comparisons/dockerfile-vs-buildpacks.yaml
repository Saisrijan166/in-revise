id: dockerfile-vs-buildpacks
tech: docker
title: Dockerfile vs Buildpacks
compares: [dockerfile-instructions, spring-boot-buildpacks]
gist:
  - "You write every step; full control"
  - "mvn spring-boot:build-image; no Dockerfile"
explain:
  - "A Dockerfile is a recipe you write and maintain yourself. You choose the base image, the Java runtime, the user and every step, and docker build runs it."
  - "Cloud Native Buildpacks build the image without a Dockerfile. mvn spring-boot:build-image hands the project to a builder image, which detects a Java app and chooses the runtime, layers and start command."
example: "In the payment-service repo, ./mvnw spring-boot:build-image produces payment-service:1.4.0, named from the artifact id and version, with no Dockerfile at all. If the company requires its own hardened base image or special JVM setup, a Dockerfile gives that control."
rows:
  - { aspect: "Base image and JRE", a: "You choose them", b: "The builder chooses (Paketo by default, Spring Boot 4.1)" }
  - { aspect: "Needs", a: "A Dockerfile and docker build", b: "The Maven or Gradle plugin and a Docker daemon" }
  - { aspect: "Layers", a: "You split them (jarmode tools)", b: "Uses the jar's layers.idx itself" }
  - { aspect: "User", a: "Whatever USER you set", b: "Builds and runs as a non-root user" }
verdict: "Buildpacks for standard Spring Boot services; a Dockerfile when you need full control."
sayIt: "With a Dockerfile I control every step: base image, JRE, user and layers. Buildpacks, through mvn spring-boot:build-image, choose those for me and produce a layered, non-root image with no Dockerfile. Buildpacks for standard services, a Dockerfile when I need full control."
sources:
  - title: "Packaging OCI images (Spring Boot 4.1 Maven plugin)"
    url: "https://docs.spring.io/spring-boot/maven-plugin/build-image.html"
    verifiedOn: "2026-10-21"
  - title: "Cloud Native Buildpacks (Spring Boot 4.1)"
    url: "https://docs.spring.io/spring-boot/reference/packaging/container-images/cloud-native-buildpacks.html"
    verifiedOn: "2026-10-20"
