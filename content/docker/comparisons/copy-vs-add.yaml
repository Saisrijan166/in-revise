id: copy-vs-add
tech: docker
title: COPY vs ADD
compares: [copy-instruction, add-instruction]
gist:
  - "Copies files from the context, a stage or an image"
  - "COPY plus URLs, Git repos and tar auto-extract"
explain:
  - "COPY puts files and folders into the image: from the build context, from an earlier build stage with --from, or from another image. It does nothing else, so its result is easy to predict."
  - "ADD does what COPY does and more. It can download a file from an HTTPS URL or clone a Git repository, and it unpacks a local tar archive into the destination."
example: "COPY target/payment-service-1.4.0.jar app.jar copies the jar as it is. ADD otel-agent.tar.gz /opt/ unpacks the archive into /opt, while COPY would place the .tar.gz file there unchanged. ADD --checksum=sha256:<hash> <https-url> /opt/ downloads a file and fails the build if its content differs."
rows:
  - { aspect: "Copies from", a: "Build context, a build stage or an image", b: "Build context, an HTTPS URL or a Git repository" }
  - { aspect: "Local .tar.gz", a: "Copied as one file", b: "Unpacked into the destination" }
  - { aspect: "Remote archive", a: "Cannot fetch URLs", b: "Downloaded but not unpacked, unless --unpack=true" }
  - { aspect: "Typical use", a: "The app jar, config files, COPY --from in multi-stage builds", b: "A download checked with --checksum, or a Git source" }
verdict: "Use COPY by default; use ADD only when you need its URL, Git or unpack features."
sayIt: "COPY only copies files from the context, a stage or an image, so it is predictable. ADD can also fetch URLs and Git repositories and unpacks local tar files. I use COPY by default and ADD only for a checksum-verified download or an archive I want unpacked."
sources:
  - title: "Dockerfile reference: ADD, ADD --unpack, ADD --checksum and COPY (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-21"
  - title: "Building best practices: ADD or COPY (Docker Docs)"
    url: "https://docs.docker.com/build/building/best-practices/"
    verifiedOn: "2026-10-21"
