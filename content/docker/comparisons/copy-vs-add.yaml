id: copy-vs-add
tech: docker
title: COPY vs ADD
compares: [copy-instruction, add-instruction]
gist:
  - "Copies files from the context, a stage or an image"
  - "COPY plus URLs, Git repos and tar auto-extract"
rows:
  - { aspect: "Copies from", a: "Build context, a build stage, a named context or an image", b: "Build context, an HTTPS URL or a Git repository" }
  - { aspect: "Local .tar.gz", a: "Copied as one file", b: "Extracted into the destination" }
  - { aspect: "Remote archive", a: "Cannot fetch URLs", b: "Downloaded but not extracted, unless --unpack" }
  - { aspect: "Typical use", a: "The app jar, config, COPY --from in multi-stage", b: "A checked download (--checksum) or a Git source" }
verdict: "Use COPY by default; use ADD only when you need its URL, Git or extract features."
sources:
  - title: "Dockerfile reference: ADD and COPY (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-20"
  - title: "Building best practices: ADD or COPY (Docker Docs)"
    url: "https://docs.docker.com/build/building/best-practices/"
    verifiedOn: "2026-10-20"
