id: volume-vs-bind-mount-vs-tmpfs
tech: docker
title: "Volume vs Bind Mount vs tmpfs"
compares: [docker-volume-mount, bind-mount-node, tmpfs-mount-node]
gist:
  - "Storage Docker manages; outlives containers"
  - "A host file or folder, mounted as it is"
  - "Host memory only; gone when the container stops"
explain:
  - "A volume is storage that Docker creates and manages in its own area on the host. It keeps data such as a database's files after the container is removed."
  - "A bind mount puts an existing host file or folder inside the container. Both sides see the same files at once, which suits code and config you edit on the host."
  - "A tmpfs mount is a folder kept in the host's memory, on Linux only. It suits scratch files that should never be written to the container's disk."
example: "The payment stack mounts the volume pgdata at /var/lib/postgresql for the database, bind-mounts ./config/application.yaml read-only into the app in development, and gives the app a tmpfs at /tmp for scratch files."
rows:
  - { aspect: "Data lives in", a: "Docker's storage area on the host", b: "The host path you name", c: "Host memory; it may be swapped to disk" }
  - { aspect: "Survives docker rm", a: "Yes", b: "Yes: the files belong to the host", c: "No, it is gone when the container stops" }
  - { aspect: "Managed with", a: "docker volume create, ls, rm and prune", b: "Host tools; the container can change host files", c: "--tmpfs or --mount type=tmpfs" }
  - { aspect: "Shared between containers", a: "Yes", b: "Yes", c: "No" }
  - { aspect: "Best for", a: "Database and app data", b: "Source code and config in development", c: "Scratch files and short-lived secrets" }
  - { aspect: "Portability", a: "Independent of the host's folders", b: "Tied to the host's folder layout", c: "Linux hosts only" }
verdict: "Use a named volume for data, a bind mount to share host files in development, and tmpfs for scratch data."
sayIt: "A volume is Docker-managed storage that outlives containers, so databases go there. A bind mount maps a host path in, which I use for code and config in development. tmpfs lives in memory and disappears when the container stops."
