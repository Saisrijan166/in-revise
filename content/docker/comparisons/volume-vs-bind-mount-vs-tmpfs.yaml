id: volume-vs-bind-mount-vs-tmpfs
tech: docker
title: "Volume vs Bind Mount vs tmpfs"
compares: [docker-volume-mount, bind-mount-node, tmpfs-mount-node]
gist:
  - "Docker-managed storage that outlives containers"
  - "A host file or folder mounted as it is"
  - "Host memory only; gone when the container stops"
rows:
  - { aspect: "Data lives in", a: "Docker's storage area on the host", b: "The host path you name", c: "Host memory, never on disk" }
  - { aspect: "Survives docker rm", a: "Yes", b: "Yes: the files are the host's", c: "No" }
  - { aspect: "Managed with", a: "docker volume create, ls, rm, prune", b: "Host tools; the container can change host files", c: "--tmpfs or --mount type=tmpfs; counts toward the memory limit" }
  - { aspect: "Best for", a: "Database and app data", b: "Source code and config in development", c: "Temp files and secrets that must not touch disk" }
  - { aspect: "Portability", a: "Independent of the host's folders", b: "Tied to the host's folder layout", c: "Linux only" }
verdict: "Use a named volume for data, a bind mount to share host files in development, and tmpfs for scratch data."
sources:
  - title: "Storage overview (Docker Engine docs)"
    url: "https://docs.docker.com/engine/storage/"
    verifiedOn: "2026-10-20"
  - title: "Volumes (Docker Engine docs)"
    url: "https://docs.docker.com/engine/storage/volumes/"
    verifiedOn: "2026-10-20"
  - title: "Bind mounts (Docker Engine docs)"
    url: "https://docs.docker.com/engine/storage/bind-mounts/"
    verifiedOn: "2026-10-20"
  - title: "tmpfs mounts (Docker Engine docs)"
    url: "https://docs.docker.com/engine/storage/tmpfs/"
    verifiedOn: "2026-10-20"
