id: tag-vs-digest
tech: docker
title: Image Tag vs Image Digest
compares: [image-tag, image-digest]
gist:
  - "A movable, human-readable label"
  - "A fixed hash of the exact content"
explain:
  - "A tag is a human-readable name for one image in a repository, such as 1.4.0 or latest. It makes versions easy to talk about, but whoever pushes with the same tag can point it at new content."
  - "A digest is the sha256 hash of an image's manifest, written as @sha256:… after the name. It is computed from the content, so it identifies exactly one image and can never be pointed elsewhere."
example: "QA tests payment-service:1.4.0. Before the release, someone pushes a rebuilt 1.4.0. A deploy by tag now ships the untested image; a deploy by payment-service@sha256:b708… ships exactly the tested bytes."
rows:
  - { aspect: "What it is", a: "A name you choose, such as 1.4.0", b: "A sha256 hash of the image manifest" }
  - { aspect: "Can change", a: "Yes: a new push can move it", b: "No: new content gets a new digest" }
  - { aspect: "Written as", a: "payment-service:1.4.0", b: "payment-service@sha256:…" }
  - { aspect: "Per image", a: "Zero, one or many tags", b: "Exactly one" }
  - { aspect: "Best for", a: "People, releases, local work", b: "Repeatable deploys and pinned base images" }
verdict: "Tag for people and releases; deploy and pin by digest when you must get the same bytes every time."
sayIt: "A tag is a movable, readable label such as 1.4.0; a new push can point it at different content. A digest is the sha256 hash of the image manifest, so it always means the same bytes. I tag for people and deploy or pin by digest."
sources:
  - title: "OCI Distribution Specification v1.1.1: definitions"
    url: "https://github.com/opencontainers/distribution-spec/blob/v1.1.1/spec.md"
    verifiedOn: "2026-10-20"
  - title: "docker image pull: pull by digest (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/image/pull/"
    verifiedOn: "2026-10-20"
