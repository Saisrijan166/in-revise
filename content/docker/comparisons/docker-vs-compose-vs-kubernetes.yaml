id: docker-vs-compose-vs-kubernetes
tech: docker
title: Docker vs Docker Compose vs Kubernetes
compares: [docker-engine-one-host, compose-one-host, kubernetes-cluster]
gist:
  - "Build images and run containers on one host"
  - "Many containers as one app, on one host"
  - "Run containers across a cluster of machines"
explain:
  - "Docker Engine builds images and runs containers on one machine. You start each container yourself with docker run and its flags."
  - "Docker Compose runs several containers as one app on one Docker host. One compose.yaml lists the services, their network and volumes."
  - "Kubernetes runs containers across a cluster of machines. You declare the state you want, and its controllers keep it true: they place, restart and scale containers."
example: "The payment service with Postgres and Redis: on a laptop, docker compose up starts all three. In production on a three-node Kubernetes cluster, a Deployment keeps three payment-service Pods running; if one node dies, its Pods are recreated on the other two. With Compose on one server, that server dying takes the app down."
rows:
  - { aspect: "You describe", a: "Dockerfile and docker run flags", b: "compose.yaml: services, networks, volumes", c: "YAML objects sent to the Kubernetes API" }
  - { aspect: "Unit you manage", a: "Image and container", b: "Service", c: "Pod, run by workloads such as a Deployment" }
  - { aspect: "Scaling", a: "Start more containers by hand", b: "docker compose up --scale, one host", c: "Replicas and autoscaling across nodes" }
  - { aspect: "A container crashes", a: "Restart policy, same host (default: no)", b: "Restart policy per service (default: no)", c: "Controllers replace it, on another node if needed" }
  - { aspect: "Machine dies", a: "App is down", b: "App is down", c: "Controllers recreate Pods on healthy nodes" }
verdict: "Docker to build and run one container, Compose for a local or single-server stack, Kubernetes when you need many machines, self-healing and rolling updates."
sayIt: "Docker builds images and runs containers on one host. Compose describes a multi-container app on one host, mostly for development and tests. Kubernetes runs containers across a cluster and keeps the desired state: it replaces failed Pods, scales and rolls out updates."
