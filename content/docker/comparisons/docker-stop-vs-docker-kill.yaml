id: docker-stop-vs-docker-kill
tech: docker
title: "docker stop vs docker kill"
compares: [docker-stop-cmd, docker-kill-cmd]
gist:
  - "Ask the app to stop, then force it after a wait"
  - "Force it now, or send one chosen signal"
rows:
  - { aspect: "First signal", a: "SIGTERM, or the image's STOPSIGNAL", b: "SIGKILL, or the one set with --signal" }
  - { aspect: "Waits", a: "The grace period (10 s on Linux), then SIGKILL", b: "No wait" }
  - { aspect: "App can clean up", a: "Yes, if PID 1 handles the signal", b: "No: SIGKILL cannot be caught" }
  - { aspect: "Tune with", a: "-t / --timeout, or --stop-timeout at create", b: "-s / --signal (for example SIGHUP to reload)" }
verdict: "Use docker stop for every normal shutdown; use docker kill only for a hung container or to send a specific signal."
sources:
  - title: "docker container stop (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/stop/"
    verifiedOn: "2026-10-20"
  - title: "docker container kill (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/kill/"
    verifiedOn: "2026-10-20"
  - title: "signal(7) (Linux manual page)"
    url: "https://man7.org/linux/man-pages/man7/signal.7.html"
    verifiedOn: "2026-10-20"
