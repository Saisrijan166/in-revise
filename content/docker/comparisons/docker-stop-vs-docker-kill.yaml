id: docker-stop-vs-docker-kill
tech: docker
title: "docker stop vs docker kill"
compares: [docker-stop-cmd, docker-kill-cmd]
gist:
  - "Ask the app to stop, then force it after a wait"
  - "Force it now, or send one chosen signal"
explain:
  - "docker stop asks the container's main process to end by sending SIGTERM, waits a grace period so the app can finish its work, and sends SIGKILL only if it is still running."
  - "docker kill sends SIGKILL at once, which ends the process with no chance to clean up. With --signal it can instead send any one signal you choose."
example: "Before a deploy you run docker stop pay: the payment service gets SIGTERM, finishes the payment in progress and exits with code 143. If the JVM hangs and ignores SIGTERM, docker kill pay ends it at once with code 137, and any work in progress is lost."
rows:
  - { aspect: "First signal", a: "SIGTERM, or the image's STOPSIGNAL", b: "SIGKILL, or the one set with --signal" }
  - { aspect: "Waits", a: "The grace period, 10 s on Linux, then sends SIGKILL", b: "No wait" }
  - { aspect: "App can clean up", a: "Yes, if PID 1 handles the signal", b: "No: SIGKILL cannot be caught" }
  - { aspect: "Tune with", a: "-t or --timeout, or --stop-timeout when creating", b: "-s or --signal, for example SIGHUP to reload" }
verdict: "Use docker stop for every normal shutdown; use docker kill only for a hung container or to send a specific signal."
sayIt: "docker stop sends SIGTERM, waits 10 seconds by default so the app can shut down cleanly, then sends SIGKILL. docker kill sends SIGKILL straight away, so nothing is cleaned up. I use stop normally and kill only for a hung container or to send a chosen signal."
sources:
