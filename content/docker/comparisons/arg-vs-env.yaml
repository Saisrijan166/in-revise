id: arg-vs-env
tech: docker
title: ARG vs ENV
compares: [arg-instruction, env-instruction]
gist:
  - "Build-time variable; gone in the running container"
  - "Stored in the image; every container sees it"
explain:
  - "ARG declares a variable that exists only while the image is built. You set it with docker build --build-arg, and later build steps can read it, for example to pick a Java version."
  - "ENV sets an environment variable that is saved in the image. Later build steps and every container started from the image see it, and docker run --env can override it."
example: "ARG JRE_TAG=25-jre before FROM eclipse-temurin:${JRE_TAG} lets CI build a Java 21 variant with --build-arg JRE_TAG=21-jre, and the container never sees JRE_TAG. ENV SPRING_PROFILES_ACTIVE=prod is read by the payment service at start; docker run -e SPRING_PROFILES_ACTIVE=test overrides it."
rows:
  - { aspect: "Set with", a: "docker build --build-arg NAME=value", b: "ENV in the Dockerfile; docker run --env overrides it" }
  - { aspect: "Visible in", a: "Later steps of its stage and stages built FROM it", b: "The same, plus every container from the image" }
  - { aspect: "Before FROM", a: "Allowed; only FROM lines can use it", b: "Not allowed" }
  - { aspect: "Safe for secrets", a: "No: docker history shows the value", b: "No: docker inspect shows the value" }
verdict: "ARG for build choices such as a version; ENV for settings the app reads; neither for secrets."
sayIt: "ARG is a build-time variable set with --build-arg; it is gone when the container runs. ENV is stored in the image, so the app sees it at run time and docker run -e can override it. Neither is safe for secrets: history and inspect show both."
sources:
  - title: "Dockerfile reference: ARG, ENV and FROM (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-21"
