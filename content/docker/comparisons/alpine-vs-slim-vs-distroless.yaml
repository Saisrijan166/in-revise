id: alpine-vs-slim-vs-distroless
tech: docker
title: Alpine vs Slim vs Distroless
compares: [alpine-base, debian-slim-base, distroless-base]
gist:
  - "Tiny full distro on musl libc, with a shell and apk"
  - "Debian on glibc, minus docs, man pages and locales"
  - "App runtime only: no shell, no package manager"
explain:
  - "Alpine is a complete but tiny Linux distribution. It uses the musl C library and busybox tools, has a shell and the apk package manager, and suits apps built for musl."
  - "A Debian slim image is normal Debian with docs, man pages and similar extras removed. It keeps glibc, bash and apt, so most software works unchanged."
  - "A distroless image holds only the app's runtime, such as a JRE, and its libraries. It has no shell and no package manager, so there is less to attack and less to patch."
example: "The payment service needs only Java 25. On distroless, gcr.io/distroless/java25-debian13:nonroot runs the jar as a non-root user, but docker exec sh fails. On eclipse-temurin:25-jre-alpine you can open a shell, but a native library built for glibc may not load. On a slim base you install the JRE yourself with apt."
rows:
  - { aspect: "C library", a: "musl", b: "glibc", c: "glibc" }
  - { aspect: "Shell and package manager", a: "busybox sh and apk", b: "bash and apt", c: "None" }
  - { aspect: "docker exec sh", a: "Works", b: "Works", c: "Fails; use a :debug tag" }
  - { aspect: "Java 25 image", a: "eclipse-temurin:25-jre-alpine", b: "Install a JRE yourself", c: "gcr.io/distroless/java25-debian13" }
  - { aspect: "Watch out", a: "glibc-built native code may break", b: "Slim tags may change", c: "Debugging is harder" }
verdict: "All three are small. Pick distroless when you no longer need a shell, slim when you want apt and glibc, Alpine only with a musl-built JDK."
sayIt: "All three are small. I prefer distroless for production Java because it has no shell or package manager and its :nonroot tag runs as non-root; slim when I need apt and glibc; Alpine only with a JDK built for musl, such as the Temurin alpine tags."
