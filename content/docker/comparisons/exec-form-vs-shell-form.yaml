id: exec-form-vs-shell-form
tech: docker
title: Exec Form vs Shell Form
compares: [exec-form-syntax, shell-form-syntax]
gist:
  - "JSON array: [\"java\", \"-jar\", \"app.jar\"]"
  - "Plain string: java -jar app.jar"
explain:
  - "Exec form writes the command as a JSON array of words. Docker starts that program directly, with no shell in between, so the program is the container's first process and receives its signals."
  - "Shell form writes the command as a plain string. Docker hands it to a shell, /bin/sh -c on Linux, so you get shell features such as $VARIABLES, pipes and &&."
example: "ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"] makes java the first process: docker stop sends it SIGTERM and the app can shut down cleanly. ENTRYPOINT java -jar app.jar makes /bin/sh the first process; it does not pass SIGTERM on, so after 10 seconds Docker kills java. For RUN, shell form is fine: RUN apt-get update && apt-get install -y curl."
rows:
  - { aspect: "Runs through", a: "The program itself, no shell", b: "A shell: /bin/sh -c on Linux" }
  - { aspect: "$VAR expansion", a: "No, because no shell runs", b: "Yes, done by the shell" }
  - { aspect: "As ENTRYPOINT, first process", a: "java, which gets SIGTERM from docker stop", b: "The shell, which does not pass SIGTERM to java" }
  - { aspect: "As ENTRYPOINT, CMD and run arguments", a: "Appended as arguments", b: "Ignored" }
  - { aspect: "Quotes", a: "Double quotes only (JSON)", b: "Normal shell quoting" }
verdict: "Use exec form for ENTRYPOINT and CMD; shell form is fine for RUN steps."
sayIt: "Exec form is a JSON array that Docker runs directly, so java is PID 1 and gets SIGTERM, and CMD is appended as arguments. Shell form runs through /bin/sh -c: you get variables and pipes, but the shell is PID 1 and swallows the signal. Exec form for ENTRYPOINT and CMD."
sources:
  - title: "Dockerfile reference: shell and exec form, ENTRYPOINT (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-21"
  - title: "docker container stop: default signal and timeout (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/stop/"
    verifiedOn: "2026-10-21"
