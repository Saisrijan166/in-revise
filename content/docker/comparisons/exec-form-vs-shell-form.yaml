id: exec-form-vs-shell-form
tech: docker
title: Exec Form vs Shell Form
compares: [exec-form-syntax, shell-form-syntax]
gist:
  - "JSON array: [\"java\", \"-jar\", \"app.jar\"]"
  - "Plain string: java -jar app.jar"
rows:
  - { aspect: "Runs through", a: "The program itself, no shell", b: "A shell: /bin/sh -c on Linux" }
  - { aspect: "$VAR expansion", a: "No (no shell to do it)", b: "Yes, by the shell" }
  - { aspect: "As ENTRYPOINT", a: "java is PID 1 and gets SIGTERM from docker stop", b: "The shell is PID 1; java gets no SIGTERM" }
  - { aspect: "As ENTRYPOINT, CMD and run args", a: "Appended as arguments", b: "Ignored" }
  - { aspect: "Quotes", a: "Double quotes only (JSON)", b: "Normal shell quoting" }
verdict: "Use exec form for ENTRYPOINT and CMD; shell form is fine for RUN steps."
sources:
  - title: "Dockerfile reference: shell and exec form, ENTRYPOINT (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-20"
