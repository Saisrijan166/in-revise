id: dockerfile-vs-compose-file
tech: docker
title: Dockerfile vs compose.yaml
compares: [dockerfile-instructions, compose-yaml-file]
gist:
  - "Recipe to build one image"
  - "Plan to run several containers together"
explain:
  - "A Dockerfile is the recipe for one image: the steps that turn a base image and your jar into something runnable. docker build reads it."
  - "A compose.yaml describes how to run several containers together: their images or builds, ports, environment, networks and volumes. docker compose up reads it."
example: "The payment service has one Dockerfile. Its compose.yaml lists three services: payment-service with build: ., which builds from that Dockerfile, plus postgres and redis, which use ready-made images. One docker compose up builds the image and starts all three."
rows:
  - { aspect: "Describes", a: "The steps that assemble one image", b: "Services, networks, volumes, configs, secrets" }
  - { aspect: "Used by", a: "docker build", b: "docker compose up" }
  - { aspect: "Result", a: "An image", b: "Running containers on a project network" }
  - { aspect: "Format", a: "Instructions: FROM, RUN, COPY, CMD", b: "YAML" }
  - { aspect: "How they meet", a: "Sits at the root of the build context by default", b: "build: . builds from the Dockerfile in that folder" }
verdict: "Write a Dockerfile for each image you build; add compose.yaml when the app needs several containers running together."
sayIt: "A Dockerfile says how to build one image, and docker build runs it. A compose.yaml says how to run several containers together, with their ports, networks, volumes and environment; docker compose up runs it, and its build key can point at a Dockerfile."
sources:
  - title: "Dockerfile reference (Docker docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-20"
  - title: "How Compose works (Docker docs)"
    url: "https://docs.docker.com/compose/intro/compose-application-model/"
    verifiedOn: "2026-10-20"
  - title: "Compose Build Specification (Compose file reference)"
    url: "https://docs.docker.com/reference/compose-file/build/"
    verifiedOn: "2026-10-21"
