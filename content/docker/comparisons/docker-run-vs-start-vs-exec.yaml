id: docker-run-vs-start-vs-exec
tech: docker
title: "docker run vs docker start vs docker exec"
compares: [docker-run-cmd, docker-start-cmd, docker-exec-cmd]
gist:
  - "Image in, a brand-new container out"
  - "Bring back a stopped container as it was"
  - "Add one more process to a running container"
explain:
  - "docker run takes an image, creates a new container from it and starts its main process. It is how you start a version of an app for the first time."
  - "docker start takes an existing container that has stopped and runs its main process again. Its files, settings and logs from before are kept."
  - "docker exec runs one extra command, such as a shell, inside a container that is already running. It is how you look inside without restarting anything."
example: "You deploy the payment service with docker run -d --name pay payment-service:1.4.0. After docker stop pay, docker start pay brings the same container back. To check its settings you run docker exec -it pay sh. Typing the docker run command again fails, because the name pay is already taken."
rows:
  - { aspect: "Works on", a: "An image, pulled if missing", b: "An existing stopped container", c: "A running container" }
  - { aspect: "New container?", a: "Yes, every time", b: "No", c: "No" }
  - { aspect: "What runs", a: "The image's ENTRYPOINT and CMD, or your command, as PID 1", b: "The same main process as before", c: "Your command, next to PID 1" }
  - { aspect: "Writable layer", a: "A fresh one", b: "Kept from the last run", c: "Shared with the main process" }
  - { aspect: "Typical use", a: "Deploy a version, first start", b: "Resume after a stop", c: "Debug: a shell, check env or files" }
verdict: "Use run to create, start to resume, and exec to look inside; a second run gives a second container, not a restart."
sayIt: "docker run creates a new container from an image and starts it. docker start runs an existing stopped container again with its old files. docker exec runs an extra command, like a shell, inside a running container. Running docker run twice gives two containers."
sources:
