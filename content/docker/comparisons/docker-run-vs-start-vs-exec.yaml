id: docker-run-vs-start-vs-exec
tech: docker
title: "docker run vs docker start vs docker exec"
compares: [docker-run-cmd, docker-start-cmd, docker-exec-cmd]
gist:
  - "Image in, a brand-new container out"
  - "Bring back a stopped container as it was"
  - "Add one more process to a running container"
rows:
  - { aspect: "Works on", a: "An image (pulled if missing)", b: "An existing stopped container", c: "A running container" }
  - { aspect: "New container?", a: "Yes, every time", b: "No", c: "No" }
  - { aspect: "What runs", a: "The image's ENTRYPOINT/CMD, or your command, as PID 1", b: "The same main process as before", c: "Your command, next to PID 1" }
  - { aspect: "Writable layer", a: "A fresh one", b: "Kept from the last run", c: "Shared with the main process" }
  - { aspect: "Typical use", a: "Deploy a version, first start", b: "Resume after a stop", c: "Debug: a shell, check env or files" }
verdict: "Use run to create, start to resume, and exec to look inside; a second run gives a second container, not a restart."
sources:
  - title: "docker container run (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/run/"
    verifiedOn: "2026-10-20"
  - title: "docker container start (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/start/"
    verifiedOn: "2026-10-20"
  - title: "docker container exec (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/exec/"
    verifiedOn: "2026-10-20"
