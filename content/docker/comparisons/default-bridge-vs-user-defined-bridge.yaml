id: default-bridge-vs-user-defined-bridge
tech: docker
title: "Default Bridge vs User-Defined Bridge"
compares: [default-bridge-network-node, user-defined-bridge]
gist:
  - "Docker's built-in network: containers find each other by IP only"
  - "A network you create: containers find each other by name"
explain:
  - "The default bridge is the network named bridge that Docker creates at start. Every container started without --network joins it, so a single container gets network access with no setup."
  - "A user-defined bridge is a network you create with docker network create, or that Compose creates for a project. Containers you attach to it find each other by name through Docker's DNS server."
example: "Start postgres and payment-service with plain docker run, and the app cannot resolve postgres: both are on the default bridge. Create payments-net and start both with --network payments-net, and jdbc:postgresql://postgres:5432/payments works."
diagrams:
  - |
    flowchart LR
      A[payment-service] -- "postgres? no answer" --x P[(postgres)]
      A -- "172.17.0.3 works" --> P
  - |
    flowchart LR
      A2[payment-service] -- "postgres:5432" --> D[DNS 127.0.0.11]
      D -- "current IP" --> P2[(postgres)]
diagramAlt: "Default bridge: the app cannot reach postgres by name, only by its IP address. User-defined bridge: the app asks Docker's DNS server at 127.0.0.11 for postgres and gets its current IP address."
rows:
  - { aspect: "Created by", a: "Docker itself, when the daemon starts", b: "You, with docker network create, or Compose" }
  - { aspect: "Find others by name", a: "No, only by IP address (or the legacy --link)", b: "Yes, through the DNS server at 127.0.0.11" }
  - { aspect: "Who shares it", a: "Every container started without --network", b: "Only the containers you attach" }
  - { aspect: "Join or leave while running", a: "No, you must recreate the container", b: "Yes, docker network connect or disconnect" }
  - { aspect: "Settings", a: "One set for all; changing them needs a Docker restart", b: "Chosen per network when you create it" }
verdict: "Use a user-defined bridge for any app with more than one container; Docker calls the default bridge a legacy detail, not for production."
sayIt: "The default bridge is where containers land without --network; they reach each other only by IP. A user-defined bridge, which Compose creates for you, adds name lookup through Docker's DNS and isolates the app's containers, so I always create one."
sources:
  - title: "Bridge network driver (Docker Engine docs)"
    url: "https://docs.docker.com/engine/network/drivers/bridge/"
    verifiedOn: "2026-10-21"
  - title: "Networking overview: DNS services (Docker Engine docs)"
    url: "https://docs.docker.com/engine/network/"
    verifiedOn: "2026-10-21"
