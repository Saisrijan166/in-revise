id: default-bridge-vs-user-defined-bridge
tech: docker
title: "Default Bridge vs User-Defined Bridge"
compares: [default-bridge-network-node, user-defined-bridge]
gist:
  - "Legacy default: containers find each other by IP only"
  - "Your own network: containers find each other by name"
rows:
  - { aspect: "Created by", a: "Docker on first start (network bridge)", b: "docker network create, or Compose" }
  - { aspect: "Name lookup", a: "No (only the legacy --link)", b: "Yes, embedded DNS at 127.0.0.11" }
  - { aspect: "Who shares it", a: "Every container started without --network", b: "Only containers you attach" }
  - { aspect: "Attach a running container", a: "No: re-create it", b: "Yes: docker network connect" }
  - { aspect: "Settings", a: "One config for all; daemon restart to change", b: "Set per network at create time" }
verdict: "Use a user-defined bridge for any app with more than one container; Docker calls the default bridge legacy, not for production."
sources:
  - title: "Bridge network driver (Docker Engine docs)"
    url: "https://docs.docker.com/engine/network/drivers/bridge/"
    verifiedOn: "2026-10-20"
  - title: "Networking overview: DNS services (Docker Engine docs)"
    url: "https://docs.docker.com/engine/network/"
    verifiedOn: "2026-10-20"
