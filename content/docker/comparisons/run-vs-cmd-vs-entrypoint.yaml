id: run-vs-cmd-vs-entrypoint
tech: docker
title: RUN vs CMD vs ENTRYPOINT
compares: [run-instruction, cmd-instruction, entrypoint-instruction]
gist:
  - "Runs at build time; the result is saved in a layer"
  - "Default command or args at start; easy to replace"
  - "The fixed program every container runs"
rows:
  - { aspect: "Runs when", a: "docker build", b: "The container starts", c: "The container starts" }
  - { aspect: "docker run args", a: "No effect", b: "Replace it", c: "Appended to it (exec form)" }
  - { aspect: "Override at run", a: "Not possible: rebuild", b: "Args after the image name", c: "docker run --entrypoint" }
  - { aspect: "Several in a file", a: "Each one runs", b: "Only the last counts", c: "Only the last counts" }
  - { aspect: "Payment example", a: "./mvnw package", b: "--spring.profiles.active=prod", c: "java -jar app.jar" }
verdict: "RUN prepares the image; ENTRYPOINT is the program; CMD holds default args people may change."
sources:
  - title: "Dockerfile reference: RUN, CMD and ENTRYPOINT (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-20"
  - title: "Running containers: commands and arguments (Docker Docs)"
    url: "https://docs.docker.com/engine/containers/run/"
    verifiedOn: "2026-10-20"
