id: run-vs-cmd-vs-entrypoint
tech: docker
title: RUN vs CMD vs ENTRYPOINT
compares: [run-instruction, cmd-instruction, entrypoint-instruction]
gist:
  - "Runs at build time; the result is saved in a layer"
  - "Default command or arguments at start; easy to replace"
  - "The fixed program every container runs"
explain:
  - "RUN executes a command while the image is built, such as creating a folder or running Maven. Its file changes are saved as a layer, and it never runs when a container starts."
  - "CMD stores the default command, or the default arguments, for a container. It runs nothing at build time, and arguments typed after the image name in docker run replace it."
  - "ENTRYPOINT stores the program every container from the image starts. Run arguments are added after it, and only docker run --entrypoint replaces it."
example: "In the payment-service build, RUN ./mvnw package builds the jar once. ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"] is the program, and CMD [\"--spring.profiles.active=prod\"] is its default argument. docker run payment-service:1.4.0 --server.port=9090 keeps java but replaces the profile argument."
rows:
  - { aspect: "Runs when", a: "docker build", b: "The container starts", c: "The container starts" }
  - { aspect: "docker run arguments", a: "No effect", b: "Replace it", c: "Added after it (exec form)" }
  - { aspect: "Override at run", a: "Not possible: rebuild", b: "Arguments after the image name", c: "docker run --entrypoint" }
  - { aspect: "Several in one file", a: "Each one runs", b: "Only the last counts", c: "Only the last counts" }
  - { aspect: "Payment example", a: "./mvnw package", b: "--spring.profiles.active=prod", c: "java -jar app.jar" }
verdict: "RUN prepares the image; ENTRYPOINT is the program; CMD holds default arguments people may change."
sayIt: "RUN executes at build time and saves a layer. ENTRYPOINT is the fixed program a container starts, and CMD supplies its default arguments, which arguments in docker run replace. I write both in exec form and use --entrypoint only to swap the program, for example for a shell."
sources:
  - title: "Dockerfile reference: RUN, CMD and ENTRYPOINT (Docker Docs)"
    url: "https://docs.docker.com/reference/dockerfile/"
    verifiedOn: "2026-10-21"
  - title: "Running containers: commands and arguments (Docker Docs)"
    url: "https://docs.docker.com/engine/containers/run/"
    verifiedOn: "2026-10-21"
