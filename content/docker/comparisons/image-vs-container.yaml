id: image-vs-container
tech: docker
title: Image vs Container
compares: [read-only-image, container-process]
gist:
  - "A read-only template: layers plus settings"
  - "A runnable instance with its own writable layer"
explain:
  - "An image is a read-only package of layers plus settings, such as the start command. You build it once, or pull it from a registry, and ship it unchanged to every machine."
  - "A container is one running copy of an image: a process with its own thin writable layer on top of the image's layers. It is where the app actually runs and writes its temporary files."
example: "You build payment-service:1.4.0 once and start three containers from it behind a load balancer. One container writes a temp file and later crashes; you remove it and start a fresh one. The temp file is gone, and the image and the other two containers never saw it."
rows:
  - { aspect: "Changes", a: "Never; a rebuild makes a new image", b: "Writes go to its own writable layer" }
  - { aspect: "Made by", a: "docker build or docker pull", b: "docker run or docker create" }
  - { aspect: "How many", a: "One image", b: "Many containers from it" }
  - { aspect: "Removed with", a: "docker rmi", b: "docker rm (its writable layer goes too)" }
verdict: "Build and ship the image once; run as many containers from it as you need, and keep their data in volumes."
sayIt: "An image is the read-only template: layers plus settings, built once and shipped. A container is a running instance of it with its own writable layer. One image can start many containers, and removing a container deletes only its writable layer."
sources:
