id: container-vs-vm
tech: docker
title: Container vs Virtual Machine
compares: [container-process, virtual-machine]
gist:
  - "An isolated process on the host's kernel"
  - "A full computer with its own OS and kernel"
explain:
  - "A container is your app running as an isolated process on the host's kernel. It carries its own runtime and OS files, so it runs the same on every machine and starts like a process."
  - "A virtual machine is a simulated computer that a hypervisor creates. It boots its own guest OS and kernel, so it can run any OS and is strongly separated from other VMs."
example: "The payment service needs Java 25 on servers that have Java 21. A container from eclipse-temurin:25-jre brings Java 25 and starts in moments on any Linux host. Running untrusted customer code instead calls for separate VMs, so customers never share one kernel."
diagrams:
  - |
    flowchart TB
      A1[payment-service] --> E[Docker Engine]
      A2[postgres] --> E
      E --> K[Host OS kernel]
  - |
    flowchart TB
      A[payment-service] --> G[Guest OS and kernel]
      G --> H[Hypervisor]
      H --> HW[Physical hardware]
diagramAlt: "Container side: two containers, payment-service and postgres, run through Docker Engine directly on the host OS kernel. VM side: the app runs on its own guest OS and kernel, on a hypervisor, on the physical hardware."
rows:
  - { aspect: "Kernel", a: "Shares the host kernel", b: "Has its own guest kernel" }
  - { aspect: "Inside", a: "App, its runtime and OS files; no kernel", b: "Full OS, app and libraries" }
  - { aspect: "Typical size", a: "Tens of MB", b: "Tens of GB" }
  - { aspect: "Start", a: "Starts like a process", b: "Boots an OS: slower" }
  - { aspect: "Isolation", a: "Lighter; weaker boundary", b: "Stronger boundary" }
  - { aspect: "Per host", a: "Many", b: "Fewer" }
verdict: "Use containers to package and pack apps; use VMs for strong isolation or another OS. In the cloud, run containers inside VMs."
sayIt: "A container is an isolated process that shares the host kernel and carries only the app and its libraries, so it is small and fast. A VM virtualises hardware and boots its own kernel: heavier, but a stronger boundary. In the cloud we run containers inside VMs."
sources:
