id: expose-vs-publish
tech: docker
title: "EXPOSE vs Publishing a Port (-p)"
compares: [expose-metadata, publish-host-port]
gist:
  - "Image information: the port the app listens on"
  - "Run-time flag: opens a host port into the container"
explain:
  - "EXPOSE is a Dockerfile instruction that records which port the app listens on, such as 8080. It is information for people and tools; on its own it opens no port."
  - "Publishing with -p HOST:CONTAINER at docker run opens a port on the host and forwards its traffic into the container, so clients outside Docker can call the app."
example: "The payment-service image has EXPOSE 8080. docker run payment-service:1.4.0 is not reachable from your browser. docker run -p 9090:8080 payment-service:1.4.0 is reachable at localhost:9090, and docker run -P picks a random host port for 8080."
diagrams:
  - |
    flowchart LR
      D["Dockerfile: EXPOSE 8080"] --> I[image metadata]
      B[browser] --x C[container :8080]
  - |
    flowchart LR
      B2[browser] -- ":9090" --> H[host]
      H -- "forwards to :8080" --> C2[container]
diagramAlt: "EXPOSE: the Dockerfile line only becomes image metadata, and a browser still cannot reach port 8080 in the container. Publish: the browser calls host port 9090, and the host forwards it to port 8080 in the container."
rows:
  - { aspect: "Set in", a: "The Dockerfile (or docker run --expose)", b: "docker run -p, or Compose ports:" }
  - { aspect: "Opens a host port", a: "No", b: "Yes" }
  - { aspect: "Reachable from other machines", a: "No", b: "Yes, on all host addresses unless you give an IP" }
  - { aspect: "Used by", a: "-P, which publishes every EXPOSEd port", b: "Clients outside the Docker host" }
  - { aspect: "Needed between containers on one network", a: "No", b: "No" }
verdict: "Write EXPOSE to document the port; publish with -p only what clients outside the host must reach."
sayIt: "EXPOSE only documents the port in the image; it publishes nothing. -p host:container at run time actually opens a host port and forwards it. Containers on the same network need neither."
sources:
  - title: "Dockerfile reference: EXPOSE"
    url: "https://docs.docker.com/reference/dockerfile/#expose"
    verifiedOn: "2026-10-20"
