id: expose-vs-publish
tech: docker
title: "EXPOSE vs Publishing a Port (-p)"
compares: [expose-metadata, publish-host-port]
gist:
  - "Image metadata: the port the app listens on"
  - "Run-time flag: opens a host port to the container"
rows:
  - { aspect: "Set in", a: "Dockerfile (or docker run --expose)", b: "docker run -p, or Compose ports:" }
  - { aspect: "Opens a host port", a: "No", b: "Yes" }
  - { aspect: "Reachable from other machines", a: "No", b: "Yes, on all interfaces unless an IP is given" }
  - { aspect: "Used by", a: "-P, which publishes every EXPOSEd port", b: "Clients outside the Docker host" }
  - { aspect: "Needed between containers on one network", a: "No", b: "No" }
verdict: "Write EXPOSE to document the port; publish with -p only what clients outside the host must reach."
sources:
  - title: "Dockerfile reference: EXPOSE"
    url: "https://docs.docker.com/reference/dockerfile/#expose"
    verifiedOn: "2026-10-20"
  - title: "docker container run: --expose, -p, -P (Docker CLI reference)"
    url: "https://docs.docker.com/reference/cli/docker/container/run/"
    verifiedOn: "2026-10-20"
  - title: "Networking overview: published ports (Docker Engine docs)"
    url: "https://docs.docker.com/engine/network/"
    verifiedOn: "2026-10-20"
