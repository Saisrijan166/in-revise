terms:
  - id: docker-platform
    term: Docker (platform)
    aka: []
    definition: An open platform to build, share and run apps as containers.
    see: containers-and-vms
    source:
      title: What is Docker? (Docker docs)
      url: https://docs.docker.com/get-started/docker-overview/
      verifiedOn: 2026-10-20
  - id: docker-container
    term: Docker container
    aka: []
    definition: "A runnable instance of an image: an isolated process with its own writable layer."
    see: containers-and-vms
    source:
      title: What is Docker? Docker objects (Docker docs)
      url: https://docs.docker.com/get-started/docker-overview/
      verifiedOn: 2026-10-20
  - id: containerization
    term: Containerization
    aka: []
    definition: Packaging an app with its dependencies into an image so it runs the same as a container anywhere.
    see: containers-and-vms
    source:
      title: What is a container? (Docker)
      url: https://www.docker.com/resources/what-container/
      verifiedOn: 2026-10-20
  - id: virtual-machine
    term: Virtual machine
    aka:
      - VM
      - guest OS
    definition: An emulated computer that runs a full guest OS, kernel included, on a hypervisor.
    see: containers-and-vms
    source:
      title: Containers vs. virtual machines (Microsoft Learn)
      url: https://learn.microsoft.com/en-us/virtualization/windowscontainers/about/containers-vs-vm
      verifiedOn: 2026-10-20
  - id: hypervisor
    term: Hypervisor
    aka: []
    definition: Software that runs several VMs on one physical machine and shares its hardware among them.
    see: containers-and-vms
    source:
      title: "What is a container: virtual machines (Docker)"
      url: https://www.docker.com/resources/what-container/
      verifiedOn: 2026-10-20
  - id: host-kernel
    term: Host kernel
    aka: []
    definition: The kernel of the machine running the containers; every container on that host shares it.
    see: containers-and-vms
    source:
      title: What is a container? (Docker docs)
      url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
      verifiedOn: 2026-10-20
  - id: linux-namespace
    term: Linux namespace
    aka:
      - kernel namespace
    definition: A kernel feature that gives a group of processes its own isolated view of one resource, such as PIDs.
    see: namespaces-and-cgroups
    source:
      title: namespaces(7) (Linux manual page)
      url: https://man7.org/linux/man-pages/man7/namespaces.7.html
      verifiedOn: 2026-10-20
  - id: cgroup-term
    term: cgroup (control group)
    aka:
      - cgroup
      - control group
    definition: A Linux kernel feature that groups processes to limit and measure their CPU, memory and other resources.
    see: namespaces-and-cgroups
    source:
      title: cgroups(7) (Linux manual page)
      url: https://man7.org/linux/man-pages/man7/cgroups.7.html
      verifiedOn: 2026-10-20
  - id: docker-engine
    term: Docker Engine
    aka: []
    definition: "The open-source client-server package: the dockerd daemon, its APIs and the docker CLI."
    see: docker-architecture
    source:
      title: Docker Engine overview (Docker docs)
      url: https://docs.docker.com/engine/
      verifiedOn: 2026-10-20
  - id: docker-daemon
    term: Docker daemon
    aka:
      - dockerd
    definition: The background service that serves the Docker API and manages images, containers, networks and volumes.
    see: docker-architecture
    source:
      title: What is Docker? The Docker daemon (Docker docs)
      url: https://docs.docker.com/get-started/docker-overview/
      verifiedOn: 2026-10-20
  - id: docker-cli
    term: Docker CLI
    aka:
      - docker client
    definition: The docker command; it sends each command to a daemon through the Docker API.
    see: docker-architecture
    source:
      title: What is Docker? The Docker client (Docker docs)
      url: https://docs.docker.com/get-started/docker-overview/
      verifiedOn: 2026-10-20
  - id: docker-desktop
    term: Docker Desktop
    aka: []
    definition: A desktop app bundling the daemon, CLI and Compose, with a Linux VM on macOS and Windows; paid for larger companies.
    see: docker-architecture
    source:
      title: Docker Desktop license agreement (Docker docs)
      url: https://docs.docker.com/subscription-billing/desktop-license/
      verifiedOn: 2026-10-20
  - id: docker-engine-api
    term: Docker Engine API
    aka:
      - Docker API
      - docker.sock
    definition: The REST API that dockerd serves, by default on the Unix socket /var/run/docker.sock.
    see: docker-architecture
    source:
      title: "dockerd: daemon socket option (Docker CLI reference)"
      url: https://docs.docker.com/reference/cli/dockerd/
      verifiedOn: 2026-10-20
  - id: containerd
    term: containerd
    aka: []
    definition: A CNCF container runtime daemon that handles image transfer, storage and running containers; dockerd uses it.
    see: docker-architecture
    source:
      title: containerd README (containerd project)
      url: https://github.com/containerd/containerd
      verifiedOn: 2026-10-20
  - id: runc
    term: runc
    aka: []
    definition: A command-line tool that spawns and runs containers on Linux per the OCI spec; Docker's default runtime.
    see: docker-architecture
    source:
      title: runc README (Open Container Initiative)
      url: https://github.com/opencontainers/runc
      verifiedOn: 2026-10-20
  - id: oci
    term: Open Container Initiative
    aka:
      - OCI
    definition: A Linux Foundation project that sets open standards for container images, runtimes and distribution.
    see: docker-architecture
    source:
      title: About the Open Container Initiative
      url: https://opencontainers.org/about/overview/
      verifiedOn: 2026-10-20
  - id: moby
    term: Moby
    aka:
      - Moby project
    definition: Docker's open-source project; Docker Engine is built from it under the Apache 2.0 licence.
    see: docker-architecture
    source:
      title: "Docker Engine overview: licensing (Docker docs)"
      url: https://docs.docker.com/engine/
      verifiedOn: 2026-10-20
  - id: podman
    term: Podman
    aka: []
    definition: A daemonless, open-source container engine whose commands mostly match the docker CLI.
    see: docker-architecture
    source:
      title: Podman documentation
      url: https://docs.podman.io/en/latest/
      verifiedOn: 2026-10-20
  - id: docker-image
    term: Docker image
    aka:
      - container image
    definition: A read-only, layered package of files and settings used to create containers.
    see: images-and-layers
    source:
      title: What is an image? (Docker docs)
      url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/
      verifiedOn: 2026-10-20
  - id: image-layer
    term: Image layer
    aka: []
    definition: One read-only set of filesystem changes in an image, made by a step such as RUN or COPY.
    see: images-and-layers
    source:
      title: "Storage drivers: images and layers (Docker docs)"
      url: https://docs.docker.com/engine/storage/drivers/
      verifiedOn: 2026-10-20
  - id: base-image
    term: Base image
    aka: []
    definition: The image a Dockerfile starts from, named in its FROM line.
    see: images-and-layers
    source:
      title: "Dockerfile reference: FROM (Docker docs)"
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: union-filesystem
    term: Union filesystem
    aka:
      - union mount
      - OverlayFS
    definition: A filesystem that stacks several directories (layers) and shows them as one merged tree.
    see: images-and-layers
    source:
      title: OverlayFS storage driver (Docker docs)
      url: https://docs.docker.com/engine/storage/drivers/overlayfs-driver/
      verifiedOn: 2026-10-20
  - id: copy-on-write
    term: Copy-on-write
    aka:
      - CoW
    definition: A file stays shared in a lower layer until something changes it; then it is copied up and changed.
    see: images-and-layers
    source:
      title: "Storage drivers: copy-on-write (Docker docs)"
      url: https://docs.docker.com/engine/storage/drivers/
      verifiedOn: 2026-10-20
  - id: writable-container-layer
    term: Writable container layer
    aka:
      - container layer
    definition: The thin read-write layer on top of an image that holds a container's changes; removed with the container.
    see: images-and-layers
    source:
      title: "Storage drivers: container and layers (Docker docs)"
      url: https://docs.docker.com/engine/storage/drivers/
      verifiedOn: 2026-10-20
  - id: storage-driver
    term: Storage driver
    aka:
      - overlay2
      - graph driver
    definition: The engine part that stores image layers and writable layers on disk; overlay2 is the classic one.
    see: images-and-layers
    source:
      title: Storage drivers (Docker docs)
      url: https://docs.docker.com/engine/storage/drivers/
      verifiedOn: 2026-10-20
  - id: container-registry
    term: Container registry
    aka:
      - Docker registry
      - image registry
    definition: A service that stores images and serves them to docker push and docker pull.
    see: registries
    source:
      title: What is a registry? (Docker docs)
      url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-registry/
      verifiedOn: 2026-10-20
  - id: docker-hub
    term: Docker Hub
    aka: []
    definition: Docker's public registry and the default one the docker CLI pulls from.
    see: registries
    source:
      title: What is a registry? (Docker docs)
      url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-registry/
      verifiedOn: 2026-10-20
  - id: image-repository
    term: Image repository
    aka: []
    definition: A collection of related images, such as the versions of one app, inside a registry.
    see: registries
    source:
      title: What is a registry? Registry vs repository (Docker docs)
      url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-registry/
      verifiedOn: 2026-10-20
  - id: image-tag
    term: Image tag
    aka: []
    definition: A human-readable name for an image version, such as 1.4.0; a later push can move it.
    see: registries
    source:
      title: "OCI Distribution Specification v1.1.1: definitions"
      url: https://github.com/opencontainers/distribution-spec/blob/v1.1.1/spec.md
      verifiedOn: 2026-10-20
  - id: image-digest
    term: Image digest
    aka:
      - sha256 digest
    definition: A sha256 hash of an image's content that identifies exactly that content and never changes.
    see: registries
    source:
      title: "docker image pull: pull by digest (Docker CLI reference)"
      url: https://docs.docker.com/reference/cli/docker/image/pull/
      verifiedOn: 2026-10-20
  - id: latest-tag
    term: latest tag
    aka: []
    definition: The tag Docker uses when none is given; it does not mean the newest image.
    see: registries
    source:
      title: "docker image tag: image reference parts (Docker CLI reference)"
      url: https://docs.docker.com/reference/cli/docker/image/tag/
      verifiedOn: 2026-10-20
  - id: official-image
    term: Docker Official Image
    aka:
      - official image
    definition: A curated Docker Hub image in the library namespace, such as postgres or redis.
    see: registries
    source:
      title: "Trusted content: Docker Official Images (Docker docs)"
      url: https://docs.docker.com/docker-hub/image-library/trusted-content/
      verifiedOn: 2026-10-20
  - id: image-reference
    term: Image reference
    aka: []
    definition: "The full image name: registry host, namespace and repository, then a tag or a digest."
    see: registries
    source:
      title: "docker image tag: image reference parts (Docker CLI reference)"
      url: https://docs.docker.com/reference/cli/docker/image/tag/
      verifiedOn: 2026-10-20
  - id: dockerfile-term
    term: Dockerfile
    aka:
      - Dockerfiles
    definition: A text file of instructions that docker build runs, in order, to make an image.
    see: dockerfile-instructions
    source:
      title: Dockerfile reference (Docker Docs)
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: build-context
    term: Build context
    aka: []
    definition: The set of files a build can read, usually the folder passed to docker build.
    see: build-cache
    source:
      title: Build context (Docker Docs)
      url: https://docs.docker.com/build/concepts/context/
      verifiedOn: 2026-10-20
  - id: dockerignore
    term: .dockerignore
    aka: []
    definition: A file in the context root listing paths to leave out of the build context, like .gitignore.
    see: build-cache
    source:
      title: "Build context: .dockerignore files (Docker Docs)"
      url: https://docs.docker.com/build/concepts/context/
      verifiedOn: 2026-10-20
  - id: build-cache-term
    term: Build cache
    aka:
      - layer cache
      - layer caching
    definition: Saved results of earlier build steps that Docker reuses when a step and its inputs are unchanged.
    see: build-cache
    source:
      title: Optimize cache usage in builds (Docker Docs)
      url: https://docs.docker.com/build/cache/optimize/
      verifiedOn: 2026-10-20
  - id: cache-invalidation
    term: Cache invalidation (Docker build)
    aka:
      - cache invalidation
      - cache miss
    definition: When a step's inputs change, its cached result is dropped and every later step rebuilds.
    see: build-cache
    source:
      title: Build cache invalidation (Docker Docs)
      url: https://docs.docker.com/build/cache/invalidation/
      verifiedOn: 2026-10-20
  - id: cache-mount
    term: Cache mount
    aka:
      - --mount=type=cache
    definition: A BuildKit folder, such as /root/.m2, kept between builds so package downloads are reused.
    see: build-cache
    source:
      title: "Dockerfile reference: RUN --mount=type=cache (Docker Docs)"
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: multi-stage-build
    term: Multi-stage build
    aka:
      - multi-stage builds
      - multistage build
    definition: A Dockerfile with several FROM stages; the final image copies only what it needs from earlier ones.
    see: multi-stage-builds
    source:
      title: Multi-stage builds (Docker Docs)
      url: https://docs.docker.com/build/building/multi-stage/
      verifiedOn: 2026-10-20
  - id: build-stage
    term: Build stage
    aka:
      - build stages
    definition: The part of a Dockerfile that starts at one FROM; it can be named with AS.
    see: multi-stage-builds
    source:
      title: Multi-stage builds (Docker Docs)
      url: https://docs.docker.com/build/building/multi-stage/
      verifiedOn: 2026-10-20
  - id: buildkit
    term: BuildKit
    aka: []
    definition: Docker's build engine (the server side of a build); the default builder on Linux since Engine 23.0.
    see: buildkit-and-multi-platform
    source:
      title: Docker Engine 23.0 release notes
      url: https://docs.docker.com/engine/release-notes/23.0/
      verifiedOn: 2026-10-20
  - id: buildx
    term: Buildx
    aka:
      - docker buildx
    definition: The Docker CLI build client that sends build requests to BuildKit; docker build is its alias.
    see: buildkit-and-multi-platform
    source:
      title: Docker Build overview (Docker Docs)
      url: https://docs.docker.com/build/concepts/overview/
      verifiedOn: 2026-10-20
  - id: multi-platform-image
    term: Multi-platform image
    aka:
      - multi-arch image
      - multi-platform images
    definition: One image tag that holds variants for several platforms, such as linux/amd64 and linux/arm64.
    see: buildkit-and-multi-platform
    source:
      title: Multi-platform builds (Docker Docs)
      url: https://docs.docker.com/build/building/multi-platform/
      verifiedOn: 2026-10-20
  - id: image-index
    term: Image index
    aka:
      - manifest list
      - OCI image index
    definition: A manifest that points to one image manifest per platform; the puller picks its own.
    see: buildkit-and-multi-platform
    source:
      title: OCI Image Index Specification
      url: https://github.com/opencontainers/image-spec/blob/main/image-index.md
      verifiedOn: 2026-10-20
  - id: exec-form
    term: Exec form
    aka: []
    definition: Writing RUN, CMD or ENTRYPOINT as a JSON array, so the program runs without a shell.
    see: run-cmd-entrypoint
    source:
      title: "Dockerfile reference: shell and exec form (Docker Docs)"
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: shell-form
    term: Shell form
    aka: []
    definition: Writing RUN, CMD or ENTRYPOINT as a plain string that a command shell runs.
    see: run-cmd-entrypoint
    source:
      title: "Dockerfile reference: shell and exec form (Docker Docs)"
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: build-argument
    term: Build argument (ARG)
    aka:
      - build argument
      - build arguments
      - build arg
      - --build-arg
    definition: A variable passed with docker build --build-arg; not kept in the final container.
    see: dockerfile-instructions
    source:
      title: "Dockerfile reference: ARG (Docker Docs)"
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: dockerfile-syntax-directive
    term: Syntax directive (Dockerfile)
    aka:
      - syntax directive
      - syntax parser directive
    definition: "A first-line comment, # syntax=docker/dockerfile:1, choosing the Dockerfile syntax version BuildKit uses."
    see: dockerfile-instructions
    source:
      title: "Dockerfile reference: parser directives (Docker Docs)"
      url: https://docs.docker.com/reference/dockerfile/
      verifiedOn: 2026-10-20
  - id: use-container-support
    term: UseContainerSupport
    aka:
      - container support
      - -XX:+UseContainerSupport
    definition: A JVM flag, on by default on Linux, that makes Java read the container's memory and CPU limits.
    see: java-in-containers
    source:
      title: The java command (Java SE 25)
      url: https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html
      verifiedOn: 2026-10-20
  - id: max-ram-percentage
    term: MaxRAMPercentage
    aka:
      - -XX:MaxRAMPercentage
    definition: "JVM flag: maximum heap as a percentage of available memory; 25 by default in Java 25."
    see: java-in-containers
    source:
      title: The java command (Java SE 25)
      url: https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html
      verifiedOn: 2026-10-20
  - id: layered-jar
    term: Layered jar
    aka:
      - layered jars
      - layers.idx
    definition: A Spring Boot jar with a layer index, so libraries and app code become separate image layers.
    see: java-in-containers
    source:
      title: Efficient container images (Spring Boot 4.1)
      url: https://docs.spring.io/spring-boot/reference/packaging/container-images/efficient-images.html
      verifiedOn: 2026-10-20
  - id: cloud-native-buildpacks
    term: Cloud Native Buildpacks
    aka:
      - buildpacks
      - buildpack
    definition: Tools that turn application source or a jar into an image without a Dockerfile.
    see: java-in-containers
    source:
      title: Cloud Native Buildpacks
      url: https://buildpacks.io/
      verifiedOn: 2026-10-20
  - id: paketo
    term: Paketo Buildpacks
    aka:
      - Paketo
    definition: An open-source set of buildpacks; Spring Boot 4.1's build-image uses a Paketo builder by default.
    see: java-in-containers
    source:
      title: Packaging OCI images (Spring Boot 4.1 Maven plugin)
      url: https://docs.spring.io/spring-boot/maven-plugin/build-image.html
      verifiedOn: 2026-10-20
  - id: jlink
    term: jlink
    aka: []
    definition: A JDK tool (JDK 9+) that builds a custom Java runtime holding only the modules an app needs.
    see: java-in-containers
    source:
      title: "JEP 282: jlink, the Java Linker"
      url: https://openjdk.org/jeps/282
      verifiedOn: 2026-10-20
  - id: cds
    term: Class data sharing (CDS)
    aka:
      - CDS
      - class data sharing
      - class-data sharing
    definition: A HotSpot feature (since a JDK 5 update) that keeps parsed class metadata in an archive JVMs map into memory.
    see: java-in-containers
    source:
      title: "JEP 483: Ahead-of-Time Class Loading and Linking (History)"
      url: https://openjdk.org/jeps/483
      verifiedOn: 2026-10-20
  - id: aot-cache
    term: AOT cache
    aka:
      - ahead-of-time cache
    definition: A file from a training run that lets the JVM start with classes already loaded and linked (JDK 24+).
    see: java-in-containers
    source:
      title: "JEP 483: Ahead-of-Time Class Loading and Linking"
      url: https://openjdk.org/jeps/483
      verifiedOn: 2026-10-20
  - id: container-lifecycle-term
    term: Container lifecycle
    aka:
      - container states
    definition: "The states a container moves through: created, running, paused, restarting, exited, removing, dead."
    see: container-lifecycle
    source:
      title: "docker container ls: status filter (Docker CLI reference)"
      url: https://docs.docker.com/reference/cli/docker/container/ls/
      verifiedOn: 2026-10-20
  - id: restart-policy
    term: Restart policy
    aka:
      - restart policies
    definition: A --restart setting that decides whether Docker restarts a container after it exits or the daemon restarts.
    see: container-lifecycle
    source:
      title: Start containers automatically (Docker docs)
      url: https://docs.docker.com/engine/containers/start-containers-automatically/
      verifiedOn: 2026-10-20
  - id: detached-mode
    term: Detached mode
    aka: []
    definition: Running a container in the background with -d, so it does not hold your terminal.
    see: docker-cli-essentials
    source:
      title: docker container run (Docker CLI reference)
      url: https://docs.docker.com/reference/cli/docker/container/run/
      verifiedOn: 2026-10-20
  - id: interactive-tty
    term: Interactive TTY (-it)
    aka:
      - interactive terminal
    definition: -i keeps STDIN open and -t allocates a terminal; together they give you a usable shell.
    see: docker-cli-essentials
    source:
      title: docker container run (Docker CLI reference)
      url: https://docs.docker.com/reference/cli/docker/container/run/
      verifiedOn: 2026-10-20
  - id: sigterm
    term: SIGTERM
    aka: []
    definition: Signal 15, the polite request to stop; docker stop sends it first so the app can clean up.
    see: signals-and-graceful-shutdown
    source:
      title: signal(7) (Linux manual page)
      url: https://man7.org/linux/man-pages/man7/signal.7.html
      verifiedOn: 2026-10-20
  - id: sigkill
    term: SIGKILL
    aka: []
    definition: Signal 9; it ends a process at once and cannot be caught or ignored.
    see: container-lifecycle
    source:
      title: signal(7) (Linux manual page)
      url: https://man7.org/linux/man-pages/man7/signal.7.html
      verifiedOn: 2026-10-20
  - id: stop-timeout
    term: Stop timeout (grace period)
    aka:
      - grace period
      - stop timeout
    definition: How long docker stop waits after the stop signal before SIGKILL; 10 s on Linux unless set.
    see: container-lifecycle
    source:
      title: docker container stop (Docker CLI reference)
      url: https://docs.docker.com/reference/cli/docker/container/stop/
      verifiedOn: 2026-10-20
  - id: pid-1
    term: PID 1
    aka: []
    definition: The first process in a container's PID namespace; it receives only signals it has a handler for.
    see: signals-and-graceful-shutdown
    source:
      title: pid_namespaces(7) (Linux manual page)
      url: https://man7.org/linux/man-pages/man7/pid_namespaces.7.html
      verifiedOn: 2026-10-20
  - id: zombie-process
    term: Zombie process
    aka:
      - zombie processes
    definition: A finished child whose exit status no parent has collected yet; it still holds a process table slot.
    see: signals-and-graceful-shutdown
    source:
      title: wait(2) (Linux manual page)
      url: https://man7.org/linux/man-pages/man2/wait.2.html
      verifiedOn: 2026-10-20
  - id: init-process
    term: Init process (tini)
    aka:
      - tini
      - docker-init
    definition: A tiny PID 1 added with --init that forwards signals and reaps zombies; Docker's is based on tini.
    see: signals-and-graceful-shutdown
    source:
      title: docker container run (Docker CLI reference)
      url: https://docs.docker.com/reference/cli/docker/container/run/
      verifiedOn: 2026-10-20
  - id: graceful-shutdown
    term: Graceful shutdown
    aka: []
    definition: Stopping without new requests while in-flight ones finish within a timeout; on by default in Spring Boot.
    see: signals-and-graceful-shutdown
    source:
