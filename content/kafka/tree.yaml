topics:
  basics:
    - id: what-is-kafka
      children:
        - id: kafka-event-anatomy
          label: Event (record)
          note: A key, a value, a timestamp and optional headers
        - id: kafka-core-apis
          label: Five core APIs
          note: Admin, Producer, Consumer, Streams and Connect, for Java
        - id: kafka-use-cases
          label: Use cases
          note: Popular uses listed in the Kafka 4.3 docs
          children:
            - id: use-case-messaging
              label: Messaging
              note: Replaces a traditional message broker between services
            - id: use-case-activity-tracking
              label: Website activity tracking
              note: "The original use: page views and searches as live feeds"
            - id: use-case-metrics
              label: Metrics
              note: Central feeds of operational monitoring data
            - id: use-case-log-aggregation
              label: Log aggregation
              note: Server logs as event streams instead of collected files
            - id: use-case-stream-processing
              label: Stream processing
              note: "Pipelines: read a topic, transform, write a new topic"
            - id: use-case-event-sourcing
              label: Event sourcing
              note: State changes kept as a time-ordered sequence of records
            - id: use-case-commit-log
              label: Commit log
              note: An external log that copies data and re-syncs failed nodes
    - id: kafka-architecture
      children:
        - id: broker-server
          label: Broker
          term: kafka-broker
          note: Stores partition replicas; serves produce and fetch requests
        - id: kafka-controller-role
          label: Controller
          term: kafka-controller
          note: "Manages metadata: topics, partitions, leaders, configs"
        - id: bootstrap-servers-config
          label: bootstrap.servers
          term: bootstrap-servers
          note: First host:port list; the client discovers the other brokers
        - id: advertised-listeners-config
          label: listeners and advertised.listeners
          term: advertised-listeners
          note: Where the broker binds vs the address clients are told to use
        - id: kafka-internal-topics
          label: Internal topics
          term: internal-topic
          note: Managed by Kafka; never add partitions to them by hand
          children:
            - id: internal-consumer-offsets
              label: __consumer_offsets
              note: Offset commit topic; 50 partitions by default (Kafka 4.3)
            - id: transaction-state-topic
              label: __transaction_state
              note: Transaction topic; 50 partitions by default (Kafka 4.3)
            - id: internal-share-group-state
              label: __share_group_state
              note: Share group state; created when share groups are first used
            - id: cluster-metadata-topic
              label: __cluster_metadata
              term: cluster-metadata
              note: The KRaft metadata log, read by tools like kafka-metadata-shell
    - id: kafka-vs-alternatives
      children:
        - id: kafka-option
          label: Kafka
          note: Events kept for the retention time; any group can read them
        - id: message-queue-option
          label: Message queue
          term: message-queue
          note: A message is deleted once its consumer is done with it
        - id: rest-call-option
          label: REST call
          note: "HTTP request and response: the caller waits"
        - id: database-option
          label: Database
          note: Current state; indexes make lookups fast
        - id: redis-option
          label: Redis
          term: redis
          note: In-memory store for caching
    - id: kraft
      children:
        - id: zookeeper-mode
          label: ZooKeeper mode
          term: zookeeper
          note: Deprecated in Kafka 3.5, removed in 4.0
        - id: kraft-process-roles
          label: process.roles
          term: process-roles
          note: Sets what each KRaft server does
          children:
            - id: broker-process-role
              label: broker
              note: Handles data requests from clients
            - id: controller-process-role
              label: controller
              note: Joins the metadata quorum
            - id: combined-mode
              label: broker,controller (combined)
              term: combined-mode-term
              note: Simple for development; avoid in critical production
        - id: kraft-controller-quorum
          label: Controller quorum
          term: controller-quorum
          note: Usually 3 or 5; 2N + 1 controllers survive N failures
        - id: kraft-active-controller
          label: Active controller
          term: active-controller
          note: Leads the metadata log; the other controllers are hot standbys
        - id: zk-kraft-migration
          label: ZooKeeper to KRaft migration
          term: zk-to-kraft-migration
          note: "Done on a 3.x bridge release (last: 3.9) before upgrading to 4.x"
  storage:
    - id: topics
      children:
        - id: multi-producer-topic
          label: Many producers
          note: Any number of producers can write to one topic
        - id: multi-group-topic
          label: Many consumer groups
          note: Each group reads every record, with its own offsets
        - id: topic-config-override
          label: Topic-level config (--config)
          note: Overrides the broker default for that one topic
        - id: topic-auto-creation
          label: auto.create.topics.enable
          note: "true by default (Kafka 4.3): a write to a missing topic creates it"
        - id: internal-topics
          label: Internal topics
          note: "__consumer_offsets, __transaction_state: managed by Kafka itself"
    - id: partitions
      children:
        - id: partition-order
          label: Order per partition
          note: Readers see one partition's records in the order written
        - id: partition-directory
          label: Partition folder
          note: One folder per partition on disk, such as payments-0
        - id: partition-broker-host
          label: Broker
          note: A server that stores partitions of many topics
        - id: partition-replicas
          label: Partition replicas
          note: One leader and zero or more followers, on different brokers
    - id: partition-keys
      children:
        - id: explicit-partition
          label: Explicit partition
          note: The record names a partition; the producer uses it
        - id: key-hash-partitioning
          label: Key hash (murmur2)
          note: "Key present: murmur2 of the key bytes mod partition count"
        - id: sticky-partitioning
          label: Sticky partitioning
          note: "No key: one partition until batch.size bytes, then another"
        - id: round-robin-partitioner
          label: RoundRobinPartitioner
          note: "Opt-in: each record to the next partition, keys ignored"
        - id: custom-partitioner
          label: Custom Partitioner
          note: Implement Partitioner and set partitioner.class
        - id: hot-partition
          label: Hot partition
          note: One busy key gets far more data than the other partitions
    - id: offsets
      children:
        - id: log-start-offset
          label: Log-start offset
          note: The first offset still kept in the partition
        - id: group-committed-offset
          label: Committed offset
          note: "Stored progress: where the group resumes after a restart"
        - id: consumer-position
          label: Consumer position
          note: The offset of the next record poll() will return
        - id: high-watermark
          label: High watermark
          note: Last offset copied to all in-sync replicas, plus one
        - id: log-end-offset
          label: Log-end offset
          note: The end of the partition's log, where the next record goes
    - id: log-storage
      children:
        - id: log-segment
          label: Log segment
          note: A file of the log, named by its first offset; 1 GiB max by default, 1 MiB min
          children:
            - id: active-segment
              label: Active segment
              note: The newest segment; all appends go here; never compacted
        - id: delete-policy
          label: cleanup.policy=delete
          note: "Default: drop whole old segments past retention.ms or retention.bytes"
          children:
            - id: retention-ms
              label: retention.ms
              note: Time limit; 7 days by default (Kafka 4.3); -1 = no limit
            - id: retention-bytes
              label: retention.bytes
              note: Size limit per partition; -1 (none) by default
        - id: log-compaction
          label: Log compaction (compact)
          note: Keeps at least the latest record for each key
          children:
            - id: tombstone-record
              label: Tombstone
              note: "A key with a null value: deletes that key; kept 1 day by default"
        - id: tiered-storage
          label: Tiered storage
          note: Closed segments go to remote storage like S3; production-ready in 3.9
    - id: replay
      children:
        - id: replay-seek
          label: seek() / seekToBeginning()
          note: The consumer sets its own position in code
        - id: replay-by-time
          label: offsetsForTimes()
          note: Finds the earliest offset at or after a timestamp
        - id: replay-reset-offsets
          label: kafka-consumer-groups.sh --reset-offsets
          note: "Moves a stopped group's offsets: earliest, datetime, shift-by"
        - id: replay-new-group
          label: New group.id
          note: No committed offsets, so auto.offset.reset decides the start
  producers:
    - id: producer-basics
      children:
        - id: producer-record
          label: ProducerRecord
          note: "What you send: topic, key, value and optional extras"
          children:
            - id: record-key-field
              label: Key
              note: Optional; used to choose the partition
            - id: record-headers
              label: Headers
              note: Optional metadata sent beside the key and value
            - id: record-timestamp
              label: Timestamp
              note: Producer's time, or broker's time if the topic uses LogAppendTime
            - id: record-explicit-partition
              label: Partition (optional)
              note: If set, that partition is used and the key is not hashed
        - id: sync-send
          label: "Synchronous send: send().get()"
          note: Blocks until the request completes; the slowest way to send
        - id: async-callback-send
          label: Asynchronous send with a callback
          note: Callbacks run on the producer's I/O thread, in send order per partition
        - id: kafka-serializers
          label: Serializers
          note: key.serializer and value.serializer turn objects into bytes
          children:
            - id: string-serializer
              label: StringSerializer
              note: Built into kafka-clients, for String keys and values
            - id: byte-array-serializer
              label: ByteArraySerializer
              note: Built into kafka-clients, for raw byte[] data
    - id: producer-acks
      children:
        - id: acks-0
          label: acks=0
          note: No wait and no error feedback; the record may still be written, offset -1
        - id: acks-1
          label: acks=1
          note: Leader's local write only; lost if it fails before followers copy
        - id: acks-all
          label: acks=all (-1)
          note: Waits for the full ISR; the default since Kafka 3.0
    - id: batching-and-compression
      children:
        - id: batch-size-config
          label: batch.size
          note: Upper bound of one partition's batch in bytes; 0 turns batching off
        - id: linger-ms-config
          label: linger.ms
          note: Longest wait for more records before a batch that is not full goes
        - id: buffer-memory-config
          label: buffer.memory
          note: 32 MiB in total; when full, send() blocks up to max.block.ms
        - id: producer-compression
          label: compression.type (producer)
          note: Codec for whole batches; more batching gives better compression
        - id: topic-compression
          label: compression.type (topic)
          note: "Default producer: the broker keeps the producer's codec"
    - id: idempotent-producer
      children:
        - id: producer-id-pid
          label: Producer ID (PID)
          note: A unique id given to each new producer when it starts
        - id: producer-sequence-numbers
          label: Sequence numbers
          note: Per partition; start at 0 and rise by one for each record sent
        - id: idempotence-default-history
          label: Default since 3.0
          note: A bug kept it off in 3.0.0 and 3.1.0; fixed in 3.0.1, 3.1.1, 3.2.0
        - id: transactional-producer
          label: Transactional producer
          note: Setting transactional.id turns idempotence on as well
    - id: producer-configs
      children:
        - id: client-id-config
          label: client.id
          note: Sent with requests so server-side logs show the source app
        - id: retries-config
          label: retries
          note: With idempotence off and over 1 request in flight, retries can reorder
        - id: request-timeout-config
          label: request.timeout.ms
          note: Keep it above the broker's replica.lag.time.max.ms
        - id: delivery-timeout-config
          label: delivery.timeout.ms
          note: Can fail earlier on a fatal error or when retries run out
        - id: max-block-config
          label: max.block.ms
          note: Bounds blocking in send() for metadata or buffer space
  consumers:
    - id: consumer-basics
      children:
        - id: subscribe-group-managed
          label: subscribe()
          note: Joins the group; Kafka assigns partitions and moves them on change
        - id: assign-manual-partitions
          label: assign()
          note: Fixed partitions you choose; no group coordination or rebalance
        - id: consumer-long-poll
          label: Long poll
          note: The broker holds a fetch until fetch.min.bytes arrive or fetch.max.wait.ms ends
        - id: consumer-wakeup
          label: wakeup()
          note: Safe from another thread; poll() then throws WakeupException
    - id: consumer-groups
      children:
        - id: fewer-consumers-than-partitions
          label: Fewer consumers than partitions
          note: Some consumers own several partitions
        - id: more-consumers-than-partitions
          label: More consumers than partitions
          note: The extra consumers get no partition and stay idle
        - id: multiple-consumer-groups
          label: Many groups on one topic
          note: Each group reads every record, independently of the others
        - id: group-coordinator-broker
          label: Group coordinator
          note: Picked by group name; clients find it with FindCoordinator
    - id: offset-commits
      children:
        - id: auto-commit
          label: Auto commit
          note: Commits what poll() returned on a timer; safe only if each batch is done
        - id: manual-commit
          label: Manual commit
          note: enable.auto.commit=false; the app commits after processing
          children:
            - id: commitsync-call
              label: commitSync()
              note: Blocks until success or an unrecoverable error
            - id: commitasync-call
              label: commitAsync()
              note: Does not block; commits are sent in call order
        - id: consumer-offsets-topic
          label: __consumer_offsets
          note: 50 partitions, replication factor 3 by default (Kafka 4.3)
    - id: rebalancing
      children:
        - id: classic-group-protocol
          label: Classic protocol
          note: Client-side assignors; the client default in Kafka 4.3
          children:
            - id: eager-rebalancing
              label: Eager rebalancing
              note: Every member revokes all its partitions first
            - id: cooperative-rebalancing
              label: Cooperative rebalancing
              note: Revokes only moving partitions; since Kafka 2.4 (KIP-429)
        - id: kip848-consumer-protocol
          label: Consumer protocol (KIP-848)
          note: Broker-side assignment; GA in Kafka 4.0; opt-in, planned default in 5.0
        - id: static-membership
          label: Static membership
          note: group.instance.id; a quick restart keeps its partitions, no rebalance
        - id: partition-assignors
          label: Partition assignors
          note: partition.assignment.strategy; classic protocol only
          children:
            - id: range-assignor
              label: RangeAssignor
              note: Assigns partitions per topic; first in the default list
            - id: round-robin-assignor
              label: RoundRobinAssignor
              note: Deals partitions to consumers in turn
            - id: sticky-assignor
              label: StickyAssignor
              note: Balanced; keeps as many existing assignments as it can
            - id: cooperative-sticky-assignor
              label: CooperativeStickyAssignor
              note: Sticky logic with cooperative rebalancing
    - id: consumer-lag
      children:
        - id: lag-describe-command
          label: kafka-consumer-groups.sh --describe
          note: Shows CURRENT-OFFSET, LOG-END-OFFSET and LAG per partition
        - id: records-lag-max-metric
          label: records-lag-max
          note: "Client metric: worst partition lag in the window, in records"
        - id: consumer-pause-resume
          label: pause() / resume()
          note: Stop and restart fetching chosen partitions
        - id: share-group-lag
          label: Share group lag
          note: kafka-share-groups.sh --describe shows START-OFFSET and LAG
    - id: share-groups
      children:
        - id: share-acquisition-lock
          label: Acquisition lock
          note: While held, other group members cannot get that record
        - id: share-ack-types
          label: Acknowledge types
          note: Set per record with acknowledge() in explicit mode
          children:
            - id: share-ack-accept
              label: ACCEPT
              note: Processed successfully
            - id: share-ack-release
              label: RELEASE
              note: Not processed; available for another delivery attempt
            - id: share-ack-reject
              label: REJECT
              note: Unprocessable; never delivered again
            - id: share-ack-renew
              label: RENEW
              note: Still processing; extends the lock (added in Kafka 4.2)
        - id: share-ack-mode
          label: share.acknowledgement.mode
          note: "implicit (default): next poll or commit accepts the batch; explicit: ack each"
        - id: share-delivery-limit
          label: Delivery count limit
          note: Group config share.delivery.count.limit; minimum 2
        - id: share-group-state-topic
          label: __share_group_state
          note: Internal topic for share state; needs 3 brokers by default
    - id: consumer-configs
      children:
        - id: offset-reset-latest
          label: auto.offset.reset=latest
          note: "Default: start at the end, skipping older records"
        - id: offset-reset-earliest
          label: auto.offset.reset=earliest
          note: Start from the oldest record still retained
        - id: offset-reset-none
          label: auto.offset.reset=none
          note: Throw an exception if the group has no previous offset
        - id: offset-reset-by-duration
          label: auto.offset.reset=by_duration
          note: Start a set time back, e.g. by_duration:P1D; since Kafka 4.0
  reliability:
    - id: replication
      children:
        - id: leader-replica
          label: Leader replica
          note: Takes every write for its partition; serves reads by default
        - id: follower-replicas
          label: Follower replicas
          note: Fetch from the leader like a consumer; same offsets and order
        - id: preferred-leader-replica
          label: Preferred leader
          note: First replica in the list; leadership moves back to it by default
        - id: closest-replica-fetching
          label: Follower fetching
          note: "Since Kafka 2.4 (KIP-392): consumers read a same-rack replica"
    - id: isr-and-min-insync
      children:
        - id: isr-shrink-and-rejoin
          label: Leaving and rejoining the ISR
          note: Out after 30 s behind; back only after fully catching up
        - id: rf3-min-insync2
          label: RF 3 + min.insync.replicas 2
          note: "The usual setup: survives one replica loss and keeps writing"
        - id: min-insync-equals-rf
          label: min.insync.replicas = RF
          note: Any single replica down stops all acks=all writes
        - id: not-enough-replicas-error
          label: NotEnoughReplicas
          note: Producer error when ISR < min.insync.replicas under acks=all
        - id: elr-kip-966
          label: Eligible leader replicas (ELR)
          note: Since Kafka 4.0, on by default for new clusters from 4.1
    - id: delivery-semantics
      children:
        - id: at-most-once
          label: At-most-once
          note: "Commit before processing: may lose records, never repeats"
        - id: at-least-once
          label: At-least-once
          note: "Process before commit: may repeat records; Kafka's default"
        - id: exactly-once
          label: Exactly-once
          note: Transactions for Kafka-to-Kafka read-process-write
    - id: kafka-transactions
      children:
        - id: txn-coordinator
          label: Transaction coordinator
          note: Broker role that tracks each transactional.id and its state
        - id: txn-state-topic
          label: __transaction_state
          note: "Internal topic: the coordinator's replicated transaction log"
        - id: txn-commit-markers
          label: Commit and abort markers
          note: Control records in each partition; read_committed uses them
        - id: txn-zombie-fencing
          label: Zombie fencing
          note: A newer epoch for the same transactional.id fences the old one
        - id: streams-exactly-once-v2
          label: exactly_once_v2 (Kafka Streams)
          note: processing.guarantee value; the default is at_least_once
    - id: fault-tolerance
      children:
        - id: isr-leader-failover
          label: Leader failover
          note: Controller elects a new leader from the remaining ISR
        - id: unclean-election-choice
          label: Unclean leader election
          note: Off by default; an out-of-sync leader can lose committed data
        - id: rack-aware-placement
          label: Rack-aware placement
          note: broker.rack spreads replicas over racks or availability zones
        - id: controlled-broker-shutdown
          label: Controlled shutdown
          note: Moves leadership off a broker before a planned stop
        - id: mirrormaker2-geo-replication
          label: MirrorMaker 2
          note: Copies topics, configs and group offsets to another cluster
  patterns:
    - id: retries-and-dead-letter-topics
      children:
        - id: transient-error
          label: Transient error
          note: "Timeout or 503: may pass on retry, so retry with backoff"
        - id: permanent-error
          label: Permanent error
          note: "Bad data or failed deserialisation: a retry will not fix it"
        - id: poison-message
          label: Poison message
          note: Fails on every attempt; retried in place, its partition stops moving
        - id: blocking-retries
          label: Blocking retries
          note: Retry in the consumer; later records of the partition wait
        - id: non-blocking-retries
          label: Non-blocking retries
          note: Move the record to a delayed retry topic; order is lost
        - id: dead-letter-topic
          label: Dead letter topic (DLT)
          note: Holds records that ran out of attempts or cannot be processed
          children:
            - id: dlt-headers
              label: DLT headers
              note: Spring adds the exception, original topic, partition and offset
            - id: dlt-redrive
              label: Re-drive
              note: Move fixed records out of the DLT for processing again
    - id: ordering-and-scaling
      children:
        - id: global-ordering
          label: Global ordering
          note: Needs one partition, so one consumer per group
        - id: per-key-ordering
          label: Per-key ordering
          note: "Same key, same partition: read in the order written"
        - id: partition-count
          label: Choosing partition count
          note: At least max(t/p, t/c) from measured per-partition rates
        - id: adding-partitions
          label: Adding partitions
          note: kafka-topics.sh --alter; keys may move; old data stays put
        - id: reducing-partitions
          label: Reducing partitions
          note: Not supported (Kafka 4.3)
        - id: too-many-partitions
          label: Too many partitions
          note: More open files on brokers and more memory in clients
        - id: multithreaded-processing-order
          label: Thread pool per consumer
          note: "Workers can finish a later record first: order needs care"
    - id: idempotent-consumers
      children:
        - id: duplicate-sources
          label: Where duplicates come from
          note: At-least-once delivery can hand a record over more than once
          children:
            - id: crash-before-commit
              label: Crash before commit
              note: The next owner restarts from the last committed offset
            - id: producer-or-relay-resend
              label: Re-send
              note: "A producer or outbox relay sends the event again: a new offset"
            - id: replay-duplicates
              label: Replay
              note: Seeking back reads records that were already handled
        - id: processed-events-table
          label: Processed-events table
          note: Unique eventId inserted in the same transaction as the effect
        - id: upsert
          label: Upsert
          note: INSERT ... ON CONFLICT DO UPDATE writes the final state by id
        - id: version-check
          label: Version check
          note: Update only when the incoming version is newer
        - id: idempotency-key
          label: Idempotency key
          note: A business id in the event (eventId, paymentId), not the offset
    - id: transactional-outbox
      children:
        - id: dual-write
          label: Dual write
          note: "DB commit and Kafka send apart: a crash loses or invents events"
        - id: outbox-table
          label: Outbox table
          note: Event rows written in the same transaction as the business rows
        - id: polling-publisher
          label: Polling publisher
          note: Reads new outbox rows and publishes them; any SQL database
        - id: log-tailing-relay
          label: Transaction log tailing
          note: "Reads outbox inserts from the DB log: MySQL binlog, Postgres WAL"
          children:
            - id: debezium-outbox-router
              label: Outbox event router (Debezium)
              note: Outbox rows to outbox.event.<aggregatetype>; aggregateid is the key
  ecosystem:
    - id: kafka-connect
      children:
        - id: connect-source-connector
          label: Source connector
          note: Imports data from another system into Kafka topics
        - id: connect-sink-connector
          label: Sink connector
          note: Exports records from Kafka topics to another system
          children:
            - id: connect-sink-dlq
              label: Sink DLQ topic
              note: errors.tolerance=all plus errors.deadletterqueue.topic.name
        - id: connect-workers-tasks
          label: Workers and tasks
          note: A connector splits its job into at most tasks.max tasks for workers
          children:
            - id: connect-standalone-mode
              label: Standalone mode
              note: One process, offsets in a local file; no fault tolerance
            - id: connect-distributed-mode
              label: Distributed mode
              note: Workers share tasks; configs, offsets, status in Kafka topics
        - id: connect-converters
          label: Converters
          note: "key.converter, value.converter: Connect data to bytes (JSON, Avro)"
        - id: connect-smt
          label: Single message transforms
          note: "Small per-record edits in config: InsertField, MaskField, Filter"
        - id: connect-debezium
          label: Debezium (CDC)
          note: Reads the DB change log (MySQL binlog, PostgreSQL WAL); PG needs logical WAL
    - id: kafka-streams
      children:
        - id: streams-topology
          label: Topology
          note: A graph of source, processor and sink nodes
        - id: streams-tables
          label: KStream, KTable, GlobalKTable
          note: Read a topic as events, as a table, or as a full table copy
          children:
            - id: streams-kstream
              label: KStream
              note: Each record is a new fact, like an insert
            - id: streams-ktable
              label: KTable
              note: Each record updates its key; a null value deletes it
            - id: streams-globalktable
              label: GlobalKTable
              note: Every instance holds all partitions; joins need no co-partitioning
        - id: streams-state-store
          label: State store
          note: Local store per task; RocksDB is the default persistent store
          children:
            - id: streams-changelog-topic
              label: Changelog topic
              note: Compacted copy of a store; replayed to restore it after a move
        - id: streams-windows
          label: Windows
          note: Group one key's records by time for aggregations and joins
          children:
            - id: streams-tumbling-window
              label: Tumbling window
              note: Fixed size, no overlap, no gaps
            - id: streams-hopping-window
              label: Hopping window
              note: "Fixed size, overlapping: a size plus an advance (hop)"
            - id: streams-sliding-window
              label: Sliding window
              note: Fixed size, based on time differences between records
            - id: streams-session-window
              label: Session window
              note: "Dynamic size: a session ends after an inactivity gap"
        - id: streams-tasks
          label: Stream tasks
          note: "One task per input partition: the unit of parallelism"
          children:
            - id: streams-rebalance-protocol
              label: Streams rebalance protocol (KIP-1071)
              note: Broker-side task assignment; core features production-ready in Kafka 4.2
        - id: streams-alternatives
          label: Other ways to process
          note: Options people compare with Kafka Streams
          children:
            - id: streams-ksqldb
              label: ksqlDB
              note: Confluent's SQL layer; turns queries into Kafka Streams apps
            - id: streams-flink
              label: Apache Flink
              note: A separate distributed engine that runs on its own cluster
    - id: schema-registry-and-serialization
      children:
        - id: sr-subject
          label: Subject
          note: One version history; default names <topic>-key and <topic>-value
        - id: sr-compatibility
          label: Compatibility modes
          note: Checked for each new version; _TRANSITIVE checks all old ones
          children:
            - id: sr-backward
              label: BACKWARD (default)
              note: The new schema can read data written with the last one
            - id: sr-forward
              label: FORWARD
              note: The last schema can read data written with the new one
            - id: sr-full
              label: FULL
              note: Both BACKWARD and FORWARD
            - id: sr-none
              label: NONE
              note: Compatibility checks are off
        - id: sr-avro
          label: Apache Avro
          note: Binary encoding; schemas are written in JSON
        - id: sr-protobuf
          label: Protocol Buffers
          note: Binary, smaller than JSON; .proto files and generated classes
        - id: sr-json-schema
          label: JSON Schema
          note: Plain JSON text, checked against a JSON Schema
        - id: sr-apicurio
          label: Apicurio Registry
          note: Another registry; stores schemas in Kafka, PostgreSQL or SQL Server
    - id: spring-kafka
      children:
        - id: sk-kafkatemplate
          label: KafkaTemplate
          note: Auto-configured by Boot; send(topic, key, value)
        - id: sk-kafkalistener
          label: "@KafkaListener"
          note: topics, groupId, concurrency; ackMode per listener since 4.1
        - id: sk-ackmode
          label: AckMode
          note: "When the container commits, e.g. BATCH (default), RECORD, MANUAL_IMMEDIATE"
        - id: sk-error-handling
          label: Error handling
          note: A CommonErrorHandler bean is attached to Boot's default factory automatically
          children:
            - id: sk-default-error-handler
              label: DefaultErrorHandler
              note: Redelivers using a BackOff, then calls a recoverer
            - id: sk-dlpr
              label: DeadLetterPublishingRecoverer
              note: Publishes the failed record, with exception headers, to a DLT
            - id: sk-retryable-topic
              label: "@RetryableTopic"
              note: Non-blocking retries through retry topics, then the -dlt topic
            - id: sk-error-handling-deserializer
              label: ErrorHandlingDeserializer
              note: Wraps a deserializer; a failure goes to the error handler
        - id: sk-share-consumers
          label: Share consumers
          note: ShareKafkaListenerContainerFactory; production support since 4.1
        - id: sk-boot-config
          label: spring.kafka.* properties
          note: e.g. spring.kafka.bootstrap-servers, spring.kafka.listener.ack-mode
    - id: kafka-code-templates
      children:
        - id: kct-application-yml
          label: application.yml
          note: spring.kafka.bootstrap-servers and spring.kafka.consumer.group-id
        - id: kct-producer
          label: Producer template
          note: KafkaTemplate.send(topic, key, value); check the result in whenComplete
        - id: kct-consumer
          label: Consumer template
          note: "A @KafkaListener(topics = ...) method; it needs a group id or start-up fails"
        - id: kct-error-handler
          label: Error handler bean
          note: DefaultErrorHandler plus DeadLetterPublishingRecoverer; Boot wires it in
        - id: kct-console-tools
          label: Console tools
          note: kafka-console-producer.sh writes lines; kafka-console-consumer.sh prints
  playbook:
    - id: kafka-design-formula
      children:
        - id: design-growth-headroom
          label: Headroom for growth
          note: Size partitions for the throughput expected in 1-2 years
        - id: design-broker-memory
          label: Broker memory
          note: "Page cache for about 30 s of writes: write rate x 30"
        - id: design-broker-disks
          label: Broker disks
          note: Disk throughput is usually the bottleneck; use several drives
        - id: design-load-test
          label: Load test
          note: kafka-producer-perf-test.sh prints throughput and latency percentiles
    - id: kafka-failure-scenarios
      children:
        - id: failure-broker-loss
          label: Broker loss
          note: Only in-sync replicas can be elected leader
        - id: failure-all-isr-lost
          label: All in-sync replicas lost
          note: Wait for a safe replica (default) or elect an out-of-sync one
        - id: failure-controller-loss
          label: Controller loss
          note: A majority of controllers must be alive for availability
        - id: failure-consumer-crash
          label: Consumer crash
          note: "No heartbeat within session.timeout.ms: removed from the group"
        - id: failure-send-timeout
          label: Send timeout
          note: delivery.timeout.ms bounds the time to report success or failure
    - id: kafka-performance-tuning
      children:
        - id: perf-page-cache
          label: OS page cache
          note: Stays warm after a broker restart, unlike an in-process cache
        - id: perf-zero-copy
          label: Zero-copy (sendfile)
          note: Not used when SSL is enabled on the connection
        - id: perf-flush-policy
          label: Flush policy
          note: "Default: no app fsync; the OS flushes and replicas give durability"
        - id: perf-batch-compression
          label: End-to-end compression
          note: GZIP, Snappy, LZ4 and ZStandard; batches stay compressed in the log
    - id: kafka-security
      children:
        - id: security-tls-listener
          label: TLS (SSL) listener
          note: Encrypts client and broker traffic; costs some CPU
          children:
            - id: security-mutual-tls
              label: Mutual TLS
              note: "ssl.client.auth=required: clients must present a certificate"
        - id: security-sasl
          label: SASL
          note: GSSAPI (Kerberos), PLAIN, SCRAM-SHA-256/512, OAUTHBEARER
          children:
            - id: security-scram-store
              label: SCRAM credentials
              note: Stored in the KRaft metadata log; add them with kafka-configs.sh
        - id: security-acls
          label: ACLs
          note: Principal is allowed or denied an operation on a resource
          children:
            - id: security-standard-authorizer
              label: StandardAuthorizer
              note: The KRaft authorizer; keeps ACLs in the metadata log
        - id: security-client-quotas
          label: Client quotas
          note: Byte-rate and request-rate limits per user or client.id
        - id: security-data-at-rest
          label: Data at rest
          note: Kafka writes log segments as plain bytes on disk
    - id: kafka-playbook
      children:
        - id: guarantee-order
          label: Order per partition
          note: Consumers read a partition in exactly the order it was written
        - id: guarantee-durability
          label: Durability
          note: A committed record survives while one in-sync replica lives
        - id: guarantee-scaling
          label: Scaling
          note: Partitions spread a topic so clients use many brokers at once
        - id: guarantee-replay
          label: Replay
          note: Records are kept for the retention time, not deleted on read
        - id: guarantee-fan-out
          label: Fan-out
          note: Each consumer group reads the topic on its own
