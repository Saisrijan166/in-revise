name: Kafka
slug: kafka
accent: lime
summary: "Apache Kafka for interviews: topics, partitions and offsets, producers and consumers, replication and delivery guarantees, errors and ordering, Connect, Streams and Spring."
codeLanguages:
  - java
storySpine:
  - step: The Order Service calls payments, stock and email one by one, and each new reader means a code change → publish OrderPlaced once to a Kafka topic and let each service read it
    cards:
      - what-is-kafka
      - kafka-vs-alternatives
  - step: One server cannot hold every event or survive a crash → run a cluster of brokers, with KRaft controllers keeping the metadata
    cards:
      - kafka-architecture
      - kraft
  - step: One log on one server cannot hold or serve every order event → name an orders topic, split it into partitions over brokers, and key each event by orderId so each order stays in order
    cards:
      - topics
      - partitions
      - partition-keys
  - step: Readers need to know where they stopped, disks fill up, and a bug means events must be read again → track offsets per partition, keep segments for a retention time, and rewind a group's offsets to replay
    cards:
      - offsets
      - log-storage
      - replay
  - step: The Payment Service must write PaymentCompleted events fast without blocking → an asynchronous producer that batches and compresses records per partition
    cards:
      - producer-basics
      - batching-and-compression
      - producer-configs
  - step: A broker crash or a lost reply could drop or double a ₹500 payment event → acks=all and the idempotent producer
    cards:
      - producer-acks
      - idempotent-producer
  - step: One consumer cannot keep up with the payments topic → run several consumers in one group, each owning some partitions, and commit offsets after processing
    cards:
      - consumer-basics
      - consumer-groups
      - offset-commits
      - consumer-configs
  - step: Members join, crash or stall, lag builds up, and some jobs need no order → rebalance cooperatively, watch lag, and use a share group for queue-style work
    cards:
      - rebalancing
      - consumer-lag
      - share-groups
  - step: A broker crash would lose the partitions it stores → keep copies on other brokers and fail over to an in-sync follower
    cards:
      - replication
      - isr-and-min-insync
      - fault-tolerance
  - step: A crash between processing and committing loses or repeats records → use at-least-once with idempotent consumers, and transactions for Kafka-to-Kafka exactly-once
    cards:
      - delivery-semantics
      - kafka-transactions
  - step: More partitions split the order of events, and one bad record can stall a partition → key by orderId so each order stays in sequence, and park records that keep failing in a dead letter topic
    cards:
      - ordering-and-scaling
      - retries-and-dead-letter-topics
  - step: Crashes and relays deliver some events twice, and the order row and its event can drift apart → write an outbox row in the same transaction and dedupe on eventId
    cards:
      - transactional-outbox
      - idempotent-consumers
  - step: Every team writes its own glue code to copy database changes into Kafka and topics out to search and warehouses → run Kafka Connect connectors, with Debezium for change data capture
    cards:
      - kafka-connect
  - step: Services must count and join events and agree on their shape → process them with Kafka Streams, keep event schemas in a schema registry, and let Spring for Apache Kafka run the plumbing
    cards:
      - kafka-streams
      - schema-registry-and-serialization
      - spring-kafka
      - kafka-code-templates
  - step: An interviewer asks how you would use Kafka for 100K events per second → walk the design formula with measured rates, then say what happens when each part fails
    cards:
      - kafka-design-formula
      - kafka-failure-scenarios
  - step: The cluster is slow, open to anyone and the answers sound vague → tune batches, partitions and consumers, lock it down with TLS, SASL and ACLs, and revise the rules and traps
    cards:
      - kafka-performance-tuning
      - kafka-security
      - kafka-playbook
topics:
  - id: basics
    title: Kafka Basics
    order: 1
    blurb: What Kafka is, how a cluster is built, KRaft, and when to pick Kafka over a queue, REST, a database or Redis.
  - id: storage
    title: Topics, Partitions and Storage
    order: 2
    blurb: Topics, partitions and keys, offsets, how the log is stored and kept, and replaying old events.
  - id: producers
    title: Producers
    order: 3
    blurb: Sending records, acks, batching and compression, the idempotent producer and the producer configs to know.
  - id: consumers
    title: Consumers
    order: 4
    blurb: The poll loop, consumer groups, offset commits, rebalancing, lag, share groups and the consumer configs to know.
  - id: reliability
    title: Replication and Guarantees
    order: 5
    blurb: Leaders and followers, ISR and min.insync.replicas, delivery semantics, transactions and broker failure.
  - id: patterns
    title: Errors, Ordering and Duplicates
    order: 6
    blurb: Retries and dead letter topics, ordering versus scaling, idempotent consumers and the outbox.
  - id: ecosystem
    title: Connect, Streams, Schemas and Spring
    order: 7
    blurb: Kafka Connect and CDC, Kafka Streams, Schema Registry and Spring for Apache Kafka.
  - id: playbook
    title: Design, Operations and Playbook
    order: 8
    blurb: A design formula, failure scenarios, performance, security and an easy way to answer any Kafka question.
