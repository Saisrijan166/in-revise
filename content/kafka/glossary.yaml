    definition: A Spring recoverer that publishes a failed record to a dead letter topic, by default the topic name plus -dlt.
    see: spring-kafka
    source:
      title: Handling Exceptions (Spring for Apache Kafka 4.1)
      url: https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html
      verifiedOn: 2026-10-20
  - id: retryable-topic
    term: "@RetryableTopic"
    definition: A Spring annotation for non-blocking retries through delayed retry topics, then a dead letter topic.
    see: spring-kafka
    source:
      title: "Non-Blocking Retries: how the pattern works (Spring for Apache Kafka 4.1)"
      url: https://docs.spring.io/spring-kafka/reference/retrytopic/how-the-pattern-works.html
      verifiedOn: 2026-10-20
  - id: error-handling-deserializer
    term: ErrorHandlingDeserializer
    definition: A Spring deserializer wrapper that turns a deserialisation failure into an error the container can handle.
    see: spring-kafka
    source:
      title: Serialization, Deserialization (Spring for Apache Kafka 4.1)
      url: https://docs.spring.io/spring-kafka/reference/kafka/serdes.html
      verifiedOn: 2026-10-20
  - id: kafka-throughput
    term: Throughput (Kafka)
    aka:
      - Kafka throughput
    definition: How much data a topic or cluster moves per second, in records per second or MB/s.
    see: kafka-design-formula
    source:
      title: How to choose the number of topics/partitions in a Kafka cluster? (Jun Rao, Confluent blog)
      url: https://www.confluent.io/blog/how-choose-number-topics-partitions-kafka-cluster/
      verifiedOn: 2026-10-20
  - id: partition-throughput
    term: Partition throughput
    aka:
      - per-partition throughput
    definition: The rate one partition can be produced to or consumed from; measure it, since it depends on settings and code.
    see: kafka-design-formula
    source:
      title: How to choose the number of topics/partitions in a Kafka cluster? (Jun Rao, Confluent blog)
      url: https://www.confluent.io/blog/how-choose-number-topics-partitions-kafka-cluster/
      verifiedOn: 2026-10-20
  - id: kafka-capacity-planning
    term: Capacity planning (Kafka)
    aka:
      - capacity planning
    definition: Sizing partitions, brokers, disks and memory from the target throughput, retention and replication factor.
    see: kafka-design-formula
    source:
      title: Hardware and OS (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/hardware-and-os/
      verifiedOn: 2026-10-20
  - id: page-cache
    term: Page cache
    aka:
      - pagecache
      - OS page cache
    definition: Free memory the operating system uses to cache file data; Kafka relies on it instead of its own cache.
    see: kafka-performance-tuning
    source:
      title: "Design: persistence (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: zero-copy
    term: Zero-copy
    aka:
      - zero copy
    definition: Sending file bytes from the page cache to the network without copying them through the application.
    see: kafka-performance-tuning
    source:
      title: "Design: efficiency (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: sendfile
    term: sendfile
    definition: The Linux system call Kafka uses for zero-copy transfer from page cache to socket; not used with SSL.
    see: kafka-performance-tuning
    source:
      title: "Design: efficiency (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: kafka-tls-listener
    term: TLS (Kafka listener)
    aka:
      - TLS listener
      - SSL listener
    definition: A broker listener that encrypts traffic with TLS, named SSL in Kafka configs.
    see: kafka-security
    source:
      title: Encryption and authentication using SSL (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/encryption-and-authentication-using-ssl/
      verifiedOn: 2026-10-20
  - id: mutual-tls
    term: Mutual TLS
    aka:
      - mTLS
      - two-way TLS
    definition: TLS where the client also shows a certificate, so the broker knows who it is.
    see: kafka-security
    source:
      title: Encryption and authentication using SSL (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/encryption-and-authentication-using-ssl/
      verifiedOn: 2026-10-20
  - id: sasl
    term: SASL
    aka:
      - Simple Authentication and Security Layer
    definition: A framework for login mechanisms; Kafka supports GSSAPI, PLAIN, SCRAM and OAUTHBEARER.
    see: kafka-security
    source:
      title: Security overview (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/security-overview/
      verifiedOn: 2026-10-20
  - id: scram
    term: SCRAM
    aka:
      - SCRAM-SHA-256
      - SCRAM-SHA-512
      - SASL/SCRAM
    definition: A salted challenge-response password login (RFC 5802); Kafka keeps the credentials in the metadata log.
    see: kafka-security
    source:
      title: Authentication using SASL (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authentication-using-sasl/
      verifiedOn: 2026-10-20
  - id: oauthbearer
    term: OAUTHBEARER
    aka:
      - SASL/OAUTHBEARER
    definition: A SASL mechanism where clients log in with OAuth 2 bearer tokens; use it only over TLS.
    see: kafka-security
    source:
      title: Authentication using SASL (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authentication-using-sasl/
      verifiedOn: 2026-10-20
  - id: gssapi
    term: GSSAPI
    aka:
      - SASL/GSSAPI
      - Kerberos
    definition: The SASL mechanism for Kerberos login, used where a company already runs Kerberos.
    see: kafka-security
    source:
      title: Authentication using SASL (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authentication-using-sasl/
      verifiedOn: 2026-10-20
  - id: security-protocol
    term: security.protocol
    definition: "Client setting for how to talk to brokers: PLAINTEXT (default), SSL, SASL_PLAINTEXT or SASL_SSL."
    see: kafka-security
    source:
      title: "Producer configs: security.protocol (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: sasl-ssl
    term: SASL_SSL
    definition: A security protocol that logs in with SASL over a TLS-encrypted connection.
    see: kafka-security
    source:
      title: Listener configuration (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/listener-configuration/
      verifiedOn: 2026-10-20
  - id: kafka-acl
    term: ACL (Kafka)
    aka:
      - Kafka ACL
      - Kafka ACLs
      - kafka-acls.sh
    definition: A rule that allows or denies a principal an operation, such as Read, on a resource such as a topic.
    see: kafka-security
    source:
      title: Authorization and ACLs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authorization-and-acls/
      verifiedOn: 2026-10-20
  - id: kafka-principal
    term: Principal (Kafka)
    aka:
      - Kafka principal
      - User principal
    definition: The authenticated identity of a client, such as User:payment-service, that ACLs refer to.
    see: kafka-security
    source:
      title: Authorization and ACLs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authorization-and-acls/
      verifiedOn: 2026-10-20
  - id: standard-authorizer
    term: StandardAuthorizer
    definition: Kafka's built-in authorizer for KRaft clusters; it stores ACLs in the cluster metadata log.
    see: kafka-security
    source:
      title: Authorization and ACLs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authorization-and-acls/
      verifiedOn: 2026-10-20
  - id: kafka-client-quotas
    term: Client quotas (Kafka)
    aka:
      - Kafka quotas
      - client quotas
    definition: Broker limits on bytes per second and request time, per user or client.id, so one client cannot starve others.
    see: kafka-security
    source:
      title: "Design: quotas (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: kafka-event
    term: Event (Kafka)
    aka:
      - Kafka event
      - Kafka record
      - Kafka message
    definition: A record that something happened, such as PaymentCompleted; it has a key, a value, a timestamp and optional headers. Also called a record or a message.
    see: what-is-kafka
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-22
  - id: long-poll
    term: Long poll
    aka:
      - long polling
    definition: A fetch the broker holds open until enough data arrives or a short wait ends, so an idle consumer does not loop on empty replies.
    see: consumer-basics
    source:
      title: "Design: push vs. pull (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-22
  - id: acknowledge-type
    term: AcknowledgeType (share consumer)
    aka:
      - AcknowledgeType
    definition: "The result a share consumer gives each record: ACCEPT (done), RELEASE (try again), REJECT (never deliver again) or RENEW (extend the lock)."
    see: share-groups
    source:
      title: KafkaShareConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaShareConsumer.html
      verifiedOn: 2026-10-22
  - id: on-partitions-lost
    term: onPartitionsLost()
    definition: A rebalance callback for partitions taken away without a clean handover, such as after a session timeout; their offsets can no longer be committed.
    see: rebalancing
    source:
      title: ConsumerRebalanceListener (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/ConsumerRebalanceListener.html
      verifiedOn: 2026-10-22
  - id: streams-application-id
    term: application.id
    aka: []
    definition: "The required name of a Kafka Streams app: it is the consumer group id, the prefix of its internal topics and its state directory name."
    see: kafka-streams
    source:
      title: "Configuring a Streams Application: application.id (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/streams/developer-guide/config-streams/
      verifiedOn: 2026-10-22
  - id: repartition-topic-term
    term: Repartition topic
    aka:
      - repartition topics
    definition: An internal topic Kafka Streams writes through after a key change, such as groupBy, so records with the new key meet in one task.
    see: kafka-streams
    source:
      title: "Kafka Streams DSL API: groupBy and repartitioning (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/streams/developer-guide/dsl-api/
      verifiedOn: 2026-10-22
  - id: standby-replica-term
    term: Standby replica (Streams)
    aka:
      - standby replicas
    definition: A warm copy of a Kafka Streams task's state on another instance, so a moved task restores faster; num.standby.replicas is 0 by default.
    see: kafka-streams
    source:
      title: "Kafka Streams Architecture: standby replicas (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/streams/architecture/
      verifiedOn: 2026-10-22
  - id: config-provider-term
    term: Config provider
    aka:
      - FileConfigProvider
      - config providers
    definition: A plug-in that fills a ${provider:path:key} placeholder in a config from a file or secret store, so secrets stay out of connector configs.
    see: kafka-connect
    source:
      title: Configuration Providers (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/configuration-providers/
      verifiedOn: 2026-10-22
  - id: listener-container-term
    term: Listener container
    aka:
      - listener containers
      - message listener container
    definition: The Spring for Apache Kafka object that owns a consumer and its thread, polls, calls your @KafkaListener method and commits offsets.
    see: spring-kafka
    source:
      title: Message Listener Containers (Spring for Apache Kafka 4.1)
      url: https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages/message-listener-container.html
      verifiedOn: 2026-10-22
  - id: schema-id-term
    term: Schema ID
    aka: []
    definition: The number a schema registry gives each registered schema; Confluent serializers put a magic byte and the 4-byte ID before the data.
    see: schema-registry-and-serialization
    source:
      title: "Formats, Serializers and Deserializers: wire format (Confluent Platform 8.x)"
      url: https://docs.confluent.io/platform/current/schema-registry/fundamentals/serdes-develop/index.html
      verifiedOn: 2026-10-22
  - id: outbox-event-router
    term: Outbox event router
    definition: Debezium transformation that turns outbox-table rows into Kafka events; aggregateid becomes the key.
    see: transactional-outbox
    source:
      title: Outbox Event Router (Debezium 3.7 docs)
      url: https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html
      verifiedOn: 2026-10-22
  - id: producer-perf-test-term
    term: kafka-producer-perf-test.sh
    aka: []
    definition: A load-test tool shipped with Kafka that sends a set number of records and prints throughput and latency percentiles.
    see: kafka-performance-tuning
    source:
      title: "Upgrading to 4.2.0: kafka-producer-perf-test.sh options, KIP-1147 (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/getting-started/upgrade/
      verifiedOn: 2026-10-22
  - id: super-users-term
    term: Super user
    aka:
      - super users
      - super.users
    definition: A principal listed in super.users that may do anything; with the authorizer on, it is the only one allowed on a resource with no ACL.
    see: kafka-security
    source:
      title: Authorization and ACLs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/security/authorization-and-acls/
      verifiedOn: 2026-10-22
  - id: record-metadata-term
    term: RecordMetadata
    aka: []
    definition: "What a successful send() returns through its Future or callback: the topic, partition and offset the record got (offset -1 with acks=0)."
    see: producer-basics
    source:
      title: KafkaProducer and RecordMetadata (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html
      verifiedOn: 2026-10-22
  - id: producer-config-exception-term
    term: ConfigException (producer)
    aka: []
    definition: The error a KafkaProducer raises at creation when settings conflict, for example enable.idempotence=true with acks=1.
    see: idempotent-producer
    source:
      title: "ProducerConfig.java: idempotence validation (Apache Kafka 4.3 source)"
      url: https://github.com/apache/kafka/blob/4.3/clients/src/main/java/org/apache/kafka/clients/producer/ProducerConfig.java
      verifiedOn: 2026-10-22
  - id: last-stable-offset
    term: Last stable offset
    aka:
      - LSO
    definition: The offset before the first still-open transaction; read_committed consumers read only up to it.
    see: kafka-transactions
    source:
      title: "Consumer Configs: isolation.level (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-22
  - id: read-process-write
    term: Read-process-write
    aka:
      - consume-transform-produce
    definition: A service that reads records from one topic, processes them and writes results to another topic.
    see: kafka-transactions
    source:
      title: "Design: Using Transactions (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-22
  - id: fenced-broker
    term: Fenced broker
    definition: A broker the controller treats as offline because it sent no heartbeat within broker.session.timeout.ms (9 s, Kafka 4.3).
    see: fault-tolerance
    source:
      title: "Broker Configs: broker.session.timeout.ms (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-22
  - id: reset-offsets-dry-run
    term: Dry run (--reset-offsets)
    aka:
      - --dry-run
    definition: "The preview mode of kafka-consumer-groups.sh --reset-offsets: it prints the new offsets and changes nothing; --execute applies them."
    see: replay
    source:
      title: "Basic Kafka Operations: reset offsets of a consumer group (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-22
