terms:
  - id: apache-kafka
    term: Apache Kafka
    aka: []
    definition: "A distributed event streaming platform: apps publish, store and process streams of events."
    see: what-is-kafka
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: event-streaming-platform
    term: Event streaming platform
    aka:
      - event streaming
    definition: Software that captures events in real time, stores them durably, and lets apps process and route them.
    see: what-is-kafka
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: commit-log
    term: Commit log
    aka:
      - append-only log
    definition: An ordered sequence of records that only grows at the end; each Kafka partition is one.
    see: what-is-kafka
    source:
      title: Protocol guide (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/protocol/
      verifiedOn: 2026-10-20
  - id: publish-subscribe
    term: Publish-subscribe
    aka:
      - pub/sub
      - publish/subscribe
      - pub-sub
    definition: Messaging where publishers write to a named stream and every subscriber gets the events; neither knows the other.
    see: what-is-kafka
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: fan-out
    term: Fan-out
    aka:
      - fanout
    definition: Delivering one event to many readers; in Kafka, every consumer group reads every event.
    see: what-is-kafka
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: event-driven-architecture
    term: Event-driven architecture
    aka:
      - event-driven
      - EDA
    definition: A design where each service publishes an event when its data changes and other services subscribe and react.
    see: what-is-kafka
    source:
      title: "Pattern: Event-driven architecture (microservices.io, Chris Richardson)"
      url: https://microservices.io/patterns/data/event-driven-architecture.html
      verifiedOn: 2026-10-20
  - id: kafka-broker
    term: Broker (Kafka)
    aka:
      - Kafka broker
      - Kafka brokers
      - brokers
    definition: A Kafka server that stores partition replicas and serves produce, fetch and metadata requests.
    see: kafka-architecture
    source:
      title: Kafka protocol guide (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/protocol/
      verifiedOn: 2026-10-20
  - id: kafka-cluster
    term: Kafka cluster
    aka: []
    definition: A set of Kafka servers, brokers and controllers, working together; it can span data centres.
    see: kafka-architecture
    source:
      title: Introduction (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: bootstrap-servers
    term: bootstrap.servers
    aka:
      - bootstrap servers
    definition: "Client setting: host:port pairs for the first connection; the client then discovers every broker."
    see: kafka-architecture
    source:
      title: Producer Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: client-metadata
    term: Client metadata (Kafka)
    aka:
      - metadata request
    definition: "What any broker tells a client: topics, partitions, each partition's leader and broker addresses."
    see: kafka-architecture
    source:
      title: Protocol guide (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/protocol/
      verifiedOn: 2026-10-20
  - id: kafka-controller
    term: Controller (Kafka)
    aka:
      - Kafka controller
      - KRaft controller
      - controllers
    definition: A server that manages cluster metadata such as topics, partitions and leaders, separate from data requests.
    see: kafka-architecture
    source:
      title: KRaft vs ZooKeeper (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/zk2kraft/
      verifiedOn: 2026-10-20
  - id: advertised-listeners
    term: advertised.listeners
    aka: []
    definition: "Broker setting: the addresses given to clients and other brokers; listeners is used when unset."
    see: kafka-architecture
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: internal-topic
    term: Internal topic (Kafka)
    aka:
      - internal topics
      - internal topic
    definition: A topic Kafka creates for its own state, such as __consumer_offsets or __cluster_metadata.
    see: kafka-architecture
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: kraft-term
    term: KRaft
    aka:
      - KRaft mode
    definition: "Kafka's metadata mode: a Raft quorum of controllers keeps metadata in a log; the only mode since 4.0."
    see: kraft
    source:
      title: Upgrading (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/upgrade/
      verifiedOn: 2026-10-20
  - id: zookeeper
    term: Apache ZooKeeper
    aka:
      - ZooKeeper
      - ZooKeeper mode
    definition: A separate coordination service that held Kafka's metadata before KRaft; removed in Kafka 4.0.
    see: kraft
    source:
      title: Upgrading (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/upgrade/
      verifiedOn: 2026-10-20
  - id: raft
    term: Raft (consensus)
    aka:
      - Raft protocol
      - Raft algorithm
    definition: "A consensus algorithm: nodes elect a leader that replicates a log, and a majority must be up."
    see: kraft
    source:
      title: "KIP-500: Replace ZooKeeper with a Self-Managed Metadata Quorum"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-500%3A+Replace+ZooKeeper+with+a+Self-Managed+Metadata+Quorum
      verifiedOn: 2026-10-20
  - id: controller-quorum
    term: Controller quorum
    aka:
      - metadata quorum
      - KRaft quorum
    definition: The KRaft controllers that replicate the metadata log; a majority must be alive.
    see: kraft
    source:
      title: KRaft operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/kraft/
      verifiedOn: 2026-10-20
  - id: cluster-metadata
    term: __cluster_metadata
    aka: []
    definition: "The KRaft metadata log: every change to topics, partitions, ISRs and configs, in order."
    see: kraft
    source:
      title: "KIP-500: Replace ZooKeeper with a Self-Managed Metadata Quorum"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-500%3A+Replace+ZooKeeper+with+a+Self-Managed+Metadata+Quorum
      verifiedOn: 2026-10-20
  - id: process-roles
    term: process.roles
    aka: []
    definition: "KRaft setting per server: broker, controller, or broker,controller for a combined server."
    see: kraft
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: active-controller
    term: Active controller
    aka: []
    definition: The controller that leads the metadata log; the other controllers are hot standbys.
    see: kraft
    source:
      title: KRaft operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/kraft/
      verifiedOn: 2026-10-20
  - id: combined-mode-term
    term: Combined mode (KRaft)
    aka:
      - combined mode
      - combined server
    definition: One server acting as both broker and controller; fine for development, not for critical production.
    see: kraft
    source:
      title: KRaft operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/kraft/
      verifiedOn: 2026-10-20
  - id: zk-to-kraft-migration
    term: ZooKeeper to KRaft migration
    aka:
      - KRaft migration
    definition: Moving a ZooKeeper-mode cluster to KRaft on a bridge release (the last is 3.9); required before Kafka 4.x.
    see: kraft
    source:
      title: KRaft operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/kraft/
      verifiedOn: 2026-10-20
  - id: message-queue
    term: Message queue
    aka:
      - message queues
      - traditional queue
    definition: A broker queue that gives each message to one consumer and deletes it once processed.
    see: kafka-vs-alternatives
    source:
      title: Streams and queues (RabbitMQ docs)
      url: https://www.rabbitmq.com/docs/streams
      verifiedOn: 2026-10-20
  - id: rabbitmq
    term: RabbitMQ
    aka: []
    definition: "A message broker: exchanges route messages to queues or streams, and consumers acknowledge them."
    see: kafka-vs-alternatives
    source:
      title: Exchanges (RabbitMQ docs)
      url: https://www.rabbitmq.com/docs/exchanges
      verifiedOn: 2026-10-20
  - id: redis
    term: Redis
    aka: []
    definition: An in-memory data store, often used for caching and counters.
    see: kafka-vs-alternatives
    source:
      title: Redis Strings (Redis docs)
      url: https://redis.io/docs/latest/develop/data-types/strings/
      verifiedOn: 2026-10-20
  - id: kafka-topic
    term: Kafka topic
    definition: A named stream of events, split into partitions, that producers write to and consumers read.
    see: topics
    source:
      title: "Introduction: main concepts and terminology (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: kafka-partition
    term: Partition (Kafka)
    aka:
      - Kafka partition
      - topic partition
    definition: One ordered, append-only log of a topic; the unit of order, parallelism and replication.
    see: partitions
    source:
      title: "Introduction: main concepts and terminology (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: kafka-offset
    term: Offset (Kafka)
    aka:
      - Kafka offset
      - record offset
    definition: The number of a record inside one partition; unique only within that partition.
    see: offsets
    source:
      title: KafkaConsumer (Apache Kafka 4.3 Javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: partition-key-term
    term: Partition key
    aka:
      - message key
      - record key
    definition: The record key the producer hashes to choose a partition; the same key goes to the same partition.
    see: partition-keys
    source:
      title: "Producer Configs: partitioner.class (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: default-partitioner
    term: Default partitioner
    aka:
      - built-in partitioner
    definition: "The producer logic used when partitioner.class is unset: hash the key, or a sticky partition without one."
    see: partition-keys
    source:
      title: "Producer Configs: partitioner.class (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: sticky-partitioning
    term: Sticky partitioning
    aka:
      - sticky partitioner
    definition: For records without a key, the producer fills one partition until batch.size bytes, then switches (Kafka 3.3+).
    see: partition-keys
    source:
      title: "Producer Configs: partitioner.class (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: round-robin-partitioner
    term: RoundRobinPartitioner
    definition: An opt-in partitioner that sends each record to the next partition in turn, ignoring keys.
    see: partition-keys
    source:
      title: "Producer Configs: partitioner.class (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: custom-partitioner
    term: Custom partitioner
    aka:
      - Partitioner interface
    definition: Your own class implementing Partitioner, set with partitioner.class, to choose partitions by your rules.
    see: partition-keys
    source:
      title: "Producer Configs: partitioner.class (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: murmur2-hash
    term: murmur2
    aka:
      - murmur2 hash
    definition: The hash the Java producer applies to the key bytes; the result mod partition count picks the partition.
    see: partition-keys
    source:
      title: "BuiltInPartitioner.java: murmur2 key hashing (Apache Kafka 4.3 source)"
      url: https://github.com/apache/kafka/blob/4.3/clients/src/main/java/org/apache/kafka/clients/producer/internals/BuiltInPartitioner.java
      verifiedOn: 2026-10-20
  - id: hot-partition
    term: Hot partition
    aka:
      - hot partitions
    definition: A partition that gets far more data than the others, usually because one key is very busy.
    see: partition-keys
    source:
      title: "Apache Kafka Partition Key: hot partitions (Confluent)"
      url: https://www.confluent.io/learn/kafka-partition-key/
      verifiedOn: 2026-10-20
  - id: append-only-log
    term: Append-only log
    definition: A log that only grows at the end; records are never changed in place. Each partition is one.
    see: log-storage
    source:
      title: "Implementation: Log (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/implementation/log/
      verifiedOn: 2026-10-20
  - id: log-segment
    term: Log segment
    aka:
      - segment file
    definition: One file of a partition log, named by its first offset; retention deletes whole segments.
    see: log-storage
    source:
      title: "Implementation: Log (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/implementation/log/
      verifiedOn: 2026-10-20
  - id: active-segment
    term: Active segment
    definition: "The newest segment of a partition: all writes go to it and it is never compacted."
    see: log-storage
    source:
      title: Design (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: retention-ms
    term: retention.ms
    aka:
      - log.retention.hours
    definition: "Topic config: how long records are kept before old segments are deleted; 7 days by default (Kafka 4.3)."
    see: log-storage
    source:
      title: Topic Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/topic-configs/
      verifiedOn: 2026-10-20
  - id: retention-bytes
    term: retention.bytes
    definition: "Topic config: the size one partition may reach before old segments go; -1, no limit, by default."
    see: log-storage
    source:
      title: Topic Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/topic-configs/
      verifiedOn: 2026-10-20
  - id: cleanup-policy
    term: cleanup.policy
    definition: "Topic config: delete (default) drops old segments, compact keeps the latest value per key, or both."
    see: log-storage
    source:
      title: Topic Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/topic-configs/
      verifiedOn: 2026-10-20
  - id: log-compaction
    term: Log compaction
    aka:
      - compacted topic
    definition: Cleanup that keeps at least the latest record for each key in a partition and removes older ones.
    see: log-storage
    source:
      title: Design (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: tombstone-record
    term: Tombstone (Kafka)
    aka:
      - tombstone record
      - tombstone
    definition: A record with a key and a null value; in a compacted topic it deletes that key.
    see: log-storage
    source:
      title: Design (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: tiered-storage
    term: Tiered storage
    aka:
      - remote storage tier
    definition: Brokers keep recent segments locally and move closed ones to remote storage such as S3 (KIP-405).
    see: log-storage
    source:
      title: Tiered Storage (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/operations/tiered-storage/
      verifiedOn: 2026-10-20
  - id: log-start-offset
    term: Log-start offset
    aka:
      - log start offset
    definition: The first offset still kept in a partition; it moves forward as old segments are deleted.
    see: offsets
    source:
      title: "Monitoring: LogStartOffset and LogEndOffset (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/operations/monitoring/
      verifiedOn: 2026-10-20
  - id: log-end-offset
    term: Log-end offset
    aka:
      - log end offset
      - LOG-END-OFFSET
    definition: The end of a partition log, where the next record is written; lag is measured against it.
    see: offsets
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: high-watermark
    term: High watermark
    definition: The offset after the last record copied to all in-sync replicas; consumers read only below it.
    see: offsets
    source:
      title: KafkaConsumer (Apache Kafka 4.3 Javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: consumer-position
    term: Consumer position
    definition: "The offset of the next record a consumer will receive: one more than the highest it has seen."
    see: offsets
    source:
      title: KafkaConsumer (Apache Kafka 4.3 Javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: kafka-topics-sh
    term: kafka-topics.sh
    definition: The Kafka command-line tool to create, describe, alter and delete topics.
    see: topics
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: kafka-console-producer-sh
    term: kafka-console-producer.sh
    aka:
      - console producer
    definition: The Kafka command-line tool that sends each line you type, or pipe in, as a record to a topic.
    see: kafka-code-templates
    source:
      title: Quick Start (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/quickstart/
      verifiedOn: 2026-10-20
  - id: kafka-console-consumer-sh
    term: kafka-console-consumer.sh
    aka:
      - console consumer
    definition: The Kafka command-line tool that reads a topic and prints its records; --from-beginning starts at the oldest.
    see: kafka-code-templates
    source:
      title: Quick Start (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/getting-started/quickstart/
      verifiedOn: 2026-10-20
  - id: replay-term
    term: Replay (Kafka)
    aka:
      - event replay
      - replaying events
    definition: Reading retained records again by moving a consumer group's offsets back.
    see: replay
    source:
      title: Design (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: seek-term
    term: seek()
    aka:
      - consumer seek
      - seekToBeginning
    definition: KafkaConsumer method that sets the offset the next poll() reads from in a partition.
    see: replay
    source:
      title: KafkaConsumer (Apache Kafka 4.3 Javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: offset-reset
    term: Offset reset
    aka:
      - reset offsets
      - --reset-offsets
    definition: Moving a stopped consumer group's committed offsets, e.g. with kafka-consumer-groups.sh --reset-offsets.
    see: replay
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: kafka-producer-term
    term: Kafka producer
    aka:
      - Kafka producers
      - KafkaProducer
    definition: A client that publishes records to Kafka topics, picking each record's partition and batching the sends.
    see: producer-basics
    source:
      title: KafkaProducer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html
      verifiedOn: 2026-10-20
  - id: producer-record-term
    term: ProducerRecord
    aka: []
    definition: "The Java object a producer sends: topic, optional partition, key, value, headers and timestamp."
    see: producer-basics
    source:
      title: ProducerRecord (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/ProducerRecord.html
      verifiedOn: 2026-10-20
  - id: record-headers-term
    term: Record headers
    aka:
      - record header
      - Kafka headers
    definition: Optional metadata attached to a record beside its key and value.
    see: producer-basics
    source:
      title: ProducerRecord (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/ProducerRecord.html
      verifiedOn: 2026-10-20
  - id: record-timestamp-term
    term: Record timestamp
    aka:
      - CreateTime
      - LogAppendTime
    definition: "A record's time: set by the producer (CreateTime) or by the broker when it appends (LogAppendTime)."
    see: producer-basics
    source:
      title: ProducerRecord (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/ProducerRecord.html
      verifiedOn: 2026-10-20
  - id: kafka-serializer-term
    term: Serializer (Kafka)
    aka:
      - key.serializer
      - value.serializer
      - Kafka serializer
    definition: A class that turns a key or value object into bytes before sending, such as StringSerializer.
    see: producer-basics
    source:
      title: KafkaProducer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html
      verifiedOn: 2026-10-20
  - id: send-callback-term
    term: Send callback
    aka:
      - producer callback
    definition: Code passed to send() that runs when the write succeeds or fails, with metadata or an exception.
    see: producer-basics
    source:
      title: KafkaProducer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html
      verifiedOn: 2026-10-20
  - id: acks-term
    term: acks (producer)
    aka:
      - acks
    definition: "Producer setting for which replicas must confirm a write before it counts as sent: 0, 1 or all."
    see: producer-acks
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: batch-size-term
    term: batch.size
    aka: []
    definition: The upper limit, in bytes, of one producer batch for one partition.
    see: batching-and-compression
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: linger-ms-term
    term: linger.ms
    aka: []
    definition: How long the producer waits for more records before sending a batch that is not yet full.
    see: batching-and-compression
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: buffer-memory-term
    term: buffer.memory
    aka: []
    definition: The total memory a producer may use to hold records that are waiting to be sent.
    see: batching-and-compression
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: compression-type-term
    term: compression.type
    aka: []
    definition: The codec for record batches (none, gzip, snappy, lz4 or zstd), set on the producer or the topic.
    see: batching-and-compression
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: idempotent-producer-term
    term: Idempotent producer
    aka:
      - producer idempotence
    definition: A producer whose retries cannot write duplicates, thanks to a producer id and sequence numbers.
    see: idempotent-producer
    source:
      title: "Design: message delivery semantics (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: producer-id-term
    term: Producer ID
    aka:
      - PID
    definition: A unique id each new producer gets at start-up, used by brokers to spot duplicate batches.
    see: idempotent-producer
    source:
      title: "KIP-98: Exactly Once Delivery and Transactional Messaging"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-98+-+Exactly+Once+Delivery+and+Transactional+Messaging
      verifiedOn: 2026-10-20
  - id: producer-sequence-number-term
    term: Sequence number (producer)
    aka:
      - sequence number
      - sequence numbers
    definition: A per-partition counter on a producer's writes; the broker rejects a number it has already seen as a duplicate.
    see: idempotent-producer
    source:
      title: "KIP-98: Exactly Once Delivery and Transactional Messaging"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-98+-+Exactly+Once+Delivery+and+Transactional+Messaging
      verifiedOn: 2026-10-20
  - id: enable-idempotence-term
    term: enable.idempotence
    aka: []
    definition: Producer setting that turns idempotence on; true by default since Kafka 3.0.
    see: idempotent-producer
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: max-in-flight-term
    term: max.in.flight.requests.per.connection
    aka:
      - max.in.flight
    definition: The most unacknowledged requests a client sends on one connection; at most 5 for idempotence.
    see: idempotent-producer
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: producer-retries-term
    term: retries (producer)
    aka:
      - producer retries
    definition: How many times the producer resends a record after a transient error, within delivery.timeout.ms.
    see: producer-configs
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: delivery-timeout-term
    term: delivery.timeout.ms
    aka: []
    definition: The upper bound on the time to report a send's success or failure, retries included.
    see: producer-configs
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: request-timeout-term
    term: request.timeout.ms
    aka: []
    definition: How long a client waits for one broker response before it retries or fails the request.
    see: producer-configs
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: max-block-term
    term: max.block.ms
    aka: []
    definition: How long send() and some other producer calls may block, for example waiting for metadata.
    see: producer-configs
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: client-id-term
    term: client.id
    aka: []
    definition: A name the client sends with its requests so broker logs show which application made them.
    see: producer-configs
    source:
      title: Producer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: kafka-consumer-term
    term: Kafka consumer
    aka:
      - KafkaConsumer
    definition: A client that reads records from Kafka partitions by pulling them with poll().
    see: consumer-basics
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: poll-loop
    term: Poll loop
    aka:
      - poll() loop
    definition: "The consumer's main loop: poll a batch, process it, commit the offsets, poll again."
    see: consumer-basics
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: deserializer-kafka
    term: Deserializer (Kafka)
    aka:
      - key.deserializer
      - value.deserializer
      - deserializers
    definition: Turns the bytes of a record's key or value back into an object; it must match the serializer.
    see: consumer-basics
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: consumer-group-term
    term: Consumer group
    aka:
      - consumer groups
    definition: Consumers that share one group.id; each partition of the topic goes to exactly one of them.
    see: consumer-groups
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: group-id-term
    term: group.id
    definition: Consumer config that names the group a consumer joins; the same id means shared work.
    see: consumer-groups
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: group-coordinator-term
    term: Group coordinator
    definition: The broker that manages a group's members and stores its committed offsets.
    see: consumer-groups
    source:
      title: "Distribution: consumer offset tracking (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/implementation/distribution/
      verifiedOn: 2026-10-20
  - id: consumer-offsets-term
    term: __consumer_offsets
    definition: The compacted internal topic where the group coordinator stores committed offsets.
    see: offset-commits
    source:
      title: "Distribution: consumer offset tracking (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/implementation/distribution/
      verifiedOn: 2026-10-20
  - id: committed-offset-term
    term: Committed offset
    aka:
      - committed offsets
    definition: The saved offset of the next record a group will read in a partition.
    see: offset-commits
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: auto-commit-term
    term: Auto commit (Kafka)
    aka:
      - auto commit
      - auto-commit
      - enable.auto.commit
    definition: Consumer mode where the client commits the offsets poll() returned, on a timer (auto.commit.interval.ms).
    see: offset-commits
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: commitsync-term
    term: commitSync()
    aka:
      - commitSync
    definition: "Blocking commit: waits until the commit succeeds or fails with an unrecoverable error."
    see: offset-commits
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: commitasync-term
    term: commitAsync()
    aka:
      - commitAsync
    definition: Non-blocking commit; errors go to an optional callback.
    see: offset-commits
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: rebalance-term
    term: Rebalance (consumer group)
    aka:
      - rebalance
      - rebalances
      - rebalancing
    definition: Reassigning a group's partitions among its members after members or partitions change.
    see: rebalancing
    source:
      title: KafkaConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: eager-rebalancing-term
    term: Eager rebalancing
    aka:
      - eager rebalance
    definition: Rebalance style where every member gives up all its partitions before they are reassigned.
    see: rebalancing
    source:
      title: ConsumerRebalanceListener (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/ConsumerRebalanceListener.html
      verifiedOn: 2026-10-20
  - id: cooperative-rebalancing-term
    term: Cooperative rebalancing
    aka:
      - incremental cooperative rebalancing
      - cooperative rebalance
    definition: Rebalance style that revokes only the partitions that move; the rest keep processing.
    see: rebalancing
    source:
      title: ConsumerRebalanceListener (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/ConsumerRebalanceListener.html
      verifiedOn: 2026-10-20
  - id: partition-assignor-term
    term: Partition assignor
    aka:
      - partition.assignment.strategy
      - assignors
    definition: A client plugin that decides which consumer gets which partition in the classic protocol.
    see: rebalancing
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: static-membership-term
    term: Static membership
    aka:
      - group.instance.id
      - static member
    definition: A consumer with a fixed group.instance.id keeps its partitions across a quick restart.
    see: rebalancing
    source:
      title: "Design: static membership (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: consumer-protocol-term
    term: Consumer group protocol (KIP-848)
    aka:
      - KIP-848
      - group.protocol
      - consumer rebalance protocol
    definition: Broker-driven, incremental rebalance protocol; GA since Kafka 4.0, chosen with group.protocol=consumer.
    see: rebalancing
    source:
      title: Consumer Rebalance Protocol (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/operations/consumer-rebalance-protocol/
      verifiedOn: 2026-10-20
  - id: session-timeout-term
    term: session.timeout.ms
    definition: How long the coordinator waits without heartbeats before it declares a consumer dead.
    see: rebalancing
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: consumer-heartbeat-term
    term: Heartbeat (consumer)
    aka:
      - heartbeat.interval.ms
      - consumer heartbeats
    definition: A regular signal from a consumer to the group coordinator that it is still alive.
    see: rebalancing
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: max-poll-interval-term
    term: max.poll.interval.ms
    definition: The longest allowed gap between poll() calls before the consumer leaves the group.
    see: consumer-basics
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: rebalance-listener-term
    term: ConsumerRebalanceListener
    aka:
      - onPartitionsRevoked
      - onPartitionsAssigned
    definition: Callback run when partitions are revoked or assigned; used to commit offsets or save state.
    see: rebalancing
    source:
      title: ConsumerRebalanceListener (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/ConsumerRebalanceListener.html
      verifiedOn: 2026-10-20
  - id: consumer-lag-term
    term: Consumer lag
    aka:
      - consumer group lag
    definition: "How far a group is behind: log-end offset minus committed offset, per partition."
    see: consumer-lag
    source:
      title: "Basic Kafka Operations: checking consumer position (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: consumer-groups-tool-term
    term: kafka-consumer-groups.sh
    definition: Command-line tool to list, describe and delete consumer groups and to show their lag.
    see: consumer-lag
    source:
      title: "Basic Kafka Operations: checking consumer position (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: backpressure-term
    term: Backpressure
    aka:
      - back-pressure
    definition: Coping with a consumer slower than its producer; Kafka's retained log lets the consumer fall behind safely.
    see: consumer-lag
    source:
      title: "Design: push vs. pull (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: share-group-term
    term: Share group
    aka:
      - share groups
      - Queues for Kafka
      - KIP-932
    definition: Group type where consumers share partitions and acknowledge records one by one; production-ready since Kafka 4.2.
    see: share-groups
    source:
      title: "Upgrading: notable changes in 4.2 (Apache Kafka 4.3)"
      url: https://kafka.apache.org/43/getting-started/upgrade/
      verifiedOn: 2026-10-20
  - id: share-consumer-term
    term: KafkaShareConsumer
    aka:
      - share consumer
      - share consumers
    definition: The Java client class that reads from a share group.
    see: share-groups
    source:
      title: KafkaShareConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaShareConsumer.html
      verifiedOn: 2026-10-20
  - id: acquisition-lock-term
    term: Acquisition lock
    aka:
      - acquisition locks
    definition: A time-limited lock that reserves a record for one share consumer; it is released when time runs out.
    see: share-groups
    source:
      title: KafkaShareConsumer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaShareConsumer.html
      verifiedOn: 2026-10-20
  - id: delivery-count-term
    term: Delivery count (share group)
    aka:
      - delivery count
      - share.delivery.count.limit
    definition: How many times a share group has delivered a record; a limit stops endless redelivery.
    see: share-groups
    source:
      title: Group Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/group-configs/
      verifiedOn: 2026-10-20
  - id: auto-offset-reset-term
    term: auto.offset.reset
    definition: "Where a group starts with no valid committed offset: latest, earliest, by_duration or none."
    see: consumer-configs
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: max-poll-records-term
    term: max.poll.records
    definition: The most records one poll() call returns; it does not change how much is fetched.
    see: consumer-configs
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: fetch-min-bytes-term
    term: fetch.min.bytes
    aka:
      - fetch.max.wait.ms
    definition: The least data a broker gathers before answering a fetch, waiting at most fetch.max.wait.ms.
    see: consumer-configs
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: client-rack-term
    term: client.rack
    definition: A consumer's rack id, matched with broker.rack so it can fetch from a nearby replica.
    see: consumer-configs
    source:
      title: Consumer and Share Consumer Configs (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: replication-factor
    term: Replication factor
    aka:
      - RF
    definition: How many copies of each partition exist, the leader included; set per topic.
    see: replication
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: partition-leader
    term: Partition leader
    aka:
      - leader replica
    definition: The one replica of a partition that takes all writes and, by default, serves reads.
    see: replication
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: follower-replica
    term: Follower replica
    aka:
      - follower replicas
    definition: A replica that fetches the leader's log and can become leader if it is in sync.
    see: replication
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: preferred-leader
    term: Preferred leader
    aka:
      - preferred replica
      - auto.leader.rebalance.enable
    definition: The first replica in a partition's list; Kafka moves leadership back to it by default.
    see: replication
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: follower-fetching
    term: Follower fetching
    aka:
      - fetch from follower
      - fetch from the closest replica
      - client.rack
    definition: Since Kafka 2.4, a consumer may read from a replica in its own rack, set by client.rack.
    see: replication
    source:
      title: "KIP-392: Allow consumers to fetch from closest replica"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-392%3A+Allow+consumers+to+fetch+from+closest+replica
      verifiedOn: 2026-10-20
  - id: isr
    term: In-sync replicas (ISR)
    aka:
      - ISR
      - in-sync replicas
      - in-sync replica
    definition: The leader plus the followers that are caught up; a new leader is chosen from them first.
    see: isr-and-min-insync
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: replica-lag-time-max-ms
    term: replica.lag.time.max.ms
    definition: How long a follower may stay behind before the leader drops it from the ISR; 30 s in Kafka 4.3.
    see: isr-and-min-insync
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: min-insync-replicas
    term: min.insync.replicas
    definition: The fewest in-sync replicas, leader included, an acks=all write needs; default 1 in Kafka 4.3.
    see: isr-and-min-insync
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: not-enough-replicas
    term: NotEnoughReplicas
    aka:
      - NotEnoughReplicasException
      - NotEnoughReplicasAfterAppend
    definition: Error an acks=all producer gets when the ISR is smaller than min.insync.replicas.
    see: isr-and-min-insync
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: eligible-leader-replicas
    term: Eligible leader replicas (ELR)
    aka:
      - ELR
      - eligible leader replicas
    definition: Replicas outside the ISR that are still safe to lead; since Kafka 4.0, default on new clusters from 4.1.
    see: isr-and-min-insync
    source:
      title: Eligible Leader Replicas (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/eligible-leader-replicas/
      verifiedOn: 2026-10-20
  - id: at-most-once-delivery
    term: At-most-once delivery
    aka:
      - at-most-once
      - at most once
    definition: Records may be lost but are never delivered twice.
    see: delivery-semantics
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: at-least-once-delivery
    term: At-least-once delivery
    aka:
      - at-least-once
      - at least once
    definition: Records are never lost but may be delivered twice; Kafka's default.
    see: delivery-semantics
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: exactly-once-semantics
    term: Exactly-once semantics (EOS)
    aka:
      - exactly-once
      - exactly once
      - EOS
    definition: Each record's effect happens once; in Kafka, via transactions for Kafka-to-Kafka processing.
    see: delivery-semantics
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: kafka-transaction-term
    term: Kafka transaction
    aka:
      - Kafka transactions
      - transactional producer
    definition: A group of writes to many partitions, plus consumer offsets, that all commit or all abort.
    see: kafka-transactions
    source:
      title: KafkaProducer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html
      verifiedOn: 2026-10-20
  - id: transactional-id
    term: transactional.id
    definition: Producer setting naming a stable transactional identity per instance; enables transactions and implies idempotence.
    see: kafka-transactions
    source:
      title: Producer Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/producer-configs/
      verifiedOn: 2026-10-20
  - id: transaction-coordinator
    term: Transaction coordinator
    definition: The broker that assigns producer ids and epochs and drives each transaction's commit or abort.
    see: kafka-transactions
    source:
      title: "KIP-98: Exactly Once Delivery and Transactional Messaging"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-98+-+Exactly+Once+Delivery+and+Transactional+Messaging
      verifiedOn: 2026-10-20
  - id: transaction-state-topic
    term: __transaction_state
    definition: Internal topic where the transaction coordinator stores the state of every transaction.
    see: kafka-transactions
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: isolation-level
    term: isolation.level
    definition: "Consumer setting: read_uncommitted (default in Kafka 4.3) or read_committed."
    see: kafka-transactions
    source:
      title: Consumer Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: read-committed
    term: read_committed
    aka:
      - read-committed
    definition: Isolation level where poll returns only committed transactional records, up to the last stable offset.
    see: kafka-transactions
    source:
      title: Consumer Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/consumer-configs/
      verifiedOn: 2026-10-20
  - id: zombie-fencing
    term: Zombie fencing
    aka:
      - zombie producer
      - ProducerFencedException
    definition: Bumping the producer epoch so an old instance with the same transactional.id can no longer write.
    see: kafka-transactions
    source:
      title: "KIP-98: Exactly Once Delivery and Transactional Messaging"
      url: https://cwiki.apache.org/confluence/display/KAFKA/KIP-98+-+Exactly+Once+Delivery+and+Transactional+Messaging
      verifiedOn: 2026-10-20
  - id: send-offsets-to-transaction
    term: sendOffsetsToTransaction
    definition: KafkaProducer method that adds consumed offsets to the current transaction; they commit only if it commits.
    see: kafka-transactions
    source:
      title: KafkaProducer (Apache Kafka 4.3 javadoc)
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html
      verifiedOn: 2026-10-20
  - id: leader-election
    term: Leader election (Kafka)
    aka:
      - leader election
    definition: The controller choosing a new partition leader from the ISR after the old leader's broker fails.
    see: fault-tolerance
    source:
      title: Design (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/design/design/
      verifiedOn: 2026-10-20
  - id: unclean-leader-election
    term: Unclean leader election
    aka:
      - unclean.leader.election.enable
    definition: Letting an out-of-sync replica become leader as a last resort; may lose data, so off by default.
    see: fault-tolerance
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: rack-awareness
    term: Rack awareness
    aka:
      - rack-aware replica placement
      - rack-aware
    definition: Placing a partition's replicas on different racks or zones so losing one rack does not lose every copy.
    see: fault-tolerance
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: broker-rack
    term: broker.rack
    definition: Broker setting naming its rack or zone; used for rack-aware placement and follower fetching.
    see: fault-tolerance
    source:
      title: Broker Configs (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/configuration/broker-configs/
      verifiedOn: 2026-10-20
  - id: controlled-shutdown
    term: Controlled shutdown
    aka:
      - controlled.shutdown.enable
    definition: A planned broker stop that syncs logs and moves leadership away first; on by default.
    see: fault-tolerance
    source:
      title: Basic Kafka Operations (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: mirrormaker-2
    term: MirrorMaker 2
    aka:
      - MirrorMaker
      - MM2
    definition: Kafka Connect based tool that copies topics, configs, group offsets and ACLs between clusters.
    see: fault-tolerance
    source:
      title: Geo-Replication (Cross-Cluster Data Mirroring) (Apache Kafka 4.3 docs)
      url: https://kafka.apache.org/43/operations/geo-replication-cross-cluster-data-mirroring/
      verifiedOn: 2026-10-20
  - id: retry-topic
    term: Retry topic
    aka:
      - retry topics
    definition: A topic that holds a failed record until its backoff delay passes, then lets it be processed again.
    see: retries-and-dead-letter-topics
    source:
      title: "Non-Blocking Retries: How the Pattern Works (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/retrytopic/how-the-pattern-works.html
      verifiedOn: 2026-10-20
  - id: dead-letter-topic
    term: Dead letter topic (DLT)
    aka:
      - dead letter topic
      - dead-letter topic
      - DLT
    definition: A topic for records that failed every attempt or cannot be processed, kept with headers about the error.
    see: retries-and-dead-letter-topics
    source:
      title: "Handling Exceptions: DeadLetterPublishingRecoverer (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html
      verifiedOn: 2026-10-20
  - id: poison-message
    term: Poison message
    aka:
      - poison pill
      - poison messages
    definition: A record that fails every time it is consumed; retried forever, it blocks its partition.
    see: retries-and-dead-letter-topics
    source:
      title: Can your Kafka consumers handle a poison pill? (Confluent blog)
      url: https://www.confluent.io/blog/spring-kafka-can-your-kafka-consumers-handle-a-poison-pill/
      verifiedOn: 2026-10-20
  - id: exponential-backoff
    term: Exponential backoff
    aka:
      - exponential back off
    definition: Waiting longer before each new retry, for example 1, 2, then 4 seconds.
    see: retries-and-dead-letter-topics
    source:
      title: "Non-Blocking Retries: How the Pattern Works (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/retrytopic/how-the-pattern-works.html
      verifiedOn: 2026-10-20
  - id: transient-error
    term: Transient error
    aka:
      - transient errors
    definition: A failure that may pass on its own, such as a timeout, so a later retry can succeed.
    see: retries-and-dead-letter-topics
    source:
      title: "Handling Exceptions: retryable and not-retryable exceptions (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html
      verifiedOn: 2026-10-20
  - id: permanent-error
    term: Permanent error
    aka:
      - permanent errors
    definition: A failure a retry cannot fix, such as a deserialisation error; send the record to the DLT at once.
    see: retries-and-dead-letter-topics
    source:
      title: "Handling Exceptions: not-retryable exceptions (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html
      verifiedOn: 2026-10-20
  - id: non-blocking-retries
    term: Non-blocking retries
    aka:
      - non-blocking retry
    definition: Retrying through delayed retry topics so the main partition keeps moving; per-key order is lost.
    see: retries-and-dead-letter-topics
    source:
      title: "Non-Blocking Retries: How the Pattern Works (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/retrytopic/how-the-pattern-works.html
      verifiedOn: 2026-10-20
  - id: blocking-retries
    term: Blocking retries
    aka:
      - blocking retry
    definition: Retrying a failed record in the consumer itself; later records in the partition wait, so order is kept.
    see: retries-and-dead-letter-topics
    source:
      title: "Handling Exceptions: DefaultErrorHandler (Spring for Apache Kafka 4.1 reference)"
      url: https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html
      verifiedOn: 2026-10-20
  - id: dlt-redrive
    term: Re-drive (DLT)
    aka:
      - re-drive
      - redrive
    definition: Moving records out of a dead letter topic or queue so they are processed again, after the fix.
    see: retries-and-dead-letter-topics
    source:
      title: "Using dead-letter queues in Amazon SQS: dead-letter queue redrive (AWS docs)"
      url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
      verifiedOn: 2026-10-20
  - id: global-ordering
    term: Global ordering
    aka:
      - global order
      - total order
    definition: One order for every record in a topic; Kafka gives it only with a single partition.
    see: ordering-and-scaling
    source:
      title: "KafkaConsumer: each partition goes to one consumer in a group (Apache Kafka 4.3 javadoc)"
      url: https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html
      verifiedOn: 2026-10-20
  - id: per-key-ordering
    term: Per-key ordering
    aka:
      - per-key order
    definition: Records with the same key keep their order, because they share one partition.
    see: ordering-and-scaling
    source:
      title: "Introduction: events with the same key go to the same partition (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/getting-started/introduction/
      verifiedOn: 2026-10-20
  - id: partition-count
    term: Partition count
    aka:
      - number of partitions
    definition: How many partitions a topic has; it caps a consumer group's parallelism and can grow but not shrink.
    see: ordering-and-scaling
    source:
      title: "Basic Kafka Operations: adding and modifying topics (Apache Kafka 4.3 docs)"
      url: https://kafka.apache.org/43/operations/basic-kafka-operations/
      verifiedOn: 2026-10-20
  - id: idempotent-consumer-term
    term: Idempotent consumer
    aka:
      - idempotent consumer
      - idempotent processing
    definition: A consumer that gives the same result when it handles one record twice.
    see: idempotent-consumers
    source:
      title: "Pattern: Idempotent Consumer (microservices.io)"
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      verifiedOn: 2026-10-20
  - id: idempotency-key
    term: Idempotency key
    aka:
      - idempotency keys
    definition: A unique id carried with an event, such as eventId, that lets the receiver spot a repeat.
    see: idempotent-consumers
    source:
      title: "Pattern: Idempotent Consumer: track message ids (microservices.io)"
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      verifiedOn: 2026-10-20
  - id: deduplication
    term: Deduplication
    aka:
      - dedupe
      - de-duplication
    definition: Detecting a repeated record, usually by its id, and discarding it.
    see: idempotent-consumers
    source:
      title: "Pattern: Idempotent Consumer (microservices.io)"
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      verifiedOn: 2026-10-20
  - id: processed-events-table
    term: Processed-events table
    aka:
      - processed events table
      - processed-messages table
    definition: A table of handled event ids with a unique key, written in the same transaction as the effect.
    see: idempotent-consumers
    source:
      title: "Pattern: Idempotent Consumer: PROCESSED_MESSAGES table (microservices.io)"
      url: https://microservices.io/patterns/communication-style/idempotent-consumer.html
      verifiedOn: 2026-10-20
  - id: upsert
    term: Upsert
    aka:
      - upserts
    definition: Insert a row, or update it if the key already exists; in PostgreSQL, INSERT ... ON CONFLICT DO UPDATE.
    see: idempotent-consumers
    source:
      title: "INSERT: ON CONFLICT (PostgreSQL 18 docs)"
      url: https://www.postgresql.org/docs/current/sql-insert.html
      verifiedOn: 2026-10-20
  - id: dual-write
    term: Dual write
    aka:
      - dual writes
      - dual-write problem
    definition: Writing to a database and to Kafka as two steps; a failure between them leaves them out of step.
    see: transactional-outbox
    source:
      title: Reliable Microservices Data Exchange With the Outbox Pattern (Debezium blog)
      url: https://debezium.io/blog/2019/02/19/reliable-microservices-data-exchange-with-the-outbox-pattern/
      verifiedOn: 2026-10-20
  - id: transactional-outbox-term
    term: Transactional outbox
    aka:
      - outbox pattern
    definition: Storing an event in an outbox table in the same transaction as the data, then publishing it from there.
    see: transactional-outbox
    source:
      title: "Pattern: Transactional outbox (microservices.io)"
      url: https://microservices.io/patterns/data/transactional-outbox.html
      verifiedOn: 2026-10-20
  - id: outbox-table
    term: Outbox table
    definition: The table that holds events waiting to be published; Debezium's default columns include id, aggregateid and payload.
    see: transactional-outbox
    source:
      title: Outbox Event Router (Debezium 3.7 docs)
      url: https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html
      verifiedOn: 2026-10-20
  - id: message-relay
    term: Message relay
    aka:
      - outbox relay
    definition: The process that reads the outbox and publishes its events to the broker, by polling or log tailing.
    see: transactional-outbox
    source:
      title: "Pattern: Transactional outbox (microservices.io)"
      url: https://microservices.io/patterns/data/transactional-outbox.html
      verifiedOn: 2026-10-20
  - id: kafka-connect-term
    term: Kafka Connect
    definition: Apache Kafka's framework for streaming data between Kafka and other systems through connectors.
    see: kafka-connect
    source:
      title: Kafka Connect Overview (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/kafka-connect/overview/
      verifiedOn: 2026-10-20
  - id: source-connector
    term: Source connector
    aka:
      - source connectors
    definition: A connector that imports data from another system, such as a database, into Kafka topics.
    see: kafka-connect
    source:
      title: Kafka Connect Connector Development Guide (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/kafka-connect/connector-development-guide/
      verifiedOn: 2026-10-20
  - id: sink-connector
    term: Sink connector
    aka:
      - sink connectors
    definition: A connector that exports records from Kafka topics to another system, such as a search index.
    see: kafka-connect
    source:
      title: Kafka Connect Connector Development Guide (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/kafka-connect/connector-development-guide/
      verifiedOn: 2026-10-20
  - id: connect-worker
    term: Connect worker
    aka:
      - Connect workers
      - Kafka Connect worker
    definition: A Kafka Connect process that runs connectors and their tasks; distributed workers share the work.
    see: kafka-connect
    source:
      title: Kafka Connect User Guide (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/kafka-connect/user-guide/
      verifiedOn: 2026-10-20
  - id: connect-converter
    term: Converter (Kafka Connect)
    aka:
      - key.converter
      - value.converter
    definition: Turns Connect records into the bytes written to Kafka and back, for example as JSON or Avro.
    see: kafka-connect
    source:
      title: Kafka Connect User Guide (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/kafka-connect/user-guide/
      verifiedOn: 2026-10-20
  - id: single-message-transform
    term: Single message transform (SMT)
    aka:
      - single message transform
      - single message transforms
      - SMT
      - SMTs
    definition: A small per-record change set in a connector's config, such as adding or masking a field.
    see: kafka-connect
    source:
      title: Kafka Connect User Guide (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/kafka-connect/user-guide/
      verifiedOn: 2026-10-20
  - id: debezium
    term: Debezium
    definition: CDC source connectors that read a database's change log and publish each row change to Kafka.
    see: kafka-connect
    source:
      title: Debezium Architecture (Debezium 3.7)
      url: https://debezium.io/documentation/reference/stable/architecture.html
      verifiedOn: 2026-10-20
  - id: change-data-capture
    term: Change data capture (CDC)
    aka:
      - change data capture
      - CDC
    definition: Capturing each committed insert, update and delete in a database as an event.
    see: kafka-connect
    source:
      title: Debezium connector for PostgreSQL (Debezium 3.7)
      url: https://debezium.io/documentation/reference/stable/connectors/postgresql.html
      verifiedOn: 2026-10-20
  - id: kafka-streams-term
    term: Kafka Streams
    definition: A Java client library for processing data in Kafka topics inside your own application.
    see: kafka-streams
    source:
      title: Kafka Streams Introduction (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/introduction/
      verifiedOn: 2026-10-20
  - id: kstream-term
    term: KStream
    definition: A Kafka Streams view of a topic where every record is a new, independent event.
    see: kafka-streams
    source:
      title: Kafka Streams DSL API (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/developer-guide/dsl-api/
      verifiedOn: 2026-10-20
  - id: ktable-term
    term: KTable
    definition: "A Kafka Streams view of a topic as a table: each record updates the latest value for its key."
    see: kafka-streams
    source:
      title: Kafka Streams DSL API (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/developer-guide/dsl-api/
      verifiedOn: 2026-10-20
  - id: globalktable-term
    term: GlobalKTable
    definition: Like a KTable, but every application instance holds the data of all the topic's partitions.
    see: kafka-streams
    source:
      title: Kafka Streams DSL API (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/developer-guide/dsl-api/
      verifiedOn: 2026-10-20
  - id: state-store
    term: State store
    aka:
      - state stores
    definition: Local storage in a Kafka Streams task for counts, aggregates and joins.
    see: kafka-streams
    source:
      title: Kafka Streams Core Concepts (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/core-concepts/
      verifiedOn: 2026-10-20
  - id: changelog-topic
    term: Changelog topic
    aka:
      - changelog topics
    definition: A compacted internal topic that records every state store update, used to restore the store.
    see: kafka-streams
    source:
      title: Kafka Streams Architecture (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/architecture/
      verifiedOn: 2026-10-20
  - id: exactly-once-v2
    term: exactly_once_v2
    aka:
      - EOS v2
      - exactly-once v2
    definition: The Kafka Streams processing.guarantee value for exactly-once processing; the default is at_least_once.
    see: kafka-streams
    source:
      title: Configuring a Streams Application (Apache Kafka 4.3)
      url: https://kafka.apache.org/43/streams/developer-guide/config-streams/
      verifiedOn: 2026-10-20
  - id: ksqldb
    term: ksqlDB
    definition: Confluent's streaming SQL database for Kafka; on Confluent Platform, Flink is now the recommended engine.
    source:
      title: ksqlDB for Confluent Platform (Confluent Platform 8.x)
      url: https://docs.confluent.io/platform/current/ksqldb/overview.html
      verifiedOn: 2026-10-20
  - id: apache-flink
    term: Apache Flink
    aka:
      - Flink
    definition: A distributed engine for stateful stream processing that runs on its own cluster.
    source:
      title: Flink Architecture (Apache Flink)
      url: https://flink.apache.org/what-is-flink/flink-architecture/
      verifiedOn: 2026-10-20
  - id: confluent-schema-registry
    term: Confluent Schema Registry
    aka:
      - Schema Registry
    definition: Confluent's separate service that stores versioned schemas for Kafka records and checks compatibility.
    see: schema-registry-and-serialization
    source:
      title: Schema Registry Concepts (Confluent Platform 8.x)
      url: https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html
      verifiedOn: 2026-10-20
  - id: apache-avro
    term: Apache Avro
    aka:
      - Avro
    definition: A binary serialisation format with schemas, widely used for Kafka events because it evolves well.
    see: schema-registry-and-serialization
    source:
      title: Apache Avro
      url: https://avro.apache.org/
      verifiedOn: 2026-10-20
  - id: protocol-buffers
    term: Protocol Buffers
    aka:
      - Protobuf
    definition: "A language-neutral binary format: define messages in .proto files and use the generated code."
    see: schema-registry-and-serialization
    source:
      title: Protocol Buffers overview (protobuf.dev)
      url: https://protobuf.dev/overview/
      verifiedOn: 2026-10-20
  - id: backward-compatibility
    term: Backward compatibility (schema)
    aka:
      - BACKWARD compatibility
      - BACKWARD mode
    definition: Consumers on the new schema can read data written with the previous one; the Confluent Schema Registry default.
    see: schema-registry-and-serialization
    source:
      title: Schema Evolution and Compatibility (Confluent Platform 8.x)
      url: https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html
      verifiedOn: 2026-10-20
  - id: schema-subject
    term: Subject (Schema Registry)
    aka:
      - schema subject
    definition: A named version history of schemas with its own compatibility setting, by default the topic name plus -value.
    see: schema-registry-and-serialization
    source:
      title: Schema Registry Concepts (Confluent Platform 8.x)
      url: https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html
      verifiedOn: 2026-10-20
  - id: spring-for-apache-kafka
    term: Spring for Apache Kafka
    aka:
      - spring-kafka
      - Spring Kafka
    definition: The Spring project that applies core Spring ideas to Kafka, with a template for sending and listener containers.
