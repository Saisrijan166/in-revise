      verifiedOn: 2026-10-20
  - id: default-error-handler
    term: DefaultErrorHandler
    definition: "Spring's container error handler: it redelivers a failed record with a back-off, then recovers it."
    see: spring-kafka
    source:
      title: Handling Exceptions (Spring for Apache Kafka 4.1)
