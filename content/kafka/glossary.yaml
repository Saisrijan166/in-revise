    definition: A Spring annotation that turns a method into a Kafka listener run by a listener container.
    see: spring-kafka
    source:
      title: "@KafkaListener Annotation (Spring for Apache Kafka 4.1)"
      url: https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages/listener-annotation.html
      verifiedOn: 2026-10-20
  - id: ackmode
    term: AckMode
    definition: The Spring listener container setting that decides when offsets are committed; BATCH by default.
