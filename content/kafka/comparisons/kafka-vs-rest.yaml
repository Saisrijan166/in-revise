id: kafka-vs-rest
tech: kafka
title: "Kafka vs REST"
compares: [kafka-option, rest-call-option]
gist:
  - "Fire an event; readers handle it later"
  - "Send a request; wait for the response"
rows:
  - { aspect: "Style", a: "Asynchronous: the producer does not wait for readers", b: "Synchronous: request, then response" }
  - { aspect: "Coupling", a: "The producer does not know who reads", b: "The caller knows the callee's URL" }
  - { aspect: "Receiver is down", a: "Events wait in the topic; read later", b: "The call fails or times out; the caller retries" }
  - { aspect: "Many receivers", a: "One write; every consumer group reads it", b: "One call per receiver" }
  - { aspect: "Reply", a: "None from the readers", b: "A status code and a body" }
verdict: "REST when the caller needs an answer now; Kafka to tell other services that something happened."
sources:
  - title: "Introduction: producers and consumers are decoupled (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/getting-started/introduction/"
    verifiedOn: "2026-10-20"
  - title: "RFC 9110: HTTP Semantics"
    url: "https://www.rfc-editor.org/rfc/rfc9110"
    verifiedOn: "2026-10-20"
