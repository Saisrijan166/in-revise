id: kafka-vs-redis
tech: kafka
title: "Kafka vs Redis"
compares: [kafka-option, redis-option]
gist:
  - "Durable, replicated event streams on disk"
  - "Fast in-memory data: cache and counters"
rows:
  - { aspect: "Main use", a: "Event streams that many services read and replay", b: "Caching and fast reads and writes of current values" }
  - { aspect: "Storage", a: "On disk, replicated, kept for the retention time", b: "In memory; optional disk snapshots (RDB) or append-only file (AOF)" }
  - { aspect: "Messaging", a: "Each consumer group reads every event, at its own pace", b: "Pub/Sub is at-most-once: an offline subscriber misses it" }
  - { aspect: "Log-like option", a: "Topics are the log", b: "Redis Streams: an append-only log with consumer groups" }
verdict: "Redis to cache and count fast; Kafka when events must be kept, replicated and replayed by many services."
sources:
  - title: "Introduction (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/getting-started/introduction/"
    verifiedOn: "2026-10-20"
  - title: "Pub/Sub delivery semantics (Redis docs)"
    url: "https://redis.io/docs/latest/develop/pubsub/"
    verifiedOn: "2026-10-20"
  - title: "Redis Streams (Redis docs)"
    url: "https://redis.io/docs/latest/develop/data-types/streams/"
    verifiedOn: "2026-10-20"
  - title: "Redis Strings: caching and counters (Redis docs)"
    url: "https://redis.io/docs/latest/develop/data-types/strings/"
    verifiedOn: "2026-10-20"
  - title: "Redis persistence (Redis docs)"
    url: "https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"
    verifiedOn: "2026-10-20"
