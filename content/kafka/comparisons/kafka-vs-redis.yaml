id: kafka-vs-redis
tech: kafka
title: "Kafka vs Redis"
compares: [kafka-option, redis-option]
gist:
  - "Durable, replicated event streams on disk"
  - "Fast in-memory data: cache and counters"
explain:
  - "Kafka stores event streams on disk, copied across brokers, for the retention time, so many services can read them and read them again."
  - "Redis is an in-memory data store. It serves current values, such as a cached page or a counter, very fast because they live in memory."
example: "The dashboard shows today's payment count: Redis increments a counter on each payment and returns it at once. Analytics needs every PaymentCompleted event, even after a two-hour outage: Kafka kept them on disk."
rows:
  - { aspect: "Main use", a: "Event streams that many services read and replay", b: "Caching and fast reads and writes of current values" }
  - { aspect: "Storage", a: "On disk, replicated, kept for the retention time", b: "In memory; optional disk snapshots (RDB) or append-only file (AOF)" }
  - { aspect: "Messaging", a: "Each consumer group reads every event, at its own pace", b: "Pub/Sub is at-most-once: an offline subscriber misses it" }
  - { aspect: "Log-like option", a: "Topics are the log", b: "Redis Streams: an append-only log with consumer groups" }
verdict: "Redis to cache and count fast; Kafka when events must be kept, replicated and replayed by many services."
sayIt: "Redis is an in-memory store for caching and fast counters; its Pub/Sub drops messages for offline subscribers. Kafka keeps durable, replicated event streams that many services read and replay. They often work side by side."
sources:
