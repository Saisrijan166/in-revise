id: at-most-once-vs-at-least-once-vs-exactly-once
tech: kafka
title: "At-Most-Once vs At-Least-Once vs Exactly-Once"
compares: [at-most-once, at-least-once, exactly-once]
gist:
  - "Commit, then process: may lose, never repeats"
  - "Process, then commit: never loses, may repeat"
  - "Output and offsets commit in one Kafka transaction"
explain:
  - "At-most-once: the consumer saves its offset before it processes the records. A crash in between skips them, so a record is handled once or not at all."
  - "At-least-once: the consumer processes the records first and commits after. A crash in between repeats them, so a record is never lost but may run twice."
  - "Exactly-once: for Kafka-to-Kafka work, the output records and the input offsets are committed together in one Kafka transaction, so a crash leaves no visible half result."
example: "The Notification service processes payments 4 to 6 and crashes. With at-most-once it had already committed 7, so those customers get no message. With at-least-once it had committed 4, so they get the message twice. Exactly-once does not apply, because sending a message is a side effect outside Kafka."
rows:
  - { aspect: "Order of steps", a: "Commit offset, then process", b: "Process, then commit offset", c: "Process; send output and offsets in one transaction" }
  - { aspect: "Crash in between", a: "Records skipped (lost)", b: "Records processed again", c: "Transaction aborts; no visible duplicate" }
  - { aspect: "How to get it", a: "No producer retries; commit first", b: "Kafka's default", c: "transactional.id + read_committed, or exactly_once_v2" }
  - { aspect: "Works for", a: "Any consumer", b: "Any consumer; make it idempotent", c: "Kafka-to-Kafka work only" }
  - { aspect: "Cost", a: "Lost records", b: "Duplicates to handle", c: "Extra latency and setup" }
verdict: "Default to at-least-once with idempotent consumers; use exactly-once for Kafka-to-Kafka pipelines, at-most-once only when an occasional loss is fine."
sayIt: "It depends on when the offset is saved. Commit before processing gives at-most-once, so records can be lost. Commit after gives at-least-once, so records can repeat. Exactly-once needs Kafka transactions and covers only Kafka-to-Kafka work, so I default to at-least-once with idempotent consumers."
sources:
  - title: "Design: Message Delivery Semantics and Using Transactions (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
  - title: "Kafka Streams Configs: processing.guarantee (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/configuration/kafka-streams-configs/"
    verifiedOn: "2026-10-20"
