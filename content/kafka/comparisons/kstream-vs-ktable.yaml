id: kstream-vs-ktable
tech: kafka
title: "KStream vs KTable vs GlobalKTable"
compares: [streams-kstream, streams-ktable, streams-globalktable]
gist:
  - "Every record is a new event"
  - "Latest value per key, from this instance's partitions"
  - "Latest value per key, from all partitions"
explain:
  - "A KStream reads a topic as a stream of events. Every record is a new fact, like an insert, so two payments for UPI are two separate events."
  - "A KTable reads a topic as a table: for each key it keeps only the latest value. Each instance holds the keys of its own partitions only."
  - "A GlobalKTable is also a latest-value table, but every app instance holds a full copy from all partitions, so small lookup data is local everywhere."
example: "The Analytics app reads payments as a KStream, because every payment counts. It reads payment-status, keyed by orderId, as a KTable, because only the current status matters. It joins each payment with a small merchants topic read as a GlobalKTable, so every instance can look up any merchant."
rows:
  - { aspect: "A record with a known key", a: "Is added, like an insert", b: "Replaces the old value (upsert)", c: "Replaces the old value (upsert)" }
  - { aspect: "Sum of (upi, 1) then (upi, 3)", a: "4", b: "3", c: "3" }
  - { aspect: "A null value", a: "A normal record", b: "Deletes the key (tombstone)", c: "Deletes the key (tombstone)" }
  - { aspect: "Each app instance holds", a: "Records of its partitions", b: "Its partitions' share of the table", c: "The whole table" }
  - { aspect: "Log compaction on the topic", a: "Unsafe: drops events", b: "Safe", c: "Safe" }
  - { aspect: "Typical use", a: "Payments, clicks, orders", b: "Balance or status per key", c: "Small lookup data in every instance" }
verdict: "KStream for every event, KTable for the latest value per key, GlobalKTable for small reference data that every instance needs for joins."
sayIt: "A KStream treats every record as a new event; a KTable keeps the latest value per key, so a new record replaces the old one and a null deletes it. A GlobalKTable is a KTable copied in full to every instance, which I use for small lookup data in joins."
sources:
