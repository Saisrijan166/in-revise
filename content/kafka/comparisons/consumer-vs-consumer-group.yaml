id: consumer-vs-consumer-group
tech: kafka
title: Consumer vs Consumer Group
compares: [consumer-basics, consumer-groups]
gist:
  - "One client that polls and processes records"
  - "Consumers sharing one group.id and the partitions"
explain:
  - "Consumer: one KafkaConsumer object in one process. It polls the partitions it was given, processes the records and tracks its position in memory."
  - "Consumer group: all consumers that share one group.id. Together they cover every partition of the topic, and the group's committed offsets say where it resumes."
example: "Three Notification instances are three consumers but one group, notification-service. Each reads one partition of payments; together the group reads every payment once. Analytics is a second group that reads every payment again."
rows:
  - { aspect: "Is", a: "One KafkaConsumer instance", b: "One logical subscriber made of many consumers" }
  - { aspect: "Reads", a: "The partitions the group gives it", b: "Every partition of the subscribed topics" }
  - { aspect: "Progress", a: "Its position: the next offset it will fetch", b: "Committed offsets, per partition" }
  - { aspect: "Scales by", a: "Faster processing only", b: "More members, up to the partition count" }
verdict: "Say consumer for one process; say group for who reads a topic and where it resumes."
sayIt: "A consumer is one client that polls and processes records. A consumer group is all the consumers with the same group.id: they split the partitions, and the group's committed offsets decide where reading resumes. Scaling means adding consumers to a group, up to the partition count."
sources:
  - title: "KafkaConsumer (Apache Kafka 4.3 javadoc)"
    url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html"
    verifiedOn: "2026-10-20"
