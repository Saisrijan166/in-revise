id: kafka-vs-message-queue
tech: kafka
title: "Kafka vs a Message Queue (RabbitMQ)"
compares: [kafka-option, message-queue-option]
gist:
  - "A log: events stay; each group reads at its own pace"
  - "A queue: each message goes to one consumer, then is gone"
explain:
  - "Kafka keeps events in a log for the retention time. Each consumer group reads every event at its own pace from its own position, and can go back to read again."
  - "A message queue such as RabbitMQ hands each message to one consumer, and deletes it once that consumer acknowledges it. It suits jobs that must be done once."
example: "PaymentCompleted must reach both Notification and Analytics: in Kafka, each service reads the payments topic with its own group. Generating one receipt PDF per payment is a job for one worker: a queue gives it to one worker and drops it after the ack."
diagrams:
  - |
    flowchart LR
      P[Producer] --> T[(Topic log)]
      T --> G1[Group A]
      T --> G2[Group B]
  - |
    flowchart LR
      P[Producer] --> X{{Exchange}}
      X --> Q[(Queue)]
      Q --> W[One consumer]
diagramAlt: "Kafka: a producer appends to a topic log and two consumer groups each read every event. Queue: a producer publishes to an exchange, which routes to a queue, and each message goes to one consumer."
rows:
  - { aspect: "After it is read", a: "Stays until retention ends", b: "Deleted once the consumer acks it" }
  - { aspect: "Delivery", a: "Consumers pull from their offset", b: "Broker pushes to subscribed consumers" }
  - { aspect: "Many readers", a: "Every consumer group gets every event", b: "One consumer per message; copies need an exchange and more queues" }
  - { aspect: "Replay", a: "Rewind the offset and read again", b: "Not after the ack (RabbitMQ streams can)" }
  - { aspect: "Routing", a: "By topic, and by key to a partition", b: "Exchanges route by routing key or pattern" }
  - { aspect: "Order", a: "Within a partition", b: "Within a queue, unless redelivered or prioritised" }
verdict: "Kafka for durable event streams many services read or replay; a queue for task work with per-message acks and routing."
sayIt: "A queue hands each message to one consumer and deletes it after the ack, so it fits task work. Kafka keeps an ordered log that many consumer groups pull and can replay, so it fits event streams. Kafka 4.2 share groups add queue-style reading."
