id: retention-vs-log-compaction
tech: kafka
title: Time/Size Retention vs Log Compaction
compares: [delete-policy, log-compaction]
gist:
  - "Drop whole old segments after a time or size limit"
  - "Keep the latest record per key, drop older ones"
explain:
  - "Retention (cleanup.policy=delete) keeps every event for a set time or size, then deletes whole old segments. It suits event history that readers may replay within a window."
  - "Log compaction (cleanup.policy=compact) keeps at least the latest event for each key and removes older events with the same key. It suits topics that hold the current state per key."
example: "payments uses delete with 14 days: every PaymentCompleted is kept for two weeks, then dropped. customer-addresses uses compact: if customer 7 moved three times, only the newest address event stays, so a new service can rebuild every customer's current address."
rows:
  - { aspect: "Setting", a: "cleanup.policy=delete (the default)", b: "cleanup.policy=compact" }
  - { aspect: "Removes", a: "Oldest segments past retention.ms or retention.bytes", b: "Older records whose key has a newer record" }
  - { aspect: "Keeps", a: "Everything inside the limit", b: "At least the last value of every key" }
  - { aspect: "Delete one key", a: "Not possible; wait for retention", b: "Write a tombstone: the key with a null value" }
  - { aspect: "Offsets and order", a: "Unchanged", b: "Unchanged; removed records leave gaps" }
  - { aspect: "Example topic", a: "payments history, page clicks", b: "Latest address per customerId" }
verdict: "Use delete for event history you replay within a window, compact for latest-state topics; delete,compact applies both."
sayIt: "The delete policy drops whole old segments after retention.ms or retention.bytes, so it keeps a time window of history. Compaction keeps the latest event per key, and a tombstone deletes a key, so it keeps current state. delete,compact applies both."
sources:
  - title: "Topic Configs: cleanup.policy (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/configuration/topic-configs/"
    verifiedOn: "2026-10-20"
  - title: "Design: log compaction (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
