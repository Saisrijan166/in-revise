id: auto-commit-vs-manual-commit
tech: kafka
title: Auto Commit vs Manual Commit
compares: [auto-commit, manual-commit]
gist:
  - "The client commits what poll() returned, on a timer"
  - "Your code commits after the work is done"
explain:
  - "Auto commit: with enable.auto.commit=true, the default, the client commits the offsets returned by poll() on a timer, every 5 seconds in Kafka 4.3. Your code does nothing."
  - "Manual commit: with enable.auto.commit=false, your code calls commitSync() or commitAsync() after it has finished the records, so it decides exactly what counts as done."
example: "The Notification service hands each payment to a thread pool and polls again. With auto commit, the timer can commit payments the pool has not sent yet; a crash then loses those messages. With manual commit after the pool finishes, a crash only repeats some messages."
rows:
  - { aspect: "Setting", a: "enable.auto.commit=true (default)", b: "enable.auto.commit=false, then commitSync or commitAsync" }
  - { aspect: "When", a: "Every auto.commit.interval.ms (5 s by default)", b: "When your code says processing is finished" }
  - { aspect: "After a crash", a: "Replays since the last commit; with async hand-off it can lose records", b: "Replays since the last commit" }
  - { aspect: "Fits", a: "Simple handlers that finish before the next poll", b: "Database writes, async work, payments" }
verdict: "Auto commit only for simple synchronous handlers; commit manually after processing when records must not be lost."
sayIt: "Auto commit saves the polled offsets every 5 seconds, which is fine only if each batch is fully processed before the next poll. For anything that matters, I turn it off and commit after processing, so a crash causes repeats, not loss."
sources:
  - title: "KafkaConsumer: automatic and manual offset control (Apache Kafka 4.3 javadoc)"
    url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html"
    verifiedOn: "2026-10-20"
  - title: "Consumer and Share Consumer Configs (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/configuration/consumer-configs/"
    verifiedOn: "2026-10-20"
