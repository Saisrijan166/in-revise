id: consumer-group-vs-share-group
tech: kafka
title: Consumer Group vs Share Group
compares: [consumer-groups, share-groups]
gist:
  - "One owner per partition; order kept per partition"
  - "Members share partitions; each record acked alone"
rows:
  - { aspect: "Readers per partition", a: "Exactly one consumer of the group", b: "Several consumers of the group" }
  - { aspect: "Useful consumers", a: "Up to the partition count", b: "Can exceed the partition count" }
  - { aspect: "Progress", a: "One committed offset per partition", b: "Per-record ack: accept, release, reject" }
  - { aspect: "Ordering", a: "Kept within a partition", b: "Not guaranteed" }
  - { aspect: "Redelivery", a: "Replay from the last commit", b: "On release or lock expiry, up to a delivery limit" }
  - { aspect: "Available", a: "Every Kafka 4.x release", b: "Production-ready since Kafka 4.2" }
verdict: "Consumer group for ordered event streams; share group for independent jobs that must scale past the partition count."
sources:
  - title: "Design: the share consumer (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
  - title: "KafkaShareConsumer (Apache Kafka 4.3 javadoc)"
    url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaShareConsumer.html"
    verifiedOn: "2026-10-20"
  - title: "Upgrading: notable changes in 4.2 (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/getting-started/upgrade/"
    verifiedOn: "2026-10-20"
