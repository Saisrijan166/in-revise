id: consumer-group-vs-share-group
tech: kafka
title: Consumer Group vs Share Group
compares: [consumer-groups, share-groups]
gist:
  - "One owner per partition; order kept per partition"
  - "Members share partitions; each record acked alone"
explain:
  - "Consumer group: the consumers sharing a group.id split the partitions, one owner each. Order is kept inside a partition, and progress is one committed offset per partition."
  - "Share group: many consumers read the same partitions, each record is locked to one of them and acknowledged on its own. It works like a queue and has no ordering."
example: "The Analytics service needs payments in order per order, so it uses a consumer group on the 4 partitions of payments. Email workers that send a receipt per payment need no order and 20 workers, so they use a share group on the same topic."
rows:
  - { aspect: "Readers per partition", a: "Exactly one consumer of the group", b: "Several consumers of the group" }
  - { aspect: "Useful consumers", a: "Up to the partition count", b: "Can exceed the partition count" }
  - { aspect: "Progress", a: "One committed offset per partition", b: "Per-record ack: accept, release, reject" }
  - { aspect: "Ordering", a: "Kept within a partition", b: "Not guaranteed" }
  - { aspect: "Redelivery", a: "Replay from the last commit", b: "On release or lock expiry, up to a delivery limit" }
  - { aspect: "Available", a: "Every Kafka 4.x release", b: "Production-ready since Kafka 4.2" }
verdict: "Consumer group for ordered event streams; share group for independent jobs that must scale past the partition count."
sayIt: "A consumer group gives each partition one owner, so order holds per partition but parallelism stops at the partition count. A share group lets consumers outnumber partitions, with per-record acks and redelivery, but no ordering. Ordered streams: consumer group; independent jobs: share group."
sources:
