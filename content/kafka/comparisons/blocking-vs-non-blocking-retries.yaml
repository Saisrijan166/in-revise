id: blocking-vs-non-blocking-retries
tech: kafka
title: Blocking vs Non-blocking Retries
compares: [blocking-retries, non-blocking-retries]
gist:
  - "Retry in place: the partition waits, order is kept"
  - "Move to a delayed retry topic: no wait, order is lost"
diagrams:
  - |
    flowchart LR
      M[[payments]] --> C[Consumer retries in place]
      C -- "attempts used up" --> D[[payments-dlt]]
  - |
    flowchart LR
      M[[payments]] -- fails --> R1[[payments-retry-1000]]
      R1 -- fails --> R2[[payments-retry-2000]]
      R2 -- fails --> D[[payments-dlt]]
diagramAlt: "Blocking: the consumer of the payments topic retries the failed record itself, and after the last attempt sends it to payments-dlt. Non-blocking: a failed record moves to payments-retry-1000 (1000 ms delay), then to payments-retry-2000 (2000 ms delay), then to payments-dlt, while the main topic keeps flowing."
rows:
  - { aspect: "Later records", a: "Wait behind the failed one", b: "Keep flowing on the main topic" }
  - { aspect: "Per-key order", a: "Kept", b: "Lost: later records can go first" }
  - { aspect: "Long backoff", a: "Stalls the consumer thread; keep each delay under max.poll.interval.ms", b: "Fine: the delay sits in the retry topic" }
  - { aspect: "Extra topics", a: "None, or only the DLT", b: "One or more retry topics plus the DLT" }
  - { aspect: "Spring for Apache Kafka 4.1", a: "DefaultErrorHandler", b: "@RetryableTopic" }
verdict: "Order matters or errors clear in seconds: retry in place. Long outages and order does not matter: retry topics."
sources:
  - title: "Handling Exceptions: DefaultErrorHandler (Spring for Apache Kafka 4.1 reference)"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/annotation-error-handling.html"
    verifiedOn: "2026-10-20"
  - title: "Non-Blocking Retries: How the Pattern Works (Spring for Apache Kafka 4.1 reference)"
    url: "https://docs.spring.io/spring-kafka/reference/retrytopic/how-the-pattern-works.html"
    verifiedOn: "2026-10-20"
  - title: "Non-Blocking Retries: Topic Naming (Spring for Apache Kafka 4.1 reference)"
    url: "https://docs.spring.io/spring-kafka/reference/retrytopic/topic-naming.html"
    verifiedOn: "2026-10-20"
