id: acks-0-vs-1-vs-all
tech: kafka
title: "acks=0 vs acks=1 vs acks=all"
compares: [acks-0, acks-1, acks-all]
gist:
  - "Do not wait: fastest, failures go unseen"
  - "Leader wrote it: lost if it dies before copying"
  - "Every in-sync replica has it: safest, the default"
rows:
  - { aspect: "Producer waits for", a: "Nothing", b: "The leader's local write", c: "The leader and every in-sync replica" }
  - { aspect: "Error feedback", a: "None; retries do not apply", b: "Yes", c: "Yes" }
  - { aspect: "Leader dies just after", a: "Record may be lost", b: "Lost if followers had not copied it", c: "Kept while one in-sync replica lives" }
  - { aspect: "Latency", a: "Lowest", b: "Low", c: "Highest of the three" }
  - { aspect: "Idempotent producer", a: "Turned off", b: "Turned off", c: "Required" }
  - { aspect: "Default (Kafka 4.3)", a: "No", b: "No (the default before 3.0)", c: "Yes, since Kafka 3.0" }
verdict: "Keep acks=all for business events such as payments; use 0 or 1 only where losing a few records is acceptable."
sources:
  - title: "Producer Configs: acks and enable.idempotence (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/configuration/producer-configs/"
    verifiedOn: "2026-10-20"
  - title: "Upgrading: notable changes in 3.0.0 (Apache Kafka 3.9 docs)"
    url: "https://kafka.apache.org/39/getting-started/upgrade/"
    verifiedOn: "2026-10-20"
