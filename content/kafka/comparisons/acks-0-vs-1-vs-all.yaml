id: acks-0-vs-1-vs-all
tech: kafka
title: "acks=0 vs acks=1 vs acks=all"
compares: [acks-0, acks-1, acks-all]
gist:
  - "Do not wait: fastest, failures go unseen"
  - "Leader wrote it: lost if it dies before copying"
  - "Every in-sync replica has it: safest, the default"
explain:
  - "acks=0: the producer sends the record and treats it as done without waiting for any reply. It is the fastest, but the producer never learns about a failure, so it cannot retry."
  - "acks=1: the partition's leader broker replies once it has written the record to its own log. Followers copy it later, so the record is lost if the leader dies before they do."
  - "acks=all (or -1): the leader replies only after every in-sync replica has the record. It is the safest choice and the default since Kafka 3.0, at the cost of a little more latency."
example: "The leader of payments-2 crashes right after replying. With acks=1, the ₹500 payment the producer was told is stored may be gone. With acks=all, an in-sync follower already had it and, as the new leader, still serves it. With acks=0, the producer cannot even tell whether it was written."
rows:
  - { aspect: "Producer waits for", a: "Nothing", b: "The leader's local write", c: "The leader and every in-sync replica" }
  - { aspect: "Error feedback", a: "None; retries do not apply", b: "Yes", c: "Yes" }
  - { aspect: "If the leader dies right after", a: "The record may be lost, and nobody knows", b: "Lost if followers had not copied it", c: "Kept while one in-sync replica lives" }
  - { aspect: "Latency", a: "Lowest", b: "Low", c: "Highest of the three" }
  - { aspect: "Idempotent producer", a: "Turned off", b: "Turned off", c: "Works (it requires acks=all)" }
  - { aspect: "Default (Kafka 4.3)", a: "No", b: "No (the default before 3.0)", c: "Yes, since Kafka 3.0" }
verdict: "Keep acks=all for business events such as payments; use 0 or 1 only where losing a few records is acceptable."
sayIt: "acks says when the producer hears back: 0 never, 1 after the leader writes, all after every in-sync replica has the record. I keep the default acks=all for business events like payments, with min.insync.replicas=2, and use 0 or 1 only where small loss is fine."
sources:
  - title: "Producer Configs: acks and enable.idempotence (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/configuration/producer-configs/"
    verifiedOn: "2026-10-20"
  - title: "Upgrading: notable changes in 3.0.0 (Apache Kafka 3.9 docs)"
    url: "https://kafka.apache.org/39/getting-started/upgrade/"
    verifiedOn: "2026-10-20"
