id: zookeeper-vs-kraft
tech: kafka
title: "ZooKeeper mode vs KRaft"
compares: [zookeeper-mode, kraft]
gist:
  - "Metadata in a separate ZooKeeper ensemble"
  - "Metadata in Kafka's own log, run by controllers"
explain:
  - "In ZooKeeper mode, Kafka kept its metadata in a separate ZooKeeper cluster, and one broker at a time was elected as the controller through it."
  - "In KRaft mode, dedicated controllers keep the metadata in Kafka's own __cluster_metadata log and agree on it with the Raft majority vote."
example: "A team on Kafka 3.6 with ZooKeeper wants Kafka 4.3. They first move to the 3.9 bridge release and migrate the metadata to KRaft; only then can they upgrade, because a 4.x broker cannot start in ZooKeeper mode."
rows:
  - { aspect: "Metadata lives in", a: "ZooKeeper, outside Kafka", b: "The __cluster_metadata log inside Kafka" }
  - { aspect: "Systems to run", a: "Two: Kafka and ZooKeeper", b: "One: Kafka" }
  - { aspect: "Controller", a: "One broker, elected through ZooKeeper", b: "A Raft quorum of controllers: one active, the rest hot standbys" }
  - { aspect: "Controller failover", a: "The new controller reloads state from ZooKeeper", b: "Fast: standbys already hold the metadata log" }
  - { aspect: "Versions", a: "Up to Kafka 3.9; deprecated in 3.5", b: "Production-ready in 3.3; the only mode since 4.0" }
verdict: "Use KRaft: it is the only mode in Kafka 4.x. A ZooKeeper cluster migrates on a bridge release (last: 3.9) first, then upgrades."
sayIt: "ZooKeeper mode needed a second system and a slow controller failover. KRaft keeps metadata in an internal log run by a quorum of controllers, so failover is fast. KRaft was production-ready in 3.3 and is the only mode since Kafka 4.0."
