id: zookeeper-vs-kraft
tech: kafka
title: "ZooKeeper mode vs KRaft"
compares: [zookeeper-mode, kraft]
gist:
  - "Metadata in a separate ZooKeeper ensemble"
  - "Metadata in Kafka's own log, run by controllers"
rows:
  - { aspect: "Metadata lives in", a: "ZooKeeper, outside Kafka", b: "The __cluster_metadata log inside Kafka" }
  - { aspect: "Systems to run", a: "Two: Kafka and ZooKeeper", b: "One: Kafka" }
  - { aspect: "Controller", a: "One broker, elected through ZooKeeper", b: "A Raft quorum of controllers: one active, the rest hot standbys" }
  - { aspect: "Controller failover", a: "The new controller reloads state from ZooKeeper", b: "Fast: standbys already hold the metadata log" }
  - { aspect: "Versions", a: "Up to Kafka 3.9; deprecated in 3.5", b: "Production-ready in 3.3; the only mode since 4.0" }
verdict: "Use KRaft: it is the only mode in Kafka 4.x. A ZooKeeper cluster migrates on Kafka 3.9 first, then upgrades."
sources:
  - title: "KRaft vs ZooKeeper (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/getting-started/zk2kraft/"
    verifiedOn: "2026-10-20"
