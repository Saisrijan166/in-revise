id: kafka-vs-database
tech: kafka
title: "Kafka vs a Database"
compares: [kafka-option, database-option]
gist:
  - "Keeps the history of changes, in order"
  - "Keeps the current state, ready to query"
explain:
  - "Kafka is an append-only log of events, kept in order per partition. It moves facts such as PaymentCompleted between services and keeps them so readers can replay them."
  - "A database holds the current value of each row, such as payment 42 with status COMPLETED. It answers queries on any column and updates rows inside transactions."
example: "The payment status page asks: what is the status of payment 42? The database answers with one indexed lookup. The Analytics service asks: what happened to payments today, in order? It reads the payments topic from this morning's offset."
rows:
  - { aspect: "Holds", a: "Every event, appended in order per partition", b: "The current value of each row" }
  - { aspect: "Read by", a: "Partition and offset, or seek to a timestamp", b: "A query on any column, sped up by indexes" }
  - { aspect: "Change data", a: "Append only; old events leave by retention or compaction", b: "Update and delete rows in place" }
  - { aspect: "Main job", a: "Move events between services and keep them for replay", b: "Hold the business state with transactions" }
verdict: "Keep state in the database and publish its changes to Kafka so other services can react."
sayIt: "A database keeps the current state and answers queries; Kafka keeps the ordered history of changes and moves it to other services. I keep state in the database and publish its changes to Kafka, for example with an outbox."
