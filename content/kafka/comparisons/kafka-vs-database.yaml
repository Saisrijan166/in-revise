id: kafka-vs-database
tech: kafka
title: "Kafka vs a Database"
compares: [kafka-option, database-option]
gist:
  - "Keeps the history of changes, in order"
  - "Keeps the current state, ready to query"
rows:
  - { aspect: "Holds", a: "Every event, appended in order per partition", b: "The current value of each row" }
  - { aspect: "Read by", a: "Partition and offset, or seek to a timestamp", b: "A query on any column, sped up by indexes" }
  - { aspect: "Change data", a: "Append only; old events leave by retention", b: "Update and delete rows in place" }
  - { aspect: "Main job", a: "Move events between services and keep them for replay", b: "Hold the business state with transactions" }
verdict: "Keep state in the database and publish its changes to Kafka so other services can react."
sources:
  - title: "Introduction: durable storage and retention (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/getting-started/introduction/"
    verifiedOn: "2026-10-20"
  - title: "KafkaConsumer: seek, offsetsForTimes (Apache Kafka 4.3 javadoc)"
    url: "https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html"
    verifiedOn: "2026-10-20"
  - title: "Indexes: introduction (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/indexes-intro.html"
    verifiedOn: "2026-10-20"
  - title: "Transactions (PostgreSQL 18 docs)"
    url: "https://www.postgresql.org/docs/18/tutorial-transactions.html"
    verifiedOn: "2026-10-20"
