id: topic-vs-partition-vs-broker
tech: kafka
title: Topic vs Partition vs Broker
compares: [topics, partitions, partition-broker-host]
gist:
  - "A name for a stream: what the events are about"
  - "An ordered log on disk: one slice of a topic"
  - "A server: stores replicas of many partitions"
explain:
  - "A topic is a name for one kind of event stream, such as payments. Producers write to the name and consumers read from it."
  - "A partition is one ordered, append-only log of a topic. A topic with 3 partitions is 3 separate logs."
  - "A broker is a Kafka server. It stores partitions of many topics on its disk and serves clients."
example: "The payments topic has 3 partitions, payments-0 to payments-2. Each partition has copies on 3 brokers, and each broker leads one of the partitions. Adding a fourth broker gives more machines, but the topic still has 3 partitions until you add more."
rows:
  - { aspect: "Is", a: "A logical name, like payments", b: "A physical, append-only log", c: "A Kafka server process" }
  - { aspect: "Order", a: "None across the whole topic", b: "Strict, inside the partition", c: "Not an ordering unit" }
  - { aspect: "Scales by", a: "Having more partitions", b: "Being spread over brokers", c: "Adding brokers to the cluster" }
  - { aspect: "Copies", a: "Replication factor is set per topic", b: "The unit that is copied", c: "Holds leader or follower copies" }
  - { aspect: "Payment example", a: "1 topic: payments", b: "3 partitions: payments-0 to payments-2", c: "3 brokers hold 9 replicas (3 partitions x factor 3)" }
verdict: "Name the stream with a topic, get order and parallelism from partitions, and add brokers when partitions need more machines."
sayIt: "A topic is the logical name of a stream. It is split into partitions, which are the ordered logs that give parallelism. Brokers are the servers that store those partitions; one broker holds many partitions from many topics."
sources:
  - title: "Introduction: topics are partitioned over brokers (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/getting-started/introduction/"
    verifiedOn: "2026-10-20"
  - title: "Design: replication, the topic partition is the unit (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
