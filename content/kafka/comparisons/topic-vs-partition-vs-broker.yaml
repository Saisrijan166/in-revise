id: topic-vs-partition-vs-broker
tech: kafka
title: Topic vs Partition vs Broker
compares: [topics, partitions, partition-broker-host]
gist:
  - "A name for a stream: what the events are about"
  - "An ordered log on disk: one slice of a topic"
  - "A server: stores replicas of many partitions"
rows:
  - { aspect: "Is", a: "A logical name, like orders", b: "A physical, append-only log", c: "A Kafka server process" }
  - { aspect: "Order", a: "None across the whole topic", b: "Strict, inside the partition", c: "Not an ordering unit" }
  - { aspect: "Scales by", a: "Having more partitions", b: "Being spread over brokers", c: "Adding brokers to the cluster" }
  - { aspect: "Copies", a: "Replication factor is set per topic", b: "The unit that is copied", c: "Holds leader or follower copies" }
  - { aspect: "Shop example", a: "1 topic: orders", b: "6 partitions: orders-0 to orders-5", c: "3 brokers hold 18 replicas (6 x factor 3)" }
verdict: "Name the stream with a topic, get order and parallelism from partitions, and add brokers when partitions need more machines."
sources:
  - title: "Introduction: topics are partitioned over brokers (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/getting-started/introduction/"
    verifiedOn: "2026-10-20"
  - title: "Design: replication, the topic partition is the unit (Apache Kafka 4.3)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
