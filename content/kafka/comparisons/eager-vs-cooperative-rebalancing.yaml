id: eager-vs-cooperative-rebalancing
tech: kafka
title: Eager vs Cooperative Rebalancing
compares: [eager-rebalancing, cooperative-rebalancing]
gist:
  - "Every member gives up all partitions, then rejoins"
  - "Only the partitions that change owner are revoked"
explain:
  - "Eager rebalancing: every member gives up all its partitions, then the whole set is handed out again. Simple, but the entire group stops processing during the rebalance."
  - "Cooperative rebalancing: only the partitions that change owner are taken away, in a second round. Members keep working on the partitions they keep."
example: "Notification instances N1 and N2 own 2 partitions each, and N3 joins. Eager: all 4 partitions stop until the new split is ready. Cooperative: only the one partition that moves to N3 pauses, and the other 3 keep being read."
rows:
  - { aspect: "Revoked", a: "All partitions of every member", b: "Only partitions that move" }
  - { aspect: "During it", a: "The whole group stops processing", b: "Unmoved partitions keep working" }
  - { aspect: "Rounds", a: "One", b: "Two: revoke the moving ones, then assign them" }
  - { aspect: "Assignors", a: "RangeAssignor, RoundRobinAssignor, StickyAssignor", b: "CooperativeStickyAssignor" }
  - { aspect: "Since", a: "The original classic protocol", b: "Kafka 2.4 (KIP-429)" }
verdict: "Prefer cooperative, or group.protocol=consumer on Kafka 4.x; keep eager only for old clients."
sayIt: "Eager rebalancing revokes every partition from every member, so the whole group pauses. Cooperative rebalancing revokes only the partitions that move, so the rest keep working. On Kafka 4.x I use CooperativeStickyAssignor, or the consumer protocol, which is incremental too."
sources:
