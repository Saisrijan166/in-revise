id: idempotent-producer-vs-idempotent-consumer
tech: kafka
title: Idempotent Producer vs Idempotent Consumer
compares: [idempotent-producer, idempotent-consumers]
gist:
  - "The broker drops a retry's duplicate from the log"
  - "Your code skips a record it has already handled"
explain:
  - "The idempotent producer is a Kafka feature. The broker uses the producer's id and per-partition sequence numbers to drop a batch the producer retried after a lost reply, so the log does not get a second copy."
  - "An idempotent consumer is code you write. It records which events it has already handled, for example by event id in its database, and skips a repeat, so a redelivered event does not cause a second effect."
example: "The Payment service's retry after a lost reply is dropped by the broker (idempotent producer). Later the Notification service crashes after sending the receipt SMS but before committing its offset, so it reads the same event again; only its own check on the event id stops a second SMS (idempotent consumer)."
rows:
  - { aspect: "Stops", a: "Copies caused by producer retries", b: "Repeats from redelivery, rebalances, re-sends and replay" }
  - { aspect: "Where", a: "Kafka broker, using producer id and sequence numbers", b: "Your consumer and its database" }
  - { aspect: "How to get it", a: "enable.idempotence: on by default since Kafka 3.0, unless configs conflict", b: "You build it: dedupe table, upsert or version check" }
  - { aspect: "Blind spot", a: "The app sending the same event twice", b: "It cannot stop copies reaching the log; it only makes them harmless" }
verdict: "Use both: the producer keeps the log free of retry copies, the consumer makes each effect happen once."
sayIt: "The idempotent producer keeps producer retries from writing duplicates into the log; Kafka does it for me. An idempotent consumer makes repeated deliveries harmless; I build it with a processed-event id in the same database transaction. A reliable pipeline needs both."
sources:
