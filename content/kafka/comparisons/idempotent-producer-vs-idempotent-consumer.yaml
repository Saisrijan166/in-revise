id: idempotent-producer-vs-idempotent-consumer
tech: kafka
title: Idempotent Producer vs Idempotent Consumer
compares: [idempotent-producer, idempotent-consumers]
gist:
  - "The broker drops a retry's duplicate from the log"
  - "Your code skips a record it has already handled"
rows:
  - { aspect: "Stops", a: "Copies caused by producer retries", b: "Repeats from redelivery, rebalances, re-sends and replay" }
  - { aspect: "Where", a: "Kafka broker, using producer id and sequence numbers", b: "Your consumer and its database" }
  - { aspect: "How to get it", a: "enable.idempotence: on by default since Kafka 3.0, unless configs conflict", b: "You build it: dedupe table, upsert or version check" }
  - { aspect: "Blind spot", a: "The app sending the same event twice", b: "Nothing upstream: copies still reach the log" }
verdict: "Use both: the producer keeps the log free of retry copies, the consumer makes each effect happen once."
sources:
  - title: "Producer Configs: enable.idempotence (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/configuration/producer-configs/"
    verifiedOn: "2026-10-20"
  - title: "Design: message delivery semantics (Apache Kafka 4.3 docs)"
    url: "https://kafka.apache.org/43/design/design/"
    verifiedOn: "2026-10-20"
  - title: "Pattern: Idempotent Consumer (microservices.io, Chris Richardson)"
    url: "https://microservices.io/patterns/communication-style/idempotent-consumer.html"
    verifiedOn: "2026-10-20"
  - title: "KIP-679: Producer will enable the strongest delivery guarantee by default (Apache Kafka wiki)"
    url: "https://cwiki.apache.org/confluence/display/KAFKA/KIP-679%3A+Producer+will+enable+the+strongest+delivery+guarantee+by+default"
    verifiedOn: "2026-10-20"
